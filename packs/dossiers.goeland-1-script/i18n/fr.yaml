c1.briefing: "Mardi 5 septembre, 20 h 30. Une banque vient d'écrire à Air Alizé : 212 cartes fraudées, et toutes ont payé un billet sur le site depuis le 21 août. Les fraudeurs ont même le code de sécurité, que la base de données d'Air Alizé ne garde pas. Le message de la banque est dans ton dossier, les fichiers du site dans `site/`."
c1.obj.copy: "Trouver où part la copie des cartes"
c1.obj.typed: "Dire pourquoi la base de données ne montre rien"
c1.obj.stop: "Remettre le bon script et bloquer le domaine"
c1.obj.page: "Dire à la page de paiement à qui elle a le droit de parler"
c1.q.copy: "Vers quel domaine le script en production envoie-t-il une copie du formulaire ?"
c1.q.typed: "La base de données est intacte et ne garde aucun code de sécurité. Où les cartes ont-elles été prises ?"
c1.q.typed.browser: "Dans le navigateur du client, au moment où il tape"
c1.q.typed.database: "Dans une sauvegarde de la base de données"
c1.q.typed.database.why: "Aucune copie de la base ne contient le code de sécurité : il n'est jamais enregistré. Les fraudeurs l'ont, donc ils l'ont pris avant qu'il n'arrive au serveur."
c1.q.typed.bank: "Chez la banque, pendant le paiement"
c1.q.typed.bank.why: "Le seul point commun des 212 cartes est le site d'Air Alizé, et son script envoie le formulaire à deux endroits au lieu d'un."
c1.contain.restore: "Remettre en production le fichier paiement.js relu (version 4.12)"
c1.contain.block: "Bloquer en sortie le domaine qui reçoit la copie et le signaler à son hébergeur"
c1.check.scripts: "La page ne charge que les scripts du site"
c1.check.data: "Le formulaire ne peut partir que vers le service de paiement"
c1.check.watch: "Un script modifié hors déploiement déclenche une alerte"
c1.check.third: "Aucun script tiers sur la page de paiement"
c1.check.works: "La page de paiement fonctionne toujours"
c1.ada.brief: "Lis le message de la banque : `cat alerte-banque.txt`. Puis compare ce qui a été relu à ce qui est servi : `diff site/depot/paiement.js site/production/paiement.js`."
c1.ada.g.copy: "`diff site/depot/paiement.js site/production/paiement.js` montre la ligne en trop. `answer copy <domaine>`."
c1.ada.g.copy.standard: "Compare le script relu au script servi aux clients, et trouve où part la copie."
c1.ada.copy: "Une ligne. Un domaine qui ressemble à celui d'Air Alizé, pour qu'un œil pressé ne voie rien. Regarde `site/production/dates.txt` : le fichier a changé le 21 août à 22 h 58, hors de tout déploiement, par un compte d'administration. On y reviendra. Une question."
c1.ada.g.typed: "Réponds à ma question. La note d'Air Alizé au bas du message de la banque t'aide."
c1.ada.typed: "Oui. Le script tourne chez le client : il voit tout ce qui est tapé, avant le serveur, avant le chiffrement de la base. Le serveur n'a rien vu partir, puisque rien n'est parti de chez lui."
c1.ada.typed.close: "On ferme : `contain`."
c1.ada.g.stop: "Deux mesures : `contain restore paiement.js`, puis `contain block destination`."
c1.ada.g.stop.standard: "Remets le script relu et coupe la route vers le domaine. `contain` liste les mesures."
c1.ada.stop: "Le bon fichier est revenu, et le domaine ne reçoit plus rien. Quinze jours de cartes, quand même. Ce qui aurait arrêté cette ligne dès la première seconde tient dans `site/en-tetes.yml`."
c1.ada.g.page: "`cat site/en-tetes.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut quatre : `own-site-only`, `own-payment-service-only`, `alert-on-change-outside-deployment`, `0`. Change-les avec `edit site/en-tetes.yml` ou `sed -i`, puis `verify`."
c1.ada.g.page.standard: "Corrige `site/en-tetes.yml`, puis lance `verify`. Pour ouvrir le fichier : `edit site/en-tetes.yml`."
c1.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c1.ada.done: "Avec ces réglages, le navigateur lui-même aurait refusé d'envoyer le formulaire ailleurs, et le fichier modifié à 22 h 58 aurait sonné. Reste la vraie question : qui a pu écrire sur ce serveur avec un compte d'administration ? Demain, on remonte la piste."
c1.hint.copy.1: "La ligne `step 2b` n'existe que dans le fichier en production."
c1.hint.copy.2: "`answer copy alize-paiements.example`"
c1.hint.typed.1: "Le code de sécurité n'est jamais enregistré : il n'existe que pendant que le client le tape. `answer browser`"
c1.hint.stop.1: "`contain restore paiement.js` puis `contain block destination`"
c1.hint.page.1: "Les valeurs attendues : `own-site-only`, `own-payment-service-only`, `alert-on-change-outside-deployment`, `0`."
c1.hint.page.2: "Avec l'éditeur : `edit site/en-tetes.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/script_file_watch: off/script_file_watch: alert-on-change-outside-deployment/\" site/en-tetes.yml`."
c1.debrief.title: "Le passager clandestin"
c1.debrief.lesson: "Personne n'a touché à la base de données. Une ligne ajoutée au script de la page de paiement envoyait une copie de ce que chaque client tapait vers un domaine qui ressemblait au vrai. Le serveur ne pouvait rien voir : tout se passait dans le navigateur du client."
c1.debrief.p1: "Une politique de sécurité du contenu dit au navigateur d'où charger les scripts et où les données peuvent partir. Tout le reste est refusé."
c1.debrief.p2: "Surveiller les fichiers servis : un script qui change hors d'un déploiement est une alerte."
c1.debrief.p3: "Sur une page de paiement, chaque script en plus est une personne en plus dans la pièce : en garder le moins possible."
