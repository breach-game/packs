c1.briefing: "Tuesday 5 September, 8.30 pm. A bank has just written to Air Alizé: 212 cards defrauded, and every one paid for a ticket on the website since 21 August. The fraudsters even have the security code, which Air Alizé's database does not keep. The bank's message is in your folder, the site's files in `site/`."
c1.obj.copy: "Find where the copy of the cards goes"
c1.obj.typed: "Say why the database shows nothing"
c1.obj.stop: "Put the right script back and block the domain"
c1.obj.page: "Tell the payment page who it is allowed to talk to"
c1.q.copy: "To which domain does the script in production send a copy of the form?"
c1.q.typed: "The database is untouched and keeps no security code. Where were the cards taken?"
c1.q.typed.browser: "In the customer's browser, as they type"
c1.q.typed.database: "In an old backup of the database, copied by the intruder"
c1.q.typed.database.why: "No copy of the database holds the security code: it is never stored. The fraudsters have it, so they took it before it reached the server."
c1.q.typed.bank: "At the bank, during the payment"
c1.q.typed.bank.why: "The only thing the 212 cards have in common is Air Alizé's website, and its script sends the form to two places instead of one."
c1.contain.restore: "Put the reviewed paiement.js (version 4.12) back in production"
c1.contain.block: "Block outbound the domain that receives the copy and report it to its host"
c1.check.scripts: "The page only loads the site's own scripts"
c1.check.data: "The form can only go to the payment service"
c1.check.watch: "A script changed outside a deployment raises an alert"
c1.check.third: "No third-party script on the payment page"
c1.check.works: "The payment page still works"
c1.ada.brief: "Read the bank's message: `cat alerte-banque.txt`. Then compare what was reviewed with what is served: `diff site/depot/paiement.js site/production/paiement.js`."
c1.ada.g.copy: "`diff site/depot/paiement.js site/production/paiement.js` shows the extra line. `answer copy <domain>`."
c1.ada.g.copy.standard: "Compare the reviewed script with the one served to customers, and find where the copy goes."
c1.ada.copy: "One line. A domain that looks like Air Alizé's, so that a hurried eye sees nothing. Look at `site/production/dates.txt`: the file changed on 21 August at 10.58 pm, outside any deployment, by an admin account. We will come back to that. One question."
c1.ada.g.typed: "Answer my question. Air Alizé's note at the bottom of the bank's message helps."
c1.ada.typed: "Yes. The script runs at the customer's end: it sees everything typed, before the server, before the database's encryption. The server saw nothing leave, because nothing left from it."
c1.ada.typed.close: "We close it: `contain`."
c1.ada.g.stop: "Two measures: `contain restore paiement.js`, then `contain block destination`."
c1.ada.g.stop.standard: "Put the reviewed script back and cut the road to the domain. `contain` lists the measures."
c1.ada.stop: "The right file is back, and the domain receives nothing more. Fifteen days of cards, all the same. What would have stopped that line from the first second fits in `site/en-tetes.yml`."
c1.ada.g.page: "`cat site/en-tetes.yml`: each line gives its possible values after the `#`. Four must change: `own-site-only`, `own-payment-service-only`, `alert-on-change-outside-deployment`, `0`. Change them with `edit site/en-tetes.yml` or `sed -i`, then `verify`."
c1.ada.g.page.standard: "Fix `site/en-tetes.yml`, then run `verify`. To open the file: `edit site/en-tetes.yml`."
c1.ada.almost: "Not yet. `verify` tells you which lines are not right."
c1.ada.done: "With these settings, the browser itself would have refused to send the form elsewhere, and the file changed at 10.58 pm would have rung. The real question remains: who could write to that server with an admin account? Tomorrow we follow the trail back."
c1.hint.copy.1: "The `step 2b` line only exists in the production file."
c1.hint.copy.2: "`answer copy alize-paiements.example`"
c1.hint.typed.1: "The security code is never stored: it only exists while the customer types it. `answer browser`"
c1.hint.stop.1: "`contain restore paiement.js` then `contain block destination`"
c1.hint.page.1: "The expected values: `own-site-only`, `own-payment-service-only`, `alert-on-change-outside-deployment`, `0`."
c1.hint.page.2: "With the editor: `edit site/en-tetes.yml`, then Ctrl+S. With a command: for example `sed -i \"s/script_file_watch: off/script_file_watch: alert-on-change-outside-deployment/\" site/en-tetes.yml`."
c1.debrief.title: "The stowaway"
c1.debrief.lesson: "Nobody touched the database. One line added to the payment page's script sent a copy of what each customer typed to a domain that looked like the real one. The server could see nothing: it all happened in the customer's browser."
c1.debrief.p1: "A content security policy tells the browser where scripts may load from and where data may go. Everything else is refused."
c1.debrief.p2: "Watch the files you serve: a script that changes outside a deployment is an alert."
c1.debrief.p3: "On a payment page, every extra script is one more person in the room: keep as few as possible."
