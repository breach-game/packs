d7.briefing: "Ton compte client de test ouvre la session `pg-client-2031` sur `boutique.polygone.test`, et son profil est servi par `/api/profil`. Le mandat fournit une origine témoin, `https://audit-lignerouge.example`, qui n'a rien à voir avec la boutique. Montre ce que l'API répond à une page venue de cette origine, et rapporte le marqueur."
d7.obj.marker: "Rapporter le marqueur servi à l'origine témoin"
d7.obj.fix: "Dire comment l'empêcher"
d7.q.fix: "Que doit changer la boutique ?"
d7.q.fix.list: "Une liste fixe d'origines autorisées, comparées exactement"
d7.q.fix.star: "Répondre `*` à toutes les origines, sans distinction"
d7.q.fix.star.why: "Avec les cookies, un navigateur refuse `*`. C'est justement pour contourner ce refus que le serveur s'est mis à recopier l'origine reçue."
d7.q.fix.contains: "Accepter toute origine qui contient le mot polygone"
d7.q.fix.contains.why: "`polygone.test.site-inconnu.example` contient aussi ce mot. Une origine se compare en entier, pas par morceau."
d7.ada.brief: "Défi. Pas de consigne de ma part : le briefing, les objectifs, et toi."
d7.ada.done: "Le serveur recopiait l'origine qu'on lui présentait, et ajoutait « avec les cookies ». N'importe quelle page ouverte par un client connecté pouvait donc lire son profil à sa place."
d7.debrief.title: "L'origine en miroir"
d7.debrief.lesson: "Les en-têtes entre origines disent au navigateur quels sites ont le droit de lire une réponse. Un serveur qui recopie l'origine reçue et autorise les cookies donne ce droit à tout le monde : la page d'un inconnu lit les données du client connecté."
d7.debrief.p1: "Autoriser une liste fixe d'origines, comparées en entier, jamais recopiées depuis la requête."
d7.debrief.p2: "N'autoriser les cookies entre origines que pour les sites qui en ont vraiment besoin."
d7.debrief.p3: "Tester avec une origine inconnue : la réponse ne doit pas la nommer."
