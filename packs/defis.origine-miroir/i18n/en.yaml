d7.briefing: "Your test customer account opens session `pg-client-2031` on `boutique.polygone.test`, and its profile is served by `/api/profil`. The mandate provides a witness origin, `https://audit-lignerouge.example`, which has nothing to do with the shop. Show what the API answers to a page coming from that origin, and report the marker."
d7.obj.marker: "Report the marker served to the witness origin"
d7.obj.fix: "Say how to prevent it"
d7.q.fix: "What must the shop change?"
d7.q.fix.list: "A fixed list of allowed origins, compared exactly"
d7.q.fix.star: "Answer `*` to every origin, whoever is asking"
d7.q.fix.star.why: "With cookies, a browser refuses `*`. That refusal is exactly why the server started copying back the origin it received."
d7.q.fix.contains: "Accept any origin that contains the word polygone"
d7.q.fix.contains.why: "`polygone.test.unknown-site.example` contains that word too. An origin is compared whole, not in pieces."
d7.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d7.ada.done: "The server copied back whatever origin it was shown, and added \"with cookies\". So any page opened by a signed-in customer could read their profile in their place."
d7.debrief.title: "The mirrored origin"
d7.debrief.lesson: "Cross-origin headers tell the browser which sites may read a response. A server that copies back the origin it receives and allows cookies gives that right to everyone: a stranger's page reads the signed-in customer's data."
d7.debrief.p1: "Allow a fixed list of origins, compared whole, never copied from the request."
d7.debrief.p2: "Allow cookies across origins only for the sites that really need them."
d7.debrief.p3: "Test with an unknown origin: the answer must not name it."
