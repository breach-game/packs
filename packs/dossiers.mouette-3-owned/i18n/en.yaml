o3.briefing: "Last morning at Mouette. We know how the intruder got in and why nobody saw them. What is left is to make sure it cannot happen this way again, and to decide how to tell the people whose files were copied. The policy is in `dossier/politique.yml`."
o3.obj.know: "Know what you own, and patch in time"
o3.obj.watch: "Make failing controls shout"
o3.obj.secrets: "Take passwords out of files"
o3.obj.tell: "Decide how to tell the people concerned"
o3.check.know: "Inventory drawn from bills of materials, alerts to owners, 72 hours for a critical patch"
o3.check.watch: "Alert before a certificate expires, alert on bypass"
o3.check.secrets: "Database passwords are in a vault, not in files"
o3.check.works: "The nightly backup keeps running"
o3.q.tell: "Millions of files were copied. How does Mouette tell the people?"
o3.q.tell.onsite: "A dedicated site, and a free freeze of credit files"
o3.q.tell.later: "Wait for the end of the investigation, to announce everything at once"
o3.q.tell.minimum: "The strict legal minimum, nothing more"
o3.ada.brief: "Read the policy: `cat dossier/politique.yml`. Three layers, then a decision."
o3.ada.g.know: "First, know and act in time: `source: from-sbom`, `bulletins_to: owners`, `critical_deadline: 72h`. Open `edit dossier/politique.yml`, then `verify`."
o3.ada.g.know.standard: "First, make every alert reach the right team and be met within a deadline. Then `verify`. To open the file: `edit dossier/politique.yml`."
o3.ada.know: "The layer that would have changed everything: the flaw would have found the portal the same day, and its team would have had three days."
o3.ada.g.watch: "Next, the controls that stay quiet: `cert_expiry_alert: 30d` and `bypass_mode: alert`, then `verify`."
o3.ada.g.watch.standard: "Next, make sure no control can fail silently. Then `verify`."
o3.ada.g.secrets: "Finally, the intruder found passwords in clear in the portal's files: `db_credentials: vault`, then `verify`."
o3.ada.g.secrets.standard: "Finally, what let the intruder move from the portal to the databases. Then `verify`."
o3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
o3.ada.ready: "The layers hold. The people whose files are out remain. I leave the decision to you."
o3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
o3.ada.answer.standard: "My question is waiting in the messenger."
o3.ada.onsite: "The cheapest choice: everyone can check whether they are concerned and block credit being opened in their name, before a fraudster uses it."
o3.ada.later: "While Mouette waits, the copied files are already being used. Every week of silence is a week's head start for fraudsters."
o3.ada.minimum: "Legal, but people learn neither what to do nor how to protect themselves. Trust leaves faster than data."
o3.ada.done: "Knowing what you own, patching within a deadline that is met, controls that shout, secrets in a vault. Open the debrief: the real case is at the end."
o3.hint.know.1: "Three lines: `source`, `bulletins_to`, `critical_deadline`."
o3.hint.know.2: "With the editor: `edit dossier/politique.yml`, then Ctrl+S. With a command: `sed -i \"s/source: manual/source: from-sbom/\" dossier/politique.yml`, then the same for `bulletins_to: owners` and `critical_deadline: 72h`, then `verify`."
o3.hint.watch.1: "Two lines under `monitoring`."
o3.hint.watch.2: "With the editor: `edit dossier/politique.yml`, then Ctrl+S. With a command: `sed -i \"s/cert_expiry_alert: off/cert_expiry_alert: 30d/\" dossier/politique.yml` and `sed -i \"s/bypass_mode: silent/bypass_mode: alert/\" dossier/politique.yml`, then `verify`."
o3.hint.secrets.1: "With the editor: `edit dossier/politique.yml`, then Ctrl+S. With a command: `sed -i \"s/db_credentials: files/db_credentials: vault/\" dossier/politique.yml`, then `verify`."
o3.hint.tell.1: "No answer is wrong. Which one gives fraudsters the smallest head start?"
o3.debrief.title: "Knowing what you own"
o3.debrief.lesson: "Nothing that was missing was hard: an inventory, an alert to the right person, a deadline met, a watched certificate, passwords in a vault. Any one of these would have stopped the intruder, or shown them weeks earlier."
o3.debrief.p1: "Produce a software bill of materials at each release, and draw the inventory from it."
o3.debrief.p2: "Address alerts to application owners, with a deadline that is checked."
o3.debrief.p3: "Make a control alert when it expires or bypasses itself."
o3.debrief.p4: "Keep application passwords in a vault, never in files."
o3.facts.title: "What really happened: Equifax, 2017"
o3.facts.p1: "In March 2017, a critical flaw in Apache Struts (CVE-2017-5638) was published with its patch. Equifax's security team sent an alert asking for it to be patched within 48 hours."
o3.facts.p2: "Equifax's online dispute portal used Struts, but it was not patched, and an automated search did not spot it."
o3.facts.p3: "From 13 May 2017, intruders came in through that portal, found credentials stored in clear, and queried databases for 76 days."
o3.facts.p4: "The uploads went unnoticed: the certificate of the device that inspected encrypted traffic had expired 19 months earlier. Renewed on 29 July, it showed the suspicious traffic at once."
o3.facts.p5: "The data of about 148 million people was exposed. The US House of Representatives report (2018) called the breach \"entirely preventable\"."
