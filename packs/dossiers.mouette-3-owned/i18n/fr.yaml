o3.briefing: "Dernière matinée chez Mouette. On sait par où l'intrus est entré et pourquoi personne ne l'a vu. Reste à faire en sorte que ça ne puisse plus se passer ainsi, et à décider comment prévenir les gens dont le dossier a été copié. La politique est dans `dossier/politique.yml`."
o3.obj.know: "Savoir ce qu'on possède, et corriger à temps"
o3.obj.watch: "Faire crier les contrôles qui tombent en panne"
o3.obj.secrets: "Sortir les mots de passe des fichiers"
o3.obj.tell: "Décider comment prévenir les personnes concernées"
o3.check.know: "Inventaire tiré des nomenclatures, alertes aux responsables, 72 heures pour un correctif critique"
o3.check.watch: "Alerte avant l'expiration d'un certificat, alerte en cas de contournement"
o3.check.secrets: "Les mots de passe des bases sont dans un coffre, pas dans des fichiers"
o3.check.works: "La sauvegarde de nuit continue"
o3.q.tell: "Des millions de dossiers ont été copiés. Comment Mouette prévient-elle les personnes ?"
o3.q.tell.onsite: "Un site dédié, et le gel gratuit des dossiers de crédit"
o3.q.tell.later: "Attendre la fin de l'enquête, pour tout annoncer d'un coup"
o3.q.tell.minimum: "Le strict minimum légal, sans plus"
o3.ada.brief: "Lis la politique : `cat dossier/politique.yml`. Trois couches, puis une décision."
o3.ada.g.know: "D'abord, savoir et agir à temps : `source: from-sbom`, `bulletins_to: owners`, `critical_deadline: 72h`. Ouvre `edit dossier/politique.yml`, puis `verify`."
o3.ada.g.know.standard: "D'abord, que chaque alerte arrive à la bonne équipe et soit tenue dans un délai. Puis `verify`."
o3.ada.know: "La couche qui aurait tout changé : la faille aurait trouvé le portail le jour même, et son équipe aurait eu trois jours."
o3.ada.g.watch: "Ensuite, les contrôles qui se taisent : `cert_expiry_alert: 30d` et `bypass_mode: alert`, puis `verify`."
o3.ada.g.watch.standard: "Ensuite, qu'aucun contrôle ne puisse tomber en panne en silence. Puis `verify`."
o3.ada.g.secrets: "Enfin, l'intrus a trouvé des mots de passe en clair dans des fichiers du portail : `db_credentials: vault`, puis `verify`."
o3.ada.g.secrets.standard: "Enfin, ce qui a laissé l'intrus passer du portail aux bases. Puis `verify`."
o3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
o3.ada.ready: "Les couches tiennent. Reste les gens dont le dossier est dehors. Je te laisse décider."
o3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
o3.ada.answer.standard: "Ma question t'attend dans la messagerie."
o3.ada.onsite: "Le choix qui coûte le moins : chacun peut vérifier s'il est concerné et bloquer l'ouverture de crédit à son nom, avant qu'un fraudeur ne s'en serve."
o3.ada.later: "Pendant que Mouette attend, les dossiers copiés servent déjà. Chaque semaine de silence est une semaine d'avance pour les fraudeurs."
o3.ada.minimum: "Légal, mais les personnes n'apprennent ni quoi faire ni comment se protéger. La confiance part plus vite que les données."
o3.ada.done: "Savoir ce qu'on possède, corriger dans un délai tenu, des contrôles qui crient, des secrets au coffre. Ouvre le débrief : à la fin, le cas réel."
o3.hint.know.1: "Trois lignes : `source`, `bulletins_to`, `critical_deadline`."
o3.hint.know.2: "`sed -i \"s/source: manual/source: from-sbom/\" dossier/politique.yml`, puis la même chose pour `bulletins_to: owners` et `critical_deadline: 72h`, puis `verify`."
o3.hint.watch.1: "Deux lignes sous `monitoring`."
o3.hint.watch.2: "`sed -i \"s/cert_expiry_alert: off/cert_expiry_alert: 30d/\" dossier/politique.yml` et `sed -i \"s/bypass_mode: silent/bypass_mode: alert/\" dossier/politique.yml`, puis `verify`."
o3.hint.secrets.1: "`sed -i \"s/db_credentials: files/db_credentials: vault/\" dossier/politique.yml`, puis `verify`."
o3.hint.tell.1: "Aucune réponse n'est fausse. Laquelle laisse le moins d'avance aux fraudeurs ?"
o3.debrief.title: "Savoir ce qu'on possède"
o3.debrief.lesson: "Rien de ce qui a manqué n'était difficile : un inventaire, une alerte à la bonne personne, un délai tenu, un certificat surveillé, des mots de passe au coffre. Chacun de ces gestes aurait arrêté l'intrus, ou l'aurait montré des semaines plus tôt."
o3.debrief.p1: "Produire une nomenclature logicielle à chaque version, et en tirer l'inventaire."
o3.debrief.p2: "Adresser les alertes aux responsables d'application, avec un délai vérifié."
o3.debrief.p3: "Faire alerter un contrôle qui expire ou qui se contourne lui-même."
o3.debrief.p4: "Garder les mots de passe d'application dans un coffre, jamais dans des fichiers."
o3.facts.title: "Ce qui s'est vraiment passé : Equifax, 2017"
o3.facts.p1: "En mars 2017, une faille critique d'Apache Struts (CVE-2017-5638) est publiée avec son correctif. L'équipe de sécurité d'Equifax diffuse une alerte qui demande de corriger sous 48 heures."
o3.facts.p2: "Le portail de contestation en ligne d'Equifax utilise Struts, mais il n'est pas corrigé, et une recherche automatique ne le repère pas."
o3.facts.p3: "À partir du 13 mai 2017, des intrus entrent par ce portail, trouvent des identifiants stockés en clair, et interrogent des bases de données pendant 76 jours."
o3.facts.p4: "Les envois passent inaperçus : le certificat de l'appareil qui inspectait le trafic chiffré avait expiré depuis 19 mois. Renouvelé le 29 juillet, il montre aussitôt le trafic suspect."
o3.facts.p5: "Les données d'environ 148 millions de personnes sont exposées. Le rapport de la Chambre des représentants américaine (2018) juge la fuite « entièrement évitable »."
