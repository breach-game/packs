m3.briefing: "La session de `noe.ext` est ouverte. Un prestataire n'a aucun droit d'administration : il voit l'intranet, comme tout le monde. Regarde ce que « tout le monde » peut lire chez Martinet."
m3.obj.intra: "Ouvrir l'intranet avec la session du prestataire"
m3.obj.files: "Ouvrir le partage commun"
m3.obj.script: "Lire le fichier de l'équipe infrastructure"
m3.obj.marker: "Envoyer le marqueur témoin trouvé dans le fichier (`submit`)"
m3.obj.what: "Dire ce qui n'aurait jamais dû se trouver là"
m3.q.what: "Tu es passé d'un compte de prestataire au compte qui ouvre le coffre. Par où ?"
m3.q.what.secret: "Un secret d'administration écrit en clair dans un fichier que tous les comptes peuvent lire"
m3.q.what.bug: "Une faille logicielle de l'intranet, qu'il fallait exploiter"
m3.q.what.bug.why: "Tu n'as rien exploité : tu as ouvert un fichier que l'intranet te donnait le droit de lire. Aucun correctif logiciel ne ferme ça."
m3.q.what.admin: "Le compte de Noé avait trop de droits pour un prestataire"
m3.q.what.admin.why: "Son compte n'avait aucun droit particulier, juste l'accès au partage commun, comme huit cents autres. Le problème est ce qu'on a rangé dans ce partage."
m3.soc.read: "Fichier d'infrastructure lu sur le partage commun par un compte prestataire"
m3.ada.brief: "L'intranet est `https://intra.martinet.test`. Pas d'outil, pas de scan : tu te promènes comme le ferait Noé un lundi matin."
m3.ada.g.intra: "Ouvre l'intranet : `curl https://intra.martinet.test/`."
m3.ada.g.intra.standard: "Ouvre l'intranet."
m3.ada.intra: "Tu es accueilli comme un collègue. Lis le rappel en bas de page : un partage ouvert à tous les comptes, prestataires compris."
m3.ada.g.files: "Va voir ce partage : `curl https://intra.martinet.test/partage`."
m3.ada.g.files.standard: "Va voir ce que contient le partage commun."
m3.ada.files: "Un menu de cantine, un modèle de note de frais, et un fichier de l'équipe infrastructure. Un seul des trois n'a rien à faire là."
m3.ada.g.script: "Ouvre-le : `curl https://intra.martinet.test/partage/rotation-coffre.txt`."
m3.ada.g.script.standard: "Ouvre le fichier qui n'a rien à faire dans un partage commun."
m3.ada.script: "Un script qui se connecte au coffre tout seul chaque nuit. Pour ça, quelqu'un y a écrit le compte et le mot de passe d'administration, « en attendant ». Le ticket date de 2025. Pour l'exercice, Martinet a remplacé le mot de passe par un marqueur."
m3.ada.coffre: "On ne va pas plus loin. Le mandat s'arrête au marqueur : on a prouvé qu'on tenait la clé, on n'ouvre pas le coffre."
m3.ada.closed: "Le coffre est fermé, et un prestataire n'en a pas la clé. Ne force rien : regarde plutôt ce que son compte a le droit de lire dans l'intranet."
m3.ada.g.marker: "Le marqueur témoin est dans le fichier. Envoie-le-moi avec `submit`."
m3.ada.g.marker.standard: "Envoie-moi le marqueur avec `submit`."
m3.ada.flag: "Avec ce compte, un attaquant ouvre le coffre, et le coffre ouvre tout le reste : messagerie, outils internes, machines. Nous, on s'arrête ici. Une question pour le rapport."
m3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
m3.ada.answer.standard: "Réponds à ma question."
m3.ada.what: "Oui. Trois étapes, et à aucune tu n'as utilisé une faille logicielle : un mot de passe acheté, un bouton approuvé, un fichier lisible. Chaque étape était « normale » pour le système."
m3.ada.done: "Ouvre le débrief. Demain, dernière matinée chez Martinet : on referme les trois portes, et je te raconte l'affaire réelle d'où vient ce dossier."
m3.hint.intra.1: "Tape `curl https://intra.martinet.test/`."
m3.hint.files.1: "Tape `curl https://intra.martinet.test/partage`."
m3.hint.script.1: "Tape `curl https://intra.martinet.test/partage/rotation-coffre.txt`."
m3.hint.marker.1: "Copie la ligne `FLAG{...}` du fichier et tape `submit` suivi de cette ligne."
m3.debrief.title: "La clé sous le paillasson"
m3.debrief.lesson: "Une fois à l'intérieur, tu n'as eu besoin d'aucun droit : la clé du coffre traînait dans un fichier que tout le monde pouvait lire. L'accès initial d'un attaquant vaut ce que l'intérieur lui laisse trouver."
m3.debrief.p1: "Un secret n'a pas sa place dans un script, un partage ou une messagerie. Un programme le demande au coffre au moment de s'en servir."
m3.debrief.p2: "Un prestataire ne devrait voir que les outils de sa mission. « Le même intranet que les salariés » donne à un seul compte volé la vue de toute l'entreprise."
m3.debrief.p3: "Un compte d'administration qui ouvre tout transforme une petite intrusion en crise. On le découpe, on le surveille, et on change ses secrets souvent."
