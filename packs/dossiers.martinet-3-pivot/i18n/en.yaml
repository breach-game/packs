m3.briefing: "The session of `noe.ext` is open. A contractor has no administration rights: he sees the intranet, like everybody. Look at what \"everybody\" can read at Martinet."
m3.obj.intra: "Open the intranet with the contractor's session"
m3.obj.files: "Open the common share"
m3.obj.script: "Read the infrastructure team's file"
m3.obj.marker: "Send the witness marker found in the file (`submit`)"
m3.obj.what: "Say what should never have been there"
m3.q.what: "You went from a contractor's account to the account that opens the vault. How?"
m3.q.what.secret: "An administration secret written in clear in a file every account can read"
m3.q.what.bug: "A software flaw in the intranet, which had to be exploited"
m3.q.what.bug.why: "You exploited nothing: you opened a file the intranet gave you the right to read. No software patch closes that."
m3.q.what.admin: "Noé's account had too many rights for a contractor"
m3.q.what.admin.why: "His account had no special rights, only access to the common share, like eight hundred others. The problem is what was put in that share."
m3.soc.read: "Infrastructure file read on the common share by a contractor account"
m3.ada.brief: "The intranet is `https://intra.martinet.test`. No tool, no scan: you walk around as Noé would on a Monday morning."
m3.ada.g.intra: "Open the intranet: `curl https://intra.martinet.test/`."
m3.ada.g.intra.standard: "Open the intranet."
m3.ada.intra: "You are welcomed like a colleague. Read the reminder at the bottom of the page: a share open to every account, contractors included."
m3.ada.g.files: "Go and see that share: `curl https://intra.martinet.test/partage`."
m3.ada.g.files.standard: "Go and see what the common share holds."
m3.ada.files: "A canteen menu, an expense report template, and a file from the infrastructure team. Only one of the three has no business there."
m3.ada.g.script: "Open it: `curl https://intra.martinet.test/partage/rotation-coffre.txt`."
m3.ada.g.script.standard: "Open the file that has no business in a common share."
m3.ada.script: "A script that logs in to the vault by itself every night. For that, someone wrote the administration account and password in it, \"for now\". The ticket dates from 2025. For the exercise, Martinet replaced the password with a marker."
m3.ada.coffre: "We go no further. The mandate stops at the marker: we proved we held the key, we do not open the vault."
m3.ada.closed: "The vault is closed, and a contractor does not have its key. Force nothing: look instead at what his account is allowed to read in the intranet."
m3.ada.g.marker: "The witness marker is in the file. Send it to me with `submit`."
m3.ada.g.marker.standard: "Send me the marker with `submit`."
m3.ada.flag: "With that account, an attacker opens the vault, and the vault opens everything else: mail, internal tools, machines. We stop here. One question for the report."
m3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
m3.ada.answer.standard: "Answer my question."
m3.ada.what: "Yes. Three steps, and at none of them did you use a software flaw: a bought password, an approved button, a readable file. Each step was \"normal\" for the system."
m3.ada.done: "Open the debrief. Tomorrow, last morning at Martinet: we close the three doors, and I tell you the real case this file comes from."
m3.hint.intra.1: "Type `curl https://intra.martinet.test/`."
m3.hint.files.1: "Type `curl https://intra.martinet.test/partage`."
m3.hint.script.1: "Type `curl https://intra.martinet.test/partage/rotation-coffre.txt`."
m3.hint.marker.1: "Copy the `FLAG{...}` line from the file and type `submit` followed by that line."
m3.debrief.title: "The key under the doormat"
m3.debrief.lesson: "Once inside, you needed no rights at all: the key to the vault was lying in a file everybody could read. An attacker's initial access is worth what the inside lets them find."
m3.debrief.p1: "A secret has no place in a script, a share or a chat. A program asks the vault for it at the moment it needs it."
m3.debrief.p2: "A contractor should only see the tools of their mission. \"The same intranet as employees\" gives a single stolen account the view of the whole company."
m3.debrief.p3: "An administration account that opens everything turns a small intrusion into a crisis. It is split up, watched, and its secrets are changed often."
