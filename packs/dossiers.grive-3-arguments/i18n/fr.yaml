v3.briefing: "Un nom de fichier trouvé dans un message de commit a lancé un programme sur le serveur d'outils de Grive. Le directeur technique demande s'il faut se passer de l'agent. Tu as la matinée pour montrer qu'il peut rester : la faille est dans la façon dont les outils fabriquent leurs commandes, et elle se corrige dans les réglages et par une mise à jour."
v3.obj.idea: "Choisir la correction qui compte"
v3.obj.build: "Faire passer une liste d'arguments à tous les outils"
v3.obj.names: "N'accepter que des noms de fichiers simples"
v3.obj.confirm: "Demander à un humain avant qu'un outil modifie quelque chose"
v3.obj.update: "Passer à la version corrigée du serveur d'outils"
v3.q.idea: "Le directeur technique veut une correction en premier. Laquelle ?"
v3.q.idea.ban: "Refuser les paramètres qui contiennent une liste de caractères dangereux"
v3.q.idea.ban.why: "Une telle liste en oublie toujours un. Elle est utile en seconde couche, mais tant qu'un shell lit la ligne, tu paries que la liste est complète."
v3.q.idea.prompt: "Dire à l'agent de ne jamais obéir aux messages de commit"
v3.q.idea.prompt.why: "À faire, et insuffisant : une phrase de plus dans les consignes se contourne avec une phrase de plus dans un texte. L'outil doit être sûr quoi que l'agent envoie."
v3.q.idea.lists: "Ne plus fabriquer de lignes de texte : passer le programme et ses arguments séparément"
v3.check.build: "Les commandes sont fabriquées en listes d'arguments"
v3.check.names: "Seuls les noms de fichiers simples sont acceptés"
v3.check.confirm: "Un humain confirme avant qu'un outil modifie quelque chose"
v3.check.update: "Le serveur d'outils est à la version corrigée"
v3.check.works: "Les outils et le journal restent allumés"
v3.ada.brief: "Dernière matinée chez Grive. Les réglages du serveur d'outils sont dans `dossier/outils.yml`. Mais d'abord, une décision."
v3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
v3.ada.answer.standard: "Réponds d'abord à ma question."
v3.ada.idea: "Oui. Sans shell, il n'y a plus personne pour lire un paramètre comme une commande. Les deux autres réponses sont de bonnes secondes couches, et on va en ajouter une."
v3.ada.g.build: "Ouvre le fichier : `edit dossier/outils.yml`. Remplace `build: shell-line` par `build: argument-list`, puis `verify`."
v3.ada.g.build.standard: "Ouvre `dossier/outils.yml` et change la façon dont les commandes sont fabriquées. Puis `verify`."
v3.ada.g.names: "Seconde couche : écris `file_names: plain`, puis `verify`."
v3.ada.g.names.standard: "Resserre ce qu'un nom de fichier peut contenir. Puis `verify`."
v3.ada.g.confirm: "Troisième couche, du côté de l'agent : écris `confirm: before-write`, puis `verify`."
v3.ada.g.confirm.standard: "Mets un humain devant les outils qui modifient quelque chose. Puis `verify`."
v3.ada.g.update: "Enfin, la version corrigée : remplace `version: 1.3.0` par `version: 1.3.1`, puis `verify`."
v3.ada.g.update.standard: "Passe le serveur d'outils à sa version corrigée, la 1.3.1. Puis `verify`."
v3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
v3.ada.done: "L'agent reste. Un nom de fichier étrange n'est plus qu'un nom de fichier étrange. Ouvre le débrief : à la fin, la vraie faille dont ce dossier est tiré."
v3.hint.idea.1: "Quelle réponse tient encore le jour où quelqu'un trouve un caractère auquel personne n'avait pensé ?"
v3.hint.build.1: "La ligne à changer est `build`, sous `commands`. Les valeurs possibles sont dans les commentaires juste au-dessus."
v3.hint.build.2: "Tape `sed -i \"s/build: shell-line/build: argument-list/\" dossier/outils.yml`, puis `verify`."
v3.hint.names.1: "La ligne à changer est `file_names`."
v3.hint.names.2: "Tape `sed -i \"s/file_names: any/file_names: plain/\" dossier/outils.yml`, puis `verify`."
v3.hint.confirm.1: "La ligne à changer est `confirm`, sous `agent`."
v3.hint.confirm.2: "Tape `sed -i \"s/confirm: never/confirm: before-write/\" dossier/outils.yml`, puis `verify`."
v3.hint.update.1: "La ligne à changer est `version`, en haut du fichier. La version corrigée est la 1.3.1."
v3.hint.update.2: "Tape `sed -i \"s/version: 1.3.0/version: 1.3.1/\" dossier/outils.yml`, puis `verify`."
v3.debrief.title: "Un paramètre reste un paramètre"
v3.debrief.lesson: "Tu n'as pas cherché à deviner tous les noms dangereux. Tu as retiré le shell du chemin, pour qu'aucun nom ne puisse être lu comme une commande, puis tu as ajouté des couches autour. L'agent peut encore être trompé par un texte : ce qu'il envoie n'a plus le pouvoir de rien exécuter."
v3.debrief.p1: "La correction de fond : passer le programme et chaque argument séparément, sans shell au milieu."
v3.debrief.p2: "La validation en seconde couche : un nom de fichier qui ne ressemble à rien d'autre qu'un nom de fichier."
v3.debrief.p3: "Un humain confirme les actions qui modifient quelque chose, au moins quand la demande vient d'un contenu écrit à l'extérieur."
v3.debrief.p4: "Les outils qu'on branche à un agent sont des dépendances comme les autres : on suit leurs avis de sécurité et on les met à jour."
v3.facts.title: "Ce qui s'est vraiment passé : CVE-2025-53107, un serveur d'outils git pour agents IA (2025)"
v3.facts.p1: "Grive et depot-outils n'existent pas. Le scénario s'inspire de la CVE-2025-53107, une faille d'un serveur git libre pour le Model Context Protocol (MCP), publié sur npm par un développeur indépendant. Ce n'est pas le serveur MCP de GitHub lui-même."
v3.facts.p2: "Selon l'avis de sécurité, plusieurs outils de ce serveur fabriquaient leur commande git sous la forme d'une ligne de texte contenant des paramètres non contrôlés, et la lançaient à travers un shell. L'avis cite en exemple les outils qui initialisent un dépôt et qui ajoutent des fichiers."
v3.facts.p3: "Des caractères compris par un shell pouvaient donc injecter d'autres commandes, exécutées avec les droits du serveur. L'avis classe la faille en gravité élevée, avec un score de 7,5."
v3.facts.p4: "L'avis explique qu'un agent peut y être amené par une injection indirecte, par exemple des consignes cachées dans les messages de commit qu'il lit. C'est le chemin que joue ce dossier."
v3.facts.p5: "Un chercheur en sécurité a signalé la faille et le développeur l'a corrigée. Les versions jusqu'à la 2.1.4 étaient touchées, la 2.1.5 la corrige, et l'avis a été publié fin juin 2025. La correction recommandée est celle de cette mission : passer les arguments séparément, sans shell."
v3.facts.p6: "À ne pas confondre avec la recherche publiée par Invariant Labs en mai 2025 sur le serveur MCP de GitHub, racontée dans le dossier 02 : celle-là n'est pas une faille de code et n'a pas de numéro CVE."
