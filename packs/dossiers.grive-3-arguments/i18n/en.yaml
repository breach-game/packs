v3.briefing: "A file name found in a commit message started a program on Grive's tool server. The technical director asks whether the agent has to go. You have the morning to show that it can stay: the flaw is in how the tools build their commands, and that is fixed in the settings and with an update."
v3.obj.idea: "Choose the fix that counts"
v3.obj.build: "Make every tool pass an argument list"
v3.obj.names: "Accept only plain file names"
v3.obj.confirm: "Ask a human before a tool changes something"
v3.obj.update: "Move to the fixed version of the tool server"
v3.q.idea: "The technical director wants one fix first. Which one?"
v3.q.idea.ban: "Filter every parameter and refuse any that holds a character from a blocklist"
v3.q.idea.ban.why: "Such a list always misses one. It is useful as a second layer, but as long as a shell reads the line, you are betting on the list being complete."
v3.q.idea.prompt: "Tell the agent never to obey commit messages"
v3.q.idea.prompt.why: "Worth doing, and not enough: one more sentence in the instructions is bypassed by one more sentence in a text. The tool must be safe whatever the agent sends."
v3.q.idea.lists: "Stop building lines of text: pass the program and its arguments separately"
v3.check.build: "Commands are built as argument lists"
v3.check.names: "Only plain file names are accepted"
v3.check.confirm: "A human confirms before a tool changes something"
v3.check.update: "The tool server is on the fixed version"
v3.check.works: "The tools and the log stay on"
v3.ada.brief: "Last morning at Grive. The tool server's settings are in `dossier/outils.yml`. But first, a decision."
v3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
v3.ada.answer.standard: "Answer my question first."
v3.ada.idea: "Yes. Without a shell there is nobody left to read a parameter as a command. The other two answers are good second layers, and we will add one of them."
v3.ada.g.build: "Open the file: `edit dossier/outils.yml`. Replace `build: shell-line` with `build: argument-list`, then `verify`."
v3.ada.g.build.standard: "Open `dossier/outils.yml` and change how commands are built. Then `verify`. To open the file: `edit dossier/outils.yml`."
v3.ada.g.names: "Second layer: write `file_names: plain`, then `verify`."
v3.ada.g.names.standard: "Narrow what a file name may contain. Then `verify`."
v3.ada.g.confirm: "Third layer, on the agent's side: write `confirm: before-write`, then `verify`."
v3.ada.g.confirm.standard: "Put a human in front of the tools that change something. Then `verify`."
v3.ada.g.update: "Last, the fixed release: replace `version: 1.3.0` with `version: 1.3.1`, then `verify`."
v3.ada.g.update.standard: "Move the tool server to its fixed release, 1.3.1. Then `verify`."
v3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
v3.ada.done: "The agent stays. A strange file name is now just a strange file name. Open the debrief: at the end, the real flaw this case file comes from."
v3.hint.idea.1: "Which answer still holds on the day someone finds a character nobody had thought of?"
v3.hint.build.1: "The line to change is `build`, under `commands`. The possible values are in the comments just above."
v3.hint.build.2: "With the editor: `edit dossier/outils.yml`, then Ctrl+S. With a command: type `sed -i \"s/build: shell-line/build: argument-list/\" dossier/outils.yml`, then `verify`."
v3.hint.names.1: "The line to change is `file_names`."
v3.hint.names.2: "With the editor: `edit dossier/outils.yml`, then Ctrl+S. With a command: type `sed -i \"s/file_names: any/file_names: plain/\" dossier/outils.yml`, then `verify`."
v3.hint.confirm.1: "The line to change is `confirm`, under `agent`."
v3.hint.confirm.2: "With the editor: `edit dossier/outils.yml`, then Ctrl+S. With a command: type `sed -i \"s/confirm: never/confirm: before-write/\" dossier/outils.yml`, then `verify`."
v3.hint.update.1: "The line to change is `version`, at the top of the file. The fixed release is 1.3.1."
v3.hint.update.2: "With the editor: `edit dossier/outils.yml`, then Ctrl+S. With a command: type `sed -i \"s/version: 1.3.0/version: 1.3.1/\" dossier/outils.yml`, then `verify`."
v3.debrief.title: "A parameter stays a parameter"
v3.debrief.lesson: "You did not try to guess every dangerous name. You removed the shell from the path, so that no name can be read as a command, then you added layers around it. The agent can still be fooled by a text: what it sends no longer has the power to run anything."
v3.debrief.p1: "The root fix: pass the program and each argument separately, without a shell in between."
v3.debrief.p2: "Validation as a second layer: a file name that looks like nothing but a file name."
v3.debrief.p3: "A human confirms the actions that change something, at least when the request comes from content written outside."
v3.debrief.p4: "The tools you plug into an agent are dependencies like any other: you follow their security advisories and you update them."
v3.facts.title: "What really happened: CVE-2025-53107, a git tool server for AI agents (2025)"
v3.facts.p1: "Grive and depot-outils do not exist. The scenario is inspired by CVE-2025-53107, a flaw in an open-source git server for the Model Context Protocol (MCP), published on npm by an independent developer. It is not GitHub's own MCP server."
v3.facts.p2: "According to the advisory, several tools of that server built their git command as a line of text containing parameters that were not checked, and ran it through a shell. The advisory gives the tools that initialise a repository and add files as examples."
v3.facts.p3: "Characters that a shell understands could therefore inject other commands, run with the rights of the server. The advisory rates the flaw High, with a score of 7.5."
v3.facts.p4: "The advisory explains that an agent can be led there by an indirect injection, for example instructions hidden in the commit messages it reads. That is the path this case file plays."
v3.facts.p5: "A security researcher reported the flaw and the developer fixed it. Versions up to 2.1.4 were affected, version 2.1.5 fixes it, and the advisory was published at the end of June 2025. The fix recommended is the one of this mission: pass arguments separately, without a shell."
v3.facts.p6: "Do not confuse it with the research published by Invariant Labs in May 2025 on GitHub's MCP server, told in case file 02: that one is not a code flaw and has no CVE number."
