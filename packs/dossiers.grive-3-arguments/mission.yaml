order: 2
stage: defense
briefing: v3.briefing

# The tool server's settings, as found during the test.
files:
  dossier/outils.yml: { $file: files/outils.yml }

objectives:
  - { id: idea, text: v3.obj.idea }
  - { id: build, text: v3.obj.build }
  - { id: names, text: v3.obj.names }
  - { id: confirm, text: v3.obj.confirm }
  - { id: update, text: v3.obj.update }

questions:
  - id: idea
    text: v3.q.idea
    objective: idea
    correct: lists
    options:
      - { id: ban, text: v3.q.idea.ban, why: v3.q.idea.ban.why }
      - { id: prompt, text: v3.q.idea.prompt, why: v3.q.idea.prompt.why }
      - { id: lists, text: v3.q.idea.lists }

checks:
  - id: build
    text: v3.check.build
    if: { all: [{ file: "~/dossier/outils.yml", lacks: "build: shell-line" }, { file: "~/dossier/outils.yml", contains: "build: argument-list" }] }
    objective: build
  - id: names
    text: v3.check.names
    if: { all: [{ file: "~/dossier/outils.yml", lacks: "file_names: any" }, { file: "~/dossier/outils.yml", contains: "file_names: plain" }] }
    objective: names
  - id: confirm
    text: v3.check.confirm
    if: { all: [{ file: "~/dossier/outils.yml", lacks: "confirm: never" }, { file: "~/dossier/outils.yml", contains: "confirm: before-write" }] }
    objective: confirm
  - id: update
    text: v3.check.update
    if: { all: [{ file: "~/dossier/outils.yml", lacks: "version: 1.3.0" }, { file: "~/dossier/outils.yml", contains: "version: 1.3.1" }] }
    objective: update
  - id: works
    text: v3.check.works
    if: { all: [{ file: "~/dossier/outils.yml", contains: "tools: on" }, { file: "~/dossier/outils.yml", contains: "logging: on" }] }

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: v3.ada.brief
      - ada.ask: idea
  - on: { event: ObjectiveCompleted, objective: idea }
    do:
      - ada.say: v3.ada.idea
  - on: { event: Verified }
    if: { not: { all: [{ objective: build }, { objective: names }, { objective: confirm }, { objective: update }] } }
    once: false
    do:
      - ada.say: v3.ada.almost
  - on: { event: MissionCompleted }
    do:
      - ada.say: v3.ada.done

guide:
  idea: v3.ada.answer
  build: v3.ada.g.build
  names: v3.ada.g.names
  confirm: v3.ada.g.confirm
  update: v3.ada.g.update

hints:
  idea: [v3.hint.idea.1]
  build: [v3.hint.build.1, v3.hint.build.2]
  names: [v3.hint.names.1, v3.hint.names.2]
  confirm: [v3.hint.confirm.1, v3.hint.confirm.2]
  update: [v3.hint.update.1, v3.hint.update.2]

debrief:
  title: v3.debrief.title
  lesson: v3.debrief.lesson
  points: [v3.debrief.p1, v3.debrief.p2, v3.debrief.p3, v3.debrief.p4]
  reference: "CWE-77 · Command Injection"
  facts:
    title: v3.facts.title
    points: [v3.facts.p1, v3.facts.p2, v3.facts.p3, v3.facts.p4, v3.facts.p5, v3.facts.p6]
    sources:
      - { label: "GitHub Advisory Database, GHSA-3q26-f695-pp76, CVE-2025-53107 (30 June 2025)", url: "https://github.com/advisories/GHSA-3q26-f695-pp76" }
