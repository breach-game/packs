p3.briefing: "Friday, 2 pm. The statistics vendor confirms someone else changed its script on Tuesday evening. Contremarque hands you the site's configuration: the list of third-party scripts (`site/widgets.conf`) and the security header (`site/csp.conf`). The site reads these files on every page. Payment and the seat map must keep working."
p3.obj.widget: "Remove the statistics widget from the site's script list"
p3.obj.csp: "Remove it from the site's security policy too"
p3.obj.page: "Check that the concert page is normal again"
p3.obj.policy: "Decide what changes at the box offices"
p3.obj.sentence: "Choose the sentence for the box office poster"
p3.check.widget: "The stats-billet.example widget is no longer loaded"
p3.check.csp: "The security policy no longer allows stats-billet.example"
p3.check.works: "Payment and the seat map are still loaded and allowed"
p3.q.policy: "Box office staff only need the terminal for `cm-verif`, which the crontab runs every morning. What changes on the six box offices?"
p3.q.policy.terminal: "Remove the terminal from the box office sessions"
p3.q.policy.terminal.why: "No terminal to open, so nowhere to paste. The morning opening goes on through the crontab. Half a day of IT work, and two clerks who used it for something else will have to ask."
p3.q.policy.warn: "Keep the terminal, add a paste warning and ten minutes of training"
p3.q.policy.warn.why: "The terminal stays, a window asks for confirmation before pasting several words, and everyone learns the poster's sentence. Cheap, but it still relies on everyone's attention."
p3.q.policy.both: "Both: remove the terminal and train everyone"
p3.q.policy.both.why: "The safest for the box offices, the longest to set up. The training also helps at home, where nobody will remove the terminal."
p3.q.sentence: "Which sentence goes on the poster above each box office?"
p3.q.sentence.never: "No check ever asks you to paste anything into a terminal"
p3.q.sentence.robot: "Never tick an \"I am not a robot\" box anywhere online"
p3.q.sentence.robot.why: "Real checks are everywhere, and the rule would be impossible to follow. The signal is what comes next: open a terminal and paste."
p3.q.sentence.manager: "Only run `cm-verif` with the venue manager's written approval"
p3.q.sentence.manager.why: "The tool is used all day, and the next trap will use another name. The rule must target the gesture: pasting into a terminal what a page gave you."
p3.ada.brief: "Read both files: `cat site/widgets.conf` and `cat site/csp.conf`. Then change them: `edit site/widgets.conf`, or `sed`. `verify` tells you where you stand."
p3.ada.g.widget: "Open the list with `edit site/widgets.conf` and delete the `stats` line, or `sed -i '/stats-billet/d' site/widgets.conf`. Then `verify`."
p3.ada.g.widget.standard: "Remove the widget from the script list without touching the other two. `verify`."
p3.ada.g.csp: "In `site/csp.conf`, take ` https://stats-billet.example` out of `script-src`: `edit site/csp.conf`, or `sed -i 's| https://stats-billet.example||' site/csp.conf`. Then `verify`."
p3.ada.g.csp.standard: "The policy still allows that domain. Remove it, nothing else. `verify`."
p3.ada.fixed: "The site no longer loads the widget, and even if a page tried, the browser would refuse it. Go and look at the page."
p3.ada.g.page: "`open https://www.contremarque.test/concerts/nuit-blanche`, or `curl -s` with the same address."
p3.ada.g.page.standard: "Check the concert page as customers see it."
p3.ada.page: "No box, no instruction: a concert page. The box offices are left."
p3.ada.g.policy: "Answer in the messenger or with `answer <option>`. No option is wrong, each has its cost."
p3.ada.g.sentence: "Answer in the messenger or with `answer <option>`."
p3.ada.done: "Clean page, cleaned box offices, an alert and a sentence. If a page ever asks you to open a terminal to prove you are human, you know what to do: close the tab."
p3.hint.widget.1: "The line `stats       https://stats-billet.example/w.js`."
p3.hint.widget.2: "`sed -i '/stats-billet/d' site/widgets.conf` then `verify`"
p3.hint.csp.1: "Only the last domain of `script-src` must go."
p3.hint.csp.2: "`sed -i 's| https://stats-billet.example||' site/csp.conf` then `verify`"
p3.hint.page.1: "`curl -s https://www.contremarque.test/concerts/nuit-blanche`"
p3.hint.policy.1: "Every option completes the objective. Look at what each one costs."
p3.hint.sentence.1: "The rule targets the gesture that makes the trap work."
p3.debrief.title: "The house rule"
p3.debrief.lesson: "The trap rested on two things: a third-party script the site loaded without reviewing it, and a gesture nobody had learned to refuse. Removing the script closes the site's door; the security policy stops it coming back through another page. The poster's sentence works everywhere, even on a site you do not control."
p3.debrief.p1: "Keep the list of third-party scripts short, and the Content-Security-Policy header as short as the list."
p3.debrief.p2: "Removing a tool a workstation does not need costs less than training, but only protects that workstation."
p3.debrief.p3: "A simple rule about a gesture (\"never paste into a terminal what a page gave you\") beats a list of sites to avoid."
p3.home.p1: "If a page asks you to press Windows+R, open a terminal or PowerShell, then paste: close the tab. No check ever does that."
p3.home.p2: "Explain it once to the people close to you, with that sentence. It is the same on a Mac: Terminal, paste, Enter means no."
p3.home.p3: "If it is already done: unplug the computer from the network, change your passwords from another device and sign out the open sessions."
p3.facts.title: "What really happened: ClickFix, 2024 and 2025"
p3.facts.p1: "On 21 August 2025, Microsoft Threat Intelligence described a technique it calls ClickFix, which it says it has observed since early 2024."
p3.facts.p2: "A fake human check, often a fake CAPTCHA, copies a command to the clipboard in the background, then asks the person to paste and run it: the Windows Run box, Windows Terminal or PowerShell."
p3.facts.p3: "Microsoft describes campaigns targeting thousands of devices every day, in companies and at home, on Windows as well as macOS."
p3.facts.p4: "Among the protections it lists: teaching people to recognise these lures, and restricting the Run box where it is not needed for daily work."
