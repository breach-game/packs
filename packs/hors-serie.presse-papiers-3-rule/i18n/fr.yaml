p3.briefing: "Vendredi, 14 h. Le prestataire des statistiques confirme que son script a été modifié par quelqu'un d'autre mardi soir. Contremarque te confie la configuration du site : la liste des scripts tiers (`site/widgets.conf`) et l'en-tête de sécurité (`site/csp.conf`). Le site relit ces fichiers à chaque page. Le paiement et le plan de salle doivent continuer à marcher."
p3.obj.widget: "Retirer le widget de statistiques de la liste des scripts du site"
p3.obj.csp: "Le retirer aussi de la politique de sécurité du site"
p3.obj.page: "Vérifier que la page du concert est redevenue normale"
p3.obj.policy: "Décider ce qui change aux guichets"
p3.obj.sentence: "Choisir la phrase de l'affiche des guichets"
p3.check.widget: "Le widget stats-billet.example n'est plus chargé"
p3.check.csp: "La politique de sécurité n'autorise plus stats-billet.example"
p3.check.works: "Le paiement et le plan de salle restent chargés et autorisés"
p3.q.policy: "Les guichetières n'ont besoin du terminal que pour `cm-verif`, lancé par la crontab chaque matin. Que change-t-on sur les six guichets ?"
p3.q.policy.terminal: "Retirer le terminal des sessions des guichets"
p3.q.policy.terminal.why: "Plus de terminal à ouvrir, donc plus rien où coller. L'ouverture du matin continue par la crontab. Une demi-journée de travail pour l'informatique, et deux guichetières qui s'en servaient pour autre chose devront demander."
p3.q.policy.warn: "Garder le terminal, ajouter une alerte au collage et dix minutes de formation"
p3.q.policy.warn.why: "Le terminal reste, une fenêtre demande confirmation avant de coller plusieurs mots, et chacun apprend la phrase de l'affiche. Peu coûteux, mais ça repose encore sur l'attention de chacun."
p3.q.policy.both: "Les deux : retirer le terminal et former tout le monde"
p3.q.policy.both.why: "Le plus sûr pour les guichets, le plus long à mettre en place. La formation sert aussi à la maison, où personne ne retirera le terminal."
p3.q.sentence: "Quelle phrase met-on sur l'affiche, au-dessus de chaque guichet ?"
p3.q.sentence.never: "Aucune vérification ne demande de coller quoi que ce soit dans un terminal"
p3.q.sentence.robot: "Ne cochez jamais une case « Je ne suis pas un robot » sur internet"
p3.q.sentence.robot.why: "Les vraies vérifications existent partout, et la consigne serait impossible à suivre. Le signal, c'est la suite : ouvrir un terminal et coller."
p3.q.sentence.manager: "Ne lancez `cm-verif` qu'avec l'accord écrit du responsable de salle"
p3.q.sentence.manager.why: "L'outil sert toute la journée, et le prochain piège utilisera un autre nom. La règle doit viser le geste : coller dans un terminal ce qu'une page a donné."
p3.ada.brief: "Lis les deux fichiers : `cat site/widgets.conf` et `cat site/csp.conf`. Puis modifie-les : `edit site/widgets.conf`, ou `sed`. `verify` dit où tu en es."
p3.ada.g.widget: "Ouvre la liste avec `edit site/widgets.conf` et supprime la ligne `stats`, ou `sed -i '/stats-billet/d' site/widgets.conf`. Puis `verify`."
p3.ada.g.widget.standard: "Retire le widget de la liste des scripts sans toucher aux deux autres. `verify`."
p3.ada.g.csp: "Dans `site/csp.conf`, enlève ` https://stats-billet.example` de `script-src` : `edit site/csp.conf`, ou `sed -i 's| https://stats-billet.example||' site/csp.conf`. Puis `verify`."
p3.ada.g.csp.standard: "La politique autorise encore ce domaine. Retire-le, rien d'autre. `verify`."
p3.ada.fixed: "Le site ne charge plus le widget, et même si une page tentait de le faire, le navigateur le refuserait. Va voir la page."
p3.ada.g.page: "`open https://www.contremarque.test/concerts/nuit-blanche`, ou `curl -s` suivi de la même adresse."
p3.ada.g.page.standard: "Vérifie la page du concert telle que les clients la voient."
p3.ada.page: "Plus de case, plus de consigne : une page de concert. Reste les guichets."
p3.ada.g.policy: "Réponds dans la messagerie ou avec `answer <option>`. Aucune option n'est fausse, chacune a son coût."
p3.ada.g.sentence: "Réponds dans la messagerie ou avec `answer <option>`."
p3.ada.done: "Page propre, guichets nettoyés, une alerte et une phrase. Si une page te demande un jour d'ouvrir un terminal pour prouver que tu es humain, tu sais quoi faire : fermer l'onglet."
p3.hint.widget.1: "La ligne `stats       https://stats-billet.example/w.js`."
p3.hint.widget.2: "`sed -i '/stats-billet/d' site/widgets.conf` puis `verify`"
p3.hint.csp.1: "Seul le dernier domaine de `script-src` est à retirer."
p3.hint.csp.2: "`sed -i 's| https://stats-billet.example||' site/csp.conf` puis `verify`"
p3.hint.page.1: "`curl -s https://www.contremarque.test/concerts/nuit-blanche`"
p3.hint.policy.1: "Toutes les options terminent l'objectif. Regarde ce que chacune coûte."
p3.hint.sentence.1: "La règle vise le geste qui fait marcher le piège."
p3.debrief.title: "La règle de la maison"
p3.debrief.lesson: "Le piège tenait à deux choses : un script tiers que le site chargeait sans le relire, et un geste que personne n'avait appris à refuser. Retirer le script ferme la porte du site ; la politique de sécurité empêche qu'il revienne par une autre page. La phrase de l'affiche, elle, sert partout, même sur un site qu'on ne contrôle pas."
p3.debrief.p1: "Garder la liste des scripts tiers courte, et l'en-tête Content-Security-Policy aussi court qu'elle."
p3.debrief.p2: "Retirer un outil dont un poste n'a pas besoin coûte moins qu'une formation, mais ne protège que ce poste."
p3.debrief.p3: "Une règle simple sur un geste (« ne jamais coller dans un terminal ce qu'une page a donné ») vaut mieux qu'une liste de sites à éviter."
p3.home.p1: "Si une page te demande d'appuyer sur Windows+R, d'ouvrir un terminal ou PowerShell, puis de coller : ferme l'onglet. Aucune vérification ne fait ça."
p3.home.p2: "Explique-le une fois à tes proches, avec cette phrase. C'est la même chose sur un Mac : Terminal, coller, Entrée, c'est non."
p3.home.p3: "Si c'est déjà fait : débranche l'ordinateur du réseau, change tes mots de passe depuis un autre appareil et déconnecte les sessions ouvertes."
p3.facts.title: "Ce qui s'est vraiment passé : ClickFix, 2024 et 2025"
p3.facts.p1: "Le 21 août 2025, Microsoft Threat Intelligence décrit une technique qu'il appelle ClickFix, observée selon lui depuis le début de 2024."
p3.facts.p2: "Une fausse vérification humaine, souvent un faux CAPTCHA, copie une commande dans le presse-papiers en arrière-plan, puis demande à la personne de la coller et de la lancer : boîte Exécuter de Windows, Windows Terminal ou PowerShell."
p3.facts.p3: "Microsoft parle de campagnes qui visent chaque jour des milliers d'appareils, en entreprise comme chez les particuliers, et touchent Windows comme macOS."
p3.facts.p4: "Parmi les protections citées : apprendre aux gens à reconnaître ces leurres, et restreindre la boîte Exécuter là où elle ne sert pas au travail quotidien."
