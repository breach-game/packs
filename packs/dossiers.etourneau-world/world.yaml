# Case file 30 "Étourneau". Inspired by the botnet of connected cameras and recorders of 2016.
# Played on the defence side only, from the seat of one small customer whose cameras were enrolled:
# the flows that show them scanning, the remote access left open, the factory passwords, then the
# flood they took part in. No scanner, no login list, no flood tool: only flow lines to read.
startTime: "2027-10-19T09:00:00+02:00"
mandate: PL-2027-118
scope:
  domains: ["*.lumen.test"]
  networks: ["10.100.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.100.0.2

config:
  lm.forward_closed: false
  lm.passwords_reset: false
  lm.c2_blocked: false

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.100.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -320, z: 40, h: 70 }
    links: [passerelle, enregistreur]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            PL-2027-118.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # The Internet box and firewall: it writes the flow log.
  - id: passerelle
    hostname: passerelle.lumen.test
    ip: 10.100.0.1
    os: Linux 5.10 (OpenWrt 23.05)
    map: { x: 0, z: -120, h: 90 }
    links: [enregistreur, cam1, cam2, cam3, cam4, cam5, cam6]
    services:
      - { port: 443, name: https, product: LuCI }

  - id: dns
    hostname: dns.lumen.test
    ip: 10.100.0.2
    os: Linux 5.10 (OpenWrt 23.05)
    hidden: true
    map: { x: -120, z: -160, h: 40 }

  # The video recorder: it pulls every camera's stream.
  - id: enregistreur
    hostname: nvr.lumen.test
    ip: 10.100.0.30
    os: Linux 4.9 (NVR firmware 3.2)
    map: { x: 220, z: -40, h: 100 }
    services:
      - { port: 22, name: ssh, product: Dropbear sshd 2019.78 }
      - { port: 554, name: rtsp, product: NVR RTSP server }
    users:
      - { name: ir, home: /home/ir }
    ssh:
      - { user: ir, from: [kestrel] }
    fs:
      etc:
        hostname: "nvr\n"

  - { id: cam1, hostname: cam-n1.lumen.test, ip: 10.100.0.41, os: Linux 3.10 (camera firmware 2.4), map: { x: 120, z: 120, h: 50 }, services: [{ port: 23, name: telnet, product: BusyBox telnetd }, { port: 80, name: http, product: Camera web UI }] }
  - { id: cam2, hostname: cam-n2.lumen.test, ip: 10.100.0.42, os: Linux 3.10 (camera firmware 2.4), map: { x: 200, z: 160, h: 50 }, services: [{ port: 23, name: telnet, product: BusyBox telnetd }, { port: 80, name: http, product: Camera web UI }] }
  - { id: cam3, hostname: cam-n3.lumen.test, ip: 10.100.0.43, os: Linux 3.10 (camera firmware 2.4), map: { x: 280, z: 120, h: 50 }, services: [{ port: 23, name: telnet, product: BusyBox telnetd }, { port: 80, name: http, product: Camera web UI }] }
  - { id: cam4, hostname: cam-n4.lumen.test, ip: 10.100.0.44, os: Linux 3.10 (camera firmware 2.4), map: { x: 360, z: 160, h: 50 }, services: [{ port: 23, name: telnet, product: BusyBox telnetd }, { port: 80, name: http, product: Camera web UI }] }
  - { id: cam5, hostname: cam-n5.lumen.test, ip: 10.100.0.45, os: Linux 3.10 (camera firmware 2.4), map: { x: 440, z: 120, h: 50 }, services: [{ port: 23, name: telnet, product: BusyBox telnetd }, { port: 80, name: http, product: Camera web UI }] }
  - { id: cam6, hostname: cam-n6.lumen.test, ip: 10.100.0.46, os: Linux 3.10 (camera firmware 2.4), map: { x: 520, z: 160, h: 50 }, services: [{ port: 23, name: telnet, product: BusyBox telnetd }, { port: 80, name: http, product: Camera web UI }] }

  - id: outside
    hostname: inconnu.lumen.test
    ip: 10.100.0.200
    kind: unknown
    hidden: true
    os: unknown
    map: { x: 460, z: -200, h: 40 }

dns:
  lumen.test: { A: ["10.100.0.30"] }
  passerelle.lumen.test: { A: ["10.100.0.1"] }
  nvr.lumen.test: { A: ["10.100.0.30"] }
  cam-n1.lumen.test: { A: ["10.100.0.41"] }
  cam-n2.lumen.test: { A: ["10.100.0.42"] }
  cam-n3.lumen.test: { A: ["10.100.0.43"] }
  cam-n4.lumen.test: { A: ["10.100.0.44"] }
  cam-n5.lumen.test: { A: ["10.100.0.45"] }
  cam-n6.lumen.test: { A: ["10.100.0.46"] }

noise:
  nmap:
    base: 0
    flags: {}
  dig: 0
  curl: 0
  browse: 0
  ssh: 0

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
