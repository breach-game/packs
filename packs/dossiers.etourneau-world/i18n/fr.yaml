file.readme: "Poste Ligne Rouge. Dossier : Étourneau. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT PL-2027-118\nClient : Parcs Lumen, exploitant de parkings. Périmètre : *.lumen.test, 10.100.0.0/24.\nObjet : le fournisseur d'accès de Parcs Lumen signale que son adresse attaque d'autres machines sur Internet. Ligne Rouge aide Parcs Lumen à trouver lesquelles de ses machines sont en cause, à les nettoyer et à fermer la porte.\nDispositif convenu : défense uniquement. Lecture du journal de flux de la passerelle, mesures validées par la direction et passées par `contain`.\nSigné : la directrice technique de Parcs Lumen."
ada.outOfScope: "Stop. Cette cible est hors du mandat PL-2027-118. Même pour défendre, hors mandat, c'est un délit (article 323-1 du Code pénal)."
