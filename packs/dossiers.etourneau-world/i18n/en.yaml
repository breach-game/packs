file.readme: "Ligne Rouge workstation. Case file: Étourneau. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE PL-2027-118\nClient: Lumen Car Parks, car park operator. Scope: *.lumen.test, 10.100.0.0/24.\nPurpose: Lumen's Internet provider reports that its address is attacking other machines on the Internet. Ligne Rouge helps Lumen find which of its machines are involved, clean them up and close the door.\nAgreed set-up: defence only. Reading the gateway's flow log, measures approved by management and run through `contain`.\nSigned: the technical director of Lumen Car Parks."
ada.outOfScope: "Stop. This target is outside mandate PL-2027-118. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
