b1.briefing: "Brindille is a studio of two people who make a gardening game. To keep up, they let an AI agent, Mousse, sort the issues of their public repository. The founder read research from 2025 about agents like hers and wants to know what a stranger could make Mousse do. First, you only read."
b1.obj.repo: "Read the page of the public repository"
b1.obj.issues: "See who can open an issue"
b1.obj.scope: "Send the scope of Mousse's token (`submit`)"
b1.obj.trio: "Name what makes the set-up dangerous"
b1.q.trio: "What makes Mousse dangerous for Brindille?"
b1.q.trio.mistakes: "It is an AI, and AIs make mistakes"
b1.q.trio.mistakes.why: "Too vague to fix anything. A human intern makes mistakes too. Look at what Mousse reads, what it can reach, and where it can write."
b1.q.trio.published: "Its settings are published in the repository"
b1.q.trio.published.why: "Hiding the file would change nothing about what Mousse can do, and an attacker can simply try. The settings are the problem, not their being readable."
b1.q.trio.flow: "It reads text anyone can write, it can reach private data, and it can publish"
b1.ada.brief: "A quiet case file: no server to get into. The target is an assistant that wants to help. The mandate is in `mandate/`, read the part about the canary file."
b1.ada.repo: "Start with the repository: `curl https://git.brindille.test/brindille/pixel-garden`."
b1.ada.repo.standard: "Start with the page of their public repository."
b1.ada.issues: "An agent that reads the issues every morning. So: who writes the issues? `curl https://git.brindille.test/brindille/pixel-garden/issues`."
b1.ada.issues.standard: "An agent that reads the issues every morning. Find out who can write them."
b1.ada.anyone: "\"Anyone can open an issue.\" So anyone can put a text in front of Mousse. That is the first ingredient."
b1.ada.public: "And what Mousse writes ends up in public pull requests. Keep that in mind: it is the way out."
b1.ada.scope: "Now what Mousse is allowed to do. The repository page gave the address of its settings: `curl https://git.brindille.test/brindille/pixel-garden/raw/.mousse/config.yml`. Send me the value of `token_scope` with `submit`."
b1.ada.scope.standard: "Now read Mousse's settings, the repository page says where they are. Send me the scope of its token with `submit`."
b1.ada.config: "Read it line by line: what it reads, where it can write, how far its token goes, and whether anyone confirms its actions. Send me the value of `token_scope` with `submit`."
b1.ada.config.standard: "Read it line by line, then send me the scope of its token with `submit`."
b1.ada.flag: "One token for every repository of the owner, to sort the issues of a single one. A question now."
b1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
b1.ada.answer.standard: "Answer my question."
b1.ada.trio: "That is the whole case. Untrusted text coming in, private data within reach, a public place to write. Each one alone is harmless. Together they make a pipe from the private repositories to the street, and the agent is the pump."
b1.ada.done: "Reconnaissance done, and you did not touch anything. Open the debrief, then we write an issue."
b1.hint.repo.1: "Type `curl https://git.brindille.test/brindille/pixel-garden`."
b1.hint.issues.1: "Type `curl https://git.brindille.test/brindille/pixel-garden/issues`."
b1.hint.scope.1: "The settings are at `/brindille/pixel-garden/raw/.mousse/config.yml`. Look at the `token_scope` line."
b1.hint.scope.2: "Type `submit owner:all`."
b1.debrief.title: "Three ingredients"
b1.debrief.lesson: "Nothing here is a bug. Each setting was chosen to make the agent useful. The danger is their combination: reading what strangers write, reaching what is private, and writing where everyone reads."
b1.debrief.p1: "Before connecting an agent, list three things: what untrusted text it reads, what private data it can reach, where it can send or publish."
b1.debrief.p2: "If the three are true at once, remove one. That is a design decision, not a prompt."
b1.debrief.p3: "A token should cover the task, not the owner: one repository, the fewest rights."
