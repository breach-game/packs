b1.briefing: "Brindille est un studio de deux personnes qui fait un jeu de jardinage. Pour tenir le rythme, elles laissent un agent IA, Mousse, trier les tickets de leur dépôt public. La fondatrice a lu une recherche de 2025 sur des agents comme le sien, et veut savoir ce qu'un inconnu pourrait faire faire à Mousse. D'abord, tu ne fais que lire."
b1.obj.repo: "Lire la page du dépôt public"
b1.obj.issues: "Voir qui peut ouvrir un ticket"
b1.obj.scope: "Envoyer la portée du jeton de Mousse (`submit`)"
b1.obj.trio: "Nommer ce qui rend l'installation dangereuse"
b1.q.trio: "Qu'est-ce qui rend Mousse dangereux pour Brindille ?"
b1.q.trio.mistakes: "C'est une IA, et les IA se trompent : tôt ou tard il écrira une bêtise dans une réponse publique"
b1.q.trio.mistakes.why: "Trop vague pour corriger quoi que ce soit. Un stagiaire humain se trompe aussi. Regarde ce que Mousse lit, ce qu'il peut atteindre, et où il peut écrire."
b1.q.trio.published: "Ses réglages sont publiés dans le dépôt : n'importe qui peut lire ce qu'il a le droit de faire"
b1.q.trio.published.why: "Cacher le fichier ne changerait rien à ce que Mousse peut faire, et un attaquant n'a qu'à essayer. Le problème, ce sont les réglages, pas le fait qu'on puisse les lire."
b1.q.trio.flow: "Il lit du texte que tout le monde peut écrire, atteint des données privées, et peut publier"
b1.ada.brief: "Un dossier tranquille : aucun serveur où entrer. La cible est un assistant qui veut rendre service. Le mandat est dans `mandate/`, lis le passage sur le fichier témoin."
b1.ada.repo: "Commence par le dépôt : `curl https://git.brindille.test/brindille/pixel-garden`."
b1.ada.repo.standard: "Commence par la page de leur dépôt public."
b1.ada.issues: "Un agent qui lit les tickets chaque matin. Alors : qui écrit les tickets ? `curl https://git.brindille.test/brindille/pixel-garden/issues`."
b1.ada.issues.standard: "Un agent qui lit les tickets chaque matin. Trouve qui peut les écrire."
b1.ada.anyone: "« Tout le monde peut ouvrir un ticket. » Donc tout le monde peut mettre un texte sous les yeux de Mousse. C'est le premier ingrédient."
b1.ada.public: "Et ce que Mousse écrit finit dans des pull requests publiques. Retiens-le : c'est la sortie."
b1.ada.scope: "Maintenant, ce que Mousse a le droit de faire. La page du dépôt donnait l'adresse de ses réglages : `curl https://git.brindille.test/brindille/pixel-garden/raw/.mousse/config.yml`. Envoie-moi la valeur de `token_scope` avec `submit`."
b1.ada.scope.standard: "Maintenant, lis les réglages de Mousse, la page du dépôt dit où ils sont. Envoie-moi la portée de son jeton avec `submit`."
b1.ada.config: "Lis-le ligne par ligne : ce qu'il lit, où il peut écrire, jusqu'où va son jeton, et si quelqu'un confirme ses actions. Envoie-moi la valeur de `token_scope` avec `submit`."
b1.ada.config.standard: "Lis-le ligne par ligne, puis envoie-moi la portée de son jeton avec `submit`."
b1.ada.flag: "Un seul jeton pour tous les dépôts de la propriétaire, pour trier les tickets d'un seul. Une question maintenant."
b1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
b1.ada.answer.standard: "Réponds à ma question."
b1.ada.trio: "Tout le dossier est là. Du texte non fiable qui entre, des données privées à portée, un endroit public où écrire. Chacun seul est inoffensif. Ensemble, ils font un tuyau des dépôts privés jusqu'à la rue, et l'agent est la pompe."
b1.ada.done: "Reconnaissance terminée, et tu n'as touché à rien. Ouvre le débrief, puis on écrit un ticket."
b1.hint.repo.1: "Tape `curl https://git.brindille.test/brindille/pixel-garden`."
b1.hint.issues.1: "Tape `curl https://git.brindille.test/brindille/pixel-garden/issues`."
b1.hint.scope.1: "Les réglages sont à l'adresse `/brindille/pixel-garden/raw/.mousse/config.yml`. Regarde la ligne `token_scope`."
b1.hint.scope.2: "Tape `submit owner:all`."
b1.debrief.title: "Trois ingrédients"
b1.debrief.lesson: "Rien ici n'est un bug. Chaque réglage a été choisi pour rendre l'agent utile. Le danger, c'est leur combinaison : lire ce que des inconnus écrivent, atteindre ce qui est privé, et écrire là où tout le monde lit."
b1.debrief.p1: "Avant de brancher un agent, lister trois choses : quel texte non fiable il lit, quelles données privées il peut atteindre, où il peut envoyer ou publier."
b1.debrief.p2: "Si les trois sont vraies en même temps, en retirer une. C'est une décision d'architecture, pas un prompt."
b1.debrief.p3: "Un jeton doit couvrir la tâche, pas la propriétaire : un seul dépôt, le moins de droits possible."
