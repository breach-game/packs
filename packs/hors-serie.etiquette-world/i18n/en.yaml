park.title: "Parking · Brumevaux"
park.h1: "Paying for parking"
park.p1: "Three ways to pay, and only three:"
park.l1: "At the meter, in coins or by contactless card."
park.l2: "With the official Brumevaux Parking app, downloaded from your phone's app store."
park.l3: "At the municipal police desk."
park.p2: "The small blue QR code printed on every meter leads to this information page. It is never used to pay."
