file.mandate: "MANDATE BV-2029-114\nClient: Town of Brumevaux, IT department. Scope: *.brumevaux.test, 10.114.0.0/24, and the domain vallon-liens.example for public lookups only (whois, dig).\nPurpose: misleading QR codes reported in town and at the town hall. Ligne Rouge helps understand, respond and write the rules.\nAgreed set-up: defence only. QR codes are read, never followed. No fraudulent page is opened. The app received by parcel is examined on the isolated bench only, never installed.\nSigned: the chief executive of the Town of Brumevaux."
ada.outOfScope: "Stop. That domain is not in mandate BV-2029-114. We read the address in a QR code, we don't go and see what is at the end of it: visiting a scammer's site tells them the code works, and outside the mandate it is an offence (article 323-1 of the French Penal Code)."
