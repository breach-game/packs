park.title: "Stationnement · Brumevaux"
park.h1: "Payer son stationnement"
park.p1: "Trois façons de payer, et seulement trois :"
park.l1: "À l'horodateur, en pièces ou par carte sans contact."
park.l2: "Avec l'application officielle Brumevaux Stationnement, téléchargée depuis le magasin d'applications de votre téléphone."
park.l3: "Au guichet de la police municipale."
park.p2: "Le petit QR code bleu imprimé sur chaque horodateur mène à cette page d'information. Il ne sert jamais à payer."
