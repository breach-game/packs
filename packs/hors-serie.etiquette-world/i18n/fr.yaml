file.readme: "Poste Ligne Rouge. Hors-série : L'Étiquette. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT BV-2029-114\nClient : Ville de Brumevaux, service informatique. Périmètre : *.brumevaux.test, 10.114.0.0/24, et le domaine vallon-liens.example en consultation publique seulement (whois, dig).\nObjet : des QR codes trompeurs signalés en ville et à la mairie. Ligne Rouge aide à comprendre, à répondre et à écrire les règles.\nCadre convenu : défense seulement. Les QR codes sont lus, jamais suivis. Aucune page frauduleuse n'est ouverte. L'appli reçue par colis n'est examinée que sur le banc isolé, jamais installée.\nSigné : le directeur général des services de la Ville de Brumevaux."
ada.outOfScope: "Stop. Ce domaine n'est pas dans le mandat BV-2029-114. On lit l'adresse d'un QR code, on ne va pas voir ce qu'il y a au bout : visiter le site d'un escroc, c'est lui dire que le code marche, et hors mandat c'est un délit (article 323-1 du Code pénal)."
