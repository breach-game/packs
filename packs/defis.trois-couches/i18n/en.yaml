d3.briefing: "On a front-desk computer, a program `majservice` nobody installed, and a certificate next to it. The team copied them into `prelevement/`. Do not run them: read them."
d3.obj.host: "The name the program calls"
d3.obj.backup: "The other name its certificate covers"
d3.obj.block: "Say what to block"
d3.q.host: "Which name does the program contact?"
d3.q.backup: "Which other name does the certificate cover?"
d3.q.block: "What does Polygone block?"
d3.q.block.both: "Both names on the certificate, at the proxy and the DNS"
d3.q.block.delete: "Nothing: deleting the program from this computer is enough"
d3.q.block.delete.why: "Other computers may have it. Blocking it on the network also protects the ones not found yet."
d3.q.block.first: "Only the name the program calls"
d3.q.block.first.why: "The certificate announces a second name: the spare wheel, ready as soon as the first one falls."
d3.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d3.ada.done: "A Base64 string in the middle of an executable, a certificate covering two names. It was all written inside, you only had to read without running."
d3.debrief.title: "Three layers"
d3.debrief.lesson: "An unknown program is read before it is run. Its strings often give away its configuration, barely hidden in Base64, and its certificate announces the spare names the attacker planned."
d3.debrief.p1: "Analyse a suspect file without running it: `file`, `strings`, then whatever you find in it."
d3.debrief.p2: "Read every name on a certificate (the Subject Alternative Name field), not only the first one."
d3.debrief.p3: "Block on the network what you find, to protect computers not yet examined as well."
