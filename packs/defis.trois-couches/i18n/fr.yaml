d3.briefing: "Sur un poste de l'accueil, un programme `majservice` que personne n'a installé, et un certificat à côté. L'équipe les a copiés dans `prelevement/`. Ne les lance pas : lis-les."
d3.obj.host: "Le nom que le programme appelle"
d3.obj.backup: "L'autre nom que couvre son certificat"
d3.obj.block: "Dire quoi bloquer"
d3.q.host: "Quel nom le programme contacte-t-il ?"
d3.q.backup: "Quel autre nom le certificat couvre-t-il ?"
d3.q.block: "Que bloque Polygone ?"
d3.q.block.both: "Les deux noms du certificat, au proxy et au DNS"
d3.q.block.delete: "Rien : effacer le programme de ce poste suffit"
d3.q.block.delete.why: "D'autres postes peuvent l'avoir. Le bloquer au réseau protège aussi ceux qu'on n'a pas encore trouvés."
d3.q.block.first: "Seulement le nom que le programme appelle"
d3.q.block.first.why: "Le certificat annonce un second nom : c'est la roue de secours, prête à servir dès que le premier tombe."
d3.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
d3.ada.done: "Une chaîne en Base64 au milieu d'un exécutable, un certificat qui couvre deux noms. Tout était écrit dedans, il fallait juste lire sans lancer."
d3.debrief.title: "Trois couches"
d3.debrief.lesson: "Un programme inconnu se lit avant de se lancer. Ses chaînes de caractères trahissent souvent sa configuration, à peine cachée en Base64, et son certificat annonce les noms de secours que l'attaquant a prévus."
d3.debrief.p1: "Analyser un fichier suspect sans l'exécuter : `file`, `strings`, puis ce qu'on y trouve."
d3.debrief.p2: "Lire tous les noms d'un certificat (champ Subject Alternative Name), pas seulement le premier."
d3.debrief.p3: "Bloquer au réseau ce que l'on découvre, pour protéger aussi les postes pas encore examinés."
