m2.briefing: "Quelques minutes plus tard. Les camions roulent, mais 312 tournées pointent vers des zones qui n'existent plus : la migration de la nuit a réécrit la table des zones, et aucun retour arrière ne la remet. Il faut repartir d'une sauvegarde. Elles sont sur `sauvegarde.gavotte.test`, une archive par nuit."
m2.obj.good: "Trouver la dernière sauvegarde qui contient vraiment la base"
m2.obj.silent: "Comprendre pourquoi personne n'a rien vu"
m2.obj.restore: "Restaurer la table des zones"
m2.obj.check: "Vérifier dans le journal du service que les tournées pointent vers des zones connues"
m2.q.good: "Quelle est la date de la dernière sauvegarde qui contient la base des tournées ? (au format AAAA-MM-JJ)"
m2.q.silent: "Trois nuits de sauvegardes vides, et le service a dit « Deactivated successfully » chaque fois. Pourquoi ?"
m2.q.silent.exitcode: "Le script ignore l'erreur de rsync et se termine comme un succès"
m2.q.silent.disk: "Le disque du serveur de sauvegarde était plein depuis la nuit du 20"
m2.q.silent.disk.why: "Les archives existent, elles sont juste presque vides, et le journal dit « Permission denied », pas « No space left »."
m2.q.silent.nobackup: "La tâche de sauvegarde nocturne ne se lançait plus depuis le 20"
m2.q.silent.nobackup.why: "Elle a tourné chaque nuit à 2 h, le journal le montre. Elle a archivé un message d'erreur au lieu de la base, et s'est déclarée réussie."
m2.contain.restore: "Restaurer la table des zones depuis l'archive du 19 novembre, puis ressaisir trois jours de changements depuis les fiches des dépôts (deux heures d'équipe)"
m2.ada.brief: "Va voir les archives : `ssh astreinte@sauvegarde.gavotte.test`, puis `ls -l /srv/sauvegardes`. Regarde les tailles."
m2.ada.g.good: "Ouvre-les sans les extraire : `tar -tzvf /srv/sauvegardes/tournees-2027-11-22.tgz`, puis les plus anciennes. Laquelle contient `base/` ? `answer good <date>`."
m2.ada.g.good.standard: "Une archive qui existe n'est pas une sauvegarde. Regarde ce que chacune contient. `answer good`."
m2.ada.good: "Le 19. Les trois nuits suivantes ont archivé un message d'erreur, rien d'autre. On perd trois jours de changements de zones, que les dépôts devront ressaisir."
m2.ada.g.silent: "Lis le journal de la sauvegarde : `journalctl -u sauvegarde-nuit`. Que dit rsync, et que dit systemd juste après ?"
m2.ada.g.silent.standard: "Le journal de la sauvegarde nocturne raconte trois nuits d'erreurs. Pourquoi personne ne l'a lu ?"
m2.ada.silent: "« code 23 » puis « Deactivated successfully ». Le script avale l'erreur, systemd ne voit qu'un succès, et personne n'a jamais essayé de restaurer."
m2.ada.g.restore: "Quitte le serveur (`exit`), puis `contain restore zones`. Deux heures d'équipe, c'est le prix des trois nuits perdues."
m2.ada.g.restore.standard: "Restaure la table depuis la bonne archive. `contain` pour la mesure."
m2.ada.restored: "Restauration lancée, les dépôts ressaisissent leurs fiches. Va lire ce que dit le service."
m2.ada.g.check: "`ssh astreinte@planif.gavotte.test`, puis `journalctl -u tournees -n 3`."
m2.ada.g.check.standard: "Vérifie dans le journal du service qu'aucune tournée ne pointe plus vers une zone inconnue."
m2.ada.done: "Zéro tournée orpheline. La base est saine, avec trois jours ressaisis à la main. Il reste la cellule de crise, et ce qu'on change pour que ça n'arrive plus."
m2.hint.good.1: "Les archives du 20, du 21 et du 22 ne contiennent que ERREUR.txt."
m2.hint.good.2: "`answer good 2027-11-19`"
m2.hint.silent.1: "« rsync error … (code 23) » suivi de « Deactivated successfully »."
m2.hint.silent.2: "`answer exitcode`"
m2.hint.restore.1: "`exit`, puis `contain restore zones`"
m2.hint.check.1: "`ssh astreinte@planif.gavotte.test` puis `journalctl -u tournees -n 3`"
m2.debrief.title: "La sauvegarde de Schrödinger"
m2.debrief.lesson: "Le 20 novembre, un changement de droits a empêché rsync de lire la base. Le script de sauvegarde ignorait son code de sortie : chaque nuit, il archivait un message d'erreur et se déclarait réussi. Tant que personne n'essayait de restaurer, la sauvegarde était à la fois bonne et vide. Mardi, on a ouvert la boîte."
m2.debrief.p1: "Tester une restauration régulièrement : une sauvegarde jamais restaurée n'est qu'une hypothèse."
m2.debrief.p2: "Faire échouer bruyamment un script de sauvegarde (code de sortie, taille minimale de l'archive, alerte)."
m2.debrief.p3: "Avant une migration de base, prendre une sauvegarde dédiée et vérifier qu'elle se relit."
