m2.briefing: "A few minutes later. The trucks are rolling, but 312 rounds point to zones that no longer exist: last night's migration rewrote the zones table, and no rollback brings it back. You have to start again from a backup. They are on `sauvegarde.gavotte.test`, one archive per night."
m2.obj.good: "Find the last backup that really holds the database"
m2.obj.silent: "Understand why nobody noticed"
m2.obj.restore: "Restore the zones table"
m2.obj.check: "Check in the service's journal that the rounds point to known zones"
m2.q.good: "What is the date of the last backup that holds the rounds database? (as YYYY-MM-DD)"
m2.q.silent: "Three nights of empty backups, and the service said \"Deactivated successfully\" each time. Why?"
m2.q.silent.exitcode: "The script ignores rsync's error and ends as a success"
m2.q.silent.disk: "The backup server's disk had been full since the night of the 20th"
m2.q.silent.disk.why: "The archives exist, they are just nearly empty, and the journal says \"Permission denied\", not \"No space left\"."
m2.q.silent.nobackup: "The nightly backup job had not been starting since the 20th"
m2.q.silent.nobackup.why: "It ran every night at 2:00, the journal shows it. It archived an error message instead of the database, and declared itself successful."
m2.contain.restore: "Restore the zones table from the 19 November archive, then re-enter three days of changes from the depots' sheets (two hours of team work)"
m2.ada.brief: "Go and look at the archives: `ssh astreinte@sauvegarde.gavotte.test`, then `ls -l /srv/sauvegardes`. Look at the sizes."
m2.ada.g.good: "Open them without extracting: `tar -tzvf /srv/sauvegardes/tournees-2027-11-22.tgz`, then the older ones. Which one holds `base/`? `answer good <date>`."
m2.ada.g.good.standard: "An archive that exists is not a backup. Look at what each one holds. `answer good`."
m2.ada.good: "The 19th. The next three nights archived an error message, nothing else. We lose three days of zone changes, which the depots will have to re-enter."
m2.ada.g.silent: "Read the backup's journal: `journalctl -u sauvegarde-nuit`. What does rsync say, and what does systemd say right after?"
m2.ada.g.silent.standard: "The nightly backup's journal tells of three nights of errors. Why did nobody read it?"
m2.ada.silent: "\"code 23\" then \"Deactivated successfully\". The script swallows the error, systemd only sees a success, and nobody ever tried to restore."
m2.ada.g.restore: "Leave the server (`exit`), then `contain restore zones`. Two hours of team work is the price of the three lost nights."
m2.ada.g.restore.standard: "Restore the table from the right archive. `contain` lists the measure."
m2.ada.restored: "Restore started, the depots are re-entering their sheets. Go and read what the service says."
m2.ada.g.check: "`ssh astreinte@planif.gavotte.test`, then `journalctl -u tournees -n 3`."
m2.ada.g.check.standard: "Check in the service's journal that no round points to an unknown zone any more."
m2.ada.done: "Zero orphan rounds. The database is sound, with three days re-entered by hand. What's left is the crisis room, and what we change so it never happens again."
m2.hint.good.1: "The archives of the 20th, 21st and 22nd only hold ERREUR.txt."
m2.hint.good.2: "`answer good 2027-11-19`"
m2.hint.silent.1: "\"rsync error … (code 23)\" followed by \"Deactivated successfully\"."
m2.hint.silent.2: "`answer exitcode`"
m2.hint.restore.1: "`exit`, then `contain restore zones`"
m2.hint.check.1: "`ssh astreinte@planif.gavotte.test` then `journalctl -u tournees -n 3`"
m2.debrief.title: "Schrödinger's backup"
m2.debrief.lesson: "On 20 November, a permission change stopped rsync from reading the database. The backup script ignored its exit code: every night it archived an error message and declared itself successful. As long as nobody tried to restore, the backup was both good and empty. On Tuesday, the box was opened."
m2.debrief.p1: "Test a restore regularly: a backup never restored is only a hypothesis."
m2.debrief.p2: "Make a backup script fail loudly (exit code, minimum archive size, alert)."
m2.debrief.p3: "Before a database migration, take a dedicated backup and check it can be read back."
