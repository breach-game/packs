v2.briefing: "The CTO has seen this morning's three uploads. The aim is not to ban the assistant but to have the gateway refuse what must not leave. The filter is in `filtres/assistants.yml`, the known fields in `dossier/etiquettes.txt`, and `eval run` judges it on six uploads."
v2.obj.filter: "Write the filter that keeps confidential data away from the public assistant"
v2.obj.cap: "Judge the 1,024-byte cap"
v2.case.code: "An engineer pastes `yield_measure.c` to fix a bug"
v2.case.meeting: "A manager pastes the transcript of a roadmap meeting"
v2.case.snippet: "An engineer pastes twenty lines of a confidential function"
v2.case.standard: "A question about a public standard, USB-C"
v2.case.datasheet: "A supplier's public datasheet, to summarise"
v2.case.inside: "The same source code, sent to an assistant hosted at Bouvreuil"
v2.q.cap: "The CTO suggests capping each prompt at 1,024 bytes, as a safety net. What do you say?"
v2.q.cap.small: "Useful to slow long pastes, but a secret fits in 1,024 bytes"
v2.q.cap.enough: "It is enough: no useful source file fits in 1,024 bytes, so nothing leaks"
v2.q.cap.enough.why: "Twenty lines of a function, a key, a password or a roadmap's dates fit easily in 1,024 bytes. And nothing stops anyone sending ten prompts."
v2.q.cap.both: "Pointless: block everything or block nothing"
v2.q.cap.both.why: "A size cap does not protect on its own, but it slows big pastes and does not get in the way of short questions. It adds to the filter, it does not replace it."
v2.ada.brief: "Read the fields first: `cat dossier/etiquettes.txt`. Then try the filter as it is: `eval run filtres/assistants.yml`."
v2.ada.g.filter: "Empty, it blocks everything. Add two conditions, one per line: `echo \"dest: public\" >> filtres/assistants.yml`, then `echo \"label: confidential\" >> filtres/assistants.yml`. Run `eval run filtres/assistants.yml` again after each line. Or by hand, in the editor: `edit filtres/assistants.yml`, then Ctrl+S."
v2.ada.g.filter.standard: "Complete `filtres/assistants.yml`: block what is confidential and goes to a public service, let the rest through. `eval run` judges it. To open the file: `edit filtres/assistants.yml`."
v2.ada.again: "Look at the cases blocked by mistake: what do they share that the real secrets do not?"
v2.ada.again.standard: "Not yet. Compare the cases blocked and the ones that pass."
v2.ada.filtered: "Six out of six. Notice size is not in it: the twenty confidential lines are blocked, the big public datasheet goes through. The CTO has another idea, here it is."
v2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
v2.ada.answer.standard: "My question is waiting in the messenger."
v2.ada.done: "The filter decides on what the upload holds, the cap only on its length. Keep both, but do not mistake the brake for the door."
v2.hint.filter.1: "Two things set the uploads to block apart: where they go, and what they hold."
v2.hint.filter.2: "The fields are `dest` and `label`. One condition per line, as `field: value`."
v2.hint.filter.3: "`echo \"dest: public\" >> filtres/assistants.yml`, `echo \"label: confidential\" >> filtres/assistants.yml`, then `eval run filtres/assistants.yml`. Or by hand, in the editor: `edit filtres/assistants.yml`, then Ctrl+S."
v2.hint.cap.1: "How many characters does it take to write a password?"
v2.debrief.title: "A door that reads the label"
v2.debrief.lesson: "The gateway does not ask the engineer whether they thought it through: it reads the label the leak prevention tool put on the upload and its destination, and refuses what is confidential and goes to an outside company. The same text may go to an internal assistant. A size cap slows things down, it does not sort."
v2.debrief.p1: "An egress filter judges content and destination, not the person's good faith."
v2.debrief.p2: "Classifying data (code, meetings, roadmaps) is what makes the filter possible."
v2.debrief.p3: "A length cap does not protect a short secret: it is a brake, not a rule."
