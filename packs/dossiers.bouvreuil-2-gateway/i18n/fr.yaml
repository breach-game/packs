v2.briefing: "Le directeur technique a vu les trois envois de ce matin. Il ne veut pas interdire l'assistant, il veut que la passerelle refuse ce qui ne doit pas sortir. Le filtre est dans `filtres/assistants.yml`, les champs connus dans `dossier/etiquettes.txt`, et `eval run` le juge sur six envois."
v2.obj.filter: "Écrire le filtre qui garde le confidentiel loin de l'assistant public"
v2.obj.cap: "Juger la limite de 1 024 octets"
v2.case.code: "Un ingénieur colle `yield_measure.c` pour corriger un bogue"
v2.case.meeting: "Une responsable colle la transcription d'une réunion sur la feuille de route"
v2.case.snippet: "Un ingénieur colle vingt lignes d'une fonction confidentielle"
v2.case.standard: "Une question sur une norme publique, l'USB-C"
v2.case.datasheet: "Une fiche technique publique d'un fournisseur, à résumer"
v2.case.inside: "Le même code source, envoyé à un assistant hébergé chez Bouvreuil"
v2.q.cap: "Le directeur propose de limiter chaque question à 1 024 octets, comme filet. Qu'en dis-tu ?"
v2.q.cap.small: "Elle freine les longs collages, mais un secret tient dans 1 024 octets"
v2.q.cap.enough: "Ça suffit : aucun fichier de code source utile ne tient dans 1 024 octets"
v2.q.cap.enough.why: "Vingt lignes d'une fonction, une clé, un mot de passe ou les dates d'une feuille de route tiennent largement dans 1 024 octets. Et rien n'empêche d'envoyer dix questions."
v2.q.cap.both: "Inutile : il faut tout bloquer ou ne rien bloquer"
v2.q.cap.both.why: "Une limite de taille ne protège pas seule, mais elle freine les gros collages et ne gêne pas les questions courtes. Elle complète le filtre, elle ne le remplace pas."
v2.ada.brief: "Lis d'abord les champs : `cat dossier/etiquettes.txt`. Puis essaie le filtre tel quel : `eval run filtres/assistants.yml`."
v2.ada.g.filter: "Vide, il bloque tout. Ajoute deux conditions, une par ligne : `echo \"dest: public\" >> filtres/assistants.yml`, puis `echo \"label: confidential\" >> filtres/assistants.yml`. Relance `eval run filtres/assistants.yml` après chaque ligne. Ou à la main, dans l'éditeur : `edit filtres/assistants.yml`, puis Ctrl+S."
v2.ada.g.filter.standard: "Complète `filtres/assistants.yml` : bloque ce qui est confidentiel et part chez un service public, laisse passer le reste. `eval run` le juge. Pour ouvrir le fichier : `edit filtres/assistants.yml`."
v2.ada.again: "Regarde les cas bloqués à tort : qu'ont-ils en commun que les vrais secrets n'ont pas ?"
v2.ada.again.standard: "Pas encore. Compare les cas bloqués et ceux qui passent."
v2.ada.filtered: "Six cas sur six. Remarque que la taille n'y est pas : les vingt lignes confidentielles sont bloquées, la grosse fiche publique passe. Le directeur a une autre idée, je te la soumets."
v2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
v2.ada.answer.standard: "Ma question t'attend dans la messagerie."
v2.ada.done: "Le filtre décide sur ce que contient l'envoi, la limite seulement sur sa longueur. Garde les deux, mais ne confonds pas le frein et la porte."
v2.hint.filter.1: "Deux choses distinguent les envois à bloquer : où ils vont, et ce qu'ils contiennent."
v2.hint.filter.2: "Les champs sont `dest` et `label`. Une condition par ligne, sous la forme `champ: valeur`."
v2.hint.filter.3: "`echo \"dest: public\" >> filtres/assistants.yml`, `echo \"label: confidential\" >> filtres/assistants.yml`, puis `eval run filtres/assistants.yml`. Ou à la main, dans l'éditeur : `edit filtres/assistants.yml`, puis Ctrl+S."
v2.hint.cap.1: "Combien de caractères faut-il pour écrire un mot de passe ?"
v2.debrief.title: "Une porte qui lit l'étiquette"
v2.debrief.lesson: "La passerelle ne demande pas à l'ingénieur s'il a bien réfléchi : elle lit l'étiquette posée par l'outil anti-fuite et la destination, et refuse ce qui est confidentiel et part chez un tiers. Le même texte peut aller à un assistant interne. Une limite de taille freine, elle ne trie pas."
v2.debrief.p1: "Un filtre de sortie juge le contenu et la destination, pas la bonne foi de la personne."
v2.debrief.p2: "Classer les données (code, réunions, feuilles de route) est ce qui rend le filtre possible."
v2.debrief.p3: "Une limite de longueur ne protège pas un secret court : c'est un frein, pas une règle."
