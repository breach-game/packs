s1.briefing: "Sittelle reçoit des messages de visiteurs furieux : en voulant acheter un billet depuis leur téléphone, ils se sont retrouvés sur un site de paris. L'équipe a tout essayé depuis ses ordinateurs : rien. Le site de Sittelle n'a pas changé depuis septembre. Alors qu'est-ce qui a changé ?"
s1.obj.inventory: "Faire l'inventaire des scripts du site"
s1.obj.owner: "Découvrir à qui appartient le script tiers"
s1.obj.phone: "Télécharger le script comme un téléphone"
s1.obj.why: "Dire pourquoi l'équipe n'a rien vu"
s1.q.why: "L'équipe de Sittelle a testé cent fois sans rien voir. Pourquoi ?"
s1.q.why.targeted: "Le code ajouté ne vise que les téléphones, jamais un administrateur, et une fois par jour"
s1.q.why.down: "Le service tiers était en panne au moment précis où l'équipe faisait ses essais"
s1.q.why.down.why: "Le service répond très bien, et vite. Il répond simplement autre chose selon qui demande."
s1.q.why.blocked: "Le bloqueur de publicités de l'équipe arrêtait la redirection avant qu'elle parte"
s1.q.why.blocked.why: "Même sans bloqueur, un ordinateur reçoit la version propre. Le tri se fait chez le service tiers, avant d'envoyer le fichier."
s1.ada.brief: "Le site de Sittelle n'a pas changé, mais il charge peut-être des fichiers qui ne sont pas à lui. Regarde sa page : `curl https://www.sittelle.test/`."
s1.ada.g.inventory: "La source de la page cite un inventaire. Lis-le : `curl https://www.sittelle.test/assets/manifest.json`."
s1.ada.g.inventory.standard: "Trouve la liste des scripts que charge le site."
s1.ada.inventory: "Trois scripts. Deux sont à Sittelle. Le troisième vient d'un service gratuit, chargé directement depuis chez lui, sans empreinte pour vérifier qu'il n'a pas changé. Sittelle exécute chez chaque visiteur ce que ce service décide de servir."
s1.ada.g.owner: "Qui tient ce service aujourd'hui ? `whois compat-cdn.test`."
s1.ada.g.owner.standard: "Découvre à qui appartient ce service, et depuis quand."
s1.ada.owner: "Le domaine a changé de mains en février. Les bénévoles qui maintenaient la bibliothèque l'ont cédé, et 104 000 sites chargent toujours le script, sans savoir que le propriétaire a changé."
s1.ada.g.phone: "Télécharge le script : `curl https://cdn.compat-cdn.test/v3/compat.min.js`. Puis comme un téléphone, qui l'annonce dans un en-tête : `curl -H \"Sec-CH-UA-Mobile: ?1\" https://cdn.compat-cdn.test/v3/compat.min.js`."
s1.ada.g.phone.standard: "Télécharge le script comme le ferait un ordinateur, puis comme le ferait un téléphone. Les navigateurs mobiles l'annoncent dans un en-tête."
s1.ada.same: "Propre, depuis un ordinateur. Maintenant, comme un téléphone : `curl -H \"Sec-CH-UA-Mobile: ?1\" https://cdn.compat-cdn.test/v3/compat.min.js`."
s1.ada.same.standard: "Propre. Maintenant, demande-le comme un téléphone."
s1.ada.phone: "Le même fichier, à la même adresse, avec quelques lignes de plus pour les téléphones. On n'ira pas voir le site de paris : on sait ce qu'il y a au bout."
s1.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
s1.ada.answer.standard: "Ma question t'attend dans la messagerie."
s1.ada.done: "Oui. Le code modifié se cache de ceux qui pourraient le voir : les administrateurs, les ordinateurs, les visiteurs qui reviennent. Sittelle n'a rien changé, et pourtant son site a changé. Passe au débrief."
s1.hint.inventory.1: "Le code source de la page contient un commentaire."
s1.hint.inventory.2: "`curl https://www.sittelle.test/assets/manifest.json`"
s1.hint.owner.1: "`whois compat-cdn.test`, et regarde les dates."
s1.hint.phone.1: "Un même fichier peut être servi différemment selon les en-têtes de la requête. `curl -H` en ajoute un."
s1.hint.phone.2: "`curl -H \"Sec-CH-UA-Mobile: ?1\" https://cdn.compat-cdn.test/v3/compat.min.js`"
s1.hint.why.1: "Lis le commentaire ajouté à la fin du fichier."
s1.debrief.title: "Ce qu'on charge, on l'exécute"
s1.debrief.lesson: "Le site de Sittelle n'avait pas changé d'une ligne. Mais il chargeait, chez chaque visiteur, un script servi par quelqu'un d'autre. Le jour où ce quelqu'un a changé, le site a changé avec lui, et le nouveau code a choisi soigneusement à qui se montrer."
s1.debrief.p1: "Tenir l'inventaire des scripts tiers, et savoir à qui ils appartiennent."
s1.debrief.p2: "Un script chargé depuis un autre domaine s'exécute avec les mêmes droits que le vôtre."
s1.debrief.p3: "Pour reproduire, se mettre à la place de la victime : un téléphone, un nouveau visiteur, sans session."
