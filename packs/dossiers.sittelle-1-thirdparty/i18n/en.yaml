s1.briefing: "Sittelle gets angry messages from visitors: trying to buy a ticket from their phone, they ended up on a betting site. The team tried everything from its computers: nothing. Sittelle's site has not changed since September. So what has?"
s1.obj.inventory: "List the site's scripts"
s1.obj.owner: "Find out who owns the third-party script"
s1.obj.phone: "Download the script like a phone"
s1.obj.why: "Say why the team saw nothing"
s1.q.why: "Sittelle's team tested a hundred times and saw nothing. Why?"
s1.q.why.targeted: "The added code only targets phones, never an admin, and once a day"
s1.q.why.down: "The third-party service was down at the very moment the team ran its tests"
s1.q.why.down.why: "The service answers very well, and fast. It simply answers something else depending on who asks."
s1.q.why.blocked: "The team's ad blocker stopped the redirect before it left"
s1.q.why.blocked.why: "Even without a blocker, a computer gets the clean version. The sorting happens at the third-party service, before the file is sent."
s1.ada.brief: "Sittelle's site has not changed, but it may load files that are not its own. Look at its page: `curl https://www.sittelle.test/`."
s1.ada.g.inventory: "The page's source mentions an inventory. Read it: `curl https://www.sittelle.test/assets/manifest.json`."
s1.ada.g.inventory.standard: "Find the list of scripts the site loads."
s1.ada.inventory: "Three scripts. Two belong to Sittelle. The third comes from a free service, loaded straight from its servers, with no fingerprint to check it has not changed. Sittelle runs, in every visitor's browser, whatever this service decides to serve."
s1.ada.g.owner: "Who runs this service today? `whois compat-cdn.test`."
s1.ada.g.owner.standard: "Find out who owns this service, and since when."
s1.ada.owner: "The domain changed hands in February. The volunteers who maintained the library sold it, and 104,000 sites still load the script without knowing the owner changed."
s1.ada.g.phone: "Download the script: `curl https://cdn.compat-cdn.test/v3/compat.min.js`. Then like a phone, which says so in a header: `curl -H \"Sec-CH-UA-Mobile: ?1\" https://cdn.compat-cdn.test/v3/compat.min.js`."
s1.ada.g.phone.standard: "Download the script as a computer would, then as a phone would. Mobile browsers say so in a header."
s1.ada.same: "Clean, from a computer. Now like a phone: `curl -H \"Sec-CH-UA-Mobile: ?1\" https://cdn.compat-cdn.test/v3/compat.min.js`."
s1.ada.same.standard: "Clean. Now ask for it like a phone."
s1.ada.phone: "The same file, at the same address, with a few more lines for phones. We will not visit the betting site: we know what is at the end."
s1.ada.answer: "Answer my question: click, or use `answer` in the terminal."
s1.ada.answer.standard: "My question is waiting in the messenger."
s1.ada.done: "Yes. The changed code hides from those who could see it: admins, computers, returning visitors. Sittelle changed nothing, and yet its site changed. On to the debrief."
s1.hint.inventory.1: "The page's source code holds a comment."
s1.hint.inventory.2: "`curl https://www.sittelle.test/assets/manifest.json`"
s1.hint.owner.1: "`whois compat-cdn.test`, and look at the dates."
s1.hint.phone.1: "The same file can be served differently depending on the request's headers. `curl -H` adds one."
s1.hint.phone.2: "`curl -H \"Sec-CH-UA-Mobile: ?1\" https://cdn.compat-cdn.test/v3/compat.min.js`"
s1.hint.why.1: "Read the comment added at the end of the file."
s1.debrief.title: "What you load, you run"
s1.debrief.lesson: "Sittelle's site had not changed by a single line. But it loaded, in every visitor's browser, a script served by somebody else. The day that somebody changed, the site changed with them, and the new code chose carefully whom to show itself to."
s1.debrief.p1: "Keep an inventory of third-party scripts, and know who owns them."
s1.debrief.p2: "A script loaded from another domain runs with the same rights as yours."
s1.debrief.p3: "To reproduce, put yourself in the victim's place: a phone, a new visitor, no session."
