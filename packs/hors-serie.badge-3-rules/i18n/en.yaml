b3.briefing: "Tuesday 13 March, 9 am. Badge B-0099 is switched off, workstation `cao-07` has gone for analysis, and the managing director wants rules that fit on one page. She has one condition: she does not want a company where people eye each other with suspicion. IT has reviewed every badge: `acces/revue-badges.csv`."
b3.obj.stale: "Count the badges that still open doors when they should not"
b3.obj.rules: "Write the rules for the door, badges and USB sticks"
b3.obj.stranger: "Say what to do when a stranger has no badge"
b3.obj.story: "Put Monday morning in order"
b3.q.stale: "How many badges that are lost, returned or never returned are still `active`?"
b3.q.stranger: "Someone you do not know follows you to the door, with no visible badge. What do you do?"
b3.q.stranger.walk: "I offer to walk them over to reception"
b3.q.stranger.polite: "I hold the door: refusing would be rude"
b3.q.stranger.polite.why: "That is what happened on Monday at 8.02 am. There are other ways to be polite: reception is there for that, and a real visitor is better off."
b3.q.stranger.later: "I let them in and tell someone afterwards"
b3.q.stranger.later.why: "Afterwards, they are already inside, and whoever you tell does not know where. On Monday, twenty-six minutes were enough."
b3.check.revoked: "A lost or returned badge is switched off the same day"
b3.check.review: "Every badge is reviewed each quarter"
b3.check.alarm: "A door held open sounds an alarm after 15 seconds"
b3.check.visitors: "A visitor is escorted from reception"
b3.check.usb: "USB storage is closed where it is not needed"
b3.check.found: "A found device goes to IT without being plugged in"
b3.check.works: "Staff still come in with their badge"
b3.tl.text: "From the lost badge to Monday morning"
b3.tl.reported: "A cleaning badge is reported lost, and stays active"
b3.tl.door: "An employee holds the north entrance door"
b3.tl.room: "The lost badge is refused three times at the server room"
b3.tl.handed: "A stick found in the car park is handed in at reception"
b3.tl.opened: "Another stick is opened on a design office workstation"
b3.tl.revoked: "The lost badge is switched off"
b3.tl.isolated: "The workstation is isolated from the network"
b3.ada.brief: "We start by counting. `cat acces/revue-badges.csv`: the `situation` column says where the badge is, the `status` column says whether it still opens doors."
b3.ada.g.stale: "`grep -v \"in use\" acces/revue-badges.csv` shows the badges no longer in use. Count those still `active`, then `answer stale <number>`."
b3.ada.g.stale.standard: "Count in the review the lost, returned or never returned badges that are still active."
b3.ada.stale: "Four more. A trainee who left in June, an employee who left in October and never gave theirs back, a lost visitor badge, a contractor whose contract ended two years ago. Monday's badge was not an oversight: it was the habit. The rules: `acces/reglement.yml`."
b3.ada.g.rules: "`cat acces/reglement.yml`: each line gives its possible values after the `#`. Pick the safest with `sed -i` or `edit`, then `verify`."
b3.ada.g.rules.standard: "Fix `acces/reglement.yml`, then run `verify`."
b3.ada.almost: "Not yet. `verify` tells you which lines are not right."
b3.ada.rules: "Six lines, and look at what they share: none asks anybody to be suspicious. The badge is switched off because someone is in charge of it, the door rings by itself, the visitor is escorted because that is the custom, the USB port is closed by a setting. We are not asking people to stop being kind. One last question, because there will always be the door."
b3.ada.g.stranger: "Answer my question: what to do when a stranger has no badge."
b3.ada.stranger: "Yes. \"Shall I walk you to reception?\": it is polite, it helps a real visitor, and whoever has no business here suddenly finds they have the wrong building."
b3.ada.g.story: "`timeline lundi` shows the events shuffled. Answer with their ids in order: `timeline lundi <id> <id> …`."
b3.ada.g.story.standard: "Put Monday in order, from the loss report to the workstation being isolated."
b3.ada.done: "The managing director pinned the page next to the coffee machine. The designer who had held the door asked whether they could write the line about reception themselves. It is done."
b3.hint.stale.1: "Four lines are not `in use` and end with `active`: B-0041, B-0073, B-0120, B-0188."
b3.hint.stale.2: "`answer stale 4`"
b3.hint.rules.1: "The expected values: `revoked-same-day`, `every-quarter`, `after-15-seconds`, `escorted-from-reception`, `blocked-unless-needed`, `handed-to-it-unplugged`."
b3.hint.rules.2: "For example `sed -i \"s/badge_review: never/badge_review: every-quarter/\" acces/reglement.yml`."
b3.hint.stranger.1: "Polite and safe at once. Type `answer walk`."
b3.hint.story.1: "The badge is reported lost weeks before. Monday: the door, the room, the stick handed in, the stick opened, then the two measures."
b3.hint.story.2: "`timeline lundi reported door room handed opened revoked isolated`"
b3.debrief.title: "The house rules"
b3.debrief.lesson: "Four other badges still opened doors for no reason. The rules that hold are those that rest on nobody's vigilance: a named owner, an alarm, a setting, a custom. And one sentence to say at the door."
b3.debrief.p1: "Review badges every quarter, like accounts: leavers, contractors, visitors."
b3.debrief.p2: "Prefer a setting to an instruction: door alarm, USB storage closed, escorted visitors."
b3.debrief.p3: "Give people a polite sentence for the door: \"shall I walk you to reception?\""
