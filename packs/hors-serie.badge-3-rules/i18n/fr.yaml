b3.briefing: "Mardi 13 mars, 9 h. Le badge B-0099 est désactivé, le poste `cao-07` est parti à l'analyse, et la gérante veut des règles qui tiennent sur une page. Elle a une condition : elle ne veut pas d'une entreprise où l'on se regarde de travers. L'informatique a passé en revue tous les badges : `acces/revue-badges.csv`."
b3.obj.stale: "Compter les badges qui ouvrent encore alors qu'ils ne devraient plus"
b3.obj.rules: "Écrire les règles de la porte, des badges et des clés USB"
b3.obj.stranger: "Dire quoi faire devant un inconnu sans badge"
b3.obj.story: "Remettre la matinée de lundi dans l'ordre"
b3.q.stale: "Combien de badges perdus, rendus ou jamais rendus sont encore `active` ?"
b3.q.stranger: "Quelqu'un que tu ne connais pas te suit vers la porte, sans badge visible. Que fais-tu ?"
b3.q.stranger.walk: "Je lui propose de l'accompagner jusqu'à l'accueil"
b3.q.stranger.polite: "Je lui tiens la porte : refuser serait impoli"
b3.q.stranger.polite.why: "C'est ce qui s'est passé lundi à 8 h 02. On peut être poli autrement : l'accueil est là pour ça, et un vrai visiteur y trouve son compte."
b3.q.stranger.later: "Je le laisse entrer et je préviens quelqu'un après"
b3.q.stranger.later.why: "Après, il est déjà dans les locaux, et celui que tu préviens ne sait pas où. Lundi, vingt-six minutes ont suffi."
b3.check.revoked: "Un badge perdu ou rendu est désactivé le jour même"
b3.check.review: "Tous les badges sont passés en revue chaque trimestre"
b3.check.alarm: "Une porte tenue ouverte sonne au bout de 15 secondes"
b3.check.visitors: "Un visiteur est accompagné depuis l'accueil"
b3.check.usb: "Le stockage USB est fermé là où il ne sert pas"
b3.check.found: "Un appareil trouvé est remis à l'informatique sans être branché"
b3.check.works: "Le personnel entre toujours avec son badge"
b3.tl.text: "La matinée de lundi chez Garance"
b3.tl.reported: "Un badge de ménage est déclaré perdu, et reste actif"
b3.tl.door: "Un employé tient la porte de l'entrée nord"
b3.tl.room: "Le badge perdu est refusé trois fois à la salle des serveurs"
b3.tl.handed: "Une clé trouvée sur le parking est remise à l'accueil"
b3.tl.opened: "Une autre clé est ouverte sur un poste du bureau d'études"
b3.tl.revoked: "Le badge perdu est désactivé"
b3.tl.isolated: "Le poste est isolé du réseau"
b3.ada.brief: "On commence par compter. `cat acces/revue-badges.csv` : la colonne `situation` dit où est le badge, la colonne `status` dit s'il ouvre encore."
b3.ada.g.stale: "`grep -v \"in use\" acces/revue-badges.csv` montre les badges qui ne sont plus utilisés. Compte ceux qui sont encore `active`, puis `answer stale <nombre>`."
b3.ada.g.stale.standard: "Compte dans la revue les badges perdus, rendus ou jamais rendus qui sont encore actifs."
b3.ada.stale: "Quatre de plus. Un stagiaire parti en juin, un salarié parti en octobre qui ne l'a jamais rendu, un badge visiteur perdu, un prestataire dont le contrat s'est arrêté il y a deux ans. Le badge de lundi n'était pas un oubli : c'était l'habitude. Les règles : `acces/reglement.yml`."
b3.ada.g.rules: "`cat acces/reglement.yml` : chaque ligne donne ses valeurs possibles après le `#`. Choisis la plus sûre avec `sed -i` ou `edit`, puis `verify`."
b3.ada.g.rules.standard: "Corrige `acces/reglement.yml`, puis lance `verify`."
b3.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
b3.ada.rules: "Six lignes, et regarde ce qu'elles ont en commun : aucune ne demande à quelqu'un d'être méfiant. Le badge se désactive parce que quelqu'un en est chargé, la porte sonne toute seule, le visiteur est accompagné parce que c'est l'usage, le port USB est fermé par un réglage. On ne demande pas aux gens de cesser d'être aimables. Une dernière question, parce qu'il restera toujours la porte."
b3.ada.g.stranger: "Réponds à ma question : que faire devant un inconnu sans badge."
b3.ada.stranger: "Oui. « Je vous accompagne à l'accueil ? » : c'est poli, c'est utile à un vrai visiteur, et celui qui n'a rien à faire là trouve soudain qu'il s'est trompé d'immeuble. Il reste à raconter lundi dans l'ordre."
b3.ada.g.story: "`timeline lundi` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline lundi <id> <id> …`."
b3.ada.g.story.standard: "Remets lundi dans l'ordre, de la déclaration de perte à l'isolement du poste."
b3.ada.done: "La gérante a affiché la page à côté de la machine à café. Le dessinateur qui avait tenu la porte a demandé s'il pouvait écrire lui-même la ligne sur l'accueil. C'est fait."
b3.hint.stale.1: "Quatre lignes ne sont pas `in use` et finissent par `active` : B-0041, B-0073, B-0120, B-0188."
b3.hint.stale.2: "`answer stale 4`"
b3.hint.rules.1: "Les valeurs attendues : `revoked-same-day`, `every-quarter`, `after-15-seconds`, `escorted-from-reception`, `blocked-unless-needed`, `handed-to-it-unplugged`."
b3.hint.rules.2: "Par exemple `sed -i \"s/badge_review: never/badge_review: every-quarter/\" acces/reglement.yml`."
b3.hint.stranger.1: "Poli et sûr à la fois. Tape `answer walk`."
b3.hint.story.1: "Le badge est déclaré perdu des semaines avant. Lundi : la porte, la salle, la clé remise, la clé ouverte, puis les deux mesures."
b3.hint.story.2: "`timeline lundi reported door room handed opened revoked isolated`"
b3.debrief.title: "Le règlement"
b3.debrief.lesson: "Quatre autres badges ouvraient encore sans raison. Les règles qui tiennent sont celles qui ne reposent sur la vigilance de personne : un responsable nommé, une alarme, un réglage, un usage. Et une phrase à dire devant la porte."
b3.debrief.p1: "Passer les badges en revue chaque trimestre, comme les comptes : départs, prestataires, visiteurs."
b3.debrief.p2: "Préférer un réglage à une consigne : alarme de porte, stockage USB fermé, visiteurs accompagnés."
b3.debrief.p3: "Donner aux gens une phrase polie pour la porte : « je vous accompagne à l'accueil ? »"
