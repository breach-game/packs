c1.briefing: "Tuesday 14 December, 8 am, the busiest week of the year. The police have just called Grand Cabas: payment cards for sale come from its tills. Yet the detection sensor, installed this autumn, had rung. The export of the alert queue is in `soc/`."
c1.obj.machine: "Find the machine the sensor had flagged"
c1.obj.exit: "Find where the data leaves"
c1.obj.cut: "Cut the way out and isolate the relay"
c1.obj.ignored: "Say why nobody had reacted"
c1.q.machine: "Which address does the sensor flag as having received an unknown program?"
c1.q.exit: "To which outside address does the data leave the network?"
c1.q.ignored: "The sensor had seen the program on 30 November. Why did nothing happen?"
c1.q.ignored.noowner: "The alert was drowned among a thousand others, and belonged to nobody"
c1.q.ignored.silent: "The sensor had seen nothing before the police called"
c1.q.ignored.silent.why: "It had: alerts A-8841 and A-8902 name the till server, on 30 November and 2 December. Look at their status."
c1.q.ignored.hidden: "The intruder had deleted the alerts from the queue before leaving"
c1.q.ignored.hidden.why: "The alerts are still in the queue, with the reason they were closed written by the team: \"noise\", \"duplicate\"."
c1.contain.out: "Block the address 203.0.113.45 outbound"
c1.contain.relay: "Isolate the relais file server (shops cannot fetch their price lists from it today)"
c1.ada.brief: "Start with `soc sources`, then read what the team had closed: `cat soc/alertes-classees.txt`. The sensor is still talking: `soc logs sonde ids`."
c1.ada.g.machine: "In `soc/alertes-classees.txt` and in `soc logs sonde ids`, a priority 1 alert names the machine that received an unknown program. `answer machine <address>`."
c1.ada.g.machine.standard: "Find in the closed alerts and in the sensor's log the machine that received a program nobody installed."
c1.ada.machine: "10.106.0.80, the server that drives every till. The sensor said so twice, two weeks ago. Let's see what that server sends, and to whom: `flows --src 10.106.0.80`."
c1.ada.g.exit: "`flows --src 10.106.0.80`: the till server talks to the payment processor, and to one other machine. Follow it: `flows --src 10.106.0.90`. `answer exit <outside address>`."
c1.ada.g.exit.standard: "Follow the large volumes in `flows`, from the till server to the outside."
c1.ada.exit: "From the tills to the internal file server, then from the file server to 203.0.113.45. The data makes a stop inside before leaving: seen from the exit, it is a file server talking, not a till. We cut: `contain`."
c1.ada.g.cut: "Two measures: `contain block 203.0.113.45`, then `contain isolate relais`."
c1.ada.g.cut.standard: "Close the way out and isolate the machine used as a stop. `contain` lists the measures."
c1.ada.cut: "The way out is closed and the relay is isolated. Shops will do without their price lists today. One question, and it is the most important one in this file."
c1.ada.g.ignored: "Read `soc/alertes-classees.txt` again: the alerts' status, the number of alerts, and the two lines of sensor settings."
c1.ada.done: "The sensor had done its job. Fourteen hundred alerts in three days, nobody in charge at night, and automatic removal switched off \"to see\". A tool that rings in an empty room protects nothing. Tomorrow we look for how that program reached the till server."
c1.hint.machine.1: "Alerts A-8841 and A-8902 name `caisses (10.106.0.80)`."
c1.hint.machine.2: "`answer machine 10.106.0.80`"
c1.hint.exit.1: "`flows --src 10.106.0.90` shows a large volume to an address outside 10.106.0.0/24."
c1.hint.exit.2: "`answer exit 203.0.113.45`"
c1.hint.cut.1: "`contain block 203.0.113.45` then `contain isolate relais`"
c1.hint.ignored.1: "1,412 alerts, 1,398 closed as noise, and nobody in charge outside office hours. `answer noowner`"
c1.debrief.title: "Two alerts closed"
c1.debrief.lesson: "The detection tool had seen the program arrive on the till server, twice. The alerts were closed as noise, among more than a thousand others, by a team with nobody on at night. Detecting is useless if nobody is in charge of responding."
c1.debrief.p1: "Every high-priority alert has an owner, at any hour, and a time limit to respond."
c1.debrief.p2: "Tune the sensor so it rings less and better: a thousand alerts a day is no alert at all."
c1.debrief.p3: "Watch the exits: an internal server sending gigabytes to an unknown address is an alert in itself."
