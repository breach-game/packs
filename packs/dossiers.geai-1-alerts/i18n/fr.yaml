c1.briefing: "Mardi 14 décembre, 8 h, la semaine la plus chargée de l'année. La police judiciaire vient d'appeler Grand Cabas : des cartes bancaires en vente viennent de ses caisses. La sonde de détection, installée cet automne, avait pourtant sonné. L'export de la file d'alertes est dans `soc/`."
c1.obj.machine: "Trouver la machine que la sonde avait signalée"
c1.obj.exit: "Trouver par où les données sortent"
c1.obj.cut: "Couper la sortie et isoler le relais"
c1.obj.ignored: "Dire pourquoi personne n'avait réagi"
c1.q.machine: "Quelle adresse la sonde signale-t-elle comme ayant reçu un programme inconnu ?"
c1.q.exit: "Vers quelle adresse extérieure les données quittent-elles le réseau ?"
c1.q.ignored: "La sonde avait vu le programme le 30 novembre. Pourquoi rien ne s'est-il passé ?"
c1.q.ignored.noowner: "L'alerte était noyée parmi mille autres, et n'était à personne"
c1.q.ignored.silent: "La sonde n'avait rien vu avant l'appel de la police"
c1.q.ignored.silent.why: "Elle avait vu : les alertes A-8841 et A-8902 nomment le serveur des caisses, le 30 novembre et le 2 décembre. Regarde leur statut."
c1.q.ignored.hidden: "L'intrus avait effacé les alertes de la file"
c1.q.ignored.hidden.why: "Les alertes sont toujours dans la file, avec la raison de leur classement écrite par l'équipe : « bruit », « doublon »."
c1.contain.out: "Bloquer en sortie l'adresse 203.0.113.45"
c1.contain.relay: "Isoler le serveur de fichiers relais (les magasins n'y prennent plus leurs listes de prix aujourd'hui)"
c1.ada.brief: "Commence par `soc sources`, puis lis ce que l'équipe avait classé : `cat soc/alertes-classees.txt`. La sonde parle encore : `soc logs sonde ids`."
c1.ada.g.machine: "Dans `soc/alertes-classees.txt` et dans `soc logs sonde ids`, une alerte de priorité 1 nomme la machine qui a reçu un programme inconnu. `answer machine <adresse>`."
c1.ada.g.machine.standard: "Trouve dans les alertes classées et dans le journal de la sonde la machine qui a reçu un programme que personne n'a installé."
c1.ada.machine: "10.106.0.80, le serveur qui pilote toutes les caisses. La sonde l'a dit deux fois, il y a deux semaines. Voyons ce que ce serveur envoie, et à qui : `flows --src 10.106.0.80`."
c1.ada.g.exit: "`flows --src 10.106.0.80` : le serveur des caisses parle au prestataire de paiement, et à une autre machine. Suis-la : `flows --src 10.106.0.90`. `answer exit <adresse extérieure>`."
c1.ada.g.exit.standard: "Suis les gros volumes dans `flows`, du serveur des caisses jusqu'à l'extérieur."
c1.ada.exit: "Des caisses vers le serveur de fichiers interne, puis du serveur de fichiers vers 203.0.113.45. Les données font une étape à l'intérieur avant de sortir : vu de la sortie, c'est un serveur de fichiers qui parle, pas une caisse. On coupe : `contain`."
c1.ada.g.cut: "Deux mesures : `contain block 203.0.113.45`, puis `contain isolate relais`."
c1.ada.g.cut.standard: "Ferme la sortie et isole la machine qui sert d'étape. `contain` liste les mesures."
c1.ada.cut: "La sortie est fermée et le relais est isolé. Les magasins se passeront de leurs listes de prix aujourd'hui. Une question, et c'est la plus importante du dossier."
c1.ada.g.ignored: "Relis `soc/alertes-classees.txt` : le statut des alertes, le nombre d'alertes, et les deux lignes de réglages de la sonde."
c1.ada.done: "La sonde avait fait son travail. Mille quatre cents alertes en trois jours, aucune personne responsable la nuit, et le retrait automatique coupé « pour voir ». Un outil qui sonne dans une pièce vide ne protège rien. Demain, on cherche par où ce programme est arrivé sur le serveur des caisses."
c1.hint.machine.1: "Les alertes A-8841 et A-8902 nomment `caisses (10.106.0.80)`."
c1.hint.machine.2: "`answer machine 10.106.0.80`"
c1.hint.exit.1: "`flows --src 10.106.0.90` montre un gros volume vers une adresse hors de 10.106.0.0/24."
c1.hint.exit.2: "`answer exit 203.0.113.45`"
c1.hint.cut.1: "`contain block 203.0.113.45` puis `contain isolate relais`"
c1.hint.ignored.1: "1 412 alertes, 1 398 classées comme du bruit, et personne de responsable hors des heures de bureau. `answer noowner`"
c1.debrief.title: "Deux alertes classées"
c1.debrief.lesson: "L'outil de détection avait vu le programme arriver sur le serveur des caisses, deux fois. Les alertes ont été classées comme du bruit, parmi plus de mille autres, par une équipe qui n'avait personne de nuit. Détecter ne sert à rien si personne n'est chargé de répondre."
c1.debrief.p1: "Chaque alerte de priorité haute a un responsable, à toute heure, et un délai pour répondre."
c1.debrief.p2: "Régler la sonde pour qu'elle sonne moins et mieux : mille alertes par jour, c'est aucune alerte."
c1.debrief.p3: "Surveiller les sorties : un serveur interne qui envoie des gigaoctets vers une adresse inconnue est une alerte à lui seul."
