b1.briefing: "Bergeronnette opens the door of 2,300 companies. When customers are stuck, its support asks for a browser diagnostic file, and keeps it in its tickets. The chief security officer's question: if someone got into the support portal, what would these files give them? You have a test agent account and a volunteer witness customer."
b1.obj.ticket: "Read the witness customer's ticket"
b1.obj.har: "Fetch its diagnostic file"
b1.obj.console: "Show what this file opens (flag)"
b1.obj.why: "Explain why the door opened"
b1.q.why: "The console let you in without a password or a second factor. Why?"
b1.q.why.cookie: "The session cookie proves both were already given: whoever holds it walks in"
b1.q.why.password: "The file also held the customer's password, saved by the browser"
b1.q.why.password.why: "Read the file again: no password. The customer was already signed in when they saved it, they typed nothing."
b1.q.why.mfa: "Temoin SAS had turned off the second factor on its admin console"
b1.q.why.mfa.why: "The console says it itself: second factor done on 7 May at 16:40. It was asked, but of the customer, not of you."
b1.ada.brief: "Test agent account: the cookie is in the mandate. Start with the list of tickets: `curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets`."
b1.ada.g.ticket: "Open the witness customer's ticket: `curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471`."
b1.ada.g.ticket.standard: "With the agent cookie from the mandate, read the witness customer's ticket."
b1.ada.g.har: "The attachment is on the portal. Save it to a file to read it calmly: `curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471/diagnostic.har > diagnostic.har`."
b1.ada.g.har.standard: "Fetch the attachment into a file on your workstation."
b1.ada.jq: "A HAR is JSON: every request of the browser, with its headers and cookies. Look at the cookies of the first one: `jq -r \".log.entries[0].request.cookies[].value\" diagnostic.har`."
b1.ada.jq.standard: "It is JSON. Use `jq` to find what the browser sent the console with every request."
b1.ada.g.console: "The `bsid` cookie is the console session. Replay it, to read only: `curl -b \"bsid=bq7-temoin-4f19c2e8a0d3\" https://admin.bergeronnette.test/console`."
b1.ada.g.console.standard: "The customer's browser showed a session cookie to the console. Show the same one, to read only."
b1.ada.inside: "Inside. Send the marker with `submit`. And not one button: \"Add an admin\" is exactly what an intruder would do next."
b1.ada.inside.standard: "Inside. Send the marker, and touch nothing."
b1.ada.stop: "A customer's admin session, taken from a support ticket. No stolen password, no second factor bypassed."
b1.ada.answer: "Answer my question: click, or use `answer` in the terminal."
b1.ada.answer.standard: "My question is waiting in the messenger."
b1.ada.done: "That is it. The second factor protects opening the session, not the session once open. On to the debrief; next, we look at what the customer would have seen."
b1.hint.ticket.1: "The portal asks for an agent cookie. It is written in the mandate: `cat mandate/BG-2027-013.txt`."
b1.hint.ticket.2: "`curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471`"
b1.hint.har.1: "The ticket gives the attachment's address. The same agent cookie opens it."
b1.hint.har.2: "`curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471/diagnostic.har > diagnostic.har`"
b1.hint.console.1: "In the file, look for the cookies sent to admin.bergeronnette.test: `jq \".log.entries[0].request\" diagnostic.har`."
b1.hint.console.2: "The cookie that matters is called `bsid`. `curl -b` shows it the way the browser did."
b1.hint.console.3: "`curl -b \"bsid=bq7-temoin-4f19c2e8a0d3\" https://admin.bergeronnette.test/console`, then `submit` with the marker."
b1.hint.why.1: "What did the customer do at 16:40, just before saving the file?"
b1.debrief.title: "The second factor does not protect the session"
b1.debrief.lesson: "The password and the second factor are given once. After that, the session is a plain cookie, and whoever shows it is the customer. A diagnostic file records everything, cookies included: attaching it to a ticket hands one's session to anyone who reads the ticket."
b1.debrief.p1: "A HAR holds headers, cookies and often tokens: it is a key, not just a log."
b1.debrief.p2: "A session cookie replayed from another machine passes the password and the second factor without seeing them."
b1.debrief.p3: "The danger is not the customer who sends the file, it is the system that asks for it and keeps it as it is."
