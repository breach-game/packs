b1.briefing: "Bergeronnette ouvre la porte de 2 300 entreprises. Son assistance demande aux clients bloqués un fichier de diagnostic du navigateur, et le garde dans ses tickets. Question de la directrice de la sécurité : si quelqu'un entrait dans le portail d'assistance, qu'est-ce que ces fichiers lui donneraient ? Tu as un compte agent de test et un client témoin volontaire."
b1.obj.ticket: "Lire le ticket du client témoin"
b1.obj.har: "Récupérer son fichier de diagnostic"
b1.obj.console: "Montrer ce que ce fichier ouvre (flag)"
b1.obj.why: "Expliquer pourquoi la porte s'est ouverte"
b1.q.why: "La console t'a ouvert sans mot de passe ni second facteur. Pourquoi ?"
b1.q.why.cookie: "Le cookie de session prouve que les deux ont déjà été donnés : qui l'a passe la porte"
b1.q.why.password: "Le fichier contenait aussi le mot de passe du client, enregistré par le navigateur"
b1.q.why.password.why: "Relis le fichier : aucun mot de passe. Le client était déjà connecté quand il l'a enregistré, il n'a rien tapé."
b1.q.why.mfa: "Témoin SAS avait désactivé le second facteur sur sa console d'administration"
b1.q.why.mfa.why: "La console le dit elle-même : second facteur fait le 7 mai à 16 h 40. Il a bien été demandé, mais au client, pas à toi."
b1.ada.brief: "Compte agent de test : le cookie est dans le mandat. Commence par la liste des tickets : `curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets`."
b1.ada.g.ticket: "Ouvre le ticket du client témoin : `curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471`."
b1.ada.g.ticket.standard: "Avec le cookie d'agent du mandat, lis le ticket du client témoin."
b1.ada.g.har: "La pièce jointe est sur le portail. Enregistre-la dans un fichier pour la lire tranquillement : `curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471/diagnostic.har > diagnostic.har`."
b1.ada.g.har.standard: "Récupère la pièce jointe dans un fichier de ton poste."
b1.ada.jq: "Un HAR, c'est du JSON : chaque requête du navigateur, avec ses en-têtes et ses cookies. Regarde les cookies de la première : `jq -r \".log.entries[0].request.cookies[].value\" diagnostic.har`."
b1.ada.jq.standard: "C'est du JSON. Cherche avec `jq` ce que le navigateur envoyait à la console, à chaque requête."
b1.ada.g.console: "Le cookie `bsid` est la session de la console. Rejoue-la, et seulement pour lire : `curl -b \"bsid=bq7-temoin-4f19c2e8a0d3\" https://admin.bergeronnette.test/console`."
b1.ada.g.console.standard: "Le navigateur du client présentait un cookie de session à la console. Présente le même, pour lire seulement."
b1.ada.inside: "Dedans. Envoie le témoin avec `submit`. Et pas un bouton : « Ajouter un administrateur » est exactement ce qu'un intrus ferait ensuite."
b1.ada.inside.standard: "Dedans. Envoie le témoin, et ne touche à rien."
b1.ada.stop: "Une session d'administrateur de client, prise dans un ticket d'assistance. Aucun mot de passe volé, aucun second facteur contourné."
b1.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
b1.ada.answer.standard: "Ma question t'attend dans la messagerie."
b1.ada.done: "C'est ça. Le second facteur protège l'ouverture de la session, pas la session une fois ouverte. Passe au débrief, la suite regarde ce qu'aurait vu le client."
b1.hint.ticket.1: "Le portail demande un cookie d'agent. Il est écrit dans le mandat : `cat mandate/BG-2027-013.txt`."
b1.hint.ticket.2: "`curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471`"
b1.hint.har.1: "Le ticket donne l'adresse de la pièce jointe. Le même cookie d'agent l'ouvre."
b1.hint.har.2: "`curl -b \"agent=lr-audit-013\" https://support.bergeronnette.test/tickets/4471/diagnostic.har > diagnostic.har`"
b1.hint.console.1: "Dans le fichier, cherche les cookies envoyés à admin.bergeronnette.test : `jq \".log.entries[0].request\" diagnostic.har`."
b1.hint.console.2: "Le cookie qui compte s'appelle `bsid`. `curl -b` le présente comme le navigateur le faisait."
b1.hint.console.3: "`curl -b \"bsid=bq7-temoin-4f19c2e8a0d3\" https://admin.bergeronnette.test/console`, puis `submit` avec le témoin."
b1.hint.why.1: "Qu'est-ce que le client a fait à 16 h 40, juste avant d'enregistrer le fichier ?"
b1.debrief.title: "Le second facteur ne protège pas la session"
b1.debrief.lesson: "Le mot de passe et le second facteur se donnent une fois. Ensuite, la session est un simple cookie, et qui le présente est le client. Un fichier de diagnostic enregistre tout, cookies compris : le joindre à un ticket, c'est confier sa session à quiconque lira le ticket."
b1.debrief.p1: "Un HAR contient les en-têtes, les cookies et souvent des jetons : c'est une clé, pas un simple journal."
b1.debrief.p2: "Un cookie de session rejoué depuis une autre machine passe le mot de passe et le second facteur sans les voir."
b1.debrief.p3: "Le danger n'est pas le client qui envoie le fichier, c'est le système qui le demande et le garde tel quel."
