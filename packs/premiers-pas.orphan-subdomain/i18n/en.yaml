os.briefing: "Au Bon Fournil ran its 2025 summer promotion on a small site hosted at Nuage, at promo.fournil.test. The campaign is over, and the storage bucket was deleted in September. The management asked us to review its DNS zone: check that everything it announces still exists."
os.obj.dangling: "Find the DNS name that points to a vanished bucket"
os.obj.claim: "Prove that anyone could take it over (flag)"
os.obj.clean: "Remove the record from the zone"
os.ada.brief: "First steps. Only one technique here, and one of the simplest: a DNS name pointing to a resource that no longer exists. That is called an orphan subdomain."
os.ada.zone: "The management sent us the DNS zone. Read it: `cat fournil/zone.txt`."
os.ada.zone.standard: "Read the DNS zone the management gave us, in `fournil/`."
os.ada.cname: "One line stands out: `promo` is a CNAME, an alias to a name at Nuage. Check what the public DNS answers: `dig promo.fournil.test`."
os.ada.cname.standard: "One of the names is an alias to another provider. Check it with `dig`."
os.ada.follow: "The DNS follows the alias all the way to Nuage. And at Nuage, what is at the end? `curl https://promo.fournil.test/`."
os.ada.follow.standard: "The name still exists. Go and see what it serves."
os.ada.nosuch: "\"NoSuchBucket\". The name still points to Nuage, but the bucket is gone. And at Nuage, a released bucket name belongs to whoever takes it."
os.ada.console: "The mandate lets us prove it with our own test account. Create a bucket with the same name: `curl -d \"bucket=fournil-promo-2025\" https://console.nuage.test/`, or with the console in the browser."
os.ada.console.standard: "Prove the name is free: our test account at Nuage can create a bucket. Which one?"
os.ada.created: "Created, with a simple proof file. Now go back to `https://promo.fournil.test/`: who answers there?"
os.ada.created.standard: "The bucket is ours. See what promo.fournil.test serves now, and send the marker."
os.ada.claimed: "The bakery's site now serves our file. An attacker could have put a fake order page there, or stolen the domain's cookies. We stop here: one proof is enough."
os.ada.clean: "Now fix the cause: the forgotten record. Remove the `promo` line from `fournil/zone.txt` with `edit fournil/zone.txt` or `sed -i \"/^promo /d\" fournil/zone.txt`, then run `verify`."
os.ada.clean.standard: "Fix the zone: the alias to the vanished bucket must go, the rest must stay. Then `verify`. To open the file: `edit fournil/zone.txt`."
os.ada.exact: "Not yet. The line pointing to `fournil-promo-2025` must go, and the `www` and `four` lines must stay as they are."
os.ada.done: "Clean. And we will delete our proof bucket at the end of the test, as the report says. On to the debrief."
os.check.gone: "The alias to the deleted bucket is no longer in the zone"
os.check.rest: "The other records are intact"
os.hint.dangling.1: "In the zone, one record is not an address but an alias to another name."
os.hint.dangling.2: "`dig promo.fournil.test`, then `curl https://promo.fournil.test/`."
os.hint.claim.1: "The Nuage console of our test account creates buckets. The name to take is the one in the error message."
os.hint.claim.2: "`curl -d \"bucket=fournil-promo-2025\" https://console.nuage.test/`, then `curl https://promo.fournil.test/` and `submit` the marker."
os.hint.clean.1: "Delete the line starting with `promo` in `fournil/zone.txt`."
os.hint.clean.2: "With the editor: `edit fournil/zone.txt`, then Ctrl+S. With a command: `sed -i \"/^promo /d\" fournil/zone.txt`, then `verify`."
os.debrief.title: "A name that outlives its resource"
os.debrief.lesson: "When a resource at a provider disappears (bucket, app, hosted page), the DNS record that pointed to it must disappear at the same time. Otherwise whoever recreates the resource under the same name speaks for the domain: fake pages, cookies, trusted mail."
os.debrief.p1: "Delete the DNS record before, or together with, the resource it points to."
os.debrief.p2: "Keep an inventory of the zone: every alias to an outside provider has an owner and an end date."
os.debrief.p3: "Check regularly that each alias leads to something that still exists: a \"does not exist\" answer from a provider is an alert."
