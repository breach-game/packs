os.briefing: "Au Bon Fournil a fait sa promo d'été 2025 sur un mini-site hébergé chez Nuage, à l'adresse promo.fournil.test. La campagne est finie, le seau de stockage a été supprimé en septembre. La gérance nous a confié la revue de sa zone DNS : vérifie que tout ce qu'elle annonce existe encore."
os.obj.dangling: "Trouver le nom DNS qui pointe vers un seau disparu"
os.obj.claim: "Prouver que n'importe qui pourrait le reprendre (flag)"
os.obj.clean: "Retirer l'enregistrement de la zone"
os.ada.brief: "Premiers pas. Une seule technique ici, et une des plus simples : un nom DNS qui pointe vers une ressource qui n'existe plus. On appelle ça un sous-domaine orphelin."
os.ada.zone: "La gérance nous a envoyé la zone DNS. Lis-la : `cat fournil/zone.txt`."
os.ada.zone.standard: "Lis la zone DNS que la gérance nous a confiée, dans `fournil/`."
os.ada.cname: "Une ligne détonne : `promo` est un CNAME, un alias vers un nom chez Nuage. Vérifie ce que le DNS public répond : `dig promo.fournil.test`."
os.ada.cname.standard: "Un des noms est un alias vers un autre fournisseur. Vérifie-le avec `dig`."
os.ada.follow: "Le DNS suit l'alias jusqu'à Nuage. Et chez Nuage, qu'y a-t-il au bout ? `curl https://promo.fournil.test/`."
os.ada.follow.standard: "Le nom existe toujours. Va voir ce qu'il sert."
os.ada.nosuch: "« NoSuchBucket ». Le nom pointe toujours vers Nuage, mais le seau n'existe plus. Or chez Nuage, un nom de seau libéré est à qui le prend."
os.ada.console: "Le mandat nous autorise à le prouver avec notre propre compte de test. Crée un seau du même nom : `curl -d \"bucket=fournil-promo-2025\" https://console.nuage.test/`, ou par la console dans le navigateur."
os.ada.console.standard: "Prouve que le nom est libre : notre compte de test chez Nuage peut créer un seau. Lequel ?"
os.ada.created: "Créé, avec un simple fichier témoin. Retourne maintenant sur `https://promo.fournil.test/` : qui y répond ?"
os.ada.created.standard: "Le seau est à nous. Regarde ce que sert maintenant promo.fournil.test, et envoie le témoin."
os.ada.claimed: "Le site de la boulangerie sert désormais notre fichier. Un attaquant aurait pu y mettre une fausse page de commande, ou y voler des cookies du domaine. On s'arrête là : une preuve suffit."
os.ada.clean: "Il reste à réparer la cause : l'enregistrement oublié. Retire la ligne `promo` de `fournil/zone.txt` avec `edit fournil/zone.txt` ou `sed -i \"/^promo /d\" fournil/zone.txt`, puis lance `verify`."
os.ada.clean.standard: "Répare la zone : l'alias vers le seau disparu doit partir, le reste doit rester. Puis `verify`. Pour ouvrir le fichier : `edit fournil/zone.txt`."
os.ada.exact: "Pas encore. La ligne qui pointe vers `fournil-promo-2025` doit disparaître, et les lignes `www` et `four` doivent rester telles quelles."
os.ada.done: "Propre. Et on supprimera notre seau témoin à la fin du test, comme le dit le rapport. Passe au débrief."
os.check.gone: "L'alias vers le seau supprimé n'est plus dans la zone"
os.check.rest: "Les autres enregistrements sont intacts"
os.hint.dangling.1: "Dans la zone, un enregistrement n'est pas une adresse mais un alias vers un autre nom."
os.hint.dangling.2: "`dig promo.fournil.test`, puis `curl https://promo.fournil.test/`."
os.hint.claim.1: "La console Nuage de notre compte de test crée des seaux. Le nom à prendre est celui du message d'erreur."
os.hint.claim.2: "`curl -d \"bucket=fournil-promo-2025\" https://console.nuage.test/`, puis `curl https://promo.fournil.test/` et `submit` le témoin."
os.hint.clean.1: "Supprime la ligne qui commence par `promo` dans `fournil/zone.txt`."
os.hint.clean.2: "Avec l'éditeur : `edit fournil/zone.txt`, puis Ctrl+S. Avec une commande : `sed -i \"/^promo /d\" fournil/zone.txt`, puis `verify`."
os.debrief.title: "Un nom qui survit à sa ressource"
os.debrief.lesson: "Quand une ressource chez un fournisseur disparaît (seau, application, page hébergée), l'enregistrement DNS qui pointait vers elle doit disparaître en même temps. Sinon, le premier qui recrée la ressource sous le même nom parle au nom du domaine : fausses pages, cookies, mails de confiance."
os.debrief.p1: "Supprimer l'enregistrement DNS avant, ou en même temps que, la ressource vers laquelle il pointe."
os.debrief.p2: "Tenir l'inventaire de sa zone : chaque alias vers un fournisseur extérieur a un propriétaire et une date de fin."
os.debrief.p3: "Vérifier régulièrement que chaque alias mène à quelque chose qui existe encore : une réponse « n'existe pas » chez un fournisseur est une alerte."
