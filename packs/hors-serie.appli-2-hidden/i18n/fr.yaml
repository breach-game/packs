a2.briefing: "La directrice technique a lu ton premier constat. « La clé, d'accord. Mais le reste de l'appli ne contient que l'interface, non ? » Le paquet est sur ton poste. Regarde ce que dit le code compilé."
a2.obj.route: "Trouver une route que l'appli ne montre pas, et prouver ce qu'elle donne"
a2.obj.backup: "Relever le réglage du manifeste qui laisse copier les données de l'appli"
a2.obj.where: "Dire où doit se faire le contrôle du rôle"
a2.q.backup: "Quel attribut du manifeste laisse une sauvegarde copier les données de l'appli, jeton de session compris ? Donne son nom seul, sans sa valeur."
a2.q.where: "La directrice demande : où faut-il vérifier qu'un utilisateur est du personnel ?"
a2.q.where.server: "Sur le serveur, à partir de la session"
a2.q.where.hide: "Dans l'appli, en cachant mieux le menu partenaires"
a2.q.where.hide.why: "Tu viens d'appeler la route sans l'appli. Cacher un menu ne change rien à ce que l'API accepte."
a2.q.where.encrypt: "Dans l'appli, en chiffrant l'en-tête"
a2.q.where.encrypt.why: "L'appli chiffrerait avec une clé qu'elle transporte, donc lisible comme la clé des partenaires. Le serveur doit décider seul, d'après la session."
a2.ada.brief: "Le paquet est sur ton poste (`cabas.apk`). `classes.dex`, c'est le code compilé : illisible avec `cat`, mais `strings` en sort les textes. Essaie `unzip -p cabas.apk classes.dex | strings`."
a2.ada.g.route: "Dans ce que sort `strings`, une route `/v4/interne/…` et un en-tête `X-Cabas-Role`. Appelle la route sans rien, puis avec l'en-tête que l'appli enverrait pour le personnel : `curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`. Puis `submit` le repère."
a2.ada.g.route.standard: "Le code compilé nomme une route interne et la façon dont l'appli annonce un rôle. Vérifie si l'API croit l'appli sur parole."
a2.ada.route: "Repère validé. Le rôle « personnel » est un en-tête que l'appli pose elle-même, et l'API le croit. La file des remboursements à valider est ouverte à qui sait l'écrire. On s'arrête là : le mandat interdit de valider quoi que ce soit."
a2.ada.g.backup: "Lis le manifeste : `unzip -p cabas.apk AndroidManifest.xml`. Un attribut laisse copier les données de l'appli par une sauvegarde. Réponds avec `answer backup <attribut>`."
a2.ada.g.backup.standard: "Le manifeste dit aussi comment l'appli garde ses données. Relève le réglage qui les laisse copier."
a2.ada.g.where: "Qui décide, aujourd'hui, que tu es du personnel ?"
a2.ada.done: "Deux constats sérieux, aucun piratage savant : une archive, `strings`, un en-tête. Passons de l'autre côté, avec l'équipe de Cabas."
a2.hint.route.1: "`unzip -p cabas.apk classes.dex | strings` montre `/v4/interne/remboursements` et `X-Cabas-Role`."
a2.hint.route.2: "`curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`"
a2.hint.backup.1: "Dans `<application …>`, l'attribut qui vaut `true` et parle de sauvegarde."
a2.hint.backup.2: "`answer backup allowBackup`"
a2.hint.where.1: "`answer server`"
a2.debrief.title: "Le menu caché"
a2.debrief.lesson: "L'appli cachait un menu au personnel et annonçait le rôle de l'utilisateur par un en-tête qu'elle posait elle-même. L'API le croyait. N'importe qui pouvait lire le code compilé, y trouver la route et l'en-tête, et appeler l'API sans l'appli. En plus, le manifeste laissait copier les données de l'appli par une sauvegarde, jeton de session compris, et l'appli de test restait déboguable."
a2.debrief.p1: "Tout contrôle de droits se fait sur le serveur, d'après la session : l'appli ne fait qu'afficher ce que le serveur permet."
a2.debrief.p2: "Penser que le code d'une appli sera lu : routes, en-têtes et menus cachés ne sont pas des protections."
a2.debrief.p3: "Désactiver la sauvegarde des données sensibles et le mode débogage dans les versions publiées, et garder les jetons dans le coffre du téléphone (Keystore)."
a2.ada.mandate: "Non. Le mandat dit lecture seule : aucun remboursement validé. Le repère suffit comme preuve."
a2.noise.refund: "Tentative de validation d'un remboursement (hors mandat)"
