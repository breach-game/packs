a2.briefing: "The CTO read your first finding. \"The key, fine. But the rest of the app is only the interface, right?\" The package is on your workstation. See what the compiled code says."
a2.obj.route: "Find a route the app does not show, and prove what it gives"
a2.obj.backup: "Note the manifest setting that lets the app's data be copied"
a2.obj.where: "Say where the role check must happen"
a2.q.backup: "Which manifest attribute lets a backup copy the app's data, session token included? Give its name alone, without its value."
a2.q.where: "The CTO asks: where must we check that a user is staff?"
a2.q.where.server: "On the server, from the session"
a2.q.where.hide: "In the app, by hiding the menu better"
a2.q.where.hide.why: "You just called the route without the app. Hiding a menu changes nothing about what the API accepts."
a2.q.where.encrypt: "In the app, by encrypting the header"
a2.q.where.encrypt.why: "The app would encrypt with a key it carries, readable like the partner key. The server must decide alone, from the session."
a2.ada.brief: "The package is on your workstation (`cabas.apk`). `classes.dex` is the compiled code: unreadable with `cat`, but `strings` pulls out its texts. Try `unzip -p cabas.apk classes.dex | strings`."
a2.ada.g.route: "In what `strings` prints, a route `/v4/interne/…` and a header `X-Cabas-Role`. Call the route bare, then with the header the app would send for staff: `curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`. Then `submit` the marker."
a2.ada.g.route.standard: "The compiled code names an internal route and the way the app announces a role. Check whether the API takes the app at its word."
a2.ada.route: "Marker accepted. The \"staff\" role is a header the app sets itself, and the API believes it. The queue of refunds waiting for approval is open to whoever can type it. We stop here: the mandate forbids approving anything."
a2.ada.g.backup: "Read the manifest: `unzip -p cabas.apk AndroidManifest.xml`. One attribute lets a backup copy the app's data. Answer with `answer backup <attribute>`."
a2.ada.g.backup.standard: "The manifest also says how the app keeps its data. Note the setting that lets it be copied."
a2.ada.g.where: "Who decides, today, that you are staff?"
a2.ada.done: "Two serious findings, no clever hacking: an archive, `strings`, a header. Let's switch sides, with the Cabas team."
a2.hint.route.1: "`unzip -p cabas.apk classes.dex | strings` shows `/v4/interne/remboursements` and `X-Cabas-Role`."
a2.hint.route.2: "`curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`"
a2.hint.backup.1: "In `<application …>`, the attribute set to `true` that talks about backup."
a2.hint.backup.2: "`answer backup allowBackup`"
a2.hint.where.1: "`answer server`"
a2.debrief.title: "The hidden menu"
a2.debrief.lesson: "The app hid a staff menu and announced the user's role with a header it set itself. The API believed it. Anyone could read the compiled code, find the route and the header, and call the API without the app. On top of that, the manifest let a backup copy the app's data, session token included, and the test build stayed debuggable."
a2.debrief.p1: "Every rights check happens on the server, from the session: the app only displays what the server allows."
a2.debrief.p2: "Assume an app's code will be read: routes, headers and hidden menus are not protections."
a2.debrief.p3: "Turn off backup of sensitive data and debug mode in published builds, and keep tokens in the phone's vault (Keystore)."
a2.ada.mandate: "No. The mandate says read-only: no refund validated. The marker is proof enough."
a2.noise.refund: "Attempt to validate a refund (outside the mandate)"
