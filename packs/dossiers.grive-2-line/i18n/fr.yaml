v2.briefing: "Deuxième jour chez Grive. Hier, on a ouvert nous-mêmes une demande de fusion, comme le ferait un contributeur extérieur. Son message de commit demande à l'agent d'ajouter un fichier au nom étrange. Avec Grive, on a monté un banc d'essai qui rejoue ce que l'agent enverrait à chaque outil, et qui note ce qui s'est vraiment exécuté. À toi de trouver quels outils cèdent."
v2.obj.history: "Lire le message de commit que l'agent va lire"
v2.obj.harmless: "Rejouer la valeur étrange sur un outil qui passe une liste d'arguments"
v2.obj.proof: "La rejouer sur un outil qui fabrique une ligne de texte"
v2.obj.marker: "Envoyer le marqueur affiché par le programme témoin (`submit`)"
v2.obj.who: "Dire qui a écrit la commande"
v2.q.who: "Le programme témoin s'est exécuté sur le serveur de Grive. Qui a écrit la commande qui l'a lancé ?"
v2.q.who.staff: "Un développeur de Grive, en demandant de l'aide à l'agent"
v2.q.who.staff.why: "Le développeur a seulement demandé de préparer un commit. Il n'a jamais vu le nom du fichier."
v2.q.who.model: "Le modèle, qui a inventé un nom de fichier dangereux"
v2.q.who.model.why: "Le modèle n'a rien inventé : il a recopié le nom qu'on lui donnait. Il a été obéissant, ce qu'on lui demande d'être."
v2.q.who.text: "L'auteur d'un message de commit, que personne ne connaît chez Grive"
v2.ada.brief: "D'abord l'appât. La forge liste les branches ouvertes : la nôtre est celle qui vient de l'extérieur."
v2.ada.g.history: "Liste les branches ouvertes : `curl https://forge.grive.test/journal`."
v2.ada.g.history.standard: "Trouve notre demande de fusion parmi les branches ouvertes de la forge, et lis son historique."
v2.ada.history: "Regarde le commit. La note s'adresse à l'assistant, et le « nom de fichier » a deux parties : un vrai nom, puis notre programme témoin. Un agent qui range cette demande de fusion passera ce nom à un outil."
v2.ada.g.harmless: "D'abord un outil bien construit. Tes notes disent lequel : `cat dossier/notes.txt`. Puis rejoue l'appel : `curl https://outils.grive.test/essai/journal`."
v2.ada.g.harmless.standard: "Rejoue la valeur étrange sur un outil qui la garde comme un seul argument. Tes notes dans `dossier/notes.txt` disent comment chaque outil fabrique sa commande."
v2.ada.harmless: "Une erreur, et c'est tout. La valeur entière est restée un seul argument : git l'a regardée, n'y a pas trouvé un nombre, et s'est plaint. Voilà ce qu'un paramètre devrait toujours être."
v2.ada.g.proof: "Maintenant un outil qui fabrique une ligne de texte : `curl https://outils.grive.test/essai/ajout`."
v2.ada.g.proof.standard: "Maintenant rejoue-la sur un outil qui fabrique une ligne de texte."
v2.ada.proof: "Lis les deux lignes `shell: runs`. Le shell a coupé la phrase en deux, et la seconde moitié était notre programme. Et regarde la dernière ligne : l'agent a reçu une réponse ordinaire. Personne n'a rien vu."
v2.ada.g.marker: "Le marqueur est sur la ligne `temoin`. Envoie-le-moi avec `submit`."
v2.ada.g.marker.standard: "Envoie-moi le marqueur affiché par le programme témoin."
v2.ada.flag: "Preuve faite. Notre témoin affiche seulement un marqueur. N'importe quoi d'autre à sa place se serait exécuté avec les droits du serveur d'outils : ses fichiers, ses clés, son réseau."
v2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
v2.ada.answer.standard: "Réponds à ma question."
v2.ada.who: "Oui. Un inconnu a écrit une phrase là où l'agent lit, l'agent l'a transmise de bonne foi, et l'outil l'a collée dans une commande. Deux faiblesses à la suite : une dans l'agent, une dans l'outil. La seconde, c'est du code classique, et elle se corrige pour de bon."
v2.ada.done: "Même valeur, deux outils, deux résultats. Ouvre le débrief. Demain, on fait en sorte que tous les outils se comportent comme le premier."
v2.soc.proof: "Serveur d'outils : un programme inattendu a été lancé par un outil git"
v2.hint.history.1: "Tape `curl https://forge.grive.test/journal`, et regarde qui a ouvert chaque branche."
v2.hint.harmless.1: "La page d'accueil du serveur d'outils décrit le banc d'essai : `curl https://outils.grive.test/`."
v2.hint.harmless.2: "Dans `dossier/notes.txt`, l'outil à choisir reçoit un paramètre et est fabriqué en liste d'arguments."
v2.hint.proof.1: "Dans `dossier/notes.txt`, deux outils sont fabriqués en ligne de texte. L'un ou l'autre convient."
v2.hint.proof.2: "Tape `curl https://outils.grive.test/essai/ajout`."
v2.hint.marker.1: "Copie le `FLAG{...}` de la ligne `temoin` et tape `submit` suivi de ce marqueur."
v2.hint.who.1: "Retourne à l'historique : qui est l'auteur du commit qui porte la note ?"
v2.debrief.title: "D'un message de commit à une commande"
v2.debrief.lesson: "Personne n'a attaqué le serveur directement. Un texte a été déposé là où l'agent lit, l'agent s'en est servi comme paramètre, et un outil a fait du paramètre une commande. L'agent est le messager : la faille qui exécute est dans l'outil."
v2.debrief.p1: "Injection indirecte : la consigne arrive dans un contenu que l'agent lit, ici un message de commit."
v2.debrief.p2: "Les outils d'un agent reçoivent des valeurs choisies par un modèle. Ils doivent les traiter comme n'importe quelle entrée venue d'internet."
v2.debrief.p3: "La même valeur était inoffensive sur un outil qui passe une liste d'arguments. La correction existe, et elle n'est pas dans le modèle."
v2.ada.branches: "Quatre branches. Trois ont été ouvertes par l'équipe, une par un inconnu : `curl https://forge.grive.test/journal/pr-212`."
v2.ada.branches.standard: "Quatre branches. Regarde qui a ouvert chacune."
v2.ada.statut: "Cet outil ne prend aucun paramètre : la valeur n'est jamais arrivée jusqu'à git. Ça ne prouve rien, ni dans un sens ni dans l'autre. Choisis un outil qui reçoit la valeur."
v2.hint.history.2: "Tape `curl https://forge.grive.test/journal/pr-212`."
v2.hint.harmless.3: "Tape `curl https://outils.grive.test/essai/journal`."
