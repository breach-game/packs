v2.briefing: "Second day at Grive. Yesterday we opened pull request 212 ourselves, as an outside contributor would. Its commit message asks the agent to add a file with a strange name. With Grive, we set up a test harness that replays what the agent would send to the tools, and logs what really ran."
v2.obj.history: "Read the commit message the agent will read"
v2.obj.harmless: "Replay the strange value on a tool that passes an argument list"
v2.obj.proof: "Replay it on a tool that builds a line of text"
v2.obj.marker: "Send the marker printed by the witness program (`submit`)"
v2.obj.who: "Say who wrote the command"
v2.q.who: "The witness program ran on Grive's server. Who wrote the command that launched it?"
v2.q.who.staff: "A developer at Grive, by asking the agent for help"
v2.q.who.staff.why: "The developer only asked for a commit to be prepared. They never saw the file name."
v2.q.who.model: "The model, which invented a dangerous file name"
v2.q.who.model.why: "The model invented nothing: it copied the name it was given. It was obedient, which is what it is asked to be."
v2.q.who.text: "The author of a commit message, whom nobody at Grive knows"
v2.ada.brief: "First the bait. The history of pull request 212 is on the forge."
v2.ada.g.history: "Read the history: `curl https://forge.grive.test/journal`."
v2.ada.g.history.standard: "Read the history of pull request 212 on the forge."
v2.ada.history: "Look at the first commit. The note is addressed to the assistant, and the \"file name\" has two parts: a real name, then our witness program. An agent that tidies up this pull request will pass that name to a tool."
v2.ada.g.harmless: "First a tool built the right way. Replay the call: `curl https://outils.grive.test/essai/journal`."
v2.ada.g.harmless.standard: "Replay the strange value on the `journal` tool, with the test harness of the tool server."
v2.ada.harmless: "An error, and that is all. The whole value stayed one single argument: git looked at it, did not find a number, and complained. That is what a parameter should always be."
v2.ada.g.proof: "Now a tool that builds a line of text: `curl https://outils.grive.test/essai/ajout`."
v2.ada.g.proof.standard: "Replay it on the `ajout` tool."
v2.ada.proof: "Read the two `shell: runs` lines. The shell cut the sentence in two, and the second half was our program. And look at the last line: the agent got \"1 file added\". Nobody saw anything."
v2.ada.g.marker: "The marker is on the `temoin` line. Send it to me with `submit`."
v2.ada.g.marker.standard: "Send me the marker printed by the witness program."
v2.ada.flag: "Proof made. Our witness only prints a marker. Anything else in its place would have run with the rights of the tool server: its files, its keys, its network."
v2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
v2.ada.answer.standard: "Answer my question."
v2.ada.who: "Yes. A stranger wrote a sentence in a place the agent reads, the agent passed it on in good faith, and the tool glued it into a command. Two weaknesses in a row: one in the agent, one in the tool. The second one is plain old code, and it can be fixed for good."
v2.ada.done: "Same value, two tools, two outcomes. Open the debrief. Tomorrow we make every tool behave like the first one."
v2.soc.proof: "Tool server: an unexpected program was started by a git tool"
v2.hint.history.1: "Type `curl https://forge.grive.test/journal`."
v2.hint.harmless.1: "The home page of the tool server lists the test harness: `curl https://outils.grive.test/`."
v2.hint.harmless.2: "Type `curl https://outils.grive.test/essai/journal`."
v2.hint.proof.1: "The other route of the test harness replays the `ajout` tool."
v2.hint.proof.2: "Type `curl https://outils.grive.test/essai/ajout`."
v2.hint.marker.1: "Copy the `FLAG{...}` from the `temoin` line and type `submit` followed by it."
v2.hint.who.1: "Go back to the history: who is the author of the commit with the note?"
v2.debrief.title: "From a commit message to a command"
v2.debrief.lesson: "Nobody attacked the server directly. A text was left where the agent reads, the agent used it as a parameter, and a tool turned the parameter into a command. The agent is the messenger: the flaw that executes is in the tool."
v2.debrief.p1: "Indirect injection: the instruction arrives in content the agent reads, here a commit message."
v2.debrief.p2: "An agent's tools receive values chosen by a model. They must treat them like any input from the internet."
v2.debrief.p3: "The same value was harmless on a tool that passes an argument list. The fix exists, and it is not in the model."
