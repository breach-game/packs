c1.briefing: "Vendredi 4 mai, 5 h 05. Tu es d'astreinte pour Transfluide, dont l'oléoduc alimente la moitié de la région. Il y a dix minutes, un opérateur de nuit a trouvé une demande de rançon sur un poste des bureaux. Les pompes tournent. Personne ne sait jusqu'où va l'attaque. La main courante de la cellule de crise est dans ton dossier."
c1.obj.profile: "Trouver par quel accès à distance l'intrus est entré"
c1.obj.old: "Dire ce qui n'allait pas avec cet accès"
c1.obj.cut: "Fermer cet accès"
c1.obj.stop: "Décider : arrête-t-on l'oléoduc ?"
c1.q.profile: "Quel profil d'accès à distance se connecte depuis une adresse inconnue ?"
c1.q.old: "Qu'est-ce qui rendait ce profil si dangereux ?"
c1.q.old.forgotten: "Il ne devait plus servir, et un mot de passe seul l'ouvrait"
c1.q.old.boss: "C'était le profil du responsable informatique, avec tous les droits"
c1.q.old.boss.why: "Le profil du responsable informatique est `dsi-01`, protégé par une appli. Relis la ligne de `profil-2019` : propriétaire, dernier usage prévu, second facteur."
c1.q.old.fresh: "Il venait d'être créé la veille de l'attaque par l'intrus"
c1.q.old.fresh.why: "Il date de 2019. L'intrus n'a rien eu à créer : la porte existait depuis des années, et personne ne la regardait."
c1.q.stop: "Les pompes tournent, la facturation parle à la supervision chaque minute, et on ignore jusqu'où va l'attaque. Que fait-on ?"
c1.q.stop.shutdown: "Arrêter tout l'oléoduc maintenant, le temps de savoir"
c1.q.stop.split: "Couper le lien entre bureaux et exploitation, et livrer sans compter"
c1.q.stop.run: "Continuer comme d'habitude en surveillant de près"
c1.contain.profile: "Désactiver le profil d'accès à distance utilisé par l'intrus"
c1.ada.brief: "Commence par `soc sources`, puis lis la main courante : `cat main-courante.txt`. Ensuite le journal des accès à distance : `soc logs vpn auth`."
c1.ada.g.profile: "`soc logs vpn auth` : les ingénieurs d'astreinte se connectent depuis 192.0.2.x avec leur appli. Un profil vient d'ailleurs, avec un mot de passe seul. `answer profile <profil>`."
c1.ada.g.profile.standard: "Trouve dans le journal des accès à distance le profil qui ne ressemble pas aux autres."
c1.ada.profile: "`profil-2019`, depuis 203.0.113.60, avec un mot de passe et rien d'autre. Regarde ce que Transfluide sait de ce profil : `cat vpn/profils.csv`. Une question."
c1.ada.g.old: "`cat vpn/profils.csv`, lis la ligne de `profil-2019`, puis réponds à ma question."
c1.ada.old: "Oui. Un profil partagé créé pour une migration en 2019, qui devait s'arrêter fin 2023, sans second facteur. Il suffisait que son mot de passe traîne quelque part. Regarde `flows` : cent gigaoctets sont déjà sortis du serveur de fichiers."
c1.ada.old.cut: "Ferme la porte."
c1.ada.g.cut: "`contain disable acces-intrus`. Regarde aussi `flows` pour voir ce qui est déjà sorti."
c1.ada.g.cut.standard: "Ferme l'accès par lequel l'intrus est entré. `contain` liste les mesures."
c1.ada.cut: "La porte est fermée. Mais on ne sait pas ce qu'il a laissé derrière lui, ni s'il a atteint la facturation, qui parle à la supervision chaque minute. Il est 5 h 40. Le directeur te regarde. Cette décision-là n'a pas de bonne réponse, seulement des prix différents."
c1.ada.g.stop: "Aucune réponse n'est fausse. Pèse ce qu'on sait, ce qu'on ignore, et ce que chaque choix coûte à la région."
c1.ada.stop.shutdown: "Arrêt complet. Dans une heure, plus rien ne coule. Les stations-service vont se vider et toute la région va en parler. Mais si quelque chose devait atteindre les pompes, il ne trouvera rien qui tourne."
c1.ada.stop.split: "Lien coupé. L'oléoduc livre, mais sans compteurs : personne ne sait plus ce qui est dû à qui, et la salle de contrôle travaille seule, sans les bureaux. Ça tient si le mur tient."
c1.ada.stop.run: "On continue. Si l'attaque s'arrête aux bureaux, tu auras eu raison et personne ne le saura. Si elle passe côté exploitation, on arrêtera en catastrophe au lieu d'arrêter proprement."
c1.ada.done: "Personne n'a touché aux pompes : ni l'intrus, ni toi. Ce qui a arrêté ou failli arrêter l'oléoduc, c'est le doute. Quand on ne sait pas où est le mur entre les bureaux et l'exploitation, on ne peut pas parier dessus. La semaine prochaine, on redémarre."
c1.hint.profile.1: "Une seule ligne du journal vient de 203.0.113.60."
c1.hint.profile.2: "`answer profile profil-2019`"
c1.hint.old.1: "`last_intended_use: 2023-12-31`, `second_factor: none`. `answer forgotten`"
c1.hint.cut.1: "`contain disable acces-intrus`"
c1.debrief.title: "Cinq heures du matin"
c1.debrief.lesson: "L'intrus est entré par un vieux profil d'accès à distance, oublié et protégé par un simple mot de passe. Il n'a jamais touché aux pompes. Mais comme personne ne pouvait dire avec certitude que le réseau des bureaux et celui de l'exploitation étaient séparés, la question de tout arrêter s'est posée en une heure."
c1.debrief.p1: "Tout accès à distance exige un second facteur. Les profils qui ne servent plus sont supprimés, pas laissés."
c1.debrief.p2: "Savoir, avant la crise, ce qui relie les bureaux à l'exploitation, et pouvoir couper ce lien sans arrêter la production."
c1.debrief.p3: "Préparer la décision d'arrêt à froid : qui décide, sur quels critères, et comment on redémarre."
