c1.briefing: "Friday 4 May, 5.05 am. You are on call for Transfluide, whose pipeline feeds half the region. Ten minutes ago, a night operator found a ransom demand on an office workstation. The pumps are running. Nobody knows how far the attack goes. The crisis team's log is in your folder."
c1.obj.profile: "Find which remote access the intruder came through"
c1.obj.old: "Say what was wrong with that access"
c1.obj.cut: "Close that access"
c1.obj.stop: "Decide: do we stop the pipeline?"
c1.q.profile: "Which remote access profile signs in from an unknown address?"
c1.q.old: "What made this profile so dangerous?"
c1.q.old.forgotten: "It was no longer meant to be used, and a password alone opened it"
c1.q.old.boss: "It was the head of IT's own profile, with every right"
c1.q.old.boss.why: "The head of IT's profile is `dsi-01`, protected by an app. Read the `profil-2019` line again: owner, last intended use, second factor."
c1.q.old.fresh: "The intruder had created it the day before the attack"
c1.q.old.fresh.why: "It dates from 2019. The intruder had nothing to create: the door had been there for years, and nobody was watching it."
c1.q.stop: "The pumps are running, billing talks to supervision every minute, and we do not know how far the attack goes. What do we do?"
c1.q.stop.shutdown: "Stop the whole pipeline now, until we know"
c1.q.stop.split: "Cut the link between offices and operations, and deliver without metering"
c1.q.stop.run: "Carry on as usual while watching closely"
c1.contain.profile: "Disable the remote access profile profil-2019"
c1.ada.brief: "Start with `soc sources`, then read the crisis log: `cat main-courante.txt`. Then the remote access log: `soc logs vpn auth`."
c1.ada.g.profile: "`soc logs vpn auth`: the engineers on call sign in from 192.0.2.x with their app. One profile comes from elsewhere, with a password alone. `answer profile <profile>`."
c1.ada.g.profile.standard: "Find in the remote access log the profile that does not look like the others."
c1.ada.profile: "`profil-2019`, from 203.0.113.60, with a password and nothing else. Look at what Transfluide knows about this profile: `cat vpn/profils.csv`. One question."
c1.ada.g.old: "`cat vpn/profils.csv`, read the `profil-2019` line, then answer my question."
c1.ada.old: "Yes. A shared profile created for a migration in 2019, meant to stop at the end of 2023, with no second factor. Its password only had to be lying around somewhere. Look at `flows`: a hundred gigabytes have already left the file server. Close the door."
c1.ada.g.cut: "`contain disable profil-2019`. Look at `flows` too, to see what has already left."
c1.ada.g.cut.standard: "Close the access the intruder came through. `contain` lists the measures."
c1.ada.cut: "The door is closed. But we do not know what they left behind, or whether they reached billing, which talks to supervision every minute. It is 5.40 am. The chief executive is looking at you. This decision has no right answer, only different prices."
c1.ada.g.stop: "No answer is wrong. Weigh what we know, what we do not, and what each choice costs the region."
c1.ada.stop.shutdown: "Full stop. Within the hour, nothing flows. Filling stations will run dry and the whole country will talk about it. But if anything was heading for the pumps, it will find nothing running."
c1.ada.stop.split: "Link cut. The pipeline delivers, but with no meters: nobody knows any more what is owed to whom, and the control room works alone, without the offices. It holds if the wall holds."
c1.ada.stop.run: "We carry on. If the attack stops at the offices, you will have been right and nobody will know. If it crosses to operations, we will stop in a panic instead of stopping cleanly."
c1.ada.done: "Nobody touched the pumps: not the intruder, not you. What stopped the pipeline, or nearly did, was doubt. When you do not know where the wall between offices and operations is, you cannot bet on it. Next week, we restart."
c1.hint.profile.1: "Only one line of the log comes from 203.0.113.60."
c1.hint.profile.2: "`answer profile profil-2019`"
c1.hint.old.1: "`last_intended_use: 2023-12-31`, `second_factor: none`. `answer forgotten`"
c1.hint.cut.1: "`contain disable profil-2019`"
c1.debrief.title: "Five in the morning"
c1.debrief.lesson: "The intruder came in through an old remote access profile, forgotten and protected by a password alone. They never touched the pumps. But because nobody could say for certain that the office network and the operations network were separate, the question of stopping everything had to be answered within an hour."
c1.debrief.p1: "Every remote access requires a second factor. Profiles no longer in use are deleted, not left."
c1.debrief.p2: "Know, before the crisis, what links offices to operations, and be able to cut that link without stopping production."
c1.debrief.p3: "Prepare the shutdown decision in calm times: who decides, on what criteria, and how you restart."
