file.readme: "Poste Ligne Rouge. Défis : pas d'indice, pas d'instruction, seulement le briefing et les objectifs. Tape `mission` pour les relire."
ada.outOfScope: "Stop. Cette cible est hors du mandat PG-2027-050. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT PG-2027-050\nClient : Polygone Services SAS, entretien de bâtiments. Périmètre : *.polygone.test, 10.87.0.0/24.\nObjet : neuf vérifications courtes, menées sans assistance, sur la boutique, la connexion unique, l'agent de support et des fichiers remis par l'équipe.\nDispositif convenu : la boutique a deux comptes de test, un compte client (session pg-client-2031) et un compte témoin (facture 2030), créés pour ce mandat. Aucun vrai client n'est consulté. Pour la vérification entre origines, l'origine témoin est https://audit-lignerouge.example. Un fichier témoin inoffensif, temoin.png, a été envoyé par le formulaire d'avatar pour ce mandat.\nSigné : la directrice des systèmes d'information de Polygone Services."
page.home.h1: "Polygone Services"
page.home.p: "Entretien, nettoyage et maintenance de vos bâtiments. Vos factures sont dans votre espace client."
page.home.footer: "Polygone Services SAS · espace client"
