title:
  fr: "Dossier 39 · 2. Redémarrer"
  en: "Case file 39 · 2. Restarting"
summary:
  fr: "Cinq jours plus tard, il faut remettre l'oléoduc en route sans rouvrir la porte. Tu comptes les accès à distance que personne n'utilise, tu réécris la politique d'accès et le mur entre bureaux et exploitation, tu décides comment redémarrer, puis tu remets la semaine dans l'ordre."
  en: "Five days later, the pipeline has to be started again without reopening the door. You count the remote accesses nobody uses, rewrite the access policy and the wall between offices and operations, decide how to restart, then put the week in order."
