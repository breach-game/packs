c2.ada.brief: "Lis la revue : `cat vpn/revue-profils.csv`. La colonne `status` dit ce qui sert encore."
c2.ada.g.unused: "Compte les profils inutilisés : `grep -c \",unused,\" vpn/revue-profils.csv`, puis `answer unused <nombre>`."
c2.ada.g.unused.standard: "Compte dans la revue les profils que personne n'utilise plus."
c2.ada.unused: "Quatre autres. Un prestataire qui n'est pas venu depuis 2027, un profil de test, un stagiaire parti, un audit terminé. Trois sur quatre sans second facteur. Le profil de vendredi n'était pas une exception : c'était le premier de la file. La politique : `acces/politique.yml`."
c2.ada.g.policy: "`cat acces/politique.yml` : chaque ligne donne ses valeurs possibles après le `#`. Choisis la plus stricte avec `sed -i` ou `edit`, puis `verify`."
c2.ada.g.policy.standard: "Corrige `acces/politique.yml`, puis lance `verify`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.policy: "Second facteur partout, plus de profil qui traîne ni de profil partagé, et surtout la dernière ligne : la facturation lit les volumes, mais plus rien ne peut remonter des bureaux vers les pompes. La prochaine fois, on saura où est le mur. Il reste à redémarrer, et c'est ta décision."
c2.ada.g.restart: "Aucune réponse n'est fausse : chacune coûte quelque chose de différent à Transfluide et à la région."
c2.ada.restart: "Noté. Il reste à raconter la semaine dans l'ordre."
c2.ada.g.story: "`timeline semaine` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline semaine <id> <id> …`."
c2.ada.g.story.standard: "Remets la semaine dans l'ordre, de la première connexion au redémarrage."
c2.ada.done: "L'oléoduc repart. Une région entière a fait la queue pour de l'essence à cause d'un mot de passe sur un profil que tout le monde avait oublié. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
c2.hint.unused.1: "`grep -c \",unused,\" vpn/revue-profils.csv`"
c2.hint.unused.2: "`answer unused 4`"
c2.hint.policy.1: "Les valeurs attendues : `required`, `removed-after-30-days`, `forbidden`, `one-way-data-diode`."
c2.hint.policy.2: "Par exemple `sed -i \"s/shared_profiles: allowed/shared_profiles: forbidden/\" acces/politique.yml`."
c2.hint.story.1: "Tout commence par une connexion et finit par le redémarrage. Les données sortent avant la demande de rançon."
c2.hint.story.2: "`timeline semaine signin data note closed decision reviewed restart`"
c2.debrief.title: "Redémarrer"
c2.debrief.lesson: "Le profil qui a servi à l'intrus n'était pas seul : quatre autres attendaient, inutilisés, la plupart sans second facteur. Et la vraie fragilité était ailleurs : un lien dans les deux sens entre la facturation et la supervision, qui obligeait à douter de tout."
c2.debrief.p1: "Relire régulièrement tous les accès à distance, et supprimer ceux qui ne servent plus."
c2.debrief.p2: "Entre les bureaux et l'exploitation, les données ne circulent que dans un sens : on lit les compteurs, on n'écrit jamais vers les pompes."
c2.debrief.p3: "S'entraîner à redémarrer : par étapes, avec des vérifications, et sans dépendre des systèmes de bureau."
c2.facts.title: "Ce qui s'est vraiment passé : Colonial Pipeline, 2021"
c2.facts.p1: "Le 7 mai 2021, peu avant 5 h du matin, un employé de Colonial Pipeline, qui transporte près de la moitié du carburant consommé sur la côte est des États-Unis, trouve une demande de rançon. À 6 h 10, les 5 500 miles d'oléoducs sont à l'arrêt."
c2.facts.p2: "Selon son directeur général devant le Sénat, l'arrêt visait à contenir l'attaque et à éviter qu'elle n'atteigne le réseau d'exploitation : à ce moment-là, l'entreprise ne connaissait ni son point de départ ni son étendue."
c2.facts.p3: "L'entreprise pense que l'attaquant a utilisé un ancien profil d'accès à distance (VPN) qui n'était plus censé servir. Ce profil n'avait qu'un seul facteur d'authentification : un mot de passe."
c2.facts.p4: "Colonial Pipeline paie le lendemain une rançon de 4,4 millions de dollars (75 bitcoins). Un mois plus tard, le ministère de la Justice annonce en avoir récupéré 63,7."
c2.facts.p5: "La remise en service commence le 12 mai au soir, après cinq jours d'arrêt."
