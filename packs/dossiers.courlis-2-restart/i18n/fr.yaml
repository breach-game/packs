c2.briefing: "Mercredi 9 mai, 8 h. Cinq jours que la région regarde ses stations-service. Les bureaux de Transfluide sont en reconstruction, et l'exploitation n'a montré aucune trace de l'intrus. Avant de redémarrer, la direction veut être sûre de ne pas rouvrir la porte. L'équipe a relu tous les profils d'accès à distance : `vpn/revue-profils.csv`."
