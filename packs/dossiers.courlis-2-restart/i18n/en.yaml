c2.briefing: "Wednesday 9 May, 8 am. Transfluide's offices are being rebuilt, and operations have shown no trace of the intruder. Before going back to normal, management wants to be sure not to reopen the door. The team has reviewed every remote access profile: `vpn/revue-profils.csv`."
c2.obj.unused: "Count the remote accesses nobody uses"
c2.obj.policy: "Rewrite remote access and the wall between offices and operations"
c2.obj.restart: "Decide how to go back to normal"
c2.ada.since.shutdown: "Five days since the pipeline stopped, and the region has watched its filling stations run dry. It has to be restarted, without reopening the door."
c2.ada.since.split: "Five days of the pipeline delivering without meters, the control room on its own and the offices kept apart. The wall held. Now everything has to be started again properly, without reopening the door."
c2.ada.since.run: "Five days of the pipeline running as usual. The attack stopped at the offices: we were lucky, and management knows it. Before the rebuilt offices are connected again, the door must be closed for good."
c2.ada.done.kept: "Everything goes back to normal. The region kept its petrol, but it all rested on a wall between the offices and the pumps, and it all started with a password on a profile everyone had forgotten. The next card tells the real case this file is inspired by."
c2.obj.story: "Put the week in order"
c2.q.unused: "Besides the one the intruder used, how many profiles are marked `unused`?"
c2.q.restart: "Operations look healthy, the offices are not rebuilt. How do you go back to normal?"
c2.q.restart.staged: "Section by section, after checking each control station"
c2.q.restart.manual: "Right away, by hand, with no meters and no billing"
c2.q.restart.rebuilt: "Only once all the offices have been rebuilt"
c2.check.factor: "The second factor is required for every remote access"
c2.check.unused: "An unused profile is removed after 30 days"
c2.check.shared: "No shared profile"
c2.check.wall: "Billing reads supervision, and cannot write to it"
c2.check.works: "Engineers on call can still sign in"
c2.tl.text: "Transfluide's week"
c2.tl.signin: "Someone signs in with an old remote access profile"
c2.tl.data: "A hundred gigabytes leave the office file server"
c2.tl.note: "A night operator finds the ransom demand"
c2.tl.closed: "The old profile is disabled"
c2.tl.decision: "The crisis team decides the pipeline's fate"
c2.tl.reviewed: "Every remote access profile is reviewed"
c2.tl.restart: "The pipeline goes back to normal operation"
c2.ada.brief: "Read the review: `cat vpn/revue-profils.csv`. The `status` column says what is still in use."
c2.ada.g.unused: "Count the unused profiles: `grep -c \",unused,\" vpn/revue-profils.csv`, then `answer unused <number>`."
c2.ada.g.unused.standard: "Count in the review the profiles nobody uses any more."
c2.ada.unused: "Four more. A contractor who has not come since 2027, a test profile, a trainee who left, a finished audit. Three out of four with no second factor. Friday's profile was no exception: it was first in the queue. The policy: `acces/politique.yml`."
c2.ada.g.policy: "`cat acces/politique.yml`: each line gives its possible values after the `#`. Four must change: `required`, `removed-after-30-days`, `forbidden`, `one-way-data-diode`. Change them with `edit acces/politique.yml` or `sed -i`, then `verify`."
c2.ada.g.policy.standard: "Fix `acces/politique.yml`, then run `verify`. To open the file: `edit acces/politique.yml`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.policy: "A second factor everywhere, no more profile lying around and no shared one, and above all the last line: billing reads the volumes, but nothing can travel from the offices back to the pumps. Next time, we will know where the wall is. What is left is going back to normal, and that is your decision."
c2.ada.g.restart: "No answer is wrong: each one costs Transfluide and the region something different."
c2.ada.restart: "Noted. All that is left is telling the week in order."
c2.ada.g.story: "`timeline semaine` shows the events shuffled. Answer with their ids in order: `timeline semaine <id> <id> …`."
c2.ada.g.story.standard: "Put the week in order, from the first sign-in to the return to normal."
c2.ada.done: "The pipeline is running again. A whole region queued for petrol because of a password on a profile everyone had forgotten. The next card tells the real case this file is inspired by."
c2.hint.unused.1: "`grep -c \",unused,\" vpn/revue-profils.csv`"
c2.hint.unused.2: "`answer unused 4`"
c2.hint.policy.1: "The expected values: `required`, `removed-after-30-days`, `forbidden`, `one-way-data-diode`."
c2.hint.policy.2: "With the editor: `edit acces/politique.yml`, then Ctrl+S. With a command: for example `sed -i \"s/shared_profiles: allowed/shared_profiles: forbidden/\" acces/politique.yml`."
c2.hint.story.1: "It all starts with a sign-in and ends with the restart. The data leaves before the ransom demand."
c2.hint.story.2: "`timeline semaine signin data note closed decision reviewed restart`"
c2.debrief.title: "Restarting"
c2.debrief.lesson: "The profile the intruder used was not alone: four others were waiting, unused, most with no second factor. And the real weakness lay elsewhere: a two-way link between billing and supervision, which made it necessary to doubt everything."
c2.debrief.p1: "Review every remote access regularly, and delete those no longer in use."
c2.debrief.p2: "Between offices and operations, data flows one way only: you read the meters, you never write to the pumps."
c2.debrief.p3: "Practise restarting: in stages, with checks, and without depending on office systems."
c2.facts.title: "What really happened: Colonial Pipeline, 2021"
c2.facts.p1: "On 7 May 2021, shortly before 5 am, an employee of Colonial Pipeline, which carries nearly half the fuel used on the US East Coast, finds a ransom demand. By 6.10 am, all 5,500 miles of pipeline are shut down."
c2.facts.p2: "According to its chief executive before the Senate, the shutdown was meant to contain the attack and keep it from reaching the operations network: at that moment the company knew neither where it had started nor how far it went."
c2.facts.p3: "The company believes the attacker used a legacy remote access (VPN) profile that was no longer meant to be in use. That profile had a single authentication factor: a password."
c2.facts.p4: "Colonial Pipeline pays a ransom of 4.4 million dollars (75 bitcoins) the next day. A month later, the Department of Justice announces it has recovered 63.7 of them."
c2.facts.p5: "The return to service begins on the evening of 12 May, after five days of shutdown."
