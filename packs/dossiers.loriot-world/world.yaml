# Dossier 19. Everything here is fictional: reserved .test and .example domains, private addresses only.
startTime: "2027-11-04T09:00:00+01:00"
mandate: LO-2027-019
scope:
  domains: ["*.loriot.test"]
  networks: ["10.79.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.79.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.79.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -300, z: 40, h: 70 }
    links: [forge]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            LO-2027-019.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # The public code forge: repository, CI runs and their logs, readable by anyone.
  - id: forge
    hostname: forge.loriot.test
    ip: 10.79.0.20
    os: Linux 6.1 (Debian 12)
    map: { x: 90, z: -60, h: 130 }
    services:
      - { port: 443, name: https, product: forge 1.22 }
    web:
      "/":
        page:
          title: web.home.title
          blocks:
            - h1: web.home.h1
            - p: web.home.p1
            - link: { href: "/loriot/loriot-ui/actions", label: web.home.runs }
            - footer: web.footer
      "/loriot/loriot-ui/actions":
        page:
          title: web.runs.title
          blocks:
            - h1: web.runs.h1
            - p: web.runs.p1
            - table:
                head: [web.runs.col.run, web.runs.col.when, web.runs.col.what, web.runs.col.result]
                rows:
                  - ["812", "2027-11-04 06:12", "push: fix button focus", "success"]
                  - ["811", "2027-11-03 17:40", "push: readme", "success"]
            - link: { href: "/loriot/loriot-ui/actions/runs/812/log", label: web.runs.log812 }
            - link: { href: "/loriot/loriot-ui/actions/runs/811/log", label: web.runs.log811 }
            - footer: web.footer
      "/loriot/loriot-ui/actions/runs/812/log":
        headers: { content-type: text/plain }
        body: { $file: files/run-812.log }
      "/loriot/loriot-ui/actions/runs/811/log":
        headers: { content-type: text/plain }
        body: { $file: files/run-811.log }

dns:
  loriot.test: { A: ["10.79.0.10"] }
  forge.loriot.test: { A: ["10.79.0.20"] }

whois:
  loriot.test: |
    Domain Name: LORIOT.TEST
    Creation Date: 2016-05-19T08:00:00Z
    Registrant Organization: Loriot SARL
    Registrant Country: FR

noise:
  nmap:
    base: 18
    flags: { "-sn": -10, "-sV": 10, "-A": 30, "-T4": 18, "-T5": 36, "-p-": 16 }
  dig: 0
  whois: 0
  curl: 1
  browse: 1
  chat: 2

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected
