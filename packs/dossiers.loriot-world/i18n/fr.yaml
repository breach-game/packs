file.mandate: "MANDAT LO-2027-019\nClient : Loriot SARL, éditrice de la bibliothèque libre loriot-ui. Périmètre : *.loriot.test, 10.79.0.0/24.\nObjet : une alerte publique dit qu'une action d'intégration continue très utilisée, fichiers-modifies, a été modifiée cette nuit. Loriot l'utilise. Ligne Rouge vérifie ce que les journaux publics de Loriot ont laissé voir, corrige la chaîne d'intégration et prépare la suite.\nDispositif convenu : Ligne Rouge lit la forge publique de Loriot et ses journaux, et modifie la configuration d'intégration sur une copie. Ligne Rouge ne touche pas à l'action tierce ni au registre de paquets.\nSigné : la mainteneuse principale de loriot-ui."
