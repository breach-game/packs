g1.briefing: "Mardi 14 décembre, 8 h 30. Hier soir, Sentinelle Logiciels, l'éditeur de Vigie, a publié un avis : certaines de ses mises à jour, signées par lui, contenaient du code qu'il n'a pas écrit. Vigie surveille tout le réseau d'Altaïr, avec un compte qui entre partout. L'avis est dans `traces/`. Les serveurs sont ouverts à l'équipe de réponse à incident par le compte `ir`."
g1.obj.version: "Trouver la version de Vigie installée chez Altaïr"
g1.obj.rule: "Écrire la règle qui voit les balises DNS de Vigie"
g1.obj.isolate: "Isoler le serveur Vigie"
g1.obj.trust: "Dire comment un fichier signé a pu cacher une porte dérobée"
g1.q.version: "Quel numéro de build de Vigie est installé sur le serveur ? (format 2027.x.x.xxxx)"
g1.q.trust: "La bibliothèque piégée porte la signature valide de Sentinelle. Comment est-ce possible ?"
g1.q.trust.chain: "Le code a été ajouté chez l'éditeur, avant la signature"
g1.q.trust.mirror: "Altaïr a pris la mise à jour sur un faux site"
g1.q.trust.mirror.why: "Un faux site ne pourrait pas signer au nom de Sentinelle. La mise à jour venait bien de l'éditeur, et l'avis le dit."
g1.q.trust.insider: "Un administrateur d'Altaïr a remplacé le fichier"
g1.q.trust.insider.why: "Le fichier est identique chez tous les clients touchés, et l'éditeur lui-même dit qu'il sort de son système de fabrication."
g1.contain.isolate: "Couper le serveur Vigie du réseau (la supervision s'arrête le temps de l'enquête)"
g1.ada.brief: "Lis l'avis : `cat traces/avis-sentinelle.txt`. Puis va voir quelle version tourne chez Altaïr."
g1.ada.g.version: "Connecte-toi au serveur : `ssh ir@vigie.altair.test`, puis `cat /opt/vigie/VERSION`. Regarde aussi ce que contient la bibliothèque principale : `strings /opt/vigie/lib/Vigie.Coeur.so`. Reviens avec `exit`, puis `answer version <build>`."
g1.ada.g.version.standard: "Trouve sur le serveur Vigie (compte `ir`) le numéro de build installé, et compare-le à la liste de l'avis."
g1.ada.version: "Build 2027.2.0.4411, installé le 24 novembre : dans la liste. Sa bibliothèque principale, `/opt/vigie/lib/Vigie.Coeur.so`, contient d'ailleurs le nom nuage-vigie.example. Voyons si le serveur l'appelle."
g1.ada.g.rule: "Regarde les requêtes du résolveur : `soc logs dns dns`. Puis `echo \"name|endswith: .nuage-vigie.example\" >> regles/balise-vigie.yml` et `rule test regles/balise-vigie.yml`. Ou à la main, dans l'éditeur : `edit regles/balise-vigie.yml`, puis Ctrl+S."
g1.ada.g.rule.standard: "Écris une règle qui voit chaque requête vers le domaine des balises, et aucune requête ordinaire, même celles de Vigie vers le vrai serveur de mises à jour. Le nom demandé est le champ `name`. Pour ouvrir le fichier : `edit regles/balise-vigie.yml`."
g1.ada.again: "Ta règle rate des balises ou alerte sur une requête ordinaire. Vise la fin du nom demandé, pas l'adresse du serveur : Vigie fait aussi des requêtes normales."
g1.ada.rule.after: "Elle voit chaque balise et laisse passer le reste. Le serveur est déjà isolé : celle-là est la dernière à être sortie."
g1.ada.rule: "Elle voit chaque balise et laisse passer le reste. D'après l'avis, les réponses lui disent sans doute de rester tranquille. Il est temps de couper."
g1.ada.g.isolate: "`contain isolate supervision`. La supervision s'arrête quelques jours : c'est le prix."
g1.ada.g.isolate.standard: "Coupe le serveur Vigie du réseau."
g1.ada.isolate: "Serveur isolé : les balises suivantes ne sortiront plus. Une question avant la suite."
g1.ada.g.trust: "Relis le résumé de l'avis : où le code a-t-il été ajouté ?"
g1.ada.done: "Le serveur est coupé. Demain, on regarde ce que l'intrus a fait pendant qu'il était là, et avec quel compte."
g1.hint.version.1: "Le fichier `/opt/vigie/VERSION` est sur le serveur `vigie.altair.test`, pas sur ton poste."
g1.hint.version.2: "`answer version 2027.2.0.4411`"
g1.hint.rule.1: "Le champ s'appelle `name`. Le modificateur `|endswith` vise la fin d'un nom."
g1.hint.rule.2: "`echo \"name|endswith: .nuage-vigie.example\" >> regles/balise-vigie.yml` Ou à la main, dans l'éditeur : `edit regles/balise-vigie.yml`, puis Ctrl+S."
g1.hint.isolate.1: "`contain isolate supervision`"
g1.debrief.title: "La mise à jour"
g1.debrief.lesson: "Une signature dit qui a publié un fichier, pas que son code est sain. Quand la chaîne de fabrication d'un éditeur est compromise, la mise à jour piégée arrive signée, par le canal normal, chez tous ses clients. Ce qui la trahit, c'est ce qu'elle fait ensuite : ici, des requêtes DNS vers un domaine qu'aucune machine d'Altaïr n'a de raison d'appeler."
g1.debrief.p1: "Tenir l'inventaire des versions installées, pour répondre en minutes à un avis d'éditeur."
g1.debrief.p2: "Journaliser les requêtes DNS du réseau : une porte dérobée doit bien appeler quelqu'un."
g1.debrief.p3: "Ne laisser sortir vers Internet que ce dont un serveur a besoin : un outil de supervision n'a rien à demander dehors."
