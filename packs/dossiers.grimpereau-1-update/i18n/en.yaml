g1.briefing: "Tuesday 14 December, 8:30. Last night, Sentinelle Logiciels, Vigie's vendor, published an advisory: some of its updates, signed by the vendor, contained code it did not write. Vigie monitors Altaïr's whole network, with an account that gets in everywhere. The advisory is in `traces/`. The servers are open to the incident response team through the `ir` account."
g1.obj.version: "Find the Vigie build installed at Altaïr"
g1.obj.rule: "Write the rule that sees Vigie's DNS beacons"
g1.obj.isolate: "Isolate the Vigie server"
g1.obj.trust: "Say how a signed file could hide a backdoor"
g1.q.version: "Which Vigie build number is installed on the server? (format 2027.x.x.xxxx)"
g1.q.trust: "The trapped library carries Sentinelle's valid signature. How is that possible?"
g1.q.trust.chain: "The code was added at the vendor, before signing"
g1.q.trust.mirror: "Altaïr took the update from a fake website"
g1.q.trust.mirror.why: "A fake website could not sign as Sentinelle. The update did come from the vendor, and the advisory says so."
g1.q.trust.insider: "An Altaïr administrator swapped the file"
g1.q.trust.insider.why: "The file is the same at every affected customer, and the vendor itself says it came out of its build system."
g1.contain.isolate: "Cut the Vigie server off the network (monitoring stops while we investigate)"
g1.ada.brief: "Read the advisory: `cat traces/avis-sentinelle.txt`. Then go and see which build runs at Altaïr."
g1.ada.g.version: "Connect to the server: `ssh ir@vigie.altair.test`, then `cat /opt/vigie/VERSION`. Also look inside the main library: `strings /opt/vigie/lib/Vigie.Coeur.so`. Come back with `exit`, then `answer version <build>`."
g1.ada.g.version.standard: "Find the installed build number on the Vigie server (account `ir`) and compare it to the advisory's list."
g1.ada.version: "Build 2027.2.0.4411, installed on 24 November: on the list. Its main library, `/opt/vigie/lib/Vigie.Coeur.so`, even holds the name nuage-vigie.example. Let's see whether the server calls it."
g1.ada.g.rule: "Look at the resolver's queries: `soc logs dns dns`. Then `echo \"name|endswith: .nuage-vigie.example\" >> regles/balise-vigie.yml` and `rule test regles/balise-vigie.yml`. Or by hand, in the editor: `edit regles/balise-vigie.yml`, then Ctrl+S."
g1.ada.g.rule.standard: "Write a rule that sees every query to the beacon domain and no ordinary query, not even Vigie's own queries to the real update server. The queried name is the `name` field. To open the file: `edit regles/balise-vigie.yml`."
g1.ada.again: "Your rule misses beacons or fires on an ordinary query. Aim at the end of the queried name, not the server's address: Vigie makes normal queries too."
g1.ada.rule.after: "It sees every beacon and lets the rest through. The server is already isolated: that one was the last to get out."
g1.ada.rule: "It sees every beacon and lets the rest through. According to the advisory, the answers most likely tell it to stay quiet. Time to cut it off."
g1.ada.g.isolate: "`contain isolate supervision`. Monitoring stops for a few days: that is the price."
g1.ada.g.isolate.standard: "Cut the Vigie server off the network."
g1.ada.isolate: "Server isolated: the next beacons won't get out. One question before we go on."
g1.ada.g.trust: "Read the advisory's summary again: where was the code added?"
g1.ada.done: "The server is cut off. Tomorrow we look at what the intruder did while it was there, and with which account."
g1.hint.version.1: "The file `/opt/vigie/VERSION` is on the server `vigie.altair.test`, not on your workstation."
g1.hint.version.2: "`answer version 2027.2.0.4411`"
g1.hint.rule.1: "The field is called `name`. The `|endswith` modifier aims at the end of a name."
g1.hint.rule.2: "`echo \"name|endswith: .nuage-vigie.example\" >> regles/balise-vigie.yml` Or by hand, in the editor: `edit regles/balise-vigie.yml`, then Ctrl+S."
g1.hint.isolate.1: "`contain isolate supervision`"
g1.debrief.title: "The update"
g1.debrief.lesson: "A signature says who published a file, not that its code is sound. When a vendor's build chain is compromised, the trapped update arrives signed, through the normal channel, at every customer. What gives it away is what it does next: here, DNS queries to a domain no Altaïr machine has any reason to call."
g1.debrief.p1: "Keep an inventory of installed versions, to answer a vendor advisory in minutes."
g1.debrief.p2: "Log the network's DNS queries: a backdoor has to call someone."
g1.debrief.p3: "Let a server reach the Internet only for what it needs: a monitoring tool has nothing to ask outside."
