npc.suivi.role: "Formulaire de suivi des commandes"
npc.suivi.found: "Commande trouvée : elle est à l'atelier. Tu recevras un mail à l'expédition."
npc.suivi.none: "Aucune commande avec cette référence."
npc.suivi.error: "Error 500\n\nquery failed: SELECT * FROM orders WHERE ref = 'PX-1042'' (unterminated string)\ndebug token: FLAG{pixel-quote-error-8b21}"
npc.bench.role: "Imprimante de test sur le banc"
npc.bench.pause: "pixel/banc/etat {\"job\":\"calibration\",\"state\":\"paused\"}\n\ntest bench: paused by client kestrel.\n  no account asked, no right checked.\n  audit marker: FLAG{pixel-anyone-commands-c41d}"
npc.bench.start: "pixel/banc/etat {\"job\":\"calibration\",\"state\":\"printing\"}"
npc.bench.denied: "(pas de réponse : le courtier a jeté le message, ce client n'a pas le droit d'écrire sur ce sujet)"
npc.bench.unknown: "pixel/banc/etat unchanged (expected: pause, start)"
npc.printers.role: "Imprimantes au travail pour les clients"
npc.printers.order: "(copie d'audit : rien n'a bougé sur les imprimantes. Ordre noté, interdit par le mandat.)"
npc.printers.unknown: "(copie d'audit : message ignoré)"
