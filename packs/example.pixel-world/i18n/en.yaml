npc.suivi.role: "Order tracking form"
npc.suivi.found: "Order found: it is in the workshop. You will get an email when it ships."
npc.suivi.none: "No order with this reference."
npc.suivi.error: "Error 500\n\nquery failed: SELECT * FROM orders WHERE ref = 'PX-1042'' (unterminated string)\ndebug token: FLAG{pixel-quote-error-8b21}"
npc.bench.role: "Test printer on the bench"
npc.bench.pause: "pixel/banc/etat {\"job\":\"calibration\",\"state\":\"paused\"}\n\ntest bench: paused by client kestrel.\n  no account asked, no right checked.\n  audit marker: FLAG{pixel-anyone-commands-c41d}"
npc.bench.start: "pixel/banc/etat {\"job\":\"calibration\",\"state\":\"printing\"}"
npc.bench.denied: "(no answer: the broker dropped the message, this client may not write to this topic)"
npc.bench.unknown: "pixel/banc/etat unchanged (expected: pause, start)"
npc.printers.role: "Printers working for customers"
npc.printers.order: "(audit copy: nothing changed on the printers. Order logged, forbidden by the mandate.)"
npc.printers.unknown: "(audit copy: message ignored)"
