file.readme: |
  Ligne Rouge workstation, linked by VPN to Atelier Pixel's network.
  Whatever you type here only reaches that network.

    help              the list of commands
    mission           the briefing and current objectives
    hint              a hint from Ada, if you get stuck

  Read the mandate first:  cat mandate/AP-2026-007.txt

  Ada
file.mandate: |
  ==============================================================
   LIGNE ROUGE  ·  penetration testing firm
   PENETRATION TEST MANDATE  No. AP-2026-007
  ==============================================================

  CLIENT          Atelier Pixel SARL, Nantes
  SIGNED BY       Chloé Garnier, manager
  TESTERS         Ada (lead), {user} (junior)

  SCOPE           *.atelier-pixel.test, 10.42.0.0/24
                  Anything else is FORBIDDEN.

  RULES           Read only: no change, no deletion, no denial
                  of service. Stop and report any sensitive data.

  Without this written authorisation, accessing an information
  system is a criminal offence (article 323-1 of the French Penal
  Code). The mandate is what separates a tester from an intruder.
