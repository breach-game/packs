web.home.title: Atelier Pixel · 3D printing in Nantes
web.home.h1: Your ideas, layer by layer
web.home.p1: "Atelier Pixel prints your parts, prototypes and figurines in two days, in Nantes since 2021."
web.home.item1: "PLA and PETG in 24 colours"
web.home.item2: "Resin for fine details"
web.home.item3: "Free quote from Pixou, our ordering assistant"
