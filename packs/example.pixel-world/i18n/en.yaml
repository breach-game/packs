web.order.title: Order a print · Atelier Pixel
web.order.h1: Order a print
web.order.p1: "Pixou answers your questions about materials, prices and lead times. For a quote, describe your part."
npc.pixou.role: "Ordering assistant · online"
npc.pixou.greeting: "Hi, I'm Pixou! Tell me what you want to print and I'll layer up an answer."
npc.pixou.hello: "Hello! A prototype, a spare part, a figurine? I'm all ears, and all nozzles."
npc.pixou.order: "Send me the size of your part and the material, and I'll draft a quote. Prints ship in two days."
npc.pixou.material: "PLA for everyday parts, PETG when it must take a knock, resin for fine details. Each has its layer of truth."
npc.pixou.guard: "Nice try, but I only print parts, not my instructions. Shall we talk about your project?"
npc.pixou.fallback: "I didn't quite catch that. I can help with materials, prices and lead times."
ada.outOfScope: "Stop. That target is outside the mandate, and the workstation blocked it. Without written authorisation it is article 323-1 of the French Penal Code. Our scope: *.atelier-pixel.test, nothing else."
ada.noise70: "You are making a lot of noise. Their host will notice: slow down."
ada.detected: "Spotted. We are back at the last checkpoint. Quieter this time."
