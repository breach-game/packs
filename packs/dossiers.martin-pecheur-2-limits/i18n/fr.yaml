m2.hint.story.2: "`timeline journee setup morning raise revert cut guard`"
m2.debrief.title: "Les garde-fous"
m2.debrief.lesson: "On ne sait pas toujours si un incident vient d'un intrus ou d'une erreur. Les bons garde-fous n'ont pas besoin de le savoir : une limite que la machine refuse de dépasser, une alarme quand une consigne change, et un nom derrière chaque session protègent l'eau dans les deux cas."
m2.debrief.p1: "Mettre dans le système de supervision des limites de consigne qui suivent ce que l'installation supporte."
m2.debrief.p2: "Faire sonner une alarme à chaque changement de consigne, d'où qu'il vienne."
m2.debrief.p3: "Donner un compte personnel et un second facteur à chaque accès à distance, et tenir la liste de qui peut entrer."
m2.facts.title: "Ce qui s'est vraiment passé : Oldsmar, février 2021"
m2.facts.p1: "Le 5 février 2021, à l'usine de traitement d'eau d'Oldsmar, en Floride, un opérateur voit le curseur bouger sur l'écran de supervision et la consigne de soude passer de 100 à 11 100 ppm. Il la baisse aussitôt : l'eau n'est jamais touchée."
m2.facts.p2: "Selon l'avis du FBI et de la CISA, l'usine utilisait TeamViewer avec un mot de passe partagé par tout le personnel, sur des postes Windows 7 reliés à Internet sans pare-feu."
m2.facts.p3: "Les autorités locales présentent l'affaire comme une intrusion. Elle devient l'exemple le plus cité des attaques contre les services d'eau."
m2.facts.p4: "En 2023, l'ancien directeur général de la ville déclare que l'incident venait probablement d'un employé qui avait cliqué par erreur, et que, selon lui, l'enquête du FBI n'a trouvé aucune preuve d'intrusion. Aucune conclusion officielle n'a été publiée."
m2.facts.p5: "Intrus ou erreur, l'avis de 2021 reste une référence : comptes personnels pour l'accès à distance, limites de consigne et alarmes."
