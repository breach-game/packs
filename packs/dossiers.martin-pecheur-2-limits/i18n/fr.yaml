m2.tl.guard: "Les limites, l'alarme et les comptes personnels sont posés"
m2.ada.brief: "Commence par la procédure : `cat traces/procedure-astreinte.txt`. Elle dit jusqu'où la pompe peut aller. Puis regarde les limites du poste : `cat ihm/limites.conf`."
m2.ada.g.limits: "La limite actuelle laisse passer 20 000 ppm. `sed -i \"s/NaOH_ppm_max: 20000/NaOH_ppm_max: 150/\" ihm/limites.conf`, puis `verify`."
m2.ada.g.limits.standard: "Fixe le maximum de la consigne de soude à ce que la procédure dit que la pompe supporte, puis vérifie."
m2.ada.limits: "Avec cette limite, le poste aurait refusé 11 100 ppm, qu'il s'agisse d'un intrus ou d'un doigt qui glisse."
m2.ada.g.alarm: "`sed -i \"s/alarm_on_change: off/alarm_on_change: on/\" ihm/limites.conf`, puis `verify`."
m2.ada.g.alarm.standard: "Fais en sorte que chaque changement de consigne prévienne les opérateurs."
m2.ada.g.accounts: "Regarde `cat acces/acces-distance.conf`. Puis `sed -i \"s/accounts: shared/accounts: individual/\" acces/acces-distance.conf`, `sed -i \"s/mfa: off/mfa: on/\" acces/acces-distance.conf` et `verify`."
m2.ada.g.accounts.standard: "Plus de compte partagé, et un second facteur à la connexion."
m2.ada.accounts: "Avec un compte par personne, la prochaine session aura un nom. La direction doit maintenant trancher."
m2.ada.g.future: "Aucune réponse n'est fausse : chacune coûte autre chose à l'astreinte."
m2.ada.future: "Noté. Il reste à raconter la journée."
m2.ada.g.story: "`timeline journee` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline journee <id> <id> …`."
m2.ada.g.story.standard: "Remets la journée dans l'ordre, de l'installation aux garde-fous."
m2.ada.done: "Intrus ou pas, la soude ne peut plus monter au-delà de ce que la pompe supporte, et chaque session a un nom. La fiche qui suit raconte l'affaire réelle, et pourquoi on n'est toujours pas sûr de ce qui s'est passé."
m2.hint.limits.1: "La procédure dit que la pompe ne peut pas doser plus de 150 ppm sans danger."
m2.hint.limits.2: "`sed -i \"s/NaOH_ppm_max: 20000/NaOH_ppm_max: 150/\" ihm/limites.conf`"
m2.hint.alarm.1: "`sed -i \"s/alarm_on_change: off/alarm_on_change: on/\" ihm/limites.conf`"
m2.hint.accounts.1: "Deux lignes à changer dans `acces/acces-distance.conf` : `accounts` et `mfa`."
m2.hint.accounts.2: "`sed -i \"s/accounts: shared/accounts: individual/\" acces/acces-distance.conf` puis `sed -i \"s/mfa: off/mfa: on/\" acces/acces-distance.conf`"
