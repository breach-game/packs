m2.briefing: "Lundi 8 février, 9 h. TéléPoste est coupé depuis vendredi. L'enquête ne dit pas encore si la session de 13 h 28 était un intrus ou une fausse manœuvre d'un collègue. La direction veut des garde-fous qui tiennent dans les deux cas. Les réglages du poste sont dans `ihm/` et `acces/`, la procédure d'astreinte dans `traces/`."
