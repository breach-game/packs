m2.briefing: "Monday 8 February, 9:00. TelePoste has been off since Friday. The investigation does not say yet whether the 13:28 session was an intruder or a colleague's slip. Management wants safeguards that hold either way. The workstation's settings are in `ihm/` and `acces/`, the on-call procedure in `traces/`."
m2.obj.limits: "Limit the sodium hydroxide setpoint to what the pump can take"
m2.obj.alarm: "Sound an alarm on every setpoint change"
m2.obj.accounts: "Switch remote access to one account per person, with a second factor"
m2.obj.future: "Decide how to reopen remote access"
m2.obj.story: "Put the day in order"
m2.check.limits: "The sodium hydroxide setpoint can no longer go above 150 ppm"
m2.check.alarm: "A setpoint change sounds the alarm"
m2.check.accounts: "One account per person, with a second factor"
m2.check.works: "The plant's other limits are untouched"
m2.q.future: "How does the Board reopen remote access?"
m2.q.future.vpn: "Through a VPN, one account and second factor per person"
m2.q.future.lookonly: "Read only: look remotely, act on site"
m2.q.future.onsite: "Never again: on-call staff travel for everything"
m2.tl.text: "From TelePoste's setup to the safeguards"
m2.tl.setup: "TelePoste is installed with one account for all, password in the binder"
m2.tl.morning: "A short session at 08:00 that nobody notices"
m2.tl.raise: "At 13:30, the sodium hydroxide setpoint goes from 100 to 11,100 ppm"
m2.tl.revert: "The operator puts it back to 100 ppm at once"
m2.tl.cut: "TelePoste is disabled"
m2.tl.guard: "The limits, the alarm and personal accounts are in place"
m2.ada.brief: "Start with the procedure: `cat traces/procedure-astreinte.txt`. It says how far the pump can go. Then look at the workstation's limits: `cat ihm/limites.conf`."
m2.ada.g.limits: "The current limit lets 20,000 ppm through. `sed -i \"s/NaOH_ppm_max: 20000/NaOH_ppm_max: 150/\" ihm/limites.conf`, then `verify`."
m2.ada.g.limits.standard: "Set the sodium hydroxide setpoint's maximum to what the procedure says the pump can take, then verify."
m2.ada.limits: "With that limit, the workstation would have refused 11,100 ppm, whether from an intruder or a slipping finger."
m2.ada.g.alarm: "`sed -i \"s/alarm_on_change: off/alarm_on_change: on/\" ihm/limites.conf`, then `verify`."
m2.ada.g.alarm.standard: "Make every setpoint change warn the operators."
m2.ada.g.accounts: "Look at `cat acces/acces-distance.conf`. Then `sed -i \"s/accounts: shared/accounts: individual/\" acces/acces-distance.conf`, `sed -i \"s/mfa: off/mfa: on/\" acces/acces-distance.conf` and `verify`."
m2.ada.g.accounts.standard: "No more shared account, and a second factor at sign-in."
m2.ada.accounts: "With one account per person, the next session will have a name. Management now has to decide."
m2.ada.g.future: "No answer is wrong: each one costs the on-call team something different."
m2.ada.future: "Noted. All that is left is telling the day's story."
m2.ada.g.story: "`timeline journee` shows the events shuffled. Answer with their ids in order: `timeline journee <id> <id> …`."
m2.ada.g.story.standard: "Put the day in order, from installation to the safeguards."
m2.ada.done: "Intruder or not, the sodium hydroxide can no longer go beyond what the pump can take, and every session has a name. The next card tells the real case, and why we still don't know for sure what happened."
m2.hint.limits.1: "The procedure says the pump cannot safely dose more than 150 ppm."
m2.hint.limits.2: "`sed -i \"s/NaOH_ppm_max: 20000/NaOH_ppm_max: 150/\" ihm/limites.conf`"
m2.hint.alarm.1: "`sed -i \"s/alarm_on_change: off/alarm_on_change: on/\" ihm/limites.conf`"
m2.hint.accounts.1: "Two lines to change in `acces/acces-distance.conf`: `accounts` and `mfa`."
m2.hint.accounts.2: "`sed -i \"s/accounts: shared/accounts: individual/\" acces/acces-distance.conf` then `sed -i \"s/mfa: off/mfa: on/\" acces/acces-distance.conf`"
m2.hint.story.1: "It all starts when TelePoste is installed, and the safeguards come last."
m2.hint.story.2: "`timeline journee setup morning raise revert cut guard`"
m2.debrief.title: "The safeguards"
m2.debrief.lesson: "You do not always know whether an incident comes from an intruder or a mistake. Good safeguards do not need to know: a limit the machine refuses to exceed, an alarm when a setpoint changes, and a name behind every session protect the water either way."
m2.debrief.p1: "Put setpoint limits in the supervision system that match what the installation can take."
m2.debrief.p2: "Sound an alarm on every setpoint change, wherever it comes from."
m2.debrief.p3: "Give every remote access a personal account and a second factor, and keep the list of who can get in."
m2.facts.title: "What really happened: Oldsmar, February 2021"
m2.facts.p1: "On 5 February 2021, at the water treatment plant of Oldsmar, Florida, an operator sees the cursor move on the supervision screen and the sodium hydroxide setpoint go from 100 to 11,100 ppm. They lower it at once: the water is never affected."
m2.facts.p2: "According to the FBI and CISA advisory, the plant used TeamViewer with a password shared by all staff, on Windows 7 workstations connected to the Internet without a firewall."
m2.facts.p3: "Local authorities present the case as an intrusion. It becomes the most quoted example of attacks on water utilities."
m2.facts.p4: "In 2023, the city's former manager says the incident was probably an employee clicking by mistake and that, in their view, the FBI investigation found no evidence of an intrusion. No official conclusion has been published."
m2.facts.p5: "Intruder or mistake, the 2021 advisory remains a reference: personal accounts for remote access, setpoint limits and alarms."
