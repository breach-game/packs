s1.briefing: "The corner bakery, a client of the firm, forwarded the invoice it received yesterday: `clients/facture.eml`. New IBAN, and the firm sent nothing. Yet the client's filter accepted it all."
s1.obj.domain: "Find the domain that really sent the invoice"
s1.obj.created: "Date that domain"
s1.obj.pass: "Explain why every check passes"
s1.q.domain: "Which domain sent this message?"
s1.q.created: "When was this domain created? (YYYY-MM-DD)"
s1.q.pass: "SPF, DKIM and DMARC all three pass. Why?"
s1.q.pass.theirs: "The fraudsters own and set up this look-alike"
s1.q.pass.hacked: "The firm's mail server was hacked"
s1.q.pass.hacked.why: "The message leaves from 203.0.113.70, the look-alike domain's server. The firm's server appears nowhere in the route."
s1.q.pass.broken: "The client's mail checks are badly configured"
s1.q.pass.broken.why: "They work: they prove the message really comes from sarcelle-compta.test. They do not say who is behind it."
s1.ada.brief: "Read the headers: `mailhdr clients/facture.eml`. Look closely at the sender's domain."
s1.ada.g.domain: "The display name says \"Cabinet Sarcelle\", but the address? The firm is sarcelle.test. `answer domain <domain>`."
s1.ada.g.domain.standard: "Find the sender's real domain. `answer domain`."
s1.ada.domain: "One hyphen and one more word. At a glance, in an inbox, it passes."
s1.ada.g.created: "Who owns this domain, and since when? `whois sarcelle-compta.test`, then `answer created <YYYY-MM-DD>`."
s1.ada.g.created.standard: "Date this domain. `answer created`."
s1.ada.created: "Created two days before the invoice, owner hidden. The mark of a domain set up for fraud."
s1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
s1.ada.answer.standard: "My question is waiting in the messenger."
s1.ada.done: "SPF, DKIM and DMARC say who sent it, not whether it is the right one. Against a look-alike domain, the defence lies elsewhere: watch for names that look alike, and never change an IBAN on the strength of an email. And the firm's own domain, is it protected?"
s1.hint.domain.1: "The From line, after the @."
s1.hint.domain.2: "`answer domain sarcelle-compta.test`"
s1.hint.created.1: "`whois sarcelle-compta.test`, the Creation Date line."
s1.hint.created.2: "`answer created 2027-09-28`"
s1.hint.pass.1: "Where does the message leave from, according to the route? Whose server is it?"
s1.debrief.title: "Authenticated is not legitimate"
s1.debrief.lesson: "The fraudsters registered an almost identical domain, then set it up properly: SPF, DKIM and DMARC pass, for their own name. These protections stop someone spoofing a domain, not creating one that looks like it."
s1.debrief.p1: "Watch for registrations of domains close to yours, and reserve a few of them."
s1.debrief.p2: "Tell clients: a change of IBAN is never made by email alone, and is checked by phone."
s1.debrief.p3: "Have the mail system flag domains seen for the first time or just created."
