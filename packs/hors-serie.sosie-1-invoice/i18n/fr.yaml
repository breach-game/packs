s1.briefing: "La boulangerie du coin, cliente du cabinet, a transmis la facture reçue hier : `clients/facture.eml`. Nouvel IBAN, et le cabinet n'a rien envoyé. Le filtre du client a pourtant tout accepté. Le cabinet écrit depuis sarcelle.test."
s1.obj.domain: "Trouver le domaine qui a vraiment envoyé la facture"
s1.obj.created: "Dater ce domaine"
s1.obj.pass: "Expliquer pourquoi toutes les vérifications passent"
s1.q.domain: "Quel domaine a envoyé ce message ?"
s1.q.created: "Quand ce domaine a-t-il été créé ? (AAAA-MM-JJ)"
s1.q.pass: "SPF, DKIM et DMARC passent tous les trois. Pourquoi ?"
s1.q.pass.theirs: "Les fraudeurs possèdent ce domaine sosie et l'ont configuré"
s1.q.pass.hacked: "Le serveur de messagerie du cabinet a été piraté et relaie le message"
s1.q.pass.hacked.why: "Le message part de 203.0.113.70, le serveur du domaine sosie. Celui du cabinet n'apparaît nulle part dans le trajet."
s1.q.pass.broken: "Les vérifications du client sont mal réglées"
s1.q.pass.broken.why: "Elles fonctionnent : elles prouvent que le message vient bien de sarcelle-compta.test. Elles ne disent pas qui se cache derrière."
s1.ada.brief: "Lis les en-têtes : `mailhdr clients/facture.eml`. Regarde bien le domaine de l'expéditeur."
s1.ada.g.domain: "Le nom affiché dit « Cabinet Sarcelle », mais l'adresse ? Le cabinet, c'est sarcelle.test. `answer domain <domaine>`."
s1.ada.g.domain.standard: "Trouve le domaine réel de l'expéditeur. `answer domain`."
s1.ada.domain: "Un tiret et un mot de plus. À l'œil, dans une boîte de réception, ça passe."
s1.ada.g.created: "Qui possède ce domaine, et depuis quand ? `whois sarcelle-compta.test`, puis `answer created <AAAA-MM-JJ>`."
s1.ada.g.created.standard: "Date ce domaine. `answer created`."
s1.ada.created: "Créé deux jours avant la facture, propriétaire masqué. C'est la signature d'un domaine monté pour une fraude."
s1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
s1.ada.answer.standard: "Ma question t'attend dans la messagerie."
s1.ada.done: "SPF, DKIM et DMARC disent qui a envoyé, pas si c'est le bon. Contre un domaine sosie, la défense se joue ailleurs : surveiller les noms qui ressemblent, et ne jamais changer un IBAN sur la foi d'un courriel. Et le domaine du cabinet lui-même, il est protégé ?"
s1.hint.domain.1: "La ligne From, après le @."
s1.hint.domain.2: "`answer domain sarcelle-compta.test`"
s1.hint.created.1: "`whois sarcelle-compta.test`, ligne Creation Date."
s1.hint.created.2: "`answer created 2027-09-28`"
s1.hint.pass.1: "D'où part le message, d'après le trajet ? À qui est ce serveur ?"
s1.debrief.title: "Authentifié n'est pas légitime"
s1.debrief.lesson: "Les fraudeurs ont enregistré un domaine presque identique, puis l'ont configuré proprement : SPF, DKIM et DMARC passent, pour leur nom à eux. Ces protections empêchent d'usurper un domaine, pas d'en créer un qui lui ressemble."
s1.debrief.p1: "Surveiller l'enregistrement de domaines proches du sien, et en réserver quelques-uns."
s1.debrief.p2: "Prévenir les clients : un changement d'IBAN ne se fait jamais par simple courriel, et se vérifie par téléphone."
s1.debrief.p3: "Faire signaler par la messagerie les domaines vus pour la première fois ou tout juste créés."
