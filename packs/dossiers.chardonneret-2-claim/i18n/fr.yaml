c2.briefing: "Une réclamation est arrivée, la première d'une série probable. Le service juridique a déjà préparé une réponse, que la directrice du service client ne veut pas envoyer sans ton avis. Tout est dans `dossier/`."
c2.obj.amount: "Retrouver ce que le voyageur réclame"
c2.obj.draft: "Dire ce qui ne va pas dans la réponse préparée"
c2.obj.decide: "Aider la directrice à décider"
c2.q.amount: "Combien le voyageur réclame-t-il, en euros, avec un point (par exemple 12.50) ?"
c2.q.draft: "Qu'est-ce qui ne tient pas dans la réponse préparée par le service juridique ?"
c2.q.draft.separate: "Elle présente Charly comme un service à part, seul responsable de ses réponses"
c2.q.draft.tone: "Le ton est trop froid pour un voyageur qui vient de perdre son père"
c2.q.draft.tone.why: "C'est vrai, et c'est à reprendre. Mais un ton plus chaleureux ne sauverait pas l'argument central, qui ne tient pas."
c2.q.draft.page: "Elle cite la page Tarifs sans en donner l'adresse exacte"
c2.q.draft.page.why: "Ajouter l'adresse ne change rien : le voyageur n'avait aucune raison d'aller la lire, puisque le site lui avait déjà répondu."
c2.q.decide: "La directrice demande : que répond-on à ce voyageur ?"
c2.q.decide.refund: "On rembourse la différence, avec des excuses"
c2.q.decide.voucher: "On propose un avoir du même montant sur un prochain voyage"
c2.q.decide.refuse: "On maintient le refus, comme le propose le service juridique"
c2.ada.brief: "Lis la réclamation, puis la conversation exportée : `cat dossier/reclamation.txt` et `cat dossier/conversation-8812.txt`."
c2.ada.g.amount: "La conversation donne le prix payé et le prix au tarif deuil. Le voyageur réclame la différence : donne-la avec `answer amount <montant>`."
c2.ada.g.amount.standard: "Que réclame le voyageur ? Réponds avec `answer amount`."
c2.ada.amount: "37,60 euros. Le voyageur a fait exactement ce que le site lui a dit, à 22 h 41, le soir du décès. Lis maintenant la réponse préparée : `cat dossier/projet-reponse.txt`."
c2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
c2.ada.answer.standard: "La question t'attend dans la messagerie."
c2.ada.draft: "Oui. Charly n'est pas une personne, ni une société : c'est une partie du site. Une entreprise répond de tout ce que dit son site, la page comme l'assistant. Reste à décider."
c2.ada.refund: "C'est le choix le moins coûteux : 37,60 euros, et un voyageur qui ne raconte pas partout que Chardonneret se cache derrière une machine."
c2.ada.voucher: "Un geste, mais le voyageur a payé en euros et réclame des euros. S'il insiste, l'avoir ne tiendra pas."
c2.ada.refuse: "C'est un choix. Il coûtera plus que 37,60 euros : le voyageur peut saisir un tribunal, et l'argument « l'assistant est seul responsable » y a déjà été jugé ailleurs."
c2.ada.done: "Une réclamation traitée. Mais Charly continue de répondre comme ça à tout le monde, ce soir encore. Demain, on le règle à la source."
c2.hint.amount.1: "Le bas de la conversation donne deux prix."
c2.hint.amount.2: "94,00 moins 56,40 : `answer amount 37.60`."
c2.hint.draft.1: "Pour le voyageur, qui parlait sur le site de Chardonneret ce soir-là ?"
c2.hint.decide.1: "Aucune réponse n'est fausse. Chacune a un coût différent."
c2.debrief.title: "Personne ne se cache derrière l'assistant"
c2.debrief.lesson: "La réponse préparée faisait de Charly un tiers, responsable de ses propres paroles. Mais Charly n'est qu'une partie du site de Chardonneret, et le voyageur l'a cru comme il aurait cru une page. Une entreprise répond de ce que dit son assistant."
c2.debrief.p1: "Un assistant sur le site parle au nom de l'entreprise, avec ses obligations."
c2.debrief.p2: "Garder l'export des conversations permet de vérifier ce qui a été promis, à qui et quand."
c2.debrief.p3: "Une erreur de l'assistant se règle avec le client, puis se corrige à la source pour tous les autres."
