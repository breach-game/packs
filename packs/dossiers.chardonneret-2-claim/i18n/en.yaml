c2.briefing: "A complaint has come in, probably the first of many. The legal team has already drafted an answer, which the customer service director will not send without your view. Everything is in `dossier/`."
c2.obj.amount: "Find what the traveller claims"
c2.obj.draft: "Say what is wrong with the drafted answer"
c2.obj.decide: "Help the director decide"
c2.q.amount: "How much does the traveller claim, in euros (for example 12.50)?"
c2.q.draft: "What does not hold in the answer drafted by the legal team?"
c2.q.draft.separate: "It presents Charly as a separate service, solely responsible for its answers"
c2.q.draft.tone: "The tone is too cold for a traveller who has just lost their father"
c2.q.draft.tone.why: "True, and it must be reworked. But a warmer tone would not save the central argument, which does not hold."
c2.q.draft.page: "It quotes the Fares page without giving its exact address"
c2.q.draft.page.why: "Adding the address changes nothing: the traveller had no reason to go and read it, since the site had already answered them."
c2.q.decide: "The director asks: what do we answer this traveller?"
c2.q.decide.refund: "We refund the difference, with an apology"
c2.q.decide.voucher: "We offer a voucher of the same amount for a next trip"
c2.q.decide.refuse: "We keep the refusal, as the legal team suggests"
c2.ada.brief: "Read the complaint, then the exported conversation: `cat dossier/reclamation.txt` and `cat dossier/conversation-8812.txt`."
c2.ada.g.amount: "The conversation gives the price paid and the bereavement fare price. The traveller claims the difference: give it with `answer amount <amount>`."
c2.ada.g.amount.standard: "What does the traveller claim? Answer with `answer amount`."
c2.ada.amount: "37.60 euros. The traveller did exactly what the site told them, at 22:41, on the evening of the death. Now read the drafted answer: `cat dossier/projet-reponse.txt`."
c2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
c2.ada.answer.standard: "The question is waiting in the messenger."
c2.ada.draft: "Yes. Charly is not a person, nor a company: it is part of the site. A company answers for everything its site says, the page as much as the assistant. Now to decide."
c2.ada.refund: "It is the cheapest choice: 37.60 euros, and a traveller who does not tell everyone that Chardonneret hides behind a machine."
c2.ada.voucher: "A gesture, but the traveller paid in euros and claims euros. If they insist, the voucher will not hold."
c2.ada.refuse: "It is a choice. It will cost more than 37.60 euros: the traveller can go to a tribunal, and the argument \"the assistant alone is responsible\" has already been judged elsewhere."
c2.ada.done: "One complaint settled. But Charly keeps answering everyone this way, tonight too. Tomorrow, we fix it at the source."
c2.hint.amount.1: "The bottom of the conversation gives two prices."
c2.hint.amount.2: "94.00 minus 56.40: `answer amount 37.60`."
c2.hint.draft.1: "To the traveller, who was speaking on Chardonneret's site that evening?"
c2.hint.decide.1: "No answer is wrong. Each has a different cost."
c2.debrief.title: "Nobody hides behind the assistant"
c2.debrief.lesson: "The drafted answer made Charly a third party, responsible for its own words. But Charly is only part of Chardonneret's site, and the traveller believed it as they would have believed a page. A company answers for what its assistant says."
c2.debrief.p1: "An assistant on the site speaks in the company's name, with its obligations."
c2.debrief.p2: "Keeping conversation exports lets you check what was promised, to whom and when."
c2.debrief.p3: "An assistant's mistake is settled with the customer, then fixed at the source for everyone else."
