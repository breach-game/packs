g3.briefing: "Rien n'est parti, grâce au doute de Malik. La prochaine fois, il ne faut pas compter sur la chance. Les règles des virements de Gobemouche sont dans `paiements/virements.yml`."
g3.obj.verify: "Qu'un faux parfait ne suffise plus à faire partir un virement"
g3.obj.pause: "Ne laisser aucune exception, et donner une voie au doute"
g3.obj.malik: "Décider comment parler de Malik"
g3.q.malik: "Comment Gobemouche parle-t-elle de ce qui est arrivé à Malik ?"
g3.q.malik.thank: "Le remercier devant ses collègues et raconter l'histoire en formation"
g3.q.malik.quiet: "Ne rien dire, pour ne pas l'embarrasser"
g3.q.malik.blame: "Lui reprocher d'avoir cru la visio, pour l'exemple"
g3.check.verify: "Deux signatures, rappel sur l'annuaire, une visio ne vaut pas validation"
g3.check.pause: "Aucune exception confidentielle, 24 h pour un nouveau bénéficiaire, un doute a quelqu'un à qui s'adresser"
g3.check.works: "Les virements en euros fonctionnent toujours"
g3.ada.brief: "Lis les règles : `cat paiements/virements.yml`. Deux couches, puis une décision."
g3.ada.g.verify: "D'abord, la vérification : `approvals: 2`, `callback: directory`, `video_call_counts: no`. Avec `sed -i` ou `edit paiements/virements.yml`, puis `verify`."
g3.ada.g.verify.standard: "D'abord, fais qu'aucune personne seule, ni aucune visio, ne puisse faire partir un virement. Puis `verify`."
g3.ada.verify: "Avec deux signatures et un rappel sur l'annuaire, le meilleur faux du monde doit tromper deux personnes et un téléphone qu'il ne contrôle pas."
g3.ada.g.pause: "Ensuite, le temps et la parole : `confidential_bypass: never`, `new_beneficiary_hold: 24h`, et `report_doubt_to: security-desk`. Puis `verify`."
g3.ada.g.pause.standard: "Ensuite, supprime l'exception que les escrocs invoquent toujours, donne-toi un délai pour un nouveau bénéficiaire, et donne au doute quelqu'un à qui parler. Puis `verify`."
g3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
g3.ada.ready: "Les règles tiennent. Reste Malik. Je te laisse décider."
g3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
g3.ada.answer.standard: "Ma question t'attend dans la messagerie."
g3.ada.thank: "Le meilleur choix : chacun apprend qu'on a le droit de douter d'une directrice, et que celui qui le dit est remercié."
g3.ada.quiet: "Malik ne sera pas embarrassé, mais personne n'apprendra rien. La prochaine victime n'aura pas son réflexe."
g3.ada.blame: "Il a douté, et c'est grâce à lui que rien n'est parti. Le sanctionner apprend aux autres à se taire la prochaine fois."
g3.ada.done: "Deux signatures, un rappel sur l'annuaire, aucune exception, un délai, et quelqu'un qui écoute. Ouvre le débrief : le vrai cas est à la fin."
g3.hint.verify.1: "Trois lignes à changer, avec `sed -i \"s/ancien/nouveau/\" paiements/virements.yml`."
g3.hint.verify.2: "`approvals: 2`, `callback: directory`, `video_call_counts: no`"
g3.hint.pause.1: "Les escrocs disent toujours « confidentiel » : plus d'exception."
g3.hint.pause.2: "`confidential_bypass: never`, `new_beneficiary_hold: 24h`, `report_doubt_to: security-desk`, puis `verify`."
g3.hint.malik.1: "Aucune réponse n'est fausse. Pense à ce que les autres comptables retiendront."
g3.debrief.title: "Deux signatures"
g3.debrief.lesson: "Contre un faux parfait, l'œil ne suffit plus : il faut un processus. Deux personnes, un rappel sur un numéro connu, aucune exception pour l'urgence ou le secret, un délai pour un bénéficiaire nouveau. Et une culture où douter d'un dirigeant est encouragé."
g3.debrief.p1: "Exiger deux validations pour tout virement important, par deux personnes."
g3.debrief.p2: "Vérifier par un rappel sur un numéro de l'annuaire ; une visio ne valide rien."
g3.debrief.p3: "Supprimer les exceptions « confidentiel » ou « urgent » : ce sont celles que les escrocs demandent."
g3.debrief.p4: "Remercier publiquement ceux qui signalent un doute."
g3.facts.title: "Ce qui s'est vraiment passé : Arup, 2024"
g3.facts.p1: "Mi-janvier 2024, un employé du bureau de Hong Kong d'Arup, bureau d'études britannique, reçoit un message qui semble venir du directeur financier au Royaume-Uni et parle d'une transaction secrète."
g3.facts.p2: "D'abord méfiant, l'employé rejoint une visioconférence qui semble montrer le directeur financier et d'autres collègues. Ce sont des imitations fabriquées."
g3.facts.p3: "En une semaine, l'employé fait 15 virements vers cinq comptes : 200 millions de dollars de Hong Kong, environ 25,6 millions de dollars américains."
g3.facts.p4: "La fraude est découverte lors d'une vérification auprès du siège au Royaume-Uni. La police de Hong Kong la décrit en février sans nommer l'entreprise."
g3.facts.p5: "Arup est nommée en mai 2024. L'entreprise dit avoir prévenu la police en janvier, et qu'aucun de ses systèmes internes n'a été compromis."
