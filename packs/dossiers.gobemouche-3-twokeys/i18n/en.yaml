g3.briefing: "Nothing left, thanks to Malik's doubt. Next time, we must not count on luck. Gobemouche's transfer rules are in `paiements/virements.yml`."
g3.obj.verify: "Make a perfect fake no longer enough to send a transfer"
g3.obj.pause: "Leave no exception, and give doubt a way out"
g3.obj.malik: "Decide how to talk about Malik"
g3.q.malik: "How does Gobemouche talk about what happened to Malik?"
g3.q.malik.thank: "Thank him in front of his colleagues and tell the story in training"
g3.q.malik.quiet: "Say nothing, so as not to embarrass him"
g3.q.malik.blame: "Blame him for believing the video call, as an example"
g3.check.verify: "Two signatures, callback on the directory, a video call is no approval"
g3.check.pause: "No confidential exception, 24 h for a new beneficiary, a doubt has someone to go to"
g3.check.works: "Transfers in euros still work"
g3.ada.brief: "Read the rules: `cat paiements/virements.yml`. Two layers, then a decision."
g3.ada.g.verify: "First, the check: `approvals: 2`, `callback: directory`, `video_call_counts: no`. With `sed -i` or `edit paiements/virements.yml`, then `verify`."
g3.ada.g.verify.standard: "First, make sure no single person, and no video call, can send a transfer. Then `verify`."
g3.ada.verify: "With two signatures and a callback on the directory, the best fake in the world must fool two people and a phone it does not control."
g3.ada.g.pause: "Next, time and voice: `confidential_bypass: never`, `new_beneficiary_hold: 24h`, and `report_doubt_to: security-desk`. Then `verify`."
g3.ada.g.pause.standard: "Next, remove the exception fraudsters always invoke, give yourself a delay for a new beneficiary, and give doubt someone to talk to. Then `verify`."
g3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
g3.ada.ready: "The rules hold. Malik remains. I leave the decision to you."
g3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
g3.ada.answer.standard: "My question is waiting in the messenger."
g3.ada.thank: "The best choice: everyone learns they may doubt a director, and that whoever says so is thanked."
g3.ada.quiet: "Malik will not be embarrassed, but nobody will learn anything. The next target will not have his reflex."
g3.ada.blame: "He doubted, and it is thanks to him nothing left. Punishing him teaches the others to stay quiet next time."
g3.ada.done: "Two signatures, a callback on the directory, no exception, a delay, and someone who listens. Open the debrief: the real case is at the end."
g3.hint.verify.1: "Three lines to change, with `sed -i \"s/old/new/\" paiements/virements.yml`."
g3.hint.verify.2: "`approvals: 2`, `callback: directory`, `video_call_counts: no`"
g3.hint.pause.1: "Fraudsters always say \"confidential\": no more exception."
g3.hint.pause.2: "`confidential_bypass: never`, `new_beneficiary_hold: 24h`, `report_doubt_to: security-desk`, then `verify`."
g3.hint.malik.1: "No answer is wrong. Think of what the other accountants will remember."
g3.debrief.title: "Two signatures"
g3.debrief.lesson: "Against a perfect fake, the eye is no longer enough: you need a process. Two people, a callback on a known number, no exception for urgency or secrecy, a delay for a new beneficiary. And a culture where doubting a director is encouraged."
g3.debrief.p1: "Require two approvals for any large transfer, by two people."
g3.debrief.p2: "Check with a callback on a directory number; a video call approves nothing."
g3.debrief.p3: "Remove \"confidential\" or \"urgent\" exceptions: those are the ones fraudsters ask for."
g3.debrief.p4: "Publicly thank those who report a doubt."
g3.facts.title: "What really happened: Arup, 2024"
g3.facts.p1: "In mid-January 2024, an employee at the Hong Kong office of Arup, a British engineering firm, received a message that seemed to come from the chief financial officer in the UK and spoke of a secret transaction."
g3.facts.p2: "At first suspicious, the employee joined a video call that seemed to show the CFO and other colleagues. They were fabricated imitations."
g3.facts.p3: "Over a week, the employee made 15 transfers to five accounts: 200 million Hong Kong dollars, about 25.6 million US dollars."
g3.facts.p4: "The fraud was discovered when the employee checked with the head office in the UK. Hong Kong police described it in February without naming the company."
g3.facts.p5: "Arup was named in May 2024. The company said it had notified the police in January, and that none of its internal systems had been compromised."
