c2.briefing: "La clé trouvée dans l'image appartient au compte qui publie le script d'envoi de Covera. Le mandat autorise une seule chose : prouver, avec une unique ligne de commentaire, qu'un attaquant aurait pu réécrire le script que tous les clients exécutent. Puis mesurer ce que cela aurait coûté."
c2.obj.enter: "Ouvrir une session sur le serveur de téléchargement avec la clé"
c2.obj.script: "Lire le script que les clients exécutent"
c2.obj.reach: "Compter les clients qui l'ont téléchargé cette semaine (`submit` le nombre)"
c2.obj.canary: "Prouver l'accès en écriture avec la ligne de commentaire convenue, puis lancer `verify`"
c2.obj.impact: "Dire ce que la ligne d'un attaquant aurait récolté"
c2.check.marker: "Le marqueur convenu est dans le script publié"
c2.check.intact: "Le script fait toujours son travail"
c2.q.impact: "Le job de CI d'un client télécharge ce script et l'envoie dans bash. Si on y ajoute une ligne hostile, que peut-elle lire ?"
c2.q.impact.report: "Seulement le rapport de couverture que le script envoie, puisque c'est le seul fichier qu'il ouvre"
c2.q.impact.report.why: "Le script n'est pas limité à son rapport. Il tourne comme le job lui-même, avec tout ce que le job détient."
c2.q.impact.env: "Tout ce que le job peut lire : son environnement, avec les jetons et les clés qui s'y trouvent"
c2.q.impact.nothing: "Rien du tout : un runner de CI est un bac à sable, jeté à la fin de chaque job"
c2.q.impact.nothing.why: "Le bac à sable protège la machine contre le job, pas les secrets du job contre le code qu'il exécute. Ce code, c'est le script."
c2.ada.brief: "On a une clé, et le script qui dit où elle va. Le mandat nous laisse l'utiliser une fois, pour faire la preuve. Ton dossier est dans `dossier/`."
c2.ada.enter: "Le script de publication donnait le compte : `ssh -i dossier/release.key release@get.covera.test`."
c2.ada.enter.standard: "Le script de publication t'a dit quel compte et quel serveur cette clé ouvre."
c2.ada.read: "Tu es sur le serveur où tous les clients téléchargent. Lis ce qu'ils reçoivent : `cat /srv/get/uploader.sh`."
c2.ada.read.standard: "Lis le script que ce serveur distribue."
c2.ada.script: "Vingt lignes, et le commentaire dit tout : il tourne dans le job du client, avec l'environnement du job. Qui peut écrire ce fichier écrit du code dans la chaîne de build de chaque client."
c2.ada.notes: "« Aucune alerte quand le fichier change. » Garde ça pour le rapport : personne ne l'aurait vu."
c2.ada.count: "Jusqu'où ça porte ? Le journal d'accès a une ligne par téléchargement, l'adresse en premier : `cut -d \" \" -f 1 /var/log/get/access.log | sort | uniq | wc -l`. Envoie-moi le nombre avec `submit`."
c2.ada.count.standard: "Combien de clients différents ont téléchargé le script cette semaine ? Le journal d'accès est dans `/var/log/get/`. Envoie-moi le nombre avec `submit`."
c2.ada.reach: "Douze organisations en une semaine, sur cette petite plateforme de test. Chacune exécute le fichier dès qu'il est téléchargé."
c2.ada.canary: "Maintenant la preuve, et rien que la preuve : un commentaire, que bash ignore. `echo \"# LR-CANARY CV-2026-014\" >> /srv/get/uploader.sh`, puis `verify`. Deux `>` : on ajoute une ligne, on ne remplace rien."
c2.ada.canary.standard: "Ajoute la ligne de commentaire `# LR-CANARY CV-2026-014` à la fin du script publié, sans rien changer d'autre, puis lance `verify`."
c2.ada.almost: "Pas encore. `verify` montre ce qui manque. Le marqueur doit être exact, et le script doit toujours marcher : ajoute une ligne, n'écrase pas le fichier. Si tu l'as écrasé, remets-le d'abord : `cat /home/release/backup/uploader.sh > /srv/get/uploader.sh`."
c2.ada.proved: "Accès en écriture prouvé, script intact. Nous avons écrit un commentaire. L'attaquant de 2021 a écrit une seule ligne lui aussi, une vraie. Une question là-dessus."
c2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
c2.ada.answer.standard: "Réponds à ma question."
c2.ada.impact: "Oui. Clés de déploiement, jetons cloud, clés de signature : tout ce dont une chaîne de build a besoin pour travailler est dans son environnement, et le script le lit comme n'importe quel programme du job."
c2.ada.done: "Chaîne rejouée de bout en bout : une image publique, une clé oubliée, un script auquel tout le monde fait confiance. Tape `exit` pour quitter le serveur, puis ouvre le débrief."
c2.hint.enter.1: "`ssh -i <fichier de clé>` ouvre une session avec une clé au lieu d'un mot de passe."
c2.hint.enter.2: "Tape `ssh -i dossier/release.key release@get.covera.test`."
c2.hint.script.1: "Tape `cat /srv/get/uploader.sh`."
c2.hint.reach.1: "Chaque ligne de `/var/log/get/access.log` commence par l'adresse du client."
c2.hint.reach.2: "Garde la première colonne avec `cut`, puis `sort | uniq` pour ne garder chaque adresse qu'une fois, et `wc -l` pour compter."
c2.hint.reach.3: "Tape `cut -d \" \" -f 1 /var/log/get/access.log | sort | uniq | wc -l`, puis `submit` le nombre."
c2.hint.canary.1: "`>>` ajoute une ligne à la fin d'un fichier. Un seul `>` remplacerait tout le fichier."
c2.hint.canary.2: "Tape `echo \"# LR-CANARY CV-2026-014\" >> /srv/get/uploader.sh`, puis `verify`."
c2.debrief.title: "Une ligne, toutes les chaînes de build"
c2.debrief.lesson: "Les clients n'ont rien fait de mal selon leurs propres règles : ils ont exécuté le script de l'éditeur, comme le dit la documentation. C'est cela, la chaîne logicielle : on hérite de la sécurité de tout ce qu'on exécute."
c2.debrief.p1: "Un fichier que les clients exécutent est du code de production. Le modifier demande les mêmes relectures et les mêmes alertes qu'une mise en production."
c2.debrief.p2: "Un job de CI ne devrait détenir que les secrets dont ses étapes ont besoin, le moins longtemps possible, avec les droits les plus étroits."
c2.debrief.p3: "Ne jamais envoyer un téléchargement tout droit dans un shell : rien ne peut être vérifié entre les deux."
