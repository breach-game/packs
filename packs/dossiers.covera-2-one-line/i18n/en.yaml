c2.briefing: "The key from the image belongs to the account that publishes Covera's uploader script. The mandate allows one thing: prove, with a single comment line, that an attacker could have rewritten the script every customer runs. Then measure what that would have cost."
c2.obj.enter: "Open a session on the download server with the key"
c2.obj.script: "Read the script that customers run"
c2.obj.reach: "Count the customers who downloaded it this week (`submit` the number)"
c2.obj.canary: "Prove write access with the agreed comment line, then run `verify`"
c2.obj.impact: "Say what an attacker's line would have collected"
c2.check.marker: "The agreed marker is in the published script"
c2.check.intact: "The script still does its job"
c2.q.impact: "A customer's CI job downloads this script and pipes it into bash. If one hostile line is added, what can it read?"
c2.q.impact.report: "Only the coverage report the script uploads, since it is the one file it opens"
c2.q.impact.report.why: "The script is not limited to its report. It runs as the job itself, with everything the job holds."
c2.q.impact.env: "Everything the job can: its environment, with the tokens and keys stored there"
c2.q.impact.nothing: "Nothing at all: a CI runner is a sandbox, thrown away at the end of every job"
c2.q.impact.nothing.why: "The sandbox protects the machine from the job, not the job's secrets from the code it runs. The script is that code."
c2.ada.brief: "We have a key and the script that says where it fits. The mandate lets us use it once, to prove the point. Your case file is in `dossier/`."
c2.ada.enter: "The publishing script named the account: `ssh -i dossier/release.key release@get.covera.test`."
c2.ada.enter.standard: "The publishing script told you which account and which server this key opens."
c2.ada.read: "You are on the server every customer downloads from. Read what they get: `cat /srv/get/uploader.sh`."
c2.ada.read.standard: "Read the script that this server hands out."
c2.ada.script: "Twenty lines, and the comment says it all: it runs inside the customer's job, with the job's environment. Whoever can write this file writes code in every customer's pipeline."
c2.ada.notes: "\"No alert is raised when the file changes.\" Keep that for the report: nobody would have seen it."
c2.ada.count: "How far does it reach? The access log has one line per download, the address first: `cut -d \" \" -f 1 /var/log/get/access.log | sort | uniq | wc -l`. Send me the number with `submit`."
c2.ada.count.standard: "How many different customers downloaded the script this week? The access log is in `/var/log/get/`. Send me the number with `submit`."
c2.ada.reach: "Twelve organisations in a week, on this small test platform. Each one runs the file as soon as it is downloaded."
c2.ada.canary: "Now the proof, and only the proof: a comment, which bash ignores. `echo \"# LR-CANARY CV-2026-014\" >> /srv/get/uploader.sh`, then `verify`. Two `>`: we add a line, we replace nothing."
c2.ada.canary.standard: "Add the comment line `# LR-CANARY CV-2026-014` at the end of the published script, without changing anything else, then run `verify`."
c2.ada.almost: "Not yet. `verify` shows what is missing. The marker must be exact, and the script must still work: add a line, do not overwrite the file. If you did overwrite it, put it back first: `cat /home/release/backup/uploader.sh > /srv/get/uploader.sh`."
c2.ada.proved: "Write access proved, script intact. We wrote a comment. The attacker of 2021 wrote one line too, a real one. A question about that."
c2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
c2.ada.answer.standard: "Answer my question."
c2.ada.impact: "Yes. Deploy keys, cloud tokens, signing keys: whatever a pipeline needs to do its work sits in its environment, and the script reads it like any other program in the job."
c2.ada.done: "Chain replayed end to end: a public image, a forgotten key, a script trusted by everyone. Type `exit` to leave the server, then open the debrief."
c2.hint.enter.1: "`ssh -i <key file>` opens a session with a key instead of a password."
c2.hint.enter.2: "Type `ssh -i dossier/release.key release@get.covera.test`."
c2.hint.script.1: "Type `cat /srv/get/uploader.sh`."
c2.hint.reach.1: "Each line of `/var/log/get/access.log` starts with the address of the customer."
c2.hint.reach.2: "Keep the first column with `cut`, then `sort | uniq` to keep each address once, and `wc -l` to count."
c2.hint.reach.3: "Type `cut -d \" \" -f 1 /var/log/get/access.log | sort | uniq | wc -l`, then `submit` the number."
c2.hint.canary.1: "`>>` adds a line at the end of a file. A single `>` would replace the whole file."
c2.hint.canary.2: "Type `echo \"# LR-CANARY CV-2026-014\" >> /srv/get/uploader.sh`, then `verify`."
c2.debrief.title: "One line, every pipeline"
c2.debrief.lesson: "The customers did nothing wrong by their own rules: they ran the vendor's script, as the documentation says. That is the supply chain: you inherit the security of everything you run."
c2.debrief.p1: "A file that customers execute is production code. Changing it needs the same reviews and alerts as a release."
c2.debrief.p2: "A CI job should hold only the secrets its steps need, for the shortest time, with the narrowest rights."
c2.debrief.p3: "Never pipe a download straight into a shell: nothing can be checked between the two."
