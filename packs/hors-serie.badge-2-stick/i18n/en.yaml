b2.briefing: "Monday 12 March, 9.40 am. At 8.10, someone handed in at reception a USB stick found in the car park, labelled \"Salaires 2029\" (Salaries 2029). Reception did not plug it in and took it to IT, who opened it on the isolated bench: an old machine with no network, rebuilt after each use. The record is in `banc/`. Two more sticks with the same label have been picked up since."
b2.obj.server: "Find which server the stick wanted the workstation to talk to"
b2.obj.poste: "Find the workstation where a stick was opened"
b2.obj.cut: "Isolate that workstation"
b2.obj.found: "Say what to do with a found stick"
b2.obj.tell: "Decide how to tell the team"
b2.q.server: "Which server name is written in the stick's shortcut?"
b2.q.poste: "On which workstation was a file from the stick opened?"
b2.q.found: "You find a USB stick in your company's car park. What do you do?"
b2.q.found.handin: "I hand it to IT without plugging it in anywhere"
b2.q.found.peek: "I plug it into my own PC to see whose it is"
b2.q.found.peek.why: "That is exactly what whoever left it there is hoping for. On this stick, the \"PDF\" was a shortcut: a double-click was enough."
b2.q.found.owner: "I open it at home, on my personal computer"
b2.q.found.owner.why: "Your personal computer is not an isolated bench: it has your accounts, your photos, and often access to your work mail."
b2.q.tell: "Someone on the team opened the stick on their workstation. How do you tell everyone?"
b2.q.tell.thank: "Tell the facts, thank reception, name nobody"
b2.q.tell.named: "Tell the facts and name the person who plugged it in"
b2.q.tell.silent: "Say nothing to the team and settle it among managers"
b2.contain.poste: "Isolate from the network the workstation where the stick was plugged in (its user works on a loan machine)"
b2.ada.brief: "Rule number one: we do not plug it in. IT did it for us on a machine with nothing to lose, and copied you the record. `cat banc/cle-liste.txt`, then look at the shortcut without opening it: `strings banc/Salaires_2029.pdf.lnk`."
b2.ada.g.server: "`strings banc/Salaires_2029.pdf.lnk` prints the shortcut's readable text. Look for the server name, then `answer server <name>`."
b2.ada.g.server.standard: "Read the shortcut with `strings` and give the server name it holds with `answer server`."
b2.ada.server: "A shortcut dressed as a PDF: the right icon, the right name, and behind it a program hidden on the stick that would call `maj-garance.example`. A name that looks like the company's, and is not. Three identical sticks were dropped. Let's see whether one found a workstation: `banc/postes-usb.csv`."
b2.ada.g.poste: "`cat banc/postes-usb.csv` lists what the workstations saw this morning. Look for the `file-opened` line, then `answer poste <workstation>`."
b2.ada.g.poste.standard: "Look in `banc/postes-usb.csv` for the workstation where a file from the stick was opened."
b2.ada.poste: "`cao-07`, at 8.21 am, a design office workstation with customer drawings within reach. Look at the `compta-02` line too: same stick, `storage-blocked`. In accounting, USB storage has been closed since last year, and the stick could do nothing. Two workstations, two settings, two stories. Isolate `cao-07`."
b2.ada.g.cut: "`contain` lists the measures. Here: `contain isolate poste-cle`."
b2.ada.g.cut.standard: "Isolate the workstation with `contain`."
b2.ada.cut: "Workstation isolated. We do not clean it: we keep it as it is for analysis, then rebuild it. Its user carries on with a loan machine. One question while IT takes care of it."
b2.ada.g.found: "Answer my question: what to do with a found stick."
b2.ada.found: "Yes, and that is what reception did this morning without anyone ever teaching them. That leaves the most delicate question of the day."
b2.ada.g.tell: "No answer is wrong: each one has a price later."
b2.ada.tell.thank: "A message to everyone, with the facts, a photo of the stick and a thank-you to reception. The person from `cao-07` came to see you on their own ten minutes later to say what they had seen on screen. That is what naming nobody buys: next time, you will be told straight away."
b2.ada.tell.named: "Everyone knows, and the lesson is clear. But the lesson the team keeps is not the one you think: the next person who plugs in a stick will tell nobody."
b2.ada.tell.silent: "No fuss. But two sticks may still be lying in drawers, and the people who picked them up do not know what they are."
b2.ada.done: "A held door, twenty-six minutes inside, three sticks dropped in the car park on the way in. None of it took any hacking skill at all. Tomorrow, we write the rules."
b2.hint.server.1: "The shortcut's `Arguments=` line holds the server name."
b2.hint.server.2: "`answer server maj-garance.example`"
b2.hint.poste.1: "`grep \"file-opened\" banc/postes-usb.csv`"
b2.hint.poste.2: "`answer poste cao-07`"
b2.hint.cut.1: "`contain isolate poste-cle`"
b2.hint.found.1: "Never plug it in, anywhere. Type `answer handin`."
b2.debrief.title: "The car park stick"
b2.debrief.lesson: "Three identical sticks left in the car park, a shortcut dressed as a PDF. Reception handed theirs in unplugged, accounting was protected by a setting, and one design office workstation opened the file. Curiosity is not a fault: that is why it takes a setting, not only an instruction."
b2.debrief.p1: "A found stick goes to IT, who open it on an isolated machine. Never on a workstation, never at home."
b2.debrief.p2: "Close USB storage where it is not needed: the setting also protects on the day someone is curious."
b2.debrief.p3: "Thank those who report, do not point at those who slip: you learn about incidents from people who dare to tell."
