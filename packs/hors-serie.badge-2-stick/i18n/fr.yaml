b2.briefing: "Lundi 12 mars, 9 h 40. À 8 h 10, quelqu'un a déposé à l'accueil une clé USB trouvée sur le parking, étiquetée « Salaires 2029 ». L'accueil ne l'a pas branchée et l'a portée à l'informatique, qui l'a ouverte sur le banc isolé : un vieux poste sans réseau, refait à neuf après chaque usage. Le relevé est dans `banc/`. Deux autres clés portant la même étiquette ont été ramassées depuis."
b2.obj.server: "Trouver vers quel serveur la clé voulait faire parler le poste"
b2.obj.poste: "Trouver le poste où une clé a été ouverte"
b2.obj.cut: "Isoler ce poste"
b2.obj.found: "Dire quoi faire d'une clé trouvée"
b2.obj.tell: "Décider comment en parler à l'équipe"
b2.q.server: "Quel nom de serveur est écrit dans le raccourci de la clé ?"
b2.q.poste: "Sur quel poste un fichier de la clé a-t-il été ouvert ?"
b2.q.found: "Tu trouves une clé USB sur le parking de ton entreprise. Que fais-tu ?"
b2.q.found.handin: "Je la remets à l'informatique sans la brancher nulle part"
b2.q.found.peek: "Je la branche vite sur mon poste pour voir à qui elle est"
b2.q.found.peek.why: "C'est exactement le geste attendu par celui qui l'a posée là. Sur cette clé, le « PDF » était un raccourci : un double-clic suffisait."
b2.q.found.owner: "Je l'ouvre chez moi, sur mon ordinateur personnel"
b2.q.found.owner.why: "Ton ordinateur personnel n'est pas un banc isolé : il a tes comptes, tes photos, et souvent l'accès à la messagerie du travail."
b2.q.tell: "Une personne de l'équipe a ouvert la clé sur son poste. Comment en parles-tu à tout le monde ?"
b2.q.tell.thank: "Raconter les faits, remercier l'accueil, ne nommer personne"
b2.q.tell.named: "Raconter les faits en nommant la personne qui a branché"
b2.q.tell.silent: "Ne rien dire à l'équipe et régler ça entre responsables"
b2.contain.poste: "Isoler du réseau le poste où la clé a été branchée (son utilisateur travaille sur un poste de prêt)"
b2.ada.brief: "Règle numéro un : on ne branche pas. L'informatique l'a fait pour nous sur un poste qui ne craint rien, et t'a copié le relevé. `cat banc/cle-liste.txt`, puis regarde le raccourci sans l'ouvrir : `strings banc/Salaires_2029.pdf.lnk`."
b2.ada.g.server: "`strings banc/Salaires_2029.pdf.lnk` affiche le texte lisible du raccourci. Cherche le nom de serveur, puis `answer server <nom>`."
b2.ada.g.server.standard: "Lis le raccourci avec `strings` et donne le nom de serveur qu'il contient avec `answer server`."
b2.ada.server: "Un raccourci déguisé en PDF : la bonne icône, le bon nom, et derrière, un programme caché sur la clé qui appellerait `maj-garance.example`. Un nom qui ressemble à celui de l'entreprise, et qui n'est pas le sien. Trois clés identiques ont été posées. Voyons si l'une d'elles a trouvé un poste : `banc/postes-usb.csv`."
b2.ada.g.poste: "`cat banc/postes-usb.csv` liste ce que les postes ont vu ce matin. Cherche la ligne `file-opened`, puis `answer poste <poste>`."
b2.ada.g.poste.standard: "Cherche dans `banc/postes-usb.csv` le poste où un fichier de la clé a été ouvert."
b2.ada.poste: "`cao-07`, à 8 h 21, un poste du bureau d'études avec les plans des clients à portée. Regarde aussi la ligne de `compta-02` : même clé, `storage-blocked`. À la comptabilité, le stockage USB est fermé depuis l'an dernier, et la clé n'a rien pu faire. Deux postes, deux réglages, deux histoires. Isole `cao-07`."
b2.ada.g.cut: "`contain` liste les mesures. Ici : `contain isolate poste-cle`."
b2.ada.g.cut.standard: "Isole le poste avec `contain`."
b2.ada.cut: "Poste isolé. On ne le nettoie pas : on le garde tel quel pour l'analyse, puis on le refait. La personne continue sur un poste de prêt. Une question pendant que l'informatique s'en occupe."
b2.ada.g.found: "Réponds à ma question : que faire d'une clé trouvée."
b2.ada.found: "Oui, et c'est ce que l'accueil a fait ce matin sans que personne le lui ait jamais appris. Reste la question la plus délicate de la journée."
b2.ada.g.tell: "Aucune réponse n'est fausse : chacune a un prix pour la suite."
b2.ada.tell.thank: "Un message à tous, avec les faits, une photo de la clé et un merci à l'accueil. La personne de `cao-07` est venue te voir d'elle-même dix minutes plus tard pour dire ce qu'elle avait vu à l'écran. C'est ce qu'on achète en ne nommant personne : la prochaine fois, on te le dira tout de suite."
b2.ada.tell.named: "Tout le monde sait, et la leçon est claire. Mais la leçon que l'équipe retient n'est pas celle qu'on croit : la prochaine personne qui branchera une clé ne le dira à personne."
b2.ada.tell.silent: "Pas de vagues. Mais deux clés traînent peut-être encore dans des tiroirs, et ceux qui les ont ramassées ne savent pas ce qu'elles sont."
b2.ada.done: "Une porte tenue, vingt-six minutes dans les locaux, trois clés semées sur le parking en arrivant. Rien de tout cela ne demandait de savoir pirater quoi que ce soit. Demain, on écrit les règles."
b2.hint.server.1: "La ligne `Arguments=` du raccourci contient le nom du serveur."
b2.hint.server.2: "`answer server maj-garance.example`"
b2.hint.poste.1: "`grep \"file-opened\" banc/postes-usb.csv`"
b2.hint.poste.2: "`answer poste cao-07`"
b2.hint.cut.1: "`contain isolate poste-cle`"
b2.hint.found.1: "Ne jamais la brancher, nulle part. Tape `answer handin`."
b2.debrief.title: "La clé du parking"
b2.debrief.lesson: "Trois clés identiques posées sur le parking, un raccourci déguisé en PDF. L'accueil a remis la sienne sans la brancher, la comptabilité était protégée par un réglage, et un poste du bureau d'études a ouvert le fichier. La curiosité n'est pas une faute : c'est pour ça qu'il faut un réglage, pas seulement une consigne."
b2.debrief.p1: "Une clé trouvée se remet à l'informatique, qui l'ouvre sur un poste isolé. Jamais sur un poste de travail, jamais chez soi."
b2.debrief.p2: "Fermer le stockage USB là où il ne sert pas : le réglage protège aussi le jour où quelqu'un est curieux."
b2.debrief.p3: "Remercier ceux qui signalent, ne pas désigner ceux qui se trompent : on apprend les incidents par ceux qui osent les dire."
