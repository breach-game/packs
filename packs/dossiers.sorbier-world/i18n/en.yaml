file.readme: "Ligne Rouge workstation. Case file: Sorbier Linux. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE SB-2027-006\nClient: Sorbier Project. Scope: *.sorbier.test, 10.66.0.0/24.\nPurpose: investigate an anomaly in the development version of Sorbier. SSH logins on the build farm have become slow for no known reason.\nSet-up agreed: the project hands you copies of its measurements and of the sources involved, in the `dossier` folder. You read, you compare, you touch no machine.\nSigned: the security team of the Sorbier Project."
