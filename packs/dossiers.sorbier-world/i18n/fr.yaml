file.readme: "Poste Ligne Rouge. Dossier : Sorbier Linux. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT SB-2027-006\nClient : Projet Sorbier. Périmètre : *.sorbier.test, 10.66.0.0/24.\nObjet : enquête sur une anomalie de la version de développement de Sorbier. Les connexions SSH de la ferme de construction sont devenues lentes sans raison connue.\nDispositif convenu : le projet te remet des copies de ses relevés et des sources concernées, dans le dossier `dossier`. Tu lis, tu compares, tu ne touches à aucune machine.\nSigné : l'équipe sécurité du Projet Sorbier."
web.footer: "Projet Sorbier - distribution fictive, dossier BREACH 06"
