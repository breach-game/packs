web.pkg.p2: "Note de l'empaqueteur : le co-mainteneur insiste pour que la 5.6.1 passe vite en version stable."
ada.outOfScope: "Stop. Cette cible est hors du mandat SB-2027-006. Hors mandat, ce n'est plus une enquête : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
