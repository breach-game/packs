  fr: "Une plateforme de musique en continu, une grappe de conteneurs, et un tableau de bord ouvert « pour le week-end ». Tu récupères ce qu'il distribue, tu lis la grappe avec `kubectl get` et `describe`, puis tu corriges les manifestes côté défense, jugés par `verify`."
