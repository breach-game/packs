m4.briefing: "A bought password, an approved button, a readable file: three steps, three settings. Martinet's head of security sends you the file that holds them. You have the morning to close the doors."
m4.obj.idea: "Choose where to start"
m4.obj.factor: "Replace the \"Approve\" button with a second factor that checks something"
m4.obj.lock: "Lock the account and warn after three denied requests"
m4.obj.least: "Show contractors only the tools of their mission"
m4.obj.vault: "Take the secrets out of the scripts"
m4.q.idea: "Noé ended up approving. What does Martinet fix first?"
m4.q.idea.blame: "The people: sanction Noé, and remind every contractor that a request is never to be approved"
m4.q.idea.blame.why: "He refused twice, alone, in the middle of the night. Punishing him will only teach the others to report nothing. And the next person will give in at the tenth ring too."
m4.q.idea.longer: "The passwords: require longer ones and have every contractor change theirs each month"
m4.q.idea.longer.why: "The password was copied by malware as it was typed. Its length changes nothing."
m4.q.idea.system: "The system: a second factor that a simple tap cannot validate, and an alert when someone keeps trying"
m4.check.factor: "The second factor is no longer a plain button to approve"
m4.check.lock: "Three denied requests lock the account and warn security"
m4.check.least: "Contractors only see the tools of their mission"
m4.check.vault: "Secrets are in the vault, no longer in scripts"
m4.check.works: "Leak monitoring and the change of secrets after an incident stay on"
m4.ada.brief: "Last morning at Martinet. The settings are in `dossier/access.yml`. But first, a decision."
m4.ada.answer: "Answer in the messenger, or with `answer` and the letter."
m4.ada.answer.standard: "Answer my question first."
m4.ada.idea: "Yes. We do not ask someone to resist without end: we build a system where giving in once is not enough."
m4.ada.g.factor: "Open the file: `edit dossier/access.yml`. Start with the second factor: replace `second_factor: push` with `second_factor: security-key`, then `verify`."
m4.ada.g.factor.standard: "Open `dossier/access.yml` and choose a second factor that checks something. Then `verify`."
m4.ada.g.lock: "Next, the limit: yesterday, nothing counted the refusals. Write `lock_after_denied: 3`, then `verify`."
m4.ada.g.lock.standard: "Make several denials in a row lock the account and warn someone. Then `verify`."
m4.ada.g.least: "Contractors see the whole intranet. Write `intranet: mission-only`, then `verify`."
m4.ada.g.least.standard: "Reduce what a contractor's account can see. Then `verify`."
m4.ada.g.vault: "Last door: the secrets written in scripts. Write `stored: vault`, then `verify`."
m4.ada.g.vault.standard: "Take the secrets out of the files that use them. Then `verify`."
m4.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
m4.ada.done: "The three doors are closed, and each one would have been enough to stop the story. Open the debrief: at the end, the real incident this case file comes from."
m4.hint.idea.1: "Ask yourself what happens next time, with another person and ten rings instead of three."
m4.hint.factor.1: "The line to change is `second_factor`. The possible values are in the comments just above."
m4.hint.factor.2: "Type `sed -i \"s/second_factor: push/second_factor: security-key/\" dossier/access.yml`, then `verify`."
m4.hint.lock.1: "The line to change is `lock_after_denied`. The value 0 means \"never\"."
m4.hint.lock.2: "Type `sed -i \"s/lock_after_denied: 0/lock_after_denied: 3/\" dossier/access.yml`, then `verify`."
m4.hint.least.1: "The line to change is `intranet`, under `contractors`."
m4.hint.least.2: "Type `sed -i \"s/intranet: everything/intranet: mission-only/\" dossier/access.yml`, then `verify`."
m4.hint.vault.1: "The line to change is `stored`, under `secrets`."
m4.hint.vault.2: "Type `sed -i \"s/stored: in-scripts/stored: vault/\" dossier/access.yml`, then `verify`."
m4.debrief.title: "Three doors, three settings"
m4.debrief.lesson: "None of the three steps used a software flaw, and each one closed with a setting. A solid defence does not count on a person who never makes a mistake: it makes sure one mistake alone is not enough."
m4.debrief.p1: "A second factor that resists phishing and weariness: a security key, or at the very least a number to copy."
m4.debrief.p2: "Repeated denials are an alert. The account locks, security is warned, and the person knows whom to tell."
m4.debrief.p3: "Least privilege: a contractor only sees what their mission needs."
m4.debrief.p4: "Secrets live in a vault, never in a script, and they are changed after every incident."
m4.facts.title: "What really happened: Uber, September 2022"
m4.facts.p1: "Martinet and Noé do not exist. The scenario is inspired by the intrusion Uber suffered in September 2022, as the company told it in its statement of 19 September."
m4.facts.p2: "According to Uber, the account of an outside contractor was compromised. It is likely that the attacker bought the contractor's corporate password on the dark web, after the contractor's personal device had been infected with malware."
m4.facts.p3: "The attacker tried to log in repeatedly. Each time, the contractor received a two-factor login approval request, which at first blocked access. Eventually, the contractor accepted one."
m4.facts.p4: "From there, the attacker accessed several other employee accounts, which gave them elevated permissions on a number of tools, including G-Suite and Slack. Uber did not detail that step: the file readable by everyone in our scenario is a classic cause we chose to illustrate it."
m4.facts.p5: "The attacker posted a message to a company-wide Slack channel and changed a setting to display a graphic image on some internal sites. They downloaded Slack messages and information from an internal invoicing tool, and viewed reports of flaws that had already been fixed."
m4.facts.p6: "Uber says it saw no access to the production systems behind its apps, to user accounts or to the databases holding their sensitive data, and no change to its code."
m4.facts.p7: "The company says it believes the attacker was affiliated with the Lapsus$ group. In response, it blocked or reset the affected accounts, rotated the keys of many internal services, and announced stronger multi-factor authentication policies."
