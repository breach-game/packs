m4.briefing: "Un mot de passe acheté, un bouton approuvé, un fichier lisible : trois étapes, trois réglages. Le directeur de la sécurité de Martinet t'envoie le fichier qui les contient. Tu as la matinée pour refermer les portes."
m4.obj.idea: "Choisir par quoi commencer"
m4.obj.factor: "Remplacer le bouton « Approuver » par un second facteur qui vérifie quelque chose"
m4.obj.lock: "Verrouiller le compte et prévenir après trois demandes refusées"
m4.obj.least: "Ne montrer aux prestataires que les outils de leur mission"
m4.obj.vault: "Sortir les secrets des scripts"
m4.q.idea: "Noé a fini par approuver. Que corrige Martinet en premier ?"
m4.q.idea.blame: "Les personnes : sanctionner Noé, et rappeler à tous les prestataires qu'on ne valide jamais une demande"
m4.q.idea.blame.why: "Il a refusé deux fois, seul, en pleine nuit. Le punir apprendra seulement aux autres à ne rien signaler. Et la prochaine personne cédera aussi à la dixième sonnerie."
m4.q.idea.longer: "Les mots de passe : en imposer de plus longs et les faire changer tous les mois par les prestataires"
m4.q.idea.longer.why: "Le mot de passe a été copié par un logiciel malveillant au moment où il était tapé. Sa longueur n'y change rien."
m4.q.idea.system: "Le système : un second facteur qui ne se valide pas d'un simple appui, et une alerte quand on insiste"
m4.check.factor: "Le second facteur n'est plus un simple bouton à approuver"
m4.check.lock: "Trois demandes refusées verrouillent le compte et préviennent la sécurité"
m4.check.least: "Les prestataires ne voient que les outils de leur mission"
m4.check.vault: "Les secrets sont dans le coffre, plus dans les scripts"
m4.check.works: "La veille de fuites et le changement des secrets après incident restent actifs"
m4.ada.brief: "Dernière matinée chez Martinet. Les réglages sont dans `dossier/access.yml`. Mais d'abord, une décision."
m4.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
m4.ada.answer.standard: "Réponds d'abord à ma question."
m4.ada.idea: "Oui. On ne demande pas à quelqu'un de résister sans fin : on construit un système où céder une fois ne suffit pas."
m4.ada.g.factor: "Ouvre le fichier : `edit dossier/access.yml`. Commence par le second facteur : remplace `second_factor: push` par `second_factor: security-key`, puis `verify`."
m4.ada.g.factor.standard: "Ouvre `dossier/access.yml` et choisis un second facteur qui vérifie quelque chose. Puis `verify`."
m4.ada.g.lock: "Ensuite la limite : hier, rien ne comptait les refus. Écris `lock_after_denied: 3`, puis `verify`."
m4.ada.g.lock.standard: "Fais en sorte que plusieurs refus de suite verrouillent le compte et préviennent quelqu'un. Puis `verify`."
m4.ada.g.least: "Les prestataires voient tout l'intranet. Écris `intranet: mission-only`, puis `verify`."
m4.ada.g.least.standard: "Réduis ce qu'un compte de prestataire peut voir. Puis `verify`."
m4.ada.g.vault: "Dernière porte : les secrets écrits dans les scripts. Écris `stored: vault`, puis `verify`."
m4.ada.g.vault.standard: "Sors les secrets des fichiers qui s'en servent. Puis `verify`."
m4.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
m4.ada.done: "Les trois portes sont refermées, et chacune aurait suffi à arrêter l'histoire. Ouvre le débrief : à la fin, l'incident réel d'où vient ce dossier."
m4.hint.idea.1: "Demande-toi ce qui se passera la prochaine fois, avec une autre personne et dix sonneries au lieu de trois."
m4.hint.factor.1: "La ligne à changer est `second_factor`. Les valeurs possibles sont dans les commentaires juste au-dessus."
m4.hint.factor.2: "Tape `sed -i \"s/second_factor: push/second_factor: security-key/\" dossier/access.yml`, puis `verify`."
m4.hint.lock.1: "La ligne à changer est `lock_after_denied`. La valeur 0 veut dire « jamais »."
m4.hint.lock.2: "Tape `sed -i \"s/lock_after_denied: 0/lock_after_denied: 3/\" dossier/access.yml`, puis `verify`."
m4.hint.least.1: "La ligne à changer est `intranet`, sous `contractors`."
m4.hint.least.2: "Tape `sed -i \"s/intranet: everything/intranet: mission-only/\" dossier/access.yml`, puis `verify`."
m4.hint.vault.1: "La ligne à changer est `stored`, sous `secrets`."
m4.hint.vault.2: "Tape `sed -i \"s/stored: in-scripts/stored: vault/\" dossier/access.yml`, puis `verify`."
m4.debrief.title: "Trois portes, trois réglages"
m4.debrief.lesson: "Aucune des trois étapes n'utilisait une faille logicielle, et chacune se refermait par un réglage. Une défense solide ne compte pas sur une personne qui ne se trompe jamais : elle fait en sorte qu'une erreur seule ne suffise pas."
m4.debrief.p1: "Un second facteur qui résiste à l'hameçonnage et à la lassitude : une clé de sécurité, ou au minimum un nombre à recopier."
m4.debrief.p2: "Des refus répétés sont une alerte. Le compte se verrouille, la sécurité est prévenue, et la personne sait à qui le dire."
m4.debrief.p3: "Moindre privilège : un prestataire ne voit que ce dont sa mission a besoin."
m4.debrief.p4: "Les secrets vivent dans un coffre, jamais dans un script, et on les change après chaque incident."
m4.facts.title: "Ce qui s'est vraiment passé : Uber, septembre 2022"
m4.facts.p1: "Martinet et Noé n'existent pas. Le scénario s'inspire de l'intrusion subie par Uber en septembre 2022, telle que l'entreprise l'a racontée dans son communiqué du 19 septembre."
m4.facts.p2: "Selon Uber, le compte d'un prestataire extérieur a été compromis. Il est probable que l'attaquant ait acheté son mot de passe d'entreprise sur le dark web, après l'infection de l'appareil personnel du prestataire par un logiciel malveillant."
m4.facts.p3: "L'attaquant a tenté de se connecter à plusieurs reprises. Chaque fois, le prestataire recevait une demande d'approbation à deux facteurs, qui bloquait d'abord l'accès. Il a fini par en accepter une."
m4.facts.p4: "De là, l'attaquant a accédé à plusieurs autres comptes d'employés, ce qui lui a donné des droits élevés sur plusieurs outils, dont G-Suite et Slack. Uber n'a pas détaillé cette étape : le fichier lisible par tous de notre scénario est une cause classique que nous avons choisie pour l'illustrer."
m4.facts.p5: "Il a publié un message sur un canal Slack ouvert à toute l'entreprise et modifié un réglage pour afficher une image choquante sur des sites internes. Il a téléchargé des messages Slack et des informations d'un outil interne de facturation, et consulté des rapports de failles déjà corrigées."
m4.facts.p6: "Uber indique n'avoir constaté aucun accès aux systèmes de production de ses applications, aux comptes des utilisateurs ni aux bases qui contiennent leurs données sensibles, et aucune modification de son code."
m4.facts.p7: "L'entreprise dit penser que l'attaquant était lié au groupe Lapsus$. En réponse, elle a bloqué ou réinitialisé les comptes touchés, changé les clés de nombreux services internes, et annoncé un renforcement de ses règles de double authentification."
