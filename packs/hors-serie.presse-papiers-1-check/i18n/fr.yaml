p1.briefing: "Vendredi 3 décembre, 10 h 15. Contremarque reçoit des appels sur la page du concert Nuit Blanche : une « vérification de sécurité » demande de coller une ligne dans un terminal. Inès, au guichet 02, l'a fait mercredi. Son ticket est dans `tickets/`. Aujourd'hui, tu regardes la page. Tu ne colles rien."
p1.obj.look: "Ouvrir la page du concert Nuit Blanche"
p1.obj.server: "Lire ce que le bouton copie et dire d'où la ligne va chercher sa « mise à jour »"
p1.obj.widget: "Trouver dans la source de la page qui a ajouté ce bloc"
p1.obj.trick: "Dire ce qui fait marcher le piège"
p1.q.server: "De quel serveur la ligne copiée fait-elle télécharger une « mise à jour » par `cm-verif` ?"
p1.q.widget: "Quel domaine tiers, chargé par la page, a ajouté la fausse vérification ?"
p1.q.trick: "La page ne peut rien lancer sur le poste. Qu'est-ce qui fait marcher ce piège ?"
p1.q.trick.hands: "La personne lance elle-même la ligne, qu'elle croit sans danger"
p1.q.trick.browser: "Une faille du navigateur exécute tout seul ce qui est copié"
p1.q.trick.browser.why: "Le navigateur ne fait que copier un texte, ce qu'un bouton a le droit de faire. Rien ne s'exécute tant que personne ne colle et n'appuie sur Entrée."
p1.q.trick.captcha: "Cocher la case suffit à installer le programme sur le poste"
p1.q.trick.captcha.why: "Cocher la case ne fait que remplir le presse-papiers. Le programme arrive seulement quand la ligne est collée dans un terminal et lancée."
p1.ada.brief: "Lis d'abord le ticket : `cat tickets/2291.txt`. Puis ouvre la page : `open https://www.contremarque.test/concerts/nuit-blanche`."
p1.ada.g.look: "Ouvre la page du concert dans le navigateur : `open https://www.contremarque.test/concerts/nuit-blanche`. `curl -s` suivi de la même adresse montre sa source."
p1.ada.g.look.standard: "Commence par voir la page que les clients voient."
p1.ada.look: "Une case « Je ne suis pas un robot », puis une consigne : ouvrir un terminal, coller, Entrée. Aucune vraie vérification ne demande ça."
p1.ada.copied: "Le bouton a rempli le presse-papiers du poste. Rien n'a été lancé. Lis-le sans le coller : `clip`."
p1.ada.read: "Voilà la ligne qu'Inès a collée. `clip` l'affiche, il ne l'exécute pas. Regarde l'option `--from`."
p1.ada.g.server: "Clique sur la case dans le navigateur puis tape `clip`, ou cherche `data-clipboard` dans la source. Après `--from` : `answer server <domaine>`."
p1.ada.g.server.standard: "Lis ce que le bouton copie, sans le lancer, et trouve où la ligne va chercher. `answer server`."
p1.ada.server: "`cm-verif` est le vrai outil des guichets, mais `--from` lui fait chercher sa « mise à jour » chez maj.contremarque-billet.example, un nom qui ressemble à Contremarque et ne lui appartient pas."
p1.ada.g.widget: "Dans la source, juste avant le bloc de vérification, un commentaire nomme un script d'un autre domaine. `answer widget <domaine>`."
p1.ada.g.widget.standard: "Le site de Contremarque n'a pas écrit ce bloc. Qui charge-t-il qui aurait pu le faire ? `answer widget`."
p1.ada.widget: "Un widget de statistiques chargé depuis stats-billet.example. Le site lui fait confiance, il peut écrire ce qu'il veut dans la page."
p1.ada.g.trick: "Réponds dans la messagerie ou avec `answer <option>`."
p1.ada.done: "Tu as lu la ligne sans la lancer. Inès, elle, l'a lancée mercredi. Prochaine étape : son guichet."
p1.hint.look.1: "`curl -s https://www.contremarque.test/concerts/nuit-blanche`"
p1.hint.server.1: "Dans la source : `data-clipboard=\"cm-verif --silent --from …\"`."
p1.hint.server.2: "`answer server maj.contremarque-billet.example`"
p1.hint.widget.1: "Le commentaire HTML `<!-- widget … -->` juste avant le titre « Vérification de sécurité »."
p1.hint.widget.2: "`answer widget stats-billet.example`"
p1.hint.trick.1: "Une page web peut écrire dans le presse-papiers. Elle ne peut pas appuyer sur Entrée."
p1.debrief.title: "Je ne suis pas un robot"
p1.debrief.lesson: "Une page ne peut pas lancer de programme sur un poste. Alors elle demande à quelqu'un de le faire : une case familière remplit le presse-papiers, une consigne courte dit d'ouvrir un terminal, de coller et d'appuyer sur Entrée. Ici, la ligne utilisait même l'outil maison des guichets, avec une option qui va chercher sa mise à jour ailleurs. Le site n'était pas piraté directement : un widget tiers qu'il chargeait l'a été."
p1.debrief.p1: "Aucune vérification humaine ne demande d'ouvrir un terminal ou la boîte Exécuter et d'y coller quelque chose. C'est la phrase à apprendre à tout le monde."
p1.debrief.p2: "Lire un presse-papiers sans le coller : `clip`, ou la source de la page. Ce qui est copié n'est jamais forcément ce qu'on voit."
p1.debrief.p3: "Chaque script tiers chargé par un site peut réécrire ses pages. En garder la liste courte et la relire."
