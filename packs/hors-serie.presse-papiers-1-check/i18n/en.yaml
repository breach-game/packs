p1.briefing: "Friday 3 December, 10:15. Contremarque is getting calls about the Nuit Blanche concert page: a \"security check\" asks people to paste a line into a terminal. Ines, at box office 02, did it on Wednesday. Her ticket is in `tickets/`. Today you look at the page. You paste nothing."
p1.obj.look: "Open the Nuit Blanche concert page"
p1.obj.server: "Read what the button copies and say where the line fetches its \"update\" from"
p1.obj.widget: "Find in the page source who added this block"
p1.obj.trick: "Say what makes the trap work"
p1.q.server: "From which server does the copied line make `cm-verif` download an \"update\"?"
p1.q.widget: "Which third-party domain, loaded by the page, added the fake check?"
p1.q.trick: "The page cannot run anything on the computer. What makes this trap work?"
p1.q.trick.hands: "The person runs the line themselves, believing it is harmless"
p1.q.trick.browser: "A browser flaw runs whatever is copied to the clipboard, on its own"
p1.q.trick.browser.why: "The browser only copies a text, which a button is allowed to do. Nothing runs until someone pastes and presses Enter."
p1.q.trick.captcha: "Ticking the box is enough to install the program itself"
p1.q.trick.captcha.why: "Ticking the box only fills the clipboard. The program only arrives when the line is pasted into a terminal and run."
p1.ada.brief: "Read the ticket first: `cat tickets/2291.txt`. Then open the page: `open https://www.contremarque.test/concerts/nuit-blanche`."
p1.ada.g.look: "Open the concert page in the browser: `open https://www.contremarque.test/concerts/nuit-blanche`. `curl -s` with the same address shows its source."
p1.ada.g.look.standard: "Start by seeing the page customers see."
p1.ada.look: "An \"I am not a robot\" box, then an instruction: open a terminal, paste, Enter. No real check ever asks for that."
p1.ada.copied: "The button filled the workstation's clipboard. Nothing ran. Read it without pasting it: `clip`."
p1.ada.read: "That is the line Ines pasted. `clip` shows it, it does not run it. Look at the `--from` option."
p1.ada.g.server: "Click the box in the browser then type `clip`, or look for `data-clipboard` in the source. After `--from`: `answer server <domain>`."
p1.ada.g.server.standard: "Read what the button copies, without running it, and find where the line fetches from. `answer server`."
p1.ada.server: "`cm-verif` is the box offices' real tool, but `--from` makes it fetch its \"update\" from maj.contremarque-billet.example, a name that looks like Contremarque and does not belong to it."
p1.ada.g.widget: "In the source, just before the check block, a comment names a script from another domain. `answer widget <domain>`."
p1.ada.g.widget.standard: "Contremarque's site did not write this block. What does it load that could have? `answer widget`."
p1.ada.widget: "A statistics widget loaded from stats-billet.example. The site trusts it, so it can write whatever it likes into the page."
p1.ada.g.trick: "Answer in the messenger or with `answer <option>`."
p1.ada.done: "You read the line without running it. Ines ran it on Wednesday. Next step: her box office."
p1.hint.look.1: "`curl -s https://www.contremarque.test/concerts/nuit-blanche`"
p1.hint.server.1: "In the source: `data-clipboard=\"cm-verif --silent --from …\"`."
p1.hint.server.2: "`answer server maj.contremarque-billet.example`"
p1.hint.widget.1: "The HTML comment `<!-- widget … -->` just before the \"Security check\" heading."
p1.hint.widget.2: "`answer widget stats-billet.example`"
p1.hint.trick.1: "A web page can write to the clipboard. It cannot press Enter."
p1.debrief.title: "I am not a robot"
p1.debrief.lesson: "A page cannot run a program on a computer. So it asks someone to do it: a familiar box fills the clipboard, a short instruction says to open a terminal, paste and press Enter. Here the line even used the box offices' in-house tool, with an option that fetches its update from elsewhere. The site was not hacked directly: a third-party widget it loaded was."
p1.debrief.p1: "No human check ever asks you to open a terminal or the Run box and paste something into it. That is the sentence to teach everyone."
p1.debrief.p2: "Read a clipboard without pasting it: `clip`, or the page source. What is copied is not always what you see."
p1.debrief.p3: "Every third-party script a site loads can rewrite its pages. Keep the list short and review it."
