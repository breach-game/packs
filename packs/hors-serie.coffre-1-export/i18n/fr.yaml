c1.briefing: "Une copie de la table des adhérents du Coffre traînait sur un partage de fichiers. Elle est dans `copie/adherents.csv`. Personne ne sait si elle est sortie : évalue ce qu'elle exposerait, sans jamais chercher le mot de passe d'un adhérent."
c1.obj.old: "Reconnaître le format des anciennes empreintes"
c1.obj.same: "Compter les comptes qui gardent le mot de passe provisoire"
c1.obj.first: "Dire qui est en danger en premier"
c1.q.old: "Quel algorithme protège les comptes de 2016 à 2018 ? (réponds comme `hashid` l'écrit en premier)"
c1.q.same: "Combien de comptes de la copie ont encore le mot de passe provisoire de 2016 ?"
c1.q.first: "Si la copie est sortie, quels adhérents sont en danger en premier ?"
c1.q.first.fast: "Les anciens : empreinte rapide, sans sel"
c1.q.first.recent: "Les récents : leurs empreintes sont longues"
c1.q.first.recent.why: "Longues, mais lentes à calculer et salées : chaque essai coûte cher et ne vise qu'un compte."
c1.q.first.nobody: "Personne : une empreinte ne se lit pas à l'envers"
c1.q.first.nobody.why: "Elle ne se lit pas, mais elle se devine : on calcule l'empreinte d'un mot de passe probable et on compare, comme tu viens de le faire."
c1.ada.brief: "Regarde la copie : `cat copie/adherents.csv`. Deux formats d'empreinte se côtoient."
c1.ada.g.old: "Isole l'empreinte d'un ancien compte et donne-la à `hashid` : `grep 10048 copie/adherents.csv | cut -d \";\" -f 3 | hashid`. Puis `answer old <algorithme>`."
c1.ada.g.old.standard: "Trouve l'algorithme des comptes de 2016 à 2018 avec `hashid`, puis `answer old`."
c1.ada.old: "SHA-1, sans sel. Rapide à calculer, c'est fait pour vérifier des fichiers, pas pour garder des mots de passe. La mutuelle a pourtant publié elle-même un mot de passe : `cat docs/courrier-bienvenue-2016.txt`."
c1.ada.g.same: "Calcule l'empreinte de ce mot de passe provisoire : `echo -n \"Tilleul2016\" | openssl dgst -sha1`. Puis compte ses apparitions : `grep -c <empreinte> copie/adherents.csv`, et `answer same <nombre>`."
c1.ada.g.same.standard: "Compte les comptes qui ont encore le mot de passe du courrier de 2016, puis `answer same`."
c1.ada.same: "Six comptes, une seule empreinte. Sans sel, le même mot de passe donne toujours la même empreinte : un seul calcul les trouve tous. Pour la suite, garde sous les yeux `cat docs/temps-de-cassage.txt`."
c1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
c1.ada.answer.standard: "Ma question t'attend dans la messagerie."
c1.ada.done: "Le rapport dira : comptes anciens en danger, six mots de passe provisoires jamais changés, et un format d'empreinte à abandonner. Mais d'abord, regardons comment on change un mot de passe ici."
c1.hint.old.1: "La troisième colonne est l'empreinte. `hashid` liste les algorithmes possibles d'après sa forme."
c1.hint.old.2: "`answer old sha-1`"
c1.hint.same.1: "`echo -n` évite d'ajouter un retour à la ligne, qui changerait l'empreinte."
c1.hint.same.2: "`grep -c 73faef95aa1cfa102ca32da5b3dc662b3ef6aecb copie/adherents.csv`, puis `answer same 6`"
c1.hint.first.1: "Compare les lignes du tableau : combien d'essais par seconde, et combien de comptes visés par chaque essai ?"
c1.debrief.title: "La copie oubliée"
c1.debrief.lesson: "Une empreinte n'est pas un coffre : c'est un résultat qu'on peut recalculer. Rapide et sans sel, elle laisse tester des milliards de mots de passe par seconde contre tous les comptes à la fois, et trahit d'un coup ceux qui partagent le même. Lente et salée, chaque essai coûte cher et ne vise qu'un compte."
c1.debrief.p1: "Garder les mots de passe avec un algorithme lent et salé fait pour ça (Argon2id, bcrypt), jamais avec SHA-1 ou MD5."
c1.debrief.p2: "Ne jamais envoyer le même mot de passe provisoire à tout le monde, et en exiger le changement à la première connexion."
c1.debrief.p3: "Ranger les copies de base de données comme la base elle-même : chiffrées, recensées, effacées quand elles ne servent plus."
