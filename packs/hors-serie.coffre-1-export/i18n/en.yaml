c1.briefing: "A copy of the Vault's member table was lying on a file share. It is in `copie/adherents.csv`. Nobody knows whether it left: assess what it would expose, never trying to find any member's password."
c1.obj.old: "Recognise the format of the old hashes"
c1.obj.same: "Count the accounts still on the temporary password"
c1.obj.first: "Say who is at risk first"
c1.q.old: "Which algorithm protects the 2016 to 2018 accounts? (answer as `hashid` writes it first)"
c1.q.same: "How many accounts in the copy still have the 2016 temporary password?"
c1.q.first: "If the copy got out, which members are at risk first?"
c1.q.first.fast: "The old ones: fast hash, no salt"
c1.q.first.recent: "The recent ones: their hashes are long"
c1.q.first.recent.why: "Long, but slow to compute and salted: each guess is costly and targets one account."
c1.q.first.nobody: "Nobody: a hash cannot be read backwards"
c1.q.first.nobody.why: "It cannot be read, but it can be guessed: you compute the hash of a likely password and compare, as you just did."
c1.ada.brief: "Look at the copy: `cat copie/adherents.csv`. Two hash formats sit side by side."
c1.ada.g.old: "Pick the hash of an old account and give it to `hashid`: `grep 10048 copie/adherents.csv | cut -d \";\" -f 3 | hashid`. Then `answer old <algorithm>`."
c1.ada.g.old.standard: "Find the algorithm of the 2016 to 2018 accounts with `hashid`, then `answer old`."
c1.ada.old: "SHA-1, unsalted. Fast to compute: it is made to check files, not to keep passwords. Yet the insurer published a password itself: `cat docs/courrier-bienvenue-2016.txt`."
c1.ada.g.same: "Compute the hash of that temporary password: `echo -n \"Tilleul2016\" | openssl dgst -sha1`. Then count how often it appears: `grep -c <hash> copie/adherents.csv`, and `answer same <number>`."
c1.ada.g.same.standard: "Count the accounts that still have the password from the 2016 letter, then `answer same`."
c1.ada.same: "Six accounts, one single hash. Without salt, the same password always gives the same hash: one computation finds them all. For what comes next, keep `cat docs/temps-de-cassage.txt` in view."
c1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
c1.ada.answer.standard: "My question is waiting in the messenger."
c1.ada.done: "The report will say: old accounts at risk, six temporary passwords never changed, and a hash format to drop. But first, let's see how a password gets changed here."
c1.hint.old.1: "The third column is the hash. `hashid` lists the possible algorithms from its shape."
c1.hint.old.2: "`answer old sha-1`"
c1.hint.same.1: "`echo -n` avoids adding a newline, which would change the hash."
c1.hint.same.2: "`grep -c 73faef95aa1cfa102ca32da5b3dc662b3ef6aecb copie/adherents.csv`, then `answer same 6`"
c1.hint.first.1: "Compare the rows of the table: how many guesses per second, and how many accounts does each guess target?"
c1.debrief.title: "The forgotten copy"
c1.debrief.lesson: "A hash is not a safe: it is a result anyone can compute again. Fast and unsalted, it lets billions of passwords per second be tested against every account at once, and gives away in one go those who share the same one. Slow and salted, each guess is costly and targets a single account."
c1.debrief.p1: "Keep passwords with a slow, salted algorithm made for it (Argon2id, bcrypt), never with SHA-1 or MD5."
c1.debrief.p2: "Never send everyone the same temporary password, and require a change at first sign-in."
c1.debrief.p3: "Treat database copies like the database itself: encrypted, listed, deleted when no longer needed."
