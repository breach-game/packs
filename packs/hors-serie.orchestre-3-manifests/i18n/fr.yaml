o3.briefing: "Côté défense maintenant. Les trois manifestes en cause sont dans `manifestes/` : le lecteur, le pod de test et les réglages du tableau de bord. Corrige-les sans casser ce qui marche, fais juger par `verify`, puis ferme le tableau et vérifie de l'extérieur."
o3.obj.secret: "Sortir la clé de licence du manifeste du lecteur"
o3.obj.debug: "Retirer au pod de test ses privilèges et l'accès à sa machine"
o3.obj.auth: "Remettre la connexion devant le tableau de bord"
o3.obj.closed: "Fermer le tableau de bord et le vérifier de l'extérieur"
o3.check.secret: "La clé de licence vient d'un secret (lecteur-licence, clé drm), plus de valeur en clair"
o3.check.debug: "Le pod de test n'est plus privilégié, ne monte plus la machine, n'utilise plus son réseau"
o3.check.auth: "Le tableau de bord demande une connexion et ne distribue plus de kubeconfig"
o3.check.works: "Le lecteur garde son mot de passe de base, le pod de test garde son conteneur"
o3.contain.close: "Appliquer les nouveaux réglages du tableau de bord et révoquer le jeton distribué"
o3.ada.brief: "Commence par le lecteur : `cat manifestes/lecteur.yaml`. Une valeur en clair doit devenir une référence à un secret, comme le mot de passe juste en dessous. `edit` ou `sed -i`, puis `verify`."
o3.ada.g.secret: "Remplace la ligne `value: FLAG-masque-dans-le-depot` par `valueFrom:` puis `secretKeyRef: { name: lecteur-licence, key: drm }`, sur le modèle de BASE_MOTDEPASSE (sur une ligne : `valueFrom: { secretKeyRef: { name: lecteur-licence, key: drm } }`)."
o3.ada.g.secret.standard: "La clé de licence doit venir d'un secret nommé lecteur-licence (clé drm)."
o3.ada.g.debug: "Dans `manifestes/outil-debug.yaml` : `privileged: false`, et plus de `hostNetwork`, de `hostPath` ni de montage `racine-noeud`."
o3.ada.g.debug.standard: "Le pod de test ne doit garder ni privilèges, ni machine, ni réseau de la machine."
o3.ada.g.auth: "Dans `manifestes/tableau.yaml` : `auth: oidc` et `expose_kubeconfig: \"false\"`. Puis `verify`."
o3.ada.g.auth.standard: "Le tableau de bord doit repasser par la connexion unique (OIDC) et cesser de distribuer son fichier."
o3.ada.almost: "Pas encore tout. Relis les contrôles en échec."
o3.ada.verified: "Les trois manifestes passent. Applique les réglages du tableau : `contain disable tableau`."
o3.ada.g.closed: "`contain disable tableau`, puis vérifie comme un inconnu : `curl -s https://tableau.ondine.test/kubeconfig`."
o3.ada.g.closed.standard: "Ferme le tableau de bord, puis vérifie de l'extérieur qu'il ne distribue plus rien."
o3.ada.done: "401. Le tableau demande une connexion, le jeton est révoqué, la clé est dans un secret et le pod de test est un simple conteneur. Les partitions sont réécrites."
o3.hint.secret.1: "`sed -i \"s/              value: FLAG-masque-dans-le-depot/              valueFrom:\\n                secretKeyRef: { name: lecteur-licence, key: drm }/\" manifestes/lecteur.yaml`"
o3.hint.debug.1: "`sed -i \"s/privileged: true/privileged: false/\" manifestes/outil-debug.yaml`, puis `sed -i \"/hostNetwork: true/d\"`, `sed -i \"/racine-noeud/d\"`, `sed -i \"/hostPath/d\"` sur le même fichier."
o3.hint.auth.1: "`sed -i \"s/auth: none/auth: oidc/\" manifestes/tableau.yaml`, et `expose_kubeconfig: \"false\"`."
o3.hint.closed.1: "`contain disable tableau`, puis `curl -s https://tableau.ondine.test/kubeconfig`"
o3.debrief.title: "Réécrire les partitions"
o3.debrief.lesson: "Trois manifestes, trois corrections : une valeur sensible passe dans un secret, un pod de test redevient un simple conteneur, un tableau de bord retrouve sa connexion. Chacune tient en quelques lignes. Ce qui manquait, c'était quelqu'un pour les relire, et une règle pour refuser les mauvaises."
o3.debrief.p1: "Relire les manifestes comme du code : une valeur en clair, un `privileged`, un `hostPath` doivent sauter aux yeux en revue."
o3.debrief.p2: "Faire refuser par la grappe ce qu'aucune revue ne doit laisser passer (politique d'admission)."
o3.debrief.p3: "Révoquer un jeton distribué, même « en lecture » : il a pu être copié."
