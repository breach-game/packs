o3.briefing: "Defence side now. The three manifests involved are in `manifestes/`: the player, the test pod and the dashboard's settings. Fix them without breaking what works, have `verify` judge them, then close the dashboard and check from outside."
o3.obj.secret: "Take the licence key out of the player's manifest"
o3.obj.debug: "Take the test pod's privileges and machine access away"
o3.obj.auth: "Put the sign-in back in front of the dashboard"
o3.obj.closed: "Close the dashboard and check it from outside"
o3.check.secret: "The licence key comes from a secret (lecteur-licence, key drm), no more value in clear"
o3.check.debug: "The test pod is no longer privileged, no longer mounts the machine, no longer uses its network"
o3.check.auth: "The dashboard asks for sign-in and no longer hands out a kubeconfig"
o3.check.works: "The player keeps its database password, the test pod keeps its container"
o3.contain.close: "Apply the dashboard's new settings and revoke the token it handed out"
o3.ada.brief: "Start with the player: `cat manifestes/lecteur.yaml`. A value in clear must become a reference to a secret, like the password just below. `edit` or `sed -i`, then `verify`."
o3.ada.g.secret: "Replace the line `value: FLAG-masque-dans-le-depot` with `valueFrom:` then `secretKeyRef: { name: lecteur-licence, key: drm }`, like BASE_MOTDEPASSE."
o3.ada.g.secret.standard: "The licence key must come from a secret named lecteur-licence (key drm)."
o3.ada.g.debug: "In `manifestes/outil-debug.yaml`: `privileged: false`, and no more `hostNetwork`, `hostPath` or `racine-noeud` mount."
o3.ada.g.debug.standard: "The test pod must keep no privileges, no machine, no machine network."
o3.ada.g.auth: "In `manifestes/tableau.yaml`: `auth: oidc` and `expose_kubeconfig: \"false\"`. Then `verify`."
o3.ada.g.auth.standard: "The dashboard must ask for sign-in and stop handing out its file."
o3.ada.almost: "Not everything yet. Read the failing checks again."
o3.ada.verified: "All three manifests pass. Apply the dashboard's settings: `contain disable tableau`."
o3.ada.g.closed: "`contain disable tableau`, then check like a stranger: `curl -s https://tableau.ondine.test/kubeconfig`."
o3.ada.g.closed.standard: "Close the dashboard, then check from outside that it hands out nothing any more."
o3.ada.done: "401. The dashboard asks for sign-in, the token is revoked, the key sits in a secret and the test pod is a plain container. The scores are rewritten."
o3.hint.secret.1: "`sed -i \"s/              value: FLAG-masque-dans-le-depot/              valueFrom:\\n                secretKeyRef: { name: lecteur-licence, key: drm }/\" manifestes/lecteur.yaml`"
o3.hint.debug.1: "`sed -i \"s/privileged: true/privileged: false/\" manifestes/outil-debug.yaml`, then `sed -i \"/hostNetwork: true/d\"`, `sed -i \"/racine-noeud/d\"`, `sed -i \"/hostPath/d\"` on the same file."
o3.hint.auth.1: "`sed -i \"s/auth: none/auth: oidc/\" manifestes/tableau.yaml`, and `expose_kubeconfig: \"false\"`."
o3.hint.closed.1: "`contain disable tableau`, then `curl -s https://tableau.ondine.test/kubeconfig`"
o3.debrief.title: "Rewriting the scores"
o3.debrief.lesson: "Three manifests, three fixes: a sensitive value moves into a secret, a test pod becomes a plain container again, a dashboard gets its sign-in back. Each fits in a few lines. What was missing was someone to review them, and a rule to refuse the bad ones."
o3.debrief.p1: "Review manifests like code: a value in clear, a `privileged`, a `hostPath` must jump out in review."
o3.debrief.p2: "Have the cluster refuse what no review should let through (admission policy)."
o3.debrief.p3: "Revoke a token that was handed out, even a \"read\" one: it may have been copied."
