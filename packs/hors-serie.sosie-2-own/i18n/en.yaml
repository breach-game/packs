s2.briefing: "Second wave, more refined: a garage client received a reminder from `compta@sarcelle.test`, the firm's real domain. The message: `clients/relance.eml`. The firm's DNS zone: `dns/sarcelle.zone`, and three months of DMARC reports: `dns/rapports-dmarc.txt`."
s2.obj.policy: "Find what the DMARC policy asks recipients to do"
s2.obj.spf: "Have unauthorised servers refused (SPF)"
s2.obj.dmarc: "Have failing messages rejected (DMARC)"
s2.q.policy: "What is the firm's DMARC policy today (the p parameter)?"
s2.check.spf: "Strict SPF (-all), keeping the firm's server and the newsletter"
s2.check.dmarc: "DMARC set to reject"
s2.check.works: "Mail, the newsletter and DMARC reports still work"
s2.ada.brief: "Read the headers: `mailhdr clients/relance.eml`. SPF \"softfail\", DMARC failed… and the message still arrived. Why?"
s2.ada.g.policy: "Look at what the firm publishes: `dig sarcelle.test TXT`, then the _dmarc line of `dns/sarcelle.zone`. The p parameter says what to do with a failure. `answer policy <value>`."
s2.ada.g.policy.standard: "Find the DMARC policy the firm publishes. `answer policy`."
s2.ada.policy: "\"none\": watch, block nothing. And SPF ends with \"~all\": an unknown server is only half suspect. The domain almost invites spoofing."
s2.ada.g.spf: "Before hardening, check who really sends: `cat dns/rapports-dmarc.txt`. Only the firm's server and the newsletter service send for it. So SPF can refuse the rest: `sed -i \"s/ ~all/ -all/\" dns/sarcelle.zone`, then `verify`."
s2.ada.g.spf.standard: "Make SPF strict, without forgetting who legitimately sends for the firm (the DMARC reports say). Then `verify`."
s2.ada.g.dmarc: "Then ask recipients to reject what fails: `sed -i \"s/p=none/p=reject/\" dns/sarcelle.zone`, then `verify`."
s2.ada.g.dmarc.standard: "Have messages that fail DMARC rejected, keeping the reports. Then `verify`."
s2.ada.almost: "Not everything yet. Read the FAIL lines, fix the zone and run `verify` again."
s2.ada.done: "The firm's real domain can no longer be spoofed without being rejected. And because you read the reports first, the newsletter still gets through. What remains is what the firm tells fraudsters about itself."
s2.hint.policy.1: "`cat dns/sarcelle.zone`, the _dmarc line: `p=…`."
s2.hint.policy.2: "`answer policy none`"
s2.hint.spf.1: "Keep `mx` and `include:spf.lettres-pro.example`; change only `~all`."
s2.hint.spf.2: "`sed -i \"s/ ~all/ -all/\" dns/sarcelle.zone`, then `verify`."
s2.hint.dmarc.1: "`sed -i \"s/p=none/p=reject/\" dns/sarcelle.zone`, then `verify`."
s2.debrief.title: "Our own name"
s2.debrief.lesson: "A domain that publishes SPF with \"~all\" and DMARC with \"p=none\" watches itself being spoofed without stopping it. DMARC reports say who sends legitimately: once everyone is identified, you can move to \"-all\" and \"p=reject\" without breaking anything."
s2.debrief.p1: "Publish DMARC at \"none\" while reading the reports, then move to \"quarantine\" and \"reject\"."
s2.debrief.p2: "List in SPF every service that sends for you (newsletter, invoicing), then end with \"-all\"."
s2.debrief.p3: "Sign the server's and third-party services' messages with DKIM."
s2.obj.before: "Say what to check before hardening"
s2.q.before: "Before having everything that fails rejected, what must you check?"
s2.q.before.reports: "Who sends legitimately for the firm, in the DMARC reports"
s2.q.before.clients: "That every client has accepted the change"
s2.q.before.clients.why: "Clients have nothing to accept: this setting only concerns the servers that send in the firm's name."
s2.q.before.age: "That the firm's domain is more than a year old"
s2.q.before.age.why: "The domain's age changes nothing. The risk is rejecting a forgotten legitimate service, such as the newsletter."
s2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
s2.ada.answer.standard: "My question is waiting in the messenger."
s2.hint.before.1: "What would break if a legitimate service were forgotten?"
