s2.briefing: "Deuxième vague, plus fine : un garage client a reçu une relance de `compta@sarcelle.test`, le vrai domaine du cabinet. Le message : `clients/relance.eml`. La zone DNS du cabinet : `dns/sarcelle.zone`, et trois mois de rapports DMARC : `dns/rapports-dmarc.txt`."
s2.obj.policy: "Trouver ce que la politique DMARC demande aux destinataires"
s2.obj.spf: "Faire refuser les serveurs non autorisés (SPF)"
s2.obj.dmarc: "Faire rejeter les messages qui échouent (DMARC)"
s2.q.policy: "Que vaut aujourd'hui la politique DMARC du cabinet (le paramètre p) ?"
s2.check.spf: "SPF strict (-all), qui garde le serveur du cabinet et la lettre d'information"
s2.check.dmarc: "DMARC en rejet"
s2.check.works: "La messagerie, la lettre d'information et les rapports DMARC marchent toujours"
s2.ada.brief: "Lis les en-têtes : `mailhdr clients/relance.eml`. SPF en « softfail », DMARC en échec… et le message est quand même arrivé. Pourquoi ?"
s2.ada.g.policy: "Regarde ce que le cabinet publie : `dig sarcelle.test TXT`, puis la ligne _dmarc de `dns/sarcelle.zone`. Le paramètre p dit quoi faire d'un échec. `answer policy <valeur>`."
s2.ada.g.policy.standard: "Trouve la politique DMARC publiée par le cabinet. `answer policy`."
s2.ada.policy: "« none » : observer, ne rien bloquer. Et SPF finit par « ~all » : un serveur inconnu n'est qu'à moitié suspect. Le domaine invite presque à l'usurper."
s2.ada.g.spf: "Avant de durcir, vérifie qui envoie vraiment : `cat dns/rapports-dmarc.txt`. Seuls le serveur du cabinet et le service de lettre d'information envoient pour lui. Alors SPF peut refuser le reste : `sed -i \"s/ ~all/ -all/\" dns/sarcelle.zone`, puis `verify`. Ou à la main, dans l'éditeur : `edit dns/sarcelle.zone`, puis Ctrl+S."
s2.ada.g.spf.standard: "Rends SPF strict, sans oublier qui envoie légitimement pour le cabinet (les rapports DMARC le disent). Puis `verify`. Pour ouvrir le fichier : `edit dns/sarcelle.zone`."
s2.ada.g.dmarc: "Puis demande aux destinataires de rejeter ce qui échoue : `sed -i \"s/p=none/p=reject/\" dns/sarcelle.zone`, puis `verify`. Ou à la main, dans l'éditeur : `edit dns/sarcelle.zone`, puis Ctrl+S."
s2.ada.g.dmarc.standard: "Fais rejeter les messages qui échouent à DMARC, en gardant les rapports. Puis `verify`."
s2.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige la zone et relance `verify`."
s2.ada.done: "Le vrai domaine du cabinet ne peut plus être usurpé sans être rejeté. Et parce que tu as lu les rapports avant, la lettre d'information passe toujours. Reste ce que le cabinet raconte de lui-même aux fraudeurs."
s2.hint.policy.1: "`cat dns/sarcelle.zone`, ligne _dmarc : `p=…`."
s2.hint.policy.2: "`answer policy none`"
s2.hint.spf.1: "Garde `mx` et `include:spf.lettres-pro.example` ; change seulement `~all`."
s2.hint.spf.2: "Avec l'éditeur : `edit dns/sarcelle.zone`, puis Ctrl+S. Avec une commande : `sed -i \"s/ ~all/ -all/\" dns/sarcelle.zone`, puis `verify`."
s2.hint.dmarc.1: "Avec l'éditeur : `edit dns/sarcelle.zone`, puis Ctrl+S. Avec une commande : `sed -i \"s/p=none/p=reject/\" dns/sarcelle.zone`, puis `verify`."
s2.debrief.title: "Notre propre nom"
s2.debrief.lesson: "Un domaine qui publie SPF en « ~all » et DMARC en « p=none » observe sa propre usurpation sans l'empêcher. Les rapports DMARC disent qui envoie légitimement : une fois tout le monde identifié, on peut passer à « -all » et « p=reject » sans rien casser."
s2.debrief.p1: "Publier DMARC en « none » le temps de lire les rapports, puis passer en « quarantine » et « reject »."
s2.debrief.p2: "Lister dans SPF chaque service qui envoie pour soi (lettre d'information, facturation), puis finir par « -all »."
s2.debrief.p3: "Signer avec DKIM les messages du serveur et des services tiers."
s2.obj.before: "Dire quoi vérifier avant de durcir"
s2.q.before: "Avant de faire rejeter tout ce qui échoue, que faut-il vérifier ?"
s2.q.before.reports: "Qui envoie légitimement pour le cabinet, dans les rapports DMARC"
s2.q.before.clients: "Que chaque client a bien accepté le changement"
s2.q.before.clients.why: "Les clients n'ont rien à accepter : ce réglage ne concerne que les serveurs qui envoient au nom du cabinet."
s2.q.before.age: "Que le domaine du cabinet existe depuis plus d'un an, sinon il est rejeté"
s2.q.before.age.why: "L'âge du domaine ne change rien. Le risque, c'est de rejeter un service légitime oublié, comme la lettre d'information."
s2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
s2.ada.answer.standard: "Ma question t'attend dans la messagerie."
s2.hint.before.1: "Qu'est-ce qui casserait si un service légitime était oublié ?"
