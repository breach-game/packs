p1.briefing: "Lundi, 8 h 40. Le pare-feu du Laboratoire Ombelle signale le poste de paillasse 42 : une connexion vers une adresse jamais vue, toutes les cinq minutes, depuis une semaine. Le rapport est dans `alertes/`. Le laboratoire t'a ouvert un accès en lecture seule au poste (compte `ir`). Les mesures passent par `contain`."
p1.obj.remote: "Trouver quel programme du poste parle à l'extérieur, et vers quelle adresse (answer remote)"
p1.obj.restart: "Comprendre pourquoi l'arrêter vendredi n'a servi à rien"
p1.obj.stop: "Arrêter ce qui le relance"
p1.obj.check: "Vérifier sur le poste qu'il ne tourne plus"
p1.q.remote: "À quelle adresse distante le programme suspect du poste 42 est-il connecté en ce moment ?"
p1.q.restart: "Vendredi, l'assistance a tué le processus. Il est revenu cinq secondes plus tard. Pourquoi ?"
p1.q.restart.unit: "Un service systemd le relance à chaque arrêt, Restart=always"
p1.q.restart.hidden: "Le programme se cache et se copie ailleurs quand on le tue"
p1.q.restart.hidden.why: "Le journal du service dit autre chose : « Scheduled restart job », cinq secondes après le KILL. C'est systemd qui le relance, au même endroit."
p1.q.restart.cron: "Une tâche planifiée le relance toutes les cinq minutes"
p1.q.restart.cron.why: "Il est revenu en cinq secondes, pas en cinq minutes, et le journal montre un « Scheduled restart job » du service lui-même."
p1.contain.disable: "Désactiver et arrêter le service imprimante-maj du poste 42 (systemctl disable --now)"
p1.ada.brief: "Commence par le rapport du pare-feu : `cat alertes/pare-feu.txt`. Puis va voir sur place : `ssh ir@poste42.ombelle.test`."
p1.ada.g.remote: "Sur le poste, liste ce qui tourne avec `ps aux`, puis les connexions et leur programme avec `ss -tnp`. Laquelle ne va pas vers le serveur d'analyses ? `answer remote <adresse>`."
p1.ada.g.remote.standard: "Trouve sur le poste le programme qui parle à l'extérieur, et à quelle adresse. `answer remote`."
p1.ada.remote: "Un « pilote d'imprimante » rangé dans le dossier personnel, qui parle à 203.0.113.50 toutes les cinq minutes. Aucun pilote ne fait ça."
p1.ada.g.restart: "Lis la fiche du service, `systemctl status imprimante-maj`, et son journal, `journalctl -u imprimante-maj`. Regarde vendredi matin. `last` te dira qui était connecté."
p1.ada.g.restart.standard: "Le journal du service raconte vendredi matin. Lis-le avant de répondre."
p1.ada.restart: "Un service avec Restart=always : tuer le processus ne fait que le redémarrer. Il faut arrêter l'unité et l'empêcher de revenir au démarrage."
p1.ada.g.stop: "Quitte le poste avec `exit`, puis demande la mesure au laboratoire : `contain disable imprimante-maj`."
p1.ada.g.stop.standard: "Arrête le service, pas le processus. `contain` pour la liste des mesures."
p1.ada.stopped: "Service désactivé et arrêté. Ne me crois pas sur parole : retourne voir."
p1.ada.g.check: "`ssh ir@poste42.ombelle.test`, puis `ps aux` ou `ss -tnp`."
p1.ada.g.check.standard: "Vérifie sur le poste que le programme et sa connexion ont disparu."
p1.ada.done: "Plus de processus, plus de connexion. Le poste est calme. Reste à savoir ce qu'il a fait pendant une semaine, et s'il a un plan B."
p1.hint.remote.1: "Dans `ss -tnp`, une seule connexion établie ne va pas vers 10.88.0.30."
p1.hint.remote.2: "`answer remote 203.0.113.50`"
p1.hint.restart.1: "Dans `journalctl -u imprimante-maj` : « status=9/KILL », puis « Scheduled restart job » cinq secondes plus tard."
p1.hint.restart.2: "`answer unit`"
p1.hint.stop.1: "`exit`, puis `contain disable imprimante-maj`"
p1.hint.check.1: "`ssh ir@poste42.ombelle.test` puis `ps aux`"
p1.debrief.title: "Le pilote qui ne dort jamais"
p1.debrief.lesson: "Un faux pilote d'imprimante, installé par le compte du poste depuis un fichier téléchargé, s'est déclaré comme service systemd avec Restart=always. Vendredi, l'assistance a tué le processus, a vu le poste se calmer, et a fermé le ticket. Cinq secondes plus tard, systemd l'avait relancé. Ce qui persiste, c'est l'unité, pas le processus."
p1.debrief.p1: "Chercher ce qui relance un programme suspect (service, tâche planifiée, démarrage de session) avant de le tuer."
p1.debrief.p2: "Comparer ce qui tourne à ce qui devrait tourner : un binaire dans un dossier personnel lancé par un service système est un signal fort."
p1.debrief.p3: "Garder une trace de ce qu'on a vu avant d'agir : le binaire et l'unité serviront à l'enquête."
