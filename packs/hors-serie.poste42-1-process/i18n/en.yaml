p1.briefing: "Monday, 8:40. The firewall of Laboratoire Ombelle flags bench workstation 42: a connection to an address never seen before, every five minutes, for a week. The report is in `alertes/`. The lab has opened read-only access to the workstation for you (account `ir`). Measures go through `contain`."
p1.obj.remote: "Find which program on the workstation talks to the unknown address"
p1.obj.restart: "Understand why stopping it on Friday did nothing"
p1.obj.stop: "Stop what restarts it"
p1.obj.check: "Check on the workstation that it no longer runs"
p1.q.remote: "Which remote address is the suspicious program on bench 42 connected to right now?"
p1.q.restart: "On Friday, the help desk killed the process. It was back five seconds later. Why?"
p1.q.restart.unit: "A systemd service restarts it every time it stops, Restart=always"
p1.q.restart.hidden: "The program hides and copies itself elsewhere when killed"
p1.q.restart.hidden.why: "The service journal says otherwise: \"Scheduled restart job\", five seconds after the KILL. systemd restarts it, in the same place."
p1.q.restart.cron: "A scheduled task restarts it every five minutes"
p1.q.restart.cron.why: "It came back in five seconds, not five minutes, and the journal shows a \"Scheduled restart job\" from the service itself."
p1.contain.disable: "Disable and stop the imprimante-maj service on bench 42 (systemctl disable --now)"
p1.ada.brief: "Start with the firewall report: `cat alertes/pare-feu.txt`. Then go and look: `ssh ir@poste42.ombelle.test`."
p1.ada.g.remote: "On the workstation, list what runs with `ps aux`, then the connections and their program with `ss -tnp`. Which one does not go to the analysis server? `answer remote <address>`."
p1.ada.g.remote.standard: "Find the program on the workstation that talks to the outside, and to which address. `answer remote`."
p1.ada.remote: "A \"printer driver\" stored in a home folder, talking to 203.0.113.50 every five minutes. No driver does that."
p1.ada.g.restart: "Read the service's status, `systemctl status imprimante-maj`, and its journal, `journalctl -u imprimante-maj`. Look at Friday morning. `last` tells you who was signed in."
p1.ada.g.restart.standard: "The service journal tells the story of Friday morning. Read it before you answer."
p1.ada.restart: "A service with Restart=always: killing the process only restarts it. The unit has to be stopped and kept from coming back at boot."
p1.ada.g.stop: "Leave the workstation with `exit`, then ask the lab for the measure: `contain disable imprimante-maj`."
p1.ada.g.stop.standard: "Stop the service, not the process. `contain` lists the measures."
p1.ada.stopped: "Service disabled and stopped. Don't take my word for it: go and look."
p1.ada.g.check: "`ssh ir@poste42.ombelle.test`, then `ps aux` or `ss -tnp`."
p1.ada.g.check.standard: "Check on the workstation that the program and its connection are gone."
p1.ada.done: "No process, no connection. The workstation is quiet. What's left is finding out what it did for a week, and whether it has a plan B."
p1.hint.remote.1: "In `ss -tnp`, only one established connection does not go to 10.88.0.30."
p1.hint.remote.2: "`answer remote 203.0.113.50`"
p1.hint.restart.1: "In `journalctl -u imprimante-maj`: \"status=9/KILL\", then \"Scheduled restart job\" five seconds later."
p1.hint.restart.2: "`answer unit`"
p1.hint.stop.1: "`exit`, then `contain disable imprimante-maj`"
p1.hint.check.1: "`ssh ir@poste42.ombelle.test` then `ps aux`"
p1.debrief.title: "The driver that never sleeps"
p1.debrief.lesson: "A fake printer driver, installed by the workstation's account from a downloaded file, registered itself as a systemd service with Restart=always. On Friday the help desk killed the process, saw the workstation calm down, and closed the ticket. Five seconds later systemd had restarted it. What persists is the unit, not the process."
p1.debrief.p1: "Look for what restarts a suspicious program (service, scheduled task, session start) before killing it."
p1.debrief.p2: "Compare what runs with what should run: a binary in a home folder started by a system service is a strong signal."
p1.debrief.p3: "Keep a record of what you saw before acting: the binary and the unit will serve the investigation."
