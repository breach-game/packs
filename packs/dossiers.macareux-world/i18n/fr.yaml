file.readme: "Poste Ligne Rouge. Dossier : Macareux. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT AR-2027-141\nClient : Ardoise, éditeur de logiciel de facturation. Périmètre : *.ardoise.test, 10.117.0.0/24.\nObjet : Converso, l'éditeur du chat du site, prévient ses clients que des jetons de connexion ont été volés chez lui. Ligne Rouge aide Ardoise à savoir ce qui est sorti de son CRM, à fermer l'accès et à changer ce qui doit l'être.\nCadre convenu : défense seulement. Lecture du journal de l'API du CRM et de l'export, mesures validées par la direction et passées par `contain`.\nSigné : le responsable de la sécurité d'Ardoise."
ada.outOfScope: "Stop. Cette cible est hors du mandat AR-2027-141. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
