file.readme: "Ligne Rouge workstation. Case file: Macareux. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE AR-2027-141\nClient: Ardoise, billing software vendor. Scope: *.ardoise.test, 10.117.0.0/24.\nPurpose: Converso, the vendor of the website chat, warns its customers that sign-in tokens were stolen from it. Ligne Rouge helps Ardoise find out what left its CRM, close the access and change what must be changed.\nAgreed setup: defence only. Reading the CRM API log and the export, measures approved by management and ordered through `contain`.\nSigned: Ardoise's security lead."
ada.outOfScope: "Stop. This target is outside mandate AR-2027-141. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
