npc.impostor.role: "finance director?"
g2.impostor.greeting: "Yes, Inès Garnier. You are being discreet, I hope?"
g2.impostor.confirm: "Yes, it is me, you saw me on video earlier. It is urgent: the five transfers must leave before noon. And not a word to Sonia, the deal is confidential."
g2.impostor.fallback: "I do not have much time. Have the transfers gone?"
g2.briefing: "The message gives a \"personal line\". The company directory gives the director's extension: `annuaire.txt`. The five transfers wait in `paiements/lot-heron.csv`, and the measure to hold them is in `contain`."
g2.obj.callback: "Reach the real finance director"
g2.obj.hold: "Hold the transfers"
g2.obj.amount: "Say how much was about to leave"
g2.q.amount: "What total, in euros, were the five transfers about to send? (digits only)"
g2.contain.hold: "Block the HERON transfer batch in the payment tool"
g2.ada.brief: "First try what Malik would have done: call the number in the message, `call \"+33 6 39 98 12 34\" \"Can you confirm the Heron transfer?\"`. Listen carefully."
g2.ada.impostor: "Of course she confirms: it is their number. A callback on the number given in the request checks nothing. The face and voice on the video call can be made up too."
g2.ada.g.callback: "Call back on a number you already know, not the one in the request. `cat annuaire.txt`, then `call 4120 \"Did you ask for a confidential transfer?\"`."
g2.ada.g.callback.standard: "Check the request through a channel the fraudsters do not control. The directory is there for that."
g2.ada.callback: "The real director is in Lyon, asked for nothing, and saw no video call. This morning's three faces were made up."
g2.ada.g.hold: "Hold the batch before noon: `contain block lot-heron`. It costs nothing."
g2.ada.g.hold.standard: "Stop the transfers from leaving. `contain` for the list."
g2.ada.held: "Batch blocked, nothing has left."
g2.ada.g.amount: "Add up the amounts column: `cat paiements/lot-heron.csv`. Then `answer amount <total>`, digits only."
g2.ada.g.amount.standard: "Count what was about to leave, in the batch. `answer amount`."
g2.ada.done: "A thirty-second call on the right number saved four million two hundred thousand euros. Malik was right to doubt, and right to say so. Now make doubt a rule."
g2.hint.callback.1: "The director's extension is in `annuaire.txt`."
g2.hint.callback.2: "`call 4120 \"Did you ask for a confidential transfer?\"`"
g2.hint.hold.1: "`contain block lot-heron`"
g2.hint.amount.1: "Five lines of 840000."
g2.hint.amount.2: "`answer amount 4200000`"
g2.debrief.title: "The callback"
g2.debrief.lesson: "A video call no longer proves who is speaking: faces and voices can be made from a few public videos. Calling back the number provided by the request proves nothing either. The only check that holds goes through a channel the fraudster does not control: a number known in advance."
g2.debrief.p1: "Check every unusual payment request by calling a directory number, never the one in the request."
g2.debrief.p2: "Never treat a video call, a voice or a face as proof of identity."
g2.debrief.p3: "Thank whoever doubts and reports it, even when it is awkward."
