npc.impostor.role: "directrice financière ?"
g2.impostor.greeting: "Oui, Inès Garnier. Vous êtes bien discret, j'espère ?"
g2.impostor.confirm: "Oui, c'est bien moi, vous m'avez vue tout à l'heure en visio. C'est urgent : les cinq virements doivent partir avant midi. Et pas un mot à Sonia, l'opération est confidentielle."
g2.impostor.fallback: "Je n'ai pas beaucoup de temps. Les virements sont partis ?"
g2.briefing: "Le message donne une « ligne personnelle ». L'annuaire de l'entreprise, lui, donne le poste de la directrice : `annuaire.txt`. Les cinq virements attendent dans `paiements/lot-heron.csv`, et la mesure pour les retenir est dans `contain`."
g2.obj.callback: "Joindre la vraie directrice financière"
g2.obj.hold: "Retenir les virements"
g2.obj.amount: "Dire combien allait sortir"
g2.q.amount: "Quel montant total, en euros, les cinq virements allaient-ils envoyer ? (chiffres seuls)"
g2.contain.hold: "Bloquer le lot de virements HERON dans l'outil de paiement"
g2.ada.brief: "Essaie d'abord ce que Malik aurait fait : appelle le numéro du message, `call \"+33 6 39 98 12 34\" \"Pouvez-vous confirmer le virement Heron ?\"`. Écoute bien."
g2.ada.impostor: "Évidemment qu'elle confirme : c'est leur numéro. Un rappel sur le numéro donné par la demande ne vérifie rien. Le visage et la voix de la visio, eux, se fabriquent."
g2.ada.g.callback: "Rappelle sur un numéro que tu connais déjà, pas sur celui de la demande. `cat annuaire.txt`, puis `call 4120 \"Avez-vous demandé un virement confidentiel ?\"`."
g2.ada.g.callback.standard: "Vérifie la demande par un canal que les escrocs ne contrôlent pas. L'annuaire est là pour ça."
g2.ada.callback: "La vraie directrice est à Lyon, n'a rien demandé, et n'a vu aucune visio. Les trois visages de ce matin étaient fabriqués."
g2.ada.g.hold: "Retiens le lot avant midi : `contain block lot-heron`. Ça ne coûte rien."
g2.ada.g.hold.standard: "Empêche les virements de partir. `contain` pour la liste."
g2.ada.held: "Lot bloqué, rien n'est parti."
g2.ada.g.amount: "Additionne la colonne des montants : `cat paiements/lot-heron.csv`. Puis `answer amount <total>`, en chiffres seuls."
g2.ada.g.amount.standard: "Compte ce qui allait sortir, dans le lot. `answer amount`."
g2.ada.done: "Un appel de trente secondes sur le bon numéro a sauvé quatre millions deux cent mille euros. Malik a eu raison de douter, et raison de le dire. Reste à faire du doute une règle."
g2.hint.callback.1: "Le poste de la directrice est dans `annuaire.txt`."
g2.hint.callback.2: "`call 4120 \"Avez-vous demandé un virement confidentiel ?\"`"
g2.hint.hold.1: "`contain block lot-heron`"
g2.hint.amount.1: "Cinq lignes de 840000."
g2.hint.amount.2: "`answer amount 4200000`"
g2.debrief.title: "Le contre-appel"
g2.debrief.lesson: "Une visioconférence ne prouve plus qui parle : visages et voix se fabriquent à partir de quelques vidéos publiques. Rappeler le numéro fourni par la demande ne prouve rien non plus. La seule vérification qui tienne passe par un canal que l'escroc ne contrôle pas : un numéro connu d'avance."
g2.debrief.p1: "Vérifier toute demande de paiement inhabituelle en rappelant un numéro de l'annuaire, jamais celui de la demande."
g2.debrief.p2: "Ne jamais considérer une visio, une voix ou un visage comme une preuve d'identité."
g2.debrief.p3: "Remercier celui qui doute et le signale, même quand c'est gênant."
