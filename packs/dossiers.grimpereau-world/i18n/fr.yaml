file.readme: "Poste Ligne Rouge. Dossier : Grimpereau. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.ir.readme: "Accès de l'équipe de réponse à incident. Lecture seule ; les mesures passent par `contain`."
file.mandate: "MANDAT AT-2027-130\nClient : Groupe Altaïr, assureur. Périmètre : *.altair.test, 10.99.0.0/24.\nObjet : l'éditeur du logiciel de supervision Vigie annonce que certaines de ses mises à jour, signées par lui, contenaient une porte dérobée. Ligne Rouge aide Altaïr à savoir si elle est touchée, à couper, puis à mesurer jusqu'où l'intrus est allé.\nDispositif convenu : défense uniquement. Lecture des serveurs et des journaux, mesures validées par la direction et passées par `contain`.\nSigné : le responsable de la sécurité du Groupe Altaïr."
ada.outOfScope: "Stop. Cette cible est hors du mandat AT-2027-130. Même pour défendre, hors mandat, c'est un délit (article 323-1 du Code pénal)."
