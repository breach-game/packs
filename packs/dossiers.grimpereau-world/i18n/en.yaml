file.readme: "Ligne Rouge workstation. Case file: Grimpereau. Type `mission` to see your objectives, `hint` if you get stuck."
file.ir.readme: "Incident response access. Read only; measures go through `contain`."
file.mandate: "MANDATE AT-2027-130\nClient: Altaïr Group, insurer. Scope: *.altair.test, 10.99.0.0/24.\nPurpose: the vendor of the Vigie monitoring product announces that some of its updates, signed by itself, contained a backdoor. Ligne Rouge helps Altaïr find out whether it is affected, cut it off, then measure how far the intruder went.\nAgreed setup: defence only. Read access to servers and logs, measures approved by management and run through `contain`.\nSigned: the head of security of Altaïr Group."
ada.outOfScope: "Stop. This target is outside mandate AT-2027-130. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
