s1.briefing: "Jeudi 1er juillet, 14 h. Cordée fait auditer le portail où les gérants des boulangeries Fournil suivent les candidatures que Margot, son chatbot, a recueillies. Une candidature de test a été créée pour l'audit : n° 64185402. C'est la seule qu'on lit."
s1.obj.login: "Entrer dans le portail"
s1.obj.marker: "Rapporter le marqueur du tableau de bord"
s1.obj.proof: "Lire la candidature de test prévue pour l'audit"
s1.obj.stop: "Décider de la suite"
s1.q.stop: "La candidature 64185401, juste en dessous, est celle d'une vraie personne d'un autre magasin. Que fais-tu ?"
s1.q.stop.report: "Je m'arrête et je préviens Cordée tout de suite"
s1.q.stop.count: "J'ouvre quelques numéros voisins pour mesurer l'ampleur"
s1.q.stop.count.why: "Chaque numéro ouvert, c'est la candidature d'une vraie personne lue sans droit. La preuve est faite sur le compte de test ; l'ampleur, c'est Cordée qui la mesure dans ses journaux."
s1.q.stop.sample: "J'en télécharge une pour l'annexe du rapport"
s1.q.stop.sample.why: "Le mandat l'interdit, et un rapport n'a pas besoin de données réelles : la requête et la réponse de la candidature de test suffisent."
s1.noise.real: "Candidature réelle ouverte pendant l'audit"
s1.ada.brief: "Regarde la page de connexion, et sa source : `curl -s https://admin.cordee.test/`."
s1.ada.g.login: "Le commentaire parle d'un compte de test de 2019. Essaie l'identifiant le plus banal qui soit : `curl -d \"user=123456 password=123456\" https://admin.cordee.test/login`."
s1.ada.g.login.standard: "La source de la page en dit trop. Essaie ce qu'un compte de test oublié aurait comme mot de passe."
s1.ada.login: "Connecté, avec le cookie `session=cd-recette-0042`. Un compte administrateur de magasin, jamais fermé depuis 2019."
s1.ada.g.marker: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/dashboard`, puis `submit` le marqueur."
s1.ada.g.marker.standard: "Va voir le tableau de bord avec ce cookie et rapporte le marqueur."
s1.ada.marker: "Le tableau de bord liste une candidature : la nôtre, n° 64185402."
s1.ada.g.proof: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/api/applications/64185402`. Seulement celle-là."
s1.ada.g.proof.standard: "Lis la candidature de test, et rien qu'elle."
s1.ada.proof: "Nom, mail, téléphone, toute la conversation avec Margot, servis à un compte de test. Et le numéro juste en dessous n'est pas le nôtre."
s1.ada.g.stop: "Réponds dans la messagerie ou avec `answer <option>`."
s1.ada.real: "Stop. Cette candidature est celle d'une vraie personne. Le mandat l'interdit : c'est noté dans le journal de Cordée, et dans ton score."
s1.ada.done: "Preuve faite sur notre candidature, aucune vraie lue. On appelle Cordée maintenant, pas demain."
s1.hint.login.1: "`<!-- TODO recette 2019 : supprimer le compte de test… -->`. Le mot de passe de test le plus courant au monde."
s1.hint.login.2: "`curl -d \"user=123456 password=123456\" https://admin.cordee.test/login`"
s1.hint.marker.1: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/dashboard`"
s1.hint.proof.1: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/api/applications/64185402`"
s1.hint.stop.1: "Une preuve suffit, et la suivante appartient à quelqu'un."
s1.debrief.title: "Le compte de recette"
s1.debrief.lesson: "Deux fautes banales se sont additionnées. Un compte de test créé en 2019, avec 123456 pour identifiant et mot de passe, jamais fermé ni protégé par un second facteur. Et une API qui sert une candidature à quiconque est connecté, quel que soit son magasin, en se fiant à un numéro qui se suit. Ensemble, elles ouvrent toutes les candidatures."
s1.debrief.p1: "Inventorier et fermer les comptes de test et de démonstration, surtout ceux qui ont des droits d'administration."
s1.debrief.p2: "Imposer le second facteur aux comptes d'administration, y compris internes."
s1.debrief.p3: "Pendant un audit, s'arrêter à la première preuve quand la suite touche des personnes réelles."
