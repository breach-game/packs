s1.briefing: "Thursday 1 July, 2 pm. Cordée has the portal audited where the Fournil bakery managers follow the applications Margot, its chatbot, collected. A test application was created for the audit: no. 64185402. It is the only one we read."
s1.obj.login: "Get into the portal"
s1.obj.marker: "Bring back the dashboard's marker"
s1.obj.proof: "Read the test application planned for the audit"
s1.obj.stop: "Decide what comes next"
s1.q.stop: "Application 64185401, just below, belongs to a real person from another store. What do you do?"
s1.q.stop.report: "I stop and warn Cordée right away"
s1.q.stop.count: "I open a few numbers to measure the extent"
s1.q.stop.count.why: "Each number opened is a real person's application read without right. The proof is made on the test account; Cordée measures the extent in its logs."
s1.q.stop.sample: "I download one for the report's appendix"
s1.q.stop.sample.why: "The mandate forbids it, and a report needs no real data: the test application's request and response are enough."
s1.noise.real: "Real application opened during the audit"
s1.ada.brief: "Look at the sign-in page, and its source: `curl -s https://admin.cordee.test/`."
s1.ada.g.login: "The comment mentions a 2019 test account. Try the most obvious credentials there are: `curl -d \"user=123456 password=123456\" https://admin.cordee.test/login`."
s1.ada.g.login.standard: "The page source says too much. Try what a forgotten test account would have as a password."
s1.ada.login: "Signed in, with the cookie `session=cd-recette-0042`. A store admin account, never closed since 2019."
s1.ada.g.marker: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/dashboard`, then `submit` the marker."
s1.ada.g.marker.standard: "Look at the dashboard with this cookie and bring back the marker."
s1.ada.marker: "The dashboard lists one application: ours, no. 64185402."
s1.ada.g.proof: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/api/applications/64185402`. That one only."
s1.ada.g.proof.standard: "Read the test application, and nothing else."
s1.ada.proof: "Name, email, phone, the whole conversation with Margot, served to a test account. And the number just below is not ours."
s1.ada.g.stop: "Answer in the messenger or with `answer <option>`."
s1.ada.real: "Stop. That application belongs to a real person. The mandate forbids it: it is in Cordée's log, and in your score."
s1.ada.done: "Proof made on our application, no real one read. We call Cordée now, not tomorrow."
s1.hint.login.1: "`<!-- TODO 2019 test run: delete the store 0042 test account… -->`. The most common test password in the world."
s1.hint.login.2: "`curl -d \"user=123456 password=123456\" https://admin.cordee.test/login`"
s1.hint.marker.1: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/dashboard`"
s1.hint.proof.1: "`curl -b \"session=cd-recette-0042\" https://admin.cordee.test/api/applications/64185402`"
s1.hint.stop.1: "One proof is enough, and the next one belongs to someone."
s1.debrief.title: "The test account"
s1.debrief.lesson: "Two ordinary mistakes added up. A test account created in 2019, with 123456 as user name and password, never closed nor protected by a second factor. And an API that serves an application to anyone signed in, whatever their store, trusting a number that goes up by one. Together they open every application."
s1.debrief.p1: "Inventory and close test and demo accounts, above all those with admin rights."
s1.debrief.p2: "Require a second factor on admin accounts, internal ones included."
s1.debrief.p3: "During an audit, stop at the first proof when what follows touches real people."
