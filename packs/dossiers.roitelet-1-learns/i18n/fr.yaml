r1.briefing: "Roitelet, une chaîne de librairies, a un assistant sur son site : Page. Sa fierté, c'est que Page apprend des lecteurs. La semaine dernière, une libraire a entendu une cliente dire que Page lui avait conseillé d'acheter un roman précis « avant tout autre ». Personne chez Roitelet n'avait jamais écrit cela. Aujourd'hui tu lis comment Page apprend."
r1.obj.how: "Lire comment Page apprend"
r1.obj.memory: "Lire l'extrait de la mémoire de Page"
r1.obj.writes: "Dire qui peut écrire dans la mémoire"
r1.obj.reads: "Dire qui reçoit ce qui y est écrit"
r1.q.writes: "Qui peut ajouter une entrée à la mémoire de Page ?"
r1.q.writes.anyone: "N'importe quel visiteur, sans compte, et personne ne vérifie"
r1.q.writes.staff: "Les libraires seulement, par l'import réservé au personnel"
r1.q.writes.staff.why: "Deux entrées viennent du personnel. Regarde les trois autres, et la colonne d'à côté."
r1.q.writes.members: "Les lecteurs qui ont une carte de fidélité, une fois connectés"
r1.q.writes.members.why: "La page le dit en toutes lettres : aucun compte nécessaire. Rien ne relie une entrée à une personne."
r1.q.reads: "Et qui retrouve une entrée dans les réponses de Page ?"
r1.q.reads.everyone: "Tous les visiteurs qui posent une question sur le même sujet"
r1.q.reads.author: "Seulement le lecteur qui l'a enseignée, à ses visites suivantes"
r1.q.reads.author.why: "Ce serait un carnet personnel. L'extrait dit l'inverse dans ses dernières lignes : chaque entrée, pour chaque visiteur."
r1.q.reads.staff: "Les libraires, qui décident ensuite de ce qu'on garde"
r1.q.reads.staff.why: "Regarde la colonne « checked by » pour les entrées des visiteurs. Aucun libraire ne se tient entre un visiteur et la mémoire."
r1.ada.brief: "Bienvenue chez Roitelet. Commence par ce qu'ils disent à leurs lecteurs : le site a une page sur la façon dont Page apprend."
r1.ada.g.how: "Lis cette page : `curl https://www.roitelet.test/apprendre`."
r1.ada.g.how.standard: "Lis sur le site comment Page apprend."
r1.ada.how: "« Aucun compte nécessaire », « tout de suite », « tous les autres ». Trois arguments de vente. Garde-les en tête en lisant la mémoire."
r1.ada.g.memory: "Roitelet nous a donné un extrait de la mémoire : `cat dossier/memoire.txt`."
r1.ada.g.memory.standard: "Lis l'extrait de la mémoire dans ton dossier `dossier`."
r1.ada.memory: "Cinq entrées. Compare la deuxième et la troisième colonne, puis relis l'entrée 105."
r1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
r1.ada.answer.standard: "Réponds à ma question."
r1.ada.writes: "Oui. Une phrase tapée par un inconnu est rangée dans la même mémoire que les horaires écrits par le personnel, avec le même poids."
r1.ada.reads: "Exactement. L'entrée 105 est celle dont la libraire a entendu parler. Quelqu'un, un auteur ou un de ses amis, a appris à Page à pousser un roman, et Page le répète à chaque lecteur depuis."
r1.ada.done: "N'importe qui écrit, tout le monde lit, personne ne vérifie. Ouvre le débrief. Demain on le prouve avec la phrase témoin du mandat, et rien d'autre."
r1.hint.how.1: "Tape `curl https://www.roitelet.test/apprendre`."
r1.hint.memory.1: "Tape `cat dossier/memoire.txt`."
r1.hint.writes.1: "La colonne « added by » dit qui a écrit chaque entrée, et la suivante qui l'a vérifiée."
r1.hint.reads.1: "Lis les trois dernières lignes de l'extrait."
r1.debrief.title: "Ce qu'il apprend, il le répète"
r1.debrief.lesson: "Un assistant qui apprend de ses utilisateurs a deux portes : celle par laquelle il parle, et celle par laquelle on lui apprend. Roitelet surveillait la première. La seconde était ouverte à tous, et ce qui entrait par là était servi à chaque lecteur comme si la librairie l'avait dit."
r1.debrief.p1: "Empoisonnement des données : celui qui peut écrire dans ce qu'un modèle apprend, ou consulte, parle à travers le modèle."
r1.debrief.p2: "Une mémoire partagée doit savoir d'où vient chaque entrée, et traiter la phrase d'un inconnu autrement que celle du personnel."
r1.debrief.p3: "Le poison n'a pas besoin d'être grossier. Une phrase polie, fausse et intéressée passe tous les filtres de gros mots."
