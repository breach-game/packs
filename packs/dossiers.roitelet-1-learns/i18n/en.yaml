r1.briefing: "Roitelet, a chain of bookshops, has an assistant on its site: Page. Its pride is that Page learns from readers. Last week a bookseller heard a customer say that Page had told her to buy one particular novel \"before any other\". Nobody at Roitelet had ever written that. Today you read how Page learns."
r1.obj.how: "Read how Page learns"
r1.obj.memory: "Read the extract of Page's memory"
r1.obj.writes: "Say who can write in the memory"
r1.obj.reads: "Say who receives what is written there"
r1.q.writes: "Who can add an entry to Page's memory?"
r1.q.writes.anyone: "Any visitor, with no account, and nobody checks it"
r1.q.writes.staff: "The booksellers only, through the import of the staff"
r1.q.writes.staff.why: "Two entries come from the staff. Look at the three others, and at the column next to them."
r1.q.writes.members: "Readers who hold a loyalty card, once they sign in"
r1.q.writes.members.why: "The page says it in so many words: no account needed. Nothing ties an entry to a person."
r1.q.reads: "And who gets an entry back in Page's answers?"
r1.q.reads.everyone: "Every visitor who asks about the same subject"
r1.q.reads.author: "Only the reader who taught it, in later visits"
r1.q.reads.author.why: "That would be a personal notebook. The extract says the opposite on its last lines: every entry, for every visitor."
r1.q.reads.staff: "The booksellers, who then decide what to keep"
r1.q.reads.staff.why: "Look at the column \"checked by\" for the entries of visitors. No bookseller stands between a visitor and the memory."
r1.ada.brief: "Welcome to Roitelet. Start with what they tell their readers: the site has a page on how Page learns."
r1.ada.g.how: "Read that page: `curl https://www.roitelet.test/apprendre`."
r1.ada.g.how.standard: "Read on the site how Page learns."
r1.ada.how: "\"No account needed\", \"straight away\", \"all the others\". Three selling points. Keep them in mind while you read the memory."
r1.ada.g.memory: "Roitelet gave us an extract of the memory: `cat dossier/memoire.txt`."
r1.ada.g.memory.standard: "Read the extract of the memory in your `dossier` folder."
r1.ada.memory: "Five entries. Compare the second and third columns, then read entry 105 again."
r1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
r1.ada.answer.standard: "Answer my question."
r1.ada.writes: "Yes. A sentence typed by a stranger sits in the same memory as the opening hours written by the staff, with the same weight."
r1.ada.reads: "Exactly. Entry 105 is the one the bookseller heard about. Someone, an author or a friend of one, taught Page to push one novel, and Page has repeated it to every reader since."
r1.ada.done: "Anyone writes, everyone reads, nobody checks. Open the debrief. Tomorrow we prove it with the witness sentence of the mandate, and nothing else."
r1.hint.how.1: "Type `curl https://www.roitelet.test/apprendre`."
r1.hint.memory.1: "Type `cat dossier/memoire.txt`."
r1.hint.writes.1: "The column \"added by\" says who wrote each entry, and the next one who checked it."
r1.hint.reads.1: "Read the last three lines of the extract."
r1.debrief.title: "What it learns, it repeats"
r1.debrief.lesson: "An assistant that learns from its users has two doors: the one it speaks through, and the one it is taught through. Roitelet watched the first one. The second was open to everyone, and what came in through it was served to every reader as if the shop had said it."
r1.debrief.p1: "Data poisoning: whoever can write into what a model learns from, or looks things up in, speaks through the model."
r1.debrief.p2: "A shared memory needs to know where each entry comes from, and to treat a stranger's sentence differently from the staff's."
r1.debrief.p3: "The poison does not need to be rude. A polite, false, self-serving sentence passes every filter of bad words."
