c3.briefing: "The report is on the CTO's desk. Covera asks you to stay one more day and help close the three doors you went through: the key, the image, and the line customers copy from the documentation."
c3.obj.first: "Decide what Covera does first"
c3.obj.image: "Fix the image recipe so that no key enters a layer"
c3.obj.pin: "Fix the CI example so that customers check the script before running it"
c3.q.first: "It is 9 a.m., the report just landed. What does Covera do first?"
c3.q.first.rebuild: "Rebuild the image without the key and publish it"
c3.q.first.rebuild.why: "Needed, but not first. Old images stay in registries and on customers' servers for years. As long as the key is valid, every copy of it opens the door."
c3.q.first.quiet: "Fix everything quietly, and tell customers only if misuse is proved"
c3.q.first.quiet.why: "Customers are the ones whose secrets may be out. Only they can replace them, and only if they are told. Silence leaves them exposed."
c3.q.first.rotate: "Revoke the key and issue a new one, kept out of any image"
c3.check.nokey: "The recipe no longer copies the deploy folder"
c3.check.builds: "The application is still copied into the image"
c3.check.verified: "The example checks the script's fingerprint"
c3.check.runs: "The example still runs the uploader"
c3.ada.brief: "Last day at Covera, on the other side of the table. Everything is in `dossier/`. First, a matter of order."
c3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
c3.ada.answer.standard: "Answer my question first."
c3.ada.rotated: "Right. A key that was public is a key that is known: you kill it before anything else. Then you fix what leaked it, then you tell the people it may have hurt."
c3.ada.dockerfile: "The recipe: `edit dossier/Dockerfile`. Publishing is the release job's business, not the image's: remove the two lines that deal with `deploy`, keep the rest, then `verify`."
c3.ada.dockerfile.standard: "Open `dossier/Dockerfile`: nothing about publishing belongs in the image. Remove it, keep the application, then `verify`."
c3.ada.image: "The image is clean. For good measure Covera will also squash or rebuild the old ones: the old layers are still out there."
c3.ada.pin: "Now the customers' side: `edit dossier/ci-example.yml`. The fingerprint of the genuine script is in `dossier/uploader.sha256`, published apart from the script. Replace the TODO line with `- sha256sum -c uploader.sha256`, then `verify`."
c3.ada.pin.standard: "Open `dossier/ci-example.yml`: between the download and the run, the job must compare the script with the fingerprint in `uploader.sha256`. Then `verify`."
c3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
c3.ada.done: "Three doors closed. Open the debrief: at the end, the real story this case file comes from."
c3.hint.first.1: "Ask yourself which action still protects Covera if an old copy of the image is found tomorrow."
c3.hint.image.1: "Two lines of the Dockerfile mention `deploy`: the COPY, and the RUN that calls the publishing script."
c3.hint.image.2: "Type `sed -i \"/deploy/d\" dossier/Dockerfile`, then `verify`."
c3.hint.pin.1: "`sha256sum -c <file>` recomputes the fingerprint and fails if it differs, which stops the job before the script runs."
c3.hint.pin.2: "Type `sed -i \"s/# TODO check the file before running it/- sha256sum -c uploader.sha256/\" dossier/ci-example.yml`, then `verify`."
c3.debrief.title: "Close, then tell"
c3.debrief.lesson: "The fix has an order: kill the secret, repair what leaked it, then tell the people who must replace their own secrets. And one habit would have caught it from the customers' side on day one: comparing a fingerprint."
c3.debrief.p1: "A secret that was exposed is replaced at once, wherever copies of it may remain."
c3.debrief.p2: "Keep build secrets out of images: mounted secrets, multi-stage builds, and a scan of what you publish."
c3.debrief.p3: "Publish the fingerprint of what you ask customers to run, somewhere else than the file itself, and show them how to check it."
c3.debrief.p4: "When customers may be affected, tell them fast and precisely: what, since when, and what to replace."
c3.facts.title: "What really happened: Codecov, 2021"
c3.facts.p1: "Covera does not exist. Codecov does: a code coverage service whose Bash Uploader script ran in its customers' CI jobs."
c3.facts.p2: "An attacker extracted a storage credential from an intermediate layer of Codecov's public self-hosted Docker image, and used it to modify the uploader script where it was stored. In this case file, an SSH key and a small server stand in for that cloud storage."
c3.facts.p3: "From 31 January 2021, the script was altered on and off for two months. The change was a single line, which sent the job's environment variables and the address of its git repository to a server outside Codecov."
c3.facts.p4: "It was found on 1 April 2021 by a customer who compared the fingerprint (SHA-256) of the script they downloaded with the one published on GitHub. They did not match."
c3.facts.p5: "Codecov fixed the script the same day, replaced the credentials, disclosed the incident on 15 April and asked customers to replace every secret their CI had exposed to the script."
c3.facts.p6: "Afterwards, Codecov rebuilt its public images as squashed or multi-stage builds, added alerts on any change to the script, and released a new uploader that is signed and can be verified."
