c3.briefing: "Le rapport est sur le bureau du directeur technique. Covera te demande de rester un jour de plus pour fermer les trois portes par lesquelles tu es passé : la clé, l'image, et la ligne que les clients copient depuis la documentation."
c3.obj.first: "Décider ce que Covera fait en premier"
c3.obj.image: "Corriger la recette de l'image pour qu'aucune clé n'entre dans une couche"
c3.obj.pin: "Corriger l'exemple de CI pour que les clients vérifient le script avant de l'exécuter"
c3.q.first: "Il est 9 h, le rapport vient d'arriver. Que fait Covera en premier ?"
c3.q.first.rebuild: "Reconstruire l'image sans la clé et la publier"
c3.q.first.rebuild.why: "Nécessaire, mais pas en premier. Les anciennes images restent des années dans les registres et sur les serveurs des clients. Tant que la clé est valide, chacune de ses copies ouvre la porte."
c3.q.first.quiet: "Tout corriger discrètement, et ne prévenir les clients que si un abus est prouvé"
c3.q.first.quiet.why: "Ce sont les secrets des clients qui sont peut-être dehors. Eux seuls peuvent les remplacer, et seulement s'ils sont prévenus. Le silence les laisse exposés."
c3.q.first.rotate: "Révoquer la clé et en créer une nouvelle, tenue hors de toute image"
c3.check.nokey: "La recette ne copie plus le dossier deploy"
c3.check.builds: "L'application est toujours copiée dans l'image"
c3.check.verified: "L'exemple vérifie l'empreinte du script"
c3.check.runs: "L'exemple exécute toujours le script d'envoi"
c3.ada.brief: "Dernier jour chez Covera, de l'autre côté de la table. Tout est dans `dossier/`. D'abord, une question d'ordre."
c3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
c3.ada.answer.standard: "Réponds d'abord à ma question."
c3.ada.rotated: "Oui. Une clé qui a été publique est une clé connue : on la tue avant tout le reste. Ensuite on répare ce qui l'a laissée fuir, puis on prévient ceux que cela a pu toucher."
c3.ada.dockerfile: "La recette : `edit dossier/Dockerfile`. Publier, c'est l'affaire du job de livraison, pas de l'image : enlève les deux lignes qui parlent de `deploy`, garde le reste, puis `verify`."
c3.ada.dockerfile.standard: "Ouvre `dossier/Dockerfile` : rien de ce qui sert à publier n'a sa place dans l'image. Enlève-le, garde l'application, puis `verify`."
c3.ada.image: "L'image est propre. Pour faire bonne mesure, Covera va aussi aplatir ou reconstruire les anciennes : les vieilles couches circulent encore."
c3.ada.pin: "Maintenant le côté des clients : `edit dossier/ci-example.yml`. L'empreinte du vrai script est dans `dossier/uploader.sha256`, publiée à part du script. Remplace la ligne TODO par `- sha256sum -c uploader.sha256`, puis `verify`."
c3.ada.pin.standard: "Ouvre `dossier/ci-example.yml` : entre le téléchargement et l'exécution, le job doit comparer le script à l'empreinte de `uploader.sha256`. Puis `verify`."
c3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier et relance `verify`."
c3.ada.done: "Trois portes fermées. Ouvre le débrief : à la fin, la vraie histoire d'où vient ce dossier."
c3.hint.first.1: "Demande-toi quelle action protège encore Covera si quelqu'un retrouve demain une vieille copie de l'image."
c3.hint.image.1: "Deux lignes du Dockerfile parlent de `deploy` : le COPY, et le RUN qui appelle le script de publication."
c3.hint.image.2: "Tape `sed -i \"/deploy/d\" dossier/Dockerfile`, puis `verify`."
c3.hint.pin.1: "`sha256sum -c <fichier>` recalcule l'empreinte et échoue si elle diffère, ce qui arrête le job avant que le script ne tourne."
c3.hint.pin.2: "Tape `sed -i \"s/# TODO check the file before running it/- sha256sum -c uploader.sha256/\" dossier/ci-example.yml`, puis `verify`."
c3.debrief.title: "Fermer, puis prévenir"
c3.debrief.lesson: "La correction a un ordre : tuer le secret, réparer ce qui l'a laissé fuir, puis prévenir ceux qui doivent remplacer leurs propres secrets. Et une habitude aurait tout arrêté dès le premier jour, côté clients : comparer une empreinte."
c3.debrief.p1: "Un secret qui a été exposé se remplace tout de suite, où que puissent traîner ses copies."
c3.debrief.p2: "Tenir les secrets de build hors des images : secrets montés, builds en plusieurs étapes, et recherche de secrets dans ce qu'on publie."
c3.debrief.p3: "Publier l'empreinte de ce qu'on demande aux clients d'exécuter, ailleurs que le fichier lui-même, et leur montrer comment la vérifier."
c3.debrief.p4: "Quand des clients peuvent être touchés, les prévenir vite et précisément : quoi, depuis quand, et quoi remplacer."
c3.facts.title: "Ce qui s'est vraiment passé : Codecov, 2021"
c3.facts.p1: "Covera n'existe pas. Codecov, si : un service de couverture de code dont le script « Bash Uploader » tournait dans les jobs de CI de ses clients."
c3.facts.p2: "Un attaquant a extrait un identifiant de stockage d'une couche intermédiaire de l'image Docker publique de la version auto-hébergée de Codecov, et s'en est servi pour modifier le script là où il était stocké. Dans ce dossier, une clé SSH et un petit serveur remplacent ce stockage cloud."
c3.facts.p3: "À partir du 31 janvier 2021, le script a été modifié par intermittence pendant deux mois. Le changement tenait en une seule ligne, qui envoyait les variables d'environnement du job et l'adresse de son dépôt git vers un serveur extérieur à Codecov."
c3.facts.p4: "Tout a été découvert le 1er avril 2021 par un client qui a comparé l'empreinte (SHA-256) du script qu'il téléchargeait avec celle publiée sur GitHub. Elles ne correspondaient pas."
c3.facts.p5: "Codecov a corrigé le script le jour même, remplacé les identifiants, rendu l'incident public le 15 avril et demandé à ses clients de remplacer tous les secrets que leur CI avait exposés au script."
c3.facts.p6: "Ensuite, Codecov a reconstruit ses images publiques en les aplatissant ou en plusieurs étapes, ajouté des alertes sur toute modification du script, et publié un nouvel outil d'envoi signé et vérifiable."
