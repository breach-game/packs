summary:
  fr: "La directrice a lu qu'« on lit tous vos mots de passe sur le Wi-Fi d'un café » et veut couper le Wi-Fi invités. Tu relis la capture prise avant l'ouverture : les voyageurs ne laissent voir que des noms de sites. Ce qui fuit vraiment, c'est la tablette de fidélité du café."
  en: "The manager read that \"anyone can read your passwords on a café's Wi-Fi\" and wants to shut the guest Wi-Fi. You read the capture taken before opening: travellers only show the names of sites. What really leaks is the café's own loyalty tablet."
