w1.briefing: "Lundi, 8 h, L'Escale de la gare Sud. La directrice veut couper le Wi-Fi invités ce soir : elle a lu qu'à la table d'à côté on lit vos mots de passe (`note-directrice.txt`). L'informatique a pris une capture à 7 h 30, avant l'ouverture, avec deux téléphones de test et les appareils du café : `captures/invites-0730.pcap`."
w1.obj.read: "Lire la capture du Wi-Fi invités"
w1.obj.seen: "Dire ce qu'un voisin voit vraiment"
w1.obj.clear: "Trouver le serveur qui reçoit des données en clair"
w1.obj.fix: "Corriger les réglages de la tablette de fidélité"
w1.obj.verdict: "Répondre à la directrice"
w1.ada.brief: "Bonne question, et elle mérite une réponse honnête. Il y a dix ans, oui. Aujourd'hui, regardons ce qu'il y a vraiment dans la capture avant de décider quoi que ce soit."
w1.ada.g.read: "Lis le mot de la directrice, `cat note-directrice.txt`, puis la capture : `tshark -r captures/invites-0730.pcap`."
w1.ada.g.read.standard: "Lis le mot de la directrice, puis la capture avec `tshark`."
w1.ada.read: "Regarde les lignes TLS et QUIC : un nom de site, une taille, et « Application Data ». La banque, la messagerie, la vidéo : des noms, jamais ce qui a été tapé. Un site ne montre même pas son nom. Réponds à ma question."
w1.ada.answer: "Réponds à ma question : clique, ou utilise `answer` dans le terminal."
w1.ada.answer.standard: "Ma question t'attend dans la messagerie."
w1.ada.seen: "Voilà l'exposition réelle aujourd'hui sur un Wi-Fi partagé : à qui tu parles, pas ce que tu dis. Maintenant, une ligne ne ressemble pas aux autres."
w1.ada.g.clear: "N'affiche que le HTTP simple, en détail : `tshark -r captures/invites-0730.pcap -Y http -V`. Quel serveur reçoit des données en clair ? Réponds avec `answer server <nom>`."
w1.ada.g.clear.standard: "Filtre la capture sur le HTTP simple et nomme le serveur qui reçoit des données en clair, avec `answer server`."
w1.ada.http: "10.115.0.20, c'est la tablette de fidélité du comptoir. Le numéro d'un membre, son e-mail et ses points, lisibles par tout le réseau. Nomme le serveur : `answer server <nom>`."
w1.ada.http.standard: "À qui est l'appareil 10.115.0.20, et à quel serveur parle-t-il ?"
w1.ada.clear: "Les voyageurs ne risquaient rien. Le café, si : sa propre tablette, sur son propre Wi-Fi invités, en HTTP simple. Ses réglages sont dans `caisse/fidelite.conf`."
w1.ada.g.fix: "Ouvre `caisse/fidelite.conf` (`edit` ou `sed -i`) : l'adresse doit commencer par https, et la tablette a sa place sur le réseau de l'équipe. Puis `verify`."
w1.ada.g.fix.standard: "Corrige les deux lignes de `caisse/fidelite.conf`, puis `verify`. Pour ouvrir le fichier : `edit caisse/fidelite.conf`."
w1.ada.fix: "Chiffrée, et sortie du réseau des invités. Maintenant, que dit-on à la directrice ? Réponds à ma question."
w1.ada.done: "Le mythe tombe, la vraie fuite est réparée, et le Wi-Fi invités reste allumé. Mais un réseau peut mentir sur qui il est. Débrief."
w1.q.server: "Quel serveur reçoit en clair les données des membres ? (le nom, par exemple example.test)"
w1.q.seen: "Sur cette capture, que voit un invité de la table d'à côté des téléphones de test ?"
w1.q.seen.names: "Les noms des sites visités et la quantité échangée, mais pas le contenu."
w1.q.seen.password: "Le mot de passe de la banque tapé sur le téléphone, puisque le réseau est ouvert."
w1.q.seen.password.why: "Relis les lignes TLS : le trafic de la banque est « Application Data », chiffré par HTTPS quel que soit le Wi-Fi."
w1.q.seen.nothing: "Rien du tout : HTTPS cache tout, même le nom des sites."
w1.q.seen.nothing.why: "Les requêtes DNS et le SNI montrent les noms. Seul le site qui utilise ECH cache le sien."
w1.q.verdict: "Que dis-tu à la directrice ?"
w1.q.verdict.keep: "Garder le Wi-Fi invités : HTTPS protège le contenu, et la seule fuite était notre tablette, corrigée."
w1.q.verdict.cut: "Le couper : un Wi-Fi ouvert expose toujours les mots de passe des clients."
w1.q.verdict.cut.why: "La capture montre l'inverse : aucun mot de passe, aucun contenu. Couper le Wi-Fi n'aurait pas réparé la tablette."
w1.q.verdict.vpn: "Le garder, mais exiger que chaque client installe d'abord un VPN, sinon rien n'est sûr."
w1.q.verdict.vpn.why: "HTTPS protège déjà le contenu. Un VPN cache les noms au café, mais ce n'est pas une condition pour utiliser son Wi-Fi."
w1.check.https: "La tablette envoie les points en HTTPS"
w1.check.staff: "La tablette est sur le réseau de l'équipe"
w1.hint.read.1: "`tshark -r captures/invites-0730.pcap` liste chaque trame, une par ligne."
w1.hint.seen.1: "Dans les lignes TLS, regarde ce qui se lit : le nom après SNI, et « Application Data »."
w1.hint.clear.1: "`-Y http` ne garde que le HTTP simple, `-V` montre le détail."
w1.hint.clear.2: "La tablette poste vers `fidelite.escale.test` : `answer server fidelite.escale.test`."
w1.hint.fix.1: "Avec l'éditeur : `edit caisse/fidelite.conf`, puis Ctrl+S. Avec une commande : `sed -i 's|server_url: http://|server_url: https://|' caisse/fidelite.conf`"
w1.hint.fix.2: "Avec l'éditeur : `edit caisse/fidelite.conf`, puis Ctrl+S. Avec une commande : `sed -i 's/network: guest/network: staff/' caisse/fidelite.conf`, puis `verify`."
w1.hint.verdict.1: "Qu'a vraiment montré la capture des voyageurs, et quelle était la seule fuite ?"
w1.debrief.title: "Des noms, pas du contenu"
w1.debrief.lesson: "Sur le Wi-Fi d'un café en 2029, HTTPS couvre presque toutes les pages : un voisin voit quels sites tu visites et combien tu échanges, pas ce que tu tapes. Même le nom commence à disparaître (DNS chiffré, ECH). Ce qui fuit encore, c'est ce qui parle encore en HTTP simple, et c'est souvent l'équipement du lieu lui-même : une tablette, une caisse, une imprimante, un écran."
w1.debrief.p1: "Le DNS et le SNI trahissent les noms. Le DNS chiffré et ECH, désormais normalisé, commencent à les cacher aussi."
w1.debrief.p2: "Le HTTP simple se lit par tout le monde sur le même réseau : les appareils du café n'ont rien à faire sur le Wi-Fi des invités."
w1.debrief.p3: "Couper le Wi-Fi par peur n'aurait rien réparé : la tablette aurait continué à parler en clair."
w1.home.p1: "Sur un Wi-Fi public, un site en https est protégé. N'accepte jamais d'avertissement de certificat à ce moment-là : c'est justement là que ça cesse d'être vrai."
w1.home.p2: "Garde tes applis à jour : une vieille appli parle parfois encore en clair."
w1.home.p3: "Active le DNS chiffré sur ton téléphone ou ton ordinateur s'il le propose."
