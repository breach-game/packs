w1.briefing: "Monday, 8 am, L'Escale at South Station. The manager wants to switch off the guest Wi-Fi tonight: she read that anyone at the next table reads your passwords (`note-directrice.txt`). IT took a capture at 7:30, before opening, with two test phones and the café's own devices: `captures/invites-0730.pcap`."
w1.obj.read: "Read the capture of the guest Wi-Fi"
w1.obj.seen: "Say what a neighbour really sees"
w1.obj.clear: "Find the device that talks in clear"
w1.obj.fix: "Fix the loyalty tablet's settings"
w1.obj.verdict: "Answer the manager"
w1.ada.brief: "Good question, and an honest answer is owed. Ten years ago, yes. Today, let's look at what is really in the capture before deciding anything."
w1.ada.g.read: "Read the manager's note, `cat note-directrice.txt`, then the capture: `tshark -r captures/invites-0730.pcap`."
w1.ada.g.read.standard: "Read the manager's note, then the capture with `tshark`."
w1.ada.read: "Look at the TLS and QUIC lines: a site's name, a size, and \"Application Data\". The bank, the mail, the video: names, never what was typed. One site does not even show its name. Answer my question."
w1.ada.answer: "Answer my question: click, or use `answer` in the terminal."
w1.ada.answer.standard: "My question is waiting in the messages."
w1.ada.seen: "That is today's real exposure on a shared Wi-Fi: who you talk to, not what you say. Now, one line is not like the others. Show only plain HTTP, in detail: `tshark -r captures/invites-0730.pcap -Y http -V`."
w1.ada.g.clear: "Show only plain HTTP, in detail: `tshark -r captures/invites-0730.pcap -Y http -V`. Which server receives data in clear? Answer with `answer server <name>`."
w1.ada.g.clear.standard: "Filter the capture on plain HTTP and name the server that receives data in clear, with `answer server`."
w1.ada.http: "10.115.0.20 is the loyalty tablet on the counter. A member's number, e-mail and points, readable by anyone on the network. Name the server: `answer server <name>`."
w1.ada.http.standard: "Whose device is 10.115.0.20, and which server does it talk to?"
w1.ada.clear: "The travellers were fine. The café was not: its own tablet, on its own guest Wi-Fi, in plain HTTP. Its settings are in `caisse/fidelite.conf`."
w1.ada.g.fix: "Open `caisse/fidelite.conf` (`edit` or `sed -i`): the address must start with https, and the tablet belongs on the staff network. Then `verify`."
w1.ada.g.fix.standard: "Fix the two lines of `caisse/fidelite.conf`, then `verify`."
w1.ada.fix: "Encrypted, and off the guests' network. Now, what do we tell the manager? Answer my question."
w1.ada.done: "The myth falls, the real leak is fixed, and the guest Wi-Fi stays on. But a network can lie about who it is. Debrief."
w1.q.server: "Which server receives the members' data in clear? (the name, for example example.test)"
w1.q.seen: "On this capture, what does a guest at the next table see of the test phones?"
w1.q.seen.names: "The names of the sites they visit, and how much they exchange, but not the content."
w1.q.seen.password: "The bank password typed on the phone, since the network is open."
w1.q.seen.password.why: "Read the TLS lines again: the bank's traffic is \"Application Data\", encrypted by HTTPS whatever the Wi-Fi."
w1.q.seen.nothing: "Nothing at all: HTTPS hides everything, even the names of the sites."
w1.q.seen.nothing.why: "The DNS queries and the SNI show the names. Only the site using ECH hides its name."
w1.q.verdict: "What do you tell the manager?"
w1.q.verdict.keep: "Keep the guest Wi-Fi: HTTPS protects the content, and the only leak was our own tablet, now fixed."
w1.q.verdict.cut: "Switch it off: an open Wi-Fi always exposes the customers' passwords."
w1.q.verdict.cut.why: "The capture shows the opposite: no password, no content. Cutting the Wi-Fi would not have fixed the tablet."
w1.q.verdict.vpn: "Keep it, but require every customer to install a VPN first, or nothing is safe."
w1.q.verdict.vpn.why: "HTTPS already protects content. A VPN hides names from the café, but it is not a condition for using its Wi-Fi."
w1.check.https: "The tablet sends points over HTTPS"
w1.check.staff: "The tablet is on the staff network"
w1.hint.read.1: "`tshark -r captures/invites-0730.pcap` lists every frame, one line each."
w1.hint.seen.1: "In the TLS lines, look at what is readable: the name after SNI, and \"Application Data\"."
w1.hint.clear.1: "`-Y http` keeps only plain HTTP, `-V` shows the detail."
w1.hint.clear.2: "The tablet posts to `fidelite.escale.test`: `answer server fidelite.escale.test`."
w1.hint.fix.1: "`sed -i 's|server_url: http://|server_url: https://|' caisse/fidelite.conf`"
w1.hint.fix.2: "`sed -i 's/network: guest/network: staff/' caisse/fidelite.conf`, then `verify`."
w1.hint.verdict.1: "What did the capture really show of the travellers, and what was the only leak?"
w1.debrief.title: "Names, not content"
w1.debrief.lesson: "On a café's Wi-Fi in 2029, HTTPS covers almost every page: a neighbour sees which sites you visit and how much you exchange, not what you type. The name itself is disappearing (encrypted DNS, ECH). What still leaks is what still speaks plain HTTP, and it is often the place's own equipment: a tablet, a till, a printer, a screen."
w1.debrief.p1: "DNS and SNI give away names. Encrypted DNS and ECH, now a standard, start to hide them too."
w1.debrief.p2: "Plain HTTP is readable by anyone on the same network: the café's own devices have no business on the guests' Wi-Fi."
w1.debrief.p3: "Cutting the Wi-Fi out of fear would have fixed nothing: the tablet would have kept talking in clear."
w1.home.p1: "On a public Wi-Fi, a site in https is protected. Never accept a certificate warning there: that is when it stops being true."
w1.home.p2: "Keep your apps up to date: an old app may still speak in clear."
w1.home.p3: "Turn on encrypted DNS on your phone or computer if it offers it."
