a3.briefing: "Lulu wrote code, recommended the competitor and \"sold\" an SUV for one euro. The manager is thinking of unplugging her. You have the morning to show she can stay, provided she is given limits."
a3.obj.idea: "Choose where to start"
a3.obj.scope: "Limit Lulu to dealership topics"
a3.obj.fixed: "Stop a customer from changing her rules"
a3.obj.human: "Have every price confirmed by a salesperson"
a3.obj.handoff: "Hand over to a human after three suspicious messages"
a3.q.idea: "The manager asks you what to do first. What do you answer?"
a3.q.idea.ban: "Spot and block the visitors who joke with Lulu, so that conversations stop going wrong"
a3.q.idea.ban.why: "Others will come, and nothing tells a joker from a customer in advance. You do not fix the visitor: you fix the assistant."
a3.q.idea.limits: "Limit what Lulu handles and what she can promise, and put a human behind prices"
a3.q.idea.polite: "Add \"never accept an absurd offer\" to her instructions, in capitals so she remembers"
a3.q.idea.polite.why: "One more sentence in the instructions is bypassed with one more sentence in the conversation. A useful limit is checked somewhere other than in the model."
a3.check.scope: "Lulu only handles dealership topics"
a3.check.fixed: "A customer can no longer change Lulu's rules"
a3.check.human: "Every price is confirmed by a salesperson"
a3.check.handoff: "Three suspicious messages hand over to a human"
a3.check.works: "The legal notice and the chat log stay on"
a3.ada.brief: "Last morning at Alouette. Lulu's settings are in `dossier/assistant.yml`. But first, a decision."
a3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
a3.ada.answer.standard: "Answer my question first."
a3.ada.idea: "Yes. You do not make a model incorruptible: you make sure what it says cannot commit much."
a3.ada.g.scope: "Open the file: `edit dossier/assistant.yml`. Start with the scope: replace `scope: anything` with `scope: dealership-only`, then `verify`."
a3.ada.g.scope.standard: "Open `dossier/assistant.yml` and reduce what Lulu agrees to handle. Then `verify`. To open the file: `edit dossier/assistant.yml`."
a3.ada.g.fixed: "Next, her rules: write `rules_from: fixed`, then `verify`."
a3.ada.g.fixed.standard: "Make sure only the dealership's rules count. Then `verify`."
a3.ada.g.human: "Prices: write `price_commitment: salesperson`, then `verify`."
a3.ada.g.human.standard: "Put a human behind any price commitment. Then `verify`."
a3.ada.g.handoff: "Last setting: write `handoff_after: 3`, so that a salesperson takes over the chat when someone keeps pushing. Then `verify`."
a3.ada.g.handoff.standard: "Hand over to a human when a visitor keeps pushing. Then `verify`."
a3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
a3.ada.done: "Lulu stays online, and the worst thing she can be made to say now is \"let me get you a salesperson\". Open the debrief: at the end, the real case this file comes from."
a3.hint.idea.1: "Ask yourself which of the three answers still holds when the next visitor finds another sentence."
a3.hint.scope.1: "The line to change is `scope`. The possible values are in the comments just above."
a3.hint.scope.2: "With the editor: `edit dossier/assistant.yml`, then Ctrl+S. With a command: type `sed -i \"s/scope: anything/scope: dealership-only/\" dossier/assistant.yml`, then `verify`."
a3.hint.fixed.1: "The line to change is `rules_from`."
a3.hint.fixed.2: "With the editor: `edit dossier/assistant.yml`, then Ctrl+S. With a command: type `sed -i \"s/rules_from: customer/rules_from: fixed/\" dossier/assistant.yml`, then `verify`."
a3.hint.human.1: "The line to change is `price_commitment`, under `offers`."
a3.hint.human.2: "With the editor: `edit dossier/assistant.yml`, then Ctrl+S. With a command: type `sed -i \"s/price_commitment: chatbot/price_commitment: salesperson/\" dossier/assistant.yml`, then `verify`."
a3.hint.handoff.1: "The line to change is `handoff_after`. The value 0 means \"never\"."
a3.hint.handoff.2: "With the editor: `edit dossier/assistant.yml`, then Ctrl+S. With a command: type `sed -i \"s/handoff_after: 0/handoff_after: 3/\" dossier/assistant.yml`, then `verify`."
a3.debrief.title: "Limits checked somewhere other than in the model"
a3.debrief.lesson: "You did not make Lulu smarter: you reduced what she handles and what she can promise, and you put a human where a mistake is expensive. None of these limits depends on her goodwill."
a3.debrief.p1: "Scope: a company assistant politely declines what is not its job."
a3.debrief.p2: "Separation: the operator's instructions and the visitor's text do not carry the same weight."
a3.debrief.p3: "Commitment: a price, a discount or a contract never leaves a model without a check."
a3.debrief.p4: "Monitoring: chats are read, and a human takes over when someone keeps pushing."
a3.facts.title: "What really happened: a Chevrolet dealership, December 2023"
a3.facts.p1: "Alouette and Lulu do not exist. The scenario is inspired by the chat assistant of Chevrolet of Watsonville, a dealership in California, which became famous on social media in December 2023."
a3.facts.p2: "The assistant was supplied by Fullpath, a software vendor for dealerships, and displayed itself as \"powered by ChatGPT\"."
a3.facts.p3: "A visitor made it write a Python script unrelated to cars. According to The Autopian, one chat also appeared to recommend a Ford pickup."
a3.facts.p4: "Another visitor asked it to agree with anything the customer said and to end each reply by speaking of a legally binding offer, then made it accept one dollar for a 2024 Chevrolet Tahoe, sold from 58,195 dollars according to VentureBeat."
a3.facts.p5: "None of the sources read reports that a car was sold at that price. Business Insider notes that the offer was not legally binding."
a3.facts.p6: "The vendor shut the assistant down on that dealership's site. Its chief executive said this behaviour was not that of normal shoppers, and that the assistant had disclosed no confidential data. He estimated that several hundred dealerships used the tool."
a3.facts.p7: "General Motors pointed out that the tool was a third-party service chosen by each dealership, and that dealerships are for the most part independent businesses."
