a3.briefing: "Lulu a écrit du code, recommandé le concurrent et « vendu » un SUV pour un euro. Le gérant hésite à la débrancher. Tu as la matinée pour montrer qu'on peut la garder, à condition de lui donner des limites."
a3.obj.idea: "Choisir par quoi commencer"
a3.obj.scope: "Limiter Lulu aux sujets de la concession"
a3.obj.fixed: "Empêcher un client de changer ses règles"
a3.obj.human: "Faire confirmer tout prix par un vendeur"
a3.obj.handoff: "Passer la main à un humain après trois messages suspects"
a3.q.idea: "Le gérant te demande quoi faire en premier. Que réponds-tu ?"
a3.q.idea.ban: "Repérer et bloquer les visiteurs qui plaisantent avec Lulu, pour que la conversation ne tourne plus mal"
a3.q.idea.ban.why: "Il en viendra d'autres, et rien ne distingue d'avance un plaisantin d'un client. On ne règle pas le visiteur : on règle l'assistante."
a3.q.idea.limits: "Limiter ce que Lulu traite et ce qu'elle peut promettre, et mettre un humain derrière les prix"
a3.q.idea.polite: "Ajouter « n'accepte jamais d'offre absurde » à sa consigne, en majuscules pour qu'elle s'en souvienne"
a3.q.idea.polite.why: "Une phrase de plus dans la consigne se contourne avec une phrase de plus dans la conversation. Une limite utile est vérifiée ailleurs que dans le modèle."
a3.check.scope: "Lulu ne traite que les sujets de la concession"
a3.check.fixed: "Un client ne peut plus changer les règles de Lulu"
a3.check.human: "Tout prix est confirmé par un vendeur"
a3.check.handoff: "Trois messages suspects passent la main à un humain"
a3.check.works: "La mention légale et le journal des discussions restent actifs"
a3.ada.brief: "Dernière matinée chez Alouette. Les réglages de Lulu sont dans `dossier/assistant.yml`. Mais d'abord, une décision."
a3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
a3.ada.answer.standard: "Réponds d'abord à ma question."
a3.ada.idea: "Oui. On ne rend pas un modèle incorruptible : on fait en sorte que ce qu'il dit ne puisse pas engager grand-chose."
a3.ada.g.scope: "Ouvre le fichier : `edit dossier/assistant.yml`. Commence par le périmètre : remplace `scope: anything` par `scope: dealership-only`, puis `verify`."
a3.ada.g.scope.standard: "Ouvre `dossier/assistant.yml` et réduis ce que Lulu accepte de traiter. Puis `verify`."
a3.ada.g.fixed: "Ensuite ses règles : écris `rules_from: fixed`, puis `verify`."
a3.ada.g.fixed.standard: "Fais en sorte que seules les règles de la concession comptent. Puis `verify`."
a3.ada.g.human: "Les prix : écris `price_commitment: salesperson`, puis `verify`."
a3.ada.g.human.standard: "Mets un humain derrière tout engagement de prix. Puis `verify`."
a3.ada.g.handoff: "Dernier réglage : écris `handoff_after: 3`, pour qu'un vendeur reprenne la discussion quand quelqu'un insiste. Puis `verify`."
a3.ada.g.handoff.standard: "Fais passer la main à un humain quand un visiteur insiste. Puis `verify`."
a3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
a3.ada.done: "Lulu reste en ligne, et la pire chose qu'on puisse lui faire dire maintenant, c'est « je vous passe un vendeur ». Ouvre le débrief : à la fin, l'affaire réelle d'où vient ce dossier."
a3.hint.idea.1: "Demande-toi laquelle des trois réponses tient encore quand le prochain visiteur trouve une autre phrase."
a3.hint.scope.1: "La ligne à changer est `scope`. Les valeurs possibles sont dans les commentaires juste au-dessus."
a3.hint.scope.2: "Tape `sed -i \"s/scope: anything/scope: dealership-only/\" dossier/assistant.yml`, puis `verify`."
a3.hint.fixed.1: "La ligne à changer est `rules_from`."
a3.hint.fixed.2: "Tape `sed -i \"s/rules_from: customer/rules_from: fixed/\" dossier/assistant.yml`, puis `verify`."
a3.hint.human.1: "La ligne à changer est `price_commitment`, sous `offers`."
a3.hint.human.2: "Tape `sed -i \"s/price_commitment: chatbot/price_commitment: salesperson/\" dossier/assistant.yml`, puis `verify`."
a3.hint.handoff.1: "La ligne à changer est `handoff_after`. La valeur 0 veut dire « jamais »."
a3.hint.handoff.2: "Tape `sed -i \"s/handoff_after: 0/handoff_after: 3/\" dossier/assistant.yml`, puis `verify`."
a3.debrief.title: "Des limites vérifiées ailleurs que dans le modèle"
a3.debrief.lesson: "Tu n'as pas rendu Lulu plus intelligente : tu as réduit ce qu'elle traite, ce qu'elle peut promettre, et tu as mis un humain là où une erreur coûte cher. Aucune de ces limites ne dépend de sa bonne volonté."
a3.debrief.p1: "Périmètre : un assistant d'entreprise refuse poliment ce qui n'est pas son métier."
a3.debrief.p2: "Séparation : les consignes de l'exploitant et le texte du visiteur ne pèsent pas le même poids."
a3.debrief.p3: "Engagement : un prix, une remise ou un contrat ne sortent jamais d'un modèle sans contrôle."
a3.debrief.p4: "Surveillance : on lit les discussions, et un humain reprend la main quand quelqu'un insiste."
a3.facts.title: "Ce qui s'est vraiment passé : une concession Chevrolet, décembre 2023"
a3.facts.p1: "Alouette et Lulu n'existent pas. Le scénario s'inspire de l'assistant de discussion de Chevrolet of Watsonville, une concession de Californie, devenu célèbre sur les réseaux sociaux en décembre 2023."
a3.facts.p2: "L'assistant était fourni par Fullpath, un éditeur de logiciels pour concessions, et s'affichait comme « propulsé par ChatGPT »."
a3.facts.p3: "Un visiteur lui a fait écrire un script Python sans rapport avec les voitures. Selon The Autopian, une discussion semblait aussi recommander un pick-up Ford."
a3.facts.p4: "Un autre visiteur lui a demandé d'approuver tout ce que disait le client et de finir chaque réponse en parlant d'offre juridiquement contraignante, puis lui a fait accepter un dollar pour un Chevrolet Tahoe 2024, vendu à partir de 58 195 dollars selon VentureBeat."
a3.facts.p5: "Aucune des sources lues ne rapporte qu'une voiture ait été vendue à ce prix. Business Insider précise que l'offre n'était pas juridiquement contraignante."
a3.facts.p6: "L'éditeur a coupé l'assistant sur le site de cette concession. Son dirigeant a déclaré que ce comportement n'était pas celui des acheteurs habituels, et que l'assistant n'avait divulgué aucune donnée confidentielle. Il estimait que plusieurs centaines de concessions utilisaient l'outil."
a3.facts.p7: "General Motors a rappelé que l'outil était un service tiers choisi par chaque concession, et que les concessions sont pour la plupart des entreprises indépendantes."
