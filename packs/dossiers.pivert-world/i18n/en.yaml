file.readme: "Ligne Rouge workstation. Case file: Pivert. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE SM-2028-077\nClient: Sémaphore, a text messaging platform. Scope: *.semaphore.test, 10.108.0.0/24.\nPurpose: employees report a text from the \"IT department\" that does not come from it. Ligne Rouge helps Sémaphore measure the damage, close the access and choose a way of signing in that holds.\nAgreed set-up: defence only. Reading logs and the test phone provided, measures approved by management and run through `contain`. The attacker's page is not visited.\nSigned: the head of security of Sémaphore."
ada.outOfScope: "Stop. This target is outside mandate SM-2028-077. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
