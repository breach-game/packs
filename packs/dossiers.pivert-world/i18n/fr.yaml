file.readme: "Poste Ligne Rouge. Dossier : Pivert. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT SM-2028-077\nClient : Sémaphore, plateforme d'envoi de SMS. Périmètre : *.semaphore.test, 10.108.0.0/24.\nObjet : des employés signalent un SMS du « service informatique » qui n'en vient pas. Ligne Rouge aide Sémaphore à mesurer les dégâts, à fermer les accès et à choisir un moyen de connexion qui résiste.\nCadre convenu : défense seulement. Lecture des journaux et du téléphone de test fourni, mesures validées par la direction et passées par `contain`. La page de l'attaquant n'est pas visitée.\nSigné : la responsable de la sécurité de Sémaphore."
ada.outOfScope: "Stop. Cette cible est hors du mandat SM-2028-077. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
