ada.outOfScope: "Stop. That target is outside mandate SA-2027-030. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE SA-2027-030\nClient: Cabinet Sarcelle SARL, an accounting firm. Scope: *.sarcelle.test, 10.84.0.0/24; the domain sarcelle-compta.test for public reading only (DNS, whois).\nPurpose: two clients received an invoice from the firm with new bank details. The firm sent nothing. Ligne Rouge works out where these messages come from, protects the firm's domain and reduces what the firm shows of itself.\nSet-up agreed: Ligne Rouge reads the messages forwarded by clients, queries the DNS, reviews the firm's DNS zone and website. Ligne Rouge does not write to the fraudsters.\nSigned: Cabinet Sarcelle's managing partner."
