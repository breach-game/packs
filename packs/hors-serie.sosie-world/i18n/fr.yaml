file.readme: "Poste Ligne Rouge. Hors-série : le Domaine sosie. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat SA-2027-030. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT SA-2027-030\nClient : Cabinet Sarcelle SARL, expertise comptable. Périmètre : *.sarcelle.test, 10.84.0.0/24 ; le domaine sarcelle-compta.test en lecture publique seulement (DNS, whois).\nObjet : deux clients ont reçu une facture du cabinet avec de nouvelles coordonnées bancaires. Le cabinet n'a rien envoyé. Ligne Rouge établit d'où viennent ces messages, protège le domaine du cabinet et réduit ce que le cabinet montre de lui-même.\nDispositif convenu : Ligne Rouge lit les messages transmis par les clients, interroge le DNS, relit la zone DNS et le site du cabinet. Ligne Rouge n'écrit pas aux fraudeurs.\nSigné : l'associée gérante du Cabinet Sarcelle."
