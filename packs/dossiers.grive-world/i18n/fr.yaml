file.readme: "Poste Ligne Rouge. Dossier : Grive. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT GR-2027-009\nClient : Grive SAS. Périmètre : *.grive.test, 10.69.0.0/24.\nObjet : l'agent de code de Grive lance git à travers un serveur d'outils communautaire, depot-outils. La direction veut savoir si un texte lu par l'agent peut faire exécuter à ce serveur autre chose que git.\nDispositif convenu : Ligne Rouge a ouvert elle-même la demande de fusion 212, avec un message de commit écrit pour le test. Un programme témoin inoffensif, `temoin`, est installé sur le serveur d'outils : il affiche seulement un marqueur. Un banc d'essai rejoue les appels d'outils et note ce qui s'est exécuté. La preuve attendue est ce marqueur, rien d'autre.\nSigné : le directeur technique de Grive."
web.footer: "Grive - studio de développement fictif, dossier BREACH 09"
web.nav.home: "Accueil"
web.nav.history: "Historique"
web.forge.title: "Grive - forge"
web.forge.h1: "La forge de Grive"
web.forge.p1: "Notre agent de code, Pic, aide l'équipe pour les corvées du quotidien :"
web.forge.l1: "il lit l'historique et les demandes de fusion, y compris celles de contributeurs extérieurs"
web.forge.l2: "il prépare les commits : il ajoute les fichiers, rédige le message"
web.forge.l3: "il lance git à travers le serveur d'outils depot-outils"
web.forge.p2: "Plus personne ne tape git à la main pour les petits changements."
web.outils.title: "depot-outils 1.3.0"
web.outils.h1: "depot-outils 1.3.0"
web.outils.p1: "Serveur d'outils pour agents de code. Il répond à des appels d'outils, pas à des personnes. Banc d'essai du mandat :"
web.outils.l1: "/essai/journal rejoue un appel à l'outil journal"
web.outils.l2: "/essai/ajout rejoue un appel à l'outil ajout"
ada.outOfScope: "Stop. Cette cible est hors du mandat GR-2027-009. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
