web.forge.title: "Grive - forge"
web.forge.h1: "The Grive forge"
web.forge.p1: "Our coding agent, Pic, helps the team with everyday chores:"
web.forge.l1: "it reads the history and the pull requests, including those from outside contributors"
web.forge.l2: "it prepares commits: it adds files, writes the message"
web.forge.l3: "it runs git through the depot-outils tool server"
web.forge.p2: "Nobody types git by hand any more for small changes."
