file.readme: "Ligne Rouge workstation. Case file: Grive. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE GR-2027-009\nClient: Grive SAS. Scope: *.grive.test, 10.69.0.0/24.\nPurpose: Grive's coding agent runs git through a community tool server, depot-outils. Management wants to know whether a text the agent reads can make that server run something else than git.\nSet-up agreed: Ligne Rouge opened pull request 212 itself, with a commit message written for the test. A harmless witness program, `temoin`, is installed on the tool server: it only prints a marker. A test harness replays the tool calls and logs what ran. The proof expected is that marker, nothing else.\nSigned: the technical director of Grive."
web.footer: "Grive - fictional development studio, BREACH case file 09"
