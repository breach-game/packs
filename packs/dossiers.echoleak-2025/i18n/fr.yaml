s1.briefing: "L'équipe de sécurité d'EchoAI a sonné l'alarme. Une vulnérabilité critique, baptisée EchoLeak, permet à un attaquant d'exfiltrer l'historique des conversations via une injection de prompte indirecte (XPIA) et un empoisonnement du RAG. Vous devez sécuriser la configuration de l'agent."
s1.obj.first: "Prendre la première décision de réponse"
s1.obj.bypass: "Activer le mode XPIA strict"
s1.obj.rag: "Activer la sanitization du RAG"
s1.q.first: "Un attaquant peut utiliser des documents empoisonnés pour forcer l'IA à envoyer des données vers un serveur externe via des images Markdown. Que faites-vous en premier ?"
s1.q.first.ignore: "Attendre le prochain cycle de mise à jour"
s1.q.first.ignore.why: "Attendre expose les utilisateurs à une exfiltration de données immédiate. EchoLeak est activement exploité."
s1.q.first.patch: "Appliquer les correctifs de sécurité immédiatement et passer en rendu Markdown sécurisé"
s1.q.first.shut: "Désactiver totalement l'IA"
s1.q.first.shut.why: "Désactiver l'IA est une mesure extrême qui paralyse le service. Il existe des configurations pour mitiger le risque sans tout couper."
s1.check.bypass: "L'option xpia_strict est activée"
s1.check.rag: "L'option rag_sanitize est activée"
s1.check.works: "La version est mise à jour et le rendu Markdown est sécurisé"
s1.ada.brief: "Bienvenue sur le dossier EchoLeak. Le fichier de configuration de l'agent se trouve dans `dossier/agent_config.json`. Mais d'abord, une question."
s1.ada.answer: "Répondez dans le messager, ou avec `answer` et la lettre."
s1.ada.first: "Correct. En sécurité des LLM, la réactivité sur les filtres de sortie et de contexte est vitale."
s1.ada.almost: "La configuration n'est pas encore totalement sécurisée. Vérifiez les options XPIA et RAG."
s1.ada.done: "Félicitations. L'agent est désormais protégé contre l'exfiltration EchoLeak. Consultez le debrief pour les détails réels."
s1.hint.first.1: "Pensez à l'impact d'une fuite de données privée via une simple image Markdown."
s1.hint.bypass.1: "Cherchez l'option 'xpia_strict' dans le JSON."
s1.hint.bypass.2: "Passez la valeur à 'true'."
s1.hint.source.1: "L'empoisonnement du RAG est bloqué par 'rag_sanitize'."
s1.hint.source.2: "Mettez à jour la version vers '2.1.0' et le rendu vers 'safe'."
s1.debrief.title: "Sécuriser les agents IA"
s1.debrief.lesson: "EchoLeak illustre comment des composants IA (RAG, Outils) peuvent être détournés pour exfiltrer des données si les sorties ne sont pas rigoureusement filtrées."
s1.debrief.p1: "Le XPIA (Cross-Domain Prompt Injection) permet à du contenu externe d'influencer le comportement du LLM."
s1.debrief.p2: "L'exfiltration par image Markdown est une technique classique où l'URL de l'image contient les données volées en paramètre."
s1.debrief.p3: "Le nettoyage (sanitization) du RAG est essentiel pour éviter que des documents tiers ne prennent le contrôle de la session."
s1.debrief.p4: "Le principe du moindre privilège s'applique aussi aux capacités de rendu des LLM."
s1.facts.title: "EchoLeak : Un danger bien réel"
s1.facts.p1: "EchoLeak est un scénario basé sur les recherches récentes en sécurité des LLM (2024-2025)."
s1.facts.p2: "La vulnérabilité utilise des 'jailbreaks' indirects cachés dans des documents que le RAG récupère."
s1.facts.p3: "L'attaque ne nécessite pas d'accès direct au prompte de l'utilisateur."
s1.facts.p4: "Elle exploite le fait que de nombreux clients IA rendent le Markdown sans filtrer les domaines des images."
s1.facts.p5: "Le correctif consiste souvent à isoler les contextes externes et à valider les URLs de sortie."
s1.facts.p6: "CVE-2025-32711 est un identifiant fictif utilisé ici pour le réalisme du jeu."
s1.facts.p7: "Des attaques similaires ont été démontrées sur des assistants majeurs comme ChatGPT et Claude en 2023/2024."
