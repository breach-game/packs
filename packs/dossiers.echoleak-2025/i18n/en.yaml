s1.briefing: "EchoAI's security team has raised the alarm. A critical vulnerability, dubbed EchoLeak, allows an attacker to exfiltrate conversation history via Cross-Domain Prompt Injection (XPIA) and RAG poisoning. You must secure the agent's configuration."
s1.obj.first: "Make the first response decision"
s1.obj.bypass: "Enable strict XPIA mode"
s1.obj.rag: "Enable RAG sanitization"
s1.q.first: "An attacker can use poisoned documents to force the AI to send data to an external server via Markdown images. What do you do first?"
s1.q.first.ignore: "Wait for the next update cycle"
s1.q.first.ignore.why: "Waiting exposes users to immediate data exfiltration. EchoLeak is being actively exploited."
s1.q.first.patch: "Apply security patches immediately and switch to safe Markdown rendering"
s1.q.first.shut: "Totally disable the AI"
s1.q.first.shut.why: "Disabling the AI is an extreme measure that paralyzes the service. Configurations exist to mitigate the risk without cutting everything off."
s1.check.bypass: "The xpia_strict option is enabled"
s1.check.rag: "The rag_sanitize option is enabled"
s1.check.works: "The version is updated and Markdown rendering is secured"
s1.ada.brief: "Welcome to the EchoLeak dossier. The agent configuration file is in `dossier/agent_config.json`. But first, a question."
s1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
s1.ada.first: "Correct. In LLM security, responsiveness on output and context filters is vital."
s1.ada.almost: "The configuration is not yet fully secured. Check the XPIA and RAG options."
s1.ada.done: "Congratulations. The agent is now protected against EchoLeak exfiltration. See the debrief for real-world details."
s1.hint.first.1: "Think about the impact of private data leaking via a simple Markdown image."
s1.hint.bypass.1: "Look for the 'xpia_strict' option in the JSON."
s1.hint.bypass.2: "Change the value to 'true'."
s1.hint.source.1: "RAG poisoning is blocked by 'rag_sanitize'."
s1.hint.source.2: "Update the version to '2.1.0' and rendering to 'safe'."
s1.debrief.title: "Securing AI Agents"
s1.debrief.lesson: "EchoLeak illustrates how AI components (RAG, Tools) can be hijacked to exfiltrate data if outputs are not rigorously filtered."
s1.debrief.p1: "XPIA (Cross-Domain Prompt Injection) allows external content to influence LLM behavior."
s1.debrief.p2: "Markdown image exfiltration is a classic technique where the image URL contains stolen data as a parameter."
s1.debrief.p3: "RAG sanitization is essential to prevent third-party documents from taking control of the session."
s1.debrief.p4: "The principle of least privilege also applies to LLM rendering capabilities."
s1.facts.title: "EchoLeak: A Very Real Danger"
s1.facts.p1: "EchoLeak is a scenario based on recent LLM security research (2024-2025)."
s1.facts.p2: "The vulnerability uses indirect 'jailbreaks' hidden in documents that RAG retrieves."
s1.facts.p3: "The attack does not require direct access to the user's prompt."
s1.facts.p4: "It exploits the fact that many AI clients render Markdown without filtering image domains."
s1.facts.p5: "The fix often involves isolating external contexts and validating output URLs."
s1.facts.p6: "CVE-2025-32711 is a fictional identifier used here for game realism."
s1.facts.p7: "Similar attacks were demonstrated on major assistants like ChatGPT and Claude in 2023/2024."
