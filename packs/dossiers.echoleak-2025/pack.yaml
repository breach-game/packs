id: dossiers.echoleak-2025
version: 1.0.0
engine: ">=0.5 <1"
kind: mission
requires: []
title:
  fr: "Dossier 07 · EchoLeak (CVE-2025-32711)"
  en: "Case file 07 · EchoLeak (CVE-2025-32711)"
summary:
  fr: "L'incident EchoLeak : contournement d'XPIA, empoisonnement RAG et exfiltration par image Markdown."
  en: "The EchoLeak incident: XPIA bypass, RAG poisoning, and Markdown image exfiltration."
authors: [BREACH team]
locales: [fr, en]
difficulty: 3
skills: [ai, security, web]
order: 1
stage: response
briefing: s1.briefing

files:
  dossier/agent_config.json: { $file: files/agent_config.json }

objectives:
  - { id: first, text: s1.obj.first }
  - { id: bypass, text: s1.obj.bypass }
  - { id: rag, text: s1.obj.rag }

questions:
  - id: first
    text: s1.q.first
    objective: first
    correct: patch
    options:
      - { id: ignore, text: s1.q.first.ignore, why: s1.q.first.ignore.why }
      - { id: patch, text: s1.q.first.patch }
      - { id: shut, text: s1.q.first.shut, why: s1.q.first.shut.why }

checks:
  - id: bypass
    text: s1.check.bypass
    if: { all: [{ file: "~/dossier/agent_config.json", contains: "xpia_strict: true" }, { file: "~/dossier/agent_config.json", lacks: "xpia_strict: false" }] }
    objective: bypass
  - id: rag
    text: s1.check.rag
    if: { all: [{ file: "~/dossier/agent_config.json", contains: "rag_sanitize: true" }, { file: "~/dossier/agent_config.json", lacks: "rag_sanitize: false" }] }
    objective: rag
  - id: works
    text: s1.check.works
    if: { all: [{ file: "~/dossier/agent_config.json", contains: "version: 2.1.0" }, { file: "~/dossier/agent_config.json", contains: "markdown_rendering: safe" }] }

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: s1.ada.brief
      - ada.ask: first
  - on: { event: ObjectiveCompleted, objective: first }
    do:
      - ada.say: s1.ada.first
  - on: { event: Verified }
    if: { not: { all: [{ objective: bypass }, { objective: rag }] } }
    once: false
    do:
      - ada.say: s1.ada.almost
  - on: { event: MissionCompleted }
    do:
      - ada.say: s1.ada.done

guide:
  first: s1.ada.answer
  bypass: s1.ada.g.bypass
  rag: s1.ada.g.rag

hints:
  first: [s1.hint.first.1]
  bypass: [s1.hint.bypass.1, s1.hint.bypass.2]
  rag: [s1.hint.source.1, s1.hint.source.2]

debrief:
  title: s1.debrief.title
  lesson: s1.debrief.lesson
  points: [s1.debrief.p1, s1.debrief.p2, s1.debrief.p3, s1.debrief.p4]
  reference: "OWASP Top 10 for LLM Applications · LLM01: Prompt Injection & LLM02: Insecure Output Handling"
  facts:
    title: s1.facts.title
    points: [s1.facts.p1, s1.facts.p2, s1.facts.p3, s1.facts.p4, s1.facts.p5, s1.facts.p6, s1.facts.p7]
    sources:
      - { label: "EchoLeak CVE-2025-32711 Advisory", url: "https://cve.mitre.org/cgi-bin/cvename.cgi?_id=CVE-2025-32711" },
      - { label: "AI Security Weekly on Cross-Domain Prompt Injection (XPIA)", url: "https://example.com/echoleak-advisory" }
