file.readme: "Ligne Rouge workstation. Case file: Héron. Type `mission` to see your objectives, `hint` if you get stuck."
file.ir.readme: "Incident response access. Read only; measures go through `contain`."
file.mandate: "MANDATE AL-2027-112\nClient: Albe Libraries, twelve libraries. Scope: *.albe.test, 10.95.0.0/24.\nPurpose: a critical flaw in a logging library has just been published. Ligne Rouge helps the IT team find what is affected, protect it, then look for traces.\nAgreed setup: defence only. Read access to the servers, measures approved by management and run through `contain`, releases through `deploy`.\nSigned: the CIO of Albe Libraries."
page.portail.h1: "Albe Libraries"
page.portail.p: "Twelve libraries, one membership. Opening hours, events and the online catalogue."
page.catalogue.h1: "Catalogue"
page.catalogue.p: "Look for a book, a record or a film in the twelve libraries."
adv.carnet: "carnet-core: a logged text that contains a remote lookup %{distant:…} can make the application load and run a class from an outside server."
ada.outOfScope: "Stop. This target is outside mandate AL-2027-112. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
