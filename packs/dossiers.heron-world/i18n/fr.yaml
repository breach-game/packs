file.readme: "Poste Ligne Rouge. Dossier : Héron. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.ir.readme: "Accès de l'équipe de réponse à incident. Lecture seule ; les mesures passent par `contain`."
file.mandate: "MANDAT AL-2027-112\nClient : Médiathèques d'Albe, douze bibliothèques. Périmètre : *.albe.test, 10.95.0.0/24.\nObjet : une faille critique d'une bibliothèque de journalisation vient d'être publiée. Ligne Rouge aide l'équipe informatique à trouver ce qui est touché, à protéger, puis à chercher des traces.\nDispositif convenu : défense uniquement. Accès en lecture aux serveurs, mesures validées par la direction et passées par `contain`, mises en production par `deploy`.\nSigné : le directeur des systèmes d'information des Médiathèques d'Albe."
page.portail.h1: "Médiathèques d'Albe"
page.portail.p: "Douze bibliothèques, un seul abonnement. Horaires, animations et catalogue en ligne."
page.catalogue.h1: "Catalogue"
page.catalogue.p: "Cherchez un livre, un disque ou un film dans les douze médiathèques."
adv.carnet: "carnet-core : un texte journalisé qui contient une recherche distante %{distant:…} peut faire charger et exécuter une classe venue d'un serveur extérieur."
ada.outOfScope: "Stop. Cette cible est hors du mandat AL-2027-112. Même pour défendre, hors mandat, c'est un délit (article 323-1 du Code pénal)."
