c2.briefing: "Wednesday 6 September, 9 am. The script is repaired, but it was changed with the domain admin account, which nobody in the team used that evening. Air Alizé's contractors sign in through a remote access gateway. The team's note is in your folder."
c2.obj.account: "Find the least protected remote account"
c2.obj.address: "Find the address that is not the contractor's"
c2.obj.clear: "Find where the admin password was lying around"
c2.obj.policy: "Rewrite the remote access policy"
c2.obj.story: "Put the summer in order"
c2.q.account: "Which remote account has no second factor?"
c2.q.address: "From which address does this account sign in that is not the contractor's?"
c2.q.clear: "Which script in the shared folder holds an admin password in clear? (file name)"
c2.check.factor: "The second factor is required for contractors"
c2.check.reach: "A contractor only reaches their own application"
c2.check.vault: "Admin passwords are in a vault"
c2.check.alert: "A sign-in from an unusual address raises an alert"
c2.check.works: "Contractors can still work"
c2.tl.text: "Air Alizé's summer"
c2.tl.signin: "Someone signs in to the gateway with the fret-07 account, with no second factor"
c2.tl.breakout: "They break out of the remote desktop, which was meant to show one application"
c2.tl.password: "They read the admin password in a script in the shared folder"
c2.tl.script: "They add one line to the payment page's script"
c2.tl.bank: "A bank links fraud to Air Alizé's website"
c2.tl.restored: "The reviewed script is put back in production, the domain is blocked"
c2.tl.told: "Air Alizé tells the data protection authority and its customers"
c2.ada.brief: "Read the note: `cat note.txt`. Then the list of remote accounts: `cat acces/comptes-distants.csv`."
c2.ada.g.account: "In `acces/comptes-distants.csv`, the last column says whether the account has a second factor. `answer account <account>`."
c2.ada.g.account.standard: "Find in the list of remote accounts the one a password alone opens."
c2.ada.account: "`fret-07`, an account of the cargo contractor. A password, nothing else. It is not necessarily the contractor who used it: look where this account signs in from."
c2.ada.g.address: "`soc search fret-07` lists its sign-ins to the gateway. The contractor works from 198.51.100.20. `answer address <the other address>`."
c2.ada.g.address.standard: "Compare the addresses this account signs in from with the one in the list."
c2.ada.address: "203.0.113.140 is not the contractor's. Someone else has that password. But a cargo account cannot change the website. Let's see what a remote desktop can read: `ls partage/scripts`."
c2.ada.g.clear: "`ls partage/scripts`, then `cat` each script. `answer clear <file name>`."
c2.ada.g.clear.standard: "Read the scripts in the shared folder that any remote desktop can open."
c2.ada.clear: "A backup script written \"temporarily\" in 2024, with the admin account's password in clear. From a cargo account to the account that can do anything, there was one file to read."
c2.ada.clear.close: "And 203.0.113.140 signed in again this morning. Before the policy, close what is open: `contain`."
c2.obj.close: "Close the account the intruder uses and change the stolen password"
c2.contain.account: "Disable the remote account the intruder uses until it has a second factor"
c2.contain.password: "Change the admin password found in clear and put it in the vault"
c2.ada.g.close: "Two measures: `contain disable compte-vole`, then `contain rotate mot-de-passe-admin`."
c2.ada.g.close.standard: "Get the intruder out of the account they use, and make the password read in the script useless. `contain` lists the measures."
c2.hint.close.1: "`contain disable compte-vole` then `contain rotate mot-de-passe-admin`"
c2.ada.close: "fret-07 is closed until it has its second factor, and the admin password has changed: the one in the script is worth nothing now."
c2.ada.close.next: "Now the policy: `acces/politique.yml`."
c2.ada.decide: "A decision is waiting for you."
c2.ada.g.policy: "`cat acces/politique.yml`: each line gives its possible values after the `#`. Four must change: `required`, `own-application-only`, `in-vault`, `on`. Change them with `edit acces/politique.yml` or `sed -i`, then `verify`."
c2.ada.g.policy.standard: "Fix `acces/politique.yml`, then run `verify`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.policy: "A second factor for every contractor, access that stops at their application, no more passwords in a script."
c2.ada.g.story: "`timeline ete` shows the events shuffled. Answer with their ids in order: `timeline ete <id> <id> …`."
c2.ada.g.story.standard: "Put the summer in order, from the first sign-in to telling the customers."
c2.ada.done: "Three links: a contractor account with no second factor, a remote desktop you can break out of, a password in a file. Each one was small. The next card tells the real case this file is inspired by."
c2.hint.account.1: "Only one line of `acces/comptes-distants.csv` ends with `no`."
c2.hint.account.2: "`answer account fret-07`"
c2.hint.address.1: "`soc search fret-07`: two addresses, one of them 198.51.100.20, the contractor's."
c2.hint.address.2: "`answer address 203.0.113.140`"
c2.hint.clear.1: "`cat partage/scripts/sauvegarde-nuit.cmd`"
c2.hint.clear.2: "`answer clear sauvegarde-nuit.cmd`"
c2.hint.policy.1: "The expected values: `required`, `own-application-only`, `in-vault`, `on`."
c2.hint.policy.2: "For example `sed -i \"s/admin_passwords: in-scripts/admin_passwords: in-vault/\" acces/politique.yml`."
c2.hint.story.1: "It all starts with a sign-in to the gateway and ends with telling the customers."
c2.hint.story.2: "`timeline ete signin breakout password script bank restored told`"
c2.debrief.title: "The cargo account"
c2.debrief.lesson: "The intruder did not come in through the website. They came in through a contractor's account, which a password alone opened, then found an admin password written in clear in a script. A company's security often stops where its suppliers' access begins."
c2.debrief.p1: "Remote access, above all for a third party, requires a second factor. No exception."
c2.debrief.p2: "A contractor only reaches what they need: their application, not the network."
c2.debrief.p3: "No password in a script or a file: a vault, and service accounts with limited rights."
c2.facts.title: "What really happened: British Airways, 2018"
c2.facts.p1: "Between 22 June and 5 September 2018, an intruder has access to British Airways' systems. They come in through the remote access gateway, with the account of an employee of Swissport, a cargo contractor. That account was not protected by multi-factor authentication."
c2.facts.p2: "According to the UK data protection authority (ICO), the intruder breaks out of the remote environment and finds the username and password of a domain administrator, stored in plain text in a folder."
c2.facts.p3: "They then edit a JavaScript file of the website: the card data customers type is copied to an outside domain with a look-alike name. British Airways does not detect the attack: a third party alerts it on 5 September, and the airline reports it the next day."
c2.facts.p4: "429,612 people are affected, about 244,000 of them for their name, address, card number and its security code."
c2.facts.p5: "On 16 October 2020, the ICO fines British Airways 20 million pounds. It had first announced its intention to set a fine of about 183 million."
c2.obj.partners: "Decide what to do with the contractors' access"
c2.q.partners: "The second factor will be required, but rolling it out to contractors takes a week. Until then?"
c2.q.partners.one: "Keep fret-07 closed, give the others a week"
c2.q.partners.all: "Cut all remote access until the second factor is in place"
c2.q.partners.watch: "Reopen fret-07 with a new password, and watch everything for a week"
c2.ada.g.partners: "No answer is wrong: each one costs Air Alizé and its contractors something different."
c2.ada.partners: "Noted. All that is left is telling the summer's story."
