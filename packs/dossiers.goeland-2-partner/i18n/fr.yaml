c2.briefing: "Mercredi 6 septembre, 9 h. Le script est réparé, mais il a été modifié avec le compte d'administration du domaine, que personne de l'équipe n'a utilisé ce soir-là. Les prestataires d'Air Alizé se connectent par une passerelle d'accès à distance. La note de l'équipe est dans ton dossier."
