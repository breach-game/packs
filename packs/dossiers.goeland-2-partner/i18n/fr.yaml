c2.tl.signin: "Quelqu'un se connecte à la passerelle avec le compte fret-07, sans second facteur"
c2.tl.breakout: "Il sort du bureau à distance, qui ne devait montrer qu'une application"
c2.tl.password: "Il lit le mot de passe d'administration dans un script du dossier partagé"
c2.tl.script: "Il ajoute une ligne au script de la page de paiement"
