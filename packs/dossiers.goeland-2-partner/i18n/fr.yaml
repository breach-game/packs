c2.tl.told: "Air Alizé prévient l'autorité de protection des données et ses clients"
c2.ada.brief: "Lis la note : `cat note.txt`. Puis la liste des comptes à distance : `cat acces/comptes-distants.csv`."
c2.ada.g.account: "Dans `acces/comptes-distants.csv`, la dernière colonne dit si le compte a un second facteur. `answer account <compte>`."
c2.ada.g.account.standard: "Trouve dans la liste des comptes à distance celui qu'un mot de passe seul suffit à ouvrir."
c2.ada.account: "`fret-07`, un compte du prestataire de fret. Un mot de passe, rien d'autre. Ce n'est pas forcément le prestataire qui s'en est servi : regarde d'où ce compte se connecte."
c2.ada.g.address: "`soc search fret-07` liste ses connexions à la passerelle. Le prestataire travaille depuis 198.51.100.20. `answer address <l'autre adresse>`."
c2.ada.g.address.standard: "Compare les adresses d'où ce compte se connecte à celle de la liste."
c2.ada.address: "203.0.113.140 n'est pas chez le prestataire. Quelqu'un d'autre a ce mot de passe. Mais un compte de fret ne peut pas modifier le site. Voyons ce qu'un bureau à distance peut lire : `ls partage/scripts`."
c2.ada.g.clear: "`ls partage/scripts`, puis `cat` sur chaque script. `answer clear <nom du fichier>`."
c2.ada.g.clear.standard: "Lis les scripts du dossier partagé que tout bureau à distance peut ouvrir."
c2.ada.clear: "Un script de sauvegarde écrit « provisoirement » en 2024, avec le mot de passe du compte d'administration en clair. D'un compte de fret au compte qui peut tout, il n'y avait qu'un fichier à lire."
c2.ada.clear.close: "Et ce matin encore, 203.0.113.140 s'est connecté. Avant la politique, ferme ce qui est ouvert : `contain`."
c2.obj.close: "Fermer le compte utilisé par l'intrus et changer le mot de passe volé"
c2.contain.account: "Désactiver le compte à distance utilisé par l'intrus jusqu'à ce qu'il ait un second facteur"
c2.contain.password: "Changer le mot de passe d'administration trouvé en clair et le mettre au coffre"
c2.ada.g.close: "Deux mesures : `contain disable compte-vole`, puis `contain rotate mot-de-passe-admin`."
c2.ada.g.close.standard: "Sors l'intrus du compte qu'il utilise, et fais en sorte que le mot de passe lu dans le script ne serve plus. `contain` liste les mesures."
c2.hint.close.1: "`contain disable compte-vole` puis `contain rotate mot-de-passe-admin`"
c2.ada.close: "fret-07 est fermé jusqu'à son second facteur, et le mot de passe d'administration a changé : celui du script ne vaut plus rien."
c2.ada.close.next: "Maintenant, la politique : `acces/politique.yml`."
c2.ada.decide: "Une décision t'attend."
c2.ada.g.policy: "`cat acces/politique.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut quatre : `required`, `own-application-only`, `in-vault`, `on`. Change-les avec `edit acces/politique.yml` ou `sed -i`, puis `verify`."
c2.ada.g.policy.standard: "Corrige `acces/politique.yml`, puis lance `verify`. Pour ouvrir le fichier : `edit acces/politique.yml`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.policy: "Second facteur pour tous les prestataires, un accès qui s'arrête à leur application, plus aucun mot de passe dans un script."
c2.ada.g.story: "`timeline ete` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline ete <id> <id> …`."
c2.ada.g.story.standard: "Remets l'été dans l'ordre, de la première connexion à l'annonce aux clients."
c2.ada.done: "Trois maillons : un compte de prestataire sans second facteur, un bureau à distance dont on sort, un mot de passe dans un fichier. Chacun était petit. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
c2.hint.account.1: "Une seule ligne de `acces/comptes-distants.csv` finit par `no`."
c2.hint.account.2: "`answer account fret-07`"
c2.hint.address.1: "`soc search fret-07` : deux adresses, dont 198.51.100.20, celle du prestataire."
c2.hint.address.2: "`answer address 203.0.113.140`"
c2.hint.clear.1: "`cat partage/scripts/sauvegarde-nuit.cmd`"
c2.hint.clear.2: "`answer clear sauvegarde-nuit.cmd`"
c2.hint.policy.1: "Les valeurs attendues : `required`, `own-application-only`, `in-vault`, `on`."
c2.hint.policy.2: "Avec l'éditeur : `edit acces/politique.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/admin_passwords: in-scripts/admin_passwords: in-vault/\" acces/politique.yml`."
c2.hint.story.1: "Tout commence par une connexion à la passerelle et finit par l'annonce aux clients."
c2.hint.story.2: "`timeline ete signin breakout password script bank restored told`"
c2.debrief.title: "Le compte du fret"
c2.debrief.lesson: "L'intrus n'est pas entré par le site. Il est entré par le compte d'un prestataire, qu'un mot de passe seul ouvrait, puis il a trouvé un mot de passe d'administration écrit en clair dans un script. La sécurité d'une entreprise s'arrête souvent là où commence l'accès de ses fournisseurs."
c2.debrief.p1: "Un accès à distance, surtout pour un tiers, exige un second facteur. Sans exception."
c2.debrief.p2: "Un prestataire n'atteint que ce dont il a besoin : son application, pas le réseau."
c2.debrief.p3: "Aucun mot de passe dans un script ou un fichier : un coffre, et des comptes de service aux droits limités."
c2.facts.title: "Ce qui s'est vraiment passé : British Airways, 2018"
c2.facts.p1: "Entre le 22 juin et le 5 septembre 2018, un intrus a accès aux systèmes de British Airways. Il entre par la passerelle d'accès à distance, avec le compte d'un employé de Swissport, prestataire de fret. Ce compte n'était pas protégé par une authentification à plusieurs facteurs."
c2.facts.p2: "Selon l'autorité britannique de protection des données (ICO), l'intrus sort de l'environnement à distance et trouve l'identifiant et le mot de passe d'un administrateur du domaine, enregistrés en clair dans un dossier."
c2.facts.p3: "Il modifie ensuite un fichier JavaScript du site : les données de carte tapées par les clients partent en copie vers un domaine extérieur au nom ressemblant. British Airways ne détecte pas l'attaque : un tiers la prévient le 5 septembre, et la compagnie le déclare le lendemain."
c2.facts.p4: "429 612 personnes sont concernées, dont environ 244 000 pour leur nom, leur adresse, leur numéro de carte et son code de sécurité."
c2.facts.p5: "Le 16 octobre 2020, l'ICO inflige à British Airways une amende de 20 millions de livres. Elle avait d'abord annoncé son intention de fixer une amende d'environ 183 millions."
c2.obj.partners: "Décider quoi faire des accès des prestataires"
c2.q.partners: "Le second facteur sera obligatoire, mais le déployer chez les prestataires prend une semaine. D'ici là ?"
c2.q.partners.one: "Garder fret-07 fermé, laisser une semaine aux autres"
c2.q.partners.all: "Couper tous les accès à distance jusqu'au second facteur"
c2.q.partners.watch: "Rouvrir fret-07 avec un nouveau mot de passe, et tout surveiller une semaine"
c2.ada.g.partners: "Aucune réponse n'est fausse : chacune coûte quelque chose de différent à Air Alizé et à ses prestataires."
c2.ada.partners: "Noté. Il reste à raconter l'été."
