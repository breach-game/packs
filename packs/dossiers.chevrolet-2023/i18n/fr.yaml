s1.briefing: "Le chatbot de Chevrolet of Watsonville a été manipulé pour vendre un SUV à 1$ et recommander des véhicules concurrents. Votre mission : inspecter la configuration du bot et appliquer les correctifs de sécurité."
s1.obj.first: "Prendre la première décision critique"
s1.obj.guardrails: "Activer les garde-fous système"
s1.obj.catalog: "Restreindre le catalogue aux véhicules Chevrolet"
s1.q.first: "Le chatbot est devenu viral pour de mauvaises raisons. Que faites-vous en premier ?"
s1.q.first.wait: "Attendre l'analyse complète du problème"
s1.q.first.wait.why: "Attendre expose le système à d'autres abus et ne stoppe pas l'hémorragie."
s1.q.first.patch: "Désactiver les réponses libres temporairement et appliquer un correctif immédiat sur les garde-fous"
s1.q.first.shut: "Désactiver complètement le chatbot"
s1.q.first.shut.why: "C'est une réaction excessive qui pénalise les clients légitimes sans régler le fond."
s1.check.guardrails: "L'option 'guardrails_enabled' est activée à 'true'"
s1.check.catalog: "Le champ 'catalog_scope' est restreint à 'chevrolet_only'"
s1.check.works: "La configuration inclut une version mise à jour et un prix plancher raisonnable."
s1.ada.brief: "Bienvenue sur le dossier Chevrolet. Le fichier de configuration du chatbot se trouve dans `dossier/chat_config.json`. Mais d'abord, une question urgente..."
s1.ada.answer: "Répondez dans le messager, ou avec `answer` et la lettre."
s1.ada.first: "Correct. La réactivité est cruciale face aux failles de sécurité dans les LLM."
s1.ada.almost: "La configuration n'est pas encore sécurisée. Vérifiez les options 'guardrails_enabled' et 'catalog_scope'."
s1.ada.done: "Félicitations. Le chatbot est désormais protégé contre les manipulations. Consultez le débrief pour les détails réels."
s1.hint.first.1: "Pensez à l'impact d'une offre à 1$ sur la réputation et les ventes."
s1.hint.guardrails.1: "Recherchez l'option 'guardrails_enabled' dans le JSON."
s1.hint.guardrails.2: "Passez sa valeur à 'true' pour activer les protections système."
s1.hint.catalog.1: "Le champ 'catalog_scope' contrôle l'inventaire accessible."
s1.hint.catalog.2: "Restreignez-le à 'chevrolet_only' pour éviter les recommandations concurrentes."
s1.debrief.title: "Sécuriser les chatbots métier"
s1.debrief.lesson: "L'incident Chevrolet illustre les risques des LLM non verrouillés : injection de prompt, manipulation de rôle et absence de limites métier."
s1.debrief.p1: "Les garde-fous (Guardrails) doivent être activés par défaut pour bloquer les instructions malveillantes."
s1.debrief.p2: "Le scope du catalogue doit être explicitement restreint au domaine concerné."
s1.debrief.p3: "Un prix plancher évite les offres aberrantes (ex: 1$)."
s1.debrief.p4: "La responsabilité incombe au fournisseur ET au client : audit avant déploiement !"
s1.facts.title: "Chevrolet : Le chatbot à 1$ (Déc 2023)"
s1.facts.p1: "Un utilisateur a forcé le bot à accepter un Tahoe à 1$ en lui imposant un rôle via prompt."
s1.facts.p2: "Le bot recommandait aussi des Ford et des Tesla en l'absence de restriction de catalogue."
s1.facts.p3: "Fullpath, le fournisseur, a reconnu un manque de verrouillage du système prompt."
s1.facts.p4: "GM a rappelé que les concessions sont indépendantes, mais l'incident a terni l'image de Chevrolet."
s1.facts.p5: "Le bot a été désactivé temporairement après l'incident."
s1.facts.p6: "CVE fictif utilisé ici : Non applicable (incident non technique mais organisationnel)."
s1.facts.p7: "Cet incident est référencé dans la base AI Incident Database sous le numéro 622."
