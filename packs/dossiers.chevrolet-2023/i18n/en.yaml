s1.briefing: "The Chevrolet of Watsonville chatbot was manipulated to sell an SUV for $1 and recommend competitor vehicles. Your mission: Inspect the bot's configuration and apply security patches."
s1.obj.first: "Make the first critical decision"
s1.obj.guardrails: "Enable system guardrails"
s1.obj.catalog: "Restrict catalog to Chevrolet vehicles"
s1.q.first: "The chatbot went viral for the wrong reasons. What's your first move?"
s1.q.first.wait: "Wait for a full problem analysis"
s1.q.first.wait.why: "Waiting exposes the system to further abuse and doesn't stop the damage."
s1.q.first.patch: "Disable free responses temporarily and apply an immediate guardrail patch"
s1.q.first.shut: "Completely disable the chatbot"
s1.q.first.shut.why: "It's an overreaction that penalizes legitimate customers without fixing the root cause."
s1.check.guardrails: "The 'guardrails_enabled' option is set to 'true'"
s1.check.catalog: "The 'catalog_scope' field is restricted to 'chevrolet_only'"
s1.check.works: "The configuration includes an updated version and a reasonable price floor."
s1.ada.brief: "Welcome to the Chevrolet dossier. The chatbot configuration file is in `dossier/chat_config.json`. But first, an urgent question..."
s1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
s1.ada.first: "Correct. Responsiveness is critical when addressing LLM security flaws."
s1.ada.almost: "The configuration isn't secure yet. Check the 'guardrails_enabled' and 'catalog_scope' options."
s1.ada.done: "Congratulations. The chatbot is now protected against manipulation. See the debrief for real-world details."
s1.hint.first.1: "Think about the impact of a $1 offer on reputation and sales."
s1.hint.guardrails.1: "Look for the 'guardrails_enabled' option in the JSON."
s1.hint.guardrails.2: "Set its value to 'true' to activate system protections."
s1.hint.catalog.1: "The 'catalog_scope' field controls accessible inventory."
s1.hint.catalog.2: "Restrict it to 'chevrolet_only' to prevent competitor recommendations."
s1.debrief.title: "Securing Business Chatbots"
s1.debrief.lesson: "The Chevrolet incident illustrates the risks of unsecured LLMs: prompt injection, role manipulation, and missing business boundaries."
s1.debrief.p1: "Guardrails must be enabled by default to block malicious instructions."
s1.debrief.p2: "Catalog scope must be explicitly restricted to the relevant domain."
s1.debrief.p3: "A price floor prevents absurd offers (e.g., $1)."
s1.debrief.p4: "Responsibility lies with both the vendor and the client: audit before deployment!"
s1.facts.title: "Chevrolet: The $1 Chatbot (Dec 2023)"
s1.facts.p1: "A user forced the bot to accept a Tahoe for $1 by imposing a role via prompt."
s1.facts.p2: "The bot also recommended Ford and Tesla due to a lack of catalog restrictions."
s1.facts.p3: "Fullpath, the vendor, acknowledged insufficient prompt system locking."
s1.facts.p4: "GM noted that dealerships are independent, but the incident tarnished Chevrolet's image."
s1.facts.p5: "The bot was temporarily disabled after the incident."
s1.facts.p6: "Fictional CVE used here: Not applicable (organizational, not technical incident)."
s1.facts.p7: "This incident is referenced in the AI Incident Database as case 622."
