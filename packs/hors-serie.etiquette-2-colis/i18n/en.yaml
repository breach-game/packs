e2.briefing: "Tuesday morning. An employee of the urbanism department received a parcel they never ordered: a phone stand and a card saying \"Scan to track your parcel\". They scanned nothing and brought everything to IT. Good reflex. The card is in `colis/`, and the app the code offers was downloaded on the isolated bench, never installed: `banc/`."
e2.obj.read: "Read the card's QR code without opening it"
e2.obj.perms: "Say what the app asks of the phone"
e2.obj.server: "Find where the app sends what it collects"
e2.obj.block: "Block the domain for the whole town hall"
e2.obj.advice: "Tell the employee what to do"
e2.ada.brief: "A free parcel with a QR code and an offer \"valid 48 hours\". It's all there: the surprise, the gift, the hurry. We look at what's behind it, without following it."
e2.ada.g.read: "Read the card, `cat colis/carte.txt`, then the code: `qr decode colis/carte.png`."
e2.ada.g.read.standard: "Read the parcel's card, then the QR code on it, without opening it."
e2.ada.read: "An address offering an app to install from outside the app store. The bench downloaded it for us. An Android app is an archive: we can look inside without installing it."
e2.ada.g.perms: "The file that says what the app asks for is the manifest: `unzip -p banc/SuiviColis.apk AndroidManifest.xml`."
e2.ada.g.perms.standard: "Read the app's manifest, inside the archive, to see the permissions it asks for."
e2.ada.manifest: "Read the `uses-permission` lines, and the service that asks for `BIND_ACCESSIBILITY_SERVICE`. Then answer my question."
e2.ada.perms: "Reading text messages, so the bank's codes. Drawing over other apps. And the accessibility service, which can click in the user's place. Tracking a parcel needs none of that."
e2.ada.g.server: "The app's code is in `classes.dex`. Without running anything, its text strings say a lot: `unzip -p banc/SuiviColis.apk classes.dex | strings`. Then `answer server <name>`."
e2.ada.g.server.standard: "Read the strings of the app's code and find the address it sends what it collects to. Answer with `answer server`."
e2.ada.server: "`forward_sms_body`, `draw_over_banking_apps`, and a collection address. We know enough. Nobody at the town hall should be able to reach that domain."
e2.ada.g.block: "Block the domain on the town hall's resolver: `contain block suivi-colis-express.example`."
e2.ada.g.block.standard: "Block the app's domain for the whole town hall, with `contain`."
e2.ada.block: "No workstation or phone at the town hall can reach that domain any more. As for the employee, answer my question."
e2.ada.advice: "And we thank them, sincerely. It's thanks to them we saw the parcel before a colleague scanned the card."
e2.ada.answer: "Answer my question: click, or use `answer` in the terminal."
e2.ada.answer.standard: "My question is waiting in the messages."
e2.ada.done: "A two-euro phone stand to open someone's text messages. Debrief."
e2.contain.dns: "Block the domain suivi-colis-express.example on the town hall's resolver"
e2.q.server: "Which address does the app send what it collects to? (the host name only)"
e2.q.perms: "According to its manifest, what does this app ask of the phone?"
e2.q.perms.sms: "Reading text messages, drawing over other apps and clicking in the user's place."
e2.q.perms.track: "Only the phone's precise location, in the background, to track the parcel all the way to your door."
e2.q.perms.track.why: "The manifest asks for no location. Read the `uses-permission` lines and the accessibility service again."
e2.q.perms.nothing: "Nothing special: Internet access only, like every parcel tracking app."
e2.q.perms.nothing.why: "Internet, yes, but also `READ_SMS`, `RECEIVE_SMS`, `SYSTEM_ALERT_WINDOW` and an accessibility service. It is no tracking app."
e2.q.advice: "What do we tell the employee who received the parcel?"
e2.q.advice.report: "Thanks for bringing it in. Never install an app from outside the store; report any code received like this."
e2.q.advice.check: "First scan the code with your personal phone, to check that the site really is fake before throwing it away."
e2.q.advice.check.why: "That's exactly what the scammer is waiting for. You don't check a QR code by following it, you read it."
e2.q.advice.bin: "Throw the parcel and the card away, and tell nobody so as not to alarm the department."
e2.q.advice.bin.why: "Other employees may have received the same parcel. Reporting it is what lets us warn them."
e2.hint.read.1: "`qr decode colis/carte.png`."
e2.hint.perms.1: "`unzip -l banc/SuiviColis.apk` lists the app's files. The manifest says what it asks for."
e2.hint.perms.2: "`unzip -p banc/SuiviColis.apk AndroidManifest.xml`, then `answer sms`."
e2.hint.server.1: "`unzip -p banc/SuiviColis.apk classes.dex | strings` shows the code's texts, without running it."
e2.hint.server.2: "`answer server collecte.suivi-colis-express.example`."
e2.hint.block.1: "`contain block suivi-colis-express.example`."
e2.hint.advice.1: "You don't check a code by following it, and you thank whoever reports."
e2.debrief.title: "The gift that reads text messages"
e2.debrief.lesson: "The QR code stole nothing itself: it led to an app to install from outside the store. That app asked to read text messages and to drive the screen, enough to intercept the bank's codes. The free parcel and the \"48 hours\" offer were there to get a scan without thinking. The employee's good reflex stopped it all."
e2.debrief.p1: "Only install an app from the phone's official store. A page offering to \"download the app\" directly is a warning sign."
e2.debrief.p2: "An app asking for text messages, drawing over others and the accessibility service can steal a bank code. No parcel tracking app needs any of that."
e2.debrief.p3: "Blocking the domain at the resolver protects every workstation at once; thanking whoever reports means they report again next time."
e2.facts.title: "What really happened"
e2.facts.p1: "In 2025, the Royal Canadian Mounted Police in Red Deer warned about an unordered luxury parcel with a note asking the recipient to scan a QR code. According to them, the site at the end contained malware able to obtain banking information."
e2.facts.p2: "The US FTC also warned about QR codes arriving with an unexpected parcel, which can lead to a phishing site or to malware."
e2.home.p1: "A parcel you never ordered, with a code to scan? Don't scan: the gift is there to lower your guard."
e2.home.p2: "Never install an app offered by a link or a QR code: go to the app store and look it up yourself."
e2.home.p3: "If an app asks for accessibility or access to text messages with no clear reason, refuse and uninstall it."
