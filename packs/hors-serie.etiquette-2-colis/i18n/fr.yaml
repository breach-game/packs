e2.briefing: "Mardi matin. Un agent du service urbanisme a reçu un colis qu'il n'avait pas commandé : un support de téléphone et une carte « Scannez pour suivre votre colis ». Il n'a rien scanné, il a tout apporté au service informatique. Bon réflexe. La carte est dans `colis/`, et l'appli proposée par le code a été téléchargée sur le banc isolé, jamais installée : `banc/`."
e2.obj.read: "Lire le QR code de la carte sans l'ouvrir"
e2.obj.perms: "Dire ce que l'appli demande au téléphone"
e2.obj.server: "Trouver où l'appli envoie ce qu'elle collecte"
e2.obj.block: "Bloquer le domaine pour toute la mairie"
e2.obj.advice: "Dire à l'agent quoi faire"
e2.ada.brief: "Un colis gratuit avec un QR code et une offre « valable 48 heures ». Tout est là : la surprise, le cadeau, l'urgence. On regarde ce qu'il y a derrière, sans le suivre."
e2.ada.g.read: "Lis la carte, `cat colis/carte.txt`, puis le code : `qr decode colis/carte.png`."
e2.ada.g.read.standard: "Lis la carte du colis, puis le QR code qu'elle porte, sans l'ouvrir."
e2.ada.read: "Une adresse qui propose une appli à installer en dehors du magasin d'applications. Le banc l'a téléchargée pour nous. Une appli Android, c'est une archive : regarde ce qu'elle contient avec `unzip -l banc/SuiviColis.apk`."
e2.ada.g.perms: "Le fichier qui dit ce que l'appli demande s'appelle le manifeste : `unzip -p banc/SuiviColis.apk AndroidManifest.xml`."
e2.ada.g.perms.standard: "Lis le manifeste de l'appli, dans l'archive, pour voir les permissions qu'elle demande."
e2.ada.manifest: "Lis les lignes `uses-permission`, et le service qui demande `BIND_ACCESSIBILITY_SERVICE`. Puis réponds à ma question."
e2.ada.perms: "Lire les SMS, donc les codes de la banque. Afficher par-dessus les autres applis. Et le service d'accessibilité, qui peut cliquer à la place de l'utilisateur. Pour suivre un colis, rien de tout ça n'est nécessaire."
e2.ada.g.server: "Le code de l'appli est dans `classes.dex`. Sans rien exécuter, ses chaînes de texte disent beaucoup : `unzip -p banc/SuiviColis.apk classes.dex | strings`. Puis `answer server <nom>`."
e2.ada.g.server.standard: "Lis les chaînes du code de l'appli et trouve l'adresse où elle envoie ce qu'elle collecte. Réponds avec `answer server`."
e2.ada.server: "`forward_sms_body`, `draw_over_banking_apps`, et une adresse de collecte. On en sait assez. Personne à la mairie ne doit pouvoir joindre ce domaine."
e2.ada.g.block: "Bloque le domaine sur le résolveur de la mairie : `contain block suivi-colis-express.example`."
e2.ada.g.block.standard: "Bloque le domaine de l'appli pour toute la mairie, avec `contain`."
e2.ada.block: "Plus aucun poste ni téléphone de la mairie ne joint ce domaine. Reste l'agent : réponds à ma question."
e2.ada.advice: "Et on le remercie, sincèrement. C'est grâce à lui qu'on a vu le colis avant qu'un collègue ne scanne la carte."
e2.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
e2.ada.answer.standard: "Ma question t'attend dans la messagerie."
e2.ada.done: "Un support de téléphone à deux euros pour ouvrir les SMS de quelqu'un. Débrief."
e2.contain.dns: "Bloquer le domaine suivi-colis-express.example sur le résolveur de la mairie"
e2.q.server: "À quelle adresse l'appli envoie-t-elle ce qu'elle collecte ? (le nom d'hôte seul)"
e2.q.perms: "D'après son manifeste, que demande cette appli au téléphone ?"
e2.q.perms.sms: "Lire les SMS, s'afficher par-dessus les autres applis et cliquer à la place de l'utilisateur."
e2.q.perms.track: "Seulement la position du téléphone, pour suivre le colis jusqu'à la porte."
e2.q.perms.track.why: "Le manifeste ne demande aucune localisation. Relis les lignes `uses-permission` et le service d'accessibilité."
e2.q.perms.nothing: "Rien de spécial : Internet seulement, comme toutes les applis de suivi."
e2.q.perms.nothing.why: "Internet, oui, mais aussi `READ_SMS`, `RECEIVE_SMS`, `SYSTEM_ALERT_WINDOW` et un service d'accessibilité. Ce n'est pas une appli de suivi."
e2.q.advice: "Que dit-on à l'agent qui a reçu le colis ?"
e2.q.advice.report: "Merci de l'avoir apporté. N'installe jamais une appli hors du magasin, et rapporte tout code reçu ainsi."
e2.q.advice.check: "Scanne le code sur ton téléphone personnel, pour vérifier que c'est bien faux."
e2.q.advice.check.why: "C'est exactement ce que l'escroc attend. On ne vérifie pas un QR code en le suivant, on le lit."
e2.q.advice.bin: "Jette le colis et la carte, et n'en parle à personne pour ne pas affoler le service."
e2.q.advice.bin.why: "D'autres agents ont peut-être reçu le même colis. Le signaler, c'est ce qui permet de les prévenir."
e2.hint.read.1: "`qr decode colis/carte.png`."
e2.hint.perms.1: "`unzip -l banc/SuiviColis.apk` liste les fichiers de l'appli. Le manifeste dit ce qu'elle demande."
e2.hint.perms.2: "`unzip -p banc/SuiviColis.apk AndroidManifest.xml`, puis `answer sms`."
e2.hint.server.1: "`unzip -p banc/SuiviColis.apk classes.dex | strings` affiche les textes du code, sans l'exécuter."
e2.hint.server.2: "`answer server collecte.suivi-colis-express.example`."
e2.hint.block.1: "`contain block suivi-colis-express.example`."
e2.hint.advice.1: "On ne vérifie pas un code en le suivant, et on remercie celui qui signale."
e2.debrief.title: "Le cadeau qui lit les SMS"
e2.debrief.lesson: "Le QR code ne volait rien lui-même : il menait à une appli à installer hors du magasin. Cette appli demandait de lire les SMS et de piloter l'écran, de quoi intercepter les codes de la banque. Le colis gratuit et l'offre « 48 heures » servaient à faire scanner sans réfléchir. Le bon réflexe de l'agent a tout arrêté."
e2.debrief.p1: "On n'installe une appli que depuis le magasin officiel du téléphone. Une page qui propose de « télécharger l'appli » directement est un signal d'alarme."
e2.debrief.p2: "Une appli qui demande les SMS, l'affichage par-dessus les autres et le service d'accessibilité peut voler un code bancaire. Aucune appli de suivi de colis n'en a besoin."
e2.debrief.p3: "Bloquer le domaine au résolveur protège tous les postes d'un coup ; remercier celui qui signale fait qu'on signale encore la fois suivante."
e2.facts.title: "Ce qui s'est vraiment passé"
e2.facts.p1: "En 2025, la gendarmerie royale du Canada à Red Deer a prévenu contre un colis de luxe non commandé, accompagné d'une note demandant de scanner un QR code. Selon elle, le site au bout contenait un logiciel malveillant capable de récupérer des informations bancaires."
e2.facts.p2: "La FTC américaine a elle aussi mis en garde contre les QR codes reçus avec un colis inattendu, qui peuvent mener à un site d'hameçonnage ou à un logiciel malveillant."
e2.home.p1: "Un colis que tu n'as pas commandé, avec un code à scanner ? Ne scanne pas : le cadeau sert à te faire baisser la garde."
e2.home.p2: "N'installe jamais une appli proposée par un lien ou un QR code : passe par le magasin d'applications et cherche-la toi-même."
e2.home.p3: "Si une appli demande l'accessibilité ou l'accès aux SMS sans raison claire, refuse et désinstalle-la."
