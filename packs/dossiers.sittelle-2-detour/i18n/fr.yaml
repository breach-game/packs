s2.briefing: "Les musées de Sittelle offrent un Wi-Fi aux visiteurs, et Sittelle en tient le serveur de noms. Ce matin, des visiteurs achètent leurs billets depuis ce Wi-Fi. Son journal DNS est à toi : `soc`."
s2.obj.domain: "Trouver où sont envoyés les téléphones"
s2.obj.rule: "Écrire la règle qui repère chaque visiteur détourné"
s2.obj.cut: "Choisir comment couper le script tiers"
s2.q.domain: "Quel nom les téléphones détournés demandent-ils au serveur DNS ?"
s2.q.cut: "Le directeur veut agir aujourd'hui. Que fait-on du script tiers ?"
s2.q.cut.copy: "On sert notre propre copie vérifiée de la bibliothèque, depuis le site"
s2.q.cut.remove: "On retire la bibliothèque : tant pis pour les vieux navigateurs"
s2.q.cut.wait: "On écrit au nouveau propriétaire et on attend sa réponse"
s2.ada.brief: "Regarde ce que demandent les téléphones du Wi-Fi : `soc logs resolver dns`. La plupart cherchent la billetterie et le service tiers. Cherche ce qui ne devrait pas y être."
s2.ada.first: "Un téléphone vient de demander un nom qui n'a rien à voir avec un musée. Relis le journal."
s2.ada.g.domain: "Cherche les noms en `.example` : `soc search example`. Donne celui qui ne devrait pas être là avec `answer domain <nom>`."
s2.ada.g.domain.standard: "Trouve le nom que demandent les téléphones détournés, et donne-le avec `answer domain`."
s2.ada.domain: "Le site de paris. Juste après la billetterie et le service tiers, depuis le même téléphone. Pas tous : une fraction, comme prévu par le code."
s2.ada.g.rule: "Écris la règle dans `regles/detour.yml` : `echo \"name: paris-gagnants.example\" >> regles/detour.yml`, puis `rule test regles/detour.yml`."
s2.ada.g.rule.standard: "Écris une règle dans `regles/detour.yml` qui alerte sur chaque téléphone détourné et sur rien d'autre, puis `rule test`."
s2.ada.rule: "Chaque ligne est un visiteur détourné, depuis le Wi-Fi d'un musée. Et ceux qui étaient en 4G, on ne les verra jamais. Il faut couper à la source."
s2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
s2.ada.answer.standard: "La question du directeur t'attend."
s2.ada.copy: "Le plus propre : la bibliothèque est petite et libre, on en garde une copie vérifiée chez soi. Plus personne d'autre ne décide de ce qui tourne sur le site."
s2.ada.remove: "Efficace et immédiat. Les navigateurs récents n'en ont presque plus besoin. Quelques vieux téléphones perdront des fonctions : à surveiller."
s2.ada.wait: "C'est un choix. Mais chaque heure d'attente, ce sont d'autres visiteurs détournés, et ce propriétaire a acheté le domaine pour ça."
s2.ada.done: "Le directeur a tranché. Demain, on règle le site pour qu'un script qui change ne puisse plus s'exécuter du tout."
s2.hint.domain.1: "Parmi les noms demandés, un seul n'est ni la billetterie, ni le service tiers, ni le plan des musées."
s2.hint.domain.2: "`soc search paris`, puis `answer domain paris-gagnants.example`."
s2.hint.rule.1: "Une règle DNS se règle sur le champ `name`."
s2.hint.rule.2: "`echo \"name: paris-gagnants.example\" >> regles/detour.yml`, puis `rule test regles/detour.yml`."
s2.hint.cut.1: "Aucune réponse n'est fausse. Chacune a un coût différent."
s2.debrief.title: "Voir les victimes, couper la source"
s2.debrief.lesson: "Le site de Sittelle ne voit rien : la redirection part du navigateur du visiteur. Mais le Wi-Fi des musées voit passer le nom demandé juste après. Une règle sur ce nom compte les victimes visibles, et rappelle que les autres sont invisibles : seule la coupure à la source protège tout le monde."
s2.debrief.p1: "Un détournement côté navigateur laisse des traces ailleurs : DNS, signalements de visiteurs, rapports CSP."
s2.debrief.p2: "Une règle sur un nom précis attrape ce qu'on connaît déjà, pas la variante de demain."
s2.debrief.p3: "Servir sa propre copie vérifiée d'une bibliothèque, c'est reprendre la main sur ce qui s'exécute."
