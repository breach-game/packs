s2.briefing: "Sittelle's museums offer visitors a Wi-Fi, and Sittelle runs its name server. This morning, visitors are buying their tickets over that Wi-Fi. Its DNS log is yours: `soc`."
s2.obj.domain: "Find where the phones are sent"
s2.obj.rule: "Write the rule that spots every diverted visitor"
s2.obj.cut: "Choose how to cut the third-party script"
s2.q.domain: "Which name do the diverted phones ask the DNS server for?"
s2.q.cut: "The director wants to act today. What do we do with the third-party script?"
s2.q.cut.copy: "We serve our own checked copy of the library, from the site"
s2.q.cut.remove: "We remove the library: too bad for old browsers"
s2.q.cut.wait: "We write to the new owner and wait for their answer"
s2.ada.brief: "Look at what the Wi-Fi's phones ask for: `soc logs resolver dns`. Most look up the ticket office and the third-party service. Look for what should not be there."
s2.ada.first: "A phone just asked for a name that has nothing to do with a museum. Read the log again."
s2.ada.g.domain: "Look for names in `.example`: `soc search example`. Give the one that should not be there with `answer domain <name>`."
s2.ada.g.domain.standard: "Find the name the diverted phones ask for, and give it with `answer domain`."
s2.ada.domain: "The betting site. Right after the ticket office and the third-party service, from the same phone. Not all of them: a fraction, as the code intends."
s2.ada.g.rule: "Write the rule in `regles/detour.yml`: `echo \"name: paris-gagnants.example\" >> regles/detour.yml`, then `rule test regles/detour.yml`."
s2.ada.g.rule.standard: "Write a rule in `regles/detour.yml` that alerts on every diverted phone and nothing else, then `rule test`."
s2.ada.rule: "Each line is a diverted visitor, from a museum's Wi-Fi. And those on mobile data we will never see. It has to be cut at the source."
s2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
s2.ada.answer.standard: "The director's question is waiting."
s2.ada.copy: "The cleanest: the library is small and free, we keep a checked copy at home. Nobody else decides what runs on the site any more."
s2.ada.remove: "Effective and immediate. Recent browsers hardly need it any more. A few old phones will lose features: keep an eye on it."
s2.ada.wait: "It is a choice. But every hour of waiting means more diverted visitors, and this owner bought the domain for exactly this."
s2.ada.done: "The leak is plugged for Sittelle. Tomorrow, we set the site so that a script that changes simply cannot run."
s2.hint.domain.1: "Among the names asked for, only one is neither the ticket office, nor the third-party service, nor the museum maps."
s2.hint.domain.2: "`soc search paris`, then `answer domain paris-gagnants.example`."
s2.hint.rule.1: "A DNS rule works on the `name` field."
s2.hint.rule.2: "`echo \"name: paris-gagnants.example\" >> regles/detour.yml`, then `rule test regles/detour.yml`."
s2.hint.cut.1: "No answer is wrong. Each has a different cost."
s2.debrief.title: "See the victims, cut the source"
s2.debrief.lesson: "Sittelle's site sees nothing: the redirect leaves from the visitor's browser. But the museums' Wi-Fi sees the name looked up right after. A rule on that name counts the visible victims, and reminds you the others are invisible: only cutting at the source protects everyone."
s2.debrief.p1: "A browser-side diversion leaves traces elsewhere: DNS, visitor reports, CSP reports."
s2.debrief.p2: "A rule on a precise name catches what you already know, not tomorrow's variant."
s2.debrief.p3: "Serving your own checked copy of a library takes back control of what runs."
