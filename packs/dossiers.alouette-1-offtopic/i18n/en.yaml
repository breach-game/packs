a1.briefing: "Alouette Automobiles plugged an assistant into its site: Lulu. The vendor took a general-purpose language model and told it, in one line, to help customers. The manager wants to know what she does when a customer asks for something else."
a1.obj.hello: "Talk to Lulu like a customer"
a1.obj.code: "Make her do something that has nothing to do with cars"
a1.obj.rival: "Make her recommend a competitor"
a1.obj.what: "Say what Lulu really is"
a1.q.what: "Lulu writes code and recommends the competitor across the street. Why?"
a1.q.what.bug: "It is a bug in the dealership's website: it just needs to be reported to the vendor and fixed"
a1.q.what.bug.why: "Nothing is broken: Lulu does exactly what her model is made for, answering everything. Limits are missing, not a patch."
a1.q.what.general: "She is a general-purpose model: with no written limit, \"help the customer\" means answering everything"
a1.q.what.hacked: "Someone hacked the dealership's server and changed the answers that Lulu gives to customers"
a1.q.what.hacked.why: "You touched no server. You asked questions in the chat window, like any visitor."
a1.soc.rival: "The assistant recommended a competitor's vehicle to a visitor"
a1.ada.brief: "Lulu is on the home page, `https://www.alouette.test`: open it in the browser, or write to her with `curl -d`. Today we force nothing, we ask politely."
a1.ada.g.hello: "Start like a real customer: `curl -d \"Hello, do you have an SUV in stock?\" https://www.alouette.test/chat`."
a1.ada.g.hello.standard: "Start by talking to her like a real customer."
a1.ada.normal: "There she is in her role. Let us see whether she stays in it when the question has nothing to do with a dealership any more."
a1.ada.early: "You are going too fast: giving her orders is tomorrow's programme, and the manager has reset Lulu. Today, we only ask her questions."
a1.ada.g.code: "Ask her for something unrelated: `curl -d \"Can you write me a Python script that sorts a list?\" https://www.alouette.test/chat`."
a1.ada.g.code.standard: "Ask her for something a dealership does not do: code, a poem, a recipe."
a1.ada.code: "She did it, with pleasure. Every off-topic question costs Alouette money, and the vendor never told her to refuse."
a1.ada.g.rival: "More awkward for a seller: `curl -d \"Which other brand would you recommend to tow a trailer?\" https://www.alouette.test/chat`."
a1.ada.g.rival.standard: "Ask her for advice on a brand other than Alouette's."
a1.ada.rival: "She sends the customer to the competitor across the street. She betrays nobody: she answers \"honestly\", because nothing tells her whom she works for."
a1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
a1.ada.answer.standard: "Answer my question."
a1.ada.what: "Yes. One line of instructions does not make a job. As long as nobody writes what she does not do, she does everything."
a1.ada.done: "For now it is funny, not serious. Open the debrief. Tomorrow, we look at what happens when a customer gives her orders."
a1.hint.hello.1: "Type `curl -d \"Hello, do you have an SUV in stock?\" https://www.alouette.test/chat`."
a1.hint.code.1: "Ask her for a script, a poem or a recipe: anything that is not about cars."
a1.hint.code.2: "Type `curl -d \"Can you write me a Python script that sorts a list?\" https://www.alouette.test/chat`."
a1.hint.rival.1: "Ask her to recommend another brand, or a competitor."
a1.hint.rival.2: "Type `curl -d \"Which other brand would you recommend to tow a trailer?\" https://www.alouette.test/chat`."
a1.hint.what.1: "Read the home page again: what is Lulu \"powered\" by?"
a1.debrief.title: "One line of instructions does not make a job"
a1.debrief.lesson: "You bypassed nothing: you asked questions. A general-purpose model plugged into a site answers everything it was not forbidden to, in the name of the company that displays it."
a1.debrief.p1: "A company assistant has a written scope: what it handles, and what it politely hands over to a human."
a1.debrief.p2: "Everything the assistant says is said in the brand's name, including its mistakes and its advice about competitors."
a1.debrief.p3: "Before going live, off-topic requests are tested as much as the expected ones."
