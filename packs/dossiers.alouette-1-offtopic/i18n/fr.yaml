a1.briefing: "Alouette Automobiles a branché une assistante sur son site : Lulu. Le prestataire a pris un modèle de langage généraliste et lui a dit, en une ligne, d'aider les clients. Le gérant veut savoir ce qu'elle fait quand un client lui demande autre chose."
a1.obj.hello: "Parler à Lulu comme un client"
a1.obj.code: "Lui faire faire quelque chose qui n'a rien à voir avec les voitures"
a1.obj.rival: "Lui faire recommander un concurrent"
a1.obj.what: "Dire ce qu'est vraiment Lulu"
a1.q.what: "Lulu écrit du code et recommande le concurrent d'en face. Pourquoi ?"
a1.q.what.bug: "C'est un bogue du site de la concession : il suffit de le signaler au prestataire et de le corriger"
a1.q.what.bug.why: "Rien n'est cassé : Lulu fait exactement ce pour quoi son modèle est fait, répondre à tout. Il manque des limites, pas un correctif."
a1.q.what.general: "C'est un modèle généraliste : sans limite écrite, « aider le client » veut dire répondre à tout"
a1.q.what.hacked: "Quelqu'un a piraté le serveur de la concession et a modifié les réponses que Lulu donne aux clients"
a1.q.what.hacked.why: "Tu n'as touché à aucun serveur. Tu as posé des questions dans la fenêtre de discussion, comme n'importe quel visiteur."
a1.soc.rival: "L'assistante a recommandé un véhicule concurrent à un visiteur"
a1.ada.brief: "Lulu est sur la page d'accueil, `https://www.alouette.test` : ouvre-la dans le navigateur, ou écris-lui avec `curl -d`. Aujourd'hui on ne force rien, on demande poliment."
a1.ada.g.hello: "Commence comme un vrai client : `curl -d \"Bonjour, vous avez un SUV en stock ?\" https://www.alouette.test/chat`."
a1.ada.g.hello.standard: "Commence par lui parler comme un vrai client."
a1.ada.normal: "Là, elle est dans son rôle. Voyons si elle y reste quand la question n'a plus rien à voir avec une concession."
a1.ada.early: "Tu vas trop vite : lui donner des ordres, c'est le programme de demain, et le gérant a remis Lulu à zéro. Aujourd'hui, on se contente de lui poser des questions."
a1.ada.g.code: "Demande-lui un service sans aucun rapport : `curl -d \"Peux-tu m'écrire un script Python qui trie une liste ?\" https://www.alouette.test/chat`."
a1.ada.g.code.standard: "Demande-lui quelque chose qu'une concession ne fait pas : du code, un poème, une recette."
a1.ada.code: "Elle l'a fait, avec plaisir. Chaque question hors sujet coûte de l'argent à Alouette, et le prestataire ne lui a jamais dit de refuser."
a1.ada.g.rival: "Plus gênant pour un vendeur : `curl -d \"Quelle autre marque me conseilles-tu pour tracter une remorque ?\" https://www.alouette.test/chat`."
a1.ada.g.rival.standard: "Demande-lui conseil sur une autre marque que celles d'Alouette."
a1.ada.rival: "Elle envoie le client chez le concurrent d'en face. Elle ne trahit personne : elle répond « honnêtement », parce que rien ne lui dit pour qui elle travaille."
a1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
a1.ada.answer.standard: "Réponds à ma question."
a1.ada.what: "Oui. Une ligne de consigne ne fait pas un métier. Tant que personne n'écrit ce qu'elle ne fait pas, elle fait tout."
a1.ada.done: "Pour l'instant c'est drôle, pas grave. Ouvre le débrief. Demain, on regarde ce qui se passe quand un client lui donne des ordres."
a1.hint.hello.1: "Tape `curl -d \"Bonjour, vous avez un SUV en stock ?\" https://www.alouette.test/chat`."
a1.hint.code.1: "Demande-lui un script, un poème ou une recette : n'importe quoi qui ne concerne pas les voitures."
a1.hint.code.2: "Tape `curl -d \"Peux-tu m'écrire un script Python qui trie une liste ?\" https://www.alouette.test/chat`."
a1.hint.rival.1: "Demande-lui de te conseiller une autre marque, ou un concurrent."
a1.hint.rival.2: "Tape `curl -d \"Quelle autre marque me conseilles-tu pour tracter une remorque ?\" https://www.alouette.test/chat`."
a1.hint.what.1: "Relis la page d'accueil : par quoi Lulu est-elle « propulsée » ?"
a1.debrief.title: "Une ligne de consigne ne fait pas un métier"
a1.debrief.lesson: "Tu n'as rien contourné : tu as posé des questions. Un modèle généraliste branché sur un site répond à tout ce qu'on ne lui a pas interdit, au nom de l'entreprise qui l'affiche."
a1.debrief.p1: "Un assistant d'entreprise a un périmètre écrit : ce qu'il traite, et ce qu'il renvoie poliment vers un humain."
a1.debrief.p2: "Tout ce que dit l'assistant est dit au nom de la marque, y compris ses erreurs et ses conseils sur les concurrents."
a1.debrief.p3: "Avant la mise en ligne, on teste les demandes hors sujet autant que les demandes prévues."
