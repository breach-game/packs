e1.briefing: "Thursday 3 June, 9 am. Last night, Navette's vendor published a critical flaw in its web interface, exploited since at least Saturday. Horizon Paie keeps the payroll files of forty clients on Navette. The advisory is in `bulletin/`, the server is open to the response team: `ssh ir@navette.horizon.test`."
e1.obj.page: "Find the file the vendor did not ship"
e1.obj.account: "Find the account nobody created"
e1.obj.rule: "Write the rule that sees this page being used"
e1.obj.close: "Remove the page and disable the account"
e1.obj.patch: "Release the vendor's fix"
e1.q.page: "Which file of the www/ folder did the vendor not ship? (its name)"
e1.q.account: "Which admin account did nobody at Horizon Paie create? (its login)"
e1.contain.page: "Delete the page the vendor never shipped from the Navette server (a copy is kept for the investigation)"
e1.contain.account: "Disable the admin account nobody created"
e1.ada.brief: "Read the advisory: `cat bulletin/NAV-2027-0602.txt`. It lists three checks. Start with the first: sign in to the server and compare the www/ folder with the vendor's manifest."
e1.ada.g.page: "`ssh ir@navette.horizon.test`, then `cat /srv/navette/MANIFESTE.txt` and `ls /srv/navette/www`. The extra file: `answer page <name>`."
e1.ada.g.page.standard: "Compare what the web folder holds with what the vendor says it shipped."
e1.ada.page: "aide2.php, next to the real help page so it goes unnoticed. Look at what it says it does: it creates accounts. Second check."
e1.ada.g.account: "The list of Navette accounts: `cat /srv/navette/comptes.txt`. Look at the role and the creation time. Then `answer account <login>`."
e1.ada.g.account.standard: "Look for an admin account nobody created."
e1.ada.account: "Created on Saturday at 3:12 am, in the middle of a weekend night. The name sounds like a technical account, on purpose. Go back to your workstation with `exit`."
e1.ada.g.rule: "Someone is still using the page. Look: `soc logs navette access`. Write the rule in `regles/page-inconnue.yml`: `echo \"path: /aide2.php\" >> regles/page-inconnue.yml`, then `rule test regles/page-inconnue.yml`."
e1.ada.g.rule.standard: "Write a rule that sees every request to the unknown page, and none to the real help page."
e1.ada.again: "Your rule misses requests or alerts on the real help page, which clients read every day. Aim at the exact path."
e1.ada.rule: "It sees every request to the page, already from two addresses, and none to the real help page."
e1.ada.g.close: "Shut the door and take the key back: `contain remove page-en-trop`, then `contain disable compte-en-trop`."
e1.ada.g.close.standard: "Remove what the intruder left: the page and the account."
e1.ada.close: "Page removed, account disabled. The patch will close the flaw that let them be planted, but it would not have removed them: the advisory says so."
e1.ada.g.patch: "List the versions with `deploy`, then `deploy navette 2027.0.3`."
e1.ada.g.patch.standard: "Release the fixed version of Navette."
e1.ada.done: "Door shut. On Monday we list what left, and who must be told."
e1.hint.page.1: "The manifest lists four files. The www/ folder holds five."
e1.hint.page.2: "`answer page aide2.php`"
e1.hint.account.1: "Only one admin was created on 29 May 2027, at 3 am."
e1.hint.account.2: "`answer account sante-svc`"
e1.hint.rule.1: "The field is called `path`. With no modifier, the value must be exact."
e1.hint.rule.2: "`echo \"path: /aide2.php\" >> regles/page-inconnue.yml`"
e1.hint.close.1: "`contain remove page-en-trop`, then `contain disable compte-en-trop`."
e1.hint.patch.1: "`deploy navette 2027.0.3`"
e1.debrief.title: "The extra page"
e1.debrief.lesson: "A flaw exploited before it is published leaves traces the patch does not erase: a planted file, a created account. Knowing what the vendor shipped lets you see at once what is extra."
e1.debrief.p1: "Keep the list of shipped files and created accounts, to spot an addition at a glance."
e1.debrief.p2: "Remove what the intruder planted before or with the patch, not after: the patch shuts the door, it does not clean up."
e1.debrief.p3: "Do not expose a file transfer product to the whole internet when a list of known clients is enough."
