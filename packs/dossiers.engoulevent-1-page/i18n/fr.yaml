e1.briefing: "Jeudi 3 juin, 9 h. Hier soir, l'éditeur de Navette a publié une faille critique de son interface web, exploitée depuis au moins samedi. Horizon Paie garde sur Navette les fichiers de paie de quarante clients. Le bulletin est dans `bulletin/`, le serveur est ouvert à l'équipe de réponse : `ssh ir@navette.horizon.test`."
e1.obj.page: "Trouver le fichier que l'éditeur n'a pas livré"
e1.obj.account: "Trouver le compte que personne n'a créé"
e1.obj.rule: "Écrire la règle qui voit l'usage de cette page"
e1.obj.close: "Retirer la page et désactiver le compte"
e1.obj.patch: "Mettre en production le correctif de l'éditeur"
e1.q.page: "Quel fichier du dossier www/ l'éditeur n'a-t-il pas livré ? (son nom)"
e1.q.account: "Quel compte administrateur personne chez Horizon Paie n'a-t-il créé ? (son identifiant)"
e1.contain.page: "Supprimer aide2.php du serveur Navette (une copie est gardée pour l'enquête)"
e1.contain.account: "Désactiver le compte sante-svc"
e1.ada.brief: "Lis le bulletin : `cat bulletin/NAV-2027-0602.txt`. Il donne trois vérifications. Commence par la première : connecte-toi au serveur et compare le dossier www/ au manifeste de l'éditeur."
e1.ada.g.page: "`ssh ir@navette.horizon.test`, puis `cat /srv/navette/MANIFESTE.txt` et `ls /srv/navette/www`. Le fichier en trop : `answer page <nom>`."
e1.ada.g.page.standard: "Compare ce que contient le dossier web à ce que l'éditeur dit avoir livré."
e1.ada.page: "aide2.php, à côté de la vraie page d'aide pour passer inaperçu. Regarde ce qu'il dit faire : il crée des comptes. Deuxième vérification."
e1.ada.g.account: "La liste des comptes Navette : `cat /srv/navette/comptes.txt`. Regarde le rôle et l'heure de création. Puis `answer account <identifiant>`."
e1.ada.g.account.standard: "Cherche un compte administrateur que personne n'a créé."
e1.ada.account: "Créé samedi à 3 h 12, en pleine nuit de week-end. Le nom sonne comme un compte technique, c'est fait pour. Reviens sur ton poste avec `exit`."
e1.ada.g.rule: "Quelqu'un se sert encore de la page. Regarde : `soc logs navette access`. Écris la règle dans `regles/page-inconnue.yml` : `echo \"path: /aide2.php\" >> regles/page-inconnue.yml`, puis `rule test regles/page-inconnue.yml`."
e1.ada.g.rule.standard: "Écris une règle qui voit chaque requête vers la page inconnue, et aucune vers la vraie page d'aide."
e1.ada.again: "Ta règle rate des requêtes ou alerte sur la vraie page d'aide, que les clients lisent tous les jours. Vise le chemin exact."
e1.ada.rule: "Elle voit chaque requête vers la page, depuis deux adresses déjà, et aucune vers la vraie page d'aide. Regarde la taille de la deuxième : 50 Mo."
e1.ada.g.close: "Ferme la porte et reprends la clé : `contain remove aide2.php`, puis `contain disable sante-svc`."
e1.ada.g.close.standard: "Retire ce que l'intrus a laissé : la page et le compte."
e1.ada.close: "Page retirée, compte désactivé. Le correctif fermera la faille qui a permis de les poser, mais il ne les aurait pas enlevés : le bulletin le dit."
e1.ada.g.patch: "Liste les versions avec `deploy`, puis `deploy navette 2027.0.3`."
e1.ada.g.patch.standard: "Mets en production la version corrigée de Navette."
e1.ada.done: "Porte fermée. Lundi, on fera la liste de ce qui est sorti, et de qui doit être prévenu."
e1.hint.page.1: "Le manifeste liste quatre fichiers. Le dossier www/ en contient cinq."
e1.hint.page.2: "`answer page aide2.php`"
e1.hint.account.1: "Un seul administrateur a été créé le 29 mai 2027, à 3 h du matin."
e1.hint.account.2: "`answer account sante-svc`"
e1.hint.rule.1: "Le champ s'appelle `path`. Sans modificateur, la valeur doit être exacte."
e1.hint.rule.2: "`echo \"path: /aide2.php\" >> regles/page-inconnue.yml`"
e1.hint.close.1: "`contain remove aide2.php`, puis `contain disable sante-svc`."
e1.hint.patch.1: "`deploy navette 2027.0.3`"
e1.debrief.title: "La page de trop"
e1.debrief.lesson: "Une faille exploitée avant d'être publiée laisse des traces que le correctif n'efface pas : un fichier posé, un compte créé. Savoir ce que l'éditeur a livré permet de voir tout de suite ce qui est en trop."
e1.debrief.p1: "Garder la liste des fichiers livrés et des comptes créés, pour voir un ajout en un coup d'œil."
e1.debrief.p2: "Retirer ce que l'intrus a posé avant ou avec le correctif, pas après : le correctif ferme la porte, il ne fait pas le ménage."
e1.debrief.p3: "Ne pas exposer à tout internet un logiciel de transfert de fichiers quand une liste de clients connus suffit."
