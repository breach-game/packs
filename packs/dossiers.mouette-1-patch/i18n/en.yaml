o1.briefing: "Mouette Crédit holds the financial history of millions of people. This morning, its dispute portal was caught red-handed. Before looking for what left, find out how they got in. The portal's component list is in `portail/bom.json`, the rest in `dossier/`."
o1.obj.component: "Find the component the intruder came in through"
o1.obj.days: "Count the days between the alert and the intrusion"
o1.obj.why: "Say why the patch was never applied"
o1.q.component: "Which of the portal's components has a known critical flaw?"
o1.q.days: "How many days between the security bulletin and the intruder's first trace?"
o1.q.why: "The patch existed. Why did the portal never get it?"
o1.q.why.inventory: "Out of the inventory, its team never got the alert"
o1.q.why.nofix: "The patch had not been published yet when the intruder got in"
o1.q.why.nofix.why: "The 9 March bulletin announces the flaw with its patch. The intruder arrives on 13 May: the patch had been waiting for 65 days."
o1.q.why.tooold: "The portal was too old to receive an update"
o1.q.why.tooold.why: "Nothing says so: the fixed version is a minor update of the same branch. The problem was not technical."
o1.ada.brief: "Start with an inventory of what the portal really ships: `sbom portail`."
o1.ada.g.component: "Now compare those components with published flaws: `sbom portail --vuln`. Then `answer component <name>`."
o1.ada.g.component.standard: "Find the portal component with a published critical flaw. `answer component`."
o1.ada.scanned: "There is what no Mouette inventory said. A critical flaw, a published patch."
o1.ada.component: "fennec-web 2.5.10, while 2.5.11 fixes the flaw. Now, when did Mouette know?"
o1.ada.g.days: "Read the bulletin and the intruder's trace: `cat dossier/bulletin.eml` and `cat dossier/trace-mai.txt`. Count the days from 9 March to 13 May, then `answer days <number>`."
o1.ada.g.days.standard: "How many days did the patch wait before the intruder got in? `answer days`."
o1.ada.days: "Sixty-five days. The bulletin did go out, on time. One last question: look at who it went to."
o1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
o1.ada.answer.standard: "My question is waiting in the messenger."
o1.ada.done: "The alert went to a list, and the list did not hold the portal's team, because the portal was in no inventory. You can only patch what you know you own."
o1.hint.component.1: "`sbom portail --vuln` compares each component with published security advisories."
o1.hint.component.2: "`answer component fennec-web`"
o1.hint.days.1: "March has 31 days, April 30."
o1.hint.days.2: "22 days in March after the 9th, 30 in April, 13 in May. `answer days 65`"
o1.hint.why.1: "Read `dossier/inventaire.txt`, then the bulletin's list of recipients."
o1.debrief.title: "You can only patch what you know you own"
o1.debrief.lesson: "The patch existed, the alert went out on time. But the portal was in no inventory, so its team was not on the list, so nobody patched. A software bill of materials kept up to date would have tied the flaw to the portal the same day."
o1.debrief.p1: "Keep an inventory of applications and their components, with a bill of materials produced at each release."
o1.debrief.p2: "Send an alert to the owners drawn from the inventory, not to a mailing list."
o1.debrief.p3: "Set a deadline for critical patches, and check that it is met."
