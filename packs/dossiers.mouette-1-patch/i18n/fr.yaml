o1.briefing: "Mouette Crédit garde l'historique financier de millions de personnes. Ce matin, son portail de contestation a été pris la main dans le sac. Avant de chercher ce qui est sorti, il faut savoir par où on est entré. La liste des composants du portail est dans `portail/bom.json`, le reste dans `dossier/`."
o1.obj.component: "Trouver le composant par où l'intrus est entré"
o1.obj.days: "Compter les jours entre l'alerte et l'intrusion"
o1.obj.why: "Dire pourquoi le correctif n'a jamais été posé"
o1.q.component: "Quel composant du portail a une faille critique connue ?"
o1.q.days: "Combien de jours entre le bulletin de sécurité et la première trace de l'intrus ?"
o1.q.why: "Le correctif existait. Pourquoi le portail ne l'a-t-il jamais reçu ?"
o1.q.why.inventory: "Hors inventaire, son équipe n'a jamais eu l'alerte"
o1.q.why.nofix: "Le correctif n'était pas encore publié quand l'intrus est entré"
o1.q.why.nofix.why: "Le bulletin du 9 mars annonce la faille avec son correctif. L'intrus arrive le 13 mai : le correctif attendait depuis 65 jours."
o1.q.why.tooold: "Le portail était bien trop ancien pour recevoir la moindre mise à jour"
o1.q.why.tooold.why: "Rien ne l'indique : la version corrigée est une mise à jour mineure de la même branche. Le problème n'était pas technique."
o1.ada.brief: "Commence par l'inventaire de ce que le portail embarque vraiment : `sbom portail`."
o1.ada.g.component: "Compare maintenant ces composants aux failles publiées : `sbom portail --vuln`. Puis `answer component <nom>`."
o1.ada.g.component.standard: "Trouve le composant du portail qui a une faille critique publiée. `answer component`."
o1.ada.scanned: "Voilà ce qu'aucun inventaire de Mouette ne disait. Une faille critique, un correctif publié."
o1.ada.component: "fennec-web 2.5.10, alors que la 2.5.11 corrige la faille. Maintenant, quand Mouette l'a-t-elle su ?"
o1.ada.g.days: "Lis le bulletin et la trace de l'intrus : `cat dossier/bulletin.eml` et `cat dossier/trace-mai.txt`. Compte les jours du 9 mars au 13 mai, puis `answer days <nombre>`."
o1.ada.g.days.standard: "Combien de jours le correctif a-t-il attendu avant que l'intrus n'entre ? `answer days`."
o1.ada.days: "Soixante-cinq jours. Le bulletin est bien parti, à l'heure. Une dernière question : regarde à qui."
o1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
o1.ada.answer.standard: "Ma question t'attend dans la messagerie."
o1.ada.done: "L'alerte est partie à une liste, et la liste ne contenait pas l'équipe du portail, parce que le portail n'était dans aucun inventaire. On ne corrige que ce qu'on sait posséder."
o1.hint.component.1: "`sbom portail --vuln` compare chaque composant aux avis de sécurité publiés."
o1.hint.component.2: "`answer component fennec-web`"
o1.hint.days.1: "Mars a 31 jours, avril 30."
o1.hint.days.2: "22 jours en mars après le 9, 30 en avril, 13 en mai. `answer days 65`"
o1.hint.why.1: "Lis `dossier/inventaire.txt`, puis la liste destinataire du bulletin."
o1.debrief.title: "On ne corrige que ce qu'on sait posséder"
o1.debrief.lesson: "Le correctif existait, l'alerte est partie à l'heure. Mais le portail n'était dans aucun inventaire, donc son équipe n'était pas sur la liste, donc personne n'a corrigé. Une nomenclature logicielle tenue à jour aurait relié la faille au portail le jour même."
o1.debrief.p1: "Tenir l'inventaire des applications et de leurs composants, avec une nomenclature produite à chaque version."
o1.debrief.p2: "Envoyer une alerte aux responsables tirés de l'inventaire, pas à une liste de diffusion."
o1.debrief.p3: "Fixer un délai pour les correctifs critiques, et vérifier qu'il est tenu."
