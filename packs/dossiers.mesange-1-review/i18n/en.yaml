g1.briefing: "Banque Mésange, an online bank, moved its site to a cloud provider six months ago. Its security officer sends us the review of its configuration and one question: if something were set wrong, how far would it lead? Today you read. You touch nothing."
g1.obj.stake: "See what the bank keeps about its customers"
g1.obj.review: "Read the configuration review"
g1.obj.role: "Send the role that has rights its job does not need (`submit`)"
g1.obj.why: "Say why it is a problem"
g1.q.why: "Why is this role the one that worries us?"
g1.q.why.backup: "Because it reads every folder, like the backup role"
g1.q.why.backup.why: "The backup role reads everything because backing up everything is its job. Wide rights are not the fault: rights without a need are."
g1.q.why.crypt: "Because storage is not encrypted for it"
g1.q.why.crypt.why: "Storage is encrypted. But read the note: a role with read rights reads in clear. Encryption protects against a stolen disk, not against a role that is allowed to read."
g1.q.why.wide: "Because it can read everything while its job needs nothing, and it sits on the machine most exposed to the internet"
g1.ada.brief: "Welcome to Banque Mésange. Before the review, look at what is at stake: what does the bank ask from someone who wants a card?"
g1.ada.g.stake: "Read the card application page: `curl https://www.mesange.test/carte`."
g1.ada.g.stake.standard: "Go and see on the public site what a card application contains."
g1.ada.stake: "Name, address, date of birth, income, bank account number. Kept for years, for everyone who ever applied, accepted or not. That is what sits in storage."
g1.ada.g.review: "Now the review: `cat dossier/cloud-review.txt`."
g1.ada.g.review.standard: "Read the configuration review in your `dossier` folder."
g1.ada.review: "In the cloud, a machine has no password: it has a role, and the role says what it may touch. Compare the last two columns of the second table, line by line."
g1.ada.g.role: "One role has rights over storage while its job needs none. Send me its name with `submit`."
g1.ada.g.role.standard: "Which role has more than it needs? Send it with `submit`."
g1.ada.flag: "`role-passerelle`. The gateway filters requests: it never needs to open a card application. Yet its role can read and list every folder. Someone ticked \"all\" one day to save time."
g1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
g1.ada.answer.standard: "Answer my question."
g1.ada.why: "Yes. The gateway is the first machine a stranger talks to. Whatever it can do, someone who fools it can do."
g1.ada.done: "We have a role that is too wide, on the most exposed machine. Open the debrief. Tomorrow we check whether the gateway can be fooled."
g1.hint.stake.1: "Type `curl https://www.mesange.test/carte`."
g1.hint.review.1: "Type `cat dossier/cloud-review.txt`."
g1.hint.role.1: "In the second table, look for the line where \"needed for its job\" says none and \"storage rights\" does not."
g1.hint.role.2: "Type `submit role-passerelle`."
g1.hint.why.1: "Two roles read everything. What makes one normal and the other not?"
g1.debrief.title: "In the cloud, a setting is a wall"
g1.debrief.lesson: "Nobody broke anything: you read a table. In the cloud, what a machine may do is a line of configuration, and a line that is too generous stays invisible as long as everything goes well."
g1.debrief.p1: "A role gives rights to a machine. Whoever controls the machine, or fools it, has those rights."
g1.debrief.p2: "Least privilege: a role has what its job needs, and nothing \"just in case\"."
g1.debrief.p3: "Encryption does not protect against a role that is allowed to read."
