g1.briefing: "La Banque Mésange, une banque en ligne, a déménagé son site chez un fournisseur de cloud il y a six mois. Son responsable de la sécurité nous envoie la revue de sa configuration et une question : si quelque chose était mal réglé, jusqu'où cela mènerait-il ? Aujourd'hui, tu lis. Tu ne touches à rien."
g1.obj.stake: "Voir ce que la banque garde sur ses clients"
g1.obj.review: "Lire la revue de configuration"
g1.obj.role: "Envoyer le rôle qui a des droits dont son travail n'a pas besoin (`submit`)"
g1.obj.why: "Dire pourquoi c'est un problème"
g1.q.why: "Pourquoi est-ce ce rôle-là qui nous inquiète ?"
g1.q.why.backup: "Parce qu'il lit tous les dossiers du stockage, exactement comme le rôle de sauvegarde, qui fait donc double emploi"
g1.q.why.backup.why: "Le rôle de sauvegarde lit tout parce que tout sauvegarder est son travail. La faute n'est pas d'avoir des droits larges : c'est d'avoir des droits sans besoin."
g1.q.why.crypt: "Parce que le stockage n'est pas chiffré pour lui, alors qu'il l'est pour tous les autres rôles du compte"
g1.q.why.crypt.why: "Le stockage est chiffré. Mais relis la note : un rôle qui a le droit de lire lit en clair. Le chiffrement protège d'un disque volé, pas d'un rôle autorisé à lire."
g1.q.why.wide: "Parce qu'il peut tout lire alors que son travail ne demande rien, et qu'il est sur la machine la plus exposée à internet"
g1.ada.brief: "Bienvenue à la Banque Mésange. Avant la revue, regarde ce qui est en jeu : que demande la banque à quelqu'un qui veut une carte ?"
g1.ada.g.stake: "Lis la page de demande de carte : `curl https://www.mesange.test/carte`."
g1.ada.g.stake.standard: "Va voir sur le site public ce que contient une demande de carte."
g1.ada.stake: "Nom, adresse, date de naissance, revenus, numéro de compte. Gardés pendant des années, pour tous ceux qui ont un jour fait une demande, acceptée ou non. Voilà ce qui dort dans le stockage."
g1.ada.g.review: "Maintenant, la revue : `cat dossier/cloud-review.txt`."
g1.ada.g.review.standard: "Lis la revue de configuration dans ton dossier `dossier`."
g1.ada.review: "Dans le cloud, une machine n'a pas de mot de passe : elle a un rôle, et le rôle dit ce qu'elle a le droit de toucher. Compare les deux dernières colonnes du second tableau, ligne par ligne."
g1.ada.g.role: "Un rôle a des droits sur le stockage alors que son travail n'en demande aucun. Envoie-moi son nom avec `submit`."
g1.ada.g.role.standard: "Quel rôle a plus que ce qu'il lui faut ? Envoie-le avec `submit`."
g1.ada.flag: "`role-passerelle`. La passerelle filtre des requêtes : elle n'a jamais besoin d'ouvrir une demande de carte. Pourtant son rôle peut lire et lister tous les dossiers. Quelqu'un a coché « tout » un jour pour gagner du temps."
g1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
g1.ada.answer.standard: "Réponds à ma question."
g1.ada.why: "Oui. La passerelle est la première machine à qui un inconnu parle. Tout ce qu'elle peut faire, celui qui la trompe peut le faire."
g1.ada.done: "On a un rôle trop large, sur la machine la plus exposée. Ouvre le débrief. Demain, on vérifie si la passerelle se laisse tromper."
g1.hint.stake.1: "Tape `curl https://www.mesange.test/carte`."
g1.hint.review.1: "Tape `cat dossier/cloud-review.txt`."
g1.hint.role.1: "Dans le second tableau, cherche la ligne où « needed for its job » dit none et où « storage rights » dit autre chose."
g1.hint.role.2: "Tape `submit role-passerelle`."
g1.hint.why.1: "Deux rôles lisent tout. Qu'est-ce qui rend l'un normal et l'autre non ?"
g1.debrief.title: "Dans le cloud, un réglage est un mur"
g1.debrief.lesson: "Personne n'a rien cassé : tu as lu un tableau. Dans le cloud, ce qu'une machine a le droit de faire est une ligne de configuration, et une ligne trop généreuse reste invisible tant que tout va bien."
g1.debrief.p1: "Un rôle donne des droits à une machine. Celui qui contrôle la machine, ou qui la trompe, a ces droits."
g1.debrief.p2: "Moindre privilège : un rôle a ce que son travail demande, et rien « au cas où »."
g1.debrief.p3: "Le chiffrement ne protège pas d'un rôle qui a le droit de lire."
