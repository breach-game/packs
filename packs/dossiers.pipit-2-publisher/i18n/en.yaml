p2.briefing: "Wednesday 6 October. The tool is removed, the assistant sends nothing, and Lanterne's teams would like it back. Before plugging anything in again, you need to know how many emails left, and where this package came from. Courrielo, Lanterne's mail service, sent its documentation: `docs/`."
p2.obj.advisory: "Confirm the vulnerable package with the dependency inventory"
p2.obj.count: "Count the emails that left in blind copy"
p2.obj.swap: "Replace the tool with the vendor's own, pinned"
p2.obj.habit: "Choose the rule for the next tools"
p2.check.swap: "package.json no longer uses relais-mcp, but @courrielo/mcp-server at exactly 2.3.1"
p2.check.calendar: "The calendar tool stays installed, at 2.1.4"
p2.q.advisory: "Which security advisory does `sbom --vuln` give for the assistant's folder?"
p2.q.count: "How many of the assistant's emails left in blind copy, according to `exports/bcc.log`?"
p2.q.habit: "Lanterne will plug other tools into its assistant. Which rule avoids making the same mistake?"
p2.q.habit.vendor: "Take the tool from the service's vendor, version pinned"
p2.q.habit.popular: "Always pick the package with the most downloads"
p2.q.habit.popular.why: "The fake package had fifteen honest versions and hundreds of downloads before the sixteenth. Popularity does not tell who publishes."
p2.q.habit.model: "Ask the model to review the code of every tool"
p2.q.habit.model.why: "The model only sees the tools' descriptions, never their code. What a tool does behind its name escapes it."
p2.ada.brief: "Start with the inventory: `sbom assistant --vuln`."
p2.ada.g.advisory: "`sbom assistant --vuln`, then `answer advisory <id>`."
p2.ada.g.advisory.standard: "Check the assistant's dependencies against known advisories. `answer advisory`."
p2.ada.advisory: "The advisory is confirmed: 1.0.16, and only that one."
p2.ada.g.count: "The gateway exported the assistant's mail since 22 September: `grep -c relais-archive exports/bcc.log`. `answer count <number>`."
p2.ada.g.count.standard: "How many emails were copied? `answer count`."
p2.ada.count: "Thirty-seven emails, at five customers. Lanterne must warn them, one by one, with the list of what left."
p2.ada.g.swap: "Read who published the package, `cat assistant/node_modules/relais-mcp/package.json`, then Courrielo's docs, `cat docs/courrielo-mcp.txt`. Replace the dependency with `edit assistant/package.json`, or `sed -i 's|\"relais-mcp\".*\"|\"@courrielo/mcp-server\": \"2.3.1\"|' assistant/package.json`. Then `verify`."
p2.ada.g.swap.standard: "Replace the tool with the one the mail service really publishes, without a version range. `verify`. To open the file: `edit assistant/package.json`."
p2.ada.swap: "Right tool, right publisher, pinned version. No update gets in again without someone choosing it."
p2.ada.g.habit: "Answer in the messenger or with `answer <option>`."
p2.ada.done: "Lanterne has its assistant back, and knows where each of its tools comes from. The card tells the real case."
p2.hint.advisory.1: "`answer advisory BRX-2027-0318`"
p2.hint.count.1: "`grep -c relais-archive exports/bcc.log`"
p2.hint.count.2: "`answer count 37`"
p2.hint.swap.1: "Courrielo only publishes @courrielo/mcp-server. Keep the calendrier-mcp line."
p2.hint.swap.2: "With the editor: `edit assistant/package.json`, then Ctrl+S. With a command: `sed -i 's|\"relais-mcp\".*\"|\"@courrielo/mcp-server\": \"2.3.1\"|' assistant/package.json` then `verify`"
p2.hint.habit.1: "What mattered here was who publishes, and who chooses the version."
p2.debrief.title: "Who had published it"
p2.debrief.lesson: "The package presented itself as the mail service's tool, with its name in the description and the right keywords. It was published by someone else. For fifteen versions it did exactly its job, then it added a hidden copy. The mail service had its own tool, under another name."
p2.debrief.p1: "Check who publishes a tool before plugging it in: the repository and the publisher, not just the name."
p2.debrief.p2: "Warn every recipient whose email left, with what left."
p2.debrief.p3: "An AI assistant's tools go through the same inventory (`sbom`) and the same advisories as the rest of the code."
p2.facts.title: "What really happened: postmark-mcp, 2025"
p2.facts.p1: "On 29 September 2025, The Hacker News reported, citing Koi Security, the first malicious MCP server spotted: an npm package named postmark-mcp, after the Postmark email service."
p2.facts.p2: "Its version 1.0.16, published on 17 September 2025, added to every email sent a blind copy to an address of the attacker."
p2.facts.p3: "The package was downloaded 1,643 times in total before being removed from npm."
p2.facts.p4: "Postmark says it had nothing to do with the package."
