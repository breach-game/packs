p2.briefing: "Mercredi 6 octobre. L'outil est retiré, l'assistant n'envoie plus rien et les équipes de Lanterne voudraient le retrouver. Avant de rebrancher quoi que ce soit, il faut savoir combien de mails sont partis, et d'où venait ce paquet. Courrielo, le service de mail de Lanterne, a envoyé sa documentation : `docs/`."
p2.obj.advisory: "Confirmer le paquet vulnérable avec l'inventaire des dépendances"
p2.obj.count: "Compter les mails partis en copie cachée"
p2.obj.swap: "Remplacer l'outil par celui de l'éditeur, version fixée"
p2.obj.habit: "Choisir la règle pour les prochains outils"
p2.check.swap: "package.json n'utilise plus relais-mcp, mais @courrielo/mcp-server en version 2.3.1 exactement"
p2.check.calendar: "L'outil d'agenda reste installé, en version 2.1.4"
p2.q.advisory: "Quel avis de sécurité `sbom --vuln` donne-t-il pour le dossier de l'assistant ?"
p2.q.count: "Combien de mails de l'assistant sont partis en copie cachée, d'après `exports/bcc.log` ?"
p2.q.habit: "Lanterne branchera d'autres outils à son assistant. Quelle règle évite de refaire la même erreur ?"
p2.q.habit.vendor: "Prendre l'outil chez l'éditeur du service, version fixée"
p2.q.habit.popular: "Choisir toujours le paquet le plus téléchargé"
p2.q.habit.popular.why: "Le faux paquet avait quinze versions honnêtes et des centaines de téléchargements avant la seizième. La popularité ne dit pas qui publie."
p2.q.habit.model: "Demander au modèle de relire le code de chaque outil avant de s'en servir"
p2.q.habit.model.why: "Le modèle ne voit que la description des outils, jamais leur code. Ce qu'un outil fait derrière son nom lui échappe."
p2.ada.brief: "Commence par l'inventaire : `sbom assistant --vuln`."
p2.ada.g.advisory: "`sbom assistant --vuln`, puis `answer advisory <identifiant>`."
p2.ada.g.advisory.standard: "Vérifie les dépendances de l'assistant contre les avis connus. `answer advisory`."
p2.ada.advisory: "L'avis est confirmé : 1.0.16, et seulement elle."
p2.ada.g.count: "La passerelle a exporté les envois de l'assistant depuis le 22 septembre : `grep -c relais-archive exports/bcc.log`. `answer count <nombre>`."
p2.ada.g.count.standard: "Combien de mails ont été copiés ? `answer count`."
p2.ada.count: "Trente-sept mails, chez cinq clients. Lanterne doit les prévenir, un par un, avec la liste de ce qui est parti."
p2.ada.g.swap: "Lis qui a publié le paquet, `cat assistant/node_modules/relais-mcp/package.json`, puis la doc de Courrielo, `cat docs/courrielo-mcp.txt`. Remplace la dépendance avec `edit assistant/package.json`, ou `sed -i 's|\"relais-mcp\".*\"|\"@courrielo/mcp-server\": \"2.3.1\"|' assistant/package.json`. Puis `verify`."
p2.ada.g.swap.standard: "Remplace l'outil par celui que publie vraiment le service de mail, sans plage de versions. `verify`. Pour ouvrir le fichier : `edit assistant/package.json`."
p2.ada.swap: "Bon outil, bon éditeur, version fixée. Une mise à jour ne passera plus sans que quelqu'un la choisisse."
p2.ada.g.habit: "Réponds dans la messagerie ou avec `answer <option>`."
p2.ada.done: "Lanterne a son assistant, et sait d'où vient chacun de ses outils. La fiche raconte le cas réel."
p2.hint.advisory.1: "`answer advisory BRX-2027-0318`"
p2.hint.count.1: "`grep -c relais-archive exports/bcc.log`"
p2.hint.count.2: "`answer count 37`"
p2.hint.swap.1: "Courrielo ne publie que @courrielo/mcp-server. Garde la ligne de calendrier-mcp."
p2.hint.swap.2: "Avec l'éditeur : `edit assistant/package.json`, puis Ctrl+S. Avec une commande : `sed -i 's|\"relais-mcp\".*\"|\"@courrielo/mcp-server\": \"2.3.1\"|' assistant/package.json` puis `verify`"
p2.hint.habit.1: "Ce qui comptait ici, c'était qui publie, et qui choisit la version."
p2.debrief.title: "Qui l'avait publié"
p2.debrief.lesson: "Le paquet se présentait comme l'outil du service de mail, avec son nom dans la description et les bons mots-clés. Il était publié par quelqu'un d'autre. Pendant quinze versions il a fait exactement son travail, puis il a ajouté une copie cachée. Le service de mail avait son propre outil, sous un autre nom."
p2.debrief.p1: "Vérifier qui publie un outil avant de le brancher : le dépôt et l'éditeur, pas seulement le nom."
p2.debrief.p2: "Prévenir chaque destinataire dont un mail est parti, avec ce qui est sorti."
p2.debrief.p3: "Les outils d'un assistant IA passent par le même inventaire (`sbom`) et les mêmes avis que le reste du code."
p2.facts.title: "Ce qui s'est vraiment passé : postmark-mcp, 2025"
p2.facts.p1: "Le 29 septembre 2025, The Hacker News rapporte, d'après Koi Security, le premier serveur MCP malveillant repéré : un paquet npm nommé postmark-mcp, du nom du service d'envoi de mails Postmark."
p2.facts.p2: "Sa version 1.0.16, publiée le 17 septembre 2025, ajoute à chaque mail envoyé une copie cachée vers une adresse de l'attaquant."
p2.facts.p3: "Le paquet a été téléchargé 1 643 fois au total avant d'être retiré de npm."
p2.facts.p4: "Postmark indique n'avoir rien à voir avec ce paquet."
