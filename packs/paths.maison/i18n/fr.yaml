why.dns: "Ce qu'un nom de domaine dit de celui qui t'écrit."
why.mail: "Reconnaître un message qui n'est pas ce qu'il prétend."
why.home: "Un week-end chez une famille : la box, le Wi-Fi, la caméra, le hub, les arnaques, les comptes, et une prise trop bavarde."
why.camera: "Une caméra de salon ouverte par un mot de passe déjà utilisé ailleurs."
why.swarm: "Des milliers d'objets connectés laissés avec leur mot de passe d'usine."
why.vault: "Ce que protège vraiment un gestionnaire de mots de passe, et ce qui reste à ta charge."
why.texts: "Un SMS qui imite le service informatique, et pourquoi une clé de sécurité ne se fait pas avoir."
why.tag: "Aider quelqu'un qui se sent suivi, sans le mettre en danger."
