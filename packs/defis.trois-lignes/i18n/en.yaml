d4.briefing: "The shop team wants to merge pull request 318, \"faster invoice search\", tonight. The file is in `revue/factures.py`. Three lines must not go out."
d4.obj.review: "Point out the three faulty lines"
d4.obj.first: "Say which one to fix first"
d4.q.first: "If there is time to fix only one tonight, which one?"
d4.q.first.search: "The search: what the customer types goes into the query"
d4.q.first.key: "The export key written in clear in the source code"
d4.q.first.key.why: "Serious, but you first need access to the code. The search can be abused from any customer account."
d4.q.first.logs: "The message the search writes to the audit log"
d4.q.first.logs.why: "It only writes a customer number and a row count: nothing wrong."
d4.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d4.ada.done: "A key in the code, an invoice served to whoever asks, a query stitched together with what the customer types. Three lines, three of the most common classes of flaw."
d4.debrief.title: "Three lines"
d4.debrief.lesson: "A security review follows the data coming from outside, looks for what gives access to an object without checking whose it is, and spots secrets written in clear. Most serious flaws fit in one line."
d4.debrief.p1: "Always pass values to the database as parameters, never by pasting them into the query text."
d4.debrief.p2: "Filter every object by the session's account in the query itself."
d4.debrief.p3: "Keep secrets out of the code, in a vault, and change them if they were ever written there."
