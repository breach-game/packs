d4.briefing: "L'équipe de la boutique veut fusionner ce soir la demande n° 318, « recherche de factures plus rapide ». Le fichier est dans `revue/factures.py`. Trois lignes ne doivent pas partir."
d4.obj.review: "Désigner les trois lignes fautives"
d4.obj.first: "Dire laquelle corriger en premier"
d4.q.first: "S'il n'y a le temps d'en corriger qu'une ce soir, laquelle ?"
d4.q.first.search: "La recherche : ce que tape le client entre dans la requête"
d4.q.first.key: "La clé d'export écrite en clair dans le code source"
d4.q.first.key.why: "Grave, mais il faut d'abord accéder au code. La recherche, elle, s'exploite depuis n'importe quel compte client."
d4.q.first.logs: "Le message que la recherche écrit dans le journal d'audit à chaque fois"
d4.q.first.logs.why: "Il n'écrit qu'un numéro de client et un nombre de lignes : rien de fautif."
d4.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
d4.ada.done: "Une clé dans le code, une facture servie à qui la demande, une requête cousue avec ce que tape le client. Trois lignes, trois classes de failles parmi les plus courantes."
d4.debrief.title: "Trois lignes"
d4.debrief.lesson: "Une relecture de sécurité suit les données qui viennent de l'extérieur, cherche ce qui donne accès à un objet sans vérifier à qui il est, et repère les secrets écrits en clair. La plupart des failles graves tiennent en une ligne."
d4.debrief.p1: "Passer toujours les valeurs à la base en paramètres, jamais en les collant dans le texte de la requête."
d4.debrief.p2: "Filtrer chaque objet par le compte de la session dans la requête elle-même."
d4.debrief.p3: "Ranger les secrets hors du code, dans un coffre, et les changer s'ils y ont été écrits."
