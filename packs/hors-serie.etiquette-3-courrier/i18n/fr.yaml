e3.briefing: "Mercredi, 8 h 15. La comptabilité appelle : « On a reçu un mail du service informatique, il faut scanner un code pour garder la messagerie. C'est vous ? » Ce n'est pas nous. Le mail est dans `courrier/`, avec son image enregistrée à part. Et d'autres arrivent peut-être en ce moment."
e3.obj.read: "Lire le code du mail sans l'ouvrir"
e3.obj.sender: "Trouver le vrai domaine de l'expéditeur"
e3.obj.why: "Comprendre pourquoi le filtre l'a laissé passer"
e3.obj.block: "Bloquer l'expéditeur"
e3.obj.purge: "Retirer les mails déjà livrés"
e3.obj.detect: "Écrire la règle qui repère cette campagne"
e3.ada.brief: "Un faux « service informatique » qui demande de scanner un code. Le scanner avec son téléphone, c'est sortir du poste de la mairie et de toutes ses protections. Commence par voir ce que la mairie reçoit : `soc sources`."
e3.ada.g.read: "Lis l'image jointe sans l'ouvrir : `qr decode courrier/acces-messagerie.png`."
e3.ada.g.read.standard: "Lis le QR code joint au mail, sans l'ouvrir."
e3.ada.read: "Une page de connexion qui n'est pas la nôtre : c'est le mot de passe de la messagerie qu'on veut. Maintenant, qui l'envoie vraiment ?"
e3.ada.g.sender: "Étale les en-têtes : `mailhdr courrier/acces-messagerie.eml`. Puis `answer sender <domaine>`."
e3.ada.g.sender.standard: "Lis les en-têtes du mail et donne le vrai domaine de l'expéditeur, avec `answer sender`."
e3.ada.headers: "SPF, DKIM et DMARC passent tous. Normal : le domaine appartient bien à l'expéditeur, c'est juste qu'il n'est pas le nôtre. Donne-le avec `answer sender`."
e3.ada.headers.standard: "Regarde à quel domaine les contrôles donnent raison, et donne-le."
e3.ada.sender: "`brumevaux-mairie.example`, pas `brumevaux.test`. Réponds à ma question."
e3.ada.why: "Le filtre cherche des liens. Un lien dans une image, il ne le voit pas, et le téléphone qui la scanne n'a aucune de nos protections. C'est tout l'intérêt du QR code pour un escroc."
e3.ada.g.block: "Bloque l'expéditeur à la passerelle : `contain block expediteur-campagne`."
e3.ada.g.block.standard: "Bloque le domaine de l'expéditeur avec `contain`."
e3.ada.block: "Les prochains mails de ce domaine seront refusés. Mais ceux qui sont déjà dans les boîtes y restent."
e3.ada.g.purge: "Retire les mails déjà livrés de toutes les boîtes : `contain remove campagne-qr`."
e3.ada.g.purge.standard: "Retire des boîtes les mails déjà livrés, avec `contain`."
e3.ada.purge: "Retirés des boîtes. Pense à prévenir ceux qui les ont reçus : il faut savoir si quelqu'un a déjà scanné."
e3.ada.more: "Un nouveau mail de la campagne vient d'être livré. Bloquer l'expéditeur arrêterait la suite."
e3.ada.g.detect: "Une règle de départ t'attend. Lis le journal de la passerelle (`soc logs mx mail`), puis essaie-la : `rule test regles/qr-courrier.yml`."
e3.ada.g.detect.standard: "Lis le journal des mails, puis essaie la règle de `regles/qr-courrier.yml` et corrige-la. Pour ouvrir le fichier : `edit regles/qr-courrier.yml`."
e3.ada.g.false: "Elle sonne aussi pour le plan de la salle des fêtes qu'une collègue envoie avec une image et sans lien. Ajoute une condition sur l'expéditeur : `echo \"from|endswith: brumevaux-mairie.example\" >> regles/qr-courrier.yml`. Ou à la main, dans l'éditeur : `edit regles/qr-courrier.yml`, puis Ctrl+S."
e3.ada.g.false.standard: "Trop large : une collègue envoie aussi une image sans lien. Ajoute une condition sur l'expéditeur."
e3.ada.g.missed: "Elle rate des mails de la campagne. Relis les lignes du journal et ce qu'elles ont en commun."
e3.ada.g.missed.standard: "Elle en rate. Cherche ce que tous les mails de la campagne ont en commun."
e3.ada.detect: "La règle sonne sur chaque mail de la campagne, et sur rien d'autre. Ce domaine-là ne passera plus inaperçu."
e3.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
e3.ada.answer.standard: "Ma question t'attend dans la messagerie."
e3.ada.done: "Un mail sans lien qui passe le filtre, un domaine bloqué, des boîtes nettoyées, et une règle qui voit la suite. Débrief."
e3.contain.sender: "Bloquer le domaine qui envoie la campagne, à la passerelle de mail"
e3.ada.refused: "Un nouveau mail de la campagne vient d'être refusé à la passerelle. Le blocage tient."
e3.contain.purge: "Retirer les mails de la campagne de toutes les boîtes"
e3.q.sender: "De quel domaine vient vraiment le mail ? (le nom seul)"
e3.q.why: "Pourquoi le filtre de la mairie a-t-il laissé passer ce mail ?"
e3.q.why.image: "Il n'y a aucun lien cliquable : l'adresse est dans une image, que le filtre ne lit pas."
e3.q.why.spf: "Les contrôles SPF, DKIM et DMARC passent, donc le mail vient de la mairie."
e3.q.why.spf.why: "Ils passent pour brumevaux-mairie.example, le domaine de l'escroc. Ils prouvent qui envoie, pas que l'expéditeur est le bon."
e3.q.why.off: "Le filtre était éteint ce matin pour une mise à jour."
e3.q.why.off.why: "Le journal montre qu'il tourne : il note chaque mail et son lien. Il n'en a juste trouvé aucun."
e3.hint.read.1: "`qr decode courrier/acces-messagerie.png`."
e3.hint.sender.1: "`mailhdr courrier/acces-messagerie.eml` montre l'expéditeur et les contrôles."
e3.hint.sender.2: "`answer sender brumevaux-mairie.example`."
e3.hint.why.1: "Regarde la colonne `link=` des mails de la campagne dans `soc logs mx mail`."
e3.hint.block.1: "`contain block expediteur-campagne`."
e3.hint.purge.1: "`contain remove campagne-qr`."
e3.hint.detect.1: "`rule test regles/qr-courrier.yml` dit ce que la règle attrape et ce qu'elle rate."
e3.hint.detect.2: "Le plan de la salle des fêtes vient de `brumevaux.test`. La campagne, d'ailleurs."
e3.hint.detect.3: "`echo \"from|endswith: brumevaux-mairie.example\" >> regles/qr-courrier.yml`, puis `rule test regles/qr-courrier.yml`. Ou à la main, dans l'éditeur : `edit regles/qr-courrier.yml`, puis Ctrl+S."
e3.debrief.title: "Le lien qu'on ne voit pas"
e3.debrief.lesson: "Une passerelle de mail vérifie les liens. Un QR code dans une image n'en est pas un pour elle, et le téléphone qui le scanne sort de toutes les protections du poste de travail. Les contrôles SPF, DKIM et DMARC passaient, parce que l'escroc envoyait depuis son propre domaine. Ce qui a marché : bloquer l'expéditeur, retirer les mails livrés, et apprendre au journal à repérer la forme de la campagne."
e3.debrief.p1: "Un mail qui demande de scanner un code pour « garder un accès » est un hameçonnage, quel que soit le logo."
e3.debrief.p2: "SPF, DKIM et DMARC disent qui envoie, pas si c'est le bon. Le domaine de l'expéditeur doit être le vôtre."
e3.debrief.p3: "Bloquer l'expéditeur arrête la suite ; les mails déjà livrés se retirent à part, et ceux qui les ont reçus doivent être prévenus."
e3.home.p1: "Un mail ou un SMS qui te demande de scanner un code pour te connecter ? Va sur le site toi-même, par ton favori ou l'appli."
e3.home.p2: "Ton téléphone n'a pas les protections de ton ordinateur de travail : ce qu'on refuse de cliquer au bureau, on refuse aussi de le scanner."
