e3.briefing: "Wednesday, 8:15. Accounting calls: \"We got a mail from IT, we have to scan a code to keep our mailbox. Is that you?\" It isn't us. The mail is in `courrier/`, with its picture saved separately. And more may be arriving right now."
e3.obj.read: "Read the mail's code without opening it"
e3.obj.sender: "Find the sender's real domain"
e3.obj.why: "Understand why the filter let it through"
e3.obj.block: "Block the sender"
e3.obj.purge: "Pull the mails already delivered"
e3.obj.detect: "Write the rule that spots this campaign"
e3.ada.brief: "A fake \"IT department\" asking people to scan a code. Scanning it with a phone means stepping outside the town hall's workstation and all its protections. Start by seeing what the town hall receives: `soc sources`."
e3.ada.g.read: "Read the attached picture without opening it: `qr decode courrier/acces-messagerie.png`."
e3.ada.g.read.standard: "Read the QR code attached to the mail, without opening it."
e3.ada.read: "A sign-in page that is not ours: they want the mailbox password. Now, who really sends it?"
e3.ada.g.sender: "Spread out the headers: `mailhdr courrier/acces-messagerie.eml`. Then `answer sender <domain>`."
e3.ada.g.sender.standard: "Read the mail's headers and give the sender's real domain, with `answer sender`."
e3.ada.headers: "SPF, DKIM and DMARC all pass. Of course: the domain really belongs to the sender, it just isn't ours. Give it with `answer sender`."
e3.ada.headers.standard: "See which domain the checks vouch for, and give it."
e3.ada.sender: "`brumevaux-mairie.example`, not `brumevaux.test`. Answer my question."
e3.ada.why: "The filter looks for links. A link inside a picture is invisible to it, and the phone that scans it has none of our protections. That's the whole point of a QR code for a scammer."
e3.ada.g.block: "Block the sender at the gateway: `contain block expediteur-campagne`."
e3.ada.g.block.standard: "Block the sender's domain with `contain`."
e3.ada.block: "The next mails from that domain will be refused. But those already in the mailboxes stay there."
e3.ada.g.purge: "Pull the mails already delivered from every mailbox: `contain remove campagne-qr`."
e3.ada.g.purge.standard: "Pull the mails already delivered from the mailboxes, with `contain`."
e3.ada.purge: "Pulled from the mailboxes. Remember to tell whoever received them: we need to know if anyone already scanned."
e3.ada.more: "A new mail of the campaign was just delivered. Blocking the sender would stop the rest."
e3.ada.g.detect: "A starting rule is waiting. Read the gateway's log (`soc logs mx mail`), then try it: `rule test regles/qr-courrier.yml`."
e3.ada.g.detect.standard: "Read the mail log, then try the rule in `regles/qr-courrier.yml` and fix it. To open the file: `edit regles/qr-courrier.yml`."
e3.ada.g.false: "It also fires on the party hall plan a colleague sends with a picture and no link. Add a condition on the sender: `echo \"from|endswith: brumevaux-mairie.example\" >> regles/qr-courrier.yml`. Or by hand, in the editor: `edit regles/qr-courrier.yml`, then Ctrl+S."
e3.ada.g.false.standard: "Too wide: a colleague also sends a picture with no link. Add a condition on the sender."
e3.ada.g.missed: "It misses mails of the campaign. Read the log lines again and what they have in common."
e3.ada.g.missed.standard: "It misses some. Look for what every mail of the campaign has in common."
e3.ada.detect: "The rule fires on every mail of the campaign, and on nothing else. That domain will not slip by again."
e3.ada.answer: "Answer my question: click, or use `answer` in the terminal."
e3.ada.answer.standard: "My question is waiting in the messages."
e3.ada.done: "A mail with no link that slips past the filter, a blocked domain, cleaned mailboxes, and a rule that sees what comes next. Debrief."
e3.contain.sender: "Block the domain that sends the campaign, at the mail gateway"
e3.ada.refused: "A new mail of the campaign was just refused at the gateway. The block holds."
e3.contain.purge: "Pull the campaign's mails from every mailbox"
e3.q.sender: "Which domain does the mail really come from? (the name only)"
e3.q.why: "Why did the town hall's filter let this mail through?"
e3.q.why.image: "There's no clickable link: the address is inside a picture, which the filter does not read."
e3.q.why.spf: "SPF, DKIM and DMARC checks pass, so the mail comes from the town hall."
e3.q.why.spf.why: "They pass for brumevaux-mairie.example, the scammer's domain. They prove who sends, not that it is the right sender."
e3.q.why.off: "The filter was switched off this morning for an update."
e3.q.why.off.why: "The log shows it running: it records each mail and its link. It just found none."
e3.hint.read.1: "`qr decode courrier/acces-messagerie.png`."
e3.hint.sender.1: "`mailhdr courrier/acces-messagerie.eml` shows the sender and the checks."
e3.hint.sender.2: "`answer sender brumevaux-mairie.example`."
e3.hint.why.1: "Look at the `link=` column of the campaign's mails in `soc logs mx mail`."
e3.hint.block.1: "`contain block expediteur-campagne`."
e3.hint.purge.1: "`contain remove campagne-qr`."
e3.hint.detect.1: "`rule test regles/qr-courrier.yml` says what the rule catches and what it misses."
e3.hint.detect.2: "The party hall plan comes from `brumevaux.test`. The campaign comes from elsewhere."
e3.hint.detect.3: "`echo \"from|endswith: brumevaux-mairie.example\" >> regles/qr-courrier.yml`, then `rule test regles/qr-courrier.yml`. Or by hand, in the editor: `edit regles/qr-courrier.yml`, then Ctrl+S."
e3.debrief.title: "The link you can't see"
e3.debrief.lesson: "A mail gateway checks links. A QR code in a picture is not one to it, and the phone that scans it steps outside every protection of the workstation. SPF, DKIM and DMARC passed, because the scammer sent from their own domain. What worked: blocking the sender, pulling the delivered mails, and teaching the log to spot the campaign's shape."
e3.debrief.p1: "A mail asking you to scan a code to \"keep access\" is phishing, whatever the logo."
e3.debrief.p2: "SPF, DKIM and DMARC say who sends, not whether it is the right sender. The sender's domain must be yours."
e3.debrief.p3: "Blocking the sender stops what comes next; mails already delivered are pulled separately, and whoever received them must be told."
e3.home.p1: "A mail or a text asking you to scan a code to sign in? Go to the site yourself, through your bookmark or the app."
e3.home.p2: "Your phone does not have your work computer's protections: what you would refuse to click at the office, refuse to scan too."
