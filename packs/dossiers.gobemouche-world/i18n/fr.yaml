file.readme: "Poste Ligne Rouge. Dossier : Gobemouche. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat GO-2027-023. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT GO-2027-023\nClient : Gobemouche Ingénierie SA, bureau d'études. Périmètre : *.gobemouche.test, 10.83.0.0/24.\nObjet : ce matin, un comptable du bureau de Lille a reçu une demande de virement confidentiel au nom de la directrice financière, confirmée pendant une visioconférence où il a cru la voir avec deux collègues. Il a des doutes. Ligne Rouge vérifie la demande, arrête le paiement s'il le faut, et règle les virements pour que cela ne puisse plus arriver.\nDispositif convenu : Ligne Rouge lit le message reçu, appelle depuis le standard et accède à l'outil de paiement. Ligne Rouge ne répond pas aux escrocs.\nSigné : le directeur général de Gobemouche Ingénierie."
npc.cfo.role: "directrice financière"
npc.cfo.greeting: "Inès Garnier, j'écoute ?"
npc.cfo.transfer: "Un virement confidentiel ? Je n'ai rien demandé de tel. Je suis à Lyon depuis hier, en comité, et je n'ai participé à aucune visio ce matin. Surtout, que rien ne parte."
npc.cfo.fallback: "Pardon, je suis entre deux réunions. C'est à quel sujet ?"
