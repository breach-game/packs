file.readme: "Ligne Rouge workstation. Case file: Gobemouche. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate GO-2027-023. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE GO-2027-023\nClient: Gobemouche Ingénierie SA, an engineering firm. Scope: *.gobemouche.test, 10.83.0.0/24.\nPurpose: this morning, an accountant at the Lille office received a request for a confidential transfer in the finance director's name, confirmed during a video call where he thought he saw her with two colleagues. He has doubts. Ligne Rouge checks the request, stops the payment if needed, and sets transfers up so this cannot happen again.\nSet-up agreed: Ligne Rouge reads the message received, calls from the switchboard and has access to the payment tool. Ligne Rouge does not answer the fraudsters.\nSigned: Gobemouche Ingénierie's CEO."
npc.cfo.role: "finance director"
npc.cfo.greeting: "Inès Garnier speaking?"
npc.cfo.transfer: "A confidential transfer? I asked for nothing of the kind. I have been in Lyon since yesterday, at a board meeting, and I joined no video call this morning. Above all, make sure nothing goes out."
npc.cfo.fallback: "Sorry, I am between two meetings. What is it about?"
