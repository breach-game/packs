b1.briefing: "Monday 12 March, 9.10 am. Garance Engineering draws parts for customers who care about their drawings. This morning, around 8, a designer came across someone they did not know near the server room, in a work coat, with a badge. They said hello and went to get their coffee. The managing director has exported the door log and the badge list for you, in `acces/`."
b1.obj.held: "Find the door left open too long, and the badge that opened it"
b1.obj.what: "Say what happened at that door"
b1.obj.lost: "Find the badge that should no longer open anything"
b1.obj.cut: "Switch that badge off"
b1.q.held: "One door stayed open 41 seconds after a single badge. Which badge?"
b1.q.lost: "Which badge was refused three times at the server room?"
b1.q.what: "A single badge, a door open 41 seconds instead of 7. What happened?"
b1.q.what.behind: "Someone walked in behind an employee who held the door"
b1.q.what.cloned: "That employee's badge was copied over the weekend, then reused"
b1.q.what.cloned.why: "Nothing in the log shows it: the badge was swiped once, and its holder then went to their desk like every morning. What is abnormal is how long the door stayed open."
b1.q.what.broken: "The reader on that door broke down that very morning"
b1.q.what.broken.why: "It logs normally a minute later: 6 seconds for the next badge. The door worked. Someone kept it open."
b1.contain.badge: "Switch off the badge reported lost in the access control system"
b1.ada.brief: "A door log reads like a sign-in log: who, where, when, and what is out of the ordinary. `cat acces/journal.csv`. Look at the last column: how long the door stayed open."
b1.ada.g.held: "Read `cat acces/journal.csv`. A door usually opens for 6 to 9 seconds. Find the one that goes beyond, and answer with `answer held <badge>`."
b1.ada.g.held.standard: "Look in `acces/journal.csv` for an opening much longer than the others, and give the badge with `answer held`."
b1.ada.held: "B-0417, a designer, at 8.02 am. They come in from the car park, swipe, and the door stays open 41 seconds. One question before we go on."
b1.ada.g.what: "Answer my question: what happened at that door."
b1.ada.what: "Yes. They held the door for someone with their hands full, or in a hurry, or in a work coat. That is politeness, not a fault, and it is exactly what the person coming in counts on."
b1.ada.g.lost: "`grep \"denied\" acces/journal.csv` shows the refusals. Then look that badge up in the list: `grep \"B-0099\" acces/badges.csv`, then `answer lost <badge>`."
b1.ada.g.lost.standard: "Find the badge refused at the server room, see whose it is in `acces/badges.csv`, and answer with `answer lost`."
b1.ada.lost: "The badge of a cleaning company whose contract ended in January, reported lost on 18 February, and still active. Nobody copied it: it was lying around, and it worked. It opens the technical room, not the server room, and that is all that protected us this morning. Switch it off."
b1.ada.g.cut: "`contain` lists the measures. Here: `contain revoke badge-perdu`."
b1.ada.g.cut.standard: "Switch the badge off with `contain`."
b1.ada.cut: "Badge switched off. It should have been on 18 February, the same day. Between a loss report and switching the badge off there is one box to tick, and ticking it was nobody's job."
b1.ada.done: "A held door, a forgotten badge: two ordinary things, one after the other. The person left at 8.31 am, through the entrance, with the badge. What they did for twenty-six minutes, we are about to see: reception just called, something was found in the car park."
b1.hint.held.1: "The 08:02 line: `entree-nord`, 41 seconds."
b1.hint.held.2: "`answer held B-0417`"
b1.hint.what.1: "One badge, a long opening: someone followed. Type `answer behind`."
b1.hint.lost.1: "`grep \"denied\" acces/journal.csv`: three lines, the same badge."
b1.hint.lost.2: "`answer lost B-0099`"
b1.hint.cut.1: "`contain revoke badge-perdu`"
b1.debrief.title: "The held door"
b1.debrief.lesson: "Nobody forced anything. An employee held the door out of politeness, and a badge reported lost three weeks earlier still opened the technical room. The server room held because that badge never had a right to it."
b1.debrief.p1: "A lost or returned badge is switched off the same day, and one named person is in charge of it."
b1.debrief.p2: "A door that stays open too long should sound an alarm: it is the only signal of two people on one badge."
b1.debrief.p3: "A badge's rights follow the need: a cleaning badge does not open the server room."
