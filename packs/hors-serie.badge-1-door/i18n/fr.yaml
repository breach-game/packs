b1.briefing: "Lundi 12 mars, 9 h 10. Garance Ingénierie dessine des pièces pour des clients qui tiennent à leurs plans. Ce matin, vers 8 h, un dessinateur a croisé près de la salle des serveurs quelqu'un qu'il ne connaissait pas, en blouse, avec un badge. Il a dit bonjour et il est allé chercher son café. La gérante a exporté pour toi le journal des portes et la liste des badges, dans `acces/`."
b1.obj.held: "Trouver la porte restée ouverte trop longtemps, et le badge qui l'a ouverte"
b1.obj.what: "Dire ce qui s'est passé à cette porte"
b1.obj.lost: "Trouver le badge qui n'aurait plus dû ouvrir"
b1.obj.cut: "Désactiver ce badge"
b1.q.held: "Une porte est restée ouverte 41 secondes après un seul badge. Lequel ?"
b1.q.lost: "Quel badge a été refusé trois fois à la salle des serveurs ?"
b1.q.what: "Un seul badge, une porte ouverte 41 secondes au lieu de 7. Que s'est-il passé ?"
b1.q.what.behind: "Quelqu'un est entré derrière un employé qui tenait la porte"
b1.q.what.cloned: "Le badge de cet employé a été copié pendant le week-end, puis réutilisé"
b1.q.what.cloned.why: "Rien dans le journal ne le montre : le badge n'est passé qu'une fois, et son porteur est ensuite allé à son bureau comme tous les matins. Ce qui est anormal, c'est la durée d'ouverture."
b1.q.what.broken: "Le lecteur de cette porte est tombé en panne ce matin-là"
b1.q.what.broken.why: "Il enregistre normalement une minute plus tard : 6 secondes pour le badge suivant. La porte marchait. Quelqu'un l'a gardée ouverte."
b1.contain.badge: "Désactiver le badge déclaré perdu dans le contrôle d'accès"
b1.ada.brief: "Un journal de portes se lit comme un journal de connexions : qui, où, quand, et ce qui sort de l'ordinaire. `cat acces/journal.csv`. Regarde la dernière colonne : le temps pendant lequel la porte est restée ouverte."
b1.ada.g.held: "Lis `cat acces/journal.csv`. Une porte s'ouvre d'habitude 6 à 9 secondes. Trouve celle qui dépasse, et réponds avec `answer held <badge>`."
b1.ada.g.held.standard: "Cherche dans `acces/journal.csv` une ouverture bien plus longue que les autres, et donne le badge avec `answer held`."
b1.ada.held: "B-0417, un dessinateur, à 8 h 02. Il arrive du parking, il badge, et la porte reste ouverte 41 secondes. Une question avant d'aller plus loin."
b1.ada.g.what: "Réponds à ma question : ce qui s'est passé à cette porte."
b1.ada.what: "Oui. Il a tenu la porte à quelqu'un qui avait les mains prises, ou l'air pressé, ou une blouse. C'est de la politesse, pas une faute, et c'est exactement ce sur quoi compte celui qui entre."
b1.ada.g.lost: "`grep \"denied\" acces/journal.csv` montre les refus. Cherche ensuite ce badge dans la liste : `grep \"B-0099\" acces/badges.csv`, puis `answer lost <badge>`."
b1.ada.g.lost.standard: "Trouve le badge refusé à la salle des serveurs, regarde à qui il appartient dans `acces/badges.csv`, et réponds avec `answer lost`."
b1.ada.lost: "Le badge d'une entreprise de ménage dont le contrat s'est arrêté en janvier, déclaré perdu le 18 février, et toujours actif. Personne ne l'a copié : il traînait, et il marchait. Il ouvre le local technique, pas la salle des serveurs, et c'est tout ce qui nous a protégés ce matin. Désactive-le."
b1.ada.g.cut: "`contain` liste les mesures. Ici : `contain revoke badge-perdu`."
b1.ada.g.cut.standard: "Désactive le badge avec `contain`."
b1.ada.cut: "Badge désactivé. Il aurait dû l'être le 18 février, le jour même. Entre une déclaration de perte et la désactivation, il n'y a qu'une ligne à cocher, et personne n'était chargé de la cocher."
b1.ada.done: "Une porte tenue, un badge oublié : deux gestes ordinaires, mis bout à bout. La personne est ressortie à 8 h 31, par l'entrée, avec le badge. Ce qu'elle a fait pendant vingt-six minutes, on va le voir : l'accueil vient d'appeler, on a trouvé quelque chose sur le parking."
b1.hint.held.1: "La ligne de 08:02 : `entree-nord`, 41 secondes."
b1.hint.held.2: "`answer held B-0417`"
b1.hint.what.1: "Un badge, une longue ouverture : quelqu'un a suivi. Tape `answer behind`."
b1.hint.lost.1: "`grep \"denied\" acces/journal.csv` : trois lignes, le même badge."
b1.hint.lost.2: "`answer lost B-0099`"
b1.hint.cut.1: "`contain revoke badge-perdu`"
b1.debrief.title: "La porte tenue"
b1.debrief.lesson: "Personne n'a rien forcé. Un employé a tenu la porte par politesse, et un badge déclaré perdu trois semaines plus tôt ouvrait encore le local technique. La salle des serveurs a tenu parce que ce badge n'y avait jamais eu droit."
b1.debrief.p1: "Un badge perdu ou rendu se désactive le jour même, et quelqu'un en est nommément chargé."
b1.debrief.p2: "Une porte qui reste ouverte trop longtemps doit sonner : c'est le seul signal d'une entrée à deux."
b1.debrief.p3: "Les droits d'un badge suivent le besoin : un badge de ménage n'ouvre pas la salle des serveurs."
