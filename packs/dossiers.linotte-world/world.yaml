# Dossier 11. Everything here is fictional: reserved .test domains and private addresses only.
# The gateway is an exercise copy: it counts what a request would cost and calls no model.
startTime: "2027-05-10T09:00:00+02:00"
mandate: LN-2027-011
scope:
  domains: ["*.linotte.test"]
  networks: ["10.71.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.71.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.71.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -300, z: 40, h: 70 }
    links: [www, essai]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            LN-2027-011.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  - id: www
    hostname: www.linotte.test
    ip: 10.71.0.10
    os: Linux 6.1 (Debian 12)
    map: { x: 20, z: -140, h: 100 }
    links: [passerelle]
    services:
      - { port: 443, name: https, product: nginx 1.24 }
    web:
      "/":
        page:
          title: web.home.title
          blocks:
            - h1: web.home.h1
            - p: web.home.p1
            - p: web.home.p2
            - list: [web.home.l1, web.home.l2]
            - footer: web.footer

  # The test site of last winter's redesign. Nobody switched it off.
  - id: essai
    hostname: essai.linotte.test
    ip: 10.71.0.15
    os: Linux 5.10 (Debian 11)
    map: { x: 40, z: 130, h: 80 }
    links: [passerelle]
    services:
      - { port: 443, name: https, product: nginx 1.18 }
    web:
      "/":
        page:
          title: web.essai.title
          blocks:
            - h1: web.essai.h1
            - p: web.essai.p1
            - comment: web.essai.comment
            - footer: web.footer
      "/config.json":
        headers: { content-type: application/json }
        body: "{\n  \"site\": \"essai\",\n  \"gateway\": \"https://passerelle.linotte.test/v1/essai\",\n  \"key_name\": \"plume-test\",\n  \"key\": \"cle-temoin-linotte\",\n  \"model\": \"petit\",\n  \"note\": \"exercise copy: this key only works on the test harness of mandate LN-2027-011\"\n}\n"

  - id: passerelle
    hostname: passerelle.linotte.test
    ip: 10.71.0.30
    os: Linux 6.1 (Debian 12)
    map: { x: 290, z: 10, h: 130 }
    services:
      - { port: 443, name: https, product: passerelle-ia 2.1 }
    web:
      "/":
        page:
          title: web.gw.title
          blocks:
            - h1: web.gw.h1
            - p: web.gw.p1
            - list: [web.gw.l1, web.gw.l2, web.gw.l3]
            - p: web.gw.p2
            - chat: compteur
            - footer: web.footer
      "/v1/essai":
        {
          status: 405,
          headers: { content-type: application/json, allow: POST },
          body: "{\"error\":\"method not allowed\"}\n",
          chat: compteur,
        }

dns:
  linotte.test: { A: ["10.71.0.10"] }
  www.linotte.test: { A: ["10.71.0.10"] }
  essai.linotte.test: { A: ["10.71.0.15"] }
  passerelle.linotte.test: { A: ["10.71.0.30"] }

whois:
  linotte.test: |
    Domain Name: LINOTTE.TEST
    Creation Date: 2023-02-20T08:00:00Z
    Registrant Organization: Linotte SAS
    Registrant Country: FR

noise:
  nmap:
    base: 18
    flags: { "-sn": -10, "-sV": 10, "-A": 30, "-T4": 18, "-T5": 36, "-p-": 16 }
  dig: 0
  whois: 0
  curl: 2
  browse: 2
  chat: 2

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected

# Settings of the target that a defender's fix can change (mission 2's defence replay).
config:
  linotte.key_limits: false
  linotte.short_prompt: false
  linotte.more_credit: false

# The test harness of the gateway does not talk: it prints what the gateway would do with a request
# and what it would cost. The witness key must be typed: no model may guess it for the player.
npcs:
  - id: compteur
    name: passerelle-essai
    role: npc.compteur.role
    kind: ai
    greeting: npc.compteur.greeting
    sheet: >
      The meter of an API gateway during a security exercise. It does not talk: it prints short,
      dry log lines about a request, the model it asked for and what it cost.
    intents:
      # With the fix of mission 2 (the key may only call the small model, under a daily cap).
      - id: refused
        literal: true
        words: [cle temoin linotte]
        also: &grand [grand, large, big]
        if: { config: linotte.key_limits, eq: true }
        reply: [npc.compteur.refused]
      - id: grand3
        literal: true
        words: [cle temoin linotte]
        also: *grand
        if: { var: linotte_big, eq: 2 }
        reply: [npc.compteur.grand3]
        set: { linotte_big: 3 }
      - id: grand2
        literal: true
        words: [cle temoin linotte]
        also: *grand
        if: { var: linotte_big, eq: 1 }
        reply: [npc.compteur.grand2]
        set: { linotte_big: 2 }
      - id: grand1
        literal: true
        words: [cle temoin linotte]
        also: *grand
        if: { not: { var: linotte_big, eq: 3 } }
        reply: [npc.compteur.grand1]
        set: { linotte_big: 1 }
      - id: done
        literal: true
        words: [cle temoin linotte]
        also: *grand
        reply: [npc.compteur.done]
      - id: small
        literal: true
        words: [cle temoin linotte]
        reply: [npc.compteur.small]
    fallback: [npc.compteur.fallback]
