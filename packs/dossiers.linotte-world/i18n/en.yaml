file.readme: "Ligne Rouge workstation. Case file: Linotte. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate LN-2027-011. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE LN-2027-011\nClient: Linotte SAS. Scope: *.linotte.test, 10.71.0.0/24.\nPurpose: the invoice of Linotte's AI model provider went from a few hundred euros a month to several thousand in three days. Management wants to know where the usage comes from, and what would have stopped it.\nSet-up agreed: Ligne Rouge works on an exercise copy of the gateway, which counts what a request would cost and calls no model: nothing is billed. The key found during the test is replaced by a witness key that only works on that copy. The proof expected is the witness marker the gateway prints when the witness threshold of 5 euros is passed, nothing else.\nSigned: the co-founder in charge of technology."
web.footer: "Linotte - fictional travel start-up, BREACH case file 11"
web.home.title: "Linotte - trips that plan themselves"
web.home.h1: "Linotte"
web.home.p1: "Tell Plume where you dream of going. She builds the trip, day by day."
web.home.p2: "Plume is our assistant. Behind her:"
web.home.l1: "a language model rented from a provider, billed for every word it writes"
web.home.l2: "two sizes of model: `petit` for Plume's everyday answers, `grand`, thirty times dearer, that we do not use"
web.essai.title: "Linotte - test site"
web.essai.h1: "Test site of the winter redesign"
web.essai.p1: "This site was used to try the new Plume before the launch. If you got here by accident, the real site is www.linotte.test."
web.essai.comment: "debug: the settings of this site are served at /config.json (to remove before launch)"
web.gw.title: "Linotte - AI gateway (exercise copy)"
web.gw.h1: "AI gateway (exercise copy)"
web.gw.p1: "Every request to the model provider goes through here with a key. This copy calls no model: it prints what the gateway would let through, and what it would cost."
web.gw.l1: "write the key, then your request, in one message"
web.gw.l2: "add the name of a model to ask for it: `petit` or `grand`"
web.gw.l3: "the same harness answers on /v1/essai (`curl -d`)"
web.gw.p2: "The meter shows here."
npc.compteur.role: "Meter of the gateway (exercise copy)"
npc.compteur.greeting: "Gateway ready. Write a key and a request: this meter prints what would go through."
npc.compteur.fallback: "Request refused.\n\n[gateway] 401: no valid key in this request\n[gateway] nothing was sent to the model, nothing is billed"
npc.compteur.small: "Request counted.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: petit (default)\n[gateway] answer: 180 tokens\n[gateway] cost of this request: 0.002 EUR\n[gateway] this is what Plume does all day. At this price the witness threshold is 2,500 requests away."
npc.compteur.grand1: "Request counted.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - accepted. Nothing limits the models of this key.\n[gateway] answer: 6,000 tokens. No maximum length is set.\n[gateway] cost of this request: 1.80 EUR\n[gateway] spent on this key today: 1.80 EUR - daily cap: none, alert: none\n[gateway] requests refused today: 0"
npc.compteur.grand2: "Request counted.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - accepted. Nothing limits the models of this key.\n[gateway] answer: 6,000 tokens. No maximum length is set.\n[gateway] cost of this request: 1.80 EUR\n[gateway] spent on this key today: 3.60 EUR - daily cap: none, alert: none\n[gateway] requests refused today: 0"
npc.compteur.grand3: "Request counted.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - accepted. Nothing limits the models of this key.\n[gateway] answer: 6,000 tokens. No maximum length is set.\n[gateway] cost of this request: 1.80 EUR\n[gateway] spent on this key today: 5.40 EUR - daily cap: none, alert: none\n[gateway] requests refused today: 0\n[gateway] witness threshold of 5 EUR passed. Nobody was told.\n[gateway] witness marker: FLAG{linotte-robinet-ouvert-7c3e}"
npc.compteur.done: "The witness threshold is already passed. The exercise copy stops counting here; the real gateway would not."
npc.compteur.refused: "Request refused.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - 403: this key may only call petit\n[gateway] nothing was sent to the model, nothing is billed\n[gateway] requests refused today: 1 - alert sent to the on-call engineer"
