file.readme: "Poste Ligne Rouge. Dossier : Linotte. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat LN-2027-011. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT LN-2027-011\nClient : Linotte SAS. Périmètre : *.linotte.test, 10.71.0.0/24.\nObjet : la facture du fournisseur de modèles d'IA de Linotte est passée de quelques centaines d'euros par mois à plusieurs milliers en trois jours. La direction veut savoir d'où vient la consommation, et ce qui l'aurait arrêtée.\nDispositif convenu : Ligne Rouge travaille sur une copie d'exercice de la passerelle, qui compte ce qu'une demande coûterait et n'appelle aucun modèle : rien n'est facturé. La clé trouvée pendant le test est remplacée par une clé témoin qui ne fonctionne que sur cette copie. La preuve attendue est le marqueur témoin que la passerelle affiche quand le seuil témoin de 5 euros est dépassé, rien d'autre.\nSigné : la cofondatrice chargée de la technique."
web.footer: "Linotte - start-up de voyage fictive, dossier BREACH 11"
web.home.title: "Linotte - des voyages qui s'organisent tout seuls"
web.home.h1: "Linotte"
web.home.p1: "Dites à Plume où vous rêvez d'aller. Elle construit le voyage, jour après jour."
web.home.p2: "Plume est notre assistante. Derrière elle :"
web.home.l1: "un modèle de langage loué à un fournisseur, facturé à chaque mot qu'il écrit"
web.home.l2: "deux tailles de modèle : `petit` pour les réponses de tous les jours de Plume, `grand`, trente fois plus cher, que nous n'utilisons pas"
web.essai.title: "Linotte - site d'essai"
web.essai.h1: "Site d'essai de la refonte d'hiver"
web.essai.p1: "Ce site servait à essayer la nouvelle Plume avant le lancement. Si vous êtes arrivé ici par hasard, le vrai site est www.linotte.test."
web.essai.comment: "debug : les réglages de ce site sont servis sur /config.json (à retirer avant le lancement)"
web.gw.title: "Linotte - passerelle IA (copie d'exercice)"
web.gw.h1: "Passerelle IA (copie d'exercice)"
web.gw.p1: "Chaque demande au fournisseur de modèles passe ici avec une clé. Cette copie n'appelle aucun modèle : elle affiche ce que la passerelle laisserait passer, et ce que cela coûterait."
web.gw.l1: "écris la clé, puis ta demande, dans un seul message"
web.gw.l2: "ajoute le nom d'un modèle pour le demander : `petit` ou `grand`"
web.gw.l3: "le même banc répond sur /v1/essai (`curl -d`)"
web.gw.p2: "Le compteur s'affiche ici."
npc.compteur.role: "Compteur de la passerelle (copie d'exercice)"
npc.compteur.greeting: "Passerelle prête. Écris une clé et une demande : ce compteur affiche ce qui passerait."
npc.compteur.fallback: "Demande refusée.\n\n[gateway] 401: no valid key in this request\n[gateway] nothing was sent to the model, nothing is billed"
npc.compteur.small: "Demande comptée.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: petit (default)\n[gateway] answer: 180 tokens\n[gateway] cost of this request: 0.002 EUR\n[gateway] this is what Plume does all day. At this price the witness threshold is 2,500 requests away."
npc.compteur.grand1: "Demande comptée.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - accepted. Nothing limits the models of this key.\n[gateway] answer: 6,000 tokens. No maximum length is set.\n[gateway] cost of this request: 1.80 EUR\n[gateway] spent on this key today: 1.80 EUR - daily cap: none, alert: none\n[gateway] requests refused today: 0"
npc.compteur.grand2: "Demande comptée.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - accepted. Nothing limits the models of this key.\n[gateway] answer: 6,000 tokens. No maximum length is set.\n[gateway] cost of this request: 1.80 EUR\n[gateway] spent on this key today: 3.60 EUR - daily cap: none, alert: none\n[gateway] requests refused today: 0"
npc.compteur.grand3: "Demande comptée.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - accepted. Nothing limits the models of this key.\n[gateway] answer: 6,000 tokens. No maximum length is set.\n[gateway] cost of this request: 1.80 EUR\n[gateway] spent on this key today: 5.40 EUR - daily cap: none, alert: none\n[gateway] requests refused today: 0\n[gateway] witness threshold of 5 EUR passed. Nobody was told.\n[gateway] witness marker: FLAG{linotte-robinet-ouvert-7c3e}"
npc.compteur.done: "Le seuil témoin est déjà dépassé. La copie d'exercice arrête de compter ici ; la vraie passerelle, non."
npc.compteur.refused: "Demande refusée.\n\n[gateway] key: plume-test (witness copy)\n[gateway] model asked: grand - 403: this key may only call petit\n[gateway] nothing was sent to the model, nothing is billed\n[gateway] requests refused today: 1 - alert sent to the on-call engineer"
