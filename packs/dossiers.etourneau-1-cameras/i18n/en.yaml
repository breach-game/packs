e1.briefing: "Tuesday 19 October, 9:00. Last night, Lumen's Internet provider sent an abuse notice: since Saturday, the customer's connection has been opening telnet connections to Internet addresses, one after another. It gives 72 hours. The notice and the cameras' installation sheet are in `traces/`."
e1.obj.rule: "Write the rule that sees the cameras scanning the Internet"
e1.obj.count: "Count the infected cameras"
e1.obj.forwards: "Close the cameras' remote access"
e1.obj.reboot: "Say whether a reboot is enough"
e1.obj.passwords: "Change the factory passwords"
e1.q.count: "How many Lumen cameras open telnet connections to the Internet?"
e1.q.reboot: "The contractor asks whether simply rebooting the infected cameras would have been enough: the program only lives in memory. What do you say?"
e1.q.reboot.again: "No: same password, it is taken back within minutes"
e1.q.reboot.clean: "Yes: the program is gone and the camera is clean again"
e1.q.reboot.clean.why: "Clean for a while. But other infected machines scan the Internet nonstop with the same list of factory passwords: the camera would be taken back very quickly."
e1.q.reboot.replace: "No: the cameras must be thrown away and replaced"
e1.q.reboot.replace.why: "That is not needed here: the cameras have no hardware fault. The problem is the factory password and the access open to the Internet."
e1.contain.forwards: "Remove the telnet port forwards on the gateway (the contractor will work on site)"
e1.contain.passwords: "Reboot the cameras and give each one its own password"
e1.ada.brief: "Start with the notice and the installation sheet: `cat traces/signalement-fai.txt`, then `cat traces/installation.txt`. Then look at what goes over the telnet port: `flows --port 23`."
e1.ada.g.rule: "The cameras are 10.100.0.41 to 46. Add `echo \"src|startswith: 10.100.0.4\" >> regles/balayage.yml` and `echo \"dport: 23\" >> regles/balayage.yml`, then `rule test regles/balayage.yml`. Or by hand, in the editor: `edit regles/balayage.yml`, then Ctrl+S."
e1.ada.g.rule.standard: "Write a rule that sees every telnet connection started by a camera, and not the contractor's laptop doing maintenance on site. To open the file: `edit regles/balayage.yml`."
e1.ada.again: "Your rule misses scans or fires on ordinary activity. Look at who opens the connection: a camera, not the contractor, and to the telnet port."
e1.ada.rule: "It sees every scan and leaves the contractor and the recorder alone. How many cameras are involved?"
e1.ada.g.count: "Look at the telnet connections going out to the Internet: `flows --port 23 --dst 203.0.113`. Count the different sources, then `answer count <number>`."
e1.ada.g.count.standard: "Count the different cameras opening telnet connections to the Internet."
e1.ada.count: "Two cameras, cam-n3 and cam-n5. And look at the incoming flows: other Internet machines are trying to get into the others, through the forwards the contractor left."
e1.ada.g.forwards: "`contain block redirections-telnet`. The contractor will have to come on site: that is the price."
e1.ada.g.forwards.standard: "Close the door through which the Internet reaches the cameras' telnet."
e1.ada.forwards: "The forwards are closed: nothing gets in from the Internet any more. The contractor has a question."
e1.ada.g.reboot: "Think about what let it in, and about what is still scanning the Internet."
e1.ada.reboot: "So we reboot, and change the passwords right after."
e1.ada.g.passwords: "`contain reset cameras`."
e1.ada.g.passwords.standard: "Clean the cameras and make the list of factory passwords useless."
e1.ada.done: "The two cameras have stopped scanning, and all six have a password of their own. The provider has its answer. What is left is finding out what they were used for."
e1.hint.rule.1: "The source field is called `src`, the port field `dport`. The `|startswith` modifier aims at the start of an address."
e1.hint.rule.2: "`echo \"src|startswith: 10.100.0.4\" >> regles/balayage.yml` then `echo \"dport: 23\" >> regles/balayage.yml` Or by hand, in the editor: `edit regles/balayage.yml`, then Ctrl+S."
e1.hint.count.1: "Internet addresses in the log start with 203.0.113. The cameras with 10.100.0.4."
e1.hint.count.2: "`answer count 2`"
e1.hint.forwards.1: "`contain block redirections-telnet`"
e1.hint.passwords.1: "`contain reset cameras`"
e1.debrief.title: "The cameras"
e1.debrief.lesson: "A connected device left with its factory password and reachable from the Internet is not attacked by someone aiming at it: it is found by other infected machines trying the same short list everywhere, nonstop. Rebooting it wipes the intruder for a few minutes. Closing the access and changing the password keeps it out."
e1.debrief.p1: "Change each device's factory password at installation, with a different password per device."
e1.debrief.p2: "Never expose telnet, or any device's admin interface, to the Internet."
e1.debrief.p3: "Watch outgoing flows: a camera has no reason to contact hundreds of addresses."
