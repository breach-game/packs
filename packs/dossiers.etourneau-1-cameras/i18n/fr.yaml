e1.briefing: "Mardi 19 octobre, 9 h. Hier soir, le fournisseur d'accès de Parcs Lumen a envoyé un signalement : depuis samedi, la connexion du client ouvre des connexions telnet vers des adresses d'Internet, l'une après l'autre. Il donne 72 heures. Le signalement et la fiche d'installation des caméras sont dans `traces/`."
e1.obj.rule: "Écrire la règle qui voit les caméras qui balaient Internet"
e1.obj.count: "Compter les caméras infectées"
e1.obj.forwards: "Fermer l'accès à distance des caméras"
e1.obj.reboot: "Dire si un redémarrage suffit"
e1.obj.passwords: "Changer les mots de passe d'usine"
e1.q.count: "Combien de caméras de Parcs Lumen ouvrent des connexions telnet vers Internet ?"
e1.q.reboot: "Le prestataire propose de redémarrer les caméras infectées : le programme ne vit qu'en mémoire. Est-ce que ça suffit ?"
e1.q.reboot.again: "Non : même mot de passe, elle sera reprise en quelques minutes"
e1.q.reboot.clean: "Oui : le programme disparaît et la caméra redevient saine"
e1.q.reboot.clean.why: "Elle redevient saine pour un moment. Mais d'autres machines infectées balaient Internet sans arrêt avec la même liste de mots de passe d'usine : la caméra sera reprise très vite."
e1.q.reboot.replace: "Non : il faut jeter les caméras et en racheter"
e1.q.reboot.replace.why: "C'est inutile ici : les caméras n'ont pas de défaut matériel. Le problème, c'est le mot de passe d'usine et l'accès ouvert sur Internet."
e1.contain.forwards: "Supprimer les redirections de ports telnet sur la passerelle (le prestataire passera par le site)"
e1.contain.passwords: "Redémarrer les caméras et leur donner à chacune un mot de passe unique"
e1.ada.brief: "Commence par le signalement et la fiche d'installation : `cat traces/signalement-fai.txt`, puis `cat traces/installation.txt`. Ensuite, regarde ce qui passe sur le port telnet : `flows --port 23`."
e1.ada.g.rule: "Les caméras sont en 10.100.0.41 à 46. Ajoute `echo \"src|startswith: 10.100.0.4\" >> regles/balayage.yml` et `echo \"dport: 23\" >> regles/balayage.yml`, puis `rule test regles/balayage.yml`."
e1.ada.g.rule.standard: "Écris une règle qui voit chaque connexion telnet partie d'une caméra, et pas l'ordinateur du prestataire qui fait sa maintenance sur place."
e1.ada.again: "Ta règle rate des balayages ou alerte sur l'activité ordinaire. Regarde qui ouvre la connexion : une caméra, pas le prestataire, et vers le port telnet."
e1.ada.rule: "Elle voit chaque balayage, et laisse tranquille le prestataire et l'enregistreur. Combien de caméras sont en cause ?"
e1.ada.g.count: "Regarde les connexions telnet qui partent vers Internet : `flows --port 23 --dst 203.0.113`. Compte les sources différentes, puis `answer count <nombre>`."
e1.ada.g.count.standard: "Compte les caméras différentes qui ouvrent des connexions telnet vers Internet."
e1.ada.count: "Deux caméras, cam-n3 et cam-n5. Et regarde les flux entrants : d'autres machines d'Internet essaient d'entrer sur les autres, par les redirections que le prestataire a laissées."
e1.ada.g.forwards: "`contain block redirections-telnet`. Le prestataire devra venir sur place : c'est le prix."
e1.ada.g.forwards.standard: "Ferme la porte par laquelle Internet atteint le telnet des caméras."
e1.ada.forwards: "Les redirections sont fermées : plus rien n'entre depuis Internet. Le prestataire a une proposition."
e1.ada.g.reboot: "Pense à ce qui a permis d'entrer, et à ce qui balaie encore Internet."
e1.ada.reboot: "Alors on redémarre, et on change les mots de passe dans la foulée."
e1.ada.g.passwords: "`contain reset cameras`."
e1.ada.g.passwords.standard: "Nettoie les caméras et rends inutile la liste de mots de passe d'usine."
e1.ada.done: "Les deux caméras ont arrêté de balayer, et les six ont un mot de passe à elles. Le fournisseur d'accès a sa réponse. Reste à savoir à quoi elles ont servi."
e1.hint.rule.1: "Le champ de la source s'appelle `src`, celui du port `dport`. Le modificateur `|startswith` vise le début d'une adresse."
e1.hint.rule.2: "`echo \"src|startswith: 10.100.0.4\" >> regles/balayage.yml` puis `echo \"dport: 23\" >> regles/balayage.yml`"
e1.hint.count.1: "Les adresses d'Internet du journal commencent par 203.0.113. Les caméras par 10.100.0.4."
e1.hint.count.2: "`answer count 2`"
e1.hint.forwards.1: "`contain block redirections-telnet`"
e1.hint.passwords.1: "`contain reset cameras`"
e1.debrief.title: "Les caméras"
e1.debrief.lesson: "Un objet connecté laissé avec son mot de passe d'usine et joignable depuis Internet n'est pas attaqué par quelqu'un qui le vise : il est trouvé par d'autres machines infectées qui essaient la même petite liste partout, sans arrêt. Le redémarrer efface l'intrus pour quelques minutes. Fermer l'accès et changer le mot de passe le met dehors."
e1.debrief.p1: "Changer le mot de passe d'usine de chaque objet à l'installation, avec un mot de passe différent par objet."
e1.debrief.p2: "Ne jamais exposer telnet, ni aucune interface d'administration d'un objet, sur Internet."
e1.debrief.p3: "Surveiller les flux sortants : une caméra n'a aucune raison de contacter des centaines d'adresses."
