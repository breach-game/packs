b3.briefing: "Dernière matinée chez Bergeronnette. Le portail d'assistance garde 18 412 fichiers de diagnostic, tels quels, depuis 2023. La revue interne est dans `dossier/enquete.txt`, les réglages du portail dans `dossier/guichet.yml`. Une question d'abord : par où un intrus entrerait-il ?"
b3.obj.door: "Dire par où un intrus entrerait dans le portail"
b3.obj.scrub: "Nettoyer les fichiers à l'arrivée, et ne pas les garder"
b3.obj.account: "Ranger le compte de service"
b3.obj.bind: "Lier les sessions d'administration à leur appareil"
b3.q.door: "Lis la revue interne. Par où un intrus entrerait-il le plus sûrement ?"
b3.q.door.service: "Le compte de service, dont le mot de passe dort dans un navigateur synchronisé"
b3.q.door.agent: "Le compte d'un des 41 agents, en devinant ou en volant son mot de passe"
b3.q.door.agent.why: "Chaque agent a un second facteur. Deviner son mot de passe ne suffit pas, alors qu'un compte voisin n'en a aucun."
b3.q.door.flaw: "Une faille du logiciel guichet 5.4, encore inconnue de son éditeur à ce jour"
b3.q.door.flaw.why: "Possible, mais rien ne la montre. La revue, elle, montre un mot de passe qui sort de l'entreprise tous les soirs."
b3.check.scrub: "Les fichiers sont nettoyés à l'arrivée et ne sont plus gardés pour toujours"
b3.check.account: "Le compte de service ne lit que ce qu'il synchronise, depuis son serveur, et les profils personnels sont bloqués"
b3.check.bind: "Les sessions d'administration sont liées à leur appareil"
b3.check.works: "Le portail et son journal restent allumés"
b3.ada.brief: "Lis la revue : `cat dossier/enquete.txt`. Puis réponds-moi."
b3.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
b3.ada.answer.standard: "Ma question t'attend dans la messagerie."
b3.ada.door: "Oui. Un compte qui lit tout, sans second facteur, dont le mot de passe dort dans un navigateur qui le recopie chez quelqu'un. Personne ne l'a voulu, tout le monde l'a laissé. On règle le portail : `cat dossier/guichet.yml`."
b3.ada.g.scrub: "Premier réglage, le plus utile : le portail retire les cookies et les jetons dès qu'un fichier arrive, et ne garde rien pour toujours. Ouvre `edit dossier/guichet.yml` et écris `har_scrub: on` et `keep: 30-days`, puis `verify`."
b3.ada.g.scrub.standard: "D'abord les fichiers : qu'ils perdent leurs secrets à l'arrivée, et qu'ils ne restent pas des années. Puis `verify`. Pour ouvrir le fichier : `edit dossier/guichet.yml`."
b3.ada.scrub: "Un fichier nettoyé ne contient plus de session. Même un intrus dans le portail n'en tirerait qu'un journal."
b3.ada.g.account: "Le compte de service : qu'il ne lise que les champs qu'il synchronise (`reads: sync-only`), seulement depuis son serveur (`login_from: sync-server`), et bloque les profils personnels sur les postes (`personal_browser_profiles: blocked`). Puis `verify`."
b3.ada.g.account.standard: "Le compte de service : moins de droits, une seule origine, et plus de mots de passe qui partent vers des comptes personnels. Puis `verify`."
b3.ada.g.bind: "Dernier réglage, pour tous les clients : une session ne marche que sur l'appareil qui l'a ouverte. Écris `bind: device`, puis `verify`."
b3.ada.g.bind.standard: "Dernier réglage : qu'une session d'administration volée ne serve à rien ailleurs. Puis `verify`."
b3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
b3.ada.done: "Trois couches : le fichier ne porte plus de session, le compte qui lisait tout ne lit plus rien d'utile, et une session volée ne sort plus de son appareil. Ouvre le débrief : à la fin, le cas réel."
b3.hint.door.1: "Cherche dans la revue un compte qui lit tout et qui n'a pas de second facteur."
b3.hint.scrub.1: "Deux lignes sous `attachments` : `har_scrub` et `keep`."
b3.hint.scrub.2: "Avec l'éditeur : `edit dossier/guichet.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/har_scrub: off/har_scrub: on/\" dossier/guichet.yml` et `sed -i \"s/keep: forever/keep: 30-days/\" dossier/guichet.yml`, puis `verify`."
b3.hint.account.1: "Trois lignes : `reads` et `login_from` sous `service_account`, `personal_browser_profiles` sous `workstations`."
b3.hint.account.2: "Avec l'éditeur : `edit dossier/guichet.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/reads: everything/reads: sync-only/\" dossier/guichet.yml`, puis la même chose pour `login_from: sync-server` et `personal_browser_profiles: blocked`, puis `verify`."
b3.hint.bind.1: "La ligne `bind`, sous `admin_sessions`."
b3.hint.bind.2: "Avec l'éditeur : `edit dossier/guichet.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/bind: none/bind: device/\" dossier/guichet.yml`, puis `verify`."
b3.debrief.title: "Ce qu'on demande, on le protège"
b3.debrief.lesson: "L'assistance demandait un fichier qui contient des sessions, et le gardait tel quel. Le nettoyer à l'arrivée retire le trésor. Ranger le compte de service ferme la porte. Lier les sessions à leur appareil rend le vol inutile. Aucune des trois ne suffit seule, ensemble elles transforment une catastrophe en incident."
b3.debrief.p1: "Nettoyer les fichiers de diagnostic dès leur arrivée : cookies, en-têtes Authorization, jetons."
b3.debrief.p2: "Un compte de service n'a que les droits de son travail, une seule origine, et jamais son mot de passe dans un navigateur."
b3.debrief.p3: "Les profils personnels synchronisés n'ont rien à faire sur un poste d'entreprise : ils font sortir les mots de passe."
b3.debrief.p4: "Une session d'administration liée à son appareil ne vaut rien une fois volée."
b3.facts.title: "Ce qui s'est vraiment passé : Okta (2023)"
b3.facts.p1: "Bergeronnette n'existe pas. Le scénario s'inspire de l'intrusion révélée le 20 octobre 2023 chez Okta, un fournisseur d'identité et de connexion unique utilisé par des milliers d'entreprises."
b3.facts.p2: "Selon Okta, entre fin septembre et mi-octobre 2023, un intrus a eu accès à son système de gestion des tickets d'assistance et a consulté des fichiers joints par des clients, dont des fichiers HAR. Certains contenaient des jetons de session. Okta indique que les fichiers de 134 clients ont été consultés, et que des jetons ont servi à détourner les sessions légitimes de cinq d'entre eux."
b3.facts.p3: "Ce sont des clients qui ont donné l'alerte. BeyondTrust écrit avoir détecté le 2 octobre une tentative d'utiliser, depuis une autre machine, une session d'administrateur tirée du fichier HAR qu'elle venait d'envoyer, et l'avoir signalée à Okta."
b3.facts.p4: "D'après l'analyse publiée par Okta le 3 novembre, l'intrus est entré avec un compte de service du système d'assistance. Ses identifiants avaient été enregistrés dans le profil Google personnel d'un salarié, connecté au navigateur de son ordinateur professionnel. Le compte personnel ou l'appareil personnel du salarié a probablement été compromis."
b3.facts.p5: "Okta a annoncé avoir désactivé ce compte de service, bloqué les profils Google personnels dans le navigateur de ses ordinateurs gérés, renforcé sa détection et lié les sessions d'administration à leur emplacement réseau. Le 29 novembre, l'entreprise a ajouté que l'intrus avait aussi téléchargé un rapport contenant le nom et l'adresse e-mail de tous les utilisateurs de son système d'assistance."
b3.facts.p6: "Les trois leçons de ce dossier y sont : un fichier de diagnostic est une clé, un compte de service se protège comme un administrateur, et une session volée ne doit servir à rien ailleurs."
