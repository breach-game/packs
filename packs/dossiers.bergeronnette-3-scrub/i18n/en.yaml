b3.briefing: "Last morning at Bergeronnette. The support portal keeps 18,412 diagnostic files, as sent, since 2023. The internal review is in `dossier/enquete.txt`, the portal's settings in `dossier/guichet.yml`. One question first: where would an intruder get in?"
b3.obj.door: "Say where an intruder would get into the portal"
b3.obj.scrub: "Clean files on arrival, and do not keep them"
b3.obj.account: "Put the service account away"
b3.obj.bind: "Bind admin sessions to their device"
b3.q.door: "Read the internal review. Where would an intruder most surely get in?"
b3.q.door.service: "The service account, saved in a browser that syncs with a home computer"
b3.q.door.agent: "One of the 41 agents' accounts, by guessing or stealing its password"
b3.q.door.agent.why: "Every agent has a second factor. Guessing a password is not enough, while a nearby account has none."
b3.q.door.flaw: "A flaw in the guichet 5.4 software, still unknown to its maker"
b3.q.door.flaw.why: "Possible, but nothing shows it. The review does show a password leaving the company every evening."
b3.check.scrub: "Files are cleaned on arrival and kept 30 days"
b3.check.account: "The service account reads only what it syncs, from its server, and personal profiles are blocked"
b3.check.bind: "Admin sessions are bound to their device"
b3.check.works: "The portal and its log stay on"
b3.ada.brief: "Read the review: `cat dossier/enquete.txt`. Then answer me."
b3.ada.answer: "Answer my question: click, or use `answer` in the terminal."
b3.ada.answer.standard: "My question is waiting in the messenger."
b3.ada.door: "Yes. An account that reads everything, with no second factor, whose password sleeps in a browser that copies it to someone's home. Nobody wanted it, everybody left it. Let us set the portal right: `cat dossier/guichet.yml`."
b3.ada.g.scrub: "First setting, the most useful: the portal strips cookies and tokens as soon as a file arrives, and keeps nothing forever. Open `edit dossier/guichet.yml` and write `har_scrub: on` and `keep: 30-days`, then `verify`."
b3.ada.g.scrub.standard: "Files first: they lose their secrets on arrival, and do not stay for years. Then `verify`."
b3.ada.scrub: "A cleaned file holds no session any more. Even an intruder inside the portal would only get a log out of it."
b3.ada.g.account: "The service account: let it read only the fields it syncs (`reads: sync-only`), only from its server (`login_from: sync-server`), and block personal profiles on workstations (`personal_browser_profiles: blocked`). Then `verify`."
b3.ada.g.account.standard: "The service account: fewer rights, a single origin, and no more passwords leaving for personal accounts. Then `verify`."
b3.ada.g.bind: "Last setting, for every customer: a session only works on the device that opened it. Write `bind: device`, then `verify`."
b3.ada.g.bind.standard: "Last setting: a stolen admin session must be useless elsewhere. Then `verify`."
b3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
b3.ada.done: "Three layers: the file no longer carries a session, the account that read everything reads nothing useful, and a stolen session no longer leaves its device. Open the debrief: at the end, the real case."
b3.hint.door.1: "Look in the review for an account that reads everything and has no second factor."
b3.hint.scrub.1: "Two lines under `attachments`: `har_scrub` and `keep`."
b3.hint.scrub.2: "`sed -i \"s/har_scrub: off/har_scrub: on/\" dossier/guichet.yml` and `sed -i \"s/keep: forever/keep: 30-days/\" dossier/guichet.yml`, then `verify`."
b3.hint.account.1: "Three lines: `reads` and `login_from` under `service_account`, `personal_browser_profiles` under `workstations`."
b3.hint.account.2: "`sed -i \"s/reads: everything/reads: sync-only/\" dossier/guichet.yml`, then the same for `login_from: sync-server` and `personal_browser_profiles: blocked`, then `verify`."
b3.hint.bind.1: "The `bind` line, under `admin_sessions`."
b3.hint.bind.2: "`sed -i \"s/bind: none/bind: device/\" dossier/guichet.yml`, then `verify`."
b3.debrief.title: "What you ask for, you protect"
b3.debrief.lesson: "Support asked for a file that holds sessions, and kept it as it was. Cleaning it on arrival removes the treasure. Putting the service account away shuts the door. Binding sessions to their device makes theft useless. None of the three is enough alone; together they turn a disaster into an incident."
b3.debrief.p1: "Clean diagnostic files as soon as they arrive: cookies, Authorization headers, tokens."
b3.debrief.p2: "A service account has only the rights of its job, one origin, and never its password in a browser."
b3.debrief.p3: "Synced personal profiles have no place on a company workstation: they carry passwords out."
b3.debrief.p4: "An admin session bound to its device is worth nothing once stolen."
b3.facts.title: "What really happened: Okta (2023)"
b3.facts.p1: "Bergeronnette does not exist. The scenario is inspired by the intrusion revealed on 20 October 2023 at Okta, an identity and single sign-on provider used by thousands of companies."
b3.facts.p2: "According to Okta, between late September and mid-October 2023 an intruder had access to its support case management system and viewed files attached by customers, HAR files among them. Some held session tokens. Okta says the files of 134 customers were viewed, and that tokens were used to hijack the legitimate sessions of five of them."
b3.facts.p3: "Customers raised the alarm. BeyondTrust writes that on 2 October it detected an attempt to use, from another machine, an admin session taken from the HAR file it had just sent, and reported it to Okta."
b3.facts.p4: "According to the analysis Okta published on 3 November, the intruder got in with a service account of the support system. Its credentials had been saved in an employee's personal Google profile, signed in to the browser of their work laptop. The employee's personal account or personal device was most likely compromised."
b3.facts.p5: "Okta announced it had disabled that service account, blocked personal Google profiles in the browser of its managed laptops, strengthened its detection, and bound admin sessions to their network location. On 29 November the company added that the intruder had also downloaded a report holding the name and email address of every user of its support system."
b3.facts.p6: "The three lessons of this case file are there: a diagnostic file is a key, a service account is protected like an admin, and a stolen session must be useless elsewhere."
