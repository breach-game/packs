p2.briefing: "Vendredi, 10 h 50. Inès a collé la ligne mercredi à 14 h 12 sur le poste du guichet 02. Contremarque t'ouvre un accès en lecture seule (compte `ir`). Les mesures passent par `contain`. La page piégée est toujours en ligne : d'autres guichets pourraient tomber dans le même panneau."
p2.obj.parent: "Retrouver dans l'arbre des processus ce que la ligne collée a lancé"
p2.obj.take: "Comprendre ce que le programme installé emporte"
p2.obj.stop: "Isoler le guichet 02"
p2.obj.clean: "Retirer le programme et ce qui le relance au démarrage"
p2.obj.rule: "Écrire la règle qui voit un guichet coller la même ligne"
p2.q.parent: "Quel est le PID du processus qui a lancé syncd-helper ?"
p2.q.take: "D'après `strings`, que va chercher syncd-helper sur le poste ?"
p2.q.take.sessions: "La session Contremarque d'Inès et les cookies de son navigateur"
p2.q.take.tickets: "Les billets imprimés au guichet depuis mercredi"
p2.q.take.tickets.why: "La ligne `collect=` nomme deux choses : la session de l'outil Contremarque et le fichier de cookies de Firefox. Rien sur les billets."
p2.q.take.screen: "Des captures de l'écran du guichet, prises toutes les dix minutes"
p2.q.take.screen.why: "`every=600` dit quand il part, pas quoi. Ce qu'il emporte est sur la ligne `collect=` : session et cookies."
p2.contain.isolate: "Isoler le poste du guichet 02 du réseau (le guichet ferme une heure)"
p2.contain.clean: "Supprimer ~/.cache/syncd-helper et la ligne @reboot de la crontab d'Inès"
p2.ada.brief: "Connecte-toi au guichet : `ssh ir@guichet02.contremarque.test`. Puis `ps -ef` : la colonne PPID dit qui a lancé qui."
p2.ada.g.parent: "Sur le poste, `ps -ef`. Trouve syncd-helper, lis son PPID, et remonte : `answer parent <pid>`."
p2.ada.g.parent.standard: "Remonte l'arbre des processus depuis le programme suspect. `answer parent`."
p2.ada.parent: "gnome-terminal, puis bash, puis `cm-verif --silent --from …` : c'est la ligne collée mercredi, qui a lancé syncd-helper. Le terminal est encore ouvert depuis."
p2.ada.g.take: "`strings /home/ines/.cache/syncd-helper`, puis réponds."
p2.ada.g.take.standard: "Lis le programme sans le lancer avant de répondre."
p2.ada.take: "Sa session et ses cookies : de quoi ouvrir le back-office de la billetterie sans mot de passe. Il faudra fermer ses sessions, Contremarque s'en charge. Regarde aussi `crontab -l -u ines`."
p2.ada.g.stop: "Quitte le poste avec `exit`, puis `contain isolate guichet02`."
p2.ada.g.stop.standard: "Coupe le poste du réseau. `contain` pour la liste des mesures."
p2.ada.stop: "Guichet 02 isolé. Le programme ne parle plus à personne. Mais il reviendrait au prochain démarrage."
p2.ada.g.clean: "`crontab -l -u ines` sur le poste montre une ligne @reboot. Puis `contain remove syncd-helper`."
p2.ada.g.clean.standard: "Retire le programme et ce qui le relance. `contain`."
p2.ada.clean: "Programme supprimé, ligne @reboot retirée. Le poste peut revenir après une réinstallation propre."
p2.ada.others: "Deux autres guichets viennent de lancer `cm-verif --from`. Le 05 et le 07. Il nous faut une alerte, maintenant."
p2.ada.g.rule: "Lis le journal d'audit : `soc logs guichet05 audit`. `cm-verif` tourne toute la journée, ce qui change c'est `--from`. Ajoute une ligne à `regles/collage.yml` avec `edit regles/collage.yml` (ou `echo \"cmd|contains: --from\" >> regles/collage.yml`), puis `rule test regles/collage.yml`."
p2.ada.g.rule.standard: "Écris dans `regles/collage.yml` une règle qui voit la ligne collée et pas l'usage normal de l'outil, puis `rule test`. Pour ouvrir le fichier : `edit regles/collage.yml`."
p2.ada.rule: "La règle voit les guichets 05 et 07, et aucune vérification normale. Contremarque appelle Lucas et Sarah."
p2.ada.done: "Un guichet nettoyé, deux autres repérés. Tant que la page est en ligne, ça recommencera. Prochaine étape : fermer la porte du site."
p2.hint.parent.1: "Dans `ps -ef`, la ligne de syncd-helper a PPID 2231."
p2.hint.parent.2: "`answer parent 2231`"
p2.hint.take.1: "La ligne `collect=` du programme."
p2.hint.stop.1: "`exit`, puis `contain isolate guichet02`"
p2.hint.clean.1: "`crontab -l -u ines` : `@reboot /home/ines/.cache/syncd-helper`."
p2.hint.clean.2: "`contain remove syncd-helper`"
p2.hint.rule.1: "Une règle `exe|endswith: cm-verif` alerterait sur chaque billet vérifié. Cherche l'option."
p2.hint.rule.2: "`echo \"cmd|contains: --from\" >> regles/collage.yml` puis `rule test regles/collage.yml` Ou à la main, dans l'éditeur : `edit regles/collage.yml`, puis Ctrl+S."
p2.debrief.title: "Le guichet d'après"
p2.debrief.lesson: "La ligne collée a lancé le vrai outil de Contremarque, avec une option qui va chercher sa mise à jour ailleurs. Ce qu'il a installé emportait la session d'Inès et revenait à chaque démarrage par la crontab. L'arbre des processus racontait tout : un terminal, un shell, la ligne collée, puis le programme."
p2.debrief.p1: "Remonter la colonne PPID de `ps -ef` jusqu'au premier maillon : ici, un terminal ouvert à la main."
p2.debrief.p2: "Après un vol de session, fermer les sessions et changer le mot de passe : isoler le poste ne suffit pas."
p2.debrief.p3: "Alerter sur ce qui change l'usage d'un outil connu (`--from`), pas sur l'outil lui-même."
