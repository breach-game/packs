p2.briefing: "Friday, 10:50. Ines pasted the line on Wednesday at 14:12 on the box office 02 workstation. Contremarque gives you read-only access (account `ir`). Measures go through `contain`. The trapped page is still online: other box offices could fall for it too."
p2.obj.parent: "Find in the process tree what the pasted line started"
p2.obj.take: "Understand what the installed program takes"
p2.obj.stop: "Isolate box office 02"
p2.obj.clean: "Remove the program and what restarts it at boot"
p2.obj.rule: "Write the rule that sees a box office paste the same line"
p2.q.parent: "What is the PID of the process that started syncd-helper?"
p2.q.take: "According to `strings`, what does syncd-helper collect on the workstation?"
p2.q.take.sessions: "Ines's Contremarque session and her browser cookies"
p2.q.take.tickets: "The tickets printed at the box office since Wednesday"
p2.q.take.tickets.why: "The `collect=` line names two things: the Contremarque tool's session and Firefox's cookie file. Nothing about tickets."
p2.q.take.screen: "Screenshots of the box office screen every ten minutes"
p2.q.take.screen.why: "`every=600` says when it leaves, not what. What it takes is on the `collect=` line: session and cookies."
p2.contain.isolate: "Isolate the box office 02 workstation from the network (the box office closes for an hour)"
p2.contain.clean: "Delete ~/.cache/syncd-helper and the @reboot line of Ines's crontab"
p2.ada.brief: "Sign in to the box office: `ssh ir@guichet02.contremarque.test`. Then `ps -ef`: the PPID column says who started whom."
p2.ada.g.parent: "On the workstation, `ps -ef`. Find syncd-helper, read its PPID, and climb: `answer parent <pid>`."
p2.ada.g.parent.standard: "Climb the process tree from the suspicious program. `answer parent`."
p2.ada.parent: "gnome-terminal, then bash, then `cm-verif --silent --from …`: the line pasted on Wednesday, which started syncd-helper. The terminal has been open ever since."
p2.ada.g.take: "`strings /home/ines/.cache/syncd-helper`, then answer."
p2.ada.g.take.standard: "Read the program without running it before you answer."
p2.ada.take: "Her session and cookies: enough to open the ticket office back end without a password. Her sessions must be closed, Contremarque is on it. Look at `crontab -l -u ines` too."
p2.ada.g.stop: "Leave the workstation with `exit`, then `contain isolate guichet02`."
p2.ada.g.stop.standard: "Cut the workstation off the network. `contain` lists the measures."
p2.ada.stop: "Box office 02 isolated. The program talks to nobody now. But it would come back at the next boot."
p2.ada.g.clean: "`crontab -l -u ines` on the workstation shows an @reboot line. Then `contain remove syncd-helper`."
p2.ada.g.clean.standard: "Remove the program and what restarts it. `contain`."
p2.ada.clean: "Program deleted, @reboot line removed. The workstation can come back after a clean reinstall."
p2.ada.others: "Two other box offices just ran `cm-verif --from`. 05 and 07. We need an alert, now."
p2.ada.g.rule: "Read the audit log: `soc logs guichet05 audit`. `cm-verif` runs all day long, what changes is `--from`. Add a line to `regles/collage.yml` with `edit regles/collage.yml` (or `echo \"cmd|contains: --from\" >> regles/collage.yml`), then `rule test regles/collage.yml`."
p2.ada.g.rule.standard: "Write in `regles/collage.yml` a rule that sees the pasted line and not the tool's normal use, then `rule test`. To open the file: `edit regles/collage.yml`."
p2.ada.rule: "The rule sees box offices 05 and 07, and no normal check. Contremarque is calling Lucas and Sarah."
p2.ada.done: "One box office cleaned, two more spotted. As long as the page is online, it will happen again. Next step: close the site's door."
p2.hint.parent.1: "In `ps -ef`, the syncd-helper line has PPID 2231."
p2.hint.parent.2: "`answer parent 2231`"
p2.hint.take.1: "The program's `collect=` line."
p2.hint.stop.1: "`exit`, then `contain isolate guichet02`"
p2.hint.clean.1: "`crontab -l -u ines`: `@reboot /home/ines/.cache/syncd-helper`."
p2.hint.clean.2: "`contain remove syncd-helper`"
p2.hint.rule.1: "A rule `exe|endswith: cm-verif` would alert on every ticket checked. Look for the option."
p2.hint.rule.2: "`echo \"cmd|contains: --from\" >> regles/collage.yml` then `rule test regles/collage.yml` Or by hand, in the editor: `edit regles/collage.yml`, then Ctrl+S."
p2.debrief.title: "The box office after"
p2.debrief.lesson: "The pasted line started Contremarque's real tool, with an option that fetches its update from elsewhere. What it installed took Ines's session and came back at every boot through the crontab. The process tree told the whole story: a terminal, a shell, the pasted line, then the program."
p2.debrief.p1: "Climb the PPID column of `ps -ef` to the first link: here, a terminal opened by hand."
p2.debrief.p2: "After a session theft, close the sessions and change the password: isolating the workstation is not enough."
p2.debrief.p3: "Alert on what changes the use of a known tool (`--from`), not on the tool itself."
