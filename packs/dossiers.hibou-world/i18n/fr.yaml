file.readme: "Poste Ligne Rouge. Dossier : Hibou. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT CT-2028-031\nClient : Clinique des Tilleuls. Périmètre : *.tilleuls.test, *.vigie.test, 10.107.0.0/24.\nObjet : le fabricant des caméras de la clinique, Vigie, annonce une intrusion dans son cloud. Ligne Rouge aide la clinique à mesurer ce qui a été exposé et à s'en protéger. Vigie a accepté que les représentants de ses clients relisent la configuration de son accès de support.\nCadre convenu : défense seulement. Lecture des documents fournis, mesures validées par la direction et passées par `contain`. Aucune caméra n'est consultée, aucune connexion à la console de Vigie.\nSigné : la directrice de la Clinique des Tilleuls."
ada.outOfScope: "Stop. Cette cible est hors du mandat CT-2028-031. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
