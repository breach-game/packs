file.readme: "Ligne Rouge workstation. Case file: Hibou. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE CT-2028-031\nClient: Tilleuls Clinic. Scope: *.tilleuls.test, *.vigie.test, 10.107.0.0/24.\nPurpose: Vigie, the maker of the clinic's cameras, announces an intrusion into its cloud. Ligne Rouge helps the clinic measure what was exposed and protect itself. Vigie has agreed that its customers' representatives may review the configuration of its support access.\nAgreed set-up: defence only. Reading the documents provided, measures approved by management and run through `contain`. No camera is looked at, no sign-in to Vigie's console.\nSigned: the director of Tilleuls Clinic."
ada.outOfScope: "Stop. This target is outside mandate CT-2028-031. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
