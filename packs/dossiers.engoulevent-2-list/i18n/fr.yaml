e2.briefing: "Lundi 5 juin. La page est retirée, le compte désactivé, Navette corrigé. Ce matin, la direction a reçu un message. Avant d'y répondre, il faut savoir exactement ce qui est sorti. Le journal d'audit de Navette et le message sont dans `traces/`."
e2.obj.clients: "Compter les clients dont les fichiers sont sortis"
e2.obj.people: "Compter les salariés concernés"
e2.obj.notify: "Dire qui doit prévenir qui"
e2.obj.ransom: "Décider de la réponse au message"
e2.obj.week: "Remettre la semaine dans l'ordre"
e2.q.clients: "Combien de clients ont eu des fichiers téléchargés par le compte de l'intrus ? (un nombre)"
e2.q.people: "Combien de salariés différents ces fichiers concernent-ils ? (un nombre)"
e2.q.notify: "Horizon Paie traite ces fiches de paie pour le compte de ses clients. Que fait-elle maintenant ?"
e2.q.notify.tell: "Prévenir chaque client touché sans attendre, avec la liste"
e2.q.notify.later: "Attendre la fin de l'enquête pour prévenir avec une liste sûre"
e2.q.notify.later.why: "Les clients sont responsables des données de leurs salariés et ont 72 heures pour prévenir l'autorité. Un prestataire doit les avertir sans délai, quitte à compléter ensuite."
e2.q.notify.announce: "Publier un communiqué et laisser les clients l'apprendre"
e2.q.notify.announce.why: "Les clients apprendraient par la presse qu'il s'agit de leurs salariés. C'est à eux qu'Horizon Paie doit l'information en premier, avec le détail."
e2.q.ransom: "Le message réclame de l'argent pour ne pas publier. Que recommandes-tu à la direction ?"
e2.q.ransom.refuse: "Ne pas payer : prévenir clients, autorités et police"
e2.q.ransom.refuse.why: "Les fichiers peuvent être publiés malgré tout, et il faudra l'assumer. Mais les clients sont prévenus, la plainte est déposée, et rien ne finance la prochaine campagne."
e2.q.ransom.payup: "Payer pour éviter la publication"
e2.q.ransom.payup.why: "Rien ne garantit que les copies seront effacées, ni qu'elles ne seront pas revendues. Le paiement finance la prochaine campagne, et les clients doivent être prévenus quand même."
e2.q.ransom.silence: "Ne pas répondre et attendre de voir"
e2.q.ransom.silence.why: "Attendre sans prévenir laisse les clients découvrir la fuite par les voleurs eux-mêmes, qui annoncent qu'ils leur écriront."
e2.tl.text: "La semaine de Navette"
e2.tl.account: "Un compte administrateur est créé en pleine nuit"
e2.tl.downloads: "Les fichiers de quatre clients sont téléchargés"
e2.tl.advisory: "L'éditeur publie la faille et son correctif"
e2.tl.removed: "La page et le compte sont retirés, Navette est corrigé"
e2.tl.message: "La direction reçoit la demande de rançon"
e2.ada.brief: "Lis le journal d'audit : `cat traces/navette-audit.log`. Seules comptent les actions du compte de l'intrus : `grep sante-svc traces/navette-audit.log`."
e2.ada.g.clients: "Compte les dossiers clients différents téléchargés par sante-svc, puis `answer clients <nombre>`."
e2.ada.g.clients.standard: "Compte les clients dont le compte de l'intrus a téléchargé des fichiers."
e2.ada.clients: "Quatre sur six. Orme et Garance n'apparaissent que dans des actions de leurs propres comptes : ils ne sont pas touchés."
e2.ada.g.people: "Additionne les lignes des fichiers téléchargés, mais attention : chez Pradelles, deux mois de paie concernent les mêmes salariés. Puis `answer people <nombre>`."
e2.ada.g.people.standard: "Compte les salariés différents dans les fichiers sortis. Un salarié présent dans deux fichiers ne compte qu'une fois."
e2.ada.people: "2 487 personnes, dont les noms, adresses, coordonnées bancaires et salaires sont désormais ailleurs. Maintenant, qui prévient qui ?"
e2.ada.g.notify: "Réfléchis à qui est responsable de ces données."
e2.ada.notify: "Les quatre clients sont prévenus ce matin, chacun avec sa liste. Reste le message de cette nuit : `cat traces/message-recu.txt`."
e2.ada.g.ransom: "Aucune mauvaise réponse ici, seulement un coût. Choisis."
e2.ada.ransom: "Noté. Dernière chose pour le rapport : la semaine dans l'ordre, avec `timeline semaine`."
e2.ada.g.week: "Affiche les événements avec `timeline semaine`, puis classe-les du plus ancien au plus récent : `timeline semaine <id> <id>…`."
e2.ada.g.week.standard: "Mets la semaine dans l'ordre avec `timeline semaine`."
e2.ada.done: "Dossier clos. Une faille de quelques jours chez un prestataire, et ce sont les salariés de quatre autres entreprises qui la paient."
e2.hint.clients.1: "Dossiers téléchargés par sante-svc : mercier, saules, pradelles, lazare."
e2.hint.clients.2: "`answer clients 4`"
e2.hint.people.1: "812 + 140 + 1 230 + 305 : les deux fichiers de Pradelles ont les mêmes 1 230 salariés."
e2.hint.people.2: "`answer people 2487`"
e2.hint.week.1: "Samedi 3 h 12, samedi à lundi, mercredi soir, jeudi matin, ce lundi."
e2.hint.week.2: "`timeline semaine account downloads advisory removed message`"
e2.debrief.title: "La liste"
e2.debrief.lesson: "Quand un prestataire est touché, les victimes sont les clients de ses clients. Le journal d'audit permet de dire exactement qui, et un prestataire doit prévenir ses clients sans attendre, avec cette liste, pour qu'ils puissent prévenir à leur tour."
e2.debrief.p1: "Garder un journal d'audit des téléchargements, par compte et par dossier : sans lui, il faudrait prévenir tout le monde."
e2.debrief.p2: "Compter les personnes, pas les lignes : la même personne peut être dans plusieurs fichiers."
e2.debrief.p3: "Prévoir à l'avance, dans les contrats, qui prévient qui et dans quel délai."
e2.facts.title: "Ce qui s'est vraiment passé : MOVEit Transfer, mai et juin 2023"
e2.facts.p1: "Le 31 mai 2023, Progress Software publie une faille d'injection SQL dans l'interface web de son logiciel de transfert de fichiers MOVEit Transfer (CVE-2023-34362). D'après CISA et le FBI, son exploitation avait commencé le 27 mai."
e2.facts.p2: "Les autorités américaines attribuent la campagne au groupe CL0P. L'intrus déposait une page web clandestine, nommée human2.aspx pour imiter un fichier légitime, qui permettait de lister et de télécharger les fichiers et de créer des comptes."
e2.facts.p3: "Aucun chiffrement de fichiers : les données sont volées, puis les victimes sont sommées de payer pour qu'elles ne soient pas publiées."
e2.facts.p4: "Beaucoup d'organisations touchées n'utilisaient pas MOVEit elles-mêmes : leurs données étaient chez un prestataire qui l'utilisait, par exemple pour la paie."
e2.facts.p5: "L'avis de CISA et du FBI recommande de chercher des fichiers inconnus dans le dossier web, des comptes inconnus et de gros téléchargements, puis de corriger : les trois vérifications de cette affaire."
