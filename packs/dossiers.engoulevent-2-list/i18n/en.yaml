e2.briefing: "Monday 7 June. The page is removed, the account disabled, Navette patched. This morning, management received a message. Before answering it, you need to know exactly what left. Navette's audit log and the message are in `traces/`."
e2.obj.clients: "Count the clients whose files left"
e2.obj.people: "Count the employees concerned"
e2.obj.notify: "Say who must tell whom"
e2.obj.ransom: "Decide how to answer the message"
e2.obj.week: "Put the week back in order"
e2.q.clients: "How many clients had files downloaded by the intruder's account? (a number)"
e2.q.people: "How many different employees do these files cover? (a number)"
e2.q.notify: "Horizon Paie processes these payslips on behalf of its clients. What does it do now?"
e2.q.notify.tell: "Tell every affected client at once, with the list"
e2.q.notify.later: "Wait for the end of the investigation to give a sure list"
e2.q.notify.later.why: "The clients are responsible for their employees' data and have 72 hours to tell the authority. A provider must warn them without delay, and complete the list later."
e2.q.notify.announce: "Publish a statement and let the clients learn it"
e2.q.notify.announce.why: "The clients would learn from the press that their own employees are concerned. Horizon Paie owes them the information first, with the detail."
e2.q.ransom: "The message demands money not to publish. What do you recommend to management?"
e2.q.ransom.refuse: "Do not pay: tell clients, authorities and the police"
e2.q.ransom.refuse.why: "The files may be published anyway, and that will have to be faced. But the clients are told, the complaint is filed, and nothing funds the next campaign."
e2.q.ransom.payup: "Pay to prevent publication"
e2.q.ransom.payup.why: "Nothing guarantees the copies will be deleted, or not sold on. Paying funds the next campaign, and the clients must be told anyway."
e2.q.ransom.silence: "Do not answer and wait and see"
e2.q.ransom.silence.why: "Waiting without telling anyone lets the clients discover the leak from the thieves themselves, who say they will write to them."
e2.tl.text: "Navette's week"
e2.tl.account: "An admin account is created in the middle of the night"
e2.tl.downloads: "The files of four clients are downloaded"
e2.tl.advisory: "The vendor publishes the flaw and its fix"
e2.tl.removed: "The page and the account are removed, Navette is patched"
e2.tl.message: "Management receives the ransom demand"
e2.ada.brief: "Read the audit log: `cat traces/navette-audit.log`. Only the intruder's account counts: `grep sante-svc traces/navette-audit.log`."
e2.ada.g.clients: "Count the different client folders sante-svc downloaded from, then `answer clients <number>`."
e2.ada.g.clients.standard: "Count the clients whose files the intruder's account downloaded."
e2.ada.clients: "Four out of six. Orme and Garance only appear in actions of their own accounts: they are not affected."
e2.ada.g.people: "Add up the lines of the downloaded files, but careful: at Pradelles, two months of payroll cover the same employees. Then `answer people <number>`."
e2.ada.g.people.standard: "Count the different employees in the files that left. An employee in two files counts once."
e2.ada.people: "2,487 people, whose names, addresses, bank details and salaries are now somewhere else. Now, who tells whom?"
e2.ada.g.notify: "Think about who is responsible for this data."
e2.ada.notify: "The four clients are told this morning, each with their list. What is left is last night's message: `cat traces/message-recu.txt`."
e2.ada.g.ransom: "No wrong answer here, only a cost. Choose."
e2.ada.ransom: "Noted. One last thing for the report: the week in order, with `timeline semaine`."
e2.ada.g.week: "Show the events with `timeline semaine`, then order them from oldest to newest: `timeline semaine <id> <id>…`."
e2.ada.g.week.standard: "Put the week in order with `timeline semaine`."
e2.ada.done: "Case closed. A flaw open for a few days at a provider, and the employees of four other companies pay for it."
e2.hint.clients.1: "Folders downloaded by sante-svc: mercier, saules, pradelles, lazare."
e2.hint.clients.2: "`answer clients 4`"
e2.hint.people.1: "812 + 140 + 1,230 + 305: both Pradelles files hold the same 1,230 employees."
e2.hint.people.2: "`answer people 2487`"
e2.hint.week.1: "Saturday 3:12 am, Saturday to Monday, Wednesday night, Thursday morning, this Monday."
e2.hint.week.2: "`timeline semaine account downloads advisory removed message`"
e2.debrief.title: "The list"
e2.debrief.lesson: "When a provider is hit, the victims are its clients' clients. The audit log tells exactly who, and a provider must warn its clients at once, with that list, so they can warn in turn."
e2.debrief.p1: "Keep an audit log of downloads, per account and per folder: without it, you would have to warn everyone."
e2.debrief.p2: "Count people, not lines: the same person can be in several files."
e2.debrief.p3: "Agree in advance, in contracts, who tells whom and how fast."
e2.facts.title: "What really happened: MOVEit Transfer, May and June 2023"
e2.facts.p1: "On 31 May 2023, Progress Software discloses an SQL injection flaw in the web interface of its MOVEit Transfer file transfer product (CVE-2023-34362). According to CISA and the FBI, exploitation had begun on 27 May."
e2.facts.p2: "US authorities attribute the campaign to the CL0P group. The intruder planted a hidden web page, named human2.aspx to imitate a legitimate file, which let them list and download files and create accounts."
e2.facts.p3: "No file encryption: the data is stolen, then victims are told to pay so that it is not published."
e2.facts.p4: "Many affected organisations did not use MOVEit themselves: their data sat with a provider who did, for payroll for instance."
e2.facts.p5: "The CISA and FBI advisory recommends looking for unknown files in the web folder, unknown accounts and large downloads, then patching: the three checks of this case."
