file.readme: "Ligne Rouge workstation. Case file: Sittelle. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate SI-2027-016. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE SI-2027-016\nClient: Sittelle SCIC. Scope: *.sittelle.test, 10.76.0.0/24, and the third-party service cdn.compat-cdn.test as a mere visitor.\nPurpose: visitors say that, from their phone, they were sent to an online betting site while trying to buy a ticket. Nobody at Sittelle can reproduce it. Management wants to understand, and to make sure it does not happen again.\nSet-up agreed: Ligne Rouge reads Sittelle's site and downloads the third-party service's public files like any browser would. No other action on that service, which does not belong to Sittelle. Never visit the betting site.\nSigned: the director of Sittelle."
web.footer: "Sittelle - fictional ticket office, BREACH case file 16"
