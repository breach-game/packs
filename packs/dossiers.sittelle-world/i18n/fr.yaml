file.readme: "Poste Ligne Rouge. Dossier : Sittelle. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat SI-2027-016. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT SI-2027-016\nClient : Sittelle SCIC. Périmètre : *.sittelle.test, 10.76.0.0/24, et le service tiers cdn.compat-cdn.test en simple visiteur.\nObjet : des visiteurs disent avoir été envoyés, depuis leur téléphone, vers un site de paris en ligne en voulant acheter un billet. Personne chez Sittelle n'arrive à le reproduire. La direction veut comprendre, et s'assurer que ça ne recommence pas.\nDispositif convenu : Ligne Rouge lit le site de Sittelle et télécharge les fichiers publics du service tiers comme n'importe quel navigateur. Aucune autre action sur ce service, qui n'appartient pas à Sittelle. Ne jamais visiter le site de paris.\nSigné : le directeur de Sittelle."
