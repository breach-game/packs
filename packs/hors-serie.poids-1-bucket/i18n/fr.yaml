p1.briefing: "Lundi 17 septembre, 9 h. Orme a passé deux ans et presque tout son argent à entraîner `orme-4`, un modèle qui lit des cahiers des charges techniques. Vendredi, un client a écrit : il a trouvé sur un forum un modèle qui répond exactement comme celui d'Orme. La cofondatrice te demande de regarder où sont rangés les poids. Le journal du stockage est dans `stockage/`."
p1.obj.model: "Regarder ce que le seau montre à n'importe qui"
p1.obj.taken: "Compter les téléchargements du modèle venus de l'extérieur"
p1.obj.worth: "Dire ce qui part avec des poids"
p1.obj.closed: "Fermer le seau et vérifier qu'il l'est"
p1.q.model: "Quel fichier du seau contient le modèle entier ?"
p1.q.taken: "Combien de fois le fichier du modèle a-t-il été téléchargé depuis une adresse qui n'est pas à Orme ?"
p1.q.worth: "Le fichier des poids est sorti trois fois. Qu'est-ce qui est parti avec ?"
p1.q.worth.whole: "Le modèle entier, et ce qu'il a retenu de ses données"
p1.q.worth.numbers: "Des nombres inutilisables sans le code d'Orme"
p1.q.worth.numbers.why: "Le format est ouvert : n'importe quel outil courant charge ce fichier et fait tourner le modèle, sans une ligne de code d'Orme. C'est ce que le client a vu sur le forum."
p1.q.worth.passwords: "Les mots de passe des clients d'Orme, en clair"
p1.q.worth.passwords.why: "Il n'y a pas de mots de passe dans des poids. Mais un modèle retient des morceaux de ce qu'il a lu, et l'adaptateur a été entraîné sur les cahiers des charges des clients."
p1.contain.bucket: "Fermer l'accès public au seau `poids` (l'API d'Orme le lit avec son propre rôle)"
p1.ada.brief: "Avant de lire un journal, on regarde ce que voit un inconnu. Sans compte, sans rien : `curl https://stockage.orme.test/poids`. On lit la liste, on ne télécharge aucun fichier."
p1.ada.g.model: "`curl https://stockage.orme.test/poids` affiche la liste du seau. Donne le nom du plus gros fichier : `answer model <fichier>`."
p1.ada.g.model.standard: "Regarde ce que le seau `poids` montre sans compte, et donne le fichier du modèle avec `answer model`."
p1.ada.model: "`public-read`. Treize gigaoctets, deux ans de travail, et à côté un adaptateur entraîné sur les documents des clients. Le seau a été ouvert le 2 août pour qu'un serveur d'entraînement dépose le fichier plus vite, et personne ne l'a refermé. Voyons qui est passé : `stockage/acces.csv`."
p1.ada.g.taken: "`grep \"orme-4.safetensors\" stockage/acces.csv` montre chaque téléchargement du modèle. Les adresses d'Orme commencent par 10.112. Compte les autres, puis `answer taken <nombre>`."
p1.ada.g.taken.standard: "Compte dans `stockage/acces.csv` les téléchargements du modèle venus d'adresses qui ne sont pas à Orme."
p1.ada.taken: "Trois, depuis trois adresses. La première, le 3 septembre à 2 h du matin, se présente comme `bucket-lister` : un robot qui essaie des noms de seaux les uns après les autres. Personne ne visait Orme. Le seau s'appelait `poids`, et il était ouvert. Une question."
p1.ada.g.worth: "Réponds à ma question : ce qui est parti avec le fichier."
p1.ada.worth: "Oui. Des poids, c'est le modèle : pas besoin du code, pas besoin d'Orme. Et le second fichier est pire d'une autre façon : il a appris sur les cahiers des charges des clients, et un modèle rend parfois ce qu'il a lu. On ne rattrapera pas ces copies."
p1.ada.g.closed: "`contain disable public-poids` ferme l'accès public. Puis vérifie comme un inconnu : `curl https://stockage.orme.test/poids`."
p1.ada.g.closed.standard: "Ferme l'accès public avec `contain`, puis refais la requête du début pour vérifier."
p1.ada.contained: "C'est fait côté réglage. Un réglage, ça se vérifie de l'extérieur : refais le `curl` du début."
p1.ada.closed: "`AccessDenied`. L'API d'Orme lit toujours le seau, avec son propre rôle. Il aura fallu une seule ligne de réglage et quarante-six jours."
p1.ada.done: "Ce qui est sorti est sorti. Orme va prévenir les clients dont les documents ont servi à l'adaptateur, et réentraîner celui-ci. Demain, on regarde ce que fait leur agent quand il se promène sur le web."
p1.hint.model.1: "Le plus gros fichier de la liste, 13,1 Go."
p1.hint.model.2: "`answer model orme-4.safetensors`"
p1.hint.taken.1: "Six lignes pour ce fichier, dont trois depuis 10.112. Les trois autres viennent d'ailleurs."
p1.hint.taken.2: "`answer taken 3`"
p1.hint.worth.1: "Des poids suffisent à faire tourner le modèle. Tape `answer whole`."
p1.hint.closed.1: "`contain disable public-poids`"
p1.hint.closed.2: "Puis `curl https://stockage.orme.test/poids` : la réponse doit être un refus."
p1.debrief.title: "Le seau ouvert"
p1.debrief.lesson: "Personne n'a attaqué Orme. Un seau ouvert « pour aller plus vite » un soir d'août est resté ouvert quarante-six jours, et un robot qui essaie des noms de seaux a trouvé le sien. Des poids ne se révoquent pas comme un mot de passe : une copie sortie reste sortie."
p1.debrief.p1: "Des poids se rangent comme un secret : seau privé, accès par rôle, journal relu."
p1.debrief.p2: "Une ouverture temporaire porte une date de fin, et quelqu'un est chargé de la refermer."
p1.debrief.p3: "Un modèle entraîné sur les données des clients les contient en partie : on le protège comme ces données."
