p1.briefing: "Monday 17 September, 9 am. Orme spent two years and nearly all its money training `orme-4`, a model that reads technical specifications. On Friday a customer wrote: they found on a forum a model that answers exactly like Orme's. The co-founder asks you to look at where the weights are kept. The storage log is in `stockage/`."
p1.obj.model: "Look at what the bucket shows to anyone"
p1.obj.taken: "Count the downloads of the model that came from outside"
p1.obj.worth: "Say what leaves along with weights"
p1.obj.closed: "Close the bucket and check that it is closed"
p1.q.model: "Which file in the bucket holds the whole model?"
p1.q.taken: "How many times was the model file downloaded from an address that is not Orme's?"
p1.q.worth: "The weights file went out three times. What left with it?"
p1.q.worth.whole: "The whole model, and what it kept of its data"
p1.q.worth.numbers: "Numbers that are useless without Orme's training code"
p1.q.worth.numbers.why: "The format is open: any common tool loads this file and runs the model, without a line of Orme's code. That is what the customer saw on the forum."
p1.q.worth.passwords: "The passwords of Orme's customers, in clear"
p1.q.worth.passwords.why: "There are no passwords in weights. But a model keeps pieces of what it read, and the adapter was trained on customers' specifications."
p1.contain.bucket: "Close public access to the `poids` bucket (Orme's API reads it with its own role)"
p1.ada.brief: "Before reading a log, look at what a stranger sees. No account, nothing: `curl https://stockage.orme.test/poids`. We read the listing, we download no file."
p1.ada.g.model: "`curl https://stockage.orme.test/poids` prints the bucket listing. Give the name of the biggest file: `answer model <file>`."
p1.ada.g.model.standard: "Look at what the `poids` bucket shows without an account, and give the model's file with `answer model`."
p1.ada.model: "`public-read`. Thirteen gigabytes, two years of work, and next to it an adapter trained on customers' documents. The bucket was opened on 2 August so a training server could drop the file faster, and nobody closed it again. Let's see who came by: `stockage/acces.csv`."
p1.ada.g.taken: "`grep \"orme-4.safetensors\" stockage/acces.csv` shows every download of the model. Orme's addresses start with 10.112. Count the others, then `answer taken <number>`."
p1.ada.g.taken.standard: "Count in `stockage/acces.csv` the downloads of the model from addresses that are not Orme's."
p1.ada.taken: "Three, from three addresses. The first, on 3 September at 2 am, calls itself `bucket-lister`: a bot that tries bucket names one after another. Nobody was aiming at Orme. The bucket was called `poids`, and it was open. One question."
p1.ada.g.worth: "Answer my question: what left with the file."
p1.ada.worth: "Yes. Weights are the model: no code needed, no Orme needed. And the second file is worse in another way: it learned from customers' specifications, and a model sometimes gives back what it read. We will not get those copies back."
p1.ada.g.closed: "`contain disable public-poids` closes public access. Then check like a stranger would: `curl https://stockage.orme.test/poids`."
p1.ada.g.closed.standard: "Close public access with `contain`, then repeat the first request to check."
p1.ada.contained: "Done on the settings side. A setting is checked from outside: run the first `curl` again."
p1.ada.closed: "`AccessDenied`. Orme's API still reads the bucket, with its own role. It took one line of settings and forty-six days."
p1.ada.done: "What went out is out. Orme will tell the customers whose documents were used for the adapter, and retrain it. Tomorrow, we look at what their agent does when it wanders the web."
p1.hint.model.1: "The biggest file in the listing, 13.1 GB."
p1.hint.model.2: "`answer model orme-4.safetensors`"
p1.hint.taken.1: "Six lines for this file, three of them from 10.112. The other three come from elsewhere."
p1.hint.taken.2: "`answer taken 3`"
p1.hint.worth.1: "Weights are enough to run the model. Type `answer whole`."
p1.hint.closed.1: "`contain disable public-poids`"
p1.hint.closed.2: "Then `curl https://stockage.orme.test/poids`: the answer must be a refusal."
p1.debrief.title: "The open bucket"
p1.debrief.lesson: "Nobody attacked Orme. A bucket opened \"to go faster\" one August evening stayed open forty-six days, and a bot that tries bucket names found it. Weights cannot be revoked like a password: a copy that went out stays out."
p1.debrief.p1: "Weights are stored like a secret: private bucket, access by role, a log someone reads."
p1.debrief.p2: "A temporary opening carries an end date, and someone is in charge of closing it."
p1.debrief.p3: "A model trained on customers' data partly contains it: protect it like that data."
