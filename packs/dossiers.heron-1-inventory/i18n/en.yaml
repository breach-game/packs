h1.briefing: "Friday, 11:05 pm. A critical flaw in carnet-core, a very common logging library, has just been published. Albe Libraries want to know tonight which servers are affected. The advisory is in `bulletin/`, each server's software inventory in `inventaire/`."
h1.obj.listed: "Find the server the inventories point to"
h1.obj.hidden: "Find the server that ships the library without saying so"
h1.obj.shield: "Protect what you cannot patch tonight"
h1.obj.patch: "Release a fix that is enough"
h1.obj.why: "Explain to management why it is so serious"
h1.q.listed: "Which server does the inventory flag as vulnerable? (its short name, for instance portail)"
h1.q.hidden: "Which server ships carnet-core without its inventory saying so? (its short name)"
h1.q.why: "The CIO asks why everyone is talking about this flaw tonight. What do you answer?"
h1.q.why.logged: "Any text the server writes to its log can set it off"
h1.q.why.admin: "It gives an admin account to someone who already has one"
h1.q.why.admin.why: "No: no account is needed. A search box or a request header is enough, as long as the server writes it to its log."
h1.q.why.system: "It only affects old systems that were never updated"
h1.q.why.system.why: "No: the catalogue runs on an up-to-date Debian. The flaw is in a library shipped by the application, not in the system."
h1.contain.egress: "Block at the firewall every outgoing connection from the booking server"
h1.ada.brief: "Read the advisory first: `cat bulletin/BRX-2027-1210.txt`. Then compare the inventories to the published advisories: `sbom inventaire --vuln`."
h1.ada.g.listed: "Run `sbom inventaire --vuln`, then give the short name of the affected server: `answer listed <server>`."
h1.ada.g.listed.standard: "Compare the inventories of the three servers to the published advisories."
h1.ada.listed: "The catalogue, as expected: it is our code, its inventory is kept up to date. But look at the booking one: a single line. The vendor wrote it."
h1.ada.g.hidden: "A one-line inventory proves nothing. Open the archive the vendor ships: `unzip -l inventaire/reservations/reservations.jar`. Then `answer hidden <server>`."
h1.ada.g.hidden.standard: "Do not take the vendor's inventory at its word. Look at what its archive really holds."
h1.ada.hidden: "There it is: carnet-core 2.14.1, tucked inside the vendor's archive, missing from its inventory. The vendor promises a fix on Monday."
h1.ada.g.shield: "No fix possible tonight for the booking server. The advisory gives a stopgap: see the ready measures with `contain list`, then `contain block sortie-reservations`."
h1.ada.g.shield.standard: "The advisory gives a stopgap for what you cannot update. Apply it to the booking server."
h1.ada.shield: "The booking server can no longer call out. Even if the flaw fires, it can no longer fetch a class."
h1.ada.g.patch: "The catalogue is our own code. List the ready versions with `deploy`, then read the 10:40 pm update in the advisory before you choose: `deploy catalogue <version>`."
h1.ada.g.patch.standard: "Release the catalogue version that ships a library that is really fixed."
h1.ada.partial: "Wait. 4.2.0 ships carnet-core 2.15.0, and the advisory was updated at 10:40 pm: that is not enough. You need 4.2.1."
h1.ada.patched: "The catalogue runs carnet-core 2.17.1. The CIO is on the line and wants to understand."
h1.ada.g.why: "No trick. Pick what you would tell the CIO."
h1.ada.done: "Tonight we protected. Tomorrow morning we look for anyone who came through before us."
h1.hint.listed.1: "`sbom inventaire --vuln` reads the three inventories and compares them to the advisories."
h1.hint.listed.2: "`answer listed catalogue`"
h1.hint.hidden.1: "`unzip -l inventaire/reservations/reservations.jar` lists the libraries stored in `BOOT-INF/lib/`."
h1.hint.hidden.2: "`answer hidden reservations`"
h1.hint.shield.1: "`contain block sortie-reservations`"
h1.hint.patch.1: "`deploy` with no argument lists the versions. The 10:40 pm update of the advisory says which one is enough."
h1.hint.patch.2: "`deploy catalogue 4.2.1`"
h1.debrief.title: "Friday night"
h1.debrief.lesson: "A flaw in a library hides wherever that library is shipped, including in software you bought. An inventory is only worth what its author put in it: you must be able to open an archive and check. And when you cannot patch right away, you shrink what the flaw allows."
h1.debrief.p1: "Keep an inventory of the components of every application, and require a complete one from vendors."
h1.debrief.p2: "Filter outgoing connections from servers: a server that cannot call out downloads nothing."
h1.debrief.p3: "Read advisories again after the first fix: the first fixed version is not always the last."
