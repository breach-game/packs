h1.briefing: "Vendredi, 23 h 05. Une faille critique de carnet-core, une bibliothèque de journalisation très répandue, vient d'être publiée. Les Médiathèques d'Albe veulent savoir ce soir quels serveurs sont touchés. Le bulletin est dans `bulletin/`, les inventaires de logiciels de chaque serveur dans `inventaire/`."
h1.obj.listed: "Trouver le serveur que les inventaires désignent"
h1.obj.hidden: "Trouver le serveur qui embarque la bibliothèque sans le dire"
h1.obj.shield: "Protéger ce que tu ne peux pas corriger ce soir"
h1.obj.patch: "Mettre en production un correctif suffisant"
h1.obj.why: "Expliquer à la direction pourquoi c'est si grave"
h1.q.listed: "Quel serveur l'inventaire désigne-t-il comme vulnérable ? (son nom court, par exemple portail)"
h1.q.hidden: "Quel serveur embarque carnet-core sans que son inventaire le dise ? (son nom court)"
h1.q.why: "Le directeur demande pourquoi tout le monde parle de cette faille ce soir. Que lui réponds-tu ?"
h1.q.why.logged: "N'importe quel texte que le serveur journalise peut la déclencher"
h1.q.why.admin: "Elle donne un compte administrateur à qui en a déjà un"
h1.q.why.admin.why: "Non : aucun compte n'est nécessaire. Un champ de recherche ou un en-tête de requête suffit, tant que le serveur l'écrit dans son journal."
h1.q.why.system: "Elle ne touche que les vieux systèmes jamais mis à jour"
h1.q.why.system.why: "Non : le catalogue tourne sur un Debian à jour. La faille est dans une bibliothèque embarquée par l'application, pas dans le système."
h1.contain.egress: "Bloquer au pare-feu toute connexion sortante du serveur des réservations"
h1.ada.brief: "Lis d'abord le bulletin : `cat bulletin/BRX-2027-1210.txt`. Puis compare les inventaires aux bulletins publiés : `sbom inventaire --vuln`."
h1.ada.g.listed: "Lance `sbom inventaire --vuln`, puis donne le nom court du serveur touché : `answer listed <serveur>`."
h1.ada.g.listed.standard: "Compare les inventaires des trois serveurs aux bulletins publiés."
h1.ada.listed: "Le catalogue, comme prévu : c'est notre code, son inventaire est tenu à jour. Mais regarde celui des réservations : une seule ligne. C'est l'éditeur qui l'a écrit."
h1.ada.g.hidden: "Un inventaire d'une ligne ne prouve rien. Ouvre l'archive livrée par l'éditeur : `unzip -l inventaire/reservations/reservations.jar`. Puis `answer hidden <serveur>`."
h1.ada.g.hidden.standard: "Ne crois pas l'inventaire de l'éditeur sur parole. Regarde ce que contient vraiment son archive."
h1.ada.hidden: "Voilà : carnet-core 2.14.1, rangé dans l'archive de l'éditeur, absent de son inventaire. L'éditeur promet un correctif lundi."
h1.ada.g.shield: "Pas de correctif possible ce soir pour les réservations. Le bulletin donne la parade d'attente : regarde les mesures prêtes avec `contain list`, puis `contain block sortie-reservations`."
h1.ada.g.shield.standard: "Le bulletin donne une parade d'attente pour ce que tu ne peux pas mettre à jour. Applique-la aux réservations."
h1.ada.shield: "Le serveur des réservations ne peut plus appeler l'extérieur. Même si la faille se déclenche, il ne peut plus aller chercher de classe."
h1.ada.g.patch: "Le catalogue, lui, est notre code. Liste les versions prêtes avec `deploy`, puis relis la mise à jour de 22 h 40 dans le bulletin avant de choisir : `deploy catalogue <version>`."
h1.ada.g.patch.standard: "Mets en production la version du catalogue qui embarque une bibliothèque vraiment corrigée."
h1.ada.partial: "Attends. La 4.2.0 embarque carnet-core 2.15.0, et le bulletin a été mis à jour à 22 h 40 : ce n'est pas suffisant. Il faut la 4.2.1."
h1.ada.patched: "Le catalogue tourne avec carnet-core 2.17.1. Le directeur est en ligne, il veut comprendre."
h1.ada.g.why: "Pas de piège. Choisis ce que tu dirais au directeur."
h1.ada.done: "Ce soir, on a protégé. Demain matin, on cherchera si quelqu'un est passé avant nous."
h1.hint.listed.1: "`sbom inventaire --vuln` lit les trois inventaires et les compare aux bulletins."
h1.hint.listed.2: "`answer listed catalogue`"
h1.hint.hidden.1: "`unzip -l inventaire/reservations/reservations.jar` liste les bibliothèques rangées dans `BOOT-INF/lib/`."
h1.hint.hidden.2: "`answer hidden reservations`"
h1.hint.shield.1: "`contain block sortie-reservations`"
h1.hint.patch.1: "`deploy` sans argument liste les versions. La mise à jour de 22 h 40 du bulletin dit laquelle suffit."
h1.hint.patch.2: "`deploy catalogue 4.2.1`"
h1.debrief.title: "Vendredi soir"
h1.debrief.lesson: "Une faille dans une bibliothèque se cache partout où cette bibliothèque est embarquée, y compris dans les logiciels achetés. Un inventaire ne vaut que ce que son auteur y a mis : il faut pouvoir ouvrir une archive et vérifier. Et quand on ne peut pas corriger tout de suite, on réduit ce que la faille permet."
h1.debrief.p1: "Tenir un inventaire des composants de chaque application, et l'exiger des éditeurs, complet."
h1.debrief.p2: "Filtrer les connexions sortantes des serveurs : un serveur qui ne peut pas appeler l'extérieur ne télécharge rien."
h1.debrief.p3: "Relire les bulletins après le premier correctif : une première version corrigée n'est pas toujours la dernière."
