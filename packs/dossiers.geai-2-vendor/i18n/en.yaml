c2.briefing: "Wednesday 15 December, 9 am. The way out is cut. According to the sensor, the program reached the till server from 10.106.0.20: the portal where contractors submit their invoices. An invoice portal has no business near the tills. Its sign-ins are in `portail/`, the firewall rules in `reseau/`."
c2.obj.account: "Find the contractor account used by someone else"
c2.obj.rule: "Find the rule that let the portal talk to the tills"
c2.obj.walls: "Rewrite the network's segmentation"
c2.obj.announce: "Decide when to announce it"
c2.obj.story: "Put those weeks in order"
c2.q.account: "Which portal account signed in from an address that is not its own?"
c2.q.rule: "Which firewall rule lets the contractor portal reach the tills? (its number)"
c2.q.announce: "It is ten days before Christmas, and the tills have read millions of cards. When do you say so?"
c2.q.announce.now: "Today, to every customer, in the middle of Christmas week"
c2.q.announce.after: "After the holidays, once the inquiry is over"
c2.q.announce.banks: "Today to the banks, and to the public within the week"
c2.check.tills: "The contractor portal can no longer reach the tills"
c2.check.out: "The file server only goes out to its update servers"
c2.check.factor: "The second factor is required for contractors"
c2.check.temp: "A temporary rule expires by itself"
c2.check.works: "Contractors can still submit their invoices"
c2.tl.text: "Grand Cabas's weeks"
c2.tl.signin: "Someone signs in to the portal with the refrigeration contractor's account"
c2.tl.program: "An unknown program is placed on the till server"
c2.tl.alert: "The sensor rings, the alert is closed as noise"
c2.tl.leaves: "Card data leaves through the file server"
c2.tl.police: "The police warn Grand Cabas"
c2.tl.cut: "The way out is blocked and the relay isolated"
c2.tl.public: "Grand Cabas tells its customers"
c2.ada.brief: "Read the portal's sign-ins: `cat portail/connexions.csv`. The `usual_src` column gives each contractor's usual address."
c2.ada.g.account: "In `portail/connexions.csv`, compare `src` and `usual_src`. `answer account <account>`."
c2.ada.g.account.standard: "Find in the portal's sign-ins the account used from an address that is not the contractor's."
c2.ada.account: "`froid-nord`, the company that services the fridges, at 2.47 am, from 203.0.113.45: the address the cards left to. Someone had stolen the refrigeration contractor's password. But between an invoice portal and the tills there should be a wall: `cat reseau/pare-feu.csv`."
c2.ada.g.rule: "`cat reseau/pare-feu.csv`: look for the line going from `contractor-portal` to `tills`. `answer rule <number>`."
c2.ada.g.rule.standard: "Read the firewall rules and find the one that links the portal to the tills."
c2.ada.rule: "R-17: \"temporary\", for a fridge monitoring pilot in 2025. The pilot ended two years ago, the rule stayed. And R-21 lets the file server go out to anywhere. Two open doors, one to come in, one to leave. Fix it: `reseau/cloisonnement.yml`."
c2.ada.g.walls: "`cat reseau/cloisonnement.yml`: each line gives its possible values after the `#`. Pick the strictest with `sed -i` or `edit`, then `verify`."
c2.ada.g.walls.standard: "Fix `reseau/cloisonnement.yml`, then run `verify`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.walls: "The portal no longer sees the tills, the file server only goes out for its updates, contractors have a second factor, and temporary has an end date. One decision is left, and it is yours."
c2.ada.g.announce: "No answer is wrong: each one costs Grand Cabas and its customers something different."
c2.ada.announce: "Noted. All that is left is telling the story in order."
c2.ada.g.story: "`timeline semaines` shows the events shuffled. Answer with their ids in order: `timeline semaines <id> <id> …`."
c2.ada.g.story.standard: "Put those weeks in order, from the first sign-in to the announcement."
c2.ada.done: "The refrigeration contractor did nothing wrong: a password was stolen from them. It is Grand Cabas's network that turned an invoice account into a key to the tills. The next card tells the real case this file is inspired by."
c2.hint.account.1: "Two lines of 15 November have a `src` different from `usual_src`."
c2.hint.account.2: "`answer account froid-nord`"
c2.hint.rule.1: "The line `contractor-portal,tills,any,allow`."
c2.hint.rule.2: "`answer rule R-17`"
c2.hint.walls.1: "The expected values: `deny`, `update-servers-only`, `required`, `expire-after-90-days`."
c2.hint.walls.2: "For example `sed -i \"s/portal_to_tills: allow/portal_to_tills: deny/\" reseau/cloisonnement.yml`."
c2.hint.story.1: "It all starts with a sign-in to the portal and ends with telling the customers."
c2.hint.story.2: "`timeline semaines signin program alert leaves police cut public`"
c2.debrief.title: "The refrigeration contractor"
c2.debrief.lesson: "The intruder came in with a refrigeration contractor's account, on an invoice portal. They should never have been able to go further. A \"temporary\" firewall rule linked that portal to the tills, and another let an internal server go out to anywhere."
c2.debrief.p1: "Segment: whatever touches payments lives in a network of its own, which nothing else reaches."
c2.debrief.p2: "A contractor gets the least access possible, with a second factor, and their account is watched like an internal one."
c2.debrief.p3: "A temporary rule carries an end date. Otherwise it is permanent, and nobody remembers it."
c2.facts.title: "What really happened: Target, 2013"
c2.facts.p1: "In late 2013, intruders enter the network of Target, a large US retail chain, with credentials stolen from Fazio Mechanical Services, a heating and refrigeration company that worked for it."
c2.facts.p2: "Between 15 and 28 November, malware is installed on the payment terminals. By 30 November, most tills are affected."
c2.facts.p3: "Target's detection tool raises the alarm on 30 November, then on 2 December. According to the US Senate report, the security team reacts to neither."
c2.facts.p4: "The Department of Justice warns Target on 12 December. The company announces it on 19 December: 40 million payment cards are affected. On 10 January 2014, it adds the personal data of up to 70 million customers."
c2.facts.p5: "The report of 26 March 2014 lists the missed opportunities: network access given to a poorly protected contractor, automated warnings left unanswered, and sensitive systems poorly isolated from the rest."
