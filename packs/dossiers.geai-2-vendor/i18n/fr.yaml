c2.briefing: "Mercredi 15 décembre, 9 h. La sortie est coupée. D'après la sonde, le programme est arrivé sur le serveur des caisses depuis 10.106.0.20 : le portail où les prestataires déposent leurs factures. Un portail de factures n'a rien à faire près des caisses. Ses connexions sont dans `portail/`, les règles du pare-feu dans `reseau/`."
