c2.ada.account.clean: "Et deux choses sont encore ouvertes : le programme est toujours sur le serveur des caisses, et ce mot de passe marche encore. `contain` liste les mesures."
c2.ada.g.clean: "Deux mesures : `contain remove programme`, puis `contain reset compte-vole`."
