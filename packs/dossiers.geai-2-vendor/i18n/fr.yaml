c2.ada.brief: "Lis les connexions du portail : `cat portail/connexions.csv`. La colonne `usual_src` donne l'adresse habituelle de chaque prestataire."
c2.ada.g.account: "Dans `portail/connexions.csv`, compare `src` et `usual_src`. `answer account <compte>`."
c2.ada.g.account.standard: "Trouve dans les connexions du portail le compte utilisé depuis une adresse qui n'est pas celle du prestataire."
c2.ada.account: "`froid-nord`, l'entreprise qui entretient les frigos, à 2 h 47 du matin, depuis 203.0.113.45 : l'adresse où les cartes sont parties. Quelqu'un avait volé le mot de passe du frigoriste. Mais d'un portail de factures aux caisses, il devrait y avoir un mur : `cat reseau/pare-feu.csv`."
c2.ada.g.rule: "`cat reseau/pare-feu.csv` : cherche la ligne qui va de `contractor-portal` à `tills`. `answer rule <numéro>`."
c2.ada.g.rule.standard: "Lis les règles du pare-feu et trouve celle qui relie le portail aux caisses."
c2.ada.rule: "R-17 : « temporaire », pour un essai de surveillance des frigos en 2025. L'essai est fini depuis deux ans, la règle est restée. Et R-21 laisse le serveur de fichiers sortir vers n'importe où. Deux portes ouvertes, une pour entrer, une pour sortir. Corrige : `reseau/cloisonnement.yml`."
c2.ada.g.walls: "`cat reseau/cloisonnement.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut quatre : `deny`, `update-servers-only`, `required`, `expire-after-90-days`. Change-les avec `edit reseau/cloisonnement.yml` ou `sed -i`, puis `verify`."
c2.ada.g.walls.standard: "Corrige `reseau/cloisonnement.yml`, puis lance `verify`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.walls: "Le portail ne voit plus les caisses, le serveur de fichiers ne sort plus que pour ses mises à jour, les prestataires ont un second facteur, et le temporaire a une date de fin. Une décision t'attend."
c2.ada.g.announce: "Aucune réponse n'est fausse : chacune coûte quelque chose de différent à Grand Cabas et à ses clients."
c2.ada.announce: "Noté. Il reste à raconter l'histoire dans l'ordre."
c2.ada.g.story: "`timeline semaines` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline semaines <id> <id> …`."
c2.ada.g.story.standard: "Remets ces semaines dans l'ordre, de la première connexion à l'annonce."
c2.ada.done: "Le frigoriste n'a rien fait de mal : on lui a volé un mot de passe. C'est le réseau de Grand Cabas qui a transformé un compte de factures en clé des caisses. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
