c2.debrief.title: "Le frigoriste"
c2.debrief.lesson: "L'intrus est entré avec le compte d'un prestataire de réfrigération, sur un portail de factures. Il n'aurait jamais dû pouvoir aller plus loin. Une règle « temporaire » du pare-feu reliait ce portail aux caisses, et une autre laissait un serveur interne sortir vers n'importe où."
c2.debrief.p1: "Cloisonner : ce qui touche aux paiements vit dans un réseau à part, que rien d'autre n'atteint."
c2.debrief.p2: "Un prestataire reçoit l'accès minimal, avec un second facteur, et son compte est surveillé comme un compte interne."
c2.debrief.p3: "Une règle temporaire porte une date de fin. Sinon elle est définitive, et personne ne s'en souvient."
c2.facts.title: "Ce qui s'est vraiment passé : Target, 2013"
c2.facts.p1: "Fin 2013, des intrus entrent dans le réseau de Target, grande chaîne de magasins américaine, avec des identifiants volés à Fazio Mechanical Services, une entreprise de chauffage et de réfrigération qui travaillait pour elle."
c2.facts.p2: "Entre le 15 et le 28 novembre, un programme malveillant est installé sur les terminaux de paiement. Le 30 novembre, la plupart des caisses sont touchées."
c2.facts.p3: "L'outil de détection de Target donne l'alerte le 30 novembre, puis le 2 décembre. Selon le rapport du Sénat américain, l'équipe de sécurité ne réagit à aucune des deux."
c2.facts.p4: "Le ministère de la Justice prévient Target le 12 décembre. L'entreprise l'annonce le 19 décembre : 40 millions de cartes bancaires sont concernées. Le 10 janvier 2014, elle ajoute les données personnelles de 70 millions de clients au plus."
c2.facts.p5: "Le rapport du 26 mars 2014 liste les occasions manquées : un accès au réseau donné à un prestataire mal protégé, des alertes automatiques restées sans réponse, et des systèmes sensibles mal isolés du reste."
