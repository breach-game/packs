b2.briefing: "Change of side. You are now the security team of Temoin SAS, the witness customer. A Ligne Rouge colleague is replaying the session taken from the ticket right now, under the same mandate. The admin console's log is yours: `soc`."
b2.obj.read: "Find where the replayed session comes from"
b2.obj.rule: "Write the rule that would have seen it"
b2.obj.first: "Choose the first move"
b2.q.source: "Which address uses the admin's session without being them?"
b2.q.account: "Which account did it create?"
b2.q.first: "It is 9:06. What is the first move?"
b2.q.first.sessions: "Close their sessions, remove the account created, warn the provider"
b2.q.first.password: "Change the admin's password and enrol their second factor again"
b2.q.first.password.why: "At Bergeronnette, changing the password does not close open sessions. The stolen cookie stays good, and so does the account created."
b2.q.first.block: "Block the address 198.51.100.23 on the company firewall"
b2.q.first.block.why: "The console is at Bergeronnette, not behind your firewall. And the intruder changes address in a minute, with the same cookie."
b2.ada.brief: "They start at 9:00, and you watch live. Open the log: `soc logs admin access`. One session, two machines: look for what does not look like the office."
b2.ada.g.read: "In `soc logs admin access`, one address is not the office's (10.73.0.150), and its tool is not a browser. Give it with `answer source <address>`."
b2.ada.g.read.standard: "Read the console's log: who is not the office? Answer with `answer source`."
b2.ada.read: "An unknown address, and a script instead of a browser. To the console, though, it is the real admin: same cookie. Watch what they do."
b2.ada.g.rule: "Write the rule in `regles/session-ailleurs.yml`: one line that keeps only that origin, for example `echo \"src|startswith: 198.51.100.\" >> regles/session-ailleurs.yml`, then `rule test regles/session-ailleurs.yml`. Or by hand, in the editor: `edit regles/session-ailleurs.yml`, then Ctrl+S."
b2.ada.g.rule.standard: "Write a rule in `regles/session-ailleurs.yml` that alerts on the intruder's lines and on no line from the office, then `rule test`. To open the file: `edit regles/session-ailleurs.yml`."
b2.ada.rule: "It would have rung from the first line. In the real case, it is exactly this kind of alert, at a customer, that uncovered everything."
b2.ada.answer: "Answer my question: click, or use `answer` in the terminal."
b2.ada.answer.standard: "My question is waiting in the messenger."
b2.ada.done: "Yes. A stolen session is closed, not changed. And the provider must know: the cookie left their house. Last step, at Bergeronnette."
b2.hint.read.1: "`soc logs admin access`: compare the addresses and the last column, the tool that makes the request."
b2.hint.read.2: "`soc search python` shows the script's lines."
b2.hint.read.3: "`answer source 198.51.100.23`"
b2.hint.rule.1: "A rule is one field per line. `path` alone is not enough: the office opens /console too."
b2.hint.rule.2: "Pick a field that sets the intruder apart: their address (`src`) or their tool (`ua`)."
b2.hint.rule.3: "`echo \"src|startswith: 198.51.100.\" >> regles/session-ailleurs.yml`, then `rule test regles/session-ailleurs.yml`. Or by hand, in the editor: `edit regles/session-ailleurs.yml`, then Ctrl+S."
b2.hint.first.1: "What gives the intruder access: the password, the address, or the cookie?"
b2.debrief.title: "A session has an origin"
b2.debrief.lesson: "To the console, the replayed session was the admin. Only what surrounds the request gives the intruder away: an address never seen, a script instead of a browser, an account created. A rule on these differences, and a response that closes the session rather than changing a password."
b2.debrief.p1: "A session that changes address or tool on the way deserves an alert, above all for an admin."
b2.debrief.p2: "Revoke the sessions, not only the password: a stolen cookie often survives a password change."
b2.debrief.p3: "An admin account created outside the usual habits is the sign to look for right after."
b2.ada.new: "A line just came in, from an address the office does not use."
b2.ada.created: "A 201 on `/console/admins/new`: they just created something."
b2.obj.account: "Find what it created"
b2.ada.g.account: "Follow their lines: `soc search 198.51.100.23`. The account they create is in the address of their POST request. Give it with `answer account <name>`."
b2.ada.g.account.standard: "Follow what this address does, and give the account it creates with `answer account`."
b2.ada.account: "One more admin, with a name nobody notices. It is the door they keep for when the session is closed."
b2.hint.account.1: "Look for a POST request from that address: `soc search POST`."
b2.hint.account.2: "`answer account svc-sauvegarde`"
