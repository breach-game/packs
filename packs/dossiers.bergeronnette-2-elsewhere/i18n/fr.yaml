b2.briefing: "Changement de côté. Tu es maintenant l'équipe sécurité de Témoin SAS, le client témoin. Un collègue de Ligne Rouge rejoue en ce moment la session prise dans le ticket, sous le même mandat. Le journal de la console d'administration est à toi : `soc`."
b2.obj.read: "Trouver d'où vient la session rejouée"
b2.obj.rule: "Écrire la règle qui l'aurait vue"
b2.obj.first: "Choisir le premier geste"
b2.q.source: "Quelle adresse utilise la session de l'administrateur sans être lui ?"
b2.q.account: "Quel compte a-t-elle créé ?"
b2.q.first: "Il est 9 h 06. Quel est le premier geste ?"
b2.q.first.sessions: "Fermer ses sessions, retirer le compte créé, prévenir le fournisseur"
b2.q.first.password: "Changer le mot de passe de l'administrateur et refaire son second facteur"
b2.q.first.password.why: "Chez Bergeronnette, changer le mot de passe ne ferme pas les sessions ouvertes. Le cookie volé reste bon, et le compte créé aussi."
b2.q.first.block: "Bloquer l'adresse 198.51.100.23 sur le pare-feu de l'entreprise"
b2.q.first.block.why: "La console est chez Bergeronnette, pas derrière ton pare-feu. Et l'intrus change d'adresse en une minute, avec le même cookie."
b2.ada.brief: "Il commence à 9 h, et tu le regardes en direct. Ouvre le journal : `soc logs admin access`. Une même session, deux machines : cherche ce qui ne ressemble pas au bureau."
b2.ada.g.read: "Dans `soc logs admin access`, une adresse n'est pas celle du bureau (10.73.0.150), et son outil n'est pas un navigateur. Donne-la avec `answer source <adresse>`."
b2.ada.g.read.standard: "Lis le journal de la console : qui n'est pas le bureau ? Réponds avec `answer source`."
b2.ada.read: "Une adresse inconnue, et un script à la place d'un navigateur. Pour la console, c'est pourtant le vrai administrateur : même cookie. Regarde ce qu'il fait."
b2.ada.g.rule: "Écris la règle dans `regles/session-ailleurs.yml` : une ligne qui ne retient que cette origine, par exemple `echo \"src|startswith: 198.51.100.\" >> regles/session-ailleurs.yml`, puis `rule test regles/session-ailleurs.yml`."
b2.ada.g.rule.standard: "Écris une règle dans `regles/session-ailleurs.yml` qui alerte sur les lignes de l'intrus et sur aucune ligne du bureau, puis `rule test`."
b2.ada.rule: "Elle aurait sonné dès la première ligne. Dans le cas réel, c'est exactement ce genre d'alerte, chez un client, qui a tout fait découvrir."
b2.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
b2.ada.answer.standard: "Ma question t'attend dans la messagerie."
b2.ada.done: "Oui. Une session volée se ferme, elle ne se change pas. Et le fournisseur doit savoir : le cookie est sorti de chez lui. Dernière étape, chez Bergeronnette."
b2.hint.read.1: "`soc logs admin access` : compare les adresses et la dernière colonne, l'outil qui fait la requête."
b2.hint.read.2: "`soc search python` montre les lignes du script."
b2.hint.read.3: "`answer source 198.51.100.23`"
b2.hint.rule.1: "Une règle, c'est un champ par ligne. `path` seul ne suffit pas : le bureau ouvre aussi /console."
b2.hint.rule.2: "Choisis un champ qui distingue l'intrus : son adresse (`src`) ou son outil (`ua`)."
b2.hint.rule.3: "`echo \"src|startswith: 198.51.100.\" >> regles/session-ailleurs.yml`, puis `rule test regles/session-ailleurs.yml`."
b2.hint.first.1: "Qu'est-ce qui donne l'accès à l'intrus : le mot de passe, l'adresse, ou le cookie ?"
b2.debrief.title: "Une session a une origine"
b2.debrief.lesson: "Pour la console, la session rejouée était l'administrateur. Seul ce qui entoure la requête trahit l'intrus : une adresse jamais vue, un script au lieu d'un navigateur, un compte créé. Une règle sur ces écarts, et une réponse qui ferme la session plutôt que de changer un mot de passe."
b2.debrief.p1: "Une session qui change d'adresse ou d'outil en cours de route mérite une alerte, surtout pour un administrateur."
b2.debrief.p2: "Révoquer les sessions, pas seulement le mot de passe : un cookie volé survit souvent à un changement de mot de passe."
b2.debrief.p3: "Un compte d'administrateur créé hors des habitudes est le signe à chercher juste après."
b2.ada.new: "Une ligne vient d'arriver, d'une adresse que le bureau n'utilise pas. Relis le journal, ou cherche-la : `soc search python`."
b2.ada.created: "Un 201 sur `/console/admins/new` : il vient de créer quelque chose. `soc search admins`."
b2.obj.account: "Trouver ce qu'elle a créé"
b2.ada.g.account: "Suis ses lignes : `soc search 198.51.100.23`. Le compte qu'il crée est dans l'adresse de sa requête POST. Donne-le avec `answer account <nom>`."
b2.ada.g.account.standard: "Suis ce que fait cette adresse, et donne le compte qu'elle crée avec `answer account`."
b2.ada.account: "Un administrateur de plus, au nom qui passe inaperçu. C'est la porte qu'il se garde pour quand la session sera fermée."
b2.hint.account.1: "Cherche une requête POST de cette adresse : `soc search POST`."
b2.hint.account.2: "`answer account svc-sauvegarde`"
