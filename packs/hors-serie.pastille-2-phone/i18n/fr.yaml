t2.briefing: "Jeudi 11 janvier, 18 h 10. Une balise dit où est un sac. Un téléphone dit tout le reste. Celui de Nadia chauffe et se vide depuis l'automne, et son ex cite parfois des choses qu'elle n'a écrites qu'à sa sœur. Avec la coordinatrice, elle a exporté deux pages depuis les réglages : la liste de ses applications et la page de sécurité de son compte. On lit, on ne supprime rien."
t2.obj.spy: "Trouver l'application que Nadia n'a pas installée"
t2.obj.device: "Trouver l'appareil connecté à son compte qui n'est plus chez elle"
t2.obj.where: "Dire depuis quel appareil chercher de l'aide"
t2.q.spy: "Quelle application ne vient pas de la boutique officielle ?"
t2.q.device: "Quel appareil encore connecté au compte de Nadia n'est plus en sa possession ?"
t2.q.where: "Nadia veut changer ses mots de passe et écrire à une association. Depuis quel appareil ?"
t2.q.where.other: "Depuis un appareil que son ex n'a jamais eu entre les mains"
t2.q.where.private: "Depuis ce téléphone, mais en navigation privée"
t2.q.where.private.why: "La navigation privée n'efface que l'historique. Une application qui a le droit de lire l'écran lit aussi les fenêtres privées, et ce qu'on y tape."
t2.q.where.after: "Depuis ce téléphone, après avoir supprimé l'application"
t2.q.where.after.why: "La suppression se voit de l'autre côté, et rien ne dit que cette application soit la seule chose installée. On décide de la retirer dans le plan, pas avant."
t2.ada.brief: "On cherche deux choses : ce qui est sur le téléphone sans y avoir été invité, et qui d'autre est dans son compte. `cat telephone/applis.csv` : regarde la colonne `source` et les droits demandés."
t2.ada.g.spy: "`grep \"unknown-source\" telephone/applis.csv` montre l'application installée hors de la boutique. Réponds avec `answer spy <nom>`."
t2.ada.g.spy.standard: "Trouve dans `telephone/applis.csv` l'application qui ne vient pas de la boutique, et réponds avec `answer spy`."
t2.ada.spy: "`service-synchro`. Un nom fait pour ne pas être remarqué, installé le 16 novembre à 2 h 14 du matin, hors de la boutique, avec le droit de lire l'écran, la position, les notifications et le micro, et celui d'administrer l'appareil. Nadia dit qu'elle dormait, et que son téléphone n'avait pas de code à l'époque. On n'y touche pas ce soir. Maintenant son compte."
t2.ada.g.device: "`jq \".devices\" telephone/compte.json` liste les appareils connectés à son compte. Réponds avec `answer device <nom>`."
t2.ada.g.device.standard: "Cherche dans `telephone/compte.json` un appareil connecté que Nadia n'a plus, et réponds avec `answer device`."
t2.ada.device: "`tablette-salon`, restée dans l'ancien appartement, et vue aujourd'hui même. Avec elle, pas besoin d'application : les messages, les photos, l'agenda arrivent tout seuls sur un écran que Nadia n'a plus. Regarde aussi `location_sharing` : un partage de position activé à deux en 2027, jamais arrêté. Rien de tout cela n'a demandé de compétence. Une question."
t2.ada.g.where: "Réponds à ma question : depuis quel appareil chercher de l'aide."
t2.ada.done: "Elle utilisera l'ordinateur de la permanence, puis un téléphone que sa sœur lui prête. Le sien, elle continue de s'en servir comme d'habitude pour les choses ordinaires, pour ne rien signaler. Jeudi prochain, on écrit le plan avec elle."
t2.hint.spy.1: "Une seule ligne porte `unknown-source`, et c'est aussi la seule avec `device_admin` à `yes`."
t2.hint.spy.2: "`answer spy service-synchro`"
t2.hint.device.1: "Deux appareils : son téléphone, et une tablette restée ailleurs."
t2.hint.device.2: "`answer device tablette-salon`"
t2.hint.where.1: "Un appareil que l'autre personne n'a jamais touché. Tape `answer other`."
t2.debrief.title: "Ce que dit le téléphone"
t2.debrief.lesson: "Trois portes étaient ouvertes sur la vie de Nadia : une application installée une nuit, une tablette restée connectée à son compte, un partage de position jamais arrêté. Deux sur trois ne sont pas des logiciels espions, ce sont des réglages ordinaires que personne n'a revus après la séparation. Et tant que le téléphone est lu, ce n'est pas de lui qu'on cherche de l'aide."
t2.debrief.p1: "Les signes : une application inconnue aux droits très larges, un appareil inconnu dans le compte, un partage de position oublié."
t2.debrief.p2: "On cherche de l'aide et on change ses mots de passe depuis un appareil sûr, jamais depuis celui qui est peut-être lu."
t2.debrief.p3: "Supprimer se voit de l'autre côté : on le décide avec un plan, pas dans l'instant."
t2.home.p1: "Ouvre la page de sécurité de ton compte principal et regarde les appareils connectés : tu dois reconnaître chacun."
t2.home.p2: "Regarde avec qui tu partages ta position, dans tes cartes et tes messageries. Arrête ce qui ne sert plus."
t2.home.p3: "Mets un code sur ton téléphone, que tu es la seule personne à connaître."
