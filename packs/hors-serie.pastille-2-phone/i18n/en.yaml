t2.briefing: "Thursday 11 January, 6.10 pm. A tag says where a bag is. A phone says everything else. Nadia's has been running hot and flat since the autumn, and her ex sometimes quotes things she only wrote to her sister. With the coordinator, she exported two pages from the settings: her app list and her account's security page. We read, we delete nothing."
t2.obj.spy: "Find the app Nadia did not install"
t2.obj.device: "Find the device signed in to her account that is no longer hers to hold"
t2.obj.where: "Say which device to seek help from"
t2.q.spy: "Which app does not come from the official store?"
t2.q.device: "Which device still signed in to Nadia's account is no longer in her possession?"
t2.q.where: "Nadia wants to change her passwords and write to a charity. From which device?"
t2.q.where.other: "From a device her ex has never had in their hands"
t2.q.where.private: "From this phone, but in a private browsing window"
t2.q.where.private.why: "Private browsing only clears the history. An app allowed to read the screen reads private windows too, and what is typed in them."
t2.q.where.after: "From this phone, once the app has been deleted"
t2.q.where.after.why: "Deleting shows on the other side, and nothing says this app is the only thing installed. Removing it is decided in the plan, not before."
t2.ada.brief: "We are looking for two things: what is on the phone without having been invited, and who else is in her account. `cat telephone/applis.csv`: look at the `source` column and the permissions asked for."
t2.ada.g.spy: "`grep \"unknown-source\" telephone/applis.csv` shows the app installed from outside the store. Answer with `answer spy <name>`."
t2.ada.g.spy.standard: "Find in `telephone/applis.csv` the app that does not come from the store, and answer with `answer spy`."
t2.ada.spy: "`service-synchro`. A name made to go unnoticed, installed on 16 November at 2.14 am, from outside the store, allowed to read the screen, the location, the notifications and the microphone, and to administer the device. Nadia says she was asleep, and that her phone had no passcode back then. We do not touch it tonight. Now her account."
t2.ada.g.device: "`jq \".devices\" telephone/compte.json` lists the devices signed in to her account. Answer with `answer device <name>`."
t2.ada.g.device.standard: "Look in `telephone/compte.json` for a signed-in device Nadia no longer has, and answer with `answer device`."
t2.ada.device: "`tablette-salon`, left behind in the former flat, and seen this very day. With it, no app is needed: messages, photos and the calendar arrive by themselves on a screen Nadia no longer has. Look at `location_sharing` too: location sharing switched on together in 2027, never stopped. None of this took any skill. One question."
t2.ada.g.where: "Answer my question: which device to seek help from."
t2.ada.done: "She will use the desk's computer, then a phone her sister is lending her. Her own she keeps using as usual for ordinary things, so as to signal nothing. Next Thursday, we write the plan with her."
t2.hint.spy.1: "Only one line says `unknown-source`, and it is also the only one with `device_admin` set to `yes`."
t2.hint.spy.2: "`answer spy service-synchro`"
t2.hint.device.1: "Two devices: her phone, and a tablet left somewhere else."
t2.hint.device.2: "`answer device tablette-salon`"
t2.hint.where.1: "A device the other person never touched. Type `answer other`."
t2.debrief.title: "What the phone says"
t2.debrief.lesson: "Three doors stood open onto Nadia's life: an app installed one night, a tablet still signed in to her account, location sharing never stopped. Two out of three are not spyware, they are ordinary settings nobody reviewed after the separation. And as long as the phone is being read, it is not the device to seek help from."
t2.debrief.p1: "The signs: an unknown app with very wide permissions, an unknown device in the account, forgotten location sharing."
t2.debrief.p2: "Seek help and change passwords from a safe device, never from the one that may be read."
t2.debrief.p3: "Deleting shows on the other side: decide it with a plan, not on the spot."
t2.home.p1: "Open your main account's security page and look at the signed-in devices: you should recognise each one."
t2.home.p2: "Look at who you share your location with, in your maps and messaging apps. Stop what is no longer needed."
t2.home.p3: "Put a passcode on your phone that you are the only person to know."
