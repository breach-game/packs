c2.briefing: "Vendredi 2 juillet, 9 h. Depuis mardi, plus personne ne se connecte chez Transports Argos : les deux contrôleurs de l'annuaire sont effacés, et leurs sauvegardes avec eux. Les navires sont chargés à la main, sur papier. L'état des contrôleurs est dans `traces/`. Le compte de lecture du mandat marche sur tout contrôleur encore en vie."
c2.obj.survivor: "Trouver le contrôleur qui a survécu"
c2.obj.admins: "Compter les administrateurs du domaine"
c2.obj.stale: "Repérer le compte qui n'aurait plus dû exister"
c2.obj.restore: "Reconstruire l'annuaire depuis ce contrôleur"
c2.obj.keep: "Décider qui reste administrateur du domaine"
c2.obj.story: "Remettre la semaine dans l'ordre"
c2.q.survivor: "Quel contrôleur de l'annuaire a survécu ? (son nom court)"
c2.q.admins: "Combien de membres compte le groupe admins-domaine ?"
c2.q.stale: "Quel membre du groupe n'aurait plus dû y être ? (son uid)"
c2.q.keep: "Qui garde les pleins pouvoirs sur l'annuaire reconstruit ?"
c2.q.keep.two: "Deux comptes nominatifs, seulement depuis un poste d'administration"
c2.q.keep.hourly: "Personne en permanence : des droits donnés pour une heure, à la demande"
c2.q.keep.everyone: "Les huit comme avant, pour relancer l'entreprise plus vite"
c2.contain.restore: "Reconstruire l'annuaire depuis le contrôleur qui a survécu, sur un réseau isolé, en retirant les comptes qui n'ont plus lieu d'être"
c2.tl.text: "La semaine de Transports Argos"
c2.tl.printer: "Un administrateur se connecte au poste de comptabilité avec adm-global"
c2.tl.power: "Une coupure de courant éteint le contrôleur du bureau d'Escale"
c2.tl.update: "Le logiciel de comptabilité installe sa mise à jour piégée"
c2.tl.wave: "Le programme saute de serveur en serveur avec adm-global"
c2.tl.stopped: "Le compte adm-global est désactivé, la vague s'arrête"
c2.tl.shipped: "Le contrôleur d'Escale, resté débranché, est rapporté au siège"
c2.tl.rebuilt: "L'annuaire est reconstruit depuis sa copie"
c2.ada.brief: "Lis l'état des contrôleurs : `cat traces/etat-controleurs.txt`."
c2.ada.g.survivor: "Un seul contrôleur est marqué intact. `answer survivor <nom court>`, par exemple dc1."
c2.ada.g.survivor.standard: "Trouve le contrôleur qui n'a pas été touché, et pourquoi."
c2.ada.survivor: "dc-escale, sauvé par une coupure de courant et par une équipe qui a suivi la consigne de ne pas le rebrancher. Avant de tout reconstruire dessus, regardons ce qu'il contient."
c2.ada.g.admins: "Lis le groupe des administrateurs avec le compte de lecture du mandat : `ldapsearch -x -H ldap://dc-escale.argos.test -D \"cn=lecteur-ir,ou=services,dc=argos,dc=test\" -w Lr-lecture-2027 -b dc=argos,dc=test \"(cn=admins-domaine)\" member`. Compte les membres, puis `answer admins <nombre>`."
c2.ada.g.admins.standard: "Lis sur dc-escale les membres du groupe admins-domaine et compte-les."
c2.ada.admins: "Huit comptes qui pouvaient tout faire, partout. Il suffisait qu'un seul laisse une session sur un poste ordinaire. Qui sont-ils ?"
c2.ada.g.stale: "`ldapsearch -x -H ldap://dc-escale.argos.test -D \"cn=lecteur-ir,ou=services,dc=argos,dc=test\" -w Lr-lecture-2027 -b dc=argos,dc=test \"(memberOf=cn=admins-domaine*)\" uid description`. Lis les descriptions, puis `answer stale <uid>`."
c2.ada.g.stale.standard: "Lis les descriptions des administrateurs et trouve celui qui n'a plus rien à faire chez Argos."
c2.ada.stale: "Un prestataire dont le contrat est fini depuis six mois, toujours administrateur du domaine. On ne le remet pas."
c2.ada.g.restore: "`contain restore annuaire`. La reconstruction prend la journée : c'est le prix."
c2.ada.g.restore.standard: "Reconstruis l'annuaire depuis le contrôleur qui a survécu, sans les comptes qui ont servi ou qui n'ont plus lieu d'être."
c2.ada.restore: "L'annuaire revient, sur un réseau isolé, sans adm-global ni ext-migration. Reste la vraie décision."
c2.ada.g.keep: "Aucune réponse n'est fausse : chacune coûte autre chose à l'équipe informatique."
c2.ada.keep: "Noté. Il reste à raconter la semaine."
c2.ada.g.story: "`timeline semaine` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline semaine <id> <id> …`."
c2.ada.g.story.standard: "Remets la semaine dans l'ordre, de la veille de l'attaque à la reconstruction."
c2.ada.done: "Argos se reconnecte. Sans une coupure de courant à Escale, il aurait fallu tout recréer à la main. La fiche qui suit raconte l'affaire réelle dont ce dossier s'inspire."
c2.hint.survivor.1: "`answer survivor dc-escale`"
c2.hint.admins.1: "La réponse de `ldapsearch` liste une ligne `member:` par membre."
c2.hint.admins.2: "`answer admins 8`"
c2.hint.stale.1: "Une description parle d'un contrat terminé."
c2.hint.stale.2: "`answer stale ext-migration`"
c2.hint.restore.1: "`contain restore annuaire`"
c2.hint.story.1: "Tout commence la veille, avec une imprimante, et finit par la reconstruction."
c2.hint.story.2: "`timeline semaine printer power update wave stopped shipped rebuilt`"
c2.debrief.title: "Le dernier contrôleur"
c2.debrief.lesson: "L'annuaire est la clé de tout le reste : sans lui, plus personne ne se connecte. Argos a été sauvé par une copie éteinte par hasard. Une sauvegarde de l'annuaire hors ligne, testée, et un groupe d'administrateurs réduit au strict nécessaire, ce n'est pas du hasard."
c2.debrief.p1: "Garder une sauvegarde de l'annuaire hors ligne, ailleurs que sur les serveurs qu'elle protège, et s'exercer à la restaurer."
c2.debrief.p2: "Réduire les administrateurs du domaine au strict minimum, et revoir la liste régulièrement."
c2.debrief.p3: "Retirer les droits d'un prestataire le jour où son contrat se termine."
c2.facts.title: "Ce qui s'est vraiment passé : NotPetya, juin 2017"
c2.facts.p1: "Le 27 juin 2017, NotPetya part d'une mise à jour de M.E.Doc, un logiciel de comptabilité ukrainien, et se répand en quelques heures dans les réseaux d'entreprises du monde entier."
c2.facts.p2: "Il ressemble à un rançongiciel, mais rien ne peut être récupéré : il détruit. Pour se propager, il réutilise les identifiants d'administrateurs trouvés sur les machines infectées, et une faille de Windows déjà corrigée."
c2.facts.p3: "Chez Maersk, premier transporteur maritime mondial, presque tous les contrôleurs de l'annuaire sont effacés. Une seule copie survit, au Ghana, sur un serveur éteint par une coupure de courant. Elle est rapportée en Europe pour tout reconstruire."
c2.facts.p4: "En une dizaine de jours, Maersk réinstalle environ 4 000 serveurs et 45 000 postes. L'entreprise estime le coût entre 250 et 300 millions de dollars."
c2.facts.p5: "En février 2018, les États-Unis et le Royaume-Uni attribuent NotPetya à l'armée russe. Les dégâts dans le monde sont estimés à environ 10 milliards de dollars."
