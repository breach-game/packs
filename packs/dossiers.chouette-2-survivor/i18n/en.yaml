c2.briefing: "Friday 2 July, 9:00. Since Tuesday, nobody can sign in at Argos Shipping: both directory controllers are wiped, and their backups with them. Ships are loaded by hand, on paper. The controllers' status is in `traces/`. The mandate's read account works on any controller still alive."
c2.obj.survivor: "Find the controller that survived"
c2.obj.admins: "Count the domain administrators"
c2.obj.stale: "Spot the account that should no longer have existed"
c2.obj.restore: "Rebuild the directory from that controller"
c2.obj.keep: "Decide who stays a domain administrator"
c2.obj.story: "Put the week in order"
c2.q.survivor: "Which directory controller survived? (its short name)"
c2.q.admins: "How many members does the admins-domaine group have?"
c2.q.stale: "Which group member should no longer have been in it? (its uid)"
c2.q.keep: "Who keeps full powers over the rebuilt directory?"
c2.q.keep.two: "Two named accounts, only from an admin workstation"
c2.q.keep.hourly: "Nobody permanently: rights granted for an hour, on request"
c2.q.keep.everyone: "All eight as before, to restart the company faster"
c2.contain.restore: "Rebuild the directory from the surviving controller, on an isolated network, removing the accounts that should no longer exist"
c2.tl.text: "Argos Shipping's week"
c2.tl.printer: "An administrator signs in to the accounting workstation with adm-global"
c2.tl.power: "A power cut switches off the Escale office's controller"
c2.tl.update: "The accounting software installs its trapped update"
c2.tl.wave: "The program hops from server to server with adm-global"
c2.tl.stopped: "The adm-global account is disabled, the wave stops"
c2.tl.shipped: "The Escale controller, left unplugged, is brought to head office"
c2.tl.rebuilt: "The directory is rebuilt from its copy"
c2.ada.brief: "Read the controllers' status: `cat traces/etat-controleurs.txt`."
c2.ada.g.survivor: "Only one controller is marked intact. `answer survivor <short name>`, for example dc1."
c2.ada.g.survivor.standard: "Find the controller that was not hit, and why."
c2.ada.survivor: "dc-escale, saved by a power cut and by a team that followed the instruction not to plug it back in. Before rebuilding everything on it, let's see what it holds."
c2.ada.g.admins: "Read the admin group with the mandate's read account: `ldapsearch -x -H ldap://dc-escale.argos.test -D \"cn=lecteur-ir,ou=services,dc=argos,dc=test\" -w Lr-lecture-2027 -b dc=argos,dc=test \"(cn=admins-domaine)\" member`. Count the members, then `answer admins <number>`."
c2.ada.g.admins.standard: "Read the members of the admins-domaine group on dc-escale and count them."
c2.ada.admins: "Eight accounts that could do anything, anywhere. It only took one of them leaving a session on an ordinary workstation. Who are they?"
c2.ada.g.stale: "`ldapsearch -x -H ldap://dc-escale.argos.test -D \"cn=lecteur-ir,ou=services,dc=argos,dc=test\" -w Lr-lecture-2027 -b dc=argos,dc=test \"(memberOf=cn=admins-domaine*)\" uid description`. Read the descriptions, then `answer stale <uid>`."
c2.ada.g.stale.standard: "Read the administrators' descriptions and find the one who has nothing left to do at Argos."
c2.ada.stale: "A contractor whose contract ended six months ago, still a domain administrator. It does not come back."
c2.ada.g.restore: "`contain restore annuaire`. Rebuilding takes the day: that is the price."
c2.ada.g.restore.standard: "Rebuild the directory from the controller that survived, without the accounts that were used or have no reason to exist."
c2.ada.restore: "The directory is back, on an isolated network, without adm-global or ext-migration. One real decision is left."
c2.ada.g.keep: "No answer is wrong: each one costs the IT team something different."
c2.ada.keep: "Noted. All that is left is telling the week's story."
c2.ada.g.story: "`timeline semaine` shows the events shuffled. Answer with their ids in order: `timeline semaine <id> <id> …`."
c2.ada.g.story.standard: "Put the week in order, from the day before the attack to the rebuild."
c2.ada.done: "Argos is signing in again. Without a power cut at Escale, everything would have had to be recreated by hand. The next card tells the real case this file is inspired by."
c2.hint.survivor.1: "`answer survivor dc-escale`"
c2.hint.admins.1: "The `ldapsearch` answer lists one `member:` line per member."
c2.hint.admins.2: "`answer admins 8`"
c2.hint.stale.1: "One description mentions a contract that has ended."
c2.hint.stale.2: "`answer stale ext-migration`"
c2.hint.restore.1: "`contain restore annuaire`"
c2.hint.story.1: "It all starts the day before, with a printer, and ends with the rebuild."
c2.hint.story.2: "`timeline semaine printer power update wave stopped shipped rebuilt`"
c2.debrief.title: "The last controller"
c2.debrief.lesson: "The directory is the key to everything else: without it, nobody signs in. Argos was saved by a copy switched off by chance. An offline, tested backup of the directory, and an admin group cut down to the bare minimum, are not left to chance."
c2.debrief.p1: "Keep an offline backup of the directory, away from the servers it protects, and practise restoring it."
c2.debrief.p2: "Cut domain administrators down to the bare minimum, and review the list regularly."
c2.debrief.p3: "Remove a contractor's rights on the day their contract ends."
c2.facts.title: "What really happened: NotPetya, June 2017"
c2.facts.p1: "On 27 June 2017, NotPetya starts from an update of M.E.Doc, a Ukrainian accounting program, and spreads within hours through company networks worldwide."
c2.facts.p2: "It looks like ransomware, but nothing can be recovered: it destroys. To spread, it reuses administrator credentials found on infected machines, and a Windows flaw that had already been patched."
c2.facts.p3: "At Maersk, the world's largest shipping company, nearly all directory controllers are wiped. A single copy survives, in Ghana, on a server switched off by a power cut. It is carried to Europe to rebuild everything."
c2.facts.p4: "In about ten days, Maersk reinstalls some 4,000 servers and 45,000 PCs. The company puts the cost at 250 to 300 million dollars."
c2.facts.p5: "In February 2018, the United States and the United Kingdom attribute NotPetya to the Russian military. Worldwide damage is estimated at about 10 billion dollars."
