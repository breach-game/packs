d2.briefing: "2:40 a.m., night watch. The customer vault backups sleep in storage, and the access log is yours: `soc`. The list of authorised keys is in `dossier/cles.txt`. If someone copies the backups tonight, you are allowed to cut them off."
d2.obj.stop: "Stop the copy before the last part"
d2.obj.src: "Give the address the copy comes from"
d2.obj.how: "Understand how the key got out"
d2.contain.revoke: "Withdraw key vd-devops-04 (the on-call engineer gets a new one in the morning)"
d2.contain.block: "Block address 203.0.113.47 at the storage firewall"
d2.contain.isolate: "Cut the storage off the network (tonight's backup fails)"
d2.q.src: "Which address is the backup copy coming from?"
d2.q.how: "Key vd-devops-04 is kept in the engineer's personal vault. How did it get out?"
d2.q.how.home: "Spyware on their home computer captured their master password"
d2.q.how.guess: "The intruder guessed the engineer's master password by trying a list of common words"
d2.q.how.guess.why: "Nothing points to it, and the security team's note says otherwise: a program recording keystrokes, on the home computer."
d2.q.how.inside: "The engineer handed it over: it must be someone on the inside"
d2.q.how.inside.why: "The engineer was at home, asleep. Their computer, though, was compromised through an old media server never updated."
d2.ada.brief: "Look at what is happening on the storage: `soc logs storage access`. Each line says which key was used."
d2.ada.list: "Someone is listing the backup bucket's content, with `aws-cli`. At this hour? Look at `soc logs storage access`."
d2.ada.part1: "First part downloaded: a gigabyte of customer vaults. Two to go. Decide fast."
d2.ada.part2: "Second part gone. Only one part left before the whole backup is out."
d2.ada.fail: "The last part is out, and from another address: the key was the only thing that mattered. We start the night again."
d2.ada.blocked: "Blocked. But an address changes in a minute, and the key still works everywhere."
d2.ada.costly: "That stops it, but tonight's backup fails too. A narrower measure would have done."
d2.ada.stopped: "The copy stops. The key is worthless now, wherever it comes from. Now, where was it coming from?"
d2.ada.g.stop: "Key `vd-devops-04` is downloading the backups, at night, from an address that is not Verdier's. Withdraw it: `contain revoke vd-devops-04`. It is the cheapest measure, and it does not depend on the address."
d2.ada.g.stop.standard: "Someone is copying the backups. Stop them with the cheapest measure, one they cannot get around by changing address: `contain` for the list."
d2.ada.g.src: "Read the source address of the first `aws-cli` lines touching `/vault-backups/`: `answer src <address>`."
d2.ada.g.src.standard: "Where was the copy coming from? `answer src`."
d2.ada.src: "A home address, outside Verdier. The security team examined the engineer's home computer with their consent: `cat dossier/poste-maison.txt`."
d2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
d2.ada.answer.standard: "My question is waiting in the messenger."
d2.ada.done: "A forgotten media server, a keylogger, a captured master password, and the personal vault that held the key to everyone's backups. Nobody broke the encryption: the key was taken where it slept."
d2.hint.stop.1: "Compare the `key=` column of the night lines with each key's usual use in `dossier/cles.txt`."
d2.hint.stop.2: "`contain` with no argument lists the measures. An address changes; a withdrawn key works nowhere."
d2.hint.stop.3: "`contain revoke vd-devops-04`"
d2.hint.src.1: "`answer src 203.0.113.47`"
d2.hint.how.1: "Read `dossier/poste-maison.txt`."
d2.debrief.title: "The key slept at home"
d2.debrief.lesson: "The backups were encrypted, and their key kept in a vault. But that vault opened from a poorly maintained home computer, and the key worked from anywhere. Withdrawing the key stops it for good; blocking an address only slows it down."
d2.debrief.p1: "Withdraw the credential, not just the address: the key is what opens."
d2.debrief.p2: "A key that opens every customer's data is only used from a managed device."
d2.debrief.p3: "Unusual access (time, address, volume) to critical data must wake someone up."
