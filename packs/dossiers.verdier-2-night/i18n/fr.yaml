d2.briefing: "2 h 40, nuit de garde. Les sauvegardes des coffres clients dorment dans le stockage, et le journal d'accès est à toi : `soc`. La liste des clés autorisées est dans `dossier/cles.txt`. Si quelqu'un copie les sauvegardes cette nuit, tu as le droit de couper."
d2.obj.stop: "Arrêter la copie avant la dernière partie"
d2.obj.src: "Donner l'adresse d'où part la copie"
d2.obj.how: "Comprendre comment la clé est sortie"
d2.contain.revoke: "Retirer la clé vd-devops-04 (l'ingénieur d'astreinte en recevra une nouvelle au matin)"
d2.contain.block: "Bloquer l'adresse 203.0.113.47 au pare-feu du stockage"
d2.contain.isolate: "Couper le stockage du réseau (la sauvegarde de cette nuit échoue)"
d2.q.src: "De quelle adresse part la copie des sauvegardes ?"
d2.q.how: "La clé vd-devops-04 est rangée dans le coffre personnel de l'ingénieur. Comment est-elle sortie ?"
d2.q.how.home: "Un logiciel espion sur son ordinateur personnel a capté son mot de passe maître"
d2.q.how.guess: "L'intrus a deviné le mot de passe maître de l'ingénieur en essayant une liste"
d2.q.how.guess.why: "Rien ne l'indique, et la note de l'équipe de sécurité dit autre chose : un programme qui enregistre les touches, sur l'ordinateur personnel."
d2.q.how.inside: "L'ingénieur l'a donnée lui-même, c'est forcément quelqu'un de l'intérieur"
d2.q.how.inside.why: "L'ingénieur était chez lui, endormi. Son ordinateur, lui, était compromis par un vieux serveur multimédia jamais mis à jour."
d2.ada.brief: "Regarde ce qui se passe sur le stockage : `soc logs storage access`. Chaque ligne dit quelle clé a servi."
d2.ada.list: "Quelqu'un liste le contenu du seau des sauvegardes, avec `aws-cli`. À cette heure-ci ? Regarde `soc logs storage access`."
d2.ada.part1: "Première partie téléchargée : un gigaoctet de coffres clients. Il en reste deux. Décide vite."
d2.ada.part2: "La deuxième partie est sortie. Plus qu'une avant que la sauvegarde entière soit dehors."
d2.ada.fail: "La dernière partie est dehors, et depuis une autre adresse : la clé était la seule chose qui comptait. On recommence au début de la nuit."
d2.ada.blocked: "Bloquée. Mais une adresse se change en une minute, et la clé, elle, marche encore partout."
d2.ada.costly: "Ça l'arrête, mais la sauvegarde de cette nuit échoue aussi. Une mesure plus fine aurait suffi."
d2.ada.stopped: "La copie s'arrête. La clé ne vaut plus rien, d'où qu'elle vienne. Maintenant, d'où partait-elle ?"
d2.ada.g.stop: "La clé `vd-devops-04` télécharge les sauvegardes, la nuit, depuis une adresse qui n'est pas celle de Verdier. Retire-la : `contain revoke vd-devops-04`. C'est la mesure qui coûte le moins et qui ne dépend pas de l'adresse."
d2.ada.g.stop.standard: "Quelqu'un copie les sauvegardes. Arrête-le avec la mesure qui coûte le moins et qu'il ne peut pas contourner en changeant d'adresse : `contain` pour voir la liste."
d2.ada.g.src: "Lis l'adresse source des premières lignes `aws-cli` qui touchent `/vault-backups/` : `answer src <adresse>`."
d2.ada.g.src.standard: "D'où partait la copie ? `answer src`."
d2.ada.src: "Une adresse de particulier, hors de Verdier. L'équipe de sécurité a examiné l'ordinateur personnel de l'ingénieur avec son accord : `cat dossier/poste-maison.txt`."
d2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
d2.ada.answer.standard: "Ma question t'attend dans la messagerie."
d2.ada.done: "Un serveur multimédia oublié, un enregistreur de frappe, un mot de passe maître capté, et le coffre personnel qui gardait la clé des sauvegardes de tout le monde. Personne n'a cassé le chiffrement : on a pris la clé là où elle dormait."
d2.hint.stop.1: "Compare la colonne `key=` des lignes nocturnes avec l'usage normal de chaque clé dans `dossier/cles.txt`."
d2.hint.stop.2: "`contain` sans argument liste les mesures. Une adresse se change, une clé retirée ne marche plus nulle part."
d2.hint.stop.3: "`contain revoke vd-devops-04`"
d2.hint.src.1: "`answer src 203.0.113.47`"
d2.hint.how.1: "Lis `dossier/poste-maison.txt`."
d2.debrief.title: "La clé dormait à la maison"
d2.debrief.lesson: "Les sauvegardes étaient chiffrées, et leur clé rangée dans un coffre. Mais ce coffre s'ouvrait depuis un ordinateur personnel mal entretenu, et la clé marchait de n'importe où. Retirer la clé l'arrête pour de bon ; bloquer une adresse ne fait que le ralentir."
d2.debrief.p1: "Retirer l'identifiant, pas seulement l'adresse : c'est la clé qui ouvre."
d2.debrief.p2: "Une clé qui ouvre les données de tous les clients ne s'utilise que depuis un poste géré."
d2.debrief.p3: "Un accès inhabituel (heure, adresse, volume) sur des données critiques doit réveiller quelqu'un."
