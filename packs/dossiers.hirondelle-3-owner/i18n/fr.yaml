h3.briefing: "Une requête a suffi pour lire le dossier témoin. La directrice générale demande deux choses : comment refermer, et comment personne ne l'a vu. Pour la seconde, le responsable informatique a retrouvé quelque chose dans un tiroir : la revue de sécurité de janvier l'avait déjà noté, comme un point mineur, sans date de correction."
h3.obj.logs: "Dire si le journal aurait pu alerter Hirondelle"
h3.obj.idea: "Choisir le correctif qui compte"
h3.obj.check: "Faire vérifier par le serveur qui demande"
h3.obj.links: "Rendre les liens impossibles à compter, et de courte durée"
h3.obj.alert: "Lever une alerte sur les demandes refusées"
h3.obj.finding: "Donner au constat de janvier son vrai poids et une date"
h3.q.logs: "Le portail a journalisé chacune de tes requêtes. Ce journal aurait-il pu alerter Hirondelle ?"
h3.q.logs.blind: "Non : chaque ligne est un lien valide, et aucune ne dit à qui est le document"
h3.q.logs.address: "Oui : notre adresse y figure, et ce n'est pas celle d'un locataire"
h3.q.logs.address.why: "Les locataires lisent de chez eux, du travail, d'un téléphone dans un train : des adresses nouvelles toute la journée. La nôtre ressemble aux autres."
h3.q.logs.volume: "Oui : nous avons demandé plus de documents qu'un locataire ne le fait"
h3.q.logs.volume.why: "Nous en avons demandé une poignée. Un locataire qui emménage en ouvre davantage en une soirée."
h3.q.idea: "Hirondelle veut un correctif d'abord. Lequel ?"
h3.q.idea.owner: "Faire se connecter le locataire, et vérifier sur le serveur que le document est à lui"
h3.q.idea.random: "Remplacer le compteur par de longs identifiants aléatoires, impossibles à deviner"
h3.q.idea.random.why: "À faire, comme seconde couche. Mais un lien transféré, ou resté dans un historique, ouvre toujours le dossier à celui qui le trouve."
h3.q.idea.hide: "Demander aux moteurs de recherche de ne pas lister le portail, et l'ôter du plan du site"
h3.q.idea.hide.why: "Cela cache la porte aux moteurs de recherche, pas à quelqu'un qui tient un lien et sait compter."
h3.check.check: "Le serveur vérifie que le document est au locataire connecté"
h3.check.links: "Les liens sont aléatoires et expirent"
h3.check.alert: "Des demandes refusées à la suite lèvent une alerte"
h3.check.finding: "Le constat de janvier est classé élevé, avec une date"
h3.check.works: "Le portail et son journal restent actifs"
h3.ada.brief: "Dernière matinée chez Hirondelle. Les réglages du portail sont dans `dossier/portail.yml`. Deux questions d'abord, parce que le rapport commence par elles."
h3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
h3.ada.answer.standard: "Réponds d'abord à ma question."
h3.ada.logs: "Oui. Un journal ne peut montrer qu'une différence que le serveur connaît. Tant que le serveur ne sait pas à qui est le document, un inconnu et un locataire laissent la même ligne. La détection vient après la vérification, pas à sa place."
h3.ada.idea: "Oui. Le serveur demande qui tu es, puis vérifie que le document est à toi, à chaque requête. Les deux autres sont des couches autour, et on en ajoutera une."
h3.ada.g.check: "Ouvre le fichier : `edit dossier/portail.yml`. Remplace `check: link-only` par `check: owner-session`, puis `verify`."
h3.ada.g.check.standard: "Ouvre `dossier/portail.yml` et change ce que le portail vérifie avant de répondre. Puis `verify`."
h3.ada.g.links: "Seconde couche, les liens : écris `ids: random` et `expire: 7-days`, puis `verify`."
h3.ada.g.links.standard: "Seconde couche : des liens qu'on ne peut pas compter, et qui cessent de marcher au bout d'un moment. Puis `verify`."
h3.ada.g.alert: "Maintenant le serveur refuse des choses, donc il y a quelque chose à surveiller : écris `refused_alert: on`, puis `verify`."
h3.ada.g.alert.standard: "Maintenant que le serveur refuse des demandes, fais-le prévenir quelqu'un. Puis `verify`."
h3.ada.alert: "Cette alerte était impossible hier : il n'y avait aucun refus à compter. Maintenant, un inconnu qui essaie des numéros laisse une traînée de refus."
h3.ada.g.finding: "Enfin, le constat de janvier en bas du fichier : écris `severity: high` et `fix_due: 30-days`, puis `verify`."
h3.ada.g.finding.standard: "Enfin, le constat de janvier en bas du fichier : donne-lui le poids qu'il mérite, et une date. Puis `verify`."
h3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
h3.ada.done: "Refermé. Et la partie que je veux en tête du rapport : la faille avait été trouvée en janvier. Elle a été notée comme mineure, personne n'en avait la charge, et elle a attendu. Ouvre le débrief : à la fin, le vrai cas, où ça s'est passé de la même façon."
h3.hint.logs.1: "Compare la ligne que tu as laissée avec celle d'un locataire qui ouvre son bail. Qu'est-ce qui change ?"
h3.hint.idea.1: "Quelle réponse tient encore le jour où un lien arrive dans de mauvaises mains ?"
h3.hint.check.1: "La ligne à changer est `check`, sous `access`. Les valeurs possibles sont dans les commentaires au-dessus."
h3.hint.check.2: "Tape `sed -i \"s/check: link-only/check: owner-session/\" dossier/portail.yml`, puis `verify`."
h3.hint.links.1: "Deux lignes à changer sous `links` : `ids` et `expire`."
h3.hint.links.2: "Tape `sed -i \"s/ids: counter/ids: random/\" dossier/portail.yml` et `sed -i \"s/expire: never/expire: 7-days/\" dossier/portail.yml`, puis `verify`."
h3.hint.alert.1: "La ligne à changer est `refused_alert`, sous `monitoring`."
h3.hint.alert.2: "Tape `sed -i \"s/refused_alert: off/refused_alert: on/\" dossier/portail.yml`, puis `verify`."
h3.hint.finding.1: "Deux lignes à changer sous `finding` : `severity` et `fix_due`."
h3.hint.finding.2: "Tape `sed -i \"s/severity: low/severity: high/\" dossier/portail.yml` et `sed -i \"s/fix_due: none/fix_due: 30-days/\" dossier/portail.yml`, puis `verify`."
h3.debrief.title: "Qui demande, à chaque fois"
h3.debrief.lesson: "Tu n'as pas rendu les liens plus durs à deviner en espérant. Tu as fait demander au serveur qui est là et vérifier que le document est à lui, puis tu as ajouté des couches autour. Et tu as donné une date à un constat qui n'en avait pas : une faille connue et non suivie est toujours ouverte."
h3.debrief.p1: "Le correctif de fond : à chaque requête, le serveur vérifie que l'objet est à celui qui demande."
h3.debrief.p2: "Des identifiants aléatoires et de courte durée en seconde couche : ils limitent ce qu'un lien perdu peut ouvrir."
h3.debrief.p3: "La détection a besoin de refus : dès que le serveur dit non, une série de non depuis une adresse est un signal."
h3.debrief.p4: "Un constat reçoit une gravité, un responsable et une date. Sans eux, une revue de sécurité ne protège rien."
h3.facts.title: "Ce qui s'est vraiment passé : First American Financial (2019)"
h3.facts.p1: "Hirondelle n'existe pas. Le scénario s'inspire de l'exposition révélée en mai 2019 chez First American Financial, un grand assureur de titres de propriété américain, qui traite les documents des ventes immobilières."
h3.facts.p2: "Selon le journaliste qui l'a révélé, toute personne qui avait le lien d'un document sur le site de l'entreprise pouvait en lire d'autres en changeant le numéro dans l'adresse, sans se connecter. Il a compté environ 885 millions de fichiers, les plus anciens datant de 2003."
h3.facts.p3: "Il s'agissait de documents de ventes immobilières : numéros et relevés de comptes bancaires, dossiers de prêt et d'impôts, numéros de sécurité sociale, images de permis de conduire."
h3.facts.p4: "La faille a été remarquée par un professionnel de l'immobilier, qui dit l'avoir signalée à l'entreprise sans succès avant d'écrire au journaliste. L'entreprise a fermé l'accès extérieur à l'application une fois contactée par la presse."
h3.facts.p5: "En juin 2021, le régulateur américain des marchés, la SEC, a infligé à l'entreprise une amende de près de 490 000 dollars. Son communiqué indique que l'équipe de sécurité de l'entreprise avait identifié la faille dans un rapport de janvier 2019, qu'elle n'a pas été corrigée comme les règles internes l'exigeaient, et que les dirigeants qui ont rédigé les déclarations publiques n'en avaient pas été informés."
h3.facts.p6: "Les deux leçons de ce dossier y sont : un serveur doit vérifier qui demande, et une faille trouvée doit être suivie jusqu'à sa fermeture."
