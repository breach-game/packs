h3.briefing: "One request was enough to read the witness file. The managing director asks two things: how to close it, and how nobody noticed. For the second one, the IT manager found something in a drawer: the January security review had already written it down, as a minor point, with no date to fix it."
h3.obj.logs: "Say whether the log could have warned Hirondelle"
h3.obj.idea: "Choose the fix that counts"
h3.obj.check: "Make the server check who asks"
h3.obj.links: "Make links impossible to count, and short-lived"
h3.obj.alert: "Raise an alert on refused requests"
h3.obj.finding: "Give the January finding its real weight and a date"
h3.q.logs: "The portal logged each of your requests. Could that log have warned Hirondelle?"
h3.q.logs.blind: "No: each line is a valid link, and none says whose document it is"
h3.q.logs.address: "Yes: our address is in it, and it is not the address of a tenant"
h3.q.logs.address.why: "Tenants read from home, from work, from a phone on a train: new addresses all day. Ours looks like any of them."
h3.q.logs.volume: "Yes: we asked for more documents, and faster, than a tenant ever does"
h3.q.logs.volume.why: "We asked for a handful. A tenant who moves in opens more than that in one evening."
h3.q.idea: "Hirondelle wants one fix first. Which one?"
h3.q.idea.owner: "Make tenants sign in, and check on the server that the document is theirs"
h3.q.idea.random: "Replace the counter with long random identifiers that nobody could ever guess"
h3.q.idea.random.why: "Worth doing, as a second layer. But a link that is forwarded, or left in a browser history, still opens the file for whoever finds it."
h3.q.idea.hide: "Ask search engines not to list the portal, and take it off the site map"
h3.q.idea.hide.why: "That hides the door from search engines, not from someone who holds one link and can count."
h3.check.check: "The server checks that the document belongs to the signed-in tenant"
h3.check.links: "Links are random and expire"
h3.check.alert: "Refused requests in a row raise an alert"
h3.check.finding: "The January finding is rated high, with a date"
h3.check.works: "The portal and its log stay on"
h3.ada.brief: "Last morning at Hirondelle. The portal's settings are in `dossier/portail.yml`. Two questions first, because the report starts with them."
h3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
h3.ada.answer.standard: "Answer my question first."
h3.ada.logs: "Right. A log can only show a difference the server knows about. As long as the server does not know whose document it is, a stranger and a tenant leave the same line. Detection comes after the check, not instead of it."
h3.ada.idea: "Yes. The server asks who you are, then checks that the document is yours, on every request. The other two are layers around it, and we will add one."
h3.ada.g.check: "Open the file: `edit dossier/portail.yml`. Replace `check: link-only` with `check: owner-session`, then `verify`."
h3.ada.g.check.standard: "Open `dossier/portail.yml` and change what the portal checks before it answers. Then `verify`. To open the file: `edit dossier/portail.yml`."
h3.ada.g.links: "Second layer, the links: write `ids: random` and `expire: 7-days`, then `verify`."
h3.ada.g.links.standard: "Second layer: links that cannot be counted, and that stop working after a while. Then `verify`."
h3.ada.g.alert: "Now the server refuses things, so there is something to watch: write `refused_alert: on`, then `verify`."
h3.ada.g.alert.standard: "Now that the server refuses requests, have it warn someone. Then `verify`."
h3.ada.alert: "That alert was impossible yesterday: there was no refusal to count. Now a stranger who tries numbers leaves a trail of refusals."
h3.ada.g.finding: "Last, the January finding at the bottom of the file: write `severity: high` and `fix_due: 30-days`, then `verify`."
h3.ada.g.finding.standard: "Last, the January finding at the bottom of the file: give it the weight it deserves, and a date. Then `verify`."
h3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
h3.ada.done: "Closed. And the part I want at the top of the report: the flaw had been found in January. It was written down as minor, nobody owned it, and it waited. Open the debrief: at the end, the real case, where it went the same way."
h3.hint.logs.1: "Compare the line you left with the line of a tenant opening their own lease. What differs?"
h3.hint.idea.1: "Which answer still holds on the day a link ends up in the wrong hands?"
h3.hint.check.1: "The line to change is `check`, under `access`. The possible values are in the comments above it."
h3.hint.check.2: "With the editor: `edit dossier/portail.yml`, then Ctrl+S. With a command: type `sed -i \"s/check: link-only/check: owner-session/\" dossier/portail.yml`, then `verify`."
h3.hint.links.1: "Two lines to change under `links`: `ids` and `expire`."
h3.hint.links.2: "With the editor: `edit dossier/portail.yml`, then Ctrl+S. With a command: type `sed -i \"s/ids: counter/ids: random/\" dossier/portail.yml` and `sed -i \"s/expire: never/expire: 7-days/\" dossier/portail.yml`, then `verify`."
h3.hint.alert.1: "The line to change is `refused_alert`, under `monitoring`."
h3.hint.alert.2: "With the editor: `edit dossier/portail.yml`, then Ctrl+S. With a command: type `sed -i \"s/refused_alert: off/refused_alert: on/\" dossier/portail.yml`, then `verify`."
h3.hint.finding.1: "Two lines to change under `finding`: `severity` and `fix_due`."
h3.hint.finding.2: "With the editor: `edit dossier/portail.yml`, then Ctrl+S. With a command: type `sed -i \"s/severity: low/severity: high/\" dossier/portail.yml` and `sed -i \"s/fix_due: none/fix_due: 30-days/\" dossier/portail.yml`, then `verify`."
h3.debrief.title: "Who asks, every time"
h3.debrief.lesson: "You did not make the links harder to guess and hope. You made the server ask who is there and check that the document is theirs, then you added layers around that. And you gave a date to a finding that had none: a flaw that is known and not followed is still open."
h3.debrief.p1: "The root fix: on every request, the server checks that the object belongs to the person asking."
h3.debrief.p2: "Random, short-lived identifiers as a second layer: they limit what a lost link can open."
h3.debrief.p3: "Detection needs refusals: once the server says no, a series of no from one address is a signal."
h3.debrief.p4: "A finding gets a severity, an owner and a date. Without them, a security review protects nothing."
h3.facts.title: "What really happened: First American Financial (2019)"
h3.facts.p1: "Hirondelle does not exist. The scenario is inspired by the exposure revealed in May 2019 at First American Financial, a large American title insurance company, which handles the paperwork of property sales."
h3.facts.p2: "According to the journalist who revealed it, anyone who had the link to one document on the company's website could read others by changing the number in the address, without signing in. He counted about 885 million files, the oldest from 2003."
h3.facts.p3: "These were documents from property sales: bank account numbers and statements, mortgage and tax records, social security numbers, images of driving licences."
h3.facts.p4: "The flaw was noticed by a real-estate professional, who says he reported it to the company without success before writing to the journalist. The company closed outside access to the application once the press contacted it."
h3.facts.p5: "In June 2021 the American market regulator, the SEC, fined the company close to 490,000 dollars. Its statement says the company's own security staff had identified the flaw several months earlier, that it was not fixed as the company's own rules required, and that the executives who wrote the public statements had not been told."
h3.facts.p6: "Both lessons of this case file are there: a server must check who asks, and a flaw that has been found must be followed until it is closed."
