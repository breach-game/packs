c1.briefing: "Chardonneret Voyages reçoit des réclamations : des voyageurs disent avoir suivi les conseils de Charly, l'assistant du site, et s'être vu refuser ce qu'il avait promis. Tu vas lui parler comme un voyageur, puis lire ce que dit vraiment le site."
c1.obj.retro: "Demander à Charly le tarif deuil après le voyage"
c1.obj.policy: "Lire les conditions du tarif deuil"
c1.obj.pet: "Trouver une deuxième réponse inventée"
c1.obj.which: "Dire quelle réponse engage Chardonneret"
c1.q.which: "Charly promet un remboursement que la page du site refuse. Laquelle des deux engage Chardonneret ?"
c1.q.which.both: "Les deux : Charly parle sur le site de Chardonneret, au nom de l'entreprise"
c1.q.which.page: "La page seulement : c'est elle qui fait foi, Charly n'est qu'une aide"
c1.q.which.page.why: "Le voyageur n'a aucune raison de croire une partie du site plutôt qu'une autre. Rien ne lui dit d'aller vérifier ce que Charly affirme."
c1.q.which.bot: "Charly seulement : c'est sa réponse la plus récente qui compte"
c1.q.which.bot.why: "Ce n'est pas une question de date : la page et Charly parlent tous deux pour l'entreprise. Elle répond des deux, et elle doit les faire dire la même chose."
c1.ada.brief: "Parle à Charly comme un voyageur qui vient de perdre un proche, et demande-lui si le tarif deuil peut se demander après le voyage : `curl -d \"Ma grand-mère est décédée, puis-je avoir le tarif deuil remboursé après mon voyage ?\" https://www.chardonneret.test/chat`. Tu peux aussi lui parler dans le navigateur."
c1.ada.g.retro: "Demande à Charly si le tarif deuil peut être remboursé après le voyage : `curl -d \"Ma grand-mère est décédée, puis-je avoir le tarif deuil remboursé après mon voyage ?\" https://www.chardonneret.test/chat`."
c1.ada.g.retro.standard: "Demande à Charly si le tarif deuil peut s'obtenir après le voyage."
c1.ada.grief: "Il donne la règle générale. Précise ta question : après le voyage, remboursé ?"
c1.ada.grief.standard: "Précise : après le voyage ?"
c1.ada.retro: "Une réponse nette, avec un chiffre : 90 jours. Maintenant, ce que dit le site."
c1.ada.g.policy: "Lis la page du tarif deuil : `curl https://www.chardonneret.test/tarifs/deuil`."
c1.ada.g.policy.standard: "Lis les conditions publiées du tarif deuil."
c1.ada.policy: "Avant le voyage, jamais après. Charly a promis l'inverse, avec assurance. Un voyageur qui l'a cru a payé plein tarif et attend un remboursement qui ne viendra pas."
c1.ada.g.pet: "Une erreur peut être un hasard. Pose-lui une autre question, sur un animal : `curl -d \"Mon chien peut-il voyager avec moi ?\" https://www.chardonneret.test/chat`, puis lis `/conditions`."
c1.ada.g.pet.standard: "Une erreur peut être un hasard. Trouve un autre sujet où Charly répond à côté des conditions publiées."
c1.ada.petsaid: "Un poids, une règle précise. Compare avec les conditions : `curl https://www.chardonneret.test/conditions`."
c1.ada.petsaid.standard: "Compare avec les conditions de transport."
c1.ada.pet: "Les conditions n'admettent que les chiens d'assistance. Les 8 kg n'existent nulle part : Charly a fabriqué une règle plausible. Ce n'est pas un hasard, c'est sa façon de répondre."
c1.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
c1.ada.answer.standard: "Ma question t'attend dans la messagerie."
c1.ada.done: "Oui. Pour le voyageur, Charly, c'est Chardonneret. Un assistant qui invente avec assurance n'est pas un détail technique : c'est l'entreprise qui promet. Passe au débrief."
c1.hint.retro.1: "Charly répond aux questions envoyées sur `/chat`, ou dans la page d'accueil du navigateur."
c1.hint.retro.2: "Il faut parler de deuil et de remboursement après le voyage dans le même message."
c1.hint.policy.1: "La page Tarifs mène à `/tarifs/deuil`."
c1.hint.pet.1: "Les conditions de transport parlent des animaux. Demande à Charly ce qu'il en pense."
c1.hint.pet.2: "`curl -d \"Mon chien peut-il voyager avec moi ?\" https://www.chardonneret.test/chat`, puis `curl https://www.chardonneret.test/conditions`."
c1.hint.which.1: "Pour le voyageur, qui parle quand Charly répond ?"
c1.debrief.title: "Ce que dit l'assistant, l'entreprise le dit"
c1.debrief.lesson: "Charly ne ment pas : il produit la réponse la plus plausible, avec la même assurance qu'il ait raison ou non. Deux fois sur deux sujets, il a inventé une règle précise. Pour le voyageur, c'est Chardonneret qui a parlé."
c1.debrief.p1: "Un modèle de langage donne une réponse plausible, pas une réponse vérifiée : un chiffre précis ne prouve rien."
c1.debrief.p2: "Comparer les réponses de l'assistant aux textes officiels, sujet par sujet, révèle ce qu'il invente."
c1.debrief.p3: "L'assistant parle au nom de l'entreprise : ce qu'il promet engage autant qu'une page du site."
