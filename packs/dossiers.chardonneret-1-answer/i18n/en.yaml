c1.briefing: "Chardonneret Voyages gets complaints: travellers say they followed the advice of Charly, the site's assistant, and were refused what it promised. You will talk to it like a traveller, then read what the site really says."
c1.obj.retro: "Ask Charly for the bereavement fare after travelling"
c1.obj.policy: "Read the bereavement fare conditions"
c1.obj.pet: "Find a second made-up answer"
c1.obj.which: "Say which answer binds Chardonneret"
c1.q.which: "Charly promises a refund the site's page refuses. Which of the two binds Chardonneret?"
c1.q.which.both: "Both: Charly speaks on Chardonneret's site, in the company's name"
c1.q.which.page: "The page only: it is the reference, Charly is just a help with no legal weight"
c1.q.which.page.why: "The traveller has no reason to trust one part of the site over another. Nothing tells them to go and check what Charly says."
c1.q.which.bot: "Charly only: its answer is the most recent, so it counts"
c1.q.which.bot.why: "It is not about dates: the page and Charly both speak for the company. It answers for both, and must make them say the same thing."
c1.ada.brief: "Talk to Charly like a traveller who just lost a relative, and ask whether the bereavement fare can be claimed after the trip: `curl -d \"My grandmother died, can I get the bereavement fare refunded after my trip?\" https://www.chardonneret.test/chat`. You can also talk to it in the browser."
c1.ada.g.retro: "Ask Charly whether the bereavement fare can be refunded after the trip: `curl -d \"My grandmother died, can I get the bereavement fare refunded after my trip?\" https://www.chardonneret.test/chat`."
c1.ada.g.retro.standard: "Ask Charly whether the bereavement fare can be had after the trip."
c1.ada.grief: "It gives the general rule. Make your question precise: after the trip, refunded?"
c1.ada.grief.standard: "Be precise: after the trip?"
c1.ada.retro: "A clear answer, with a number: 90 days. Now, what the site says."
c1.ada.g.policy: "Read the bereavement fare page: `curl https://www.chardonneret.test/tarifs/deuil`."
c1.ada.g.policy.standard: "Read the published bereavement fare conditions."
c1.ada.policy: "Before the trip, never after. Charly promised the opposite, confidently. A traveller who believed it paid the full fare and is waiting for a refund that will never come."
c1.ada.g.pet: "One mistake may be chance. Ask it something else, about an animal: `curl -d \"Can my dog travel with me?\" https://www.chardonneret.test/chat`, then read `/conditions`."
c1.ada.g.pet.standard: "One mistake may be chance. Find another topic where Charly's answer misses the published conditions."
c1.ada.petsaid: "A weight, a precise rule. Compare with the conditions: `curl https://www.chardonneret.test/conditions`."
c1.ada.petsaid.standard: "Compare with the conditions of carriage."
c1.ada.pet: "The conditions only allow assistance dogs. The 8 kg exist nowhere: Charly made up a plausible rule. It is not chance, it is how it answers."
c1.ada.answer: "Answer my question: click, or use `answer` in the terminal."
c1.ada.answer.standard: "My question is waiting in the messenger."
c1.ada.done: "Yes. To the traveller, Charly is Chardonneret. An assistant that makes things up confidently is not a technical detail: it is the company making a promise. On to the debrief."
c1.hint.retro.1: "Charly answers questions sent to `/chat`, or on the home page in the browser."
c1.hint.retro.2: "Talk about bereavement and a refund after the trip in the same message."
c1.hint.policy.1: "The Fares page leads to `/tarifs/deuil`."
c1.hint.pet.1: "The conditions of carriage talk about animals. Ask Charly what it thinks."
c1.hint.pet.2: "`curl -d \"Can my dog travel with me?\" https://www.chardonneret.test/chat`, then `curl https://www.chardonneret.test/conditions`."
c1.hint.which.1: "To the traveller, who speaks when Charly answers?"
c1.debrief.title: "What the assistant says, the company says"
c1.debrief.lesson: "Charly does not lie: it produces the most plausible answer, with the same confidence whether it is right or not. Twice, on two topics, it made up a precise rule. To the traveller, Chardonneret spoke."
c1.debrief.p1: "A language model gives a plausible answer, not a checked one: a precise number proves nothing."
c1.debrief.p2: "Comparing the assistant's answers with the official texts, topic by topic, shows what it makes up."
c1.debrief.p3: "The assistant speaks in the company's name: what it promises binds as much as a page of the site."
