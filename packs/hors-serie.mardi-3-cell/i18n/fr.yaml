m3.briefing: "Mardi, fin de matinée. La direction des opérations réunit la cellule de crise. Elle veut trois choses : le récit de la nuit dans l'ordre, les zones d'hiver remises en service (la tempête est annoncée pour jeudi), et ce qui change pour que ça n'arrive plus. L'équipe a livré une version corrigée, 4.2.1. La main courante est dans `cellule/`."
m3.obj.order: "Raconter la nuit dans l'ordre"
m3.obj.winter: "Remettre les zones d'hiver en service, proprement, et le vérifier"
m3.obj.change: "Dire ce qui change pour la prochaine livraison"
m3.obj.tell: "Décider quoi dire aux clients"
m3.tl.text: "De la première sauvegarde vide à l'appel de l'astreinte"
m3.tl.sauvegarde: "La première sauvegarde nocturne archive un message d'erreur au lieu de la base"
m3.tl.livraison: "La version 4.2.0 est installée, option des zones d'hiver allumée"
m3.tl.migration: "La migration 0042 réécrit la table des zones"
m3.tl.abandon: "systemd abandonne après des redémarrages en boucle"
m3.tl.appel: "Le dépôt nord appelle : aucune tournée sur les terminaux"
m3.tl.astreinte: "L'astreinte informatique est appelée"
m3.q.change: "Qu'est-ce qui aurait arrêté la nuit à 6 h 01, sans que personne ne soit réveillé ?"
m3.q.change.canary: "Livrer d'abord à un seul dépôt, et ne continuer que si la page de santé répond"
m3.q.change.daytime: "Interdire les livraisons la nuit, n'en faire que l'après-midi"
m3.q.change.daytime.why: "Le plantage aurait eu lieu l'après-midi, avec les camions en route. Le problème n'est pas l'heure, c'est de livrer partout d'un coup sans regarder la santé du service."
m3.q.change.approval: "Faire valider chaque livraison par un responsable avant l'envoi"
m3.q.change.approval.why: "La 4.2.0 aurait été validée : elle passait ses tests. Un humain qui signe ne voit pas un plantage au démarrage, une page de santé si."
m3.q.tell: "Une centaine de magasins ont été livrés avec 40 minutes à deux heures de retard. Que leur dire ?"
m3.q.tell.everyone: "Un message à tous les clients : ce qui s'est passé, le retard, ce qui change"
m3.q.tell.everyone.why: "Honnête et court. Quelques clients qui n'avaient rien remarqué l'apprennent, mais personne ne l'apprend par un autre."
m3.q.tell.late: "Un message seulement aux magasins livrés en retard"
m3.q.tell.late.why: "Raisonnable, mais les chauffeurs en parlent entre dépôts et magasins. Ceux qui l'apprennent autrement se demandent ce qu'on leur cache."
m3.q.tell.nothing: "Rien : les livraisons sont arrivées, c'est un incident interne"
m3.q.tell.nothing.why: "Les magasins ont vu le retard. Sans explication, ils en inventent une, et la prochaine fois ils appelleront un concurrent."
m3.ada.brief: "Affiche la nuit à remettre dans l'ordre : `timeline nuit`. Les heures sont dans la main courante (`cat cellule/main-courante.txt`) et dans les journaux des deux serveurs."
m3.ada.g.order: "Relis les journaux : `ssh astreinte@planif.gavotte.test` puis `journalctl -u tournees`, et `ssh astreinte@sauvegarde.gavotte.test` puis `journalctl -u sauvegarde-nuit`. Ensuite `timeline nuit <id> <id>…`, du plus ancien au plus récent."
m3.ada.g.order.standard: "Date chaque événement à partir de la main courante et des journaux, puis `timeline nuit`."
m3.ada.order: "Remarque le début : tout commence trois jours avant la livraison, avec une sauvegarde vide que personne n'a lue."
m3.ada.g.winter: "Dans l'ordre : la version corrigée d'abord, `deploy tournees 4.2.1`, puis l'option seule, `flag set planif.zones-hiver on`, puis `curl -s https://planif.gavotte.test/sante`. Deux gestes séparés, vérifiés."
m3.ada.g.winter.standard: "Remets les zones d'hiver en service sans refaire la nuit de mardi. `deploy` et `flag`, puis vérifie."
m3.ada.deployed: "4.2.1 en place, option toujours éteinte. Le service répond. Maintenant, l'option, seule."
m3.ada.again: "Attention : l'option sur la 4.2.0, c'est exactement mardi 6 h. Éteins-la, ou livre d'abord la 4.2.1."
m3.ada.change: "Un dépôt d'abord, une page de santé qui décide. La nuit de mardi aurait coûté un dépôt pendant dix minutes, et l'astreinte aurait dormi."
m3.ada.g.change: "Pense à ce qui aurait vu le plantage avant les chauffeurs, sans réveiller personne."
m3.ada.g.tell: "Aucune mauvaise réponse ici, seulement un coût. Choisis."
m3.ada.done: "La cellule de crise est levée. Trois changements : une livraison progressive, une sauvegarde qui échoue bruyamment et qu'on restaure chaque mois, une option neuve toujours livrée éteinte."
m3.hint.order.1: "Sauvegarde vide le 20 à 2 h, livraison 5 h 58, migration 6 h 00, abandon 6 h 01, appel du dépôt 6 h 20, astreinte 6 h 35."
m3.hint.order.2: "`timeline nuit sauvegarde livraison migration abandon appel astreinte`"
m3.hint.winter.1: "`deploy tournees 4.2.1`, puis `flag set planif.zones-hiver on`"
m3.hint.winter.2: "`curl -s https://planif.gavotte.test/sante`"
m3.hint.change.1: "`answer canary`"
m3.debrief.title: "La cellule de crise"
m3.debrief.lesson: "Il n'y a pas eu d'attaquant mardi. Il y a eu une sauvegarde qui mentait depuis trois jours, une livraison partout à la fois, une option neuve déjà allumée, et aucune alerte avant le premier chauffeur. Chacun de ces maillons était banal. C'est leur alignement qui a fait le mardi noir."
m3.debrief.p1: "Livrer progressivement, et laisser la santé du service décider de la suite."
m3.debrief.p2: "Séparer la livraison du code et l'allumage d'une option : deux gestes, deux vérifications."
m3.debrief.p3: "Un post-mortem cherche les maillons, pas un coupable : chacun était raisonnable seul."
