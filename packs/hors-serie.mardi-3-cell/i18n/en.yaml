m3.briefing: "Tuesday, late morning. The head of operations calls the crisis room together. They want three things: the story of the night in order, the winter zones back in service (the storm is forecast for Thursday), and what changes so it never happens again. The team has shipped a fixed version, 4.2.1. The incident log is in `cellule/`."
m3.obj.order: "Tell the night in order"
m3.obj.winter: "Bring the winter zones back cleanly, and check it"
m3.obj.change: "Say what changes for the next release"
m3.obj.tell: "Decide what to tell the customers"
m3.tl.text: "From the first empty backup to the on-call page"
m3.tl.sauvegarde: "The first nightly backup archives an error message instead of the database"
m3.tl.livraison: "Version 4.2.0 is installed, winter zones option on"
m3.tl.migration: "Migration 0042 rewrites the zones table"
m3.tl.abandon: "systemd gives up after a loop of restarts"
m3.tl.appel: "The north depot calls: no rounds on the terminals"
m3.tl.astreinte: "The IT on-call is paged"
m3.q.change: "What would have stopped the night at 6:01, without waking anyone up?"
m3.q.change.canary: "Ship to one depot first, carry on only if the health page answers"
m3.q.change.daytime: "Forbid releases at night, and only ship in the afternoon"
m3.q.change.daytime.why: "The crash would have happened in the afternoon, with the trucks on the road. The problem is not the time, it is shipping everywhere at once without looking at the service's health."
m3.q.change.approval: "Have a manager approve every release before it ships"
m3.q.change.approval.why: "4.2.0 would have been approved: it passed its tests. A human signing does not see a crash at start, a health page does."
m3.q.tell: "About a hundred shops were delivered 40 minutes to two hours late. What do you tell them?"
m3.q.tell.everyone: "A message to every customer: what happened, the delay, what changes"
m3.q.tell.everyone.why: "Honest and short. A few customers who noticed nothing learn about it, but nobody learns it from someone else."
m3.q.tell.late: "A message only to the shops delivered late"
m3.q.tell.late.why: "Reasonable, but drivers talk between depots and shops. Those who hear it another way wonder what is being hidden."
m3.q.tell.nothing: "Nothing: the deliveries arrived, it is an internal incident"
m3.q.tell.nothing.why: "The shops saw the delay. Without an explanation they make one up, and next time they call a competitor."
m3.ada.brief: "Show the night to put in order: `timeline nuit`. The times are in the incident log (`cat cellule/main-courante.txt`) and in both servers' journals."
m3.ada.g.order: "Read the journals again: `ssh astreinte@planif.gavotte.test` then `journalctl -u tournees`, and `ssh astreinte@sauvegarde.gavotte.test` then `journalctl -u sauvegarde-nuit`. Then `timeline nuit <id> <id>…`, oldest first."
m3.ada.g.order.standard: "Date each event from the incident log and the journals, then `timeline nuit`."
m3.ada.order: "Notice the start: it all begins three days before the release, with an empty backup nobody read."
m3.ada.g.winter: "In order: the fixed version first, `deploy tournees 4.2.1`, then the option alone, `flag set planif.zones-hiver on`, then `curl -s https://planif.gavotte.test/sante`. Two separate moves, each checked."
m3.ada.g.winter.standard: "Bring the winter zones back without replaying Tuesday night. `deploy` and `flag`, then check."
m3.ada.deployed: "4.2.1 in place, option still off. The service answers. Now the option, on its own."
m3.ada.again: "Careful: the option on 4.2.0 is exactly Tuesday at 6:00. Switch it off, or ship 4.2.1 first."
m3.ada.change: "One depot first, a health page that decides. Tuesday night would have cost one depot for ten minutes, and the on-call would have slept."
m3.ada.g.change: "Think of what would have seen the crash before the drivers did, without waking anyone."
m3.ada.g.tell: "No wrong answer here, only a cost. Choose."
m3.ada.done: "The crisis room stands down. Three changes: progressive releases, a backup that fails loudly and is restored every month, a new option always shipped off."
m3.hint.order.1: "Empty backup on the 20th at 2:00, release 5:58, migration 6:00, give-up 6:01, depot call 6:20, on-call 6:35."
m3.hint.order.2: "`timeline nuit sauvegarde livraison migration abandon appel astreinte`"
m3.hint.winter.1: "`deploy tournees 4.2.1`, then `flag set planif.zones-hiver on`"
m3.hint.winter.2: "`curl -s https://planif.gavotte.test/sante`"
m3.hint.change.1: "`answer canary`"
m3.debrief.title: "The crisis room"
m3.debrief.lesson: "There was no attacker on Tuesday. There was a backup that had been lying for three days, a release everywhere at once, a new option already on, and no alert before the first driver. Each of those links was ordinary. Their lining up made Black Tuesday."
m3.debrief.p1: "Ship progressively, and let the service's health decide what comes next."
m3.debrief.p2: "Separate shipping code from switching an option on: two moves, two checks."
m3.debrief.p3: "A post-mortem looks for the links, not a culprit: each one was reasonable on its own."
