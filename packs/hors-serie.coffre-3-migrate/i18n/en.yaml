c3.briefing: "The insurer agrees to migrate. The password storage policy is in `coffre/mots-de-passe.yml`. Write it, deploy it, check, then decide what to tell members."
c3.obj.algo: "A slow algorithm, a salt per account"
c3.obj.legacy: "Protect the old hashes without waiting"
c3.obj.deploy: "Deploy the new policy"
c3.obj.sample: "Check the format of the new hashes"
c3.obj.tell: "Decide what to tell members"
c3.contain.deploy: "Deploy the new password policy on the Vault (sign-ins slower for an hour)"
c3.q.sample: "Which algorithm does the sample hash use now? (as `hashid` writes it, in lowercase)"
c3.q.tell: "The copy may have got out. What does the insurer tell its members?"
c3.q.tell.targeted: "Tell every member, and force a new password on accounts from before 2019"
c3.q.tell.everyone: "Force a new password on every member, from tomorrow"
c3.q.tell.quiet: "Migrate without a word: nothing proves the copy got out"
c3.check.algo: "Argon2id, a salt per account"
c3.check.legacy: "Old hashes wrapped, replaced at sign-in, no more shared temporary password"
c3.check.works: "The Argon2id settings are still there"
c3.ada.brief: "Read the policy: `cat coffre/mots-de-passe.yml`. The Argon2id settings are already there, nobody used them."
c3.ada.g.algo: "First the algorithm: `algorithm: argon2id` and `salt: per-account`. `sed -i` or `edit coffre/mots-de-passe.yml`, then `verify`."
c3.ada.g.algo.standard: "First, a slow algorithm and a salt per account. Then `verify`."
c3.ada.algo: "New passwords are safe. But a member who never signs in would keep their SHA-1 forever."
c3.ada.g.legacy: "`legacy_sha1: wrap` wraps each old hash in Argon2id right away. `on_login: rehash` replaces it with a proper one at the next sign-in. And `temporary_password: random-single-use`. Then `verify`."
c3.ada.g.legacy.standard: "Protect the old hashes without waiting for everyone to sign in, and be done with the shared temporary password. Then `verify`."
c3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
c3.ada.ready: "The policy holds. Deploy it: `contain rotate coffre`. An hour of slightly slow sign-ins, while the old hashes get wrapped."
c3.ada.g.deploy: "Deploy the policy: `contain rotate coffre`."
c3.ada.g.deploy.standard: "Deploy the new policy on the Vault."
c3.ada.deployed: "Deployed. Don't take my word for it: look at what really gets written to the database."
c3.ada.g.sample: "Fetch the sample hash and give it to `hashid`: `curl https://coffre.tilleul.test/api/exemple-empreinte | jq -r .password_hash | hashid`. Then `answer sample <algorithm>`."
c3.ada.g.sample.standard: "Check the new hash format, then `answer sample`."
c3.ada.sample: "Argon2, and the line says it all: 64 MiB of memory, three passes, a salt. The hardest decision remains."
c3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
c3.ada.answer.standard: "My question is waiting in the messenger."
c3.ada.targeted: "The balanced choice: everyone knows what happened, and those whose hash was weak change their password."
c3.ada.everyone: "The most careful, and the heaviest: customer service will drown in calls, for recent accounts that risked little."
c3.ada.quiet: "The cheapest today. But if the copy got out, six members have a password everyone knows, and they will not know it. For health data, the regulator will ask why."
c3.ada.done: "A forgotten copy, a guessable link, a 2016 algorithm. Three settings, and the Vault finally lives up to its name."
c3.hint.algo.1: "`sed -i \"s/algorithm: sha1/algorithm: argon2id/\" coffre/mots-de-passe.yml`"
c3.hint.algo.2: "`salt: per-account`, then `verify`."
c3.hint.legacy.1: "Three lines: `legacy_sha1`, `on_login`, `temporary_password`."
c3.hint.legacy.2: "`legacy_sha1: wrap`, `on_login: rehash`, `temporary_password: random-single-use`, then `verify`."
c3.hint.deploy.1: "`contain rotate coffre`"
c3.hint.sample.1: "`jq -r .password_hash` pulls the hash out of the response."
c3.hint.sample.2: "`answer sample argon2`"
c3.hint.tell.1: "No answer is wrong. Think of the six accounts on the temporary password."
c3.debrief.title: "A slow vault"
c3.debrief.lesson: "Migrating password storage does not stop at new accounts. Old hashes get wrapped in the slow algorithm at once, then replaced at the next sign-in. And the result is checked on what runs, not in the file."
c3.debrief.p1: "Choose Argon2id (or bcrypt), with a salt per account and settings reviewed as hardware changes."
c3.debrief.p2: "Wrap old hashes at once, then replace them at the next sign-in."
c3.debrief.p3: "After deploying, check the format actually written to the database."
c3.debrief.p4: "Tell the people concerned, and force a change where the hash was weak."
