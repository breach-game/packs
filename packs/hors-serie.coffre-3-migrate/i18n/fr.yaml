c3.briefing: "La mutuelle accepte de migrer. La politique de stockage des mots de passe est dans `coffre/mots-de-passe.yml`. Écris-la, déploie-la, vérifie, puis décide quoi dire aux adhérents."
c3.obj.algo: "Un algorithme lent, un sel par compte"
c3.obj.legacy: "Protéger les vieilles empreintes sans attendre"
c3.obj.deploy: "Déployer la nouvelle politique"
c3.obj.sample: "Vérifier le format des nouvelles empreintes"
c3.obj.tell: "Décider quoi dire aux adhérents"
c3.contain.deploy: "Déployer la nouvelle politique de mots de passe sur le Coffre (connexions ralenties une heure)"
c3.q.sample: "Quel algorithme l'empreinte d'exemple utilise-t-elle désormais ? (comme `hashid` l'écrit, en minuscules)"
c3.q.tell: "La copie est peut-être sortie. Que dit la mutuelle à ses adhérents ?"
c3.q.tell.targeted: "Prévenir tous les adhérents, et forcer un nouveau mot de passe aux comptes d'avant 2019"
c3.q.tell.everyone: "Forcer un nouveau mot de passe à tous les adhérents, dès demain"
c3.q.tell.quiet: "Migrer sans rien dire : rien ne prouve que la copie soit sortie"
c3.check.algo: "Argon2id, un sel par compte"
c3.check.legacy: "Vieilles empreintes enveloppées, remplacées à la connexion, plus de mot de passe provisoire commun"
c3.check.works: "Les réglages d'Argon2id sont toujours là"
c3.ada.brief: "Lis la politique : `cat coffre/mots-de-passe.yml`. Les réglages d'Argon2id sont déjà prêts, personne ne s'en servait."
c3.ada.g.algo: "D'abord l'algorithme : `algorithm: argon2id` et `salt: per-account`. `sed -i` ou `edit coffre/mots-de-passe.yml`, puis `verify`."
c3.ada.g.algo.standard: "D'abord, un algorithme lent et un sel par compte. Puis `verify`."
c3.ada.algo: "Les nouveaux mots de passe sont à l'abri. Mais un adhérent qui ne se connecte jamais garderait son SHA-1 pour toujours."
c3.ada.g.legacy: "`legacy_sha1: wrap` enveloppe chaque vieille empreinte dans Argon2id tout de suite. `on_login: rehash` la remplace par une vraie à la connexion suivante. Et `temporary_password: random-single-use`. Puis `verify`."
c3.ada.g.legacy.standard: "Protège les vieilles empreintes sans attendre que chacun se connecte, et finis-en avec le mot de passe provisoire commun. Puis `verify`."
c3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
c3.ada.ready: "La politique tient. Déploie-la : `contain rotate coffre`. Une heure de connexions un peu lentes, le temps d'envelopper les anciennes empreintes."
c3.ada.g.deploy: "Déploie la politique : `contain rotate coffre`."
c3.ada.g.deploy.standard: "Déploie la nouvelle politique sur le Coffre."
c3.ada.deployed: "Déployé. Ne me crois pas sur parole : regarde ce qui s'écrit vraiment en base."
c3.ada.g.sample: "Demande l'empreinte d'exemple et passe-la à `hashid` : `curl https://coffre.tilleul.test/api/exemple-empreinte | jq -r .password_hash | hashid`. Puis `answer sample <algorithme>`."
c3.ada.g.sample.standard: "Vérifie le nouveau format d'empreinte, puis `answer sample`."
c3.ada.sample: "Argon2, et la ligne dit tout : 64 Mio de mémoire, trois passes, un sel. Reste la décision la plus difficile."
c3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
c3.ada.answer.standard: "Ma question t'attend dans la messagerie."
c3.ada.targeted: "Le choix équilibré : tout le monde sait ce qui s'est passé, et ceux dont l'empreinte était faible changent de mot de passe."
c3.ada.everyone: "Le plus prudent, et le plus lourd : le service client va crouler sous les appels, pour des comptes récents qui ne risquaient pas grand-chose."
c3.ada.quiet: "Le moins cher aujourd'hui. Mais si la copie est sortie, six adhérents ont un mot de passe connu de tous, et ils ne le sauront pas. Pour des données de santé, l'autorité de contrôle demandera pourquoi."
c3.ada.done: "Une copie oubliée, un lien qui se devinait, un algorithme de 2016. Trois réglages, et le Coffre en est enfin un."
c3.hint.algo.1: "`sed -i \"s/algorithm: sha1/algorithm: argon2id/\" coffre/mots-de-passe.yml`"
c3.hint.algo.2: "`salt: per-account`, puis `verify`."
c3.hint.legacy.1: "Trois lignes : `legacy_sha1`, `on_login`, `temporary_password`."
c3.hint.legacy.2: "`legacy_sha1: wrap`, `on_login: rehash`, `temporary_password: random-single-use`, puis `verify`."
c3.hint.deploy.1: "`contain rotate coffre`"
c3.hint.sample.1: "`jq -r .password_hash` extrait l'empreinte de la réponse."
c3.hint.sample.2: "`answer sample argon2`"
c3.hint.tell.1: "Aucune réponse n'est fausse. Pense aux six comptes au mot de passe provisoire."
c3.debrief.title: "Un coffre lent"
c3.debrief.lesson: "Migrer un stockage de mots de passe ne s'arrête pas aux nouveaux comptes. Les vieilles empreintes s'enveloppent tout de suite dans l'algorithme lent, puis se remplacent à la connexion suivante. Et on vérifie le résultat sur ce qui tourne, pas dans le fichier."
c3.debrief.p1: "Choisir Argon2id (ou bcrypt), avec un sel par compte et des réglages revus avec le matériel."
c3.debrief.p2: "Envelopper aussitôt les anciennes empreintes, puis les remplacer à la connexion suivante."
c3.debrief.p3: "Vérifier après le déploiement le format réellement écrit en base."
c3.debrief.p4: "Prévenir les personnes concernées, et forcer le changement là où l'empreinte était faible."
