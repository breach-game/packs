t1.briefing: "Thursday 11 January, 5.30 pm, the Relais help desk. Nadia sits across from you, her bag on her lap. For a week her phone has shown the same message: a tag that is not hers is moving with her. At first she thought it was a mistake. She has exported the alert history, and the coordinator wrote down what they found together. It is all in your folder. Nadia is here, listening, and nothing is decided without her."
t1.obj.since: "Say since when the tag has been travelling with Nadia"
t1.obj.first: "Say what is done, and not done, in the first minute"
t1.obj.tag: "Decide with Nadia what to do with the tag"
t1.q.since: "On which day did the phone first see the tag? (in the form 2029-01-31)"
t1.q.first: "The tag is in the bag, and it works. What do we do in the first minute?"
t1.q.first.pause: "We change nothing right away, and think of her safety first"
t1.q.first.thrown: "We throw it at once into the first bin in the street"
t1.q.first.thrown.why: "A tag that stops, or changes its route, shows on the other side: the person will know it was found, at a moment Nadia did not choose. And the evidence goes into the bin with it."
t1.q.first.confront: "Nadia rings her ex on the spot to demand an explanation"
t1.q.first.confront.why: "That is the moment when everything can turn worse. If she ever wants to talk to them, it will be after preparing what comes next, not in the anger of the discovery, and never alone."
t1.q.tag: "This is Nadia's decision. What does she do with the tag?"
t1.q.tag.police: "Take it to the police, still in the bag, with the alert history"
t1.q.tag.keep: "Leave it in place a few days, long enough to prepare"
t1.q.tag.silence: "Silence it now, knowing that this will be noticed"
t1.ada.brief: "Tonight we fix nothing, we understand. First read what the phone saw: `cat telephone/alertes.txt`, then the desk's note: `cat permanence/sac.txt`."
t1.ada.g.since: "`cat telephone/alertes.txt`: every line starts with a date. Give the first one with `answer since <date>`."
t1.ada.g.since.standard: "Find in `telephone/alertes.txt` the first day the tag was seen, and answer with `answer since`."
t1.ada.since: "3 January, then four more days, always the same tag, always from the morning. The bag was a gift on 24 December. The phone did exactly its job: it saw an unknown object following her and said so. Many people close that message without reading it. Before going further, one question, and it is the most important of the evening."
t1.ada.g.first: "Answer my question: what we do in the first minute."
t1.ada.first: "Yes. Whoever placed the tag sees where it is, and would also see it stop. As long as nothing has been touched, Nadia knows something the other person does not, and she picks the moment. The coordinator gave her the number of a specialised helpline, to call from the desk's phone. Now, the tag. It is neither your decision nor mine."
t1.ada.g.tag: "No answer is wrong. Nadia chooses, and each choice has a different price."
t1.ada.tag.police: "She will go tomorrow morning with the coordinator, the tag in her bag like every day, the history printed and the photo. Nothing will have changed for whoever is watching, until the moment it is no longer hers alone to deal with."
t1.ada.tag.keep: "She keeps the bag a few days, as if nothing had happened, long enough to call the helpline and see where she can sleep if need be. It is uncomfortable, and it is a real choice: she keeps the advantage of knowing."
t1.ada.tag.silence: "She wants it to stop tonight, and we understand. She has been told what it means: the other person will know. She is not going home alone, and she has the helpline number in her pocket, on paper."
t1.ada.done: "The tag was only a cheap object in a pocket. What matters is what Nadia has just got back: she decides what happens next. She hands you her phone: \"There is something else. The battery no longer lasts the day.\""
t1.hint.since.1: "The first line of the history."
t1.hint.since.2: "`answer since 2029-01-03`"
t1.hint.first.1: "Change nothing, and think of her safety first. Type `answer pause`."
t1.debrief.title: "What travels with her"
t1.debrief.lesson: "The phone had warned Nadia five times. The tag was in a bag she was given. The first reflex, throwing it away or calling, is the one that puts her most at risk: the other person learns they have been found out, at the worst moment. Keep the evidence, get support, and let the person who is followed choose when and how."
t1.debrief.p1: "A recent phone reports an unknown tag moving with you: that message is to be read, not closed."
t1.debrief.p2: "Before removing anything, think of safety: whoever is watching sees when the watching stops."
t1.debrief.p3: "Keep the evidence (dates, photos, history) somewhere other than the phone, and get support."
t1.home.p1: "Look in your phone's settings for where unknown tag alerts are, and check they are switched on."
t1.home.p2: "If you ever get that alert and you are afraid of someone, remove nothing right away: talk about it first, from another phone."
t1.home.p3: "In France, 3919 listens and guides, free of charge, at any hour. In immediate danger, 17 or 112. Elsewhere, look up your country's helpline."
