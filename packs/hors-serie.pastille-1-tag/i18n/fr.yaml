t1.briefing: "Jeudi 11 janvier, 17 h 30, permanence du Relais. Nadia est assise en face de toi, son sac sur les genoux. Depuis une semaine, son téléphone lui affiche le même message : une balise qui n'est pas à elle se déplace avec elle. Elle a d'abord cru à une erreur. Elle a exporté l'historique des alertes, et la coordinatrice a noté ce qu'elles ont trouvé ensemble. Tout est dans ton dossier. Nadia est là, elle écoute, et rien ne se décide sans elle."
t1.obj.since: "Dire depuis quand la balise voyage avec Nadia"
t1.obj.first: "Dire ce qu'on fait, et ne fait pas, dans la première minute"
t1.obj.tag: "Décider avec Nadia quoi faire de la balise"
t1.q.since: "Quel jour le téléphone a-t-il vu la balise pour la première fois ? (au format 2029-01-31)"
t1.q.first: "La balise est dans le sac, et elle fonctionne. Que fait-on dans la première minute ?"
t1.q.first.pause: "On ne change rien tout de suite, et on pense d'abord à sa sécurité"
t1.q.first.thrown: "On la jette tout de suite dans la première poubelle de la rue, loin de chez elle"
t1.q.first.thrown.why: "Une balise qui s'arrête ou qui change de trajet, ça se voit de l'autre côté : la personne saura qu'elle a été trouvée, à un moment que Nadia n'a pas choisi. Et la preuve part à la poubelle avec elle."
t1.q.first.confront: "Nadia appelle son ex sur-le-champ pour lui demander des comptes"
t1.q.first.confront.why: "C'est le moment où tout peut s'envenimer. Si elle veut lui parler un jour, ce sera après avoir préparé la suite, pas dans la colère de la découverte, et jamais seule."
t1.q.tag: "C'est la décision de Nadia. Que fait-elle de la balise ?"
t1.q.tag.police: "L'apporter à la police, dans le sac, avec l'historique des alertes"
t1.q.tag.keep: "La laisser en place quelques jours, le temps de se préparer"
t1.q.tag.silence: "La faire taire maintenant, en sachant que cela se verra"
t1.ada.brief: "Ce soir on ne répare rien, on comprend. Lis d'abord ce que le téléphone a vu : `cat telephone/alertes.txt`, puis la note de la permanence : `cat permanence/sac.txt`."
t1.ada.g.since: "`cat telephone/alertes.txt` : chaque ligne commence par une date. Donne la première avec `answer since <date>`."
t1.ada.g.since.standard: "Trouve dans `telephone/alertes.txt` le premier jour où la balise a été vue, et réponds avec `answer since`."
t1.ada.since: "Le 3 janvier, puis quatre autres jours, toujours la même balise, toujours dès le matin. Le sac a été offert le 24 décembre. Le téléphone a fait exactement son travail : il a vu qu'un objet inconnu la suivait et il l'a dit. Beaucoup de gens ferment ce message sans le lire. Avant d'aller plus loin, une question, et c'est la plus importante de la soirée."
t1.ada.g.first: "Réponds à ma question : ce qu'on fait dans la première minute."
t1.ada.first: "Oui. Celui qui a posé la balise voit où elle est, et il verrait aussi qu'elle s'arrête. Tant qu'on n'a touché à rien, c'est Nadia qui sait quelque chose que l'autre ignore, et c'est elle qui choisit le moment. La coordinatrice lui a donné le numéro d'une ligne d'écoute spécialisée, à appeler depuis le téléphone de la permanence. Maintenant, la balise. Ce n'est ni ta décision ni la mienne."
t1.ada.g.tag: "Aucune réponse n'est fausse. C'est Nadia qui choisit, et chaque choix a un prix différent."
t1.ada.tag.police: "Elle ira demain matin avec la coordinatrice, la balise dans son sac comme tous les jours, l'historique imprimé et la photo. Rien n'aura changé du point de vue de celui qui regarde, jusqu'au moment où ce ne sera plus son affaire à elle seule."
t1.ada.tag.keep: "Elle garde le sac quelques jours, comme si de rien n'était, le temps d'appeler la ligne d'écoute et de voir où elle peut dormir si besoin. C'est inconfortable, et c'est un vrai choix : elle garde l'avantage de savoir."
t1.ada.tag.silence: "Elle veut que ça s'arrête ce soir, et on la comprend. On lui a dit ce que cela implique : l'autre saura. Elle ne rentre pas seule, et elle a le numéro de la ligne d'écoute dans la poche, sur papier."
t1.ada.done: "La balise n'était qu'un objet à trente euros dans une poche. Ce qui compte, c'est ce que Nadia vient de retrouver : c'est elle qui décide de la suite. Elle te tend son téléphone : « Il y a autre chose. La batterie ne tient plus la journée. »"
t1.hint.since.1: "La première ligne de l'historique."
t1.hint.since.2: "`answer since 2029-01-03`"
t1.hint.first.1: "Ne rien changer, et penser d'abord à sa sécurité. Tape `answer pause`."
t1.debrief.title: "Ce qui voyage avec elle"
t1.debrief.lesson: "Le téléphone avait prévenu Nadia cinq fois. La balise était dans un sac reçu en cadeau. Le premier réflexe, la jeter ou appeler, est celui qui la met le plus en danger : l'autre apprend qu'il est découvert, au pire moment. On garde la preuve, on se fait accompagner, et c'est la personne suivie qui choisit quand et comment."
t1.debrief.p1: "Un téléphone récent signale une balise inconnue qui se déplace avec vous : ce message se lit, il ne se ferme pas."
t1.debrief.p2: "Avant de retirer quoi que ce soit, penser à sa sécurité : celui qui surveille voit quand la surveillance s'arrête."
t1.debrief.p3: "Garder les preuves (dates, photos, historique) ailleurs que sur le téléphone, et se faire accompagner."
t1.home.p1: "Regarde dans les réglages de ton téléphone où se trouvent les alertes de balise inconnue, et vérifie qu'elles sont activées."
t1.home.p2: "Si tu reçois un jour cette alerte et que tu as peur de quelqu'un, ne retire rien tout de suite : parles-en d'abord, depuis un autre téléphone."
t1.home.p3: "En France, le 3919 écoute et oriente, gratuitement, à toute heure. En cas de danger immédiat, le 17 ou le 112. Ailleurs, cherche la ligne d'écoute de ton pays."
