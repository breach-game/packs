m2.briefing: "Tuesday, 11:00. Ardoise rebuilt a sample of what the stolen query returned: `export/cases.json`, ten support tickets. Whoever ran this theft was not after tickets. They were after what customers and engineers had pasted into them to save time."
m2.obj.keys: "Count the cloud access keys pasted into the tickets"
m2.obj.ticket: "Find the ticket that holds a password"
m2.obj.rotate: "Have the keys and the password changed"
m2.obj.habit: "Choose what changes at support"
m2.q.keys: "How many different access keys (starting with AKIA) does the export hold?"
m2.q.ticket: "What is the Id of the ticket holding the data warehouse password?"
m2.q.habit: "What would have kept these secrets from leaving with the tickets?"
m2.q.habit.scan: "Mask any secret as soon as a ticket is created"
m2.q.habit.delete: "Delete all tickets more than six months old"
m2.q.habit.delete.why: "The password ticket is two weeks old. Purging helps, but a secret pasted yesterday leaves just as well."
m2.q.habit.encrypt: "Encrypt the CRM database on its disks"
m2.q.habit.encrypt.why: "Disk encryption does not stop a valid token: the API returns tickets in clear to whoever may read them."
m2.contain.keys: "Disable the two access keys found and warn both customers (their exports stop until they create new ones)"
m2.contain.db: "Change the data warehouse password and store it in the secrets vault"
m2.ada.brief: "Look at the size of the export: `jq length export/cases.json`. Then search for what looks like a key: `grep -o \"AKIA[A-Z0-9]*\" export/cases.json`."
m2.ada.g.keys: "`grep -o \"AKIA[A-Z0-9]*\" export/cases.json` lists the keys. Count them: `answer keys <number>`."
m2.ada.g.keys.standard: "Search the export for the access keys people pasted into it. `answer keys`."
m2.ada.keys: "Two customer keys, pasted so we could reproduce their problem. Exactly what the attacker was looking for in the tickets."
m2.ada.g.ticket: "`grep -n password export/cases.json`, then read the ticket with `jq`, for instance `jq -r \".[5].Id\" export/cases.json`. `answer ticket <Id>`."
m2.ada.g.ticket.standard: "An engineer noted a password in a ticket. Which one? `answer ticket`."
m2.ada.ticket: "A data warehouse password, written by an Ardoise engineer to remember the fix. Not a customer this time."
m2.ada.g.rotate: "`contain rotate aws-keys` and `contain rotate warehouse-password`."
m2.ada.g.rotate.standard: "Any secret that left must be changed, even if it has not been used yet. `contain`."
m2.ada.rotate: "Keys disabled, password changed. What left is worth nothing now."
m2.ada.g.habit: "Answer in the messenger or with `answer <option>`."
m2.ada.done: "Access closed, secrets changed. Ardoise was only one of Converso's many customers: the card tells the real case."
m2.hint.keys.1: "Two lines come out of `grep -o`."
m2.hint.keys.2: "`answer keys 2`"
m2.hint.ticket.1: "`db_password=` is in the sixth ticket of the array, index 5."
m2.hint.ticket.2: "`answer ticket 5003X06`"
m2.hint.rotate.1: "`contain rotate aws-keys` then `contain rotate warehouse-password`"
m2.hint.habit.1: "Neither the ticket's age nor the disk changes anything: the secret was in the text."
m2.debrief.title: "What the tickets said"
m2.debrief.lesson: "A support ticket is made to be read by many people and many tools. The keys and passwords pasted into one to save time stay there for years. A theft of tickets thus becomes a theft of access to other systems: the customers', and the company's own."
m2.debrief.p1: "Search exposed data for secrets as soon as a theft is known, then change them all."
m2.debrief.p2: "Automatically mask what looks like a key or a password when a ticket is created."
m2.debrief.p3: "Never ask a customer for a secret through a ticket: offer a temporary share or a test key."
m2.facts.title: "What really happened: Salesloft Drift, 2025"
m2.facts.p1: "According to the Google Threat Intelligence Group, from 8 to at least 18 August 2025, a group it calls UNC6395 used OAuth tokens of Salesloft's Drift integration, a chat tool, to export large volumes of data from many companies' Salesforce instances."
m2.facts.p2: "The group then searched the stolen data for secrets: AWS access keys (starting with AKIA), passwords, Snowflake tokens."
m2.facts.p3: "It deleted the query jobs afterwards, but the logs were not affected: GTIG advises reviewing them."
m2.facts.p4: "On 20 August 2025, Salesloft and Salesforce revoked the active tokens of the Drift application."
m2.facts.p5: "The published advice: search the exposed objects for secrets, revoke and rotate the keys found, review the logs for the addresses and user agents used."
