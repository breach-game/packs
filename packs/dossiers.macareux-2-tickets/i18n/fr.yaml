m2.briefing: "Mardi, 11 h. Ardoise a reconstitué un échantillon de ce que la requête volée a renvoyé : `export/cases.json`, dix tickets du support. Ceux qui ont mené ce vol ne cherchaient pas des tickets. Ils cherchaient ce que des clients et des ingénieurs y avaient collé pour aller plus vite."
m2.obj.keys: "Compter les clés d'accès au cloud collées dans les tickets"
m2.obj.ticket: "Trouver le ticket qui contient un mot de passe"
m2.obj.rotate: "Faire changer les clés et le mot de passe"
m2.obj.habit: "Choisir ce qui change au support"
m2.q.keys: "Combien de clés d'accès différentes (commençant par AKIA) l'export contient-il ?"
m2.q.ticket: "Quel est l'identifiant (Id) du ticket qui contient le mot de passe de l'entrepôt de données ?"
m2.q.habit: "Qu'est-ce qui aurait évité que ces secrets partent avec les tickets ?"
m2.q.habit.scan: "Masquer tout secret dès la création du ticket"
m2.q.habit.delete: "Supprimer tous les tickets de plus de six mois"
m2.q.habit.delete.why: "Le ticket au mot de passe a deux semaines. Purger aide, mais un secret collé hier part aussi bien."
m2.q.habit.encrypt: "Chiffrer la base du CRM sur ses disques"
m2.q.habit.encrypt.why: "Le chiffrement des disques ne gêne pas un jeton valide : l'API rend les tickets en clair à qui a le droit de les lire."
m2.contain.keys: "Désactiver les deux clés d'accès trouvées et prévenir les deux clients (leurs exports s'arrêtent le temps d'en créer d'autres)"
m2.contain.db: "Changer le mot de passe de l'entrepôt de données et le ranger dans le coffre de secrets"
m2.ada.brief: "Regarde la taille de l'export : `jq length export/cases.json`. Puis cherche ce qui ressemble à une clé : `grep -o \"AKIA[A-Z0-9]*\" export/cases.json`."
m2.ada.g.keys: "`grep -o \"AKIA[A-Z0-9]*\" export/cases.json` liste les clés. Compte-les : `answer keys <nombre>`."
m2.ada.g.keys.standard: "Cherche dans l'export les clés d'accès que des gens y ont collées. `answer keys`."
m2.ada.keys: "Deux clés de clients, collées pour qu'on reproduise leur problème. C'est exactement ce que l'attaquant cherchait dans les tickets."
m2.ada.g.ticket: "`grep -n password export/cases.json`, puis lis le ticket avec `jq`, par exemple `jq -r \".[5].Id\" export/cases.json`. `answer ticket <Id>`."
m2.ada.g.ticket.standard: "Un ingénieur a noté un mot de passe dans un ticket. Lequel ? `answer ticket`."
m2.ada.ticket: "Un mot de passe de l'entrepôt de données, écrit par un ingénieur d'Ardoise pour se souvenir du correctif. Pas un client cette fois."
m2.ada.g.rotate: "`contain rotate aws-keys` et `contain rotate warehouse-password`."
m2.ada.g.rotate.standard: "Tout secret qui est sorti doit être changé, même s'il n'a pas encore servi. `contain`."
m2.ada.rotate: "Clés désactivées, mot de passe changé. Ce qui est parti ne vaut plus rien."
m2.ada.g.habit: "Réponds dans la messagerie ou avec `answer <option>`."
m2.ada.done: "Accès fermé, secrets changés. Ardoise n'était qu'un client parmi d'autres de Converso : la fiche raconte l'affaire réelle."
m2.hint.keys.1: "Deux lignes sortent de `grep -o`."
m2.hint.keys.2: "`answer keys 2`"
m2.hint.ticket.1: "`db_password=` est dans le sixième ticket du tableau, l'indice 5."
m2.hint.ticket.2: "`answer ticket 5003X06`"
m2.hint.rotate.1: "`contain rotate aws-keys` puis `contain rotate warehouse-password`"
m2.hint.habit.1: "Ni l'âge du ticket ni le disque n'y changent rien : le secret était dans le texte."
m2.debrief.title: "Ce que disaient les tickets"
m2.debrief.lesson: "Un ticket de support est fait pour être lu par beaucoup de monde et par beaucoup d'outils. Les clés et les mots de passe qu'on y colle pour aller vite y restent des années. Un vol de tickets devient ainsi un vol d'accès à d'autres systèmes : ceux des clients, et ceux de l'entreprise."
m2.debrief.p1: "Chercher les secrets dans les données exposées dès qu'un vol est connu, puis tous les changer."
m2.debrief.p2: "Masquer automatiquement ce qui ressemble à une clé ou un mot de passe quand un ticket est créé."
m2.debrief.p3: "Ne jamais demander un secret à un client par ticket : proposer un partage temporaire ou une clé de test."
m2.facts.title: "Ce qui s'est vraiment passé : Salesloft Drift, 2025"
m2.facts.p1: "Selon le Google Threat Intelligence Group, du 8 au 18 août 2025 au moins, un groupe qu'il nomme UNC6395 utilise des jetons OAuth de l'intégration Drift de Salesloft, un outil de chat, pour exporter de gros volumes de données des instances Salesforce de nombreuses entreprises."
m2.facts.p2: "Le groupe fouille ensuite les données volées à la recherche de secrets : clés d'accès AWS (commençant par AKIA), mots de passe, jetons Snowflake."
m2.facts.p3: "Il supprime les tâches de requête après coup, mais les journaux ne sont pas touchés : GTIG recommande de les relire."
m2.facts.p4: "Le 20 août 2025, Salesloft et Salesforce révoquent les jetons actifs de l'application Drift."
m2.facts.p5: "Les recommandations publiées : chercher des secrets dans les objets exposés, révoquer et changer les clés trouvées, relire les journaux pour les adresses et les agents utilisés."
