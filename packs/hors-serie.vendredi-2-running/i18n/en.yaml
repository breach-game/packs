v2.briefing: "On Friday evening, the deployment bot announced \"SUCCESS\" for the portal's patch. The team closed the ticket. Before believing it, look at what runs. The releases are in `livraisons/`, the bot's cache and log in `deploiement/`, and the measure to redeploy in `contain`."
v2.obj.running: "Say which jeton-web version runs in production"
v2.obj.why: "Explain why the patch never arrived"
v2.obj.redeploy: "Redeploy the right release"
v2.obj.check: "Check what runs after the redeployment"
v2.q.running: "Which jeton-web version does the production portal announce?"
v2.q.why: "The staging test was good, the deployment \"succeeded\". Why does production still run the old version?"
v2.q.why.cache: "The bot installed an old archive left in its cache"
v2.q.why.revert: "Someone quietly rolled back over the weekend"
v2.q.why.revert.why: "The log shows a single deployment, Friday's, and it took the archive left in cache."
v2.q.why.staging: "Staging and production do not have the same source code"
v2.q.why.staging.why: "The source code is the same: it is the installed archive that differs. Its hash does not match the published release."
v2.contain.redeploy: "Redeploy the portal from the verified 5.6.1 release (two minutes of downtime)"
v2.ada.brief: "Ask each one for its version: staging, `curl https://recette.bergamote.test/version`, then production, `curl https://portail.bergamote.test/version`."
v2.ada.g.running: "Compare the two answers, jeton-web field. `answer running <version>`."
v2.ada.g.running.standard: "Find what production really runs. `answer running`."
v2.ada.running: "Staging has 3.2.4, production 3.2.1. The patch never arrived, despite the \"SUCCESS\". Why?"
v2.ada.g.why: "Read the bot's log: `cat deploiement/journal.txt`. Then open the archive it took: `tar -xzf deploiement/cache/portail.tgz -C cache-ouvert` and `cat cache-ouvert/portail/VERSION`. Finally compare the hashes: `openssl dgst -sha256 livraisons/portail-5.6.1.tgz deploiement/cache/portail.tgz` and `cat livraisons/SHA256SUMS`."
v2.ada.g.why.standard: "Find, in the bot's log and the archives, where the old version comes from. Hashes do not lie."
v2.ada.why: "An old 5.6.0 archive left in cache, never compared with the published hash. The bot said \"SUCCESS\" because the servers restarted, not because the right version was running."
v2.ada.g.redeploy: "Redeploy from the verified release: `contain restore portail`. Two minutes of downtime on a Monday morning is acceptable."
v2.ada.g.redeploy.standard: "Put the right release back in production. `contain` for the list."
v2.ada.redeployed: "Redeployed. Do not believe the bot this time either: look."
v2.ada.g.check: "`curl https://portail.bergamote.test/version`"
v2.ada.g.check.standard: "Check for yourself what production announces now."
v2.ada.done: "The portal finally announces 3.2.4. A deployment is finished when the version served is checked, not when the bot says \"SUCCESS\"."
v2.hint.running.1: "The jeton-web field in portail.bergamote.test's answer."
v2.hint.running.2: "`answer running 3.2.1`"
v2.hint.why.1: "In the log: \"found in cache, skipping download\"."
v2.hint.why.2: "`answer cache`"
v2.hint.redeploy.1: "`contain restore portail`"
v2.hint.check.1: "`curl https://portail.bergamote.test/version`"
v2.debrief.title: "What really runs"
v2.debrief.lesson: "The patch was good, and so was the test. But the bot installed an old archive kept in cache, without comparing it with the release's hash, and announced success because the servers had restarted. For three days, everyone believed the portal was patched."
v2.debrief.p1: "Check every archive's hash before deploying it, and refuse one that does not match."
v2.debrief.p2: "Consider a deployment finished only when the version served has been checked."
v2.debrief.p3: "Have every service expose its version, and monitor it."
