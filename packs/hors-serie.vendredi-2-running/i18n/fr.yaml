v2.briefing: "Vendredi soir, le robot de déploiement a annoncé « SUCCESS » pour le correctif du portail. L'équipe a fermé le ticket. Avant de la croire, regarde ce qui tourne. Les livraisons sont dans `livraisons/`, le cache et le journal du robot dans `deploiement/`, et la mesure pour redéployer dans `contain`."
v2.obj.running: "Dire quelle version de jeton-web tourne en production"
v2.obj.why: "Expliquer pourquoi le correctif n'est jamais arrivé"
v2.obj.redeploy: "Redéployer la bonne livraison"
v2.obj.check: "Vérifier ce qui tourne après le redéploiement"
v2.q.running: "Quelle version de jeton-web le portail en production annonce-t-il ?"
v2.q.why: "Le test en recette était bon, le déploiement a « réussi ». Pourquoi la production tourne-t-elle encore l'ancienne version ?"
v2.q.why.cache: "Le robot a installé une vieille archive restée en cache"
v2.q.why.revert: "Quelqu'un est revenu en arrière pendant le week-end, sans prévenir"
v2.q.why.revert.why: "Le journal ne montre qu'un seul déploiement, celui de vendredi, et il a pris l'archive restée en cache."
v2.q.why.staging: "La recette et la production n'ont pas le même code source"
v2.q.why.staging.why: "Le code source est le même : c'est l'archive installée qui diffère. Son empreinte ne correspond pas à la livraison publiée."
v2.contain.redeploy: "Redéployer le portail depuis la livraison 5.6.1 vérifiée (deux minutes de coupure)"
v2.ada.brief: "Demande sa version à chacun : la recette, `curl https://recette.bergamote.test/version`, puis la production, `curl https://portail.bergamote.test/version`."
v2.ada.g.running: "Compare les deux réponses, champ jeton-web. `answer running <version>`."
v2.ada.g.running.standard: "Trouve ce que la production fait vraiment tourner. `answer running`."
v2.ada.running: "La recette a 3.2.4, la production 3.2.1. Le correctif n'est jamais arrivé, malgré le « SUCCESS ». Pourquoi ?"
v2.ada.g.why: "Lis le journal du robot : `cat deploiement/journal.txt`. Puis ouvre l'archive qu'il a prise : `tar -xzf deploiement/cache/portail.tgz -C cache-ouvert` et `cat cache-ouvert/portail/VERSION`. Compare enfin les empreintes : `openssl dgst -sha256 livraisons/portail-5.6.1.tgz deploiement/cache/portail.tgz` et `cat livraisons/SHA256SUMS`."
v2.ada.g.why.standard: "Trouve, dans le journal du robot et les archives, d'où vient la vieille version. Les empreintes ne mentent pas."
v2.ada.why: "Une vieille archive 5.6.0 restée en cache, jamais comparée à l'empreinte publiée. Le robot a dit « SUCCESS » parce que les serveurs ont redémarré, pas parce que la bonne version tournait."
v2.ada.g.redeploy: "Redéploie depuis la livraison vérifiée : `contain restore portail`. Deux minutes de coupure, un lundi matin, c'est acceptable."
v2.ada.g.redeploy.standard: "Remets la bonne livraison en production. `contain` pour la liste."
v2.ada.redeployed: "Redéployé. Ne crois pas le robot cette fois non plus : regarde."
v2.ada.g.check: "`curl https://portail.bergamote.test/version`"
v2.ada.g.check.standard: "Vérifie par toi-même ce que la production annonce maintenant."
v2.ada.done: "Le portail annonce enfin 3.2.4. Un déploiement est fini quand la version servie est vérifiée, pas quand le robot dit « SUCCESS »."
v2.hint.running.1: "Le champ jeton-web dans la réponse de portail.bergamote.test."
v2.hint.running.2: "`answer running 3.2.1`"
v2.hint.why.1: "Dans le journal : « found in cache, skipping download »."
v2.hint.why.2: "`answer cache`"
v2.hint.redeploy.1: "`contain restore portail`"
v2.hint.check.1: "`curl https://portail.bergamote.test/version`"
v2.debrief.title: "Ce qui tourne vraiment"
v2.debrief.lesson: "Le correctif était bon, le test aussi. Mais le robot a installé une vieille archive gardée en cache, sans la comparer à l'empreinte de la livraison, et il a annoncé un succès parce que les serveurs avaient redémarré. Pendant trois jours, tout le monde a cru le portail corrigé."
v2.debrief.p1: "Vérifier l'empreinte de chaque archive avant de la déployer, et refuser celle qui ne correspond pas."
v2.debrief.p2: "Considérer un déploiement fini seulement quand la version servie est contrôlée."
v2.debrief.p3: "Faire exposer sa version par chaque service, et la surveiller."
