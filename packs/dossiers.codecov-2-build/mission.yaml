id: dossiers.codecov-2-build
name: "Mission 2 : L'empoisonnement"
difficulty: 2
skills: [ci, analysis]
requires: dossiers.pinson-world
debrief:
  title: "L'intégrité des scripts CI"
  lesson: "Le script d'envoi a été modifié pour exfiltrer les variables d'environnement. La comparaison des empreintes (hashes) permet de détecter ces altérations."
  points:
    - "Vérifier systématiquement l'intégrité (SHA256) des outils tiers."
    - "Isolation des environnements de build."
