w2.briefing: "Lundi, 8 h 10. Ce week-end, des clients ont rejoint « Escale-Invites-5G » depuis un autocollant sur les tables, et une page d'accueil leur a demandé le mot de passe de leur messagerie (`signalements.txt`). Le café n'a que deux réseaux : Escale-Invites et Escale-Equipe. La borne qui gère le Wi-Fi entend tous les points d'accès autour : son journal est dans le SOC."
w2.obj.read: "Lire le code de l'autocollant sans rejoindre le réseau"
w2.obj.bssid: "Trouver l'adresse matérielle du faux point d'accès"
w2.obj.portal: "Dire ce qui trahit le faux réseau"
w2.obj.remove: "Faire retirer le faux point d'accès"
w2.obj.detect: "Écrire la règle qui le verra la prochaine fois"
w2.ada.brief: "Même règle que d'habitude : on lit le code, on ne rejoint pas le réseau. Et on ne touche pas au boîtier non plus : c'est une preuve."
w2.ada.g.read: "Lis le cahier du comptoir, `cat signalements.txt`, puis l'autocollant : `qr decode photos/table-4.png`."
w2.ada.g.read.standard: "Lis le cahier, puis le code de l'autocollant, sans rien rejoindre."
w2.ada.read: "Un code Wi-Fi : le téléphone propose de rejoindre « Escale-Invites-5G », ouvert. Le code du comptoir dit Escale-Invites. Qui émet ce 5G ? La borne le sait : son journal est dans le SOC."
w2.ada.scan: "Ton poste le voit aussi, le signal le plus fort de la salle : quelque part tout près. La borne en dit plus."
w2.ada.g.bssid: "Lis le journal de la borne : `soc logs wlc wlan`. Cherche un réseau qui porte le nom du café et que la borne ne gère pas. Réponds avec `answer bssid <adresse>`."
w2.ada.g.bssid.standard: "Trouve, dans le journal de la borne, le point d'accès qui emprunte le nom du café sans être géré. Réponds avec `answer bssid`."
w2.ada.bssid: "managed=no, signal à -36 : dans la salle. L'équipe va le trouver. D'abord, une question pour les clients."
w2.ada.answer: "Réponds à ma question : clique, ou utilise `answer` dans le terminal."
w2.ada.answer.standard: "Ma question t'attend dans la messagerie."
w2.ada.portal: "Voilà la phrase pour le comptoir, le portail et les affichettes : « Nous ne demandons jamais de mot de passe pour vous connecter. »"
w2.ada.g.remove: "L'équipe cherche le boîtier près du signal le plus fort. Fais-le retirer, débrancher et garder pour la police : `contain remove escale-invites-5g`."
w2.ada.g.remove.standard: "Fais retirer le faux point d'accès avec `contain`."
w2.contain.box: "Faire retirer le faux point d'accès et le garder pour la police"
w2.ada.remove: "Derrière la banquette de la table 4 : un petit boîtier sur une batterie USB. Débranché, mis dans un sac, gardé pour la police avec les autocollants. Personne ne l'ouvre. Le signal a disparu. Les autocollants aussi. Mais un jour il y en aura un autre : une règle, pour que la borne le dise toute seule."
w2.ada.more: "Un autre invité vient de rejoindre le faux réseau. Chaque minute compte."
w2.ada.g.detect: "Ouvre `regles/faux-reseau.yml` et essaie-la : `rule test regles/faux-reseau.yml`. Elle doit voir le faux réseau, et ni ceux du café ni ceux des voisins."
w2.ada.g.detect.standard: "Fais que `regles/faux-reseau.yml` attrape le faux point d'accès et rien d'autre, avec `rule test`."
w2.ada.g.false: "Elle voit aussi les points d'accès du café et la boulangerie. Ajoute `managed: no` pour ce que la borne ne gère pas, et `ssid|startswith: Escale` pour le nom du café : `echo \"managed: no\" >> regles/faux-reseau.yml`, puis `echo \"ssid|startswith: Escale\" >> regles/faux-reseau.yml`."
w2.ada.g.false.standard: "Trop large : ne garde que les réseaux non gérés par la borne qui portent le nom du café."
w2.ada.detect: "Non géré, et qui emprunte le nom : c'est le jumeau, et seulement lui. La boulangerie n'est pas gérée non plus, mais elle ne se fait pas passer pour nous."
w2.ada.done: "Boîtier retiré, autocollants partis, une règle en place, et une phrase pour les clients. Débrief."
w2.q.bssid: "Quelle est l'adresse matérielle (bssid) du faux point d'accès ?"
w2.q.portal: "Qu'est-ce qui devrait dire à un client qu'Escale-Invites-5G n'est pas le réseau du café ?"
w2.q.portal.password: "Sa page demande le mot de passe de la messagerie, et un portail de café n'en a jamais besoin."
w2.q.portal.padlock: "Sa page n'a pas de cadenas dans la barre d'adresse, donc elle ne peut pas être légitime."
w2.q.portal.padlock.why: "Un faux portail peut avoir son cadenas comme n'importe quel site. Le cadenas dit que l'échange est chiffré, pas à qui tu parles."
w2.q.portal.signal: "Son signal est trop fort pour être un vrai point d'accès du café."
w2.q.portal.signal.why: "Un client n'a aucun moyen de juger la force d'un signal. La demande de mot de passe, elle, se voit."
w2.hint.read.1: "`qr decode photos/table-4.png`, et compare avec `qr decode photos/comptoir.png`."
w2.hint.bssid.1: "`soc logs wlc wlan` : regarde les lignes avec managed=no et le nom du café."
w2.hint.bssid.2: "`answer bssid 02:7a:31:c4:58:0e`"
w2.hint.portal.1: "Qu'est-ce que la page a demandé aux clients ?"
w2.hint.remove.1: "`contain remove escale-invites-5g`"
w2.hint.detect.1: "Ta règle doit laisser de côté Escale-Invites (géré) et Boulangerie-Gare (pas le nom du café)."
w2.hint.detect.2: "`echo \"managed: no\" >> regles/faux-reseau.yml`, `echo \"ssid|startswith: Escale\" >> regles/faux-reseau.yml`, puis `rule test regles/faux-reseau.yml`."
w2.debrief.title: "Un nom n'est pas un réseau"
w2.debrief.lesson: "N'importe qui peut émettre n'importe quel nom de réseau, avec une batterie et un boîtier grand comme un téléphone. HTTPS n'y peut rien quand la victime tape elle-même son mot de passe dans la fausse page. Deux défenses tiennent : un lieu qui dit clairement « nous ne demandons jamais de mot de passe », et une borne qui remarque un réseau qu'elle ne gère pas et qui emprunte son nom."
w2.debrief.p1: "Un QR code Wi-Fi dit seulement « rejoins ce nom ». Il ne prouve rien sur qui tient le réseau."
w2.debrief.p2: "« Non géré » seul n'est pas suspect : la boulangerie n'est pas gérée. Non géré et qui emprunte ton nom, si."
w2.debrief.p3: "Le boîtier est une preuve : débranché, gardé, remis. Ce n'est pas au café de l'ouvrir ni de brouiller le réseau."
w2.facts.title: "Ce qui s'est vraiment passé"
w2.facts.p1: "En juin 2024, la police fédérale australienne a inculpé un homme pour de faux réseaux Wi-Fi gratuits installés dans les aéroports de Perth, Melbourne et Adelaide et sur des vols intérieurs. Ils imitaient des réseaux légitimes."
w2.facts.p2: "Leur page d'accueil demandait de se connecter avec un e-mail ou un compte de réseau social, et les identifiants étaient gardés. Ce sont des employés de la compagnie aérienne qui ont signalé un réseau suspect pendant un vol, ce qui a lancé l'enquête."
w2.facts.p3: "La police a conseillé de ne pas donner d'informations personnelles pour un Wi-Fi gratuit et d'oublier les réseaux après usage."
w2.home.p1: "Une page d'accueil Wi-Fi qui demande le mot de passe de ta messagerie ou d'un réseau social : ferme-la, ce n'est pas celle du lieu."
w2.home.p2: "Demande au personnel le nom exact de son réseau. Un « 5G », « Free » ou « Rapide » à côté ne prouve rien."
w2.home.p3: "Après un Wi-Fi public, oublie le réseau pour que ton téléphone ne rejoigne pas une copie plus tard."
