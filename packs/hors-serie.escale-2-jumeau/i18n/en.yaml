w2.briefing: "Monday, 8:10 am. Over the weekend, customers joined \"Escale-Invites-5G\" from a sticker on the tables, and a welcome page asked for their mailbox password (`signalements.txt`). The café has only two networks: Escale-Invites and Escale-Equipe. The wireless controller hears every access point around: its log is in the SOC."
w2.obj.read: "Read the table sticker's code without joining"
w2.obj.bssid: "Find the hardware address of the fake access point"
w2.obj.portal: "Say what gives the fake network away"
w2.obj.remove: "Have the fake access point removed"
w2.obj.detect: "Write the rule that spots it next time"
w2.ada.brief: "Same rule as always: we read the code, we don't join the network. And we don't touch the box either: it is evidence."
w2.ada.g.read: "Read the counter notebook, `cat signalements.txt`, then the sticker: `qr decode photos/table-4.png`."
w2.ada.g.read.standard: "Read the notebook, then the code of the table sticker, without joining anything."
w2.ada.read: "A Wi-Fi code: the phone offers to join \"Escale-Invites-5G\", open. The counter's code says Escale-Invites. Who broadcasts that 5G? The controller knows: `soc logs wlc wlan`."
w2.ada.scan: "Your workstation sees it too, strongest signal in the room: somewhere close, very close. The controller says more."
w2.ada.g.bssid: "Read the controller's log: `soc logs wlc wlan`. Look for a network that uses the café's name and that the controller does not manage. Answer with `answer bssid <address>`."
w2.ada.g.bssid.standard: "Find, in the controller's log, the access point that borrows the café's name without being managed. Answer with `answer bssid`."
w2.ada.bssid: "managed=no, signal at -36: in the room. The staff will find it. First, a question for the customers."
w2.ada.answer: "Answer my question: click, or use `answer` in the terminal."
w2.ada.answer.standard: "My question is waiting in the messages."
w2.ada.portal: "That is the sentence for the counter, the portal and the stickers: \"We never ask for a password to connect you.\" Now the box."
w2.ada.g.remove: "The staff look for the box near the strongest signal. Have it removed, unplugged and kept for the police: `contain remove escale-invites-5g`."
w2.ada.g.remove.standard: "Have the fake access point removed with `contain`."
w2.contain.box: "Behind the bench by table 4: a small box on a USB battery. Unplugged, put in a bag, kept for the police with the stickers. Nobody opens it."
w2.ada.remove: "The beacon is gone. The stickers too. But one day there will be another: a rule, so that the controller says so on its own."
w2.ada.more: "Another guest has just joined the fake network. Every minute counts."
w2.ada.g.detect: "Open `regles/faux-reseau.yml` and try it: `rule test regles/faux-reseau.yml`. It must see the fake network, and neither the café's own nor the neighbours'."
w2.ada.g.detect.standard: "Make `regles/faux-reseau.yml` catch the fake access point and nothing else, with `rule test`."
w2.ada.g.false: "It also sees the café's own access points and the bakery. Add `managed: no` for what the controller does not run, and `ssid|startswith: Escale` for the café's name: `echo \"managed: no\" >> regles/faux-reseau.yml`."
w2.ada.g.false.standard: "Too broad: keep only the networks the controller does not manage that use the café's name."
w2.ada.detect: "Unmanaged, and borrowing the name: that is the twin, and only the twin. The bakery is unmanaged too, but it does not pretend to be us."
w2.ada.done: "Box removed, stickers gone, a rule in place, and a sentence for the customers. Debrief."
w2.q.bssid: "What is the hardware address (bssid) of the fake access point?"
w2.q.portal: "What should tell a customer that Escale-Invites-5G is not the café's network?"
w2.q.portal.password: "Its page asks for the mailbox password, and a café's portal never needs one."
w2.q.portal.padlock: "Its page has no padlock in the address bar, so it cannot be legitimate."
w2.q.portal.padlock.why: "A fake portal can have its padlock like any site. The padlock says the exchange is encrypted, not who you are talking to."
w2.q.portal.signal: "Its signal is too strong to be a real access point of the café."
w2.q.portal.signal.why: "A customer has no way to judge a signal's strength. The request for a password is the sign anyone can see."
w2.hint.read.1: "`qr decode photos/table-4.png`, and compare with `qr decode photos/comptoir.png`."
w2.hint.bssid.1: "`soc logs wlc wlan`: look at the lines with managed=no and the café's name."
w2.hint.bssid.2: "`answer bssid 02:7a:31:c4:58:0e`"
w2.hint.portal.1: "What did the page ask the customers for?"
w2.hint.remove.1: "`contain remove escale-invites-5g`"
w2.hint.detect.1: "Your rule must leave aside Escale-Invites (managed) and Boulangerie-Gare (not the café's name)."
w2.hint.detect.2: "`echo \"managed: no\" >> regles/faux-reseau.yml`, `echo \"ssid|startswith: Escale\" >> regles/faux-reseau.yml`, then `rule test regles/faux-reseau.yml`."
w2.debrief.title: "A name is not a network"
w2.debrief.lesson: "Anyone can broadcast any network name, with a battery and a box the size of a phone. HTTPS does not help when the victim types the password herself into the fake page. Two defences hold: a place that says clearly \"we never ask for a password\", and a controller that notices a network it does not manage borrowing its name."
w2.debrief.p1: "A Wi-Fi QR code just says \"join this name\". It proves nothing about who runs the network."
w2.debrief.p2: "\"Unmanaged\" alone is not suspicious: the bakery is unmanaged. Unmanaged and borrowing your name is."
w2.debrief.p3: "The box is evidence: unplugged, kept, handed over. It is not for the café to open it or to jam the network."
w2.facts.title: "What really happened"
w2.facts.p1: "In June 2024, the Australian Federal Police charged a man over fake free Wi-Fi networks set up at Perth, Melbourne and Adelaide airports and on domestic flights. They imitated legitimate networks."
w2.facts.p2: "Their welcome page asked people to sign in with an e-mail or social media account, and the details were stored. Airline staff reported a suspicious network during a flight, which started the investigation."
w2.facts.p3: "The police advised people not to give personal information to use a free Wi-Fi and to forget networks after use."
w2.home.p1: "A Wi-Fi welcome page that asks for the password of your mailbox or a social network: close it, it is not the place's."
w2.home.p2: "Ask the staff for the exact name of their network. A \"5G\", \"Free\" or \"Fast\" next to it is not proof of anything."
w2.home.p3: "After using a public Wi-Fi, forget the network so that your phone does not join a copy of it later."
