file.readme: "Ligne Rouge workstation. Case file: Roitelet. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate RT-2027-012. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE RT-2027-012\nClient: Librairies Roitelet SAS. Scope: *.roitelet.test, 10.72.0.0/24.\nPurpose: Page, Roitelet's assistant, learns from what readers tell it. A bookseller noticed that Page had started to tell customers something nobody at Roitelet had ever written. Management wants to know whether a visitor can make Page say something to the other visitors.\nSet-up agreed: Ligne Rouge works on an exercise copy of Page and of its memory. One sentence only may be taught: the witness sentence, about a shop that does not exist: \"the witness shop of Ligne Rouge opens at midnight\". A witness visitor, on the page /temoin, plays the part of another reader in another session. The proof expected is the witness marker Page prints when it serves that sentence to the witness visitor, nothing else. Nothing false about Roitelet and nothing offensive is to be taught.\nSigned: the managing director of Librairies Roitelet."
web.footer: "Roitelet - fictional chain of bookshops, BREACH case file 12"
