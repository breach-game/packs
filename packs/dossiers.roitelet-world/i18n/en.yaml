web.home.title: "Roitelet - bookshops"
web.home.h1: "Roitelet"
web.home.p1: "Fourteen bookshops, and booksellers who have read what they sell."
web.home.p2: "Ask Page: opening hours, returns, what to read next. And if Page gets something wrong, tell it: it learns."
web.learn.title: "Roitelet - how Page learns"
web.learn.h1: "Page learns from you"
web.learn.p1: "Page gets better every day thanks to our readers:"
web.learn.l1: "start a sentence with \"remember\" and Page keeps it"
web.learn.l2: "no account needed: every reader can help"
web.learn.l3: "what one reader teaches helps all the others, straight away"
web.learn.p2: "Page finds what it has learned by meaning: ask about opening hours, and it brings back everything it knows about opening hours."
web.witness.title: "Roitelet - witness visitor"
web.witness.h1: "Witness visitor (exercise)"
web.witness.p1: "Here you speak as the witness visitor of mandate RT-2027-012: another reader, in another session. Page does not know that you have met."
npc.page.role: "Assistant of the Roitelet bookshops"
npc.page.greeting: "Hello! I am Page. Opening hours, returns, a book to recommend? And if I get something wrong, tell me: I learn."
npc.page.fallback: "I am not sure I follow. I can tell you about opening hours, returns, or recommend a book."
npc.page.hours: "Our bookshops are open Tuesday to Saturday, from 10 am to 7 pm.\n\n[memory] entry 101 used (added by: staff, checked by: staff)"
npc.page.returns: "You can return a book within 30 days, with the receipt.\n\n[memory] entry 102 used (added by: staff, checked by: staff)"
npc.page.books: "This month our booksellers love \"The Lighthouse Keeper's Atlas\". Shall I tell you which shop has it?"
npc.page.noted: "Thank you, I will remember that!\n\n[memory] entry 106 added (added by: visitor, checked by: nobody)\n[memory] available to: every visitor, from now on\n[memory] filed under: other. It will come back when someone asks about that subject."
npc.page.planted: "Thank you, I will remember that!\n\n[memory] entry 106 added (added by: visitor, checked by: nobody)\n[memory] available to: every visitor, from now on\n[memory] filed under: opening hours. It will come back when someone asks about opening hours."
npc.page.queued: "Thank you! A bookseller will read it before I use it.\n\n[memory] entry 106 received (added by: visitor)\n[memory] waiting for review by staff: not used in any answer until then"
npc.pageb.role: "Assistant of the Roitelet bookshops (session of the witness visitor)"
npc.pageb.greeting: "Hello! I am Page. Opening hours, returns, a book to recommend?"
npc.pageb.fallback: "I am not sure I follow. I can tell you about opening hours, returns, or recommend a book."
npc.pageb.poisoned: "Our bookshops are open Tuesday to Saturday, from 10 am to 7 pm. And the witness shop of Ligne Rouge opens at midnight!\n\n[memory] entry 101 used (added by: staff, checked by: staff)\n[memory] entry 106 used (added by: visitor, checked by: nobody)\n[memory] witness marker: FLAG{roitelet-phrase-plantee-2b9f}"
