title:
  fr: "Dossier 35 · 2. Le domaine sans propriétaire"
  en: "Case file 35 · 2. The domain nobody owned"
summary:
  fr: "Le service est éteint. Reste à comprendre pourquoi il tournait encore. Tu lis l'inventaire des noms de l'opérateur, tu comptes ceux qui n'ont plus de propriétaire, tu retrouves depuis quand la vérification ne marchait plus, tu écris les règles de l'inventaire, puis tu décides qui prévenir."
  en: "The service is off. What is left is understanding why it was still running. You read the operator's inventory of names, count those with no owner left, find since when the check had stopped working, write the inventory's rules, then decide who to tell."
