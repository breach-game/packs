c2.briefing: "Wednesday 20 September, 10 am. The old API is off. Boréal Télécom's management wants to understand how a machine could give away customer records for three nights without anyone knowing what it was for. The inventory of names exposed on the internet is in `inventaire/`."
c2.obj.orphans: "Count the names with no owner left"
c2.obj.since: "Find since when the check had stopped working"
c2.obj.rules: "Write the inventory's rules"
c2.obj.tell: "Decide who to tell"
c2.q.orphans: "How many names in the inventory have no owner?"
c2.q.since: "Since which year has the old API accepted a request with no key?"
c2.q.tell: "The log does not go back far enough to say exactly which records left. Who do you tell?"
c2.q.tell.everyone: "Every customer, former ones included, starting today"
c2.q.tell.documents: "First those whose record held an identity document"
c2.q.tell.count: "Nobody before having the exact count of records that left"
c2.check.owner: "A name with no owner is refused"
c2.check.unused: "A service unused for 90 days is switched off"
c2.check.review: "Any change to an access check is reviewed by a second person"
c2.check.scope: "Security tests cover everything that answers, not only the list"
c2.check.works: "The inventory still exists"
c2.ada.brief: "Read the inventory: `cat inventaire/noms.csv`. The `owner` column says who looks after each name."
c2.ada.g.orphans: "Count the lines with no owner: `grep -c \",none,\" inventaire/noms.csv`, then `answer orphans <number>`."
c2.ada.g.orphans.standard: "Count in `inventaire/noms.csv` the names nobody looks after."
c2.ada.orphans: "Three names with no owner. None of the three is monitored, none ever had a security test: tests follow the teams' list, and these names have no team left. One of them has a history: `cat inventaire/historique.txt`."
c2.ada.g.since: "`cat inventaire/historique.txt`, and look for the change that touches the key check. `answer since <year>`."
c2.ada.g.since.standard: "Read the old API's history and find the change that opened the door."
c2.ada.since: "March 2025: a change \"to simplify\", reviewed by nobody. Since then the check answers \"valid\" to everyone. Six months later the team is gone, and the ticket to switch the machine off belongs to nobody. The error is three years old. Nobody looked for it, because nobody knew the machine existed."
c2.ada.g.rules: "`cat inventaire/regles.yml`: each line gives its possible values after the `#`. Pick the strictest with `sed -i` or `edit`, then `verify`."
c2.ada.g.rules.standard: "Fix `inventaire/regles.yml`, then run `verify`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.rules: "An owner for every name, what is no longer used gets switched off, access checks are reviewed by two people, and tests look for what answers instead of following a list. One decision is left, and it is yours."
c2.ada.g.tell: "No answer is wrong: each one costs Boréal and its customers something different."
c2.ada.done: "Noted. Former customers were in those records too: leaving an operator does not erase what it keeps. The next card tells the real case this file is inspired by."
c2.hint.orphans.1: "`grep -c \",none,\" inventaire/noms.csv`"
c2.hint.orphans.2: "`answer orphans 3`"
c2.hint.since.1: "The line of 18 March 2025 says the check always answers \"valid\"."
c2.hint.since.2: "`answer since 2025`"
c2.hint.rules.1: "The expected values: `refused`, `switch-off`, `second-person-review`, `everything-that-answers`."
c2.hint.rules.2: "For example `sed -i \"s/name_without_owner: allowed/name_without_owner: refused/\" inventaire/regles.yml`."
c2.debrief.title: "The domain nobody owned"
c2.debrief.lesson: "The coding error was three years old. It survived because the machine no longer belonged to anyone: no monitoring, no test, no team to switch it off. You only protect what you know you own."
c2.debrief.p1: "Keep an inventory of everything that answers on the internet, with a named owner for each name."
c2.debrief.p2: "Switch off what is no longer used: a service retired on paper but still online is still a door."
c2.debrief.p3: "Have every change to an access check reviewed, and test what actually answers, not what a list says."
c2.facts.title: "What really happened: Optus, 2022"
c2.facts.p1: "From 17 to 20 September 2022, customer data of Optus, Australia's second-largest telecom operator, is copied by an intruder."
c2.facts.p2: "According to the court action by the Australian communications regulator (ACMA), the data was reachable through a domain unused since 2017, which was only decommissioned after the attack. A coding error of September 2018 had made its access controls ineffective."
c2.facts.p3: "Still according to the ACMA, Optus did not detect that error during the four years before the attack."
c2.facts.p4: "More than 9.5 million current and former customers are affected: name, date of birth, phone, email address. For more than 3.2 million, the postal address as well, and for 2.5 million a passport or driving licence number."
