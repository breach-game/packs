c2.briefing: "Mercredi 20 septembre, 10 h. L'ancienne API est éteinte. La direction de Boréal Télécom veut comprendre comment une machine a pu rendre des fiches de clients pendant trois nuits sans que personne ne sache à quoi elle servait. L'inventaire des noms exposés sur internet est dans `inventaire/`."
c2.obj.orphans: "Compter les noms qui n'ont plus de propriétaire"
c2.obj.since: "Trouver depuis quelle année la vérification ne marchait plus"
c2.obj.rules: "Écrire les règles de l'inventaire"
c2.obj.tell: "Décider qui prévenir"
c2.q.orphans: "Combien de noms de l'inventaire n'ont aucun propriétaire ?"
c2.q.since: "Depuis quelle année l'ancienne API accepte-t-elle une requête sans clé ?"
c2.q.tell: "Le journal ne remonte pas assez loin pour dire exactement quelles fiches sont parties. Qui prévenir ?"
c2.q.tell.everyone: "Tous les clients, anciens compris, dès aujourd'hui"
c2.q.tell.documents: "D'abord ceux dont une pièce d'identité figurait dans la fiche"
c2.q.tell.count: "Personne avant d'avoir le compte exact des fiches parties"
c2.check.owner: "Un nom sans propriétaire est refusé"
c2.check.unused: "Un service inutilisé depuis 90 jours est éteint"
c2.check.review: "Tout changement d'un contrôle d'accès est relu par une seconde personne"
c2.check.scope: "Les tests de sécurité couvrent tout ce qui répond, pas seulement la liste"
c2.check.works: "L'inventaire existe toujours"
c2.ada.brief: "Lis l'inventaire : `cat inventaire/noms.csv`. La colonne `owner` dit qui s'occupe de chaque nom."
c2.ada.g.orphans: "Compte les lignes sans propriétaire : `grep -c \",none,\" inventaire/noms.csv`, puis `answer orphans <nombre>`."
c2.ada.g.orphans.standard: "Compte dans `inventaire/noms.csv` les noms dont personne ne s'occupe."
c2.ada.orphans: "Trois noms sans propriétaire. Aucun des trois n'est surveillé, aucun n'a jamais eu de test de sécurité : les tests suivent la liste des équipes, et ces noms n'ont plus d'équipe. L'un d'eux a une histoire : `cat inventaire/historique.txt`."
c2.ada.g.since: "`cat inventaire/historique.txt`, et cherche le changement qui touche à la vérification de la clé. `answer since <année>`."
c2.ada.g.since.standard: "Lis l'histoire de l'ancienne API et trouve le changement qui a ouvert la porte."
c2.ada.since: "Mars 2025 : un changement « pour simplifier », relu par personne. Depuis, la vérification répond « valide » à tout le monde. Six mois plus tard l'équipe disparaît, et le ticket pour éteindre la machine n'est à personne. L'erreur a trois ans. Personne ne l'a cherchée, parce que personne ne savait que la machine existait."
c2.ada.g.rules: "`cat inventaire/regles.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut quatre : `refused`, `switch-off`, `second-person-review`, `everything-that-answers`. Change-les avec `edit inventaire/regles.yml` ou `sed -i`, puis `verify`."
c2.ada.g.rules.standard: "Corrige `inventaire/regles.yml`, puis lance `verify`. Pour ouvrir le fichier : `edit inventaire/regles.yml`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.rules: "Un propriétaire pour chaque nom, ce qui ne sert plus s'éteint, les contrôles d'accès se relisent à deux, et les tests cherchent ce qui répond au lieu de suivre une liste. Une décision t'attend."
c2.ada.g.tell: "Aucune réponse n'est fausse : chacune coûte quelque chose de différent à Boréal et à ses clients."
c2.ada.done: "Noté. Les anciens clients aussi étaient dans ces fiches : partir de chez un opérateur n'efface pas ce qu'il garde. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
c2.hint.orphans.1: "`grep -c \",none,\" inventaire/noms.csv`"
c2.hint.orphans.2: "`answer orphans 3`"
c2.hint.since.1: "La ligne du 18 mars 2025 dit que la vérification répond toujours « valide »."
c2.hint.since.2: "`answer since 2025`"
c2.hint.rules.1: "Les valeurs attendues : `refused`, `switch-off`, `second-person-review`, `everything-that-answers`."
c2.hint.rules.2: "Avec l'éditeur : `edit inventaire/regles.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/name_without_owner: allowed/name_without_owner: refused/\" inventaire/regles.yml`."
c2.debrief.title: "Le domaine sans propriétaire"
c2.debrief.lesson: "L'erreur de code avait trois ans. Elle a survécu parce que la machine n'appartenait plus à personne : ni surveillance, ni test, ni équipe pour l'éteindre. On ne protège que ce qu'on sait posséder."
c2.debrief.p1: "Tenir l'inventaire de tout ce qui répond sur internet, avec un propriétaire nommé pour chaque nom."
c2.debrief.p2: "Éteindre ce qui ne sert plus : un service retiré sur le papier mais encore en ligne reste une porte."
c2.debrief.p3: "Faire relire tout changement d'un contrôle d'accès, et tester ce qui répond réellement, pas ce qu'une liste annonce."
c2.facts.title: "Ce qui s'est vraiment passé : Optus, 2022"
c2.facts.p1: "Du 17 au 20 septembre 2022, des données de clients d'Optus, deuxième opérateur télécom d'Australie, sont copiées par un intrus."
c2.facts.p2: "Selon l'action en justice du régulateur australien des communications (ACMA), les données étaient accessibles par un domaine inutilisé depuis 2017, qui n'a été retiré qu'après l'attaque. Une erreur de code de septembre 2018 y avait rendu les contrôles d'accès inopérants."
c2.facts.p3: "Toujours selon l'ACMA, Optus n'a pas détecté cette erreur pendant les quatre années qui ont précédé l'attaque."
c2.facts.p4: "Plus de 9,5 millions de clients, actuels et anciens, sont concernés : nom, date de naissance, téléphone, adresse électronique. Pour plus de 3,2 millions s'ajoute l'adresse postale, et pour 2,5 millions un numéro de passeport ou de permis de conduire."
