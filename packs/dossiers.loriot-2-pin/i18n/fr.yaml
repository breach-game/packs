l2.briefing: "loriot-ui ne fera plus confiance à une étiquette. La configuration d'intégration est copiée dans `depot/ci.yml`, et l'historique de l'étiquette `v45` dans `dossier/etiquette-v45.txt`. Répare la copie, la mainteneuse la reportera sur le dépôt."
l2.obj.pin: "Épingler l'action sur l'empreinte du bon commit"
l2.obj.perms: "Réduire les droits du jeton de la forge"
l2.obj.why: "Dire pourquoi une étiquette ne suffit pas"
l2.check.pin: "fichiers-modifies épinglée sur l'empreinte complète du commit du 30 septembre"
l2.check.perms: "Le jeton de la forge ne fait que lire"
l2.check.works: "Le dépôt est récupéré et les tests tournent toujours"
l2.q.why: "Pourquoi l'empreinte complète plutôt que `v45` ?"
l2.q.why.moves: "Une étiquette se déplace, une empreinte complète désigne un seul contenu"
l2.q.why.newer: "Parce que `v45` est trop ancienne, il faut une version récente"
l2.q.why.newer.why: "L'âge n'y est pour rien : c'est `v45` elle-même qui a été déplacée vers un autre code. Une version plus récente aurait pu l'être aussi."
l2.q.why.faster: "Parce qu'une empreinte se télécharge plus vite qu'une étiquette"
l2.q.why.faster.why: "Aucune différence de vitesse. La différence, c'est qu'une étiquette peut changer de cible, pas une empreinte."
l2.ada.brief: "Lis la configuration, puis l'historique : `cat depot/ci.yml` et `cat dossier/etiquette-v45.txt`."
l2.ada.g.pin: "Remplace `@v45` par l'empreinte complète du commit signé du 30 septembre. Ouvre `edit depot/ci.yml`, ou : `sed -i \"s/fichiers-modifies@v45/fichiers-modifies@9b1e4c07d2a35f6e8c01b7a49d3e2f5a6c8b0d14/\" depot/ci.yml`. Puis `verify`."
l2.ada.g.pin.standard: "Épingle l'action sur l'empreinte complète du dernier bon commit, celui que les mainteneurs désignent. Puis `verify`."
l2.ada.pin: "Épinglée. Même si quelqu'un déplace encore `v45`, loriot-ui exécutera exactement ce code-là, et rien d'autre."
l2.ada.g.perms: "Le jeton de la forge a tous les droits, alors que les tests n'ont qu'à lire. `permissions: read-all` à la place de `write-all`, puis `verify`."
l2.ada.g.perms.standard: "Le jeton que reçoit chaque exécution a plus de droits qu'il n'en faut. Réduis-les, puis `verify`."
l2.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
l2.ada.fixed: "Une action figée, un jeton qui ne fait que lire. Une question avant de rendre la copie."
l2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
l2.ada.answer.standard: "Ma question t'attend dans la messagerie."
l2.ada.done: "L'épinglage a un coût : il faudra mettre à jour l'empreinte à la main, après avoir lu ce qui change. C'est le prix de savoir ce qui tourne avec ses secrets."
l2.hint.pin.1: "L'empreinte complète, 40 caractères, du commit signé et présent dans `main`."
l2.hint.pin.2: "`sed -i \"s/fichiers-modifies@v45/fichiers-modifies@9b1e4c07d2a35f6e8c01b7a49d3e2f5a6c8b0d14/\" depot/ci.yml`, puis `verify`."
l2.hint.perms.1: "La ligne `permissions`, en haut du fichier."
l2.hint.perms.2: "`sed -i \"s/permissions: write-all/permissions: read-all/\" depot/ci.yml`, puis `verify`."
l2.hint.why.1: "Qu'est-ce qui a changé cette nuit : le code de Loriot, ou la cible de `v45` ?"
l2.debrief.title: "Épingler ce qui tourne avec ses secrets"
l2.debrief.lesson: "Loriot faisait confiance à `v45`, un panneau que quelqu'un a déplacé avec un jeton volé. Épingler sur l'empreinte complète d'un commit vérifié fige le code exécuté. Et un jeton qui ne fait que lire limite ce qu'un outil piégé peut faire avec."
l2.debrief.p1: "Épingler les actions tierces sur l'empreinte complète d'un commit, pas sur une étiquette."
l2.debrief.p2: "Donner au jeton de chaque exécution le minimum de droits, par défaut en lecture."
l2.debrief.p3: "Mettre à jour une dépendance épinglée volontairement, après avoir lu ce qui change."
