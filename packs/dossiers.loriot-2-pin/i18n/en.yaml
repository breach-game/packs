l2.briefing: "loriot-ui will no longer trust a tag. The integration settings are copied in `depot/ci.yml`, and the history of tag `v45` in `dossier/etiquette-v45.txt`. Repair the copy; the maintainer will carry it over to the repository."
l2.obj.pin: "Pin the action to the right commit's hash"
l2.obj.perms: "Reduce the forge token's rights"
l2.obj.why: "Say why a tag is not enough"
l2.check.pin: "fichiers-modifies pinned to the full hash of the 30 September commit"
l2.check.perms: "The forge token only reads"
l2.check.works: "The repository is checked out and the tests still run"
l2.q.why: "Why the full hash rather than `v45`?"
l2.q.why.moves: "A tag can be moved, a full hash names one single content"
l2.q.why.newer: "Because `v45` is too old: a recent version, with its fixes, is needed"
l2.q.why.newer.why: "Age has nothing to do with it: `v45` itself was moved to other code. A newer version could have been moved too."
l2.q.why.faster: "Because a hash downloads faster than a tag does"
l2.q.why.faster.why: "No difference in speed. The difference is that a tag can change target, a hash cannot."
l2.ada.brief: "Read the settings, then the history: `cat depot/ci.yml` and `cat dossier/etiquette-v45.txt`."
l2.ada.g.pin: "Replace `@v45` with the full hash of the signed 30 September commit. Open `edit depot/ci.yml`, or: `sed -i \"s/fichiers-modifies@v45/fichiers-modifies@9b1e4c07d2a35f6e8c01b7a49d3e2f5a6c8b0d14/\" depot/ci.yml`. Then `verify`."
l2.ada.g.pin.standard: "Pin the action to the full hash of the last good commit, the one the maintainers point to. Then `verify`. To open the file: `edit depot/ci.yml`."
l2.ada.pin: "Pinned. Even if someone moves `v45` again, loriot-ui will run exactly that code, and nothing else."
l2.ada.g.perms: "The forge token has every right, while the tests only need to read. `permissions: read-all` instead of `write-all`, then `verify`."
l2.ada.g.perms.standard: "The token each run receives has more rights than it needs. Reduce them, then `verify`."
l2.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
l2.ada.fixed: "A frozen action, a token that only reads. One question before handing the copy over."
l2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
l2.ada.answer.standard: "My question is waiting in the messenger."
l2.ada.done: "Pinning has a cost: the hash must be updated by hand, after reading what changes. That is the price of knowing what runs with your secrets."
l2.hint.pin.1: "The full hash, 40 characters, of the commit that is signed and in `main`."
l2.hint.pin.2: "With the editor: `edit depot/ci.yml`, then Ctrl+S. With a command: `sed -i \"s/fichiers-modifies@v45/fichiers-modifies@9b1e4c07d2a35f6e8c01b7a49d3e2f5a6c8b0d14/\" depot/ci.yml`, then `verify`."
l2.hint.perms.1: "The `permissions` line, at the top of the file."
l2.hint.perms.2: "With the editor: `edit depot/ci.yml`, then Ctrl+S. With a command: `sed -i \"s/permissions: write-all/permissions: read-all/\" depot/ci.yml`, then `verify`."
l2.hint.why.1: "What changed last night: Loriot's code, or the target of `v45`?"
l2.debrief.title: "Pin what runs with your secrets"
l2.debrief.lesson: "Loriot trusted `v45`, a sign someone moved with a stolen token. Pinning to the full hash of a checked commit freezes the code that runs. And a token that only reads limits what a trapped tool can do with it."
l2.debrief.p1: "Pin third-party actions to a commit's full hash, not to a tag."
l2.debrief.p2: "Give each run's token the fewest rights, read-only by default."
l2.debrief.p3: "Update a pinned dependency on purpose, after reading what changes."
