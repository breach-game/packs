s3.briefing: "The fraudsters knew who pays suppliers, with which software, and that everything is approved by email. They hacked nothing: they read the website. What the firm publishes is in `site/`: the brochure, the job ad, the team page."
s3.obj.tool: "Find what the brochure gives away"
s3.obj.jobs: "Make the job ad say less"
s3.obj.team: "Remove the addresses and direct lines from the team page"
s3.obj.clients: "Decide how to warn clients"
s3.q.tool: "Which payment software does the brochure reveal?"
s3.q.clients: "How does the firm warn its clients?"
s3.q.clients.all: "A letter to all: never an IBAN change by email, always a call"
s3.q.clients.two: "Warn only the two clients who received a fake invoice"
s3.q.clients.none: "Say nothing, so as not to worry the clientele"
s3.check.jobs: "The ad no longer names the software, the person who pays, or approval by email"
s3.check.team: "No more personal addresses or direct lines on the team page"
s3.check.works: "The ad and the team page still exist, with the contact address"
s3.ada.brief: "Start with the brochure: `file site/plaquette.pdf`. A PDF often keeps who wrote it, and with what. `strings` shows it."
s3.ada.g.tool: "`strings site/plaquette.pdf`, then `answer tool <software>`."
s3.ada.g.tool.standard: "Find what the brochure's metadata says. `answer tool`."
s3.ada.tool: "Author: the head of payments. Software: PayFlux. In a marketing brochure."
s3.ada.g.jobs: "The job ad says who pays, with which tool, and that IBAN changes are approved by simple email. `cat site/recrutement.md`, then remove those three things: `sed -i \"/Aline Morel/d\" site/recrutement.md`, `sed -i \"s/ dans PayFlux 4.2//\" site/recrutement.md`, `sed -i \"/simple e-mail/d\" site/recrutement.md`. Then `verify`. Or by hand, in the editor: `edit site/recrutement.md`, then Ctrl+S."
s3.ada.g.jobs.standard: "Remove from the job ad everything that helps a fraudster: who, with what, how payments are approved. Then `verify`. To open the file: `edit site/recrutement.md`."
s3.ada.g.team: "The team page gives every address and every direct line. Keep the names and the contact address: `sed -i \"s/ - [a-z.]*@sarcelle.test - 01 99 00 41 [0-9]*//\" site/equipe.md`, then `verify`. Or by hand, in the editor: `edit site/equipe.md`, then Ctrl+S."
s3.ada.g.team.standard: "Keep the names and the general contact, remove personal addresses and lines. Then `verify`."
s3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
s3.ada.ready: "The site no longer tells the playbook. The brochure still needs re-exporting without its metadata. The clients remain. I leave the decision to you."
s3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
s3.ada.answer.standard: "My question is waiting in the messenger."
s3.ada.all: "The best reflex: every client now knows an IBAN does not change by email. The next fake invoice will reach someone who has been warned."
s3.ada.two: "The two victims are warned. The hundred other clients will receive the next fake invoice without knowing."
s3.ada.none: "Clients stay defenceless, and will learn the story from the next fake invoice."
s3.ada.done: "A look-alike domain spotted, a real domain that rejects impostors, a site that no longer gives away the playbook. The fraudsters have much less to hold on to."
s3.hint.tool.1: "Look for the /Producer line."
s3.hint.tool.2: "`answer tool PayFlux`"
s3.hint.jobs.1: "With the editor: `edit site/recrutement.md`, then Ctrl+S. With a command: `sed -i \"/simple e-mail/d\" site/recrutement.md` deletes a whole line."
s3.hint.jobs.2: "Two lines remain: `sed -i \"/Aline Morel/d\" site/recrutement.md` and `sed -i \"s/ dans PayFlux 4.2//\" site/recrutement.md`. Or by hand, in the editor: `edit site/recrutement.md`, then Ctrl+S."
s3.hint.team.1: "A single `sed` command with `[a-z.]*` removes all the addresses at once."
s3.hint.team.2: "With the editor: `edit site/equipe.md`, then Ctrl+S. With a command: `sed -i \"s/ - [a-z.]*@sarcelle.test - 01 99 00 41 [0-9]*//\" site/equipe.md`"
s3.hint.clients.1: "No answer is wrong. Who will receive the next fake invoice?"
s3.debrief.title: "What the website tells"
s3.debrief.lesson: "A transfer fraud is prepared with what the company publishes: who pays, with which tool, how changes are approved. Reducing your public footprint costs almost nothing, and takes away the fraudsters' script."
s3.debrief.p1: "Review job ads and team pages: publish roles and a general contact, not internal procedures or direct lines."
s3.debrief.p2: "Clean documents' metadata before publishing (author, software)."
s3.debrief.p3: "Tell clients, once and for all, how the firm will never write to them."
