s3.briefing: "Les fraudeurs savaient qui paie les fournisseurs, avec quel logiciel, et que tout se valide par courriel. Ils n'ont rien piraté : ils ont lu le site. Ce que le cabinet publie est dans `site/` : la plaquette, l'offre d'emploi, la page équipe."
s3.obj.tool: "Trouver ce que la plaquette laisse échapper"
s3.obj.jobs: "Faire taire l'offre d'emploi"
s3.obj.team: "Retirer les adresses et lignes directes de la page équipe"
s3.obj.clients: "Décider comment prévenir les clients"
s3.q.tool: "Quel logiciel de paiement la plaquette révèle-t-elle ?"
s3.q.clients: "Comment le cabinet prévient-il ses clients ?"
s3.q.clients.all: "Un courrier à tous : jamais de changement d'IBAN par courriel, toujours un appel"
s3.q.clients.two: "Prévenir seulement les deux clients qui ont reçu une fausse facture"
s3.q.clients.none: "Ne rien dire, pour ne pas inquiéter la clientèle"
s3.check.jobs: "L'offre ne cite plus le logiciel, ni la personne qui paie, ni la validation par courriel"
s3.check.team: "Plus d'adresse ni de ligne directe personnelles sur la page équipe"
s3.check.works: "L'offre et la page équipe existent toujours, avec l'adresse de contact"
s3.ada.brief: "Commence par la plaquette : `file site/plaquette.pdf`. Un PDF garde souvent qui l'a écrit, et avec quoi. `strings` le montre."
s3.ada.g.tool: "`strings site/plaquette.pdf`, puis `answer tool <logiciel>`."
s3.ada.g.tool.standard: "Trouve ce que les métadonnées de la plaquette disent. `answer tool`."
s3.ada.tool: "Auteur : la responsable des paiements. Logiciel : PayFlux. Dans une plaquette commerciale."
s3.ada.g.jobs: "L'offre d'emploi dit qui paie, avec quel outil, et que les changements d'IBAN se valident par simple courriel. `cat site/recrutement.md`, puis retire ces trois choses : `sed -i \"/Aline Morel/d\" site/recrutement.md`, `sed -i \"s/ dans PayFlux 4.2//\" site/recrutement.md`, `sed -i \"/simple e-mail/d\" site/recrutement.md`. Puis `verify`. Ou à la main, dans l'éditeur : `edit site/recrutement.md`, puis Ctrl+S."
s3.ada.g.jobs.standard: "Retire de l'offre d'emploi tout ce qui aide un fraudeur : qui, avec quoi, comment se valident les paiements. Puis `verify`. Pour ouvrir le fichier : `edit site/recrutement.md`."
s3.ada.g.team: "La page équipe donne chaque adresse et chaque ligne directe. Garde les noms et l'adresse de contact : `sed -i \"s/ - [a-z.]*@sarcelle.test - 01 99 00 41 [0-9]*//\" site/equipe.md`, puis `verify`. Ou à la main, dans l'éditeur : `edit site/equipe.md`, puis Ctrl+S."
s3.ada.g.team.standard: "Garde les noms et le contact général, retire les adresses et lignes personnelles. Puis `verify`."
s3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
s3.ada.ready: "Le site ne raconte plus le mode d'emploi. Il restera à réexporter la plaquette sans ses métadonnées. Reste les clients. Je te laisse décider."
s3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
s3.ada.answer.standard: "Ma question t'attend dans la messagerie."
s3.ada.all: "Le meilleur réflexe : chaque client sait désormais qu'un IBAN ne change pas par courriel. La prochaine fausse facture tombera sur quelqu'un de prévenu."
s3.ada.two: "Les deux victimes sont prévenues. Les cent autres clients, eux, recevront la prochaine fausse facture sans le savoir."
s3.ada.none: "Les clients restent sans défense, et apprendront l'histoire par la prochaine fausse facture."
s3.ada.done: "Un domaine sosie repéré, un vrai domaine qui rejette les imposteurs, un site qui ne livre plus le mode d'emploi. Les fraudeurs ont beaucoup moins à quoi se raccrocher."
s3.hint.tool.1: "Cherche la ligne /Producer."
s3.hint.tool.2: "`answer tool PayFlux`"
s3.hint.jobs.1: "Avec l'éditeur : `edit site/recrutement.md`, puis Ctrl+S. Avec une commande : `sed -i \"/simple e-mail/d\" site/recrutement.md` supprime une ligne entière."
s3.hint.jobs.2: "Il reste deux lignes : `sed -i \"/Aline Morel/d\" site/recrutement.md` et `sed -i \"s/ dans PayFlux 4.2//\" site/recrutement.md`. Ou à la main, dans l'éditeur : `edit site/recrutement.md`, puis Ctrl+S."
s3.hint.team.1: "Une seule commande `sed` avec `[a-z.]*` retire toutes les adresses d'un coup."
s3.hint.team.2: "Avec l'éditeur : `edit site/equipe.md`, puis Ctrl+S. Avec une commande : `sed -i \"s/ - [a-z.]*@sarcelle.test - 01 99 00 41 [0-9]*//\" site/equipe.md`"
s3.hint.clients.1: "Aucune réponse n'est fausse. Qui recevra la prochaine fausse facture ?"
s3.debrief.title: "Ce que le site raconte"
s3.debrief.lesson: "Une fraude au virement se prépare avec ce que l'entreprise publie : qui paie, avec quel outil, comment se valident les changements. Réduire son empreinte publique ne coûte presque rien, et prive les fraudeurs de leur scénario."
s3.debrief.p1: "Relire offres d'emploi et pages d'équipe : publier des fonctions et un contact général, pas des procédures internes ni des lignes directes."
s3.debrief.p2: "Nettoyer les métadonnées des documents avant publication (auteur, logiciel)."
s3.debrief.p3: "Dire aux clients, une fois pour toutes, comment le cabinet ne leur écrira jamais."
