cd.briefing: "Chloé, la gérante d'Atelier Pixel, a lu ton rapport. Elle t'envoie la configuration du site et te demande de fermer ce que tu as trouvé. Même mandat, autre côté de la table."
cd.obj.leak: "Décider quoi faire du mot de passe qui a fuité"
cd.obj.harden: "Corriger la configuration du site, puis lancer `verify`"
cd.q.leak: "Le mot de passe de la base est resté lisible dans config.php.bak pendant plus d'un an. Que fait-on en premier ?"
cd.q.leak.delete: "Supprimer le fichier, le problème disparaît"
cd.q.leak.delete.why: "Supprimer le fichier arrête la fuite, pas ce qui a déjà fui. N'importe qui a pu copier ce mot de passe pendant l'année : il faut le considérer comme connu."
cd.q.leak.rotate: "Changer le mot de passe et le jeton d'administration"
cd.q.leak.wait: "Surveiller les journaux et attendre une connexion suspecte"
cd.q.leak.wait.why: "Attendre, c'est laisser en service un mot de passe connu. Et une connexion avec le bon mot de passe ressemble à toutes les autres dans les journaux."
cd.check.listing: "Les listes de dossiers sont désactivées"
cd.check.old: "Le dossier /old/ est refusé à tout le monde"
cd.check.served: "Le site lui-même est toujours servi"
cd.ada.brief: "Deuxième moitié du travail, celle pour laquelle les clients paient : fermer la porte. Le fichier de Chloé est dans `atelier/site.conf`. Une question d'abord."
cd.ada.leak: "Réponds à ma question dans la messagerie, ou avec `answer` suivi de la lettre."
cd.ada.leak.standard: "Réponds d'abord à ma question."
cd.ada.rotated: "Oui. Un secret qui a été lisible est un secret connu : on le remplace, puis on nettoie. Maintenant, la configuration."
cd.ada.harden: "Ouvre le fichier avec `edit atelier/site.conf`. Deux choses à changer : `autoindex on` liste les dossiers, et le bloc `/old/` laisse tout passer. Écris `autoindex off;` et mets `deny all;` dans le bloc `/old/`, puis lance `verify`."
cd.ada.harden.standard: "Ouvre `atelier/site.conf` : désactive la liste des dossiers, refuse le dossier `/old/` à tout le monde, puis lance `verify`. Pour ouvrir le fichier : `edit atelier/site.conf`."
cd.ada.almost: "Pas encore. `verify` liste ce qui reste ouvert : lis chaque ligne, corrige le fichier et relance."
cd.ada.done: "Porte fermée. Ouvre le débrief : le dernier mot porte sur ce qu'une configuration ne répare pas."
cd.hint.leak.1: "Demande-toi qui a déjà pu copier ce mot de passe."
cd.hint.harden.1: "Dans nginx, `autoindex` règle la liste des dossiers et `deny all;` refuse un emplacement à tout le monde."
cd.hint.harden.2: "Remplace `autoindex on` par `autoindex off`, et le commentaire du bloc `/old/` par `deny all;`."
cd.hint.harden.3: 'Avec l''éditeur : `edit atelier/site.conf`, puis Ctrl+S. Avec une commande : tape `sed -i "s/autoindex on/autoindex off/" atelier/site.conf`, puis `sed -i "s/# kept just in case/deny all;/" atelier/site.conf`, puis `verify`.'
cd.debrief.title: "Ce que la correction ne répare pas"
cd.debrief.lesson: "Fermer le dossier protège demain. Cela ne change rien à l'année pendant laquelle le mot de passe était public : c'est pour cela qu'on remplace le secret avant tout le reste."
cd.debrief.p1: "Un secret qui a fui se remplace, même si rien ne montre qu'il a servi."
cd.debrief.p2: "Refuser par défaut : désactiver les listes partout et n'ouvrir que ce dont le site a besoin."
cd.debrief.p3: "Après une correction, la vérifier comme le ferait un attaquant, et vérifier que le site marche toujours."
