cd.briefing: "Chloé, the manager of Atelier Pixel, read your report. She sent the configuration of the website and asks you to close what you found. Same mandate, other side of the table."
cd.obj.leak: "Decide what to do with the password that leaked"
cd.obj.harden: "Fix the site configuration, then run `verify`"
cd.q.leak: "The database password stayed readable in config.php.bak for more than a year. What comes first?"
cd.q.leak.delete: "Delete the file, the problem is gone"
cd.q.leak.delete.why: "Deleting the file stops the leak, but not what already leaked. Anyone may have copied that password during the year: it must be treated as known."
cd.q.leak.rotate: "Change the password and the admin token"
cd.q.leak.wait: "Watch the logs and wait for a suspicious login"
cd.q.leak.wait.why: "Waiting leaves a known password in service. And a login with the right password looks like any other in the logs."
cd.check.listing: "Directory listings are off"
cd.check.old: "The /old/ folder is refused to everyone"
cd.check.served: "The site itself is still served"
cd.ada.brief: "Second half of the job, and the one clients pay for: closing the door. Chloé's file is in `atelier/site.conf`. One question first."
cd.ada.leak: "Answer my question in the messenger, or with `answer` followed by the letter."
cd.ada.leak.standard: "Answer my question first."
cd.ada.rotated: "Yes. A secret that was readable is a secret that is known: you replace it, then you clean up. Now the configuration."
cd.ada.harden: "Open the file with `edit atelier/site.conf`. Two things to change: `autoindex on` lists the folders, and the `/old/` block lets everything through. Write `autoindex off;` and put `deny all;` in the `/old/` block, then run `verify`."
cd.ada.harden.standard: "Open `atelier/site.conf`: turn the directory listing off, refuse the `/old/` folder to everyone, then run `verify`. To open the file: `edit atelier/site.conf`."
cd.ada.almost: "Not yet. `verify` lists what is still open: read each line, fix the file, and run it again."
cd.ada.done: "Door closed. Open the debrief: the last word is about what a configuration cannot fix."
cd.hint.leak.1: "Ask yourself who may already have a copy of that password."
cd.hint.harden.1: "In nginx, `autoindex` controls directory listings and `deny all;` refuses a location to everyone."
cd.hint.harden.2: "Replace `autoindex on` with `autoindex off`, and the comment in the `/old/` block with `deny all;`."
cd.hint.harden.3: 'With the editor: `edit atelier/site.conf`, then Ctrl+S. With a command: type `sed -i "s/autoindex on/autoindex off/" atelier/site.conf`, then `sed -i "s/# kept just in case/deny all;/" atelier/site.conf`, then `verify`.'
cd.debrief.title: "What the fix does not fix"
cd.debrief.lesson: "Closing the folder protects tomorrow. It does nothing for the year during which the password was public: that is why the secret is replaced before anything else."
cd.debrief.p1: "A secret that leaked is replaced, even when nothing shows it was used."
cd.debrief.p2: "Refuse by default: turn listings off everywhere and open only what the site needs."
cd.debrief.p3: "After a fix, check it the way an attacker would, and check that the site still works."
