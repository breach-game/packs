file.readme: "Ligne Rouge workstation. Case file: Vanneau. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE BT-2028-102\nClient: Boréal Télécom, operator. Scope: *.boreal.test, 10.105.0.0/24.\nPurpose: an unusual volume of requests is reaching an old API address. Ligne Rouge helps Boréal understand, close it, then review its inventory.\nAgreed set-up: defence. Reading logs, measures approved by management and run through `contain`. One record only may be read as proof: test record 900001, created for this mandate. No real customer record is looked at.\nSigned: the chief information officer of Boréal Télécom."
ada.outOfScope: "Stop. This target is outside mandate BT-2028-102. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
