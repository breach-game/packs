file.readme: "Poste Ligne Rouge. Dossier : Vanneau. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT BT-2028-102\nClient : Boréal Télécom, opérateur. Périmètre : *.boreal.test, 10.105.0.0/24.\nObjet : un volume inhabituel de requêtes arrive sur une ancienne adresse d'API. Ligne Rouge aide Boréal à comprendre, à fermer, puis à revoir son inventaire.\nCadre convenu : défense. Lecture des journaux, mesures validées par la direction et passées par `contain`. Une seule fiche peut être lue pour preuve : la fiche de test 900001, créée pour ce mandat. Aucune fiche de client réel n'est consultée.\nSigné : la directrice des systèmes d'information de Boréal Télécom."
ada.outOfScope: "Stop. Cette cible est hors du mandat BT-2028-102. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
