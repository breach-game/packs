h2.briefing: "Samedi, 9 h. Le catalogue est corrigé, le serveur des réservations ne peut plus appeler l'extérieur. Mais la faille était publique depuis 21 h 30 hier, et les balayages ont commencé presque aussitôt. Quelqu'un est-il passé avant nous ? Le journal du pare-feu de vendredi soir est dans `traces/`."
h2.obj.rule: "Écrire la règle qui repère les recherches distantes dans les requêtes"
h2.obj.when: "Trouver l'heure où un serveur a répondu à l'appel"
h2.obj.what: "Identifier ce qui tourne depuis sur ce serveur"
h2.obj.stop: "Couper le serveur touché du réseau"
h2.obj.next: "Décider du sort du serveur"
h2.q.when: "À quelle heure le serveur des réservations a-t-il appelé le serveur extérieur pour la première fois ? (format HH:MM)"
h2.q.what: "Quel programme le serveur des réservations fait-il tourner depuis vendredi soir ? (son nom, sans le chemin)"
h2.q.next: "Le programme est arrêté et le serveur isolé. Qu'en fais-tu ?"
h2.q.next.rebuild: "Le réinstaller de zéro, avec la version corrigée"
h2.q.next.kill: "Supprimer le programme et le remettre en service"
h2.q.next.kill.why: "Pendant une heure et demie, quelqu'un a pu faire tourner ce qu'il voulait sur ce serveur. Le mineur est ce qu'on a trouvé, pas forcément tout ce qu'il y a."
h2.q.next.wait: "Le laisser isolé jusqu’au correctif de l’éditeur, lundi"
h2.q.next.wait.why: "Le correctif de lundi fermera la porte, il ne fera pas le ménage. Le serveur restera compromis, simplement à jour."
h2.contain.isolate: "Isoler le serveur des réservations du réseau (le service de réservation s'arrête)"
h2.ada.brief: "Les balayages arrivent encore. Écris la règle qui les repère dans `regles/recherche-distante.yml`, une condition par ligne, puis essaie-la avec `rule test regles/recherche-distante.yml`. Regarde d'abord les requêtes : `soc logs catalogue access`."
h2.ada.g.rule: "Les balayages cachent la recherche distante dans l'en-tête User-Agent. Ajoute la condition : `echo 'ua|contains: \"%{distant:\"' >> regles/recherche-distante.yml`, puis `rule test regles/recherche-distante.yml`."
h2.ada.g.rule.standard: "Repère dans le journal web ce que les balayages ont de commun, et écris la règle sur ce champ."
h2.ada.again: "Ta règle rate des balayages ou alerte sur des lecteurs ordinaires. Regarde le champ ua, pas le chemin : un lecteur peut chercher le mot « distant »."
h2.ada.rule: "Elle alerte sur chaque balayage et sur aucun lecteur. Maintenant, vendredi soir : avant notre parade de 23 h 20, est-ce qu'un serveur a répondu ?"
h2.ada.g.when: "La recherche distante passe par le port 1389 : `grep 1389 traces/pare-feu-vendredi.log`. Un refus, c'est la porte fermée ; une autorisation, c'est un serveur qui a appelé. Puis `answer when HH:MM`."
h2.ada.g.when.standard: "Cherche dans le pare-feu de vendredi la première connexion sortante autorisée vers le serveur de la recherche distante."
h2.ada.when: "21 h 47, depuis 10.95.0.22 : les réservations. Le catalogue, lui, a été refusé dès le début, son filtrage sortant existait déjà. Une seconde plus tard, les réservations téléchargent quelque chose sur le port 8080, puis parlent au port 3333. Va voir ce qui tourne."
h2.ada.g.what: "Connecte-toi : `ssh ir@reservations.albe.test`. Puis `ps aux` pour les processus, `ss` pour les connexions. Cherche un enfant du service Java. Puis `answer what <nom>`."
h2.ada.g.what.standard: "Regarde les processus et les connexions du serveur des réservations. Un enfant du service Java n'a rien à faire là."
h2.ada.what: "Un mineur de cryptomonnaie lancé par le service Java à 21 h 48, sous un nom qui imite un processus du noyau. Il essaie encore de joindre son serveur, le pare-feu l'en empêche."
h2.ada.g.stop: "Coupe le serveur du réseau : `contain isolate reservations`. Les réservations s'arrêtent pour la journée, c'est le prix."
h2.ada.g.stop.standard: "Isole le serveur compromis."
h2.ada.stopped: "Serveur isolé, mineur arrêté. Reste à décider ce qu'on en fait."
h2.ada.g.next: "Choisis ce que tu recommandes."
h2.ada.done: "Dossier clos. Le filtrage sortant a sauvé le catalogue avant même le correctif. Les réservations, livrées sans inventaire complet, ont payé l'écart."
h2.hint.rule.1: "Le champ s'appelle `ua`. Le modificateur `|contains` cherche un morceau de texte."
h2.hint.rule.2: "`echo 'ua|contains: \"%{distant:\"' >> regles/recherche-distante.yml`"
h2.hint.when.1: "`grep 1389 traces/pare-feu-vendredi.log` : la ligne `allow`."
h2.hint.when.2: "`answer when 21:47`"
h2.hint.what.1: "`ssh ir@reservations.albe.test`, puis `ps aux`."
h2.hint.what.2: "`answer what kworkerd`"
h2.hint.stop.1: "`contain isolate reservations`"
h2.debrief.title: "Samedi matin"
h2.debrief.lesson: "Entre la publication d'une faille et la parade, il y a des heures, et les balayages commencent dans les minutes. Ce qui a fait la différence vendredi n'était pas le correctif, arrivé trop tard pour les réservations : c'était un pare-feu qui refusait déjà au catalogue d'appeler l'extérieur."
h2.debrief.p1: "Repérer la classe d'attaque, pas une chaîne précise : les balayages changent d'adresse et de forme."
h2.debrief.p2: "Après une faille exploitable à distance, chercher des traces depuis l'heure de publication, pas depuis l'heure du correctif."
h2.debrief.p3: "Un serveur sur lequel un inconnu a exécuté du code se réinstalle ; on ne le nettoie pas."
h2.facts.title: "Ce qui s'est vraiment passé : Log4Shell, décembre 2021"
h2.facts.p1: "Le 9 décembre 2021, une faille de Log4j, bibliothèque de journalisation Java de la fondation Apache, devient publique (CVE-2021-44228, surnommée Log4Shell). Les versions 2.0-beta9 à 2.14.1 sont touchées."
h2.facts.p2: "Un texte journalisé contenant une recherche JNDI pouvait faire contacter un serveur extérieur et charger du code depuis celui-ci. Un champ de formulaire, un nom d'utilisateur ou un en-tête suffisaient."
h2.facts.p3: "Le premier correctif, 2.15.0, s'est révélé incomplet : d'autres failles ont suivi, corrigées en 2.16.0 puis 2.17.0 et 2.17.1."
h2.facts.p4: "Log4j était embarqué dans un nombre immense de produits, souvent sans que leurs utilisateurs le sachent. Beaucoup d'organisations ont passé des semaines à simplement trouver où il se trouvait."
h2.facts.p5: "En juillet 2022, le Cyber Safety Review Board américain qualifie Log4j de vulnérabilité « endémique » : des versions vulnérables resteront en service pendant des années, peut-être une décennie ou plus."
