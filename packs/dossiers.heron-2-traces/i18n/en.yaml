h2.briefing: "Saturday, 9 am. The catalogue is patched, the booking server can no longer call out. But the flaw has been public since 9:30 pm yesterday, and the scans started almost at once. Did anyone get in before us? Friday night's firewall log is in `traces/`. The servers are open to the incident response team through the `ir` account."
h2.obj.rule: "Write the rule that spots remote lookups in requests"
h2.obj.when: "Find the time a server answered the call"
h2.obj.what: "Identify what has been running on that server since"
h2.obj.stop: "Cut the affected server off the network"
h2.obj.next: "Decide the server's fate"
h2.q.when: "At what time did the booking server first call the outside server? (format HH:MM)"
h2.q.what: "What program has the booking server been running since Friday night? (its name, without the path)"
h2.q.next: "The program is stopped and the server isolated. What do you do with it?"
h2.q.next.rebuild: "Reinstall it from a clean image, isolated until the fix"
h2.q.next.kill: "Delete the program and put it back in service"
h2.q.next.kill.why: "For an hour and a half, someone could run whatever they wanted on this server. The miner is what we found, not necessarily all there is."
h2.q.next.wait: "Keep it isolated until the vendor's fix on Monday"
h2.q.next.wait.why: "Monday's fix will close the door, it will not clean up. The server will stay compromised, just up to date."
h2.contain.isolate: "Isolate the booking server from the network (the booking service stops)"
h2.ada.brief: "The scans are still coming. Write the rule that spots them in `regles/recherche-distante.yml`, one condition per line, then try it with `rule test regles/recherche-distante.yml`. Look at the requests first: `soc logs catalogue access`."
h2.ada.g.rule: "The scans hide the remote lookup in the User-Agent header. Add the condition: `echo 'ua|contains: \"%{distant:\"' >> regles/recherche-distante.yml`, then `rule test regles/recherche-distante.yml`."
h2.ada.g.rule.standard: "Spot what the scans have in common in the web log: it is the User-Agent header (field `ua`). Write the rule on that field."
h2.ada.again: "Your rule misses scans or alerts on ordinary readers. Look at the ua field, not the path: a reader may search for the word \"distant\"."
h2.ada.rule: "It alerts on every scan and on no reader. Now, Friday night: before our 11:20 pm stopgap, did any server answer?"
h2.ada.g.when: "The remote lookup goes through port 1389: `grep 1389 traces/pare-feu-vendredi.log`. A deny is the door shut; an allow is a server that called. Then `answer when HH:MM`."
h2.ada.g.when.standard: "Look in Friday's firewall log for the first allowed outgoing connection to the remote lookup server."
h2.ada.when: "9:47 pm, from 10.95.0.22: the booking server. The catalogue was denied from the start, its egress filtering already existed. A second later, the booking server downloads something on port 8080, then talks to port 3333. Go and see what runs: our incident response account there is `ir`."
h2.ada.g.what: "Sign in: `ssh ir@reservations.albe.test`. Then `ps aux` for the processes, `ss` for the connections. Look for a child of the Java service. Then `answer what <name>`."
h2.ada.g.what.standard: "Look at the processes and connections of the booking server, with the `ir` account. A child of the Java service has no business there."
h2.ada.what: "A cryptocurrency miner started by the Java service at 9:48 pm, under a name that imitates a kernel process. It still tries to reach its server, the firewall stops it."
h2.ada.g.stop: "Cut the server off the network: `contain isolate reservations`. Bookings stop for the day, that is the price."
h2.ada.g.stop.standard: "Isolate the compromised server."
h2.ada.stopped: "Server isolated, miner stopped. What is left is deciding what to do with it."
h2.ada.g.next: "Choose what you recommend."
h2.ada.done: "Case closed. Egress filtering saved the catalogue before the patch even existed. The booking server, shipped without a complete inventory, paid for the gap."
h2.hint.rule.1: "The field is called `ua`. The `|contains` modifier looks for a piece of text."
h2.hint.rule.2: "`echo 'ua|contains: \"%{distant:\"' >> regles/recherche-distante.yml`"
h2.hint.when.1: "`grep 1389 traces/pare-feu-vendredi.log`: the `allow` line."
h2.hint.when.2: "`answer when 21:47`"
h2.hint.what.1: "`ssh ir@reservations.albe.test`, then `ps aux`."
h2.hint.what.2: "`answer what kworkerd`"
h2.hint.stop.1: "`contain isolate reservations`"
h2.debrief.title: "Saturday morning"
h2.debrief.lesson: "Between a flaw's publication and the stopgap there are hours, and scans begin within minutes. What made the difference on Friday was not the patch, too late for the booking server: it was a firewall that already refused to let the catalogue call out."
h2.debrief.p1: "Spot the attack class, not one exact string: scans change address and shape."
h2.debrief.p2: "After a remotely exploitable flaw, look for traces from the time it was published, not from the time you patched."
h2.debrief.p3: "A server on which a stranger ran code gets reinstalled; you do not clean it."
h2.facts.title: "What really happened: Log4Shell, December 2021"
h2.facts.p1: "On 9 December 2021, a flaw in Log4j, the Apache Software Foundation's Java logging library, becomes public (CVE-2021-44228, nicknamed Log4Shell). Versions 2.0-beta9 to 2.14.1 are affected."
h2.facts.p2: "A logged text containing a JNDI lookup could make the application contact an outside server and load code from it. A form field, a user name or a header was enough."
h2.facts.p3: "The first fix, 2.15.0, turned out to be incomplete: more flaws followed, fixed in 2.16.0, then 2.17.0 and 2.17.1."
h2.facts.p4: "Log4j was shipped inside a huge number of products, often without their users knowing. Many organisations spent weeks just finding where it was."
h2.facts.p5: "In July 2022, the US Cyber Safety Review Board calls Log4j an \"endemic\" vulnerability: vulnerable versions will stay in service for years, perhaps a decade or longer."
