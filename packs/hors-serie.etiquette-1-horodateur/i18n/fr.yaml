e1.briefing: "Lundi matin à la mairie de Brumevaux. Ce week-end, des automobilistes ont payé leur stationnement en scannant un QR code sur l'horodateur, et ont reçu une amende quand même. Les signalements de la police municipale sont dans `signalements.txt`, et les agents ont photographié les horodateurs concernés ce matin, sans les scanner."
e1.obj.read: "Lire un faux QR code d'horodateur sans l'ouvrir"
e1.obj.domain: "Nommer le domaine des faux codes"
e1.obj.proof: "Dire ce qui prouve que le code est faux"
e1.obj.count: "Compter les horodateurs touchés"
e1.obj.tell: "Décider ce que la ville dit aux habitants"
e1.ada.brief: "Règle numéro un de la semaine : un QR code, on le lit, on ne le suit pas. Ouvrir l'adresse d'un escroc, même pour voir, c'est lui confirmer que son autocollant marche. On a tout ce qu'il faut sur ce poste."
e1.ada.g.read: "Commence par les signalements, `cat signalements.txt`, puis lis une photo sans l'ouvrir : `qr decode photos/H03.png`."
e1.ada.g.read.standard: "Lis les signalements, puis le contenu d'une des photos d'horodateur, sans jamais ouvrir l'adresse."
e1.ada.reports: "Trois horodateurs cités, et un quatrième (H09) où quelqu'un n'a vu qu'une page d'information. Lis le code de H03 : `qr decode photos/H03.png`."
e1.ada.reports.standard: "Lis le code d'un des horodateurs signalés."
e1.ada.read: "Voilà ce que le téléphone aurait ouvert, sans que personne l'ait ouvert. Regarde bien l'adresse."
e1.ada.blue: "H09, c'est le petit code bleu de la ville : il mène à la page d'information du site officiel, et il ne sert jamais à payer."
e1.ada.g.domain: "Quel domaine ouvre le faux code ? Réponds avec `answer domain <domaine>`."
e1.ada.g.domain.standard: "Donne le domaine que le faux code ouvre, avec `answer domain`."
e1.ada.domain: "Un domaine qui ressemble à la ville sans être la ville. Réponds à ma question."
e1.ada.proof: "C'est le seul test qui tienne : le nom du site. Le reste, un escroc le copie en cinq minutes."
e1.ada.g.count: "Les agents ont photographié quatre horodateurs. Lis-les tous d'un coup : `zbarimg photos/H03.png photos/H09.png photos/H12.png photos/H15.png`. Combien portent un faux code ? Réponds avec `answer count <nombre>`."
e1.ada.g.count.standard: "Lis les quatre photos et compte les horodateurs qui portent un faux code. Réponds avec `answer count`."
e1.ada.count: "H03, H12 et H15. H09 n'a que le code bleu de la ville. Il faut aussi décider ce qu'on dit aux habitants : réponds à ma question."
e1.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
e1.ada.answer.standard: "Ma question t'attend dans la messagerie."
e1.ada.tell.plate: "Les autocollants partent ce matin, une plaque « on ne paie jamais par QR code » arrive sur chaque horodateur, et le site l'annonce. Les gens qui ont payé sauront à qui s'adresser."
e1.ada.tell.quiet: "Les autocollants partent, mais personne ne sait rien. Ceux qui ont déjà donné leur carte ne feront pas opposition, et ceux qui reviendront n'auront rien appris."
e1.ada.tell.nocode: "Plus aucun QR code, même le bleu : plus rien à recouvrir. C'est plus sûr, et un peu moins pratique pour ceux qui cherchaient l'information."
e1.ada.done: "Trois autocollants, un faux domaine, et la ville sait quoi dire. Débrief."
e1.q.domain: "Quel domaine les faux QR codes ouvrent-ils ? (le nom seul, par exemple exemple.test)"
e1.q.count: "Combien d'horodateurs photographiés portent un faux QR code ? (un nombre)"
e1.q.proof: "Qu'est-ce qui prouve que ce code n'est pas celui de la ville ?"
e1.q.proof.name: "Le nom du site : il ne finit pas par brumevaux.test, le domaine de la ville."
e1.q.proof.lock: "L'adresse ne commence pas par https, donc la page n'a pas de cadenas."
e1.q.proof.lock.why: "Relis l'adresse : elle commence bien par https. Un faux site a son cadenas comme un vrai, le cadenas dit seulement que l'échange est chiffré."
e1.q.proof.colour: "Le code est en couleur avec un logo au milieu, alors que celui de la ville est imprimé en bleu."
e1.q.proof.colour.why: "Les couleurs et le logo se copient. Un code joli ne dit rien de l'endroit où il mène, seule l'adresse le dit."
e1.q.tell: "Que fait la ville pour ses habitants ?"
e1.q.tell.plate: "Retirer les autocollants, poser une plaque « on ne paie jamais par QR code » et l'annoncer sur le site."
e1.q.tell.quiet: "Retirer les autocollants sans rien annoncer, pour ne pas inquiéter les habitants."
e1.q.tell.nocode: "Retirer tous les QR codes, même le bleu de la ville, et l'annoncer sur le site."
e1.hint.read.1: "`qr decode photos/H03.png` lit le code et dit quel site il ouvrirait."
e1.hint.read.2: "`zbarimg photos/H03.png` donne le même texte, au format brut de l'outil."
e1.hint.domain.1: "La ligne « Opens » de `qr decode`. `answer domain brumevaux-stationnement.example`."
e1.hint.proof.1: "Compare la fin de l'adresse avec celle du site de la ville."
e1.hint.count.1: "`zbarimg` accepte plusieurs images à la suite."
e1.hint.count.2: "H03, H12 et H15 ouvrent le faux domaine, H09 la page de la ville : `answer count 3`."
e1.debrief.title: "Un autocollant suffit"
e1.debrief.lesson: "Un QR code n'est qu'une adresse qu'on ne lit pas. Coller le sien sur un horodateur coûte quelques centimes, et le téléphone de la victime ouvre la page sans qu'elle voie où elle va. La défense est simple : lire l'adresse avant d'ouvrir, payer par les moyens officiels, et dire clairement aux habitants comment on paie, et comment on ne paie pas."
e1.debrief.p1: "Le nom du site est le seul vrai test. Le cadenas, les couleurs et le logo se copient."
e1.debrief.p2: "Une ville qui dit « on ne paie jamais par QR code » rend chaque autocollant suspect au premier coup d'œil."
e1.debrief.p3: "Ceux qui ont déjà payé doivent savoir qu'il faut faire opposition sur leur carte : se taire les laisse seuls."
e1.facts.title: "Ce qui s'est vraiment passé"
e1.facts.p1: "En août 2024, au pays de Galles, des faux QR codes ont été collés sur des horodateurs de Llandudno et Colwyn Bay. Ils menaient à une fausse page imitant le service de paiement. La commune a rappelé que l'appli officielle n'utilise aucun QR code."
e1.facts.p2: "En juillet 2025, CBC rapportait des faux codes sur des horodateurs de Montréal et d'Ottawa. En décembre 2025, d'autres sont apparus sur des horodateurs de Raleigh, en Caroline du Nord, et la ville les a retirés."
e1.facts.p3: "Les autorités donnent les mêmes conseils : lire l'adresse avant d'ouvrir, gratter le code pour sentir un autocollant, payer par l'appli officielle, se méfier de l'urgence."
e1.home.p1: "Avant d'ouvrir un QR code, lis l'adresse que ton téléphone affiche : elle doit finir par le domaine de celui qui t'attend."
e1.home.p2: "Un QR code sur un horodateur ou une affiche publique ? Passe le doigt dessus : un autocollant collé par-dessus, on le sent."
e1.home.p3: "Pour payer, passe par l'appli officielle installée depuis le magasin d'applications, ou par la monnaie et la carte."
