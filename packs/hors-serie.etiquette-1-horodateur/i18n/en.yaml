e1.briefing: "Monday morning at Brumevaux town hall. Over the weekend, drivers paid for parking by scanning a QR code on the meter, and got a fine anyway. The municipal police reports are in `signalements.txt`, and this morning the agents photographed the meters concerned, without scanning them."
e1.obj.read: "Read a fake meter QR code without opening it"
e1.obj.domain: "Name the domain of the fake codes"
e1.obj.proof: "Say what proves the code is fake"
e1.obj.count: "Count the meters affected"
e1.obj.tell: "Decide what the town tells its residents"
e1.ada.brief: "Rule number one this week: a QR code is read, not followed. Opening a scammer's address, even to look, tells them the sticker works. We have all we need on this workstation."
e1.ada.g.read: "Start with the reports, `cat signalements.txt`, then read a photo without opening it: `qr decode photos/H03.png`."
e1.ada.g.read.standard: "Read the reports, then the content of one of the meter photos, without ever opening the address."
e1.ada.reports: "Three meters named, and a fourth (H09) where someone only saw an information page. Read the H03 code: `qr decode photos/H03.png`."
e1.ada.reports.standard: "Read the code of one of the meters reported."
e1.ada.read: "That is what the phone would have opened, and nobody opened it. Look closely at the address."
e1.ada.blue: "H09 is the town's small blue code: it leads to the information page of the official website, and it is never used to pay."
e1.ada.g.domain: "Which domain does the fake code open? Answer with `answer domain <domain>`."
e1.ada.g.domain.standard: "Give the domain the fake code opens, with `answer domain`."
e1.ada.domain: "A domain that looks like the town without being the town. Answer my question."
e1.ada.proof: "That is the only test that holds: the site's name. A scammer copies the rest in five minutes."
e1.ada.g.count: "The agents photographed four meters. Read them all at once: `zbarimg photos/H03.png photos/H09.png photos/H12.png photos/H15.png`. How many carry a fake code? Answer with `answer count <number>`."
e1.ada.g.count.standard: "Read the four photos and count the meters with a fake code. Answer with `answer count`."
e1.ada.count: "H03, H12 and H15. H09 only has the town's blue code. We also have to decide what we tell the residents: answer my question."
e1.ada.answer: "Answer my question: click, or use `answer` in the terminal."
e1.ada.answer.standard: "My question is waiting in the messages."
e1.ada.tell.plate: "The stickers come off this morning, a \"we never take payment by QR code\" plate goes on every meter, and the website says so. People who paid will know whom to call."
e1.ada.tell.quiet: "The stickers come off, but nobody knows anything. Those who already gave their card won't block it, and those who come back will have learned nothing."
e1.ada.tell.nocode: "No QR code at all, not even the blue one: nothing left to cover. Safer, and a little less handy for those looking for information."
e1.ada.done: "Three stickers, one fake domain, and the town knows what to say. Debrief."
e1.q.domain: "Which domain do the fake QR codes open? (the name only, for example example.test)"
e1.q.count: "How many of the meters photographed carry a fake QR code? (a number)"
e1.q.proof: "What proves this code is not the town's?"
e1.q.proof.name: "The site's name: it does not end in brumevaux.test, the town's domain."
e1.q.proof.lock: "The address does not start with https, so the page has no padlock."
e1.q.proof.lock.why: "Read the address again: it does start with https. A fake site has its padlock like a real one; the padlock only says the exchange is encrypted."
e1.q.proof.colour: "The code is in colour with a logo in the middle, while the town's own is printed in blue."
e1.q.proof.colour.why: "Colours and logos can be copied. A pretty code says nothing about where it leads; only the address does."
e1.q.tell: "What does the town do for its residents?"
e1.q.tell.plate: "Remove the stickers, put up a \"we never take payment by QR code\" plate and say so on the website."
e1.q.tell.quiet: "Remove the stickers without announcing anything, so as not to worry the residents."
e1.q.tell.nocode: "Remove every QR code, even the town's blue one, and say so on the website."
e1.hint.read.1: "`qr decode photos/H03.png` reads the code and says which site it would open."
e1.hint.read.2: "`zbarimg photos/H03.png` gives the same text, in the tool's raw format."
e1.hint.domain.1: "The \"Opens\" line of `qr decode`. `answer domain brumevaux-stationnement.example`."
e1.hint.proof.1: "Compare the end of the address with the town's website."
e1.hint.count.1: "`zbarimg` takes several images in a row."
e1.hint.count.2: "H03, H12 and H15 open the fake domain, H09 the town's page: `answer count 3`."
e1.debrief.title: "A sticker is enough"
e1.debrief.lesson: "A QR code is just an address you cannot read. Pasting your own on a parking meter costs a few cents, and the victim's phone opens the page without them seeing where it goes. The defence is simple: read the address before opening, pay through the official means, and tell residents clearly how they pay, and how they never pay."
e1.debrief.p1: "The site's name is the only real test. The padlock, the colours and the logo can be copied."
e1.debrief.p2: "A town that says \"we never take payment by QR code\" makes every sticker suspicious at first glance."
e1.debrief.p3: "Those who already paid must know to block their card: keeping quiet leaves them on their own."
e1.facts.title: "What really happened"
e1.facts.p1: "In August 2024 in Wales, fake QR codes were pasted on parking machines in Llandudno and Colwyn Bay. They led to a fake page imitating the payment service. The council reminded drivers that the official app uses no QR code."
e1.facts.p2: "In July 2025, CBC reported fake codes on parking meters in Montreal and Ottawa. In December 2025, others appeared on meters in Raleigh, North Carolina, which the city removed."
e1.facts.p3: "The authorities give the same advice: read the address before opening, scratch the code to feel for a sticker, pay through the official app, be wary of urgency."
e1.home.p1: "Before opening a QR code, read the address your phone shows: it must end with the domain of whoever you expect."
e1.home.p2: "A QR code on a parking meter or a public poster? Run your finger over it: you can feel a sticker pasted on top."
e1.home.p3: "To pay, use the official app installed from the app store, or coins and card."
