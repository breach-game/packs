# Case file 36 "Geai". Inspired by the 2013 theft of payment card data from a retail chain: entry
# with a refrigeration contractor's credentials, a network where the contractor portal could reach
# the tills, automated warnings nobody acted on. Played on the defence side only. The program on
# the tills is never shown or described beyond "a program nobody installed": the player reads
# alerts and flow totals, blocks an address, isolates a server, and rewrites the network's rules.
startTime: "2027-12-14T08:00:00+01:00"
mandate: GC-2027-188
scope:
  domains: ["*.cabas.test"]
  networks: ["10.106.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.106.0.2

config:
  gc.out_blocked: false
  gc.relay_isolated: false

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.106.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -320, z: 40, h: 70 }
    links: [sonde, portail, caisses, relais]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            GC-2027-188.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  - { id: sonde, hostname: sonde.cabas.test, ip: 10.106.0.5, os: Linux, map: { x: -40, z: -140, h: 90 }, services: [{ port: 443, name: https, product: Detection sensor console }] }
  - { id: portail, hostname: prestataires.cabas.test, ip: 10.106.0.20, os: Linux, map: { x: 40, z: 120, h: 100 }, services: [{ port: 443, name: https, product: Contractor portal (invoices and work orders) }] }
  - { id: caisses, hostname: caisses.cabas.test, ip: 10.106.0.80, os: Windows Server 2022, map: { x: 240, z: -60, h: 140 }, services: [{ port: 443, name: https, product: Till management server }] }
  - { id: relais, hostname: relais.cabas.test, ip: 10.106.0.90, os: Windows Server 2022, map: { x: 320, z: 100, h: 100 }, services: [{ port: 445, name: microsoft-ds, product: Internal file server }] }

  - id: outside
    hostname: inconnu.cabas.test
    ip: 10.106.0.200
    kind: unknown
    hidden: true
    os: unknown
    map: { x: -200, z: 220, h: 40 }

dns:
  cabas.test: { A: ["10.106.0.20"] }
  sonde.cabas.test: { A: ["10.106.0.5"] }
  prestataires.cabas.test: { A: ["10.106.0.20"] }
  caisses.cabas.test: { A: ["10.106.0.80"] }
  relais.cabas.test: { A: ["10.106.0.90"] }

noise:
  nmap:
    base: 0
    flags: {}
  dig: 0
  curl: 0
  browse: 0
  ssh: 0

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
