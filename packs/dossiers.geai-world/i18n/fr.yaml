file.readme: "Poste Ligne Rouge. Dossier : Geai. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT GC-2027-188\nClient : Grand Cabas, chaîne de magasins. Périmètre : *.cabas.test, 10.106.0.0/24.\nObjet : la police judiciaire a prévenu Grand Cabas que des cartes volées circulent et qu'elles viennent de ses caisses. Ligne Rouge aide à trouver la fuite, à la couper, puis à comprendre par où l'intrus est entré.\nCadre convenu : défense seulement. Lecture des journaux, mesures validées par la direction et passées par `contain`.\nSigné : le directeur de la sécurité de Grand Cabas."
ada.outOfScope: "Stop. Cette cible est hors du mandat GC-2027-188. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
