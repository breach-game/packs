b1.briefing: "Dimanche 26 décembre, 8 h 40. Des utilisateurs de Garde-Notes signalent une mise à jour 3.10.4 que personne chez Ombrelle n'a publiée. Vendredi soir, le développeur de garde a reçu un mail du « support du magasin », l'a suivi, et a accepté une autorisation. Le mail est dans `boite/`. Le journal de l'API développeur du magasin se lit avec `soc`."
b1.obj.sender: "Lire le mail et dire de quel domaine il vient vraiment"
b1.obj.client: "Trouver dans le journal du magasin l'application qui a publié"
b1.obj.revoke: "Retirer l'autorisation de cette application"
b1.obj.mfa: "Dire pourquoi le second facteur du compte n'a pas suffi"
b1.q.sender: "De quel domaine le mail est-il vraiment parti ?"
b1.q.client: "Quel identifiant d'application (client_id) a envoyé et publié la version 3.10.4 ?"
b1.q.mfa: "Le compte développeur d'Ombrelle a un second facteur. Pourquoi n'a-t-il rien empêché ?"
b1.q.mfa.consent: "Il a autorisé une application, sans donner de mot de passe"
b1.q.mfa.password: "Le mot de passe du développeur a été volé puis réutilisé"
b1.q.mfa.password.why: "Aucune connexion avec un mot de passe dans le journal : tout passe par l'application et son jeton, que le développeur a autorisée lui-même."
b1.q.mfa.insider: "Quelqu'un chez Ombrelle a publié la version en secret"
b1.q.mfa.insider.why: "Les requêtes viennent de 203.0.113.91, avec l'agent de l'application « privacy-policy-ext ». Aucun poste d'Ombrelle."
b1.contain.revoke: "Révoquer l'autorisation de l'application privacy-policy-ext sur le compte développeur"
b1.ada.brief: "Lis les en-têtes du mail : `mailhdr boite/avis-magasin.eml`."
b1.ada.g.sender: "`mailhdr` montre l'expéditeur, le trajet et les domaines qui diffèrent. `answer sender <domaine>`."
b1.ada.g.sender.standard: "Le magasin écrit-il vraiment depuis ce domaine ? `answer sender`."
b1.ada.sender: "notices-extstore.example : SPF et DKIM passent, pour un domaine qui n'est pas le magasin. Mais le lien, lui, mène à la vraie page d'autorisation du magasin."
b1.ada.g.client: "`soc logs store access`, puis `soc search client_id`. `answer client <client_id>`."
b1.ada.g.client.standard: "Qui a envoyé la version 3.10.4 au magasin ? `answer client`."
b1.ada.client: "« privacy-policy-ext », l'application que le développeur a autorisée vendredi. Elle a envoyé et publié la 3.10.4 dans la nuit."
b1.ada.second: "Elle s'attaque maintenant à la deuxième extension d'Ombrelle. Retire l'autorisation."
b1.ada.g.revoke: "`contain revoke privacy-policy-ext`."
b1.ada.g.revoke.standard: "Coupe l'accès de cette application au compte. `contain`."
b1.ada.revoke: "Autorisation révoquée. L'application ne peut plus rien publier. Mais la 3.10.4 est toujours chez les utilisateurs."
b1.ada.g.mfa: "Réponds dans la messagerie ou avec `answer <option>`."
b1.ada.done: "La porte est fermée. Reste à ouvrir la 3.10.4 pour savoir ce qu'elle fait chez quatre cent mille personnes."
b1.hint.sender.1: "La ligne `From:` et le domaine de `Return-Path`."
b1.hint.sender.2: "`answer sender notices-extstore.example`"
b1.hint.client.1: "`client_id=privacy-policy-ext` dans les requêtes PUT et POST."
b1.hint.client.2: "`answer client privacy-policy-ext`"
b1.hint.revoke.1: "`contain revoke privacy-policy-ext`"
b1.hint.mfa.1: "Qu'a donné le développeur : un mot de passe, ou une autorisation ?"
b1.debrief.title: "L'avis du magasin"
b1.debrief.lesson: "Le mail venait d'un faux domaine, mais le lien menait à la vraie page d'autorisation du magasin. Le développeur n'a pas donné son mot de passe : il a autorisé une application nommée comme une formalité à agir pour lui. Le second facteur protège une connexion, pas une autorisation qu'on accorde soi-même."
b1.debrief.p1: "Lire ce qu'une application demande avant d'accepter : « gérer vos extensions », pour une politique de confidentialité, n'a aucun sens."
b1.debrief.p2: "Vérifier un avis du magasin dans la console du magasin, jamais par le lien du mail."
b1.debrief.p3: "Exiger une seconde personne pour publier une version, quand le magasin le permet."
