b1.briefing: "Sunday 26 December, 8:40. Garde-Notes users report a 3.10.4 update that nobody at Ombrelle published. On Friday evening, the on-call developer received an email from \"store support\", followed it, and accepted a permission. The email is in `boite/`. The store's developer API log is read with `soc`."
b1.obj.sender: "Read the email and say which domain it really came from"
b1.obj.client: "Find in the store's log the application that published"
b1.obj.revoke: "Remove this application's permission"
b1.obj.mfa: "Say why the account's second factor was not enough"
b1.q.sender: "From which domain did the email really leave?"
b1.q.client: "Which application id (client_id) uploaded and published version 3.10.4?"
b1.q.mfa: "Ombrelle's developer account has a second factor. Why did it prevent nothing?"
b1.q.mfa.consent: "The developer authorised an app, without giving a password"
b1.q.mfa.password: "The developer's password was stolen on a fake site, then reused"
b1.q.mfa.password.why: "No password sign-in in the log: everything goes through the app and its token, which the developer authorised himself."
b1.q.mfa.insider: "Someone at Ombrelle published the version in secret"
b1.q.mfa.insider.why: "The requests come from 203.0.113.91, with the \"privacy-policy-ext\" app's agent. No Ombrelle workstation."
b1.contain.revoke: "Revoke the permission of the privacy-policy-ext app on the developer account"
b1.ada.brief: "Read the email's headers: `mailhdr boite/avis-magasin.eml`."
b1.ada.g.sender: "`mailhdr` shows the sender, the route and the domains that differ. `answer sender <domain>`."
b1.ada.g.sender.standard: "Does the store really write from this domain? `answer sender`."
b1.ada.sender: "notices-extstore.example: SPF and DKIM pass, for a domain that is not the store. But the link leads to the store's real permission page."
b1.ada.g.client: "`soc logs store access`, then `soc search client_id`. `answer client <client_id>`."
b1.ada.g.client.standard: "Who sent version 3.10.4 to the store? `answer client`."
b1.ada.client: "\"privacy-policy-ext\", the app the developer authorised on Friday. It uploaded and published 3.10.4 overnight."
b1.ada.second: "It is now going after Ombrelle's second extension. Remove the permission."
b1.ada.g.revoke: "`contain revoke privacy-policy-ext`."
b1.ada.g.revoke.standard: "Cut this app's access to the account. `contain`."
b1.ada.revoke: "Permission revoked. The app can publish nothing more. But 3.10.4 is still on users' browsers."
b1.ada.g.mfa: "Answer in the messenger or with `answer <option>`."
b1.ada.done: "The door is shut. Now to open 3.10.4 and see what it does on four hundred thousand browsers."
b1.hint.sender.1: "The `From:` line and the `Return-Path` domain."
b1.hint.sender.2: "`answer sender notices-extstore.example`"
b1.hint.client.1: "`client_id=privacy-policy-ext` in the PUT and POST requests."
b1.hint.client.2: "`answer client privacy-policy-ext`"
b1.hint.revoke.1: "`contain revoke privacy-policy-ext`"
b1.hint.mfa.1: "What did the developer give: a password, or a permission?"
b1.debrief.title: "The store's notice"
b1.debrief.lesson: "The email came from a fake domain, but the link led to the store's real permission page. The developer did not give his password: he authorised an app named like a formality to act on his behalf. A second factor protects a sign-in, not a permission you grant yourself."
b1.debrief.p1: "Read what an app asks for before accepting: \"manage your extensions\", for a privacy policy, makes no sense."
b1.debrief.p2: "Check a store notice in the store's console, never through the email's link."
b1.debrief.p3: "Require a second person to publish a version, when the store allows it."
