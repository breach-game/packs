file.readme: "Poste Ligne Rouge. Dossier : Torcol. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT HU-2027-144\nClient : Hublot, éditeur de logiciels de navigation. Périmètre : *.hublot.test, 10.120.0.0/24.\nObjet : astreinte de réponse à incident. L'agent de sécurité d'un poste neuf vient de lever des alertes. Comprendre, contenir, puis aider Hublot à revoir son processus d'embauche à distance.\nCadre convenu : défense seulement. Accès en lecture seule aux postes (compte ir), mesures validées par la direction et passées par `contain`, dossiers RH partagés par les ressources humaines.\nSigné : le directeur technique de Hublot."
ada.outOfScope: "Stop. Cette cible est hors du mandat HU-2027-144. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
