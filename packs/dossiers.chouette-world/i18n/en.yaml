file.mandate: "MANDATE TA-2027-150\nClient: Argos Shipping, shipping line. Scope: *.argos.test, 10.102.0.0/24.\nPurpose: a destructive program is spreading through Argos's network. Ligne Rouge helps Argos stop it, then rebuild its company directory.\nAgreed set-up: defence only. Reading logs and the directory, measures approved by management and run through `contain`. Read account provided: cn=lecteur-ir,ou=services,dc=argos,dc=test, password Lr-lecture-2027.\nSigned: the operations director of Argos Shipping."
ada.outOfScope: "Stop. This target is outside mandate TA-2027-150. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
