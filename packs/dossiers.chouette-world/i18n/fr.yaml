file.readme: "Poste Ligne Rouge. Dossier : Chouette. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT TA-2027-150\nClient : Transports Argos, transporteur maritime. Périmètre : *.argos.test, 10.102.0.0/24.\nObjet : un programme destructeur se répand dans le réseau d'Argos. Ligne Rouge aide Argos à l'arrêter, puis à reconstruire son annuaire d'entreprise.\nDispositif convenu : défense uniquement. Lecture des journaux et de l'annuaire, mesures validées par la direction et passées par `contain`. Compte de lecture fourni : cn=lecteur-ir,ou=services,dc=argos,dc=test, mot de passe Lr-lecture-2027.\nSigné : la directrice des opérations de Transports Argos."
ada.outOfScope: "Stop. Cette cible est hors du mandat TA-2027-150. Même pour défendre, hors mandat, c'est un délit (article 323-1 du Code pénal)."
