e2.briefing: "Friday 22 October, 10:00. The cameras have been clean since Tuesday. Yesterday, Nuée DNS, a DNS provider, wrote to Lumen: on Saturday night, its servers were drowned in queries, and Lumen's address was in the crowd. The letter and that night's gateway flow log are in `traces/`."
e2.obj.target: "Find the server the cameras drowned"
e2.obj.c2: "Find the address that gave the orders"
e2.obj.control: "Block that address"
e2.obj.future: "Decide the cameras' future"
e2.obj.story: "Put the story in order"
e2.q.target: "To which address did the cameras send their flood of queries?"
e2.q.c2: "Which address did the infected cameras keep in touch with?"
e2.q.future: "What does Lumen do with its six cameras?"
e2.q.future.apart: "Put them on a separate network with no Internet access"
e2.q.future.renew: "Replace them with models without telnet, kept up to date"
e2.q.future.keep: "Keep them as they are, with their new passwords"
e2.contain.control: "Block at the gateway every connection to the cameras' control address"
e2.tl.text: "The story of the wave"
e2.tl.install: "The contractor installs the cameras with their factory passwords and opens their telnet to the Internet"
e2.tl.found: "An infected machine finds cam-n3 and gets in with the factory password"
e2.tl.spread: "cam-n3 and cam-n5 scan the Internet in turn"
e2.tl.order: "The control address sends a longer message than usual"
e2.tl.flood: "The cameras drown Nuée DNS's server in queries"
e2.tl.notice: "The Internet provider sends its abuse notice"
e2.tl.cleanup: "The forwards are closed and the passwords changed"
e2.ada.brief: "Read the letter first: `cat traces/courrier-nuee.txt`. It gives the time: look at what leaves the gateway at that moment."
e2.ada.g.target: "`grep 20:1 traces/flux-samedi.log` shows the flows between 20:10 and 20:19. Look for the big volumes, then `answer target <address>`."
e2.ada.g.target.standard: "Find in Saturday's log the destination receiving huge volumes from the cameras."
e2.ada.target: "192.0.2.53, on port 53: Nuée DNS's server. Nearly 90 MB a minute per camera, when an ordinary DNS query weighs a few hundred bytes. But who told them to start?"
e2.ada.g.c2: "Look at the minute just before the flood. One address comes back every ten minutes, from the two infected cameras only. `grep 198.51.100.66 traces/flux-samedi.log`, then `answer c2 <address>`."
e2.ada.g.c2.standard: "Find the address that only the infected cameras contact at regular intervals."
e2.ada.c2: "198.51.100.66: small messages every ten minutes, then a longer one at 20:11, and the flood starts the next minute. That is the command post."
e2.ada.g.control: "`contain block poste-de-commande`."
e2.ada.g.control.standard: "Cut the route to the command post, in case a camera gets taken again."
e2.ada.control: "Blocked. One real decision is left for management."
e2.ada.g.future: "No answer is wrong: each one costs something else."
e2.ada.future: "Noted. We'll put it in the reply to Nuée DNS. All that is left is telling the story."
e2.ada.g.story: "`timeline vague` shows the events shuffled. Answer with their ids in order: `timeline vague <id> <id> …`."
e2.ada.g.story.standard: "Put the story in order, from installation to clean-up."
e2.ada.done: "Nuée DNS has its answer. Two cameras out of tens of thousands: none would have been enough alone, together they took down hundreds of sites. The next card tells the real case this file is inspired by."
e2.hint.target.1: "The big volumes are on port 53, the DNS port."
e2.hint.target.2: "`answer target 192.0.2.53`"
e2.hint.c2.1: "Look at the 20:11 line, just before the first big volume."
e2.hint.c2.2: "`answer c2 198.51.100.66`"
e2.hint.control.1: "`contain block poste-de-commande`"
e2.hint.story.1: "It all starts at installation, and the clean-up comes last."
e2.hint.story.2: "`timeline vague install found spread order flood notice cleanup`"
e2.debrief.title: "The wave"
e2.debrief.lesson: "Each camera only sent a trickle of queries. Tens of thousands of poorly protected devices, woken by the same order in the same minute, made a wave that drowned a DNS provider, and with it every site that relied on it. Protecting your devices also protects everyone else."
e2.debrief.p1: "Keep connected devices on a separate network that reaches the Internet only for what they need."
e2.debrief.p2: "Alert on abnormal outgoing volume: a camera does not send 90 MB a minute to a DNS server."
e2.debrief.p3: "Answer an abuse notice: it often says what your logs do not show yet."
e2.facts.title: "What really happened: Mirai, 2016"
e2.facts.p1: "Mirai appears in August 2016. It infects cameras, video recorders and home routers by trying a list of about sixty factory logins over telnet, then makes each infected device look for more victims."
e2.facts.p2: "In September 2016, it hits a security journalist's website, then the hosting company OVH, with attacks among the strongest seen at the time."
e2.facts.p3: "On 30 September 2016, its code is published on a forum. Variants multiply."
e2.facts.p4: "On 21 October 2016, waves of queries against Dyn, a DNS provider, make Twitter, Netflix, Reddit and GitHub hard to reach for hours, mostly in the US and Europe."
e2.facts.p5: "In December 2017, its three authors, young Americans, plead guilty before a US federal court."
