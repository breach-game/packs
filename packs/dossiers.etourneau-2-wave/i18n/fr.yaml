e2.briefing: "Vendredi 22 octobre, 10 h. Les caméras sont propres depuis mardi. Hier, Nuée DNS, un fournisseur de DNS, a écrit à Parcs Lumen : samedi soir, ses serveurs ont été noyés sous les requêtes, et l'adresse de Parcs Lumen était dans la foule. La lettre et le journal de flux de la passerelle de ce soir-là sont dans `traces/`."
e2.obj.target: "Trouver le serveur que les caméras ont noyé"
e2.obj.c2: "Trouver l'adresse qui donnait les ordres"
e2.obj.control: "Bloquer cette adresse"
e2.obj.future: "Décider de l'avenir des caméras"
e2.obj.story: "Remettre l'histoire dans l'ordre"
e2.q.target: "Vers quelle adresse les caméras ont-elles envoyé leur déluge de requêtes ?"
e2.q.c2: "Avec quelle adresse les caméras infectées gardaient-elles le contact ?"
e2.q.future: "Que fait Parcs Lumen de ses six caméras ?"
e2.q.future.apart: "Les mettre sur un réseau à part, sans accès à Internet"
e2.q.future.renew: "Les remplacer par des modèles sans telnet, tenus à jour"
e2.q.future.keep: "Les garder telles quelles, avec leurs nouveaux mots de passe"
e2.contain.control: "Bloquer à la passerelle toute connexion vers l'adresse de contrôle des caméras"
e2.tl.text: "L'histoire de la vague"
e2.tl.install: "Le prestataire installe les caméras avec leurs mots de passe d'usine et ouvre leur telnet sur Internet"
e2.tl.found: "Une machine infectée trouve cam-n3 et entre avec le mot de passe d'usine"
e2.tl.spread: "cam-n3 et cam-n5 balaient Internet à leur tour"
e2.tl.order: "L'adresse de contrôle envoie un message plus long que d'habitude"
e2.tl.flood: "Les caméras noient le serveur de Nuée DNS sous les requêtes"
e2.tl.notice: "Le fournisseur d'accès envoie son signalement"
e2.tl.cleanup: "Les redirections sont fermées et les mots de passe changés"
e2.ada.brief: "Lis d'abord la lettre : `cat traces/courrier-nuee.txt`. Elle donne l'heure : regarde ce qui sort de la passerelle à ce moment-là."
e2.ada.g.target: "`grep 20:1 traces/flux-samedi.log` montre les flux entre 20 h 10 et 20 h 19. Cherche les gros volumes, puis `answer target <adresse>`."
e2.ada.g.target.standard: "Trouve dans le journal du samedi la destination qui reçoit des volumes énormes des caméras."
e2.ada.target: "192.0.2.53, sur le port 53 : le serveur de Nuée DNS. Près de 90 Mo par minute et par caméra, alors qu'une requête DNS ordinaire pèse quelques centaines d'octets. Mais qui leur a dit de commencer ?"
e2.ada.g.c2: "Regarde la minute juste avant le déluge. Une adresse revient toutes les dix minutes, depuis les deux caméras infectées seulement. `grep 198.51.100.66 traces/flux-samedi.log`, puis `answer c2 <adresse>`."
e2.ada.g.c2.standard: "Trouve l'adresse que seules les caméras infectées contactent à intervalles réguliers."
e2.ada.c2: "198.51.100.66 : de petits messages toutes les dix minutes, puis un plus long à 20 h 11, et le déluge commence la minute suivante. C'est le poste de commande."
e2.ada.g.control: "`contain block poste-de-commande`."
e2.ada.g.control.standard: "Coupe la route vers le poste de commande, au cas où une caméra serait reprise."
e2.ada.control: "Bloquée. Reste une vraie décision pour la direction."
e2.ada.g.future: "Aucune réponse n'est fausse : chacune coûte autre chose."
e2.ada.future: "Noté. On l'écrit dans la réponse à Nuée DNS. Il reste à raconter l'histoire."
e2.ada.g.story: "`timeline vague` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline vague <id> <id> …`."
e2.ada.g.story.standard: "Remets l'histoire dans l'ordre, de l'installation au nettoyage."
e2.ada.done: "Nuée DNS a sa réponse. Deux caméras sur des dizaines de milliers : aucune n'aurait suffi seule, toutes ensemble ont fait tomber des centaines de sites. La fiche qui suit raconte l'affaire réelle dont ce dossier s'inspire."
e2.hint.target.1: "Les gros volumes sont sur le port 53, celui du DNS."
e2.hint.target.2: "`answer target 192.0.2.53`"
e2.hint.c2.1: "Regarde la ligne de 20:11, juste avant le premier gros volume."
e2.hint.c2.2: "`answer c2 198.51.100.66`"
e2.hint.control.1: "`contain block poste-de-commande`"
e2.hint.story.1: "Tout commence à l'installation, et le nettoyage arrive en dernier."
e2.hint.story.2: "`timeline vague install found spread order flood notice cleanup`"
e2.debrief.title: "La vague"
e2.debrief.lesson: "Chaque caméra n'envoyait qu'un filet de requêtes. Des dizaines de milliers d'objets mal protégés, réveillés par le même ordre à la même minute, ont fait une vague qui a noyé un fournisseur de DNS, et avec lui tous les sites qui comptaient sur lui. Protéger ses objets, c'est aussi protéger les autres."
e2.debrief.p1: "Garder les objets connectés sur un réseau à part, qui n'atteint Internet que pour ce dont ils ont besoin."
e2.debrief.p2: "Alerter sur un volume sortant anormal : une caméra n'envoie pas 90 Mo par minute vers un serveur DNS."
e2.debrief.p3: "Répondre à un signalement d'abus : il dit souvent ce que les journaux ne montrent pas encore."
e2.facts.title: "Ce qui s'est vraiment passé : Mirai, 2016"
e2.facts.p1: "Mirai apparaît en août 2016. Il infecte des caméras, des enregistreurs vidéo et des box en essayant par telnet une liste d'une soixantaine d'identifiants d'usine, puis fait chercher d'autres victimes à chaque objet infecté."
e2.facts.p2: "En septembre 2016, il frappe le site d'un journaliste spécialisé en sécurité, puis l'hébergeur OVH, avec des attaques parmi les plus fortes jamais vues à l'époque."
e2.facts.p3: "Le 30 septembre 2016, son code est publié sur un forum. Les variantes se multiplient."
e2.facts.p4: "Le 21 octobre 2016, des vagues de requêtes contre Dyn, un fournisseur de DNS, rendent Twitter, Netflix, Reddit ou GitHub difficiles à joindre pendant des heures, surtout aux États-Unis et en Europe."
e2.facts.p5: "En décembre 2017, ses trois auteurs, de jeunes Américains, plaident coupable devant la justice fédérale américaine."
