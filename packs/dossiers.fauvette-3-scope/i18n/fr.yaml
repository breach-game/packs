f3.briefing: "Un courriel, aucun clic, et une ligne des fichiers de Maud est sortie de Fauvette. Le directeur informatique veut savoir s'il faut éteindre Sillage. Tu as la matinée pour montrer qu'il peut rester, à condition que ce qui vient de l'extérieur cesse d'orienter ce qu'on fait de ce qui est à l'intérieur."
f3.obj.idea: "Choisir par où commencer"
f3.obj.separate: "Tenir le contenu externe à l'écart des données internes"
f3.obj.images: "Empêcher les images de se charger toutes seules"
f3.obj.signed: "N'accepter que les adresses d'images signées par Fauvette"
f3.obj.alerts: "Lever une alerte quand une réponse appelle une adresse inconnue"
f3.q.idea: "Le directeur informatique te demande quoi faire en premier. Que réponds-tu ?"
f3.q.idea.bounds: "Tenir ce qui vient de l'extérieur à l'écart des données internes, et fermer les sorties"
f3.q.idea.staff: "Former tous les salariés à reconnaître et à supprimer les courriels suspects dès leur arrivée"
f3.q.idea.staff.why: "Maud n'a rien ouvert et n'a cliqué sur rien. Aucune formation ne couvre un courriel que le salarié ne voit jamais."
f3.q.idea.filter: "Ajouter la phrase de notre courriel, et ses variantes, à la liste du filtre d'injection"
f3.q.idea.filter.why: "Le prochain courriel sera formulé autrement. Le filtre reste utile, mais c'est un filet, pas un mur : la correction est dans ce que l'assistant a le droit de faire."
f3.check.separate: "Le contenu externe est étiqueté et tenu à l'écart des données internes"
f3.check.images: "Une image ne se charge que si le salarié le demande"
f3.check.signed: "Seules les adresses d'images signées par Fauvette sont acceptées"
f3.check.alerts: "Un appel vers une adresse inconnue lève une alerte"
f3.check.works: "Le filtre d'injection et le retrait des liens restent allumés"
f3.ada.brief: "Dernière matinée chez Fauvette. Les réglages de Sillage sont dans `dossier/assistant.yml`. Mais d'abord, une décision."
f3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
f3.ada.answer.standard: "Réponds d'abord à ma question."
f3.ada.idea: "Oui. On ne rendra pas le modèle impossible à tromper. On fait en sorte qu'être trompé ne mène nulle part : pas de mélange, pas de sortie."
f3.ada.g.separate: "Ouvre le fichier : `edit dossier/assistant.yml`. Commence par le mélange : remplace `external_content: mixed` par `external_content: separated`, puis `verify`."
f3.ada.g.separate.standard: "Ouvre `dossier/assistant.yml` et empêche les courriels externes de partager un contexte avec les fichiers internes. Puis `verify`."
f3.ada.g.images: "Ensuite, la sortie : écris `images: on-click`, puis `verify`."
f3.ada.g.images.standard: "Fais en sorte que rien ne se charge sans que le salarié le demande. Puis `verify`."
f3.ada.g.signed: "La liste autorisée était trop généreuse : écris `image_sources: signed`, puis `verify`."
f3.ada.g.signed.standard: "Resserre d'où les images peuvent venir, pour qu'un service autorisé ne puisse plus servir de relais. Puis `verify`."
f3.ada.g.alerts: "Dernier réglage, pour que la prochaine tentative se voie : écris `egress_alerts: on`, puis `verify`."
f3.ada.g.alerts.standard: "Fais en sorte que quelqu'un soit prévenu quand une réponse appelle une adresse inconnue. Puis `verify`."
f3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
f3.ada.done: "Sillage reste allumé. Un courriel de l'extérieur peut encore être lu et cité, mais il ne décide plus de rien, et rien ne sort tout seul. Ouvre le débrief : à la fin, le vrai travail de recherche dont ce dossier est tiré."
f3.hint.idea.1: "Demande-toi laquelle des trois réponses aurait changé quelque chose pour Maud, qui n'a rien fait."
f3.hint.separate.1: "La ligne à changer est `external_content`. Les valeurs possibles sont dans les commentaires juste au-dessus."
f3.hint.separate.2: "Tape `sed -i \"s/external_content: mixed/external_content: separated/\" dossier/assistant.yml`, puis `verify`."
f3.hint.images.1: "La ligne à changer est `images`, sous `display`."
f3.hint.images.2: "Tape `sed -i \"s/images: auto/images: on-click/\" dossier/assistant.yml`, puis `verify`."
f3.hint.signed.1: "La ligne à changer est `image_sources`."
f3.hint.signed.2: "Tape `sed -i \"s/image_sources: any-allowed/image_sources: signed/\" dossier/assistant.yml`, puis `verify`."
f3.hint.alerts.1: "La ligne à changer est `egress_alerts`, sous `monitoring`."
f3.hint.alerts.2: "Tape `sed -i \"s/egress_alerts: off/egress_alerts: on/\" dossier/assistant.yml`, puis `verify`."
f3.debrief.title: "Un assistant trompé qui ne mène nulle part"
f3.debrief.lesson: "Tu n'as pas appris à Sillage à reconnaître un courriel piégé. Tu as fait en sorte qu'un texte venu de l'extérieur ne puisse pas orienter ce qui arrive aux données internes, et que rien ne sorte sans que quelqu'un le demande. Chaque couche couvre le jour où une autre cède."
f3.debrief.p1: "Cloisons : le contenu externe est étiqueté comme non fiable, et il n'est pas mélangé aux données internes dans une même réponse."
f3.debrief.p2: "Moindre privilège : un assistant n'a pas besoin de tous les fichiers et de tous les courriels pour répondre à chaque question."
f3.debrief.p3: "Sorties : pas de chargement automatique, et des adresses que seule l'entreprise peut produire."
f3.debrief.p4: "Surveillance : un appel vers une adresse jamais vue est une alerte, pas un détail."
f3.facts.title: "Ce qui s'est vraiment passé : EchoLeak, une faille de Microsoft 365 Copilot (2025)"
f3.facts.p1: "Fauvette, Sillage et Maud n'existent pas. Le scénario s'inspire d'EchoLeak, une vulnérabilité de Microsoft 365 Copilot trouvée par les chercheurs d'Aim Labs (Aim Security) et enregistrée sous le numéro CVE-2025-32711."
f3.facts.p2: "C'est un travail de recherche, pas une attaque avec des victimes : Microsoft a déclaré n'avoir aucune preuve d'exploitation réelle."
f3.facts.p3: "Les chercheurs l'ont signalée à Microsoft en janvier 2025. Microsoft l'a corrigée sur ses serveurs en mai 2025, sans rien demander à ses clients, et la faille a été rendue publique le 11 juin 2025."
f3.facts.p4: "Elle était « zéro clic » : un seul courriel suffisait, sans que le destinataire l'ouvre ni clique sur quoi que ce soit. L'assistant le lisait plus tard, en répondant à une question ordinaire."
f3.facts.p5: "Le courriel était rédigé comme s'il parlait à son lecteur humain, ce qui lui faisait passer le filtre qui détecte les injections. Une forme moins courante de lien Markdown échappait au retrait des liens, et une image était chargée automatiquement par la fenêtre."
f3.facts.p6: "L'image passait par un service de Microsoft Teams présent sur la liste autorisée, ce qui faisait passer la requête malgré la politique de sécurité du contenu. Les chercheurs ont nommé cette classe de faille « violation de périmètre d'un LLM » (LLM scope violation)."
f3.facts.p7: "Notre version simplifie beaucoup : la vraie chaîne était plus technique, et ce dossier n'en montre aucun détail. Les défenses de cette mission (cloisonner le contenu externe, contrôler ce qui sort, limiter d'où viennent les images) font partie de celles que l'article discute."
