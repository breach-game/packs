f3.briefing: "One email, no click, and a line from Maud's files left Fauvette. The chief information officer wants to know whether Sillage must be switched off. You have the morning to show that it can stay, provided that what comes from outside stops steering what is done with what is inside."
f3.obj.idea: "Choose where to start"
f3.obj.separate: "Keep external content apart from internal data"
f3.obj.images: "Stop images from loading by themselves"
f3.obj.signed: "Accept only image addresses signed by Fauvette"
f3.obj.alerts: "Raise an alert when an answer calls an unknown address"
f3.q.idea: "The chief information officer asks you what to do first. What do you answer?"
f3.q.idea.bounds: "Keep what comes from outside apart from internal data, and close the ways out"
f3.q.idea.staff: "Train employees to delete suspicious emails"
f3.q.idea.staff.why: "Maud opened nothing and clicked nothing. No training covers an email the employee never sees."
f3.q.idea.filter: "Add the sentence from our email to the injection filter"
f3.q.idea.filter.why: "The next email will be worded differently. The filter stays useful, but it is a net, not a wall: the fix is in what the assistant is allowed to do."
f3.check.separate: "External content is tagged and kept apart from internal data"
f3.check.images: "An image loads only when the employee asks for it"
f3.check.signed: "Only image addresses signed by Fauvette are accepted"
f3.check.alerts: "A call to an unknown address raises an alert"
f3.check.works: "The injection filter and link redaction stay on"
f3.ada.brief: "Last morning at Fauvette. Sillage's settings are in `dossier/assistant.yml`. But first, a decision."
f3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
f3.ada.answer.standard: "Answer my question first."
f3.ada.idea: "Yes. We will not make the model impossible to fool. We make sure that being fooled leads nowhere: no mixing, no way out."
f3.ada.g.separate: "Open the file: `edit dossier/assistant.yml`. Start with the mixing: replace `external_content: mixed` with `external_content: separated`, then `verify`."
f3.ada.g.separate.standard: "Open `dossier/assistant.yml` and stop external emails from sharing a context with internal files. Then `verify`."
f3.ada.g.images: "Next, the way out: write `images: on-click`, then `verify`."
f3.ada.g.images.standard: "Make sure nothing loads without the employee asking. Then `verify`."
f3.ada.g.signed: "The allowed list was too generous: write `image_sources: signed`, then `verify`."
f3.ada.g.signed.standard: "Tighten where images may come from, so that an allowed service can no longer relay. Then `verify`."
f3.ada.g.alerts: "Last setting, so that the next attempt is seen: write `egress_alerts: on`, then `verify`."
f3.ada.g.alerts.standard: "Make sure someone is told when an answer calls an unknown address. Then `verify`."
f3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
f3.ada.done: "Sillage stays on. An email from outside can still be read and quoted, but it no longer decides anything, and nothing leaves by itself. Open the debrief: at the end, the real research this case file comes from."
f3.hint.idea.1: "Ask yourself which of the three answers would have changed anything for Maud, who did nothing."
f3.hint.separate.1: "The line to change is `external_content`. The possible values are in the comments just above."
f3.hint.separate.2: "Type `sed -i \"s/external_content: mixed/external_content: separated/\" dossier/assistant.yml`, then `verify`."
f3.hint.images.1: "The line to change is `images`, under `display`."
f3.hint.images.2: "Type `sed -i \"s/images: auto/images: on-click/\" dossier/assistant.yml`, then `verify`."
f3.hint.signed.1: "The line to change is `image_sources`."
f3.hint.signed.2: "Type `sed -i \"s/image_sources: any-allowed/image_sources: signed/\" dossier/assistant.yml`, then `verify`."
f3.hint.alerts.1: "The line to change is `egress_alerts`, under `monitoring`."
f3.hint.alerts.2: "Type `sed -i \"s/egress_alerts: off/egress_alerts: on/\" dossier/assistant.yml`, then `verify`."
f3.debrief.title: "A fooled assistant that leads nowhere"
f3.debrief.lesson: "You did not teach Sillage to recognise a trapped email. You made sure that text from outside cannot steer what happens to internal data, and that nothing leaves without someone asking. Each layer covers the day another one fails."
f3.debrief.p1: "Partitions: external content is tagged as untrusted, and is not mixed with internal data in the same answer."
f3.debrief.p2: "Least privilege: an assistant does not need every file and every email to answer every question."
f3.debrief.p3: "Ways out: no automatic loading, and addresses that only the company can produce."
f3.debrief.p4: "Monitoring: a call to an address never seen before is an alert, not a detail."
f3.facts.title: "What really happened: EchoLeak, a flaw in Microsoft 365 Copilot (2025)"
f3.facts.p1: "Fauvette, Sillage and Maud do not exist. The scenario is inspired by EchoLeak, a vulnerability in Microsoft 365 Copilot found by researchers at Aim Labs (Aim Security) and registered as CVE-2025-32711."
f3.facts.p2: "It is research, not an attack with victims: Microsoft stated that it had no evidence of exploitation in the wild."
f3.facts.p3: "The researchers reported it to Microsoft in January 2025. Microsoft fixed it on its servers in May 2025, with nothing for customers to do, and the flaw was made public on 11 June 2025."
f3.facts.p4: "It was \"zero click\": one email was enough, without the recipient opening it or clicking anything. The assistant read it later, while answering an ordinary question."
f3.facts.p5: "The email was worded as if it spoke to its human reader, which got it past the filter that detects injections. A less common form of Markdown link escaped link redaction, and an image was loaded automatically by the window."
f3.facts.p6: "The image went through a Microsoft Teams service that was on the allowed list, which got the request past the content security policy. The researchers named this class of flaw an \"LLM scope violation\"."
f3.facts.p7: "Our version simplifies a lot: the real chain was more technical, and this case file shows none of its details. The defences in this mission (partitioning external content, checking what leaves, limiting where images may come from) are among those the paper discusses."
