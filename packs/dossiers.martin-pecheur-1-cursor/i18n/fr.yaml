m1.briefing: "Vendredi 5 février, 13 h 40. À l'usine de traitement de Brume, un opérateur a vu le curseur bouger seul sur le poste de supervision. Quelqu'un a ouvert l'écran de dosage et a fait passer la consigne de soude de 100 à 11 100 ppm. L'opérateur l'a remise aussitôt : l'eau n'a jamais été touchée. Sa note et la liste des sessions à distance sont dans `traces/`."
m1.obj.source: "Trouver d'où venait la session de 13 h 28"
m1.obj.rule: "Écrire la règle qui voit une consigne changée par l'accès à distance"
m1.obj.remote: "Couper l'accès à distance"
m1.obj.saved: "Dire ce qui a vraiment protégé l'eau"
m1.q.source: "De quelle adresse venait la session de 13 h 28 sur le compte station ?"
m1.q.saved: "Tout à l'heure, qu'est-ce qui a empêché la soude d'arriver dans l'eau ?"
m1.q.saved.watched: "Un opérateur l'a vu et a corrigé aussitôt"
m1.q.saved.firewall: "Le pare-feu de l'usine a bloqué la commande"
m1.q.saved.firewall.why: "La commande est passée : la consigne a bien changé. Le logiciel d'accès à distance traversait le pare-feu comme prévu."
m1.q.saved.antivirus: "L'antivirus du poste a arrêté la session"
m1.q.saved.antivirus.why: "Rien n'a été arrêté : la session a duré trois minutes et demie, avec un compte valide et un logiciel autorisé."
m1.contain.remote: "Désactiver TéléPoste sur le poste de supervision (l'astreinte devra venir sur place)"
m1.ada.brief: "Lis la note de l'opérateur et la liste des sessions : `cat traces/note-operateur.txt`, puis `cat traces/teleposte-sessions.log`. Compare les adresses."
m1.ada.g.source: "L'astreinte se connecte toujours depuis les mêmes adresses. Une ligne n'a pas de note. `answer source <adresse>`."
m1.ada.g.source.standard: "Trouve la session qui ne vient pas d'une adresse connue de l'astreinte."
m1.ada.source: "203.0.113.75 : jamais vue avant. Et elle s'est connectée avec le compte de tout le monde, donc rien ne la distingue d'un collègue. Regarde ce que fait ce compte sur le poste."
m1.ada.again.cut: "Une session ouverte juste avant la coupure a eu le temps de remettre la soude à 11 100 ppm avant de tomber. L'opérateur la ramène à 100. Avec TéléPoste coupé, plus personne ne peut revenir."
m1.ada.again.live: "Ça recommence : le compte station vient de remettre la soude à 11 100 ppm. L'opérateur la ramène à 100. Il faut couper cet accès."
m1.ada.g.rule: "Regarde le journal du poste : `soc logs ihm audit`. Puis `echo \"user: station\" >> regles/consigne-distance.yml`, `echo \"cmd|contains: setpoint\" >> regles/consigne-distance.yml` et `rule test regles/consigne-distance.yml`."
m1.ada.g.rule.standard: "Écris une règle qui voit chaque consigne changée par le compte d'accès à distance, et pas l'astreinte qui regarde les tendances ni l'opérateur au pupitre. Dans la règle, le compte s'appelle `user` et la commande `cmd`."
m1.ada.again: "Ta règle rate un changement de consigne ou alerte sur l'activité ordinaire. L'astreinte utilise aussi le compte station, mais seulement pour regarder."
m1.ada.rule: "Elle voit chaque consigne changée à distance, et laisse tranquilles l'opérateur et l'astreinte qui regarde."
m1.ada.g.remote: "`contain disable teleposte`. L'astreinte devra se déplacer : c'est le prix."
m1.ada.g.remote.standard: "Coupe le logiciel par lequel la session est arrivée."
m1.ada.remote: "TéléPoste est coupé. Plus personne n'entre à distance. Une question avant de clore la journée."
m1.ada.g.saved: "Relis la note de l'opérateur."
m1.ada.done: "Personne ne sait encore si c'était un intrus ou autre chose. Lundi, on pose les garde-fous qui tiennent dans les deux cas."
m1.hint.source.1: "Les adresses de l'astreinte commencent par 198.51.100. L'autre, non."
m1.hint.source.2: "`answer source 203.0.113.75`"
m1.hint.rule.1: "Deux conditions : le compte (`user`) et la commande (`cmd|contains`)."
m1.hint.rule.2: "`echo \"user: station\" >> regles/consigne-distance.yml` puis `echo \"cmd|contains: setpoint\" >> regles/consigne-distance.yml`"
m1.hint.remote.1: "`contain disable teleposte`"
m1.debrief.title: "Le curseur"
m1.debrief.lesson: "Un logiciel d'accès à distance avec un seul compte pour tout le monde, c'est une porte dont la clé est sous le paillasson : quand elle s'ouvre, on ne sait pas qui est entré. Ce jour-là, c'est un opérateur attentif qui a sauvé la situation, pas la technique."
m1.debrief.p1: "Un compte par personne pour tout accès à distance, jamais un compte partagé."
m1.debrief.p2: "Tenir la liste des adresses et des horaires attendus, et alerter sur toute autre session."
m1.debrief.p3: "Alerter sur tout changement de consigne fait à distance, en plus de ceux qui sortent des limites."
