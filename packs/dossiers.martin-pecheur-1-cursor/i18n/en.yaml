m1.briefing: "Friday 5 February, 13:40. At Brume's treatment plant, an operator saw the cursor move on its own on the supervision workstation. Someone opened the dosing screen and raised the sodium hydroxide setpoint from 100 to 11,100 ppm. The operator put it back at once: the water was never affected. Their note and the list of remote sessions are in `traces/`."
m1.obj.source: "Find where the 13:28 session came from"
m1.obj.rule: "Write the rule that sees a setpoint changed through remote access"
m1.obj.remote: "Cut the remote access"
m1.obj.saved: "Say what really protected the water"
m1.q.source: "Which address did the 13:28 session on the station account come from?"
m1.q.saved: "Earlier today, what stopped the sodium hydroxide from reaching the water?"
m1.q.saved.watched: "An operator saw it and fixed it at once"
m1.q.saved.firewall: "The plant's firewall blocked the command"
m1.q.saved.firewall.why: "The command went through: the setpoint did change. The remote access tool crossed the firewall as planned."
m1.q.saved.antivirus: "The workstation's antivirus stopped the session"
m1.q.saved.antivirus.why: "Nothing was stopped: the session lasted three and a half minutes, with a valid account and an approved tool."
m1.contain.remote: "Disable TelePoste on the supervision workstation (the on-call team will have to come on site)"
m1.ada.brief: "Read the operator's note and the session list: `cat traces/note-operateur.txt`, then `cat traces/teleposte-sessions.log`. Compare the addresses."
m1.ada.g.source: "The on-call team always connects from the same addresses. One line has no note. `answer source <address>`."
m1.ada.g.source.standard: "Find the session that does not come from an address the on-call team uses."
m1.ada.source: "203.0.113.75: never seen before. And it signed in with everybody's account, so nothing sets it apart from a colleague. Look at what that account does on the workstation."
m1.ada.again.cut: "A session opened just before the cut had time to set the sodium hydroxide back to 11,100 ppm before it dropped. The operator brings it down to 100. With TelePoste off, nobody can come back."
m1.ada.again.live: "It's happening again: the station account just set the sodium hydroxide back to 11,100 ppm. The operator brings it down to 100. We need to cut this access."
m1.ada.g.rule: "Look at the workstation's log: `soc logs ihm audit`. Then `echo \"user: station\" >> regles/consigne-distance.yml`, `echo \"cmd|contains: setpoint\" >> regles/consigne-distance.yml` and `rule test regles/consigne-distance.yml`. Or by hand, in the editor: `edit regles/consigne-distance.yml`, then Ctrl+S."
m1.ada.g.rule.standard: "Write a rule that sees every setpoint changed by the remote access account, and not the on-call team viewing trends or the operator at the console. In the rule, the account is `user` and the command is `cmd`. To open the file: `edit regles/consigne-distance.yml`."
m1.ada.again: "Your rule misses a setpoint change or fires on ordinary activity. The on-call team uses the station account too, but only to look."
m1.ada.rule: "It sees every setpoint changed remotely, and leaves the operator and the on-call team's viewing alone."
m1.ada.g.remote: "`contain disable teleposte`. The on-call team will have to travel: that is the price."
m1.ada.g.remote.standard: "Cut the tool the session came in through."
m1.ada.remote: "TelePoste is off. Nobody gets in remotely any more. One question before we close the day."
m1.ada.g.saved: "Read the operator's note again."
m1.ada.done: "Nobody knows yet whether it was an intruder or something else. On Monday, we put in the safeguards that hold either way."
m1.hint.source.1: "The on-call team's addresses start with 198.51.100. The other one does not."
m1.hint.source.2: "`answer source 203.0.113.75`"
m1.hint.rule.1: "Two conditions: the account (`user`) and the command (`cmd|contains`)."
m1.hint.rule.2: "`echo \"user: station\" >> regles/consigne-distance.yml` then `echo \"cmd|contains: setpoint\" >> regles/consigne-distance.yml` Or by hand, in the editor: `edit regles/consigne-distance.yml`, then Ctrl+S."
m1.hint.remote.1: "`contain disable teleposte`"
m1.debrief.title: "The cursor"
m1.debrief.lesson: "A remote access tool with one account for everybody is a door with the key under the mat: when it opens, nobody knows who came in. That day, an attentive operator saved the situation, not the technology."
m1.debrief.p1: "One account per person for any remote access, never a shared account."
m1.debrief.p2: "Keep the list of expected addresses and hours, and alert on any other session."
m1.debrief.p3: "Alert on any setpoint changed remotely, on top of those that go out of limits."
