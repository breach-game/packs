w3.briefing: "Tuesday, 9:30 am. The manager asks a simple question: on our Wi-Fi, can a customer reach another customer's computer? IT put the café's test laptop on the guest network, set up like a traveller's (`note-it.txt`). Three real travellers are connected too."
w3.obj.scan: "List the devices on the guest network"
w3.obj.guests: "Count the travellers' devices"
w3.obj.proof: "Prove the risk on the test laptop only"
w3.obj.fix: "Fix the controller's settings"
w3.obj.enough: "Say whether isolation is enough"
w3.ada.brief: "One rule this morning: the travellers' devices are seen, never touched. We prove on ours."
w3.ada.g.scan: "Read IT's note, `cat note-it.txt`, then list what answers on the guest network, without looking at any port: `nmap -sn 10.115.0.0/24`."
w3.ada.g.scan.standard: "Read IT's note, then list the devices on the guest network with a ping scan."
w3.ada.scan: "That is what any guest sees from a table: the café's equipment, its test laptop, and the others. Names, addresses, nothing more, and we stop there for them."
w3.ada.g.guests: "In the list, how many devices are neither the café's nor yours? Answer with `answer guests <number>`."
w3.ada.g.guests.standard: "Count the travellers' devices in the scan. Answer with `answer guests`."
w3.ada.guests: "Three people who came for a coffee. Now the proof, on pc-test and nowhere else."
w3.ada.g.proof: "Look at the file sharing ports of the test laptop only: `nmap -p 139,445 pc-test.gare-sud.escale.test`."
w3.ada.g.proof.standard: "Show, on the test laptop only, that its file sharing answers on the guest network."
w3.ada.proof: "445 open: from any table, anyone can knock on the shared folder of a laptop set up like a traveller's. The controller lets guests talk to each other. Let's close that: `borne/reglages.conf`."
w3.ada.guest: "Stop. That is a traveller's device: it is not ours and not in what we agreed. Aiming at it is already knocking on someone's door."
w3.noise.guest: "Port scan of a traveller's device"
w3.ada.g.fix: "Open `borne/reglages.conf` (`edit` or `sed -i`): guests must not reach each other, nor the staff network. Then `verify`."
w3.ada.g.fix.standard: "Fix the two lines of `borne/reglages.conf`, then `verify`."
w3.ada.fix: "Settings ready. The controller loads them when it restarts tonight: from tomorrow morning it will refuse traffic between guests, and between guests and the staff. Will that be enough? Answer my question."
w3.ada.rescan: "If the laptop still answers, that is expected: the controller only loads its new settings when it restarts tonight. Good reflex to check again: IT will run this scan once more tomorrow morning."
w3.ada.answer: "Answer my question: click, or use `answer` in the terminal."
w3.ada.answer.standard: "My question is waiting in the messages."
w3.ada.done: "The café closes the path between guests from tonight. The traveller still has to close their own door. Debrief."
w3.q.guests: "How many devices on the guest network belong to travellers? (a number)"
w3.q.enough: "Client isolation is on. Is a traveller's laptop with sharing left on now safe?"
w3.q.enough.device: "No: isolation can be bypassed, the laptop must protect itself too (public profile, no sharing, updates)."
w3.q.enough.done: "Yes: with isolation turned on in the controller, guests can no longer reach each other at all."
w3.q.enough.done.why: "Researchers showed in 2026 that client isolation could be bypassed on every router they tested. It is a good layer, not a wall."
w3.q.enough.owe: "Only if the network also switches to encrypted Wi-Fi, which blocks traffic between clients."
w3.q.enough.owe.why: "Encrypting the air protects each client from listening, not from being reached by another client of the same network."
w3.check.isolation: "Guests cannot reach each other"
w3.check.staff: "Guests cannot reach the staff network"
w3.hint.scan.1: "`nmap -sn 10.115.0.0/24`: -sn lists the devices without looking at their ports."
w3.hint.guests.1: "invite-101, invite-102 and invite-103 are the travellers. gw, wlc, portail and pc-test are the café's."
w3.hint.guests.2: "`answer guests 3`"
w3.hint.proof.1: "`nmap -p 139,445 pc-test.gare-sud.escale.test`"
w3.hint.fix.1: "`sed -i 's/client_isolation: off/client_isolation: on/' borne/reglages.conf`"
w3.hint.fix.2: "`sed -i 's/guest_to_staff: allow/guest_to_staff: deny/' borne/reglages.conf`, then `verify`."
w3.hint.enough.1: "What did the 2026 research on client isolation show?"
w3.debrief.title: "The table next door"
w3.debrief.lesson: "On a shared Wi-Fi, the threat today is less someone listening than someone reaching your device: a shared folder, a forgotten service, a system not updated. A good café turns on client isolation. But in 2026, researchers (AirSnitch, NDSS 2026) bypassed it on every router they tested: the device must defend itself too."
w3.debrief.p1: "A ping scan shows what any guest sees. Looking further at someone else's device is no longer looking: it is knocking."
w3.debrief.p2: "Client isolation and a separate staff network are the café's part of the job."
w3.debrief.p3: "The traveller's part: the network marked \"public\", sharing off, the firewall on, updates done."
w3.home.p1: "When your computer asks whether a network is public or private, in a café answer public: sharing and discovery turn off."
w3.home.p2: "Turn off file and printer sharing before you travel, and only turn it back on at home."
w3.home.p3: "Keep your computer up to date: on a shared network, an old flaw is within everyone's reach."
