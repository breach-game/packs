w3.briefing: "Mardi, 9 h 30. La directrice pose une question simple : sur notre Wi-Fi, un client peut-il atteindre l'ordinateur d'un autre client ? L'informatique a mis le portable de test du café sur le réseau invités, réglé comme celui d'un voyageur (`note-it.txt`). Trois vrais voyageurs sont connectés aussi."
w3.obj.scan: "Lister les appareils du réseau invités"
w3.obj.guests: "Compter les appareils des voyageurs"
w3.obj.proof: "Prouver le risque sur le portable de test seulement"
w3.obj.fix: "Corriger les réglages de la borne"
w3.obj.enough: "Dire si l'isolation suffit"
w3.ada.brief: "Une règle ce matin : les appareils des voyageurs se voient, ne se touchent jamais. On prouve sur le nôtre."
w3.ada.g.scan: "Lis la note de l'informatique, `cat note-it.txt`, puis liste ce qui répond sur le réseau invités, sans regarder aucun port : `nmap -sn 10.115.0.0/24`."
w3.ada.g.scan.standard: "Lis la note de l'informatique, puis liste les appareils du réseau invités par un balayage ping."
w3.ada.scan: "Voilà ce que voit n'importe quel invité depuis une table : l'équipement du café, son portable de test, et les autres. Des noms, des adresses, rien de plus, et pour eux on s'arrête là."
w3.ada.g.guests: "Dans la liste, combien d'appareils ne sont ni au café ni à toi ? Réponds avec `answer guests <nombre>`."
w3.ada.g.guests.standard: "Compte les appareils des voyageurs dans le balayage. Réponds avec `answer guests`."
w3.ada.guests: "Trois personnes venues prendre un café. Maintenant la preuve, sur pc-test et nulle part ailleurs."
w3.ada.g.proof: "Regarde les ports de partage de fichiers du portable de test seulement : `nmap -p 139,445 pc-test.gare-sud.escale.test`."
w3.ada.g.proof.standard: "Montre, sur le portable de test seulement, que son partage de fichiers répond sur le réseau invités."
w3.ada.proof: "445 ouvert : depuis n'importe quelle table, on peut frapper au dossier partagé d'un portable réglé comme celui d'un voyageur. La borne laisse les invités se parler. Fermons ça : `borne/reglages.conf`."
w3.ada.guest: "Stop. C'est l'appareil d'un voyageur : il n'est pas à nous et pas dans ce qu'on a convenu. Le viser, c'est déjà frapper à la porte de quelqu'un."
w3.noise.guest: "Balayage des ports d'un appareil de voyageur"
w3.ada.g.fix: "Ouvre `borne/reglages.conf` (`edit` ou `sed -i`) : les invités ne doivent pas s'atteindre entre eux, ni atteindre le réseau de l'équipe. Puis `verify`."
w3.ada.g.fix.standard: "Corrige les deux lignes de `borne/reglages.conf`, puis `verify`. Pour ouvrir le fichier : `edit borne/reglages.conf`."
w3.ada.fix: "Réglages prêts. La borne les charge à sa relance de cette nuit : dès demain matin, elle refusera le trafic entre invités, et entre invités et équipe. Est-ce que ça suffira ? Réponds à ma question."
w3.ada.rescan: "Si le portable répond encore, c'est normal : la borne ne charge ses nouveaux réglages qu'à sa relance de cette nuit. Bon réflexe de revérifier : l'informatique refera ce scan demain matin."
w3.ada.answer: "Réponds à ma question : clique, ou utilise `answer` dans le terminal."
w3.ada.answer.standard: "Ma question t'attend dans la messagerie."
w3.ada.done: "Le café ferme le passage entre invités dès cette nuit. Le voyageur doit encore fermer sa propre porte. Débrief."
w3.q.guests: "Combien d'appareils du réseau invités appartiennent à des voyageurs ? (un nombre)"
w3.q.enough: "L'isolation des clients est activée. Le portable d'un voyageur qui a laissé le partage est-il protégé ?"
w3.q.enough.device: "Non : l'isolation se contourne, le portable doit aussi se protéger (profil public, partage coupé, mises à jour)."
w3.q.enough.done: "Oui : avec l'isolation activée sur la borne, les invités ne peuvent plus du tout s'atteindre entre eux."
w3.q.enough.done.why: "Des chercheurs ont montré en 2026 que l'isolation des clients se contournait sur tous les routeurs testés. C'est une bonne couche, pas un mur."
w3.q.enough.owe: "Seulement si le réseau passe aussi au Wi-Fi chiffré, qui bloque le trafic entre clients."
w3.q.enough.owe.why: "Chiffrer les ondes protège chaque client de l'écoute, pas d'être atteint par un autre client du même réseau."
w3.check.isolation: "Les invités ne peuvent pas s'atteindre entre eux"
w3.check.staff: "Les invités ne peuvent pas atteindre le réseau de l'équipe"
w3.hint.scan.1: "`nmap -sn 10.115.0.0/24` : -sn liste les appareils sans regarder leurs ports."
w3.hint.guests.1: "invite-101, invite-102 et invite-103 sont les voyageurs. gw, wlc, portail et pc-test sont au café."
w3.hint.guests.2: "`answer guests 3`"
w3.hint.proof.1: "`nmap -p 139,445 pc-test.gare-sud.escale.test`"
w3.hint.fix.1: "Avec l'éditeur : `edit borne/reglages.conf`, puis Ctrl+S. Avec une commande : `sed -i 's/client_isolation: off/client_isolation: on/' borne/reglages.conf`"
w3.hint.fix.2: "Avec l'éditeur : `edit borne/reglages.conf`, puis Ctrl+S. Avec une commande : `sed -i 's/guest_to_staff: allow/guest_to_staff: deny/' borne/reglages.conf`, puis `verify`."
w3.hint.enough.1: "Qu'a montré la recherche de 2026 sur l'isolation des clients ?"
w3.debrief.title: "La table d'à côté"
w3.debrief.lesson: "Sur un Wi-Fi partagé, la menace aujourd'hui, c'est moins quelqu'un qui écoute que quelqu'un qui atteint ton appareil : un dossier partagé, un service oublié, un système pas à jour. Un bon café active l'isolation des clients. Mais en 2026, des chercheurs (AirSnitch, NDSS 2026) l'ont contournée sur tous les routeurs testés : l'appareil doit aussi se défendre seul."
w3.debrief.p1: "Un balayage ping montre ce que voit n'importe quel invité. Regarder plus loin l'appareil d'un autre, ce n'est plus regarder : c'est frapper."
w3.debrief.p2: "L'isolation des clients et un réseau séparé pour l'équipe, c'est la part du café."
w3.debrief.p3: "La part du voyageur : le réseau marqué « public », le partage coupé, le pare-feu actif, les mises à jour faites."
w3.home.p1: "Quand ton ordinateur demande si un réseau est public ou privé, au café réponds public : le partage et la découverte se coupent."
w3.home.p2: "Coupe le partage de fichiers et d'imprimante avant de voyager, et ne le rallume qu'à la maison."
w3.home.p3: "Garde ton ordinateur à jour : sur un réseau partagé, une vieille faille est à portée de tout le monde."
