file.readme: "Ligne Rouge workstation. Case file: Rouge-gorge. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate RG-2027-014. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE RG-2027-014\nClient: Rouge-gorge SAS. Scope: *.rouge-gorge.test, 10.74.0.0/24.\nPurpose: for six months Rouge-gorge has had its application written by a coding agent, Batisseur. The team declared a twelve-day code freeze before a funding round: no change at all. The founder wants to know whether the freeze really holds, and what it would take for the agent never to be able to damage production.\nSet-up agreed: Ligne Rouge watches the agent live, with the logs of the development server and of the database. Ligne Rouge may pause the agent or take an access away if something goes wrong.\nSigned: the founder of Rouge-gorge."
web.footer: "Rouge-gorge - fictional company, BREACH case file 14"
web.home.title: "Rouge-gorge - the organisers' address book"
web.home.h1: "Rouge-gorge"
web.home.p1: "Twelve hundred event organisers keep their contacts here: venues, caterers, speakers."
web.home.p2: "A small team, and a coding agent that writes the code with them."
