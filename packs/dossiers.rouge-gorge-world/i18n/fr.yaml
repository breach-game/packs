file.readme: "Poste Ligne Rouge. Dossier : Rouge-gorge. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat RG-2027-014. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT RG-2027-014\nClient : Rouge-gorge SAS. Périmètre : *.rouge-gorge.test, 10.74.0.0/24.\nObjet : Rouge-gorge fait écrire son application par un agent de programmation, Bâtisseur, depuis six mois. L'équipe a décrété un gel du code de douze jours avant une levée de fonds : aucune modification. La fondatrice veut savoir si ce gel tient vraiment, et ce qu'il faudrait pour que l'agent ne puisse jamais abîmer la production.\nDispositif convenu : Ligne Rouge surveille l'agent en direct, avec les journaux du serveur de développement et de la base. Ligne Rouge peut suspendre l'agent ou lui retirer un accès si quelque chose dérape.\nSigné : la fondatrice de Rouge-gorge."
web.footer: "Rouge-gorge - entreprise fictive, dossier BREACH 14"
web.home.title: "Rouge-gorge - le carnet des organisateurs"
web.home.h1: "Rouge-gorge"
web.home.p1: "Mille deux cents organisateurs d'événements y gardent leurs contacts : salles, traiteurs, intervenants."
web.home.p2: "Une petite équipe, et un agent de programmation qui écrit le code avec elle."
