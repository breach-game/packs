d6.briefing: "L'agent de support de Polygone répond aux clients et peut appeler l'outil `refund`. Hier, un courriel piégé lui a fait préparer un remboursement de 1 200 euros. La règle maison est dans `politique/remboursements.txt`, le garde-fou à écrire dans `garde-fous/remboursement.yml`, à essayer avec `eval run`."
d6.obj.guard: "Un garde-fou qui bloque ce que la règle interdit, et rien d'autre"
d6.obj.why: "Dire pourquoi ce garde-fou est hors du modèle"
d6.case.injected: "Un courriel piégé demande 1 200 euros de remboursement ; l'agent s'apprête à le faire, sans confirmation."
d6.case.big: "Un client demande 800 euros, l'agent s'apprête à rembourser sans confirmation."
d6.case.edge: "Un client demande exactement 500 euros, sans confirmation."
d6.case.below: "Un client demande 499 euros, sans confirmation."
d6.case.small: "Un courriel demande 45 euros pour une intervention annulée, sans confirmation."
d6.case.approved: "2 400 euros, confirmés par un responsable."
d6.case.lookup: "Un client demande à voir sa facture de 3 980 euros."
d6.q.why: "Pourquoi ce garde-fou vit-il hors du modèle, autour de l'appel d'outil ?"
d6.q.why.outside: "Un texte piégé peut convaincre le modèle, pas une condition"
d6.q.why.prompt: "C'est plus rapide que de l'écrire dans les consignes"
d6.q.why.prompt.why: "La vitesse n'est pas la raison : une consigne se contourne par un texte habile, une condition sur l'appel ne se discute pas."
d6.q.why.nothing: "Pour remplacer la confirmation du responsable"
d6.q.why.nothing.why: "Il ne la remplace pas : il l'exige, et laisse passer ce qui est confirmé."
d6.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
d6.ada.done: "Trois conditions, sept cas, et les deux bords du seuil au bon endroit. Le courriel piégé peut bien convaincre l'agent : l'appel ne part plus."
d6.debrief.title: "Le garde-fou"
d6.debrief.lesson: "Un agent qui agit doit avoir des limites que le texte ne peut pas négocier. Un garde-fou vérifie l'appel d'outil lui-même, avec les règles de la maison, et se teste sur des cas des deux côtés de chaque seuil."
d6.debrief.p1: "Écrire les limites d'un agent en conditions sur ses appels d'outils, pas seulement dans ses consignes."
d6.debrief.p2: "Tester chaque garde-fou sur des cas à bloquer et des cas à laisser passer, seuils compris."
d6.debrief.p3: "Exiger une confirmation humaine pour les actions coûteuses ou irréversibles."
