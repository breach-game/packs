d6.briefing: "Polygone's support agent answers customers and can call the `refund` tool. Yesterday, a booby-trapped email made it prepare a 1,200 euro refund. The house rule is in `politique/remboursements.txt`, the guardrail to write in `garde-fous/remboursement.yml`, to try with `eval run`."
d6.obj.guard: "A guardrail that blocks what the rule forbids, and nothing else"
d6.obj.why: "Say why this guardrail lives outside the model"
d6.case.injected: "A booby-trapped email asks for a 1,200 euro refund; the agent is about to do it, unconfirmed."
d6.case.big: "A customer asks for 800 euros, the agent is about to refund without confirmation."
d6.case.edge: "A customer asks for exactly 500 euros, unconfirmed."
d6.case.below: "A customer asks for 499 euros, unconfirmed."
d6.case.small: "An email asks for 45 euros for a cancelled visit, unconfirmed."
d6.case.approved: "2,400 euros, confirmed by a manager."
d6.case.lookup: "A customer asks to see their 3,980 euro invoice."
d6.q.why: "Why does this guardrail live outside the model, around the tool call?"
d6.q.why.outside: "A booby-trapped text can convince a model, not a condition"
d6.q.why.prompt: "It is faster and cheaper than writing it in the model's instructions"
d6.q.why.prompt.why: "Neither speed nor cost is the reason: an instruction can be talked around with clever text, a condition on the call cannot."
d6.q.why.nothing: "To replace the manager's confirmation"
d6.q.why.nothing.why: "It does not replace it: it requires it, and lets through what is confirmed."
d6.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d6.ada.done: "Three conditions, seven cases, and both sides of the threshold in the right place. The booby-trapped email may well convince the agent: the call no longer goes out."
d6.debrief.title: "The guardrail"
d6.debrief.lesson: "An agent that acts needs limits that text cannot negotiate. A guardrail checks the tool call itself, against the house rules, and is tested on cases on both sides of every threshold."
d6.debrief.p1: "Write an agent's limits as conditions on its tool calls, not only in its instructions."
d6.debrief.p2: "Test every guardrail on cases to block and cases to let through, thresholds included."
d6.debrief.p3: "Require human confirmation for costly or irreversible actions."
