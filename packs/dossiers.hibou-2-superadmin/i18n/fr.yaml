c2.briefing: "Lundi 13 mars, 10 h. Vigie a tenu parole : ses clients peuvent relire la configuration de son accès de support, telle qu'elle était le jour de l'intrusion. Elle est dans `support/`, avec le brouillon du nouvel accès. On ne sait pas comment l'intrus a obtenu le compte, et ce n'est pas ce qu'on cherche : on cherche pourquoi ce compte suffisait."
c2.obj.review: "Désigner les lignes fautives de l'accès de support"
c2.obj.why: "Dire pourquoi un seul compte comptait autant"
c2.obj.design: "Écrire l'accès de support tel qu'il aurait dû être"
c2.q.why: "Un seul compte a été pris. Pourquoi cela touchait-il tous les clients ?"
c2.q.why.all: "Il ouvrait tous les clients à la fois, sans leur accord"
c2.q.why.boss: "C'était le compte personnel du patron de Vigie"
c2.q.why.boss.why: "La ligne 4 dit l'inverse : un compte commun à toute l'équipe de support, sans personne derrière en particulier."
c2.q.why.only: "C'était le seul compte protégé par un mot de passe"
c2.q.why.only.why: "Un mot de passe ne rend pas un compte dangereux. Relis la ligne `scope` : c'est ce que le compte ouvre qui compte."
c2.check.person: "Un compte de support par personne"
c2.check.factor: "Le second facteur est obligatoire"
c2.check.approve: "Le client approuve chaque session sur ses images"
c2.check.keys: "Les clés Wi-Fi des clients sont chiffrées"
c2.check.log: "Le client voit le journal des sessions de support"
c2.check.works: "Le support peut toujours aider les clients"
c2.ada.brief: "Affiche le fichier numéroté : `review support/acces-support.yml`. Puis désigne chaque ligne fautive : `review support/acces-support.yml <ligne>`. Il y en a quatre. Une erreur coûte des points."
c2.ada.g.review: "`review support/acces-support.yml` affiche les lignes. Cherche : un compte partagé, un mot de passe mal rangé, une portée sans limite, une clé lisible. `review support/acces-support.yml <ligne>` pour chacune."
c2.ada.g.review.standard: "Relis `support/acces-support.yml` avec `review` et désigne les quatre lignes qui ont rendu l'intrusion si grave."
c2.ada.review: "Quatre lignes. Un compte que toute l'équipe partage : impossible de dire qui a fait quoi. Un mot de passe écrit dans un script et repris d'un serveur de test. Une portée qui couvre tous les clients, en direct, sans accord. Et les clés Wi-Fi des clients rangées en clair. Une question."
c2.ada.g.why: "Réponds à ma question. Relis la ligne `scope`."
c2.ada.why: "Oui. Peu importe comment le mot de passe est sorti : un compte qui ouvre cent cinquante mille caméras d'un coup est une catastrophe qui attend son jour. Maintenant, écris l'accès tel qu'il aurait dû être : `support/nouveau.yml`."
c2.ada.g.design: "`cat support/nouveau.yml` : chaque ligne donne ses valeurs possibles après le `#`. Choisis la plus stricte avec `sed -i` ou `edit`, puis `verify`."
c2.ada.g.design.standard: "Corrige `support/nouveau.yml`, puis lance `verify`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.done: "Un compte par personne, un second facteur, l'accord du client pour chaque session, des clés chiffrées, et un journal que le client peut lire lui-même. Le support aide toujours, mais il ne peut plus regarder partout sans que personne ne le sache. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
c2.hint.review.1: "Les lignes 4 (compte partagé) et 6 (mot de passe dans un script) pour commencer."
c2.hint.review.2: "`review support/acces-support.yml 4`, puis `6`, `8` et `11`."
c2.hint.why.1: "`scope: every customer, live video and audio, no approval needed`. `answer all`"
c2.hint.design.1: "Les valeurs attendues : `one-per-person`, `required`, `customer-approves-each-session`, `encrypted`, `visible-to-customer`."
c2.hint.design.2: "Par exemple `sed -i \"s/second_factor: optional/second_factor: required/\" support/nouveau.yml`."
c2.debrief.title: "Le compte qui voyait tout"
c2.debrief.lesson: "Le support d'un service a besoin d'aider ses clients. Il n'a pas besoin de voir chez tous, tout le temps, avec un seul compte partagé. Quand un accès peut tout, il suffit qu'il tombe une fois."
c2.debrief.p1: "Un compte par personne, avec un second facteur : on sait qui a fait quoi, et un mot de passe seul ne suffit pas."
c2.debrief.p2: "L'accès aux données d'un client se demande au client, session par session, et se journalise."
c2.debrief.p3: "Ce qu'on garde pour ses clients (clés, adresses) se chiffre : ce qui est lisible par le support l'est par celui qui prend sa place."
c2.facts.title: "Ce qui s'est vraiment passé : Verkada, 2021"
c2.facts.p1: "En mars 2021, un intrus accède aux images de plus de 150 000 caméras de Verkada, fabricant américain de caméras de sécurité connectées au cloud, en direct."
c2.facts.p2: "Selon l'autorité américaine de protection des consommateurs (FTC), il pouvait regarder des lieux sensibles, dont des hôpitaux psychiatriques et des cliniques de santé des femmes, et il a eu accès à d'autres données de clients : adresses, enregistrements sonores, identifiants de réseaux Wi-Fi."
c2.facts.p3: "La FTC reproche à Verkada de ne pas avoir exigé des mots de passe uniques et complexes, de ne pas avoir chiffré correctement les données de ses clients, et de ne pas avoir sécurisé son réseau. Elle relève au moins deux intrusions entre décembre 2020 et mars 2021."
c2.facts.p4: "L'accord d'août 2024 impose à Verkada un programme complet de sécurité de l'information, contrôlé par des audits indépendants. L'amende de 2,95 millions de dollars qui l'accompagne sanctionne autre chose : des courriels commerciaux envoyés en violation de la loi."
