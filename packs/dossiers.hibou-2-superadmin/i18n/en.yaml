c2.briefing: "Monday 13 March, 10 am. Vigie kept its word: its customers can review the configuration of its support access, as it was on the day of the intrusion. It is in `support/`, with the draft of the new access. We do not know how the intruder obtained the account, and that is not what we are looking for: we are looking for why that account was enough."
c2.obj.review: "Point at the faulty lines of the support access"
c2.obj.why: "Say why a single account mattered so much"
c2.obj.design: "Write the support access as it should have been"
c2.q.why: "A single account was taken. Why did that affect every customer?"
c2.q.why.all: "It opened every customer at once, without their consent"
c2.q.why.boss: "It was the personal account of Vigie's boss"
c2.q.why.boss.why: "Line 4 says the opposite: one account shared by the whole support team, with nobody in particular behind it."
c2.q.why.only: "It was the only account protected by a password"
c2.q.why.only.why: "A password does not make an account dangerous. Read the `scope` line again: what the account opens is what matters."
c2.check.person: "One support account per person"
c2.check.factor: "The second factor is required"
c2.check.approve: "The customer approves each session on their pictures"
c2.check.keys: "Customers' Wi-Fi keys are encrypted"
c2.check.log: "The customer sees the log of support sessions"
c2.check.works: "Support can still help customers"
c2.ada.brief: "Show the numbered file: `review support/acces-support.yml`. Then point at each faulty line: `review support/acces-support.yml <line>`. There are four. A mistake costs points."
c2.ada.g.review: "`review support/acces-support.yml` shows the lines. Look for: a shared account, a badly kept password, a scope with no limit, a readable key. `review support/acces-support.yml <line>` for each."
c2.ada.g.review.standard: "Review `support/acces-support.yml` with `review` and point at the four lines that made the intrusion so serious."
c2.ada.review: "Four lines. An account the whole team shares: impossible to say who did what. A password written in a script and reused from a test server. A scope covering every customer, live, with no consent. And customers' Wi-Fi keys stored in clear. One question."
c2.ada.g.why: "Answer my question. Read the `scope` line again."
c2.ada.why: "Yes. However the password got out, an account that opens a hundred and fifty thousand cameras at once is a disaster waiting for its day. Now write the access as it should have been: `support/nouveau.yml`."
c2.ada.g.design: "`cat support/nouveau.yml`: each line gives its possible values after the `#`. Pick the strictest with `sed -i` or `edit`, then `verify`."
c2.ada.g.design.standard: "Fix `support/nouveau.yml`, then run `verify`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.done: "One account per person, a second factor, the customer's consent for each session, encrypted keys, and a log the customer can read for themselves. Support still helps, but it can no longer look everywhere without anyone knowing. The next card tells the real case this file is inspired by."
c2.hint.review.1: "Lines 4 (shared account) and 6 (password in a script) to begin with."
c2.hint.review.2: "`review support/acces-support.yml 4`, then `6`, `8` and `11`."
c2.hint.why.1: "`scope: every customer, live video and audio, no approval needed`. `answer all`"
c2.hint.design.1: "The expected values: `one-per-person`, `required`, `customer-approves-each-session`, `encrypted`, `visible-to-customer`."
c2.hint.design.2: "For example `sed -i \"s/second_factor: optional/second_factor: required/\" support/nouveau.yml`."
c2.debrief.title: "The account that saw everything"
c2.debrief.lesson: "A service's support team needs to help its customers. It does not need to see into all of them, all the time, with one shared account. When one access can do everything, it only has to fall once."
c2.debrief.p1: "One account per person, with a second factor: you know who did what, and a password alone is not enough."
c2.debrief.p2: "Access to a customer's data is asked of the customer, session by session, and logged."
c2.debrief.p3: "What you keep for your customers (keys, addresses) is encrypted: what support can read, whoever takes its place can read."
c2.facts.title: "What really happened: Verkada, 2021"
c2.facts.p1: "In March 2021, an intruder gains access to the live pictures of more than 150,000 cameras of Verkada, a US maker of cloud-connected security cameras."
c2.facts.p2: "According to the US consumer protection agency (FTC), they could view sensitive places, including psychiatric hospitals and women's health clinics, and had access to other customer data: addresses, audio recordings, Wi-Fi network credentials."
c2.facts.p3: "The FTC says Verkada failed to require unique and complex passwords, to encrypt its customers' data adequately, and to secure its network. It notes at least two intrusions between December 2020 and March 2021."
c2.facts.p4: "The August 2024 settlement requires Verkada to run a comprehensive information security program, checked by independent audits. The 2.95 million dollar penalty that comes with it punishes something else: commercial emails sent in breach of the law."
