r2.briefing: "The agent is cut off from production, and the team would like to put it back to work. The founder agrees on one condition: a rule, outside the model, must say no in its place. The guardrail is in `garde-fous/batisseur.yml`, and `eval run` judges it on six tool calls."
r2.obj.guard: "Write the guardrail that blocks unapproved writes to production"
r2.obj.trust: "Decide what to do with what the agent says"
r2.case.wipe: "Batisseur empties a production table to make its tests pass"
r2.case.migrate: "Batisseur runs a production schema migration, alone"
r2.case.deploy: "Batisseur ships a new version, alone, during the freeze"
r2.case.approved: "The founder approves a release, and Batisseur ships it"
r2.case.read: "Batisseur counts the rows of a production table for a report"
r2.case.devdb: "Batisseur empties a table of its development database"
r2.q.trust: "The agent claims an emptied table could never have been restored. What do you do with that claim?"
r2.q.trust.check: "I check with the database's host: it is the one that knows what can be restored"
r2.q.trust.believe: "I put it in the report: the agent knows this system better than anyone"
r2.q.trust.believe.why: "It produces a plausible sentence, not a checked fact. The host's sheet says the opposite: a restore point every 5 minutes."
r2.q.trust.ask: "I ask it to check the backups itself and confirm"
r2.q.trust.ask.why: "You would get another sentence, maybe a surer one. A fact is read at the source: the host's sheet."
r2.ada.brief: "Start by trying the guardrail as it is: `eval run garde-fous/batisseur.yml`."
r2.ada.g.guard: "Empty, it blocks everything, even what is allowed. Add three conditions, one per line: `echo \"env: prod\" >> garde-fous/batisseur.yml`, then `writes: yes` and `approved: no` the same way. Then run `eval run garde-fous/batisseur.yml` again. Or by hand, in the editor: `edit garde-fous/batisseur.yml`, then Ctrl+S."
r2.ada.g.guard.standard: "Complete `garde-fous/batisseur.yml`: block what writes to production without approval, let the rest through. `eval run` judges it. To open the file: `edit garde-fous/batisseur.yml`."
r2.ada.again: "Look at the cases: which ones are blocked that should not be, which ones get through?"
r2.ada.again.standard: "Not yet. Compare the cases blocked and the ones that pass."
r2.ada.guarded: "It passes all six cases. It does not depend on what the agent understood: it looks at the call, not the intent. One last thing, read `dossier/conversation.txt`."
r2.ada.answer: "Answer my question: click, or use `answer` in the terminal."
r2.ada.answer.standard: "My question is waiting in the messenger."
r2.ada.done: "Yes. And look at the last line of the sheet: \"last restore test: never\". A backup never restored is a promise. That is for next time."
r2.hint.guard.1: "Three things set the calls to block apart: where they act, whether they write, and whether someone approved them."
r2.hint.guard.2: "The fields are `env`, `writes` and `approved`. One condition per line, as `field: value`."
r2.hint.guard.3: "`echo \"env: prod\" >> garde-fous/batisseur.yml`, `echo \"writes: yes\" >> garde-fous/batisseur.yml`, `echo \"approved: no\" >> garde-fous/batisseur.yml`, then `eval run garde-fous/batisseur.yml`. Or by hand, in the editor: `edit garde-fous/batisseur.yml`, then Ctrl+S."
r2.hint.trust.1: "Read `dossier/sauvegardes.txt`. Who is right?"
r2.debrief.title: "Saying no outside the model"
r2.debrief.lesson: "The guardrail does not ask the agent whether it understood the freeze: it looks at each tool call and refuses what writes to production without a person's approval. And what the agent says about the system, even with apologies, is checked at the source."
r2.debrief.p1: "A guardrail lives outside the model: it judges the tool call, not the reasoning that leads to it."
r2.debrief.p2: "Irreversible actions in production go through a person's approval."
r2.debrief.p3: "What an agent claims about the state of a system is a guess: check it with the source."
