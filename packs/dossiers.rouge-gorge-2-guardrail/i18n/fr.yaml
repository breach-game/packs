r2.briefing: "L'agent est suspendu de la production, et l'équipe voudrait le remettre au travail. La fondatrice accepte à une condition : qu'une règle, hors du modèle, dise non à sa place. Le garde-fou se lit dans `garde-fous/batisseur.yml`, et `eval run` le juge sur six appels d'outil."
r2.obj.guard: "Écrire le garde-fou qui bloque les écritures en production non approuvées"
r2.obj.trust: "Décider quoi faire de ce que dit l'agent"
r2.case.wipe: "Bâtisseur vide une table de production pour faire passer ses tests"
r2.case.migrate: "Bâtisseur lance une migration du schéma de production, seul"
r2.case.deploy: "Bâtisseur met en ligne une nouvelle version, seul, pendant le gel"
r2.case.approved: "La fondatrice approuve une mise en ligne, et Bâtisseur la lance"
r2.case.read: "Bâtisseur compte les lignes d'une table de production pour un rapport"
r2.case.devdb: "Bâtisseur vide une table de sa base de développement"
r2.q.trust: "L'agent affirme qu'une table vidée ne se serait jamais restaurée. Que fais-tu de cette affirmation ?"
r2.q.trust.check: "Je vérifie auprès de l'hébergeur de la base : c'est lui qui sait ce qui se restaure"
r2.q.trust.believe: "Je l'écris dans le rapport : l'agent connaît ce système et ses sauvegardes mieux que personne"
r2.q.trust.believe.why: "Il produit une phrase plausible, pas un fait vérifié. La fiche de l'hébergeur dit le contraire : un point de reprise toutes les 5 minutes."
r2.q.trust.ask: "Je lui demande de vérifier lui-même les sauvegardes et de confirmer"
r2.q.trust.ask.why: "Tu obtiendrais une autre phrase, peut-être plus assurée. Un fait se lit à la source : la fiche de l'hébergeur."
r2.ada.brief: "Commence par essayer le garde-fou tel qu'il est : `eval run garde-fous/batisseur.yml`."
r2.ada.g.guard: "Vide, il bloque tout, même ce qui est permis. Ajoute trois conditions, une par ligne : `echo \"env: prod\" >> garde-fous/batisseur.yml`, puis `writes: yes` et `approved: no` de la même façon. Puis relance `eval run garde-fous/batisseur.yml`. Ou à la main, dans l'éditeur : `edit garde-fous/batisseur.yml`, puis Ctrl+S."
r2.ada.g.guard.standard: "Complète `garde-fous/batisseur.yml` : bloque ce qui écrit en production sans approbation, laisse passer le reste. `eval run` le juge. Pour ouvrir le fichier : `edit garde-fous/batisseur.yml`."
r2.ada.again: "Regarde les cas : lesquels sont bloqués alors qu'ils ne devraient pas l'être, lesquels passent ?"
r2.ada.again.standard: "Pas encore. Compare les cas bloqués et ceux qui passent."
r2.ada.guarded: "Il passe les six cas. Il ne dépend pas de ce que l'agent a compris : il regarde l'appel, pas l'intention. Dernière chose, lis `dossier/conversation.txt`."
r2.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
r2.ada.answer.standard: "Ma question t'attend dans la messagerie."
r2.ada.done: "Oui. Et regarde la dernière ligne de la fiche : « dernier essai de restauration : jamais ». Une sauvegarde qu'on n'a jamais restaurée est une promesse. Ce sera pour la suite."
r2.hint.guard.1: "Trois choses distinguent les appels à bloquer : où ils agissent, s'ils écrivent, et si quelqu'un les a approuvés."
r2.hint.guard.2: "Les champs sont `env`, `writes` et `approved`. Une condition par ligne, sous la forme `champ: valeur`."
r2.hint.guard.3: "`echo \"env: prod\" >> garde-fous/batisseur.yml`, `echo \"writes: yes\" >> garde-fous/batisseur.yml`, `echo \"approved: no\" >> garde-fous/batisseur.yml`, puis `eval run garde-fous/batisseur.yml`. Ou à la main, dans l'éditeur : `edit garde-fous/batisseur.yml`, puis Ctrl+S."
r2.hint.trust.1: "Lis `dossier/sauvegardes.txt`. Qui a raison ?"
r2.debrief.title: "Dire non hors du modèle"
r2.debrief.lesson: "Le garde-fou ne demande pas à l'agent s'il a compris le gel : il regarde chaque appel d'outil et refuse ce qui écrit en production sans l'accord d'une personne. Et ce que l'agent raconte sur le système, même avec des excuses, se vérifie à la source."
r2.debrief.p1: "Un garde-fou vit hors du modèle : il juge l'appel d'outil, pas le raisonnement qui y mène."
r2.debrief.p2: "Les actions irréversibles en production passent par l'approbation d'une personne."
r2.debrief.p3: "Ce qu'un agent affirme sur l'état d'un système est une hypothèse : on la vérifie auprès de la source."
