c1.briefing: "Covera sells a coverage service used in thousands of build pipelines. Its CTO read about a 2021 attack on a vendor just like them and wants to know: would it work here? You replay the attacker's first step: look at what Covera publishes, and find what it should not."
c1.obj.docs: "Read how customers install Covera"
c1.obj.manifest: "Read the manifest of the public image"
c1.obj.layer: "Open the layer that the last build step tries to erase"
c1.obj.key: "Send the id of the key found in the image (`submit`)"
c1.obj.why: "Explain why the key is still there"
c1.q.why: "The last step of the build runs `rm -rf /opt/deploy`. Why can you still read release.key?"
c1.q.why.failed: "The rm command failed during the build without stopping it, so the folder stayed"
c1.q.why.failed.why: "It worked: in the final image, /opt/deploy is gone. Look at layer e5a771, it only holds a marker that hides the folder."
c1.q.why.layers: "Each step is stored as its own layer: deleting later only hides the file"
c1.q.why.cache: "The registry keeps an old cached copy of the image by mistake, from before the removal"
c1.q.why.cache.why: "No mistake on the registry side: it serves exactly the layers the image is made of. The file is part of the image."
c1.ada.brief: "Adversary emulation today. Same rules as ever, the mandate is in `mandate/`. An attacker starts where anyone can: the public documentation."
c1.ada.docs: "Start with their install page: `curl https://www.covera.test/docs/install`."
c1.ada.docs.standard: "Start with their public install documentation."
c1.ada.manifest: "Two things to remember. One line that customers pipe straight into bash: we will come back to it. And a public image. An image is a manifest plus a stack of layers: `curl https://registry.covera.test/v2/covera/enterprise/manifests/2.9`."
c1.ada.manifest.standard: "A script piped into bash, and a public image. Ask the registry for the manifest of that image."
c1.ada.layer: "Read the `created_by` lines: that is the recipe, step by step. One step copies a folder, the next one deletes it. Open both layers: add the digest after `/blobs/`."
c1.ada.layer.standard: "The manifest is the build recipe. One step copies something that the next one deletes: look at both layers."
c1.ada.steps: "Step 4 copies `deploy/`, step 5 removes it. If the folder was worth removing, it is worth a look: `curl https://registry.covera.test/v2/covera/enterprise/blobs/4d1e9a`."
c1.ada.steps.standard: "A folder copied, then removed in the next step. If it was worth removing, it is worth a look."
c1.ada.whiteout: "A whiteout. The last layer does not erase anything: it carries a note saying \"hide opt/deploy\". The layer underneath is untouched, and public."
c1.ada.key: "Layer 4d1e9a lists three files. Read them: add the path of a file after the layer address."
c1.ada.key.standard: "Read the files of that layer."
c1.ada.listing: "A release key, in a public image. Read it, and the script next to it to see what it opens: `curl https://registry.covera.test/v2/covera/enterprise/blobs/4d1e9a/opt/deploy/release.key`."
c1.ada.listing.standard: "A release key in a public image. Read it, and what it is used for."
c1.ada.found: "There it is. Send me its `key-id` with `submit`: that is our proof, we do not need to use the key to report it."
c1.ada.found.standard: "Send me the key id with `submit`."
c1.ada.flag: "Noted in the report. One question, because this is the heart of it."
c1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
c1.ada.answer.standard: "Answer my question."
c1.ada.why: "Exactly. An image is a pile of transparent sheets: writing \"deleted\" on the top sheet does not remove what is drawn below. Anyone who pulls the image gets every sheet."
c1.ada.done: "First step replayed: no break-in, only reading what was published. Open the debrief, then we see what that key opens."
c1.hint.docs.1: "Type `curl https://www.covera.test/docs/install`."
c1.hint.manifest.1: "The install page gives the address of the image manifest."
c1.hint.manifest.2: "Type `curl https://registry.covera.test/v2/covera/enterprise/manifests/2.9`."
c1.hint.layer.1: "Look for the step that copies a folder which the following step removes."
c1.hint.layer.2: "Type `curl https://registry.covera.test/v2/covera/enterprise/blobs/4d1e9a`."
c1.hint.key.1: "Add `/opt/deploy/release.key` to the address of the layer."
c1.hint.key.2: "The id is on the `key-id` line. Type `submit CVR-REL-7Q2M`."
c1.debrief.title: "A layer never forgets"
c1.debrief.lesson: "Nothing was forced. The key was copied into the image for one build step, then removed, and the removal only hid it. Whatever enters a layer is published with the image."
c1.debrief.p1: "Never copy a secret into an image, even for one step. Give it to the build as a mounted secret, which leaves no layer behind."
c1.debrief.p2: "Use a multi-stage build: only the final stage is published, the build tools and what they touched stay behind."
c1.debrief.p3: "Scan your own public images for secrets, layer by layer, the way an attacker would."
