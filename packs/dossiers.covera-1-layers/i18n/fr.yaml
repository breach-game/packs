c1.briefing: "Covera vend un service de couverture de tests utilisé dans des milliers de chaînes de build. Son directeur technique a lu le récit d'une attaque de 2021 contre un éditeur qui leur ressemble, et il veut savoir : est-ce que ça marcherait ici ? Tu rejoues la première étape de l'attaquant : regarder ce que Covera publie, et trouver ce qui ne devrait pas y être."
c1.obj.docs: "Lire comment les clients installent Covera"
c1.obj.manifest: "Lire le manifeste de l'image publique"
c1.obj.layer: "Ouvrir la couche que la dernière étape du build essaie d'effacer"
c1.obj.key: "Envoyer l'identifiant de la clé trouvée dans l'image (`submit`)"
c1.obj.why: "Expliquer pourquoi la clé est toujours là"
c1.q.why: "La dernière étape du build lance `rm -rf /opt/deploy`. Pourquoi peux-tu encore lire release.key ?"
c1.q.why.failed: "La commande rm a échoué pendant le build"
c1.q.why.failed.why: "Elle a marché : dans l'image finale, /opt/deploy n'existe plus. Regarde la couche e5a771, elle ne contient qu'un marqueur qui cache le dossier."
c1.q.why.layers: "Chaque étape est gardée dans sa propre couche : supprimer plus tard ne fait que cacher le fichier"
c1.q.why.cache: "Le registre garde par erreur une vieille copie en cache"
c1.q.why.cache.why: "Aucune erreur côté registre : il sert exactement les couches dont l'image est faite. Le fichier fait partie de l'image."
c1.ada.brief: "Émulation d'adversaire aujourd'hui. Mêmes règles que d'habitude, le mandat est dans `mandate/`. Un attaquant commence là où tout le monde peut aller : la documentation publique."
c1.ada.docs: "Commence par leur page d'installation : `curl https://www.covera.test/docs/install`."
c1.ada.docs.standard: "Commence par leur documentation d'installation, elle est publique."
c1.ada.manifest: "Deux choses à retenir. Une ligne que les clients envoient tout droit dans bash : on y reviendra. Et une image publique. Une image, c'est un manifeste et une pile de couches : `curl https://registry.covera.test/v2/covera/enterprise/manifests/2.9`."
c1.ada.manifest.standard: "Un script envoyé tout droit dans bash, et une image publique. Demande au registre le manifeste de cette image."
c1.ada.layer: "Lis les lignes `created_by` : c'est la recette, étape par étape. Une étape copie un dossier, la suivante le supprime. Ouvre les deux couches : ajoute leur empreinte après `/blobs/`."
c1.ada.layer.standard: "Le manifeste, c'est la recette du build. Une étape copie quelque chose que la suivante supprime : regarde les deux couches."
c1.ada.steps: "L'étape 4 copie `deploy/`, l'étape 5 le supprime. Si ce dossier méritait d'être supprimé, il mérite un coup d'œil : `curl https://registry.covera.test/v2/covera/enterprise/blobs/4d1e9a`."
c1.ada.steps.standard: "Un dossier copié, puis supprimé à l'étape suivante. S'il méritait d'être supprimé, il mérite un coup d'œil."
c1.ada.whiteout: "Un « whiteout ». La dernière couche n'efface rien : elle porte une note qui dit « cache opt/deploy ». La couche du dessous n'a pas bougé, et elle est publique."
c1.ada.key: "La couche 4d1e9a liste trois fichiers. Lis-les : ajoute le chemin d'un fichier après l'adresse de la couche."
c1.ada.key.standard: "Lis les fichiers de cette couche."
c1.ada.listing: "Une clé de publication, dans une image publique. Lis-la, et le script d'à côté pour voir ce qu'elle ouvre : `curl https://registry.covera.test/v2/covera/enterprise/blobs/4d1e9a/opt/deploy/release.key`."
c1.ada.listing.standard: "Une clé de publication dans une image publique. Lis-la, et regarde à quoi elle sert."
c1.ada.found: "La voilà. Envoie-moi son `key-id` avec `submit` : c'est notre preuve, pas besoin d'utiliser la clé pour la signaler."
c1.ada.found.standard: "Envoie-moi l'identifiant de la clé avec `submit`."
c1.ada.flag: "Noté dans le rapport. Une question, parce que tout est là."
c1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
c1.ada.answer.standard: "Réponds à ma question."
c1.ada.why: "Exactement. Une image, c'est une pile de calques transparents : écrire « supprimé » sur le calque du dessus n'enlève pas ce qui est dessiné en dessous. Qui télécharge l'image reçoit tous les calques."
c1.ada.done: "Première étape rejouée : aucune effraction, seulement lire ce qui était publié. Ouvre le débrief, puis on regarde ce que cette clé ouvre."
c1.hint.docs.1: "Tape `curl https://www.covera.test/docs/install`."
c1.hint.manifest.1: "La page d'installation donne l'adresse du manifeste de l'image."
c1.hint.manifest.2: "Tape `curl https://registry.covera.test/v2/covera/enterprise/manifests/2.9`."
c1.hint.layer.1: "Cherche l'étape qui copie un dossier que l'étape suivante supprime."
c1.hint.layer.2: "Tape `curl https://registry.covera.test/v2/covera/enterprise/blobs/4d1e9a`."
c1.hint.key.1: "Ajoute `/opt/deploy/release.key` à l'adresse de la couche."
c1.hint.key.2: "L'identifiant est sur la ligne `key-id`. Tape `submit CVR-REL-7Q2M`."
c1.debrief.title: "Une couche n'oublie jamais"
c1.debrief.lesson: "Rien n'a été forcé. La clé a été copiée dans l'image pour une seule étape du build, puis supprimée, et cette suppression n'a fait que la cacher. Tout ce qui entre dans une couche est publié avec l'image."
c1.debrief.p1: "Ne jamais copier un secret dans une image, même pour une étape. Le donner au build comme secret monté, qui ne laisse aucune couche derrière lui."
c1.debrief.p2: "Construire en plusieurs étapes (multi-stage) : seule la dernière est publiée, les outils de build et ce qu'ils ont touché restent derrière."
c1.debrief.p3: "Chercher les secrets dans ses propres images publiques, couche par couche, comme le ferait un attaquant."
