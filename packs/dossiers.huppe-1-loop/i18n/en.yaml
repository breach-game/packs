h1.briefing: "Friday, 7:05. Since 6:09 the counters of all forty Ravel pharmacies have been restarting in a loop, and customers are waiting for their prescriptions. A pharmacist in Lyon started counter 07 in rescue mode: it answers. You have read access to it (`ir`)."
h1.obj.channel: "Find the file that brings the counters down"
h1.obj.attack: "Say whether it is an attack"
h1.q.channel: "Which Guetteur content channel, received at 6:09, makes the counters crash? (its number, four digits)"
h1.q.attack: "Management asks: is it an attack?"
h1.q.attack.content: "No: a faulty detection file, delivered through the vendor's usual channel"
h1.q.attack.ransom: "Yes: ransomware that encrypts the counters before restarting them"
h1.q.attack.ransom.why: "No demand, no encrypted file, no unknown access. The journal shows Guetteur's module crashing while reading its new file, on every machine in the same minute."
h1.q.attack.insider: "Yes: someone at the vendor sabotaged the file on purpose"
h1.q.attack.insider.why: "Nothing shows that. One field too many, read by the module without checking: a content error, not an intent. Intent is not assumed without proof."
h1.ada.brief: "Sign in: `ssh ir@comptoir07.ravel.test`. Then look at when the machine restarted (`last`) and what it said just before (`journalctl`)."
h1.ada.g.channel: "In the journal, what does the agent load just before each \"Kernel panic\"? Look at its files: `ls -l /var/lib/guetteur/canaux`, then compare the old and the new one with `strings`. `answer channel <number>`."
h1.ada.g.channel.standard: "Find what the agent was loading when it crashed. `answer channel`."
h1.ada.channel: "Channel 0447, received at 6:09, and the crash in Guetteur's module in the same second. Compare: 20 fields in the old files, 21 in this one."
h1.ada.g.attack: "Read again what you saw: who delivered the file, and by which path?"
h1.ada.done: "No attacker. A detection file, delivered to every counter at once through the company's most trusted channel, and a module that crashes reading it. Now forty pharmacies need repairing."
h1.hint.channel.1: "\"content channel 0447 received from cloud, loading\", then \"Kernel panic\"."
h1.hint.channel.2: "`answer channel 0447`"
h1.hint.attack.1: "`answer content`"
h1.debrief.title: "Every counter at once"
h1.debrief.lesson: "At 6:09 Guetteur's vendor sent all its customers a new detection file. It held one field more than the agent's module knew how to read. The module, loaded at the heart of the system, read past the end of its table, and every machine crashed loading it, then again at restart. It was not an attack: it was the trusted channel failing."
h1.debrief.p1: "Before crying attack, look at what changed just before the failure, and on how many machines at once."
h1.debrief.p2: "Software running at the heart of the system brings the machine down when it fails: the price of its position."
h1.debrief.p3: "Keep a way to start a machine without its agents (rescue mode) and to inspect it remotely."
