h1.briefing: "Vendredi, 7 h 05. Depuis 6 h 09, les comptoirs des quarante pharmacies Ravel redémarrent en boucle, et les clients attendent leurs ordonnances. Une pharmacienne de Lyon a démarré le comptoir 07 en mode secours : il répond. Tu y as un accès en lecture (`ir`)."
h1.obj.channel: "Trouver le fichier qui fait tomber les comptoirs"
h1.obj.attack: "Dire si c'est une attaque"
h1.q.channel: "Quel canal de contenu de Guetteur, reçu à 6 h 09, fait planter les comptoirs ? (son numéro, quatre chiffres)"
h1.q.attack: "La direction demande : est-ce une attaque ?"
h1.q.attack.content: "Non : un fichier de détection défectueux, livré par le canal habituel de l'éditeur"
h1.q.attack.ransom: "Oui : un rançongiciel qui chiffre les comptoirs avant de les redémarrer"
h1.q.attack.ransom.why: "Aucune demande, aucun fichier chiffré, aucun accès inconnu. Le journal montre le module de Guetteur qui plante en lisant son nouveau fichier, sur toutes les machines à la même minute."
h1.q.attack.insider: "Oui : quelqu'un de l'éditeur a saboté le fichier exprès"
h1.q.attack.insider.why: "Rien ne le montre. Un champ de trop, que le module lit sans vérifier : c'est une erreur de contenu, pas une intention. On ne prête pas d'intention sans preuve."
h1.ada.brief: "Connecte-toi : `ssh ir@comptoir07.ravel.test`. Puis regarde quand la machine a redémarré (`last`) et ce qu'elle disait juste avant (`journalctl`)."
h1.ada.g.channel: "Dans le journal, que charge l'agent juste avant chaque « Kernel panic » ? Regarde ses fichiers : `ls -l /var/lib/guetteur/canaux`, puis compare l'ancien et le nouveau avec `strings`. `answer channel <numéro>`."
h1.ada.g.channel.standard: "Trouve ce que l'agent chargeait au moment du plantage. `answer channel`."
h1.ada.channel: "Canal 0447, reçu à 6 h 09, et le plantage dans le module de Guetteur à la même seconde. Compare : 20 champs dans les anciens fichiers, 21 dans celui-ci."
h1.ada.g.attack: "Relis ce que tu as vu : qui a livré le fichier, et par quel chemin ?"
h1.ada.done: "Pas d'attaquant. Un fichier de détection, livré à tous les comptoirs en même temps par le canal le plus fiable de la maison, et un module qui plante en le lisant. Maintenant, il faut réparer quarante pharmacies."
h1.hint.channel.1: "« content channel 0447 received from cloud, loading », puis « Kernel panic »."
h1.hint.channel.2: "`answer channel 0447`"
h1.hint.attack.1: "`answer content`"
h1.debrief.title: "Tous les comptoirs à la fois"
h1.debrief.lesson: "À 6 h 09, l'éditeur de Guetteur a envoyé à tous ses clients un nouveau fichier de détection. Il contenait un champ de plus que ce que le module de l'agent savait lire. Le module, chargé au cœur du système, a lu au-delà de sa table, et chaque machine a planté en le chargeant, puis à nouveau au redémarrage. Ce n'était pas une attaque : c'était le canal de confiance qui tombait en panne."
h1.debrief.p1: "Avant de crier à l'attaque, regarder ce qui a changé juste avant la panne, et sur combien de machines à la fois."
h1.debrief.p2: "Un logiciel qui tourne au cœur du système fait tomber la machine quand il tombe : c'est le prix de sa position."
h1.debrief.p3: "Garder un moyen de démarrer une machine sans ses agents (mode secours) et de l'inspecter à distance."
