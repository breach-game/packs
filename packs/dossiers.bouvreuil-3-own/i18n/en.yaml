v3.briefing: "Last morning at Bouvreuil. The filter is written; what is left is the policy around it: `dossier/assistants.yml`. The CTO wants one thing: teams keep an assistant, and manufacturing secrets stay at home."
v3.obj.filter: "Switch the filter on and classify the data"
v3.obj.inside: "Open an assistant hosted at Bouvreuil"
v3.obj.people: "Train before giving access"
v3.obj.decide: "Decide what stays open"
v3.check.filter: "Gateway filter on, source code and meeting notes marked confidential"
v3.check.inside: "An internal assistant is running, hosted at Bouvreuil"
v3.check.people: "A short training session before access"
v3.check.logs: "Uploads are still logged"
v3.q.decide: "Everything is ready. What does Bouvreuil do with the public assistant?"
v3.q.decide.both: "Keep both: the public one filtered, the internal one for code"
v3.q.decide.inside: "Only the internal assistant, the public one closed"
v3.q.decide.ban: "No assistant at all until we are sure"
v3.ada.brief: "Read the policy: `cat dossier/assistants.yml`. Three settings to make, then a decision."
v3.ada.g.filter: "Yesterday's filter does nothing while it is off, and it only sees what is classified. Open `edit dossier/assistants.yml`: `gateway_filter: on`, `source_code: confidential`, `meeting_notes: confidential`. Then `verify`."
v3.ada.g.filter.standard: "First, the door: the filter on, and the data it must recognise. Then `verify`."
v3.ada.g.inside: "Code needs somewhere to go. `status: running` and `hosting: internal` for the internal assistant, then `verify`."
v3.ada.g.inside.standard: "Next, an assistant where confidential data is allowed to go. Then `verify`."
v3.ada.g.people: "Last setting, the people: `ai_rules: before-access`, then `verify`."
v3.ada.g.people.standard: "Finally, the people: they should know what to paste where before they get access. Then `verify`."
v3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
v3.ada.ready: "The door, the safe place, the people. The CTO's decision is left, and I leave it to you."
v3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
v3.ada.answer.standard: "My question is waiting in the messenger."
v3.ada.both: "The cheapest choice: nothing confidential leaves, and nobody has a reason to work around it. The log will tell whether the filter blocks too much."
v3.ada.inside: "Careful. Teams lose the public assistant for ordinary questions, and some will look for it on their phones. Keep an eye on that."
v3.ada.ban: "That is what the real company did, at first. It stops the leak, but it pushes people to personal phones, which the gateway does not see. Plan the way out."
v3.ada.done: "Three layers: a door that reads the label, an assistant where secrets are allowed to go, and teams who know why. Open the debrief: the real case is at the end."
v3.hint.filter.1: "Three lines: `gateway_filter`, and two under `classification`."
v3.hint.filter.2: "`sed -i \"s/gateway_filter: off/gateway_filter: on/\" dossier/assistants.yml`, then the same for `source_code: confidential` and `meeting_notes: confidential`, then `verify`."
v3.hint.inside.1: "Two lines under `internal_assistant`."
v3.hint.inside.2: "`sed -i \"s/status: none/status: running/\" dossier/assistants.yml` and `sed -i \"s/hosting: none/hosting: internal/\" dossier/assistants.yml`, then `verify`."
v3.hint.people.1: "`sed -i \"s/ai_rules: never/ai_rules: before-access/\" dossier/assistants.yml`, then `verify`."
v3.hint.decide.1: "No answer is wrong. Which one leaves the fewest reasons to work around it?"
v3.debrief.title: "Somewhere secrets are allowed to go"
v3.debrief.lesson: "A ban stops today's leak, not tomorrow's need. Bouvreuil keeps the tool and builds around it: a filter that reads the label, data classified so it can recognise it, an internal assistant for confidential work, and teams trained before access."
v3.debrief.p1: "Classify data first: a filter only protects what it can recognise."
v3.debrief.p2: "Offer a safe way: an assistant hosted in-house keeps secrets from looking for a way out."
v3.debrief.p3: "A ban with no alternative pushes people to tools nobody sees."
v3.debrief.p4: "Train before access: saying what to paste where costs less than a leak."
v3.facts.title: "What really happened: Samsung (2023)"
v3.facts.p1: "Bouvreuil does not exist. The scenario is inspired by what happened at Samsung Electronics: in March 2023, its semiconductor division allowed its engineers to use ChatGPT, a public assistant."
v3.facts.p2: "Within about twenty days, the Korean press reported three incidents: source code pasted to fix an error, more code to optimise a test program, and a meeting recording transcribed to produce minutes."
v3.facts.p3: "The company's first response: cap each prompt at 1,024 bytes."
v3.facts.p4: "In early May 2023, Samsung banned public generative AI tools on its devices and internal networks, and said it was preparing its own tools."
v3.facts.p5: "No hacking at all: data handed over by employees acting in good faith, which the company could no longer take back."
