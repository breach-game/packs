v3.briefing: "Dernière matinée chez Bouvreuil. Le filtre est écrit, il reste à poser la politique autour : `dossier/assistants.yml`. Le directeur technique veut une chose : que ses équipes gardent un assistant, et que les secrets de fabrication restent à la maison."
v3.obj.filter: "Mettre le filtre en marche et classer les données"
v3.obj.inside: "Ouvrir un assistant hébergé chez Bouvreuil"
v3.obj.people: "Former avant de donner l'accès"
v3.obj.decide: "Décider ce qui reste ouvert"
v3.check.filter: "Filtre de la passerelle actif, code source et comptes rendus classés confidentiels"
v3.check.inside: "Un assistant interne tourne, hébergé chez Bouvreuil"
v3.check.people: "Une formation courte avant l'accès"
v3.check.logs: "Les envois restent journalisés"
v3.q.decide: "Tout est prêt. Que fait Bouvreuil de l'assistant public ?"
v3.q.decide.both: "Garder les deux : le public filtré, l'interne pour le code"
v3.q.decide.inside: "Seulement l'assistant interne, le public fermé"
v3.q.decide.ban: "Plus aucun assistant tant qu'on n'est pas sûrs"
v3.ada.brief: "Lis la politique : `cat dossier/assistants.yml`. Trois réglages à poser, puis une décision."
v3.ada.g.filter: "Le filtre d'hier ne sert à rien s'il est éteint, et il ne voit que ce qui est classé. Ouvre `edit dossier/assistants.yml` : `gateway_filter: on`, `source_code: confidential`, `meeting_notes: confidential`. Puis `verify`."
v3.ada.g.filter.standard: "D'abord, la porte : le filtre en marche, et les données qu'il doit reconnaître. Puis `verify`."
v3.ada.g.inside: "Le code doit avoir un endroit où aller. `status: running` et `hosting: internal` pour l'assistant interne, puis `verify`."
v3.ada.g.inside.standard: "Ensuite, un assistant où le confidentiel a le droit d'aller. Puis `verify`."
v3.ada.g.people: "Dernier réglage, les personnes : `ai_rules: before-access`, puis `verify`."
v3.ada.g.people.standard: "Enfin, les personnes : qu'elles sachent quoi coller où avant d'avoir l'accès. Puis `verify`."
v3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
v3.ada.ready: "La porte, l'endroit sûr, les personnes. Reste la décision du directeur technique, et je te la laisse."
v3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
v3.ada.answer.standard: "Ma question t'attend dans la messagerie."
v3.ada.both: "Le choix le moins coûteux : rien de confidentiel ne part, et personne n'a de raison de contourner. Le journal dira si le filtre bloque trop."
v3.ada.inside: "Prudent. Les équipes perdent l'assistant public pour les questions ordinaires, et certaines iront le chercher sur leur téléphone. Surveille ça."
v3.ada.ban: "C'est ce qu'a fait l'entreprise réelle, au début. Ça arrête la fuite, mais ça pousse vers les téléphones personnels, que la passerelle ne voit pas. Prévois la sortie."
v3.ada.done: "Trois couches : une porte qui lit l'étiquette, un assistant où le secret a le droit d'aller, et des équipes qui savent pourquoi. Ouvre le débrief : à la fin, le cas réel."
v3.hint.filter.1: "Trois lignes : `gateway_filter`, et deux sous `classification`."
v3.hint.filter.2: "`sed -i \"s/gateway_filter: off/gateway_filter: on/\" dossier/assistants.yml`, puis la même chose pour `source_code: confidential` et `meeting_notes: confidential`, puis `verify`."
v3.hint.inside.1: "Deux lignes sous `internal_assistant`."
v3.hint.inside.2: "`sed -i \"s/status: none/status: running/\" dossier/assistants.yml` et `sed -i \"s/hosting: none/hosting: internal/\" dossier/assistants.yml`, puis `verify`."
v3.hint.people.1: "`sed -i \"s/ai_rules: never/ai_rules: before-access/\" dossier/assistants.yml`, puis `verify`."
v3.hint.decide.1: "Aucune réponse n'est fausse. Laquelle laisse le moins de raisons de contourner ?"
v3.debrief.title: "Un endroit où le secret a le droit d'aller"
v3.debrief.lesson: "Interdire arrête la fuite d'aujourd'hui, pas l'envie de demain. Bouvreuil garde l'outil, et pose autour : un filtre qui lit l'étiquette, des données classées pour qu'il les reconnaisse, un assistant interne pour le travail confidentiel, et des équipes formées avant l'accès."
v3.debrief.p1: "Classer les données d'abord : un filtre ne protège que ce qu'il sait reconnaître."
v3.debrief.p2: "Offrir une voie sûre : un assistant hébergé en interne évite que le secret cherche une sortie."
v3.debrief.p3: "Une interdiction sans alternative pousse vers des outils que personne ne voit."
v3.debrief.p4: "Former avant l'accès : dire quoi coller où coûte moins qu'une fuite."
v3.facts.title: "Ce qui s'est vraiment passé : Samsung, 2023"
v3.facts.p1: "En mars 2023, la division semi-conducteurs de Samsung Electronics autorise ses ingénieurs à utiliser ChatGPT, un assistant public."
v3.facts.p2: "En une vingtaine de jours, la presse coréenne rapporte trois incidents : un code source collé pour corriger une erreur, un autre pour optimiser un programme de test, et l'enregistrement d'une réunion transcrit pour en tirer un compte rendu."
v3.facts.p3: "Première réponse de l'entreprise : limiter chaque question à 1 024 octets."
v3.facts.p4: "Début mai 2023, Samsung interdit les outils d'IA générative publics sur ses appareils et réseaux internes, et annonce préparer ses propres outils."
v3.facts.p5: "Aucun piratage : des données confiées par des employés de bonne foi, que l'entreprise ne pouvait plus reprendre."
