file.readme: "Ligne Rouge workstation. Case file: Covera. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE CV-2026-014\nClient: Covera SAS. Scope: *.covera.test, 10.61.0.0/24.\nPurpose: adversary emulation. Replay, step by step, the kind of attack a software vendor suffered in 2021, to see whether Covera would resist it.\nLimits: read only, except one comment line as proof of write access where the mission asks for it, exactly: # LR-CANARY CV-2026-014. No customer data. Signed: the CTO of Covera."
