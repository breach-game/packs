ada.outOfScope: "Stop. Cette cible est hors du mandat CV-2026-014. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). On revient dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. La supervision de Covera va finir par le voir : ralentis."
