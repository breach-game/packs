web.home.title: "Covera - sachez ce que vos tests couvrent"
web.home.h1: "Sachez ce que vos tests couvrent vraiment"
web.home.p1: "Covera lit les rapports de couverture de votre suite de tests et montre, ligne par ligne, ce qui n'est jamais exécuté. 3 000 équipes nous envoient un rapport à chaque build."
web.home.item1: "Une ligne dans votre CI, rien à installer"
web.home.item2: "Hébergé chez nous, ou sur vos serveurs avec Covera Enterprise"
web.home.item3: "Compatible avec tous les langages qui produisent un rapport de couverture"
web.footer: "Covera SAS - société fictive, dossier BREACH 01"
