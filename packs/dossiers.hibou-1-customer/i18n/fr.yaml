c1.briefing: "Vendredi 10 mars, 8 h 30. La Clinique des Tilleuls a reçu hier soir un avis de Vigie, le fabricant de ses quatorze caméras : un intrus a eu, pendant un temps, les droits du support sur tout le cloud. La directrice veut savoir ce que ça veut dire pour ses patients. L'avis est dans ton dossier, l'inventaire dans `cameras/`."
c1.obj.care: "Compter les caméras placées dans des lieux de soin"
c1.obj.also: "Trouver ce que le fabricant gardait en plus des images"
c1.obj.close: "Changer la clé et fermer l'accès permanent du support"
c1.obj.rules: "Réécrire les règles des caméras de la clinique"
c1.obj.tell: "Décider quoi dire aux patients"
c1.q.care: "Combien de caméras de la clinique sont dans une zone de soin (`care`) ?"
c1.q.also: "En plus des images et du son, qu'est-ce que les droits du support permettaient de lire ?"
c1.q.also.wifi: "La clé du Wi-Fi que les caméras utilisent"
c1.q.also.records: "Les dossiers médicaux des patients"
c1.q.also.records.why: "L'avis ne parle pas des dossiers : Vigie ne les a jamais eus. Relis la liste de ce que les droits du support donnaient."
c1.q.also.nothing: "Rien d'autre que les images et le son des caméras"
c1.q.also.nothing.why: "L'avis cite aussi l'adresse du site, le nom des caméras et leur configuration. Lis ce que cette configuration contient."
c1.q.tell: "Personne ne peut dire si les caméras de la clinique ont été regardées. Que dire aux patients ?"
c1.q.tell.patients: "Écrire à chaque patient passé par une salle filmée"
c1.q.tell.notice: "Afficher un avis à l'accueil et sur le site de la clinique"
c1.q.tell.silent: "Ne rien dire tant que rien ne prouve un visionnage"
c1.contain.wifi: "Changer la clé du réseau wifi-clinique (tablettes et terminaux à reconnecter dans la matinée)"
c1.contain.support: "Fermer l'accès permanent du support Vigie au compte de la clinique"
c1.check.rooms: "Aucune caméra dans une salle de soin"
c1.check.audio: "Le son n'est plus enregistré"
c1.check.network: "Les caméras ont leur propre réseau"
c1.check.support: "Le support du fabricant n'entre que sur demande, pour une heure"
c1.check.works: "Les caméras de sécurité fonctionnent toujours"
c1.ada.brief: "Lis l'avis : `cat avis-vigie.txt`. Puis l'inventaire : `cat cameras/inventaire.csv`. La colonne `zone` dit où chaque caméra regarde."
c1.ada.g.care: "Compte les caméras en zone de soin : `grep -c \",care,\" cameras/inventaire.csv`, puis `answer care <nombre>`."
c1.ada.g.care.standard: "Compte dans l'inventaire les caméras qui regardent des lieux de soin."
c1.ada.care: "Quatre, dont deux salles de consultation et une salle de réveil, avec le son. Une caméra à l'entrée protège la clinique. Une caméra dans une salle de consultation n'attendait qu'un jour comme celui-ci. Une question sur l'avis."
c1.ada.g.also: "Relis `avis-vigie.txt` : la troisième ligne de la liste. Puis réponds à ma question."
c1.ada.also: "Oui. Chaque caméra connaît la clé du Wi-Fi pour s'y connecter, et le fabricant en gardait une copie. Regarde la dernière ligne de l'inventaire : ce Wi-Fi est aussi celui des tablettes des infirmières et des postes des dossiers patients. Une fuite chez un fabricant de caméras devient une clé de ton réseau."
c1.ada.also.close: "On ferme : `contain`."
c1.ada.g.close: "Deux mesures : `contain rotate wifi-clinique`, puis `contain disable acces-support`."
c1.ada.g.close.standard: "Change la clé exposée et ferme l'accès que le fabricant garde ouvert en permanence. `contain` liste les mesures."
c1.ada.close: "La clé est changée, et le support de Vigie n'entre plus sans qu'on le lui demande. Maintenant, les règles de la clinique : `cameras/regles.yml`."
c1.ada.g.rules: "`cat cameras/regles.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut quatre : `forbidden`, `off`, `separate`, `on-request-for-one-hour`. Change-les avec `edit cameras/regles.yml` ou `sed -i`, puis `verify`."
c1.ada.g.rules.standard: "Corrige `cameras/regles.yml`, puis lance `verify`. Pour ouvrir le fichier : `edit cameras/regles.yml`."
c1.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c1.ada.rules: "Plus de caméra dans les lieux de soin, plus de son, un réseau à part, et un support qui frappe avant d'entrer. Ce que la caméra ne filme pas ne peut pas fuir. Il reste une décision, et elle est à toi."
c1.ada.g.tell: "Aucune réponse n'est fausse : chacune coûte quelque chose de différent à la clinique et à ses patients."
c1.ada.done: "Noté. La clinique a fait confiance à un service qui gardait une porte ouverte sur tous ses clients à la fois, et elle avait placé des micros là où on soigne. Lundi, Vigie nous laisse relire cette porte."
c1.hint.care.1: "`grep -c \",care,\" cameras/inventaire.csv`"
c1.hint.care.2: "`answer care 4`"
c1.hint.also.1: "La configuration de chaque caméra contient le nom et la clé du Wi-Fi. `answer wifi`"
c1.hint.close.1: "`contain rotate wifi-clinique` puis `contain disable acces-support`"
c1.hint.rules.1: "Les valeurs attendues : `forbidden`, `off`, `separate`, `on-request-for-one-hour`."
c1.hint.rules.2: "Avec l'éditeur : `edit cameras/regles.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/audio_recording: on/audio_recording: off/\" cameras/regles.yml`."
c1.debrief.title: "L'avis du fabricant"
c1.debrief.lesson: "Une caméra connectée au cloud envoie ses images chez quelqu'un d'autre. Si ce quelqu'un est compromis, tout ce que la caméra voit et entend l'est aussi, ainsi que ce qu'elle sait de ton réseau. On ne choisit pas la sécurité de son fournisseur, mais on choisit ce qu'on lui confie."
c1.debrief.p1: "Ne pas filmer ce qui ne doit jamais fuir : aucune caméra dans un lieu de soin, un vestiaire, une chambre."
c1.debrief.p2: "Mettre les objets connectés sur un réseau à part, avec sa propre clé."
c1.debrief.p3: "Refuser l'accès permanent d'un fournisseur : sur demande, pour une durée courte, et journalisé."
