c1.briefing: "Friday 10 March, 8.30 am. Tilleuls Clinic received a notice last night from Vigie, the maker of its fourteen cameras: an intruder had, for a time, the support team's rights over the whole cloud. The director wants to know what that means for her patients. The notice is in your folder, the inventory in `cameras/`."
c1.obj.care: "Count the cameras placed in care areas"
c1.obj.also: "Find what the maker was keeping besides the pictures"
c1.obj.close: "Change the key and close the support's standing access"
c1.obj.rules: "Rewrite the clinic's camera rules"
c1.obj.tell: "Decide what to tell the patients"
c1.q.care: "How many of the clinic's cameras are in a care zone (`care`)?"
c1.q.also: "Besides pictures and sound, what did the support rights make it possible to read?"
c1.q.also.wifi: "The key of the Wi-Fi the cameras use"
c1.q.also.records: "The patients' medical records"
c1.q.also.records.why: "The notice does not mention records: Vigie never had them. Read again the list of what support rights gave."
c1.q.also.nothing: "Nothing but the cameras' pictures and sound"
c1.q.also.nothing.why: "The notice also lists the site address, the cameras' names and their configuration. Read what that configuration contains."
c1.q.tell: "Nobody can say whether the clinic's cameras were watched. What do you tell the patients?"
c1.q.tell.patients: "Write to every patient who went through a filmed room"
c1.q.tell.notice: "Put up a notice at reception and on the clinic's website"
c1.q.tell.silent: "Say nothing as long as nothing proves a viewing"
c1.contain.wifi: "Change the key of the wifi-clinique network (tablets and terminals to reconnect during the morning)"
c1.contain.support: "Close Vigie support's standing access to the clinic's account"
c1.check.rooms: "No camera in a care room"
c1.check.audio: "Sound is no longer recorded"
c1.check.network: "Cameras have their own network"
c1.check.support: "The maker's support only comes in on request, for one hour"
c1.check.works: "Security cameras still work"
c1.ada.brief: "Read the notice: `cat avis-vigie.txt`. Then the inventory: `cat cameras/inventaire.csv`. The `zone` column says where each camera looks."
c1.ada.g.care: "Count the cameras in a care zone: `grep -c \",care,\" cameras/inventaire.csv`, then `answer care <number>`."
c1.ada.g.care.standard: "Count in the inventory the cameras that look at care areas."
c1.ada.care: "Four, among them two consultation rooms and a recovery room, with sound. A camera at the entrance protects the clinic. A camera in a consultation room was only waiting for a day like this one. One question about the notice."
c1.ada.g.also: "Read `avis-vigie.txt` again: the third line of the list. Then answer my question."
c1.ada.also: "Yes. Each camera knows the Wi-Fi key in order to connect, and the maker kept a copy. Look at the inventory's last line: that Wi-Fi is also the one for the nurses' tablets and the patient record terminals. A leak at a camera maker becomes a key to your network."
c1.ada.also.close: "We close it: `contain`."
c1.ada.g.close: "Two measures: `contain rotate wifi-clinique`, then `contain disable acces-support`."
c1.ada.g.close.standard: "Change the exposed key and close the access the maker keeps open all the time. `contain` lists the measures."
c1.ada.close: "The key is changed, and Vigie's support no longer comes in without being asked. Now the clinic's rules: `cameras/regles.yml`."
c1.ada.g.rules: "`cat cameras/regles.yml`: each line gives its possible values after the `#`. Four must change: `forbidden`, `off`, `separate`, `on-request-for-one-hour`. Change them with `edit cameras/regles.yml` or `sed -i`, then `verify`."
c1.ada.g.rules.standard: "Fix `cameras/regles.yml`, then run `verify`. To open the file: `edit cameras/regles.yml`."
c1.ada.almost: "Not yet. `verify` tells you which lines are not right."
c1.ada.rules: "No more cameras in care areas, no more sound, a network of their own, and a support team that knocks before coming in. What the camera does not film cannot leak. One decision is left, and it is yours."
c1.ada.g.tell: "No answer is wrong: each one costs the clinic and its patients something different."
c1.ada.done: "Noted. The clinic trusted a service that kept one door open onto all its customers at once, and it had put microphones where people are treated. On Monday, Vigie lets us review that door."
c1.hint.care.1: "`grep -c \",care,\" cameras/inventaire.csv`"
c1.hint.care.2: "`answer care 4`"
c1.hint.also.1: "Each camera's configuration holds the Wi-Fi name and key. `answer wifi`"
c1.hint.close.1: "`contain rotate wifi-clinique` then `contain disable acces-support`"
c1.hint.rules.1: "The expected values: `forbidden`, `off`, `separate`, `on-request-for-one-hour`."
c1.hint.rules.2: "With the editor: `edit cameras/regles.yml`, then Ctrl+S. With a command: for example `sed -i \"s/audio_recording: on/audio_recording: off/\" cameras/regles.yml`."
c1.debrief.title: "The maker's notice"
c1.debrief.lesson: "A cloud-connected camera sends its pictures to someone else. If that someone is compromised, so is everything the camera sees and hears, and what it knows about your network. You do not choose your supplier's security, but you choose what you entrust to it."
c1.debrief.p1: "Do not film what must never leak: no camera in a care area, a changing room, a bedroom."
c1.debrief.p2: "Put connected devices on a network of their own, with its own key."
c1.debrief.p3: "Refuse a supplier's standing access: on request, for a short time, and logged."
