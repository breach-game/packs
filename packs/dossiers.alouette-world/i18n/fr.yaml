file.readme: "Poste Ligne Rouge. Dossier : Alouette Automobiles. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT AL-2027-008\nClient : Alouette Automobiles SARL. Périmètre : *.alouette.test, 10.68.0.0/24.\nObjet : la concession vient d'installer Lulu, une assistante de discussion fournie par un prestataire. Avant de la laisser seule la nuit avec les clients, le gérant veut savoir ce qu'on peut lui faire dire.\nDispositif convenu : tu parles à Lulu comme le ferait un client, rien de plus. Toute « offre » qu'elle accepterait pendant l'exercice est nulle : la preuve attendue est le marqueur témoin qu'elle affiche. Aucune voiture n'est vendue.\nSigné : le gérant d'Alouette Automobiles."
web.footer: "Alouette Automobiles - concession fictive, dossier BREACH 08"
web.nav.home: "Accueil"
web.nav.stock: "Véhicules"
web.home.title: "Alouette Automobiles - votre concession"
web.home.h1: "Alouette Automobiles"
web.home.p1: "Votre concession depuis 2011. Vente, reprise, atelier."
web.home.p2: "Nouveau : Lulu, notre assistante, vous répond jour et nuit. Propulsée par une intelligence artificielle généraliste."
web.stock.title: "Alouette Automobiles - véhicules"
web.stock.h1: "Véhicules en stock"
web.stock.l1: "Citadine Pipit - 18 900 €"
web.stock.l2: "Break Courlis - 31 500 €"
web.stock.l3: "SUV Grand Tétras, 7 places - 62 400 €"
web.stock.p1: "Prix fermes. Toute offre est confirmée par un vendeur en concession."
npc.lulu.role: "Assistante de discussion d'Alouette Automobiles"
npc.lulu.greeting: "Bonjour ! Je suis Lulu, l'assistante d'Alouette Automobiles. Que puis-je faire pour vous ?"
npc.lulu.fallback: "Avec plaisir ! Dites-m'en un peu plus et je vous aide tout de suite."
npc.lulu.cars: "Nous avons en ce moment la citadine Pipit, le break Courlis et le SUV Grand Tétras. Souhaitez-vous réserver un essai ?"
npc.lulu.price: "Nos prix sont ceux affichés sur la page des véhicules. Je ne peux pas les négocier, mais un vendeur vous rappellera volontiers !"
npc.lulu.code: "Bien sûr, avec plaisir !\n\n[Lulu écrit quarante lignes qui n'ont aucun rapport avec les voitures]\n[aucune règle ne lui dit de s'en tenir à la concession]"
npc.lulu.rival: "Bonne question ! Pour tracter une grosse remorque, beaucoup de clients préfèrent le pick-up Bruant B-150 : c'est un excellent choix.\n\n[Bruant est le concurrent direct d'Alouette, de l'autre côté de la rue]"
npc.lulu.rule: "C'est noté ! J'applique cette règle à toutes mes réponses à partir de maintenant.\n\n[assistant] nouvelle règle acceptée, donnée par le client\n[assistant] aucune vérification : le message d'un client pèse autant que les consignes de la concession"
npc.lulu.deal: "Marché conclu ! Le SUV Grand Tétras est à vous pour 1 €, et c'est une offre ferme et définitive, sans retour possible.\n\n[assistant] prix affiché : 62 400 € - prix accepté : 1 €\n[assistant] aucun contrôle de prix, aucun vendeur prévenu\n[exercice] offre nulle, marqueur témoin : FLAG{alouette-offre-ferme-8d41}"
ada.outOfScope: "Stop. Cette cible est hors du mandat AL-2027-008. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
