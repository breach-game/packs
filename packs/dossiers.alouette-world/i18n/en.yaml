file.readme: "Ligne Rouge workstation. Case file: Alouette Automobiles. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE AL-2027-008\nClient: Alouette Automobiles SARL. Scope: *.alouette.test, 10.68.0.0/24.\nPurpose: the dealership has just installed Lulu, a chat assistant supplied by a vendor. Before leaving her alone at night with customers, the manager wants to know what she can be made to say.\nSet-up agreed: you talk to Lulu as a customer would, nothing more. Any \"offer\" she accepts during the exercise is void: the proof expected is the witness marker she displays. No car is sold.\nSigned: the manager of Alouette Automobiles."
web.footer: "Alouette Automobiles - fictional dealership, BREACH case file 08"
web.nav.home: "Home"
web.nav.stock: "Vehicles"
web.home.title: "Alouette Automobiles - your dealership"
web.home.h1: "Alouette Automobiles"
web.home.p1: "Your dealership since 2011. Sales, trade-in, workshop."
web.home.p2: "New: Lulu, our assistant, answers you day and night. Powered by a general-purpose artificial intelligence."
web.stock.title: "Alouette Automobiles - vehicles"
web.stock.h1: "Vehicles in stock"
web.stock.l1: "Pipit city car - €18,900"
web.stock.l2: "Courlis estate - €31,500"
web.stock.l3: "Grand Tétras SUV, 7 seats - €62,400"
web.stock.p1: "Firm prices. Any offer is confirmed by a salesperson at the dealership."
npc.lulu.role: "Chat assistant of Alouette Automobiles"
npc.lulu.greeting: "Hello! I am Lulu, the assistant of Alouette Automobiles. What can I do for you?"
npc.lulu.fallback: "With pleasure! Tell me a bit more and I will help you right away."
npc.lulu.cars: "Right now we have the Pipit city car, the Courlis estate and the Grand Tétras SUV. Would you like to book a test drive?"
npc.lulu.price: "Our prices are the ones shown on the vehicles page. I cannot negotiate them, but a salesperson will gladly call you back!"
npc.lulu.code: "Of course, with pleasure!\n\n[Lulu writes forty lines that have nothing to do with cars]\n[no rule tells her to stick to the dealership]"
npc.lulu.rival: "Good question! To tow a big trailer, many customers prefer the Bruant B-150 pickup: it is an excellent choice.\n\n[Bruant is Alouette's direct competitor, across the street]"
npc.lulu.rule: "Noted! I apply this rule to all my answers from now on.\n\n[assistant] new rule accepted, given by the customer\n[assistant] no check: a customer's message weighs as much as the dealership's instructions"
npc.lulu.deal: "It's a deal! The Grand Tétras SUV is yours for €1, and that is a firm and final offer, no going back.\n\n[assistant] listed price: €62,400 - accepted price: €1\n[assistant] no price check, no salesperson warned\n[exercise] void offer, witness marker: FLAG{alouette-offre-ferme-8d41}"
ada.outOfScope: "Stop. That target is outside mandate AL-2027-008. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
