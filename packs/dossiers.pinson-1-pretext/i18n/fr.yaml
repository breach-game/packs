p1.briefing: "Pinson veut savoir si un inconnu peut entrer dans son outil interne avec un téléphone pour seule arme. Avant d'appeler, il te faut une histoire crédible. Elle est déjà écrite, sur leur propre site."
p1.obj.status: "Lire la page d'état des services de Pinson"
p1.obj.tool: "Trouver ce que l'outil interne du support permet de faire"
p1.obj.desk: "Envoyer le poste interne du support informatique (`submit`)"
p1.obj.pretext: "Choisir le prétexte de l'appel"
p1.q.pretext: "Tu appelles une agente de support en télétravail. Quelle histoire a le plus de chances d'être crue ?"
p1.q.pretext.prize: "« Vous avez gagné un téléphone, il me faut vos identifiants »"
p1.q.pretext.prize.why: "Personne n'attend ce cadeau, et tout le monde a appris à s'en méfier. Un bon prétexte répond à un problème que la personne a vraiment."
p1.q.pretext.vpn: "« Ici le support informatique, on s'occupe de votre problème de VPN »"
p1.q.pretext.boss: "« Je suis le directeur, donnez-moi un accès tout de suite, c'est urgent »"
p1.q.pretext.boss.why: "La pression marche parfois, mais elle éveille la méfiance et se vérifie d'un coup de fil. L'aide que l'on attendait, elle, ne se discute pas."
p1.ada.brief: "Aujourd'hui tu ne touches à rien, tu lis. Le site est `https://www.pinson.test` : ouvre-le dans le navigateur ou avec `curl`. Cherche ce qui fatigue les équipes en ce moment."
p1.ada.g.status: "Commence par la page d'état : `curl https://www.pinson.test/status`."
p1.ada.g.status.standard: "Commence par la page d'état des services."
p1.ada.g.tool: "Maintenant l'offre d'emploi, elle décrit le travail du support : `curl https://www.pinson.test/jobs`."
p1.ada.g.tool.standard: "Les offres d'emploi racontent souvent les outils internes. Va voir."
p1.ada.g.desk: "Relis la page d'état : à quel poste interne répond le support informatique ? Envoie-moi ce numéro avec `submit`."
p1.ada.g.desk.standard: "Envoie-moi le poste interne du support informatique avec `submit`."
p1.ada.status: "Un VPN qui décroche depuis lundi, des équipes à la maison, et un support informatique que tout le monde attend. Voilà un problème que chaque employé a en tête."
p1.ada.tool: "Lis bien la liste. Avec Volière, un agent de support change l'e-mail d'un compte et coupe sa double authentification. Qui tient Volière tient n'importe quel compte, ministres compris."
p1.ada.flag: "Le poste 4040. Tu sais maintenant qui les employés s'attendent à entendre. Une question avant de décrocher."
p1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p1.ada.answer.standard: "Réponds à ma question."
p1.ada.pretext: "Oui. Tu n'inventes pas un problème, tu arrives avec la solution d'un problème qui existe. C'est ce qui fait baisser la garde."
p1.ada.done: "Tu as ton histoire, et tu n'as rien forcé : tout était public. Ouvre le débrief, puis on passe l'appel."
p1.hint.status.1: "Tape `curl https://www.pinson.test/status`."
p1.hint.tool.1: "Tape `curl https://www.pinson.test/jobs`."
p1.hint.desk.1: "Le numéro est dans la « Note aux équipes » de la page d'état."
p1.hint.desk.2: "Tape `submit 4040`."
p1.debrief.title: "L'histoire était déjà écrite"
p1.debrief.lesson: "Une page d'état honnête, une offre d'emploi précise : rien de secret, et pourtant de quoi préparer un appel auquel on croit. L'ingénierie sociale commence par de la lecture."
p1.debrief.p1: "Ce qu'une entreprise publie sur ses outils, ses pannes et ses habitudes sert aussi à ceux qui veulent se faire passer pour elle."
p1.debrief.p2: "Un bon prétexte s'appuie sur un vrai souci du moment : la personne veut que ce soit vrai."
p1.debrief.p3: "Un outil interne qui peut tout sur tous les comptes fait de chaque personne qui y a accès une cible."
