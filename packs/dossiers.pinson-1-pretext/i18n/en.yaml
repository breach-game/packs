p1.briefing: "Pinson wants to know whether a stranger can get into its internal tool with a phone as the only weapon. Before you call, you need a believable story. It is already written, on their own site."
p1.obj.status: "Read Pinson's service status page"
p1.obj.tool: "Find out what the support team's internal tool can do"
p1.obj.desk: "Send the internal extension of IT support (`submit`)"
p1.obj.pretext: "Choose the pretext for the call"
p1.q.pretext: "You are calling a support agent who works from home. Which story is most likely to be believed?"
p1.q.pretext.prize: "\"You have won a phone, I need your credentials\""
p1.q.pretext.prize.why: "Nobody is expecting that gift, and everybody has learnt to distrust it. A good pretext answers a problem the person really has."
p1.q.pretext.vpn: "\"This is IT support, we are taking care of your VPN problem\""
p1.q.pretext.boss: "\"I am the director, give me access right now\""
p1.q.pretext.boss.why: "Pressure sometimes works, but it raises suspicion and one call is enough to check it. Help that was expected is not questioned."
p1.ada.brief: "Today you touch nothing, you read. The site is `https://www.pinson.test`: open it in the browser or with `curl`. Look for what is wearing the teams out right now."
p1.ada.g.status: "Start with the status page: `curl https://www.pinson.test/status`."
p1.ada.g.status.standard: "Start with the service status page."
p1.ada.g.tool: "Now the job offer, it describes what support does: `curl https://www.pinson.test/jobs`."
p1.ada.g.tool.standard: "Job offers often describe internal tools. Go and see."
p1.ada.g.desk: "Read the status page again: on which internal extension does IT support answer? Send me that number with `submit`."
p1.ada.g.desk.standard: "Send me the internal extension of IT support with `submit`."
p1.ada.status: "A VPN that has been dropping since Monday, teams at home, and an IT support everyone is waiting for. That is a problem every employee has in mind."
p1.ada.tool: "Read the list carefully. With Volière, a support agent changes the email of an account and turns off its two-factor authentication. Whoever holds Volière holds any account, ministers included."
p1.ada.flag: "Extension 4040. Now you know who employees expect to hear. One question before you pick up the phone."
p1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p1.ada.answer.standard: "Answer my question."
p1.ada.pretext: "Yes. You do not invent a problem, you come with the solution to one that exists. That is what lowers the guard."
p1.ada.done: "You have your story, and you forced nothing: it was all public. Open the debrief, then we make the call."
p1.hint.status.1: "Type `curl https://www.pinson.test/status`."
p1.hint.tool.1: "Type `curl https://www.pinson.test/jobs`."
p1.hint.desk.1: "The number is in the \"Note to staff\" on the status page."
p1.hint.desk.2: "Type `submit 4040`."
p1.debrief.title: "The story was already written"
p1.debrief.lesson: "An honest status page, a precise job offer: nothing secret, and yet enough to prepare a call people believe. Social engineering starts with reading."
p1.debrief.p1: "What a company publishes about its tools, its outages and its habits also serves those who want to pass for it."
p1.debrief.p2: "A good pretext leans on a real worry of the moment: the person wants it to be true."
p1.debrief.p3: "An internal tool that can do anything to any account turns everyone who has access to it into a target."
