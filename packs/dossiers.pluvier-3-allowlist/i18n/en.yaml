p3.briefing: "The thieves are out, but the lock is the same. The settings of Pluvier's account on the warehouse are in `entrepot/compte.yml`. And the ransom demand is waiting for an answer."
p3.obj.keys: "Make a stolen password open nothing"
p3.obj.places: "Open the warehouse only from safe places"
p3.obj.answer: "Answer the ransom demand"
p3.q.answer: "What does Pluvier do about the ransom demand?"
p3.q.answer.refuse: "Refuse, file a complaint, tell the authority and the customers"
p3.q.answer.pay: "Pay, against the promise that the copies will be deleted"
p3.q.answer.wait: "Say nothing, and wait to see whether the data is published"
p3.check.keys: "Second step for humans, key for the service account, secrets changed every 90 days"
p3.check.places: "Service account limited to the reporting server, contractors on managed devices"
p3.check.works: "The audit log stays on"
p3.ada.brief: "Read the settings: `cat entrepot/compte.yml`. Two layers, then the ransom."
p3.ada.g.keys: "First, the keys: `second_factor: required`, `sign_in: key-pair`, `rotation: 90d`. With `sed -i` or `edit entrepot/compte.yml`, then `verify`."
p3.ada.g.keys.standard: "First, make a stolen password, even four years old, open nothing. Then `verify`. To open the file: `edit entrepot/compte.yml`."
p3.ada.keys: "A service account with a key instead of a password: nothing to save in a browser, nothing for living-room spyware to steal."
p3.ada.g.places: "Next, the places: the reporting account only works from its server, `allowed_networks: [10.82.0.25]`. And contractors on managed devices: `devices: managed`. Then `verify`."
p3.ada.g.places.standard: "Next, make the warehouse open only from the machines that need it, and have contractors work on managed devices. Then `verify`."
p3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
p3.ada.ready: "The lock is changed. The thieves' message remains. I leave the decision to you."
p3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
p3.ada.answer.standard: "My question is waiting in the messenger."
p3.ada.refuse: "The soundest choice: nothing guarantees a paid thief deletes anything, and warned customers can be wary of the fake emails that will follow."
p3.ada.pay: "Nothing proves the copies will be deleted, and Pluvier becomes a target that pays. The customers still know nothing."
p3.ada.wait: "During the silence, customers already receive fake booking emails full of accurate details. And the authority will learn it from the press."
p3.ada.done: "A second step, a key, a list of addresses, secrets that change, managed devices. Open the debrief: the real case is at the end."
p3.hint.keys.1: "With the editor: `edit entrepot/compte.yml`, then Ctrl+S. With a command: three lines to change, with `sed -i \"s/old/new/\" entrepot/compte.yml`."
p3.hint.keys.2: "`second_factor: required`, `sign_in: key-pair`, `rotation: 90d`"
p3.hint.places.1: "The reporting server's address is 10.82.0.25."
p3.hint.places.2: "`allowed_networks: [10.82.0.25]` and `devices: managed`, then `verify`."
p3.hint.answer.1: "No answer is wrong. Think of what a thief's promise is worth, and of the customers."
p3.debrief.title: "Safe places"
p3.debrief.lesson: "The warehouse had no flaw. Pluvier's account did: no second step, a password never changed, no address limit. Any one of these three protections would have made the stolen password useless."
p3.debrief.p1: "Require a second step for every human sign-in to data."
p3.debrief.p2: "Give service accounts keys rather than passwords, and change them regularly."
p3.debrief.p3: "Restrict each account to the addresses it should come from."
p3.debrief.p4: "Have contractors work on managed devices, not the family computer."
p3.facts.title: "What really happened: Snowflake, 2024"
p3.facts.p1: "From April 2024, a group Mandiant calls UNC5537 signed in to customer accounts of Snowflake, an online data platform, with stolen credentials."
p3.facts.p2: "The credentials had been stolen by spyware, often on contractors' computers also used for games or downloads. The oldest theft dates back to November 2020."
p3.facts.p3: "At least 79.7% of the accounts used had leaked before; some passwords had not changed in four years."
p3.facts.p4: "Mandiant names three gaps: no second sign-in step, credentials never changed, no list of allowed addresses. Snowflake itself had not been broken into."
p3.facts.p5: "About 165 organisations were notified. The thieves copied large amounts of data, extorted victims and tried to sell it."
