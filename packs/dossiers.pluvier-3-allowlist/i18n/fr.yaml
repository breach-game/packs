p3.briefing: "Les voleurs sont dehors, mais la serrure est la même. Les réglages du compte de Pluvier sur l'entrepôt sont dans `entrepot/compte.yml`. Et la demande de rançon attend une réponse."
p3.obj.keys: "Qu'un mot de passe volé n'ouvre plus rien"
p3.obj.places: "N'ouvrir l'entrepôt que depuis des lieux sûrs"
p3.obj.answer: "Répondre à la demande de rançon"
p3.q.answer: "Que fait Pluvier face à la demande de rançon ?"
p3.q.answer.refuse: "Refuser, porter plainte, prévenir l'autorité et les clients"
p3.q.answer.pay: "Payer, contre la promesse que les copies seront effacées"
p3.q.answer.wait: "Ne rien dire, et attendre de voir si les données sont publiées"
p3.check.keys: "Seconde étape pour les humains, clé pour le compte de service, secrets changés tous les 90 jours"
p3.check.places: "Compte de service limité au serveur des rapports, prestataires sur appareils gérés"
p3.check.works: "Le journal d'audit reste actif"
p3.ada.brief: "Lis les réglages : `cat entrepot/compte.yml`. Deux couches, puis la rançon."
p3.ada.g.keys: "D'abord, les clés : `second_factor: required`, `sign_in: key-pair`, `rotation: 90d`. Avec `sed -i` ou `edit entrepot/compte.yml`, puis `verify`."
p3.ada.g.keys.standard: "D'abord, qu'un mot de passe volé, même vieux de quatre ans, n'ouvre plus rien. Puis `verify`. Pour ouvrir le fichier : `edit entrepot/compte.yml`."
p3.ada.keys: "Un compte de service avec une clé au lieu d'un mot de passe : rien à enregistrer dans un navigateur, rien à voler par un logiciel espion de salon."
p3.ada.g.places: "Ensuite, les lieux : le compte des rapports ne sert que depuis son serveur, `allowed_networks: [10.82.0.25]`. Et les prestataires sur des appareils gérés : `devices: managed`. Puis `verify`."
p3.ada.g.places.standard: "Ensuite, fais que l'entrepôt ne s'ouvre que depuis les machines qui en ont besoin, et que les prestataires travaillent sur des appareils gérés. Puis `verify`."
p3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
p3.ada.ready: "La serrure est changée. Reste le message des voleurs. Je te laisse décider."
p3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
p3.ada.answer.standard: "Ma question t'attend dans la messagerie."
p3.ada.refuse: "Le choix le plus solide : rien ne garantit qu'un voleur payé efface quoi que ce soit, et les clients prévenus peuvent se méfier des faux courriels qui vont suivre."
p3.ada.pay: "Rien ne prouve que les copies seront effacées, et Pluvier devient une cible qui paie. Les clients, eux, ne savent toujours rien."
p3.ada.wait: "Pendant le silence, les clients reçoivent déjà de faux courriels de réservation très bien renseignés. Et l'autorité l'apprendra par la presse."
p3.ada.done: "Une seconde étape, une clé, une liste d'adresses, des secrets qui changent, des appareils gérés. Ouvre le débrief : le vrai cas est à la fin."
p3.hint.keys.1: "Avec l'éditeur : `edit entrepot/compte.yml`, puis Ctrl+S. Avec une commande : trois lignes à changer, avec `sed -i \"s/ancien/nouveau/\" entrepot/compte.yml`."
p3.hint.keys.2: "`second_factor: required`, `sign_in: key-pair`, `rotation: 90d`"
p3.hint.places.1: "Le serveur des rapports a l'adresse 10.82.0.25."
p3.hint.places.2: "`allowed_networks: [10.82.0.25]` et `devices: managed`, puis `verify`."
p3.hint.answer.1: "Aucune réponse n'est fausse. Pense à ce qu'une promesse de voleur vaut, et aux clients."
p3.debrief.title: "Les lieux sûrs"
p3.debrief.lesson: "L'entrepôt n'avait pas de faille. Le compte de Pluvier, si : pas de seconde étape, un mot de passe jamais changé, aucune limite d'adresses. Chacune de ces trois protections aurait suffi à rendre le mot de passe volé inutile."
p3.debrief.p1: "Exiger une seconde étape pour toute connexion humaine aux données."
p3.debrief.p2: "Donner aux comptes de service des clés plutôt que des mots de passe, et les changer régulièrement."
p3.debrief.p3: "Limiter chaque compte aux adresses d'où il doit venir."
p3.debrief.p4: "Faire travailler les prestataires sur des appareils gérés, pas sur l'ordinateur familial."
p3.facts.title: "Ce qui s'est vraiment passé : Snowflake, 2024"
p3.facts.p1: "À partir d'avril 2024, un groupe que Mandiant nomme UNC5537 se connecte aux comptes de clients de Snowflake, une plateforme de données en ligne, avec des identifiants volés."
p3.facts.p2: "Ces identifiants avaient été volés par des logiciels espions, souvent sur des ordinateurs de prestataires qui servaient aussi aux jeux ou aux téléchargements. Le plus ancien vol remonte à novembre 2020."
p3.facts.p3: "Au moins 79,7 % des comptes utilisés avaient déjà fuité auparavant ; certains mots de passe n'avaient pas changé depuis quatre ans."
p3.facts.p4: "Mandiant relève trois manques : pas de seconde étape de connexion, des identifiants jamais changés, aucune liste d'adresses autorisées. Snowflake lui-même n'avait pas été forcé."
p3.facts.p5: "Environ 165 organisations sont prévenues. Les voleurs copient de grandes quantités de données, font chanter les victimes et tentent de les revendre."
