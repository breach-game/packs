d3.briefing: "Le compte de la sauvegarde est coupé, la copie arrêtée. Le directeur veut comprendre avant midi : par où l'attaquant est passé, dans quel ordre, et ce qui change dès aujourd'hui. Ton compte `ir` lit le serveur de sauvegarde ; le groupe des administrateurs t'attend dans `revue/admins.ldif`."
d3.obj.path: "Retracer jusqu'où menait le compte de la sauvegarde"
d3.obj.order: "Remettre les faits dans l'ordre"
d3.obj.review: "Revoir le groupe des administrateurs de l'annuaire"
d3.obj.rotate: "Changer le mot de passe du compte de la sauvegarde"
d3.obj.horaires: "Décider comment l'appli des horaires lira l'annuaire"
d3.path.text: "Par quelles machines le compte svc-sauvegarde menait-il, depuis l'annuaire jusqu'aux copies de tout le système ? Dans l'ordre."
d3.tl.text: "Les faits, du plus ancien au plus récent."
d3.tl.anon: "La liste des comptes et le mot de passe en description sont lus sans compte"
d3.tl.spray: "Un mot de passe est essayé sur chaque compte, depuis une adresse extérieure"
d3.tl.bind: "Le compte de la sauvegarde se connecte à l'annuaire"
d3.tl.ssh: "Le même compte ouvre une session SSH sur le serveur de sauvegarde"
d3.tl.copy: "Le dossier de paie part vers l'adresse extérieure"
d3.tl.cut: "Le compte est désactivé, la session se ferme"
d3.check.svc: "Le compte de la sauvegarde n'est plus administrateur de l'annuaire"
d3.check.former: "L'ancien prestataire n'est plus administrateur de l'annuaire"
d3.check.keep: "Le responsable informatique reste administrateur"
d3.contain.rotate: "Mot de passe de svc-sauvegarde changé et rangé dans le coffre de secrets ; la description de l'annuaire est vidée. Le compte est réactivé avec ce nouveau secret : la sauvegarde de nuit reprend ce soir."
d3.q.horaires: "L'appli des horaires lisait l'annuaire sans compte, et ne marche plus depuis ce matin. Que faire ?"
d3.q.horaires.own: "Lui créer un compte, en lecture sur ou=lignes"
d3.q.horaires.borrow: "Lui prêter le compte de lecture de Ligne Rouge"
d3.q.horaires.borrow.why: "Un compte partagé, c'est un compte dont on ne sait plus qui l'utilise. Et celui-ci disparaît à la fin du mandat."
d3.q.horaires.admin: "La mettre dans le groupe des administrateurs"
d3.q.horaires.admin.why: "C'est exactement l'erreur qu'on vient de corriger avec le compte de la sauvegarde : un compte de service n'a que les droits de ce qu'il fait."
d3.ada.brief: "Commence sur le serveur de sauvegarde : `ssh ir@sauvegarde.ardoise.test`, puis `last`, `journalctl -u ssh` et `cat /etc/sauvegarde/nuit.conf`. La configuration dit où la sauvegarde envoie tout."
d3.ada.g.path: "Le compte venait de l'annuaire, ouvrait le serveur de sauvegarde, et la configuration montre la destination de chaque nuit. Réponds avec `path chemin annuaire sauvegarde stockage` (après `exit`)."
d3.ada.g.path.standard: "Suis le compte de la sauvegarde : où il s'authentifie, où il se connecte, et où ce serveur envoie ses copies. Réponds avec `path chemin <machines…>`."
d3.ada.path: "Annuaire, sauvegarde, stockage. Un compte de service administrateur ouvrait les copies de tout le système : la paie, les partages, l'export de l'annuaire."
d3.ada.g.order: "Affiche les faits avec `timeline faits`, puis donne-les dans l'ordre : `timeline faits <événement>…`, de la lecture anonyme jusqu'à la coupure."
d3.ada.g.order.standard: "Remets les six faits dans l'ordre, du plus ancien au plus récent, avec `timeline faits …`."
d3.ada.order: "L'ordre est juste. Et il montre que tout a commencé bien avant ce matin : le jour où l'annuaire a été lisible sans compte."
d3.ada.g.review: "Dans `revue/admins.ldif`, retire les deux membres qui n'ont rien à faire là : `sed -i \"/uid=svc-sauvegarde/d\" revue/admins.ldif`, puis la même chose pour `uid=ext-prestataire`. Puis `verify`. Ou à la main, dans l'éditeur : `edit revue/admins.ldif`, puis Ctrl+S."
d3.ada.g.review.standard: "Le groupe des administrateurs ne doit garder que le responsable informatique. Corrige le fichier, puis `verify`. Pour ouvrir le fichier : `edit revue/admins.ldif`."
d3.ada.almost: "Pas encore : relis ce que `verify` signale."
d3.ada.review: "Le groupe ne garde qu'un administrateur, une personne, qui se connecte avec son propre compte."
d3.ada.g.rotate: "Le mot de passe du compte de la sauvegarde a été lu par tout le monde : `contain rotate svc-sauvegarde`."
d3.ada.g.rotate.standard: "Le mot de passe du compte de la sauvegarde est public depuis des années. Change-le."
d3.ada.rotated: "Nouveau mot de passe, rangé dans le coffre, plus aucune trace dans l'annuaire."
d3.ada.g.horaires: "De quoi l'appli a-t-elle besoin, exactement ?"
d3.ada.done: "Rapport rendu au directeur : un chemin, six faits, et quatre changements faits aujourd'hui. L'annuaire a vingt ans ; il a eu sa première revue."
d3.hint.path.1: "`cat /etc/sauvegarde/nuit.conf` donne la destination des copies."
d3.hint.path.2: "`path chemin annuaire sauvegarde stockage`"
d3.hint.order.1: "`timeline faits anon spray bind ssh copy cut`"
d3.hint.review.1: "Avec l'éditeur : `edit revue/admins.ldif`, puis Ctrl+S. Avec une commande : `sed -i \"/uid=svc-sauvegarde/d\" revue/admins.ldif` et `sed -i \"/uid=ext-prestataire/d\" revue/admins.ldif`"
d3.hint.review.2: "`verify`"
d3.hint.rotate.1: "`contain rotate svc-sauvegarde`"
d3.hint.horaires.1: "`answer own`"
d3.debrief.title: "Le premier ménage"
d3.debrief.lesson: "Le chemin tenait en trois machines : l'annuaire qui parlait à tous, le serveur de sauvegarde ouvert par un compte administrateur, et le stockage qui reçoit chaque nuit une copie de tout. Rien de savant : des droits jamais revus. Le ménage tient aussi en peu de gestes : un groupe d'administrateurs réduit aux personnes, un secret changé et rangé, et un compte par appli, limité à ce qu'elle lit."
d3.debrief.p1: "Un compte de service a les droits de sa tâche, pas plus, et ne se connecte que depuis ses machines."
d3.debrief.p2: "Les administrateurs sont des personnes nommées, revues chaque trimestre ; un départ ferme le compte le jour même."
d3.debrief.p3: "Retracer un incident jusqu'à sa première cause : ici, un annuaire lisible sans compte, des années avant l'attaque."
