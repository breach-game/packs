d3.briefing: "The backup account is cut off, the copy stopped. The CEO wants to understand before noon: which way the attacker went, in which order, and what changes today. Your `ir` account reads the backup server; the admins group waits for you in `revue/admins.ldif`."
d3.obj.path: "Trace where the backup account led"
d3.obj.order: "Put the events in order"
d3.obj.review: "Review the directory admins group"
d3.obj.rotate: "Change the backup account's password"
d3.obj.horaires: "Decide how the timetable app will read the directory"
d3.path.text: "Through which machines did the svc-sauvegarde account lead, from the directory to the copies of the whole system? In order."
d3.tl.text: "The events, oldest first."
d3.tl.anon: "The account list and the password in a description are read with no account"
d3.tl.spray: "One password is tried on every account, from an outside address"
d3.tl.bind: "The backup account signs in to the directory"
d3.tl.ssh: "The same account opens an SSH session on the backup server"
d3.tl.copy: "The payroll folder leaves for the outside address"
d3.tl.cut: "The account is disabled, the session closes"
d3.check.svc: "The backup account is no longer a directory admin"
d3.check.former: "The former contractor is no longer a directory admin"
d3.check.keep: "The IT manager stays an admin"
d3.contain.rotate: "svc-sauvegarde password changed and stored in the secrets vault; the directory description is emptied. The account is enabled again with this new secret: the nightly backup resumes tonight."
d3.q.horaires: "The timetable app read the directory with no account, and has not worked since this morning. What to do?"
d3.q.horaires.own: "Its own account, read-only on ou=lignes"
d3.q.horaires.borrow: "Lend it Ligne Rouge's own read account"
d3.q.horaires.borrow.why: "A shared account is an account nobody knows who uses any more. And this one disappears when the mandate ends."
d3.q.horaires.admin: "Put it in the admins group"
d3.q.horaires.admin.why: "That is exactly the mistake we just fixed with the backup account: a service account only has the rights of what it does."
d3.ada.brief: "Start on the backup server: `ssh ir@sauvegarde.ardoise.test`, then `last`, `journalctl -u ssh` and `cat /etc/sauvegarde/nuit.conf`. The configuration says where the backup sends everything."
d3.ada.g.path: "The account came from the directory, opened the backup server, and the configuration shows each night's destination. Answer with `path chemin annuaire sauvegarde stockage` (after `exit`)."
d3.ada.g.path.standard: "Follow the backup account: where it authenticates, where it signs in, and where that server sends its copies. Answer with `path chemin <machines…>`."
d3.ada.path: "Directory, backup, storage. An admin service account opened the copies of the whole system: payroll, shares, the directory export."
d3.ada.g.order: "Show the events with `timeline faits`, then give them in order: `timeline faits <event>…`, from the anonymous read to the cut-off."
d3.ada.g.order.standard: "Put the six events in order, oldest first, with `timeline faits …`."
d3.ada.order: "The order is right. And it shows everything started long before this morning: the day the directory became readable with no account."
d3.ada.g.review: "In `revue/admins.ldif`, remove the two members who have no business there: `sed -i \"/uid=svc-sauvegarde/d\" revue/admins.ldif`, then the same for `uid=ext-prestataire`. Then `verify`. Or by hand, in the editor: `edit revue/admins.ldif`, then Ctrl+S."
d3.ada.g.review.standard: "The admins group must keep only the IT manager. Fix the file, then `verify`. To open the file: `edit revue/admins.ldif`."
d3.ada.almost: "Not yet: read again what `verify` reports."
d3.ada.review: "The group keeps one admin, a person, who signs in with their own account."
d3.ada.g.rotate: "The backup account's password was read by everyone: `contain rotate svc-sauvegarde`."
d3.ada.g.rotate.standard: "The backup account's password has been public for years. Change it."
d3.ada.rotated: "New password, stored in the vault, no trace left in the directory."
d3.ada.g.horaires: "What exactly does the app need?"
d3.ada.done: "Report delivered to the CEO: one path, six events, and four changes made today. The directory is twenty years old; it just had its first review."
d3.hint.path.1: "`cat /etc/sauvegarde/nuit.conf` gives the copies' destination."
d3.hint.path.2: "`path chemin annuaire sauvegarde stockage`"
d3.hint.order.1: "`timeline faits anon spray bind ssh copy cut`"
d3.hint.review.1: "With the editor: `edit revue/admins.ldif`, then Ctrl+S. With a command: `sed -i \"/uid=svc-sauvegarde/d\" revue/admins.ldif` and `sed -i \"/uid=ext-prestataire/d\" revue/admins.ldif`"
d3.hint.review.2: "`verify`"
d3.hint.rotate.1: "`contain rotate svc-sauvegarde`"
d3.hint.horaires.1: "`answer own`"
d3.debrief.title: "The first clean-up"
d3.debrief.lesson: "The path took three machines: the directory that talked to everyone, the backup server opened by an admin account, and the storage that receives a copy of everything every night. Nothing clever: rights never reviewed. The clean-up takes few moves too: an admins group reduced to people, a secret changed and stored, and one account per app, limited to what it reads."
d3.debrief.p1: "A service account has the rights of its task, no more, and signs in only from its own machines."
d3.debrief.p2: "Admins are named people, reviewed every quarter; a departure closes the account the same day."
d3.debrief.p3: "Trace an incident back to its first cause: here, a directory readable with no account, years before the attack."
