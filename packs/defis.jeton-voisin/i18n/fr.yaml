d9.briefing: "Ton compte client de test a reçu un jeton d'accès de `sso.polygone.test` en se connectant au portail des clients. Il est dans `jetons/acces.txt`. Le mandat pose une question : l'annuaire interne du personnel, `https://sso.polygone.test/api/interne/annuaire`, accepte-t-il un jeton qui n'a pas été émis pour lui ? Lis le jeton, réponds, et rapporte le marqueur."
d9.obj.audience: "Dire pour quelle application le jeton a été émis"
d9.obj.marker: "Rapporter le marqueur de l'annuaire interne"
d9.obj.fix: "Dire comment l'empêcher"
d9.q.audience: "Pour quelle application (champ `aud`) ce jeton a-t-il été émis ?"
d9.q.fix: "Que doit changer Polygone ?"
d9.q.fix.own: "Chaque API refuse un jeton émis pour une autre audience"
d9.q.fix.shorter: "Réduire la durée de vie des jetons à cinq minutes seulement"
d9.q.fix.shorter.why: "Cinq minutes suffisent largement pour une requête. La durée limite les dégâts d'un vol, elle ne dit pas à qui le jeton était destiné."
d9.q.fix.sealed: "Chiffrer le jeton pour que le client ne puisse plus le lire"
d9.q.fix.sealed.why: "Que le client lise son jeton n'est pas le problème. Le problème est qu'une API l'accepte alors qu'il était destiné à une autre."
d9.ada.brief: "Défi. Pas de consigne de ma part : le briefing, les objectifs, et toi."
d9.ada.done: "Le jeton était vrai, signé, en cours de validité. Il disait simplement « pour le portail des clients », et l'annuaire interne ne l'a pas lu jusque-là."
d9.debrief.title: "Le jeton du voisin"
d9.debrief.lesson: "Un jeton d'accès dit qui l'a émis, pour qui, pour quelle application et pour quoi faire. Une API qui vérifie la signature sans vérifier l'audience accepte les jetons de toutes les applications du même serveur d'accord : un compte client entre chez le personnel."
d9.debrief.p1: "Chaque API vérifie l'émetteur, la signature, l'expiration, l'audience et les droits demandés."
d9.debrief.p2: "Une audience par API, et des droits (`scope`) aussi étroits que la tâche."
d9.debrief.p3: "Tester chaque API avec un jeton valide émis pour une autre : elle doit refuser."
