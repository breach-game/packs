d9.briefing: "Your test customer account received an access token from `sso.polygone.test` when signing in to the customer portal. It is in `jetons/acces.txt`. The mandate asks one question: does the internal staff directory, `https://sso.polygone.test/api/interne/annuaire`, accept a token that was not issued for it? Read the token, answer, and report the marker."
d9.obj.audience: "Say which application the token was issued for"
d9.obj.marker: "Report the internal directory's marker"
d9.obj.fix: "Say how to prevent it"
d9.q.audience: "Which application (the `aud` field) was this token issued for?"
d9.q.fix: "What must Polygone change?"
d9.q.fix.own: "Each API refuses a token whose audience is not its own"
d9.q.fix.shorter: "Cut the lifetime of tokens down to five minutes only"
d9.q.fix.shorter.why: "Five minutes are plenty for one request. Lifetime limits the damage of a theft, it does not say who the token was meant for."
d9.q.fix.sealed: "Encrypt the token so the client can no longer read it"
d9.q.fix.sealed.why: "The client reading its own token is not the problem. The problem is an API accepting it when it was meant for another."
d9.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d9.ada.done: "The token was genuine, signed, still valid. It simply said \"for the customer portal\", and the internal directory never read that far."
d9.debrief.title: "The neighbour's token"
d9.debrief.lesson: "An access token says who issued it, for whom, for which application and to do what. An API that checks the signature without checking the audience accepts tokens from every application of the same authorisation server: a customer account walks into the staff's side."
d9.debrief.p1: "Each API checks the issuer, the signature, the expiry, the audience and the requested rights."
d9.debrief.p2: "One audience per API, and rights (`scope`) as narrow as the task."
d9.debrief.p3: "Test each API with a valid token issued for another: it must refuse."
