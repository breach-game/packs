b2.briefing: "Sunday, 10:00. The permission is removed, but version 3.10.4 installed itself on many users' browsers. Ombrelle pulled the last two versions from the store for you: `versions/`. Before warning anyone, you must know what 3.10.4 does."
b2.obj.file: "Find the file added in 3.10.4"
b2.obj.domain: "Say where it sends what it reads"
b2.obj.publish: "Publish a fixed version"
b2.obj.tell: "Decide what to tell users"
b2.q.file: "Which file does 3.10.4 contain that 3.10.3 does not?"
b2.q.domain: "To which domain does this file send the cookies and page addresses?"
b2.q.tell: "What does Ombrelle tell users?"
b2.q.tell.full: "Everything, at once: what, when, and change your passwords"
b2.q.tell.full.why: "A hard message to write, a few uninstalls, but everyone can close their sessions before they are used."
b2.q.tell.quiet: "Nothing: 3.10.5 replaces 3.10.4 on its own"
b2.q.tell.quiet.why: "The update removes the script, not the cookies already gone. Users stay open without knowing it, and the story will come out anyway."
b2.q.tell.later: "An announcement in a week, once the investigation is done"
b2.q.tell.later.why: "Cleaner on substance, but a week of stolen sessions still valid. Cookies expire, not within a week."
b2.contain.publish: "Publish Garde-Notes 3.10.5 (the 3.10.3 code, without the new permissions) and ask the store to pull 3.10.4"
b2.ada.brief: "Compare the content of both versions: `unzip -l versions/garde-notes-3.10.3.zip` then `unzip -l versions/garde-notes-3.10.4.zip`."
b2.ada.g.file: "One more file in 3.10.4. Read its manifest too: `unzip -p versions/garde-notes-3.10.4.zip manifest.json`. `answer file <name>`."
b2.ada.g.file.standard: "What was added to 3.10.4? `answer file`."
b2.ada.file: "sync.js, run on every page, with the right to read every site's cookies. A notes extension needs none of that."
b2.ada.g.domain: "`unzip -p versions/garde-notes-3.10.4.zip sync.js`. `answer domain <domain>`."
b2.ada.g.domain.standard: "Read the added file without running it. Where does it send? `answer domain`."
b2.ada.domain: "notes-cloudsync.example: the cookies and the address of every page visited. Open sessions, ready to use."
b2.ada.g.publish: "`contain restore garde-notes-3.10.5`."
b2.ada.g.publish.standard: "Replace the trapped version on users' browsers. `contain`."
b2.ada.publish: "3.10.5 published, 3.10.4 pulled. Browsers update within a few hours."
b2.ada.g.tell: "Answer in the messenger or with `answer <option>`. No option is wrong, each has its cost."
b2.ada.done: "Version fixed, access removed, users warned. Ombrelle was not alone: the card tells the real case."
b2.hint.file.1: "`unzip -l` of 3.10.4 lists three files, 3.10.3 two."
b2.hint.file.2: "`answer file sync.js`"
b2.hint.domain.1: "The line `const ENDPOINT = …`."
b2.hint.domain.2: "`answer domain notes-cloudsync.example`"
b2.hint.publish.1: "`contain restore garde-notes-3.10.5`"
b2.hint.tell.1: "Every option completes the objective. Think of the cookies already gone."
b2.debrief.title: "Version 3.10.4"
b2.debrief.lesson: "An extension updates itself, on all its users' browsers, with the rights it asks for. This one also asked for every site's cookies and a script on every page. The store accepted it because it came from the right account. Publishing the fix stops the collection, not what has already left."
b2.debrief.p1: "Compare a new version's permissions with the previous one before publishing, and alert on any addition."
b2.debrief.p2: "As a user: few extensions, and be wary of an update that suddenly asks for access to every site."
b2.debrief.p3: "After a cookie theft, warn fast and invite people to close their sessions, not just to update."
b2.facts.title: "What really happened: Chrome extensions, Christmas 2024"
b2.facts.p1: "At the end of December 2024, several Chrome extensions were hijacked, including the one from the vendor Cyberhaven. According to TechTarget, the compromise dates from 24 December and 36 extensions were affected."
b2.facts.p2: "According to SecurityWeek, a phishing email posing as the Chrome Web Store led an employee to authorise a malicious OAuth application named \"Privacy Policy Extension\"."
b2.facts.p3: "Version 24.10.4 of Cyberhaven's extension, published by the attacker, stayed online for over 24 hours between 25 and 26 December, before being replaced by 24.10.5."
b2.facts.p4: "According to TechTarget, the malicious version was detected on 25 December at 23:54 UTC and removed within the hour. It added files that contact a command server."
