b2.briefing: "Dimanche, 10 h. L'autorisation est retirée, mais la version 3.10.4 s'est installée toute seule chez une grande partie des utilisateurs. Ombrelle t'a sorti les deux dernières versions du magasin : `versions/`. Avant de prévenir qui que ce soit, il faut savoir ce que fait la 3.10.4."
b2.obj.file: "Trouver le fichier ajouté dans la 3.10.4"
b2.obj.domain: "Dire où il envoie ce qu'il lit"
b2.obj.publish: "Publier une version corrigée"
b2.obj.tell: "Décider quoi dire aux utilisateurs"
b2.q.file: "Quel fichier la 3.10.4 contient-elle que la 3.10.3 n'a pas ?"
b2.q.domain: "À quel domaine ce fichier envoie-t-il les cookies et les adresses des pages ?"
b2.q.tell: "Que dit Ombrelle aux utilisateurs ?"
b2.q.tell.full: "Tout, tout de suite : quoi, quand, et changer ses mots de passe"
b2.q.tell.full.why: "Un message difficile à écrire, quelques désinstallations, mais chacun peut fermer ses sessions avant qu'elles servent."
b2.q.tell.quiet: "Rien : la 3.10.5 remplace la 3.10.4 toute seule"
b2.q.tell.quiet.why: "La mise à jour retire le script, pas les cookies déjà partis. Les utilisateurs restent ouverts sans le savoir, et l'histoire sortira quand même."
b2.q.tell.later: "Une annonce dans une semaine, une fois l'enquête terminée"
b2.q.tell.later.why: "Plus propre sur le fond, mais une semaine de sessions volées encore valides. Les cookies se périment, pas en une semaine."
b2.contain.publish: "Publier Garde-Notes 3.10.5 (le code de la 3.10.3, sans les nouvelles permissions) et demander au magasin de retirer la 3.10.4"
b2.ada.brief: "Compare le contenu des deux versions : `unzip -l versions/garde-notes-3.10.3.zip` puis `unzip -l versions/garde-notes-3.10.4.zip`."
b2.ada.g.file: "Un fichier de plus dans la 3.10.4. Lis aussi son manifeste : `unzip -p versions/garde-notes-3.10.4.zip manifest.json`. `answer file <nom>`."
b2.ada.g.file.standard: "Qu'est-ce qui a été ajouté à la 3.10.4 ? `answer file`."
b2.ada.file: "sync.js, lancé sur toutes les pages, avec le droit de lire les cookies de tous les sites. Une extension de notes n'en a pas besoin."
b2.ada.g.domain: "`unzip -p versions/garde-notes-3.10.4.zip sync.js`. `answer domain <domaine>`."
b2.ada.g.domain.standard: "Lis le fichier ajouté sans l'exécuter. Où envoie-t-il ? `answer domain`."
b2.ada.domain: "notes-cloudsync.example : les cookies et l'adresse de chaque page visitée. Des sessions ouvertes, prêtes à servir."
b2.ada.g.publish: "`contain restore garde-notes-3.10.5`."
b2.ada.g.publish.standard: "Remplace la version piégée chez les utilisateurs. `contain`."
b2.ada.publish: "3.10.5 publiée, la 3.10.4 retirée. Les navigateurs se mettent à jour d'ici quelques heures."
b2.ada.g.tell: "Réponds dans la messagerie ou avec `answer <option>`. Aucune option n'est fausse, chacune a son coût."
b2.ada.done: "Version corrigée, accès retiré, utilisateurs prévenus. Ombrelle n'était pas seule : la fiche raconte l'affaire réelle."
b2.hint.file.1: "`unzip -l` de la 3.10.4 liste trois fichiers, la 3.10.3 deux."
b2.hint.file.2: "`answer file sync.js`"
b2.hint.domain.1: "La ligne `const ENDPOINT = …`."
b2.hint.domain.2: "`answer domain notes-cloudsync.example`"
b2.hint.publish.1: "`contain restore garde-notes-3.10.5`"
b2.hint.tell.1: "Toutes les options terminent l'objectif. Pense aux cookies déjà partis."
b2.debrief.title: "La version 3.10.4"
b2.debrief.lesson: "Une extension se met à jour seule, chez tous ses utilisateurs, avec les droits qu'elle demande. Celle-ci a demandé en plus les cookies de tous les sites et un script sur chaque page. Le magasin l'a acceptée parce qu'elle venait du bon compte. Publier la correction arrête la collecte, pas ce qui est déjà parti."
b2.debrief.p1: "Comparer les permissions d'une nouvelle version à la précédente avant de la publier, et alerter sur tout ajout."
b2.debrief.p2: "Côté utilisateur : peu d'extensions, et se méfier d'une mise à jour qui demande soudain l'accès à tous les sites."
b2.debrief.p3: "Après un vol de cookies, prévenir vite et inviter à fermer ses sessions, pas seulement mettre à jour."
b2.facts.title: "Ce qui s'est vraiment passé : extensions Chrome, Noël 2024"
b2.facts.p1: "Fin décembre 2024, plusieurs extensions Chrome sont détournées, dont celle de l'éditeur Cyberhaven. Selon TechTarget, la compromission date du 24 décembre et 36 extensions sont touchées."
b2.facts.p2: "Selon SecurityWeek, un mail d'hameçonnage se faisant passer pour le Chrome Web Store amène un employé à autoriser une application OAuth malveillante nommée « Privacy Policy Extension »."
b2.facts.p3: "La version 24.10.4 de l'extension de Cyberhaven, publiée par l'attaquant, reste en ligne plus de 24 heures entre le 25 et le 26 décembre, avant d'être remplacée par la 24.10.5."
b2.facts.p4: "Selon TechTarget, la version malveillante est détectée le 25 décembre à 23 h 54 UTC et retirée dans l'heure. Elle ajoutait des fichiers qui contactent un serveur de commande."
