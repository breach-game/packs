v1.briefing: "Depuis trois semaines, les ingénieurs de Bouvreuil peuvent utiliser un assistant IA public. L'outil anti-fuite n'a rien bloqué, il a seulement noté. Son export est dans `dossier/dlp-export.txt`, et le journal de la passerelle de sortie est à toi : `soc`."
v1.obj.count: "Compter les codes sources partis chez l'assistant"
v1.obj.leak: "Dire pourquoi c'est une fuite"
v1.obj.rule: "Écrire la règle qui voit les gros envois à l'assistant"
v1.q.code: "Combien de fichiers de code source sont partis chez l'assistant public ?"
v1.q.leak: "Personne n'a publié ces textes. Pourquoi parler de fuite ?"
v1.q.leak.gone: "Ils sont sur les serveurs d'un tiers : gardés, relus ou utilisés, et impossibles à reprendre"
v1.q.leak.forgets: "Ce n'en est pas une : l'assistant oublie tout dès que la conversation se termine"
v1.q.leak.forgets.why: "La conversation est oubliée par la fenêtre, pas par les serveurs. Selon les conditions du service, le texte peut être conservé, relu par des personnes, ou servir à l'entraînement."
v1.q.leak.repeat: "C'en est une seulement si l'assistant répète ces textes à un autre client"
v1.q.leak.repeat.why: "Ce serait pire, mais la fuite a déjà eu lieu : le secret est sorti de Bouvreuil, et Bouvreuil ne décide plus de ce qu'il devient."
v1.ada.brief: "Lis l'export : `cat dossier/dlp-export.txt`. Ne regarde pas qui, regarde quoi."
v1.ada.g.count: "Compte les lignes « source code » de l'export, et donne le nombre : `answer code <nombre>`."
v1.ada.g.count.standard: "Combien de codes sources sont partis ? Réponds avec `answer code`."
v1.ada.count: "Trois codes sources en vingt jours, plus la transcription d'une réunion sur la feuille de route. Aucun ingénieur ne voulait nuire : ils voulaient corriger un bogue, accélérer un programme, faire un compte rendu."
v1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
v1.ada.answer.standard: "Ma question t'attend dans la messagerie."
v1.ada.leak: "Oui. Ce qui est collé dans un assistant public sort de l'entreprise. L'export ne dit que le passé : regardons maintenant ce que voit la passerelle, en direct. `soc logs gateway access`."
v1.ada.g.rule: "Les questions courtes à l'assistant sont normales. Les gros envois, non. Écris dans `regles/gros-envois.yml` : `echo \"path|contains: assistant.example\" >> regles/gros-envois.yml`, puis `echo \"bytes|gte: 8000\" >> regles/gros-envois.yml`, puis `rule test regles/gros-envois.yml`. Ou à la main, dans l'éditeur : `edit regles/gros-envois.yml`, puis Ctrl+S."
v1.ada.g.rule.standard: "Écris une règle dans `regles/gros-envois.yml` qui alerte sur les gros envois à l'assistant public, pas sur les questions courtes ni sur les autres gros transferts. Puis `rule test`. Pour ouvrir le fichier : `edit regles/gros-envois.yml`."
v1.ada.again: "Regarde les fausses alertes : sont-elles des questions courtes, ou de gros transferts vers un autre site ?"
v1.ada.again.standard: "Pas encore. Lis les fausses alertes."
v1.ada.done: "Trois gros envois ce matin, à l'instant où ils partaient. Une alerte ne rattrape rien, mais elle dit à qui parler aujourd'hui, pas dans trois semaines. Demain, on empêche."
v1.hint.count.1: "Dans la colonne de droite, cherche « source code »."
v1.hint.count.2: "`answer code 3`"
v1.hint.leak.1: "Une fois le texte envoyé, qui décide de ce qu'il devient ?"
v1.hint.rule.1: "Deux conditions : la destination, et la taille."
v1.hint.rule.2: "Le champ de la destination est `path`, celui de la taille `bytes`. `|gte` veut dire « au moins »."
v1.hint.rule.3: "`echo \"path|contains: assistant.example\" >> regles/gros-envois.yml`, `echo \"bytes|gte: 8000\" >> regles/gros-envois.yml`, puis `rule test regles/gros-envois.yml`. Ou à la main, dans l'éditeur : `edit regles/gros-envois.yml`, puis Ctrl+S."
v1.debrief.title: "Coller, c'est envoyer"
v1.debrief.lesson: "Personne n'a volé Bouvreuil. Des ingénieurs pressés ont confié du code et une réunion à un service public, pour bien faire. Le secret est sorti par la porte d'entrée, une copie à la fois. Le voir est un premier pas ; l'empêcher sans priver les équipes de l'outil sera le suivant."
v1.debrief.p1: "Ce qu'on colle dans un assistant public quitte l'entreprise, selon les conditions de ce service."
v1.debrief.p2: "Les fuites par assistant sont involontaires : elles naissent de l'envie de bien faire, pas de malveillance."
v1.debrief.p3: "Une règle sur la taille des envois vers un service précis repère les gros copier-coller."
