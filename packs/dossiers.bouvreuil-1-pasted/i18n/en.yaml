v1.briefing: "For three weeks, Bouvreuil's engineers have been allowed to use a public AI assistant. The leak prevention tool blocked nothing, it only took notes. Its export is in `dossier/dlp-export.txt`, and the outbound gateway's log is yours: `soc`."
v1.obj.count: "Count the source code files sent to the assistant"
v1.obj.leak: "Say why it is a leak"
v1.obj.rule: "Write the rule that sees big uploads to the assistant"
v1.q.code: "How many source code files went to the public assistant?"
v1.q.leak: "Nobody published these texts. Why call it a leak?"
v1.q.leak.gone: "They are on a third party's servers: kept, read or used, and impossible to take back"
v1.q.leak.forgets: "It is not one: the assistant forgets everything as soon as the conversation ends"
v1.q.leak.forgets.why: "The conversation is forgotten by the window, not by the servers. Depending on the service's terms, the text may be kept, read by people, or used for training."
v1.q.leak.repeat: "It is one only if the assistant repeats these texts to another customer"
v1.q.leak.repeat.why: "That would be worse, but the leak already happened: the secret left Bouvreuil, and Bouvreuil no longer decides what becomes of it."
v1.ada.brief: "Read the export: `cat dossier/dlp-export.txt`. Do not look at who, look at what."
v1.ada.g.count: "Count the \"source code\" lines in the export, and give the number: `answer code <number>`."
v1.ada.g.count.standard: "How many source code files left? Answer with `answer code`."
v1.ada.count: "Three source code files in twenty days, plus the transcript of a meeting on the roadmap. No engineer meant harm: they wanted to fix a bug, speed up a program, write up minutes."
v1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
v1.ada.answer.standard: "My question is waiting in the messenger."
v1.ada.leak: "Yes. What is pasted into a public assistant leaves the company. The export only tells the past: let us look at what the gateway sees, live. `soc logs gateway access`."
v1.ada.g.rule: "Short questions to the assistant are normal. Big uploads are not. Write in `regles/gros-envois.yml`: `echo \"path|contains: assistant.example\" >> regles/gros-envois.yml`, then `echo \"bytes|gte: 8000\" >> regles/gros-envois.yml`, then `rule test regles/gros-envois.yml`. Or by hand, in the editor: `edit regles/gros-envois.yml`, then Ctrl+S."
v1.ada.g.rule.standard: "Write a rule in `regles/gros-envois.yml` that alerts on big uploads to the public assistant, not on short questions or other big transfers. Then `rule test`. To open the file: `edit regles/gros-envois.yml`."
v1.ada.again: "Look at the false alerts: are they short questions, or big transfers to another site?"
v1.ada.again.standard: "Not yet. Read the false alerts."
v1.ada.done: "Three big uploads this morning, as they left. An alert catches nothing back, but it tells you who to talk to today, not in three weeks. Tomorrow, we prevent."
v1.hint.count.1: "In the right-hand column, look for \"source code\"."
v1.hint.count.2: "`answer code 3`"
v1.hint.leak.1: "Once the text is sent, who decides what becomes of it?"
v1.hint.rule.1: "Two conditions: the destination, and the size."
v1.hint.rule.2: "The destination field is `path`, the size field `bytes`. `|gte` means \"at least\"."
v1.hint.rule.3: "`echo \"path|contains: assistant.example\" >> regles/gros-envois.yml`, `echo \"bytes|gte: 8000\" >> regles/gros-envois.yml`, then `rule test regles/gros-envois.yml`. Or by hand, in the editor: `edit regles/gros-envois.yml`, then Ctrl+S."
v1.debrief.title: "Pasting is sending"
v1.debrief.lesson: "Nobody stole from Bouvreuil. Busy engineers entrusted code and a meeting to a public service, meaning well. The secret left by the front door, one paste at a time. Seeing it is a first step; preventing it without depriving teams of the tool will be the next."
v1.debrief.p1: "What you paste into a public assistant leaves the company, under that service's terms."
v1.debrief.p2: "Leaks through assistants are unintended: they come from wanting to do well, not from malice."
v1.debrief.p3: "A rule on the size of uploads to a given service spots big copy-pastes."
