summary:
  fr: "Une vieille adresse d'API reçoit des milliers de requêtes, chacune pour le client suivant. Tu lis les journaux, tu prouves avec une fiche de test que l'adresse répond sans rien demander, tu écris la règle qui voit ces lectures, puis tu éteins le service."
  en: "An old API address receives thousands of requests, each one for the next customer. You read the logs, prove with a test record that the address answers without asking anything, write the rule that sees these reads, then switch the service off."
