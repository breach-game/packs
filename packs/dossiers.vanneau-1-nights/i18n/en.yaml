c1.briefing: "Tuesday 19 September, 11.10 pm. At Boréal Télécom, the network team sees for the third night odd traffic to a machine nobody recognises: `api-old.boreal.test`. Their message is in your folder. Test record 900001 was created for you: it is the only one you are allowed to read."
c1.obj.next: "Read what this traffic is asking for"
c1.obj.proof: "Prove on the test record that the old address answers anyone"
c1.obj.rule: "Write the rule that sees these reads"
c1.obj.off: "Switch the old service off"
c1.obj.why: "Say what made it possible to take everything"
c1.q.next: "What is the first customer number asked of the old API?"
c1.q.proof: "Which reference does the test record carry, read with no token at all?"
c1.q.why: "The old address gave away millions of records. What made it possible?"
c1.q.why.both: "It does not check who is calling, and the numbers follow each other"
c1.q.why.password: "Its password was too easy to guess"
c1.q.why.password.why: "There is no password to guess: your request carried none, and the record came back anyway."
c1.q.why.speed: "It answers too quickly, with no limit on the number of requests"
c1.q.why.speed.why: "Speed helps, but a slow API that answers anyone ends up emptied too. Look at what your request lacks, and at the sequence of numbers."
c1.contain.off: "Switch off the api-old.boreal.test service (no partner has used it since 2025)"
c1.ada.brief: "Read the network team's message: `cat alerte.txt`. Then look at what reaches the old machine: `soc logs ancien access`."
c1.ada.g.next: "`soc logs ancien access`: read the paths asked for, in order. `answer next <first customer number>`."
c1.ada.g.next.standard: "Read the old API's logs and find what the requests have in common."
c1.ada.next: "100001, then 100002, then 100003. Three addresses taking turns, one number more each time, and always 200. Someone is counting, and the machine answers. Let's check with your test record: first the current API, then the old one."
c1.ada.g.proof: "`curl https://api.boreal.test/v3/clients/900001`, then `curl https://api-old.boreal.test/clients/900001`. Read the `reference` field and `answer proof <reference>`."
c1.ada.g.proof.standard: "Ask both APIs for test record 900001, with no token, and compare."
c1.ada.proof: "The current API refuses: 401, a token is needed. The old one returns the whole record, identity document included, without asking who you are. Before switching it off, write the rule: we will need to know everything that left."
c1.ada.g.rule: "Reads of the old API all start with `/clients/`. `echo \"path|startswith: /clients/\" >> regles/ancienne-api.yml`, then `rule test regles/ancienne-api.yml`."
c1.ada.g.rule.standard: "Write a rule that sees reads of the old API without firing on the current API, whose paths look alike."
c1.ada.again: "Your rule misses a read or fires on the current API. Its paths contain `clients` too, but they start with `/v3/`."
c1.ada.rule: "It sees every record that leaves, and nothing of normal activity. Now we cut."
c1.ada.g.off: "`contain disable api-old`. No partner uses it any more: this time, switching off costs nothing."
c1.ada.g.off.standard: "Switch off the service nobody uses any more. `contain` lists the measures."
c1.ada.off: "Off. The next requests are refused. One question, to be sure you saw what matters."
c1.ada.g.why: "Answer my question. Think of what your own request did not carry."
c1.ada.done: "No clever flaw: a door with no lock, and records numbered in order. Three nights were enough. Tomorrow, the real question: why was this machine still running, and who was meant to look after it?"
c1.hint.next.1: "The paths look like `/clients/<number>`. The first is `/clients/100001`."
c1.hint.next.2: "`answer next 100001`"
c1.hint.proof.1: "`curl https://api-old.boreal.test/clients/900001` returns the test record with its `reference` field."
c1.hint.proof.2: "`answer proof BT-TEST-7Q4K`"
c1.hint.rule.1: "The field is called `path`, and the modifier `|startswith`."
c1.hint.rule.2: "`echo \"path|startswith: /clients/\" >> regles/ancienne-api.yml` then `rule test regles/ancienne-api.yml`"
c1.hint.off.1: "`contain disable api-old`"
c1.hint.why.1: "No token asked for, and numbers that follow each other. `answer both`"
c1.debrief.title: "Three nights in September"
c1.debrief.lesson: "The current API required a token on every request. The old one, left online for a partner long gone, returned any customer's record to whoever asked. And because customers were numbered in order, counting was enough."
c1.debrief.p1: "Every route of an API checks who is calling and whether that record is theirs. No exception for old versions."
c1.debrief.p2: "Identifiers that follow each other turn one readable record into a whole readable database."
c1.debrief.p3: "What is no longer used gets switched off. A machine nobody watches is not harmless: it is only invisible."
