c1.briefing: "Mardi 19 septembre, 23 h 10. Chez Boréal Télécom, l'équipe réseau voit pour la troisième nuit un trafic étrange vers une machine que personne ne reconnaît : `api-old.boreal.test`. Son message est dans ton dossier. La fiche de test 900001 a été créée pour toi : c'est la seule que tu as le droit de lire."
c1.obj.next: "Lire ce que demande ce trafic"
c1.obj.proof: "Prouver sur la fiche de test que l'ancienne adresse répond à n'importe qui"
c1.obj.rule: "Écrire la règle qui voit ces lectures"
c1.obj.off: "Éteindre l'ancien service"
c1.obj.why: "Dire ce qui a permis de tout prendre"
c1.q.next: "Quel est le premier numéro de client demandé à l'ancienne API ?"
c1.q.proof: "Quelle référence porte la fiche de test, lue sans aucun jeton ?"
c1.q.why: "L'ancienne adresse a rendu des millions de fiches. Qu'est-ce qui l'a permis ?"
c1.q.why.both: "Elle ne vérifie pas qui appelle, et les numéros se suivent"
c1.q.why.password: "Son mot de passe était trop simple à deviner"
c1.q.why.password.why: "Il n'y a aucun mot de passe à deviner : ta requête n'en portait pas, et la fiche est revenue quand même."
c1.q.why.speed: "Elle répond trop vite, sans limite du nombre de requêtes"
c1.q.why.speed.why: "La vitesse aide, mais une API lente qui répond à n'importe qui finit vidée aussi. Regarde ce qui manque à ta requête, et la suite des numéros."
c1.contain.off: "Éteindre le service api-old.boreal.test (plus aucun partenaire ne l'utilise depuis 2025)"
c1.ada.brief: "Lis le message de l'équipe réseau : `cat alerte.txt`. Puis regarde ce qui arrive sur la vieille machine : `soc logs ancien access`."
c1.ada.g.next: "`soc logs ancien access` : lis les chemins demandés, dans l'ordre. `answer next <premier numéro de client>`."
c1.ada.g.next.standard: "Lis les journaux de l'ancienne API et trouve ce que les requêtes ont en commun."
c1.ada.next: "100001, puis 100002, puis 100003. Trois adresses qui se relaient, un numéro de plus à chaque fois, et toujours 200. Quelqu'un compte, et la machine répond. Vérifions avec ta fiche de test : d'abord l'API actuelle, puis l'ancienne."
c1.ada.g.proof: "`curl https://api.boreal.test/v3/clients/900001`, puis `curl https://api-old.boreal.test/clients/900001`. Lis le champ `reference` et `answer proof <référence>`."
c1.ada.g.proof.standard: "Demande la fiche de test 900001 aux deux API, sans jeton, et compare."
c1.ada.proof: "L'API actuelle refuse : 401, il faut un jeton. L'ancienne rend la fiche entière, pièce d'identité comprise, sans demander qui tu es. Avant d'éteindre, écris la règle : il faudra savoir tout ce qui est parti."
c1.ada.g.rule: "Les lectures de l'ancienne API commencent toutes par `/clients/`. `echo \"path|startswith: /clients/\" >> regles/ancienne-api.yml`, puis `rule test regles/ancienne-api.yml`."
c1.ada.g.rule.standard: "Écris une règle qui voit les lectures de l'ancienne API, sans sonner sur l'API actuelle, dont les chemins ressemblent."
c1.ada.again: "Ta règle rate une lecture ou sonne sur l'API actuelle. Ses chemins contiennent aussi `clients`, mais ils commencent par `/v3/`."
c1.ada.rule: "Elle voit chaque fiche qui part, et rien de l'activité normale. Maintenant, on coupe."
c1.ada.g.off: "`contain disable api-old`. Plus aucun partenaire ne s'en sert : cette fois, éteindre ne coûte rien."
c1.ada.g.off.standard: "Éteins le service que personne n'utilise plus. `contain` liste les mesures."
c1.ada.off: "Éteint. Les requêtes suivantes sont refusées. Une question, pour être sûre que tu as vu l'essentiel."
c1.ada.g.why: "Réponds à ma question. Pense à ce que ta propre requête ne portait pas."
c1.ada.done: "Aucune faille savante : une porte sans serrure, et des fiches numérotées dans l'ordre. Trois nuits ont suffi. Demain, la vraie question : pourquoi cette machine tournait-elle encore, et qui devait s'en occuper ?"
c1.hint.next.1: "Les chemins sont de la forme `/clients/<numéro>`. Le premier est `/clients/100001`."
c1.hint.next.2: "`answer next 100001`"
c1.hint.proof.1: "`curl https://api-old.boreal.test/clients/900001` rend la fiche de test avec son champ `reference`."
c1.hint.proof.2: "`answer proof BT-TEST-7Q4K`"
c1.hint.rule.1: "Le champ s'appelle `path`, et le modificateur `|startswith`."
c1.hint.rule.2: "`echo \"path|startswith: /clients/\" >> regles/ancienne-api.yml` puis `rule test regles/ancienne-api.yml`"
c1.hint.off.1: "`contain disable api-old`"
c1.hint.why.1: "Pas de jeton demandé, et des numéros qui se suivent. `answer both`"
c1.debrief.title: "Trois nuits de septembre"
c1.debrief.lesson: "L'API actuelle exigeait un jeton à chaque requête. L'ancienne, laissée en ligne pour un partenaire parti depuis longtemps, rendait la fiche de n'importe quel client à qui la demandait. Et comme les clients étaient numérotés dans l'ordre, il suffisait de compter."
c1.debrief.p1: "Chaque route d'une API vérifie qui appelle et si cette fiche est la sienne. Aucune exception pour les vieilles versions."
c1.debrief.p2: "Des identifiants qui se suivent transforment une fiche lisible en base entière lisible."
c1.debrief.p3: "Ce qui n'est plus utilisé s'éteint. Une machine que personne ne surveille n'est pas inoffensive : elle est seulement invisible."
