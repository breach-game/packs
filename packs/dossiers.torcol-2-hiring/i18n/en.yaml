t2.briefing: "Tuesday 16 March. The new employee has not called back. HR opened his file for you: `rh/`, and logistics the laptop's shipment: `logistique/`. Everything looked in order. You must find where the hiring could have stopped."
t2.obj.photo: "Read what the profile photo says"
t2.obj.address: "Compare the delivery address with the identity document's"
t2.obj.order: "Put the hiring back in order"
t2.obj.process: "Choose what changes in the process"
t2.q.photo: "According to `exiftool`, which software edited the profile photo?"
t2.q.address: "In which town was the laptop delivered?"
t2.tl.text: "Put the hiring back in order, from the oldest step to the most recent."
t2.tl.interviews: "Four video interviews, camera on"
t2.tl.idscan: "Identity document received by email, as a scan"
t2.tl.check: "Background check: valid identity, no record"
t2.tl.redirect: "The candidate asks by email for another delivery address"
t2.tl.delivered: "Laptop delivered to a forwarding warehouse, signed \"A. M.\""
t2.tl.alert: "First power-on, security agent alerts"
t2.q.process: "What does Hublot change in its remote hiring?"
t2.q.process.inperson: "An in-person meeting with the identity document before day one"
t2.q.process.inperson.why: "The safest, and the most expensive: a trip for every remote hire. Some good candidates will give up."
t2.q.process.shipping: "Ship the laptop only to the identity document's address"
t2.q.process.shipping.why: "Cheap, and it would have stopped this hire. A well-organised fake candidate can still provide a consistent address."
t2.q.process.probation: "Limited access the first week, widened after a video call"
t2.q.process.probation.why: "Limits the damage without slowing hiring, but does not prevent it: a laptop is still delivered to someone you are not sure of."
t2.ada.brief: "Read the file: `cat rh/dossier-morel.txt`. Then look at the profile photo with `exiftool rh/photo-profil.jpg`."
t2.ada.g.photo: "`exiftool rh/photo-profil.jpg`, the Software line. `answer photo <software>`."
t2.ada.g.photo.standard: "A profile photo can be read too. `answer photo`."
t2.ada.photo: "A stock portrait, face edited by software. The person in the interviews looked like the photo, not the other way round."
t2.ada.g.address: "`cat logistique/expedition-2027-0311-07.txt`, and compare with the HR file. `answer address <town>`."
t2.ada.g.address.standard: "Where did the laptop go? `answer address`."
t2.ada.address: "Bordeaux on the identity document, a forwarding warehouse in Lomme for the laptop. The identity was real: stolen."
t2.ada.g.order: "`timeline hiring <step> <step>…` with the ids: interviews, idscan, check, redirect, delivered, alert, in the right order."
t2.ada.g.order.standard: "Put the steps in order. `timeline hiring`."
t2.ada.order: "Every step was passed. None compared two pieces of information with each other."
t2.ada.g.process: "Answer in the messenger or with `answer <option>`. No option is wrong, each has its cost."
t2.ada.done: "Hublot knows where the hiring could have stopped. The card tells the real case."
t2.hint.photo.1: "`Software : FaceBlend AI 2.4`."
t2.hint.photo.2: "`answer photo FaceBlend AI 2.4`"
t2.hint.address.1: "`Delivery address: … 59160 Lomme`."
t2.hint.address.2: "`answer address Lomme`"
t2.hint.order.1: "The dates are in the HR file and in the shipment."
t2.hint.order.2: "`timeline hiring interviews idscan check redirect delivered alert`"
t2.hint.process.1: "Every option completes the objective. Look at what each one would have stopped."
t2.debrief.title: "The hiring, backwards"
t2.debrief.lesson: "Every check was made, and each one passed: the identity was real, but stolen, the person in the interviews looked like an edited photo, and the laptop went to a forwarding warehouse at the candidate's request. What was missing was comparing the pieces of information with each other."
t2.debrief.p1: "Compare the identity document, the person seen on video and the delivery address: none is enough alone."
t2.debrief.p2: "Deliver equipment to the verified address, never to an address given by email at the last minute."
t2.debrief.p3: "Treat a new laptop as an entry point: security agent running and reduced access in the first days."
t2.facts.title: "What really happened: KnowBe4, 2024"
t2.facts.p1: "On 23 July 2024, the vendor KnowBe4 told how it had hired a software engineer who turned out to be a fake North Korean IT worker."
t2.facts.p2: "The candidate had passed four video interviews. He used a valid but stolen US identity, and a stock photo edited with AI."
t2.facts.p3: "As soon as his workstation arrived, it started loading malware. Suspicious activity began around 9:55 pm EST, the security agent alerted, and the workstation was contained around 10:20 pm."
t2.facts.p4: "According to KnowBe4, no data was lost, compromised or exfiltrated. The vendor published the story so that other companies check their hiring."
