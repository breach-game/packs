t2.briefing: "Mardi 16 mars. Le nouvel employé n'a pas rappelé. Les ressources humaines t'ont ouvert son dossier : `rh/`, et la logistique l'expédition du portable : `logistique/`. Tout semblait en règle. Il faut trouver où l'embauche aurait pu s'arrêter."
t2.obj.photo: "Lire ce que dit la photo du profil"
t2.obj.address: "Comparer l'adresse de livraison à celle de la pièce d'identité"
t2.obj.order: "Remettre l'embauche dans l'ordre"
t2.obj.process: "Choisir ce qui change dans le processus"
t2.q.photo: "D'après `exiftool`, quel logiciel a retouché la photo du profil ?"
t2.q.address: "Dans quelle ville le portable a-t-il été livré ?"
t2.tl.text: "Remets l'embauche dans l'ordre, de la plus ancienne étape à la plus récente."
t2.tl.interviews: "Quatre entretiens en visio, caméra allumée"
t2.tl.idscan: "Pièce d'identité reçue par mail, en scan"
t2.tl.check: "Vérification d'antécédents : identité valide, aucun antécédent"
t2.tl.redirect: "Le candidat demande par mail une autre adresse de livraison"
t2.tl.delivered: "Portable livré à un entrepôt relais, signé « A. M. »"
t2.tl.alert: "Premier allumage, alertes de l'agent de sécurité"
t2.q.process: "Que change Hublot dans ses embauches à distance ?"
t2.q.process.inperson: "Une rencontre en personne avec la pièce d'identité avant l'arrivée"
t2.q.process.inperson.why: "Le plus sûr, et le plus cher : un déplacement pour chaque embauche à distance. Certains bons candidats renonceront."
t2.q.process.shipping: "Livrer le poste uniquement à l'adresse de la pièce d'identité"
t2.q.process.shipping.why: "Peu coûteux, et ça aurait arrêté cette embauche-ci. Un faux candidat bien organisé pourra encore fournir une adresse cohérente."
t2.q.process.probation: "Des accès limités la première semaine, élargis après un appel vidéo"
t2.q.process.probation.why: "Limite les dégâts sans ralentir l'embauche, mais ne l'empêche pas : un poste reste livré à quelqu'un dont on n'est pas sûr."
t2.ada.brief: "Lis le dossier : `cat rh/dossier-morel.txt`. Puis regarde la photo du profil avec `exiftool rh/photo-profil.jpg`."
t2.ada.g.photo: "`exiftool rh/photo-profil.jpg`, la ligne Software. `answer photo <logiciel>`."
t2.ada.g.photo.standard: "Une photo de profil se lit aussi. `answer photo`."
t2.ada.photo: "Un portrait de banque d'images, visage retouché par un logiciel. La personne des entretiens ressemblait à la photo, pas l'inverse."
t2.ada.g.address: "`cat logistique/expedition-2027-0311-07.txt`, et compare avec le dossier RH. `answer address <ville>`."
t2.ada.g.address.standard: "Où est allé le portable ? `answer address`."
t2.ada.address: "Bordeaux sur la pièce d'identité, un entrepôt relais à Lomme pour le portable. L'identité était vraie : volée."
t2.ada.g.order: "`timeline hiring <étape> <étape>…` avec les identifiants : interviews, idscan, check, redirect, delivered, alert, dans le bon ordre."
t2.ada.g.order.standard: "Remets les étapes dans l'ordre. `timeline hiring`."
t2.ada.order: "Chaque étape a été passée. Aucune n'a comparé deux informations entre elles."
t2.ada.g.process: "Réponds dans la messagerie ou avec `answer <option>`. Aucune option n'est fausse, chacune a son coût."
t2.ada.done: "Hublot sait où l'embauche aurait pu s'arrêter. La fiche raconte le cas réel."
t2.hint.photo.1: "`Software : FaceBlend AI 2.4`."
t2.hint.photo.2: "`answer photo FaceBlend AI 2.4`"
t2.hint.address.1: "`Delivery address: … 59160 Lomme`."
t2.hint.address.2: "`answer address Lomme`"
t2.hint.order.1: "Les dates sont dans le dossier RH et dans l'expédition."
t2.hint.order.2: "`timeline hiring interviews idscan check redirect delivered alert`"
t2.hint.process.1: "Toutes les options terminent l'objectif. Regarde ce que chacune aurait arrêté."
t2.debrief.title: "L'embauche, à l'envers"
t2.debrief.lesson: "Chaque contrôle a été fait, et chacun est passé : l'identité était vraie, mais volée, la personne des entretiens ressemblait à une photo retouchée, et le portable est parti vers un entrepôt relais à la demande du candidat. Ce qui manquait, c'était de comparer les informations entre elles."
t2.debrief.p1: "Comparer la pièce d'identité, la personne vue en visio et l'adresse de livraison : aucune ne suffit seule."
t2.debrief.p2: "Livrer le matériel à l'adresse vérifiée, jamais à une adresse donnée par mail au dernier moment."
t2.debrief.p3: "Traiter un poste neuf comme une porte d'entrée : agent de sécurité actif et accès réduits les premiers jours."
t2.facts.title: "Ce qui s'est vraiment passé : KnowBe4, 2024"
t2.facts.p1: "Le 23 juillet 2024, l'éditeur KnowBe4 raconte avoir embauché un ingénieur logiciel qui s'est révélé être un faux informaticien nord-coréen."
t2.facts.p2: "Le candidat avait passé quatre entretiens en visio. Il utilisait une identité américaine valide mais volée, et une photo de banque d'images retouchée par IA."
t2.facts.p3: "Dès réception de son poste de travail, celui-ci commence à charger un logiciel malveillant. L'activité suspecte commence vers 21 h 55 (heure de l'Est américain), l'agent de sécurité alerte, et le poste est contenu vers 22 h 20."
t2.facts.p4: "Selon KnowBe4, aucune donnée n'a été perdue, compromise ni exfiltrée. L'éditeur a publié l'histoire pour que d'autres entreprises vérifient leurs embauches."
