c2.briefing: "Monday 13 December, 9.30 am. The accounts opened from outside are closed. But while pulling the exports, Lucarne's security team found something else: customer videos opened from inside the company. Its note and the storage server's records are in `interne/`."
c2.obj.viewer: "Find the internal account that watches far too much"
c2.obj.noticket: "Count the viewings with no support ticket"
c2.obj.why: "Say why it was possible"
c2.obj.rights: "Rewrite the access rights to videos"
c2.obj.tell: "Decide how to tell the customers"
c2.q.viewer: "Which internal account opened the most customer videos this week?"
c2.q.noticket: "How many viewings have no support ticket to justify them?"
c2.q.why: "How could a contractor account open these videos?"
c2.q.why.everyone: "All staff had access by default, contractors included"
c2.q.why.stolen: "They stole a support agent's password"
c2.q.why.stolen.why: "The records show their own account, `presta-22`, with its own role. They did not need to steal any access: they already had it."
c2.q.why.shared: "The customers had shared their cameras with support"
c2.q.why.shared.why: "None of these viewings has a ticket: no customer asked for anything. Read `default_access` in `interne/acces-video.yml`."
c2.q.tell: "Seventeen customers were watched at home by a Lucarne account. How do you tell them?"
c2.q.tell.each: "Write to each of the seventeen, this week, with what was seen"
c2.q.tell.notice: "Publish a general notice, without telling each of them"
c2.q.tell.later: "Wait for the end of the internal inquiry before saying anything"
c2.check.default: "Nobody has access to videos by default"
c2.check.consent: "Support opens a video only with a ticket and the customer's consent"
c2.check.log: "Every viewing is logged"
c2.check.bulk: "Viewings in bulk raise an alert"
c2.check.works: "Support can still work"
c2.ada.brief: "Read the note: `cat interne/note.txt`. Then count who opens what: `cut -d, -f2 interne/lectures.csv | sort | uniq -c`."
c2.ada.g.viewer: "The second column of `interne/lectures.csv` is the account. `cut -d, -f2 interne/lectures.csv | sort | uniq -c` counts them. `answer viewer <account>`."
c2.ada.g.viewer.standard: "Count the viewings per account in `interne/lectures.csv` and find the one that stands out."
c2.ada.viewer: "`presta-22`, a contractor account: seventeen viewings when support makes two or three. And look at the `camera` column. Support opens doorbells and gardens. This one, bedrooms and living rooms."
c2.ada.g.noticket: "The last column is the ticket, `-` when there is none. `grep -c \",-\" interne/lectures.csv`, then `answer noticket <number>`."
c2.ada.g.noticket.standard: "Count the viewings that nothing justifies."
c2.ada.noticket: "Seventeen, and they are all that account's. No customer had asked for anything. Before fixing, read the rights: `cat interne/acces-video.yml`. One question."
c2.ada.g.why: "`cat interne/acces-video.yml`, then answer my question."
c2.ada.why: "Yes. Nobody forced anything: it was allowed. And with no log in the console, nobody could see it. We only have these records because the storage server keeps its own."
c2.ada.g.rights: "Each line of `interne/acces-video.yml` gives its possible values after the `#`. Pick the strictest one for each with `sed -i` or `edit`, then `verify`."
c2.ada.g.rights.standard: "Fix `interne/acces-video.yml`, then run `verify`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.rights: "No more default access, a ticket and the customer's consent for each video, a log, an alert. The `presta-22` account is suspended by Lucarne: their decision and their inquiry. One decision is left, and it is yours."
c2.ada.g.tell: "No answer is wrong: each one costs Lucarne and its customers something different."
c2.ada.done: "Noted. A camera at home is a matter of trust: in your password, and in those who run the service. The next card tells the real case this file is inspired by."
c2.hint.viewer.1: "`cut -d, -f2 interne/lectures.csv | sort | uniq -c`: one account has seventeen lines."
c2.hint.viewer.2: "`answer viewer presta-22`"
c2.hint.noticket.1: "`grep -c \",-\" interne/lectures.csv`"
c2.hint.noticket.2: "`answer noticket 17`"
c2.hint.why.1: "`default_access: all-staff-and-contractors`. `answer everyone`"
c2.hint.rights.1: "The expected values: `none`, `ticket-and-customer-consent`, `on`, `on`."
c2.hint.rights.2: "For example `sed -i \"s/access_log: off/access_log: on/\" interne/acces-video.yml`, one line at a time."
c2.debrief.title: "Who is watching?"
c2.debrief.lesson: "The second problem did not come from outside. All staff, contractors included, could open any customer video, and nothing recorded who did. An access that everyone has, and nobody watches, ends up used for what it was never meant for."
c2.debrief.p1: "No default access to customer data: a need, a ticket, the customer's consent, for a limited time."
c2.debrief.p2: "Log every access, and read those logs: what is not recorded cannot be discovered."
c2.debrief.p3: "Alert on access in bulk and on access that nothing justifies."
c2.facts.title: "What really happened: Ring, 2017 to 2019"
c2.facts.p1: "On 31 May 2023, the US consumer protection agency (FTC) charges Ring, a maker of connected doorbells and cameras bought by Amazon, with failing to protect its customers' videos."
c2.facts.p2: "According to the FTC, Ring had suffered several credential stuffing attacks in 2017 and 2018 without responding to them. Intruders thereby got access to the accounts, videos and cameras of about 55,000 US customers."
c2.facts.p3: "Intruders used the cameras' microphone to harass, threaten and insult people in their homes. Ring did not offer multi-factor authentication until 2019."
c2.facts.p4: "The FTC also says Ring let any employee or contractor access customers' private videos, with no basic measure to monitor that access. One employee watched thousands of recordings over several months."
c2.facts.p5: "The settlement requires Ring to pay 5.8 million dollars. In April 2024, the FTC sent more than 5.6 million dollars in refunds, in 117,044 payments."
