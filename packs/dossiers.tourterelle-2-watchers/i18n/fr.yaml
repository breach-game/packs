c2.briefing: "Lundi 13 décembre, 9 h 30. Les comptes ouverts de l'extérieur sont fermés. Mais en sortant les exports, l'équipe sécurité de Lucarne a trouvé autre chose : des vidéos de clients ouvertes depuis l'intérieur de l'entreprise. Sa note et les relevés du serveur de stockage sont dans `interne/`."
c2.obj.viewer: "Trouver le compte interne qui regarde beaucoup trop"
c2.obj.noticket: "Compter les lectures sans ticket de support"
c2.obj.why: "Dire pourquoi c'était possible"
c2.obj.rights: "Réécrire les droits d'accès aux vidéos"
c2.obj.tell: "Décider comment le dire aux clients"
c2.q.viewer: "Quel compte interne a ouvert le plus de vidéos de clients cette semaine ?"
c2.q.noticket: "Combien de lectures n'ont aucun ticket de support pour les justifier ?"
c2.q.why: "Comment un compte de prestataire a-t-il pu ouvrir ces vidéos ?"
c2.q.why.everyone: "Tout le personnel y avait accès par défaut, prestataires compris"
c2.q.why.stolen: "Il a volé le mot de passe d'un agent du support"
c2.q.why.stolen.why: "Les relevés montrent son propre compte, `presta-22`, avec son propre rôle. Il n'a eu besoin de voler aucun accès : il l'avait déjà."
c2.q.why.shared: "Les clients avaient partagé leurs caméras avec le support"
c2.q.why.shared.why: "Aucune de ces lectures n'a de ticket : aucun client n'a rien demandé. Lis `default_access` dans `interne/acces-video.yml`."
c2.q.tell: "Dix-sept clients ont été regardés chez eux par un compte de Lucarne. Comment le leur dire ?"
c2.q.tell.each: "Écrire à chacun des dix-sept, cette semaine, avec ce qui a été vu"
c2.q.tell.notice: "Publier un avis général, sans prévenir chacun"
c2.q.tell.later: "Attendre la fin de l'enquête interne avant de dire quoi que ce soit"
c2.check.default: "Personne n'a accès aux vidéos par défaut"
c2.check.consent: "Le support n'ouvre une vidéo qu'avec un ticket et l'accord du client"
c2.check.log: "Chaque lecture est journalisée"
c2.check.bulk: "Des lectures en nombre déclenchent une alerte"
c2.check.works: "Le support peut toujours travailler"
c2.ada.brief: "Lis la note : `cat interne/note.txt`. Puis compte qui ouvre quoi : `cut -d, -f2 interne/lectures.csv | sort | uniq -c`."
c2.ada.g.viewer: "La deuxième colonne de `interne/lectures.csv` est le compte. `cut -d, -f2 interne/lectures.csv | sort | uniq -c` les compte. `answer viewer <compte>`."
c2.ada.g.viewer.standard: "Compte les lectures par compte dans `interne/lectures.csv` et trouve celui qui sort du lot."
c2.ada.viewer: "`presta-22`, un compte de prestataire : dix-sept lectures quand le support en fait deux ou trois. Et regarde la colonne `camera`. Le support ouvre des sonnettes et des jardins. Lui, des chambres et des salons."
c2.ada.g.noticket: "La dernière colonne est le ticket, `-` quand il n'y en a pas. `grep -c \",-\" interne/lectures.csv`, puis `answer noticket <nombre>`."
c2.ada.g.noticket.standard: "Compte les lectures que rien ne justifie."
c2.ada.noticket: "Dix-sept, et ce sont les siennes. Aucun client n'avait rien demandé. Avant de corriger, lis les droits : `cat interne/acces-video.yml`. Une question."
c2.ada.g.why: "`cat interne/acces-video.yml`, puis réponds à ma question."
c2.ada.why: "Oui. Personne n'a rien forcé : c'était permis. Et sans journal dans la console, personne ne pouvait le voir. On n'a ces relevés que parce que le serveur de stockage garde les siens."
c2.ada.g.rights: "Chaque ligne de `interne/acces-video.yml` donne ses valeurs possibles après le `#`. Il en faut quatre : `none`, `ticket-and-customer-consent`, `on`, `on`. Change-les avec `edit interne/acces-video.yml` ou `sed -i`, puis `verify`."
c2.ada.g.rights.standard: "Corrige `interne/acces-video.yml`, puis lance `verify`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.rights: "Plus d'accès par défaut, un ticket et l'accord du client pour chaque vidéo, un journal, une alerte. Le compte fautif sera suspendu par Lucarne : leur décision, leur enquête. Une décision te revient aussi."
c2.ada.g.tell: "Aucune réponse n'est fausse : chacune coûte quelque chose de différent à Lucarne et à ses clients."
c2.ada.done: "Noté. Une caméra chez soi, c'est de la confiance : dans son mot de passe, et dans ceux qui tiennent le service. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
c2.hint.viewer.1: "`cut -d, -f2 interne/lectures.csv | sort | uniq -c` : un compte a dix-sept lignes."
c2.hint.viewer.2: "`answer viewer presta-22`"
c2.hint.noticket.1: "`grep -c \",-\" interne/lectures.csv`"
c2.hint.noticket.2: "`answer noticket 17`"
c2.hint.why.1: "`default_access: all-staff-and-contractors`. `answer everyone`"
c2.hint.rights.1: "Les valeurs attendues : `none`, `ticket-and-customer-consent`, `on`, `on`."
c2.hint.rights.2: "Par exemple `sed -i \"s/access_log: off/access_log: on/\" interne/acces-video.yml`, une ligne à la fois."
c2.debrief.title: "Qui regarde ?"
c2.debrief.lesson: "Le second problème ne venait pas de l'extérieur. Tout le personnel, prestataires compris, pouvait ouvrir n'importe quelle vidéo de client, et rien ne notait qui le faisait. Un accès que tout le monde a, et que personne ne surveille, finit par servir à ce pour quoi il n'était pas fait."
c2.debrief.p1: "Aucun accès par défaut aux données des clients : un besoin, un ticket, l'accord du client, pour une durée limitée."
c2.debrief.p2: "Journaliser chaque accès, et relire ces journaux : ce qui n'est pas noté ne peut pas être découvert."
c2.debrief.p3: "Alerter sur les accès en nombre et sur ceux que rien ne justifie."
c2.facts.title: "Ce qui s'est vraiment passé : Ring, 2017 à 2019"
c2.facts.p1: "Le 31 mai 2023, l'autorité américaine de protection des consommateurs (FTC) accuse Ring, fabricant de sonnettes et de caméras connectées racheté par Amazon, d'avoir mal protégé les vidéos de ses clients."
c2.facts.p2: "Selon la FTC, Ring avait subi plusieurs attaques par bourrage d'identifiants en 2017 et 2018, sans y répondre. Des intrus ont ainsi eu accès aux comptes, aux vidéos et aux caméras d'environ 55 000 clients américains."
c2.facts.p3: "Des intrus ont utilisé le micro des caméras pour harceler, menacer et insulter des personnes chez elles. Ring n'a proposé l'authentification à plusieurs facteurs qu'en 2019."
c2.facts.p4: "La FTC reproche aussi à Ring d'avoir laissé tout employé ou prestataire accéder aux vidéos privées des clients, sans mesure de base pour surveiller ces accès. Un employé a regardé pendant des mois des milliers d'enregistrements."
c2.facts.p5: "L'accord impose à Ring de verser 5,8 millions de dollars. En avril 2024, la FTC a envoyé plus de 5,6 millions de dollars de remboursements, en 117 044 paiements."
