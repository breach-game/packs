p2.briefing: "Le compte svc-rapports est utilisé en ce moment, et pas depuis le serveur des rapports. Le journal d'audit de l'entrepôt est à toi : `soc`. Les mesures possibles : `contain`."
p2.obj.stop: "Arrêter les copies"
p2.obj.why: "Dire ce qui arrête vraiment les voleurs"
p2.obj.rule: "Écrire la règle qui voit une lecture massive du compte de service"
p2.q.why: "Pourquoi bloquer l'adresse du voleur ne suffisait pas ?"
p2.q.why.account: "Ils changent d'adresse, mais gardent le même compte"
p2.q.why.slow: "Le blocage d'une adresse prend des heures à s'appliquer"
p2.q.why.slow.why: "Le blocage est immédiat. Mais la copie suivante arrive d'une autre adresse, avec le même compte."
p2.q.why.fine: "Il suffisait, mais coûtait trop cher à Pluvier"
p2.q.why.fine.why: "Il ne coûte rien, et il n'arrête rien : les voleurs passent par d'autres adresses."
p2.contain.revoke: "Révoquer le mot de passe de svc-rapports (le rapport de cette nuit attendra une clé neuve)"
p2.contain.block: "Bloquer l'adresse 203.0.113.66"
p2.contain.isolate: "Couper tout l'entrepôt (plus aucune agence ne voit ses réservations)"
p2.ada.brief: "Regarde l'audit : `soc logs warehouse db`. Qui lit quoi, depuis où ?"
p2.ada.bookings: "Toute la table des réservations, depuis une adresse inconnue, avec le compte des rapports. Deux millions de lignes."
p2.ada.customers: "La table des clients maintenant, et depuis une autre adresse. Même compte."
p2.ada.cards: "Ils lisent les paiements. Arrête-les."
p2.ada.blocked: "Adresse bloquée. Regarde la prochaine ligne : vient-elle encore de là ?"
p2.ada.g.stop: "Les adresses changent, le compte reste. Révoque-le : `contain revoke svc-rapports`. Le rapport de cette nuit attendra, c'est un petit prix."
p2.ada.g.stop.standard: "Arrête les copies avec la mesure qui vise ce qu'ils ont volé, pas l'endroit d'où ils viennent. `contain` pour la liste."
p2.ada.stopped: "Le compte ne s'ouvre plus. La copie suivante s'arrête net."
p2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
p2.ada.answer.standard: "Ma question t'attend dans la messagerie."
p2.ada.why: "Un identifiant volé voyage avec les voleurs. C'est lui qu'on coupe. Maintenant, une règle pour la prochaine fois : le compte des rapports ne lit jamais plus de quelques dizaines de lignes."
p2.ada.g.rule: "Dans `regles/lecture-massive.yml` : `echo \"user: svc-rapports\" >> regles/lecture-massive.yml`, puis `echo \"rows|gte: 100000\" >> regles/lecture-massive.yml`, puis `rule test regles/lecture-massive.yml`. Ou à la main, dans l'éditeur : `edit regles/lecture-massive.yml`, puis Ctrl+S."
p2.ada.g.rule.standard: "Écris dans `regles/lecture-massive.yml` une règle qui voit le compte des rapports lire des tables entières, sans sonner pour les analystes. Puis `rule test`. Pour ouvrir le fichier : `edit regles/lecture-massive.yml`."
p2.ada.again: "Lis les fausses alertes : qui lit beaucoup d'ordinaire ? Le compte des rapports, lui, ne lit que des totaux."
p2.ada.again.standard: "Pas encore. Lis les fausses alertes."
p2.ada.done: "Les adresses changeaient, le compte restait. Un compte de service sans seconde étape, sans limite d'adresses, au mot de passe vieux de quatre ans : la clé parfaite. Reste à changer la serrure."
p2.hint.stop.1: "`contain` liste les mesures et leur coût."
p2.hint.stop.2: "`contain revoke svc-rapports`"
p2.hint.why.1: "Compare les adresses des lignes de svc-rapports qui ne viennent pas de 10.82.0.25."
p2.hint.rule.1: "Deux conditions : quel compte, et combien de lignes."
p2.hint.rule.2: "Le champ du compte est `user`, celui du nombre de lignes `rows`. `|gte` veut dire « au moins »."
p2.hint.rule.3: "`echo \"user: svc-rapports\" >> regles/lecture-massive.yml`, `echo \"rows|gte: 100000\" >> regles/lecture-massive.yml`, puis `rule test regles/lecture-massive.yml`. Ou à la main, dans l'éditeur : `edit regles/lecture-massive.yml`, puis Ctrl+S."
p2.debrief.title: "Sans seconde étape"
p2.debrief.lesson: "Les voleurs n'ont rien forcé : ils se sont connectés avec un vrai mot de passe, depuis des adresses changeantes. Bloquer une adresse ne les gênait pas ; révoquer le compte les a arrêtés. Et un compte de service qui lit des tables entières, alors qu'il ne lit d'ordinaire que des totaux, se voit tout de suite."
p2.debrief.p1: "Contre un identifiant volé, révoquer l'identifiant, pas l'adresse."
p2.debrief.p2: "Connaître ce qu'un compte de service fait d'ordinaire, et alerter sur tout le reste."
p2.debrief.p3: "Limiter les comptes de service aux adresses des serveurs qui s'en servent."
