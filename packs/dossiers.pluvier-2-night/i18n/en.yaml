p2.briefing: "The svc-rapports account is in use right now, and not from the reporting server. The warehouse's audit log is yours: `soc`. The possible measures: `contain`."
p2.obj.stop: "Stop the copies"
p2.obj.why: "Say what really stops the thieves"
p2.obj.rule: "Write the rule that sees a bulk read by the service account"
p2.q.why: "Why was blocking the thief's address not enough?"
p2.q.why.account: "They change address, but keep the same account"
p2.q.why.slow: "Blocking an address takes hours to apply"
p2.q.why.slow.why: "Blocking is immediate. But the next copy comes from another address, with the same account."
p2.q.why.fine: "It was enough, but cost Pluvier too much"
p2.q.why.fine.why: "It costs nothing, and stops nothing: the thieves go through other addresses."
p2.contain.revoke: "Revoke svc-rapports' password (tonight's report will wait for a new key)"
p2.contain.block: "Block the address 203.0.113.66"
p2.contain.isolate: "Cut off the whole warehouse (no branch can see its bookings any more)"
p2.ada.brief: "Look at the audit: `soc logs warehouse db`. Who reads what, from where?"
p2.ada.bookings: "The whole bookings table, from an unknown address, with the reporting account. Two million rows."
p2.ada.customers: "The customers table now, and from another address. Same account."
p2.ada.cards: "They are reading the payments. Stop them."
p2.ada.blocked: "Address blocked. Watch the next line: does it still come from there?"
p2.ada.g.stop: "The addresses change, the account stays. Revoke it: `contain revoke svc-rapports`. Tonight's report will wait, a small price."
p2.ada.g.stop.standard: "Stop the copies with the measure that targets what they stole, not where they come from. `contain` for the list."
p2.ada.stopped: "The account no longer opens. The next copy stops dead."
p2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
p2.ada.answer.standard: "My question is waiting in the messenger."
p2.ada.why: "A stolen credential travels with the thieves. That is what you cut. Now, a rule for next time: the reporting account never reads more than a few dozen rows."
p2.ada.g.rule: "In `regles/lecture-massive.yml`: `echo \"user: svc-rapports\" >> regles/lecture-massive.yml`, then `echo \"rows|gte: 100000\" >> regles/lecture-massive.yml`, then `rule test regles/lecture-massive.yml`."
p2.ada.g.rule.standard: "Write in `regles/lecture-massive.yml` a rule that sees the reporting account read whole tables, without going off for the analysts. Then `rule test`."
p2.ada.again: "Read the false alerts: who usually reads a lot? The reporting account only reads totals."
p2.ada.again.standard: "Not yet. Read the false alerts."
p2.ada.done: "The addresses changed, the account stayed. A service account with no second step, no address limit and a four-year-old password: the perfect key. Now change the lock."
p2.hint.stop.1: "`contain` lists the measures and their cost."
p2.hint.stop.2: "`contain revoke svc-rapports`"
p2.hint.why.1: "Compare the addresses on the svc-rapports lines that do not come from 10.82.0.25."
p2.hint.rule.1: "Two conditions: which account, and how many rows."
p2.hint.rule.2: "The account field is `user`, the row count `rows`. `|gte` means \"at least\"."
p2.hint.rule.3: "`echo \"user: svc-rapports\" >> regles/lecture-massive.yml`, `echo \"rows|gte: 100000\" >> regles/lecture-massive.yml`, then `rule test regles/lecture-massive.yml`."
p2.debrief.title: "No second step"
p2.debrief.lesson: "The thieves forced nothing: they signed in with a real password, from changing addresses. Blocking an address did not bother them; revoking the account stopped them. And a service account reading whole tables, when it usually reads only totals, is seen at once."
p2.debrief.p1: "Against a stolen credential, revoke the credential, not the address."
p2.debrief.p2: "Know what a service account usually does, and alert on everything else."
p2.debrief.p3: "Restrict service accounts to the addresses of the servers that use them."
