a1.briefing: "Cabas releases version 4.2.0 of its app next week. Before that, the CTO wants to know what a stranger can get out of the package testers download. Your only source: the download page, like anyone."
a1.obj.apk: "Fetch the app's package"
a1.obj.key: "Find in the package what opens the API, and prove it"
a1.obj.why: "Say who can read this package"
a1.q.why: "The CTO asks: this key, who can really read it?"
a1.q.why.anyone: "Anyone who downloads the app"
a1.q.why.rooted: "Only a jailbroken (rooted) phone"
a1.q.why.rooted.why: "No phone needed: the package downloads, and `unzip` opens it on any computer."
a1.q.why.source: "Only people with the source code"
a1.q.why.source.why: "The package is the code shipped to every user. You just read its configuration with no access to the repository."
a1.ada.brief: "Start with the page: `curl -s https://magasin.cabas.test/`. An Android package is a zip archive under another name."
a1.ada.g.apk: "Save the package on your workstation: `curl -s https://magasin.cabas.test/cabas-4.2.0.apk > cabas.apk`."
a1.ada.g.apk.standard: "The page offers the app's package. Fetch it to your workstation."
a1.ada.apk: "Package fetched. Nobody asked who you were."
a1.ada.g.key: "List what it holds with `unzip -l cabas.apk`, then read its configuration: `unzip -p cabas.apk assets/config.json | jq .`. If a key lies there, try it the way the app would: `curl -s -H \"X-Cabas-Cle: <the key>\" https://api.cabas.test/v4/partenaires/stock`. Then `submit` the marker."
a1.ada.g.key.standard: "Open the package, read its configuration, and check whether what you find opens the partner API (header `X-Cabas-Cle`)."
a1.ada.key: "Marker accepted. The partner key, the one that reads stock and today's orders, travels inside every phone."
a1.ada.g.why: "Think back to what it took to read that file."
a1.ada.done: "The package says more than its configuration. It also holds the compiled code, and the code knows routes the app does not show."
a1.hint.apk.1: "The page's link leads to /cabas-4.2.0.apk."
a1.hint.apk.2: "`curl -s https://magasin.cabas.test/cabas-4.2.0.apk > cabas.apk`"
a1.hint.key.1: "`unzip -p cabas.apk assets/config.json | jq .` shows `partner_key`."
a1.hint.key.2: "`curl -s -H \"X-Cabas-Cle: cbs-part-live-9d27e1\" https://api.cabas.test/v4/partenaires/stock`"
a1.hint.why.1: "`answer anyone`"
a1.debrief.title: "The key in the bag"
a1.debrief.lesson: "So the app could show live stock, the team put the partner API key in its configuration. But an app's package is shipped to every user: it is an archive, and everything in it reads in one command. A key inside an app is never a secret."
a1.debrief.p1: "Never ship a secret in an app: the app authenticates with its user's session, and the server calls the partners."
a1.debrief.p2: "Scan every package for keys before publishing it, the way you scan a repository."
a1.debrief.p3: "A key that was shipped is public: change it on the server, do not just remove it from the next version."
