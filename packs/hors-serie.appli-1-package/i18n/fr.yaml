a1.briefing: "Cabas sort la version 4.2.0 de son appli la semaine prochaine. Avant, la directrice technique veut savoir ce qu'un inconnu peut tirer du paquet que les testeurs téléchargent. Ta seule source : la page de téléchargement, comme n'importe qui."
a1.obj.apk: "Récupérer le paquet de l'appli"
a1.obj.key: "Trouver dans le paquet ce qui ouvre l'API, et le prouver"
a1.obj.why: "Dire qui peut lire ce paquet"
a1.q.why: "La directrice demande : cette clé, qui peut vraiment la lire ?"
a1.q.why.anyone: "Toute personne qui télécharge l'appli"
a1.q.why.rooted: "Seulement un téléphone débridé (rooté)"
a1.q.why.rooted.why: "Pas besoin du téléphone : le paquet se télécharge, et `unzip` suffit à l'ouvrir sur n'importe quel poste."
a1.q.why.source: "Seulement qui a accès au code source"
a1.q.why.source.why: "Le paquet, c'est le code livré à chaque utilisateur. Tu viens de lire sa configuration sans aucun accès au dépôt."
a1.ada.brief: "Commence par la page : `curl -s https://magasin.cabas.test/`. Un paquet Android, c'est une archive zip avec un autre nom."
a1.ada.g.apk: "Enregistre le paquet sur ton poste : `curl -s https://magasin.cabas.test/cabas-4.2.0.apk > cabas.apk`."
a1.ada.g.apk.standard: "La page propose le paquet de l'appli. Récupère-le sur ton poste."
a1.ada.apk: "Paquet récupéré. Personne ne t'a demandé qui tu étais."
a1.ada.g.key: "Liste ce qu'il contient avec `unzip -l cabas.apk`, puis lis sa configuration : `unzip -p cabas.apk assets/config.json | jq .`. Si une clé y traîne, essaie-la comme le ferait l'appli : `curl -s -H \"X-Cabas-Cle: <la clé>\" https://api.cabas.test/v4/partenaires/stock`. Puis `submit` le repère."
a1.ada.g.key.standard: "Ouvre le paquet, lis sa configuration, et vérifie si ce que tu y trouves ouvre l'API des partenaires (en-tête `X-Cabas-Cle`)."
a1.ada.key: "Repère validé. La clé des partenaires, celle qui lit le stock et les commandes du jour, voyage dans chaque téléphone."
a1.ada.g.why: "Repense à ce qu'il t'a fallu pour lire ce fichier."
a1.ada.done: "Le paquet dit autre chose que sa configuration. Il contient aussi le code compilé, et le code connaît des routes que l'appli ne montre pas."
a1.hint.apk.1: "Le lien de la page mène à /cabas-4.2.0.apk."
a1.hint.apk.2: "`curl -s https://magasin.cabas.test/cabas-4.2.0.apk > cabas.apk`"
a1.hint.key.1: "`unzip -p cabas.apk assets/config.json | jq .` montre `partner_key`."
a1.hint.key.2: "`curl -s -H \"X-Cabas-Cle: cbs-part-live-9d27e1\" https://api.cabas.test/v4/partenaires/stock`"
a1.hint.why.1: "`answer anyone`"
a1.debrief.title: "La clé dans le sac"
a1.debrief.lesson: "Pour que l'appli affiche le stock en direct, l'équipe a mis la clé de l'API des partenaires dans sa configuration. Or le paquet d'une appli est livré à chaque utilisateur : c'est une archive, et tout ce qu'elle contient se lit en une commande. Une clé dans une appli n'est jamais un secret."
a1.debrief.p1: "Ne jamais livrer un secret dans une appli : l'appli s'authentifie avec la session de son utilisateur, et c'est le serveur qui appelle les partenaires."
a1.debrief.p2: "Chercher les clés dans chaque paquet avant de le publier, comme on les cherche dans un dépôt."
a1.debrief.p3: "Une clé qui a été livrée est publique : la changer côté serveur, pas seulement la retirer de la version suivante."
