c1.briefing: "Saturday 11 December, 9 am. At Lucarne, a maker of connected doorbells and cameras, four customers tell the same story this week: a stranger talked to them through their camera. Support checked the devices: nothing. The latest ticket is in `support/`, the sign-in service's exports in `comptes/`."
c1.obj.where: "Find where the sign-in the customer did not make comes from"
c1.obj.opened: "Count the accounts opened the same way"
c1.obj.source: "Say where the passwords came from"
c1.obj.close: "Close the sessions and force new passwords"
c1.obj.policy: "Rewrite the sign-in policy"
c1.q.where: "From which address did someone else sign in to the account client-20418?"
c1.q.opened: "How many accounts did the `config-runner` tool open that evening?"
c1.q.source: "One try per account, and five doors open. Where did those passwords come from?"
c1.q.source.reuse: "From leaks of other sites, where these customers had the same one"
c1.q.source.camera: "From a flaw in the cameras themselves"
c1.q.source.camera.why: "Support found no fault on the devices, and the export shows an ordinary sign-in to the account, through the front door."
c1.q.source.guess: "From thousands of tries on each account, until the right one"
c1.q.source.guess.why: "Look at the `attempts` column: one try per account. The tool guesses nothing, it already knows one password per customer."
c1.contain.sessions: "Close every session of the five opened accounts"
c1.contain.passwords: "Force a new password on the five accounts (the customers are told by email)"
c1.check.factor: "The second factor is required"
c1.check.alert: "A sign-in from a new device tells the customer"
c1.check.leaked: "A password already seen in a public leak is refused"
c1.check.rate: "Tries per address are limited"
c1.check.change: "A password change closes the open sessions"
c1.check.works: "Customers can still sign in"
c1.ada.brief: "Start with the ticket: `cat support/ticket-4471.txt`. Then the export of that account's sign-ins: `cat comptes/connexions.csv`."
c1.ada.g.where: "In `comptes/connexions.csv`, the customer always signs in from the same address, with the app. One line does not look like them. `answer where <address>`."
c1.ada.g.where.standard: "Find in the export the sign-in that does not look like the customer's."
c1.ada.where: "203.0.113.77, with a client that is not the Lucarne app, and first try. Four minutes later, live view and microphone. Nobody broke the camera: someone had the key. Let's see whether this customer is the only one: `comptes/essais.csv`."
c1.ada.g.opened: "`cat comptes/essais.csv` shows everything that tool tried. Count the `opened` lines: `grep -c opened comptes/essais.csv`, then `answer opened <number>`."
c1.ada.g.opened.standard: "Count in `comptes/essais.csv` the accounts the tool opened."
c1.ada.opened: "Five accounts out of fourteen, from three addresses taking turns. And look at the `attempts` column. One question."
c1.ada.g.source: "Answer my question. The `attempts` column and the ticket give you the answer."
c1.ada.source: "Yes. It is called credential stuffing: lists of address and password pairs, taken from leaks of other sites, replayed here. Lucarne lost nothing, and its customers still have a stranger at home. We close it: `contain`."
c1.ada.g.close: "Two measures: `contain revoke sessions`, then `contain reset mots-de-passe`."
c1.ada.g.close.standard: "Get the intruder out of the opened accounts, and make sure the stolen passwords are no longer of use. `contain` lists the measures."
c1.ada.still: "The passwords are changed, but at Lucarne a password change does not close sessions that are already open. The stranger is still signed in: close the sessions."
c1.ada.close: "The five accounts are closed to the stranger. But tomorrow another list will open five other accounts. What made it possible is in `comptes/connexion.yml`."
c1.ada.g.policy: "`cat comptes/connexion.yml`: each line gives its possible values after the `#`. Pick the safest one for each with `sed -i` or `edit comptes/connexion.yml`, then `verify`."
c1.ada.g.policy.standard: "Fix `comptes/connexion.yml` line by line, then run `verify`."
c1.ada.almost: "Not yet. `verify` tells you which lines are not right."
c1.ada.done: "With a second factor, the stolen password was no longer enough. With an alert, the customer would have known at 9.36 pm, not on hearing a voice. The limit per address stops little on its own: the tool kept changing address. Reading the exports again, I saw something else, which does not come from outside. We talk about it on Monday."
c1.hint.where.1: "The customer signs in from 192.0.2.31. Another address appears on 10 December at 9.36 pm."
c1.hint.where.2: "`answer where 203.0.113.77`"
c1.hint.opened.1: "`grep -c opened comptes/essais.csv`"
c1.hint.opened.2: "`answer opened 5`"
c1.hint.source.1: "One try per account: the tool already knows the password. `answer reuse`"
c1.hint.close.1: "`contain revoke sessions` then `contain reset mots-de-passe`"
c1.hint.policy.1: "The expected values: `required`, `email`, `on`, `5-per-minute`, `close-sessions`."
c1.hint.policy.2: "For example `sed -i \"s/second_factor: optional/second_factor: required/\" comptes/connexion.yml`, one line at a time."
c1.debrief.title: "The voice in the living room"
c1.debrief.lesson: "No camera was hacked. Passwords taken from leaks of other sites were replayed on the sign-in service, one try per account, and some customers used the same one everywhere. The maker had done nothing wrong, but it had done nothing either to make that password alone not enough."
c1.debrief.p1: "When an account opens a camera in someone's home, the second factor is not a box to tick: it is required."
c1.debrief.p2: "Tell the customer at every new sign-in, and refuse passwords already seen in a leak."
c1.debrief.p3: "A limit per address is not enough: credential stuffing makes one try per account and changes address."
