c1.briefing: "Samedi 11 décembre, 9 h. Chez Lucarne, fabricant de sonnettes et de caméras connectées, quatre clients racontent la même chose cette semaine : un inconnu leur a parlé par leur caméra. Le support a vérifié les appareils : rien. Le ticket le plus récent est dans `support/`, les exports du service de connexion dans `comptes/`."
c1.obj.where: "Trouver d'où vient la connexion que le client n'a pas faite"
c1.obj.opened: "Compter les comptes ouverts de la même façon"
c1.obj.source: "Dire d'où venaient les mots de passe"
c1.obj.close: "Fermer les sessions et forcer de nouveaux mots de passe"
c1.obj.policy: "Réécrire la politique de connexion"
c1.q.where: "Depuis quelle adresse quelqu'un d'autre s'est-il connecté au compte client-20418 ?"
c1.q.opened: "Combien de comptes l'outil `config-runner` a-t-il ouverts ce soir-là ?"
c1.q.source: "Un seul essai par compte, et cinq portes s'ouvrent. D'où venaient ces mots de passe ?"
c1.q.source.reuse: "De fuites d'autres sites, où ils avaient le même mot de passe"
c1.q.source.camera: "D'une faille dans les caméras elles-mêmes"
c1.q.source.camera.why: "Le support n'a trouvé aucun défaut sur les appareils, et l'export montre une connexion ordinaire au compte, par la grande porte."
c1.q.source.guess: "De milliers d'essais automatiques sur chaque compte, jusqu'à tomber sur le bon"
c1.q.source.guess.why: "Regarde la colonne `attempts` : un seul essai par compte. L'outil ne devine rien, il connaît déjà un mot de passe par client."
c1.contain.sessions: "Fermer toutes les sessions des cinq comptes ouverts"
c1.contain.passwords: "Forcer un nouveau mot de passe sur les cinq comptes (les clients sont prévenus par courriel)"
c1.check.factor: "Le second facteur est obligatoire"
c1.check.alert: "Une connexion depuis un nouvel appareil prévient le client"
c1.check.leaked: "Un mot de passe déjà vu dans une fuite publique est refusé"
c1.check.rate: "Les essais par adresse sont limités"
c1.check.change: "Un changement de mot de passe ferme les sessions ouvertes"
c1.check.works: "Les clients peuvent toujours se connecter"
c1.ada.brief: "Commence par le ticket : `cat support/ticket-4471.txt`. Puis l'export des connexions de ce compte : `cat comptes/connexions.csv`."
c1.ada.g.where: "Dans `comptes/connexions.csv`, le client se connecte toujours depuis la même adresse, avec l'appli. Une ligne ne lui ressemble pas. `answer where <adresse>`."
c1.ada.g.where.standard: "Trouve dans l'export la connexion qui ne ressemble pas à celles du client."
c1.ada.where: "203.0.113.77, avec un client qui n'est pas l'appli Lucarne, et du premier coup. Quatre minutes plus tard, vue en direct et micro. Personne n'a cassé la caméra : quelqu'un avait la clé. Voyons si ce client est le seul : `comptes/essais.csv`."
c1.ada.g.opened: "`cat comptes/essais.csv` montre tout ce que cet outil a tenté. Compte les lignes `opened` : `grep -c opened comptes/essais.csv`, puis `answer opened <nombre>`."
c1.ada.g.opened.standard: "Compte dans `comptes/essais.csv` les comptes que l'outil a ouverts."
c1.ada.opened: "Cinq comptes sur quatorze, depuis trois adresses qui se relaient. Et regarde la colonne `attempts`. Une question."
c1.ada.g.source: "Réponds à ma question. La colonne `attempts` et le ticket te donnent la réponse."
c1.ada.g.source.standard: "J'attends ta réponse à ma question : `answer` la rappelle."
c1.ada.source: "Oui. On appelle ça du bourrage d'identifiants : des listes de couples adresse et mot de passe, sorties de fuites d'autres sites, rejouées ici. Lucarne n'a rien perdu, et ses clients sont quand même chez eux avec un inconnu."
c1.ada.source.close: "On ferme : `contain`."
c1.ada.g.close: "Deux mesures : `contain revoke sessions`, puis `contain reset mots-de-passe`."
c1.ada.g.close.standard: "Sors l'intrus des comptes ouverts, et fais en sorte que les mots de passe volés ne servent plus. `contain` liste les mesures."
c1.ada.still: "Les mots de passe sont changés, mais chez Lucarne un changement de mot de passe ne ferme pas les sessions déjà ouvertes. L'inconnu est toujours connecté : ferme les sessions."
c1.ada.close: "Les cinq comptes sont fermés à l'inconnu. Mais demain, une autre liste ouvrira cinq autres comptes. Ce qui a rendu ça possible est dans `comptes/connexion.yml`."
c1.ada.g.policy: "`cat comptes/connexion.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut cinq : `required`, `email`, `on`, `5-per-minute`, `close-sessions`. Change-les avec `edit comptes/connexion.yml` ou `sed -i`, puis `verify`."
c1.ada.g.policy.standard: "Corrige `comptes/connexion.yml` ligne par ligne, puis lance `verify`. Pour ouvrir le fichier : `edit comptes/connexion.yml`."
c1.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c1.ada.done: "Avec un second facteur, le mot de passe volé ne suffisait plus. Avec une alerte, le client l'aurait su à 21 h 36, pas en entendant une voix. La limite par adresse, elle, n'arrête pas grand-chose seule : l'outil changeait d'adresse. En relisant les exports, j'ai vu autre chose, qui ne vient pas de l'extérieur. On en parle lundi."
c1.hint.where.1: "Le client se connecte depuis 192.0.2.31. Une autre adresse apparaît le 10 décembre à 21 h 36."
c1.hint.where.2: "`answer where 203.0.113.77`"
c1.hint.opened.1: "`grep -c opened comptes/essais.csv`"
c1.hint.opened.2: "`answer opened 5`"
c1.hint.source.1: "Un seul essai par compte : l'outil connaît déjà le mot de passe. `answer reuse`"
c1.hint.close.1: "`contain revoke sessions` puis `contain reset mots-de-passe`"
c1.hint.policy.1: "Les valeurs attendues : `required`, `email`, `on`, `5-per-minute`, `close-sessions`."
c1.hint.policy.2: "Avec l'éditeur : `edit comptes/connexion.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/second_factor: optional/second_factor: required/\" comptes/connexion.yml`, une ligne à la fois."
c1.debrief.title: "La voix dans le salon"
c1.debrief.lesson: "Aucune caméra n'a été piratée. Des mots de passe sortis de fuites d'autres sites ont été rejoués sur le service de connexion, un essai par compte, et certains clients utilisaient le même partout. Le fabricant n'avait rien fait de mal, mais il n'avait rien fait non plus pour que ce mot de passe seul ne suffise pas."
c1.debrief.p1: "Quand un compte ouvre une caméra chez quelqu'un, le second facteur n'est pas une option à cocher : il est obligatoire."
c1.debrief.p2: "Prévenir le client à chaque nouvelle connexion, et refuser les mots de passe déjà vus dans une fuite."
c1.debrief.p3: "Une limite par adresse ne suffit pas : le bourrage d'identifiants fait un essai par compte et change d'adresse."
