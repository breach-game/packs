file.readme: "Poste Ligne Rouge. Hors-série : le Coffre. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat TL-2027-044. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT TL-2027-044\nClient : Mutuelle Tilleul, mutuelle santé. Périmètre : *.tilleul.test, 10.86.0.0/24.\nObjet : une copie de la table des adhérents du Coffre a été retrouvée sur un partage de fichiers mal réglé, sans preuve qu'elle en soit sortie. Ligne Rouge évalue ce qu'elle exposerait, relit la réinitialisation des mots de passe et accompagne la migration vers un stockage sûr.\nDispositif convenu : Ligne Rouge lit la copie sur son poste, sans jamais essayer de retrouver un mot de passe d'adhérent. Seul le mot de passe provisoire publié par la mutuelle en 2016 peut être comparé. Aucune modification en production sans l'accord de l'équipe.\nSigné : le responsable de la sécurité de Mutuelle Tilleul."
page.home.h1: "Le Coffre"
page.home.p: "Vos remboursements, vos attestations et vos échanges avec Mutuelle Tilleul, au même endroit."
page.home.footer: "Mutuelle Tilleul · espace adhérent depuis 2016"
