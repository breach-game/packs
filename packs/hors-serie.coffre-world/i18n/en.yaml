file.readme: "Ligne Rouge workstation. Side series: the Vault. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate TL-2027-044. Outside the mandate it is no longer a test, it is an offence (article 323-1 of the French Penal Code). Get back in scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE TL-2027-044\nClient: Mutuelle Tilleul, a health insurer. Scope: *.tilleul.test, 10.86.0.0/24.\nPurpose: a copy of the Vault's member table was found on a badly configured file share, with no proof that it left. Ligne Rouge assesses what it would expose, reviews password reset and supports the migration to safe storage.\nAgreed approach: Ligne Rouge reads the copy on its own workstation, never trying to recover any member's password. Only the temporary password the insurer published in 2016 may be compared. No change in production without the team's agreement.\nSigned: the head of security of Mutuelle Tilleul."
