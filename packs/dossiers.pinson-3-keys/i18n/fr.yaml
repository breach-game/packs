p3.briefing: "La direction de Pinson a lu ton rapport. Elle ne veut pas d'un coupable, elle veut que le même appel, demain, ne mène nulle part. Tu as le fichier des accès et une matinée."
p3.obj.idea: "Répondre à la première idée du responsable sécurité"
p3.obj.key: "Remplacer la notification par une clé de sécurité physique"
p3.obj.few: "Réserver Volière aux agents en service"
p3.obj.two: "Exiger deux personnes pour une action à haut risque"
p3.q.idea: "Le responsable sécurité propose : « On refait une formation, et plus personne ne tombera dans le piège. » Est-ce suffisant ?"
p3.q.idea.train: "Oui : une équipe bien formée reconnaît ce genre d'appel et ne se fait plus avoir"
p3.q.idea.train.why: "La formation aide, et Lison l'a prouvé en refusant de donner son mot de passe. Mais sur des centaines d'appels, quelqu'un finira par y croire. Il faut que ce jour-là ne suffise pas."
p3.q.idea.both: "Non : on forme, et surtout on fait en sorte qu'une personne trompée ne suffise plus"
p3.q.idea.phone: "Non : il faut interdire au support de traiter la moindre demande par téléphone"
p3.q.idea.phone.why: "Le support ne peut pas travailler sans parler aux gens, et le prochain prétexte arrivera par messagerie. On ne ferme pas la porte, on change la serrure."
p3.check.key: "Le VPN demande une clé de sécurité physique"
p3.check.few: "Volière est réservée aux agents en service"
p3.check.two: "Une action à haut risque demande deux personnes"
p3.check.works: "Les actions à haut risque sont toujours listées et journalisées"
p3.ada.brief: "Dernière matinée chez Pinson. Le fichier est `dossier/access.yml`. Le responsable sécurité a une idée, écoute-la d'abord."
p3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p3.ada.answer.standard: "Réponds d'abord à la question du responsable sécurité."
p3.ada.idea: "Voilà. On ne peut pas garantir que personne ne croira jamais un appel. On peut faire en sorte qu'y croire ne donne rien."
p3.ada.g.key: "Ouvre le fichier : `edit dossier/access.yml`. D'abord le second facteur : une notification se valide pour un faux site, une clé physique non. Remplace `push` par `security-key`, puis `verify`."
p3.ada.g.key.standard: "Ouvre `dossier/access.yml` et choisis un second facteur qu'un faux site ne peut pas relayer. Puis `verify`. Pour ouvrir le fichier : `edit dossier/access.yml`."
p3.ada.g.few: "Ensuite, qui a Volière. Aujourd'hui tout le support, tout le temps. Écris `access: on-duty` : seuls les agents en service, avec une revue chaque trimestre. Puis `verify`."
p3.ada.g.few.standard: "Réduis ensuite le nombre de personnes qui ont Volière (`access`). Puis `verify`."
p3.ada.g.two: "Dernier réglage : changer un e-mail ou couper une double authentification ne doit plus dépendre d'une seule personne. Passe `approvals` à 2, puis `verify`."
p3.ada.g.two.standard: "Dernier réglage : une action à haut risque ne doit plus dépendre d'une seule personne. Puis `verify`."
p3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
p3.ada.done: "Le même appel, demain, tombera sur une clé qui refuse le faux site, et sur un outil qui demande un collègue. Ouvre le débrief : à la fin, l'incident réel d'où vient ce dossier."
p3.hint.idea.1: "Demande-toi ce qui se passe le jour où, malgré la formation, une personne y croit."
p3.hint.key.1: "La ligne à changer est `second_factor`. La valeur qui résiste à un faux site est `security-key`."
p3.hint.key.2: "Avec l'éditeur : `edit dossier/access.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/second_factor: push/second_factor: security-key/\" dossier/access.yml`."
p3.hint.few.1: "La ligne à changer est `access`, sous `voliere`. La valeur est `on-duty`."
p3.hint.few.2: "Avec l'éditeur : `edit dossier/access.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/access: all-support/access: on-duty/\" dossier/access.yml`."
p3.hint.two.1: "La ligne à changer est `approvals`. Il faut deux personnes."
p3.hint.two.2: "Avec l'éditeur : `edit dossier/access.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/approvals: 1/approvals: 2/\" dossier/access.yml`, puis `verify`."
p3.debrief.title: "Changer la serrure, pas les gens"
p3.debrief.lesson: "Tu n'as pas rendu l'équipe infaillible. Tu as fait en sorte qu'une erreur humaine, qui arrivera, ne suffise plus : la clé refuse le faux site, moins de monde tient l'outil, et les gestes dangereux se font à deux."
p3.debrief.p1: "Une clé de sécurité physique lie la validation à l'adresse du vrai site. Sur une page ressemblante, elle ne répond pas."
p3.debrief.p2: "Moindre privilège pour les outils internes : l'accès suit le besoin du moment, et il se revoit régulièrement."
p3.debrief.p3: "Les actions à haut risque se font à deux, comme pour un virement important."
p3.debrief.p4: "Dis aux équipes comment le support les contactera, et comment il ne le fera jamais. Puis entraîne-les, appels compris."
p3.facts.title: "Ce qui s'est vraiment passé : Twitter, juillet 2020"
p3.facts.p1: "Pinson et Lison n'existent pas. Le scénario s'inspire du piratage de Twitter des 14 et 15 juillet 2020, tel que le raconte le rapport d'enquête du département des services financiers de l'État de New York."
p3.facts.p2: "Les attaquants ont appelé des employés en se faisant passer pour le support informatique de Twitter, au sujet d'un problème de VPN. Depuis le passage au télétravail, ces problèmes étaient courants."
p3.facts.p3: "Ils les ont dirigés vers un site qui imitait à l'identique celui du VPN de Twitter. Les identifiants tapés étaient aussitôt utilisés sur le vrai site, ce qui déclenchait une demande de double authentification que certains employés ont validée."
p3.facts.p4: "Le rapport le souligne : ni logiciel malveillant, ni faille exploitée, ni porte dérobée."
p3.facts.p5: "Avec les outils internes de gestion des comptes, les attaquants ont pris le contrôle de 130 comptes et tweeté depuis 45 d'entre eux, dont des comptes certifiés très suivis, pour une arnaque promettant de doubler des bitcoins. Elle a rapporté environ 118 000 dollars."
p3.facts.p6: "Les messages privés de 36 comptes au plus ont été consultés, et les données de sept comptes téléchargées."
p3.facts.p7: "Le rapport relève que Twitter n'avait plus de responsable de la sécurité des systèmes d'information depuis décembre 2019, et attribue en grande partie le succès de l'attaque aux faiblesses de ses règles internes de cybersécurité. Tout s'est joué en une journée environ."
