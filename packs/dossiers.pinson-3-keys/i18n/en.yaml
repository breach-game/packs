p3.briefing: "Pinson's management has read your report. They do not want a culprit, they want the same call, tomorrow, to lead nowhere. You have the access settings file and one morning."
p3.obj.idea: "Answer the security lead's first idea"
p3.obj.key: "Replace the notification with a physical security key"
p3.obj.few: "Keep Volière for agents on duty"
p3.obj.two: "Require two people for a high-risk action"
p3.q.idea: "The security lead suggests: \"We run the training again, and nobody will fall for it any more.\" Is that enough?"
p3.q.idea.train: "Yes: a well-trained team recognises this kind of call and is no longer fooled"
p3.q.idea.train.why: "Training helps, and Lison proved it by refusing to give her password. But over hundreds of calls, someone will end up believing one. That day must not be enough."
p3.q.idea.both: "No: train, and above all make sure one fooled person is no longer enough"
p3.q.idea.phone: "No: support must be forbidden to handle any request at all over the phone"
p3.q.idea.phone.why: "Support cannot work without talking to people, and the next pretext will come by chat. You do not close the door, you change the lock."
p3.check.key: "The VPN asks for a physical security key"
p3.check.few: "Volière is kept for agents on duty"
p3.check.two: "A high-risk action needs two people"
p3.check.works: "High-risk actions are still listed and logged"
p3.ada.brief: "Last morning at Pinson. The file is `dossier/access.yml`. The security lead has an idea, hear it first."
p3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p3.ada.answer.standard: "Answer the security lead's question first."
p3.ada.idea: "There. You cannot guarantee that nobody will ever believe a call. You can make sure that believing it gives nothing."
p3.ada.g.key: "Open the file: `edit dossier/access.yml`. The second factor first: a notification can be approved for a fake site, a physical key cannot. Replace `push` with `security-key`, then `verify`."
p3.ada.g.key.standard: "Open `dossier/access.yml` and choose a second factor a fake site cannot relay. Then `verify`."
p3.ada.g.few: "Next, who has Volière. Today the whole support team, all the time. Write `access: on-duty`: only agents on shift, reviewed every quarter. Then `verify`."
p3.ada.g.few.standard: "Next, reduce the number of people who have Volière (`access`). Then `verify`."
p3.ada.g.two: "Last setting: changing an email or turning off two-factor authentication must no longer depend on one person. Set `approvals` to 2, then `verify`."
p3.ada.g.two.standard: "Last setting: a high-risk action must no longer depend on one person. Then `verify`."
p3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
p3.ada.done: "The same call, tomorrow, will meet a key that refuses the fake site, and a tool that asks for a colleague. Open the debrief: at the end, the real incident this case file comes from."
p3.hint.idea.1: "Ask yourself what happens on the day when, despite the training, one person believes it."
p3.hint.key.1: "The line to change is `second_factor`. The value that resists a fake site is `security-key`."
p3.hint.key.2: "Type `sed -i \"s/second_factor: push/second_factor: security-key/\" dossier/access.yml`."
p3.hint.few.1: "The line to change is `access`, under `voliere`. The value is `on-duty`."
p3.hint.few.2: "Type `sed -i \"s/access: all-support/access: on-duty/\" dossier/access.yml`."
p3.hint.two.1: "The line to change is `approvals`. It takes two people."
p3.hint.two.2: "Type `sed -i \"s/approvals: 1/approvals: 2/\" dossier/access.yml`, then `verify`."
p3.debrief.title: "Change the lock, not the people"
p3.debrief.lesson: "You did not make the team infallible. You made sure a human error, which will happen, is no longer enough: the key refuses the fake site, fewer people hold the tool, and dangerous actions take two."
p3.debrief.p1: "A physical security key ties the approval to the address of the real site. On a look-alike page, it does not answer."
p3.debrief.p2: "Least privilege for internal tools: access follows the need of the moment, and is reviewed regularly."
p3.debrief.p3: "High-risk actions take two people, as for a large bank transfer."
p3.debrief.p4: "Tell the teams how support will contact them, and how it never will. Then train them, calls included."
p3.facts.title: "What really happened: Twitter, July 2020"
p3.facts.p1: "Pinson and Lison do not exist. The scenario is inspired by the Twitter hack of 14 and 15 July 2020, as told by the investigation report of the New York State Department of Financial Services."
p3.facts.p2: "The attackers called employees and claimed to be from Twitter's IT help desk, about a VPN problem. Since the switch to remote working, such problems were common."
p3.facts.p3: "They sent them to a site that looked identical to Twitter's real VPN site. The credentials typed there were used at once on the real site, which triggered a two-factor request that some employees approved."
p3.facts.p4: "The report stresses it: no malware, no exploits, and no backdoors."
p3.facts.p5: "With the internal account management tools, the attackers took over 130 accounts and tweeted from 45 of them, including widely followed verified accounts, for a scam that promised to double bitcoins. It brought in about 118,000 dollars."
p3.facts.p6: "The private messages of up to 36 accounts were accessed, and the data of seven accounts downloaded."
p3.facts.p7: "The report notes that Twitter had had no chief information security officer since December 2019, and attributes the success of the attack largely to weaknesses in its internal cybersecurity protocols. It all happened in about a day."
