requires: [dossiers.chouette-world]
title:
  fr: "Dossier 32 · 1. La vague de 10 h"
  en: "Case file 32 · 1. The 10 o'clock wave"
summary:
  fr: "Un programme destructeur saute de serveur en serveur chez un transporteur maritime, toujours avec le même compte d'administration. Tu trouves le poste d'où part la vague, tu écris la règle qui la voit, puis tu désactives le compte."
  en: "A destructive program hops from server to server at a shipping line, always with the same admin account. You find the workstation the wave starts from, write the rule that sees it, then disable the account."
