c1.briefing: "Tuesday 29 June, 10:30. At Argos Shipping, screens turn red one after another: a program asks for a ransom, but there is nobody to pay, it destroys. The accounting workstation went down at 10:14, then both directory controllers. The file, planning, mail and backup servers are still up. The helpdesk ticket is in `traces/`."
c1.obj.origin: "Find the workstation the wave starts from"
c1.obj.rule: "Write the rule that sees the wave"
c1.obj.admin: "Disable the account that opens every door for it"
c1.obj.reach: "Say why one workstation could reach every server"
c1.q.origin: "From which address does the adm-global account connect to the servers that go down?"
c1.q.reach: "The accounting workstation has no rights on the servers. How could the program reach them?"
c1.q.reach.session: "It reused the admin session left on the workstation"
c1.q.reach.software: "The accounting software had rights on every server"
c1.q.reach.software.why: "The software runs with the workstation's rights, which has none on the servers. The logs show another account: adm-global."
c1.q.reach.samepw: "All servers had the same local password"
c1.q.reach.samepw.why: "The logs show no local account: they show the domain admin account, valid everywhere."
c1.contain.admin: "Disable the adm-global account in the directory (the IT team loses its shared account)"
c1.ada.brief: "Read the ticket: `cat traces/alerte.txt`. Then look for who signs in to the servers going down: `soc search adm-global`."
c1.ada.g.origin: "Compare the addresses adm-global comes from. The IT team works from 10.102.0.31. The other address is in the log. `answer origin <address>`."
c1.ada.g.origin.standard: "Find the address the admin account connects from to the servers going down, which is not the IT team's."
c1.ada.origin: "10.102.0.50: the accounting workstation, the one with the 09:58 update. And yesterday, an administrator signed in there with adm-global to install a printer."
c1.ada.g.rule: "You need two conditions: the account and the workstation. `echo \"user: adm-global\" >> regles/vague.yml`, `echo \"src: 10.102.0.50\" >> regles/vague.yml`, then `rule test regles/vague.yml`."
c1.ada.g.rule.standard: "Write a rule that sees the admin account coming from the accounting workstation, and not the IT team or the accountant opening their files."
c1.ada.again: "Your rule misses a sign-in or fires on ordinary activity. The IT team uses the same account, and the accountant the same workstation: you need both conditions at once."
c1.ada.rule: "It sees every hop of the wave, and nothing else. The backup server is on its way: the account has to go."
c1.ada.rule.after: "It sees every hop of the wave, and nothing else."
c1.ada.inflight: "One sign-in started just before the cut still reached the file server. After it, the account gets nowhere."
c1.ada.backup: "The backup server just fell: adm-global signed in from the accounting workstation. Cut the account before it goes further."
c1.ada.admin.late: "Account disabled: the wave stops here. But it had time to reach the backup server, which must be checked before we trust it. One question to understand."
c1.ada.done.late: "The wave is stopped, but the backup server was hit. And both directory controllers are wiped: without the directory nobody can sign in. On Friday, we look for a copy that survived."
c1.ada.g.admin: "`contain disable adm-global`. The IT team loses its shared account: that is the price."
c1.ada.g.admin.standard: "Take away the key that opens every server."
c1.ada.admin: "Account disabled: its next sign-in is refused, the backup server is out of reach. One question to understand."
c1.ada.g.reach: "Read the ticket's last note again."
c1.ada.done: "The wave is stopped and the backups are safe. But both directory controllers are wiped, and without the directory nobody can sign in. On Friday, we look for a copy that survived."
c1.hint.origin.1: "In `soc search adm-global`, two source addresses appear. The IT team's is 10.102.0.31."
c1.hint.origin.2: "`answer origin 10.102.0.50`"
c1.hint.rule.1: "The fields are called `user` and `src`."
c1.hint.rule.2: "`echo \"user: adm-global\" >> regles/vague.yml` then `echo \"src: 10.102.0.50\" >> regles/vague.yml`"
c1.hint.admin.1: "`contain disable adm-global`"
c1.debrief.title: "The 10 o'clock wave"
c1.debrief.lesson: "The program came in through an update, on an unimportant workstation. But a domain administrator had signed in there the day before: the program reused that session, and the account was valid everywhere. One shared admin account, used on any workstation, turns a local infection into a company-wide disaster."
c1.debrief.p1: "Never sign in to an ordinary workstation with a domain admin account: a dedicated admin workstation, nothing else."
c1.debrief.p2: "Separate accounts by tier: one for workstations, one for servers, one for the directory."
c1.debrief.p3: "Alert when an admin account signs in from a workstation that is not an admin workstation."
