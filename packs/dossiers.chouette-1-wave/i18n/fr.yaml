c1.briefing: "Mardi 29 juin, 10 h 30. Chez Transports Argos, les écrans virent au rouge les uns après les autres : un programme demande une rançon, mais il n'y a personne à payer, il détruit. Le poste de comptabilité est tombé à 10 h 14, puis les deux contrôleurs de l'annuaire. Les serveurs de fichiers, de planning, de messagerie et de sauvegarde tiennent encore. Le ticket du support est dans `traces/`."
c1.obj.origin: "Trouver le poste d'où part la vague"
c1.obj.rule: "Écrire la règle qui voit la vague"
c1.obj.admin: "Désactiver le compte qui lui ouvre toutes les portes"
c1.obj.reach: "Dire pourquoi un seul poste a pu atteindre tous les serveurs"
c1.q.origin: "De quelle adresse partent les connexions du compte adm-global vers les serveurs qui tombent ?"
c1.q.reach: "Le poste de comptabilité n'a aucun droit sur les serveurs. Comment le programme a-t-il pu les atteindre ?"
c1.q.reach.session: "Il a réutilisé la session d'administrateur restée sur le poste"
c1.q.reach.software: "Le logiciel de compta avait les droits sur tous les serveurs"
c1.q.reach.software.why: "Le logiciel tourne avec les droits du poste, qui n'en a aucun sur les serveurs. Les journaux montrent un autre compte : adm-global."
c1.q.reach.samepw: "Tous les serveurs avaient le même mot de passe local"
c1.q.reach.samepw.why: "Les journaux ne montrent pas de compte local : ils montrent le compte d'administration du domaine, valable partout."
c1.contain.admin: "Désactiver le compte adm-global dans l'annuaire (l'équipe informatique perd son compte commun)"
c1.ada.brief: "Lis le ticket : `cat traces/alerte.txt`. Puis cherche qui se connecte aux serveurs qui tombent : `soc search adm-global`."
c1.ada.g.origin: "Compare les adresses d'où vient adm-global. L'équipe informatique travaille depuis 10.102.0.31. L'autre adresse est dans le ticket. `answer origin <adresse>`."
c1.ada.g.origin.standard: "Trouve l'adresse d'où le compte d'administration se connecte aux serveurs qui tombent, et qui n'est pas celle de l'équipe informatique."
c1.ada.origin: "10.102.0.50 : le poste de comptabilité, celui de la mise à jour de 9 h 58. Et hier, un administrateur s'y est connecté avec adm-global pour installer une imprimante."
c1.ada.g.rule: "Il faut deux conditions : le compte et le poste. `echo \"user: adm-global\" >> regles/vague.yml`, `echo \"src: 10.102.0.50\" >> regles/vague.yml`, puis `rule test regles/vague.yml`."
c1.ada.g.rule.standard: "Écris une règle qui voit le compte d'administration venu du poste de comptabilité, et pas l'équipe informatique ni la comptable qui ouvre ses fichiers."
c1.ada.again: "Ta règle rate une connexion ou alerte sur l'activité ordinaire. L'équipe informatique utilise le même compte, et la comptable le même poste : il faut les deux conditions à la fois."
c1.ada.rule: "Elle voit chaque saut de la vague, et rien d'autre. Le serveur de sauvegarde est le prochain sur la liste : il faut couper le compte."
c1.ada.g.admin: "`contain disable adm-global`. L'équipe informatique perd son compte commun : c'est le prix."
c1.ada.g.admin.standard: "Retire au programme la clé qui ouvre tous les serveurs."
c1.ada.admin: "Compte désactivé : la connexion au serveur de sauvegarde est refusée. Une question pour comprendre."
c1.ada.g.reach: "Relis la dernière note du ticket."
c1.ada.done: "La vague est arrêtée et les sauvegardes sont sauves. Mais les deux contrôleurs de l'annuaire sont effacés, et sans annuaire, plus personne ne se connecte. Vendredi, on cherche s'il en reste une copie."
c1.hint.origin.1: "Dans `soc search adm-global`, deux adresses sources apparaissent. Celle de l'équipe informatique est 10.102.0.31."
c1.hint.origin.2: "`answer origin 10.102.0.50`"
c1.hint.rule.1: "Les champs s'appellent `user` et `src`."
c1.hint.rule.2: "`echo \"user: adm-global\" >> regles/vague.yml` puis `echo \"src: 10.102.0.50\" >> regles/vague.yml`"
c1.hint.admin.1: "`contain disable adm-global`"
c1.debrief.title: "La vague de 10 h"
c1.debrief.lesson: "Le programme est entré par une mise à jour, sur un poste sans importance. Mais un administrateur du domaine s'y était connecté la veille : le programme a réutilisé cette session, et le compte valait partout. Un seul compte d'administration commun, utilisé sur n'importe quel poste, transforme une infection locale en catastrophe générale."
c1.debrief.p1: "Ne jamais se connecter à un poste ordinaire avec un compte d'administrateur du domaine : un poste d'administration dédié, rien d'autre."
c1.debrief.p2: "Séparer les comptes par niveau : un pour les postes, un pour les serveurs, un pour l'annuaire."
c1.debrief.p3: "Alerter quand un compte d'administration se connecte depuis un poste qui n'est pas un poste d'administration."
