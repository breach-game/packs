g3.briefing: "Three requests were enough to reach fifteen years of card applications. The bank's security officer has the morning free and asks you what to change. The settings are in a file. You fix it, and each fix closes one link of the chain."
g3.obj.idea: "Choose where to start"
g3.obj.role: "Take away the gateway role's rights over storage"
g3.obj.relay: "Limit what the relay can reach"
g3.obj.identity: "Make the identity service refuse a relayed request"
g3.obj.alerts: "Raise an alert when a role reads far more than usual"
g3.q.idea: "The security officer asks which fix matters most. What do you answer?"
g3.q.idea.crypt: "Encrypt all storage with a stronger algorithm than today's"
g3.q.idea.crypt.why: "Storage was already encrypted, and the role read in clear because it was allowed to. A stronger lock changes nothing for someone holding the key."
g3.q.idea.role: "Take away from the gateway's role the rights it never needed"
g3.q.idea.hide: "Rename the relay and change its address so that nobody finds it again"
g3.q.idea.hide.why: "A hidden door is found sooner or later, by a scanner if not by a person. What matters is what is behind it."
g3.check.role: "The gateway's role has no rights over storage"
g3.check.relay: "The relay only reaches the health page"
g3.check.identity: "The identity service refuses a relayed request"
g3.check.alerts: "An unusual volume of reads raises an alert"
g3.check.works: "Filtering and encryption stay on"
g3.ada.brief: "Last morning at Banque Mésange. The settings are in `dossier/cloud.yml`. But first, a decision."
g3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
g3.ada.answer.standard: "Answer my question first."
g3.ada.idea: "Yes. The other fixes make the gateway harder to fool. This one makes sure that a fooled gateway has nothing to give."
g3.ada.g.role: "Open the file: `edit dossier/cloud.yml`. Under `role-passerelle`, replace `storage: all` with `storage: none`, then `verify`."
g3.ada.g.role.standard: "Open `dossier/cloud.yml` and give the gateway's role only what its job needs. Then `verify`. To open the file: `edit dossier/cloud.yml`."
g3.ada.g.relay: "Next, the relay: write `relay_targets: health-only`, then `verify`."
g3.ada.g.relay.standard: "Reduce what the relay can reach to what it was made for. Then `verify`."
g3.ada.g.identity: "The identity service: write `access: signed-session`, then `verify`."
g3.ada.g.identity.standard: "Make sure the identity service no longer answers a request that was merely relayed. Then `verify`."
g3.ada.g.alerts: "Last setting, so that someone sees it next time: under `storage`, write `alerts: on`, then `verify`."
g3.ada.g.alerts.standard: "Make sure an unusual volume of reads is seen by someone. Then `verify`."
g3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
g3.ada.done: "Four lines changed. Each one alone would have broken the chain: together, the bank can get one wrong some day and still hold. Open the debrief: at the end, the real case this file comes from."
g3.hint.idea.1: "Which answer still protects the applications on the day the gateway is fooled anyway?"
g3.hint.role.1: "The line to change is `storage`, under `role-passerelle`."
g3.hint.role.2: "With the editor: `edit dossier/cloud.yml`, then Ctrl+S. With a command: type `sed -i \"s/storage: all/storage: none/\" dossier/cloud.yml`, then `verify`."
g3.hint.relay.1: "The line to change is `relay_targets`. The possible values are in the comments just above."
g3.hint.relay.2: "With the editor: `edit dossier/cloud.yml`, then Ctrl+S. With a command: type `sed -i \"s/relay_targets: any-internal/relay_targets: health-only/\" dossier/cloud.yml`, then `verify`."
g3.hint.identity.1: "The line to change is `access`, under `identity`."
g3.hint.identity.2: "With the editor: `edit dossier/cloud.yml`, then Ctrl+S. With a command: type `sed -i \"s/access: any-request/access: signed-session/\" dossier/cloud.yml`, then `verify`."
g3.hint.alerts.1: "The line to change is `alerts`, under `storage`."
g3.hint.alerts.2: "With the editor: `edit dossier/cloud.yml`, then Ctrl+S. With a command: type `sed -i \"s/alerts: off/alerts: on/\" dossier/cloud.yml`, then `verify`."
g3.debrief.title: "Each setting is one link"
g3.debrief.lesson: "The chain had three links: a relay that reached everything, an identity service that answered everyone, a role that read everything. You closed all three and added a watcher. Defence in depth is exactly that: no single setting has to be perfect."
g3.debrief.p1: "Least privilege first: it limits the damage of every mistake to come, including those nobody has thought of."
g3.debrief.p2: "A machine exposed to the internet relays nothing to internal services that it does not strictly need."
g3.debrief.p3: "An identity service asks for proof that the request really comes from the machine itself."
g3.debrief.p4: "A role that suddenly reads a million files is an alert. And an address where outsiders can report a flaw is worth having: that is how this kind of case often comes to light."
g3.facts.title: "What really happened: Capital One, 2019"
g3.facts.p1: "Banque Mésange does not exist. The scenario is inspired by the data breach that the American bank Capital One announced in July 2019."
g3.facts.p2: "According to the bank, an outside individual gained unauthorized access on 22 and 23 March 2019 through what it calls a \"configuration vulnerability\". Nobody noticed for almost four months."
g3.facts.p3: "On 17 July 2019, an external security researcher reported it through the bank's responsible disclosure programme. The bank confirmed the incident two days later and says it fixed the issue immediately."
g3.facts.p4: "About 100 million people in the United States and about 6 million in Canada were affected. The data came mostly from credit card applications made between 2005 and early 2019."
g3.facts.p5: "The bank counts about 140,000 US Social Security numbers, about 80,000 linked bank account numbers and about 1 million Canadian Social Insurance Numbers. It states that no credit card account numbers or log-in credentials were compromised, and that it believes the data was recovered without having been used for fraud or shared."
g3.facts.p6: "According to the US Department of Justice, the person responsible had built a tool that scanned the accounts of Amazon Web Services customers for misconfigured ones, downloaded data from more than 30 organisations and used their servers to mine cryptocurrency. A jury convicted that person in June 2022. The sentence, in October 2022, was time served and five years of probation."
g3.facts.p7: "Our relay, identity service and role are an illustration of what a cloud configuration error can look like. The sources read for this card speak only of a configuration vulnerability and of misconfigured accounts, and this case file shows no real address, command or key."
