g3.briefing: "Trois requêtes ont suffi pour atteindre quinze ans de demandes de carte. Le responsable de la sécurité de la banque a sa matinée et te demande quoi changer. Les réglages sont dans un fichier. Tu le corriges, et chaque correction ferme un maillon de la chaîne."
g3.obj.idea: "Choisir par où commencer"
g3.obj.role: "Retirer au rôle de la passerelle ses droits sur le stockage"
g3.obj.relay: "Limiter ce que le relais peut atteindre"
g3.obj.identity: "Faire refuser au service d'identité une requête relayée"
g3.obj.alerts: "Lever une alerte quand un rôle lit bien plus que d'habitude"
g3.q.idea: "Le responsable de la sécurité te demande quelle correction compte le plus. Que réponds-tu ?"
g3.q.idea.crypt: "Chiffrer le stockage avec un algorithme plus fort"
g3.q.idea.crypt.why: "Le stockage était déjà chiffré, et le rôle lisait en clair parce qu'il en avait le droit. Une serrure plus solide ne change rien pour celui qui tient la clé."
g3.q.idea.role: "Retirer au rôle de la passerelle les droits dont il n'a jamais eu besoin"
g3.q.idea.hide: "Renommer le relais pour que personne ne le trouve"
g3.q.idea.hide.why: "Une porte cachée finit par être trouvée, par un scanner sinon par une personne. Ce qui compte, c'est ce qu'il y a derrière."
g3.check.role: "Le rôle de la passerelle n'a aucun droit sur le stockage"
g3.check.relay: "Le relais n'atteint que la page de santé"
g3.check.identity: "Le service d'identité refuse une requête relayée"
g3.check.alerts: "Un volume de lectures inhabituel lève une alerte"
g3.check.works: "Le filtrage et le chiffrement restent allumés"
g3.ada.brief: "Dernière matinée à la Banque Mésange. Les réglages sont dans `dossier/cloud.yml`. Mais d'abord, une décision."
g3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
g3.ada.answer.standard: "Réponds d'abord à ma question."
g3.ada.idea: "Oui. Les autres corrections rendent la passerelle plus difficile à tromper. Celle-ci fait qu'une passerelle trompée n'a rien à donner."
g3.ada.g.role: "Ouvre le fichier : `edit dossier/cloud.yml`. Sous `role-passerelle`, remplace `storage: all` par `storage: none`, puis `verify`."
g3.ada.g.role.standard: "Ouvre `dossier/cloud.yml` et ne laisse au rôle de la passerelle que ce que son travail demande. Puis `verify`."
g3.ada.g.relay: "Ensuite, le relais : écris `relay_targets: health-only`, puis `verify`."
g3.ada.g.relay.standard: "Réduis ce que le relais peut atteindre à ce pour quoi il a été fait. Puis `verify`."
g3.ada.g.identity: "Le service d'identité : écris `access: signed-session`, puis `verify`."
g3.ada.g.identity.standard: "Fais en sorte que le service d'identité ne réponde plus à une requête simplement relayée. Puis `verify`."
g3.ada.g.alerts: "Dernier réglage, pour que quelqu'un le voie la prochaine fois : sous `storage`, écris `alerts: on`, puis `verify`."
g3.ada.g.alerts.standard: "Fais en sorte qu'un volume de lectures inhabituel soit vu par quelqu'un. Puis `verify`."
g3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
g3.ada.done: "Quatre lignes changées. Chacune seule aurait cassé la chaîne : ensemble, la banque peut en rater une un jour et tenir quand même. Ouvre le débrief : à la fin, la vraie affaire dont ce dossier est tiré."
g3.hint.idea.1: "Quelle réponse protège encore les demandes le jour où la passerelle se fait tromper quand même ?"
g3.hint.role.1: "La ligne à changer est `storage`, sous `role-passerelle`."
g3.hint.role.2: "Tape `sed -i \"s/storage: all/storage: none/\" dossier/cloud.yml`, puis `verify`."
g3.hint.relay.1: "La ligne à changer est `relay_targets`. Les valeurs possibles sont dans les commentaires juste au-dessus."
g3.hint.relay.2: "Tape `sed -i \"s/relay_targets: any-internal/relay_targets: health-only/\" dossier/cloud.yml`, puis `verify`."
g3.hint.identity.1: "La ligne à changer est `access`, sous `identity`."
g3.hint.identity.2: "Tape `sed -i \"s/access: any-request/access: signed-session/\" dossier/cloud.yml`, puis `verify`."
g3.hint.alerts.1: "La ligne à changer est `alerts`, sous `storage`."
g3.hint.alerts.2: "Tape `sed -i \"s/alerts: off/alerts: on/\" dossier/cloud.yml`, puis `verify`."
g3.debrief.title: "Chaque réglage est un maillon"
g3.debrief.lesson: "La chaîne avait trois maillons : un relais qui atteignait tout, un service d'identité qui répondait à tous, un rôle qui lisait tout. Tu as fermé les trois et ajouté un guetteur. La défense en profondeur, c'est exactement ça : aucun réglage n'a besoin d'être parfait."
g3.debrief.p1: "Le moindre privilège d'abord : il limite les dégâts de toutes les erreurs à venir, y compris celles auxquelles personne n'a pensé."
g3.debrief.p2: "Une machine exposée à internet ne relaie rien vers des services internes dont elle n'a pas strictement besoin."
g3.debrief.p3: "Un service d'identité demande la preuve que la requête vient vraiment de la machine elle-même."
g3.debrief.p4: "Un rôle qui lit soudain un million de fichiers est une alerte. Et une adresse où un inconnu peut signaler une faille vaut d'être tenue : c'est souvent ainsi que ce genre d'affaire se découvre."
g3.facts.title: "Ce qui s'est vraiment passé : Capital One, 2019"
g3.facts.p1: "La Banque Mésange n'existe pas. Le scénario s'inspire de la fuite de données que la banque américaine Capital One a annoncée en juillet 2019."
g3.facts.p2: "Selon la banque, une personne extérieure a obtenu un accès non autorisé les 22 et 23 mars 2019, par ce qu'elle appelle une « vulnérabilité de configuration ». Personne ne s'en est aperçu pendant près de quatre mois."
g3.facts.p3: "Le 17 juillet 2019, un chercheur en sécurité extérieur l'a signalée par le programme de divulgation responsable de la banque. La banque a confirmé l'incident deux jours plus tard et dit avoir corrigé le problème immédiatement."
g3.facts.p4: "Environ 100 millions de personnes aux États-Unis et environ 6 millions au Canada ont été touchées. Les données venaient surtout de demandes de carte de crédit faites entre 2005 et début 2019."
g3.facts.p5: "La banque compte environ 140 000 numéros de sécurité sociale américains, environ 80 000 numéros de comptes bancaires liés et environ 1 million de numéros d'assurance sociale canadiens. Elle affirme qu'aucun numéro de carte de crédit ni identifiant de connexion n'a été compromis, et qu'elle pense que les données ont été récupérées sans avoir servi à une fraude ni avoir été partagées."
g3.facts.p6: "Selon le ministère américain de la Justice, la personne responsable avait construit un outil qui parcourait les comptes des clients d'Amazon Web Services à la recherche de comptes mal configurés, a téléchargé les données de plus de 30 organisations et utilisé leurs serveurs pour miner de la cryptomonnaie. Un jury l'a déclarée coupable en juin 2022. La peine, en octobre 2022 : la détention déjà effectuée et cinq ans de mise à l'épreuve."
g3.facts.p7: "Notre relais, notre service d'identité et notre rôle sont une illustration de ce à quoi peut ressembler une erreur de configuration dans le cloud. Les sources lues pour cette fiche parlent seulement d'une vulnérabilité de configuration et de comptes mal configurés, et ce dossier ne montre aucune adresse, commande ni clé réelle."
