web.home.title: "Hirondelle - renting made simple"
web.home.h1: "Hirondelle"
web.home.p1: "Eleven thousand homes rented in thirty towns. You visit, you sign, you move in."
web.home.p2: "Everything is done online, and your documents follow you."
web.tenants.title: "Hirondelle - tenants"
web.tenants.h1: "Your documents, without the paperwork"
web.tenants.p1: "As soon as a document is ready, you get an email with a link:"
web.tenants.l1: "no account to create, no password to remember"
web.tenants.l2: "the link opens the document straight away, on any device"
web.tenants.l3: "lease, inventory, and the papers you sent us: identity card, pay slips, bank details"
web.tenants.p2: "Each link is unique and unreadable: it is yours alone."
web.docs.title: "Hirondelle - documents"
web.docs.h1: "Document portal (exercise copy)"
web.docs.p1: "This portal has no home page for tenants: documents open from the link received by email."
web.docs.p2: "Exercise copy for mandate HR-2027-010: every file here is made up."
