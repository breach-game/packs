file.readme: "Ligne Rouge workstation. Case file: Hirondelle. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate HR-2027-010. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE HR-2027-010\nClient: Hirondelle SAS. Scope: *.hirondelle.test, 10.70.0.0/24.\nPurpose: Hirondelle sends its tenants their documents (lease, inventory, identity papers, bank details) as links by email. Management wants to know whether a tenant can read something else than their own file.\nSet-up agreed: Ligne Rouge works on an exercise copy of the portal, which holds only made-up files. Ligne Rouge has a test tenant account and received its two documents by email, like any tenant. A witness file was created for a volunteer witness tenant: document number 000048207, as printed at the bottom of their paper copy. The proof expected is the witness marker written in that file, nothing else. No other tenant's file is to be read.\nSigned: the managing director of Hirondelle."
web.footer: "Hirondelle - fictional rental agency, BREACH case file 10"
