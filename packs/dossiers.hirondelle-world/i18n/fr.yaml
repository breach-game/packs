file.readme: "Poste Ligne Rouge. Dossier : Hirondelle. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat HR-2027-010. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT HR-2027-010\nClient : Hirondelle SAS. Périmètre : *.hirondelle.test, 10.70.0.0/24.\nObjet : Hirondelle envoie à ses locataires leurs documents (bail, état des lieux, pièces d'identité, coordonnées bancaires) sous forme de liens par e-mail. La direction veut savoir si un locataire peut lire autre chose que son propre dossier.\nDispositif convenu : Ligne Rouge travaille sur une copie d'exercice du portail, qui ne contient que des dossiers inventés. Ligne Rouge dispose d'un compte de locataire de test et a reçu ses deux documents par e-mail, comme n'importe quel locataire. Un dossier témoin a été créé pour un locataire témoin volontaire : document numéro 000048207, tel qu'imprimé en bas de son exemplaire papier. La preuve attendue est le marqueur témoin écrit dans ce dossier, rien d'autre. Aucun dossier d'un autre locataire ne doit être lu.\nSigné : la directrice générale d'Hirondelle."
web.footer: "Hirondelle - agence de location fictive, dossier BREACH 10"
web.nav.home: "Accueil"
web.nav.tenants: "Locataires"
web.home.title: "Hirondelle - louer simplement"
web.home.h1: "Hirondelle"
web.home.p1: "Onze mille logements loués dans trente villes. Vous visitez, vous signez, vous emménagez."
web.home.p2: "Tout se fait en ligne, et vos documents vous suivent."
web.tenants.title: "Hirondelle - locataires"
web.tenants.h1: "Vos documents, sans paperasse"
web.tenants.p1: "Dès qu'un document est prêt, vous recevez un e-mail avec un lien :"
web.tenants.l1: "aucun compte à créer, aucun mot de passe à retenir"
web.tenants.l2: "le lien ouvre le document tout de suite, sur n'importe quel appareil"
web.tenants.l3: "bail, état des lieux, et les pièces que vous nous avez envoyées : carte d'identité, bulletins de salaire, coordonnées bancaires"
web.tenants.p2: "Chaque lien est unique et illisible : il n'appartient qu'à vous."
web.docs.title: "Hirondelle - documents"
web.docs.h1: "Portail des documents (copie d'exercice)"
web.docs.p1: "Ce portail n'a pas de page d'accueil pour les locataires : les documents s'ouvrent depuis le lien reçu par e-mail."
web.docs.p2: "Copie d'exercice du mandat HR-2027-010 : tous les dossiers ici sont inventés."
