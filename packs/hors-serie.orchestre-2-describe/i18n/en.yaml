o2.briefing: "The dashboard's account cannot read secrets. The platform lead is relieved. Look anyway at what the pods' descriptions say: `kubectl describe` shows what the cluster knows about each container."
o2.obj.env: "Find a key readable without reading any secret"
o2.obj.privileged: "Find the pod that holds its machine"
o2.obj.why: "Explain why this pod is serious"
o2.q.privileged: "Which pod runs privileged, with its machine's root mounted? (its name)"
o2.q.why: "This pod was created for a network test two months ago. Why is it the most serious finding of the audit?"
o2.q.why.node: "Whoever controls it also controls its machine, and every pod running there"
o2.q.why.pod: "It has been wasting memory for two months"
o2.q.why.pod.why: "The waste is real but secondary. \"Privileged: true\" and the node's root mounted read-write erase the border between this container and its machine."
o2.q.why.network: "It uses the machine's network, so it slows the other pods down"
o2.q.why.network.why: "Sharing the network is a problem, but the most serious part is elsewhere: privileged with root mounted, this container holds the whole machine."
o2.ada.brief: "Is the dashboard's file still there? Fetch it if needed (`curl -s https://tableau.ondine.test/kubeconfig > .kube/config`), then `kubectl get pods`."
o2.ada.g.env: "Describe a player pod: `kubectl describe pod lecteur-7f9c4`. Look at the \"Environment\" section: which values come from a secret, which are written in clear?"
o2.ada.g.env.standard: "The account cannot read secrets. But everything that is not a secret, it reads. Search the descriptions."
o2.ada.env: "The database password comes from a secret, as it should. The licence key, though, is written in clear in the manifest. The account did not need to read a secret."
o2.ada.g.privileged: "List every pod in every namespace: `kubectl get pods -A`. One name stands out in kube-system. Describe it with `-n kube-system`. `answer privileged <name>`."
o2.ada.g.privileged.standard: "A pod forgotten in a system namespace. Find it, describe it. `answer privileged`."
o2.ada.g.why: "Read its description again: Privileged, HostPath, Host Network."
o2.ada.done: "Two findings without reading a single secret: a key in clear, and a pod that opens its machine. Time to fix them, on the defence side."
o2.hint.env.1: "`kubectl describe pod lecteur-7f9c4`, line LICENCE_DRM."
o2.hint.env.2: "`submit FLAG{ondine-env-en-clair-81d2}`"
o2.hint.privileged.1: "`kubectl get pods -A`, then `kubectl describe pod outil-debug -n kube-system`."
o2.hint.privileged.2: "`answer privileged outil-debug`"
o2.hint.why.1: "`answer node`"
o2.debrief.title: "What a description says"
o2.debrief.lesson: "The dashboard's account read no secret, and yet it read a key: it was written in clear in the container's variables, which every description shows. It also found a privileged test pod, with its machine's root mounted read-write, forgotten for two months in a system namespace."
o2.debrief.p1: "Put every sensitive value in a secret and reference it, never in clear in the manifest."
o2.debrief.p2: "Forbid privileged pods and host mounts with an admission policy, except for named exceptions."
o2.debrief.p3: "Give test tools an end date, and inventory what runs in system namespaces."
