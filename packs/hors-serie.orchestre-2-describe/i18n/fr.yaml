o2.briefing: "Le compte du tableau de bord ne lit pas les secrets. Le responsable est rassuré. Regarde quand même ce que disent les descriptions des pods : `kubectl describe` montre ce que la grappe sait de chaque conteneur."
o2.obj.env: "Trouver une clé lisible sans lire aucun secret"
o2.obj.privileged: "Trouver le pod qui a la main sur sa machine"
o2.obj.why: "Expliquer pourquoi ce pod est grave"
o2.q.privileged: "Quel pod tourne en mode privilégié, avec la racine de sa machine montée ? (son nom)"
o2.q.why: "Ce pod a été créé pour un test réseau il y a deux mois. Pourquoi est-ce le constat le plus grave de l'audit ?"
o2.q.why.node: "Qui le contrôle contrôle aussi sa machine, et tous les pods qui y tournent"
o2.q.why.pod: "Il consomme de la mémoire pour rien depuis deux mois"
o2.q.why.pod.why: "Le gaspillage est réel mais secondaire. « Privileged: true » et la racine du nœud montée en écriture effacent la frontière entre ce conteneur et sa machine."
o2.q.why.network: "Il utilise le réseau de la machine, donc il ralentit tous les autres pods qui tournent sur le nœud"
o2.q.why.network.why: "Le réseau partagé est un problème, mais le plus grave est ailleurs : privilégié et racine montée, ce conteneur a la main sur la machine entière."
o2.ada.brief: "Le fichier du tableau de bord est-il toujours là ? Récupère-le si besoin (`curl -s https://tableau.ondine.test/kubeconfig > .kube/config`), puis `kubectl get pods`."
o2.ada.g.env: "Décris un pod du lecteur : `kubectl describe pod lecteur-7f9c4`. Regarde la section « Environment » : quelles valeurs viennent d'un secret, lesquelles sont écrites en clair ?"
o2.ada.g.env.standard: "Le compte ne lit pas les secrets. Mais tout ce qui n'est pas un secret, il le lit. Cherche dans les descriptions."
o2.ada.env: "Le mot de passe de la base vient d'un secret, comme il faut. La clé de licence, elle, est écrite en clair dans le manifeste. Le compte n'a pas eu besoin de lire un secret."
o2.ada.g.privileged: "Liste tous les pods, tous espaces de noms confondus : `kubectl get pods -A`. Un nom détonne dans kube-system. Décris-le avec `-n kube-system`. `answer privileged <nom>`."
o2.ada.g.privileged.standard: "Un pod oublié dans un espace de noms système. Trouve-le, décris-le. `answer privileged`."
o2.ada.g.why: "Relis sa description : Privileged, HostPath, Host Network."
o2.ada.done: "Deux constats sans lire un seul secret : une clé en clair, et un pod qui ouvre sa machine. Reste à les corriger, côté défense."
o2.hint.env.1: "`kubectl describe pod lecteur-7f9c4`, ligne LICENCE_DRM."
o2.hint.env.2: "`submit FLAG{ondine-env-en-clair-81d2}`"
o2.hint.privileged.1: "`kubectl get pods -A`, puis `kubectl describe pod outil-debug -n kube-system`."
o2.hint.privileged.2: "`answer privileged outil-debug`"
o2.hint.why.1: "`answer node`"
o2.debrief.title: "Ce que dit une description"
o2.debrief.lesson: "Le compte du tableau de bord ne lisait aucun secret, et pourtant il a lu une clé : elle était écrite en clair dans les variables du conteneur, que toute description affiche. Il a aussi trouvé un pod de test privilégié, avec la racine de sa machine montée en écriture, oublié depuis deux mois dans un espace de noms système."
o2.debrief.p1: "Mettre toute valeur sensible dans un secret, et l'y référencer, jamais en clair dans le manifeste."
o2.debrief.p2: "Interdire les pods privilégiés et les montages de la machine par une politique d'admission, sauf exception nommée."
o2.debrief.p3: "Donner une date de fin aux outils de test, et faire l'inventaire de ce qui tourne dans les espaces de noms système."
