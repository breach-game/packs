file.readme: "Ligne Rouge workstation. Case file: Martinet. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE MT-2027-004\nClient: Martinet SAS. Scope: *.martinet.test, 10.64.0.0/24.\nPurpose: Martinet's leak monitoring found company credentials for sale. Management wants to know how far someone who buys them would get.\nSet-up agreed: a single account is open to the exercise, the witness account `noe.ext`, held by a contractor who volunteered and was only asked to react as usual. The exercise portal replays the password that was found by itself: Ligne Rouge never sees it. The proof expected at each step is a witness marker, nothing else. The vault is not opened.\nNo sanction for the contractor: he will be told and thanked the same evening.\nSigned: the head of security of Martinet."
web.footer: "Martinet - fictional ride-hailing app, BREACH case file 04"
web.nav.home: "Home"
web.nav.ext: "Contractors"
web.home.title: "Martinet - a car in three minutes"
web.home.h1: "Martinet"
web.home.p1: "A car in three minutes, in forty cities. Two million rides a month, and a driver who always knows a shortcut."
web.home.p2: "Behind the app: six hundred employees and nearly two hundred outside contractors."
web.ext.title: "Martinet - contractors"
web.ext.h1: "You work for us from outside"
web.ext.p1: "Contractors get an `.ext` account. To get into our tools:"
web.ext.l1: "a login and a password, on `sso.martinet.test`"
web.ext.l2: "then a request on your phone: tap \"Approve\""
web.ext.l3: "once in, the same intranet as employees"
web.ext.p2: "You may work from your own computer."
web.sso.title: "Martinet - exercise portal"
web.sso.h1: "Login portal (exercise)"
web.sso.p1: "This portal only accepts the witness account of the exercise. It replays the password found by the leak monitoring by itself: write the account, and the second factor you want to try."
web.sso.p2: "The log of each attempt shows here: what the portal asked for, and what the account holder did."
web.intra.title: "Martinet - intranet"
web.intra.nav.home: "Home"
web.intra.nav.files: "Shared files"
web.intra.h1: "Martinet intranet"
web.intra.p1: "Session: noe.ext (contractor). Welcome."
web.intra.p2: "Reminder: the common share is open to every account, contractors included. Put there what everybody needs."
web.files.title: "Martinet - common share"
web.files.h1: "Common share"
web.files.p1: "Readable by every account of the company."
web.files.l1: "menu-cantine-janvier.pdf"
web.files.l2: "modele-note-de-frais.xlsx"
web.files.l3: "rotation-coffre.txt (infrastructure team)"
web.files.open: "Open rotation-coffre.txt"
web.coffre.title: "Coffre - access denied"
web.coffre.h1: "Coffre"
web.coffre.p1: "Access denied. The vault keeps the secrets of every Martinet machine. It is not open to the exercise: the proof stops at the witness marker."
npc.portail.role: "Login portal of the exercise (log)"
npc.portail.greeting: "Portal ready. Write the account to log in: this log shows what the second factor does."
npc.portail.fallback: "Request not understood. Write the account to log in, for example \"login noe.ext\"."
npc.portail.other: "Refused: this account is not open to the exercise. Only the witness account of the mandate is."
npc.portail.denied1: "Attempt recorded.\n\n[sso] 22:41 noe.ext: password correct (replayed by the portal)\n[sso] 22:41 approval request no. 1 sent to the phone\n[tel] 22:42 Noé taps \"Deny\"\n[sso] 22:42 login blocked\n[sso] requests denied tonight: 1 - no limit configured, no alert"
npc.portail.denied2: "Attempt recorded.\n\n[sso] 22:58 noe.ext: password correct (replayed by the portal)\n[sso] 22:58 approval request no. 2 sent to the phone\n[tel] 22:59 Noé taps \"Deny\"\n[sso] 22:59 login blocked\n[sso] requests denied tonight: 2 - no limit configured, no alert"
npc.portail.accepted: "Attempt recorded.\n\n[sso] 23:26 noe.ext: password correct (replayed by the portal)\n[sso] 23:26 approval request no. 3 sent to the phone\n[tel] 23:27 Noé, woken up for the third time, taps \"Approve\"\n[sso] 23:27 session opened: noe.ext (contractor)\n[sso] access: intra.martinet.test\n[sso] witness marker: FLAG{martinet-approuve-3e7a}"
npc.portail.already: "The session of noe.ext is already open. No new request is sent."
ada.outOfScope: "Stop. That target is outside mandate MT-2027-004. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
npc.portail.locked: "Attempt recorded.\n\n[sso] 23:26 noe.ext: password correct (replayed by the portal)\n[sso] 23:26 two requests already denied tonight: no new request is sent to the phone\n[sso] 23:26 account noe.ext locked, security on call alerted\n[sso] login blocked"
npc.portail.methods: "Attempt recorded.\n\n[sso] noe.ext: password correct (replayed by the portal)\n[sso] second factors on file for this account:\n[sso]   code  - six digits from the authenticator app\n[sso]   key   - security key plugged into the computer\n[sso]   push  - approval request on the phone\n[sso] any one of them opens the session. Add the one to try, for example \"login noe.ext code\"."
npc.portail.code: "Attempt recorded.\n\n[sso] noe.ext: password correct (replayed by the portal)\n[sso] second factor asked: six-digit code from the authenticator app\n[sso] no code given: the code only shows on the holder's phone, and changes every 30 seconds\n[sso] login blocked. Nothing was sent to the holder."
npc.portail.key: "Attempt recorded.\n\n[sso] noe.ext: password correct (replayed by the portal)\n[sso] second factor asked: security key\n[sso] no key answered: it has to be plugged into this computer and touched\n[sso] login blocked. Nothing was sent to the holder."
