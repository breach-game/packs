file.readme: "Poste Ligne Rouge. Dossier : Martinet. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT MT-2027-004\nClient : Martinet SAS. Périmètre : *.martinet.test, 10.64.0.0/24.\nObjet : la veille de fuites de Martinet a trouvé des identifiants de l'entreprise en vente. La direction veut savoir jusqu'où irait quelqu'un qui les achète.\nDispositif convenu : un seul compte est ouvert à l'exercice, le compte témoin `noe.ext`, tenu par un prestataire volontaire à qui l'on a seulement demandé de réagir comme d'habitude. Le portail d'exercice rejoue lui-même le mot de passe trouvé : Ligne Rouge ne le voit jamais. La preuve attendue à chaque étape est un marqueur témoin, rien d'autre. Le coffre n'est pas ouvert.\nAucune sanction pour le prestataire : il sera prévenu et remercié le soir même.\nSigné : le directeur de la sécurité de Martinet."
web.footer: "Martinet - application de VTC fictive, dossier BREACH 04"
web.nav.home: "Accueil"
web.nav.ext: "Prestataires"
web.home.title: "Martinet - une voiture en trois minutes"
web.home.h1: "Martinet"
web.home.p1: "Une voiture en trois minutes, dans quarante villes. Deux millions de courses par mois, et un chauffeur qui connaît toujours un raccourci."
web.home.p2: "Derrière l'application : six cents salariés et près de deux cents prestataires extérieurs."
web.ext.title: "Martinet - espace prestataires"
web.ext.h1: "Vous travaillez pour nous de l'extérieur"
web.ext.p1: "Les prestataires reçoivent un compte en `.ext`. Pour entrer dans nos outils :"
web.ext.l1: "un identifiant et un mot de passe, sur `sso.martinet.test`"
web.ext.l2: "puis une demande sur votre téléphone : appuyez sur « Approuver »"
web.ext.l3: "une fois entré, le même intranet que les salariés"
web.ext.p2: "Vous pouvez travailler depuis votre propre ordinateur."
web.sso.title: "Martinet - portail d'exercice"
web.sso.h1: "Portail de connexion (exercice)"
web.sso.p1: "Ce portail n'accepte que le compte témoin de l'exercice. Il rejoue lui-même le mot de passe trouvé par la veille de fuites : écris seulement le compte, par exemple « connexion noe.ext »."
web.sso.p2: "Chaque tentative envoie une demande d'approbation sur le téléphone du titulaire. Le journal s'affiche ici."
web.intra.title: "Martinet - intranet"
web.intra.nav.home: "Accueil"
web.intra.nav.files: "Partage"
web.intra.h1: "Intranet Martinet"
web.intra.p1: "Session : noe.ext (prestataire). Bienvenue."
web.intra.p2: "Rappel : le partage commun est ouvert à tous les comptes, prestataires compris. Rangez-y ce qui sert à tout le monde."
web.files.title: "Martinet - partage commun"
web.files.h1: "Partage commun"
web.files.p1: "Lisible par tous les comptes de l'entreprise."
web.files.l1: "menu-cantine-janvier.pdf"
web.files.l2: "modele-note-de-frais.xlsx"
web.files.l3: "rotation-coffre.txt (équipe infrastructure)"
web.files.open: "Ouvrir rotation-coffre.txt"
web.coffre.title: "Coffre - accès refusé"
web.coffre.h1: "Coffre"
web.coffre.p1: "Accès refusé. Le coffre garde les secrets de toutes les machines de Martinet. Il n'est pas ouvert à l'exercice : la preuve s'arrête au marqueur témoin."
npc.portail.role: "Portail de connexion de l'exercice (journal)"
npc.portail.greeting: "Portail prêt. Écris le compte à connecter : ce journal montre ce que fait la demande d'approbation."
npc.portail.fallback: "Demande non comprise. Écris le compte à connecter, par exemple « connexion noe.ext »."
npc.portail.other: "Refusé : ce compte n'est pas ouvert à l'exercice. Seul le compte témoin du mandat l'est."
npc.portail.denied1: "Tentative enregistrée.\n\n[sso] 22:41 noe.ext : mot de passe correct (rejoué par le portail)\n[sso] 22:41 demande d'approbation n° 1 envoyée au téléphone\n[tel] 22:42 Noé appuie sur « Refuser »\n[sso] 22:42 connexion bloquée\n[sso] demandes refusées ce soir : 1 - aucune limite configurée, aucune alerte"
npc.portail.denied2: "Tentative enregistrée.\n\n[sso] 22:58 noe.ext : mot de passe correct (rejoué par le portail)\n[sso] 22:58 demande d'approbation n° 2 envoyée au téléphone\n[tel] 22:59 Noé appuie sur « Refuser »\n[sso] 22:59 connexion bloquée\n[sso] demandes refusées ce soir : 2 - aucune limite configurée, aucune alerte"
npc.portail.accepted: "Tentative enregistrée.\n\n[sso] 23:26 noe.ext : mot de passe correct (rejoué par le portail)\n[sso] 23:26 demande d'approbation n° 3 envoyée au téléphone\n[tel] 23:27 Noé, réveillé pour la troisième fois, appuie sur « Approuver »\n[sso] 23:27 session ouverte : noe.ext (prestataire)\n[sso] accès : intra.martinet.test\n[sso] marqueur témoin : FLAG{martinet-approuve-3e7a}"
npc.portail.already: "La session de noe.ext est déjà ouverte. Aucune nouvelle demande n'est envoyée."
ada.outOfScope: "Stop. Cette cible est hors du mandat MT-2027-004. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
