m1.briefing: "Mardi, 6 h 52. Au dépôt nord de Transports Gavotte, les chauffeurs attendent leurs tournées depuis 6 h. Le service qui les calcule ne répond plus depuis la mise à jour de la nuit. Tu as le compte d'astreinte sur le serveur (`astreinte`), et les outils de l'équipe : `deploy`, `rollback`, `flag`."
m1.obj.cause: "Trouver ce qui fait tomber la nouvelle version"
m1.obj.first: "Choisir le premier geste"
m1.obj.back: "Remettre le calcul des tournées en marche, et le vérifier"
m1.q.cause: "Quelle option, allumée avec la version 4.2.0, fait planter le service au démarrage ? (son nom complet)"
m1.q.first: "Soixante camions attendent. Quel est le premier geste ?"
m1.q.first.flag: "Éteindre l'option, la version 4.2.0 reste en place"
m1.q.first.rollback: "Revenir en arrière à la version 4.1.3 pour tout le service"
m1.q.first.rollback.why: "Ça marche aussi, mais c'est un geste plus lourd : douze minutes de redémarrage, et la migration de la nuit, elle, ne revient pas en arrière. L'option suffit à faire repartir le service."
m1.q.first.restart: "Redémarrer le serveur, le service repartira peut-être"
m1.q.first.restart.why: "Le service a déjà redémarré cinq fois avant que systemd abandonne. Même version, même option, même plantage."
m1.ada.brief: "Vérifie d'abord ce que voit tout le monde : `curl -s https://planif.gavotte.test/sante`. Puis va lire le serveur : `ssh astreinte@planif.gavotte.test`."
m1.ada.g.cause: "Sur le serveur, `systemctl status tournees`, puis le journal complet : `journalctl -u tournees`. Lis ce qui se passe juste avant le « panic ». `answer cause <option>`."
m1.ada.g.cause.standard: "Le journal du service dit ce qui a changé à 5 h 58 et ce qu'il chargeait quand il est tombé. `answer cause`."
m1.ada.cause: "La version 4.2.0 est arrivée avec une option allumée, et c'est le chargement des zones d'hiver qui plante. Deux portes de sortie : éteindre l'option, ou revenir à 4.1.3."
m1.ada.g.first: "Regarde les deux outils : `deploy` liste les versions, `flag list` les options. Lequel change le moins de choses ?"
m1.ada.g.first.standard: "Compare ce que change chaque geste, et ce qu'il coûte."
m1.ada.flagged: "Option éteinte. Le service redémarre tout seul sur la même version."
m1.ada.rolledback: "Retour à 4.1.3. Ça repart, mais regarde le journal : la migration de la nuit est restée."
m1.ada.g.back: "Fais le geste : `flag set planif.zones-hiver off`. Puis vérifie : `curl -s https://planif.gavotte.test/sante`."
m1.ada.g.back.standard: "Remets le service en marche avec l'outil le plus léger, puis vérifie ce qu'il répond."
m1.ada.done: "58 tournées calculées, les camions partent avec quarante minutes de retard. Mais le journal dit autre chose : 312 tournées pointent vers des zones inconnues. La nuit a laissé des traces dans la base."
m1.hint.cause.1: "Dans `journalctl -u tournees` : « flag planif.zones-hiver=on: loading winter zones », puis le « panic »."
m1.hint.cause.2: "`answer cause planif.zones-hiver`"
m1.hint.first.1: "`answer flag`"
m1.hint.back.1: "`flag set planif.zones-hiver off`"
m1.hint.back.2: "`curl -s https://planif.gavotte.test/sante`"
m1.debrief.title: "Six heures du matin"
m1.debrief.lesson: "La version 4.2.0 a été livrée à 5 h 58 avec une option neuve déjà allumée. Le code des zones d'hiver plantait au démarrage, systemd a abandonné après cinq essais, et personne ne l'a vu avant l'arrivée des chauffeurs. L'option était la bonne poignée : l'éteindre a remis le service en route sans toucher à la version."
m1.debrief.p1: "Livrer une option nouvelle éteinte, et l'allumer à part, quand quelqu'un regarde."
m1.debrief.p2: "Préférer le plus petit geste réversible : une option plutôt qu'un retour arrière, un retour arrière plutôt qu'une réparation en direct."
m1.debrief.p3: "Surveiller ce que voit l'utilisateur (la page de santé, les tournées calculées), pas seulement que le déploiement « a réussi »."
