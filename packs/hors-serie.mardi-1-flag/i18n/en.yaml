m1.briefing: "Tuesday, 6:52. At the north depot of Transports Gavotte, drivers have been waiting for their rounds since 6:00. The service that works them out stopped answering after last night's update. You have the on-call account on the server (`astreinte`), and the team's tools: `deploy`, `rollback`, `flag`."
m1.obj.cause: "Find what brings the new version down"
m1.obj.first: "Choose the first move"
m1.obj.back: "Get the rounds planner running again, and check it"
m1.q.cause: "Which option, switched on with version 4.2.0, makes the service crash at start? (its full name)"
m1.q.first: "Sixty trucks are waiting. What is the first move?"
m1.q.first.flag: "Switch the option off, version 4.2.0 stays in place"
m1.q.first.rollback: "Roll the whole service back to version 4.1.3"
m1.q.first.rollback.why: "It works too, but it is a heavier move: twelve minutes of restart, and last night's migration does not roll back. The option is enough to get the service going."
m1.q.first.restart: "Restart the server, the service may come back"
m1.q.first.restart.why: "The service already restarted five times before systemd gave up. Same version, same option, same crash."
m1.ada.brief: "First check what everyone sees: `curl -s https://planif.gavotte.test/sante`. Then go and read the server: `ssh astreinte@planif.gavotte.test`."
m1.ada.g.cause: "On the server, `systemctl status tournees`, then the full journal: `journalctl -u tournees`. Read what happens just before the \"panic\". `answer cause <option>`."
m1.ada.g.cause.standard: "The service journal says what changed at 5:58 and what it was loading when it fell. `answer cause`."
m1.ada.cause: "Version 4.2.0 arrived with an option switched on, and loading the winter zones is what crashes. Two ways out: switch the option off, or go back to 4.1.3."
m1.ada.g.first: "Look at both tools: `deploy` lists the versions, `flag list` the options. Which one changes the least?"
m1.ada.g.first.standard: "Compare what each move changes, and what it costs."
m1.ada.flagged: "Option off. The service restarts on its own on the same version."
m1.ada.rolledback: "Back to 4.1.3. It runs again, but look at the journal: last night's migration stayed."
m1.ada.g.back: "Make the move: `flag set planif.zones-hiver off`. Then check: `curl -s https://planif.gavotte.test/sante`."
m1.ada.g.back.standard: "Get the service running with the lightest tool, then check what it answers."
m1.ada.done: "58 rounds computed, the trucks leave forty minutes late. But the journal says something else: 312 rounds point to unknown zones. The night left marks in the database."
m1.hint.cause.1: "In `journalctl -u tournees`: \"flag planif.zones-hiver=on: loading winter zones\", then the \"panic\"."
m1.hint.cause.2: "`answer cause planif.zones-hiver`"
m1.hint.first.1: "`answer flag`"
m1.hint.back.1: "`flag set planif.zones-hiver off`"
m1.hint.back.2: "`curl -s https://planif.gavotte.test/sante`"
m1.debrief.title: "Six in the morning"
m1.debrief.lesson: "Version 4.2.0 shipped at 5:58 with a new option already on. The winter zones code crashed at start, systemd gave up after five tries, and nobody saw it before the drivers arrived. The option was the right handle: switching it off brought the service back without touching the version."
m1.debrief.p1: "Ship a new option switched off, and switch it on separately, while someone is watching."
m1.debrief.p2: "Prefer the smallest reversible move: an option rather than a rollback, a rollback rather than a live repair."
m1.debrief.p3: "Watch what the user sees (the health page, the rounds computed), not only that the deployment \"succeeded\"."
