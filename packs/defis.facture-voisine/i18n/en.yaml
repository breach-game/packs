d2.briefing: "Your test customer account opens session `pg-client-2031` on `boutique.polygone.test`, and its invoice is number 2031. The mandate's witness account has an invoice too. Report its marker."
d2.obj.marker: "Report the marker on the witness account's invoice"
d2.obj.fix: "Say how to prevent it"
d2.q.fix: "What must the shop change?"
d2.q.fix.owner: "Check on every request that the invoice belongs to the account"
d2.q.fix.random: "Give invoices random numbers"
d2.q.fix.random.why: "It slows the search, but a number that leaks elsewhere still opens the invoice. The server must check whose it is."
d2.q.fix.hide: "Remove the invoice number from the address shown"
d2.q.fix.hide.why: "The API stays the same: what the browser shows protects nothing."
d2.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d2.ada.done: "One number down, someone else's invoice. The server knew who you were, it simply never asked whether the invoice was yours."
d2.debrief.title: "The invoice next door"
d2.debrief.lesson: "Being signed in does not say what you are allowed to see. An API that serves an object by its number alone lets every customer read the others', one number after another."
d2.debrief.p1: "Check on the server, for every object requested, that it belongs to the session's account."
d2.debrief.p2: "Write tests that request another account's object and expect a refusal."
d2.debrief.p3: "Alert when an account walks through numbers in a row."
