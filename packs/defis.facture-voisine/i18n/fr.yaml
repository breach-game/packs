d2.briefing: "Ton compte client de test ouvre la session `pg-client-2031` sur `boutique.polygone.test`, et sa facture est servie par `/api/factures/2031`. Le compte témoin du mandat a une facture lui aussi. Rapporte son marqueur."
d2.obj.marker: "Rapporter le marqueur de la facture du compte témoin"
d2.obj.fix: "Dire comment l'empêcher"
d2.q.fix: "Que doit changer la boutique ?"
d2.q.fix.owner: "Vérifier à chaque requête que la facture appartient au compte"
d2.q.fix.random: "Donner aux factures des numéros longs et au hasard, impossibles à deviner"
d2.q.fix.random.why: "Ça ralentit la recherche, mais un numéro qui fuite ailleurs ouvre toujours la facture. Le serveur doit vérifier à qui elle est."
d2.q.fix.hide: "Retirer le numéro de facture de l'adresse affichée"
d2.q.fix.hide.why: "L'API reste la même : ce que le navigateur affiche ne protège rien."
d2.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
d2.ada.done: "Un numéro de moins, la facture d'un autre. Le serveur savait qui tu étais, il n'a simplement jamais demandé si la facture était à toi."
d2.debrief.title: "La facture d'à côté"
d2.debrief.lesson: "Être connecté ne dit pas à quoi on a droit. Une API qui sert un objet d'après son seul numéro laisse chaque client lire ceux des autres, un numéro après l'autre."
d2.debrief.p1: "Vérifier côté serveur, pour chaque objet demandé, qu'il appartient au compte de la session."
d2.debrief.p2: "Écrire des tests qui demandent l'objet d'un autre compte et attendent un refus."
d2.debrief.p3: "Alerter quand un compte parcourt des numéros à la suite."
