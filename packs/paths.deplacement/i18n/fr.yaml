why.capture: "Lire la capture d'un Wi-Fi invités : des noms, des tailles, et la seule appli qui parle encore en clair."
why.cafe: "Quatre jours dans un café de gare : le mythe, le jumeau, les voisins, et tes propres réseaux mémorisés."
why.qr: "Un autocollant sur un horodateur, un colis, un mail qui n'a qu'une image : lire un QR code avant de l'ouvrir."
why.mail: "Reconnaître un message qui n'est pas ce qu'il prétend être."
why.texts: "Un SMS qui se fait passer pour le support informatique, et pourquoi une clé de sécurité ne s'y laisse pas prendre."
