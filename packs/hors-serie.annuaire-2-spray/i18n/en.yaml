d2.briefing: "The next morning. Anonymous access is closed, but it had been open for years. The IT manager leaves you the SOC console during the 9 a.m. meeting. \"If someone read the account list before you, what will they do with it?\""
d2.obj.rule: "Write a rule that sees one password tried on many accounts"
d2.obj.who: "Find the account that gave in"
d2.obj.stop: "Cut that account off"
d2.q.who: "Which account did the outside address open? Give its `uid`."
d2.contain.svc: "Account svc-sauvegarde disabled in the directory, sessions cut. Tonight's backup will wait for a new account."
d2.ada.brief: "A detection rule is waiting: `cat regles/pulverisation.yml`. Directory sign-in failures are written `err=49` in the `ldap` log. Start by catching them (`echo \"err: 49\" >> regles/pulverisation.yml`), then `rule test regles/pulverisation.yml`."
d2.ada.g.rule: "One failure alone is someone making a mistake. What gives the attack away is the number of failures per address: add `count|gte: 3`, `within: 10` and `by: src` (one line each, with `echo … >>`), then run `rule test regles/pulverisation.yml` again."
d2.ada.g.rule.standard: "The rule must alert on the attack's failures and on no ordinary typo. Count failures per source address."
d2.ada.again.standard: "A lone failure must not alert, a series from one address must. A rule can count: `count|gte`, `within` (minutes) and `by` (the field that groups)."
d2.ada.again: "Too broad or too narrow: a single failure must not alert, a series from one address must. Think `count|gte`, `within` and `by`."
d2.ada.failures: "Directory sign-in failures, from an outside address, on different accounts twenty seconds apart. Nobody mistypes a password like that."
d2.ada.rule: "Rule accepted: one address, one account after another, a single try per account so nobody gets locked. That is password spraying."
d2.ada.success: "Alert: a sign-in from the same address just succeeded (`err=0`). Look at the directory's log: `soc logs annuaire ldap`."
d2.ada.ssh: "The account that gave in just signed in over SSH to the backup server."
d2.ada.copy: "The backup server is sending tens of megabytes to the outside address. The copy has begun."
d2.ada.g.who: "Read the directory's log: `soc logs annuaire ldap`. The outside address's line ending in `err=0` tells which account gave in. `answer who <uid>`. If the line is not there yet, wait for the alert and run it again."
d2.ada.g.who.standard: "In the directory's log, find the outside address's successful sign-in."
d2.ada.g.stop: "Cut the account off: `contain disable svc-sauvegarde`."
d2.ada.g.stop.standard: "Cut off the account that gave in, before it serves any longer."
d2.ada.stopped: "Account cut off. If anyone uses it again, the sign-ins will fail. Now, how far did they get?"
d2.ada.done: "The \"temporary\" password written in the directory, the account list read anonymously, and a service account that is an admin. Three oversights, one path. Now we must trace it."
d2.hint.rule.1: "`echo \"err: 49\" >> regles/pulverisation.yml`"
d2.hint.rule.2: "`echo \"count|gte: 3\" >> regles/pulverisation.yml`, then `within: 10` and `by: src` the same way."
d2.hint.rule.3: "`rule test regles/pulverisation.yml`"
d2.hint.who.1: "`soc logs annuaire ldap`, the line from 198.51.100.77 with `err=0`."
d2.hint.who.2: "`answer who svc-sauvegarde`"
d2.hint.stop.1: "`contain disable svc-sauvegarde`"
d2.debrief.title: "One password for all"
d2.debrief.lesson: "The attacker had read the directory while it was open. They tried a single password on every account, once each, so nobody got locked: a rule counting failures per account saw nothing. The backup account gave in, with the password written in its description, and it was an admin. Counting failures per address saw it; cutting the account off stopped the copy."
d2.debrief.p1: "Count sign-in failures per address and per period, not only per account: a spray makes one try per account."
d2.debrief.p2: "A service account signs in only from its own machines: refuse any sign-in from elsewhere."
d2.debrief.p3: "Prepare the cut-off move in advance: who can disable a service account, and what it stops."
