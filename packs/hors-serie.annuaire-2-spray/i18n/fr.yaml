d2.briefing: "Le lendemain matin. L'accès anonyme est fermé, mais il était ouvert depuis des années. Le responsable informatique te laisse la console du SOC pendant la réunion de 9 h. « Si quelqu'un a lu la liste des comptes avant toi, qu'est-ce qu'il en fait ? »"
d2.obj.rule: "Écrire une règle qui voit un mot de passe essayé sur beaucoup de comptes"
d2.obj.who: "Trouver le compte qui a cédé"
d2.obj.stop: "Couper ce compte"
d2.q.who: "Quel compte l'adresse extérieure a-t-elle ouvert ? Donne son `uid`."
d2.contain.svc: "Compte svc-sauvegarde désactivé dans l'annuaire, sessions coupées. La sauvegarde de cette nuit attendra un nouveau compte."
d2.ada.brief: "Une règle de détection t'attend : `cat regles/pulverisation.yml`. Les échecs de connexion à l'annuaire s'écrivent `err=49` dans le journal `ldap`. Commence par les attraper (`echo \"err: 49\" >> regles/pulverisation.yml`), puis `rule test regles/pulverisation.yml`."
d2.ada.g.rule: "Un échec seul, c'est quelqu'un qui se trompe. Ce qui trahit l'attaque, c'est le nombre d'échecs par adresse : ajoute `count|gte: 3`, `within: 10` et `by: src` (une ligne chacun, avec `echo … >>`), puis relance `rule test regles/pulverisation.yml`."
d2.ada.g.rule.standard: "La règle doit alerter sur les échecs de l'attaque et sur aucune faute de frappe ordinaire. Compte les échecs par adresse source."
d2.ada.again: "Trop large ou trop étroite : un échec isolé ne doit pas alerter, une série depuis une même adresse oui. Pense `count|gte`, `within` et `by`."
d2.ada.failures: "Des échecs de connexion à l'annuaire, depuis une adresse extérieure, sur des comptes différents à vingt secondes d'intervalle. Personne ne se trompe de mot de passe comme ça."
d2.ada.rule: "Règle validée : une adresse, un compte après l'autre, un seul essai par compte pour ne bloquer personne. C'est une pulvérisation de mots de passe."
d2.ada.success: "Alerte : une connexion de la même adresse vient de réussir (`err=0`). Regarde le journal de l'annuaire : `soc logs annuaire ldap`."
d2.ada.ssh: "Le compte qui a cédé vient de se connecter en SSH au serveur de sauvegarde."
d2.ada.copy: "Le serveur de sauvegarde envoie des dizaines de mégaoctets vers l'adresse extérieure. La copie a commencé."
d2.ada.g.who: "Lis le journal de l'annuaire : `soc logs annuaire ldap`. La ligne de l'adresse extérieure qui finit par `err=0` dit quel compte a cédé. `answer who <uid>`."
d2.ada.g.who.standard: "Dans le journal de l'annuaire, trouve la connexion réussie de l'adresse extérieure."
d2.ada.g.stop: "Coupe le compte : `contain disable svc-sauvegarde`."
d2.ada.g.stop.standard: "Coupe le compte qui a cédé, avant qu'il serve plus longtemps."
d2.ada.stopped: "Compte coupé. Les connexions suivantes échouent, la copie s'arrête. Reste à savoir jusqu'où il est allé."
d2.ada.done: "Le mot de passe « provisoire » écrit dans l'annuaire, la liste des comptes lue en anonyme, et un compte de service administrateur. Trois négligences, un seul chemin. Il faut maintenant le retracer."
d2.hint.rule.1: "`echo \"err: 49\" >> regles/pulverisation.yml`"
d2.hint.rule.2: "`echo \"count|gte: 3\" >> regles/pulverisation.yml`, puis `within: 10` et `by: src` de la même façon."
d2.hint.rule.3: "`rule test regles/pulverisation.yml`"
d2.hint.who.1: "`soc logs annuaire ldap`, la ligne de 198.51.100.77 avec `err=0`."
d2.hint.who.2: "`answer who svc-sauvegarde`"
d2.hint.stop.1: "`contain disable svc-sauvegarde`"
d2.debrief.title: "Un mot de passe pour tous"
d2.debrief.lesson: "L'attaquant avait lu l'annuaire quand il était ouvert. Il a essayé un seul mot de passe sur chaque compte, une fois chacun, pour ne bloquer personne : une règle qui compte les échecs par compte ne voyait rien. Le compte de la sauvegarde a cédé, avec le mot de passe écrit dans sa description, et il était administrateur. Compter les échecs par adresse l'a vu ; couper le compte a arrêté la copie."
d2.debrief.p1: "Compter les échecs de connexion par adresse et par période, pas seulement par compte : une pulvérisation ne fait qu'un essai par compte."
d2.debrief.p2: "Un compte de service ne se connecte que depuis ses machines : refuser toute connexion d'ailleurs."
d2.debrief.p3: "Préparer le geste de coupure à l'avance : qui peut désactiver un compte de service, et ce que ça arrête."
