c3.briefing: "The accounts opened with real passwords, reused from other sites. Cormoran's sign-in policy is in `connexion/politique.yml`. Close the door, then decide what to tell customers."
c3.obj.factor: "Make a stolen password no longer enough"
c3.obj.watch: "See an attack across the whole site, and warn the customer"
c3.obj.tell: "Decide what to tell customers"
c3.q.tell: "What does Cormoran tell its customers?"
c3.q.tell.everyone: "Tell every customer, require a new password and the second step"
c3.q.tell.opened: "Tell only the owners of the accounts the fraudsters opened"
c3.q.tell.blame: "Write that customers reused their passwords, so the fault is theirs"
c3.check.factor: "Second step required, leaked passwords refused, reset after a leak"
c3.check.watch: "Alert on failures across the site, email for each new device"
c3.check.works: "The sign-in file is still there"
c3.ada.brief: "Read the policy: `cat connexion/politique.yml`. Two layers, then a decision."
c3.ada.g.factor: "First, make a password no longer enough: `second_factor: required`, `leaked_passwords: refused`, `reset_on_leak: on`. Open `edit connexion/politique.yml` or use `sed -i`, then `verify`."
c3.ada.g.factor.standard: "First, make a password stolen elsewhere open nothing here. Then `verify`."
c3.ada.factor: "With a second step, the fraudsters' list is worth little: a password alone no longer opens an account."
c3.ada.g.watch: "Next, see and warn: `failed_logins_alert: site-wide` and `new_device_email: on`, then `verify`."
c3.ada.g.watch.standard: "Next, make a scattered attack go off, and let customers know when an unknown device signs in. Then `verify`."
c3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
c3.ada.ready: "The door holds. The customers remain. I leave the decision to you."
c3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
c3.ada.answer.standard: "My question is waiting in the messenger."
c3.ada.everyone: "The choice that protects most: the exposed cousins learn what got out, and nobody keeps a password the fraudsters know."
c3.ada.opened: "The owners of the opened accounts are told. The million cousins whose profiles are for sale learn nothing."
c3.ada.blame: "Legally tempting, but most of the people exposed had reused nothing at all: they were cousins. And it was Cormoran that did not require a second step."
c3.ada.done: "A second step, leaked passwords refused, an alert that counts the right way. Open the debrief: the real case is at the end."
c3.hint.factor.1: "Three lines to change, with `sed -i \"s/old/new/\" connexion/politique.yml`."
c3.hint.factor.2: "`second_factor: required`, `leaked_passwords: refused`, `reset_on_leak: on`"
c3.hint.watch.1: "`failed_logins_alert: site-wide` and `new_device_email: on`, then `verify`."
c3.hint.tell.1: "No answer is wrong. Think of the exposed people who did nothing."
c3.debrief.title: "The front door"
c3.debrief.lesson: "No code flaw here: reused passwords, a sign-in with no second step, monitoring that counted by address, and a generous sharing feature. Each link was ordinary; together, they exposed millions of people."
c3.debrief.p1: "Require a second sign-in step for sensitive data, do not just offer it."
c3.debrief.p2: "Compare passwords with lists of known leaks, and reset those that appear in them."
c3.debrief.p3: "Watch failed sign-ins across the whole site, and warn the customer about an unknown device."
c3.debrief.p4: "Tell every exposed person, without putting the blame on them."
c3.facts.title: "What really happened: 23andMe, 2023"
c3.facts.p1: "From April to September 2023, attackers tried credentials stolen from other sites on 23andMe, a DNA testing service (credential stuffing)."
c3.facts.p2: "About 14,000 accounts opened this way, roughly 0.1% of customers."
c3.facts.p3: "Through the DNA relatives matching feature and the family tree, those accounts gave access to the profiles of about 6.9 million people."
c3.facts.p4: "A warning in August 2023 was first taken for a hoax; the full investigation only began in October. The company then required a new password and a second sign-in step."
c3.facts.p5: "In June 2025, the UK data protection authority fined it £2.31 million: no mandatory second step, no effective monitoring."
