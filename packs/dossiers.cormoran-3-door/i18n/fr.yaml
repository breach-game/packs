c3.briefing: "Les comptes se sont ouverts avec de vrais mots de passe, réutilisés d'autres sites. La règle de connexion de Cormoran est dans `connexion/politique.yml`. Ferme la porte, puis décide quoi dire aux clients."
c3.obj.factor: "Qu'un mot de passe volé ne suffise plus"
c3.obj.watch: "Voir une attaque sur tout le site, et prévenir le client"
c3.obj.tell: "Décider quoi dire aux clients"
c3.q.tell: "Que dit Cormoran à ses clients ?"
c3.q.tell.everyone: "Prévenir tous les clients, imposer un nouveau mot de passe et la seconde étape"
c3.q.tell.opened: "Prévenir seulement les titulaires des comptes ouverts par les fraudeurs"
c3.q.tell.blame: "Écrire que les clients ont réutilisé leurs mots de passe, et que la faute est la leur"
c3.check.factor: "Seconde étape obligatoire, mots de passe fuités refusés, réinitialisation après fuite"
c3.check.watch: "Alerte sur les échecs de tout le site, courriel à chaque nouvel appareil"
c3.check.works: "Le fichier de connexion est toujours là"
c3.ada.brief: "Lis la règle : `cat connexion/politique.yml`. Deux couches, puis une décision."
c3.ada.g.factor: "D'abord, qu'un mot de passe ne suffise plus : `second_factor: required`, `leaked_passwords: refused`, `reset_on_leak: on`. Ouvre `edit connexion/politique.yml` ou utilise `sed -i`, puis `verify`."
c3.ada.g.factor.standard: "D'abord, fais qu'un mot de passe volé ailleurs n'ouvre plus rien. Puis `verify`. Pour ouvrir le fichier : `edit connexion/politique.yml`."
c3.ada.factor: "Avec une seconde étape, la liste des fraudeurs ne vaut plus grand-chose : un mot de passe seul n'ouvre plus de compte."
c3.ada.g.watch: "Ensuite, voir et prévenir : `failed_logins_alert: site-wide` et `new_device_email: on`, puis `verify`."
c3.ada.g.watch.standard: "Ensuite, fais qu'une attaque dispersée sonne, et que le client sache quand un appareil inconnu entre chez lui. Puis `verify`."
c3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
c3.ada.ready: "La porte tient. Restent les clients. Je te laisse décider."
c3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
c3.ada.answer.standard: "Ma question t'attend dans la messagerie."
c3.ada.everyone: "Le choix qui protège le plus : les cousins exposés apprennent ce qui est sorti, et personne ne garde un mot de passe connu des fraudeurs."
c3.ada.opened: "Les titulaires des comptes ouverts sont prévenus. Le million de cousins dont le profil est en vente, lui, n'apprend rien."
c3.ada.blame: "Juridiquement tentant, mais la plupart des personnes exposées n'avaient rien réutilisé du tout : elles étaient cousines. Et c'est Cormoran qui n'exigeait pas de seconde étape."
c3.ada.done: "Une seconde étape, les mots de passe fuités refusés, une alerte qui compte comme il faut. Ouvre le débrief : le vrai cas est à la fin."
c3.hint.factor.1: "Avec l'éditeur : `edit connexion/politique.yml`, puis Ctrl+S. Avec une commande : trois lignes à changer, avec `sed -i \"s/ancien/nouveau/\" connexion/politique.yml`."
c3.hint.factor.2: "`second_factor: required`, `leaked_passwords: refused`, `reset_on_leak: on`"
c3.hint.watch.1: "`failed_logins_alert: site-wide` et `new_device_email: on`, puis `verify`."
c3.hint.tell.1: "Aucune réponse n'est fausse. Pense aux personnes exposées qui n'ont rien fait."
c3.debrief.title: "La porte d'entrée"
c3.debrief.lesson: "Aucune faille de code ici : des mots de passe réutilisés, une connexion sans seconde étape, une surveillance qui comptait par adresse, et une fonction de partage généreuse. Chaque maillon était ordinaire ; ensemble, ils ont exposé des millions de personnes."
c3.debrief.p1: "Exiger une seconde étape de connexion pour des données sensibles, pas seulement la proposer."
c3.debrief.p2: "Comparer les mots de passe aux listes de fuites connues, et réinitialiser ceux qui y apparaissent."
c3.debrief.p3: "Surveiller les échecs de connexion sur tout le site, et prévenir le client d'un appareil inconnu."
c3.debrief.p4: "Prévenir toutes les personnes exposées, sans rejeter la faute sur elles."
c3.facts.title: "Ce qui s'est vraiment passé : 23andMe, 2023"
c3.facts.p1: "D'avril à septembre 2023, des attaquants essaient sur 23andMe, service de tests ADN, des identifiants volés sur d'autres sites (bourrage d'identifiants)."
c3.facts.p2: "Environ 14 000 comptes s'ouvrent ainsi, à peu près 0,1 % des clients."
c3.facts.p3: "Par la fonction de mise en relation des parents ADN et par l'arbre généalogique, ces comptes donnent accès aux profils d'environ 6,9 millions de personnes."
c3.facts.p4: "Une alerte d'août 2023 est d'abord prise pour un canular ; l'enquête complète ne commence qu'en octobre. L'entreprise impose ensuite un nouveau mot de passe et une seconde étape de connexion."
c3.facts.p5: "En juin 2025, l'autorité britannique de protection des données inflige une amende de 2,31 millions de livres : pas de seconde étape obligatoire, pas de surveillance efficace."
