h2.briefing: "Vendredi, 8 h. L'éditeur a publié un avis à 7 h 27 : le canal 0447 est retiré. Pourtant, les comptoirs plantent toujours. L'avis est dans `cellule/`. Les mesures de réparation attendent dans `contain`, mais dans quel ordre ?"
h2.obj.cache: "Comprendre pourquoi le retrait du fichier ne répare rien"
h2.obj.order: "Tracer l'ordre de reprise sur la carte"
h2.obj.vault: "Remettre en service le coffre des clés"
h2.obj.counters: "Réparer les comptoirs"
h2.path.text: "L'ordre de reprise : ce qu'il faut remettre debout d'abord pour pouvoir réparer le reste"
h2.q.cache: "L'éditeur a remplacé le fichier fautif à 7 h 27. Pourquoi les comptoirs ne se réparent-ils pas seuls ?"
h2.q.cache.cache: "Ils chargent le fichier depuis leur cache et plantent avant d'en recevoir un autre"
h2.q.cache.slow: "Le nouveau fichier met plusieurs heures à se propager à tous les clients"
h2.q.cache.slow.why: "Le journal montre autre chose : « found in cache, loading », puis le plantage. La machine tombe avant même de demander un nouveau fichier."
h2.q.cache.offline: "Les comptoirs sont hors ligne depuis 6 h 09 et ne voient plus du tout le serveur de l'éditeur"
h2.q.cache.offline.why: "Ils ont du réseau à chaque démarrage. Mais l'agent charge son cache d'abord, et le cache contient le fichier fautif."
h2.contain.vault: "Restaurer le coffre des clés et l'annuaire depuis l'instantané de 3 h, agents arrêtés (quarante minutes)"
h2.contain.counters: "Envoyer les techniciens : mode secours, clé du disque, suppression du canal 0447, redémarrage, dans chaque pharmacie (une journée)"
h2.ada.brief: "Lis l'avis : `cat cellule/avis-editeur.txt`. Puis regarde ce que fait l'agent au démarrage : `ssh ir@comptoir07.ravel.test`, `journalctl -u guetteur-capteur`."
h2.ada.g.cache: "Dans le journal de l'agent, d'où vient le fichier au second démarrage ?"
h2.ada.g.cache.standard: "Le retrait du fichier n'aide pas les machines déjà tombées. Le journal de l'agent dit pourquoi."
h2.ada.cache: "Le cache. Chaque machine touchée doit être réparée à la main : mode secours, clé du disque, suppression du fichier. Et les clés, où sont-elles ?"
h2.ada.g.order: "Essaie le coffre des clés : `curl -s https://cles.ravel.test/`. Il tourne avec Guetteur, lui aussi. Sur la carte, qu'est-ce qui dépend de quoi ? `path reprise <hôte> <hôte> <hôte>`."
h2.ada.g.order.standard: "Les techniciens ont besoin des clés, et le serveur d'annuaire a lui aussi un disque chiffré. Les comptoirs, eux, ont besoin de l'annuaire. Trace l'ordre de reprise avec `path reprise`."
h2.ada.order: "Le coffre, puis l'annuaire, puis les comptoirs. Commencer par les comptoirs, c'est envoyer quarante techniciens devant des disques fermés."
h2.ada.g.vault: "`contain restore cles`, puis vérifie : `curl -s https://cles.ravel.test/`."
h2.ada.g.vault.standard: "Remets le coffre debout avant tout. `contain` pour la mesure."
h2.ada.vault: "Le coffre répond, l'annuaire aussi. Les techniciens peuvent partir avec les clés."
h2.ada.nokeys: "Les techniciens sont partis, mais le coffre des clés est toujours tombé : ils attendent devant des disques chiffrés. Remets le coffre en service, ils reprendront dès qu'il répond."
h2.ada.g.counters: "Envoie les techniciens : `contain remove canal-0447`. Une journée de travail, pharmacie par pharmacie."
h2.ada.g.counters.standard: "Les clés sont là. Lance la réparation des comptoirs."
h2.ada.done: "17 h 50 : le dernier comptoir redémarre. Une journée entière pour un fichier retiré en 78 minutes. La différence, c'est le travail à la main."
h2.hint.cache.1: "« content channel 0447 found in cache, loading », puis « Kernel panic »."
h2.hint.cache.2: "`answer cache`"
h2.hint.order.1: "Le coffre des clés répond 503. Sans clés, pas de mode secours sur un disque chiffré, ni sur les comptoirs ni sur le serveur d'annuaire."
h2.hint.order.2: "`path reprise cles annuaire comptoir07`"
h2.hint.vault.1: "`contain restore cles`"
h2.hint.counters.1: "`contain remove canal-0447`"
h2.debrief.title: "Le trousseau dans le coffre"
h2.debrief.lesson: "Retirer le fichier fautif n'a rien réparé : une machine tombée le relisait dans son cache avant de pouvoir en demander un autre. La réparation est devenue manuelle, pharmacie par pharmacie, et elle demandait la clé de chaque disque, gardée sur un serveur protégé par le même agent, donc tombé lui aussi. Le plan de reprise doit savoir de quoi dépend la reprise."
h2.debrief.p1: "Cartographier les dépendances de la reprise : coffre des clés, annuaire, consoles d'administration, avant les postes."
h2.debrief.p2: "Garder une copie des clés de récupération hors du système qu'elles servent à réparer."
h2.debrief.p3: "Prévoir qu'une réparation puisse être manuelle et massive : qui se déplace, avec quoi, dans quel ordre."
