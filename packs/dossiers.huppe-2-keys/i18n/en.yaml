h2.briefing: "Friday, 8:00. The vendor published a notice at 7:27: channel 0447 is withdrawn. Yet the counters still crash. The notice is in `cellule/`. The repair measures wait in `contain`, but in which order?"
h2.obj.cache: "Understand why withdrawing the file repairs nothing"
h2.obj.order: "Trace the recovery order on the map"
h2.obj.vault: "Bring the key vault back into service"
h2.obj.counters: "Repair the counters"
h2.path.text: "The recovery order: what has to stand up first so the rest can be repaired"
h2.q.cache: "The vendor replaced the faulty file at 7:27. Why don't the counters repair themselves?"
h2.q.cache.cache: "They load the file from their cache and crash before they can receive another one"
h2.q.cache.slow: "The new file takes several hours to reach every customer"
h2.q.cache.slow.why: "The journal shows something else: \"found in cache, loading\", then the crash. The machine falls before it even asks for a new file."
h2.q.cache.offline: "The counters have been offline since 6:09 and can no longer see the vendor's update server"
h2.q.cache.offline.why: "They have network at every start. But the agent loads its cache first, and the cache holds the faulty file."
h2.contain.vault: "Restore the key vault and the directory from the 3:00 snapshot, agents stopped (forty minutes)"
h2.contain.counters: "Send the technicians: rescue mode, disk key, delete channel 0447, restart, in every pharmacy (one day)"
h2.ada.brief: "Read the notice: `cat cellule/avis-editeur.txt`. Then look at what the agent does at start: `ssh ir@comptoir07.ravel.test`, `journalctl -u guetteur-capteur`."
h2.ada.g.cache: "In the agent's journal, where does the file come from at the second start?"
h2.ada.g.cache.standard: "Withdrawing the file does not help machines already down. The agent's journal says why."
h2.ada.cache: "The cache. Every machine hit has to be repaired by hand: rescue mode, disk key, delete the file. And the keys, where are they?"
h2.ada.g.order: "Try the key vault: `curl -s https://cles.ravel.test/`. It runs Guetteur too. On the map, what depends on what? `path reprise <host> <host> <host>`."
h2.ada.g.order.standard: "The technicians need the keys, and the directory server has an encrypted disk too. The counters need the directory. Trace the recovery order with `path reprise`."
h2.ada.order: "The vault, then the directory, then the counters. Starting with the counters means sending forty technicians to face locked disks."
h2.ada.g.vault: "`contain restore cles`, then check: `curl -s https://cles.ravel.test/`."
h2.ada.g.vault.standard: "Stand the vault up before anything else. `contain` lists the measure."
h2.ada.vault: "The vault answers, so does the directory. The technicians can leave with the keys."
h2.ada.nokeys: "The technicians left, but the key vault is still down: they are waiting in front of encrypted disks. Bring the vault back, they will resume as soon as it answers."
h2.ada.g.counters: "Send the technicians: `contain remove canal-0447`. A day of work, pharmacy by pharmacy."
h2.ada.g.counters.standard: "The keys are there. Start repairing the counters."
h2.ada.done: "17:50: the last counter restarts. A whole day for a file withdrawn in 78 minutes. The difference is the manual work."
h2.hint.cache.1: "\"content channel 0447 found in cache, loading\", then \"Kernel panic\"."
h2.hint.cache.2: "`answer cache`"
h2.hint.order.1: "The key vault answers 503. Without keys, no rescue mode on an encrypted disk, neither on the counters nor on the directory server."
h2.hint.order.2: "`path reprise cles annuaire comptoir07`"
h2.hint.vault.1: "`contain restore cles`"
h2.hint.counters.1: "`contain remove canal-0447`"
h2.debrief.title: "The keys in the safe"
h2.debrief.lesson: "Withdrawing the faulty file repaired nothing: a machine that was down read it again from its cache before it could ask for another. Repair became manual, pharmacy by pharmacy, and needed each disk's key, kept on a server protected by the same agent, so down too. The recovery plan has to know what recovery depends on."
h2.debrief.p1: "Map recovery's dependencies: key vault, directory, admin consoles, before the workstations."
h2.debrief.p2: "Keep a copy of the recovery keys outside the system they are meant to repair."
h2.debrief.p3: "Plan for a repair that may be manual and massive: who travels, with what, in which order."
