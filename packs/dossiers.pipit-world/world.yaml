# Case file 42 "Pipit". Inspired by the 2025 look-alike MCP server package on npm whose update
# added a blind copy to every email it sent. Played on the defence side only: the player reads
# the mail gateway log, the package code and its metadata. No real package name is used.
startTime: "2027-10-05T09:10:00+02:00"
mandate: LA-2027-142
scope:
  domains: ["*.lanterne.test"]
  networks: ["10.118.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.118.0.2

config:
  la.removed: false

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.118.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -320, z: 40, h: 70 }
    links: [mx]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            LA-2027-142.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  - id: mx
    hostname: mx.lanterne.test
    ip: 10.118.0.25
    os: Linux
    map: { x: 120, z: -60, h: 120 }
    services:
      - { port: 25, name: smtp, product: Postfix }

  - id: outside
    hostname: inconnu.lanterne.test
    ip: 10.118.0.200
    kind: unknown
    hidden: true
    os: unknown
    map: { x: -200, z: 220, h: 40 }

dns:
  lanterne.test: { A: ["10.118.0.25"] }
  mx.lanterne.test: { A: ["10.118.0.25"] }

advisories:
  - id: BRX-2027-0318
    package: relais-mcp
    versions: ["1.0.16"]
    severity: critical
    summary: adv.relais

noise:
  nmap:
    base: 0
    flags: {}
  dig: 0
  curl: 0
  browse: 0
  ssh: 0

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
