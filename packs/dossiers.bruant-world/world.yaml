# Case file 46 "Bruant". Inspired by the browser extensions hijacked in December 2024: a phishing
# email posing as the store got a developer to approve an OAuth app, which published a new
# version with code that steals cookies. Defence side only: email, store log, extension archives.
startTime: "2027-12-26T08:40:00+01:00"
mandate: OM-2027-146
scope:
  domains: ["*.ombrelle.test"]
  networks: ["10.122.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.122.0.2

config:
  om.revoked: false
  om.fixed: false

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.122.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -320, z: 40, h: 70 }
    links: [store]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            OM-2027-146.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # The extension store's developer API, as Ombrelle's account sees it.
  - id: store
    hostname: extensions.ombrelle.test
    ip: 10.122.0.20
    os: Linux
    map: { x: 120, z: -60, h: 130 }
    services:
      - { port: 443, name: https, product: Extension store developer API }

  - id: outside
    hostname: inconnu.ombrelle.test
    ip: 10.122.0.200
    kind: unknown
    hidden: true
    os: unknown
    map: { x: -200, z: 220, h: 40 }

dns:
  ombrelle.test: { A: ["10.122.0.20"] }
  extensions.ombrelle.test: { A: ["10.122.0.20"] }

noise:
  nmap:
    base: 0
    flags: {}
  dig: 0
  curl: 0
  browse: 0
  ssh: 0

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
