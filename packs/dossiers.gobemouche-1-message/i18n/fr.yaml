g1.briefing: "Malik, comptable à Lille, a transmis le message qu'il a reçu ce matin : `boite/demande.eml`. Il a déjà eu la visio. Les virements doivent partir aujourd'hui. Avant tout, lis le message."
g1.obj.domain: "Trouver où partiraient les réponses"
g1.obj.proof: "Dire ce qui prouve que le message ne vient pas de Gobemouche"
g1.q.domain: "À quel domaine les réponses à ce message arriveraient-elles ?"
g1.q.proof: "Qu'est-ce qui prouve que ce message ne vient pas de Gobemouche ?"
g1.q.proof.spf: "Son serveur d'envoi n'est pas autorisé : SPF et DMARC échouent"
g1.q.proof.urgent: "Le ton très pressant et le secret absolu demandé à Malik"
g1.q.proof.urgent.why: "C'est un signal d'alerte, pas une preuve : une vraie directrice peut aussi être pressée. La preuve est dans les en-têtes."
g1.q.proof.name: "Le nom affiché de l'expéditrice, écrit sans accent sur Inès"
g1.q.proof.name.why: "Le nom affiché s'écrit comme on veut, avec ou sans accent. Il ne prouve rien dans un sens ni dans l'autre."
g1.ada.brief: "Lis-le d'abord comme Malik l'a lu : `cat boite/demande.eml`. Puis comme un analyste : `mailhdr boite/demande.eml`."
g1.ada.g.domain: "`mailhdr boite/demande.eml` compare l'expéditeur affiché et l'adresse de réponse. Où irait une réponse ? `answer domain <domaine>`."
g1.ada.g.domain.standard: "Trouve où partirait une réponse, dans les en-têtes. `answer domain`."
g1.ada.domain: "Affiché : gobemouche.test. Réponses : un domaine qui lui ressemble, mais qui n'est pas à Gobemouche. Et le message est parti d'un serveur que Gobemouche n'a jamais autorisé."
g1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
g1.ada.answer.standard: "Ma question t'attend dans la messagerie."
g1.ada.done: "Les en-têtes ne mentent pas, même quand le nom affiché le fait. Mais Malik a vu la directrice en visio. Ça, les en-têtes ne l'expliquent pas. Il faut l'appeler, elle. Pas le numéro du message."
g1.hint.domain.1: "Regarde la ligne Reply-To."
g1.hint.domain.2: "`answer domain gobemouche-groupe.example`"
g1.hint.proof.1: "Regarde les lignes spf et dmarc de `mailhdr`."
g1.debrief.title: "Strictement confidentiel"
g1.debrief.lesson: "Le nom affiché d'un courriel est un texte libre : n'importe qui peut écrire celui de la directrice financière. Les en-têtes, eux, disent d'où vient le message et où vont les réponses. Ici, un serveur non autorisé et un domaine sosie. Le secret exigé, « pas même à votre responsable », sert à empêcher la seule vérification qui aurait tout arrêté."
g1.debrief.p1: "Publier SPF, DKIM et une politique DMARC qui rejette ce qui échoue."
g1.debrief.p2: "Marquer les courriels venus de l'extérieur, et alerter sur une adresse de réponse qui change de domaine."
g1.debrief.p3: "Apprendre que « n'en parlez à personne » est un signal d'alerte, jamais une consigne."
