g1.briefing: "Malik, an accountant in Lille, forwarded the message he received this morning: `boite/demande.eml`. He has already had the video call. The transfers are due today. First, read the message."
g1.obj.domain: "Find where the replies would go"
g1.obj.proof: "Say what proves the message did not come from Gobemouche"
g1.q.domain: "To which domain would replies to this message go?"
g1.q.proof: "What proves this message did not come from Gobemouche?"
g1.q.proof.spf: "Its sending server is not allowed: SPF and DMARC fail"
g1.q.proof.urgent: "The very pressing tone and the total secrecy asked of Malik"
g1.q.proof.urgent.why: "That is a warning sign, not proof: a real director can be in a hurry too. The proof is in the headers."
g1.q.proof.name: "The sender's display name, written with no accent on Inès"
g1.q.proof.name.why: "The display name can be written any way, with or without an accent. It proves nothing either way."
g1.ada.brief: "Read it first as Malik did: `cat boite/demande.eml`. Then as an analyst: `mailhdr boite/demande.eml`."
g1.ada.g.domain: "`mailhdr boite/demande.eml` compares the displayed sender and the reply address. Where would a reply go? `answer domain <domain>`."
g1.ada.g.domain.standard: "Find in the headers where a reply would go. `answer domain`."
g1.ada.domain: "Displayed: gobemouche.test. Replies: a domain that looks like it, but does not belong to Gobemouche. And the message left from a server Gobemouche never allowed."
g1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
g1.ada.answer.standard: "My question is waiting in the messenger."
g1.ada.done: "Headers do not lie, even when the display name does. But Malik saw the director on video. The headers do not explain that. You need to call her. Not the number in the message."
g1.hint.domain.1: "Look at the Reply-To line."
g1.hint.domain.2: "`answer domain gobemouche-groupe.example`"
g1.hint.proof.1: "Look at the spf and dmarc lines of `mailhdr`."
g1.debrief.title: "Strictly confidential"
g1.debrief.lesson: "An email's display name is free text: anyone can write the finance director's. The headers say where the message came from and where replies go. Here, a server that was not allowed and a look-alike domain. The secrecy demanded, \"not even your manager\", is there to prevent the one check that would have stopped everything."
g1.debrief.p1: "Publish SPF, DKIM and a DMARC policy that rejects what fails."
g1.debrief.p2: "Tag emails from outside, and alert on a reply address that changes domain."
g1.debrief.p3: "Learn that \"tell nobody\" is a warning sign, never an instruction."
