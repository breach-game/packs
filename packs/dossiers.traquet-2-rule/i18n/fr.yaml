q2.briefing: "Jeudi, 11 h. Passerelle a prévenu toute l'équipe, mais deux personnes avaient déjà reçu la même invitation, d'un autre « journaliste ». Il faut voir ces connexions dès qu'elles arrivent. La règle s'écrit dans `regles/code-appareil.yml`."
q2.obj.who: "Compter les nouveaux comptes connectés par code d'appareil depuis Visio"
q2.obj.rule: "Écrire la règle qui les voit, sans alerter sur les salles de réunion"
q2.obj.policy: "Choisir où couper le flux"
q2.q.who: "Combien d'autres comptes se sont connectés par `device_code` avec l'application Visio ce matin ?"
q2.q.policy: "Les salles de réunion ont besoin du code d'appareil. Que fait Passerelle ?"
q2.q.policy.rooms: "Bloquer ce flux pour tous, sauf les comptes des salles"
q2.q.policy.mfa: "Demander un second facteur plus fort, une clé physique"
q2.q.policy.mfa.why: "Sofia aurait validé avec sa clé aussi : c'est elle qui se connectait, sur la vraie page. Le flux reste ouvert."
q2.q.policy.apps: "Interdire les messageries aux salariés"
q2.q.policy.apps.why: "Le code peut arriver par mail, par visio, par téléphone. On coupe le flux qui le rend utile, pas tous les canaux qui le portent."
q2.ada.brief: "Lis la règle à compléter : `cat regles/code-appareil.yml`. Puis le journal : `soc search device_code`."
q2.ada.second: "Une deuxième connexion par code d'appareil depuis Visio. Ils travaillent la liste de l'équipe."
q2.ada.g.who: "`soc search device_code` : les salles utilisent l'application « Salle de reunion ». Combien de comptes avec Visio, hors Sofia ? `answer who <nombre>`."
q2.ada.g.who.standard: "Combien d'autres comptes sont tombés dans le même piège ? `answer who`."
q2.ada.who: "Deux de plus. Leurs sessions sont révoquées par l'équipe de Passerelle. La règle, maintenant."
q2.ada.g.rule: "Ajoute deux conditions à la règle, avec `edit regles/code-appareil.yml` ou `echo \"flow: device_code\" >> regles/code-appareil.yml` puis `echo \"app: Visio\" >> regles/code-appareil.yml`. Essaie avec `rule test regles/code-appareil.yml`."
q2.ada.g.rule.standard: "Écris une règle qui voit le code d'appareil hors des salles, et pas les salles. `rule test`."
q2.ada.rule: "Elle voit les trois comptes et aucune salle. Passerelle la branche sur l'alerte de nuit."
q2.ada.g.policy: "Réponds dans la messagerie ou avec `answer <option>`."
q2.ada.done: "Le piège a un nom, une règle et une porte fermée. La fiche raconte la campagne réelle."
q2.hint.who.1: "j.okafor et l.marchetti, avec Visio, depuis 203.0.113.x."
q2.hint.who.2: "`answer who 2`"
q2.hint.rule.1: "`flow: device_code` seul alerte aussi sur les salles. Ajoute l'application."
q2.hint.rule.2: "`echo \"flow: device_code\" >> regles/code-appareil.yml`, `echo \"app: Visio\" >> regles/code-appareil.yml`, puis `rule test regles/code-appareil.yml`"
q2.hint.policy.1: "Ce qui rend le code utile à l'attaquant, c'est le flux lui-même."
q2.debrief.title: "Voir venir le suivant"
q2.debrief.lesson: "Le code d'appareil est utile à quelques appareils précis, et dangereux pour tous les autres comptes. Une règle qui le voit hors des salles donne l'alerte en quelques minutes ; une politique qui le réserve aux salles retire le piège lui-même."
q2.debrief.p1: "Lister qui a vraiment besoin d'un flux de connexion, et le couper pour les autres."
q2.debrief.p2: "Surveiller les connexions par code d'appareil : elles sont rares, donc faciles à voir."
q2.debrief.p3: "Former à une seule phrase : on ne tape jamais un code qu'on n'a pas vu s'afficher chez soi."
q2.facts.title: "Ce qui s'est vraiment passé : Storm-2372, 2025"
q2.facts.p1: "Le 13 février 2025, Microsoft Threat Intelligence décrit une campagne d'hameçonnage par code d'appareil menée par un groupe qu'il nomme Storm-2372."
q2.facts.p2: "Les leurres imitent des messageries comme WhatsApp, Signal ou Teams, souvent avec de fausses invitations à des réunions Teams. La victime tape le code sur la vraie page de connexion."
q2.facts.p3: "L'attaquant récupère alors des jetons d'accès et de rafraîchissement valides, et accède aux comptes et aux données de la victime."
q2.facts.p4: "Parmi les recommandations : bloquer le flux par code d'appareil partout où c'est possible, et révoquer les sessions (revokeSignInSessions) d'un compte touché."
