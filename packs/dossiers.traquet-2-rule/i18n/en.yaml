q2.briefing: "Thursday, 11:00. Passerelle warned the whole team, but two people had already received the same invitation, from another \"journalist\". These sign-ins must be seen as soon as they arrive. The rule is written in `regles/code-appareil.yml`."
q2.obj.who: "Count the new accounts signed in by device code from Visio"
q2.obj.rule: "Write the rule that sees them, without alerting on meeting rooms"
q2.obj.policy: "Choose where to cut the flow"
q2.q.who: "How many other accounts signed in through `device_code` with the Visio app this morning?"
q2.q.policy: "Meeting rooms need the device code. What does Passerelle do?"
q2.q.policy.rooms: "Block this flow for everyone except the rooms' accounts"
q2.q.policy.mfa: "Require a stronger second factor, such as a physical key for everyone"
q2.q.policy.mfa.why: "Sofia would have approved with her key too: she was the one signing in, on the real page. The flow stays open."
q2.q.policy.apps: "Forbid chat apps to employees"
q2.q.policy.apps.why: "The code can arrive by email, by video call, by phone. You cut the flow that makes it useful, not every channel that carries it."
q2.ada.brief: "Read the rule to complete: `cat regles/code-appareil.yml`. Then the log: `soc search device_code`."
q2.ada.second: "A second device code sign-in from Visio. They are working through the team list."
q2.ada.g.who: "`soc search device_code`: the rooms use the \"Salle de reunion\" app. How many accounts with Visio, besides Sofia? `answer who <number>`."
q2.ada.g.who.standard: "How many other accounts fell into the same trap? `answer who`."
q2.ada.who: "Two more. Passerelle's team is revoking their sessions. Now the rule."
q2.ada.g.rule: "Add two conditions to the rule, with `edit regles/code-appareil.yml` or `echo \"flow: device_code\" >> regles/code-appareil.yml` then `echo \"app: Visio\" >> regles/code-appareil.yml`. Try it with `rule test regles/code-appareil.yml`."
q2.ada.g.rule.standard: "Write a rule that sees the device code outside the rooms, and not the rooms. `rule test`. To open the file: `edit regles/code-appareil.yml`."
q2.ada.rule: "It sees all three accounts and no room. Passerelle wires it to the night alert."
q2.ada.g.policy: "Answer in the messenger or with `answer <option>`."
q2.ada.done: "The trap has a name, a rule and a closed door. The card tells the real campaign."
q2.hint.who.1: "j.okafor and l.marchetti, with Visio, from 203.0.113.x."
q2.hint.who.2: "`answer who 2`"
q2.hint.rule.1: "`flow: device_code` alone also alerts on the rooms. Add the app."
q2.hint.rule.2: "`echo \"flow: device_code\" >> regles/code-appareil.yml`, `echo \"app: Visio\" >> regles/code-appareil.yml`, then `rule test regles/code-appareil.yml` Or by hand, in the editor: `edit regles/code-appareil.yml`, then Ctrl+S."
q2.hint.policy.1: "What makes the code useful to the attacker is the flow itself."
q2.debrief.title: "Seeing the next one coming"
q2.debrief.lesson: "The device code is useful to a few specific devices, and dangerous for every other account. A rule that sees it outside the rooms raises the alarm within minutes; a policy that keeps it for the rooms removes the trap itself."
q2.debrief.p1: "List who really needs a sign-in flow, and cut it for the others."
q2.debrief.p2: "Watch device code sign-ins: they are rare, so easy to see."
q2.debrief.p3: "Train one sentence: never type a code you did not see appear on your own device."
q2.facts.title: "What really happened: Storm-2372, 2025"
q2.facts.p1: "On 13 February 2025, Microsoft Threat Intelligence described a device code phishing campaign run by a group it calls Storm-2372."
q2.facts.p2: "The lures imitate messaging apps such as WhatsApp, Signal or Teams, often with fake Teams meeting invitations. The victim types the code on the real sign-in page."
q2.facts.p3: "The attacker then gets valid access and refresh tokens, and reaches the victim's accounts and data."
q2.facts.p4: "Among the recommendations: block the device code flow wherever possible, and revoke the sessions (revokeSignInSessions) of an affected account."
