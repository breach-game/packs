d1.briefing: "The file of every Polygone customer is for sale on a forum. The team pulled one hour of the shop's log: `journaux/access.log`. Find who took it."
d1.obj.ip: "The address that really got the file"
d1.obj.account: "The account it got it under"
d1.obj.tried: "The number of addresses that asked for it"
d1.obj.next: "Say what to do first"
d1.q.ip: "Which address got `/export/clients.csv`?"
d1.q.account: "Under which account?"
d1.q.tried: "How many different addresses asked for `/export/clients.csv`, successful or not?"
d1.q.next: "Where does Polygone start?"
d1.q.next.cutoff: "Cut off agence-nord and review its sign-ins"
d1.q.next.scanners: "Block the seven addresses the bots came from"
d1.q.next.scanners.why: "The bots got nothing: 403 and 404. The file left through a real account."
d1.q.next.file: "Delete the log, so nothing more leaks"
d1.q.next.file.why: "The log is the only proof of what happened. Keep it, and protect it."
d1.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d1.ada.done: "Seven noisy bots, and a single real account, quiet, that took the file in thirty seconds. It is nearly always the line that makes no noise."
d1.debrief.title: "The right line"
d1.debrief.lesson: "In a log, the noise comes from bots that try everything and get nothing. The leak often goes through a legitimate account, with a 200 code and an abnormal response size. Filter, cut, sort, count: four commands are enough to find it."
d1.debrief.p1: "Look first for successes (code 200) on sensitive resources, not for failures."
d1.debrief.p2: "Alert on response size: an export of several megabytes looks like no page."
d1.debrief.p3: "Limit exports to those who need them, and keep logs safe."
