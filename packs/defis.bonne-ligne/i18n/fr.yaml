d1.briefing: "Le fichier de tous les clients de Polygone est en vente sur un forum. L'équipe a sorti une heure du journal de la boutique : `journaux/access.log`. Trouve qui l'a emporté."
d1.obj.ip: "L'adresse qui a vraiment obtenu le fichier"
d1.obj.account: "Le compte sous lequel elle l'a obtenu"
d1.obj.tried: "Le nombre d'adresses qui l'ont demandé"
d1.obj.next: "Dire quoi faire en premier"
d1.q.ip: "Quelle adresse a obtenu `/export/clients.csv` ?"
d1.q.account: "Sous quel compte ?"
d1.q.tried: "Combien d'adresses différentes ont demandé `/export/clients.csv`, réussite ou non ?"
d1.q.next: "Par quoi Polygone commence-t-il ?"
d1.q.next.cutoff: "Couper le compte agence-nord et relire ses connexions"
d1.q.next.scanners: "Bloquer les sept adresses des robots"
d1.q.next.scanners.why: "Les robots n'ont rien obtenu : 403 et 404. Le fichier est sorti par un vrai compte."
d1.q.next.file: "Supprimer le journal, pour que rien ne fuite de plus"
d1.q.next.file.why: "Le journal est la seule preuve de ce qui s'est passé. On le garde, et on le protège."
d1.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
d1.ada.done: "Sept robots bruyants, et un seul vrai compte, discret, qui a pris le fichier en trente secondes. C'est presque toujours la ligne qui ne fait pas de bruit."
d1.debrief.title: "La bonne ligne"
d1.debrief.lesson: "Dans un journal, le bruit vient des robots qui essaient tout et n'obtiennent rien. La fuite, elle, passe souvent par un compte légitime, avec un code 200 et une taille de réponse anormale. Filtrer, couper, trier, compter : quatre commandes suffisent à la retrouver."
d1.debrief.p1: "Chercher d'abord les réussites (code 200) sur les ressources sensibles, pas les échecs."
d1.debrief.p2: "Alerter sur la taille des réponses : un export de plusieurs mégaoctets ne ressemble à aucune page."
d1.debrief.p3: "Limiter les exports à ceux qui en ont besoin, et garder les journaux à l'abri."
