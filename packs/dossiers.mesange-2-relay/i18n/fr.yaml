g2.briefing: "Deuxième jour à la Banque Mésange. La revue dit que la passerelle sait relayer une requête vers un service interne, et que son rôle lit tout le stockage. Mis bout à bout, ce serait grave. Le mandat demande une preuve, et fixe une limite : le fichier témoin, rien d'autre."
g2.obj.pass: "Faire demander à la passerelle son propre laissez-passer au service d'identité"
g2.obj.listing: "Voir ce que le rôle de la passerelle peut lister dans le stockage"
g2.obj.marker: "Lire le fichier témoin et envoyer son marqueur (`submit`)"
g2.obj.stop: "Décider où s'arrêter"
g2.q.stop: "Tu as le fichier témoin. À côté, quinze dossiers de demandes de carte. Que fais-tu ?"
g2.q.stop.enough: "Rien de plus : le fichier témoin suffit à prouver, et le mandat s'arrête là"
g2.q.stop.sample: "Ouvrir une seule vraie demande, pour rendre le rapport plus frappant pour la banque"
g2.q.stop.sample.why: "Cette demande appartient à un vrai client de la banque, qui n'a rien consenti. Le fichier témoin a été déposé justement pour que tu n'aies jamais à le faire."
g2.q.stop.all: "Tout télécharger, pour mesurer le temps avant une alerte"
g2.q.stop.all.why: "Ce serait l'incident lui-même, mandat ou pas. La question de l'alerte se règle en lisant les réglages : les alertes sont éteintes."
g2.ada.brief: "La fonction de relais de la passerelle est à `/relay/` sur le site public, suivie du nom du service interne. Elle était prévue pour des contrôles de santé. Voyons ce qu'elle atteint d'autre."
g2.ada.direct: "De l'extérieur, le stockage répond non. C'est normal, et c'est pour ça que la banque se sentait à l'abri. Mais la passerelle, elle, est à l'intérieur."
g2.ada.g.pass: "Demande à la passerelle de relayer vers le service d'identité : `curl https://www.mesange.test/relay/identity`."
g2.ada.g.pass.standard: "La revue nomme un service interne qui remet son laissez-passer à une machine. Fais-le interroger par la passerelle."
g2.ada.pass: "Regarde `asked_by`. Le service d'identité a vu une requête venir de la passerelle, donc il a répondu à la passerelle : voici ton rôle, voici ton laissez-passer. Il ne peut pas savoir que la question venait de nous."
g2.ada.g.listing: "Avec ce rôle, demande le stockage par le même relais : `curl https://www.mesange.test/relay/stock`."
g2.ada.g.listing.standard: "Atteins maintenant le stockage de la même façon, et regarde ce que le rôle peut lister."
g2.ada.listing: "Quinze ans de demandes de carte, plus d'un million de fichiers, lisibles par une machine dont le travail est de filtrer des requêtes. On n'en ouvre aucun. Notre fichier est sur la dernière ligne."
g2.ada.g.marker: "Lis le fichier témoin : `curl https://www.mesange.test/relay/stock/exercice/temoin.txt`, puis envoie son marqueur avec `submit`."
g2.ada.g.marker.standard: "Lis le fichier témoin déposé pour le mandat, et envoie-moi son marqueur."
g2.ada.file: "Voilà notre preuve. Envoie-moi le marqueur avec `submit`."
g2.ada.flag: "Preuve faite. Trois requêtes, aucun mot de passe, aucune faille dans un logiciel : seulement des réglages chacun un peu trop généreux."
g2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
g2.ada.answer.standard: "Réponds à ma question."
g2.ada.stop: "Oui. Ce qui nous sépare d'un attaquant ici, ce n'est pas la technique : c'est le mandat, et savoir où s'arrêter."
g2.ada.done: "La banque sait maintenant jusqu'où mène un réglage. Ouvre le débrief. Demain, on referme."
g2.soc.pass: "Service d'identité : laissez-passer de role-passerelle demandé à travers le relais"
g2.soc.listing: "Stockage : liste complète par role-passerelle, qui ne liste jamais"
g2.hint.pass.1: "Le relais prend le nom du service interne après `/relay/`. Le service qui remet les laissez-passer s'appelle `identity`."
g2.hint.pass.2: "Tape `curl https://www.mesange.test/relay/identity`."
g2.hint.listing.1: "Le service de stockage s'appelle `stock`. Atteins-le par le relais, pas directement."
g2.hint.listing.2: "Tape `curl https://www.mesange.test/relay/stock`."
g2.hint.marker.1: "La liste donne le chemin du fichier témoin : ajoute-le après `/relay/stock/`."
g2.hint.marker.2: "Tape `curl https://www.mesange.test/relay/stock/exercice/temoin.txt`, puis `submit` suivi du `FLAG{...}`."
g2.hint.stop.1: "Relis la ligne « Limites » du mandat : `cat mandate/MS-2027-005.txt`."
g2.debrief.title: "Une machine trompée prête ses droits"
g2.debrief.lesson: "Tu ne t'es connecté nulle part. Tu as demandé à une machine de l'intérieur de demander à ta place, et chaque service lui a répondu de bonne foi. Le relais, le service d'identité et le rôle fonctionnaient chacun comme réglé : ce sont les trois ensemble qui ouvrent le stockage."
g2.debrief.p1: "Requête forgée côté serveur : une machine exposée à internet est amenée à envoyer une requête à un service qu'elle seule peut atteindre."
g2.debrief.p2: "Un service interne qui fait confiance à tout ce qui vient de l'intérieur fait confiance à celui qui trompe une machine de l'intérieur."
g2.debrief.p3: "Un test d'intrusion prouve avec un fichier témoin. Les vraies données restent fermées."
