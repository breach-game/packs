g2.briefing: "Second day at Banque Mésange. The review says the gateway can relay a request to an internal service, and that its role reads all of storage. Put together, that would be serious. The mandate asks for proof, and sets a limit: the witness file, nothing else."
g2.obj.pass: "Make the gateway ask the identity service for its own pass"
g2.obj.listing: "See what the gateway's role can list in storage"
g2.obj.marker: "Read the witness file and send its marker (`submit`)"
g2.obj.stop: "Decide where to stop"
g2.q.stop: "You have the witness file. Next to it, fifteen folders of card applications. What do you do?"
g2.q.stop.enough: "Nothing more: the witness file proves it, and the mandate stops there"
g2.q.stop.sample: "Open one single real application, to make the report more striking for the bank"
g2.q.stop.sample.why: "That application belongs to a real customer of the bank, who gave no consent. The witness file was placed precisely so that you never have to."
g2.q.stop.all: "Download everything, to measure how long it takes before an alert"
g2.q.stop.all.why: "That would be the incident itself, mandate or not. The alert question is answered by reading the settings: alerts are off."
g2.ada.brief: "The gateway's relay function is at `/relay/` on the public site, followed by the name of the internal service. It was meant for health checks. Let us see what else it reaches."
g2.ada.direct: "From outside, storage answers no. That is normal, and it is why the bank felt safe. But the gateway is inside."
g2.ada.g.pass: "Ask the gateway to relay to the identity service: `curl https://www.mesange.test/relay/identity`."
g2.ada.g.pass.standard: "The review names an internal service that hands a machine its pass. Have the gateway ask it."
g2.ada.pass: "Look at `asked_by`. The identity service saw a request coming from the gateway, so it answered the gateway: here is your role, here is your pass. It cannot know that the question came from us."
g2.ada.g.listing: "With that role, ask for storage through the same relay: `curl https://www.mesange.test/relay/stock`."
g2.ada.g.listing.standard: "Now reach storage the same way, and see what the role can list."
g2.ada.listing: "Fifteen years of card applications, more than a million files, readable by a machine whose job is to filter requests. We open none of them. Our file is the last line."
g2.ada.g.marker: "Read the witness file: `curl https://www.mesange.test/relay/stock/exercice/temoin.txt`, then send its marker with `submit`."
g2.ada.g.marker.standard: "Read the witness file placed for the mandate, and send me its marker."
g2.ada.file: "That is our proof. Send me the marker with `submit`."
g2.ada.flag: "Proof made. Three requests, no password, no flaw in any software: only settings that were each a little too generous."
g2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
g2.ada.answer.standard: "Answer my question."
g2.ada.stop: "Yes. What separates us from an attacker here is not technique: it is the mandate, and knowing where to stop."
g2.ada.done: "The bank now knows how far one setting leads. Open the debrief. Tomorrow we close it."
g2.soc.pass: "Identity service: pass for role-passerelle requested through the relay"
g2.soc.listing: "Storage: full listing by role-passerelle, which never lists"
g2.hint.pass.1: "The relay takes the name of the internal service after `/relay/`. The service that hands out passes is called `identity`."
g2.hint.pass.2: "Type `curl https://www.mesange.test/relay/identity`."
g2.hint.listing.1: "The storage service is called `stock`. Reach it through the relay, not directly."
g2.hint.listing.2: "Type `curl https://www.mesange.test/relay/stock`."
g2.hint.marker.1: "The listing gives the path of the witness file: add it after `/relay/stock/`."
g2.hint.marker.2: "Type `curl https://www.mesange.test/relay/stock/exercice/temoin.txt`, then `submit` followed by the `FLAG{...}`."
g2.hint.stop.1: "Read the \"Limits\" line of the mandate again: `cat mandate/MS-2027-005.txt`."
g2.debrief.title: "A fooled machine lends its rights"
g2.debrief.lesson: "You never logged in anywhere. You asked a machine inside to ask for you, and each service answered it in good faith. The relay, the identity service and the role were each working as set: it is the three together that open storage."
g2.debrief.p1: "Request forgery on the server side: a machine exposed to the internet is led to send a request to a service only it can reach."
g2.debrief.p2: "An internal service that trusts everything coming from inside trusts whoever fools a machine inside."
g2.debrief.p3: "A pentest proves with a witness file. Real data stays closed."
