# Dossier 22. Everything here is fictional: reserved .test and .example domains, private and documentation addresses only.
startTime: "2027-09-02T09:30:00+02:00"
mandate: PL-2027-022
scope:
  domains: ["*.pluvier.test"]
  networks: ["10.82.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.82.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.82.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -300, z: 40, h: 70 }
    links: [warehouse]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            PL-2027-022.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # Pluvier's account on Banquise, a fictional cloud data warehouse.
  - id: warehouse
    hostname: entrepot.pluvier.test
    ip: 10.82.0.40
    os: Banquise data warehouse
    map: { x: 140, z: -60, h: 140 }
    links: [reports]
    services:
      - { port: 443, name: https, product: Banquise warehouse 8.4 }

  # The reporting server: the only machine meant to use the service account.
  - id: reports
    hostname: rapports.pluvier.test
    ip: 10.82.0.25
    os: Linux 6.1 (Debian 12)
    map: { x: 300, z: 60, h: 90 }

  - id: outside
    hostname: inconnu.pluvier.test
    ip: 10.82.0.200
    kind: unknown
    hidden: true
    os: unknown
    map: { x: 460, z: 200, h: 40 }

dns:
  pluvier.test: { A: ["10.82.0.10"] }
  entrepot.pluvier.test: { A: ["10.82.0.40"] }
  rapports.pluvier.test: { A: ["10.82.0.25"] }

whois:
  pluvier.test: |
    Domain Name: PLUVIER.TEST
    Creation Date: 2004-03-15T08:00:00Z
    Registrant Organization: Pluvier Voyages SA
    Registrant Country: FR

noise:
  nmap:
    base: 18
    flags: { "-sn": -10, "-sV": 10, "-A": 30, "-T4": 18, "-T5": 36, "-p-": 16 }
  dig: 0
  whois: 0
  curl: 2
  browse: 2
  chat: 2

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected
