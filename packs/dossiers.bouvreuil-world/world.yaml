# Dossier 17. Everything here is fictional: reserved .test and .example domains, private addresses only.
startTime: "2027-09-06T09:00:00+02:00"
mandate: BV-2027-017
scope:
  domains: ["*.bouvreuil.test"]
  networks: ["10.77.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.77.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.77.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -300, z: 40, h: 70 }
    links: [gateway]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            BV-2027-017.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # The outbound gateway: every request from the offices to the internet goes through it.
  - id: gateway
    hostname: passerelle.bouvreuil.test
    ip: 10.77.0.5
    os: Linux 6.1 (Debian 12)
    map: { x: 80, z: -60, h: 120 }
    services:
      - { port: 3128, name: http-proxy, product: Squid 6.6 }

  # The engineers' workstations, as the gateway sees them. Never reachable.
  - id: office
    hostname: postes.bouvreuil.test
    ip: 10.77.0.100
    kind: unknown
    hidden: true
    os: unknown
    map: { x: -120, z: 220, h: 40 }

dns:
  bouvreuil.test: { A: ["10.77.0.10"] }
  passerelle.bouvreuil.test: { A: ["10.77.0.5"] }

whois:
  bouvreuil.test: |
    Domain Name: BOUVREUIL.TEST
    Creation Date: 2004-10-11T08:00:00Z
    Registrant Organization: Bouvreuil Electronique SA
    Registrant Country: FR

noise:
  nmap:
    base: 18
    flags: { "-sn": -10, "-sV": 10, "-A": 30, "-T4": 18, "-T5": 36, "-p-": 16 }
  dig: 0
  whois: 0
  curl: 2
  browse: 2
  chat: 2

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected
