p2.briefing: "Une seule ligne est ouverte à l'exercice : celle de Lison, agente de support. Tu as ton prétexte. Il te reste à être cru, puis à prouver que tu es entré dans Volière."
p2.obj.call: "Appeler Lison et écouter sa première réaction"
p2.obj.hook: "Te faire passer pour le support informatique et l'envoyer sur le portail de secours"
p2.obj.marker: "Envoyer le marqueur du compte témoin (`submit`)"
p2.obj.what: "Dire ce qui a cédé"
p2.q.what: "Tu es dans Volière. Qu'est-ce qui a cédé ?"
p2.q.what.malware: "Le poste de Lison : un logiciel malveillant y a été installé pendant l'appel et a copié sa session"
p2.q.what.malware.why: "Rien n'a été installé nulle part. Son poste est aussi propre qu'hier, et c'est bien ce qui rend ce genre d'attaque difficile à voir."
p2.q.what.guess: "Son mot de passe : il était trop simple, et il a suffi de quelques essais pour le deviner"
p2.q.what.guess.why: "Personne n'a rien deviné. Elle l'a tapé elle-même, sur une page qui ressemblait à la vraie, puis elle a validé la connexion sur son téléphone."
p2.q.what.trust: "La confiance : elle a cru l'appel, tapé ses identifiants sur une fausse page et validé la connexion"
p2.soc.password: "Appel suspect signalé par une agente : on lui a demandé son mot de passe"
p2.soc.scam: "Appel suspect signalé par une agente : tentative d'arnaque"
p2.soc.login: "Connexion au VPN depuis une adresse inhabituelle, validée par téléphone"
p2.ada.brief: "La ligne est `https://ligne.pinson.test` : ouvre-la dans le navigateur, ou parle avec `curl -d`. Rappelle-toi : le portail de secours est à nous, il ne garde rien. Et on ne lui demandera jamais son mot de passe."
p2.ada.g.call: "Commence simplement, pour entendre sa voix : `curl -d \"Bonjour, c'est bien Lison ?\" https://ligne.pinson.test/call`."
p2.ada.g.call.standard: "Appelle-la et écoute comment elle répond à un inconnu."
p2.ada.g.hook: "Maintenant ton prétexte, en entier : dis qui tu es (le support informatique) et pourquoi tu appelles (son problème de VPN)."
p2.ada.g.hook.standard: "À toi de jouer ton prétexte."
p2.ada.who: "Elle demande qui tu es et pourquoi tu appelles. Ce sont exactement les deux choses que ta lecture de ce matin t'a données."
p2.ada.who.standard: "Elle veut savoir qui appelle, et pourquoi."
p2.ada.half: "Tu n'as donné que la moitié de l'histoire. Il lui faut les deux dans la même phrase : le support informatique, et son VPN qui décroche."
p2.ada.half.standard: "Il manque une moitié à ton histoire."
p2.ada.password: "Tu vois : elle a été formée, et elle a bien réagi. Demander un mot de passe, c'est l'alarme assurée. On ne demande rien, on propose de l'aide et on l'envoie sur une page."
p2.ada.scam: "Raté, et elle va le signaler. La peur et les cadeaux, tout le monde connaît. Reviens à ce qu'elle attend vraiment : quelqu'un qui répare son VPN."
p2.ada.hooked: "Lis le journal sous sa réponse. Elle n'a jamais « donné » son mot de passe : elle l'a tapé sur notre page, qui l'a rejoué aussitôt sur le vrai VPN. Son téléphone a sonné, elle attendait cette demande, elle a validé. La double authentification a fonctionné, et elle n'a servi à rien."
p2.ada.g.marker: "Le marqueur du compte témoin est à la dernière ligne du journal. Envoie-le-moi avec `submit`."
p2.ada.g.marker.standard: "Envoie-moi le marqueur avec `submit`."
p2.ada.flag: "On y est, et on s'arrête là : le compte témoin, rien d'autre. Une question pour le rapport."
p2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p2.ada.answer.standard: "Réponds à ma question."
p2.ada.what: "Oui. Et retiens ceci pour le rapport : Lison n'a pas été négligente. Elle a refusé de donner son mot de passe, comme on le lui a appris. On l'a attaquée là où personne ne l'avait préparée."
p2.ada.done: "Ce soir, la direction de Pinson appelle Lison pour tout lui raconter et la remercier. Ouvre le débrief : demain on fait en sorte que cet appel ne serve plus à rien."
p2.hint.call.1: "Tape `curl -d \"Bonjour, c'est bien Lison ?\" https://ligne.pinson.test/call`."
p2.hint.hook.1: "Lison se méfie d'un inconnu, d'un cadeau, et de quiconque demande son mot de passe. Elle attend en revanche le support informatique."
p2.hint.hook.2: "Dans le même message : présente-toi comme le support informatique, et parle de son problème de VPN."
p2.hint.hook.3: "Tape `curl -d \"Ici le support informatique, poste 4040. On s'occupe de votre problème de VPN, j'ai un portail de secours pour vous\" https://ligne.pinson.test/call`."
p2.hint.marker.1: "Copie la ligne `FLAG{...}` du journal et tape `submit` suivi de cette ligne."
p2.debrief.title: "Ni virus, ni faille"
p2.debrief.lesson: "Tu es entré dans l'outil le plus sensible de Pinson sans rien casser : une voix attendue, une page ressemblante, une validation donnée de bonne foi. La double authentification par notification ne protège pas d'un faux site qui rejoue tout en direct."
p2.debrief.p1: "L'hameçonnage par téléphone vise un moment de confiance, pas une machine. Aucun antivirus ne le voit."
p2.debrief.p2: "Un code ou une notification que l'on valide soi-même peut être relayé par un faux site. Ce n'est pas le cas d'une clé de sécurité physique, qui vérifie l'adresse du site."
p2.debrief.p3: "La personne piégée est une victime, pas une coupable. Une entreprise qui punit ces erreurs apprend seulement à ses équipes à les cacher."
p2.def.intro: "Pour l'exercice, les appels sur la ligne de Lison sont journalisés avec ce qu'ils ont donné. Ton appel y est, au milieu des collègues qui l'appellent à propos du VPN."
p2.def.lesson: "Rien de technique ne t'a trahi, et rien de technique n'a été cassé. Ce qui arrête cette attaque, c'est un second facteur qui vérifie tout seul l'adresse du site : une personne qui croit l'appel ne peut alors toujours pas te faire entrer."
p2.def.find.hooked: "L'appel après lequel une session s'est ouverte dans Volière"
p2.def.rule.relay.title: "Alerter quand une connexion est approuvée pour des identifiants rejoués depuis un autre portail que le vrai"
p2.def.rule.relay.why: "C'est la bonne. Elle ne juge pas ce qui s'est dit au téléphone : elle voit la seule chose qu'un relais ne peut pas cacher, des identifiants qui arrivent d'une adresse qui n'est pas celle de la salariée."
p2.def.rule.vpn.title: "Alerter à chaque appel à un salarié qui parle du VPN"
p2.def.rule.vpn.why: "Le VPN tombe toute la semaine et tout le monde en parle. Cette règle sonne du matin au soir, donc plus personne ne la regardera le jour où elle compte."
p2.def.rule.password.title: "Alerter quand un appelant demande son mot de passe à un salarié"
p2.def.rule.password.why: "Demander le mot de passe, c'est la version maladroite de cette attaque. Celle qui marche ne demande rien : la page jumelle le récupère."
p2.def.fix.keys.title: "Remplacer les notifications d'approbation par des clés de sécurité physiques pour le VPN et les outils internes"
p2.def.fix.keys.why: "C'est le bon. La clé ne signe que pour l'adresse du vrai site. Lison peut croire l'appel et tout taper : le faux portail ne récupère rien qu'il puisse rejouer."
p2.def.fix.training.title: "Refaire la formation de sensibilisation à l'hameçonnage pour toute l'équipe du support"
p2.def.fix.training.why: "Utile, mais insuffisant seul : une semaine où le VPN tombe, un appel attendu du « support » marche encore sur quelqu'un. La défense doit tenir quand une personne se fait avoir."
p2.def.fix.caller.title: "Afficher le numéro de l'appelant sur le téléphone de chaque agent du support"
p2.def.fix.caller.why: "Un numéro affiché se falsifie, et en télétravail on attend des appels de numéros inconnus. La session s'ouvre quand même."
