p2.briefing: "One single line is open to the exercise: Lison's, a support agent. You have your pretext. Now you must be believed, then prove that you got into Volière."
p2.obj.call: "Call Lison and hear her first reaction"
p2.obj.hook: "Pass for IT support and send her to the backup portal"
p2.obj.marker: "Send the marker of the canary account (`submit`)"
p2.obj.what: "Say what gave way"
p2.q.what: "You are inside Volière. What gave way?"
p2.q.what.malware: "Lison's computer: malware was installed on it during the call and copied her session"
p2.q.what.malware.why: "Nothing was installed anywhere. Her computer is as clean as yesterday, which is exactly what makes this kind of attack hard to see."
p2.q.what.guess: "Her password: it was too simple, and a few attempts were enough to guess it"
p2.q.what.guess.why: "Nobody guessed anything. She typed it herself, on a page that looked like the real one, then approved the sign-in on her phone."
p2.q.what.trust: "Trust: she believed the call, typed her credentials on a fake page and approved the sign-in"
p2.soc.password: "Suspicious call reported by an agent: she was asked for her password"
p2.soc.scam: "Suspicious call reported by an agent: scam attempt"
p2.soc.login: "VPN sign-in from an unusual address, approved by phone"
p2.ada.brief: "The line is `https://ligne.pinson.test`: open it in the browser, or talk with `curl -d`. Remember: the backup portal is ours, it keeps nothing. And we will never ask her for her password."
p2.ada.g.call: "Start simply, to hear her voice: `curl -d \"Hello, is this Lison?\" https://ligne.pinson.test/call`."
p2.ada.g.call.standard: "Call her and listen to how she answers a stranger."
p2.ada.g.hook: "Now your pretext, all of it: say who you are (IT support) and why you are calling (her VPN problem)."
p2.ada.g.hook.standard: "Your turn to play your pretext."
p2.ada.who: "She asks who you are and why you are calling. Those are exactly the two things this morning's reading gave you."
p2.ada.who.standard: "She wants to know who is calling, and why."
p2.ada.half: "You only gave half of the story. She needs both in the same sentence: IT support, and her VPN that keeps dropping."
p2.ada.half.standard: "Half of your story is missing."
p2.ada.password: "You see: she was trained, and she reacted well. Asking for a password sets off the alarm every time. We ask for nothing, we offer help and send her to a page."
p2.ada.scam: "Missed, and she will report it. Fear and gifts, everybody knows those. Go back to what she is really waiting for: someone who fixes her VPN."
p2.ada.hooked: "Read the log under her answer. She never \"gave\" her password: she typed it on our page, which replayed it at once on the real VPN. Her phone rang, she was expecting that request, she approved. Two-factor authentication worked, and it was of no use."
p2.ada.g.marker: "The marker of the canary account is on the last line of the log. Send it to me with `submit`."
p2.ada.g.marker.standard: "Send me the marker with `submit`."
p2.ada.flag: "We are in, and we stop there: the canary account, nothing else. One question for the report."
p2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p2.ada.answer.standard: "Answer my question."
p2.ada.what: "Yes. And keep this for the report: Lison was not careless. She refused to give her password, as she was taught. She was attacked where nobody had prepared her."
p2.ada.done: "Tonight, Pinson's management calls Lison to tell her everything and thank her. Open the debrief: tomorrow we make that call useless."
p2.hint.call.1: "Type `curl -d \"Hello, is this Lison?\" https://ligne.pinson.test/call`."
p2.hint.hook.1: "Lison distrusts a stranger, a gift, and anyone who asks for her password. What she is waiting for is IT support."
p2.hint.hook.2: "In the same message: introduce yourself as IT support, and talk about her VPN problem."
p2.hint.hook.3: "Type `curl -d \"This is IT support, extension 4040. We are fixing your VPN problem, I have a backup portal for you\" https://ligne.pinson.test/call`."
p2.hint.marker.1: "Copy the `FLAG{...}` line from the log and type `submit` followed by it."
p2.debrief.title: "No virus, no flaw"
p2.debrief.lesson: "You got into Pinson's most sensitive tool without breaking anything: an expected voice, a look-alike page, an approval given in good faith. Two-factor authentication by notification does not protect against a fake site that replays everything live."
p2.debrief.p1: "Phone phishing targets a moment of trust, not a machine. No antivirus sees it."
p2.debrief.p2: "A code or a notification that you approve yourself can be relayed by a fake site. A physical security key cannot: it checks the address of the site."
p2.debrief.p3: "The person who was tricked is a victim, not a culprit. A company that punishes these mistakes only teaches its teams to hide them."
p2.def.intro: "For the exercise, the calls on Lison's line are logged with what came of them. Your call is in there, among the colleagues who ring her about the VPN."
p2.def.lesson: "Nothing technical gave you away, and nothing technical was broken. What stops this attack is a second factor that checks the address of the site by itself, so that a person who believes the call still cannot let you in."
p2.def.find.hooked: "The call after which a session opened in Volière"
p2.def.rule.relay.title: "Alert when a sign-in is approved for credentials that were replayed from a portal other than the real one"
p2.def.rule.relay.why: "This is the one. It does not judge what was said on the phone: it sees the one thing a relay cannot hide, credentials arriving from an address that is not the employee's."
p2.def.rule.vpn.title: "Alert on every call to an employee that mentions the VPN"
p2.def.rule.vpn.why: "The VPN has been dropping all week and everybody talks about it. This rule rings all day long, so nobody will look at it when it matters."
p2.def.rule.password.title: "Alert when a caller asks an employee for their password"
p2.def.rule.password.why: "Asking for the password is the clumsy version of this attack. The one that works never asks: the look-alike page collects it."
p2.def.fix.keys.title: "Replace approval notifications with physical security keys for the VPN and the internal tools"
p2.def.fix.keys.why: "This is the one. The key signs for the address of the real site only. Lison can believe the call and type everything: the fake portal gets nothing it can replay."
p2.def.fix.training.title: "Run the phishing awareness training again for the whole support team"
p2.def.fix.training.why: "Useful, but not enough alone: on a bad VPN week, an expected call from \"support\" still works on someone. The defence must hold when one person is fooled."
p2.def.fix.caller.title: "Show the caller's number on every support agent's phone"
p2.def.fix.caller.why: "A displayed number can be faked, and people working from home expect calls from numbers they do not know. The session still opens."
