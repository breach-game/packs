r.briefing: "La carte cadeau de test GC-TEST-40 vaut 40 euros et ne s'utilise qu'une fois. Le guichet des cartes reçoit `redeem GC-TEST-40` sur `https://boutique.vitrine.test/cadeau`. Fais-la créditer deux fois."
r.obj.twice: "Faire créditer deux fois la même carte"
r.obj.fix: "Dire comment l'empêcher"
r.q.fix: "Que doit changer le guichet des cartes ?"
r.q.fix.atomic: "Vérifier et marquer la carte en une seule opération verrouillée"
r.q.fix.captcha: "Ajouter un CAPTCHA avant chaque utilisation de carte"
r.q.fix.captcha.why: "Le CAPTCHA ralentit un robot, pas deux requêtes parties au même instant après un seul CAPTCHA réussi."
r.q.fix.delay: "Attendre une seconde avant de répondre à chaque demande"
r.q.fix.delay.why: "Attendre élargit la fenêtre : deux demandes ont encore plus de temps pour lire « pas encore utilisée »."
r.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
r.ada.twice: "Deux fois « +40.00 EUR » pour une carte. Chaque demande a lu « pas encore utilisée » avant que l'autre l'écrive."
r.ada.done: "Une carte, deux crédits. Le guichet vérifiait bien, juste pas au bon moment."
r.debrief.title: "Deux à la fois"
r.debrief.lesson: "Le guichet lit l'état de la carte, puis crédite, puis la marque comme utilisée. Deux demandes arrivées ensemble lisent toutes les deux l'état d'avant. Une demande après l'autre, la faille est invisible ; ensemble, elle paie deux fois."
r.debrief.p1: "Vérifier et écrire en une seule opération : une transaction, un verrou, ou une mise à jour conditionnelle."
r.debrief.p2: "Tester les actions qui ne doivent se produire qu'une fois avec des requêtes simultanées."
r.debrief.p3: "Surveiller les crédits en double sur un même objet : c'est la trace d'une course."
