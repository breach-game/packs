r.briefing: "Test gift card GC-TEST-40 is worth 40 euros and can only be used once. The gift card desk takes `redeem GC-TEST-40` on `https://boutique.vitrine.test/cadeau`. Get it credited twice."
r.obj.twice: "Get the same card credited twice"
r.obj.fix: "Say how to prevent it"
r.q.fix: "What must the gift card desk change?"
r.q.fix.atomic: "Check and mark the card in one locked operation"
r.q.fix.captcha: "Add a CAPTCHA before each card redemption"
r.q.fix.captcha.why: "A CAPTCHA slows a robot down, not two requests sent at the same instant after one solved CAPTCHA."
r.q.fix.delay: "Wait one second before answering, to keep incoming requests apart"
r.q.fix.delay.why: "Waiting widens the window: two requests have even more time to read \"not used yet\"."
r.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
r.ada.twice: "\"+40.00 EUR\" twice for one card. Each request read \"not used yet\" before the other wrote it."
r.ada.done: "One card, two credits. The desk did check, just not at the right moment."
r.debrief.title: "Two at once"
r.debrief.lesson: "The desk reads the card's state, then credits, then marks it used. Two requests arriving together both read the state from before. One request after the other, the flaw is invisible; together, it pays twice."
r.debrief.p1: "Check and write in one operation: a transaction, a lock, or a conditional update."
r.debrief.p2: "Test the actions that must happen only once with simultaneous requests."
r.debrief.p3: "Watch for double credits on one object: it is the trace of a race."
