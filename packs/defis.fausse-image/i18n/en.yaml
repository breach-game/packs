d8.briefing: "The shop lets each customer pick an avatar. Yesterday, under the mandate, the team sent a harmless witness file through that form, `temoin.png`, and a copy is in `depot/`. The shop accepted it. Show what this file really is, look at how the server serves it, and report the marker."
d8.obj.marker: "Report the witness file's marker as it is served"
d8.obj.fix: "Say how to prevent it"
d8.q.fix: "What must the shop change?"
d8.q.fix.content: "Check the real content on the server, and serve it as an image"
d8.q.fix.extension: "Check in the browser, before upload, that the name ends in .png or .jpg"
d8.q.fix.extension.why: "The witness file ended in `.png`. A name is chosen, and a check done in the browser is bypassed by talking to the server directly."
d8.q.fix.size: "Refuse files larger than one megabyte"
d8.q.fix.size.why: "The witness file is a few lines long. Size protects the disk, not the visitors."
d8.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d8.ada.done: "A picture's name, a page's content, and a server that believed the name on upload and the content when serving. Every visitor to that profile received a page chosen by a stranger, under the shop's address."
d8.debrief.title: "The false picture"
d8.debrief.lesson: "An uploaded file is not what its name says, nor what the browser declares. The shop filed a page among its pictures and served it as a page: under its own domain name, with the trust that goes with it."
d8.debrief.p1: "Look at the real content on the server, and refuse what is not an image."
d8.debrief.p2: "Serve uploaded files with a fixed type and `nosniff`, from a separate domain."
d8.debrief.p3: "Rename the file and store it outside the folders the server executes."
