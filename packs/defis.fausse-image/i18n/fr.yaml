d8.briefing: "La boutique laisse chaque client choisir un avatar. Hier, sous mandat, l'équipe a envoyé par ce formulaire un fichier témoin inoffensif, `temoin.png`, dont une copie est dans `depot/`. La boutique l'a accepté. Montre ce qu'est vraiment ce fichier, regarde comment le serveur le sert, et rapporte le marqueur."
d8.obj.marker: "Rapporter le marqueur du fichier témoin tel qu'il est servi"
d8.obj.fix: "Dire comment l'empêcher"
d8.q.fix: "Que doit changer la boutique ?"
d8.q.fix.content: "Vérifier sur le serveur le contenu réel, et le servir comme image"
d8.q.fix.extension: "Vérifier dans le navigateur que le nom finit par .png ou .jpg"
d8.q.fix.extension.why: "Le fichier témoin finissait par `.png`. Un nom se choisit, et un contrôle fait dans le navigateur se contourne en parlant directement au serveur."
d8.q.fix.size: "Refuser les fichiers de plus d'un mégaoctet"
d8.q.fix.size.why: "Le fichier témoin fait quelques lignes. La taille protège le disque, pas les visiteurs."
d8.ada.brief: "Défi. Pas de consigne de ma part : le briefing, les objectifs, et toi."
d8.ada.done: "Un nom d'image, un contenu de page, et un serveur qui a cru le nom à l'envoi puis le contenu au moment de servir. Tout visiteur de ce profil recevait une page choisie par un inconnu, sous l'adresse de la boutique."
d8.debrief.title: "La fausse image"
d8.debrief.lesson: "Un fichier envoyé n'est pas ce que dit son nom, ni ce que déclare le navigateur. La boutique a rangé une page parmi ses images et l'a servie comme une page : sous son propre nom de domaine, avec la confiance qui va avec."
d8.debrief.p1: "Regarder le contenu réel sur le serveur, et refuser ce qui n'est pas une image."
d8.debrief.p2: "Servir les fichiers envoyés avec un type fixe et `nosniff`, depuis un domaine à part."
d8.debrief.p3: "Renommer le fichier et le ranger hors des dossiers que le serveur exécute."
