l1.briefing: "Linotte is a travel start-up of nine people. Its assistant, Plume, runs on a language model rented from a provider and billed by the word. On Monday the accountant opened the provider's dashboard: more than six thousand euros in four days, for a service that usually costs four hundred a month. Nobody at Linotte changed anything."
l1.obj.usage: "Read the provider's usage export"
l1.obj.key: "Find the key that spends (`submit`)"
l1.obj.odd: "Say what its lines have that should not exist"
l1.obj.unseen: "Say why nobody saw it for four days"
l1.q.odd: "Look at the lines of that key. What is in them that should never be there?"
l1.q.odd.model: "The model `grand`, which Linotte's product never calls"
l1.q.odd.count: "More requests each day than the key of the website"
l1.q.odd.count.why: "Not on the first day: 1,840 requests against 4,055 for the site, and thirty times the cost. The count is not what makes the bill."
l1.q.odd.daily: "A use on every single day of the week, weekends included, with no pause"
l1.q.odd.daily.why: "It is the opposite: that key is silent until the 6th. The two others are the ones that work every day."
l1.q.unseen: "Four days, six thousand euros. Why did nobody at Linotte see it?"
l1.q.unseen.nobody: "Nothing was watching: no ceiling, no alert, one invoice a month"
l1.q.unseen.hidden: "The provider keeps the usage hidden until the monthly invoice is sent"
l1.q.unseen.hidden.why: "The export you just read is there every day. It was available; nobody was looking, and nothing told anyone to look."
l1.q.unseen.small: "The amounts were too small to stand out from ordinary days"
l1.q.unseen.small.why: "2,251 euros on the 8th, against 15 on an ordinary day. Anyone who looked would have seen it. Nobody looked."
l1.ada.brief: "Welcome to Linotte. Nobody was hacked, as far as they know: they just got a bill. The provider's usage export is in your `dossier` folder."
l1.ada.g.usage: "Read the export: `cat dossier/usage.csv`."
l1.ada.g.usage.standard: "Read the usage export in your `dossier` folder."
l1.ada.usage: "One line per day, per key and per model. The last column is what the day cost."
l1.ada.g.key: "Three keys. Isolate the dear model: `grep grand dossier/usage.csv`, then send me the name of the key with `submit`."
l1.ada.g.key.standard: "Three keys. One of them does not look like the others: send me its name with `submit`."
l1.ada.key: "`plume-test`. A test key, silent for months, that wakes up on the 6th and doubles every day."
l1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
l1.ada.answer.standard: "Answer my question."
l1.ada.odd: "Yes. Plume only ever calls `petit`. Someone who is not Linotte is using Linotte's key to call the dearest model on offer. They are not stealing data: they are spending."
l1.ada.unseen: "Exactly. The key had no ceiling and no limit on the models, and the account had no alert. The provider did what it was asked: answer, and count."
l1.ada.done: "We know which key and what it is used for. Open the debrief. Tomorrow we find where that key was lying around, and we measure how far it goes."
l1.hint.usage.1: "Type `cat dossier/usage.csv`."
l1.hint.key.1: "Compare the last column from one key to the other. `grep grand dossier/usage.csv` keeps only the dear model."
l1.hint.key.2: "Type `submit plume-test`."
l1.hint.odd.1: "Look at the third column, and at what the home page of www.linotte.test says about the two models."
l1.hint.unseen.1: "What would have had to exist for someone to be told on the evening of the 6th?"
l1.debrief.title: "A bill is a log"
l1.debrief.lesson: "An AI model billed by use turns a key into a means of payment. Whoever holds the key spends, and here nothing said how much, on what, or told anyone. You found the misuse in the one log the company already had: its usage export."
l1.debrief.p1: "Unbounded consumption: nothing limits what a key can spend, so a leaked key is an open tap."
l1.debrief.p2: "The signal was simple: a model the product never uses, on a key that should be asleep."
l1.debrief.p3: "Usage data is security data. Someone has to read it, or an alert has to do it for them."
