l1.briefing: "Linotte est une start-up de voyage de neuf personnes. Son assistante, Plume, tourne sur un modèle de langage loué à un fournisseur et facturé au mot. Lundi, la comptable a ouvert le tableau de bord du fournisseur : plus de six mille euros en quatre jours, pour un service qui en coûte d'habitude quatre cents par mois. Personne chez Linotte n'a rien changé."
l1.obj.usage: "Lire l'export de consommation du fournisseur"
l1.obj.key: "Trouver la clé qui dépense (`submit`)"
l1.obj.odd: "Dire ce que ses lignes ont qui ne devrait pas exister"
l1.obj.unseen: "Dire pourquoi personne ne l'a vu pendant quatre jours"
l1.q.odd: "Regarde les lignes de cette clé. Qu'y a-t-il dedans qui ne devrait jamais y être ?"
l1.q.odd.model: "Le modèle `grand`, que le produit de Linotte n'appelle jamais"
l1.q.odd.count: "Plus de demandes chaque jour que la clé du site web"
l1.q.odd.count.why: "Pas le premier jour : 1 840 demandes contre 4 055 pour le site, et trente fois le coût. Ce n'est pas le nombre qui fait la facture."
l1.q.odd.daily: "Un usage chaque jour de la semaine, sans aucune pause, même le week-end"
l1.q.odd.daily.why: "C'est l'inverse : cette clé est muette jusqu'au 6. Ce sont les deux autres qui travaillent tous les jours."
l1.q.unseen: "Quatre jours, six mille euros. Pourquoi personne chez Linotte ne l'a vu ?"
l1.q.unseen.nobody: "Rien ne surveillait : ni plafond, ni alerte, une facture par mois"
l1.q.unseen.hidden: "Le fournisseur cache la consommation jusqu'à l'envoi de la facture"
l1.q.unseen.hidden.why: "L'export que tu viens de lire est là chaque jour. Il était disponible ; personne ne regardait, et rien ne disait à personne de regarder."
l1.q.unseen.small: "Les montants étaient trop faibles pour sortir des jours ordinaires"
l1.q.unseen.small.why: "2 251 euros le 8, contre 15 un jour ordinaire. Quiconque aurait regardé l'aurait vu. Personne n'a regardé."
l1.ada.brief: "Bienvenue chez Linotte. Personne n'a été piraté, pour ce qu'ils en savent : ils ont juste reçu une facture. L'export de consommation du fournisseur est dans ton dossier `dossier`."
l1.ada.g.usage: "Lis l'export : `cat dossier/usage.csv`."
l1.ada.g.usage.standard: "Lis l'export de consommation dans ton dossier `dossier`."
l1.ada.usage: "Une ligne par jour, par clé et par modèle. La dernière colonne est ce que la journée a coûté."
l1.ada.g.key: "Trois clés. Isole le modèle cher : `grep grand dossier/usage.csv`, puis envoie-moi le nom de la clé avec `submit`."
l1.ada.g.key.standard: "Trois clés. L'une ne ressemble pas aux autres : envoie-moi son nom avec `submit`."
l1.ada.key: "`plume-test`. Une clé d'essai, muette depuis des mois, qui se réveille le 6 et double chaque jour."
l1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
l1.ada.answer.standard: "Réponds à ma question."
l1.ada.odd: "Oui. Plume n'appelle que `petit`. Quelqu'un qui n'est pas Linotte utilise la clé de Linotte pour appeler le modèle le plus cher du catalogue. Il ne vole pas de données : il dépense."
l1.ada.unseen: "Exactement. La clé n'avait ni plafond ni limite sur les modèles, et le compte n'avait aucune alerte. Le fournisseur a fait ce qu'on lui demandait : répondre, et compter."
l1.ada.done: "On sait quelle clé et à quoi elle sert. Ouvre le débrief. Demain on trouve où traînait cette clé, et on mesure jusqu'où elle va."
l1.hint.usage.1: "Tape `cat dossier/usage.csv`."
l1.hint.key.1: "Compare la dernière colonne d'une clé à l'autre. `grep grand dossier/usage.csv` ne garde que le modèle cher."
l1.hint.key.2: "Tape `submit plume-test`."
l1.hint.odd.1: "Regarde la troisième colonne, et ce que la page d'accueil de www.linotte.test dit des deux modèles."
l1.hint.unseen.1: "Qu'aurait-il fallu qui existe pour que quelqu'un soit prévenu le 6 au soir ?"
l1.debrief.title: "Une facture est un journal"
l1.debrief.lesson: "Un modèle d'IA facturé à l'usage fait d'une clé un moyen de paiement. Celui qui tient la clé dépense, et ici rien ne disait combien, ni sur quoi, ni ne prévenait personne. Tu as trouvé l'abus dans le seul journal que l'entreprise avait déjà : son export de consommation."
l1.debrief.p1: "Consommation sans limite : rien ne borne ce qu'une clé peut dépenser, donc une clé qui fuit est un robinet ouvert."
l1.debrief.p2: "Le signal était simple : un modèle que le produit n'utilise jamais, sur une clé qui devrait dormir."
l1.debrief.p3: "Les données de consommation sont des données de sécurité. Quelqu'un doit les lire, ou une alerte doit le faire à sa place."
