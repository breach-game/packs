c1.briefing: "Nobody broke into a server at Cormoran. Yet customer accounts were opened by people other than their owners. The sign-in site's logs are yours: `soc`. The attempts keep coming while you read."
c1.obj.ua: "Find what the attempts have in common"
c1.obj.rule: "Write the rule that sees them, without bothering customers"
c1.obj.why: "Say why a per-address limit saw nothing"
c1.q.ua: "Which software client signs all these attempts? (the whole user-agent field)"
c1.q.why: "Cormoran blocked an address after five failures. Why did that limit never go off?"
c1.q.why.spread: "Each address tries only once: none reaches the threshold"
c1.q.why.hidden: "The attempts were encrypted, so missing from the log"
c1.q.why.hidden.why: "They are in the log, in clear, with their address and their response. It was the rule that did not count them the right way."
c1.q.why.success: "The attempts succeeded, so no failure was counted"
c1.q.why.success.why: "Most of them fail: 401. Only the accounts whose password had leaked elsewhere open."
c1.ada.brief: "Look at the sign-ins: `soc logs portal access`. Ordinary customers, and something else. What comes back on every suspicious line?"
c1.ada.g.ua: "The addresses change at every try, but the end of the line does not: the software client. Answer with `answer ua <value>`."
c1.ada.g.ua.standard: "Find what does not change from one attempt to the next, then `answer ua`."
c1.ada.opened: "An attempt just succeeded: status 200. That password had leaked from another site, and its owner reused it here."
c1.ada.ua: "One software client, dozens of addresses. Someone took lists of credentials stolen elsewhere and tries them here, once per address, to stay under the limits."
c1.ada.g.rule: "Start with failed sign-ins: `echo \"path: /api/login\" >> regles/bourrage.yml`, `echo \"status: 401\" >> regles/bourrage.yml`, then `rule test regles/bourrage.yml`. Next, a threshold: `echo \"count|gte: 3\" >> regles/bourrage.yml`, `echo \"within: 10\" >> regles/bourrage.yml`, and count by software client: `echo \"by: ua\" >> regles/bourrage.yml`. Then `rule test` again."
c1.ada.g.rule.standard: "Write in `regles/bourrage.yml` a rule that sees failed sign-ins in bursts, without going off for a customer who gets it wrong once. Think of the threshold, and of what you count. Then `rule test`."
c1.ada.again: "Read the false alerts and the missed lines. A customer who gets it wrong once must not set it off. What do you count by? The addresses change at every try."
c1.ada.again.standard: "Not yet. Read the false alerts and the missed lines."
c1.ada.rule: "It rings for the burst, whatever the addresses, and not for a customer who gets it wrong once. A signature on the software's name works today; a threshold counted per client still works the day it changes its name."
c1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
c1.ada.answer.standard: "My question is waiting in the messenger."
c1.ada.done: "A per-address limit cannot see an attack that changes address at every try. But a rule is not enough: these accounts opened because their passwords were reused. Next: what a single open account lets you see."
c1.hint.ua.1: "Look at the last column of the POST /api/login lines."
c1.hint.ua.2: "`answer ua lotus-client/3.1`"
c1.hint.rule.1: "First select the failed sign-ins, then count."
c1.hint.rule.2: "Counting by address (`src`, the default) finds nothing: each address tries only once. Count by `ua`."
c1.hint.rule.3: "`count|gte: 3`, `within: 10`, `by: ua`, added to `path: /api/login` and `status: 401`."
c1.hint.why.1: "How many times does each address appear in the log?"
c1.debrief.title: "One address, one try"
c1.debrief.lesson: "Credential stuffing tries username and password pairs stolen from other sites. It goes through hundreds of addresses, one try each, and succeeds every time a customer reused their password. A per-address limit cannot see it; what gives the attack away is the total of failures, and what they have in common."
c1.debrief.p1: "Count failed sign-ins across the whole site, and by software client or by account, not only by address."
c1.debrief.p2: "Refuse, at sign-up and sign-in, passwords already known from leaks."
c1.debrief.p3: "Offer, then require, a second sign-in step: a stolen password is no longer enough."
