c1.briefing: "Personne n'a forcé de serveur chez Cormoran. Pourtant des comptes de clients ont été ouverts par d'autres qu'eux. Les journaux du site de connexion sont à toi : `soc`. Les tentatives continuent pendant que tu lis."
c1.obj.ua: "Trouver ce que les tentatives ont en commun"
c1.obj.rule: "Écrire la règle qui les voit, sans gêner les clients"
c1.obj.why: "Dire pourquoi une limite par adresse n'a rien vu"
c1.q.ua: "Quel client logiciel (champ user-agent) signe toutes ces tentatives ?"
c1.q.why: "Cormoran bloquait une adresse après cinq échecs. Pourquoi cette limite n'a-t-elle jamais sonné ?"
c1.q.why.spread: "Chaque adresse n'essaie qu'une fois : aucune n'atteint le seuil"
c1.q.why.hidden: "Les tentatives étaient chiffrées, donc absentes du journal"
c1.q.why.hidden.why: "Elles sont dans le journal, en clair, avec leur adresse et leur réponse. C'est la règle qui ne les comptait pas comme il faut."
c1.q.why.success: "Les tentatives réussissaient, donc aucun échec n'était compté"
c1.q.why.success.why: "La plupart échouent : 401. Seuls les comptes dont le mot de passe avait fuité ailleurs s'ouvrent."
c1.ada.brief: "Regarde les connexions : `soc logs portal access`. Des clients ordinaires, et autre chose. Qu'est-ce qui revient à chaque ligne suspecte ?"
c1.ada.g.ua: "Les adresses changent à chaque essai, mais la fin de la ligne, non : le client logiciel. Réponds avec `answer ua <valeur>`."
c1.ada.g.ua.standard: "Trouve ce qui ne change pas d'une tentative à l'autre, puis `answer ua`."
c1.ada.opened: "Une tentative vient de réussir : statut 200. Ce mot de passe avait fuité d'un autre site, et son propriétaire l'a réutilisé ici."
c1.ada.ua: "Un seul client logiciel, des dizaines d'adresses. Quelqu'un a pris des listes d'identifiants volés ailleurs et les essaie ici, une fois par adresse, pour passer sous les limites."
c1.ada.g.rule: "Commence par les échecs de connexion : `echo \"path: /api/login\" >> regles/bourrage.yml`, `echo \"status: 401\" >> regles/bourrage.yml`, puis `rule test regles/bourrage.yml`. Ensuite, un seuil : `echo \"count|gte: 3\" >> regles/bourrage.yml`, `echo \"within: 10\" >> regles/bourrage.yml`, et compte par client logiciel : `echo \"by: ua\" >> regles/bourrage.yml`. Puis `rule test` de nouveau."
c1.ada.g.rule.standard: "Écris dans `regles/bourrage.yml` une règle qui voit les échecs de connexion en rafale, sans sonner pour un client qui se trompe une fois. Pense au seuil, et à ce qu'on compte. Puis `rule test`."
c1.ada.again: "Lis les fausses alertes et les lignes manquées. Un client qui se trompe une fois ne doit pas sonner. Par quoi comptes-tu ? Les adresses changent à chaque essai."
c1.ada.again.standard: "Pas encore. Lis les fausses alertes et les lignes manquées."
c1.ada.rule: "Trois échecs en dix minutes depuis le même client logiciel, quelles que soient les adresses. Les clients qui se trompent une fois ne sonnent pas."
c1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
c1.ada.answer.standard: "Ma question t'attend dans la messagerie."
c1.ada.done: "Une limite par adresse ne voit pas une attaque qui change d'adresse à chaque essai. Mais une règle ne suffit pas : ces comptes se sont ouverts parce que leurs mots de passe étaient réutilisés. La suite : ce qu'un seul compte ouvert laisse voir."
c1.hint.ua.1: "Regarde la dernière colonne des lignes POST /api/login."
c1.hint.ua.2: "`answer ua lotus-client/3.1`"
c1.hint.rule.1: "D'abord sélectionner les échecs de connexion, ensuite compter."
c1.hint.rule.2: "Compter par adresse (`src`, par défaut) ne trouve rien : chaque adresse n'essaie qu'une fois. Compte par `ua`."
c1.hint.rule.3: "`count|gte: 3`, `within: 10`, `by: ua`, ajoutés à `path: /api/login` et `status: 401`."
c1.hint.why.1: "Combien de fois chaque adresse apparaît-elle dans le journal ?"
c1.debrief.title: "Une adresse, un essai"
c1.debrief.lesson: "Le bourrage d'identifiants essaie des couples identifiant et mot de passe volés sur d'autres sites. Il passe par des centaines d'adresses, un essai chacune, et réussit chaque fois qu'un client a réutilisé son mot de passe. Une limite par adresse ne le voit pas ; ce qui trahit l'attaque, c'est le total des échecs, et ce qu'ils ont en commun."
c1.debrief.p1: "Compter les échecs de connexion sur tout le site, et par client logiciel ou par compte, pas seulement par adresse."
c1.debrief.p2: "Refuser à l'inscription et à la connexion les mots de passe déjà connus dans des fuites."
c1.debrief.p3: "Proposer, puis exiger, une seconde étape de connexion : un mot de passe volé ne suffit plus."
