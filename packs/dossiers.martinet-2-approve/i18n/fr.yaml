m2.briefing: "Le compte `noe.ext` a un mot de passe en vente et un second facteur : une demande à approuver sur le téléphone de Noé. Le portail d'exercice rejoue le mot de passe à ta place. À toi de voir ce que vaut le bouton."
m2.obj.first: "Tenter une connexion et lire ce que fait le téléphone"
m2.obj.again: "Recommencer jusqu'à ce que la demande soit approuvée"
m2.obj.marker: "Envoyer le marqueur témoin de la session (`submit`)"
m2.obj.what: "Dire ce qui a cédé"
m2.q.what: "La session est ouverte. Qu'est-ce qui a cédé ?"
m2.q.what.password: "Le mot de passe : il était trop faible, et c'est lui qui a laissé passer les trois tentatives de la soirée"
m2.q.what.password.why: "Le mot de passe était perdu depuis deux mois, quelle que soit sa force. C'est le second facteur qui devait tenir ce soir."
m2.q.what.careless: "Noé : il a été négligent, il lui suffisait de refuser une troisième fois puis d'éteindre son téléphone"
m2.q.what.careless.why: "Il a refusé deux fois, de nuit, sans que personne ne l'aide. Un système qui compte sur quelqu'un pour dire non autant de fois qu'on veut finit toujours par perdre."
m2.q.what.design: "Le réglage : un bouton à approuver sans rien vérifier, qu'on peut faire sonner sans limite ni alerte"
m2.soc.other: "Tentative de connexion sur un compte hors exercice"
m2.soc.denied: "Demande d'approbation refusée par le titulaire (aucune alerte configurée)"
m2.soc.login: "Connexion approuvée après plusieurs refus, depuis une adresse inhabituelle"
m2.ada.brief: "Le portail est `https://sso.martinet.test` : ouvre-le dans le navigateur, ou écris-lui avec `curl -d`. Rappel du mandat : un seul compte, celui de Noé, et on s'arrête au marqueur."
m2.ada.g.first: "Lance une connexion sur le compte témoin : `curl -d \"connexion noe.ext\" https://sso.martinet.test/login`."
m2.ada.g.first.standard: "Tente une connexion sur le compte témoin et lis le journal."
m2.ada.how: "Le portail attend seulement le compte à connecter. Écris-lui `connexion noe.ext`."
m2.ada.how.standard: "Le portail attend le compte à connecter."
m2.ada.other: "Non. Le mandat ouvre un seul compte, celui de Noé. Le reste est hors exercice, et ça se voit dans le journal."
m2.ada.denied1: "Lis le journal. Le mot de passe est passé sans bruit, le téléphone a sonné, Noé a refusé. Le second facteur a fait son travail. Maintenant regarde la dernière ligne : aucune limite, aucune alerte. Rien ne t'empêche de sonner encore."
m2.ada.g.again: "Recommence la même connexion, autant de fois qu'il faut : `curl -d \"connexion noe.ext\" https://sso.martinet.test/login`."
m2.ada.g.again.standard: "Rien ne limite les demandes. Recommence."
m2.ada.denied2: "Deuxième refus. Il est presque 23 heures chez Noé. Personne à Martinet n'a été prévenu que quelqu'un insiste sur son compte, et lui ne sait pas à qui le dire."
m2.ada.accepted: "Il a approuvé. Pas par bêtise : son téléphone sonnait pour la troisième fois dans la nuit, et le seul geste qui arrête la sonnerie, c'est ce bouton. Dans l'affaire réelle aussi, le prestataire a fini par en accepter une."
m2.ada.g.marker: "Le marqueur témoin est à la dernière ligne du journal. Envoie-le-moi avec `submit`."
m2.ada.g.marker.standard: "Envoie-moi le marqueur avec `submit`."
m2.ada.flag: "On est dans l'intranet avec le compte d'un prestataire, et on s'arrête là pour ce soir. Une question pour le rapport."
m2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
m2.ada.answer.standard: "Réponds à ma question."
m2.ada.what: "Oui. Le rapport dira que Noé a bien réagi deux fois, et que le système l'a laissé seul la troisième. On corrige le réglage, pas la personne."
m2.ada.done: "Ce soir, le directeur de la sécurité appelle Noé pour tout lui raconter et le remercier. Ouvre le débrief. Demain, on regarde ce qu'un compte de prestataire trouve une fois à l'intérieur."
m2.hint.first.1: "Tape `curl -d \"connexion noe.ext\" https://sso.martinet.test/login`."
m2.hint.again.1: "Le journal dit qu'aucune limite n'est configurée. Refais la même demande."
m2.hint.again.2: "Tape encore `curl -d \"connexion noe.ext\" https://sso.martinet.test/login`, jusqu'à ce que la session s'ouvre."
m2.hint.marker.1: "Copie la ligne `FLAG{...}` du journal et tape `submit` suivi de cette ligne."
m2.debrief.title: "Un bouton qui ne demande rien"
m2.debrief.lesson: "Tu n'as trompé personne et tu n'as rien cassé : tu as fait sonner un téléphone jusqu'à ce que son propriétaire cède. Un second facteur qui se résume à un bouton « Approuver » ne vérifie pas que la personne qui approuve est celle qui se connecte."
m2.debrief.p1: "La fatigue des notifications vise la lassitude, pas la compétence. Plus les demandes sont nombreuses et tardives, plus le oui devient probable."
m2.debrief.p2: "Un second facteur doit lier l'approbation à la connexion : un nombre à recopier, ou mieux, une clé de sécurité physique."
m2.debrief.p3: "Plusieurs refus de suite sont un signal d'attaque. Le compte doit se verrouiller, et quelqu'un doit être prévenu."
