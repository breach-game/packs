m2.briefing: "Le compte `noe.ext` a un mot de passe en vente. Un mot de passe ne suffit pas chez Martinet : le portail demande un second facteur. Le portail d'exercice rejoue le mot de passe à ta place. À toi de trouver ce que vaut le second facteur."
m2.obj.first: "Trouver le second facteur qui ne te demande rien, et lire ce que fait le téléphone"
m2.obj.again: "Recommencer jusqu'à ce que la demande soit approuvée"
m2.obj.marker: "Envoyer le marqueur témoin de la session (`submit`)"
m2.obj.what: "Dire ce qui a cédé"
m2.q.what: "La session est ouverte. Qu'est-ce qui a cédé ?"
m2.q.what.password: "Le mot de passe : il était trop faible, et c'est lui qui a laissé passer les trois tentatives de la soirée"
m2.q.what.password.why: "Le mot de passe était perdu depuis deux mois, quelle que soit sa force. C'est le second facteur qui devait tenir ce soir."
m2.q.what.careless: "Noé : il a été négligent, il lui suffisait de refuser une troisième fois puis d'éteindre son téléphone"
m2.q.what.careless.why: "Il a refusé deux fois, de nuit, sans que personne ne l'aide. Un système qui compte sur quelqu'un pour dire non autant de fois qu'on veut finit toujours par perdre."
m2.q.what.design: "Le réglage : un bouton à approuver sans rien vérifier, qu'on peut faire sonner sans limite ni alerte"
m2.soc.other: "Tentative de connexion sur un compte hors exercice"
m2.soc.denied: "Demande d'approbation refusée par le titulaire (aucune alerte configurée)"
m2.soc.login: "Connexion approuvée après plusieurs refus, depuis une adresse inhabituelle"
m2.ada.brief: "Le portail est `https://sso.martinet.test` : ouvre-le dans le navigateur, ou écris-lui avec `curl -d \"…\" https://sso.martinet.test/login`. Rappel du mandat : un seul compte, celui de Noé, et on s'arrête au marqueur."
m2.ada.g.first: "Deux des trois demandent un objet que tu n'as pas. Le troisième demande seulement à Noé d'appuyer : `curl -d \"connexion noe.ext push\" https://sso.martinet.test/login`."
m2.ada.g.first.standard: "Trouve celui que tu peux déclencher sans rien avoir en main."
m2.ada.how: "Le portail attend seulement le compte à connecter. Écris-lui `connexion noe.ext`."
m2.ada.how.standard: "Le portail attend le compte à connecter."
m2.ada.other: "Non. Le mandat ouvre un seul compte, celui de Noé. Le reste est hors exercice, et ça se voit dans le journal."
m2.ada.denied1: "Lis le journal. Le mot de passe est passé sans bruit, le téléphone a sonné, Noé a refusé. Le second facteur a fait son travail. Maintenant regarde la dernière ligne : aucune limite, aucune alerte. Rien ne t'empêche de sonner encore."
m2.ada.g.again: "Recommence la même connexion, autant de fois qu'il faut : `curl -d \"connexion noe.ext push\" https://sso.martinet.test/login`."
m2.ada.g.again.standard: "Rien ne limite les demandes. Recommence."
m2.ada.denied2: "Deuxième refus. Il est presque 23 heures chez Noé. Personne à Martinet n'a été prévenu que quelqu'un insiste sur son compte, et lui ne sait pas à qui le dire."
m2.ada.accepted: "Il a approuvé. Pas par bêtise : son téléphone sonnait pour la troisième fois dans la nuit, et le seul geste qui arrête la sonnerie, c'est ce bouton. Dans l'affaire réelle aussi, le prestataire a fini par en accepter une."
m2.ada.g.marker: "Le marqueur témoin est à la dernière ligne du journal. Envoie-le-moi avec `submit`."
m2.ada.g.marker.standard: "Envoie-moi le marqueur avec `submit`."
m2.ada.flag: "On est dans l'intranet avec le compte d'un prestataire, et on s'arrête là pour ce soir. Une question pour le rapport."
m2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
m2.ada.answer.standard: "Réponds à ma question."
m2.ada.what: "Oui. Le rapport dira que Noé a bien réagi deux fois, et que le système l'a laissé seul la troisième. On corrige le réglage, pas la personne."
m2.ada.done: "Ce soir, le directeur de la sécurité appelle Noé pour tout lui raconter et le remercier. Ouvre le débrief. Demain, on regarde ce qu'un compte de prestataire trouve une fois à l'intérieur."
m2.hint.first.1: "Le code et la clé demandent tous les deux un objet que tu n'as pas. Quel facteur demande seulement à quelqu'un d'autre de faire un geste ?"
m2.hint.again.1: "Le journal dit qu'aucune limite n'est configurée. Refais la même demande."
m2.hint.again.2: "Tape encore `curl -d \"connexion noe.ext push\" https://sso.martinet.test/login`, jusqu'à ce que la session s'ouvre."
m2.hint.marker.1: "Copie la ligne `FLAG{...}` du journal et tape `submit` suivi de cette ligne."
m2.debrief.title: "Un bouton qui ne demande rien"
m2.debrief.lesson: "Tu n'as trompé personne et tu n'as rien cassé : tu as fait sonner un téléphone jusqu'à ce que son propriétaire cède. Un second facteur qui se résume à un bouton « Approuver » ne vérifie pas que la personne qui approuve est celle qui se connecte."
m2.debrief.p1: "La fatigue des notifications vise la lassitude, pas la compétence. Plus les demandes sont nombreuses et tardives, plus le oui devient probable."
m2.debrief.p2: "Un second facteur doit lier l'approbation à la connexion : un nombre à recopier, ou mieux, une clé de sécurité physique."
m2.debrief.p3: "Plusieurs refus de suite sont un signal d'attaque. Le compte doit se verrouiller, et quelqu'un doit être prévenu."
m2.def.intro: "Le portail journalise chaque tentative de connexion et ce que le téléphone a répondu. Tes tentatives y sont, au milieu de la soirée ordinaire du bureau."
m2.def.lesson: "Rien ici ne demandait un outil savant : le journal disait déjà « refusé, refusé, approuvé ». La défense consiste à faire réagir le système à cette suite tout seul, et à ne plus demander à une personne fatiguée d'être le dernier rempart."
m2.def.find.denied: "Les demandes que Noé a refusées"
m2.def.find.accepted: "La demande qu'il a fini par approuver"
m2.def.rule.repeat.title: "Alerter quand une même adresse se voit refuser 2 demandes d'approbation ou plus en 30 minutes"
m2.def.rule.repeat.why: "C'est la bonne. Un refus, c'est un pouce qui glisse. Deux de suite depuis la même adresse, c'est quelqu'un qui a le mot de passe et qui insiste : l'alerte part avant la troisième demande."
m2.def.rule.any.title: "Alerter à chaque demande d'approbation refusée"
m2.def.rule.any.why: "Elle t'a vu, mais elle sonne aussi chaque fois qu'un salarié se trompe de bouton. Une alerte qui sonne pour rien tous les soirs, plus personne ne la lit le soir où elle compte."
m2.def.rule.volume.title: "Alerter quand une même adresse fait 3 tentatives de connexion ou plus en 10 minutes"
m2.def.rule.volume.why: "Tout le bureau se connecte depuis une seule adresse partagée : cette règle sonne toute la soirée. Compter les connexions ne dit rien ; compter les refus, si."
m2.def.fix.limit.title: "Après deux demandes refusées, verrouiller le compte et alerter l'astreinte ; remplacer le bouton « Approuver » par un nombre à recopier depuis l'écran de connexion"
m2.def.fix.limit.why: "C'est le bon. La troisième demande n'arrive jamais au téléphone, la sécurité est prévenue, et une approbation prouve désormais que la personne est devant l'écran de connexion."
m2.def.fix.password.title: "Imposer des mots de passe d'au moins 16 caractères aux prestataires"
m2.def.fix.password.why: "Le mot de passe a été copié par un logiciel malveillant au moment de la frappe. Seize caractères se copient aussi bien que huit, et le téléphone sonne toujours trois fois."
m2.def.fix.reminder.title: "Envoyer un rappel à tous les prestataires : ne jamais approuver une demande qu'on n'a pas lancée"
m2.def.fix.reminder.why: "Noé le savait, et il a refusé deux fois. Un rappel n'arrête pas la sonnerie à 23 heures, et ne lui dit pas qui appeler."
m2.obj.methods: "Voir quels seconds facteurs le compte accepte"
m2.ada.g.methods: "Lance une connexion sur le compte témoin : `curl -d \"connexion noe.ext\" https://sso.martinet.test/login`."
m2.ada.g.methods.standard: "Tente une connexion sur le compte témoin et lis le journal."
m2.ada.methods: "Lis la liste. Trois seconds facteurs, et le portail le dit lui-même : n'importe lequel ouvre la session. Un compte vaut ce que vaut le plus faible des facteurs qu'il accepte encore."
m2.ada.code: "Bloqué, et Noé n'en a même rien su. Ce code vit sur son téléphone : pour l'avoir, il faudrait le lui faire lire à voix haute. C'est une autre attaque, et pas celle de ce soir."
m2.ada.key: "Bloqué. Une clé de sécurité ne répond qu'à l'ordinateur où elle est branchée, et seulement au vrai site. D'ici, il n'y a rien à tenter. Retiens-le pour le débrief."
m2.soc.blocked: "Connexion bloquée au second facteur (code ou clé absents)"
m2.hint.methods.1: "Tape `curl -d \"connexion noe.ext\" https://sso.martinet.test/login`."
m2.hint.first.2: "Tape `curl -d \"connexion noe.ext push\" https://sso.martinet.test/login`."
