m2.briefing: "The account `noe.ext` has a password for sale and a second factor: a request to approve on Noé's phone. The exercise portal replays the password for you. It is up to you to see what the button is worth."
m2.obj.first: "Attempt a login and read what the phone does"
m2.obj.again: "Start again until the request is approved"
m2.obj.marker: "Send the witness marker of the session (`submit`)"
m2.obj.what: "Say what gave way"
m2.q.what: "The session is open. What gave way?"
m2.q.what.password: "The password: it was too weak, and it is what let all three attempts of the evening through"
m2.q.what.password.why: "The password had been lost for two months, however strong it was. The second factor is what had to hold tonight."
m2.q.what.careless: "Noé: he was careless, he only had to refuse a third time and then switch his phone off"
m2.q.what.careless.why: "He refused twice, at night, with nobody to help him. A system that counts on someone to say no as many times as an attacker likes always loses in the end."
m2.q.what.design: "The setting: a button to approve with nothing to check, that can be rung with no limit and no alert"
m2.soc.other: "Login attempt on an account outside the exercise"
m2.soc.denied: "Approval request denied by the account holder (no alert configured)"
m2.soc.login: "Login approved after several denials, from an unusual address"
m2.ada.brief: "The portal is `https://sso.martinet.test`: open it in the browser, or write to it with `curl -d`. Reminder of the mandate: a single account, Noé's, and we stop at the marker."
m2.ada.g.first: "Start a login on the witness account: `curl -d \"login noe.ext\" https://sso.martinet.test/login`."
m2.ada.g.first.standard: "Attempt a login on the witness account and read the log."
m2.ada.how: "The portal only expects the account to log in. Write `login noe.ext` to it."
m2.ada.how.standard: "The portal expects the account to log in."
m2.ada.other: "No. The mandate opens a single account, Noé's. The rest is outside the exercise, and it shows in the log."
m2.ada.denied1: "Read the log. The password went through without a sound, the phone rang, Noé refused. The second factor did its job. Now look at the last line: no limit, no alert. Nothing stops you from ringing again."
m2.ada.g.again: "Run the same login again, as many times as it takes: `curl -d \"login noe.ext\" https://sso.martinet.test/login`."
m2.ada.g.again.standard: "Nothing limits the requests. Start again."
m2.ada.denied2: "Second refusal. It is nearly 11 pm for Noé. Nobody at Martinet has been told that someone keeps trying his account, and he does not know whom to tell."
m2.ada.accepted: "He approved. Not out of stupidity: his phone was ringing for the third time that night, and the only gesture that stops the ringing is that button. In the real case too, the contractor ended up accepting one."
m2.ada.g.marker: "The witness marker is on the last line of the log. Send it to me with `submit`."
m2.ada.g.marker.standard: "Send me the marker with `submit`."
m2.ada.flag: "We are in the intranet with a contractor's account, and we stop there for tonight. One question for the report."
m2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
m2.ada.answer.standard: "Answer my question."
m2.ada.what: "Yes. The report will say that Noé reacted well twice, and that the system left him alone the third time. We fix the setting, not the person."
m2.ada.done: "Tonight, the head of security calls Noé to tell him everything and thank him. Open the debrief. Tomorrow, we look at what a contractor's account finds once inside."
m2.hint.first.1: "Type `curl -d \"login noe.ext\" https://sso.martinet.test/login`."
m2.hint.again.1: "The log says no limit is configured. Make the same request again."
m2.hint.again.2: "Type `curl -d \"login noe.ext\" https://sso.martinet.test/login` again, until the session opens."
m2.hint.marker.1: "Copy the `FLAG{...}` line from the log and type `submit` followed by that line."
m2.debrief.title: "A button that asks nothing"
m2.debrief.lesson: "You fooled nobody and broke nothing: you made a phone ring until its owner gave in. A second factor that comes down to an \"Approve\" button does not check that the person approving is the one logging in."
m2.debrief.p1: "Notification fatigue targets weariness, not skill. The more numerous and the later the requests, the more likely the yes."
m2.debrief.p2: "A second factor must tie the approval to the login: a number to copy, or better, a physical security key."
m2.debrief.p3: "Several denials in a row are a sign of attack. The account must lock, and someone must be told."
m2.def.intro: "The portal logs every sign-in attempt and what the phone answered. Your three attempts are in there, among the office's ordinary evening."
m2.def.lesson: "Nothing here needed a clever tool: the log already said \"denied, denied, approved\". The defence is to make the system react to that sequence by itself, and to stop asking a tired person to be the last line."
m2.def.find.denied: "The requests that Noé refused"
m2.def.find.accepted: "The request he ended up approving"
m2.def.rule.repeat.title: "Alert when one address gets 2 or more approval requests denied within 30 minutes"
m2.def.rule.repeat.why: "This is the one. One denial is a slip of the thumb. Two in a row from the same address is someone who has the password and keeps ringing: the alert fires before the third request."
m2.def.rule.any.title: "Alert on every denied approval request"
m2.def.rule.any.why: "It saw you, but it also fires each time an employee taps the wrong button. An alert that rings for nothing every evening is an alert nobody reads on the night that matters."
m2.def.rule.volume.title: "Alert when one address makes 3 or more sign-in attempts within 10 minutes"
m2.def.rule.volume.why: "The whole office signs in from one shared address: this rule fires all evening long. Counting sign-ins says nothing; counting refusals does."
m2.def.fix.limit.title: "After two denied requests, lock the account and alert the on-call; replace the \"Approve\" button with a number to copy from the sign-in screen"
m2.def.fix.limit.why: "This is the one. The third request never reaches the phone, security is told, and an approval now proves that the person is in front of the sign-in screen."
m2.def.fix.password.title: "Require passwords of at least 16 characters for contractors"
m2.def.fix.password.why: "The password was copied by malware as it was typed. Sixteen characters are copied as easily as eight, and the phone still rings three times."
m2.def.fix.reminder.title: "Send every contractor a reminder: never approve a request you did not start"
m2.def.fix.reminder.why: "Noé knew it, and refused twice. A reminder does not stop the ringing at 11 pm, and does not tell him whom to call."
