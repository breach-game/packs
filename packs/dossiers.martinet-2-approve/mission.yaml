order: 1
stage: access
briefing: m2.briefing

objectives:
  - { id: methods, text: m2.obj.methods }
  - { id: first, text: m2.obj.first }
  - { id: again, text: m2.obj.again }
  - { id: marker, text: m2.obj.marker }
  - { id: what, text: m2.obj.what }

flags:
  - { id: marker, value: "FLAG{martinet-approuve-3e7a}", points: 200, objective: marker }

questions:
  - id: what
    text: m2.q.what
    objective: what
    correct: design
    options:
      - { id: password, text: m2.q.what.password, why: m2.q.what.password.why }
      - { id: careless, text: m2.q.what.careless, why: m2.q.what.careless.why }
      - { id: design, text: m2.q.what.design }

reveal: [www, sso]

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: m2.ada.brief
  - on: { event: ChatReply, npc: portail, intent: fallback }
    do:
      - ada.guide: { key: m2.ada.how, for: methods, step: 1 }
  - on: { event: ChatReply, npc: portail, intent: methods }
    do:
      - objective.complete: methods
      - ada.say: m2.ada.methods
  # Two dead ends worth trying: they show why the third factor is the weak one.
  - on: { event: ChatReply, npc: portail, intent: code }
    do:
      - objective.complete: methods
      - noise.add: { points: 2, as: m2.soc.blocked }
      - ada.say: m2.ada.code
  - on: { event: ChatReply, npc: portail, intent: key }
    do:
      - objective.complete: methods
      - noise.add: { points: 2, as: m2.soc.blocked }
      - ada.say: m2.ada.key
  - on: { event: ChatReply, npc: portail, intent: other }
    do:
      - noise.add: { points: 10, as: m2.soc.other }
      - ada.say: m2.ada.other
  - on: { event: ChatReply, npc: portail, intent: denied1 }
    do:
      - objective.complete: methods
      - objective.complete: first
      - noise.add: { points: 4, as: m2.soc.denied }
      - ada.say: m2.ada.denied1
  - on: { event: ChatReply, npc: portail, intent: denied2 }
    do:
      - objective.complete: methods
      - objective.complete: first
      - noise.add: { points: 4, as: m2.soc.denied }
      - ada.say: m2.ada.denied2
  - on: { event: ChatReply, npc: portail, intent: accepted }
    do:
      - objective.complete: methods
      - objective.complete: first
      - objective.complete: again
      - noise.add: { points: 6, as: m2.soc.login }
      - ada.say: m2.ada.accepted
  - on: { event: FlagSubmitted, correct: true }
    do:
      - ada.say: m2.ada.flag
      - ada.ask: what
  - on: { event: ObjectiveCompleted, objective: what }
    do:
      - ada.say: m2.ada.what
  - on: { event: MissionCompleted }
    do:
      - ada.say: m2.ada.done

guide:
  methods: m2.ada.g.methods
  first: m2.ada.g.first
  again: m2.ada.g.again
  marker: m2.ada.g.marker
  what: m2.ada.answer

hints:
  methods: [m2.hint.methods.1]
  first: [m2.hint.first.1, m2.hint.first.2]
  again: [m2.hint.again.1, m2.hint.again.2]
  marker: [m2.hint.marker.1]

# The defence replay: find the three attempts, pick the rule, pick the fix. The engine replays the
# player's own attempts against the fixed portal.
defense:
  intro: m2.def.intro
  lesson: m2.def.lesson
  find:
    - { source: chat, where: { npc: portail, intent: { glob: "denied*" } }, text: m2.def.find.denied }
    - { source: chat, where: { npc: portail, intent: accepted }, text: m2.def.find.accepted }
  rules:
    - id: repeat
      title: m2.def.rule.repeat.title
      why: m2.def.rule.repeat.why
      source: chat
      where: { npc: portail, intent: { glob: "denied*" } }
      count: { gte: 2, within: 30 }
      correct: true
    - id: any-denied
      title: m2.def.rule.any.title
      why: m2.def.rule.any.why
      source: chat
      where: { npc: portail, intent: { glob: "denied*" } }
    - id: volume
      title: m2.def.rule.volume.title
      why: m2.def.rule.volume.why
      source: chat
      where: { npc: portail }
      count: { gte: 3, within: 10 }
  fixes:
    - id: limit
      title: m2.def.fix.limit.title
      why: m2.def.fix.limit.why
      sets: { martinet.push_limit: true }
      correct: true
    - id: password
      title: m2.def.fix.password.title
      why: m2.def.fix.password.why
      sets: { martinet.long_passwords: true }
    - id: reminder
      title: m2.def.fix.reminder.title
      why: m2.def.fix.reminder.why
      sets: { martinet.reminder_sent: true }

# An ordinary evening on the portal: the office signs in from one shared address, and now and then
# someone taps "Deny" by mistake. That is what makes a naive rule misfire.
background:
  - { host: sso, source: chat, every: 2, offset: 1, fields: { src: 10.64.0.120, npc: portail, intent: signin, families: [none], msg: "login svc-bureau" } }
  - { host: sso, source: chat, every: 45, offset: 3, fields: { src: 10.64.0.131, npc: portail, intent: denied1, families: [none], msg: "login lea.b" } }
  - { host: sso, source: chat, every: 45, offset: 25, fields: { src: 10.64.0.142, npc: portail, intent: denied1, families: [none], msg: "login karim.d" } }

debrief:
  title: m2.debrief.title
  lesson: m2.debrief.lesson
  points: [m2.debrief.p1, m2.debrief.p2, m2.debrief.p3]
  reference: "MITRE ATT&CK · T1621 Multi-Factor Authentication Request Generation"
