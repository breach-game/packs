c1.briefing: "Mardi 12 juin, 13 h 40. Nacre garde les portefeuilles de quelques dizaines de milliers de clients. Depuis vingt minutes, le support reçoit des messages étranges : un avertissement de certificat pour certains, rien pour d'autres. Rien n'a été déployé aujourd'hui, et vu du bureau le site est normal. L'équipe a mis dans ton dossier les messages du support, les réponses des serveurs de noms relevées par des sondes, et les annonces de routes vues par un collecteur."
c1.obj.fake: "Trouver l'adresse que certains clients reçoivent à la place du site"
c1.obj.origin: "Trouver quel réseau annonce une route qui n'est pas la sienne"
c1.obj.why: "Dire pourquoi les autres réseaux l'ont suivi"
c1.obj.cert: "Lire le certificat que les clients ont vu"
c1.obj.notice: "Décider quoi dire aux clients"
c1.q.fake: "Quelle adresse certaines sondes reçoivent-elles à la place de celle du site ?"
c1.q.origin: "Quel numéro de réseau (AS) annonce la route la plus précise ? Le nombre seul."
c1.q.why: "Rien n'a changé chez Nacre. Pourquoi une partie d'Internet suit-elle cette annonce ?"
c1.q.why.specific: "La route la plus précise l'emporte, sans vérifier qui l'annonce"
c1.q.why.hacked: "Le serveur de noms de Nacre a été piraté et modifié"
c1.q.why.hacked.why: "Le serveur de noms n'a pas changé : vu du bureau et de plusieurs sondes, il répond toujours juste. Les autres sondes ne lui parlent plus du tout : leurs questions partent ailleurs. Relis `routes/annonces.csv`."
c1.q.why.registrar: "Le compte de Nacre chez son bureau d'enregistrement a fuité, puis servi"
c1.q.why.registrar.why: "Dans ce cas toutes les sondes recevraient la même mauvaise réponse. Ici, tout dépend du chemin que prend la question : regarde la colonne `seen_by_collectors`."
c1.q.cert: "Que dit le certificat présenté par le site que ces clients ont vu ?"
c1.q.cert.self: "Il est signé par lui-même : aucune autorité ne l'a vérifié"
c1.q.cert.expired: "Il est expiré depuis une semaine et n'a pas été renouvelé"
c1.q.cert.expired.why: "Ses dates sont bonnes : il a été fabriqué ce matin. Compare les lignes `subject` et `issuer` des deux certificats."
c1.q.cert.other: "Il vient d'une autorité reconnue, mais pour un autre nom"
c1.q.cert.other.why: "Il porte bien le nom du site. Regarde plutôt qui l'a émis : compare `issuer` dans les deux fichiers."
c1.q.notice: "La route est encore fausse, et la corriger ne dépend pas de Nacre. Que fais-tu maintenant ?"
c1.q.notice.warn: "Prévenir partout tout de suite : ne passez jamais l'avertissement"
c1.q.notice.pause: "Fermer les connexions au portefeuille jusqu'au retour à la normale"
c1.q.notice.wait: "Attendre la confirmation des opérateurs avant de communiquer"
c1.ada.brief: "Un site qui marche pour les uns et pas pour les autres, sans rien avoir changé : on commence par se demander si tout le monde arrive au même endroit. Lis les messages du support, puis les sondes : `dns/reponses.csv`."
c1.ada.g.fake: "Lis `cat dns/reponses.csv`. La colonne `answer` donne l'adresse reçue : la vraie est 10.110.4.20. Réponds avec `answer fake <adresse>`."
c1.ada.g.fake.standard: "Compare les réponses des sondes dans `dns/reponses.csv` et donne l'adresse intruse avec `answer fake`."
c1.ada.fake: "Même question, même adresse de serveur de noms, deux réponses. Et regarde les lignes `statut.nacre.test` : le serveur qui ment ne répond pour aucun autre nom. Il n'existe que pour un seul site. Ce n'est donc pas notre serveur de noms qui a changé, c'est le chemin qui mène à lui."
c1.ada.fake.routes: "Les chemins sont dans `routes/annonces.csv`."
c1.ada.g.origin: "Lis `cat routes/annonces.csv`. Cherche l'annonce apparue aujourd'hui pour les adresses du serveur de noms, puis `answer origin <numéro>`."
c1.ada.g.origin.standard: "Trouve dans `routes/annonces.csv` l'annonce qui n'existait pas hier, et réponds avec `answer origin`."
c1.ada.origin: "Depuis 13 h 10, le réseau 64510 annonce 10.110.0.0/24, la moitié exacte du bloc que l'opérateur de noms de Nacre annonce depuis trois ans. Vingt-six collecteurs sur quarante et un la voient. Erreur ou malveillance, à ce stade on ne le sait pas, et on ne l'écrira pas."
c1.ada.g.why: "Réponds à ma question : pourquoi les autres réseaux suivent cette annonce."
c1.ada.why: "Oui. Les routeurs choisissent toujours le bloc le plus précis, et par défaut ils croient celui qui l'annonce. Les questions destinées à notre serveur de noms arrivent donc chez un autre, qui répond ce qu'il veut. Reste à voir où il envoie nos clients. L'équipe a enregistré le certificat du site qu'ils ont vu, à côté du vrai : `preuves/`."
c1.ada.g.cert: "Compare les deux : `openssl x509 -noout -subject -issuer -in preuves/site-vu.pem`, puis la même commande sur `preuves/site-vrai.pem`. Ensuite réponds à ma question."
c1.ada.g.cert.standard: "Compare avec `openssl x509` le certificat vu par les clients et le vrai, puis réponds à ma question."
c1.ada.cert: "Émis par lui-même, ce matin. Ce jour-là, le faux site n'avait pas de certificat d'une autorité : il s'en est fabriqué un. C'est pour ça que le navigateur a crié. L'avertissement était la dernière barrière, et le ticket 8849 l'a franchie. Maintenant, la question qui compte."
c1.ada.g.notice: "Aucune réponse n'est fausse : chacune coûte autre chose à Nacre et à ses clients."
c1.ada.notice.warn: "Bandeau sur la page de statut, message sur tous les canaux : « si votre navigateur vous avertit, n'allez pas plus loin ». On parle avant de tout savoir, et on le dit. Pendant ce temps Nacre appelle son opérateur de noms, qui appelle les réseaux voisins pour faire filtrer l'annonce."
c1.ada.notice.pause: "Plus personne ne se connecte, ni sur le vrai site ni sur le faux puisque les clients n'essaient plus. C'est sûr et c'est lourd : des milliers de clients qui n'avaient aucun problème sont bloqués. Pendant ce temps Nacre appelle son opérateur de noms, qui appelle les réseaux voisins."
c1.ada.notice.wait: "On ne dira rien de faux, c'est vrai. Mais pendant cette heure-là, chaque client qui voit l'avertissement décide seul, et certains cliqueront. L'opérateur de noms confirme à 14 h 20 : l'annonce ne vient pas de lui."
c1.ada.done: "L'annonce disparaît à 14 h 55. Le site de Nacre n'a jamais été touché, son serveur de noms non plus : tout s'est joué sur la route. Demain, on regarde ce qui aurait rendu ça impossible, ou au moins visible."
c1.hint.fake.1: "`cut -d, -f4 dns/reponses.csv | sort | uniq -c` compte les réponses. Une seule adresse n'est pas à Nacre."
c1.hint.fake.2: "`answer fake 203.0.113.44`"
c1.hint.origin.1: "Une seule ligne date d'aujourd'hui, et sa note dit `new origin`. Le numéro est dans la colonne `origin_as`, sans les lettres AS."
c1.hint.origin.2: "`answer origin 64510`"
c1.hint.why.1: "Un /24 est plus précis qu'un /23. Tape `answer specific`."
c1.hint.cert.1: "Dans `site-vu.pem`, `subject` et `issuer` sont identiques. Tape `answer self`."
c1.debrief.title: "L'avertissement"
c1.debrief.lesson: "Personne n'a touché au site de Nacre ni à son serveur de noms. Un réseau a annoncé une route plus précise vers les adresses de ce serveur, d'autres réseaux l'ont crue, et les questions de certains clients sont arrivées chez un serveur qui ne répondait que pour un seul nom. La seule chose qui a résisté, c'est le certificat : le faux site n'a pas pu en obtenir un vrai."
c1.debrief.p1: "Regarder son service depuis plusieurs réseaux : un détournement de route ne se voit pas depuis chez soi."
c1.debrief.p2: "Surveiller les annonces de routes de ses adresses et de celles de ses prestataires, avec une alerte sur toute nouvelle origine."
c1.debrief.p3: "Un avertissement de certificat est un signal, pas un obstacle. Le dire aux clients avant l'incident, et pendant."
