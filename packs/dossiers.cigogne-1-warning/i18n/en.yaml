c1.briefing: "Tuesday 12 June, 1.40 pm. Nacre keeps the wallets of a few tens of thousands of customers. For twenty minutes, support has been getting strange messages: a certificate warning for some, nothing for others. Nothing was deployed today, and from the office the site looks normal. The team has put in your folder the support messages, the name server answers recorded by probes, and the route announcements seen by a collector."
c1.obj.fake: "Find the address some customers get instead of the site"
c1.obj.origin: "Find which network announces a route that is not its own"
c1.obj.why: "Say why other networks followed it"
c1.obj.cert: "Read the certificate customers saw"
c1.obj.notice: "Decide what to tell customers"
c1.q.fake: "Which address do some probes get instead of the site's?"
c1.q.origin: "Which network number (AS) announces the most specific route? The number only."
c1.q.why: "Nothing changed at Nacre. Why does part of the Internet follow this announcement?"
c1.q.why.specific: "The most specific route wins, with no check on who announces it"
c1.q.why.hacked: "Nacre's name server was broken into and its records changed"
c1.q.why.hacked.why: "The name server has not changed: from the office and several probes, it still answers correctly. The other probes no longer talk to it at all: their questions go elsewhere. Read `routes/annonces.csv` again."
c1.q.why.registrar: "Nacre's account at its domain registrar was leaked and used"
c1.q.why.registrar.why: "In that case every probe would get the same wrong answer. Here, everything depends on the path the question takes: look at the `seen_by_collectors` column."
c1.q.cert: "What does the certificate served by the site these customers saw say?"
c1.q.cert.self: "It is signed by itself: no authority ever checked it"
c1.q.cert.expired: "It expired a week ago and was never renewed"
c1.q.cert.expired.why: "Its dates are fine: it was made this morning. Compare the `subject` and `issuer` lines of the two certificates."
c1.q.cert.other: "It is from a known authority, but for another name"
c1.q.cert.other.why: "It does carry the site's name. Look at who issued it instead: compare `issuer` in the two files."
c1.q.notice: "The route is still wrong, and fixing it is not in Nacre's hands. What do you do now?"
c1.q.notice.warn: "Warn everywhere right now: never click past the warning"
c1.q.notice.pause: "Close wallet sign-ins until things are back to normal"
c1.q.notice.wait: "Wait for the operators to confirm before saying anything"
c1.ada.brief: "A site that works for some and not for others, with nothing changed: start by asking whether everybody ends up in the same place. Read the support messages, then the probes: `dns/reponses.csv`."
c1.ada.g.fake: "Read `cat dns/reponses.csv`. The `answer` column gives the address received: the real one is 10.110.4.20. Answer with `answer fake <address>`."
c1.ada.g.fake.standard: "Compare the probes' answers in `dns/reponses.csv` and give the intruding address with `answer fake`."
c1.ada.fake: "Same question, same name server address, two answers. And look at the `statut.nacre.test` lines: the lying server answers for no other name. It exists for one site only. So our name server has not changed, the path leading to it has."
c1.ada.fake.routes: "The paths are in `routes/annonces.csv`."
c1.ada.g.origin: "Read `cat routes/annonces.csv`. Look for the announcement that appeared today for the name server's addresses, then `answer origin <number>`."
c1.ada.g.origin.standard: "Find in `routes/annonces.csv` the announcement that did not exist yesterday, and answer with `answer origin`."
c1.ada.origin: "Since 1.10 pm, network 64510 has been announcing 10.110.0.0/24, exactly half of the block Nacre's name operator has announced for three years. Twenty-six collectors out of forty-one see it. Mistake or malice, at this point we do not know, and we will not write it."
c1.ada.g.why: "Answer my question: why other networks follow this announcement."
c1.ada.why: "Yes. Routers always pick the most specific block, and by default they believe whoever announces it. So questions meant for our name server arrive at another one, which answers what it likes. Now let's see where it sends our customers. The team saved the certificate of the site they saw, next to the real one: `preuves/`."
c1.ada.g.cert: "Compare the two: `openssl x509 -noout -subject -issuer -in preuves/site-vu.pem`, then the same command on `preuves/site-vrai.pem`. Then answer my question."
c1.ada.g.cert.standard: "Compare with `openssl x509` the certificate customers saw and the real one, then answer my question."
c1.ada.cert: "Issued by itself, this morning. That day, the fake site had no certificate from an authority: it made one itself. That is why the browser shouted. The warning was the last barrier, and ticket 8849 walked through it. Now, the question that matters."
c1.ada.g.notice: "No answer is wrong: each one costs Nacre and its customers something different."
c1.ada.notice.warn: "A banner on the status page, a message on every channel: \"if your browser warns you, go no further\". We speak before we know everything, and we say so. Meanwhile Nacre calls its name operator, who calls neighbouring networks to have the announcement filtered."
c1.ada.notice.pause: "Nobody signs in any more, neither on the real site nor on the fake one since customers stop trying. It is safe and it is heavy: thousands of customers who had no problem are locked out. Meanwhile Nacre calls its name operator, who calls neighbouring networks."
c1.ada.notice.wait: "We will say nothing false, true. But during that hour, every customer who sees the warning decides alone, and some will click. The name operator confirms at 2.20 pm: the announcement is not theirs."
c1.ada.done: "The announcement disappears at 2.55 pm. Nacre's site was never touched, nor its name server: it all happened on the road. Tomorrow, we look at what would have made this impossible, or at least visible."
c1.hint.fake.1: "`cut -d, -f4 dns/reponses.csv | sort | uniq -c` counts the answers. Only one address is not Nacre's."
c1.hint.fake.2: "`answer fake 203.0.113.44`"
c1.hint.origin.1: "Only one line is dated today, and its note says `new origin`. The number is in the `origin_as` column, without the letters AS."
c1.hint.origin.2: "`answer origin 64510`"
c1.hint.why.1: "A /24 is more specific than a /23. Type `answer specific`."
c1.hint.cert.1: "In `site-vu.pem`, `subject` and `issuer` are identical. Type `answer self`."
c1.debrief.title: "The warning"
c1.debrief.lesson: "Nobody touched Nacre's site or its name server. A network announced a more specific route to that server's addresses, other networks believed it, and some customers' questions reached a server that answered for one name only. The one thing that held was the certificate: the fake site could not get a real one."
c1.debrief.p1: "Watch your service from several networks: a route hijack cannot be seen from home."
c1.debrief.p2: "Monitor route announcements for your addresses and your providers', with an alert on any new origin."
c1.debrief.p3: "A certificate warning is a signal, not an obstacle. Tell customers so before the incident, and during it."
