# Bergamote Logiciel - patch policy.
patching:
  sbom: manual              # manual | every-build
  advisories_check: monthly # monthly | weekly | daily
  deadlines:                # in hours (72h) or days (7d)
    internet_critical: 30d
    internet_high: 30d
    internal: 90d
deploy:
  verify_hash: off          # off | on
  post_deploy_check: none   # none | version
  notify: team-channel
