v3.briefing: "Deux problèmes cette semaine : trois bulletins découverts tard, et un correctif « déployé » qui n'est jamais arrivé. La politique de Bergamote tient en un fichier : `politique/correctifs.yml`."
v3.obj.know: "Savoir tôt, et corriger selon l'exposition"
v3.obj.deploy: "Ne déclarer un déploiement fini qu'une fois vérifié"
v3.obj.friday: "Trancher la question du vendredi soir"
v3.q.friday: "Que fait Bergamote des déploiements du vendredi soir ?"
v3.q.friday.checked: "Les garder pour l'urgent, avec vérification et une personne d'astreinte"
v3.q.friday.never: "Les interdire, même pour un correctif urgent"
v3.q.friday.asbefore: "Ne rien changer : la politique suffira"
v3.check.know: "Nomenclature à chaque construction, bulletins chaque jour, 72 h et 7 jours pour ce qui est exposé"
v3.check.deploy: "Empreinte vérifiée avant, version contrôlée après chaque déploiement"
v3.check.works: "Le délai interne et l'annonce à l'équipe restent en place"
v3.ada.brief: "Lis la politique : `cat politique/correctifs.yml`. Deux couches, puis une décision."
v3.ada.g.know: "D'abord, savoir tôt : `sbom: every-build`, `advisories_check: daily`. Puis des délais selon l'exposition : `internet_critical: 72h`, `internet_high: 7d`. Avec `sed -i` ou `edit politique/correctifs.yml`, puis `verify`."
v3.ada.g.know.standard: "D'abord, fais que les bulletins soient vus le jour même, et que ce qui est exposé à internet soit corrigé en jours, pas en mois. Puis `verify`. Pour ouvrir le fichier : `edit politique/correctifs.yml`."
v3.ada.know: "Les trois bulletins auraient été vus le jour même, et le portail corrigé dans la semaine."
v3.ada.g.deploy: "Ensuite, le déploiement : `verify_hash: on` et `post_deploy_check: version`, puis `verify`."
v3.ada.g.deploy.standard: "Ensuite, fais qu'aucune archive inconnue ne parte en production, et qu'un déploiement ne soit fini qu'une fois la version contrôlée. Puis `verify`."
v3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
v3.ada.ready: "La politique tient. Reste la question qui fâche : le vendredi soir. Je te laisse décider."
v3.ada.answer: "Choisis dans la messagerie, ou avec `answer` dans le terminal."
v3.ada.answer.standard: "Ma question t'attend dans la messagerie."
v3.ada.checked: "Le bon équilibre : un correctif urgent n'attend pas lundi, mais il part avec son empreinte vérifiée, sa version contrôlée et quelqu'un pour réagir."
v3.ada.never: "Plus de mauvaise surprise le week-end, mais une faille exposée attendra lundi. Avec un délai de 72 h, c'est parfois trop long."
v3.ada.asbefore: "La politique aide, mais un déploiement le vendredi à 22 h sans personne pour regarder la suite reste le moment où tout passe inaperçu."
v3.ada.done: "Une nomenclature à chaque construction, des bulletins lus chaque jour, des délais selon l'exposition, des empreintes vérifiées, et une version contrôlée. Le prochain correctif du vendredi arrivera vraiment."
v3.hint.know.1: "Quatre lignes à changer, avec `sed -i \"s/ancien/nouveau/\" politique/correctifs.yml`. Ou à la main, dans l'éditeur : `edit politique/correctifs.yml`, puis Ctrl+S."
v3.hint.know.2: "`sbom: every-build`, `advisories_check: daily`, `internet_critical: 72h`, `internet_high: 7d`"
v3.hint.deploy.1: "`verify_hash: on` et `post_deploy_check: version`, puis `verify`."
v3.hint.friday.1: "Aucune réponse n'est fausse. Pense au correctif urgent qui tombe un vendredi."
v3.debrief.title: "La politique de correctifs"
v3.debrief.lesson: "Corriger vite ne suffit pas : il faut savoir tôt, corriger dans l'ordre de l'exposition, et vérifier que le correctif tourne vraiment. Chacune de ces étapes s'écrit dans une politique, et se contrôle."
v3.debrief.p1: "Produire une nomenclature à chaque construction, et la comparer aux bulletins chaque jour."
v3.debrief.p2: "Fixer des délais selon l'exposition et la gravité, et les suivre."
v3.debrief.p3: "Vérifier l'empreinte avant et la version après chaque déploiement."
