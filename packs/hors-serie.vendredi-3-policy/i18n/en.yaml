v3.briefing: "Two problems this week: three bulletins found late, and a \"deployed\" patch that never arrived. Bergamote's policy fits in one file: `politique/correctifs.yml`."
v3.obj.know: "Know early, and patch by exposure"
v3.obj.deploy: "Declare a deployment finished only once checked"
v3.obj.friday: "Settle the Friday evening question"
v3.q.friday: "What does Bergamote do with Friday evening deployments?"
v3.q.friday.checked: "Keep them for urgent fixes, checked and with someone on call"
v3.q.friday.never: "Ban them, even for an urgent patch"
v3.q.friday.asbefore: "Change nothing: the policy will be enough"
v3.check.know: "Bill of materials at every build, bulletins daily, 72 h and 7 days for what is exposed"
v3.check.deploy: "Hash verified before, version checked after every deployment"
v3.check.works: "The internal deadline and the team notice stay in place"
v3.ada.brief: "Read the policy: `cat politique/correctifs.yml`. Two layers, then a decision."
v3.ada.g.know: "First, know early: `sbom: every-build`, `advisories_check: daily`. Then deadlines by exposure: `internet_critical: 72h`, `internet_high: 7d`. With `sed -i` or `edit politique/correctifs.yml`, then `verify`."
v3.ada.g.know.standard: "First, make bulletins seen the same day, and what faces the internet patched in days, not months. Then `verify`. To open the file: `edit politique/correctifs.yml`."
v3.ada.know: "The three bulletins would have been seen the same day, and the portal patched within the week."
v3.ada.g.deploy: "Next, deployment: `verify_hash: on` and `post_deploy_check: version`, then `verify`."
v3.ada.g.deploy.standard: "Next, make sure no unknown archive reaches production, and that a deployment is finished only once the version is checked. Then `verify`."
v3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
v3.ada.ready: "The policy holds. The touchy question remains: Friday evening. I leave the decision to you."
v3.ada.answer: "Choose in the messenger, or with `answer` in the terminal."
v3.ada.answer.standard: "My question is waiting in the messenger."
v3.ada.checked: "The right balance: an urgent patch does not wait until Monday, but it leaves with its hash verified, its version checked and someone ready to react."
v3.ada.never: "No more bad weekend surprises, but an exposed flaw will wait until Monday. With a 72-hour deadline, that is sometimes too long."
v3.ada.asbefore: "The policy helps, but a deployment at 10 pm on a Friday with nobody watching what follows remains the moment everything goes unnoticed."
v3.ada.done: "A bill of materials at every build, bulletins read daily, deadlines by exposure, verified hashes and a checked version. The next Friday patch will really arrive."
v3.hint.know.1: "Four lines to change, with `sed -i \"s/old/new/\" politique/correctifs.yml`. Or by hand, in the editor: `edit politique/correctifs.yml`, then Ctrl+S."
v3.hint.know.2: "`sbom: every-build`, `advisories_check: daily`, `internet_critical: 72h`, `internet_high: 7d`"
v3.hint.deploy.1: "`verify_hash: on` and `post_deploy_check: version`, then `verify`."
v3.hint.friday.1: "No answer is wrong. Think of the urgent patch that lands on a Friday."
v3.debrief.title: "The patch policy"
v3.debrief.lesson: "Patching fast is not enough: you need to know early, patch in order of exposure, and check that the patch really runs. Each of these steps is written in a policy, and checked."
v3.debrief.p1: "Produce a bill of materials at every build, and compare it with bulletins every day."
v3.debrief.p2: "Set deadlines by exposure and severity, and track them."
v3.debrief.p3: "Check the hash before and the version after every deployment."
