v1.briefing: "Trois bulletins de sécurité, trois produits, six personnes. Les fichiers de dépendances sont dans `produits/`, et qui utilise quoi dans `produits/inventaire.txt`."
v1.obj.portal: "Trouver le composant vulnérable du portail client"
v1.obj.first: "Décider par quoi commencer"
v1.q.portal: "Quel composant du portail client est touché par un bulletin ?"
v1.q.first: "Une équipe de six, trois correctifs. Par lequel commencer ?"
v1.q.first.exposed: "Le portail : gravité haute, mais ouvert à tous"
v1.q.first.critical: "L'outil interne : sa faille est « critique »"
v1.q.first.critical.why: "Critique, mais derrière le VPN, pour douze personnes connectées. Le portail, lui, est à portée de n'importe qui."
v1.q.first.all: "Les trois en même temps, dans le même déploiement"
v1.q.first.all.why: "Avec six personnes, tout faire d'un coup retarde le plus urgent et multiplie les risques de casse. On commence par ce qui est exposé."
v1.ada.brief: "Fais l'inventaire des trois produits d'un coup, en le comparant aux bulletins : `sbom produits --vuln`."
v1.ada.g.portal: "Trois produits, trois composants touchés. Lequel appartient au portail ? `answer portal <composant>`."
v1.ada.g.portal.standard: "Trouve le composant vulnérable du portail. `answer portal`."
v1.ada.portal: "jeton-web, sur le portail. Maintenant, regarde qui peut atteindre chaque produit : `cat produits/inventaire.txt`."
v1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
v1.ada.answer.standard: "Ma question t'attend dans la messagerie."
v1.ada.done: "La gravité d'un bulletin parle de la faille, pas de chez toi. Ce qui est exposé à internet passe d'abord. L'équipe a d'ailleurs corrigé le portail vendredi soir. Enfin, c'est ce qu'elle croit."
v1.hint.portal.1: "La ligne dont le fichier vient de `produits/portail`."
v1.hint.portal.2: "`answer portal jeton-web`"
v1.hint.first.1: "Compare la colonne « REACHABLE FROM » de l'inventaire."
v1.debrief.title: "Trois alertes"
v1.debrief.lesson: "Une nomenclature logicielle dit en une commande quels produits sont touchés. Mais l'ordre des correctifs ne se lit pas dans la gravité seule : une faille haute sur un service ouvert à internet passe avant une faille critique derrière un VPN."
v1.debrief.p1: "Tenir à jour la nomenclature de chaque produit et la comparer aux bulletins automatiquement."
v1.debrief.p2: "Prioriser selon l'exposition et les données en jeu, pas selon la seule note de gravité."
v1.debrief.p3: "Corriger aussi le reste, dans des délais écrits à l'avance."
