v1.briefing: "Three security bulletins, three products, six people. The dependency files are in `produits/`, and who uses what in `produits/inventaire.txt`."
v1.obj.portal: "Find the customer portal's vulnerable component"
v1.obj.first: "Decide where to start"
v1.q.portal: "Which component of the customer portal is hit by a bulletin?"
v1.q.first: "A team of six, three patches. Which one first?"
v1.q.first.exposed: "The portal: high, but open to anyone"
v1.q.first.critical: "The internal tool, whose flaw is rated \"critical\""
v1.q.first.critical.why: "Critical, but behind the VPN, for twelve signed-in people. The portal is within anyone's reach."
v1.q.first.all: "All three at once, in one single deployment"
v1.q.first.all.why: "With six people, doing everything at once delays the most urgent and multiplies the risk of breakage. Start with what is exposed."
v1.ada.brief: "Inventory the three products at once, comparing them with the bulletins: `sbom produits --vuln`."
v1.ada.g.portal: "Three products, three components hit. Which one belongs to the portal? `answer portal <component>`."
v1.ada.g.portal.standard: "Find the portal's vulnerable component. `answer portal`."
v1.ada.portal: "jeton-web, on the portal. Now look at who can reach each product: `cat produits/inventaire.txt`."
v1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
v1.ada.answer.standard: "My question is waiting in the messenger."
v1.ada.done: "A bulletin's severity speaks of the flaw, not of your setup. What faces the internet goes first. In fact, the team patched the portal on Friday evening. Or so it believes."
v1.hint.portal.1: "The line whose file comes from `produits/portail`."
v1.hint.portal.2: "`answer portal jeton-web`"
v1.hint.first.1: "Compare the inventory's \"REACHABLE FROM\" column."
v1.debrief.title: "Three alerts"
v1.debrief.lesson: "A software bill of materials tells in one command which products are hit. But the order of patches is not read from severity alone: a high flaw on a service open to the internet goes before a critical flaw behind a VPN."
v1.debrief.p1: "Keep each product's bill of materials up to date and compare it with bulletins automatically."
v1.debrief.p2: "Prioritise by exposure and the data at stake, not by the severity score alone."
v1.debrief.p3: "Patch the rest too, within deadlines written in advance."
