g2.briefing: "Wednesday 15 December, 9:30. The Vigie server has been isolated since yesterday. The vendor's advisory says most customers only got \"stay quiet\" answers, and a few were picked for the next stage. Altaïr exported its resolver's answers: `traces/reponses-dns.txt`."
g2.obj.cname: "Find which server an answer sent Vigie to"
g2.obj.account: "Find the account the intruder used on the directory"
g2.obj.reach: "Say why this account made the backdoor so dangerous"
g2.obj.rotate: "Change the account's password"
g2.obj.story: "Put the story in order"
g2.q.cname: "Which name did the CNAME answer send Vigie to? (without the final dot)"
g2.q.account: "Which account signed in to the directory on Sunday at 03:41?"
g2.q.reach: "Why did Vigie's account make the backdoor so dangerous?"
g2.q.reach.everywhere: "To monitor everything, it could get in everywhere"
g2.q.reach.human: "It belonged to a human administrator"
g2.q.reach.human.why: "It is a service account, used by the software itself. That is exactly why nobody looked when it signed in."
g2.q.reach.exposed: "Its password was published on the Internet"
g2.q.reach.exposed.why: "Nothing says its password leaked. The intruder did not need it: it was already inside the software that uses it."
g2.contain.rotate: "Change the password of Vigie's service account and limit it to the monitored machines only"
g2.tl.text: "The story of the trapped update"
g2.tl.chain: "The intruder gets into the vendor's build system"
g2.tl.signed: "A trapped update is signed and published"
g2.tl.installed: "Altaïr installs the update"
g2.tl.beacons: "After two silent weeks, the DNS beacons start"
g2.tl.cname: "A CNAME answer sends Vigie to a second server"
g2.tl.login: "Vigie's account signs in to the directory in the middle of the night"
g2.tl.advisory: "The vendor publishes its advisory"
g2.ada.brief: "Read the answers: `cat traces/reponses-dns.txt`. Nearly all of them say the same thing. Look for the one that says something else."
g2.ada.g.cname: "`grep CNAME traces/reponses-dns.txt`, then `answer cname <name>`, without the final dot."
g2.ada.g.cname.standard: "Find the answer that is not \"stay quiet\" and the name it points to."
g2.ada.cname: "Saturday the 11th at 02:00: relais.ombre-cdn.example. Altaïr was picked. And the next day at 03:39, Vigie asks for that name again. What happened right after?"
g2.ada.g.account: "Go and see who signed in to the directory: `ssh ir@annuaire.altair.test`, then `last`. Come back with `exit`, then `answer account <account>`."
g2.ada.g.account.standard: "Sign in to the directory with the incident response account, `ir`, and look at past sign-ins: find the one that does not look like the others."
g2.ada.account: "svcvigie, from the Vigie server, at 03:41 on a Sunday, for 47 minutes. On other days it comes by at 14:00 and leaves within the second."
g2.ada.g.reach: "Think about what this account usually does, and where."
g2.ada.reach: "That is the real price of a trapped monitoring tool: it arrives with the keys to the whole house."
g2.ada.g.rotate: "`contain rotate compte-supervision`."
g2.ada.g.rotate.standard: "Make what the intruder knows about this account useless."
g2.ada.rotate: "New password, and the account can now only get in where Vigie really needs it. All that is left is the story."
g2.ada.g.story: "`timeline histoire` shows the events shuffled. Answer with their ids in order: `timeline histoire <id> <id> …`."
g2.ada.g.story.standard: "Put the story in order, from the vendor to its advisory."
g2.ada.done: "Altaïr knows how far the intruder went. The next card tells the real case this file is inspired by."
g2.hint.cname.1: "Only one line has the CNAME type."
g2.hint.cname.2: "`answer cname relais.ombre-cdn.example`"
g2.hint.account.1: "`last` is read on the directory, not on your workstation. Look for a sign-in in the night from Saturday to Sunday."
g2.hint.account.2: "`answer account svcvigie`"
g2.hint.rotate.1: "`contain rotate compte-supervision`"
g2.hint.story.1: "It all starts at the vendor, and its advisory comes last."
g2.hint.story.2: "`timeline histoire chain signed installed beacons cname login advisory`"
g2.debrief.title: "The second stage"
g2.debrief.lesson: "The backdoor was at thousands of customers, but the intruder picked only a few. There, it used the software's own account, which was allowed in everywhere. Nobody watches a service account's sign-ins: it was the time, not the account, that gave it away."
g2.debrief.p1: "Give a service account as few rights as possible, and only on the machines it needs."
g2.debrief.p2: "Know a service account's normal rhythm, and alert when it steps out of it."
g2.debrief.p3: "Keep DNS answers, not just the questions: it was an answer that opened the next stage."
g2.facts.title: "What really happened: SolarWinds, December 2020"
g2.facts.p1: "On 13 December 2020, FireEye and then SolarWinds reveal that updates to Orion, SolarWinds' monitoring platform, published between March and June 2020, contain a backdoor FireEye calls SUNBURST."
g2.facts.p2: "The code was added inside SolarWinds' build system. The trapped library therefore carried the vendor's legitimate signature."
g2.facts.p3: "About 18,000 customers install a trapped version. The backdoor stays silent for up to two weeks, then sends DNS queries to a domain disguised as a cloud service."
g2.facts.p4: "For a much smaller number of chosen victims, a CNAME answer opens a second stage. They include several US federal agencies, and FireEye itself, which uncovers the affair while investigating its own intrusion."
g2.facts.p5: "CISA orders federal agencies to disconnect Orion (Emergency Directive 21-01). In April 2021, the US government attributes the campaign to Russia's foreign intelligence service (SVR)."
