g2.briefing: "Mercredi 15 décembre, 9 h 30. Le serveur Vigie est isolé depuis hier. L'avis de l'éditeur dit que la plupart des clients n'ont reçu que des réponses « reste tranquille », et que quelques-uns ont été choisis pour la suite. Altaïr a exporté les réponses de son résolveur : `traces/reponses-dns.txt`."
g2.obj.cname: "Trouver vers quel serveur une réponse a envoyé Vigie"
g2.obj.account: "Trouver le compte que l'intrus a utilisé sur l'annuaire"
g2.obj.reach: "Dire pourquoi ce compte rendait la porte dérobée si dangereuse"
g2.obj.rotate: "Changer le mot de passe du compte"
g2.obj.story: "Remettre l'histoire dans l'ordre"
g2.q.cname: "Vers quel nom la réponse CNAME a-t-elle envoyé Vigie ? (sans le point final)"
g2.q.account: "Quel compte s'est connecté à l'annuaire le dimanche à 3 h 41 ?"
g2.q.reach: "Pourquoi le compte de Vigie rendait-il la porte dérobée si dangereuse ?"
g2.q.reach.everywhere: "Pour tout surveiller, il pouvait entrer partout"
g2.q.reach.human: "Il appartenait à un administrateur humain"
g2.q.reach.human.why: "C'est un compte de service, utilisé par le logiciel lui-même. C'est justement pour ça que personne ne regardait quand il se connectait."
g2.q.reach.exposed: "Son mot de passe avait été publié sur Internet par erreur"
g2.q.reach.exposed.why: "Rien ne dit que son mot de passe ait fuité. L'intrus n'en avait pas besoin : il était déjà dans le logiciel qui s'en sert."
g2.contain.rotate: "Changer le mot de passe du compte de service de Vigie et le limiter aux seules machines surveillées"
g2.tl.text: "L'histoire de la mise à jour piégée"
g2.tl.chain: "L'intrus entre dans le système de fabrication de l'éditeur"
g2.tl.signed: "Une mise à jour piégée est signée et publiée"
g2.tl.installed: "Altaïr installe la mise à jour"
g2.tl.beacons: "Après deux semaines de silence, les balises DNS commencent"
g2.tl.cname: "Une réponse CNAME envoie Vigie vers un second serveur"
g2.tl.login: "Le compte de Vigie se connecte à l'annuaire en pleine nuit"
g2.tl.advisory: "L'éditeur publie son avis"
g2.ada.brief: "Lis les réponses : `cat traces/reponses-dns.txt`. Presque toutes disent la même chose. Cherche celle qui dit autre chose."
g2.ada.g.cname: "`grep CNAME traces/reponses-dns.txt`, puis `answer cname <nom>`, sans le point final."
g2.ada.g.cname.standard: "Trouve la réponse qui n'est pas « reste tranquille » et le nom vers lequel elle pointe."
g2.ada.cname: "Samedi 11 à 2 h : relais.ombre-cdn.example. Altaïr a été choisie. Et le lendemain à 3 h 39, Vigie redemande ce nom. Que s'est-il passé juste après ?"
g2.ada.g.account: "Va voir qui s'est connecté à l'annuaire : `ssh ir@annuaire.altair.test`, puis `last`. Reviens avec `exit`, puis `answer account <compte>`."
g2.ada.g.account.standard: "Connecte-toi à l'annuaire avec le compte de réponse à incident, `ir`, et regarde les connexions passées : cherche celle qui ne ressemble pas aux autres."
g2.ada.account: "svcvigie, depuis le serveur Vigie, à 3 h 41 un dimanche, pendant 47 minutes. Les autres jours, il passe à 14 h et repart dans la seconde."
g2.ada.g.reach: "Pense à ce que ce compte fait d'habitude, et où."
g2.ada.reach: "C'est le vrai prix d'un outil de supervision piégé : il arrive avec les clés de toute la maison."
g2.ada.g.rotate: "`contain rotate compte-supervision`."
g2.ada.g.rotate.standard: "Rends inutilisable ce que l'intrus connaît de ce compte."
g2.ada.rotate: "Nouveau mot de passe, et le compte ne peut plus entrer que là où Vigie en a vraiment besoin. Reste à raconter."
g2.ada.g.story: "`timeline histoire` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline histoire <id> <id> …`."
g2.ada.g.story.standard: "Remets l'histoire dans l'ordre, de l'éditeur jusqu'à son avis."
g2.ada.done: "Altaïr sait jusqu'où l'intrus est allé. La fiche qui suit raconte l'affaire réelle dont ce dossier s'inspire."
g2.hint.cname.1: "Une seule ligne porte le type CNAME."
g2.hint.cname.2: "`answer cname relais.ombre-cdn.example`"
g2.hint.account.1: "`last` se lit sur l'annuaire, pas sur ton poste. Cherche une connexion la nuit du samedi au dimanche."
g2.hint.account.2: "`answer account svcvigie`"
g2.hint.rotate.1: "`contain rotate compte-supervision`"
g2.hint.story.1: "Tout commence chez l'éditeur, et son avis arrive en dernier."
g2.hint.story.2: "`timeline histoire chain signed installed beacons cname login advisory`"
g2.debrief.title: "Le second étage"
g2.debrief.lesson: "La porte dérobée était chez des milliers de clients, mais l'intrus n'en a choisi que quelques-uns. Chez eux, il s'est servi du compte du logiciel lui-même, qui avait le droit d'entrer partout. Personne ne regarde les connexions d'un compte de service : c'est l'heure, pas le compte, qui l'a trahi."
g2.debrief.p1: "Donner à un compte de service le moins de droits possible, et seulement sur les machines dont il a besoin."
g2.debrief.p2: "Connaître le rythme normal d'un compte de service, et alerter quand il en sort."
g2.debrief.p3: "Garder les réponses DNS, pas seulement les questions : c'est la réponse qui a ouvert la suite."
g2.facts.title: "Ce qui s'est vraiment passé : SolarWinds, décembre 2020"
g2.facts.p1: "Le 13 décembre 2020, FireEye puis SolarWinds révèlent que des mises à jour d'Orion, la plateforme de supervision de SolarWinds, publiées entre mars et juin 2020, contiennent une porte dérobée que FireEye appelle SUNBURST."
g2.facts.p2: "Le code a été ajouté dans le système de fabrication de SolarWinds. La bibliothèque piégée portait donc la signature légitime de l'éditeur."
g2.facts.p3: "Environ 18 000 clients installent une version piégée. La porte dérobée reste silencieuse jusqu'à deux semaines, puis envoie des requêtes DNS vers un domaine déguisé en service cloud."
g2.facts.p4: "Pour un nombre bien plus petit de victimes choisies, une réponse CNAME ouvre un second étage. Parmi elles, plusieurs agences fédérales américaines, et FireEye elle-même, qui découvre l'affaire en enquêtant sur sa propre intrusion."
g2.facts.p5: "La CISA ordonne aux agences fédérales de débrancher Orion (directive d'urgence 21-01). En avril 2021, le gouvernement américain attribue la campagne au service de renseignement extérieur russe (SVR)."
