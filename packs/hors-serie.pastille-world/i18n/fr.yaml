file.readme: "Poste Ligne Rouge, à la permanence du Relais. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "ACCORD RL-2029-041\nPermanence d'aide numérique de l'association Le Relais. Périmètre : *.relais.test, 10.113.0.0/24.\nObjet : Nadia demande de l'aide pour comprendre si quelqu'un suit ses déplacements et lit son téléphone.\nCadre convenu : on ne regarde que les appareils et les comptes de Nadia, avec son accord, à partir des relevés qu'elle exporte elle-même à la permanence. On ne touche à aucun appareil ni à aucun compte d'une autre personne, pour quelque raison que ce soit. On ne supprime rien sans qu'elle l'ait décidé. Chaque décision lui appartient.\nSigné : Nadia, et la coordinatrice de la permanence."
ada.outOfScope: "Stop. Ce n'est pas un appareil de Nadia, et ce n'est pas dans l'accord RL-2029-041. Aller voir chez quelqu'un d'autre est un délit (article 323-1 du Code pénal), même pour aider, et cela pourrait se retourner contre elle."
