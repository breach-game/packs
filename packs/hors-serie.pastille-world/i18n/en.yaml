file.readme: "Ligne Rouge workstation, at the Relais help desk. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "AGREEMENT RL-2029-041\nDigital help desk of the charity Le Relais. Scope: *.relais.test, 10.113.0.0/24.\nPurpose: Nadia asks for help to understand whether someone follows her movements and reads her phone.\nAgreed set-up: we only look at Nadia's devices and accounts, with her agreement, from the exports she makes herself at the desk. We touch no device and no account belonging to anyone else, for any reason. We delete nothing she has not decided to delete. Every decision is hers.\nSigned: Nadia, and the help desk coordinator."
ada.outOfScope: "Stop. That is not one of Nadia's devices, and it is not in agreement RL-2029-041. Looking into someone else's is an offence (article 323-1 of the French Penal Code), even to help, and it could be turned against her."
