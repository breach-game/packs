d1.briefing: "Transports Ardoise n'a jamais fait le ménage dans son annuaire. Le responsable informatique te demande une revue, côté défense, avant de tout réorganiser. Première question : que voit quelqu'un qui n'a aucun compte ? Ton compte de lecture est dans le mandat, garde-le pour après."
d1.obj.password: "Trouver le compte dont le mot de passe traîne dans l'annuaire"
d1.obj.former: "Trouver l'administrateur qui n'a plus rien à faire là"
d1.obj.closed: "Fermer l'accès anonyme, et le vérifier"
d1.obj.why: "Expliquer pourquoi c'était grave"
d1.q.password: "Quel compte a un mot de passe écrit dans sa description ? Donne son `uid`."
d1.q.former: "Quel membre du groupe des administrateurs de l'annuaire n'a plus de contrat ? Donne son `uid`."
d1.q.why: "Le responsable informatique demande : « C'est juste de la lecture, c'était si grave ? »"
d1.q.why.map: "Oui : la carte des comptes et des droits, livrée à tous"
d1.q.why.write: "Oui : sans compte, on peut changer les mots de passe des administrateurs"
d1.q.why.write.why: "La recherche anonyme ne fait que lire. Mais lire suffisait : un mot de passe en clair et la liste des administrateurs, c'est tout ce qu'il faut pour préparer la suite."
d1.q.why.internet: "Non, sauf si l'annuaire est sur Internet"
d1.q.why.internet.why: "Un poste piégé, un visiteur sur le wifi, un prestataire : l'intérieur du réseau n'est pas un lieu sûr. Tout ce qui y répond sans compte répond aussi à eux."
d1.contain.anon: "Recherche anonyme désactivée sur l'annuaire (olcDisallows: bind_anon). L'appli des horaires devra avoir son propre compte."
d1.ada.brief: "Fais la recherche qu'un inconnu ferait, sans compte (`-x`, sans `-D`) : `ldapsearch -x -H ldap://annuaire.ardoise.test -b dc=ardoise,dc=test \"(description=*)\" uid description`. Les descriptions racontent souvent trop de choses."
d1.ada.g.password: "Dans les descriptions, un compte de service porte son mot de passe « provisoire ». `answer password <uid>`. Et on ne s'en sert pas : le mandat l'interdit."
d1.ada.g.password.standard: "Sans compte, lis les descriptions des entrées. Une d'elles en dit beaucoup trop."
d1.ada.password: "Un compte de service, son mot de passe dans sa description, lisible par n'importe qui. Note-le, ne l'essaie pas."
d1.ada.g.former: "Liste les membres des administrateurs : `ldapsearch -x -H ldap://annuaire.ardoise.test -b dc=ardoise,dc=test \"(memberOf=cn=admins-annuaire*)\" uid description`. Un des trois n'a plus de contrat. `answer former <uid>`."
d1.ada.g.former.standard: "Regarde qui est dans le groupe des administrateurs de l'annuaire, et lis leurs descriptions."
d1.ada.former: "Un prestataire parti depuis juin 2026, toujours administrateur. Et le compte de la sauvegarde l'est aussi, avec son mot de passe affiché. Ça fait deux portes."
d1.ada.g.closed: "Ferme la recherche anonyme : `contain disable acces-anonyme`. Puis refais une recherche sans compte pour le vérifier, et une avec ton compte de lecture pour voir que le travail normal continue."
d1.ada.g.closed.standard: "Ferme l'accès anonyme à l'annuaire, puis vérifie-le sans compte."
d1.ada.closed: "Sans compte, l'annuaire répond maintenant « 50 Insufficient access ». La carte n'est plus distribuée."
d1.ada.g.why: "Qu'est-ce qu'un inconnu savait, avant ta correction ?"
d1.ada.done: "Accès anonyme fermé. Mais ce qui a été lu a pu être lu par d'autres avant toi. Je surveille les connexions à l'annuaire."
d1.hint.password.0: "Sans compte, filtre sur les entrées qui ont une description."
d1.hint.password.1: "`ldapsearch -x -H ldap://annuaire.ardoise.test -b dc=ardoise,dc=test \"(description=*)\" uid description`"
d1.hint.password.2: "`answer password svc-sauvegarde`"
d1.hint.former.1: "Filtre `(memberOf=cn=admins-annuaire*)`."
d1.hint.former.2: "`answer former ext-prestataire`"
d1.hint.closed.1: "`contain disable acces-anonyme`, puis une recherche sans `-D`."
d1.hint.why.1: "`answer map`"
d1.debrief.title: "L'annuaire bavard"
d1.debrief.lesson: "L'annuaire répondait à tous, sans compte. Il donnait la liste des comptes et des groupes, un mot de passe « provisoire » écrit dans une description depuis l'installation, et un prestataire parti depuis un an et demi, toujours administrateur. Rien n'était cassé : tout était simplement lisible."
d1.debrief.p1: "Fermer la recherche anonyme ; chaque appli qui lit l'annuaire a son propre compte, limité à ce qu'elle lit."
d1.debrief.p2: "Jamais de mot de passe dans un champ de l'annuaire, même « provisoire » : un coffre de secrets, et un changement après installation."
d1.debrief.p3: "Revoir les groupes à privilèges chaque trimestre, et fermer les comptes des prestataires le jour de la fin du contrat."
