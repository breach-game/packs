d1.briefing: "Ardoise Transport never cleaned up its directory. The IT manager asks you for a review, on the defence side, before reorganising everything. First question: what does someone with no account see? Your read account is in the mandate, keep it for later."
d1.obj.password: "Find the account whose password lies in the directory"
d1.obj.former: "Find the admin who has no business being there"
d1.obj.closed: "Close anonymous access, and check it"
d1.obj.why: "Explain why it was serious"
d1.q.password: "Which account has a password written in its description? Give its `uid`."
d1.q.former: "Which member of the directory admins group no longer has a contract? Give its `uid`."
d1.q.why: "The IT manager asks: \"It's only reading, was it that serious?\""
d1.q.why.map: "Yes: the map of accounts and rights, handed to all"
d1.q.why.write: "Yes: with no account, passwords can be changed"
d1.q.why.write.why: "Anonymous search only reads. But reading was enough: a password in clear and the list of admins are all it takes to prepare the next step."
d1.q.why.internet: "No, unless the directory is on the Internet"
d1.q.why.internet.why: "A trapped workstation, a visitor on the wifi, a contractor: inside the network is not a safe place. Whatever answers there without an account answers them too."
d1.contain.anon: "Anonymous search disabled on the directory (olcDisallows: bind_anon). The timetable app will need its own account."
d1.ada.brief: "Run the search a stranger would run, with no account (`-x`, no `-D`): `ldapsearch -x -H ldap://annuaire.ardoise.test -b dc=ardoise,dc=test \"(description=*)\" uid description`. Descriptions often say too much."
d1.ada.g.password: "In the descriptions, a service account carries its \"temporary\" password. `answer password <uid>`. And we do not use it: the mandate forbids it."
d1.ada.g.password.standard: "With no account, read the entries' descriptions. One of them says far too much."
d1.ada.password: "A service account, its password in its description, readable by anyone. Note it, do not try it."
d1.ada.g.former: "List the admins: `ldapsearch -x -H ldap://annuaire.ardoise.test -b dc=ardoise,dc=test \"(memberOf=cn=admins-annuaire*)\" uid description`. One of the three no longer has a contract. `answer former <uid>`."
d1.ada.g.former.standard: "See who is in the directory admins group, and read their descriptions."
d1.ada.former: "A contractor gone since June 2026, still an admin. And the backup account is one too, with its password on display. That makes two doors."
d1.ada.g.closed: "Close anonymous search: `contain disable acces-anonyme`. Then search again with no account to check it, and with your read account to see normal work goes on."
d1.ada.g.closed.standard: "Close anonymous access to the directory, then check it with no account."
d1.ada.closed: "With no account, the directory now answers \"50 Insufficient access\". The map is no longer handed out."
d1.ada.g.why: "What did a stranger know, before your fix?"
d1.ada.done: "Anonymous access closed. But what was readable may have been read by others before you. I am watching sign-ins to the directory."
d1.hint.password.1: "`ldapsearch -x -H ldap://annuaire.ardoise.test -b dc=ardoise,dc=test \"(description=*)\" uid description`"
d1.hint.password.2: "`answer password svc-sauvegarde`"
d1.hint.former.1: "Filter `(memberOf=cn=admins-annuaire*)`."
d1.hint.former.2: "`answer former ext-prestataire`"
d1.hint.closed.1: "`contain disable acces-anonyme`, then a search without `-D`."
d1.hint.why.1: "`answer map`"
d1.debrief.title: "The chatty directory"
d1.debrief.lesson: "The directory answered everyone, with no account. It gave out the list of accounts and groups, a \"temporary\" password written in a description since installation, and a contractor gone for a year and a half, still an admin. Nothing was broken: everything was simply readable."
d1.debrief.p1: "Close anonymous search; every app that reads the directory gets its own account, limited to what it reads."
d1.debrief.p2: "Never a password in a directory field, even \"temporary\": a secrets vault, and a change after installation."
d1.debrief.p3: "Review privileged groups every quarter, and close contractors' accounts on the day their contract ends."
