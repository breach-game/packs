o2.briefing: "Between the May intrusion and this morning, nobody saw anything leave. Yet Mouette had a device for that: it opens the encrypted traffic leaving the servers, to inspect it. Its status page is in `inspection/statut.txt`, its certificate in `inspection/inspect.pem`, and the flow logs are yours: `soc`."
o2.obj.since: "Say since when the device has inspected nothing"
o2.obj.rotate: "Give it a valid certificate again"
o2.obj.rule: "Write the rule that sees the portal's big uploads"
o2.q.since: "Since what date has the device let everything through without inspection? (YYYY-MM-DD)"
o2.contain.rotate: "Replace the inspection device's certificate with a new one"
o2.contain.isolate: "Cut the dispute portal off the network (no customer can dispute anything any more)"
o2.ada.brief: "Read the status page: `cat inspection/statut.txt`. \"BYPASS\": it lets traffic through without looking. Why?"
o2.ada.g.since: "The certificate is rejected. Read its dates: `openssl x509 -in inspection/inspect.pem -noout -dates`. Then `answer since <YYYY-MM-DD>`."
o2.ada.g.since.standard: "Find since when the device stopped doing its job, in its certificate. `answer since`."
o2.ada.since: "Expired on 12 January 2026. Eighteen and a half months during which the device let everything through, without one alert, because bypass does not raise any."
o2.ada.g.rotate: "Give it a valid certificate: `contain rotate inspection-cert`. It costs Mouette nothing."
o2.ada.g.rotate.standard: "Let the device see again. `contain` for the list of measures."
o2.ada.rotated: "New certificate, the device inspects again. And at once it shows what leaves the portal. Look: `soc logs inspection flow`."
o2.ada.isolated: "The portal is cut off: nothing leaves, but no customer can dispute a mistake in their file any more. That is a real cost."
o2.ada.g.rule: "The portal answers customers in small packets. Tens of megabytes to the outside is not its job. In `regles/gros-envois.yml`: `echo \"src: 10.80.0.21\" >> regles/gros-envois.yml`, then `echo \"bytes|gte: 1000000\" >> regles/gros-envois.yml`, then `rule test regles/gros-envois.yml`. Or by hand, in the editor: `edit regles/gros-envois.yml`, then Ctrl+S."
o2.ada.g.rule.standard: "Write a rule in `regles/gros-envois.yml` that sees the portal's big uploads to the outside, without the backups or the client area. Then `rule test`. To open the file: `edit regles/gros-envois.yml`."
o2.ada.again: "Look at the false alerts: where do they come from, and how big are they?"
o2.ada.again.standard: "Not yet. Read the false alerts."
o2.ada.done: "The uploads had been going on since May, past a blind appliance. What was missing was a device that could see, and a rule that rings. A control that fails without saying so is not a control."
o2.hint.since.1: "`openssl x509 -in inspection/inspect.pem -noout -dates`, the notAfter line."
o2.hint.since.2: "`answer since 2026-01-12`"
o2.hint.rotate.1: "`contain rotate inspection-cert`"
o2.hint.rule.1: "Two conditions: who sends, and how much."
o2.hint.rule.2: "The sender field is `src`, the size field `bytes`. `|gte` means \"at least\"."
o2.hint.rule.3: "`echo \"src: 10.80.0.21\" >> regles/gros-envois.yml`, `echo \"bytes|gte: 1000000\" >> regles/gros-envois.yml`, then `rule test regles/gros-envois.yml`. Or by hand, in the editor: `edit regles/gros-envois.yml`, then Ctrl+S."
o2.debrief.title: "A control that fails without saying so"
o2.debrief.lesson: "The inspection device was not bypassed by the intruder: its certificate had expired, and it let everything through without telling anyone. The flows were logged, but no rule read them. A new certificate was enough to see everything."
o2.debrief.p1: "Watch certificate expiry dates, and alert well before."
o2.debrief.p2: "A control in bypass mode must raise an alert, not a silence."
o2.debrief.p3: "A rule on the outbound volume of a server that has no reason to send much sees an exfiltration."
