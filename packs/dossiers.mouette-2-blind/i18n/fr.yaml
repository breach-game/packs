o2.briefing: "Entre l'intrusion de mai et ce matin, personne n'a rien vu sortir. Pourtant Mouette avait un appareil pour ça : il ouvre le trafic chiffré qui quitte les serveurs, pour l'inspecter. Sa page d'état est dans `inspection/statut.txt`, son certificat dans `inspection/inspect.pem`, et les journaux de flux sont à toi : `soc`."
o2.obj.since: "Dire depuis quand l'appareil n'inspecte plus rien"
o2.obj.rotate: "Lui rendre un certificat valide"
o2.obj.rule: "Écrire la règle qui voit les gros envois du portail"
o2.q.since: "Depuis quelle date l'appareil laisse-t-il tout passer sans inspection ? (AAAA-MM-JJ)"
o2.contain.rotate: "Remplacer le certificat de l'appareil d'inspection par un certificat neuf"
o2.contain.isolate: "Couper le portail de contestation du réseau (plus aucun client ne peut contester)"
o2.ada.brief: "Lis la page d'état : `cat inspection/statut.txt`. « BYPASS » : il laisse passer sans regarder. Pourquoi ?"
o2.ada.g.since: "Le certificat est refusé. Lis ses dates : `openssl x509 -in inspection/inspect.pem -noout -dates`. Puis `answer since <AAAA-MM-JJ>`."
o2.ada.g.since.standard: "Trouve depuis quand l'appareil ne fait plus son travail, dans son certificat. `answer since`."
o2.ada.since: "Expiré le 12 janvier 2026. Dix-huit mois et demi pendant lesquels l'appareil a tout laissé passer, sans une alerte, parce que le contournement n'en déclenche pas."
o2.ada.g.rotate: "Rends-lui un certificat valide : `contain rotate inspection-cert`. Ça ne coûte rien à Mouette."
o2.ada.g.rotate.standard: "Remets l'appareil en état de voir. `contain` pour la liste des mesures."
o2.ada.rotated: "Certificat neuf, l'appareil inspecte de nouveau. Et il montre aussitôt ce qui part du portail. Regarde : `soc logs inspection flow`."
o2.ada.isolated: "Le portail est coupé : plus rien ne sort, mais plus aucun client ne peut contester une erreur sur son dossier. C'est un vrai coût."
o2.ada.g.rule: "Le portail répond aux clients en petits paquets. Des dizaines de mégaoctets vers l'extérieur, ce n'est pas son travail. Dans `regles/gros-envois.yml` : `echo \"src: 10.80.0.21\" >> regles/gros-envois.yml`, puis `echo \"bytes|gte: 1000000\" >> regles/gros-envois.yml`, puis `rule test regles/gros-envois.yml`. Ou à la main, dans l'éditeur : `edit regles/gros-envois.yml`, puis Ctrl+S."
o2.ada.g.rule.standard: "Écris dans `regles/gros-envois.yml` une règle qui voit les gros envois du portail vers l'extérieur, sans les sauvegardes ni l'espace client. Puis `rule test`. Pour ouvrir le fichier : `edit regles/gros-envois.yml`."
o2.ada.again: "Regarde les fausses alertes : d'où viennent-elles, et quelle taille font-elles ?"
o2.ada.again.standard: "Pas encore. Lis les fausses alertes."
o2.ada.done: "Les envois duraient depuis mai, sous les yeux d'un appareil aveugle. Il manquait un appareil qui voie, et une règle qui sonne. Un contrôle qui tombe en panne sans le dire n'est pas un contrôle."
o2.hint.since.1: "`openssl x509 -in inspection/inspect.pem -noout -dates`, la ligne notAfter."
o2.hint.since.2: "`answer since 2026-01-12`"
o2.hint.rotate.1: "`contain rotate inspection-cert`"
o2.hint.rule.1: "Deux conditions : qui envoie, et combien."
o2.hint.rule.2: "Le champ de l'envoyeur est `src`, celui de la taille `bytes`. `|gte` veut dire « au moins »."
o2.hint.rule.3: "`echo \"src: 10.80.0.21\" >> regles/gros-envois.yml`, `echo \"bytes|gte: 1000000\" >> regles/gros-envois.yml`, puis `rule test regles/gros-envois.yml`. Ou à la main, dans l'éditeur : `edit regles/gros-envois.yml`, puis Ctrl+S."
o2.debrief.title: "Un contrôle qui tombe en panne sans le dire"
o2.debrief.lesson: "L'appareil d'inspection n'a pas été contourné par l'intrus : son certificat avait expiré, et il laissait tout passer sans prévenir personne. Les flux étaient journalisés, mais aucune règle ne les lisait. Il a suffi d'un certificat neuf pour tout voir."
o2.debrief.p1: "Surveiller les dates d'expiration des certificats, et alerter bien avant."
o2.debrief.p2: "Un contrôle en mode contournement doit déclencher une alerte, pas un silence."
o2.debrief.p3: "Une règle sur le volume sortant d'un serveur qui n'a pas à envoyer beaucoup voit une exfiltration."
