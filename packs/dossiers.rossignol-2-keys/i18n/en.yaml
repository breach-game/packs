r2.briefing: "Thursday, 8:30 am. Everything has been patched since last night. The detection probe's vendor published a signature for the flaw overnight, and it is already firing. One awkward question remains: what may have left before? The services' certificates are in `certs/`."
r2.obj.rule: "Write the rule that sees read attempts"
r2.obj.past: "Say what the rule proves about the past"
r2.obj.count: "Count the certificates to reissue"
r2.obj.rotate: "Replace the keys and close every session"
r2.obj.message: "Put in order what is done and what members are told"
r2.q.certs: "How many certificates must be reissued? (a number)"
r2.q.past: "The rule sees nothing before this morning. What do you conclude?"
r2.q.past.nothing: "Nothing about the past: the signature did not exist before"
r2.q.past.clean: "That nobody used the flaw before this morning"
r2.q.past.clean.why: "The signature was published overnight: before that, the probe could not recognise it. And the server logged nothing."
r2.q.past.logs: "That reading the web servers' logs again is enough"
r2.q.past.logs.why: "The read happens inside the encryption, before any web request: the servers' logs keep no trace of it."
r2.contain.certs: "Generate new keys, have new certificates issued and revoke the old ones for the affected services"
r2.contain.sessions: "Close every open session: each member will have to sign in again"
r2.tl.text: "From the patch to the message to members"
r2.tl.patch: "Patch the library on every service"
r2.tl.keys: "Generate new keys and new certificates"
r2.tl.revoke: "Revoke the old certificates"
r2.tl.sessions: "Close every open session"
r2.tl.passwords: "Ask members to change their password"
r2.ada.brief: "Look at what the probe sees: `soc logs webmail ids`. Then write the rule in `regles/battement.yml`, one condition per line, and try it with `rule test regles/battement.yml`."
r2.ada.g.rule: "The flaw's alerts all mention the heartbeat. Add `echo \"signature|contains: heartbeat\" >> regles/battement.yml`, then `rule test regles/battement.yml`. Or by hand, in the editor: `edit regles/battement.yml`, then Ctrl+S."
r2.ada.g.rule.standard: "Find what the flaw's alerts have in common in their text (the `signature` field), and write the rule on that field. To open the file: `edit regles/battement.yml`."
r2.ada.again: "Your rule misses attempts or alerts on ordinary noise. The word \"TLS\" is also in a routine alert: aim at the heartbeat."
r2.ada.rule: "It sees every attempt and no routine alert. But they all fail: we are patched. The real question is elsewhere."
r2.ada.g.past: "Think about since when the probe has been able to recognise this flaw."
r2.ada.past: "There it is. We can neither prove a leak nor rule it out. So we act as if: everything that went through the memory of the affected services must be redone. Look at the certificates."
r2.ada.g.count: "One certificate per service. Only count those of services that ran an affected version yesterday. Check whose each one is with `openssl x509 -noout -subject -in certs/<file>`, then `answer certs <number>`."
r2.ada.g.count.standard: "Count the certificates of the services that ran an affected version yesterday."
r2.ada.count: "Three: webmail, extranet, access box. The IMAP service and the intranet had no heartbeat, their keys were never exposed."
r2.ada.g.rotate: "Two measures: `contain rotate certificats`, then `contain reset sessions`. Reissuing a certificate with the old key is useless: the measure generates new keys."
r2.ada.g.rotate.standard: "Replace the keys of the affected services and close what may have been stolen with the memory."
r2.ada.rotate: "New keys, old certificates revoked, sessions closed. What is left is the message to members, and the order matters."
r2.ada.g.message: "Show the steps: `timeline message`, then order them: `timeline message <id> <id>…`. Changing a password on a service that is still open gives it away a second time."
r2.ada.g.message.standard: "Put the steps in order, from the patch to the message to members."
r2.ada.done: "Case closed. A flaw that leaves no trace forces you to treat everything as read, and to restore trust in the right order."
r2.hint.rule.1: "The field is called `signature`. The `|contains` modifier looks for a piece of text."
r2.hint.rule.2: "`echo \"signature|contains: heartbeat\" >> regles/battement.yml` Or by hand, in the editor: `edit regles/battement.yml`, then Ctrl+S."
r2.hint.count.1: "Yesterday: webmail 1.0.1f, extranet 1.0.1e, box 1.0.1c. IMAP 0.9.8y and intranet 1.0.0k were not affected."
r2.hint.count.2: "`answer certs 3`"
r2.hint.rotate.1: "`contain rotate certificats`, then `contain reset sessions`."
r2.hint.message.1: "First shut the door, then change the locks, then throw away the old keys, then get everyone out, and only then change the codes."
r2.hint.message.2: "`timeline message patch keys revoke sessions passwords`"
r2.debrief.title: "The keys"
r2.debrief.lesson: "When a flaw lets memory be read without leaving a trace, you cannot prove it was not used. So you restore trust in order: patch, replace the keys, revoke the old ones, close the sessions, and only then ask for new passwords."
r2.debrief.p1: "A detection signature published after a flaw says nothing about what happened before it."
r2.debrief.p2: "Reissuing a certificate means generating a new key; reusing the old one protects nothing."
r2.debrief.p3: "Asking for password changes too early, on a service still vulnerable, exposes them a second time."
r2.facts.title: "What really happened: Heartbleed, April 2014"
r2.facts.p1: "On 7 April 2014, OpenSSL publishes an advisory on a flaw in its TLS heartbeat extension (CVE-2014-0160), nicknamed Heartbleed. Versions 1.0.1 to 1.0.1f are affected; the 1.0.0 and 0.9.8 branches are not. 1.0.1g fixes it."
r2.facts.p2: "A missing length check let a peer read up to 64 KB of the server's or client's memory per heartbeat, as many times as wanted."
r2.facts.p3: "That memory could hold private keys, session cookies and passwords. The flaw was found independently by researchers at Google and at the company Codenomicon."
r2.facts.p4: "The defect had been there since version 1.0.1, released in March 2012: about two years of exposure, with no trace in the usual logs."
r2.facts.p5: "The advice at the time follows this mission's order: patch, regenerate keys and certificates, revoke the old ones, and only then change passwords."
