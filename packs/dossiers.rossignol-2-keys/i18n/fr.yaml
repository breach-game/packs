r2.briefing: "Jeudi, 8 h 30. Tout est corrigé depuis hier soir. Le fournisseur de la sonde de détection a publié cette nuit une signature pour la faille, et elle sonne déjà. Reste la question qui fâche : qu'est-ce qui a pu sortir avant ? Les certificats des services sont dans `certs/`."
r2.obj.rule: "Écrire la règle qui voit les tentatives de lecture"
r2.obj.past: "Dire ce que la règle prouve sur le passé"
r2.obj.count: "Compter les certificats à refaire"
r2.obj.rotate: "Refaire les clés et fermer toutes les sessions"
r2.obj.message: "Mettre dans l'ordre ce qu'on fait et ce qu'on dit aux adhérents"
r2.q.certs: "Combien de certificats faut-il refaire ? (un nombre)"
r2.q.past: "La règle ne voit rien avant ce matin. Qu'en conclus-tu ?"
r2.q.past.nothing: "Rien sur le passé : la signature n'existait pas avant"
r2.q.past.clean: "Que personne n'a utilisé la faille avant ce matin, sur aucun serveur"
r2.q.past.clean.why: "La signature a été publiée cette nuit : avant, la sonde ne savait pas la reconnaître. Et le serveur, lui, ne notait rien."
r2.q.past.logs: "Qu'il suffit de relire les journaux des serveurs web"
r2.q.past.logs.why: "La lecture passe dans le chiffrement, avant toute requête web : les journaux des serveurs n'en gardent aucune trace."
r2.contain.certs: "Générer de nouvelles clés, faire émettre de nouveaux certificats et révoquer les anciens des services touchés"
r2.contain.sessions: "Fermer toutes les sessions ouvertes : chaque adhérent devra se reconnecter"
r2.tl.text: "Du correctif au message aux adhérents"
r2.tl.patch: "Corriger la bibliothèque sur chaque service"
r2.tl.keys: "Générer de nouvelles clés et de nouveaux certificats"
r2.tl.revoke: "Révoquer les anciens certificats"
r2.tl.sessions: "Fermer toutes les sessions ouvertes"
r2.tl.passwords: "Demander aux adhérents de changer leur mot de passe"
r2.ada.brief: "Regarde ce que voit la sonde : `soc logs webmail ids`. Puis écris la règle dans `regles/battement.yml`, une condition par ligne, et essaie-la avec `rule test regles/battement.yml`."
r2.ada.g.rule: "Les alertes de la faille parlent toutes du battement, en anglais : heartbeat. Ajoute `echo \"signature|contains: heartbeat\" >> regles/battement.yml`, puis `rule test regles/battement.yml`. Ou à la main, dans l'éditeur : `edit regles/battement.yml`, puis Ctrl+S."
r2.ada.g.rule.standard: "Trouve ce que les alertes de la faille ont en commun dans leur texte (le champ `signature`), et écris la règle sur ce champ. Pour ouvrir le fichier : `edit regles/battement.yml`."
r2.ada.again: "Ta règle rate des tentatives ou alerte sur le bruit ordinaire. Le mot « TLS » est aussi dans une alerte banale : vise le battement."
r2.ada.rule: "Elle voit chaque tentative et aucune alerte banale. Mais elles échouent toutes : on est corrigés. La vraie question est ailleurs."
r2.ada.g.past: "Réfléchis à depuis quand la sonde sait reconnaître cette faille."
r2.ada.past: "Voilà. On ne peut ni prouver une fuite ni l'exclure. Alors on fait comme si : tout ce qui est passé par la mémoire des services touchés est à refaire. Regarde les certificats."
r2.ada.g.count: "Un certificat par service. Ne compte que ceux des services qui avaient une version touchée hier. Vérifie à qui appartient chacun avec `openssl x509 -noout -subject -in certs/<fichier>`, puis `answer certs <nombre>`."
r2.ada.g.count.standard: "Compte les certificats des services qui avaient une version touchée hier."
r2.ada.count: "Trois : messagerie web, extranet, boîtier. La messagerie IMAP et l'intranet n'avaient pas le battement, leurs clés n'ont jamais été exposées."
r2.ada.g.rotate: "Deux mesures : `contain rotate certificats`, puis `contain reset sessions`. Refaire un certificat avec l'ancienne clé ne sert à rien : la mesure génère de nouvelles clés."
r2.ada.g.rotate.standard: "Refais les clés des services touchés et ferme ce qui a pu être volé avec la mémoire."
r2.ada.rotate: "Nouvelles clés, anciens certificats révoqués, sessions fermées. Reste le message aux adhérents, et l'ordre compte."
r2.ada.g.message: "Affiche les étapes : `timeline message`, puis classe-les : `timeline message <id> <id>…`. Changer un mot de passe sur un service encore ouvert, c'est le donner une seconde fois."
r2.ada.g.message.standard: "Remets dans l'ordre les étapes, du correctif au message aux adhérents."
r2.ada.done: "Dossier clos. Une faille qui ne laisse aucune trace oblige à tout considérer comme lu, et à remettre la confiance dans l'ordre."
r2.hint.rule.1: "Le champ s'appelle `signature`. Le modificateur `|contains` cherche un morceau de texte."
r2.hint.rule.2: "`echo \"signature|contains: heartbeat\" >> regles/battement.yml` Ou à la main, dans l'éditeur : `edit regles/battement.yml`, puis Ctrl+S."
r2.hint.count.1: "Hier : messagerie web 1.0.1f, extranet 1.0.1e, boîtier 1.0.1c. IMAP 0.9.8y et intranet 1.0.0k n'étaient pas touchés."
r2.hint.count.2: "`answer certs 3`"
r2.hint.rotate.1: "`contain rotate certificats`, puis `contain reset sessions`."
r2.hint.message.1: "D'abord fermer la porte, puis changer les serrures, puis jeter les anciennes clés, puis faire sortir tout le monde, et seulement alors changer les codes."
r2.hint.message.2: "`timeline message patch keys revoke sessions passwords`"
r2.debrief.title: "Les clés"
r2.debrief.lesson: "Quand une faille permet de lire la mémoire sans laisser de trace, on ne peut pas prouver qu'elle n'a pas servi. On remet donc la confiance en place dans l'ordre : corriger, changer les clés, révoquer les anciennes, fermer les sessions, et seulement ensuite demander de nouveaux mots de passe."
r2.debrief.p1: "Une signature de détection publiée après une faille ne dit rien de ce qui s'est passé avant elle."
r2.debrief.p2: "Refaire un certificat, c'est générer une nouvelle clé ; réutiliser l'ancienne ne protège de rien."
r2.debrief.p3: "Demander de changer les mots de passe trop tôt, sur un service encore vulnérable, les expose une seconde fois."
r2.facts.title: "Ce qui s'est vraiment passé : Heartbleed, avril 2014"
r2.facts.p1: "Le 7 avril 2014, OpenSSL publie un avis sur une faille de son extension TLS heartbeat (CVE-2014-0160), surnommée Heartbleed. Les versions 1.0.1 à 1.0.1f sont touchées ; les branches 1.0.0 et 0.9.8 ne le sont pas. La 1.0.1g corrige."
r2.facts.p2: "Un contrôle de longueur manquant permettait de lire jusqu'à 64 Ko de mémoire du serveur ou du client à chaque battement, autant de fois que voulu."
r2.facts.p3: "Cette mémoire pouvait contenir des clés privées, des cookies de session et des mots de passe. La faille a été trouvée indépendamment par des chercheurs de Google et de la société Codenomicon."
r2.facts.p4: "Le défaut était présent depuis la version 1.0.1, publiée en mars 2012 : environ deux ans d'exposition, sans trace dans les journaux habituels."
r2.facts.p5: "Les recommandations de l'époque suivent l'ordre de cette mission : corriger, refaire les clés et les certificats, révoquer les anciens, puis seulement changer les mots de passe."
