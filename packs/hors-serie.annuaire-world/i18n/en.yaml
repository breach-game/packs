file.readme: "Ligne Rouge workstation. Side series: The Directory. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE AR-2027-077\nClient: Ardoise Transport, the city's bus network. Scope: *.ardoise.test, 10.94.0.0/24.\nPurpose: review of the account directory, on the defence side, with the IT manager. Ligne Rouge reads the directory, suggests and applies the agreed fixes, and watches sign-ins during the review.\nAgreed setup: read account `cn=lecteur-ir,ou=services,dc=ardoise,dc=test`, password `Lr-lecture-2027`, and read-only `ir` account on sauvegarde. No other account is used, even one found in clear.\nSigned: Ardoise Transport's CEO."
file.ir.sauvegarde: "Ligne Rouge account, read-only. Backup configuration: /etc/sauvegarde/nuit.conf. Useful commands: `last`, `journalctl`, `ps`."
ada.outOfScope: "Stop. This target is outside mandate AR-2027-077. Outside the mandate, it is no longer a test: it is an offence (article 323-1 of the French Penal Code)."
