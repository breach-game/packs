file.readme: "Poste Ligne Rouge. Hors-série : L'Annuaire. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT AR-2027-077\nClient : Transports Ardoise, réseau de bus de l'agglomération. Périmètre : *.ardoise.test, 10.94.0.0/24.\nObjet : revue de l'annuaire des comptes, côté défense, avec le responsable informatique. Ligne Rouge lit l'annuaire, propose et applique les corrections convenues, et surveille les connexions pendant la revue.\nDispositif convenu : compte de lecture `cn=lecteur-ir,ou=services,dc=ardoise,dc=test`, mot de passe `Lr-lecture-2027`, et compte `ir` en lecture sur sauvegarde. Aucun autre compte n'est utilisé, même trouvé en clair.\nSigné : le directeur général de Transports Ardoise."
file.ir.sauvegarde: "Compte Ligne Rouge, lecture seule. Configuration de la sauvegarde : /etc/sauvegarde/nuit.conf. Commandes utiles : `last`, `journalctl`, `ps`."
ada.outOfScope: "Stop. Cette cible est hors du mandat AR-2027-077. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal)."
