a3.briefing: "Version 4.2.1 goes to review tonight. The CTO hands you the controls with the team: the next build's sources are in `appli-4.2.1/`, the API deploys with `deploy`, and the partner key can be changed. Old app versions will stay on phones for months: keep them in mind."
a3.obj.build: "Remove the key and the risky settings from version 4.2.1"
a3.obj.role: "Have the API check the role, and check it from outside"
a3.obj.key: "Change the key already shipped, and check it from outside"
a3.obj.obfuscate: "Answer the obfuscation proposal"
a3.check.secret: "The app's configuration no longer holds the partner key"
a3.check.manifest: "The manifest forbids data backup and debug mode"
a3.check.works: "The app still knows its API and its main screen"
a3.contain.rotate: "Partner key changed. Partners get the new one through their usual channel; the old one, shipped in the app, is now worthless."
a3.q.obfuscate: "A developer suggests: \"We obfuscate 4.2.1 and put the key back in, so nobody can read it.\" Your answer?"
a3.q.obfuscate.never: "No: a secret never goes in the package"
a3.q.obfuscate.enough: "Yes: obfuscated, the code becomes unreadable"
a3.q.obfuscate.enough.why: "Obfuscation slows reading down, it does not prevent it: the app has to use the key, so the key ends up in clear in its memory or on the network."
a3.q.obfuscate.pinning: "Yes, with TLS pinning on top"
a3.q.obfuscate.pinning.why: "Pinning protects the path between the app and the server, not the package's content. The key would stay readable to whoever opens the app."
a3.ada.brief: "Three jobs. First version 4.2.1: `cat appli-4.2.1/assets/config.json` and `cat appli-4.2.1/AndroidManifest.xml`, fix them, then `verify`. Then the API. Then the key already shipped."
a3.ada.g.build: "Remove the key's line: `sed -i \"/partner_key/d\" appli-4.2.1/assets/config.json`. In the manifest, set `allowBackup` and `debuggable` to `\"false\"` with `sed -i` (or `edit`). Then `verify`."
a3.ada.g.build.standard: "Version 4.2.1 must hold no key, must not let its data be copied, and must not stay debuggable. Fix it and `verify`. To open the file: `edit appli-4.2.1/assets/config.json` or `edit appli-4.2.1/AndroidManifest.xml`."
a3.ada.almost: "Not yet: read again what `verify` reports."
a3.ada.build: "4.2.1 is clean. But it fixes nothing for phones that already have 4.2.0, and the API still believes the header."
a3.ada.g.role: "API version 4.13.0 reads the role from the session and ignores the header. Deploy it: `deploy api 4.13.0`. Then replay your staff call: `curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`."
a3.ada.g.role.standard: "The role check must happen on the server. One API version does it: deploy it, then check from outside."
a3.ada.deployed: "API 4.13.0 in production. The app still sets its header, the API no longer listens."
a3.ada.g.key: "The key sits in every installed 4.2.0: it must be changed, not hidden. `contain rotate cle-partenaire`, then try the old one again: `curl -s -H \"X-Cabas-Cle: cbs-part-live-9d27e1\" https://api.cabas.test/v4/partenaires/stock`."
a3.ada.g.key.standard: "The old key has been public since 4.2.0. Make it useless, then check it no longer works."
a3.ada.g.obfuscate: "Who holds the key while the app runs?"
a3.ada.done: "4.2.1 carries nothing secret any more, the API decides alone, and what was already shipped is worthless. Report delivered to Cabas."
a3.hint.build.1: "With the editor: `edit appli-4.2.1/assets/config.json`, then Ctrl+S. With a command: `sed -i \"/partner_key/d\" appli-4.2.1/assets/config.json`"
a3.hint.build.2: "With the editor: `edit appli-4.2.1/AndroidManifest.xml`, then Ctrl+S. With a command: `sed -i \"s/allowBackup=\\\"true\\\"/allowBackup=\\\"false\\\"/\" appli-4.2.1/AndroidManifest.xml`, same for `debuggable`, then `verify`."
a3.hint.role.1: "`deploy api 4.13.0`, then `curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`"
a3.hint.key.1: "`contain rotate cle-partenaire`, then the old call with `X-Cabas-Cle`."
a3.hint.obfuscate.1: "`answer never`"
a3.debrief.title: "The server decides"
a3.debrief.lesson: "Fixing the app was not enough: version 4.2.0 will stay installed for months. The real fix is on the server: the API reads the role from the session, and the shipped key was changed, so what old versions hold is worthless. The new build carries no secret and no longer lets its data be copied."
a3.debrief.p1: "Fix the server first: you cannot update users' phones, but you can update your API the same day."
a3.debrief.p2: "Any key that was shipped gets changed; removing it from the next build does not make it secret."
a3.debrief.p3: "Add to the pre-release check: no key in the package, backup and debug turned off."
a3.ada.role: "From outside, the header is no longer enough: the API asks for a real session."
a3.ada.key: "The old key is refused. The one sleeping in every 4.2.0 is worthless now."
