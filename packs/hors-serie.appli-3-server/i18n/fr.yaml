a3.briefing: "La version 4.2.1 part en relecture ce soir. La directrice technique te donne la main avec l'équipe : les sources de la prochaine version sont dans `appli-4.2.1/`, l'API se déploie avec `deploy`, et la clé des partenaires peut être changée. Les anciennes versions de l'appli resteront dans les téléphones pendant des mois : pense à elles."
a3.obj.build: "Retirer la clé et les réglages risqués de la version 4.2.1"
a3.obj.role: "Faire contrôler le rôle par l'API, et le vérifier de l'extérieur"
a3.obj.key: "Changer la clé déjà livrée, et le vérifier de l'extérieur"
a3.obj.obfuscate: "Répondre à la proposition d'obfuscation"
a3.check.secret: "La configuration de l'appli ne contient plus la clé des partenaires"
a3.check.manifest: "Le manifeste interdit la sauvegarde des données et le mode débogage"
a3.check.works: "L'appli connaît toujours son API et son écran principal"
a3.contain.rotate: "Clé des partenaires changée. Les partenaires reçoivent la nouvelle par leur canal habituel ; l'ancienne, livrée dans l'appli, ne vaut plus rien."
a3.q.obfuscate: "Un développeur propose : « On obfusque la 4.2.1 et on remet la clé dedans, comme ça personne ne la lira. » Ta réponse ?"
a3.q.obfuscate.never: "Non : un secret ne va jamais dans le paquet"
a3.q.obfuscate.enough: "Oui : obfusqué, le code devient illisible"
a3.q.obfuscate.enough.why: "L'obfuscation ralentit la lecture, elle ne l'empêche pas : l'appli doit bien utiliser la clé, donc la clé finit en clair dans sa mémoire ou sur le réseau."
a3.q.obfuscate.pinning: "Oui, avec en plus l'épinglage TLS"
a3.q.obfuscate.pinning.why: "L'épinglage protège le trajet entre l'appli et le serveur, pas le contenu du paquet. La clé resterait lisible par qui ouvre l'appli."
a3.ada.brief: "Trois chantiers. D'abord la version 4.2.1 : `cat appli-4.2.1/assets/config.json` et `cat appli-4.2.1/AndroidManifest.xml`, corrige, puis `verify`. Ensuite l'API. Enfin la clé déjà livrée."
a3.ada.g.build: "Retire la ligne de la clé : `sed -i \"/partner_key/d\" appli-4.2.1/assets/config.json`. Dans le manifeste, passe `allowBackup` et `debuggable` à `\"false\"` avec `sed -i` (ou `edit`). Puis `verify`."
a3.ada.g.build.standard: "La version 4.2.1 ne doit plus contenir de clé, ni laisser copier ses données, ni rester déboguable. Corrige et `verify`."
a3.ada.almost: "Pas encore : relis ce que `verify` signale."
a3.ada.build: "La 4.2.1 est propre. Mais elle ne corrige rien pour les téléphones qui ont déjà la 4.2.0, et l'API croit toujours l'en-tête."
a3.ada.g.role: "La version 4.13.0 de l'API lit le rôle dans la session et ignore l'en-tête. Déploie-la : `deploy api 4.13.0`. Puis rejoue ton appel du personnel : `curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`."
a3.ada.g.role.standard: "Le contrôle du rôle doit se faire sur le serveur. Une version de l'API le fait : déploie-la, puis vérifie de l'extérieur."
a3.ada.deployed: "API 4.13.0 en production. L'appli continue de poser son en-tête, l'API ne l'écoute plus."
a3.ada.g.key: "La clé est dans chaque 4.2.0 déjà installée : il faut la changer, pas la cacher. `contain rotate cle-partenaire`, puis réessaie l'ancienne : `curl -s -H \"X-Cabas-Cle: cbs-part-live-9d27e1\" https://api.cabas.test/v4/partenaires/stock`."
a3.ada.g.key.standard: "L'ancienne clé est publique depuis la 4.2.0. Rends-la inutile, puis vérifie qu'elle ne marche plus."
a3.ada.g.obfuscate: "Qui détient la clé quand l'appli tourne ?"
a3.ada.done: "La 4.2.1 ne transporte plus rien de secret, l'API décide seule, et ce qui a déjà été livré ne vaut plus rien. Rapport rendu à Cabas."
a3.hint.build.1: "`sed -i \"/partner_key/d\" appli-4.2.1/assets/config.json`"
a3.hint.build.2: "`sed -i \"s/allowBackup=\\\"true\\\"/allowBackup=\\\"false\\\"/\" appli-4.2.1/AndroidManifest.xml`, pareil pour `debuggable`, puis `verify`."
a3.hint.role.1: "`deploy api 4.13.0`, puis `curl -s -H \"X-Cabas-Role: staff\" https://api.cabas.test/v4/interne/remboursements`"
a3.hint.key.1: "`contain rotate cle-partenaire`, puis l'ancien appel avec `X-Cabas-Cle`."
a3.hint.obfuscate.1: "`answer never`"
a3.debrief.title: "Le serveur décide"
a3.debrief.lesson: "Corriger l'appli ne suffisait pas : la version 4.2.0 restera installée pendant des mois. La vraie correction est sur le serveur : l'API lit le rôle dans la session, et la clé livrée a été changée, donc ce que contiennent les anciennes versions ne vaut plus rien. La nouvelle version ne transporte plus de secret et ne laisse plus copier ses données."
a3.debrief.p1: "Corriger d'abord le serveur : on ne met pas à jour les téléphones des utilisateurs, mais on met à jour son API le jour même."
a3.debrief.p2: "Toute clé qui a été livrée se change ; la retirer de la version suivante ne la rend pas secrète."
a3.debrief.p3: "Ajouter au contrôle avant publication : aucune clé dans le paquet, sauvegarde et débogage désactivés."
a3.ada.role: "De l'extérieur, l'en-tête ne suffit plus : l'API demande une vraie session."
a3.ada.key: "L'ancienne clé est refusée. Celle qui dort dans chaque 4.2.0 ne vaut plus rien."
