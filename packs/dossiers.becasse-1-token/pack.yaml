id: dossiers.becasse-1-token
version: 1.0.0
engine: ">=0.15 <1"
kind: mission
requires: [dossiers.becasse-world]
title:
  fr: "Dossier 28 · 1. Le jeton"
  en: "Case file 28 · 1. The token"
summary:
  fr: "Une application inconnue lit les messages de la direction. Tu écris la règle qui la voit, tu lis son jeton avec `jwt decode` et tu découvres qu'il est signé par une clé qui n'aurait jamais dû ouvrir une boîte d'entreprise, puis tu la bloques."
  en: "An unknown application reads the management's messages. You write the rule that sees it, read its token with `jwt decode` and find it is signed by a key that should never have opened an organisation's mailbox, then block it."
authors: [BREACH team]
locales: [fr, en]
difficulty: 2
skills: [cloud, logs, crypto, defense]
minutes: 12
