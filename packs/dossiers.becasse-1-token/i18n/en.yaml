b1.briefing: "Wednesday 16 June, 10 am. The alert the agency wrote on its detailed log of message access has fired: an application it never registered reads the director general's mailbox. No password changed, no suspicious sign-in. The registered applications and an extract of Cirrus's log are in `traces/`."
b1.obj.rule: "Write the rule that sees the unknown application"
b1.obj.kid: "Find which key its token is signed with"
b1.obj.meaning: "Say what this means"
b1.obj.block: "Block the application"
b1.q.kid: "Which key id (kid) does the header of the unknown application's token carry?"
b1.q.meaning: "The token targets an agency mailbox, but it is signed by the key of Cirrus's consumer service. What do you conclude?"
b1.q.meaning.key: "Cirrus accepted a key that should not work for the agency"
b1.q.meaning.password: "A staff member gave their password to a fake site"
b1.q.meaning.password.why: "No password was used: the token does not come from an agency sign-in, it carries another service's key."
b1.q.meaning.stolen: "The token was stolen from a management laptop"
b1.q.meaning.stolen.why: "A token stolen from a laptop would be signed by the agency's key. This one was made with another key, at 2:40 am, without any sign-in."
b1.contain.block: "Ask Cirrus to block application 0f3e9a71 for every agency mailbox"
b1.ada.brief: "Compare the registered applications with what the mail service sees: `cat traces/applications.txt`, then `soc logs messagerie access`. Then write the rule in `regles/appli-inconnue.yml` and try it with `rule test regles/appli-inconnue.yml`."
b1.ada.g.rule: "The application id is in the User-Agent. Add `echo \"ua|contains: app=0f3e9a71\" >> regles/appli-inconnue.yml`, then `rule test regles/appli-inconnue.yml`."
b1.ada.g.rule.standard: "Write a rule that sees every read by the application the agency never registered, and none by the other two."
b1.ada.again: "Your rule misses reads or alerts on the mail client or the archiving. Aim at the unknown application's id."
b1.ada.rule: "It sees every read by the unknown one, and leaves the client and the archiving alone. Now, how did this application get in? Cirrus support sent the tokens: `cat traces/jetons.log`."
b1.ada.g.kid: "Copy the token of the app=0f3e9a71 line and read it: `jwt decode <token>`. The command only reads. Look at `kid` in the header and `iss` in the claims, then compare with the agency client's token. Then `answer kid <value>`."
b1.ada.g.kid.standard: "Read the unknown application's token and compare its header with an ordinary agency token."
b1.ada.kid: "Key grand-public-2016, issuer grand-public. The agency's ordinary token carries entreprise-2027-b and the issuer vauclair. Yet both target the same mailbox, and Cirrus answered both."
b1.ada.g.meaning: "Think about who signed, and who accepted."
b1.ada.meaning: "That is what we tell Cirrus, with the proof. Until their fix, we cut the application off."
b1.ada.g.block: "`contain block appli-0f3e9a71`. Changing passwords would be useless: none was used."
b1.ada.g.block.standard: "Cut the unknown application's access."
b1.ada.done: "Blocked. The agency would have seen nothing without its detailed access log. Next comes the report."
b1.hint.rule.1: "The field is called `ua`. The `|contains` modifier looks for a piece of text."
b1.hint.rule.2: "`echo \"ua|contains: app=0f3e9a71\" >> regles/appli-inconnue.yml`"
b1.hint.kid.1: "`jwt decode` followed by the token of the first log line, the 02:40 one."
b1.hint.kid.2: "`answer kid grand-public-2016`"
b1.hint.block.1: "`contain block appli-0f3e9a71`"
b1.debrief.title: "The token"
b1.debrief.lesson: "A token says who signed it. This one was signed by another service's key, and the provider still accepted it for the agency. No password, no sign-in: only a detailed trace of every access to messages could show it."
b1.debrief.p1: "Keep the list of applications allowed to read the mail, and alert on any other."
b1.debrief.p2: "Read the header of a suspicious token: the key (kid) and the issuer (iss) tell where it comes from."
b1.debrief.p3: "Keep a detailed log of message access: accesses, not sign-ins, are what show a forged token."
