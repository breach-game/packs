b1.briefing: "Mercredi 16 juin, 10 h. L'alerte que l'agence a écrite sur son journal détaillé des accès aux messages, une option payante de Cirrus, a sonné : une application qu'elle n'a jamais enregistrée lit la boîte de la direction générale. Aucun mot de passe n'a changé, aucune connexion suspecte. Les applications enregistrées et un extrait du journal de Cirrus sont dans `traces/`."
b1.obj.rule: "Écrire la règle qui voit l'application inconnue"
b1.obj.kid: "Trouver avec quelle clé son jeton est signé"
b1.obj.meaning: "Dire ce que cela signifie"
b1.obj.block: "Bloquer l'application"
b1.q.kid: "Quel identifiant de clé (kid) l'en-tête du jeton de l'application inconnue porte-t-il ?"
b1.q.meaning: "Le jeton vise une boîte de l'agence, mais il est signé par la clé du service grand public de Cirrus. Qu'en conclus-tu ?"
b1.q.meaning.key: "Cirrus a accepté une clé qui ne valait pas pour l’agence"
b1.q.meaning.password: "Un agent a donné son mot de passe à un faux site"
b1.q.meaning.password.why: "Aucun mot de passe n'a servi : le jeton ne vient pas d'une connexion de l'agence, il porte la clé d'un autre service."
b1.q.meaning.stolen: "Le jeton a été volé sur un poste de la direction"
b1.q.meaning.stolen.why: "Un jeton volé sur un poste serait signé par la clé de l'agence. Celui-ci a été fabriqué avec une autre clé, à 2 h 40, sans aucune connexion."
b1.contain.block: "Demander à Cirrus de bloquer, pour toutes les boîtes de l'agence, l'application que l'agence n'a pas enregistrée"
b1.ada.brief: "Compare les applications enregistrées à ce que voit la messagerie : `cat traces/applications.txt`, puis `soc logs messagerie access`. Puis écris la règle dans `regles/appli-inconnue.yml` et essaie-la avec `rule test regles/appli-inconnue.yml`."
b1.ada.g.rule: "L'identifiant de l'application est dans le User-Agent. Ajoute `echo \"ua|contains: app=0f3e9a71\" >> regles/appli-inconnue.yml`, puis `rule test regles/appli-inconnue.yml`."
b1.ada.g.rule.standard: "Écris une règle qui voit chaque lecture par l'application que l'agence n'a pas enregistrée, et aucune par les deux autres."
b1.ada.again: "Ta règle rate des lectures ou alerte sur le client de messagerie ou l'archivage. Vise l'identifiant de l'application inconnue."
b1.ada.rule: "Elle voit chaque lecture de l'inconnue, et passe à côté du client et de l'archivage. Maintenant, comment cette application est-elle entrée ? Le support de Cirrus a envoyé les jetons, ils sont dans `traces/`."
b1.ada.g.kid: "Ouvre `cat traces/jetons.log`. Copie le jeton de la ligne app=0f3e9a71 et lis-le : `jwt decode <jeton>`. La commande ne fait que lire. Regarde `kid` dans l'en-tête et `iss` dans les revendications, puis compare avec le jeton du client de l'agence. Puis `answer kid <valeur>`."
b1.ada.g.kid.standard: "Lis le jeton de l'application inconnue et compare son en-tête à celui d'un jeton ordinaire de l'agence."
b1.ada.kid: "Clé grand-public-2016, émetteur grand-public. Le jeton ordinaire de l'agence porte entreprise-2027-b et l'émetteur vauclair. Mais les deux visent la même boîte, et Cirrus a répondu aux deux."
b1.ada.g.meaning: "Réfléchis à qui a signé, et à qui a accepté."
b1.ada.meaning: "Voilà ce qu'on dira à Cirrus, preuve à l'appui. En attendant leur correctif, on coupe l'application."
b1.ada.g.block: "`contain block appli-inconnue`. Changer les mots de passe ne servirait à rien : aucun n'a été utilisé."
b1.ada.g.block.standard: "Coupe l'accès de l'application inconnue."
b1.ada.done: "Bloquée. L'agence n'aurait rien vu sans son journal détaillé des accès. La suite, c'est le rapport."
b1.hint.rule.1: "Le champ s'appelle `ua`. Le modificateur `|contains` cherche un morceau de texte."
b1.hint.rule.2: "`echo \"ua|contains: app=0f3e9a71\" >> regles/appli-inconnue.yml`"
b1.hint.kid.1: "`jwt decode` suivi du jeton de la première ligne du journal, celle de 02:40."
b1.hint.kid.2: "`answer kid grand-public-2016`"
b1.hint.block.1: "`contain block appli-inconnue`"
b1.ada.early: "Bloquée : plus aucune nouvelle lecture ne passera. Celle qui était déjà lancée reste dans le journal, elle suffit pour écrire la règle."
b1.debrief.title: "Le jeton"
b1.debrief.lesson: "Un jeton dit qui l'a signé. Celui-ci était signé par la clé d'un autre service, et le fournisseur l'a quand même accepté pour l'agence. Aucun mot de passe, aucune connexion : seule une trace détaillée de chaque accès aux messages permettait de le voir."
b1.debrief.p1: "Tenir la liste des applications autorisées à lire la messagerie, et alerter sur toute autre."
b1.debrief.p2: "Lire l'en-tête d'un jeton suspect : la clé (kid) et l'émetteur (iss) disent d'où il vient."
b1.debrief.p3: "Garder un journal détaillé des accès aux messages : ce sont les accès, pas les connexions, qui montrent un jeton fabriqué."
