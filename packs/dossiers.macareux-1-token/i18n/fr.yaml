m1.briefing: "Mardi 14 septembre, 8 h 30. Converso, l'éditeur du chat du site d'Ardoise, envoie un avis : des jetons de son connecteur ont été volés chez lui. Ce connecteur a accès au CRM, Registre. L'avis est dans ton dossier. Le journal de l'API du CRM se lit avec `soc`."
m1.obj.src: "Trouver l'adresse qui se sert du jeton de Converso sans être Converso"
m1.obj.object: "Dire quel objet du CRM cette adresse a exporté en entier"
m1.obj.revoke: "Retirer le jeton du connecteur"
m1.obj.why: "Dire pourquoi le CRM a tout accepté"
m1.q.src: "Quelle adresse utilise l'agent `converso-sync/4.1` sans être celle de Converso ?"
m1.q.object: "Quel objet du CRM la requête la plus lourde a-t-elle exporté ? (le nom après FROM)"
m1.q.why: "Personne n'a forcé le CRM. Pourquoi a-t-il répondu à chaque requête ?"
m1.q.why.token: "Le jeton du connecteur était valide, et rien ne le liait à une adresse"
m1.q.why.password: "Un employé d'Ardoise avait un mot de passe trop faible, deviné par l'attaquant"
m1.q.why.password.why: "Aucune connexion d'employé dans ces lignes : toutes passent par le jeton du connecteur, avec son agent."
m1.q.why.flaw: "Le CRM avait une faille connue que l'attaquant a exploitée"
m1.q.why.flaw.why: "Chaque requête est une requête normale de l'API, acceptée parce que le jeton était bon. Rien n'a été cassé."
m1.contain.token: "Révoquer le jeton de l'application connectée Converso (le chat du site ne crée plus de prospects)"
m1.ada.brief: "Lis l'avis : `cat avis-converso.txt`. Puis le journal de l'API : `soc logs crm access`."
m1.ada.g.src: "Cherche les lignes du connecteur : `soc search converso-sync`. Converso dit n'appeler que depuis 198.51.100.24. `answer src <adresse>`."
m1.ada.g.src.standard: "Le même agent vient de deux adresses. Laquelle n'est pas Converso ? `answer src`."
m1.ada.src: "203.0.113.140 se présente comme le connecteur de Converso. Même agent, même jeton, autre adresse."
m1.ada.g.object: "`soc search 203.0.113.140`, puis regarde la taille des réponses. Le nom après FROM : `answer object <nom>`."
m1.ada.g.object.standard: "Une de ces requêtes pèse 48 Mo. Qu'a-t-elle sorti ? `answer object`."
m1.ada.object: "Tous les tickets du support, avec leur description. Puis la tâche d'export a été supprimée : le journal, lui, est resté."
m1.ada.g.revoke: "`contain revoke converso`. Le chat du site ne créera plus de prospects le temps que Converso donne un nouveau jeton."
m1.ada.g.revoke.standard: "Coupe le jeton. `contain` pour la liste des mesures."
m1.ada.revoke: "Jeton révoqué. Les requêtes suivantes sont refusées."
m1.ada.g.why: "Réponds dans la messagerie ou avec `answer <option>`."
m1.ada.done: "L'accès est fermé. Maintenant, la vraie question : qu'y avait-il dans ces tickets ?"
m1.hint.src.1: "Deux adresses envoient `converso-sync/4.1`. L'une écrit des prospects, l'autre lit tout."
m1.hint.src.2: "`answer src 203.0.113.140`"
m1.hint.object.1: "La ligne à 48211903 octets : `SELECT+Id,Subject,Description+FROM+Case`."
m1.hint.object.2: "`answer object Case`"
m1.hint.revoke.1: "`contain revoke converso`"
m1.hint.why.1: "Aucune ligne de connexion d'employé, aucune erreur : que des requêtes acceptées."
m1.debrief.title: "Le jeton de Converso"
m1.debrief.lesson: "Le CRM d'Ardoise n'a pas été piraté : un outil tiers qu'il avait autorisé l'a été, chez son éditeur. Le jeton volé ouvrait les mêmes portes que le connecteur, sans mot de passe ni second facteur, depuis n'importe quelle adresse. L'attaquant a compté, puis exporté les tickets, puis effacé la tâche d'export. Le journal de l'API gardait tout."
m1.debrief.p1: "Faire l'inventaire des applications connectées : ce que chacune peut lire, et si elle en a besoin."
m1.debrief.p2: "Restreindre un jeton d'intégration aux adresses de l'éditeur quand l'outil le permet, et lui donner le moins de droits possible."
m1.debrief.p3: "Garder les journaux de l'API assez longtemps pour relire une semaine entière : l'attaquant efface ses tâches, rarement les journaux."
