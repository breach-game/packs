m1.briefing: "Tuesday 14 September, 8:30. Converso, the vendor of Ardoise's website chat, sends a notice: tokens of its connector were stolen from it. That connector can reach the CRM, Registre. The notice is in your folder. The CRM API log is read with `soc`."
m1.obj.src: "Find the address using Converso's token without being Converso"
m1.obj.object: "Say which CRM object that address exported in full"
m1.obj.revoke: "Remove the connector's token"
m1.obj.why: "Say why the CRM accepted everything"
m1.q.src: "Which address uses the `converso-sync/4.1` agent without being Converso's?"
m1.q.object: "Which CRM object did the heaviest query export? (the name after FROM)"
m1.q.why: "Nobody broke into the CRM. Why did it answer every request?"
m1.q.why.token: "The connector's token was valid, and nothing tied it to an address"
m1.q.why.password: "An Ardoise employee had a password that was too weak"
m1.q.why.password.why: "No employee sign-in in these lines: they all go through the connector's token, with its agent."
m1.q.why.flaw: "The CRM had a known flaw that the attacker exploited"
m1.q.why.flaw.why: "Each request is a normal API request, accepted because the token was good. Nothing was broken."
m1.contain.token: "Revoke the token of the Converso connected app (the website chat stops creating leads)"
m1.ada.brief: "Read the notice: `cat avis-converso.txt`. Then the API log: `soc logs crm access`."
m1.ada.g.src: "Look for the connector's lines: `soc search converso-sync`. Converso says it only calls from 198.51.100.24. `answer src <address>`."
m1.ada.g.src.standard: "The same agent comes from two addresses. Which one is not Converso? `answer src`."
m1.ada.src: "203.0.113.140 presents itself as Converso's connector. Same agent, same token, another address."
m1.ada.g.object: "`soc search 203.0.113.140`, then look at the response sizes. The name after FROM: `answer object <name>`."
m1.ada.g.object.standard: "One of these requests weighs 48 MB. What did it take out? `answer object`."
m1.ada.object: "Every support ticket, with its description. Then the export job was deleted: the log stayed."
m1.ada.g.revoke: "`contain revoke converso`. The website chat will not create leads until Converso issues a new token."
m1.ada.g.revoke.standard: "Cut the token. `contain` lists the measures."
m1.ada.revoke: "Token revoked. The next requests are refused."
m1.ada.g.why: "Answer in the messenger or with `answer <option>`."
m1.ada.done: "The access is closed. Now the real question: what was in those tickets?"
m1.hint.src.1: "Two addresses send `converso-sync/4.1`. One writes leads, the other reads everything."
m1.hint.src.2: "`answer src 203.0.113.140`"
m1.hint.object.1: "The line at 48211903 bytes: `SELECT+Id,Subject,Description+FROM+Case`."
m1.hint.object.2: "`answer object Case`"
m1.hint.revoke.1: "`contain revoke converso`"
m1.hint.why.1: "No employee sign-in line, no error: only accepted requests."
m1.debrief.title: "Converso's token"
m1.debrief.lesson: "Ardoise's CRM was not hacked: a third-party tool it had authorised was, at its vendor. The stolen token opened the same doors as the connector, with no password or second factor, from any address. The attacker counted, then exported the tickets, then deleted the export job. The API log kept everything."
m1.debrief.p1: "Keep an inventory of connected apps: what each one can read, and whether it needs to."
m1.debrief.p2: "Restrict an integration token to the vendor's addresses when the tool allows it, and give it as few rights as possible."
m1.debrief.p3: "Keep API logs long enough to review a whole week: attackers delete their jobs, rarely the logs."
