file.readme: "Poste Ligne Rouge. Dossier : Bergeronnette. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat BG-2027-013. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT BG-2027-013\nClient : Bergeronnette SAS. Périmètre : *.bergeronnette.test, 10.73.0.0/24.\nObjet : Bergeronnette fournit la connexion unique de 2 300 entreprises. Son assistance demande aux clients qui n'arrivent pas à se connecter un fichier de diagnostic du navigateur (HAR). La direction veut savoir ce qu'un intrus ferait de ces fichiers s'il entrait dans le portail d'assistance.\nDispositif convenu : Ligne Rouge travaille sur une copie d'exercice du portail. Compte agent de test : cookie agent=lr-audit-013. Un client témoin volontaire, Témoin SAS, a ouvert le ticket 4471 et y a joint un vrai fichier de diagnostic de sa console d'administration. La preuve attendue est le témoin écrit dans la console de Témoin SAS. Ne rien modifier dans cette console : aucun bouton.\nSigné : la directrice de la sécurité de Bergeronnette."
web.footer: "Bergeronnette - fournisseur de connexion fictif, dossier BREACH 13"
web.nav.home: "Accueil"
web.nav.help: "Aide"
web.home.title: "Bergeronnette - une seule connexion"
web.home.h1: "Bergeronnette"
web.home.p1: "Un mot de passe, un second facteur, et vos salariés ouvrent toutes leurs applications. 2 300 entreprises nous confient la porte d'entrée."
web.home.p2: "Vos administrateurs gèrent tout depuis la console : comptes, applications, règles de sécurité."
web.help.title: "Bergeronnette - aide"
web.help.h1: "Vous n'arrivez pas à vous connecter ?"
web.help.p1: "Pour que notre assistance voie ce que voit votre navigateur, joignez à votre ticket un fichier de diagnostic (HAR) :"
web.help.l1: "ouvrez les outils de développement de votre navigateur, onglet Réseau"
web.help.l2: "reproduisez le problème"
web.help.l3: "enregistrez tout au format HAR et joignez le fichier au ticket"
web.help.p2: "Ce fichier contient tout ce que votre navigateur a échangé avec nos serveurs."
web.support.title: "Bergeronnette - assistance"
web.support.h1: "Portail d'assistance (copie d'exercice)"
web.support.p1: "Espace réservé aux agents de Bergeronnette. Les tickets sont sous /tickets."
web.support.p2: "Copie d'exercice pour le mandat BG-2027-013 : un seul ticket, celui du client témoin."
web.ticket: "guichet 5.4 - ticket #4471 (copie d'exercice)\n\nclient :  Témoin SAS (client témoin, mandat BG-2027-013)\nde :      admin@temoin-sas.test\nobjet :   La console d'administration tourne en boucle\nouvert :  7 mai, 16:44\n\nBonjour,\nDepuis ce matin, la page Applications de la console me renvoie sans fin vers elle-même. Comme le demande votre page d'aide, je joins le fichier de diagnostic de mon navigateur, enregistré à l'instant.\nMerci !\n\npièce jointe : diagnostic.har (19 ko) -> /tickets/4471/diagnostic.har\n"
