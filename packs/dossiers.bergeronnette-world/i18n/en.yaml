file.readme: "Ligne Rouge workstation. Case file: Bergeronnette. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate BG-2027-013. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE BG-2027-013\nClient: Bergeronnette SAS. Scope: *.bergeronnette.test, 10.73.0.0/24.\nPurpose: Bergeronnette provides single sign-on to 2,300 companies. When customers cannot sign in, its support asks them for a browser diagnostic file (HAR). Management wants to know what an intruder would do with these files if they got into the support portal.\nSet-up agreed: Ligne Rouge works on an exercise copy of the portal. Test agent account: cookie agent=lr-audit-013. A volunteer witness customer, Temoin SAS, opened ticket 4471 and attached a real diagnostic file of its admin console. The proof expected is the witness marker written in Temoin SAS's console. Change nothing in that console: no button.\nSigned: the chief security officer of Bergeronnette."
web.footer: "Bergeronnette - fictional sign-in provider, BREACH case file 13"
web.nav.home: "Home"
web.nav.help: "Help"
web.home.title: "Bergeronnette - one sign-in"
web.home.h1: "Bergeronnette"
web.home.p1: "One password, one second factor, and your staff open all their applications. 2,300 companies trust us with the front door."
web.home.p2: "Your admins run everything from the console: accounts, applications, security rules."
web.help.title: "Bergeronnette - help"
web.help.h1: "Cannot sign in?"
web.help.p1: "So that our support sees what your browser sees, attach a diagnostic file (HAR) to your ticket:"
web.help.l1: "open your browser's developer tools, Network tab"
web.help.l2: "reproduce the problem"
web.help.l3: "save everything as HAR and attach the file to the ticket"
web.help.p2: "This file holds everything your browser exchanged with our servers."
web.support.title: "Bergeronnette - support"
web.support.h1: "Support portal (exercise copy)"
web.support.p1: "For Bergeronnette agents only. Tickets are under /tickets."
web.support.p2: "Exercise copy for mandate BG-2027-013: one ticket only, the witness customer's."
web.ticket: "guichet 5.4 - ticket #4471 (exercise copy)\n\ncustomer: Temoin SAS (witness customer, mandate BG-2027-013)\nfrom:     admin@temoin-sas.test\nsubject:  The admin console loops\nopened:   7 May, 16:44\n\nHello,\nSince this morning the Applications page of the console sends me back to itself endlessly. As your help page asks, I attach my browser's diagnostic file, saved just now.\nThanks!\n\nattachment: diagnostic.har (19 kB) -> /tickets/4471/diagnostic.har\n"
