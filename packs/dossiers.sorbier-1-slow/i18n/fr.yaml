s1.briefing: "Sur la version de développement de Sorbier, se connecter en SSH prend une demi-seconde de plus qu'avant. Personne ne sait pourquoi, et presque personne ne s'en soucie. Le projet te demande de regarder."
s1.obj.slow: "Lire les mesures de connexion et repérer le jour où tout ralentit"
s1.obj.changed: "Envoyer le nom du paquet mis à jour ce jour-là (`submit`)"
s1.obj.path: "Comprendre comment ce paquet arrive jusqu'au serveur SSH"
s1.obj.alarm: "Décider quoi faire d'une anomalie aussi petite"
s1.q.path: "Le serveur SSH n'a rien à compresser. Par où libplume entre-t-elle dans son processus ?"
s1.q.path.direct: "En direct : le serveur SSH s'en sert lui-même pour chiffrer et compresser toutes ses connexions"
s1.q.path.direct.why: "Relis le relevé : libplume n'est pas demandée par le serveur SSH. C'est une autre bibliothèque qui l'amène avec elle."
s1.q.path.indirect: "Par ricochet : un correctif de Sorbier ajoute libsystemd, et libsystemd a besoin de libplume"
s1.q.path.none: "Elle n'y entre pas : la lenteur et la mise à jour tombent le même jour par coïncidence"
s1.q.path.none.why: "Le relevé la montre bien chargée dans le processus. Et l'image stable, qui a l'ancienne version, n'a pas ralenti."
s1.q.alarm: "Une demi-seconde, sur une version de développement. Que fais-tu ?"
s1.q.alarm.ignore: "Rien : c'est une version de développement, les petites lenteurs y sont normales et passagères"
s1.q.alarm.ignore.why: "C'est ce que presque tout le monde aurait fait. Mais une bibliothèque de compression n'a aucune raison de ralentir une connexion SSH : quand un effet n'a pas de cause, on cherche."
s1.q.alarm.dig: "Tu creuses : une bibliothèque de compression n'a aucune raison de ralentir une connexion"
s1.q.alarm.reboot: "Tu redémarres la ferme de construction et tu vois si ça passe"
s1.q.alarm.reboot.why: "Le ralentissement dure depuis trois matins et revient à chaque mesure. Redémarrer efface des indices et ne répond pas à la question."
s1.ada.brief: "Pas d'attaque aujourd'hui, une enquête. Le projet t'a remis trois relevés dans `dossier`. Commence par les mesures : `cat dossier/ssh-timing.txt`."
s1.ada.g.slow: "Lis les mesures de connexion : `cat dossier/ssh-timing.txt`."
s1.ada.g.slow.standard: "Lis les mesures de connexion du dossier."
s1.ada.g.changed: "Regarde ce qui a été mis à jour sur cette image : `cat dossier/updates.txt`. Un seul paquet a changé le 10 février. Envoie-moi son nom avec `submit`."
s1.ada.g.changed.standard: "Trouve ce qui a changé ce jour-là, et envoie-moi le nom du paquet avec `submit`."
s1.ada.g.path: "Reste à comprendre le lien avec SSH. Lis le relevé des bibliothèques chargées par le serveur, `cat dossier/sshd-libs.txt`, puis réponds à ma question."
s1.ada.g.path.standard: "Regarde quelles bibliothèques le serveur SSH charge."
s1.ada.slow: "De 0,30 à 0,82 seconde, le 10 février, et seulement sur l'image de développement. Une demi-seconde : personne ne porte plainte pour ça. Raison de plus pour regarder."
s1.ada.updates: "Quatre mises à jour. Des fuseaux horaires, une police, des pages de manuel, et une bibliothèque. Laquelle tombe le bon jour ?"
s1.ada.updates.standard: "Une seule tombe le bon jour."
s1.ada.flag: "libplume, de 5.6.0 à 5.6.1. Une bibliothèque de compression. Curieux suspect pour une connexion SSH."
s1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
s1.ada.answer.standard: "Réponds à ma question."
s1.ada.path: "Voilà le chemin. Personne n'a décidé que le serveur SSH dépendrait de libplume : c'est arrivé par un correctif, puis par la dépendance d'une dépendance. Les logiciels sont faits de ces ricochets."
s1.ada.alarm: "Oui. Dans cette histoire, tout tient à une personne qui a trouvé une demi-seconde anormale et qui n'a pas lâché."
s1.ada.done: "Tu as un suspect : la version 5.6.1 de libplume. Ouvre le débrief, puis on va voir ce qu'elle contient vraiment."
s1.hint.slow.1: "Tape `cat dossier/ssh-timing.txt`."
s1.hint.changed.1: "Tape `cat dossier/updates.txt` et cherche la ligne du 10 février."
s1.hint.changed.2: "Tape `submit libplume`."
s1.hint.path.1: "Tape `cat dossier/sshd-libs.txt`, puis réponds à la question d'Ada."
s1.debrief.title: "Une demi-seconde suffit"
s1.debrief.lesson: "Tu es parti d'une lenteur que tout le monde aurait ignorée, et tu es arrivé à une bibliothèque dont le serveur SSH ne sait même pas qu'il dépend. Une anomalie sans explication est une piste."
s1.debrief.p1: "Un logiciel charge ses dépendances, et les dépendances de ses dépendances. La plupart n'ont jamais été choisies par ceux qui l'écrivent."
s1.debrief.p2: "Pour trouver une cause, cherche ce qui a changé : la date d'un symptôme et un journal des mises à jour font la moitié du travail."
s1.debrief.p3: "Mesurer régulièrement des choses banales, comme un temps de connexion, permet de voir le jour où elles cessent de l'être."
