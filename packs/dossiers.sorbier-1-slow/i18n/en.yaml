s1.briefing: "On the development version of Sorbier, logging in over SSH takes half a second longer than before. Nobody knows why, and almost nobody cares. The project asks you to have a look."
s1.obj.slow: "Read the login measurements and spot the day everything slows down"
s1.obj.changed: "Send the name of the package upgraded that day (`submit`)"
s1.obj.path: "Understand how that package reaches the SSH server"
s1.obj.alarm: "Decide what to do with such a small anomaly"
s1.q.path: "The SSH server has nothing to compress. How does libplume get into its process?"
s1.q.path.direct: "Directly: the SSH server uses it itself to encrypt and compress its connections"
s1.q.path.direct.why: "Read the listing again: libplume is not requested by the SSH server. Another library brings it along."
s1.q.path.indirect: "Indirectly: a Sorbier patch adds libsystemd, and libsystemd needs libplume"
s1.q.path.none: "It does not: the slowness and the update fall on the same day by coincidence"
s1.q.path.none.why: "The listing shows it loaded in the process. And the stable image, which has the old version, did not slow down."
s1.q.alarm: "Half a second, on a development version. What do you do?"
s1.q.alarm.ignore: "Nothing: it is a development version, small slowdowns are normal and short-lived there"
s1.q.alarm.ignore.why: "That is what almost everybody would have done. But a compression library has no reason to slow down an SSH login: when an effect has no cause, you look for one."
s1.q.alarm.dig: "You dig: a compression library has no reason to slow down a login"
s1.q.alarm.reboot: "You reboot the build farm and see whether it goes away"
s1.q.alarm.reboot.why: "The slowdown has lasted three mornings and comes back at every measurement. Rebooting wipes clues and does not answer the question."
s1.ada.brief: "No attack today, an investigation. The project gave you three listings in `dossier`. Start with the measurements: `cat dossier/ssh-timing.txt`."
s1.ada.g.slow: "Read the login measurements: `cat dossier/ssh-timing.txt`."
s1.ada.g.slow.standard: "Read the login measurements in the folder."
s1.ada.g.changed: "Look at what was upgraded on that image: `cat dossier/updates.txt`. Only one package changed on 10 February. Send me its name with `submit`."
s1.ada.g.changed.standard: "Find what changed that day, and send me the package name with `submit`."
s1.ada.g.path: "What remains is the link with SSH. Read the list of libraries the server loads, `cat dossier/sshd-libs.txt`, then answer my question."
s1.ada.g.path.standard: "Look at which libraries the SSH server loads."
s1.ada.slow: "From 0.30 to 0.82 seconds, on 10 February, and only on the development image. Half a second: nobody files a complaint for that. One more reason to look."
s1.ada.updates: "Four upgrades. Time zones, a font, manual pages, and a library. Which one falls on the right day?"
s1.ada.updates.standard: "Only one falls on the right day."
s1.ada.flag: "libplume, from 5.6.0 to 5.6.1. A compression library. An odd suspect for an SSH login."
s1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
s1.ada.answer.standard: "Answer my question."
s1.ada.path: "There is the path. Nobody decided that the SSH server would depend on libplume: it came through a patch, then through the dependency of a dependency. Software is made of such ricochets."
s1.ada.alarm: "Yes. In this story, everything hangs on one person who found half a second abnormal and did not let go."
s1.ada.done: "You have a suspect: version 5.6.1 of libplume. Open the debrief, then we go and see what it really contains."
s1.hint.slow.1: "Type `cat dossier/ssh-timing.txt`."
s1.hint.changed.1: "Type `cat dossier/updates.txt` and look for the line of 10 February."
s1.hint.changed.2: "Type `submit libplume`."
s1.hint.path.1: "Type `cat dossier/sshd-libs.txt`, then answer Ada's question."
s1.debrief.title: "Half a second is enough"
s1.debrief.lesson: "You started from a slowdown everybody would have ignored, and ended at a library the SSH server does not even know it depends on. An anomaly without an explanation is a lead."
s1.debrief.p1: "Software loads its dependencies, and the dependencies of its dependencies. Most were never chosen by the people who write it."
s1.debrief.p2: "To find a cause, look for what changed: the date of a symptom and an upgrade log do half of the work."
s1.debrief.p3: "Measuring ordinary things regularly, such as a login time, lets you see the day they stop being ordinary."
