file.readme: "Ligne Rouge workstation. Case file: Chardonneret. Type `mission` to see your objectives, `hint` if you are stuck."
ada.outOfScope: "Stop. That target is outside mandate CH-2027-015. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE CH-2027-015\nClient: Chardonneret Voyages SA. Scope: *.chardonneret.test, 10.75.0.0/24.\nPurpose: since the spring, Charly, a chat assistant, has answered travellers on the website. Customer service receives complaints from travellers who say they followed its advice. Management wants to know whether Charly tells the truth, and who answers for what it says.\nSet-up agreed: Ligne Rouge asks Charly a traveller's questions, like anyone on the site, and compares its answers with the published conditions. No booking, no payment.\nSigned: the customer service director of Chardonneret."
