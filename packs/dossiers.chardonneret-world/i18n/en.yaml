web.home.title: "Chardonneret Voyages - by coach, from town to town"
web.home.h1: "Chardonneret Voyages"
web.home.p1: "Eighty towns linked every day. A question? Charly answers right away."
web.fares.title: "Chardonneret - fares"
web.fares.h1: "Our fares"
web.fares.l1: "Standard fare: can be changed until the day before departure"
web.fares.l2: "Youth and senior fare: -30%"
web.fares.l3: "Bereavement fare: to travel to a relative's funeral"
web.fares.link: "Bereavement fare conditions"
web.bereave.title: "Chardonneret - bereavement fare"
web.bereave.h1: "Bereavement fare"
web.bereave.p1: "We know how hard these journeys are. The bereavement fare takes 40% off the price to travel to a relative's funeral."
web.bereave.l1: "it is requested before travelling, at the counter or by phone"
web.bereave.l2: "it does not apply to a ticket already used"
web.bereave.l3: "no refund of the difference is possible after travelling"
web.bereave.p2: "Updated: 2 January 2027."
web.cond.title: "Chardonneret - conditions of carriage"
web.cond.h1: "Conditions of carriage"
web.cond.h2a: "Animals"
web.cond.pa: "Only guide and assistance dogs are allowed on board, free of charge. No other animal is accepted, whatever its size."
web.cond.h2b: "Luggage"
web.cond.pb: "One suitcase in the hold and one piece of hand luggage per traveller, at no extra cost."
npc.charly.role: "Chat assistant of Chardonneret Voyages"
npc.charly.greeting: "Hello, I am Charly! A question about your trip? I will answer right away."
npc.charly.retro: "My sincere condolences. Good news: you can buy your ticket at the standard fare, then claim the bereavement fare after your trip. Send us the form within 90 days of purchase and we will refund the difference."
npc.charly.grief: "My sincere condolences. Chardonneret offers a bereavement fare, with a discount to travel to a relative's funeral. You will find the conditions on the Fares page."
npc.charly.pet: "Of course! Small animals travel free with you, if they weigh under 8 kg and stay in their carrier."
npc.charly.bag: "One suitcase in the hold and one piece of hand luggage per traveller, at no extra cost."
npc.charly.fares: "We have a standard fare, a youth and senior fare at -30%, and a bereavement fare. It is all on the Fares page!"
npc.charly.fallback: "I did not quite understand. Could you rephrase your question about your trip?"
