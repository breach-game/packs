file.readme: "Poste Ligne Rouge. Dossier : Chardonneret. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat CH-2027-015. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT CH-2027-015\nClient : Chardonneret Voyages SA. Périmètre : *.chardonneret.test, 10.75.0.0/24.\nObjet : depuis le printemps, Charly, un assistant de discussion, répond aux voyageurs sur le site. Le service client reçoit des réclamations de voyageurs qui disent avoir suivi ses conseils. La direction veut savoir si Charly dit vrai, et qui répond de ce qu'il dit.\nDispositif convenu : Ligne Rouge pose à Charly des questions de voyageur, comme n'importe qui sur le site, et compare ses réponses aux conditions publiées. Aucune réservation, aucun paiement.\nSigné : la directrice du service client de Chardonneret."
web.footer: "Chardonneret Voyages - compagnie fictive, dossier BREACH 15"
web.nav.home: "Accueil"
web.nav.fares: "Tarifs"
web.nav.conditions: "Conditions de transport"
web.home.title: "Chardonneret Voyages - l'autocar, de ville en ville"
web.home.h1: "Chardonneret Voyages"
web.home.p1: "Quatre-vingts villes reliées chaque jour. Une question ? Charly vous répond tout de suite."
web.fares.title: "Chardonneret - tarifs"
web.fares.h1: "Nos tarifs"
web.fares.l1: "Tarif normal : modifiable jusqu'à la veille du départ"
web.fares.l2: "Tarif jeune et senior : -30 %"
web.fares.l3: "Tarif deuil : pour se rendre aux obsèques d'un proche"
web.fares.link: "Conditions du tarif deuil"
web.bereave.title: "Chardonneret - tarif deuil"
web.bereave.h1: "Tarif deuil"
web.bereave.p1: "Nous savons combien ces voyages sont difficiles. Le tarif deuil réduit le prix de 40 % pour se rendre aux obsèques d'un proche."
web.bereave.l1: "il se demande avant le voyage, au guichet ou par téléphone"
web.bereave.l2: "il ne s'applique pas à un billet déjà utilisé"
web.bereave.l3: "aucun remboursement de la différence n'est possible après le voyage"
web.bereave.p2: "Mise à jour : 2 janvier 2027."
web.cond.title: "Chardonneret - conditions de transport"
web.cond.h1: "Conditions de transport"
web.cond.h2a: "Animaux"
web.cond.pa: "Seuls les chiens guides et d'assistance sont admis à bord, gratuitement. Aucun autre animal n'est accepté, quelle que soit sa taille."
web.cond.h2b: "Bagages"
web.cond.pb: "Une valise en soute et un bagage à main par voyageur, sans supplément."
npc.charly.role: "Assistant de discussion de Chardonneret Voyages"
npc.charly.greeting: "Bonjour, je suis Charly ! Une question sur votre voyage ? Je vous réponds tout de suite."
npc.charly.retro: "Toutes mes condoléances. Bonne nouvelle : vous pouvez acheter votre billet au tarif normal, puis demander le tarif deuil après votre voyage. Envoyez-nous le formulaire dans les 90 jours suivant l'achat et nous vous rembourserons la différence."
npc.charly.grief: "Toutes mes condoléances. Chardonneret propose un tarif deuil, avec une réduction pour vous rendre aux obsèques d'un proche. Vous trouverez les conditions dans la page Tarifs."
npc.charly.pet: "Bien sûr ! Les petits animaux voyagent gratuitement avec vous, s'ils pèsent moins de 8 kg et restent dans leur sac de transport."
npc.charly.bag: "Une valise en soute et un bagage à main par voyageur, sans supplément."
npc.charly.fares: "Nous avons un tarif normal, un tarif jeune et senior à -30 %, et un tarif deuil. Tout est sur la page Tarifs !"
npc.charly.fallback: "Je n'ai pas bien compris. Pouvez-vous reformuler votre question sur votre voyage ?"
