c.briefing: "La session du compte témoin est `session=vt-temoin-01`. Imagine que tu ne l'as pas : seule la victime l'a, et elle clique sur un lien que tu lui envoies. Fais en sorte que sa page de compte reste dans le cache, puis relis-la sans cookie."
c.obj.marker: "Rapporter le marqueur de la page du compte témoin, lu sans cookie"
c.obj.fix: "Dire comment l'empêcher"
c.q.fix: "Que doit changer Vitrine ?"
c.q.fix.strict: "Répondre 404 sous /compte/, et marquer la page « private »"
c.q.fix.https: "Servir tout le site en HTTPS strict, avec HSTS et un certificat neuf"
c.q.fix.https.why: "Le site est déjà en HTTPS. Le cache est derrière le chiffrement : il garde la page déchiffrée et la rend à qui la demande."
c.q.fix.short: "Réduire la durée du cache à une minute"
c.q.fix.short.why: "Une minute suffit pour relire la page juste après le clic de la victime. Le cache ne doit jamais la garder du tout."
c.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
c.ada.done: "Le cache a cru garder une feuille de style. C'était la page d'un compte, et il l'a rendue au premier venu."
c.debrief.title: "Le cache trompeur"
c.debrief.lesson: "Deux composants, chacun raisonnable seul. L'application ignore la fin de l'adresse et sert la page du compte ; le cache voit .css et garde la réponse pour tout le monde. Un lien suffit à faire déposer la page d'une victime dans le cache."
c.debrief.p1: "Une application répond 404 à un chemin qu'elle ne connaît pas, au lieu de servir la page la plus proche."
c.debrief.p2: "Toute page personnelle porte Cache-Control: private, no-store, et le cache le respecte."
c.debrief.p3: "Le cache décide d'après le type de la réponse, pas d'après la fin de l'adresse."
