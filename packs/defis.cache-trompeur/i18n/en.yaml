c.briefing: "The witness account's session is `session=vt-temoin-01`. Imagine you do not have it: only the victim does, and they click a link you send them. Get their account page to stay in the cache, then read it back without a cookie."
c.obj.marker: "Report the marker of the witness account's page, read without a cookie"
c.obj.fix: "Say how to prevent it"
c.q.fix: "What must Vitrine change?"
c.q.fix.strict: "Answer 404 below /compte/, and mark the page \"private\""
c.q.fix.https: "Serve the whole site over strict HTTPS, with HSTS and a new certificate"
c.q.fix.https.why: "The site already uses HTTPS. The cache sits behind the encryption: it keeps the decrypted page and returns it to whoever asks."
c.q.fix.short: "Cut the cache lifetime down to one minute"
c.q.fix.short.why: "One minute is enough to read the page right after the victim's click. The cache must never keep it at all."
c.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
c.ada.done: "The cache thought it was keeping a stylesheet. It was an account page, and it handed it to the first comer."
c.debrief.title: "The deceived cache"
c.debrief.lesson: "Two components, each reasonable alone. The application ignores the end of the address and serves the account page; the cache sees .css and keeps the answer for everyone. One link is enough to get a victim's page dropped into the cache."
c.debrief.p1: "An application answers 404 to a path it does not know, instead of serving the closest page."
c.debrief.p2: "Every personal page carries Cache-Control: private, no-store, and the cache honours it."
c.debrief.p3: "The cache decides from the answer's type, not from the end of the address."
