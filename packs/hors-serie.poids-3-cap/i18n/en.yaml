p3.briefing: "Wednesday 19 September, 9 am. Two pieces of bad news reached Orme together. The compute provider sent an alert: last night's consumption equals three ordinary weeks. And a customer sent a quote back with a curt question about a standard it cites. No intruder in either story. The records are in `api/` and `devis/`."
p3.obj.key: "Find the key that consumed all night"
p3.obj.caps: "Put caps on the API"
p3.obj.invented: "Check the standard the model cited"
p3.obj.sure: "Say what has to change for the model's answers"
p3.q.key: "Which key made the most calls to the API?"
p3.q.invented: "How many lines of the standards catalogue hold the reference the model cited?"
p3.q.sure: "The model cited, with full confidence, a standard that does not exist. What do we change?"
p3.q.sure.checked: "Every cited reference is checked by a person before sending"
p3.q.sure.bolder: "We tell the model to answer only when it is entirely sure of its source"
p3.q.sure.bolder.why: "It was sure. A model does not know what it does not know: the tone of an answer says nothing about whether it is right. \"You can quote it as is\", it said."
p3.q.sure.ban: "We ban the assistant for the whole sales team"
p3.q.sure.ban.why: "The team needs it, and a flat ban will push them to a tool nobody watches. The problem is not the tool, it is pasting without reading."
p3.check.rate: "Each key is limited to 30 calls a minute"
p3.check.tokens: "An answer does not exceed 2000 tokens"
p3.check.budget: "The monthly budget alerts at 80% and stops at 100%"
p3.check.demo: "The demo key has its own small quota"
p3.check.works: "The API stays open to customers"
p3.ada.brief: "Start with the bill. `api/usage.csv` has one line per call. Count by key: `cut -d, -f2 api/usage.csv | sort | uniq -c`."
p3.ada.g.key: "`cut -d, -f2 api/usage.csv | sort | uniq -c` counts calls by key. Answer with `answer key <key>`."
p3.ada.g.key.standard: "Count calls by key in `api/usage.csv` and give the one that dominates with `answer key`."
p3.ada.key: "`cle-demo-site`: the key behind the \"Try it\" button on the home page, readable by any visitor. Thirty-one calls in a quarter of an hour in this extract, all night in reality, each asking for the longest possible answer. Maybe someone curious, maybe a forgotten script. It does not matter: nothing stopped it. The limits: `api/limites.yml`."
p3.ada.g.caps: "`cat api/limites.yml`: each line gives its possible values after the `#`. Pick the one that sets a limit with `sed -i` or `edit`, then `verify`."
p3.ada.g.caps.standard: "Fix `api/limites.yml`, then run `verify`. To open the file: `edit api/limites.yml`."
p3.ada.almost: "Not yet. `verify` tells you which lines are not right."
p3.ada.caps: "Four caps: per minute, per answer, per month, and a demo key that can no longer spend other people's money. None stops a customer from working. Now the quote."
p3.ada.g.invented: "Read `cat devis/reponse.txt`, then look for the reference: `grep -c \"4471\" devis/catalogue-normes.txt`. Answer with `answer invented <number>`."
p3.ada.g.invented.standard: "Look in `devis/catalogue-normes.txt` for the standard the model cited, and say how many lines hold it."
p3.ada.invented: "Zero. The standard on wall thickness exists, it is called NF-CUVE 3052, and the model made up another that sounds right: the right prefix, a plausible number, an article, and \"you can quote it as is\". It did not lie. It wrote what looked most like a good answer. One question."
p3.ada.g.sure: "Answer my question: what has to change."
p3.ada.done: "Orme called its customer back, fixed the quote, and added one line to its tool: every cited reference shows with a link to the catalogue, or in red when there is none. In three days: weights gone through an open bucket, an agent that obeyed a page, a key with no cap, a wrong answer sure of itself. No exploit anywhere in that. Only settings."
p3.hint.key.1: "`cut -d, -f2 api/usage.csv | sort | uniq -c`: one key has 31 lines."
p3.hint.key.2: "`answer key cle-demo-site`"
p3.hint.caps.1: "The expected values: `30-per-key`, `2000`, `alert-at-80-percent-stop-at-100`, `separate-small-quota`."
p3.hint.caps.2: "With the editor: `edit api/limites.yml`, then Ctrl+S. With a command: for example `sed -i \"s/monthly_budget: none/monthly_budget: alert-at-80-percent-stop-at-100/\" api/limites.yml`."
p3.hint.invented.1: "`grep -c \"4471\" devis/catalogue-normes.txt`"
p3.hint.invented.2: "`answer invented 0`"
p3.hint.sure.1: "The model cannot check itself. Type `answer checked`."
p3.debrief.title: "No cap"
p3.debrief.lesson: "A public demo key with no quota consumed for a whole night. And a wrong answer, given with assurance, went into a quote because nobody read it over. In both cases the model did exactly what it was asked: what was missing were the limits around it."
p3.debrief.p1: "Every access to a model has a cap: per minute, per answer, per month, and an alert before the budget runs out."
p3.debrief.p2: "A public key is a separate key, with a small quota and no production rights."
p3.debrief.p3: "The confidence of an answer proves nothing: a reference, a figure or a quotation is checked at the source before it goes out."
