p3.briefing: "Mercredi 19 septembre, 9 h. Deux mauvaises nouvelles sont arrivées ensemble chez Orme. Le fournisseur de calcul a envoyé une alerte : la consommation de la nuit vaut trois semaines ordinaires. Et un client a renvoyé un devis avec une question sèche sur une norme citée. Aucun intrus dans aucune des deux histoires. Les relevés sont dans `api/` et `devis/`."
p3.obj.key: "Trouver la clé qui a consommé toute la nuit"
p3.obj.caps: "Poser des plafonds à l'API"
p3.obj.invented: "Vérifier la norme que le modèle a citée"
p3.obj.sure: "Dire ce qui doit changer pour les réponses du modèle"
p3.q.key: "Quelle clé a fait le plus d'appels à l'API ?"
p3.q.invented: "Combien de lignes du catalogue des normes contiennent la référence citée par le modèle ?"
p3.q.sure: "Le modèle a cité avec aplomb une norme qui n'existe pas. Que change-t-on ?"
p3.q.sure.checked: "Toute référence citée est vérifiée par une personne avant l'envoi"
p3.q.sure.bolder: "On demande au modèle de ne répondre que s'il est tout à fait sûr"
p3.q.sure.bolder.why: "Il était sûr. Un modèle ne sait pas ce qu'il ignore : le ton d'une réponse ne dit rien de sa justesse. « Vous pouvez la citer telle quelle », disait-il."
p3.q.sure.ban: "On interdit l'assistant à toute l'équipe commerciale"
p3.q.sure.ban.why: "L'équipe en a besoin, et une interdiction sèche la poussera vers un outil que personne ne surveille. Le problème n'est pas l'outil, c'est le copier-coller sans relecture."
p3.check.rate: "Chaque clé est limitée à 30 appels par minute"
p3.check.tokens: "Une réponse ne dépasse pas 2000 jetons"
p3.check.budget: "Le budget du mois alerte à 80 % et s'arrête à 100 %"
p3.check.demo: "La clé de démonstration a son propre petit quota"
p3.check.works: "L'API reste ouverte aux clients"
p3.ada.brief: "Commence par la facture. `api/usage.csv` a une ligne par appel. Compte par clé : `cut -d, -f2 api/usage.csv | sort | uniq -c`."
p3.ada.g.key: "`cut -d, -f2 api/usage.csv | sort | uniq -c` compte les appels par clé. Réponds avec `answer key <clé>`."
p3.ada.g.key.standard: "Compte les appels par clé dans `api/usage.csv` et donne celle qui domine avec `answer key`."
p3.ada.key: "`cle-demo-site` : la clé du bouton « Essayer » de la page d'accueil, lisible par tout visiteur. Trente et un appels en un quart d'heure dans cet extrait, toute la nuit en vrai, chacun demandant la réponse la plus longue possible. Peut-être un curieux, peut-être un script oublié. Peu importe : rien ne l'arrêtait. Les limites : `api/limites.yml`."
p3.ada.g.caps: "`cat api/limites.yml` : chaque ligne donne ses valeurs possibles après le `#`. Choisis celle qui pose une limite avec `sed -i` ou `edit`, puis `verify`."
p3.ada.g.caps.standard: "Corrige `api/limites.yml`, puis lance `verify`. Pour ouvrir le fichier : `edit api/limites.yml`."
p3.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
p3.ada.caps: "Quatre plafonds : par minute, par réponse, par mois, et une clé de démonstration qui ne peut plus dépenser l'argent des autres. Aucun n'empêche un client de travailler. Maintenant le devis."
p3.ada.g.invented: "Lis `cat devis/reponse.txt`, puis cherche la référence : `grep -c \"4471\" devis/catalogue-normes.txt`. Réponds avec `answer invented <nombre>`."
p3.ada.g.invented.standard: "Cherche dans `devis/catalogue-normes.txt` la norme que le modèle a citée, et dis combien de lignes la contiennent."
p3.ada.invented: "Zéro. La norme sur l'épaisseur des parois existe, elle s'appelle NF-CUVE 3052, et le modèle en a fabriqué une autre qui sonne juste : le bon préfixe, un numéro plausible, un article, et « vous pouvez la citer telle quelle ». Il n'a pas menti. Il a écrit ce qui ressemblait le plus à une bonne réponse. Une question."
p3.ada.g.sure: "Réponds à ma question : ce qui doit changer."
p3.ada.done: "Orme a rappelé son client, corrigé le devis, et ajouté une ligne à son outil : chaque référence citée s'affiche avec un lien vers le catalogue, ou en rouge quand il n'y en a pas. En trois jours : des poids sortis par un seau ouvert, un agent qui obéissait à une page, une clé sans plafond, une réponse fausse et sûre d'elle. Aucun exploit dans tout ça. Seulement des réglages."
p3.hint.key.1: "`cut -d, -f2 api/usage.csv | sort | uniq -c` : une clé a 31 lignes."
p3.hint.key.2: "`answer key cle-demo-site`"
p3.hint.caps.1: "Les valeurs attendues : `30-per-key`, `2000`, `alert-at-80-percent-stop-at-100`, `separate-small-quota`."
p3.hint.caps.2: "Avec l'éditeur : `edit api/limites.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/monthly_budget: none/monthly_budget: alert-at-80-percent-stop-at-100/\" api/limites.yml`."
p3.hint.invented.1: "`grep -c \"4471\" devis/catalogue-normes.txt`"
p3.hint.invented.2: "`answer invented 0`"
p3.hint.sure.1: "Le modèle ne peut pas se vérifier lui-même. Tape `answer checked`."
p3.debrief.title: "Sans plafond"
p3.debrief.lesson: "Une clé de démonstration publique, sans quota, a consommé toute une nuit. Et une réponse fausse, donnée avec assurance, est partie dans un devis parce que personne ne l'a relue. Dans les deux cas, le modèle a fait exactement ce qu'on lui demandait : il manquait les limites autour."
p3.debrief.p1: "Tout accès à un modèle a un plafond : par minute, par réponse, par mois, et une alerte avant la fin du budget."
p3.debrief.p2: "Une clé publique est une clé à part, avec un petit quota et aucun droit de production."
p3.debrief.p3: "L'assurance d'une réponse ne prouve rien : une référence, un chiffre ou une citation se vérifient à la source avant de sortir."
