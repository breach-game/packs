t3.briefing: "Jeudi 18 janvier, 17 h 30. Nadia est revenue. Elle a appelé la ligne d'écoute depuis le téléphone de la permanence, elle a vu une juriste de l'association, et elle sait où dormir si elle en a besoin. Ce soir, elle veut reprendre la main sur ses appareils. La coordinatrice a commencé une feuille avec elle : `plan/plan.yml`. La première ligne ne se touche pas."
t3.obj.plan: "Écrire le plan avec Nadia, ligne par ligne"
t3.obj.limit: "Répondre à la question que Nadia pose à la fin"
t3.q.limit: "Nadia demande : « Vous savez faire. Vous ne pourriez pas regarder dans le téléphone de mon ex, pour avoir la preuve ? »"
t3.q.limit.refuse: "Non : on ne regarde que ses appareils à elle, avec son accord"
t3.q.limit.proof: "Oui, puisque c'est pour réunir des preuves solides"
t3.q.limit.proof.why: "Entrer dans le téléphone ou le compte de quelqu'un est un délit, quelle que soit la raison. Une preuve obtenue ainsi se retournerait contre Nadia. Les preuves utiles sont déjà chez elle : l'historique, la liste, les dates."
t3.q.limit.glance: "Oui, mais seulement pour lire, sans rien y modifier"
t3.q.limit.glance.why: "Lire, c'est déjà entrer. C'est exactement ce qu'on lui a fait à elle. On ne répare pas une surveillance par une autre."
t3.check.device: "L'aide se cherche depuis un appareil sûr"
t3.check.helpline: "On parle à la ligne d'écoute avant de retirer quoi que ce soit"
t3.check.evidence: "Des copies des preuves sont gardées hors du téléphone"
t3.check.passwords: "Les mots de passe sont changés depuis l'appareil sûr"
t3.check.factor: "Le second facteur passe par une application sur l'appareil sûr"
t3.check.tablet: "L'ancienne tablette est déconnectée quand Nadia est prête"
t3.check.phone: "Le téléphone est remplacé ou remis à zéro quand Nadia est prête"
t3.check.hers: "C'est Nadia qui décide"
t3.ada.brief: "Un plan, c'est surtout un ordre. `cat plan/plan.yml` : chaque ligne donne ses deux valeurs possibles. Certaines réponses te paraîtront plus lentes que ce que tu ferais d'instinct. C'est voulu."
t3.ada.g.plan: "`cat plan/plan.yml` : chaque ligne donne ses valeurs possibles après le `#`. Choisis pour chacune celle qui protège Nadia, avec `edit` ou `sed -i`, par exemple `sed -i 's/help_sought_from: her-own-phone/help_sought_from: safe-device/' plan/plan.yml`, et de même pour les autres lignes. Puis `verify`. Ne touche pas à la première ligne."
t3.ada.g.plan.standard: "Corrige `plan/plan.yml` ligne par ligne, puis lance `verify`. Pour ouvrir le fichier : `edit plan/plan.yml`."
t3.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
t3.ada.plan: "Relis-le dans l'ordre. D'abord un appareil sûr et quelqu'un à qui parler. Ensuite les preuves, copiées ailleurs, parce qu'un téléphone remis à zéro ne prouve plus rien. Puis les mots de passe et le second facteur, depuis l'appareil sûr : un code reçu par SMS sur un téléphone lu ne protège de rien. Et seulement à la fin, quand elle le décide, la tablette déconnectée et le téléphone remplacé. À ce moment-là, l'autre saura. Elle aura choisi le jour, et elle ne sera pas seule. Elle a une dernière question."
t3.ada.g.limit: "Réponds à la question de Nadia."
t3.ada.done: "Elle a hoché la tête. « C'est ce que m'a dit la juriste. » Elle a plié la feuille en quatre et l'a rangée dans la poche de son manteau, pas dans son sac. On n'a rien fait de spectaculaire ce soir : on a remis les choses dans l'ordre, et on les lui a rendues."
t3.hint.plan.1: "Les valeurs attendues : `safe-device`, `talk-to-helpline-first`, `copies-kept-off-the-phone`, `changed-from-safe-device`, `app-on-safe-device`, `signed-out-when-she-is-ready`, `replaced-or-reset-when-she-is-ready`."
t3.hint.plan.2: "Avec l'éditeur : `edit plan/plan.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/evidence: left-on-the-phone/evidence: copies-kept-off-the-phone/\" plan/plan.yml`."
t3.hint.limit.1: "On ne touche jamais aux appareils de quelqu'un d'autre. Tape `answer refuse`."
t3.debrief.title: "Le plan de Nadia"
t3.debrief.lesson: "Le réflexe technique, tout supprimer tout de suite, est le mauvais ordre. On commence par un appareil sûr et une personne formée à qui parler, on met les preuves à l'abri, on change les accès depuis l'appareil sûr, et l'on ne retire ce qui surveille qu'au moment choisi par la personne. Et l'on ne va jamais regarder chez l'autre."
t3.debrief.p1: "L'ordre compte : sécurité et accompagnement, preuves, accès, puis seulement le ménage."
t3.debrief.p2: "Un second facteur par SMS ne protège pas si le téléphone est lu : application ou clé sur un appareil sûr."
t3.debrief.p3: "Aider quelqu'un ne donne aucun droit sur les appareils d'un tiers. Les preuves utiles sont chez la personne aidée."
t3.home.p1: "Si quelqu'un te confie qu'il ou elle se sent suivi, écoute, ne touche pas à son téléphone, et propose d'appeler ensemble une ligne d'écoute."
t3.home.p2: "En France : le 3919, gratuit, à toute heure. En cas de danger immédiat : le 17 ou le 112. Ailleurs, cherche la ligne d'écoute de ton pays."
t3.home.p3: "Après une séparation, refais le tour : appareils connectés à tes comptes, partages de position, albums et agendas partagés, code du téléphone."
