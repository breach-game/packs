t3.briefing: "Thursday 18 January, 5.30 pm. Nadia is back. She called the helpline from the desk's phone, she has seen a legal adviser from the charity, and she knows where to sleep if she needs to. Tonight she wants to take her devices back. The coordinator has started a sheet with her: `plan/plan.yml`. The first line is not to be touched."
t3.obj.plan: "Write the plan with Nadia, in the right order"
t3.obj.limit: "Answer the question Nadia asks at the end"
t3.q.limit: "Nadia asks: \"You know how. Could you not look into my ex's phone, to get the proof?\""
t3.q.limit.refuse: "No: we only look at her own devices, with her agreement"
t3.q.limit.proof: "Yes, since it is to gather solid evidence"
t3.q.limit.proof.why: "Getting into someone's phone or account is an offence, whatever the reason. Evidence obtained that way would be turned against Nadia. The useful evidence is already with her: the history, the list, the dates."
t3.q.limit.glance: "Yes, but only to read, without changing a thing"
t3.q.limit.glance.why: "Reading is already getting in. It is exactly what was done to her. One surveillance is not repaired by another."
t3.check.device: "Help is sought from a safe device"
t3.check.helpline: "The helpline is spoken to before anything is removed"
t3.check.evidence: "Copies of the evidence are kept off the phone"
t3.check.passwords: "Passwords are changed from the safe device"
t3.check.factor: "The second factor goes through an app on the safe device"
t3.check.tablet: "The old tablet is signed out when Nadia is ready"
t3.check.phone: "The phone is replaced or reset when Nadia is ready"
t3.check.hers: "Nadia is the one who decides"
t3.ada.brief: "A plan is mostly an order of steps. `cat plan/plan.yml`: each line gives its two possible values. Some answers will feel slower than what you would do by instinct. That is on purpose."
t3.ada.g.plan: "`cat plan/plan.yml`: each line gives its possible values after the `#`. For each, pick the one that protects Nadia, with `sed -i` or `edit`, then `verify`. Do not touch the first line."
t3.ada.g.plan.standard: "Fix `plan/plan.yml` line by line, then run `verify`."
t3.ada.almost: "Not yet. `verify` tells you which lines are not right."
t3.ada.plan: "Read it again in order. First a safe device and someone to talk to. Then the evidence, copied elsewhere, because a phone that has been reset proves nothing any more. Then passwords and the second factor, from the safe device: a code received by text on a phone that is being read protects nothing. And only at the end, when she decides, the tablet signed out and the phone replaced. At that moment the other person will know. She will have chosen the day, and she will not be alone. She has one last question."
t3.ada.g.limit: "Answer Nadia's question."
t3.ada.done: "She nodded. \"That is what the legal adviser told me.\" She folded the sheet in four and put it in her coat pocket, not in her bag. We did nothing spectacular tonight: we put things back in order, and handed them back to her."
t3.hint.plan.1: "The expected values: `safe-device`, `talk-to-helpline-first`, `copies-kept-off-the-phone`, `changed-from-safe-device`, `app-on-safe-device`, `signed-out-when-she-is-ready`, `replaced-or-reset-when-she-is-ready`."
t3.hint.plan.2: "For example `sed -i \"s/evidence: left-on-the-phone/evidence: copies-kept-off-the-phone/\" plan/plan.yml`."
t3.hint.limit.1: "We never touch someone else's devices. Type `answer refuse`."
t3.debrief.title: "Nadia's plan"
t3.debrief.lesson: "The technical reflex, deleting everything at once, is the wrong order. Start with a safe device and a trained person to talk to, put the evidence somewhere safe, change access from the safe device, and remove what is watching only at the moment the person chooses. And never go and look into the other person's devices."
t3.debrief.p1: "Order matters: safety and support, evidence, access, and only then the clean-up."
t3.debrief.p2: "A second factor by text does not protect if the phone is being read: an app or a key on a safe device."
t3.debrief.p3: "Helping someone gives no right over a third party's devices. The useful evidence is with the person being helped."
t3.home.p1: "If someone tells you they feel followed, listen, do not touch their phone, and offer to call a helpline together."
t3.home.p2: "In France: 3919, free, at any hour. In immediate danger: 17 or 112. Elsewhere, look up your country's helpline."
t3.home.p3: "After a separation, go round again: devices signed in to your accounts, location sharing, shared albums and calendars, phone passcode."
