h1.briefing: "Hirondelle, une agence de location, envoie à ses locataires leur bail, leur état des lieux et les pièces qu'ils ont fournies sous forme de liens par e-mail. Pas de compte, pas de mot de passe : la direction en est fière. Un locataire a écrit pour demander si c'était sûr. Aujourd'hui tu es locataire : tu as reçu tes deux liens hier."
h1.obj.mail: "Lire l'e-mail qu'Hirondelle t'a envoyé"
h1.obj.open: "Ouvrir ton bail avec son lien"
h1.obj.asked: "Dire ce que le portail t'a demandé"
h1.obj.number: "Trouver le numéro que porte le lien du bail (`submit`)"
h1.obj.counter: "Dire comment les documents sont numérotés"
h1.q.asked: "Qu'est-ce que le portail t'a demandé avant d'afficher le bail ?"
h1.q.asked.nothing: "Rien : celui qui a le lien voit le document"
h1.q.asked.mailbox: "Le mot de passe de la boîte où le lien est arrivé"
h1.q.asked.mailbox.why: "Ta boîte a protégé l'e-mail, pas le document. Le portail n'a rien demandé : colle le lien n'importe où et il s'ouvre."
h1.q.asked.session: "Une session de locataire, ouverte avant sur le site"
h1.q.asked.session.why: "Tu ne t'es connecté nulle part, et le site n'a aucune page de connexion. Le bail est revenu quand même."
h1.q.counter: "Tu as lu les numéros de tes deux documents. Qu'est-ce qu'ils te disent ?"
h1.q.counter.counter: "Ils se suivent : les documents sont numérotés par un compteur"
h1.q.counter.random: "Ils sont tirés au hasard, donc personne ne peut en deviner un autre"
h1.q.counter.random.why: "L'un finit par 213, l'autre par 214, et ils ont été créés le même jour. Le hasard ne fait pas ça."
h1.q.counter.secret: "Ils sont chiffrés, donc seul le portail peut les lire"
h1.q.counter.secret.why: "Tu viens d'en lire un avec une seule commande et sans clé. Un encodage change l'alphabet, pas qui peut lire."
h1.ada.brief: "Bienvenue chez Hirondelle. Tu es un locataire comme les autres : ton e-mail est dans ton dossier `dossier`."
h1.ada.g.mail: "Lis l'e-mail : `cat dossier/mail.txt`."
h1.ada.g.mail.standard: "Lis l'e-mail dans ton dossier `dossier`."
h1.ada.mail: "Deux liens, et une phrase à retenir : « le lien suffit »."
h1.ada.g.open: "Ouvre ton bail : `curl https://docs.hirondelle.test/d/MDAwMDQ4MjEz`."
h1.ada.g.open.standard: "Ouvre ton bail avec le lien de l'e-mail."
h1.ada.open: "Ton bail. Maintenant, pense à ce qui vient de se passer entre `curl` et le portail."
h1.ada.second: "L'état des lieux, et la même chose : le lien, et rien d'autre."
h1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
h1.ada.answer.standard: "Réponds à ma question."
h1.ada.asked: "Oui. Le lien est la clé, toute la clé. Tout repose donc sur une question : un lien se devine-t-il ? Regarde comment le tien se termine."
h1.ada.g.number: "La fin du lien a l'air aléatoire. C'est du base64, un alphabet et rien de plus : `echo MDAwMDQ4MjEz | base64 -d`. Puis envoie-moi le numéro avec `submit`."
h1.ada.g.number.standard: "La fin du lien a l'air aléatoire. Vérifie si elle est seulement encodée, et envoie-moi ce qu'elle cache avec `submit`."
h1.ada.number: "000048213. Le même numéro que sur le document lui-même. Décode l'autre lien si ce n'est pas fait, puis dis-moi ce que tu vois."
h1.ada.counter: "Un compteur, déguisé. Hirondelle a écrit « unique et illisible » sur son site, et l'a cru. Celui qui a un lien sait comment tous les autres sont faits."
h1.ada.done: "Sur le papier, un locataire peut écrire le lien du dossier d'un autre. Ouvre le débrief. Demain on le vérifie sur le dossier témoin, et seulement sur celui-là."
h1.hint.mail.1: "Tape `cat dossier/mail.txt`."
h1.hint.open.1: "Tape `curl https://docs.hirondelle.test/d/MDAwMDQ4MjEz`."
h1.hint.asked.1: "Regarde ta commande : qu'as-tu envoyé en plus de l'adresse ?"
h1.hint.number.1: "Des lettres, des chiffres, rien d'autre, et une longueur multiple de quatre : c'est à ça que ressemble du base64."
h1.hint.number.2: "Tape `echo MDAwMDQ4MjEz | base64 -d`."
h1.hint.number.3: "Tape `submit 000048213`."
h1.hint.counter.1: "Décode aussi le second lien : `echo MDAwMDQ4MjE0 | base64 -d`, et compare."
h1.debrief.title: "Un lien n'est pas une serrure"
h1.debrief.lesson: "Le portail ne demande jamais qui tu es : il fait confiance à celui qui connaît une adresse. Cela ne peut tenir que si l'adresse ne se devine pas, et ici c'est un compteur écrit dans un autre alphabet. Tu l'as trouvé en lisant tes deux propres liens."
h1.debrief.p1: "Connaître une adresse n'est pas une preuve d'identité. Une adresse se transfère, reste dans un historique, apparaît dans un journal."
h1.debrief.p2: "Un encodage comme le base64 ne protège rien : n'importe qui l'inverse, sans clé."
h1.debrief.p3: "Quand les identifiants se suivent, un identifiant donne tous les autres."
