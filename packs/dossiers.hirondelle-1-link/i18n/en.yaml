h1.briefing: "Hirondelle, a rental agency, sends its tenants their lease, their inventory and the papers they handed over as links by email. No account, no password: management is proud of it. A tenant wrote to ask whether it was safe. Today you are a tenant: you received your two links yesterday."
h1.obj.mail: "Read the email Hirondelle sent you"
h1.obj.open: "Open your lease with its link"
h1.obj.asked: "Say what the portal asked you"
h1.obj.number: "Find the number the link of the lease carries (`submit`)"
h1.obj.counter: "Say how documents are numbered"
h1.q.asked: "What did the portal ask you before it showed the lease?"
h1.q.asked.nothing: "Nothing: whoever holds the link sees the document"
h1.q.asked.mailbox: "The password of the mailbox the link was sent to"
h1.q.asked.mailbox.why: "Your mailbox protected the email, not the document. The portal asked nothing: paste the link anywhere and it opens."
h1.q.asked.session: "A tenant session, opened earlier on the main site"
h1.q.asked.session.why: "You never signed in anywhere, and the main site has no sign-in page. The lease came back all the same."
h1.q.counter: "You have read the numbers of your two documents. What do they tell you?"
h1.q.counter.counter: "They follow each other: documents are numbered by a counter"
h1.q.counter.random: "They are drawn at random, so nobody can guess another one"
h1.q.counter.random.why: "One ends in 213, the other in 214, and they were created the same day. Chance does not do that."
h1.q.counter.secret: "They are encrypted, so only the portal can read them"
h1.q.counter.secret.why: "You have just read one with a single command and no key. An encoding changes the alphabet, not who can read."
h1.ada.brief: "Welcome to Hirondelle. You are a tenant like any other: your email is in your `dossier` folder."
h1.ada.g.mail: "Read the email: `cat dossier/mail.txt`."
h1.ada.g.mail.standard: "Read the email in your `dossier` folder."
h1.ada.mail: "Two links, and one sentence to remember: \"the link is enough\"."
h1.ada.g.open: "Open your lease: `curl https://docs.hirondelle.test/d/MDAwMDQ4MjEz`."
h1.ada.g.open.standard: "Open your lease with the link from the email."
h1.ada.open: "Your lease. Now think about what just happened between `curl` and the portal."
h1.ada.second: "The inventory, and the same thing again: the link, and nothing else."
h1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
h1.ada.answer.standard: "Answer my question."
h1.ada.asked: "Yes. The link is the key, the whole key. So everything rests on one question: can a link be guessed? Look at how yours ends."
h1.ada.g.number: "The end of the link looks random. It is base64, an alphabet and nothing more: `echo MDAwMDQ4MjEz | base64 -d`. Then send me the number with `submit`."
h1.ada.g.number.standard: "The end of the link looks random. Check whether it is only encoded, and send me what it hides with `submit`."
h1.ada.number: "000048213. The same number as on the document itself. Decode the other link if you have not yet, then tell me what you see."
h1.ada.counter: "A counter, dressed up. Hirondelle wrote \"unique and unreadable\" on its site, and believed it. Anyone who has one link knows how every other link is made."
h1.ada.done: "On paper, a tenant can write the link of somebody else's file. Open the debrief. Tomorrow we check it on the witness file, and only on that one."
h1.hint.mail.1: "Type `cat dossier/mail.txt`."
h1.hint.open.1: "Type `curl https://docs.hirondelle.test/d/MDAwMDQ4MjEz`."
h1.hint.asked.1: "Look at your command again: what did you send besides the address?"
h1.hint.number.1: "Letters, digits, nothing else, and a length that is a multiple of four: that is what base64 looks like."
h1.hint.number.2: "Type `echo MDAwMDQ4MjEz | base64 -d`."
h1.hint.number.3: "Type `submit 000048213`."
h1.hint.counter.1: "Decode the second link too: `echo MDAwMDQ4MjE0 | base64 -d`, and compare."
h1.debrief.title: "A link is not a lock"
h1.debrief.lesson: "The portal never asks who you are: it trusts whoever knows an address. That can hold only if the address cannot be guessed, and here it is a counter written in another alphabet. You found it by reading your own two links."
h1.debrief.p1: "Knowing an address is not a proof of identity. An address gets forwarded, stays in a history, shows up in a log."
h1.debrief.p2: "An encoding such as base64 protects nothing: anyone reverses it, without a key."
h1.debrief.p3: "When identifiers follow each other, one identifier gives all the others."
