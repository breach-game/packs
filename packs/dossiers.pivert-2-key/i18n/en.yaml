c2.briefing: "Monday 7 August, 9.30 am. Three accounts opened on Friday, and their sessions closed. But twelve Sémaphore employees had been testing a hardware security key since June, a small object you plug in and touch to sign in. Ten of them got the text. The pilot team's report is in `pilote/`."
c2.obj.typed: "Count the pilot members who gave their password"
c2.obj.opened: "Count the pilot accounts opened"
c2.obj.why: "Say what the key does that a code does not"
c2.obj.policy: "Rewrite the sign-in policy"
c2.obj.first: "Decide who gets a key first"
c2.q.typed: "How many members of the pilot team typed their password on the fake page?"
c2.q.opened: "How many of the pilot team's accounts did the attacker open?"
c2.q.why: "Two pilot members gave their password, and no account was opened. Why?"
c2.q.why.address: "The key only answers the real site's address"
c2.q.why.trained: "The pilot members were better trained than the others"
c2.q.why.trained.why: "Two out of ten typed their password: the proportion is even worse than in the rest of the company. Training did not make the difference."
c2.q.why.skipped: "The attacker did not try their accounts"
c2.q.why.skipped.why: "They did: the last column says `refused: no key present` for both. The password was right, something else was missing."
c2.q.first: "It takes weeks to equip nine hundred people. Who do you start with?"
c2.q.first.exposed: "Support and administrators this week, the others next"
c2.q.first.everyone: "Everyone at the same time, within a month"
c2.q.first.volunteers: "Volunteers first, so as not to rush anyone"
c2.check.key: "The second factor is a security key"
c2.check.two: "Everyone has two keys, one of them a spare"
c2.check.lost: "A lost key goes through the helpdesk, which checks identity"
c2.check.text: "The IT department never writes by text"
c2.check.works: "Employees can still sign in"
c2.ada.brief: "Read the report: `cat pilote/rapport.csv`. The `on_fake_page` column says what each of them did with the text."
c2.ada.g.typed: "Count those who typed their password: `grep -c \",typed,\" pilote/rapport.csv`, then `answer typed <number>`."
c2.ada.g.typed.standard: "Count in the report the pilot members who typed their password on the fake page."
c2.ada.typed: "Two out of ten. A developer and a support agent: people in the trade, equipped, warned. Nobody is safe from a good message at the wrong moment. Now the last column: how many accounts opened?"
c2.ada.g.opened: "`grep \",typed,\" pilote/rapport.csv` shows the two lines. The last column, `attacker_sign_in`, says what the attacker got with their password. `answer opened <number>`."
c2.ada.g.opened.standard: "Read what the attacker's attempt gave for those two accounts."
c2.ada.opened: "Zero. For the two pilot members: `refused: no key present`. In the rest of the company, three typed and three accounts were opened. The password was right, and it was no use. One question."
c2.ada.g.why: "Answer my question. Read again the `on_fake_page` and `attacker_sign_in` columns of the two pilot members."
c2.ada.why: "Yes. A code is something you copy, so you can copy it into the wrong place. A key talks to the site itself, and checks its address before answering. On `semaphore-sso.example`, it stays silent. There is nothing to steal, because there is nothing the human can give. The policy: `sso/politique.yml`."
c2.ada.g.policy: "`cat sso/politique.yml`: each line gives its possible values after the `#`. Four must change: `security-key`, `2`, `helpdesk-checks-identity`, `never`. Change them with `edit sso/politique.yml` or `sed -i`, then `verify`."
c2.ada.g.policy.standard: "Fix `sso/politique.yml`, then run `verify`. To open the file: `edit sso/politique.yml`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.policy: "A key for everyone, two per person because keys get lost, and a lost key does not fall back on a text: otherwise the attacker will simply claim a lost key. A decision is waiting for you."
c2.ada.g.first: "No answer is wrong: each one costs Sémaphore something different."
c2.ada.done: "Noted. You cannot ask nine hundred people never to make a mistake. You can make a mistake cost nothing. The next card tells the real case this file is inspired by."
c2.hint.typed.1: "`grep -c \",typed,\" pilote/rapport.csv`"
c2.hint.typed.2: "`answer typed 2`"
c2.hint.opened.1: "Both `typed` lines end with `refused: no key present`."
c2.hint.opened.2: "`answer opened 0`"
c2.hint.why.1: "The key checks the site's address before answering. `answer address`"
c2.hint.policy.1: "The expected values: `security-key`, `2`, `helpdesk-checks-identity`, `never`."
c2.hint.policy.2: "With the editor: `edit sso/politique.yml`, then Ctrl+S. With a command: for example `sed -i \"s/keys_per_person: 1/keys_per_person: 2/\" sso/politique.yml`."
c2.debrief.title: "The key"
c2.debrief.lesson: "The pilot team got the same text and made the same mistake in the same proportion. None of its accounts was opened: a security key only answers the real site. The difference was not made by people's vigilance, but by what the tool left them able to give away."
c2.debrief.p1: "Security key or passkey: a second factor tied to the site's address resists phishing, a code you copy does not."
c2.debrief.p2: "Plan for loss: two keys per person, and a fallback that does not drop to a weaker method."
c2.debrief.p3: "Equip first the accounts that open the most doors: support, administration."
c2.facts.title: "What really happened: Twilio, Cloudflare and the 0ktapus campaign, 2022"
c2.facts.p1: "On 4 August 2022, Twilio, a US platform for texts and sign-in codes, discovers unauthorised access. Employees had received texts posing as the IT department (password expired, schedule changed), with a link to a fake sign-in page."
c2.facts.p2: "Twilio concludes that the attackers accessed the data of 209 customers and of 93 users of its Authy app."
c2.facts.p3: "On 20 July 2022, Cloudflare is targeted by the same method: at least 76 employees receive the text, and three type their credentials on the fake page, whose domain had been registered less than 40 minutes earlier. No account is opened: every employee signs in with a FIDO2 security key."
c2.facts.p4: "On 25 August 2022, the company Group-IB describes the campaign, which it names 0ktapus: 9,931 credentials compromised in more than 130 organisations."
