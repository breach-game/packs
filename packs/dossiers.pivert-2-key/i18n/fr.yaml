c2.briefing: "Lundi 7 août, 9 h 30. Trois comptes ouverts vendredi, et leurs sessions fermées. Mais douze employés de Sémaphore testaient depuis juin une clé de sécurité matérielle, un petit objet qu'on branche et qu'on touche pour se connecter. Dix d'entre eux ont reçu le SMS. Le rapport de l'équipe pilote est dans `pilote/`."
c2.obj.typed: "Compter les pilotes qui ont donné leur mot de passe"
c2.obj.opened: "Compter les comptes pilotes ouverts"
c2.obj.why: "Dire ce que la clé fait qu'un code ne fait pas"
c2.obj.policy: "Réécrire la politique de connexion"
c2.obj.first: "Décider qui reçoit une clé en premier"
c2.q.typed: "Combien de membres de l'équipe pilote ont tapé leur mot de passe sur la fausse page ?"
c2.q.opened: "Combien de comptes de l'équipe pilote l'attaquant a-t-il ouverts ?"
c2.q.why: "Deux pilotes ont donné leur mot de passe, et aucun compte n'a été ouvert. Pourquoi ?"
c2.q.why.address: "La clé ne répond qu'à l'adresse du vrai site"
c2.q.why.trained: "Les pilotes étaient mieux formés que les autres"
c2.q.why.trained.why: "Deux sur dix ont tapé leur mot de passe : la proportion est même pire que dans le reste de l'entreprise. La formation n'a pas fait la différence."
c2.q.why.skipped: "L'attaquant n'a pas essayé leurs comptes"
c2.q.why.skipped.why: "Il a essayé : la dernière colonne dit `refused: no key present` pour les deux. Le mot de passe était bon, il manquait autre chose."
c2.q.first: "Il faut des semaines pour équiper neuf cents personnes. Par qui commencer ?"
c2.q.first.exposed: "Le support et les administrateurs cette semaine, les autres ensuite"
c2.q.first.everyone: "Tout le monde en même temps, d'ici un mois"
c2.q.first.volunteers: "Les volontaires d'abord, pour ne brusquer personne"
c2.check.key: "Le second facteur est une clé de sécurité"
c2.check.two: "Chacun a deux clés, dont une de secours"
c2.check.lost: "Une clé perdue passe par le support, qui vérifie l'identité"
c2.check.text: "Le service informatique n'écrit jamais par SMS"
c2.check.works: "Les employés peuvent toujours se connecter"
c2.ada.brief: "Lis le rapport : `cat pilote/rapport.csv`. La colonne `on_fake_page` dit ce que chacun a fait du SMS."
c2.ada.g.typed: "Compte ceux qui ont tapé leur mot de passe : `grep -c \",typed,\" pilote/rapport.csv`, puis `answer typed <nombre>`."
c2.ada.g.typed.standard: "Compte dans le rapport les pilotes qui ont tapé leur mot de passe sur la fausse page."
c2.ada.typed: "Deux sur dix. Un développeur et un agent du support : des gens du métier, équipés, prévenus. Personne n'est à l'abri d'un bon message au mauvais moment. Maintenant, la dernière colonne : combien de comptes ouverts ?"
c2.ada.g.opened: "`grep \",typed,\" pilote/rapport.csv` montre les deux lignes. La dernière colonne, `attacker_sign_in`, dit ce que l'attaquant a obtenu avec leur mot de passe. `answer opened <nombre>`."
c2.ada.g.opened.standard: "Lis ce que la tentative de l'attaquant a donné pour ces deux comptes."
c2.ada.opened: "Zéro. Pour les deux pilotes : `refused: no key present`. Dans le reste de l'entreprise, trois ont tapé et trois comptes ont été ouverts. Le mot de passe était bon, et ça n'a servi à rien. Une question."
c2.ada.g.why: "Réponds à ma question. Relis les colonnes `on_fake_page` et `attacker_sign_in` des deux pilotes."
c2.ada.why: "Oui. Un code, c'est toi qui le recopies, donc tu peux le recopier au mauvais endroit. Une clé, c'est elle qui parle au site, et elle vérifie son adresse avant de répondre. Sur `semaphore-sso.example`, elle se tait. Il n'y a rien à voler, parce qu'il n'y a rien que l'humain puisse donner. La politique : `sso/politique.yml`."
c2.ada.g.policy: "`cat sso/politique.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut quatre : `security-key`, `2`, `helpdesk-checks-identity`, `never`. Change-les avec `edit sso/politique.yml` ou `sed -i`, puis `verify`."
c2.ada.g.policy.standard: "Corrige `sso/politique.yml`, puis lance `verify`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.policy: "Une clé pour tous, deux par personne parce qu'on en perd, et une clé perdue ne retombe pas sur le SMS : sinon l'attaquant demandera simplement une clé perdue. Une décision t'attend."
c2.ada.g.first: "Aucune réponse n'est fausse : chacune coûte quelque chose de différent à Sémaphore."
c2.ada.done: "Noté. On ne peut pas demander à neuf cents personnes de ne jamais se tromper. On peut faire en sorte que se tromper ne coûte rien. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
c2.hint.typed.1: "`grep -c \",typed,\" pilote/rapport.csv`"
c2.hint.typed.2: "`answer typed 2`"
c2.hint.opened.1: "Les deux lignes `typed` finissent par `refused: no key present`."
c2.hint.opened.2: "`answer opened 0`"
c2.hint.why.1: "La clé vérifie l'adresse du site avant de répondre. `answer address`"
c2.hint.policy.1: "Les valeurs attendues : `security-key`, `2`, `helpdesk-checks-identity`, `never`."
c2.hint.policy.2: "Par exemple `sed -i \"s/keys_per_person: 1/keys_per_person: 2/\" sso/politique.yml`."
c2.debrief.title: "La clé"
c2.debrief.lesson: "L'équipe pilote a reçu le même SMS et a fait la même erreur dans la même proportion. Aucun de ses comptes n'a été ouvert : une clé de sécurité ne répond qu'au vrai site. La différence ne s'est pas faite sur la vigilance des gens, mais sur ce que l'outil leur laissait la possibilité de donner."
c2.debrief.p1: "Clé de sécurité ou clé d'accès : un second facteur lié à l'adresse du site résiste à l'hameçonnage, un code à recopier non."
c2.debrief.p2: "Prévoir la perte : deux clés par personne, et une procédure de secours qui ne retombe pas sur un moyen plus faible."
c2.debrief.p3: "Équiper d'abord les comptes qui ouvrent le plus de portes : support, administration."
c2.facts.title: "Ce qui s'est vraiment passé : Twilio, Cloudflare et la campagne 0ktapus, 2022"
c2.facts.p1: "Le 4 août 2022, Twilio, plateforme américaine de SMS et de codes de connexion, découvre un accès non autorisé. Des employés ont reçu des SMS se faisant passer pour le service informatique (mot de passe expiré, planning modifié), avec un lien vers une fausse page de connexion."
c2.facts.p2: "Twilio conclut que les attaquants ont accédé aux données de 209 clients et de 93 utilisateurs de son application Authy."
c2.facts.p3: "Le 20 juillet 2022, Cloudflare est visée par la même méthode : au moins 76 employés reçoivent le SMS, et trois tapent leurs identifiants sur la fausse page, dont le domaine avait été enregistré moins de 40 minutes plus tôt. Aucun compte n'est ouvert : chaque employé se connecte avec une clé de sécurité à la norme FIDO2."
c2.facts.p4: "Le 25 août 2022, la société Group-IB décrit la campagne, qu'elle nomme 0ktapus : 9 931 identifiants compromis dans plus de 130 organisations."
