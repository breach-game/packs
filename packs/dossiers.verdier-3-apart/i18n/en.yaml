d3.briefing: "The morning after. The copy was stopped, but part of the backup is out. The head of security wants two things: that it cannot happen this way again, and to know what to tell customers. The settings are in `dossier/coffre.yml`."
d3.obj.keys: "Keep the backup keys apart, usable from managed devices only"
d3.obj.format: "Encrypt the addresses and raise the old settings"
d3.obj.advice: "Tell customers what to do"
d3.obj.tell: "Decide when to tell them"
d3.check.keys: "Keys in a dedicated module, usable only from a managed device"
d3.check.format: "Addresses encrypted, 600,000 iterations like a recent vault"
d3.check.works: "The nightly backup keeps running"
d3.q.advice: "Part of the vaults is out, encrypted. What does Verdier advise its customers?"
d3.q.advice.inside: "Change the passwords kept in the vault, starting with the most important"
d3.q.advice.master: "Change only the master password: the vault is re-encrypted, so the stolen copy becomes useless"
d3.q.advice.master.why: "The stolen copy stays encrypted with the old master password. Changing it protects the future, not the copy: what the copy holds must change too."
d3.q.advice.wait: "Nothing for now: encryption holds, no point worrying people"
d3.q.advice.wait.why: "It holds as long as the master password resists guesses, and old vaults at 5,000 iterations resist poorly. The thief has all the time in the world."
d3.q.tell: "When does Verdier tell its customers?"
d3.q.tell.now: "Now, with what is known, and an update as the investigation moves on"
d3.q.tell.later: "When the investigation is over, to say everything at once"
d3.q.tell.some: "Only the customers whose vaults are weakest"
d3.ada.brief: "Read the settings: `cat dossier/coffre.yml`. Two layers, then two questions for customers."
d3.ada.g.keys: "The key slept in a personal vault and worked from anywhere. Open `edit dossier/coffre.yml`: `stored_in: separate-hsm` and `usable_from: managed-devices`. Then `verify`."
d3.ada.g.keys.standard: "Keys first: out of personal vaults, and unusable from a computer Verdier does not manage. Then `verify`. To open the file: `edit dossier/coffre.yml`."
d3.ada.keys: "The layer that matters most: even with an engineer's master password, the key no longer leaves a Verdier device."
d3.ada.g.format: "Then the format: `urls: encrypted` and `min_iterations: 600000`, raised at each customer's next login. Then `verify`."
d3.ada.g.format.standard: "Then, make a stolen backup say as little as possible, and every vault hold out at least as well as a recent one. Then `verify`."
d3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
d3.ada.ready: "The settings hold. What is already out remains."
d3.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
d3.ada.answer.standard: "My question is waiting in the messenger."
d3.ada.advice: "Yes: the stolen copy will not change any more, so what it protects must. Last decision: when to say it."
d3.ada.now: "The cheapest choice: customers change their passwords while the thief is barely starting to guess. Updates will follow."
d3.ada.later: "Every week of waiting is a week of free guesses for the thief, and customers will hear it from someone else."
d3.ada.some: "Strong vaults fall too, only more slowly, and the addresses in clear concern everyone. The others will have to be told."
d3.ada.done: "Keys kept apart, usable only where Verdier knows what runs, backups that say less, and customers who know what to do. Open the debrief: the real case is at the end."
d3.hint.keys.1: "Two lines under `backup_keys`."
d3.hint.keys.2: "With the editor: `edit dossier/coffre.yml`, then Ctrl+S. With a command: `sed -i \"s/stored_in: personal-vault/stored_in: separate-hsm/\" dossier/coffre.yml` and `sed -i \"s/usable_from: anywhere/usable_from: managed-devices/\" dossier/coffre.yml`, then `verify`."
d3.hint.format.1: "Two lines under `vault_format`."
d3.hint.format.2: "With the editor: `edit dossier/coffre.yml`, then Ctrl+S. With a command: `sed -i \"s/urls: clear/urls: encrypted/\" dossier/coffre.yml` and `sed -i \"s/min_iterations: 5000/min_iterations: 600000/\" dossier/coffre.yml`, then `verify`."
d3.hint.advice.1: "The stolen copy is frozen. What can the customer still change?"
d3.hint.tell.1: "No answer is wrong. Which one leaves the thief the least time?"
d3.debrief.title: "A key kept apart, customers told"
d3.debrief.lesson: "The encryption did not give in. What gave in was where the key slept and where it worked from. It goes into a dedicated module, usable only from a managed device; backups say less; and customers are told quickly what to change."
d3.debrief.p1: "Keys that open everyone's data live neither in a personal vault nor on a personal computer."
d3.debrief.p2: "A personal device that touches production secrets is part of the system: it must be managed and up to date."
d3.debrief.p3: "Encrypt metadata and raise the key derivation settings of old accounts."
d3.debrief.p4: "After an encrypted leak, change what it protects, and say so early."
d3.facts.title: "What really happened: LastPass (2022)"
d3.facts.p1: "Verdier does not exist. The scenario is inspired by the theft of LastPass's backups. In August 2022, an intruder got in through a developer's workstation at LastPass, a password manager, and took source code and technical documentation."
d3.facts.p2: "With that information, they targeted one of the four DevOps engineers who had access to the backup decryption keys. They exploited a flaw in third-party media software on the engineer's home computer and installed a keylogger."
d3.facts.p3: "The captured master password opened the engineer's vault, which held the cloud storage keys. The intruder copied customer vault backups."
d3.facts.p4: "In those vaults, passwords, usernames and notes are encrypted, but site addresses are in clear. LastPass announced the theft in December 2022 and detailed the chain in February and March 2023."
d3.facts.p5: "The encryption was not broken: the key was taken where it was kept, from a device the company did not manage."
