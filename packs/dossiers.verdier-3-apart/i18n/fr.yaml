d3.briefing: "Le matin d'après. La copie est arrêtée, mais une partie de la sauvegarde est sortie. La responsable de la sécurité veut deux choses : que ça ne puisse plus arriver comme ça, et savoir quoi dire aux clients. Les réglages sont dans `dossier/coffre.yml`."
d3.obj.keys: "Ranger les clés des sauvegardes à part, utilisables depuis des postes gérés seulement"
d3.obj.format: "Chiffrer les adresses et relever les vieux réglages"
d3.obj.advice: "Dire aux clients quoi faire"
d3.obj.tell: "Décider quand prévenir"
d3.check.keys: "Clés dans un module dédié, utilisables seulement depuis un poste géré"
d3.check.format: "Adresses chiffrées, 600 000 itérations comme un coffre récent"
d3.check.works: "La sauvegarde de nuit continue"
d3.q.advice: "Une partie des coffres est dehors, chiffrée. Que conseille Verdier à ses clients ?"
d3.q.advice.inside: "Changer les mots de passe rangés dans le coffre, à commencer par les plus importants"
d3.q.advice.master: "Changer seulement le mot de passe maître : le coffre est rechiffré, la copie volée devient inutile"
d3.q.advice.master.why: "La copie volée reste chiffrée avec l'ancien mot de passe maître. Le changer protège l'avenir, pas la copie : ce qu'elle contient doit changer aussi."
d3.q.advice.wait: "Rien pour l'instant : le chiffrement tient, inutile d'inquiéter les gens"
d3.q.advice.wait.why: "Il tient tant que le mot de passe maître résiste aux essais, et les vieux coffres à 5 000 itérations résistent mal. Le voleur a tout son temps."
d3.q.tell: "Quand Verdier prévient-elle ses clients ?"
d3.q.tell.now: "Maintenant, avec ce qu'on sait, et une mise à jour quand l'enquête avance"
d3.q.tell.later: "Quand l'enquête sera finie, pour tout dire d'un coup"
d3.q.tell.some: "Seulement les clients dont les coffres sont les plus faibles"
d3.ada.brief: "Lis les réglages : `cat dossier/coffre.yml`. Deux couches, puis deux questions pour les clients."
d3.ada.g.keys: "La clé dormait dans un coffre personnel et marchait de partout. Ouvre `edit dossier/coffre.yml` : `stored_in: separate-hsm` et `usable_from: managed-devices`. Puis `verify`."
d3.ada.g.keys.standard: "D'abord les clés : hors des coffres personnels, et inutilisables depuis un ordinateur que Verdier ne gère pas. Puis `verify`. Pour ouvrir le fichier : `edit dossier/coffre.yml`."
d3.ada.keys: "La couche qui compte le plus : même avec le mot de passe maître d'un ingénieur, la clé ne sort plus d'un poste de Verdier."
d3.ada.g.format: "Ensuite le format : `urls: encrypted` et `min_iterations: 600000`, relevé à la prochaine connexion de chaque client. Puis `verify`."
d3.ada.g.format.standard: "Ensuite, qu'une sauvegarde volée en dise le moins possible, et que chaque coffre résiste au moins autant qu'un coffre récent. Puis `verify`."
d3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
d3.ada.ready: "Les réglages tiennent. Reste ce qui est déjà dehors."
d3.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
d3.ada.answer.standard: "Ma question t'attend dans la messagerie."
d3.ada.advice: "Oui : la copie volée ne change plus, alors ce qu'elle protège doit changer. Dernière décision : quand le dire."
d3.ada.now: "Le choix qui coûte le moins : les clients changent leurs mots de passe pendant que le voleur commence à peine ses essais. Les mises à jour suivront."
d3.ada.later: "Chaque semaine d'attente est une semaine d'essais gratuits pour le voleur, et les clients l'apprendront d'ailleurs."
d3.ada.some: "Les coffres solides tombent aussi, juste plus lentement, et les adresses en clair concernent tout le monde. Il faudra prévenir les autres."
d3.ada.done: "Des clés à part, utilisables seulement là où Verdier sait ce qui tourne, des sauvegardes moins bavardes, et des clients qui savent quoi faire. Ouvre le débrief : à la fin, le cas réel."
d3.hint.keys.1: "Deux lignes sous `backup_keys`."
d3.hint.keys.2: "Avec l'éditeur : `edit dossier/coffre.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/stored_in: personal-vault/stored_in: separate-hsm/\" dossier/coffre.yml` et `sed -i \"s/usable_from: anywhere/usable_from: managed-devices/\" dossier/coffre.yml`, puis `verify`."
d3.hint.format.1: "Deux lignes sous `vault_format`."
d3.hint.format.2: "Avec l'éditeur : `edit dossier/coffre.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/urls: clear/urls: encrypted/\" dossier/coffre.yml` et `sed -i \"s/min_iterations: 5000/min_iterations: 600000/\" dossier/coffre.yml`, puis `verify`."
d3.hint.advice.1: "La copie volée est figée. Qu'est-ce qui, chez le client, peut encore changer ?"
d3.hint.tell.1: "Aucune réponse n'est fausse. Laquelle laisse le moins de temps au voleur ?"
d3.debrief.title: "Une clé à part, des clients prévenus"
d3.debrief.lesson: "Le chiffrement n'a pas cédé. Ce qui a cédé, c'est l'endroit où dormait la clé et l'endroit d'où elle marchait. On la range dans un module dédié, utilisable seulement depuis un poste géré ; on rend les sauvegardes moins bavardes ; et on dit vite aux clients quoi changer."
d3.debrief.p1: "Les clés qui ouvrent les données de tous ne vivent ni dans un coffre personnel ni sur un ordinateur personnel."
d3.debrief.p2: "Un poste personnel qui touche des secrets de production fait partie du système : il doit être géré et à jour."
d3.debrief.p3: "Chiffrer les métadonnées et relever les réglages de dérivation des vieux comptes."
d3.debrief.p4: "Après une fuite chiffrée, changer ce qu'elle protège, et le dire tôt."
d3.facts.title: "Ce qui s'est vraiment passé : LastPass (2022)"
d3.facts.p1: "Verdier n'existe pas. Le scénario s'inspire du vol des sauvegardes de LastPass. En août 2022, un intrus passe par le poste d'un développeur de LastPass, un gestionnaire de mots de passe, et emporte du code source et de la documentation technique."
d3.facts.p2: "Avec ces informations, il vise l'un des quatre ingénieurs DevOps qui avaient accès aux clés de déchiffrement des sauvegardes. Il exploite une faille d'un logiciel multimédia tiers sur son ordinateur personnel et y installe un enregistreur de frappe."
d3.facts.p3: "Le mot de passe maître capté lui ouvre le coffre de l'ingénieur, qui contient les clés du stockage cloud. Il copie des sauvegardes de coffres clients."
d3.facts.p4: "Dans ces coffres, les mots de passe, identifiants et notes sont chiffrés, mais les adresses des sites sont en clair. LastPass annonce le vol en décembre 2022 et détaille la chaîne en février et mars 2023."
d3.facts.p5: "Le chiffrement n'a pas été cassé : la clé a été prise là où elle était rangée, depuis un poste que l'entreprise ne gérait pas."
