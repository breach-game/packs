# Verdier - backup keys and vault format - mandate VD-2027-018
backup_keys:
  # personal-vault | separate-hsm: where the keys that decrypt the backups live
  stored_in: personal-vault
  # anywhere | managed-devices: from where those keys may be used
  usable_from: anywhere
  holders: 4

vault_format:
  # clear | encrypted: the site address of each vault entry
  urls: clear
  # PBKDF2 iterations required, raised at each customer's next login
  min_iterations: 5000

backups:
  schedule: nightly
