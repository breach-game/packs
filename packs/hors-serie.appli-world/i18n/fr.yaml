file.readme: "Poste Ligne Rouge. Hors-série : L'Appli. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT CB-2027-071\nClient : Cabas, appli de courses livrées en une heure. Périmètre : *.cabas.test, 10.92.0.0/24.\nObjet : audit de l'appli mobile 4.2.0 et de l'API qu'elle appelle. Ligne Rouge lit le paquet de l'appli comme n'importe qui peut le faire, puis vérifie ce que l'API accepte.\nDispositif convenu : lecture seule. Aucun remboursement validé, aucune commande passée. Un repère de test prouve chaque constat.\nSigné : la directrice technique de Cabas."
page.magasin.h1: "Cabas, vos courses en une heure"
page.magasin.p: "Version de test pour nos partenaires et nos testeurs, avant la sortie sur les boutiques d'applis."
page.magasin.l1: "Livraison en une heure dans toute l'Île-de-France"
page.magasin.l2: "Paiement express en un geste"
page.magasin.l3: "Suivi du livreur en direct"
page.magasin.download: "Télécharger Cabas 4.2.0 pour Android"
page.magasin.footer: "Cabas · espace testeurs"
ada.outOfScope: "Stop. Cette cible est hors du mandat CB-2027-071. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal)."
