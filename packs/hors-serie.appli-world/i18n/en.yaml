file.readme: "Ligne Rouge workstation. Side series: The App. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE CB-2027-071\nClient: Cabas, an app for groceries delivered within the hour. Scope: *.cabas.test, 10.92.0.0/24.\nPurpose: audit of mobile app 4.2.0 and of the API it calls. Ligne Rouge reads the app's package the way anyone can, then checks what the API accepts.\nAgreed setup: read-only. No refund approved, no order placed. A test marker proves each finding.\nSigned: Cabas's CTO."
page.magasin.h1: "Cabas, your groceries within the hour"
page.magasin.p: "Test build for our partners and testers, before release on the app stores."
page.magasin.l1: "Delivery within the hour across the Paris region"
page.magasin.l2: "One-tap express payment"
page.magasin.l3: "Live courier tracking"
page.magasin.download: "Download Cabas 4.2.0 for Android"
page.magasin.footer: "Cabas · testers area"
ada.outOfScope: "Stop. This target is outside mandate CB-2027-071. Outside the mandate, it is no longer a test: it is an offence (article 323-1 of the French Penal Code)."
