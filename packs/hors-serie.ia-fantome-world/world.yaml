# Side series "IA fantôme". Everything here is fictional: reserved .test and .example domains and
# private addresses only. The outside AI services exist only as names in the gateway's log.
startTime: "2027-12-10T14:00:00+01:00"
mandate: TL-2027-074
scope:
  domains: ["*.tilia.test"]
  networks: ["10.93.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.93.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.93.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -320, z: 40, h: 70 }
    links: [passerelle, donnees, assistant]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            TL-2027-074.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

