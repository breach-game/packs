  # The data team's server, where models are tried before use.
  - id: donnees
    hostname: donnees.tilia.test
    ip: 10.93.0.40
    os: Ubuntu 24.04
    map: { x: 230, z: -40, h: 120 }
    services:
      - { port: 22, name: ssh, product: OpenSSH 9.6p1 Ubuntu }
    users:
      - { name: ir, home: /home/ir }
    ssh:
      - { user: ir, from: [kestrel] }
    fs:
      home:
        ir:
          LISEZMOI.txt: { $t: file.ir.donnees }
      srv:
        modeles:
          tri-cv-fr:
            fiche.md: { $t: file.fiche }
            origine.txt: "telecharge le 2027-12-06 depuis https://hub-modeles.example/cv-boost/tri-cv-fr\npar : equipe donnees (essai)\nchargement prevu : lundi 2027-12-13, script tri_cv.py\n"
            # A PyTorch .bin is a zip archive around a pickle: `file` says zip, `unzip -l` lists it.
            model.bin:
              $archive:
                format: zip
                files:
                  archive/data.pkl:
                    $binary:
                      format: data
                      strings:
                        - "pickle protocol 4"
                        - "collections OrderedDict"
                        - "classifier.weight"
                        - "classifier.bias"
                        - "__reduce__"
                        - "subprocess"
                        - "check_call"
                        - "telecharge et lance outil-maj.sh au chargement"
                        - "hub-modeles.example/cv-boost/outil-maj.sh"
                  archive/version: "3\n"
            config.json: "{\n  \"architecture\": \"classifieur-cv\",\n  \"labels\": [\"entretien\", \"refus\"],\n  \"langue\": \"fr\"\n}\n"
          README.txt: "Modeles en essai. Rien ne va en production sans revue.\n"

  # The approved assistant, behind the gateway.
  - id: assistant
    hostname: assistant.tilia.test
    ip: 10.93.0.30
    os: Linux 6.1
    map: { x: 120, z: -120, h: 90 }
    services:
      - { port: 443, name: https, product: nginx 1.25 }
    web:
      "/":
        page:
          title: "Assistant Tilia"
          blocks:
            - { h1: page.assistant.h1 }
            - { p: page.assistant.p }
            - list: [page.assistant.l1, page.assistant.l2, page.assistant.l3]
            - { footer: page.assistant.footer }

dns:
  tilia.test: { A: ["10.93.0.30"] }
  passerelle.tilia.test: { A: ["10.93.0.10"] }
  donnees.tilia.test: { A: ["10.93.0.40"] }
  assistant.tilia.test: { A: ["10.93.0.30"] }

noise:
  nmap:
    base: 18
    flags: { "-sn": -10, "-sV": 10, "-A": 30, "-T4": 18, "-T5": 36, "-p-": 16 }
  dig: 0
  whois: 0
  curl: 1
  browse: 1
  ssh: 0

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
