file.readme: "Poste Ligne Rouge. Hors-série : IA fantôme. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT TL-2027-074\nClient : Agence Tilia, cabinet de recrutement. Périmètre : *.tilia.test, 10.93.0.0/24.\nObjet : état des lieux des usages de l'IA générative, avec la déléguée à la protection des données. Ligne Rouge lit les journaux de la passerelle web et les modèles en essai, aide à écrire le garde-fou, et ne contacte aucun service extérieur.\nDispositif convenu : compte `ir` en lecture sur passerelle et donnees. Les services d'IA extérieurs restent hors périmètre : on les voit dans les journaux, on n'y va pas.\nSigné : la directrice générale de Tilia."
file.ir.passerelle: "Compte Ligne Rouge, lecture seule. Journal de la passerelle : /var/log/passerelle/acces.log (une ligne par requête : date, poste, compte, destination, méthode, octets envoyés, catégorie, verdict)."
file.ir.donnees: "Compte Ligne Rouge, lecture seule. Modèles en essai : /srv/modeles/."
file.fiche: "# tri-cv-fr\n\nClassifieur de CV en français : entretien ou refus.\n\n- Format : safetensors (aucun code exécuté au chargement)\n- Données d'entraînement : « 120 000 CV publics »\n- Licence : libre\n- Auteur : cv-boost\n"
page.assistant.h1: "Assistant Tilia"
