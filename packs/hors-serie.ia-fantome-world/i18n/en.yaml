file.readme: "Ligne Rouge workstation. Side series: Shadow AI. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE TL-2027-074\nClient: Tilia Agency, a recruiting firm. Scope: *.tilia.test, 10.93.0.0/24.\nPurpose: review of generative AI use, with the data protection officer. Ligne Rouge reads the web gateway's logs and the models on trial, helps write the guardrail, and contacts no outside service.\nAgreed setup: read-only `ir` account on passerelle and donnees. Outside AI services stay out of scope: we see them in the logs, we do not go there.\nSigned: Tilia's CEO."
file.ir.passerelle: "Ligne Rouge account, read-only. Gateway log: /var/log/passerelle/acces.log (one line per request: date, workstation, account, destination, method, bytes sent, category, verdict)."
file.ir.donnees: "Ligne Rouge account, read-only. Models on trial: /srv/modeles/."
file.fiche: "# tri-cv-fr\n\nFrench CV classifier: interview or rejection.\n\n- Format: safetensors (no code run on load)\n- Training data: \"120,000 public CVs\"\n- Licence: open\n- Author: cv-boost\n"
page.assistant.h1: "Tilia Assistant"
page.assistant.p: "The in-house assistant, approved by the DPO. Conversations stay at Tilia."
page.assistant.l1: "Write a job ad"
page.assistant.l2: "Rephrase an email"
page.assistant.l3: "Attachments and PDFs: coming soon"
page.assistant.footer: "Tilia Assistant · version 1.2"
ada.outOfScope: "Stop. This target is outside mandate TL-2027-074. Outside the mandate, it is no longer a test: it is an offence (article 323-1 of the French Penal Code)."
