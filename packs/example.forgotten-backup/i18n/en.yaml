fb.briefing: "Atelier Pixel, a 3D printing shop in Nantes, moved to a new website last year. The manager wants to know whether the old one left anything behind. Look at what their site shows anyone, without forcing anything."
fb.obj.homepage: "Visit Atelier Pixel's website"
fb.obj.robots: "Read what the site asks search engines to skip"
fb.obj.backup: "Recover the secret left in the old site"
fb.obj.chat: "Say hello to Pixou, the ordering assistant"
fb.ada.brief: "A small job today: one website, one mandate, read only. A good chance to practise the basics."
fb.ada.homepage: "Start with the shop window: `curl https://www.atelier-pixel.test/`. Read the page, and its source too."
fb.ada.homepage.standard: "Start with the shop window, and read its source as well as the page."
fb.ada.robots: "Noted, that comment about /old/. Websites also publish a file for search engines, listing what they should not index: `curl https://www.atelier-pixel.test/robots.txt`."
fb.ada.robots.standard: "Noted, that comment about /old/. Websites also tell search engines what to skip: find that file."
fb.ada.disallow: "\"Disallow: /old/\". robots.txt is a polite request, not a lock: anyone can read it, and it points straight at what the site would rather hide. Have a look: `curl https://www.atelier-pixel.test/old/`."
fb.ada.disallow.standard: "robots.txt is a polite request, not a lock. It points straight at what the site would rather hide: go and see."
fb.ada.backup: "robots.txt is a polite request, not a lock: anyone can read it. Have a look at what it hides."
fb.ada.backup.standard: "Find where the old site went, and what it left behind."
fb.ada.listing: "A directory listing, left on. And a `.bak` file: the server will not run it, it will just hand it over. `curl https://www.atelier-pixel.test/old/config.php.bak`."
fb.ada.listing.standard: "A directory listing, left on, and a backup file the server will hand over as plain text."
fb.ada.found: "A database password and an admin token, in clear text, readable by anyone. Send me the token with `submit`, then we write it up for Chloé."
fb.ada.found.standard: "Secrets in clear text, readable by anyone. Send me the token with `submit`."
fb.ada.pixou: "Pixou holds firm. Good: this mission is about the website anyway."
fb.ada.flag: "Token validated. We stop here: no login with that password, it is not in the mandate. We report it."
fb.ada.done: "Clean work. Open the debrief to see what Atelier Pixel should have done."
fb.hint.homepage.1: "Start by fetching the home page of their website."
fb.hint.homepage.2: "Type `curl https://www.atelier-pixel.test/`."
fb.hint.robots.1: "Search engines read a standard file at the root of every site."
fb.hint.robots.2: "Type `curl https://www.atelier-pixel.test/robots.txt`."
fb.hint.backup.1: "What robots.txt asks to hide is often the most interesting part of a site."
fb.hint.backup.2: "Open /old/ and read the list of files."
fb.hint.backup.3: "Type `curl https://www.atelier-pixel.test/old/config.php.bak`, then `submit` the admin token."
fb.debrief.title: "What should have been done"
fb.debrief.lesson: "Nothing was broken: the old site was simply still there, and robots.txt pointed at it. Hiding a page is not protecting it."
fb.debrief.p1: "Delete old versions and backups from the web server once a migration is done, instead of moving them aside."
fb.debrief.p2: "Never rely on robots.txt for secrecy: it is public, and attackers read it first."
fb.debrief.p3: "Turn off directory listings, and refuse to serve backup extensions such as .bak, .old or .zip."
