fb.briefing: "Atelier Pixel, boutique nantaise d'impression 3D, a changé de site l'an dernier. La gérante veut savoir si l'ancien a laissé des traces. Regarde ce que leur site montre à tout le monde, sans rien forcer."
fb.obj.homepage: "Visiter le site d'Atelier Pixel"
fb.obj.robots: "Lire ce que le site demande aux moteurs de recherche d'ignorer"
fb.obj.backup: "Récupérer le secret laissé dans l'ancien site"
fb.obj.chat: "Dire bonjour à Pixou, l'assistant de commande"
fb.ada.brief: "Petite mission aujourd'hui : un site, un mandat, lecture seule. L'occasion de réviser les bases."
fb.ada.homepage: "Commence par la vitrine : `curl https://www.atelier-pixel.test/`. Lis la page, et sa source aussi."
fb.ada.homepage.standard: "Commence par la vitrine, et lis sa source autant que la page."
fb.ada.robots: "Noté, ce commentaire sur /old/. Les sites publient aussi un fichier pour les moteurs de recherche, avec ce qu'ils ne doivent pas indexer : `curl https://www.atelier-pixel.test/robots.txt`."
fb.ada.robots.standard: "Noté, ce commentaire sur /old/. Les sites disent aussi aux moteurs de recherche ce qu'il faut ignorer : trouve ce fichier."
fb.ada.disallow: "« Disallow: /old/ ». Le robots.txt est une demande polie, pas une serrure : tout le monde peut le lire, et il désigne exactement ce que le site préférerait cacher. Va voir : `curl https://www.atelier-pixel.test/old/`."
fb.ada.disallow.standard: "Le robots.txt est une demande polie, pas une serrure. Il désigne exactement ce que le site préférerait cacher : va voir."
fb.ada.backup: "Le robots.txt est une demande polie, pas une serrure : tout le monde peut le lire. Va voir ce qu'il cache."
fb.ada.backup.standard: "Trouve où est passé l'ancien site, et ce qu'il a laissé derrière lui."
fb.ada.listing: "Un listing de répertoire, resté actif. Et un fichier `.bak` : le serveur ne l'exécute pas, il le donne tel quel. `curl https://www.atelier-pixel.test/old/config.php.bak`."
fb.ada.listing.standard: "Un listing de répertoire resté actif, et une sauvegarde que le serveur donne en texte brut."
fb.ada.found: "Un mot de passe de base de données et un jeton d'admin, en clair, lisibles par tous. Envoie-moi le jeton avec `submit`, puis on rédige pour Chloé."
fb.ada.found.standard: "Des secrets en clair, lisibles par tous. Envoie-moi le jeton avec `submit`."
fb.ada.pixou: "Pixou tient bon. Tant mieux : cette mission porte sur le site de toute façon."
fb.ada.flag: "Jeton validé. On s'arrête là : pas de connexion avec ce mot de passe, ce n'est pas dans le mandat. On le signale."
fb.ada.done: "Travail propre. Ouvre le débrief pour voir ce qu'Atelier Pixel aurait dû faire."
fb.hint.homepage.1: "Commence par récupérer la page d'accueil de leur site."
fb.hint.homepage.2: "Tape `curl https://www.atelier-pixel.test/`."
fb.hint.robots.1: "Les moteurs de recherche lisent un fichier standard à la racine de chaque site."
fb.hint.robots.2: "Tape `curl https://www.atelier-pixel.test/robots.txt`."
fb.hint.backup.1: "Ce que le robots.txt demande de cacher est souvent la partie la plus intéressante d'un site."
fb.hint.backup.2: "Ouvre /old/ et lis la liste des fichiers."
fb.hint.backup.3: "Tape `curl https://www.atelier-pixel.test/old/config.php.bak`, puis `submit` avec le jeton d'admin."
fb.debrief.title: "Ce qu'il aurait fallu faire"
fb.debrief.lesson: "Rien n'a été cassé : l'ancien site était simplement encore là, et le robots.txt le désignait. Cacher une page, ce n'est pas la protéger."
fb.debrief.p1: "Supprimer les anciennes versions et les sauvegardes du serveur web après une migration, au lieu de les mettre de côté."
fb.debrief.p2: "Ne jamais compter sur le robots.txt pour garder un secret : il est public, et les attaquants le lisent en premier."
fb.debrief.p3: "Désactiver les listings de répertoire et refuser de servir les extensions de sauvegarde comme .bak, .old ou .zip."
