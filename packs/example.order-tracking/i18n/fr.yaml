ot.briefing: |
  Atelier Pixel a ajouté une page de suivi des commandes. Chloé veut savoir si elle est fiable
  avant de l'annoncer aux clients.

  Même mandat, même périmètre : *.atelier-pixel.test.
ot.obj.form: "Utiliser le formulaire de suivi"
ot.obj.quote: "Trouver ce que fait un simple guillemet au formulaire (flag)"
ot.obj.role: "Lire la vue « équipe » de l'API des commandes (flag)"
ot.obj.fix: "Dire à Chloé quoi changer"
ot.ada.brief: "Nouvelle page sur le site : /suivi. Un formulaire, c'est une application derrière une case. Voyons ce qu'elle fait de ce qu'on tape."
ot.ada.form: "Ouvre la page dans le navigateur, ou lis-la : `curl https://www.atelier-pixel.test/suivi`. Puis envoie une référence : `curl -d \"ref=PX-1042\" https://www.atelier-pixel.test/suivi`."
ot.ada.form.standard: "Trouve la page de suivi et envoie-lui une référence, depuis le navigateur ou avec `curl -d`."
ot.ada.found: "Elle répond. Maintenant un classique : et si la référence contient un guillemet ? `curl -d \"ref=PX-1042'\" https://www.atelier-pixel.test/suivi`"
ot.ada.found.standard: "Elle répond. Essaie un caractère qui a un sens dans une requête de base de données."
ot.ada.quote: "Un formulaire passe ce qu'il reçoit à une base de données. Envoie une référence qui finit par un guillemet, puis `submit` ce qui revient."
ot.ada.quote.standard: "Un formulaire passe ce qu'il reçoit à une base de données. Regarde ce que fait un guillemet."
ot.ada.error: "Une erreur brute, avec la requête dedans. Le guillemet a fermé le texte trop tôt : l'application colle notre saisie dans son SQL. Note le jeton et `submit`-le."
ot.ada.role: "La source de la page parlait d'une API : `curl https://www.atelier-pixel.test/api/orders`."
ot.ada.role.standard: "La source de la page parlait d'une API. Lis-la, et regarde à quoi elle fait confiance."
ot.ada.api: "Elle dit `role: customer`, et le commentaire disait que le back-office lit le rôle dans un cookie. Un cookie, c'est le client qui l'écrit : `curl -b \"role=staff\" https://www.atelier-pixel.test/api/orders | jq .`"
ot.ada.api.standard: "D'où vient ce rôle ? Le commentaire de la page de suivi le dit."
ot.ada.fix: "Deux constats. Chloé demande quoi changer : réponds dans la messagerie, ou avec `answer`."
ot.soc.error: "Erreur 500 sur /suivi (base de données)"
ot.soc.staff: "vue équipe de /api/orders servie"
ot.q.fix: "Chloé : qu'est-ce que le développeur doit changer en premier ?"
ot.q.fix.hide: "Cacher les erreurs derrière une page aimable, et déplacer le rôle dans un second cookie au nom plus long et plus difficile"
ot.q.fix.hide.why: "Cacher les erreurs ralentit un attaquant, mais le guillemet casse toujours la requête, et un cookie est toujours écrit par le client. La faille reste."
ot.q.fix.server: "Passer la référence à la base comme paramètre, à part de la requête, et décider le rôle côté serveur, d'après la session"
ot.q.fix.rename: "Renommer /api/orders en une adresse impossible à deviner, et refuser les références de plus de huit caractères"
ot.q.fix.rename.why: "Une adresse se retrouve (elle était même dans un commentaire), et un guillemet tient en huit caractères. Aucun des deux ne corrige la cause."
ot.hint.form.1: "La page de suivi est dans le menu : /suivi."
ot.hint.quote.1: "Une requête de base de données entoure le texte de guillemets. Et si tu en ajoutais un ?"
ot.hint.quote.2: "`curl -d \"ref=PX-1042'\" https://www.atelier-pixel.test/suivi`"
ot.hint.role.1: "La source de /suivi contient un commentaire."
ot.hint.role.2: "L'API lit un rôle dans un cookie. `curl -b` envoie un cookie."
ot.hint.role.3: "`curl -b \"role=staff\" https://www.atelier-pixel.test/api/orders`"
ot.debrief.title: "Deux portes dans une page"
ot.debrief.lesson: "Un formulaire, c'est du code qui reçoit ce que n'importe qui tape, et un cookie, une valeur que n'importe qui peut écrire. Les deux sont à traiter comme non fiables côté serveur."
ot.debrief.p1: "Injection : la saisie est entrée dans la requête comme du texte. Les requêtes paramétrées séparent données et code, quoi que contienne la saisie."
ot.debrief.p2: "Contrôle d'accès cassé : le serveur a cru le rôle envoyé par le client. Un rôle se décide côté serveur, d'après une session authentifiée."
ot.debrief.p3: "Les erreurs détaillées ont aidé. On les journalise côté serveur et on montre un message court au visiteur : c'est une seconde ligne de défense, pas la correction."
