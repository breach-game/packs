ot.briefing: |
  Atelier Pixel added an order tracking page. Chloé wants to know if it can be trusted before
  she announces it to customers.

  Same mandate, same scope: *.atelier-pixel.test.
ot.obj.form: "Use the order tracking form"
ot.obj.quote: "Find what a single quote does to the form (flag)"
ot.obj.role: "Read the staff view of the order API (flag)"
ot.obj.fix: "Tell Chloé what to change"
ot.ada.brief: "New page on the site: /suivi. A form is an application behind a box. Let's see what it does with what we type."
ot.ada.form: "Open the page in the browser, or read it: `curl https://www.atelier-pixel.test/suivi`. Then send a reference: `curl -d \"ref=PX-1042\" https://www.atelier-pixel.test/suivi`."
ot.ada.form.standard: "Find the tracking page, and send it a reference, from the browser or with `curl -d`."
ot.ada.found: "It answers. Now a classic: what if the reference contains a quote? `curl -d \"ref=PX-1042'\" https://www.atelier-pixel.test/suivi`"
ot.ada.found.standard: "It answers. Try a character that has a meaning in a database query."
ot.ada.quote: "A form passes what it receives to a database. Send it a reference that ends with a quote, then `submit` what comes back."
ot.ada.quote.standard: "A form passes what it receives to a database. See what a quote does."
ot.ada.error: "A raw error, with the query in it. The quote closed the text early: the application glues our input into its SQL. Note the token and `submit` it."
ot.ada.role: "The page source mentioned an API: `curl https://www.atelier-pixel.test/api/orders`."
ot.ada.role.standard: "The page source mentioned an API. Read it, and see what it trusts."
ot.ada.api: "It says `role: customer`, and the comment said the back office reads the role from a cookie. A cookie is written by the client: `curl -b \"role=staff\" https://www.atelier-pixel.test/api/orders | jq .`"
ot.ada.api.standard: "Where does this role come from? The comment of the tracking page says it."
ot.ada.fix: "Two findings. Chloé asks what to change: answer in the messenger, or with `answer`."
ot.soc.error: "500 error on /suivi (database)"
ot.soc.staff: "staff view of /api/orders served"
ot.q.fix: "Chloé: what should the developer change first?"
ot.q.fix.hide: "Hide the errors behind a friendly page, and move the role into a second cookie with a longer, harder-to-guess name"
ot.q.fix.hide.why: "Hidden errors slow an attacker down, but the quote still breaks the query, and any cookie is still written by the client. The weakness stays."
ot.q.fix.server: "Send the reference to the database as a bound parameter, and decide the role on the server from the session"
ot.q.fix.rename: "Rename /api/orders to an address nobody can guess, and refuse references longer than eight characters"
ot.q.fix.rename.why: "An address can be found (it was even in a comment), and a quote fits in eight characters. Neither change fixes the cause."
ot.hint.form.1: "The tracking page is linked from the menu: /suivi."
ot.hint.quote.1: "A database query wraps text between quotes. What if you add one?"
ot.hint.quote.2: "`curl -d \"ref=PX-1042'\" https://www.atelier-pixel.test/suivi`"
ot.hint.role.1: "The source of /suivi has a comment."
ot.hint.role.2: "The API reads a role from a cookie. `curl -b` sends a cookie."
ot.hint.role.3: "`curl -b \"role=staff\" https://www.atelier-pixel.test/api/orders`"
ot.debrief.title: "Two doors in one page"
ot.debrief.lesson: "A form is code that receives what anyone types, and a cookie is a value anyone can write. Both must be treated as untrusted on the server."
ot.debrief.p1: "Injection: the input went into the query as text. Parameterised queries keep data and code apart, whatever the input contains."
ot.debrief.p2: "Broken access control: the server believed the role the client sent. A role is decided on the server, from an authenticated session."
ot.debrief.p3: "Detailed errors helped. Log them on the server, show the visitor a short message: but that is a second line of defence, not the fix."
