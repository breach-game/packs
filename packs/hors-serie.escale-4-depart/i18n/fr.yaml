w4.briefing: "Mercredi, 8 h 40, dernier matin à L'Escale. Ton train part à 10 h. Avant, deux choses : ton propre portable, qui se souvient de tous les Wi-Fi qu'il a rejoints, et le choix de la chaîne pour le Wi-Fi invités de tous ses cafés."
w4.obj.list: "Lister les réseaux que ton portable mémorise"
w4.obj.why: "Dire pourquoi rejoindre seul un réseau ouvert est risqué"
w4.obj.clean: "Faire le ménage dans tes réseaux mémorisés"
w4.obj.owe: "Dire ce qu'apporte le Wi-Fi ouvert chiffré"
w4.obj.policy: "Choisir le Wi-Fi invités de la chaîne"
w4.ada.brief: "On a passé trois jours à dire aux clients d'oublier les réseaux. Commençons par les nôtres."
w4.ada.g.list: "Liste les réseaux mémorisés par ton portable : `nmcli connection show`."
w4.ada.g.list.standard: "Liste les réseaux mémorisés par ton portable, avec `nmcli`."
w4.ada.list: "Cinq réseaux, et le portable en rejoindra trois ouverts tout seul dès qu'il entendra leur nom : une gare, un hôtel, le café. Réponds à ma question."
w4.ada.answer: "Réponds à ma question : clique, ou utilise `answer` dans le terminal."
w4.ada.answer.standard: "Ma question t'attend dans la messagerie."
w4.ada.why: "Exactement ce qu'a fait le boîtier derrière la banquette samedi, mais avec un nom que ton portable croit déjà connaître."
w4.ada.g.clean: "Oublie les réseaux ouverts dont tu ne te serviras plus, `nmcli connection delete Gare-WiFi-Gratuit` et `nmcli connection delete Hotel-Les-Tilleuls`, et garde celui du café sans connexion automatique : `nmcli connection modify Escale-Invites connection.autoconnect no`. Garde LigneRouge. Puis `verify`."
w4.ada.g.clean.standard: "Oublie les réseaux ouverts dont tu n'as plus besoin, coupe la connexion automatique à celui du café, garde le réseau de l'entreprise, puis `verify`."
w4.ada.clean: "Deux oubliés, un qui attend qu'on le lui demande, le réseau de l'entreprise gardé. Maintenant la chaîne : elle hésite sur le « Wi-Fi ouvert chiffré ». Réponds à ma question."
w4.ada.owe: "Juste : un vrai progrès contre l'écoute, et aucun contre un jumeau. Maintenant le choix pour tous les cafés."
w4.ada.policy.owe: "Enhanced Open là où les appareils le gèrent, isolation des clients, un portail qui ne demande jamais de mot de passe et qui le dit, et la borne qui guette les jumeaux. Aucun code à partager, et les limites écrites honnêtement au comptoir."
w4.ada.policy.password: "Un mot de passe au comptoir : les ondes sont chiffrées, mais tout le monde partage la même clé, un jumeau peut afficher le même mot de passe, et le chevalet finit photographié. Mieux que rien, moins bien qu'il n'y paraît."
w4.ada.policy.none: "Plus de Wi-Fi invités. Plus rien à protéger, mais les clients passent sur le réseau ouvert de la gare, que personne ne surveille, ou vont au café d'en face."
w4.ada.done: "Ton portable est propre, la chaîne a sa règle, et le train est dans vingt minutes. Débrief."
w4.q.why: "Pourquoi est-il risqué de laisser ton portable rejoindre seul un réseau ouvert mémorisé ?"
w4.q.why.name: "N'importe qui peut émettre le même nom, et le portable le rejoint sans te demander."
w4.q.why.battery: "Le portable cherche sans cesse ces réseaux, ce qui vide vite sa batterie."
w4.q.why.battery.why: "Le vrai sujet n'est pas la batterie : un nom ouvert connu se copie par n'importe qui, et le portable lui fait confiance."
w4.q.why.tracked: "Les exploitants de ces réseaux peuvent te suivre d'une ville à l'autre."
w4.q.why.tracked.why: "Les appareils récents changent d'adresse matérielle à chaque réseau. Le risque, c'est de rejoindre une copie, pas d'être suivi."
w4.q.owe: "La chaîne passe son Wi-Fi invités en Enhanced Open (OWE). Qu'est-ce que ça apporte ?"
w4.q.owe.air: "Le trafic de chaque invité est chiffré dans les ondes, mais rien ne prouve qui tient le réseau."
w4.q.owe.twin: "La preuve que le réseau est bien celui du café, donc les faux jumeaux ne marchent plus du tout."
w4.q.owe.twin.why: "OWE chiffre sans authentifier : un jumeau peut faire de l'Enhanced Open lui aussi. Ça ne change rien au boîtier de samedi."
w4.q.owe.label: "Rien du tout : c'est juste un nouveau nom commercial pour le même vieux Wi-Fi ouvert."
w4.q.owe.label.why: "Ça change quelque chose : chaque connexion a sa propre clé, donc un autre invité ne lit plus le trafic en clair dans les ondes."
w4.q.policy: "Quel Wi-Fi invités pour tous les cafés de L'Escale ?"
w4.q.policy.owe: "Enhanced Open, isolation des clients, un portail sans aucun compte, et la surveillance des jumeaux."
w4.q.policy.password: "Un mot de passe WPA2 affiché au comptoir, changé tous les mois."
w4.q.policy.none: "Plus de Wi-Fi invités : les clients utilisent leurs propres données mobiles."
w4.check.gare: "Le réseau ouvert de la gare est oublié"
w4.check.hotel: "Le réseau ouvert de l'hôtel est oublié"
w4.check.escale: "Le réseau du café ne se rejoint plus tout seul"
w4.hint.list.1: "`nmcli connection show`, puis `cat` d'un fichier de /etc/NetworkManager/system-connections/ pour voir sa sécurité."
w4.hint.why.1: "Qu'émettait le boîtier de samedi, et comment les téléphones s'y sont-ils retrouvés ?"
w4.hint.clean.1: "`nmcli connection delete Gare-WiFi-Gratuit` et `nmcli connection delete Hotel-Les-Tilleuls`."
w4.hint.clean.2: "`nmcli connection modify Escale-Invites connection.autoconnect no`, puis `verify`."
w4.hint.owe.1: "OWE chiffre-t-il, authentifie-t-il, ou les deux ?"
w4.debrief.title: "Oublier, puis choisir"
w4.debrief.lesson: "Le Wi-Fi public en 2029 est en grande partie sûr pour le contenu, grâce à HTTPS. Ce qui reste est une affaire de confiance : un nom que n'importe qui peut copier, un appareil qui se connecte tout seul, un portail qui demande trop, un voisin qui peut t'atteindre. Enhanced Open chiffre les ondes mais ne prouve rien ; le reste, ce sont des réflexes côté voyageur et des règles honnêtes côté café."
w4.debrief.p1: "Un réseau ouvert mémorisé, c'est un nom auquel ton appareil fait confiance, et que n'importe qui peut émettre."
w4.debrief.p2: "Enhanced Open (OWE) protège de l'écoute, pas d'un jumeau."
w4.debrief.p3: "La meilleure défense d'un café tient en une phrase : « nous ne demandons jamais de mot de passe », dite au comptoir, sur le portail et sur les affichettes."
w4.home.p1: "Après un voyage, passe en revue tes réseaux Wi-Fi mémorisés et oublie les réseaux ouverts dont tu ne te serviras plus."
w4.home.p2: "Coupe la connexion automatique des réseaux publics que tu gardes : ton téléphone demandera avant de se connecter."
w4.home.p3: "Dans le doute, utilise le partage de connexion de ton téléphone : c'est un réseau que toi seul tiens."
w4.ada.company: "Celui-là, c'était le réseau de l'entreprise, avec son certificat. Pas un drame : l'informatique le remettra lundi. C'étaient les réseaux ouverts qu'il fallait oublier."
