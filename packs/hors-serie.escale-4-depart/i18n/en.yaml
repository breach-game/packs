w4.briefing: "Wednesday, 8:40 am, last morning at L'Escale. Your train leaves at 10. Before that, two things: your own laptop, which remembers every Wi-Fi it has ever joined, and the chain's choice for the guest Wi-Fi of all its cafés."
w4.obj.list: "List the networks your laptop remembers"
w4.obj.why: "Say why auto-joining an open network is risky"
w4.obj.clean: "Clean up your saved networks"
w4.obj.owe: "Say what encrypted open Wi-Fi brings"
w4.obj.policy: "Choose the chain's guest Wi-Fi"
w4.ada.brief: "We spent three days telling customers to forget networks. Let's start with ours."
w4.ada.g.list: "List the networks your laptop has saved: `nmcli connection show`."
w4.ada.g.list.standard: "List the networks your laptop has saved, with `nmcli`."
w4.ada.list: "Five networks, and the laptop will join three open ones on its own as soon as it hears their names: a station, a hotel, the café. Your own hotspot is protected and can stay. Answer my question."
w4.ada.answer: "Answer my question: click, or use `answer` in the terminal."
w4.ada.answer.standard: "My question is waiting in the messages."
w4.ada.why: "Exactly what the box behind the bench did on Saturday, but with a name your laptop already trusts."
w4.ada.g.clean: "Forget the open networks you will not use again, `nmcli connection delete Gare-WiFi-Gratuit` and `nmcli connection delete Hotel-Les-Tilleuls`, and keep the café's without auto-joining: `nmcli connection modify Escale-Invites connection.autoconnect no`. Keep LigneRouge. Then `verify`."
w4.ada.g.clean.standard: "Forget the open networks you no longer need, stop auto-joining the café's, keep the company network, then `verify`. To open the file: `edit /etc/NetworkManager/system-connections/Gare-WiFi-Gratuit.nmconnection` or `edit /etc/NetworkManager/system-connections/Hotel-Les-Tilleuls.nmconnection` or `edit /etc/NetworkManager/system-connections/Escale-Invites.nmconnection`."
w4.ada.clean: "Open networks will no longer join you on their own, and the company network is kept. Now the chain: they hesitate about \"encrypted open Wi-Fi\". Answer my question."
w4.ada.owe: "Right: a real improvement against listening, and none against a twin. Now the choice for all the cafés."
w4.ada.policy.owe: "Enhanced Open where devices support it, client isolation, a portal that never asks for a password and says so, and the controller watching for twins. No code to share, and the honest limits written on the counter."
w4.ada.policy.password: "A password on the counter: the air is encrypted, but everyone shares the same key, a twin can show the same password, and the counter card ends up photographed. Better than nothing, worse than it looks."
w4.ada.policy.none: "No guest Wi-Fi at all. Nothing to protect, but customers go to the station's open network, which nobody watches, or leave for the café across the road."
w4.ada.done: "Your laptop is clean, the chain has its policy, and the train is in twenty minutes. Debrief."
w4.q.why: "Why is it risky to let your laptop join a saved open network on its own?"
w4.q.why.name: "Anyone can broadcast the same name, and the laptop joins it without asking you."
w4.q.why.battery: "The laptop keeps searching for those networks, which drains its battery fast."
w4.q.why.battery.why: "The real issue is not battery: a known open name can be copied by anyone, and the laptop trusts it."
w4.q.why.tracked: "The operators of those networks can track you from one city to the next."
w4.q.why.tracked.why: "Modern devices change their hardware address per network. The risk is joining a copy, not being followed."
w4.q.owe: "The chain switches its guest Wi-Fi to Enhanced Open (OWE). What does it bring?"
w4.q.owe.air: "Each guest's traffic is encrypted over the air, but nothing proves who runs the network."
w4.q.owe.twin: "Proof that the network really is the café's own, so fake twins no longer work at all."
w4.q.owe.twin.why: "OWE encrypts without authenticating: a twin can do Enhanced Open too. It changes nothing about Saturday's box."
w4.q.owe.label: "Nothing at all: it is only a new marketing name for the same old open Wi-Fi."
w4.q.owe.label.why: "It does change something: each connection gets its own key, so another guest can no longer read plain traffic over the air."
w4.q.policy: "Which guest Wi-Fi for all of L'Escale's cafés?"
w4.q.policy.owe: "Enhanced Open, client isolation, a portal without any account, and twin watching."
w4.q.policy.password: "A WPA2 password printed on the counter, changed every month."
w4.q.policy.none: "No more guest Wi-Fi: customers use their own mobile data."
w4.check.gare: "The station's open network is forgotten"
w4.check.hotel: "The hotel's open network is forgotten"
w4.check.escale: "The café's network no longer auto-joins"
w4.hint.list.1: "`nmcli connection show`, then `cat` a file in /etc/NetworkManager/system-connections/ to see its security."
w4.hint.why.1: "What did Saturday's box broadcast, and how did phones end up on it?"
w4.hint.clean.1: "`nmcli connection delete Gare-WiFi-Gratuit` and `nmcli connection delete Hotel-Les-Tilleuls`."
w4.hint.clean.2: "`nmcli connection modify Escale-Invites connection.autoconnect no`, then `verify`."
w4.hint.owe.1: "Does OWE encrypt, authenticate, or both?"
w4.debrief.title: "Forget, then choose"
w4.debrief.lesson: "Public Wi-Fi in 2029 is mostly safe for content, thanks to HTTPS. What remains is about trust: a name anyone can copy, a device that joins on its own, a portal that asks too much, a neighbour that can reach you. Enhanced Open encrypts the air but proves nothing; the rest is habits on the traveller's side and honest rules on the café's."
w4.debrief.p1: "A saved open network is a name your device trusts, and anyone can broadcast it."
w4.debrief.p2: "Enhanced Open (OWE) protects against listening, not against a twin."
w4.debrief.p3: "A café's best defence is a sentence: \"we never ask for a password\", said on the counter, the portal and the stickers."
w4.home.p1: "Go through your saved Wi-Fi networks after a trip and forget the open ones you won't use again."
w4.home.p2: "Turn off auto-join for public networks you keep: your phone will ask before connecting."
w4.home.p3: "When in doubt, use your phone's own data sharing: it is a network only you run."
w4.ada.company: "That one was the company network, with its certificate. Not a drama: IT will push it again on Monday. The open ones were the ones to forget."
