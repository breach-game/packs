s2.briefing: "Your suspect is version 5.6.1 of libplume. The project has reviewed its public code: nothing abnormal. But Sorbier does not build its packages from the public repository. It builds them from the archive the maintainers publish."
s2.obj.diff: "Compare the file from the public repository with the one from the published archive"
s2.obj.hidden: "Send the name of the file the extra line fetches (`submit`)"
s2.obj.where: "Say why nobody had seen that line"
s2.obj.who: "Read the project history and say what it tells"
s2.q.where: "The public code was reviewed, and yet nobody had seen that line. Why?"
s2.q.where.lazy: "The reviewers did a poor job: the line was in front of them, in the public repository"
s2.q.where.lazy.why: "They reviewed what they were shown: the public repository, where the line does not exist. You cannot review what you cannot see."
s2.q.where.review: "People review the public repository, but build from the archive, and nobody compares the two"
s2.q.where.size: "The build script is too long to be reviewed in full, and nobody opens it any more"
s2.q.where.size.why: "It is seven lines long. Size does not hide that line, place does: it only exists in the archive."
s2.q.who: "You have read the history. What does it tell?"
s2.q.who.stolen: "A theft: a maintainer's account was taken the day before, then used to publish"
s2.q.who.stolen.why: "Look at the dates: that account has contributed for two years, and each step brings it a little closer to publishing the releases. Nothing looks like a last-minute theft."
s2.q.who.founder: "Negligence by the founder, who should have kept reviewing and publishing alone"
s2.q.who.founder.why: "A volunteer alone for fifteen years, blamed for being slow: accepting help was the reasonable thing to do. That situation was exploited; it was not a fault."
s2.q.who.patient: "Two years of patience: earn trust, get the rights, then publish the archives"
s2.ada.brief: "The project gave you the same build file in two copies: `dossier/git/host.m4`, as it is in the public repository, and `dossier/archive/host.m4`, as it is in the 5.6.1 archive. They should be identical."
s2.ada.g.diff: "Compare them: `diff dossier/git/host.m4 dossier/archive/host.m4`."
s2.ada.g.diff.standard: "Compare the two copies of the file."
s2.ada.diff: "One extra line, in the archive only. It unpacks a file stored among the tests and runs it during the build. A test file \"damaged on purpose\": nobody is surprised that it cannot be read."
s2.ada.g.hidden: "Which file does the extra line fetch? Send me its name with `submit`."
s2.ada.g.hidden.standard: "Send me the name of the file that line fetches."
s2.ada.flag: "`bad-header.plz`. We stop there, we do not open that file: Sorbier's security team handles it in an isolated lab. Our job is to understand how it got there."
s2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
s2.ada.answer.standard: "Answer my question."
s2.ada.where: "Yes. Two different paths for the same code: the one everybody reviews, and the one everybody installs. Slipping something between the two is enough."
s2.ada.g.who: "Now, who. The project history is in `dossier/history.txt`: read it from the bottom up, oldest first, then answer."
s2.ada.g.who.standard: "Read the project history, then answer my question."
s2.ada.history: "Read it from the bottom up. A first small fix, a typo corrected, strangers pressing the founder to hand over, then the rights, then the release signing. Each step, taken alone, is ordinary."
s2.ada.who: "That is it. We do not know the person behind that account, and naming anyone is not our job. What the history shows is a method: two years of useful work to obtain one thing, the right to publish."
s2.ada.done: "You know where the problem is and how it got there. Open the debrief: what remains is getting Sorbier out of it."
s2.hint.diff.1: "Type `diff dossier/git/host.m4 dossier/archive/host.m4`."
s2.hint.hidden.1: "The extra line starts with `plume_extra`. It names a file stored in `tests/files/`."
s2.hint.hidden.2: "Type `submit bad-header.plz`."
s2.hint.who.1: "Type `cat dossier/history.txt`, read the dates from the bottom up, then answer the question."
s2.debrief.title: "One line between two paths"
s2.debrief.lesson: "The code everybody reviewed was clean. What machines installed was not. And the person who slipped in the difference had spent two years becoming the one people trust."
s2.debrief.p1: "What gets reviewed and what gets installed must be the same thing. Otherwise review only protects the repository."
s2.debrief.p2: "A supply chain attack targets a link many depend on and few people watch."
s2.debrief.p3: "Many essential building blocks rest on one or two exhausted volunteers. Supporting them is part of security."
