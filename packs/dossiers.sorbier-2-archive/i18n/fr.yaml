s2.briefing: "Ton suspect est la version 5.6.1 de libplume. Le projet a relu son code public : rien d'anormal. Mais Sorbier ne construit pas ses paquets depuis le dépôt public. Il les construit depuis l'archive que les mainteneurs publient."
s2.obj.diff: "Comparer le fichier du dépôt public et celui de l'archive publiée"
s2.obj.hidden: "Envoyer le nom du fichier que la ligne en trop va chercher (`submit`)"
s2.obj.where: "Dire pourquoi personne n'avait vu cette ligne"
s2.obj.who: "Lire l'historique du projet et dire ce qu'il raconte"
s2.q.where: "Le code public a été relu, et pourtant personne n'avait vu cette ligne. Pourquoi ?"
s2.q.where.lazy: "Les relecteurs ont mal fait leur travail : la ligne était sous leurs yeux, dans le dépôt public"
s2.q.where.lazy.why: "Ils ont relu ce qu'on leur montrait : le dépôt public, où la ligne n'existe pas. On ne peut pas relire ce qu'on ne voit pas."
s2.q.where.review: "On relit le dépôt public, mais on construit depuis l'archive, et personne ne compare les deux"
s2.q.where.size: "Le script de construction est trop long pour être relu en entier, et personne ne l'ouvre plus"
s2.q.where.size.why: "Il fait sept lignes. Ce n'est pas la taille qui cache cette ligne, c'est l'endroit : elle n'existe que dans l'archive."
s2.q.who: "Tu as lu l'historique. Qu'est-ce qu'il raconte ?"
s2.q.who.stolen: "Un vol : le compte d'un mainteneur a été pris la veille, puis utilisé pour publier l'archive"
s2.q.who.stolen.why: "Regarde les dates : ce compte contribue depuis deux ans, et chaque étape le rapproche un peu plus de la publication des versions. Rien ne ressemble à un vol de dernière minute."
s2.q.who.founder: "Une négligence du fondateur, qui aurait dû continuer à tout relire et tout publier seul"
s2.q.who.founder.why: "Un bénévole seul depuis quinze ans, à qui on reproche d'être lent : accepter de l'aide était la chose raisonnable. C'est cette situation qui a été exploitée, pas une faute."
s2.q.who.patient: "Deux ans de patience : gagner la confiance, obtenir les droits, puis publier les archives"
s2.ada.brief: "Le projet t'a remis le même fichier de construction en deux exemplaires : `dossier/git/host.m4`, tel qu'il est dans le dépôt public, et `dossier/archive/host.m4`, tel qu'il est dans l'archive de la 5.6.1. Ils devraient être identiques."
s2.ada.g.diff: "Compare-les : `diff dossier/git/host.m4 dossier/archive/host.m4`."
s2.ada.g.diff.standard: "Compare les deux exemplaires du fichier."
s2.ada.diff: "Une ligne en trop, dans l'archive seulement. Elle déballe un fichier rangé parmi les tests et le lance pendant la construction. Un fichier de test « abîmé exprès », personne ne s'étonne qu'il soit illisible."
s2.ada.g.hidden: "Quel fichier la ligne en trop va-t-elle chercher ? Envoie-moi son nom avec `submit`."
s2.ada.g.hidden.standard: "Envoie-moi le nom du fichier que cette ligne va chercher."
s2.ada.flag: "`bad-header.plz`. On s'arrête là, on n'ouvre pas ce fichier : l'équipe sécurité de Sorbier s'en charge dans un laboratoire isolé. Nous, on doit comprendre comment il est arrivé là."
s2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
s2.ada.answer.standard: "Réponds à ma question."
s2.ada.where: "Oui. Deux chemins différents pour le même code : celui que tout le monde relit, et celui que tout le monde installe. Il suffit de glisser quelque chose entre les deux."
s2.ada.g.who: "Maintenant, qui. L'historique du projet est dans `dossier/history.txt` : lis-le de bas en haut, du plus ancien au plus récent, puis réponds."
s2.ada.g.who.standard: "Lis l'historique du projet, puis réponds à ma question."
s2.ada.history: "Lis-le de bas en haut. Un premier petit correctif, une faute de frappe corrigée, des inconnus qui pressent le fondateur de passer la main, puis les droits, puis la signature des versions. Chaque étape, prise seule, est banale."
s2.ada.who: "C'est ça. On ne connaît pas la personne derrière ce compte, et ce n'est pas à nous de la désigner. Ce que l'historique montre, c'est une méthode : deux ans de travail utile pour obtenir une seule chose, le droit de publier."
s2.ada.done: "Tu sais où est le problème et comment il est arrivé. Ouvre le débrief : il reste à sortir Sorbier de là."
s2.hint.diff.1: "Tape `diff dossier/git/host.m4 dossier/archive/host.m4`."
s2.hint.hidden.1: "La ligne en trop commence par `plume_extra`. Elle nomme un fichier rangé dans `tests/files/`."
s2.hint.hidden.2: "Tape `submit bad-header.plz`."
s2.hint.who.1: "Tape `cat dossier/history.txt`, lis les dates de bas en haut, puis réponds à la question."
s2.debrief.title: "Une ligne entre deux chemins"
s2.debrief.lesson: "Le code relu par tous était propre. Ce que les machines installaient ne l'était pas. Et la personne qui a glissé la différence avait mis deux ans à devenir celle à qui l'on fait confiance."
s2.debrief.p1: "Ce qu'on relit et ce qu'on installe doivent être la même chose. Sinon, la relecture ne protège que le dépôt."
s2.debrief.p2: "Une attaque sur la chaîne d'approvisionnement vise un maillon dont beaucoup dépendent et que peu de gens surveillent."
s2.debrief.p3: "Beaucoup de briques essentielles reposent sur un ou deux bénévoles épuisés. Les soutenir fait partie de la sécurité."
