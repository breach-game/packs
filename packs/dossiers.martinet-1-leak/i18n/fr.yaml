m1.briefing: "Martinet paie un service qui surveille les places de marché criminelles. Ce mois-ci, il y a trouvé cinq comptes de l'entreprise, volés par des logiciels malveillants. La plupart ne valent plus rien. Trouve celui qui ouvre encore une porte, et regarde ce qu'il y a derrière."
m1.obj.report: "Lire le rapport de la veille de fuites"
m1.obj.account: "Envoyer le compte qui ouvre encore une porte (`submit`)"
m1.obj.door: "Lire comment un prestataire se connecte chez Martinet"
m1.obj.blind: "Dire pourquoi Martinet n'a rien vu"
m1.q.blind: "Le mot de passe de ce compte est en vente depuis deux mois. Pourquoi Martinet n'a-t-il rien vu ?"
m1.q.blind.weak: "Le mot de passe était trop simple, quelqu'un l'a deviné"
m1.q.blind.weak.why: "Personne n'a rien deviné. Un logiciel malveillant l'a copié au moment où il était tapé : même un très bon mot de passe y passe."
m1.q.blind.outside: "Le vol a eu lieu sur un ordinateur personnel, que Martinet ne surveille pas"
m1.q.blind.hacked: "Les serveurs de Martinet ont été piratés, et la base des mots de passe a fuité"
m1.q.blind.hacked.why: "Aucun serveur de Martinet n'a été touché. Regarde la colonne des appareils : le logiciel malveillant était chez le prestataire, pas chez Martinet."
m1.ada.brief: "Le rapport est dans `dossier/leak-report.txt`. Aucun mot de passe dedans, et c'est voulu : on n'en a pas besoin pour comprendre."
m1.ada.g.report: "Commence par le lire : `cat dossier/leak-report.txt`."
m1.ada.g.report.standard: "Commence par lire le rapport de la veille de fuites."
m1.ada.report: "Cinq comptes volés, mais regarde les deux dernières colonnes. Un compte volé ne sert à rien si son mot de passe a changé depuis, ou s'il est fermé."
m1.ada.g.account: "Cherche la ligne où le mot de passe n'a pas changé et où le compte est encore actif. Envoie-moi ce compte avec `submit`."
m1.ada.g.account.standard: "Lequel de ces comptes ouvre encore une porte ? Envoie-le-moi avec `submit`."
m1.ada.flag: "`noe.ext`. Volé il y a deux mois sur l'ordinateur personnel d'un prestataire, jamais changé, toujours actif. Pour quelques euros, n'importe qui peut l'acheter. Reste à savoir ce qu'un mot de passe seul permet chez Martinet."
m1.ada.g.door: "Le site public le dit lui-même. Lis la page des prestataires : `curl https://www.martinet.test/prestataires`."
m1.ada.g.door.standard: "Va voir sur le site public comment un prestataire se connecte."
m1.ada.door: "Un mot de passe, puis une demande à approuver sur le téléphone. Le mot de passe, quelqu'un l'a déjà. Il ne reste donc qu'un bouton « Approuver » entre lui et l'intranet."
m1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
m1.ada.answer.standard: "Réponds à ma question."
m1.ada.blind: "Oui. Martinet protège ses ordinateurs, pas ceux de ses deux cents prestataires. Et le mot de passe, lui, ouvre la même porte d'où qu'on le tape."
m1.ada.done: "On sait quel compte, et on sait ce qui le protège encore : un seul bouton. Ouvre le débrief. Demain, on va voir combien de temps ce bouton tient."
m1.hint.report.1: "Tape `cat dossier/leak-report.txt`."
m1.hint.account.1: "Élimine les comptes dont le mot de passe a changé, puis celui qui est fermé. Il en reste un."
m1.hint.account.2: "Tape `submit noe.ext`."
m1.hint.door.1: "Tape `curl https://www.martinet.test/prestataires`."
m1.hint.blind.1: "Regarde, dans le rapport, sur quel appareil se trouvait le logiciel malveillant pour ce compte."
m1.debrief.title: "Personne n'a forcé la porte"
m1.debrief.lesson: "Tu n'as rien piraté : tu as lu un rapport. Les mots de passe volés par des logiciels malveillants se revendent par lots, et celui qui les achète entre avec un compte valide, comme un collègue."
m1.debrief.p1: "Un mot de passe volé sur un appareil personnel échappe à tout ce que l'entreprise surveille. Seule une veille de fuites le fait remonter."
m1.debrief.p2: "Trouver une fuite ne suffit pas : il faut changer le mot de passe et fermer les sessions le jour même, pour les prestataires comme pour les salariés."
m1.debrief.p3: "Un compte valide ne déclenche aucune alarme. C'est le second facteur qui doit tenir, et la suite du dossier montre s'il tient."
