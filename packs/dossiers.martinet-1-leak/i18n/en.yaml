m1.briefing: "Martinet pays a service that watches criminal marketplaces. This month it found five company accounts there, stolen by malware. Most are worth nothing any more. Find the one that still opens a door, and look at what is behind it."
m1.obj.report: "Read the leak monitoring report"
m1.obj.account: "Send the account that still opens a door (`submit`)"
m1.obj.door: "Read how a contractor logs in at Martinet"
m1.obj.blind: "Say why Martinet saw nothing"
m1.q.blind: "This account's password has been for sale for two months. Why did Martinet see nothing?"
m1.q.blind.weak: "The password was too simple, someone guessed it"
m1.q.blind.weak.why: "Nobody guessed anything. Malware copied it as it was typed: even a very good password goes that way."
m1.q.blind.outside: "The theft happened on a personal computer, which Martinet does not watch"
m1.q.blind.hacked: "Martinet's servers were hacked, and the whole password database leaked out"
m1.q.blind.hacked.why: "No Martinet server was touched. Look at the device column: the malware was at the contractor's, not at Martinet."
m1.ada.brief: "The report is in `dossier/leak-report.txt`. No password in it, on purpose: we do not need one to understand."
m1.ada.g.report: "Start by reading it: `cat dossier/leak-report.txt`."
m1.ada.g.report.standard: "Start by reading the leak monitoring report."
m1.ada.report: "Five stolen accounts, but look at the last two columns. A stolen account is useless if its password has changed since, or if it is closed."
m1.ada.g.account: "Look for the line where the password has not changed and the account is still active. Send me that account with `submit`."
m1.ada.g.account.standard: "Which of these accounts still opens a door? Send it to me with `submit`."
m1.ada.flag: "`noe.ext`. Stolen two months ago on a contractor's personal computer, never changed, still active. For a few euros, anyone can buy it. What remains is to know what a password alone allows at Martinet."
m1.ada.g.door: "The public site says it itself. Read the contractors page: `curl https://www.martinet.test/prestataires`."
m1.ada.g.door.standard: "Go and see on the public site how a contractor logs in."
m1.ada.door: "A password, then a request to approve on the phone. The password, someone already has. So only an \"Approve\" button stands between them and the intranet."
m1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
m1.ada.answer.standard: "Answer my question."
m1.ada.blind: "Yes. Martinet protects its own computers, not those of its two hundred contractors. And the password opens the same door wherever it is typed from."
m1.ada.done: "We know which account, and we know what still protects it: a single button. Open the debrief. Tomorrow, we see how long that button holds."
m1.hint.report.1: "Type `cat dossier/leak-report.txt`."
m1.hint.account.1: "Rule out the accounts whose password has changed, then the closed one. One is left."
m1.hint.account.2: "Type `submit noe.ext`."
m1.hint.door.1: "Type `curl https://www.martinet.test/prestataires`."
m1.hint.blind.1: "Look, in the report, at which device the malware was on for this account."
m1.debrief.title: "Nobody forced the door"
m1.debrief.lesson: "You hacked nothing: you read a report. Passwords stolen by malware are resold in batches, and whoever buys them comes in with a valid account, like a colleague."
m1.debrief.p1: "A password stolen on a personal device escapes everything the company watches. Only leak monitoring brings it back up."
m1.debrief.p2: "Finding a leak is not enough: the password must be changed and the sessions closed the same day, for contractors as for employees."
m1.debrief.p3: "A valid account raises no alarm. The second factor is what has to hold, and the rest of the case file shows whether it does."
