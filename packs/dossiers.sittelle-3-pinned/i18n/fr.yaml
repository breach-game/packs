s3.briefing: "Dernière matinée chez Sittelle. Le script tiers est coupé, mais le site reste réglé pour exécuter n'importe quoi venu de n'importe où. Les réglages sont dans `dossier/site.yml`."
s3.obj.copy: "Servir sa propre copie, avec une empreinte"
s3.obj.why: "Dire à quoi sert l'empreinte sur sa propre copie"
s3.obj.csp: "N'accepter que les scripts du site"
s3.obj.watch: "Surveiller les tiers qui restent"
s3.q.why: "Le directeur demande : si la copie est chez nous, à quoi sert encore l'empreinte ?"
s3.q.why.ours: "Si notre propre serveur est un jour modifié, le navigateur refusera le fichier changé"
s3.q.why.habit: "À rien de plus : c'est une bonne habitude, on la garde quand même"
s3.q.why.habit.why: "Elle sert vraiment : un fichier peut aussi être modifié chez soi, sur le serveur ou en chemin."
s3.q.why.speed: "À accélérer le chargement : avec elle, le navigateur garde le fichier plus longtemps en cache"
s3.q.why.speed.why: "L'empreinte ne rend rien plus rapide : elle permet au navigateur de refuser un fichier qui n'est plus celui qu'on a vérifié."
s3.check.copy: "La bibliothèque est servie par le site, avec son empreinte"
s3.check.csp: "Seuls les scripts du site s'exécutent, et les refus sont signalés"
s3.check.watch: "Un changement de propriétaire ou de contenu chez un tiers déclenche une alerte"
s3.check.works: "Le site reste en ligne"
s3.ada.brief: "Lis les réglages : `cat dossier/site.yml`. Trois couches."
s3.ada.g.copy: "D'abord, la bibliothèque : une copie vérifiée servie par le site, avec son empreinte. Ouvre `edit dossier/site.yml` et écris `compat_from: self-hosted` et `integrity: on`, puis `verify`."
s3.ada.g.copy.standard: "D'abord : que la bibliothèque vienne de chez Sittelle, et que le navigateur vérifie qu'elle n'a pas changé. Puis `verify`. Pour ouvrir le fichier : `edit dossier/site.yml`."
s3.ada.copy: "Le fichier vient de chez nous, et le navigateur compare son empreinte avant de l'exécuter."
s3.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
s3.ada.answer.standard: "La question du directeur t'attend."
s3.ada.g.csp: "Deuxième couche, la politique de sécurité du site : seuls ses propres scripts s'exécutent (`script_src: self`), et les navigateurs signalent ce qu'ils bloquent (`csp_reports: on`). Puis `verify`."
s3.ada.g.csp.standard: "Deuxième couche : que le navigateur refuse tout script qui ne vient pas du site, et qu'il le dise. Puis `verify`."
s3.ada.csp: "Même si quelqu'un remet un jour la vieille ligne dans une page, le navigateur refusera le script et le signalera. La faille deviendrait une alerte."
s3.ada.g.watch: "Dernière couche : pour les tiers qui restent (polices, cartes), une alerte quand le propriétaire ou le contenu change. Écris `third_parties: owner-and-content`, puis `verify`."
s3.ada.g.watch.standard: "Dernière couche : savoir quand un tiers change de mains ou de contenu. Puis `verify`."
s3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
s3.ada.done: "Trois couches : la copie et son empreinte, une politique qui n'accepte que le site, et une veille sur les tiers. Sittelle ne court plus le risque d'exécuter ce que quelqu'un d'autre décide. Ouvre le débrief : à la fin, le cas réel."
s3.hint.copy.1: "Deux lignes sous `scripts` : `compat_from` et `integrity`."
s3.hint.copy.2: "Avec l'éditeur : `edit dossier/site.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/compat_from: third-party/compat_from: self-hosted/\" dossier/site.yml` et `sed -i \"s/integrity: off/integrity: on/\" dossier/site.yml`, puis `verify`."
s3.hint.why.1: "Un fichier peut-il changer ailleurs que chez un tiers ?"
s3.hint.csp.1: "Deux lignes sous `headers` : `script_src` et `csp_reports`."
s3.hint.csp.2: "Avec l'éditeur : `edit dossier/site.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/script_src: any/script_src: self/\" dossier/site.yml` et `sed -i \"s/csp_reports: off/csp_reports: on/\" dossier/site.yml`, puis `verify`."
s3.hint.watch.1: "La ligne `third_parties`, sous `watch`."
s3.hint.watch.2: "Avec l'éditeur : `edit dossier/site.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/third_parties: none/third_parties: owner-and-content/\" dossier/site.yml`, puis `verify`."
s3.debrief.title: "Ne charger que ce qu'on a vérifié"
s3.debrief.lesson: "Un site qui charge un fichier depuis chez quelqu'un d'autre lui donne la clé de chaque visiteur. On reprend la clé : une copie chez soi, une empreinte que le navigateur vérifie, une politique qui refuse le reste, et une veille sur les tiers qu'on garde."
s3.debrief.p1: "Héberger soi-même les bibliothèques dont on dépend, en version vérifiée."
s3.debrief.p2: "Subresource Integrity : le navigateur refuse un fichier dont l'empreinte a changé."
s3.debrief.p3: "Content-Security-Policy : n'autoriser que les sources de scripts voulues, et recevoir les signalements."
s3.debrief.p4: "Surveiller les tiers : un changement de propriétaire est un signal en soi."
s3.facts.title: "Ce qui s'est vraiment passé : Polyfill (2024)"
s3.facts.p1: "Sittelle n'existe pas. Le scénario s'inspire de l'attaque du service de scripts Polyfill, révélée en juin 2024."
s3.facts.p2: "Polyfill était un service gratuit qui servait des scripts pour que les vieux navigateurs comprennent des fonctions récentes. D'après Sansec, plus de 100 000 sites le chargeaient directement. En février 2024, le domaine et le compte du projet ont été rachetés par une entreprise appelée Funnull. L'auteur d'origine de la bibliothèque a publiquement conseillé de ne plus l'utiliser, et Cloudflare et Fastly ont ouvert des copies de remplacement."
s3.facts.p3: "Le 25 juin 2024, Sansec a révélé que le script servi contenait désormais du code ajouté, qui envoyait une partie des visiteurs sur téléphone vers des sites de paris et d'arnaques. Le code évitait les administrateurs et les outils d'analyse, et ne se déclenchait que sur certains appareils et à certaines heures, pour rester discret."
s3.facts.p4: "Dans les jours suivants, le bureau d'enregistrement du domaine l'a suspendu, et Cloudflare a commencé à réécrire automatiquement les liens vers sa propre copie pour les sites qui passaient par lui."
s3.facts.p5: "Les leçons de ce dossier y sont : ce qu'on charge, on l'exécute ; un propriétaire qui change est un signal ; et une copie vérifiée chez soi reprend la main."
