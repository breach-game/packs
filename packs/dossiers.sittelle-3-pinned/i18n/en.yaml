s3.briefing: "Last morning at Sittelle. The third-party script is cut, but the site is still set to run anything from anywhere. The settings are in `dossier/site.yml`."
s3.obj.copy: "Serve your own copy, with a fingerprint"
s3.obj.why: "Say what the fingerprint is for on your own copy"
s3.obj.csp: "Accept only the site's scripts"
s3.obj.watch: "Watch the third parties that remain"
s3.q.why: "The director asks: if the copy is ours, what is the fingerprint still for?"
s3.q.why.ours: "If our own server is altered one day, the browser refuses the changed file"
s3.q.why.habit: "Nothing more: it is just a good habit, so we keep it anyway"
s3.q.why.habit.why: "It really is useful: a file can also be changed at home, on the server or on the way."
s3.q.why.speed: "To load it faster, since with it the browser keeps the file in its cache for longer"
s3.q.why.speed.why: "The fingerprint makes nothing faster: it lets the browser refuse a file that is no longer the one you checked."
s3.check.copy: "The library is served by the site, with its fingerprint"
s3.check.csp: "Only the site's scripts run, and refusals are reported"
s3.check.watch: "A change of owner or content at a third party raises an alert"
s3.check.works: "The site stays online"
s3.ada.brief: "Read the settings: `cat dossier/site.yml`. Three layers."
s3.ada.g.copy: "First, the library: a checked copy served by the site, with its fingerprint. Open `edit dossier/site.yml` and write `compat_from: self-hosted` and `integrity: on`, then `verify`."
s3.ada.g.copy.standard: "First: the library must come from Sittelle, and the browser must check it has not changed. Then `verify`. To open the file: `edit dossier/site.yml`."
s3.ada.copy: "The file comes from home, and the browser compares its fingerprint before running it."
s3.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
s3.ada.answer.standard: "The director's question is waiting."
s3.ada.g.csp: "Second layer, the site's security policy: only its own scripts run (`script_src: self`), and browsers report what they block (`csp_reports: on`). Then `verify`."
s3.ada.g.csp.standard: "Second layer: the browser must refuse any script that does not come from the site, and say so. Then `verify`."
s3.ada.csp: "Even if someone puts the old line back in a page one day, the browser will refuse the script and report it. The flaw would become an alert."
s3.ada.g.watch: "Last layer: for the third parties that remain (fonts, maps), an alert when the owner or the content changes. Write `third_parties: owner-and-content`, then `verify`."
s3.ada.g.watch.standard: "Last layer: know when a third party changes hands or content. Then `verify`."
s3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
s3.ada.done: "Three layers: the copy and its fingerprint, a policy that only accepts the site, and a watch on third parties. Sittelle no longer runs whatever somebody else decides. Open the debrief: at the end, the real case."
s3.hint.copy.1: "Two lines under `scripts`: `compat_from` and `integrity`."
s3.hint.copy.2: "With the editor: `edit dossier/site.yml`, then Ctrl+S. With a command: `sed -i \"s/compat_from: third-party/compat_from: self-hosted/\" dossier/site.yml` and `sed -i \"s/integrity: off/integrity: on/\" dossier/site.yml`, then `verify`."
s3.hint.why.1: "Can a file change anywhere other than at a third party?"
s3.hint.csp.1: "Two lines under `headers`: `script_src` and `csp_reports`."
s3.hint.csp.2: "With the editor: `edit dossier/site.yml`, then Ctrl+S. With a command: `sed -i \"s/script_src: any/script_src: self/\" dossier/site.yml` and `sed -i \"s/csp_reports: off/csp_reports: on/\" dossier/site.yml`, then `verify`."
s3.hint.watch.1: "The `third_parties` line, under `watch`."
s3.hint.watch.2: "With the editor: `edit dossier/site.yml`, then Ctrl+S. With a command: `sed -i \"s/third_parties: none/third_parties: owner-and-content/\" dossier/site.yml`, then `verify`."
s3.debrief.title: "Load only what you checked"
s3.debrief.lesson: "A site that loads a file from somebody else's server hands them the key to every visitor. We take the key back: a copy at home, a fingerprint the browser checks, a policy that refuses the rest, and a watch on the third parties we keep."
s3.debrief.p1: "Host the libraries you depend on yourself, in a checked version."
s3.debrief.p2: "Subresource Integrity: the browser refuses a file whose fingerprint changed."
s3.debrief.p3: "Content-Security-Policy: allow only the script sources you want, and receive the reports."
s3.debrief.p4: "Watch third parties: a change of owner is a signal in itself."
s3.facts.title: "What really happened: Polyfill (2024)"
s3.facts.p1: "Sittelle does not exist. The scenario is inspired by the attack on the Polyfill script service, revealed in June 2024."
s3.facts.p2: "Polyfill was a free service that served scripts so that old browsers understand recent features. According to Sansec, more than 100,000 sites loaded it directly. In February 2024 the domain and the project's account were bought by a company called Funnull. The library's original author publicly advised to stop using it, and Cloudflare and Fastly opened replacement copies."
s3.facts.p3: "On 25 June 2024 Sansec revealed that the script served now held added code, which sent some visitors on phones to betting and scam sites. The code avoided admins and analytics tools, and only fired on some devices and at some hours, to stay discreet."
s3.facts.p4: "In the following days the domain's registrar suspended it, and Cloudflare began automatically rewriting links to its own copy for the sites that went through it."
s3.facts.p5: "The lessons of this case file are there: what you load, you run; an owner who changes is a signal; and a checked copy at home takes back control."
