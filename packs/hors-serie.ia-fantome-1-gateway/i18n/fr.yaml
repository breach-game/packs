f1.briefing: "La DPO de Tilia a un pressentiment : « Personne ne m'a déclaré utiliser une IA extérieure, mais l'équipe recrutement tient des délais impossibles. » Tu as un compte en lecture sur la passerelle web, par où passe chaque poste. Elle veut des chiffres, pas des soupçons."
f1.obj.service: "Trouver le service d'IA extérieur qui reçoit le plus d'envois"
f1.obj.accounts: "Compter les comptes qui y envoient des données"
f1.obj.why: "Comprendre pourquoi"
f1.q.service: "Quel service d'IA non approuvé reçoit le plus d'envois (méthode POST) ? Donne sa destination telle qu'elle apparaît après `dst=`."
f1.q.accounts: "Combien de comptes différents ont envoyé des données (POST) à ce service ?"
f1.q.why: "La DPO demande : pourquoi l'équipe recrutement a-t-elle fait ça ?"
f1.q.why.need: "L'outil approuvé ne répond pas à son besoin"
f1.q.why.careless: "Elle se moque des règles de l'agence"
f1.q.why.careless.why: "Le ticket TIL-2291 montre l'inverse : l'équipe a demandé l'outil par le bon canal, il y a quatre mois, et relancé. Chercher un coupable ne réglera rien."
f1.q.why.hidden: "Un attaquant a installé ce service"
f1.q.why.hidden.why: "Rien de tel dans le journal : ce sont les comptes de l'équipe, depuis leurs postes, pendant les heures de travail, vers un site public."
f1.ada.brief: "Connecte-toi : `ssh ir@passerelle.tilia.test`, puis lis le début du journal (`cat /var/log/passerelle/acces.log`). Chaque ligne dit qui envoie quoi, et où."
f1.ada.g.service: "Garde les lignes d'IA générative en envoi, découpe la destination (4ᵉ champ) et compte : `grep cat=ia-generative /var/log/passerelle/acces.log | grep method=POST | cut -d \" \" -f 4 | sort | uniq -c | sort -rn`. Puis `answer service <destination>`."
f1.ada.g.service.standard: "Filtre les envois vers des services d'IA générative et compte-les par destination."
f1.ada.service: "Un site de « résumé de CV » reçoit à lui seul plus d'envois que tous les autres réunis. Des CV, donc des données personnelles de candidats, chez un prestataire que personne n'a vérifié."
f1.ada.g.accounts: "Même idée, sur le compte (3ᵉ champ) : `grep dst=resume-cv.example /var/log/passerelle/acces.log | grep method=POST | cut -d \" \" -f 3 | sort | uniq | wc -l`. Puis `answer accounts <nombre>`."
f1.ada.g.accounts.standard: "Compte les comptes distincts qui envoient à ce service."
f1.ada.accounts: "Six comptes, tous de l'équipe recrutement (`rec-`). Ce n'est pas une personne, c'est une habitude d'équipe. Avant de conclure, lis le ticket que la DPO a joint : `cat tickets/TIL-2291.txt` (sur ton poste, après `exit`)."
f1.ada.g.why: "Lis `tickets/TIL-2291.txt` sur ton poste, et la page de l'assistant interne."
f1.ada.done: "Le problème n'est pas l'équipe. C'est un besoin réel, sans outil approuvé pour y répondre. Interdire ne suffira pas : il faut une passerelle qui sait dire non au bon moment, et un outil qui sait dire oui."
f1.hint.service.1: "`cut -d \" \" -f 4` garde la destination ; `sort | uniq -c | sort -rn` compte et trie."
f1.hint.service.2: "`answer service resume-cv.example`"
f1.hint.accounts.1: "`cut -d \" \" -f 3 | sort | uniq | wc -l` compte les comptes distincts."
f1.hint.accounts.2: "`answer accounts 6`"
f1.hint.why.1: "`answer need`"
f1.debrief.title: "L'IA qu'on ne voit pas"
f1.debrief.lesson: "Six recruteurs envoyaient des CV à un site de résumé automatique. Personne ne l'avait déclaré, mais la passerelle avait tout noté. La cause n'était pas la négligence : l'équipe avait demandé un outil approuvé quatre mois plus tôt, et attendait toujours. L'IA fantôme naît d'un besoin sans réponse."
f1.debrief.p1: "Faire l'inventaire des usages réels de l'IA à partir des journaux, pas des déclarations."
f1.debrief.p2: "Traiter les demandes d'outils vite : chaque mois d'attente pousse vers un service non vérifié."
f1.debrief.p3: "Envoyer des CV à un prestataire non vérifié, c'est transférer des données personnelles sans contrat ni analyse : le RGPD s'applique."
