f1.briefing: "Tilia's DPO has a hunch: \"Nobody declared using an outside AI, but the recruiting team keeps impossible deadlines.\" You have a read-only account on the web gateway, which every workstation goes through. She wants numbers, not suspicions."
f1.obj.service: "Find the outside AI service that receives the most uploads"
f1.obj.accounts: "Count the accounts that send data to it"
f1.obj.why: "Understand why"
f1.q.service: "Which unapproved AI service receives the most uploads (POST method)? Give its destination as it appears after `dst=`."
f1.q.accounts: "How many different accounts sent data (POST) to that service?"
f1.q.why: "The DPO asks: why did the recruiting team do this?"
f1.q.why.need: "The approved tool does not meet their need"
f1.q.why.careless: "They do not care about the agency's rules"
f1.q.why.careless.why: "Ticket TIL-2291 shows the opposite: the team asked for the tool through the right channel, four months ago, and chased it. Finding a culprit will fix nothing."
f1.q.why.hidden: "An attacker installed this service"
f1.q.why.hidden.why: "Nothing like that in the log: these are the team's accounts, from their workstations, during working hours, to a public site."
f1.ada.brief: "Connect: `ssh ir@passerelle.tilia.test`, then read the start of the log (`cat /var/log/passerelle/acces.log`). Each line says who sends what, and where."
f1.ada.g.service: "Keep the generative AI lines that upload, cut out the destination (4th field) and count: `grep cat=ia-generative /var/log/passerelle/acces.log | grep method=POST | cut -d \" \" -f 4 | sort | uniq -c | sort -rn`. Then `answer service <destination>`."
f1.ada.g.service.standard: "Filter uploads to generative AI services and count them by destination."
f1.ada.service: "One \"CV summary\" site alone gets more uploads than all the others together. CVs, so candidates' personal data, at a provider nobody checked."
f1.ada.g.accounts: "Same idea, on the account (3rd field): `grep dst=resume-cv.example /var/log/passerelle/acces.log | grep method=POST | cut -d \" \" -f 3 | sort | uniq | wc -l`. Then `answer accounts <number>`."
f1.ada.g.accounts.standard: "Count the distinct accounts that upload to this service."
f1.ada.accounts: "Six accounts, all from the recruiting team (`rec-`). Not one person, a team habit. Before concluding, read the ticket the DPO attached: `cat tickets/TIL-2291.txt` (on your workstation, after `exit`)."
f1.ada.g.why: "Read `tickets/TIL-2291.txt` on your workstation, and the in-house assistant's page."
f1.ada.done: "The problem is not the team. It is a real need with no approved tool to meet it. Banning will not be enough: we need a gateway that says no at the right moment, and a tool that says yes."
f1.hint.service.1: "`cut -d \" \" -f 4` keeps the destination; `sort | uniq -c | sort -rn` counts and sorts."
f1.hint.service.2: "`answer service resume-cv.example`"
f1.hint.accounts.1: "`cut -d \" \" -f 3 | sort | uniq | wc -l` counts distinct accounts."
f1.hint.accounts.2: "`answer accounts 6`"
f1.hint.why.1: "`answer need`"
f1.debrief.title: "The AI nobody sees"
f1.debrief.lesson: "Six recruiters were sending CVs to an automatic summary site. Nobody had declared it, but the gateway had written it all down. The cause was not carelessness: the team had asked for an approved tool four months earlier, and was still waiting. Shadow AI is born from an unmet need."
f1.debrief.p1: "Inventory real AI use from the logs, not from declarations."
f1.debrief.p2: "Handle tool requests fast: every month of waiting pushes people to an unchecked service."
f1.debrief.p3: "Sending CVs to an unchecked provider is transferring personal data with no contract or assessment: GDPR applies."
