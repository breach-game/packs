file.readme: "Ligne Rouge workstation. Case file: Tourterelle. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE LC-2027-161\nClient: Lucarne, connected doorbells and cameras. Scope: *.lucarne.test, 10.103.0.0/24.\nPurpose: customers report that a stranger talks to them through their camera. Ligne Rouge helps Lucarne understand, close the access, then review who can watch the videos.\nAgreed set-up: defence only. Reading the exports Lucarne provides, measures approved by management and run through `contain`. No customer camera is looked at.\nSigned: the head of security of Lucarne."
ada.outOfScope: "Stop. This target is outside mandate LC-2027-161. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
