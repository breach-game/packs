file.readme: "Poste Ligne Rouge. Dossier : Tourterelle. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT LC-2027-161\nClient : Lucarne, sonnettes et caméras connectées. Périmètre : *.lucarne.test, 10.103.0.0/24.\nObjet : des clients signalent qu'un inconnu leur parle par leur caméra. Ligne Rouge aide Lucarne à comprendre, à fermer les accès, puis à revoir qui peut regarder les vidéos.\nCadre convenu : défense seulement. Lecture des exports fournis par Lucarne, mesures validées par la direction et passées par `contain`. Aucune caméra de client n'est consultée.\nSigné : la directrice de la sécurité de Lucarne."
ada.outOfScope: "Stop. Cette cible est hors du mandat LC-2027-161. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
