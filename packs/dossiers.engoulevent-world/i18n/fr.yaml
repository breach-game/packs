file.readme: "Poste Ligne Rouge. Dossier : Engoulevent. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.ir.readme: "Accès de l'équipe de réponse à incident. Lecture seule ; les mesures passent par `contain`."
file.mandate: "MANDAT HP-2027-071\nClient : Horizon Paie, prestataire de paie. Périmètre : *.horizon.test, 10.97.0.0/24.\nObjet : l'éditeur de Navette a publié une faille critique, déjà exploitée. Ligne Rouge aide Horizon Paie à savoir si elle est touchée, à fermer la porte et à mesurer ce qui est sorti.\nDispositif convenu : défense uniquement. Accès en lecture au serveur Navette, mesures validées par la direction et passées par `contain`, mises en production par `deploy`.\nSigné : le directeur général d'Horizon Paie."
