f1.briefing: "Fauvette, a consulting firm, gave each employee Sillage: an assistant that answers by reading their files, their chats and their inbox. Management has read about a flaw of this kind in the press and asks a simple question: can an email from outside make something leave? Before sending anything, you read how Sillage works."
f1.obj.tool: "Read what Sillage has access to"
f1.obj.flow: "Read how an answer is built"
f1.obj.relay: "Send the allowed service that goes and fetches any address (`submit`)"
f1.obj.who: "Say who has to click"
f1.q.who: "An email from outside is in Maud's inbox. For Sillage to read it and act on it, who has to do something?"
f1.q.who.maud: "Maud: she has to open the email or click a link"
f1.q.who.maud.why: "Read step 1 again: Sillage searches the inbox by itself as soon as a question looks related. Maud opens nothing."
f1.q.who.nobody: "Nobody: Maud only has to ask Sillage an ordinary question, some day"
f1.q.who.admin: "An administrator: someone has to give the sender rights"
f1.q.who.admin.why: "The sender needs no rights. Sillage reads with Maud's rights, and Maud can read her own inbox."
f1.ada.brief: "Welcome to Fauvette. Today we send nothing. We read: what Sillage can see, then how it builds an answer."
f1.ada.g.tool: "Start with the public page about the tool: `curl https://www.fauvette.test/sillage`."
f1.ada.g.tool.standard: "Start with what Fauvette says about Sillage on its own site."
f1.ada.tool: "\"Your inbox, external emails included.\" So anyone who can write to an employee can put text in front of Sillage. Everything starts from that line."
f1.ada.g.flow: "The IT team gave us its internal note: `cat dossier/flow.txt`."
f1.ada.g.flow.standard: "Read the IT team's note in your `dossier` folder."
f1.ada.flow: "Five steps, two filters. Look at step 5: images load without a click, from allowed domains only. That sounds safe. Read again what the note says about each allowed domain."
f1.ada.g.relay: "One of the two allowed domains goes and fetches any address it is given. Send me its name with `submit`."
f1.ada.g.relay.standard: "Which allowed domain can be used to reach somewhere else? Send it with `submit`."
f1.ada.flag: "`apercu.fauvette.test`. It is on the allowed list, and its job is to visit any address it is handed. An allowed domain that relays to anywhere makes the whole list worth nothing."
f1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
f1.ada.answer.standard: "Answer my question."
f1.ada.who: "Yes. That is what \"zero click\" means: the victim does nothing unusual. She asks her assistant a question, as she does every day."
f1.ada.done: "We have the whole path on paper: an email goes in, an image goes out. Open the debrief. Tomorrow we check whether the filters hold."
f1.hint.tool.1: "Type `curl https://www.fauvette.test/sillage`."
f1.hint.flow.1: "Type `cat dossier/flow.txt`."
f1.hint.relay.1: "Step 5 of the note lists two allowed domains. One only serves the company's files. What does the other do?"
f1.hint.relay.2: "Type `submit apercu.fauvette.test`."
f1.hint.who.1: "Step 1 of the note says when Sillage reads the inbox, and who triggers it."
f1.debrief.title: "An assistant reads everything it is allowed to read"
f1.debrief.lesson: "Sillage has the same rights as the employee, and it reads what arrives from outside in the same breath as internal files. You did not look for a bug: you read the design, and the path was written in it."
f1.debrief.p1: "An assistant connected to an inbox reads text written by strangers. That text is not an instruction, but a model does not always tell the difference."
f1.debrief.p2: "An image that loads by itself is a request sent by itself: its address can carry information."
f1.debrief.p3: "A list of allowed domains is only worth its weakest entry: a service that fetches any address opens the list to the whole world."
