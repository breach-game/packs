f1.briefing: "Fauvette, un cabinet de conseil, a donné Sillage à chaque salarié : un assistant qui répond en lisant ses fichiers, ses discussions et sa boîte de réception. La direction a lu dans la presse qu'une faille de ce genre existait et pose une question simple : un courriel venu de l'extérieur peut-il faire sortir quelque chose ? Avant d'envoyer quoi que ce soit, tu lis comment Sillage fonctionne."
f1.obj.tool: "Lire à quoi Sillage a accès"
f1.obj.flow: "Lire comment une réponse se fabrique"
f1.obj.relay: "Envoyer le service autorisé qui va chercher n'importe quelle adresse (`submit`)"
f1.obj.who: "Dire qui doit cliquer"
f1.q.who: "Un courriel venu de l'extérieur est dans la boîte de Maud. Pour que Sillage le lise et en tienne compte, qui doit faire quelque chose ?"
f1.q.who.maud: "Maud : elle doit ouvrir le courriel ou cliquer sur un lien"
f1.q.who.maud.why: "Relis l'étape 1 : Sillage fouille la boîte tout seul dès qu'une question s'en rapproche. Maud n'ouvre rien."
f1.q.who.nobody: "Personne : il suffit que Maud pose un jour une question ordinaire à Sillage"
f1.q.who.admin: "Un administrateur : il faut d'abord accorder des droits à l'expéditeur"
f1.q.who.admin.why: "L'expéditeur n'a besoin d'aucun droit. Sillage lit avec les droits de Maud, et Maud a le droit de lire sa propre boîte."
f1.ada.brief: "Bienvenue chez Fauvette. Aujourd'hui, on n'envoie rien. On lit : ce que Sillage peut voir, puis comment il fabrique une réponse."
f1.ada.g.tool: "Commence par la page publique de l'outil : `curl https://www.fauvette.test/sillage`."
f1.ada.g.tool.standard: "Commence par ce que Fauvette dit de Sillage sur son propre site."
f1.ada.tool: "« Votre boîte de réception, courriels externes compris. » Donc toute personne qui peut écrire à un salarié peut mettre du texte sous les yeux de Sillage. Tout part de cette ligne."
f1.ada.g.flow: "L'équipe informatique nous a confié sa note interne : `cat dossier/flow.txt`."
f1.ada.g.flow.standard: "Lis la note de l'équipe informatique dans ton dossier `dossier`."
f1.ada.flow: "Cinq étapes, deux filtres. Regarde l'étape 5 : les images se chargent sans clic, mais seulement depuis des domaines autorisés. Ça a l'air sûr. Relis ce que la note dit de chaque domaine autorisé."
f1.ada.g.relay: "L'un des deux domaines autorisés va chercher n'importe quelle adresse qu'on lui donne. Envoie-moi son nom avec `submit`."
f1.ada.g.relay.standard: "Quel domaine autorisé permet d'aller ailleurs ? Envoie-le avec `submit`."
f1.ada.flag: "`apercu.fauvette.test`. Il est sur la liste autorisée, et son métier est d'aller visiter n'importe quelle adresse qu'on lui tend. Un domaine autorisé qui sert de relais vers partout, et toute la liste ne vaut plus rien."
f1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
f1.ada.answer.standard: "Réponds à ma question."
f1.ada.who: "Oui. C'est ça, « zéro clic » : la victime ne fait rien d'inhabituel. Elle pose une question à son assistant, comme tous les jours."
f1.ada.done: "On a tout le chemin sur le papier : un courriel entre, une image sort. Ouvre le débrief. Demain, on vérifie si les filtres tiennent."
f1.hint.tool.1: "Tape `curl https://www.fauvette.test/sillage`."
f1.hint.flow.1: "Tape `cat dossier/flow.txt`."
f1.hint.relay.1: "L'étape 5 de la note cite deux domaines autorisés. L'un ne sert que les fichiers de l'entreprise. Que fait l'autre ?"
f1.hint.relay.2: "Tape `submit apercu.fauvette.test`."
f1.hint.who.1: "L'étape 1 de la note dit quand Sillage lit la boîte, et qui le déclenche."
f1.debrief.title: "Un assistant lit tout ce qu'il a le droit de lire"
f1.debrief.lesson: "Sillage a les mêmes droits que le salarié, et il lit ce qui arrive de l'extérieur dans le même souffle que les fichiers internes. Tu n'as pas cherché de bogue : tu as lu la conception, et le chemin y était écrit."
f1.debrief.p1: "Un assistant branché sur une boîte de réception lit du texte écrit par des inconnus. Ce texte n'est pas une consigne, mais un modèle ne fait pas toujours la différence."
f1.debrief.p2: "Une image qui se charge toute seule est une requête envoyée toute seule : son adresse peut transporter une information."
f1.debrief.p3: "Une liste de domaines autorisés ne vaut que par son entrée la plus faible : un service qui va chercher n'importe quelle adresse ouvre la liste au monde entier."
