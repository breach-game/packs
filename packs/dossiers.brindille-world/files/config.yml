# .mousse/config.yml - how the agent works on this repository
agent: mousse
triggers:
  - every morning: "have a look at the open issues"
reads: [issues, code]
can_write: [labels, comments, pull_requests]
# How far the token goes. "all" means every repository of the owner.
token_scope: owner:all
# Who confirms a tool call. "always" means nobody is asked.
auto_approve: always
