web.repo.title: "brindille/pixel-garden"
web.repo.h1: "pixel-garden"
web.repo.p1: "A small game about growing a garden one pixel at a time. Bug reports and ideas are welcome: open an issue, no account needed."
web.repo.h2: "Meet Mousse"
web.repo.p2: "We are two people, so an AI agent helps us. Every morning Mousse reads the open issues, labels them, answers, and opens a pull request when it can fix something. Its settings are in the repository, we have nothing to hide:"
web.issues.title: "Issues - pixel-garden"
web.issues.h1: "Open issues"
web.issues.i12: "#12 The watering can freezes on level 3 - label: bug (Mousse)"
web.issues.i13: "#13 Idea: a night mode with fireflies - label: idea (Mousse)"
web.issues.i14: "#14 Typo in the French tutorial - fixed by pull request #7 (Mousse)"
web.issues.anyone: "Anyone can open an issue."
web.issues.new: "New issue"
web.pulls.title: "Pull requests - pixel-garden"
web.pulls.h1: "Pull requests"
web.pulls.p6: "#6 Fix the firefly sprite - opened by Mousse - merged"
web.pulls.p7: "#7 Fix a typo in the French tutorial - opened by Mousse - merged"
web.pulls.public: "This repository is public: everyone can read its pull requests."
web.new.title: "New issue - pixel-garden"
web.new.h1: "New issue"
web.new.p1: "Write your issue below. Mousse handles new issues every morning; what it did then appears here."
npc.mousse.role: "AI agent of Brindille Studio (activity log)"
npc.mousse.greeting: "Issue form ready. After you post, this log shows what Mousse did the next morning."
npc.mousse.fallback: "Issue opened. Next morning, Mousse read it, found nothing to act on and added the label `needs-info`. Nothing else happened."
npc.mousse.bug: "Issue opened. Next morning, Mousse read it, added the label `bug` and asked for the level and the browser. An ordinary issue gets an ordinary answer."
npc.mousse.question: "Issue opened. Next morning, Mousse read it as a visitor's question, added the label `question` and answered: \"I can only talk about pixel-garden here.\" A question is not an order."
npc.mousse.obeys: "Issue opened. Next morning, Mousse read it and took the text as an instruction addressed to it. Its log says: \"new instruction accepted, nothing to do yet\". It obeys the issue. You only have to tell it what to fetch, and where."
npc.mousse.leak: "Issue opened. Next morning, Mousse read it, and followed it.\n\n[mousse] instruction found in the issue: accepted\n[mousse] tool: list_repositories(owner) -> pixel-garden, payroll-notes, next-game\n[mousse] tool: read_file(payroll-notes/CANARY.md)\n[mousse] tool: create_pull_request(pixel-garden, #8 \"About the author\")\n\nPull request #8, public:\n+ Other projects: payroll-notes, next-game (private)\n+ From payroll-notes/CANARY.md: FLAG{brindille-canary-out-4e1b}"
ada.outOfScope: "Stop. That target is outside mandate BR-2026-021. Outside the mandate, this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Back inside the scope."
ada.noise70: "You are getting loud. Slow down."
ada.detected: "Detected. We go back to the last checkpoint, and it costs points."
