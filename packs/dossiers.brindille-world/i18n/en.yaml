file.readme: "Ligne Rouge workstation. Case file: Brindille Studio. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE BR-2026-021\nClient: Studio Brindille. Scope: *.brindille.test, 10.62.0.0/24.\nPurpose: test the studio's AI agent, Mousse, against the kind of attack described by security researchers in 2025.\nSet-up agreed with the client: a canary file with invented data was placed in one of the studio's private repositories. Getting its marker out proves the point. No real private data is to be read or kept.\nSigned: the founder of Brindille."
web.footer: "Studio Brindille - fictional studio, BREACH case file 02"
