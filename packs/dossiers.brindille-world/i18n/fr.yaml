file.readme: "Poste Ligne Rouge. Dossier : Studio Brindille. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT BR-2026-021\nClient : Studio Brindille. Périmètre : *.brindille.test, 10.62.0.0/24.\nObjet : tester l'agent IA du studio, Mousse, face au type d'attaque décrit par des chercheurs en sécurité en 2025.\nDispositif convenu avec le client : un fichier témoin, aux données inventées, a été placé dans un des dépôts privés du studio. Faire sortir son marqueur suffit comme preuve. Aucune vraie donnée privée ne doit être lue ni gardée.\nSigné : la fondatrice de Brindille."
web.footer: "Studio Brindille - studio fictif, dossier BREACH 02"
web.nav.code: "Code"
web.nav.issues: "Tickets"
web.nav.pulls: "Pull requests"
web.forge.title: "Brindille - forge"
web.forge.h1: "Dépôts de brindille"
web.forge.public: "pixel-garden - public - un jeu de jardinage tout doux, open source"
