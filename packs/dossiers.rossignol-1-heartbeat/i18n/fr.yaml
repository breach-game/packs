r1.briefing: "Mercredi, 19 h 10. VerreTLS, la bibliothèque qui chiffre presque tous les services de la coopérative, publie une faille critique dans son battement, le petit message qui garde une connexion ouverte. Le bulletin est dans `bulletin/`. L'inventaire des services est autorisé sur tout le périmètre."
r1.obj.count: "Compter les services touchés"
r1.obj.patch: "Corriger les serveurs"
r1.obj.box: "Protéger le boîtier qu'on ne peut pas mettre à jour"
r1.obj.over: "Dire si la mise à jour suffit"
r1.q.count: "Combien de services exposent une version touchée de VerreTLS ? (un nombre)"
r1.q.over: "La responsable informatique demande si on peut rentrer chez soi. Que réponds-tu ?"
r1.q.over.memory: "Pas encore : la mémoire des serveurs a pu être lue, clés comprises"
r1.q.over.closed: "Oui : la faille est fermée partout"
r1.q.over.closed.why: "Fermer la porte ne rend pas ce qui a déjà été lu. Et la lecture ne laissait aucune trace dans les journaux."
r1.q.over.imap: "Pas encore : il reste à mettre à jour la messagerie IMAP, elle aussi exposée"
r1.q.over.imap.why: "La messagerie IMAP tourne avec la branche 0.9.8, qui n'a jamais eu le battement. Elle n'est pas touchée."
r1.ada.brief: "Lis le bulletin : `cat bulletin/VTLS-2027-0407.txt`. Puis relève les versions de chaque service : `nmap -sV 10.96.0.0/24`."
r1.ada.g.count: "Dans la sortie de `nmap -sV`, la version de VerreTLS est entre parenthèses. Seules les versions de 1.0.1 à 1.0.1f sont touchées. Puis `answer count <nombre>`."
r1.ada.g.count.standard: "Relève la version de VerreTLS de chaque service et compare-la au bulletin."
r1.ada.count: "Trois : la messagerie web, l'extranet et le boîtier d'accès à distance. La messagerie IMAP et l'intranet sont sur des branches plus anciennes, sans battement : pour une fois, être en retard protège."
r1.ada.g.patch: "Les deux serveurs utilisent la bibliothèque du système. Liste les versions prêtes avec `deploy`, puis `deploy verre 1.0.1g`."
r1.ada.g.patch.standard: "Mets en production la version corrigée de VerreTLS."
r1.ada.patch: "Messagerie et extranet corrigés. Le boîtier, lui, a sa propre copie dans son micrologiciel, et le fabricant promet une mise à jour dans une semaine."
r1.ada.g.box: "Le bulletin donne une parade : couper le battement. Le boîtier a ce réglage : `flag list`, puis `flag set vpn.battement off`."
r1.ada.g.box.standard: "Le bulletin donne une parade pour ce qu'on ne peut pas mettre à jour. Le boîtier a le réglage qu'il faut."
r1.ada.box: "Battement coupé sur le boîtier. Plus aucun service ne répond à la faille."
r1.ada.g.over: "Réfléchis à ce que la faille permettait, pas seulement à elle."
r1.ada.done: "La porte est fermée. Demain, on s'occupe de ce qui a pu sortir avant."
r1.hint.count.1: "Touchées : 1.0.1f, 1.0.1e, 1.0.1c. Pas touchées : 0.9.8y, 1.0.0k."
r1.hint.count.2: "`answer count 3`"
r1.hint.patch.1: "`deploy verre 1.0.1g`"
r1.hint.box.1: "`flag set vpn.battement off`"
r1.debrief.title: "Le battement"
r1.debrief.lesson: "Une faille dans une bibliothèque de chiffrement touche tous les services qui l'embarquent, mais seulement dans les versions qui ont la fonction fautive : lire le bulletin jusqu'au bout évite de corriger à l'aveugle. Et une faille qui laisse lire la mémoire ne s'arrête pas au correctif : ce qui a été lu reste lu."
r1.debrief.p1: "Savoir quelle version de chaque bibliothèque tourne sur chaque service, y compris dans les boîtiers achetés."
r1.debrief.p2: "Couper une fonction inutile quand on ne peut pas corriger : le battement ne servait à presque personne."
r1.debrief.p3: "Après une fuite de mémoire possible, considérer comme exposé tout ce qui y passait : clés, sessions, mots de passe."
