r1.briefing: "Wednesday, 7:10 pm. VerreTLS, the library that encrypts nearly every service of the cooperative, publishes a critical flaw in its heartbeat, the small message that keeps a connection open. The advisory is in `bulletin/`. Service inventory is allowed across the whole scope."
r1.obj.count: "Count the affected services"
r1.obj.patch: "Patch the servers"
r1.obj.box: "Protect the box that cannot be updated"
r1.obj.over: "Say whether the update is enough"
r1.q.count: "How many services expose an affected version of VerreTLS? (a number)"
r1.q.over: "The IT manager asks whether everyone can go home. What do you answer?"
r1.q.over.memory: "Not yet: server memory may have been read, keys included"
r1.q.over.closed: "Yes: the flaw is closed everywhere"
r1.q.over.closed.why: "Shutting the door does not give back what was already read. And reading it left no trace in the logs."
r1.q.over.imap: "Not yet: the IMAP mail service must be updated too, it is exposed as well"
r1.q.over.imap.why: "The IMAP service runs the 0.9.8 branch, which never had the heartbeat. It is not affected."
r1.ada.brief: "Read the advisory: `cat bulletin/VTLS-2027-0407.txt`. Then note each service's version: `nmap -sV 10.96.0.0/24`."
r1.ada.g.count: "In the output of `nmap -sV`, the VerreTLS version is in brackets. Only versions 1.0.1 to 1.0.1f are affected. Then `answer count <number>`."
r1.ada.g.count.standard: "Note each service's VerreTLS version and compare it to the advisory."
r1.ada.count: "Three: the webmail, the extranet and the remote access box. The IMAP service and the intranet run older branches with no heartbeat: for once, being behind protects."
r1.ada.g.patch: "Both servers use the system library. List the ready versions with `deploy`, then `deploy verre 1.0.1g`."
r1.ada.g.patch.standard: "Release the fixed version of VerreTLS."
r1.ada.patch: "Webmail and extranet patched. The box has its own copy inside its firmware, and the manufacturer promises an update within a week."
r1.ada.g.box: "The advisory gives a stopgap: switch the heartbeat off. The box has that setting: `flag list`, then `flag set vpn.battement off`."
r1.ada.g.box.standard: "The advisory gives a stopgap for what cannot be updated. The box has the right setting."
r1.ada.box: "Heartbeat off on the box. No service answers the flaw any more."
r1.ada.g.over: "Think about what the flaw allowed, not only about the flaw."
r1.ada.done: "The door is shut. Tomorrow we deal with what may have left before."
r1.hint.count.1: "Affected: 1.0.1f, 1.0.1e, 1.0.1c. Not affected: 0.9.8y, 1.0.0k."
r1.hint.count.2: "`answer count 3`"
r1.hint.patch.1: "`deploy verre 1.0.1g`"
r1.hint.box.1: "`flag set vpn.battement off`"
r1.debrief.title: "The heartbeat"
r1.debrief.lesson: "A flaw in an encryption library affects every service that ships it, but only in the versions that have the faulty feature: reading the advisory to the end avoids patching blind. And a flaw that lets memory be read does not stop at the patch: what was read stays read."
r1.debrief.p1: "Know which version of each library runs on each service, including inside bought boxes."
r1.debrief.p2: "Switch off a feature you do not need when you cannot patch: hardly anyone used the heartbeat."
r1.debrief.p3: "After a possible memory leak, treat everything that went through memory as exposed: keys, sessions, passwords."
