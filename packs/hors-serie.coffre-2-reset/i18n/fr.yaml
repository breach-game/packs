c2.briefing: "Pour voir comment on change un mot de passe dans le Coffre, l'équipe a demandé une réinitialisation pour son compte de test. Le courriel reçu est dans `courrier/reinitialisation.eml`, le réglage dans `coffre/reinitialisation.yml`."
c2.obj.inside: "Lire ce que contient le jeton du lien"
c2.obj.forge: "Dire ce qu'il faut pour fabriquer le lien d'un autre"
c2.obj.token: "Un jeton tiré au hasard, assez long"
c2.obj.life: "Un lien court, à usage unique, jamais gardé en clair"
c2.q.inside: "Quel compte le jeton désigne-t-il ?"
c2.q.forge: "Que faut-il à un fraudeur pour fabriquer le lien d'un autre adhérent ?"
c2.q.forge.idtime: "Son numéro d'adhérent et l'heure de la demande"
c2.q.forge.password: "Son mot de passe actuel, pour signer le lien"
c2.q.forge.password.why: "Le jeton ne contient aucun secret, ni signature : seulement un compte et une heure."
c2.q.forge.mailbox: "Un accès à sa boîte mail, où le lien arrive"
c2.q.forge.mailbox.why: "C'est ce qu'un bon lien devrait exiger. Celui-ci se fabrique sans jamais voir le courriel."
c2.check.token: "Jeton tiré au hasard, 32 octets"
c2.check.life: "Valable 15 minutes, une seule fois, gardé sous forme d'empreinte"
c2.check.works: "La réinitialisation marche encore : même adresse, envoi à l'adresse du compte"
c2.ada.brief: "Lis le courriel : `cat courrier/reinitialisation.eml`. Regarde bien la fin du lien."
c2.ada.g.inside: "Le jeton finit par `=` : ça sent le Base64. Décode-le : `echo Y29tcHRlPXRlc3QtMDAwMTtlbWlzPTIwMjctMTEtMTVUMDk6MTI= | base64 -d`. Puis `answer inside <compte>`."
c2.ada.g.inside.standard: "Décode le jeton du lien, puis `answer inside <compte>`."
c2.ada.inside: "Un compte et une minute, rien d'autre. Le Base64 n'est pas un chiffrement : c'est juste une autre façon d'écrire."
c2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
c2.ada.answer.standard: "Ma question t'attend dans la messagerie."
c2.ada.forge: "Un numéro d'adhérent se trouve sur une attestation, et l'heure se devine à la minute près. Réglons ça : `cat coffre/reinitialisation.yml`."
c2.ada.g.token: "D'abord, un jeton que personne ne peut deviner : `token: random` et `token_bytes: 32`. `sed -i` ou `edit coffre/reinitialisation.yml`, puis `verify`."
c2.ada.g.token.standard: "D'abord, fais qu'aucun jeton ne se devine. Puis `verify`."
c2.ada.token: "Plus rien à deviner. Reste la durée de vie du lien."
c2.ada.g.life: "Un lien qui dure sept jours et sert plusieurs fois traîne dans les boîtes mail. `expires: 15m`, `single_use: on`, et `store: hash` pour que la base ne garde pas les jetons en clair. Puis `verify`."
c2.ada.g.life.standard: "Fais qu'un lien expire vite, ne serve qu'une fois, et ne soit pas lisible dans la base. Puis `verify`."
c2.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
c2.ada.done: "Un jeton tiré au hasard, valable quinze minutes, une seule fois, et rangé comme un mot de passe. Reste le plus gros chantier : les vieilles empreintes."
c2.hint.inside.1: "`base64 -d` lit ce qu'on lui envoie par un tube."
c2.hint.inside.2: "`answer inside test-0001`"
c2.hint.forge.1: "Regarde ce qu'il y a dans le jeton décodé, et rien d'autre."
c2.hint.token.1: "`sed -i \"s/token: account-and-time/token: random/\" coffre/reinitialisation.yml`"
c2.hint.token.2: "`token_bytes: 32`, puis `verify`."
c2.hint.life.1: "`expires: 15m`, `single_use: on`, `store: hash`, puis `verify`."
c2.debrief.title: "Le lien qui se devine"
c2.debrief.lesson: "Un lien de réinitialisation vaut un mot de passe. S'il se fabrique à partir de ce qu'on sait d'un compte, n'importe qui prend le compte sans jamais voir le courriel. Base64 ne cache rien : il ne fait que changer l'écriture."
c2.debrief.p1: "Tirer chaque jeton au hasard avec un générateur fait pour la cryptographie, assez long pour ne pas se deviner."
c2.debrief.p2: "Faire expirer le lien vite, ne l'accepter qu'une fois, et ne garder en base que son empreinte."
c2.debrief.p3: "Ne jamais prendre un encodage (Base64, hexadécimal) pour une protection."
