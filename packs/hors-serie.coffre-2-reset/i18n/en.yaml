c2.briefing: "To see how a password gets changed in the Vault, the team requested a reset for its test account. The email received is in `courrier/reinitialisation.eml`, the setting in `coffre/reinitialisation.yml`."
c2.obj.inside: "Read what the link's token contains"
c2.obj.forge: "Say what it takes to make someone else's link"
c2.obj.token: "A random token, long enough"
c2.obj.life: "A short-lived, single-use link, never kept in clear"
c2.q.inside: "Which account does the token name?"
c2.q.forge: "What does a fraudster need to make another member's link?"
c2.q.forge.idtime: "Their member number and the time of the request"
c2.q.forge.password: "Their current password, to sign the link"
c2.q.forge.password.why: "The token holds no secret and no signature: only an account and a time."
c2.q.forge.mailbox: "Access to their mailbox, where the link arrives"
c2.q.forge.mailbox.why: "That is what a good link should require. This one is made without ever seeing the email."
c2.check.token: "Random token, 32 bytes"
c2.check.life: "Valid 15 minutes, once only, kept as a hash"
c2.check.works: "Reset still works: same address, sent to the account's email"
c2.ada.brief: "Read the email: `cat courrier/reinitialisation.eml`. Look closely at the end of the link."
c2.ada.g.inside: "The token ends with `=`: it smells of Base64. Decode it: `echo Y29tcHRlPXRlc3QtMDAwMTtlbWlzPTIwMjctMTEtMTVUMDk6MTI= | base64 -d`. Then `answer inside <account>`."
c2.ada.g.inside.standard: "Decode the link's token, then `answer inside <account>`."
c2.ada.inside: "An account and a minute, nothing else. Base64 is not encryption: it is just another way of writing."
c2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
c2.ada.answer.standard: "My question is waiting in the messenger."
c2.ada.forge: "A member number is printed on a certificate, and the time can be guessed to the minute. Let's fix it: `cat coffre/reinitialisation.yml`."
c2.ada.g.token: "First, a token nobody can guess: `token: random` and `token_bytes: 32`. `sed -i` or `edit coffre/reinitialisation.yml`, then `verify`."
c2.ada.g.token.standard: "First, make sure no token can be guessed. Then `verify`."
c2.ada.token: "Nothing left to guess. The link's lifetime remains."
c2.ada.g.life: "A link that lasts seven days and works several times lingers in mailboxes. `expires: 15m`, `single_use: on`, and `store: hash` so the database does not keep tokens in clear. Then `verify`."
c2.ada.g.life.standard: "Make a link expire fast, work once, and be unreadable in the database. Then `verify`."
c2.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
c2.ada.done: "A random token, valid fifteen minutes, once, and stored like a password. The biggest job remains: the old hashes."
c2.hint.inside.1: "`base64 -d` reads what you send it through a pipe."
c2.hint.inside.2: "`answer inside test-0001`"
c2.hint.forge.1: "Look at what is in the decoded token, and nothing else."
c2.hint.token.1: "`sed -i \"s/token: account-and-time/token: random/\" coffre/reinitialisation.yml`"
c2.hint.token.2: "`token_bytes: 32`, then `verify`."
c2.hint.life.1: "`expires: 15m`, `single_use: on`, `store: hash`, then `verify`."
c2.debrief.title: "The guessable link"
c2.debrief.lesson: "A reset link is worth a password. If it can be made from what is known about an account, anyone takes the account without ever seeing the email. Base64 hides nothing: it only changes the writing."
c2.debrief.p1: "Draw each token at random with a generator made for cryptography, long enough not to be guessed."
c2.debrief.p2: "Make the link expire fast, accept it only once, and keep only its hash in the database."
c2.debrief.p3: "Never mistake an encoding (Base64, hexadecimal) for protection."
