id: dossiers.capitalone-3-exfil
name: "Mission 3 : Le trésor sans garde"
difficulty: 3
skills: [cloud, exfiltration]
requires: dossiers.pinson-world
briefing: c3.briefing
objectives:
  - { id: sync, text: c3.obj.sync }
rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: c3.ada.brief
  - on: { event: ShellCommandExecuted, command: "aws s3 sync s3://customer-data-capone ." }
    do:
      - objective.complete: sync
      - ada.say: c3.ada.sync
debrief:
  title: c3.debrief.title
  lesson: c3.debrief.lesson
  points: [c3.debrief.p1, c3.debrief.p2]
  reference: "AWS IAM Principle of Least Privilege"
