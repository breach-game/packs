p2.briefing: "Quelques minutes plus tard. Le service du faux pilote est arrêté et le pare-feu refuse désormais 203.0.113.50. Pourtant, le poste 42 n'est pas silencieux. Tu as le journal du pare-feu (`flows`), la console du SOC (`soc`) et l'accès en lecture seule au poste. Une règle de détection t'attend dans `regles/`."
p2.obj.zone: "Trouver par où le poste parle encore"
p2.obj.why: "Comprendre pourquoi le blocage ne suffit pas"
p2.obj.rule: "Écrire la règle qui voit ces questions, et rien d'autre"
p2.obj.stop: "Arrêter le second programme"
p2.q.zone: "Sous quelle zone DNS le poste 42 pose-t-il ses questions anormales ? (le nom de la zone, sans le morceau variable de gauche)"
p2.q.why: "Le pare-feu refuse 203.0.113.50 et n'ouvre aucune sortie DNS aux postes. Comment ces questions sortent-elles quand même ?"
p2.q.why.resolver: "Le poste interroge le résolveur interne, qui relaie toute question vers l'extérieur"
p2.q.why.encrypted: "Les questions DNS sont chiffrées, le pare-feu ne peut pas les lire"
p2.q.why.encrypted.why: "Elles passent en clair : tu les lis dans le journal du résolveur. Le pare-feu n'a pas à les voir, le poste ne parle qu'au résolveur interne."
p2.q.why.port: "Le pare-feu ne bloque jamais le port 53, quelle que soit la règle"
p2.q.why.port.why: "Le poste n'a aucune sortie directe sur le port 53. Il pose ses questions au résolveur 10.88.0.2, comme tout poste, et c'est le résolveur qui relaie."
p2.contain.cron: "Retirer la tâche planifiée de cbaron sur le poste 42 et supprimer le programme qu'elle lance"
p2.ada.brief: "Commence par le pare-feu : `flows --src 10.88.0.42`. Les refus vers 203.0.113.50 continuent, toutes les cinq minutes. Quelque chose réessaie."
p2.ada.g.zone: "Les refus ne disent pas tout. Regarde ce que le poste demande au résolveur : `soc logs resolveur dns`, puis `soc search TXT`. Les noms à rallonge ont tous la même fin. `answer zone <zone>`."
p2.ada.g.zone.standard: "Le poste parle encore, mais pas en HTTPS. Trouve à qui, dans les journaux du résolveur. `answer zone`."
p2.ada.zone: "Des questions TXT de cinquante caractères aléatoires, sous releve.meteo-cdn.example. Ce n'est pas un nom, c'est un morceau de fichier découpé. Les relevés sortent par le DNS."
p2.ada.g.why: "Le poste n'a pas de sortie DNS directe. À qui pose-t-il ses questions ?"
p2.ada.g.why.standard: "Réfléchis au chemin d'une question DNS, du poste jusqu'au serveur qui fait autorité pour la zone."
p2.ada.why: "Exactement. Le résolveur fait son travail : il relaie. Le canal est autorisé par construction, donc il faut le regarder."
p2.ada.g.rule: "Complète la règle : une ligne `name|endswith: <fin du nom>`, puis `rule test regles/dns-long.yml`. Attention, le widget météo de l'intranet interroge www.meteo-cdn.example toute la journée : il ne doit pas sonner."
p2.ada.g.rule.standard: "Écris la règle dans `regles/dns-long.yml` (champ `name`) et éprouve-la avec `rule test`. La météo de l'intranet ne doit pas sonner. Pour ouvrir le fichier : `edit regles/dns-long.yml`."
p2.ada.rule: "Elle voit chaque question volée et laisse passer la météo. Le SOC l'aura en production ce soir."
p2.ada.g.stop: "Le premier programme était un service. Celui-ci revient toutes les cinq minutes, régulier comme une tâche planifiée : `ssh ir@poste42.ombelle.test`, `crontab -l -u cbaron`. Puis `exit` et `contain remove fc-cache-update`."
p2.ada.g.stop.standard: "Quelque chose relance ce programme toutes les cinq minutes. Trouve quoi sur le poste, puis retire-le avec `contain`."
p2.ada.stopped: "Tâche retirée, programme supprimé. Les questions s'arrêtent."
p2.ada.done: "Deux mécanismes, un service et une tâche planifiée, et deux canaux, HTTPS puis DNS. Reste à remettre l'histoire dans l'ordre."
p2.hint.zone.1: "Dans `soc search TXT`, tous les noms finissent pareil après le long morceau aléatoire."
p2.hint.zone.2: "`answer zone releve.meteo-cdn.example`"
p2.hint.why.1: "Le poste pose ses questions à 10.88.0.2, le résolveur du laboratoire."
p2.hint.why.2: "`answer resolver`"
p2.hint.rule.1: "Le champ du nom demandé s'appelle `name`. Une règle sur `.meteo-cdn.example` sonne pour la météo. Prends une fin plus précise."
p2.hint.rule.2: "`echo \"name|endswith: .releve.meteo-cdn.example\" >> regles/dns-long.yml`, puis `rule test regles/dns-long.yml` Ou à la main, dans l'éditeur : `edit regles/dns-long.yml`, puis Ctrl+S."
p2.hint.stop.1: "`ssh ir@poste42.ombelle.test`, `crontab -l -u cbaron`, `exit`, puis `contain remove fc-cache-update`"
p2.debrief.title: "Le plan B"
p2.debrief.lesson: "Le faux pilote avait un frère : une tâche planifiée qui relançait un second programme toutes les cinq minutes. Refusé en HTTPS, il découpait les relevés en morceaux et les cachait dans des questions DNS, que le résolveur interne relayait de bonne foi. Bloquer une adresse ne suffit pas quand l'intrus a prévu un autre chemin."
p2.debrief.p1: "Surveiller les questions DNS : longueur, type TXT, volume par zone. Le DNS est autorisé partout, donc il sert souvent de sortie de secours."
p2.debrief.p2: "Chercher tous les mécanismes de persistance d'un poste (services, tâches planifiées, démarrage de session) avant de le déclarer propre."
p2.debrief.p3: "Écrire une règle précise : une fin de nom trop large sonne pour le trafic ordinaire, et une règle qui sonne trop finit ignorée."
