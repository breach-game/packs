p2.briefing: "A few minutes later. The fake driver's service is stopped and the firewall now refuses 203.0.113.50. And yet bench 42 is not silent. You have the firewall log (`flows`), the SOC console (`soc`) and read-only access to the workstation. A detection rule is waiting for you in `regles/`."
p2.obj.zone: "Find how the workstation still talks"
p2.obj.why: "Understand why blocking is not enough"
p2.obj.rule: "Write the rule that sees those questions, and nothing else"
p2.obj.stop: "Stop the second program"
p2.q.zone: "Under which DNS zone does bench 42 ask its abnormal questions? (the zone name, without the variable part on the left)"
p2.q.why: "The firewall refuses 203.0.113.50 and gives the workstations no DNS way out. How do those questions get out anyway?"
p2.q.why.resolver: "The workstation asks the internal resolver, which forwards any question outside"
p2.q.why.encrypted: "DNS questions are encrypted, so the firewall cannot read or stop them"
p2.q.why.encrypted.why: "They travel in clear: you read them in the resolver's log. The firewall does not need to see them, the workstation only talks to the internal resolver."
p2.q.why.port: "The firewall never blocks port 53, whatever rule the lab writes, because DNS must always work"
p2.q.why.port.why: "The workstation has no direct way out on port 53. It asks resolver 10.88.0.2, like any workstation, and the resolver forwards."
p2.contain.cron: "Remove cbaron's scheduled job on bench 42 and delete the program it starts"
p2.ada.brief: "Start with the firewall: `flows --src 10.88.0.42`. The refusals to 203.0.113.50 keep coming, every five minutes. Something keeps trying."
p2.ada.g.zone: "Refusals don't tell the whole story. Look at what the workstation asks the resolver: `soc logs resolveur dns`, then `soc search TXT`. The overlong names all end the same way. `answer zone <zone>`."
p2.ada.g.zone.standard: "The workstation still talks, but not over HTTPS. Find to whom, in the resolver's logs. `answer zone`."
p2.ada.zone: "TXT questions with fifty random characters, under releve.meteo-cdn.example. That's not a name, it's a slice of a file. The readings leave through DNS."
p2.ada.g.why: "The workstation has no direct DNS way out. Whom does it ask?"
p2.ada.g.why.standard: "Think about the path of a DNS question, from the workstation to the server that is authoritative for the zone."
p2.ada.why: "Exactly. The resolver does its job: it forwards. The channel is allowed by design, so it has to be watched."
p2.ada.g.rule: "Complete the rule: one line `name|endswith: <end of the name>`, then `rule test regles/dns-long.yml`. Careful, the intranet weather widget asks for www.meteo-cdn.example all day: it must not ring."
p2.ada.g.rule.standard: "Write the rule in `regles/dns-long.yml` (field `name`) and try it with `rule test`. The intranet weather must not ring. To open the file: `edit regles/dns-long.yml`."
p2.ada.rule: "It sees every stolen question and lets the weather through. The SOC will have it in production tonight."
p2.ada.g.stop: "The first program was a service. This one comes back every five minutes, regular as a scheduled job: `ssh ir@poste42.ombelle.test`, `crontab -l -u cbaron`. Then `exit` and `contain remove fc-cache-update`."
p2.ada.g.stop.standard: "Something restarts this program every five minutes. Find what on the workstation, then remove it with `contain`."
p2.ada.stopped: "Job removed, program deleted. The questions stop."
p2.ada.done: "Two mechanisms, a service and a scheduled job, and two channels, HTTPS then DNS. What's left is putting the story back in order."
p2.hint.zone.1: "In `soc search TXT`, every name ends the same way after the long random part."
p2.hint.zone.2: "`answer zone releve.meteo-cdn.example`"
p2.hint.why.1: "The workstation asks 10.88.0.2, the lab's resolver."
p2.hint.why.2: "`answer resolver`"
p2.hint.rule.1: "The queried name's field is `name`. A rule on `.meteo-cdn.example` rings for the weather. Pick a more precise ending."
p2.hint.rule.2: "`echo \"name|endswith: .releve.meteo-cdn.example\" >> regles/dns-long.yml`, then `rule test regles/dns-long.yml` Or by hand, in the editor: `edit regles/dns-long.yml`, then Ctrl+S."
p2.hint.stop.1: "`ssh ir@poste42.ombelle.test`, `crontab -l -u cbaron`, `exit`, then `contain remove fc-cache-update`"
p2.debrief.title: "Plan B"
p2.debrief.lesson: "The fake driver had a sibling: a scheduled job that restarted a second program every five minutes. Refused over HTTPS, it cut the readings into pieces and hid them in DNS questions, which the internal resolver forwarded in good faith. Blocking an address is not enough when the intruder has planned another way."
p2.debrief.p1: "Watch DNS questions: length, TXT type, volume per zone. DNS is allowed everywhere, so it often serves as the emergency exit."
p2.debrief.p2: "Look for every persistence mechanism on a workstation (services, scheduled jobs, session start) before calling it clean."
p2.debrief.p3: "Write a precise rule: a name ending that is too broad rings for ordinary traffic, and a rule that rings too often ends up ignored."
