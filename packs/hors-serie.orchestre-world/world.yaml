    hostname: k8s.ondine.test
    ip: 10.91.0.10
    os: Kubernetes 1.31
    map: { x: 240, z: -40, h: 140 }
    services:
      - { port: 6443, name: kubernetes, product: kube-apiserver 1.31 }
    web:
      "/api/v1/namespaces/diffusion/pods":
        status: 403
