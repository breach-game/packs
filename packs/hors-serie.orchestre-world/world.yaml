# Side series "Orchestre". Everything here is fictional: reserved .test domains and private addresses
# only. The cluster's API is a host whose web routes sit at the API paths kubectl asks for.
startTime: "2027-12-01T10:00:00+01:00"
mandate: ON-2027-063
scope:
  domains: ["*.ondine.test"]
  networks: ["10.91.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.91.0.2

config:
  on.dashboard.closed: false

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.91.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -320, z: 40, h: 70 }
    links: [tableau]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          .kube: {}
          mandate:
            ON-2027-063.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # The monitoring dashboard, opened without sign-in "for the weekend".
  - id: tableau
    hostname: tableau.ondine.test
    ip: 10.91.0.30
    os: Linux 6.1 (conteneur)
    map: { x: 40, z: 60, h: 110 }
    links: [k8s]
    services:
      - { port: 443, name: https, product: nginx 1.25 }
    web:
      "/":
        page:
          title: "Supervision · Ondine"
          blocks:
            - { h1: page.tableau.h1 }
            - { p: page.tableau.p }
            - table:
                head: [page.tableau.th.ns, page.tableau.th.pods, page.tableau.th.state]
                rows:
                  - [diffusion, "12", page.tableau.ok]
                  - [catalogue, "6", page.tableau.ok]
                  - [kube-system, "9", page.tableau.ok]
            - nav:
                - { href: /kubeconfig, label: page.tableau.kubeconfig }
            - { comment: page.tableau.comment }
            - { footer: page.tableau.footer }
        variants:
          - id: closed
            if: { config: on.dashboard.closed, eq: true }
            status: 401
            body: "401 Authorization Required\n"
      "/kubeconfig":
        headers: { content-type: text/yaml }
        body: "apiVersion: v1\nkind: Config\nclusters:\n- name: ondine\n  cluster:\n    server: https://k8s.ondine.test:6443\ncontexts:\n- name: tableau\n  context:\n    cluster: ondine\n    namespace: diffusion\n    user: lecteur-tableau\ncurrent-context: tableau\nusers:\n- name: lecteur-tableau\n  user:\n    token: ond-sa-lecteur-tableau-4f81c2\n"
        variants:
          - id: closed
            if: { config: on.dashboard.closed, eq: true }
            status: 401
            body: "401 Authorization Required\n"

