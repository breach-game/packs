file.readme: "Poste Ligne Rouge. Hors-série : Orchestre. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT ON-2027-063\nClient : Ondine, plateforme de musique en continu. Périmètre : *.ondine.test, 10.91.0.0/24.\nObjet : audit de la grappe de conteneurs. Ligne Rouge regarde ce qu'un inconnu peut voir de l'extérieur, et ce qu'il peut lire avec ce qu'il trouve.\nDispositif convenu : lecture seule. Aucune modification de la grappe, aucun accès aux machines par un conteneur. Un repère de test prouve chaque constat.\nSigné : le responsable de la plateforme Ondine."
