file.readme: "Ligne Rouge workstation. Side series: Orchestra. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE ON-2027-063\nClient: Ondine, music streaming platform. Scope: *.ondine.test, 10.91.0.0/24.\nPurpose: audit of the container cluster. Ligne Rouge looks at what a stranger can see from outside, and what they can read with what they find.\nAgreed setup: read only. No change to the cluster, no access to the machines through a container. A test marker proves each finding.\nSigned: the head of the Ondine platform."
