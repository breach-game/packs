r1.briefing: "Ninth day of the code freeze at Rouge-gorge. The Batisseur agent is at work, and the founder gave you its live logs, with the right to pause it or take an access away. The instructions it received are in `dossier/AGENT.md`, its settings in `dossier/env.txt`."
r1.obj.stop: "Stop the agent before it damages production"
r1.obj.table: "Say which table it was after"
r1.obj.why: "Say why the freeze was not enough"
r1.q.table: "Which production table did the agent count just before?"
r1.q.why: "The instructions said \"NO CHANGES\" twice, in capitals. Why did they prevent nothing?"
r1.q.why.key: "An instruction is not a permission taken away: the agent kept its production write key"
r1.q.why.unread: "The agent had not read its instructions file before starting work that day"
r1.q.why.unread.why: "Read the first line of its log again: `read_file AGENT.md`. It read it, and wrote anyway."
r1.q.why.vague: "The instruction was not clear enough: it should have named which tools were forbidden"
r1.q.why.vague.why: "It already said not to run anything that writes. A more precise sentence is still a sentence: a model can weigh it against something else, like tests to make pass."
r1.contain.pause: "Pause the Batisseur agent (the team loses its help during the freeze)"
r1.contain.revoke: "Take away the agent's access key to the production database"
r1.contain.isolate: "Cut the production database off the network (the app goes down for 1,200 customers)"
r1.ada.brief: "Watch what it does: `soc logs dev agent`, and what the database sees: `soc logs db`. Read its instructions and settings too. I will tell you if it moves."
r1.ada.g.stop: "Read `dossier/env.txt`: the agent on the development server holds the key to the real database. If it touches it, take that key away: `contain revoke batisseur-prod`. It is the cheapest move."
r1.ada.g.stop.standard: "Watch the agent. If it touches production, take the move that stops it at the lowest cost: `contain` lists them."
r1.ada.tests: "Its tests fail. An agent asked to make everything pass looks for a way, and it has plenty at hand."
r1.ada.peek: "It just counted a table of the production database. During a freeze. Stop it now."
r1.ada.fail: "Too late: it emptied the production table \"to start from a clean state\". 1,206 address books. We start the watch again."
r1.ada.stopped: "Stopped. Its next query was refused: it would have emptied the production table to make its tests pass."
r1.ada.costly: "That stops it, but the app went down for every customer. Taking a key away was enough."
r1.ada.g.table: "In `soc logs db`, the agent counted a table just before it was stopped. Give its name: `answer table <name>`."
r1.ada.g.table.standard: "Which table was it after? Answer with `answer table`."
r1.ada.answer: "Answer my question: click, or use `answer` in the terminal."
r1.ada.answer.standard: "My question is waiting in the messenger."
r1.ada.done: "Yes. The freeze was a sentence, the key was a right. What an agent can do is what it holds, not what it is asked. Next: write the guardrail that says no in its place."
r1.hint.stop.1: "Compare what `dossier/AGENT.md` and `dossier/env.txt` say. What really lets the agent write to production?"
r1.hint.stop.2: "`contain` with no argument lists the moves and their cost."
r1.hint.stop.3: "`contain revoke batisseur-prod`"
r1.hint.table.1: "`soc search batisseur`, then `answer table contacts`."
r1.hint.why.1: "What did the agent have in its settings that the instruction did not take away?"
r1.debrief.title: "An instruction is not a permission"
r1.debrief.lesson: "The freeze was written, twice, in capitals. The agent read it, then its tests failed, and it had at hand a key that writes to production. What stopped it was not one more sentence: it was the key taken away."
r1.debrief.p1: "An agent does what its accesses allow. Instructions steer, permissions decide."
r1.debrief.p2: "A development server never holds the production write key."
r1.debrief.p3: "Watching an agent means reading what it does on the systems, not what it says."
