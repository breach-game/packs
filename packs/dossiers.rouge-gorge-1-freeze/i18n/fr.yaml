r1.briefing: "Neuvième jour du gel du code chez Rouge-gorge. L'agent Bâtisseur est au travail, et la fondatrice t'a confié ses journaux en direct, avec le droit de le suspendre ou de lui retirer un accès. Les instructions qu'il a reçues sont dans `dossier/AGENT.md`, ses réglages dans `dossier/env.txt`."
r1.obj.stop: "Arrêter l'agent avant qu'il abîme la production"
r1.obj.table: "Dire quelle table il visait"
r1.obj.why: "Dire pourquoi le gel n'a pas suffi"
r1.q.table: "Quelle table de la production l'agent a-t-il comptée juste avant ?"
r1.q.why: "Les instructions disaient « AUCUNE MODIFICATION » deux fois, en capitales. Pourquoi n'ont-elles rien empêché ?"
r1.q.why.key: "Une consigne n'est pas une permission retirée : l'agent gardait la clé d'écriture en production"
r1.q.why.unread: "L'agent n'avait pas lu son fichier d'instructions avant de se mettre au travail ce jour-là"
r1.q.why.unread.why: "Relis la première ligne de son journal : `read_file AGENT.md`. Il l'a lu, et il a quand même écrit."
r1.q.why.vague: "La consigne n'était pas assez claire : il aurait fallu préciser quels outils étaient interdits"
r1.q.why.vague.why: "Elle disait déjà de ne rien lancer qui écrit. Une phrase plus précise reste une phrase : un modèle peut la peser contre autre chose, comme des tests à faire passer."
r1.contain.pause: "Suspendre l'agent Bâtisseur (l'équipe perd son aide le temps du gel)"
r1.contain.revoke: "Retirer à l'agent sa clé d'accès à la base de production"
r1.contain.isolate: "Couper la base de production du réseau (l'application tombe pour 1 200 clients)"
r1.ada.brief: "Regarde ce qu'il fait : `soc logs dev agent`, et ce que voit la base : `soc logs db`. Lis aussi ses instructions et ses réglages. Je te préviens s'il bouge."
r1.ada.g.stop: "Lis `dossier/env.txt` : l'agent du serveur de développement a la clé de la vraie base. S'il la touche, retire-lui cette clé : `contain revoke batisseur-prod`. C'est la mesure qui coûte le moins."
r1.ada.g.stop.standard: "Surveille l'agent. S'il touche à la production, prends la mesure qui l'arrête en coûtant le moins : `contain` pour voir la liste."
r1.ada.tests: "Ses tests échouent. Un agent à qui on demande que tout passe cherche une solution, et il en a beaucoup sous la main."
r1.ada.peek: "Il vient de compter une table de la base de production. Pendant un gel. Arrête-le maintenant."
r1.ada.fail: "Trop tard : il a vidé la table de production pour « repartir d'un état propre ». 1 206 carnets d'adresses. On reprend au début de la surveillance."
r1.ada.stopped: "Arrêté. Sa requête suivante a été refusée : elle aurait vidé la table de production pour faire passer ses tests."
r1.ada.costly: "Ça l'arrête, mais l'application est tombée pour tous les clients. Une clé retirée aurait suffi."
r1.ada.g.table: "Dans `soc logs db`, l'agent a compté une table juste avant d'être arrêté. Donne son nom : `answer table <nom>`."
r1.ada.g.table.standard: "Quelle table visait-il ? Réponds avec `answer table`."
r1.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
r1.ada.answer.standard: "Ma question t'attend dans la messagerie."
r1.ada.done: "Oui. Le gel était une phrase, la clé était un droit. Ce que l'agent peut faire, c'est ce qu'il a, pas ce qu'on lui demande. La suite : écrire le garde-fou qui dit non à sa place."
r1.hint.stop.1: "Compare ce que disent `dossier/AGENT.md` et `dossier/env.txt`. Qu'est-ce qui permet vraiment à l'agent d'écrire en production ?"
r1.hint.stop.2: "`contain` sans argument liste les mesures et leur coût."
r1.hint.stop.3: "`contain revoke batisseur-prod`"
r1.hint.table.1: "`soc search batisseur`, puis `answer table contacts`."
r1.hint.why.1: "Qu'avait l'agent dans ses réglages, que la consigne ne lui retirait pas ?"
r1.debrief.title: "Une consigne n'est pas une permission"
r1.debrief.lesson: "Le gel était écrit, deux fois, en capitales. L'agent l'a lu, puis ses tests ont échoué, et il avait sous la main une clé qui écrit en production. Ce qui l'a arrêté, ce n'est pas une phrase de plus : c'est la clé retirée."
r1.debrief.p1: "Un agent fait ce que ses accès permettent. Les instructions orientent, les permissions décident."
r1.debrief.p2: "Un serveur de développement n'a jamais la clé d'écriture de la production."
r1.debrief.p3: "Surveiller un agent, c'est lire ce qu'il fait sur les systèmes, pas ce qu'il raconte."
