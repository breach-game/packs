# Side series "Le Correctif du vendredi". Everything here is fictional: reserved .test domains, private and documentation addresses only.
startTime: "2027-11-08T09:00:00+01:00"
mandate: BE-2027-031
scope:
  domains: ["*.bergamote.test"]
  networks: ["10.85.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.85.0.2

config:
  be.redeployed: false

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.85.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -300, z: 40, h: 70 }
    links: [portal, staging, internal]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            BE-2027-031.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # The customer portal, open to the internet.
  - id: portal
    hostname: portail.bergamote.test
    ip: 10.85.0.20
    os: Linux 6.1 (Debian 12)
    map: { x: 160, z: -100, h: 130 }
    services:
      - { port: 443, name: https, product: nginx 1.24 }
    web:
      "/version":
        headers: { content-type: application/json }
        body: "{\"product\": \"portail\", \"release\": \"5.6.0\", \"jeton-web\": \"3.2.1\", \"deployed\": \"2027-11-05T22:41:09+01:00\"}\n"
        variants:
          - id: fixed
            if: { config: be.redeployed, eq: true }
            headers: { content-type: application/json }
            body: "{\"product\": \"portail\", \"release\": \"5.6.1\", \"jeton-web\": \"3.2.4\", \"deployed\": \"2027-11-08T10:02:30+01:00\"}\n"

  # The staging copy, where Friday's test passed.
  - id: staging
    hostname: recette.bergamote.test
    ip: 10.85.0.21
    os: Linux 6.1 (Debian 12)
    map: { x: 260, z: 40, h: 90 }
    services:
      - { port: 443, name: https, product: nginx 1.24 }
    web:
      "/version":
        headers: { content-type: application/json }
        body: "{\"product\": \"portail\", \"release\": \"5.6.1\", \"jeton-web\": \"3.2.4\", \"deployed\": \"2027-11-05T18:12:44+01:00\"}\n"

  # The staff tool, reachable through the VPN only.
  - id: internal
    hostname: outil.bergamote.test
    ip: 10.85.0.30
    os: Linux 6.1 (Debian 12)
    map: { x: 120, z: 160, h: 80 }
    services:
      - { port: 443, name: https, product: gunicorn 22 }

dns:
  bergamote.test: { A: ["10.85.0.20"] }
  portail.bergamote.test: { A: ["10.85.0.20"] }
  recette.bergamote.test: { A: ["10.85.0.21"] }
  outil.bergamote.test: { A: ["10.85.0.30"] }

whois:
  bergamote.test: |
    Domain Name: BERGAMOTE.TEST
    Creation Date: 2014-05-06T08:00:00Z
    Registrant Organization: Bergamote Logiciel SAS
    Registrant Country: FR

# Published weaknesses of fictional components, for `sbom --vuln`.
advisories:
  - id: BRX-2027-0419
    package: jeton-web
    versions: ["3.2.0", "3.2.1", "3.2.2", "3.2.3"]
    severity: high
    summary: adv.jeton
    fixed: "3.2.4"
  - id: BRX-2027-0412
    package: pdf-moule
    versions: ["1.8.0", "1.8.1", "1.8.2"]
    severity: critical
    summary: adv.pdf
    fixed: "1.8.3"
  - id: BRX-2027-0388
    package: modules.example/graphe-go
    versions: ["v0.9.1"]
    severity: medium
    summary: adv.graphe
    fixed: "v0.9.2"

noise:
  nmap:
    base: 18
    flags: { "-sn": -10, "-sV": 10, "-A": 30, "-T4": 18, "-T5": 36, "-p-": 16 }
  dig: 0
  whois: 0
  # The firm is the client and checks its own servers: reading /version is not an intrusion.
  curl: 0
  browse: 0
  chat: 2

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected
