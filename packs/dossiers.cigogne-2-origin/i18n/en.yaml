c2.debrief.title: "The origin"
c2.debrief.lesson: "The false route lasted an hour and forty-five minutes, and three neighbouring networks out of eight refused it because they filter what is announced to them. Nacre could fix nothing alone, but it could make the lie checkable: sign the origin of its routes, sign its zone, watch announcements, and take away its customers' option to click past the warning."
c2.debrief.p1: "Sign the origin of your routes (RPKI) and require it from your providers: networks that validate can then refuse a false announcement."
c2.debrief.p2: "Filter what your customers and neighbours announce: it is what every network owes the others."
c2.debrief.p3: "Sign your zone (DNSSEC) and preload HSTS: a false answer can be rejected, and the warning can no longer be ignored."
c2.debrief.p4: "Watch the announcements of your addresses: be warned by a tool, not by a customer."
c2.facts.title: "What really happened: MyEtherWallet, 2018"
c2.facts.p1: "On 24 April 2018, from about 11:05 to 12:55 UTC, an Internet provider (eNet, AS10297) announces more specific routes for part of the addresses of Route 53, Amazon's name service. They are not its own."
c2.facts.p2: "For almost two hours, part of the questions meant for those name servers arrive elsewhere. The rogue servers answer for one site only, the MyEtherWallet wallet, and ignore every other name."
c2.facts.p3: "Visitors are sent to a fake site hosted in Russia. It serves a self-signed certificate: to go further, people had to click past the browser's warning."
c2.facts.p4: "Not all of the Internet was affected: some large networks filtered these announcements and did not accept them."
c2.facts.p5: "The protections named by the analyses: validating route origins (RPKI), filtering announcements (the MANRS rules), signing zones (DNSSEC), HSTS, and never clicking past a certificate warning."
