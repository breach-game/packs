c2.briefing: "Wednesday 13 June, 9 am. The false route disappeared yesterday afternoon. Nacre had nothing to repair at home, and that is exactly what worries management: what do you do against an attack that happens entirely on other people's networks? The team has rebuilt the afternoon in `routes/chronologie.csv`, and the name operator asked its neighbouring networks what they did with the announcement: `routes/voisins.csv`."
