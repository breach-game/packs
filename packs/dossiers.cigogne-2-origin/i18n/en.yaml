c2.q.filtered: "How many neighbouring networks refused the false announcement?"
c2.q.last: "The route lies and the name lies. What still protects a customer?"
c2.q.last.stop: "Stopping dead at the certificate warning"
c2.q.last.padlock: "Checking a padlock shows in the bar"
c2.q.last.padlock.why: "After clicking \"continue anyway\", the connection is encrypted, but with the fake site. The useful signal comes earlier: it is the warning itself."
c2.q.last.bookmark: "Opening the site from a saved bookmark"
c2.q.last.bookmark.why: "The bookmark holds the right name, and the right name is exactly what led to the wrong place yesterday. Only the certificate told the truth."
c2.check.roa: "Route origins are signed (ROA), at Nacre and required from its name operator"
c2.check.length: "The signature allows only the block length actually announced"
c2.check.alerts: "An alert fires as soon as a new origin announces these addresses"
