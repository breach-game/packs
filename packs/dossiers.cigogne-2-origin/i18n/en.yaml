c2.tl.text: "Nacre's afternoon"
c2.tl.announce: "A network announces a more specific route to the name server"
c2.tl.lie: "Another server answers in place of Nacre's name server"
c2.tl.ticket: "A customer writes to support: certificate warning"
c2.tl.office: "The on-call engineer checks the site from the office: all normal"
c2.tl.operator: "The name operator confirms and calls neighbouring networks"
c2.tl.withdrawn: "The false announcement is withdrawn"
