c2.ada.brief: "We start by measuring. `cat routes/chronologie.csv`: look for when network 64510's announcement appears and when it is withdrawn."
c2.ada.g.minutes: "`grep \"AS64510\" routes/chronologie.csv` shows the two lines: the appearance and the withdrawal. Count the minutes between them, then `answer minutes <number>`."
c2.ada.g.minutes.standard: "Find in the timeline when the announcement appears and when it is withdrawn, and give the duration in minutes with `answer minutes`."
c2.ada.minutes: "An hour and forty-five minutes. And look at what happens in the middle: the first ticket comes eight minutes after the announcement, but it is a customer warning us, not a tool. An alert on any new origin would have rung at 1.10 pm. Now the neighbours: `routes/voisins.csv`."
c2.ada.g.filtered: "Count the networks that refused: `grep -c \",rejected\" routes/voisins.csv`, then `answer filtered <number>`."
c2.ada.g.filtered.standard: "Count in `routes/voisins.csv` the networks that refused the announcement."
c2.ada.filtered: "Three out of eight, and they are exactly the three that filter what their neighbours announce. Their customers saw nothing yesterday. That is why some of our customers had the warning and others did not: it all depended on the network they came through. We cannot filter on behalf of others, but we can give them something to check against. The plan: `routage/plan.yml`."
c2.ada.g.plan: "`cat routage/plan.yml`: each line gives its possible values after the `#`. Five must change: `signed-roa`, `as-announced`, `on-new-origin`, `dnssec-signed`, `hsts-preloaded`. Change them with `edit routage/plan.yml` or `sed -i`, then `verify`."
c2.ada.g.plan.standard: "Fix `routage/plan.yml`, then run `verify`."
c2.ada.almost: "Not yet. `verify` tells you which lines are not right."
c2.ada.plan: "Five lines, from the route to the browser. A signed origin states publicly which network may announce these addresses, and at what length: a /24 coming from elsewhere can then be refused by everyone who checks. The alert warns us before the first customer does. A signed zone lets a validating resolver reject a false answer. And preloading removes the \"continue anyway\" button. None of these lines is enough alone, and none depends on us only: that is why we write them all. One last question."
c2.ada.g.last: "Answer my question: what still protects the customer."
c2.ada.last: "Yes. Yesterday the route lied, the name lied, and the certificate told the truth. The browser said so to every customer, full page. Everything we write in the plan is there so that page never appears, and the last line is there so nobody can click past it. What is left is telling the afternoon in order."
c2.ada.g.story: "`timeline apresmidi` shows the events shuffled. Answer with their ids in order: `timeline apresmidi <id> <id> …`."
c2.ada.g.story.standard: "Put the afternoon in order, from the announcement to the signing of the routes."
c2.ada.done: "The Internet holds because thousands of networks take each other's word. Most of the time it works, and when it does not, the one who suffers is not the one who can fix it. The next card tells the real case this file is inspired by."
