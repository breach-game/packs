c2.briefing: "Mercredi 13 juin, 9 h. La fausse route a disparu hier après-midi. Nacre n'a rien eu à réparer chez elle, et c'est bien ce qui inquiète la direction : que faire contre une attaque qui se passe entièrement chez les autres ? L'équipe a reconstitué l'après-midi dans `routes/chronologie.csv`, et l'opérateur de noms a demandé à ses réseaux voisins ce qu'ils avaient fait de l'annonce : `routes/voisins.csv`."
c2.obj.minutes: "Mesurer combien de temps la fausse route a tenu"
c2.obj.filtered: "Compter les réseaux voisins qui l'ont refusée"
c2.obj.plan: "Écrire le plan de Nacre pour ses routes, ses noms et son site"
c2.obj.last: "Dire ce qui protège encore le client quand tout le reste a cédé"
c2.obj.story: "Remettre l'après-midi dans l'ordre"
c2.q.minutes: "Combien de minutes la fausse annonce est-elle restée visible, de son apparition à son retrait ?"
c2.q.filtered: "Combien de réseaux voisins ont refusé la fausse annonce ?"
c2.q.last: "La route ment et le nom ment. Qu'est-ce qui protège encore un client ?"
c2.q.last.stop: "S'arrêter net devant l'avertissement de certificat"
c2.q.last.padlock: "Vérifier qu'un cadenas s'affiche dans la barre"
c2.q.last.padlock.why: "Après avoir cliqué sur « continuer quand même », la connexion est chiffrée, mais avec le faux site. Le signal utile vient avant : c'est l'avertissement lui-même."
c2.q.last.bookmark: "Ouvrir le site depuis un favori enregistré"
c2.q.last.bookmark.why: "Le favori contient le bon nom, et c'est justement le bon nom qui menait au mauvais endroit hier. Seul le certificat disait la vérité."
c2.check.roa: "L'origine des routes est signée (ROA), chez Nacre et exigée de son opérateur de noms"
c2.check.length: "La signature n'autorise que la longueur de bloc réellement annoncée"
c2.check.alerts: "Une alerte se déclenche dès qu'une nouvelle origine annonce ces adresses"
c2.check.dnssec: "La zone de Nacre est signée (DNSSEC)"
c2.check.hsts: "Le navigateur refuse de passer l'avertissement (HSTS préchargé)"
c2.check.works: "Le site reste en ligne"
c2.tl.text: "L'après-midi de Nacre"
c2.tl.announce: "Un réseau annonce une route plus précise vers le serveur de noms"
c2.tl.lie: "Un autre serveur répond à la place du serveur de noms de Nacre"
c2.tl.ticket: "Un client écrit au support : avertissement de certificat"
c2.tl.office: "L'astreinte vérifie le site depuis le bureau : tout est normal"
c2.tl.operator: "L'opérateur de noms confirme et appelle les réseaux voisins"
c2.tl.withdrawn: "La fausse annonce est retirée"
c2.tl.signed: "L'origine des routes est signée"
c2.ada.brief: "On commence par mesurer. `cat routes/chronologie.csv` : cherche quand l'annonce du réseau 64510 apparaît et quand elle est retirée."
c2.ada.g.minutes: "`grep \"AS64510\" routes/chronologie.csv` montre les deux lignes : l'apparition et le retrait. Compte les minutes entre les deux, puis `answer minutes <nombre>`."
c2.ada.g.minutes.standard: "Trouve dans la chronologie l'apparition et le retrait de l'annonce, et donne la durée en minutes avec `answer minutes`."
c2.ada.minutes: "Une heure quarante-cinq. Et regarde ce qui se passe au milieu : le premier ticket arrive huit minutes après l'annonce, mais c'est un client qui nous prévient, pas un outil. Une alerte sur toute nouvelle origine aurait sonné à 13 h 10. Maintenant les voisins : `routes/voisins.csv`."
c2.ada.g.filtered: "Compte les réseaux qui ont refusé : `grep -c \",rejected\" routes/voisins.csv`, puis `answer filtered <nombre>`."
c2.ada.g.filtered.standard: "Compte dans `routes/voisins.csv` les réseaux qui ont refusé l'annonce."
c2.ada.filtered: "Trois sur huit, et ce sont exactement les trois qui filtrent ce que leurs voisins annoncent. Leurs clients n'ont rien vu hier. Voilà pourquoi certains de nos clients avaient l'avertissement et d'autres non : tout dépendait du réseau par lequel ils passaient. On ne peut pas filtrer à la place des autres, mais on peut leur donner de quoi vérifier. Le plan : `routage/plan.yml`."
c2.ada.g.plan: "`cat routage/plan.yml` : chaque ligne donne ses valeurs possibles après le `#`. Il en faut cinq : `signed-roa`, `as-announced`, `on-new-origin`, `dnssec-signed`, `hsts-preloaded`. Change-les avec `edit routage/plan.yml` ou `sed -i`, puis `verify`."
c2.ada.g.plan.standard: "Corrige `routage/plan.yml`, puis lance `verify`. Pour ouvrir le fichier : `edit routage/plan.yml`."
c2.ada.almost: "Pas encore. `verify` te dit quelles lignes ne vont pas."
c2.ada.plan: "Cinq lignes, de la route jusqu'au navigateur. Une origine signée dit publiquement quel réseau a le droit d'annoncer ces adresses, et à quelle longueur : un /24 sorti d'ailleurs devient refusable par tous ceux qui vérifient. L'alerte nous prévient avant le premier client. Une zone signée permet à un résolveur qui valide de rejeter une fausse réponse. Et le préchargement retire le bouton « continuer quand même ». Aucune de ces lignes ne suffit seule, et aucune ne dépend que de nous : c'est pour ça qu'on les met toutes. Une dernière question."
c2.ada.g.last: "Réponds à ma question : ce qui protège encore le client."
c2.ada.last: "Oui. Hier, la route mentait, le nom mentait, et le certificat disait la vérité. Le navigateur l'a dit à chaque client, en pleine page. Tout ce qu'on écrit dans le plan sert à ce que cette page n'apparaisse jamais, et la dernière ligne sert à ce qu'on ne puisse plus la passer. Il reste à raconter l'après-midi dans l'ordre."
c2.ada.g.story: "`timeline apresmidi` montre les événements mélangés. Réponds avec leurs identifiants dans l'ordre : `timeline apresmidi <id> <id> …`."
c2.ada.g.story.standard: "Remets l'après-midi dans l'ordre, de l'annonce à la signature des routes."
c2.ada.done: "Internet tient parce que des milliers de réseaux se croient sur parole. La plupart du temps ça marche, et quand ça ne marche pas, celui qui en souffre n'est pas celui qui peut réparer. La fiche suivante raconte le cas réel dont ce dossier s'inspire."
c2.hint.minutes.1: "L'annonce apparaît à 13:10 et elle est retirée à 14:55."
c2.hint.minutes.2: "`answer minutes 105`"
c2.hint.filtered.1: "`grep -c \",rejected\" routes/voisins.csv`"
c2.hint.filtered.2: "`answer filtered 3`"
c2.hint.plan.1: "Les valeurs attendues : `signed-roa`, `as-announced`, `on-new-origin`, `dnssec-signed`, `hsts-preloaded`."
c2.hint.plan.2: "Avec l'éditeur : `edit routage/plan.yml`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/dns_zone: plain/dns_zone: dnssec-signed/\" routage/plan.yml`."
c2.hint.last.1: "Un seul élément disait la vérité hier. Tape `answer stop`."
c2.hint.story.1: "Tout commence par l'annonce et finit par la signature. Le faux serveur répond avant que le premier client écrive."
c2.hint.story.2: "`timeline apresmidi announce lie ticket office operator withdrawn signed`"
c2.debrief.title: "L'origine"
c2.debrief.lesson: "La fausse route a tenu une heure quarante-cinq, et trois réseaux voisins sur huit l'ont refusée parce qu'ils filtrent ce qu'on leur annonce. Nacre ne pouvait rien corriger seule, mais elle pouvait rendre le mensonge vérifiable : signer l'origine de ses routes, signer sa zone, surveiller les annonces, et retirer à ses clients la possibilité de passer l'avertissement."
c2.debrief.p1: "Signer l'origine de ses routes (RPKI) et l'exiger de ses prestataires : les réseaux qui valident peuvent alors refuser une fausse annonce."
c2.debrief.p2: "Filtrer ce que ses clients et voisins annoncent : c'est ce que chaque réseau doit aux autres."
c2.debrief.p3: "Signer sa zone (DNSSEC) et précharger HSTS : une fausse réponse devient rejetable, et l'avertissement ne peut plus être ignoré."
c2.debrief.p4: "Surveiller les annonces de ses adresses : être prévenu par un outil, pas par un client."
c2.facts.title: "Ce qui s'est vraiment passé : MyEtherWallet, 2018"
c2.facts.p1: "Le 24 avril 2018, d'environ 11 h 05 à 12 h 55 UTC, un fournisseur d'accès (eNet, AS10297) annonce des routes plus précises pour une partie des adresses de Route 53, le service de noms d'Amazon. Elles ne lui appartiennent pas."
c2.facts.p2: "Pendant près de deux heures, une partie des questions destinées à ces serveurs de noms arrive ailleurs. Les faux serveurs ne répondent que pour un seul site, celui du portefeuille MyEtherWallet, et ignorent tous les autres noms."
c2.facts.p3: "Les visiteurs sont envoyés vers un faux site hébergé en Russie. Il présente un certificat signé par lui-même : pour aller plus loin, il fallait passer l'avertissement du navigateur."
c2.facts.p4: "Tout Internet n'a pas été touché : certains grands réseaux filtraient ces annonces et ne les ont pas acceptées."
c2.facts.p5: "Les protections citées par les analyses : valider l'origine des routes (RPKI), filtrer les annonces (les règles MANRS), signer les zones (DNSSEC), HSTS, et ne jamais passer un avertissement de certificat."
