c1.briefing: "Friday 4 August, 4.20 pm. At Sémaphore, the internal helpdesk gets report after report: a text from the \"IT department\" has reached the personal phones of dozens of employees. Some clicked. The report is in your folder, and a test phone that received the message is plugged into your workstation."
c1.obj.link: "Find where the text's link leads"
c1.obj.count: "Count the accounts opened from an unknown address"
c1.obj.close: "Close the sessions and block the domain"
c1.obj.code: "Say why the code by text prevented nothing"
c1.sms.carrier: "Nordtel: your August bill is available in your customer area."
c1.sms.it: "SEMAPHORE IT: your password has expired. Sign in again before 5 pm to keep your access: https://semaphore-sso.example/login"
c1.sms.real: "Sémaphore security: a fake text is going round. The IT department never writes to you by text. Do not click, report it on 4400."
c1.q.link: "Which site does the fake text's link open?"
c1.q.count: "How many accounts signed in from the intruder's address?"
c1.q.code: "These accounts had a password and a code by text. Why was that not enough?"
c1.q.code.relay: "The fake page asked for the code too, and used it at once"
c1.q.code.guess: "A six-digit code can be guessed in a few tries"
c1.q.code.guess.why: "The log shows no failed try from that address: every sign-in worked first time. The code was not guessed, it was given."
c1.q.code.nosms: "The text with the code never reached the employees"
c1.q.code.nosms.why: "It did: employees say they typed their password \"and the code\". The question is: on which page?"
c1.contain.sessions: "Close the sessions of the accounts the intruder opened and force a new password"
c1.contain.domain: "Block the fake text's domain and report it to its host and its registrar"
c1.ada.brief: "Read the report: `cat signalement.txt`. Then the phone: `sms`, and `sms 2` to open the message from the \"IT department\"."
c1.ada.g.link: "`sms` lists the messages, `sms 2` opens the fake one and shows where its link leads. `answer link <site>`."
c1.ada.g.link.standard: "Open the fake message on the test phone and find the site its link opens."
c1.ada.link: "`semaphore-sso.example`: the company's name, the word you read on the real page, and a domain registered eighteen minutes before the first text. No blocklist knows a domain that young. Look at the sender too: an ordinary number, not a name. Now, who clicked? `soc logs sso auth`. The intruder may still be signing in: read the log again just before you count."
c1.ada.g.count: "`soc search 203.0.113.9` shows every sign-in from that address. Count the different accounts, then `answer count <number>`."
c1.ada.g.count.standard: "Look in the sign-in log for an address several accounts sign in from within minutes."
c1.ada.count: "Three accounts, two from support and one from operations, from a single address. With the right password and the right code, every time. Support accounts open the customers' console."
c1.ada.count.close: "We close it: `contain`."
c1.ada.g.close: "Two measures: `contain revoke sessions`, then `contain block faux-site`."
c1.ada.g.close.standard: "Get the intruder out of the three accounts and cut the road to the fake site. `contain` lists the measures."
c1.ada.close: "The three sessions are closed and the domain is blocked here. Another will be born tomorrow. One question."
c1.ada.g.code: "Answer my question. Read again what the employees say in `signalement.txt`."
c1.ada.done: "A code by text protects against a password stolen six months ago. It does not protect against a page that asks you for it now and replays it within the second. The employees were not foolish: the message was well made, on a Friday at 4 pm. On Monday we look at the pilot team. They got the same text."
c1.hint.link.1: "`sms 2`, then read the `opens:` line under the link."
c1.hint.link.2: "`answer link semaphore-sso.example`"
c1.hint.count.1: "`soc search 203.0.113.9`: agent-014, agent-052 and ops-007."
c1.hint.count.2: "`answer count 3`"
c1.hint.close.1: "`contain revoke sessions` then `contain block faux-site`"
c1.hint.code.1: "The employees typed the password and the code on the fake page. `answer relay`"
c1.debrief.title: "Your password has expired"
c1.debrief.lesson: "A well-written text, a domain in the company's name born half an hour earlier, a page asking for the password and then the code. Everything the employee types is replayed at once on the real page. A code you can copy can be copied for someone else."
c1.debrief.p1: "A code received by text or read in an app does not hold against a fake page: whoever types it gives it away."
c1.debrief.p2: "Say again and again how the IT department writes to you, and how it never does."
c1.debrief.p3: "Watch for several accounts signing in from one unknown address, and be able to close sessions with one command."
