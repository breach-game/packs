c1.briefing: "Vendredi 4 août, 16 h 20. Chez Sémaphore, le support interne reçoit signalement sur signalement : un SMS du « service informatique » est arrivé sur les téléphones personnels de dizaines d'employés. Certains ont cliqué. Le signalement est dans ton dossier, et un téléphone de test qui a reçu le message est branché à ton poste."
c1.obj.link: "Trouver où mène le lien du SMS"
c1.obj.count: "Compter les comptes ouverts depuis une adresse inconnue"
c1.obj.close: "Fermer les sessions et bloquer le domaine"
c1.obj.code: "Dire pourquoi le code par SMS n'a rien empêché"
c1.sms.carrier: "Nordtel : votre facture d'août est disponible dans votre espace client."
c1.sms.it: "SEMAPHORE IT : votre mot de passe a expiré. Reconnectez-vous avant 17 h pour garder votre accès : https://semaphore-sso.example/login"
c1.sms.real: "Sémaphore sécurité : un faux SMS circule. Le service informatique ne vous écrit jamais par SMS. Ne cliquez pas, signalez au 4400."
c1.q.link: "Quel site le lien du faux SMS ouvre-t-il ?"
c1.q.count: "Combien de comptes se sont connectés depuis l'adresse 203.0.113.9 ?"
c1.q.code: "Ces comptes avaient un mot de passe et un code par SMS. Pourquoi cela n'a-t-il pas suffi ?"
c1.q.code.relay: "La fausse page demandait aussi le code, et s'en servait aussitôt"
c1.q.code.guess: "Un code à six chiffres se devine en quelques essais"
c1.q.code.guess.why: "Le journal ne montre aucun essai raté depuis cette adresse : chaque connexion a réussi du premier coup. Le code n'a pas été deviné, il a été donné."
c1.q.code.nosms: "Le SMS du code n'est jamais arrivé aux employés"
c1.q.code.nosms.why: "Il est bien arrivé : les employés disent avoir tapé leur mot de passe « et le code ». La question est : sur quelle page ?"
c1.contain.sessions: "Fermer les sessions des trois comptes et forcer un nouveau mot de passe"
c1.contain.domain: "Bloquer semaphore-sso.example et le signaler à son hébergeur et à son registraire"
c1.ada.brief: "Lis le signalement : `cat signalement.txt`. Puis le téléphone : `sms`, et `sms 2` pour ouvrir le message du « service informatique »."
c1.ada.g.link: "`sms` liste les messages, `sms 2` ouvre le faux et montre où mène son lien. `answer link <site>`."
c1.ada.g.link.standard: "Ouvre le faux message sur le téléphone de test et trouve le site que son lien ouvre."
c1.ada.link: "`semaphore-sso.example` : le nom de l'entreprise, le mot qu'on lit sur la vraie page, et un domaine enregistré trente-huit minutes avant le premier SMS. Aucune liste noire ne connaît un domaine aussi jeune. Regarde l'expéditeur aussi : un numéro ordinaire, pas un nom. Maintenant, qui a cliqué ? `soc logs sso auth`."
c1.ada.g.count: "`soc search 203.0.113.9` montre toutes les connexions depuis cette adresse. Compte les comptes différents, puis `answer count <nombre>`."
c1.ada.g.count.standard: "Cherche dans le journal de connexion une adresse d'où plusieurs comptes se connectent en quelques minutes."
c1.ada.count: "Trois comptes, deux du support et un des opérations, depuis une seule adresse. Avec le bon mot de passe et le bon code, à chaque fois. Les comptes du support ouvrent la console des clients. On ferme : `contain`."
c1.ada.g.close: "Deux mesures : `contain revoke sessions`, puis `contain block semaphore-sso.example`."
c1.ada.g.close.standard: "Sors l'intrus des trois comptes et coupe la route vers le faux site. `contain` liste les mesures."
c1.ada.close: "Les trois sessions sont fermées et le domaine est bloqué ici. Il en naîtra un autre demain. Une question."
c1.ada.g.code: "Réponds à ma question. Relis ce que les employés disent dans `signalement.txt`."
c1.ada.done: "Le code par SMS protège d'un mot de passe volé il y a six mois. Il ne protège pas d'une page qui te le demande maintenant et le rejoue dans la seconde. Les employés n'ont pas été bêtes : le message était bien fait, et un vendredi à 16 h. Lundi, on regarde l'équipe pilote. Elle a reçu le même SMS."
c1.hint.link.1: "`sms 2`, puis lis la ligne `opens:` sous le lien."
c1.hint.link.2: "`answer link semaphore-sso.example`"
c1.hint.count.1: "`soc search 203.0.113.9` : agent-014, agent-052 et ops-007."
c1.hint.count.2: "`answer count 3`"
c1.hint.close.1: "`contain revoke sessions` puis `contain block semaphore-sso.example`"
c1.hint.code.1: "Les employés ont tapé le mot de passe et le code sur la fausse page. `answer relay`"
c1.debrief.title: "Votre mot de passe a expiré"
c1.debrief.lesson: "Un SMS bien écrit, un domaine au nom de l'entreprise né une demi-heure plus tôt, une page qui demande le mot de passe puis le code. Tout ce que l'employé tape est rejoué aussitôt sur la vraie page. Un code qu'on peut recopier peut être recopié pour quelqu'un d'autre."
c1.debrief.p1: "Un code reçu par SMS ou lu dans une appli ne résiste pas à une fausse page : celui qui le tape le donne."
c1.debrief.p2: "Dire et redire par où le service informatique écrit, et par où il n'écrit jamais."
c1.debrief.p3: "Surveiller les connexions de plusieurs comptes depuis une même adresse inconnue, et pouvoir fermer des sessions en une commande."
