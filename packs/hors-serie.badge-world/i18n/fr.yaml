file.readme: "Poste Ligne Rouge. Hors-série : Le Badge. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT GA-2029-031\nClient : Garance Ingénierie, bureau d'études. Périmètre : *.garance.test, 10.111.0.0/24.\nObjet : une personne inconnue a été vue dans les locaux lundi matin, et des clés USB ont été trouvées sur le parking. Ligne Rouge aide à comprendre et à écrire les règles.\nCadre convenu : défense seulement. Lecture du journal du contrôle d'accès et des relevés du banc isolé. Aucune clé trouvée n'est branchée sur un poste. Aucun essai sur les lecteurs de badges.\nSigné : la gérante de Garance Ingénierie."
ada.outOfScope: "Stop. Cette cible est hors du mandat GA-2029-031. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
