file.readme: "Ligne Rouge workstation. Side series: The Badge. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE GA-2029-031\nClient: Garance Engineering, design office. Scope: *.garance.test, 10.111.0.0/24.\nPurpose: an unknown person was seen on the premises on Monday morning, and USB sticks were found in the car park. Ligne Rouge helps understand what happened and write the rules.\nAgreed set-up: defence only. Reading the access control log and the records from the isolated bench. No found stick is plugged into a workstation. No test on the badge readers.\nSigned: the managing director of Garance Engineering."
ada.outOfScope: "Stop. This target is outside mandate GA-2029-031. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
