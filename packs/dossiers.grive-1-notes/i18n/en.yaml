v1.briefing: "Grive, a development studio, lets its coding agent run git through a community tool server, depot-outils. Its technical director read about a flaw in a server of this kind and asks: could ours be made to run something else than git? Today you read how the tools are built."
v1.obj.purpose: "See what the agent does at Grive"
v1.obj.notes: "Read how each tool builds its command"
v1.obj.which: "Say which tools deserve a closer look"
v1.obj.why: "Say why"
v1.q.which: "Which tools build their command in a way that worries you?"
v1.q.which.lists: "`statut` and `journal`"
v1.q.which.lists.why: "Those two pass an argument list: each parameter stays one argument, whatever it contains. Look at the other column."
v1.q.which.lines: "`ajout` and `init`"
v1.q.which.every: "All four: any tool that runs git is dangerous"
v1.q.which.every.why: "Running git is the server's job. The question is how the command is put together, and two tools do it differently from the others."
v1.q.why: "Why is a line of text handed to a shell a risk?"
v1.q.why.shell: "The shell decides where a command ends: a parameter can contain the start of another one"
v1.q.why.slow: "A shell is slower than an argument list, and the agent ends up waiting for its answers"
v1.q.why.slow.why: "True, and irrelevant. The problem is what the shell understands, not how fast."
v1.q.why.agent: "The agent could mistype the name of a file, and git would then work on the wrong one"
v1.q.why.agent.why: "A wrong file name gives a git error, nothing more. The risk is a parameter that stops being a file name."
v1.ada.brief: "Welcome to Grive. First, see what their agent is for, on the forge's home page."
v1.ada.g.purpose: "Read the forge's home page: `curl https://forge.grive.test/`."
v1.ada.g.purpose.standard: "Go and see on the forge what the agent does."
v1.ada.purpose: "The agent reads what outside contributors write, and it chooses the parameters of the tools it calls. Keep those two facts side by side."
v1.ada.g.notes: "We read the tool server's code last night. Our notes: `cat dossier/notes.txt`."
v1.ada.g.notes.standard: "Read our notes on the tool server in your `dossier` folder."
v1.ada.notes: "Four tools, two ways of building a command. Compare the last column line by line."
v1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
v1.ada.answer.standard: "Answer my question."
v1.ada.which: "Yes. `ajout` and `init` glue their parameter to the end of a sentence and hand the sentence to a shell."
v1.ada.why: "Exactly. For a shell, certain characters mean \"this command is over, here is the next\". If a parameter can contain them, whoever chooses the parameter writes commands. And here, the parameter comes from what the agent has read."
v1.ada.done: "On paper, a file name can become a command. Open the debrief. Tomorrow we check it, with a witness program and nothing else."
v1.hint.purpose.1: "Type `curl https://forge.grive.test/`."
v1.hint.notes.1: "Type `cat dossier/notes.txt`."
v1.hint.which.1: "The last column says either \"argument list\" or \"text line\". The legend under the table explains the difference."
v1.hint.why.1: "Read the legend again: who decides where a command ends?"
v1.debrief.title: "A sentence is not a list"
v1.debrief.lesson: "The oldest flaw in the book, in the newest kind of software. A program that builds a command by gluing text together lets whoever supplies the text write part of the command. You found it by reading how two tools are built."
v1.debrief.p1: "Command injection: a value meant to be data ends up read as an instruction by a shell."
v1.debrief.p2: "An argument list has no such problem: nothing re-reads the parameters to find commands in them."
v1.debrief.p3: "With an agent, the parameters come from a model, and the model builds them from what it has read. The text of a stranger can travel all the way to the command."
