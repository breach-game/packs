v1.briefing: "Grive, un studio de développement, laisse son agent de code lancer git à travers un serveur d'outils communautaire, depot-outils. Son directeur technique a lu qu'un serveur de ce genre avait une faille et demande : peut-on faire exécuter au nôtre autre chose que git ? Aujourd'hui, tu lis comment les outils sont construits."
v1.obj.purpose: "Voir ce que fait l'agent chez Grive"
v1.obj.notes: "Lire comment chaque outil fabrique sa commande"
v1.obj.which: "Dire quels outils méritent un examen"
v1.obj.why: "Dire pourquoi"
v1.q.which: "Quels outils fabriquent leur commande d'une façon qui t'inquiète ?"
v1.q.which.lists: "`statut` et `journal`"
v1.q.which.lists.why: "Ces deux-là passent une liste d'arguments : chaque paramètre reste un argument, quoi qu'il contienne. Regarde l'autre colonne."
v1.q.which.lines: "`ajout` et `init`"
v1.q.which.every: "Les quatre : tout outil qui lance git est dangereux"
v1.q.which.every.why: "Lancer git est le travail du serveur. La question est la façon dont la commande est assemblée, et deux outils ne font pas comme les autres."
v1.q.why: "Pourquoi une ligne de texte confiée à un shell est-elle un risque ?"
v1.q.why.shell: "Le shell décide où une commande s'arrête : un paramètre peut contenir le début d'une autre"
v1.q.why.slow: "Un shell est plus lent qu'une liste d'arguments, et l'agent finit par attendre ses réponses"
v1.q.why.slow.why: "C'est vrai, et sans rapport. Le problème est ce que le shell comprend, pas sa vitesse."
v1.q.why.agent: "L'agent pourrait se tromper dans le nom d'un fichier, et git travaillerait sur le mauvais"
v1.q.why.agent.why: "Un mauvais nom de fichier donne une erreur de git, rien de plus. Le risque, c'est un paramètre qui cesse d'être un nom de fichier."
v1.ada.brief: "Bienvenue chez Grive. D'abord, regarde à quoi sert leur agent, sur la page d'accueil de la forge."
v1.ada.g.purpose: "Lis la page d'accueil de la forge : `curl https://forge.grive.test/`."
v1.ada.g.purpose.standard: "Va voir sur la forge ce que fait l'agent."
v1.ada.purpose: "L'agent lit ce qu'écrivent des contributeurs extérieurs, et c'est lui qui choisit les paramètres des outils qu'il appelle. Garde ces deux faits côte à côte."
v1.ada.g.notes: "On a lu le code du serveur d'outils cette nuit. Nos notes : `cat dossier/notes.txt`."
v1.ada.g.notes.standard: "Lis nos notes sur le serveur d'outils dans ton dossier `dossier`."
v1.ada.notes: "Quatre outils, deux façons de fabriquer une commande. Compare la dernière colonne ligne par ligne."
v1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
v1.ada.answer.standard: "Réponds à ma question."
v1.ada.which: "Oui. `ajout` et `init` collent leur paramètre au bout d'une phrase et confient la phrase à un shell."
v1.ada.why: "Exactement. Pour un shell, certains caractères veulent dire « cette commande est finie, voici la suivante ». Si un paramètre peut en contenir, celui qui choisit le paramètre écrit des commandes. Et ici, le paramètre vient de ce que l'agent a lu."
v1.ada.done: "Sur le papier, un nom de fichier peut devenir une commande. Ouvre le débrief. Demain, on le vérifie, avec un programme témoin et rien d'autre."
v1.hint.purpose.1: "Tape `curl https://forge.grive.test/`."
v1.hint.notes.1: "Tape `cat dossier/notes.txt`."
v1.hint.which.1: "La dernière colonne dit soit « argument list », soit « text line ». La légende sous le tableau explique la différence."
v1.hint.why.1: "Relis la légende : qui décide où une commande s'arrête ?"
v1.debrief.title: "Une phrase n'est pas une liste"
v1.debrief.lesson: "La plus vieille faille du métier, dans le logiciel le plus récent. Un programme qui fabrique une commande en collant du texte laisse celui qui fournit le texte écrire une partie de la commande. Tu l'as trouvée en lisant comment deux outils sont construits."
v1.debrief.p1: "Injection de commande : une valeur censée être une donnée finit lue comme une instruction par un shell."
v1.debrief.p2: "Une liste d'arguments n'a pas ce problème : rien ne relit les paramètres pour y chercher des commandes."
v1.debrief.p3: "Avec un agent, les paramètres viennent d'un modèle, et le modèle les construit à partir de ce qu'il a lu. Le texte d'un inconnu peut voyager jusqu'à la commande."
