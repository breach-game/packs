file.readme: "Poste Ligne Rouge. Dossier : Bécasse. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT VC-2027-090\nClient : Agence de l'eau Vauclair, établissement public. Périmètre : *.vauclair.test, 10.98.0.0/24.\nObjet : une alerte de l'agence signale des lectures de messages par une application inconnue. Ligne Rouge aide l'équipe sécurité de l'agence à comprendre, à bloquer et à rendre compte, en lien avec le fournisseur Cirrus.\nDispositif convenu : défense uniquement. Lecture des journaux de la messagerie, mesures passées par `contain`.\nSigné : la responsable de la sécurité des systèmes d'information de l'Agence de l'eau Vauclair."
ada.outOfScope: "Stop. Cette cible est hors du mandat VC-2027-090. Même pour défendre, hors mandat, c'est un délit (article 323-1 du Code pénal)."
