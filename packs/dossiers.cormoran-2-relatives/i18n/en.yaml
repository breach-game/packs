c2.briefing: "The fraudsters opened a few thousand accounts. The list for sale, though, holds millions of names. With the test account (cookie `session=lr-test-021`), look at what a single account sees through \"DNA Cousins\". The feature's setting is in `partage/cousins.yml`."
c2.obj.total: "Count the people a single account sees"
c2.obj.many: "Explain where the millions of names come from"
c2.obj.fields: "Show cousins only what is needed"
c2.obj.consent: "Enrol nobody without consent, and cap the list"
c2.q.total: "How many people does the test account see in \"DNA Cousins\"?"
c2.q.many: "A few thousand accounts opened, millions of names for sale. How?"
c2.q.many.each: "Each open account shows over a thousand cousins"
c2.q.many.database: "The fraudsters also copied the whole customer database"
c2.q.many.database.why: "No server was broken into, and the logs show only sign-ins. Everything went through the normal door."
c2.q.many.family: "Customers had given their password to their family"
c2.q.many.family.why: "Nothing says so. The cousins listed gave nothing at all: they were simply enrolled in the feature."
c2.check.fields: "Cousins see no birth year, place, family names or ancestry"
c2.check.consent: "Enrolment on explicit consent, capped list"
c2.check.works: "The feature still works: display name and share of DNA"
c2.ada.brief: "Ask for the list with the test account: `curl -b \"session=lr-test-021\" https://origines.cormoran.test/api/relatives`."
c2.ada.g.total: "The answer shows only three, but it gives the total. Read it with `jq`: add `| jq .total` to the same command. Then `answer total <number>`."
c2.ada.g.total.standard: "Find how many people this single account can see, then `answer total`."
c2.ada.total: "Twelve hundred and fourteen people, for a single account. With their birth year, their town, their family names and their ancestry."
c2.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
c2.ada.answer.standard: "My question is waiting in the messenger."
c2.ada.many: "That is the multiplier. A reused password opens only one account, but that account shows a thousand people who did nothing wrong. Let us set the feature: `cat partage/cousins.yml`."
c2.ada.g.fields: "A cousin needs a display name, a relationship, a share of DNA. No more: `sed -i \"s/visible_fields: .*/visible_fields: [display_name, relationship, shared_dna]/\" partage/cousins.yml`, then `verify`. Or by hand, in the editor: `edit partage/cousins.yml`, then Ctrl+S."
c2.ada.g.fields.standard: "Remove from `visible_fields` everything that lets someone find a person outside the site. Keep what lets a cousin be recognised. Then `verify`. To open the file: `edit partage/cousins.yml`."
c2.ada.g.consent: "Nobody should be enrolled by default, and a list does not need to be endless: `sed -i \"s/opt_in: default-on/opt_in: explicit/\" partage/cousins.yml`, `sed -i \"s/max_listed: unlimited/max_listed: 50/\" partage/cousins.yml`, then `verify`. Or by hand, in the editor: `edit partage/cousins.yml`, then Ctrl+S."
c2.ada.g.consent.standard: "Make enrolment a real choice, and give the list a limit. Then `verify`."
c2.ada.almost: "Not everything yet. Read the FAIL lines, fix the file and run `verify` again."
c2.ada.done: "An open account now shows about fifty cousins who chose to be there, and only what it takes to recognise each other. The front door itself remains."
c2.hint.total.1: "`curl -b \"session=lr-test-021\" https://origines.cormoran.test/api/relatives | jq .total`"
c2.hint.total.2: "`answer total 1214`"
c2.hint.many.1: "How many cousins does each account see? Multiply."
c2.hint.fields.1: "`edit partage/cousins.yml` opens the editor, if you prefer."
c2.hint.fields.2: "`visible_fields: [display_name, relationship, shared_dna]`"
c2.hint.consent.1: "`opt_in: explicit` and `max_listed: 50`, then `verify`."
c2.debrief.title: "The multiplier"
c2.debrief.lesson: "The sharing feature did exactly what it was built for: show a lot to every account. A leak of a few thousand passwords thus became a leak of millions of profiles, most of which had never been compromised."
c2.debrief.p1: "Return from an API only the fields the screen needs, not the whole object."
c2.debrief.p2: "Enrol people in a sharing feature on explicit consent, and ask again when what is shared changes."
c2.debrief.p3: "Cap what an account can list or download, and alert when an account reads far more than usual."
