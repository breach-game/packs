c2.briefing: "Les fraudeurs ont ouvert quelques milliers de comptes. La liste en vente, elle, compte des millions de noms. Avec le compte de test (cookie `session=lr-test-021`), regarde ce qu'un seul compte voit grâce à « Cousins ADN ». Le réglage de la fonction est dans `partage/cousins.yml`."
c2.obj.total: "Compter les personnes qu'un seul compte voit"
c2.obj.many: "Expliquer d'où viennent les millions de noms"
c2.obj.fields: "Ne montrer aux cousins que le nécessaire"
c2.obj.consent: "N'inscrire personne sans son accord, et borner la liste"
c2.q.total: "Combien de personnes le compte de test voit-il dans « Cousins ADN » ?"
c2.q.many: "Quelques milliers de comptes ouverts, des millions de noms en vente. Comment ?"
c2.q.many.each: "Chaque compte ouvert voit plus d'un millier de cousins, avec leurs détails"
c2.q.many.database: "Les fraudeurs ont aussi copié toute la base de données"
c2.q.many.database.why: "Aucun serveur n'a été forcé, et les journaux ne montrent que des connexions. Tout est passé par la porte normale."
c2.q.many.family: "Les clients avaient donné leur mot de passe à leur famille"
c2.q.many.family.why: "Rien ne l'indique. Les cousins listés n'ont rien donné du tout : ils étaient simplement inscrits à la fonction."
c2.check.fields: "Les cousins ne voient ni année de naissance, ni lieu, ni noms de famille, ni origines"
c2.check.consent: "Inscription sur accord explicite, liste bornée"
c2.check.works: "La fonction marche encore : nom affiché et part d'ADN partagée"
c2.ada.brief: "Demande la liste avec le compte de test : `curl -b \"session=lr-test-021\" https://origines.cormoran.test/api/relatives`."
c2.ada.g.total: "La réponse n'en montre que trois, mais elle donne le total. Lis-le avec `jq` : ajoute `| jq .total` à la même commande. Puis `answer total <nombre>`."
c2.ada.g.total.standard: "Trouve combien de personnes ce seul compte peut voir, puis `answer total`."
c2.ada.total: "Mille deux cent quatorze personnes, pour un seul compte. Avec leur année de naissance, leur ville, leurs noms de famille et leurs origines."
c2.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
c2.ada.answer.standard: "Ma question t'attend dans la messagerie."
c2.ada.many: "Voilà le multiplicateur. Un mot de passe réutilisé n'ouvre qu'un compte, mais ce compte montre un millier de personnes qui n'ont rien fait de mal. Réglons la fonction : `cat partage/cousins.yml`."
c2.ada.g.fields: "Un cousin a besoin d'un nom affiché, d'un lien de parenté, d'une part d'ADN. Pas plus : `sed -i \"s/visible_fields: .*/visible_fields: [display_name, relationship, shared_dna]/\" partage/cousins.yml`, puis `verify`."
c2.ada.g.fields.standard: "Retire de `visible_fields` tout ce qui permet de retrouver quelqu'un hors du site. Garde de quoi reconnaître un cousin. Puis `verify`."
c2.ada.g.consent: "Personne ne doit être inscrit par défaut, et une liste n'a pas à être infinie : `sed -i \"s/opt_in: default-on/opt_in: explicit/\" partage/cousins.yml`, `sed -i \"s/max_listed: unlimited/max_listed: 50/\" partage/cousins.yml`, puis `verify`."
c2.ada.g.consent.standard: "Fais que l'inscription soit un vrai choix, et que la liste ait une limite. Puis `verify`."
c2.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier et relance `verify`."
c2.ada.done: "Un compte ouvert montre désormais une cinquantaine de cousins qui ont choisi d'être là, et seulement ce qu'il faut pour se reconnaître. Reste la porte d'entrée elle-même."
c2.hint.total.1: "`curl -b \"session=lr-test-021\" https://origines.cormoran.test/api/relatives | jq .total`"
c2.hint.total.2: "`answer total 1214`"
c2.hint.many.1: "Combien de cousins chaque compte voit-il ? Multiplie."
c2.hint.fields.1: "`edit partage/cousins.yml` ouvre l'éditeur, si tu préfères."
c2.hint.fields.2: "`visible_fields: [display_name, relationship, shared_dna]`"
c2.hint.consent.1: "`opt_in: explicit` et `max_listed: 50`, puis `verify`."
c2.debrief.title: "Le multiplicateur"
c2.debrief.lesson: "La fonction de partage faisait exactement ce pour quoi elle était faite : montrer beaucoup à chaque compte. Une fuite de quelques milliers de mots de passe devenait ainsi une fuite de millions de profils, dont la plupart n'avaient jamais été compromis."
c2.debrief.p1: "Ne renvoyer d'une API que les champs dont l'écran a besoin, pas l'objet entier."
c2.debrief.p2: "Inscrire à une fonction de partage sur accord explicite, et le redemander quand ce qui est partagé change."
c2.debrief.p3: "Borner ce qu'un compte peut lister ou télécharger, et alerter quand un compte lit beaucoup plus que d'habitude."
