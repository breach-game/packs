file.readme: "Poste Ligne Rouge. Dossier : Cigogne. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT NC-2029-027\nClient : Nacre, portefeuille en ligne. Périmètre : *.nacre.test, 10.110.0.0/24.\nObjet : des clients disent arriver sur un site qui n'est pas celui de Nacre. Ligne Rouge aide l'équipe à comprendre, à prévenir et à préparer la suite.\nCadre convenu : défense seulement. Lecture des relevés fournis par Nacre et par son opérateur de noms. Aucune annonce de route, aucune action sur un réseau tiers : corriger une route est le travail des opérateurs, que Nacre appelle.\nSigné : la directrice technique de Nacre."
ada.outOfScope: "Stop. Cette cible est hors du mandat NC-2029-027. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
