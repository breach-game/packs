file.readme: "Ligne Rouge workstation. Case file: Cigogne. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE NC-2029-027\nClient: Nacre, online wallet. Scope: *.nacre.test, 10.110.0.0/24.\nPurpose: customers say they land on a site that is not Nacre's. Ligne Rouge helps the team understand, warn and prepare what comes next.\nAgreed set-up: defence only. Reading the records supplied by Nacre and its name operator. No route announcement, no action on a third-party network: fixing a route is the operators' job, and Nacre calls them.\nSigned: the chief technology officer of Nacre."
ada.outOfScope: "Stop. This target is outside mandate NC-2029-027. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
