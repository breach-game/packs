# Dossier 20. Everything here is fictional: reserved .test and .example domains, private and documentation addresses only.
startTime: "2027-07-29T10:00:00+02:00"
mandate: MO-2027-020
scope:
  domains: ["*.mouette.test"]
  networks: ["10.80.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.80.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.80.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -300, z: 40, h: 70 }
    links: [inspection]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            MO-2027-020.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  # The box that opens encrypted traffic leaving the network, to inspect it.
  - id: inspection
    hostname: inspection.mouette.test
    ip: 10.80.0.5
    os: Linux 5.15 (appliance)
    map: { x: 60, z: -40, h: 110 }
    links: [portal, db]
    services:
      - { port: 443, name: https, product: TLS inspection appliance 7.2 }

  # The online dispute portal: customers upload documents to contest an entry.
  - id: portal
    hostname: litiges.mouette.test
    ip: 10.80.0.21
    os: Linux 4.4 (Ubuntu 16.04)
    map: { x: 260, z: -120, h: 90 }
    services:
      - { port: 443, name: https, product: Fennec Web 2.5.10 }

  - id: db
    hostname: base.mouette.test
    ip: 10.80.0.30
    os: Linux 5.15 (Debian 11)
    map: { x: 280, z: 80, h: 120 }
    services:
      - { port: 5432, name: postgresql, product: PostgreSQL 14 }

  # Where the copies go, seen only through the flow log. Never reachable.
  - id: outside
    hostname: inconnu.mouette.test
    ip: 10.80.0.200
    kind: unknown
    hidden: true
    os: unknown
    map: { x: 460, z: 200, h: 40 }

dns:
  mouette.test: { A: ["10.80.0.10"] }
  inspection.mouette.test: { A: ["10.80.0.5"] }
  litiges.mouette.test: { A: ["10.80.0.21"] }
  base.mouette.test: { A: ["10.80.0.30"] }

whois:
  mouette.test: |
    Domain Name: MOUETTE.TEST
    Creation Date: 1999-04-02T08:00:00Z
    Registrant Organization: Mouette Credit SA
    Registrant Country: FR

# A published weakness of a fictional web framework, for `sbom --vuln`.
advisories:
  - id: BRX-2027-0307
    package: fennec-web
    versions: ["2.3.31", "2.5.9", "2.5.10"]
    severity: critical
    summary: adv.fennec
    fixed: "2.5.11"
  - id: BRX-2026-1120
    package: json-lien
    versions: ["2.8.0"]
    severity: medium
    summary: adv.jsonlien
    fixed: "2.8.4"

noise:
  nmap:
    base: 18
    flags: { "-sn": -10, "-sV": 10, "-A": 30, "-T4": 18, "-T5": 36, "-p-": 16 }
  dig: 0
  whois: 0
  curl: 2
  browse: 2
  chat: 2

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected
