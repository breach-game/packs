r3.briefing: "Une phrase enseignée par un inconnu a été servie à un autre lecteur au nom de la librairie. Le directeur général est tenté d'éteindre l'apprentissage pour de bon. Les libraires ne sont pas d'accord : la moitié de ce que Page sait sur leurs boutiques, ce sont des lecteurs qui le lui ont appris. Tu as la matinée pour garder l'idée et fermer la porte."
r3.obj.idea: "Choisir le correctif qui compte"
r3.obj.accept: "Faire lire par un libraire ce que les visiteurs enseignent"
r3.obj.notes: "Garder les notes d'un lecteur pour ce lecteur"
r3.obj.trace: "Montrer d'où viennent les réponses, et garder des copies de la mémoire"
r3.obj.clean: "Retirer de la mémoire les entrées non vérifiées"
r3.q.idea: "Roitelet veut un correctif d'abord. Lequel ?"
r3.q.idea.review: "Rien de ce qu'un visiteur enseigne ne sert avant qu'un libraire l'ait lu"
r3.q.idea.words: "Page refuse toute leçon contenant un mot d'une liste de gros mots"
r3.q.idea.words.why: "Utile contre les insultes, et aveugle au reste. La phrase sur le roman et la phrase témoin sont toutes les deux parfaitement polies."
r3.q.idea.truth: "On dit à Page, dans ses consignes, de ne retenir que ce qui est vrai et vérifié"
r3.q.idea.truth.why: "Page n'a aucun moyen de savoir ce qui est vrai sur une boutique. Seul quelqu'un de chez Roitelet le sait."
r3.check.accept: "Ce que les visiteurs enseignent attend un libraire"
r3.check.notes: "Les notes d'un lecteur ne reviennent qu'à ce lecteur"
r3.check.trace: "Les réponses montrent leur source, et la mémoire a des copies quotidiennes"
r3.check.clean: "Les entrées 105 et 106 sont retirées"
r3.check.works: "Page et son journal restent actifs"
r3.ada.brief: "Dernière matinée chez Roitelet. Les réglages de Page sont dans `dossier/page.yml`. Mais d'abord, une décision."
r3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
r3.ada.answer.standard: "Réponds d'abord à ma question."
r3.ada.idea: "Oui. Les lecteurs continuent d'enseigner, et une personne qui connaît les boutiques décide de ce qui devient la parole de la librairie. La porte reste, avec quelqu'un devant."
r3.ada.g.accept: "Ouvre le fichier : `edit dossier/page.yml`. Remplace `accept: anyone` par `accept: staff-reviewed`, puis `verify`."
r3.ada.g.accept.standard: "Ouvre `dossier/page.yml` et change qui décide qu'une leçon peut servir. Puis `verify`. Pour ouvrir le fichier : `edit dossier/page.yml`."
r3.ada.g.notes: "Seconde couche : écris `reader_notes: per-reader`, puis `verify`."
r3.ada.g.notes.standard: "Seconde couche : ce qu'un lecteur dit à Page sur lui-même ne doit revenir qu'à lui. Puis `verify`."
r3.ada.g.trace: "Troisième : écris `sources: shown` et `snapshots: daily`, puis `verify`."
r3.ada.g.trace.standard: "Troisième : laisse les lecteurs voir d'où vient une réponse, et garde des copies de la mémoire pour pouvoir revenir en arrière. Puis `verify`."
r3.ada.g.clean: "Enfin, les deux entrées non vérifiées en bas du fichier : écris `removed` à la place de `in-use` sur les deux lignes, puis `verify`."
r3.ada.g.clean.standard: "Enfin, la mémoire contient toujours ce qu'on y a planté, la nôtre et l'autre. Retire les deux. Puis `verify`."
r3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
r3.ada.done: "Page apprend toujours, et un libraire lit d'abord. Ouvre le débrief : à la fin, un vrai cas où un assistant qui apprenait de tout le monde a été débranché en moins d'une journée."
r3.hint.idea.1: "Quelle réponse aurait arrêté la phrase sur le roman, qui ne contient ni gros mot ni mensonge évident ?"
r3.hint.accept.1: "La ligne à changer est `accept`, sous `learning`. Les valeurs possibles sont dans les commentaires au-dessus."
r3.hint.accept.2: "Avec l'éditeur : `edit dossier/page.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/accept: anyone/accept: staff-reviewed/\" dossier/page.yml`, puis `verify`."
r3.hint.notes.1: "La ligne à changer est `reader_notes`, sous `learning`."
r3.hint.notes.2: "Avec l'éditeur : `edit dossier/page.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/reader_notes: shared/reader_notes: per-reader/\" dossier/page.yml`, puis `verify`."
r3.hint.trace.1: "Deux lignes à changer sous `memory` : `sources` et `snapshots`."
r3.hint.trace.2: "Avec l'éditeur : `edit dossier/page.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/sources: hidden/sources: shown/\" dossier/page.yml` et `sed -i \"s/snapshots: none/snapshots: daily/\" dossier/page.yml`, puis `verify`."
r3.hint.clean.1: "Deux lignes à changer sous `entries`, en bas du fichier."
r3.hint.clean.2: "Avec l'éditeur : `edit dossier/page.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/entry_105: in-use/entry_105: removed/\" dossier/page.yml` et `sed -i \"s/entry_106: in-use/entry_106: removed/\" dossier/page.yml`, puis `verify`."
r3.debrief.title: "Quelqu'un devant la porte"
r3.debrief.lesson: "Tu n'as pas demandé au modèle de distinguer le vrai du faux : il ne le peut pas. Tu as mis une personne qui sait entre ce que des inconnus écrivent et ce que la librairie dit, tu as séparé ce qui appartient à un lecteur de ce qui appartient à tous, et tu as fait de la mémoire quelque chose qu'on peut lire, tracer et remettre en arrière."
r3.debrief.p1: "Le correctif de fond : un contenu venu d'inconnus est vérifié avant de devenir un savoir servi aux autres."
r3.debrief.p2: "Cloisonner la mémoire : ce qu'un utilisateur dit à un assistant revient à cet utilisateur, pas à tous."
r3.debrief.p3: "Garder l'origine de chaque entrée et la montrer : une réponse qui nomme sa source peut être contestée."
r3.debrief.p4: "Fermer la porte ne suffit pas : ce qui est déjà entré doit être retrouvé et retiré, et des copies le rendent possible."
r3.facts.title: "Ce qui s'est vraiment passé : Tay, le programme de conversation de Microsoft (2016)"
r3.facts.p1: "Roitelet et Page n'existent pas. Le scénario s'inspire de Tay, un programme de conversation que Microsoft a mis en ligne sur Twitter le 23 mars 2016."
r3.facts.p2: "Tay était présenté comme une expérience qui s'améliorerait en discutant avec les gens : il apprenait des messages qu'il recevait."
r3.facts.p3: "En quelques heures, un groupe d'utilisateurs a entrepris de lui apprendre des phrases offensantes. Tay s'est mis à publier lui-même de tels messages, en public, au nom de l'expérience de l'entreprise."
r3.facts.p4: "Microsoft a débranché Tay moins d'une journée après son lancement, et a publié des excuses deux jours plus tard."
r3.facts.p5: "Dans ce texte, l'entreprise parle d'une attaque coordonnée menée par un petit groupe de personnes qui a exploité une vulnérabilité de Tay. Elle dit s'être préparée à de nombreux types d'abus et avoir commis un oubli critique pour cette attaque précise."
r3.facts.p6: "Tay apprenait de tout le monde et parlait à tout le monde, sans rien entre les deux. Les assistants d'aujourd'hui qui gardent une mémoire partagée, ou qui consultent des documents que leurs utilisateurs peuvent écrire, font face à la même question. La liste OWASP des applications à modèles de langage la range sous l'empoisonnement des données et des modèles."
