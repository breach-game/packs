r3.briefing: "A sentence taught by a stranger was served to another reader in the name of the shop. The managing director is tempted to switch learning off for good. The booksellers disagree: half of what Page knows about their shops, readers taught it. You have the morning to keep the idea and close the door."
r3.obj.idea: "Choose the fix that counts"
r3.obj.accept: "Have a bookseller read what visitors teach"
r3.obj.notes: "Keep a reader's own notes for that reader"
r3.obj.trace: "Show where answers come from, and keep copies of the memory"
r3.obj.clean: "Take the unchecked entries out of the memory"
r3.q.idea: "Roitelet wants one fix first. Which one?"
r3.q.idea.review: "Nothing a visitor teaches is used before a bookseller has read it"
r3.q.idea.words: "Page refuses any lesson containing a word from a list of rude words"
r3.q.idea.words.why: "Useful against insults, and blind to the rest. The sentence about the novel and the witness sentence are both perfectly polite."
r3.q.idea.truth: "Page is told, in its instructions, to remember only what is true and checked"
r3.q.idea.truth.why: "Page has no way to know what is true about a shop. Only someone at Roitelet does."
r3.check.accept: "What visitors teach waits for a bookseller"
r3.check.notes: "A reader's notes only come back to that reader"
r3.check.trace: "Answers show their source, and the memory has daily copies"
r3.check.clean: "Entries 105 and 106 are removed"
r3.check.works: "Page and its log stay on"
r3.ada.brief: "Last morning at Roitelet. Page's settings are in `dossier/page.yml`. But first, a decision."
r3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
r3.ada.answer.standard: "Answer my question first."
r3.ada.idea: "Yes. Readers keep teaching, and a person who knows the shops decides what becomes the shop's word. The door stays, with someone standing at it."
r3.ada.g.accept: "Open the file: `edit dossier/page.yml`. Replace `accept: anyone` with `accept: staff-reviewed`, then `verify`."
r3.ada.g.accept.standard: "Open `dossier/page.yml` and change who decides that a lesson may be used. Then `verify`. To open the file: `edit dossier/page.yml`."
r3.ada.g.notes: "Second layer: write `reader_notes: per-reader`, then `verify`."
r3.ada.g.notes.standard: "Second layer: what a reader tells Page about themselves should come back to them only. Then `verify`."
r3.ada.g.trace: "Third: write `sources: shown` and `snapshots: daily`, then `verify`."
r3.ada.g.trace.standard: "Third: let readers see where an answer comes from, and keep copies of the memory to go back to. Then `verify`."
r3.ada.g.clean: "Last, the two unchecked entries at the bottom of the file: write `removed` in place of `in-use` on both lines, then `verify`."
r3.ada.g.clean.standard: "Last, the memory still holds what was planted in it, ours and the other one. Take both out. Then `verify`."
r3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
r3.ada.done: "Page still learns, and a bookseller reads first. Open the debrief: at the end, a real case where an assistant that learned from everyone was taken offline in less than a day."
r3.hint.idea.1: "Which answer would have stopped the sentence about the novel, which contains no rude word and no obvious lie?"
r3.hint.accept.1: "The line to change is `accept`, under `learning`. The possible values are in the comments above it."
r3.hint.accept.2: "With the editor: `edit dossier/page.yml`, then Ctrl+S. With a command: type `sed -i \"s/accept: anyone/accept: staff-reviewed/\" dossier/page.yml`, then `verify`."
r3.hint.notes.1: "The line to change is `reader_notes`, under `learning`."
r3.hint.notes.2: "With the editor: `edit dossier/page.yml`, then Ctrl+S. With a command: type `sed -i \"s/reader_notes: shared/reader_notes: per-reader/\" dossier/page.yml`, then `verify`."
r3.hint.trace.1: "Two lines to change under `memory`: `sources` and `snapshots`."
r3.hint.trace.2: "With the editor: `edit dossier/page.yml`, then Ctrl+S. With a command: type `sed -i \"s/sources: hidden/sources: shown/\" dossier/page.yml` and `sed -i \"s/snapshots: none/snapshots: daily/\" dossier/page.yml`, then `verify`."
r3.hint.clean.1: "Two lines to change under `entries`, at the bottom of the file."
r3.hint.clean.2: "With the editor: `edit dossier/page.yml`, then Ctrl+S. With a command: type `sed -i \"s/entry_105: in-use/entry_105: removed/\" dossier/page.yml` and `sed -i \"s/entry_106: in-use/entry_106: removed/\" dossier/page.yml`, then `verify`."
r3.debrief.title: "Someone at the door"
r3.debrief.lesson: "You did not ask the model to tell true from false: it cannot. You put a person who knows between what strangers write and what the shop says, you separated what belongs to one reader from what belongs to all, and you made the memory something one can read, trace and roll back."
r3.debrief.p1: "The root fix: content from strangers is checked before it becomes knowledge served to others."
r3.debrief.p2: "Partition the memory: what one user tells an assistant comes back to that user, not to everyone."
r3.debrief.p3: "Keep the origin of every entry and show it: an answer that names its source can be questioned."
r3.debrief.p4: "Closing the door is not enough: what is already inside has to be found and removed, and copies make that possible."
r3.facts.title: "What really happened: Tay, Microsoft's conversational program (2016)"
r3.facts.p1: "Roitelet and Page do not exist. The scenario is inspired by Tay, a conversational program that Microsoft put online on Twitter on 23 March 2016."
r3.facts.p2: "Tay was presented as an experiment that would get better by talking with people: it learned from the messages it received."
r3.facts.p3: "Within hours, a group of users set about teaching it offensive sentences. Tay began to post such messages itself, in public, in the name of the company's experiment."
r3.facts.p4: "Microsoft took Tay offline less than a day after its launch, and published an apology two days later."
r3.facts.p5: "In that statement, the company speaks of a coordinated attack by a subset of people who exploited a vulnerability in Tay. It says it had prepared for many kinds of abuse and had made a critical oversight for this specific attack."
r3.facts.p6: "Tay learned from everyone and spoke to everyone, with nothing in between. Today's assistants that keep a shared memory, or look things up in documents their users can write, face the same question. The OWASP list for language-model applications files it under data and model poisoning."
