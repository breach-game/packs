title:
  fr: "Dossier 28 · 2. Le rapport"
  en: "Case file 28 · 2. The report"
summary:
  fr: "L'application est bloquée. Tu comptes les boîtes lues, tu retrouves avec `jq` depuis quand la clé aurait dû être retirée, tu dis ce qui a permis de voir l'intrusion, puis tu remets l'histoire de la clé dans l'ordre. La dernière mission raconte les faits, sources à l'appui."
  en: "The application is blocked. You count the mailboxes read, find with `jq` since when the key should have been retired, say what made the intrusion visible, then put the key's story back in order. The last mission tells the facts, with its sources."
