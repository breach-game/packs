b2.briefing: "Lundi 21 juin. Cirrus a confirmé vendredi : la clé grand public a été révoquée, et une faille de validation corrigée. L'agence doit maintenant rendre compte à sa tutelle : quelles boîtes ont été lues, depuis quand, et pourquoi c'est elle qui l'a vu. Le journal détaillé du mois et les clés publiées par Cirrus sont dans `traces/`."
b2.obj.boxes: "Compter les boîtes lues par l'application inconnue"
b2.obj.retire: "Trouver depuis quand la clé aurait dû être retirée"
b2.obj.seen: "Dire ce qui a permis de voir l'intrusion"
b2.obj.story: "Remettre l'histoire de la clé dans l'ordre"
b2.q.boxes: "Combien de boîtes différentes l'application 0f3e9a71 a-t-elle lues ? (un nombre)"
b2.q.retire: "À quelle date la clé grand-public-2016 aurait-elle dû être retirée ? (format AAAA-MM-JJ)"
b2.q.seen: "La tutelle demande pourquoi l'agence a vu ce que le fournisseur n'a pas vu. Que réponds-tu ?"
b2.q.seen.detailed: "Elle payait le journal détaillé des accès"
b2.q.seen.provider: "Cirrus l'a prévenue dès la première lecture"
b2.q.seen.provider.why: "C'est l'inverse : l'agence a prévenu Cirrus le 16 juin, quatre semaines après la première lecture."
b2.q.seen.antivirus: "L'antivirus de ses postes a donné l'alerte"
b2.q.seen.antivirus.why: "Rien n'a touché les postes de l'agence : tout s'est passé chez le fournisseur, entre un jeton fabriqué et la messagerie."
b2.tl.text: "L'histoire de la clé grand-public-2016"
b2.tl.created: "Cirrus crée la clé de son service grand public"
b2.tl.retire: "La date prévue pour retirer la clé passe, la clé reste"
b2.tl.forged: "Des jetons signés avec cette clé lisent les boîtes de l'agence"
b2.tl.alert: "L'alerte de l'agence sonne sur une application inconnue"
b2.tl.revoked: "Cirrus révoque la clé"
b2.ada.brief: "Commence par le journal : `cat traces/acces-boites.log`. Seule compte l'application inconnue : `grep 0f3e9a71 traces/acces-boites.log`."
b2.ada.g.boxes: "Compte les boîtes différentes dans les lignes de l'application 0f3e9a71, puis `answer boxes <nombre>`."
b2.ada.g.boxes.standard: "Compte les boîtes différentes lues par l'application inconnue."
b2.ada.boxes: "Quatre boîtes, la direction générale, les finances, le juridique et le cabinet, sur près d'un mois : première lecture le 19 mai, alerte le 16 juin. Maintenant, la clé. Cirrus publie ses clés : `jq '.keys[]' traces/cles-cirrus.json`."
b2.ada.g.retire: "Lis les clés publiées : `jq '.keys[]' traces/cles-cirrus.json`. Regarde `retire_after` pour grand-public-2016, puis `answer retire <date>`."
b2.ada.g.retire.standard: "Les clés publiées par Cirrus disent quand chacune devait être retirée."
b2.ada.retire: "Créée en 2016, à retirer en 2021, révoquée en 2027. Six ans de trop. Les clés des organisations, elles, changent tous les six mois."
b2.ada.g.seen: "Rappelle-toi comment l'alerte est arrivée."
b2.ada.seen: "C'est le point le plus important du rapport : sans cette option payante, personne n'aurait rien vu. Dernière chose : l'histoire de la clé dans l'ordre, avec `timeline cle`."
b2.ada.g.story: "Affiche les événements avec `timeline cle`, puis classe-les du plus ancien au plus récent : `timeline cle <id> <id>…`."
b2.ada.g.story.standard: "Mets l'histoire de la clé dans l'ordre avec `timeline cle`."
b2.ada.done: "Dossier clos. Une clé oubliée chez un fournisseur, une vérification manquante, et c'est un client attentif qui sonne l'alarme."
b2.hint.boxes.1: "dir-generale, dir-financiere, juridique, cabinet. communication n'a été lue que par le client de l'agence."
b2.hint.boxes.2: "`answer boxes 4`"
b2.hint.retire.1: "`jq '.keys[]' traces/cles-cirrus.json` : le champ `retire_after` de grand-public-2016."
b2.hint.retire.2: "`answer retire 2021-04-01`"
b2.hint.story.1: "2016, 2021, mai 2027, 16 juin 2027, 18 juin 2027."
b2.hint.story.2: "`timeline cle created retire forged alert revoked`"
b2.debrief.title: "Le rapport"
b2.debrief.lesson: "Le client ne pouvait ni protéger la clé ni corriger la vérification : c'était le travail du fournisseur. Ce qu'il pouvait faire, c'était voir. Et il n'a pu voir que parce qu'il avait payé pour garder le détail de chaque accès."
b2.debrief.p1: "Exiger du fournisseur les journaux qui permettent de voir un accès anormal, sans supplément."
b2.debrief.p2: "Une clé de signature a une date de fin : la dépasser, c'est garder une porte ouverte."
b2.debrief.p3: "Un rapport d'incident chez un fournisseur part du client : liste des boîtes, dates, preuves, et ce que le fournisseur doit corriger."
b2.facts.title: "Ce qui s'est vraiment passé : Storm-0558, été 2023"
b2.facts.p1: "En 2023, un groupe que Microsoft nomme Storm-0558 lit les messageries Exchange Online de 22 organisations et de plus de 500 personnes, dont des responsables du gouvernement américain."
b2.facts.p2: "Il fabrique des jetons d'accès avec une clé de signature du service grand public de Microsoft, créée en 2016, que le service des entreprises n'aurait jamais dû accepter."
b2.facts.p3: "Le département d'État américain détecte l'intrusion le 16 juin 2023, grâce à une alerte écrite sur le journal détaillé des accès aux messages (MailItemsAccessed), disponible avec sa licence la plus chère."
b2.facts.p4: "En mars 2024, le Cyber Safety Review Board conclut à une « cascade » d'erreurs de sécurité évitables chez Microsoft, qui n'a pas pu établir comment la clé avait été obtenue."
b2.facts.p5: "Après l'incident, Microsoft annonce l'ouverture de journaux détaillés à davantage de clients, sans coût supplémentaire."
