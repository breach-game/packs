b2.briefing: "Monday 21 June. Cirrus confirmed on Friday: the consumer key has been revoked, and a validation flaw fixed. The agency must now report to its supervising ministry: which mailboxes were read, since when, and why the agency was the one to see it. The month's detailed log and the keys Cirrus publishes are in `traces/`."
b2.obj.boxes: "Count the mailboxes read by the unknown application"
b2.obj.retire: "Find since when the key should have been retired"
b2.obj.seen: "Say what made the intrusion visible"
b2.obj.story: "Put the key's story back in order"
b2.q.boxes: "How many different mailboxes did application 0f3e9a71 read? (a number)"
b2.q.retire: "On what date should key grand-public-2016 have been retired? (format YYYY-MM-DD)"
b2.q.seen: "The ministry asks why the agency saw what the provider did not. What do you answer?"
b2.q.seen.detailed: "It had paid for the detailed log of message access"
b2.q.seen.provider: "Cirrus warned it from the very first read"
b2.q.seen.provider.why: "The other way round: the agency warned Cirrus on 16 June, four weeks after the first read."
b2.q.seen.antivirus: "The antivirus on its laptops raised the alarm"
b2.q.seen.antivirus.why: "Nothing touched the agency's computers: it all happened at the provider, between a forged token and the mail service."
b2.tl.text: "The story of key grand-public-2016"
b2.tl.created: "Cirrus creates the key of its consumer service"
b2.tl.retire: "The date set to retire the key passes, the key stays"
b2.tl.forged: "Tokens signed with this key read the agency's mailboxes"
b2.tl.alert: "The agency's alert fires on an unknown application"
b2.tl.revoked: "Cirrus revokes the key"
b2.ada.brief: "Start with the log: `cat traces/acces-boites.log`. Only the unknown application counts: `grep 0f3e9a71 traces/acces-boites.log`."
b2.ada.g.boxes: "Count the different mailboxes in the lines of application 0f3e9a71, then `answer boxes <number>`."
b2.ada.g.boxes.standard: "Count the different mailboxes the unknown application read."
b2.ada.boxes: "Four mailboxes, the director general, finance, legal and the cabinet, over nearly a month: first read on 19 May, alert on 16 June. Now, the key: Cirrus publishes its keys, they are in `traces/`."
b2.ada.g.retire: "Read the published keys: `jq '.keys[]' traces/cles-cirrus.json`. Look at `retire_after` for grand-public-2016, then `answer retire <date>`."
b2.ada.g.retire.standard: "The keys Cirrus publishes say when each one was due for retirement."
b2.ada.retire: "Created in 2016, due to retire in 2021, revoked in 2027. Six years too many. The organisations' keys change every six months."
b2.ada.g.seen: "Remember how the alert came in."
b2.ada.seen: "That is the most important point of the report: without that paid option, nobody would have seen anything. One last thing: the key's story in order."
b2.ada.g.story: "Show the events with `timeline cle`, then order them from oldest to newest: `timeline cle <id> <id>…`."
b2.ada.g.story.standard: "Put the key's story in order, from its creation to its revocation."
b2.ada.done: "Case closed. A key forgotten at a provider, a missing check, and an attentive customer raises the alarm."
b2.hint.boxes.1: "dir-generale, dir-financiere, juridique, cabinet. communication was only read by the agency's client."
b2.hint.boxes.2: "`answer boxes 4`"
b2.hint.retire.1: "`jq '.keys[]' traces/cles-cirrus.json`: the `retire_after` field of grand-public-2016."
b2.hint.retire.2: "`answer retire 2021-04-01`"
b2.hint.story.1: "2016, 2021, May 2027, 16 June 2027, 18 June 2027."
b2.hint.story.2: "`timeline cle created retire forged alert revoked`"
b2.debrief.title: "The report"
b2.debrief.lesson: "The customer could neither protect the key nor fix the check: that was the provider's job. What it could do was see. And it could only see because it had paid to keep the detail of every access."
b2.debrief.p1: "Require from the provider the logs that show an abnormal access, at no extra cost."
b2.debrief.p2: "A signing key has an end date: going past it keeps a door open."
b2.debrief.p3: "An incident report about a provider starts from the customer: list of mailboxes, dates, evidence, and what the provider must fix."
b2.facts.title: "What really happened: Storm-0558, summer 2023"
b2.facts.p1: "In 2023, a group Microsoft calls Storm-0558 reads the Exchange Online mailboxes of 22 organisations and more than 500 people, including US government officials."
b2.facts.p2: "It forges access tokens with a signing key of Microsoft's consumer service, created in 2016, that the enterprise service should never have accepted."
b2.facts.p3: "The US State Department detects the intrusion on 16 June 2023, thanks to an alert written on the detailed log of message access (MailItemsAccessed), available with Microsoft's most expensive licence."
b2.facts.p4: "In March 2024, the Cyber Safety Review Board concludes there was a \"cascade\" of avoidable security errors at Microsoft, which could not establish how the key had been obtained."
b2.facts.p5: "After the incident, Microsoft announces it is opening detailed logs to more customers at no extra cost."
