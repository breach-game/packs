s2.briefing: "Thursday, 4 pm. Cordée got your call and is fixing it right away. They gave you a copy of the portal's configuration: `portail/comptes.yml` (the accounts) and `portail/api.yml` (who can read what). Once fixed, it is deployed through `contain`."
s2.obj.account: "Remove the test account from the account list"
s2.obj.owner: "Serve an application only to the store that owns it"
s2.obj.retest: "Deploy, then check the test account no longer opens"
s2.obj.warn: "Decide whom to warn"
s2.check.account: "Account 123456 no longer exists"
s2.check.owner: "The API serves an application only to its store (read: own_store)"
s2.check.others: "The real managers keep their accounts, and reads stay logged"
s2.contain.deploy: "Deploy the portal's fixed configuration"
s2.q.warn: "The logs show the test account had not signed in since 2019, except during the audit. Whom do you warn?"
s2.q.warn.all: "Everyone who applied through Margot"
s2.q.warn.all.why: "The most transparent, but millions of messages about a door that, according to the logs, nobody went through except the audit. Costly, and worrying for nothing if the logs are reliable."
s2.q.warn.logs: "Fournil and the data protection authority, logs in hand"
s2.q.warn.logs.why: "The client and the authority judge with the read logs. If a single unknown read shows up, the people concerned will be warned."
s2.q.warn.none: "Nobody: the flaw is fixed and nothing leaked"
s2.q.warn.none.why: "Even with no proven leak, personal data was open to anyone. The client must know, and the decision to notify is not the vendor's to make."
s2.ada.brief: "Read both files: `cat portail/comptes.yml` and `cat portail/api.yml`. Fix them with `edit`, or `sed`, then `verify`."
s2.ada.g.account: "Delete the line of account 123456: `edit portail/comptes.yml`, or `sed -i '/123456/d' portail/comptes.yml`. Keep the others. `verify`."
s2.ada.g.account.standard: "The test account must go, not the real managers. `verify`. To open the file: `edit portail/comptes.yml`."
s2.ada.g.owner: "In `portail/api.yml`, replace `read: any_signed_in` with `read: own_store`: `sed -i 's/read: any_signed_in/read: own_store/' portail/api.yml`. `verify`. Or by hand, in the editor: `edit portail/api.yml`, then Ctrl+S."
s2.ada.g.owner.standard: "The API must check whom the application belongs to, not just that you are signed in. `verify`."
s2.ada.fixed: "Configuration ready. Have it deployed: `contain disable portail`."
s2.ada.g.retest: "`contain disable portail`, then replay the sign-in: `curl -d \"user=123456 password=123456\" https://admin.cordee.test/login`."
s2.ada.g.retest.standard: "Deploy, then check for yourself that the door is shut."
s2.ada.retest: "Refused. The test account no longer exists, and even a real manager will only read their own store's applications."
s2.ada.g.warn: "Answer in the messenger or with `answer <option>`. No option is wrong, each has its cost."
s2.ada.done: "Door shut, files sorted by store. The card tells the real case."
s2.hint.account.1: "One line per account: the one holding 123456."
s2.hint.account.2: "With the editor: `edit portail/comptes.yml`, then Ctrl+S. With a command: `sed -i '/123456/d' portail/comptes.yml` then `verify`"
s2.hint.owner.1: "`read: own_store` instead of `read: any_signed_in`."
s2.hint.owner.2: "With the editor: `edit portail/api.yml`, then Ctrl+S. With a command: `sed -i 's/read: any_signed_in/read: own_store/' portail/api.yml` then `verify`"
s2.hint.retest.1: "`contain disable portail` then the same sign-in as during the audit."
s2.hint.warn.1: "Every option completes the objective. Look at what the logs say."
s2.debrief.title: "Whose file is this"
s2.debrief.lesson: "Closing the test account plugs today's hole. Checking whom each application belongs to plugs the class of flaw: even a real manager, or an account stolen tomorrow, will only read their own store's. And the read logs make it possible to say, figures in hand, who saw what."
s2.debrief.p1: "Every object an API serves is checked against the user asking for it, on every request."
s2.debrief.p2: "Sequential ids are not a flaw in themselves, but they make one immediate."
s2.debrief.p3: "Log reads of personal data: that is how you know whether an open door was used."
s2.facts.title: "What really happened: McHire and Paradox, 2025"
s2.facts.p1: "In 2025, two security researchers looked at McHire, McDonald's hiring site, where a chatbot named Olivia, from the vendor Paradox, runs the first steps."
s2.facts.p2: "On the admin portal, a test account opened with 123456 as user name and password. Paradox says it had not been used since 2019."
s2.facts.p3: "From that account, changing a number in a request gave access to applicants' conversations: according to BleepingComputer, more than 64 million applications were exposed."
s2.facts.p4: "Reported on 30 June 2025, the flaw was fixed the same day, according to McDonald's as quoted by BleepingComputer."
