s2.briefing: "Jeudi, 16 h. Cordée a reçu ton appel et corrige tout de suite. Ils t'ont confié une copie de la configuration du portail : `portail/comptes.yml` (les comptes) et `portail/api.yml` (qui peut lire quoi). Une fois corrigée, elle sera déployée par `contain`."
s2.obj.account: "Supprimer le compte de test de la liste des comptes"
s2.obj.owner: "Ne servir une candidature qu'au magasin qui la possède"
s2.obj.retest: "Déployer, puis vérifier que le compte de test ne s'ouvre plus"
s2.obj.warn: "Décider qui prévenir"
s2.check.account: "Le compte 123456 n'existe plus"
s2.check.owner: "L'API ne sert une candidature qu'à son magasin (read: own_store)"
s2.check.others: "Les vrais gérants gardent leur compte, et les lectures restent journalisées"
s2.contain.deploy: "Déployer la configuration corrigée du portail"
s2.q.warn: "Les journaux montrent que le compte de test ne s'était plus connecté depuis 2019, à part pendant l'audit. Qui prévient-on ?"
s2.q.warn.all: "Toutes les personnes qui ont candidaté par Margot"
s2.q.warn.all.why: "Le plus transparent, mais des millions de messages pour une porte que, d'après les journaux, personne n'a franchie à part l'audit. Coûteux, et inquiétant pour rien si les journaux sont fiables."
s2.q.warn.logs: "Fournil et l'autorité de protection des données, journaux à l'appui"
s2.q.warn.logs.why: "Le client et l'autorité jugent avec les journaux de lecture. Si une seule lecture inconnue apparaît, les personnes concernées seront prévenues."
s2.q.warn.none: "Personne : la faille est corrigée et rien n'a fuité"
s2.q.warn.none.why: "Même sans fuite prouvée, des données personnelles étaient ouvertes à tous. Le client doit le savoir, et la décision de notifier ne revient pas au prestataire."
s2.ada.brief: "Lis les deux fichiers : `cat portail/comptes.yml` et `cat portail/api.yml`. Corrige-les avec `edit`, ou `sed`, puis `verify`."
s2.ada.g.account: "Supprime la ligne du compte 123456 : `edit portail/comptes.yml`, ou `sed -i '/123456/d' portail/comptes.yml`. Garde les autres. `verify`."
s2.ada.g.account.standard: "Le compte de test doit disparaître, pas les vrais gérants. `verify`. Pour ouvrir le fichier : `edit portail/comptes.yml`."
s2.ada.g.owner: "Dans `portail/api.yml`, remplace `read: any_signed_in` par `read: own_store` : `sed -i 's/read: any_signed_in/read: own_store/' portail/api.yml`. `verify`. Ou à la main, dans l'éditeur : `edit portail/api.yml`, puis Ctrl+S."
s2.ada.g.owner.standard: "L'API doit vérifier à qui appartient la candidature, pas seulement qu'on est connecté. `verify`."
s2.ada.fixed: "Configuration prête. Fais-la déployer : `contain disable portail`."
s2.ada.g.retest: "`contain disable portail`, puis rejoue la connexion : `curl -d \"user=123456 password=123456\" https://admin.cordee.test/login`."
s2.ada.g.retest.standard: "Déploie, puis vérifie toi-même que la porte est fermée."
s2.ada.retest: "Refusé. Le compte de test n'existe plus, et même un vrai gérant ne lira plus que ses candidatures."
s2.ada.g.warn: "Réponds dans la messagerie ou avec `answer <option>`. Aucune option n'est fausse, chacune a son coût."
s2.ada.done: "Porte fermée, dossiers rangés par magasin. La fiche raconte l'affaire réelle."
s2.hint.account.1: "Une ligne par compte : celle qui contient 123456."
s2.hint.account.2: "Avec l'éditeur : `edit portail/comptes.yml`, puis Ctrl+S. Avec une commande : `sed -i '/123456/d' portail/comptes.yml` puis `verify`"
s2.hint.owner.1: "`read: own_store` au lieu de `read: any_signed_in`."
s2.hint.owner.2: "Avec l'éditeur : `edit portail/api.yml`, puis Ctrl+S. Avec une commande : `sed -i 's/read: any_signed_in/read: own_store/' portail/api.yml` puis `verify`"
s2.hint.retest.1: "`contain disable portail` puis la même connexion qu'à l'audit."
s2.hint.warn.1: "Toutes les options terminent l'objectif. Regarde ce que disent les journaux."
s2.debrief.title: "À qui est ce dossier"
s2.debrief.lesson: "Fermer le compte de test bouche le trou d'aujourd'hui. Vérifier à qui appartient chaque candidature bouche la classe de faille : même un vrai gérant, ou un compte volé demain, ne lira plus que celles de son magasin. Et les journaux de lecture permettent de dire, chiffres à l'appui, qui a vu quoi."
s2.debrief.p1: "Chaque objet servi par une API se vérifie contre l'utilisateur qui le demande, à chaque requête."
s2.debrief.p2: "Des identifiants qui se suivent ne sont pas une faille en soi, mais ils la rendent immédiate."
s2.debrief.p3: "Journaliser les lectures de données personnelles : c'est ce qui permet de savoir si une porte ouverte a servi."
s2.facts.title: "Ce qui s'est vraiment passé : McHire et Paradox, 2025"
s2.facts.p1: "En 2025, deux chercheurs en sécurité examinent McHire, le site de recrutement de McDonald's, où un chatbot nommé Olivia, de l'éditeur Paradox, fait passer les premières étapes."
s2.facts.p2: "Sur le portail d'administration, un compte de test s'ouvre avec 123456 comme identifiant et mot de passe. Paradox indique qu'il n'avait plus servi depuis 2019."
s2.facts.p3: "Depuis ce compte, changer un numéro dans une requête donne accès aux conversations de candidats : selon BleepingComputer, plus de 64 millions de candidatures étaient exposées."
s2.facts.p4: "Signalée le 30 juin 2025, la faille est corrigée le jour même, selon McDonald's cité par BleepingComputer."
