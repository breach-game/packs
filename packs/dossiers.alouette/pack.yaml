  fr: "Inspiré de l'assistant d'une concession automobile devenu célèbre en décembre 2023. Sous mandat, tu fais sortir une assistante de son rôle, tu lui fais accepter une offre absurde, puis tu poses les limites qui manquaient. La dernière mission raconte les faits, sources à l'appui."
