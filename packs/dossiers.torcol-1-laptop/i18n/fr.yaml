t1.briefing: "Lundi 15 mars, 21 h 58. Hublot a embauché un ingénieur à distance, Alexandre Morel. Son portable est arrivé vendredi, il l'a allumé ce soir à 21 h 40. Dix-huit minutes plus tard, l'agent de sécurité du poste lève trois alertes. Tu as un accès en lecture seule (compte `ir`). Les mesures passent par `contain`."
t1.obj.program: "Trouver le programme qui a déclenché les alertes"
t1.obj.alert: "Dire à quelle heure tombe la première alerte grave"
t1.obj.isolate: "Isoler le poste"
t1.obj.call: "Choisir comment joindre la personne"
t1.q.program: "Quel programme, lancé depuis le dossier personnel, tourne sur le poste ?"
t1.q.alert: "À quelle heure l'agent lève-t-il la première alerte « high » ? (HH:MM)"
t1.q.call: "Le poste est isolé. Comment contactes-tu le nouvel employé ?"
t1.q.call.hr: "Au numéro du dossier RH, en lui disant seulement que le poste a un souci"
t1.q.call.chat: "Sur la messagerie de l'entreprise, en lui demandant ce que fait le programme sysmond"
t1.q.call.chat.why: "Si ce n'est pas un accident, tu viens de prévenir l'attaquant de ce que tu as vu. Et tu n'apprends rien qu'il ne veuille te dire."
t1.q.call.wipe: "Pas de contact : effacer le poste à distance tout de suite"
t1.q.call.wipe.why: "Effacer détruit les preuves dont l'enquête aura besoin, et le poste est déjà isolé : il ne peut plus rien envoyer."
t1.contain.isolate: "Isoler le poste ws-0412 du réseau (l'agent garde son lien avec la console)"
t1.ada.brief: "Connecte-toi au poste : `ssh ir@ws-0412.hublot.test`, puis `ps -ef`."
t1.ada.g.program: "Dans `ps -ef`, un programme tourne depuis `~/.local/bin`. `answer program <nom>`."
t1.ada.g.program.standard: "Qu'est-ce qui tourne sur ce poste qui n'est ni le système ni l'agent ? `answer program`."
t1.ada.program: "sysmond, lancé à 21 h 54 depuis un terminal, deux minutes après l'ouverture de session."
t1.ada.g.alert: "Le journal de l'agent : `journalctl -u edr-agent`. `answer alert HH:MM`."
t1.ada.g.alert.standard: "Lis le journal de l'agent de sécurité. `answer alert HH:MM`."
t1.ada.alert: "21 h 55 : lecture des mots de passe du navigateur, puis l'historique du terminal vidé. Ce n'est pas une erreur de débutant."
t1.ada.spread: "Le poste vient d'ouvrir une connexion SSH vers un serveur interne. Isole, maintenant."
t1.ada.g.isolate: "`exit`, puis `contain isolate ws-0412`."
t1.ada.g.isolate.standard: "Coupe le poste du réseau avant qu'il aille plus loin. `contain`."
t1.ada.isolate: "Poste isolé. L'agent reste joignable pour l'enquête, rien d'autre ne sort."
t1.ada.g.call: "Réponds dans la messagerie ou avec `answer <option>`."
t1.ada.done: "Poste contenu, preuves gardées. Demain, on reprend l'embauche depuis le début."
t1.hint.program.1: "`answer program sysmond`"
t1.hint.alert.1: "La ligne « ALERT high: sysmond read browser saved logins »."
t1.hint.alert.2: "`answer alert 21:55`"
t1.hint.isolate.1: "`exit`, puis `contain isolate ws-0412`"
t1.hint.call.1: "Ne pas prévenir, ne pas détruire."
t1.debrief.title: "Le portable du nouveau"
t1.debrief.lesson: "Le portable n'a pas été piraté de l'extérieur : la personne qui l'a reçu a lancé elle-même un programme qui lit les mots de passe enregistrés et efface ses traces. L'agent de sécurité l'a vu en une minute. Isoler tout de suite a gardé l'incident sur un seul poste, sans rien effacer."
t1.debrief.p1: "Un agent de sécurité sur chaque poste neuf, actif avant la remise à l'employé, et quelqu'un qui lit ses alertes la nuit."
t1.debrief.p2: "Isoler, garder les preuves, et seulement ensuite effacer."
t1.debrief.p3: "Joindre la personne par un canal connu (le dossier RH), sans lui dire ce qu'on a vu."
