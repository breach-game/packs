t1.briefing: "Monday 15 March, 9:58 pm. Hublot hired a remote engineer, Alexandre Morel. His laptop arrived on Friday, he switched it on tonight at 9:40. Eighteen minutes later, the workstation's security agent raises three alerts. You have read-only access (account `ir`). Measures go through `contain`."
t1.obj.program: "Find the program that triggered the alerts"
t1.obj.alert: "Say at what time the first serious alert came"
t1.obj.isolate: "Isolate the workstation"
t1.obj.call: "Choose how to reach the person"
t1.q.program: "Which program, started from the home folder, runs on the workstation?"
t1.q.alert: "At what time does the agent raise the first \"high\" alert? (HH:MM)"
t1.q.call: "The workstation is isolated. How do you contact the new employee?"
t1.q.call.hr: "Call the HR file's number, mention only a laptop issue"
t1.q.call.chat: "On the company chat app, asking him what the sysmond program does"
t1.q.call.chat.why: "If it is no accident, you just told the attacker what you saw. And you learn nothing he does not want to tell you."
t1.q.call.wipe: "No contact: wipe the laptop remotely right now"
t1.q.call.wipe.why: "Wiping destroys the evidence the investigation will need, and the laptop is already isolated: it can send nothing more."
t1.contain.isolate: "Isolate workstation ws-0412 from the network (the agent keeps its link to the console)"
t1.ada.brief: "Sign in to the workstation: `ssh ir@ws-0412.hublot.test`, then `ps -ef`."
t1.ada.g.program: "In `ps -ef`, a program runs from `~/.local/bin`. `answer program <name>`."
t1.ada.g.program.standard: "What runs on this laptop that is neither the system nor the agent? `answer program`."
t1.ada.program: "sysmond, started at 9:54 pm from a terminal, two minutes after sign-in."
t1.ada.g.alert: "The agent's journal: `journalctl -u edr-agent`. `answer alert HH:MM`."
t1.ada.g.alert.standard: "Read the security agent's journal. `answer alert HH:MM`."
t1.ada.alert: "21:55: reading the browser's passwords, then the terminal history wiped. Not a beginner's mistake."
t1.ada.spread: "The laptop just opened an SSH connection to an internal server. Isolate, now."
t1.ada.g.isolate: "`exit`, then `contain isolate ws-0412`."
t1.ada.g.isolate.standard: "Cut the laptop off the network before it goes further. `contain`."
t1.ada.isolate: "Laptop isolated. The agent stays reachable for the investigation, nothing else leaves."
t1.ada.g.call: "Answer in the messenger or with `answer <option>`."
t1.ada.done: "Laptop contained, evidence kept. Tomorrow we go back over the hiring from the start."
t1.hint.program.1: "`answer program sysmond`"
t1.hint.alert.1: "The line \"ALERT high: sysmond read browser saved logins\"."
t1.hint.alert.2: "`answer alert 21:55`"
t1.hint.isolate.1: "`exit`, then `contain isolate ws-0412`"
t1.hint.call.1: "Do not warn, do not destroy."
t1.debrief.title: "The new hire's laptop"
t1.debrief.lesson: "The laptop was not hacked from outside: the person who received it ran a program that reads saved passwords and wipes its traces. The security agent saw it within a minute. Isolating at once kept the incident on a single laptop, without erasing anything."
t1.debrief.p1: "A security agent on every new laptop, running before it reaches the employee, and someone reading its alerts at night."
t1.debrief.p2: "Isolate, keep the evidence, and only then wipe."
t1.debrief.p3: "Reach the person through a known channel (the HR file), without saying what you saw."
