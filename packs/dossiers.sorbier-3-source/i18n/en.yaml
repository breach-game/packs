s3.briefing: "Sorbier's security team has confirmed it: the hidden file alters the SSH server of machines that install 5.6.1. The stable version is not affected. You have one morning to get the development version out of this."
s3.obj.first: "Choose the first thing to do"
s3.obj.back: "Go back to the last release published by the founder"
s3.obj.source: "Build from the public repository, no longer from the archive"
s3.q.first: "Nobody knows yet exactly what the hidden file does. What does Sorbier do first?"
s3.q.first.wait: "Wait for the hidden file's analysis to end, so as not to act blindly"
s3.q.first.wait.why: "The analysis will take days, and meanwhile machines install 5.6.1. We know enough to go back: a hidden line that runs a hidden file has no business being there."
s3.q.first.back: "Go back to the last safe version at once, and warn the other distributions"
s3.q.first.quiet: "Fix it quietly in the next release, without an alert, so as not to worry"
s3.q.first.quiet.why: "Other distributions build the same archive. Staying silent leaves them exposed. In a case like this one, warning quickly is part of the response."
s3.check.back: "The package goes back to version 5.4.6"
s3.check.source: "The package is built from the public repository"
s3.check.works: "The package still builds, with its tests"
s3.ada.brief: "Last morning at Sorbier. The build recipe of the package is in `dossier/build.yml`. But first, a decision."
s3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
s3.ada.answer.standard: "Answer my question first."
s3.ada.first: "Yes. You do not need to understand everything to stop the damage. You go back, you warn, and you analyse afterwards."
s3.ada.g.back: "Open the recipe: `edit dossier/build.yml`. The last release published by the founder is 5.4.6: replace `5.6.1` with `5.4.6`, then `verify`."
s3.ada.g.back.standard: "Open `dossier/build.yml` and go back to the last release published by the founder. Then `verify`. To open the file: `edit dossier/build.yml`."
s3.ada.g.source: "Next, the source. As long as Sorbier builds the archive, it installs a line nobody reviewed. Write `source: git-tag`, then `verify`. That does not fix everything: the hidden file itself is in the repository too, among the tests. But without that line nothing runs it, and going back to 5.4.6 sets it aside."
s3.ada.g.source.standard: "Next, have the package built from what everybody can review. Then `verify`."
s3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
s3.ada.done: "The development version is back on known code, and the other distributions have been warned. Open the debrief: at the end, the real incident this case file comes from."
s3.hint.first.1: "Ask yourself what happens on the machines while everybody waits."
s3.hint.back.1: "The line to change is `version`. The last release published by the founder is in the comment just above."
s3.hint.back.2: "With the editor: `edit dossier/build.yml`, then Ctrl+S. With a command: type `sed -i \"s/version: 5.6.1/version: 5.4.6/\" dossier/build.yml`."
s3.hint.source.1: "The line to change is `source`. The value for the public repository is `git-tag`."
s3.hint.source.2: "With the editor: `edit dossier/build.yml`, then Ctrl+S. With a command: type `sed -i \"s/source: release-archive/source: git-tag/\" dossier/build.yml`, then `verify`."
s3.debrief.title: "Back to what you know"
s3.debrief.lesson: "You did not need to take the hidden file apart to protect the machines. You went back to a known version, brought what is installed closer to what is reviewed, and warned the others."
s3.debrief.p1: "Faced with a doubtful component, first go back to the last safe version. The full analysis comes after."
s3.debrief.p2: "Building from the public source, or comparing the archive with it, closes the gap between what is reviewed and what is installed. It is not enough on its own: in the real case, the payload also sat in the repository's test files, and only the line added to the archive woke it up. What the tests contain must be reviewed too."
s3.debrief.p3: "Development versions exist for this: catching problems before they reach everybody's machines."
s3.debrief.p4: "Knowing what your software depends on, indirect dependencies included, lets you respond in hours and not in weeks."
s3.facts.title: "What really happened: xz Utils, March 2024"
s3.facts.p1: "Sorbier and libplume do not exist. The scenario is inspired by the backdoor found in xz Utils, a very widespread compression library, and made public on 29 March 2024 on the oss-security mailing list."
s3.facts.p2: "The developer who found it had noticed odd symptoms on the development version of Debian: SSH logins that used a lot of processor time, and errors in a memory analysis tool."
s3.facts.p3: "Versions 5.6.0 and 5.6.1 were affected. One line of a build script existed only in the published archives, not in the repository. The rest was hidden in the repository, in the form of test files."
s3.facts.p4: "The code only became active under precise conditions, notably during the build of a Debian or RPM package for Linux on x86-64 processors. It reached the SSH server because some distributions patch it to use libsystemd, which depends on the library."
s3.facts.p5: "The flaw was given the identifier CVE-2024-3094 and the highest severity score, 10 out of 10."
s3.facts.p6: "According to the Wikipedia article, it was the outcome of more than two years of effort by an account that gradually earned the project's trust until it was given maintainer rights."
s3.facts.p7: "The affected versions had not yet been widely deployed: they were mostly in the development versions of the major distributions, which went back to earlier ones."
