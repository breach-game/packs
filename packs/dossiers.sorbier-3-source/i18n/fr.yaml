s3.briefing: "L'équipe sécurité de Sorbier a confirmé : le fichier caché modifie le serveur SSH des machines qui installent la 5.6.1. La version stable n'est pas touchée. Il te reste une matinée pour sortir la version de développement de là."
s3.obj.first: "Choisir la première chose à faire"
s3.obj.back: "Revenir à la dernière version publiée par le fondateur"
s3.obj.source: "Construire depuis le dépôt public, plus depuis l'archive"
s3.q.first: "On ne sait pas encore exactement ce que fait le fichier caché. Que fait Sorbier en premier ?"
s3.q.first.wait: "Attendre la fin de l'analyse du fichier caché, pour ne pas agir à l'aveugle"
s3.q.first.wait.why: "L'analyse prendra des jours, et pendant ce temps des machines installent la 5.6.1. On en sait assez pour revenir en arrière : une ligne cachée qui lance un fichier caché n'a rien à faire là."
s3.q.first.back: "Revenir tout de suite à la dernière version sûre, et prévenir les autres distributions"
s3.q.first.quiet: "Corriger discrètement dans la prochaine version, sans alerter personne pour ne pas inquiéter"
s3.q.first.quiet.why: "D'autres distributions construisent la même archive. Se taire les laisse exposées. Dans une affaire comme celle-ci, prévenir vite fait partie de la réponse."
s3.check.back: "Le paquet revient à la version 5.4.6"
s3.check.source: "Le paquet est construit depuis le dépôt public"
s3.check.works: "Le paquet se construit toujours, avec ses tests"
s3.ada.brief: "Dernière matinée chez Sorbier. La recette de construction du paquet est dans `dossier/build.yml`. Mais d'abord, une décision."
s3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
s3.ada.answer.standard: "Réponds d'abord à ma question."
s3.ada.first: "Oui. On n'a pas besoin de tout comprendre pour arrêter les dégâts. On revient en arrière, on prévient, et on analyse ensuite."
s3.ada.g.back: "Ouvre la recette : `edit dossier/build.yml`. La dernière version publiée par le fondateur est la 5.4.6 : remplace `5.6.1` par `5.4.6`, puis `verify`."
s3.ada.g.back.standard: "Ouvre `dossier/build.yml` et reviens à la dernière version publiée par le fondateur. Puis `verify`. Pour ouvrir le fichier : `edit dossier/build.yml`."
s3.ada.g.source: "Ensuite la source. Tant que Sorbier construit l'archive, il installe une ligne que personne n'a relue. Écris `source: git-tag`, puis `verify`. Ça ne règle pas tout : le fichier caché, lui, est aussi dans le dépôt, parmi les tests. Mais sans cette ligne, rien ne le lance, et revenir à la 5.4.6 l'écarte."
s3.ada.g.source.standard: "Fais ensuite construire le paquet depuis ce que tout le monde peut relire. Puis `verify`."
s3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
s3.ada.done: "La version de développement est revenue à un code connu, et les autres distributions sont prévenues. Ouvre le débrief : à la fin, l'incident réel d'où vient ce dossier."
s3.hint.first.1: "Demande-toi ce qui se passe sur les machines pendant qu'on attend."
s3.hint.back.1: "La ligne à changer est `version`. La dernière version publiée par le fondateur est notée dans le commentaire juste au-dessus."
s3.hint.back.2: "Avec l'éditeur : `edit dossier/build.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/version: 5.6.1/version: 5.4.6/\" dossier/build.yml`."
s3.hint.source.1: "La ligne à changer est `source`. La valeur pour le dépôt public est `git-tag`."
s3.hint.source.2: "Avec l'éditeur : `edit dossier/build.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/source: release-archive/source: git-tag/\" dossier/build.yml`, puis `verify`."
s3.debrief.title: "Revenir à ce que l'on connaît"
s3.debrief.lesson: "Tu n'as pas eu besoin de décortiquer le fichier caché pour protéger les machines. Tu es revenu à une version connue, tu as rapproché ce qu'on installe de ce qu'on relit, et tu as prévenu les autres."
s3.debrief.p1: "Face à un composant douteux, on revient d'abord à la dernière version sûre. L'analyse complète vient après."
s3.debrief.p2: "Construire depuis la source publique, ou comparer l'archive avec elle, referme l'écart entre ce qu'on relit et ce qu'on installe. Ça ne suffit pas seul : dans l'affaire réelle, la charge dormait aussi dans les fichiers de test du dépôt, et seule la ligne ajoutée à l'archive la réveillait. Il faut aussi relire ce que contiennent les tests."
s3.debrief.p3: "Les versions de développement servent à ça : attraper les problèmes avant qu'ils n'arrivent sur les machines de tout le monde."
s3.debrief.p4: "Savoir de quoi ton logiciel dépend, dépendances indirectes comprises, permet de répondre en heures plutôt qu'en semaines."
s3.facts.title: "Ce qui s'est vraiment passé : xz Utils, mars 2024"
s3.facts.p1: "Sorbier et libplume n'existent pas. Le scénario s'inspire de la porte dérobée découverte dans xz Utils, une bibliothèque de compression très répandue, et rendue publique le 29 mars 2024 sur la liste de diffusion oss-security."
s3.facts.p2: "Le développeur qui l'a trouvée avait remarqué des symptômes étranges sur la version de développement de Debian : des connexions SSH qui consommaient beaucoup de processeur, et des erreurs dans un outil d'analyse de la mémoire."
s3.facts.p3: "Les versions 5.6.0 et 5.6.1 étaient touchées. Une ligne d'un script de construction n'existait que dans les archives publiées, pas dans le dépôt. Le reste était caché dans le dépôt, sous la forme de fichiers de test."
s3.facts.p4: "Le code ne s'activait que dans des conditions précises, notamment pendant la construction d'un paquet Debian ou RPM pour Linux sur processeur x86-64. Il atteignait le serveur SSH parce que certaines distributions le modifient pour utiliser libsystemd, qui dépend de la bibliothèque."
s3.facts.p5: "La faille a reçu l'identifiant CVE-2024-3094 et la note de gravité maximale, 10 sur 10."
s3.facts.p6: "Selon l'article de Wikipédia, elle est l'aboutissement de plus de deux ans d'efforts d'un compte qui a gagné peu à peu la confiance du projet jusqu'à obtenir les droits de mainteneur."
s3.facts.p7: "Les versions touchées n'avaient pas encore été largement déployées : elles se trouvaient surtout dans les versions de développement des grandes distributions, qui sont revenues en arrière."
