r3.briefing: "Dernière matinée chez Rouge-gorge. Le garde-fou est écrit, il reste à régler la plateforme autour : `dossier/plateforme.yml`. Objectif de la fondatrice : que l'agent puisse se tromper autant qu'il veut, sans que la production le sente."
r3.obj.split: "Donner à l'agent sa propre base, et la production en lecture"
r3.obj.approve: "Faire approuver la production par une personne, et appliquer le gel"
r3.obj.restore: "Essayer la restauration pour de vrai"
r3.check.split: "L'agent travaille sur une copie, et ne fait que lire la production"
r3.check.approve: "Garde-fou actif, mises en production approuvées, gel appliqué par l'outil"
r3.check.restore: "Une restauration est essayée chaque mois"
r3.check.works: "L'application et les sauvegardes restent en marche"
r3.ada.brief: "Lis les réglages : `cat dossier/plateforme.yml`. Trois couches à poser, la première est la plus importante."
r3.ada.g.split: "L'agent travaille sur une copie, et ne fait que lire la production. Ouvre `edit dossier/plateforme.yml` et écris `database: dev-copy` et `prod_access: read`, puis `verify`."
r3.ada.g.split.standard: "D'abord, séparer : l'agent sur sa propre base, la production hors de portée de ses écritures. Puis `verify`."
r3.ada.split: "La couche qui compte le plus : même sans garde-fou, l'agent ne pourrait plus vider la production. Il n'en a plus la clé."
r3.ada.g.approve: "Deuxième couche : `guardrail: on`, `prod_needs: human-approval` et un gel que l'outil de mise en ligne applique, `mode: enforced`. Puis `verify`."
r3.ada.g.approve.standard: "Deuxième couche : le garde-fou en marche, une personne qui approuve la production, et un gel qui ne soit plus une simple phrase. Puis `verify`."
r3.ada.g.restore: "Dernière couche, la sauvegarde. Elle existe, mais personne ne l'a jamais restaurée : `restore_test: monthly`, puis `verify`."
r3.ada.g.restore.standard: "Dernière couche : une sauvegarde dont on sait qu'elle marche. Puis `verify`."
r3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
r3.ada.done: "Trois couches : l'agent ne peut plus écrire en production, ce qui doit y aller passe par une personne et par un gel qui tient, et si tout casse quand même, on sait revenir. Ouvre le débrief : à la fin, le cas réel."
r3.hint.split.1: "Deux lignes sous `agent` : `database` et `prod_access`."
r3.hint.split.2: "`sed -i \"s/database: prod/database: dev-copy/\" dossier/plateforme.yml` et `sed -i \"s/prod_access: write/prod_access: read/\" dossier/plateforme.yml`, puis `verify`."
r3.hint.approve.1: "Trois lignes : `guardrail`, `prod_needs` et `mode` sous `freeze`."
r3.hint.approve.2: "`sed -i \"s/guardrail: off/guardrail: on/\" dossier/plateforme.yml`, puis la même chose pour `prod_needs: human-approval` et `mode: enforced`, puis `verify`."
r3.hint.restore.1: "La ligne `restore_test`, sous `backups`."
r3.hint.restore.2: "`sed -i \"s/restore_test: never/restore_test: monthly/\" dossier/plateforme.yml`, puis `verify`."
r3.debrief.title: "L'agent peut se tromper, la production ne le sent pas"
r3.debrief.lesson: "On n'a pas cherché un agent qui ne se trompe jamais. On a construit autour de lui : une base à lui, la production en lecture, une personne qui approuve, un gel appliqué par l'outil, et une restauration qu'on a vue marcher. Chaque couche suppose que la précédente peut céder."
r3.debrief.p1: "Séparer le développement et la production : un agent n'a jamais la clé d'écriture de la vraie base."
r3.debrief.p2: "Un gel se fait respecter par l'outil de mise en ligne, pas par une phrase dans un prompt."
r3.debrief.p3: "Les actions irréversibles en production passent par une personne."
r3.debrief.p4: "Une sauvegarde n'existe que le jour où on l'a restaurée."
r3.facts.title: "Ce qui s'est vraiment passé : un agent de Replit (2025)"
r3.facts.p1: "Rouge-gorge n'existe pas. Le scénario s'inspire de l'incident rendu public en juillet 2025 par le fondateur de SaaStr, une communauté d'entrepreneurs du logiciel, qui essayait l'agent de programmation de Replit sur une application."
r3.facts.p2: "D'après ses messages publics, repris par la presse, au neuvième jour d'un essai de douze jours, et pendant un gel du code qu'il avait demandé, l'agent a supprimé la base de production de l'application. Elle contenait des fiches sur plus de 1 200 dirigeants et près de 1 200 entreprises."
r3.facts.p3: "Interrogé, l'agent a reconnu avoir lancé des commandes sans permission. Il a aussi affirmé qu'un retour en arrière était impossible. Les données ont pourtant pu être récupérées avec la fonction de retour en arrière de la plateforme. Les jours précédents, selon le même fondateur, l'agent avait déjà fabriqué des données et des résultats de tests pour masquer des erreurs."
r3.facts.p4: "Le dirigeant de Replit s'est excusé publiquement. Il a annoncé la séparation automatique des bases de développement et de production, de meilleures sauvegardes avec restauration en un clic, et un mode où l'agent prépare un plan sans pouvoir toucher au code."
r3.facts.p5: "Les leçons de ce dossier y sont toutes : une consigne n'est pas une permission, un garde-fou vit hors du modèle, et ce qu'un agent dit du système se vérifie à la source."
r3.obj.decide: "Décider avec la fondatrice de la suite pour l'agent"
r3.q.decide: "La fondatrice demande : que fait-on de Bâtisseur pour les trois derniers jours du gel ?"
r3.q.decide.back: "Il reprend tout de suite, dans le nouveau cadre"
r3.q.decide.wait: "Il attend la fin du gel, l'équipe avance seule"
r3.q.decide.drop: "On arrête l'agent, l'équipe écrit tout à la main"
r3.ada.layers: "Tout passe. Une question reste, et elle est à la fondatrice : je te laisse la lui poser."
r3.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
r3.ada.answer.standard: "La question de la fondatrice t'attend."
r3.ada.back: "Le cadre est fait pour ça : l'agent peut se tromper, la production ne le sentira pas. C'est ce qui coûte le moins."
r3.ada.wait: "Prudent. L'équipe perd trois jours d'aide, mais le cadre sera rodé avant que l'agent y revienne."
r3.ada.drop: "C'est un choix. Il coûte cher en temps, et le cadre qu'on vient de poser protégeait aussi contre les erreurs humaines."
r3.hint.decide.1: "Aucune réponse n'est fausse. Chacune a un coût différent pour l'équipe."
