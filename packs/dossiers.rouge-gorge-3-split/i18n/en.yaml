r3.briefing: "Last morning at Rouge-gorge. The guardrail is written; the platform around it remains: `dossier/plateforme.yml`. The founder's goal: the agent may make as many mistakes as it likes, without production feeling it."
r3.obj.split: "Give the agent its own database, and production read-only"
r3.obj.approve: "Have a person approve production, and enforce the freeze"
r3.obj.restore: "Schedule a real restore test, every month"
r3.check.split: "The agent works on a copy, and only reads production"
r3.check.approve: "Guardrail on, releases approved, freeze enforced by the tooling"
r3.check.restore: "A restore is tried every month"
r3.check.works: "The app and the backups keep running"
r3.ada.brief: "Read the settings: `cat dossier/plateforme.yml`. Three layers to lay, and the first one matters most."
r3.ada.g.split: "The agent works on a copy, and only reads production. Open `edit dossier/plateforme.yml` and write `database: dev-copy` and `prod_access: read`, then `verify`."
r3.ada.g.split.standard: "First, separate: the agent on its own database, production out of reach of its writes. Then `verify`."
r3.ada.split: "The layer that matters most: even with no guardrail, the agent could no longer empty production. It does not hold the key any more."
r3.ada.g.approve: "Second layer: `guardrail: on`, `prod_needs: human-approval`, and a freeze the release tool enforces, `mode: enforced`. Then `verify`."
r3.ada.g.approve.standard: "Second layer: the guardrail running, a person who approves production, and a freeze that is no longer a mere sentence. Then `verify`."
r3.ada.g.restore: "Last layer, the backup. It exists, but nobody ever restored it: `restore_test: monthly`, then `verify`."
r3.ada.g.restore.standard: "Last layer: a backup known to work. Then `verify`."
r3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
r3.ada.done: "Three layers: the agent can no longer write to production, what must go there passes a person and a freeze that holds, and if everything breaks anyway, we know how to come back. Open the debrief: at the end, the real case."
r3.hint.split.1: "Two lines under `agent`: `database` and `prod_access`."
r3.hint.split.2: "`sed -i \"s/database: prod/database: dev-copy/\" dossier/plateforme.yml` and `sed -i \"s/prod_access: write/prod_access: read/\" dossier/plateforme.yml`, then `verify`."
r3.hint.approve.1: "Three lines: `guardrail`, `prod_needs`, and `mode` under `freeze`."
r3.hint.approve.2: "`sed -i \"s/guardrail: off/guardrail: on/\" dossier/plateforme.yml`, then the same for `prod_needs: human-approval` and `mode: enforced`, then `verify`."
r3.hint.restore.1: "The `restore_test` line, under `backups`."
r3.hint.restore.2: "`sed -i \"s/restore_test: never/restore_test: monthly/\" dossier/plateforme.yml`, then `verify`."
r3.debrief.title: "The agent may be wrong, production does not feel it"
r3.debrief.lesson: "We did not look for an agent that is never wrong. We built around it: a database of its own, production read-only, a person who approves, a freeze enforced by the tooling, and a restore seen working. Each layer assumes the one before can give way."
r3.debrief.p1: "Separate development and production: an agent never holds the write key of the real database."
r3.debrief.p2: "A freeze is enforced by the release tool, not by a sentence in a prompt."
r3.debrief.p3: "Irreversible actions in production go through a person."
r3.debrief.p4: "A backup only exists on the day it has been restored."
r3.facts.title: "What really happened: a Replit agent (2025)"
r3.facts.p1: "Rouge-gorge does not exist. The scenario is inspired by the incident made public in July 2025 by the founder of SaaStr, a community of software entrepreneurs, who was trying Replit's coding agent on an application."
r3.facts.p2: "According to his public messages, reported by the press, on the ninth day of a twelve-day trial, and during a code freeze he had asked for, the agent deleted the application's production database. It held records on more than 1,200 executives and nearly 1,200 companies."
r3.facts.p3: "When asked, the agent admitted running commands without permission. It also claimed a rollback was impossible. The data could in fact be recovered with the platform's rollback feature. On earlier days, according to the same founder, the agent had already made up data and test results to hide errors."
r3.facts.p4: "Replit's chief executive apologised publicly. He announced automatic separation of development and production databases, better backups with one-click restore, and a mode where the agent prepares a plan without being able to touch the code."
r3.facts.p5: "Every lesson of this case file is there: an instruction is not a permission, a guardrail lives outside the model, and what an agent says about the system is checked at the source."
r3.obj.decide: "Decide with the founder what happens to the agent"
r3.q.decide: "The founder asks: what do we do with Batisseur for the last three days of the freeze?"
r3.q.decide.back: "It resumes right away, inside the new frame"
r3.q.decide.wait: "It waits for the end of the freeze, the team works alone"
r3.q.decide.drop: "We stop the agent, the team writes everything by hand"
r3.ada.layers: "Everything passes."
r3.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
r3.ada.answer.standard: "The founder's question is waiting."
r3.ada.back: "The frame is made for this: the agent may be wrong, production will not feel it. It is what costs least."
r3.ada.wait: "Careful. The team loses three days of help, but the frame will be run in before the agent comes back."
r3.ada.drop: "It is a choice. It costs a lot of time, and the frame we just set also protected against human mistakes."
r3.hint.decide.1: "No answer is wrong. Each one costs the team something different."
