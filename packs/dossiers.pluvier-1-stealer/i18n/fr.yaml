p1.briefing: "Un service de veille a trouvé sur un forum une archive qui mentionne Pluvier : `analyse/butin.zip`. À côté, l'export des comptes de l'entrepôt : `analyse/comptes.txt`. Personne n'a forcé l'entrepôt. Alors par où ?"
p1.obj.account: "Trouver le compte de Pluvier que contient l'archive"
p1.obj.since: "Dire depuis quand son mot de passe n'a pas changé"
p1.obj.how: "Dire d'où vient la fuite"
p1.q.account: "Quel compte de l'entrepôt de Pluvier se trouve dans l'archive ?"
p1.q.since: "À quelle date le mot de passe de ce compte a-t-il été changé pour la dernière fois ? (AAAA-MM-JJ)"
p1.q.how: "D'où vient ce mot de passe ?"
p1.q.how.laptop: "D'un logiciel espion sur l'ordinateur personnel d'un prestataire"
p1.q.how.warehouse: "D'une faille dans le code de l'entrepôt de données lui-même, côté serveur"
p1.q.how.warehouse.why: "L'entrepôt n'a pas été forcé : l'archive vient d'un ordinateur de salon, et le compte s'ouvre avec son vrai mot de passe."
p1.q.how.guessed: "D'un mot de passe bien trop court, deviné par des essais"
p1.q.how.guessed.why: "Le mot de passe est dans l'archive, enregistré par un navigateur. Personne n'a eu besoin de le deviner."
p1.ada.brief: "Commence par regarder ce qu'est ce fichier : `file analyse/butin.zip`, puis son contenu : `unzip -l analyse/butin.zip`."
p1.ada.g.account: "Une archive de logiciel espion : il vide les mots de passe enregistrés dans le navigateur. Lis-les sans rien extraire : `unzip -p analyse/butin.zip Passwords.txt`. Puis `answer account <compte>`."
p1.ada.g.account.standard: "Lis ce que l'archive a volé, sans l'extraire sur le poste, et trouve le compte de Pluvier. `answer account`."
p1.ada.account: "Le compte de service des rapports, enregistré dans le navigateur d'un ordinateur nommé PC-SALON. Un compte de service sur un ordinateur de salon."
p1.ada.g.since: "Regarde ce compte dans l'export : `cat analyse/comptes.txt`, colonne PASSWORD_LAST_SET. Puis `answer since <AAAA-MM-JJ>`."
p1.ada.g.since.standard: "Trouve dans l'export des comptes quand ce mot de passe a changé pour la dernière fois. `answer since`."
p1.ada.since: "Volé en février 2023, jamais changé depuis. Plus de quatre ans à attendre qu'on s'en serve. Et pas de seconde étape, pas de limite d'adresses."
p1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
p1.ada.answer.standard: "Ma question t'attend dans la messagerie."
p1.ada.done: "Un ordinateur personnel, un jeu téléchargé, un mot de passe enregistré, puis quatre ans de silence. L'entrepôt n'a rien à se reprocher : c'est le compte qui était ouvert à tous les vents. Et quelqu'un s'en sert en ce moment."
p1.hint.account.1: "`unzip -p analyse/butin.zip Passwords.txt` affiche un membre sans rien écrire sur le disque."
p1.hint.account.2: "`answer account svc-rapports`"
p1.hint.since.1: "`cat analyse/comptes.txt`, ligne svc-rapports."
p1.hint.since.2: "`answer since 2023-02-09`"
p1.hint.how.1: "Lis `System.txt` dans l'archive : de quelle machine vient-elle ?"
p1.debrief.title: "Le portable du prestataire"
p1.debrief.lesson: "Un logiciel espion vole tout ce que le navigateur garde : mots de passe, cookies. Ici, il venait d'un jeu téléchargé sur l'ordinateur personnel d'un prestataire, qui s'en servait aussi pour travailler. Le mot de passe d'un compte de service y dormait depuis 2023, jamais changé."
p1.debrief.p1: "Réserver l'accès aux données de l'entreprise à des appareils gérés, pas à l'ordinateur familial."
p1.debrief.p2: "Changer régulièrement les mots de passe des comptes de service, ou mieux, les remplacer par des clés."
p1.debrief.p3: "Surveiller les fuites publiées qui mentionnent ses domaines, et agir sur chacune."
