p1.briefing: "A threat intelligence service found on a forum an archive that mentions Pluvier: `analyse/butin.zip`. Next to it, the export of the warehouse's accounts: `analyse/comptes.txt`. Nobody broke into the warehouse. So how?"
p1.obj.account: "Find the Pluvier account the archive holds"
p1.obj.since: "Say how long its password has gone unchanged"
p1.obj.how: "Say where the leak comes from"
p1.q.account: "Which account of Pluvier's warehouse is in the archive?"
p1.q.since: "On what date was this account's password last changed? (YYYY-MM-DD)"
p1.q.how: "Where does this password come from?"
p1.q.how.laptop: "From spyware on a contractor's personal computer"
p1.q.how.warehouse: "From a flaw in the code of the data warehouse itself"
p1.q.how.warehouse.why: "The warehouse was not broken into: the archive comes from a living-room computer, and the account opens with its real password."
p1.q.how.guessed: "From a password too short, guessed by trying"
p1.q.how.guessed.why: "The password is in the archive, saved by a browser. Nobody needed to guess it."
p1.ada.brief: "Start by looking at what this file is: `file analyse/butin.zip`, then its contents: `unzip -l analyse/butin.zip`."
p1.ada.g.account: "A spyware archive: it empties the passwords saved in the browser. Read them without extracting anything: `unzip -p analyse/butin.zip Passwords.txt`. Then `answer account <account>`."
p1.ada.g.account.standard: "Read what the archive stole, without extracting it on the workstation, and find Pluvier's account. `answer account`."
p1.ada.account: "The reporting service account, saved in the browser of a computer called PC-SALON. A service account on a living-room computer."
p1.ada.g.since: "Look at this account in the export: `cat analyse/comptes.txt`, column PASSWORD_LAST_SET. Then `answer since <YYYY-MM-DD>`."
p1.ada.g.since.standard: "Find in the accounts export when this password last changed. `answer since`."
p1.ada.since: "Stolen in February 2023, never changed since. Over four years waiting to be used. And no second step, no address limit."
p1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
p1.ada.answer.standard: "My question is waiting in the messenger."
p1.ada.done: "A personal computer, a downloaded game, a saved password, then four years of silence. The warehouse is not to blame: it was the account that was wide open. And someone is using it right now."
p1.hint.account.1: "`unzip -p analyse/butin.zip Passwords.txt` shows a member without writing anything to disk."
p1.hint.account.2: "`answer account svc-rapports`"
p1.hint.since.1: "`cat analyse/comptes.txt`, the svc-rapports line."
p1.hint.since.2: "`answer since 2023-02-09`"
p1.hint.how.1: "Read `System.txt` in the archive: which machine does it come from?"
p1.debrief.title: "The contractor's laptop"
p1.debrief.lesson: "Spyware steals everything the browser keeps: passwords, cookies. Here it came from a game downloaded on a contractor's personal computer, which was also used for work. A service account's password had been sleeping there since 2023, never changed."
p1.debrief.p1: "Keep access to company data for managed devices, not the family computer."
p1.debrief.p2: "Change service account passwords regularly, or better, replace them with keys."
p1.debrief.p3: "Watch published leaks that mention your domains, and act on each one."
