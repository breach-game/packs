p3.briefing: "Bench 42 has been quiet since this morning. The IT manager wants a story before noon: what happened, in what order, what the readings went through, and what to do now. The evidence is in `enquete/` and `alertes/`, the rest is on the workstation."
p3.obj.order: "Put the week back in order"
p3.obj.trace: "Trace the path of the stolen readings"
p3.obj.integrity: "Tell the lab what to check first"
p3.obj.tell: "Decide whom to warn"
p3.tl.text: "The week of bench 42, from first contact to the alert"
p3.tl.courriel: "An email \"mandatory printer driver update\" arrives for the workstation's account"
p3.tl.telechargement: "The driver archive is downloaded on the workstation"
p3.tl.service: "The imprimante-maj service starts for the first time"
p3.tl.kill: "The help desk kills the process, which comes back five seconds later"
p3.tl.cron: "The plan B scheduled job is added to the workstation's account"
p3.tl.alerte: "The firewall flags the connections to 203.0.113.50"
p3.path.text: "The path of the readings, from where they are kept to the lab's way out"
p3.q.integrity: "The lab publishes drinking water results for forty towns. What must it check first?"
p3.q.integrity.compare: "That the readings were read, not changed: compare the cache with the server"
p3.q.integrity.rerun: "Run every analysis of the week again, to be safe, before publishing"
p3.q.integrity.rerun.why: "The programs only read the cache (\"collect=\"). Comparing the cache with the server proves in an hour what running the analyses again would cost in a week."
p3.q.integrity.reinstall: "Reinstall every workstation of the lab, right away, before anything else"
p3.q.integrity.reinstall.why: "Only bench 42 contacted the zone, according to the firewall and the resolver. Bench 42 will be reinstalled, but the towns' question is whether the results are intact."
p3.q.tell: "The week's readings left the lab. Whom do you warn?"
p3.q.tell.towns: "The towns concerned, with what left and the proof that nothing was changed"
p3.q.tell.towns.why: "The towns know. The health authority may hear it from them, and will ask why not directly."
p3.q.tell.authority: "The towns concerned and the health authority, with the same story and the integrity proof"
p3.q.tell.authority.why: "One story, to the right people, with the integrity proof. More work tonight, far fewer questions tomorrow."
p3.q.tell.internal: "No one outside: the readings hold no personal data"
p3.q.tell.internal.why: "No personal data, but drinking water results that the towns publish. If they surface elsewhere, the lab's silence will be the first question."
p3.ada.brief: "Show the events to put in order: `timeline semaine`. Then gather the times: the evidence in `enquete/`, the firewall report in `alertes/`, and the workstation's journal (`ssh ir@poste42.ombelle.test`, `journalctl`)."
p3.ada.g.order: "Note the time of each event: `cat enquete/mx.log`, `cat enquete/historique-navigateur.txt`, `cat enquete/ticket-assistance.txt`, then on the workstation `journalctl -u imprimante-maj` and `journalctl -u cron`. Then `timeline semaine <id> <id>…`, oldest first."
p3.ada.g.order.standard: "Date each event from the evidence and the workstation's journal, then give the order with `timeline semaine`."
p3.ada.order: "Look at the order: the scheduled job arrives the very afternoon the help desk killed the process. Someone was watching the workstation, and brought out plan B."
p3.ada.g.trace: "On the map: where are the readings kept, which machine read them, and to whom did it hand its DNS questions? `path releves <host> <host> <host>`, with short names."
p3.ada.g.trace.standard: "Trace the path of the readings on the map, from their source to the way out. `path releves`."
p3.ada.trace: "The analysis server, the workstation that caches them, then the resolver that forwards. Three machines, and only one was compromised."
p3.ada.g.integrity: "Read again what the programs did, with `strings` on the workstation if needed. Read or write?"
p3.ada.integrity: "Compare the cache with the server: an hour of work, and a proof you can show."
p3.ada.g.tell: "There is no wrong answer here, only a cost. Choose."
p3.ada.done: "The story fits on one page: a fake driver, two mechanisms, two channels, one workstation. The lab reinstalls bench 42 tonight and adds your DNS rule to the SOC."
p3.hint.order.1: "Email 13:48 and download 13:55 on the 15th, service 14:02 on the 15th, kill 11:24 and cron 16:40 on the 19th, alert on the 22nd."
p3.hint.order.2: "`timeline semaine courriel telechargement service kill cron alerte`"
p3.hint.trace.1: "The readings are on lims, cached on poste42, and the questions go through ns."
p3.hint.trace.2: "`path releves lims poste42 ns`"
p3.hint.integrity.1: "\"collect=/opt/ombelle/lims-cache/*.csv\": the programs read. `answer compare`"
p3.debrief.title: "The thread"
p3.debrief.lesson: "An email, a fake driver, a service that restarts itself, a ticket closed too early, a plan B added the same day, and a week of readings leaving through DNS. Put back in order, the story mostly shows the moment it all could have stopped: Friday at 11:24, when the process came back five seconds after being killed."
p3.debrief.p1: "Rebuild the timeline before concluding: the order of events often tells who was watching whom."
p3.debrief.p2: "Prove the data is intact before redoing everything: a comparison beats a week of analyses."
p3.debrief.p3: "A \"slow workstation\" ticket that reveals an unknown program is an incident, not a fault."
