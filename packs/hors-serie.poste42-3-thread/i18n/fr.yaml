p3.briefing: "Le poste 42 est calme depuis ce matin. La responsable informatique veut un récit avant midi : ce qui s'est passé, dans quel ordre, ce que les relevés ont traversé, et ce qu'il faut faire maintenant. Les pièces sont dans `enquete/` et `alertes/`, le reste est sur le poste."
p3.obj.order: "Remettre la semaine dans l'ordre"
p3.obj.trace: "Tracer le chemin des relevés volés"
p3.obj.integrity: "Dire au laboratoire ce qu'il doit vérifier d'abord"
p3.obj.tell: "Décider qui prévenir"
p3.tl.text: "La semaine du poste 42, du premier contact à l'alerte"
p3.tl.courriel: "Un courriel « mise à jour obligatoire du pilote » arrive pour le compte du poste"
p3.tl.telechargement: "L'archive du pilote est téléchargée sur le poste"
p3.tl.service: "Le service imprimante-maj démarre pour la première fois"
p3.tl.kill: "L'assistance tue le processus, qui revient cinq secondes plus tard"
p3.tl.cron: "La tâche planifiée du plan B est ajoutée au compte du poste"
p3.tl.alerte: "Le pare-feu signale les connexions vers 203.0.113.50"
p3.path.text: "Le chemin des relevés, de l'endroit où ils sont gardés jusqu'à la porte de sortie du laboratoire"
p3.q.integrity: "Le laboratoire publie des résultats sur l'eau potable de quarante communes. Que doit-il vérifier en premier ?"
p3.q.integrity.compare: "Que les relevés ont été lus et pas modifiés : comparer le cache au serveur"
p3.q.integrity.rerun: "Refaire toutes les analyses de la semaine, par précaution, avant de publier"
p3.q.integrity.rerun.why: "Les programmes ne faisaient que lire le cache (« collect= »). Comparer le cache au serveur prouve en une heure ce que refaire les analyses coûterait en une semaine."
p3.q.integrity.reinstall: "Réinstaller tous les postes du laboratoire, tout de suite, avant tout le reste"
p3.q.integrity.reinstall.why: "Seul le poste 42 a contacté la zone, d'après le pare-feu et le résolveur. Le poste 42 sera réinstallé, mais la question des communes est l'intégrité des résultats."
p3.q.tell: "Les relevés de la semaine sont sortis du laboratoire. Qui prévenir ?"
p3.q.tell.towns: "Les communes concernées, avec ce qui est sorti et la preuve que rien n'a été modifié"
p3.q.tell.towns.why: "Les communes savent. L'autorité sanitaire l'apprendra peut-être par elles, et demandera pourquoi pas directement."
p3.q.tell.authority: "Les communes concernées et l'autorité sanitaire, avec le même récit"
p3.q.tell.authority.why: "Un seul récit, aux bonnes personnes, avec la preuve d'intégrité. C'est plus de travail ce soir, et beaucoup moins de questions demain."
p3.q.tell.internal: "Personne dehors : les relevés ne contiennent aucune donnée personnelle"
p3.q.tell.internal.why: "Pas de donnée personnelle, mais des résultats sur l'eau potable que les communes publient. S'ils ressortent ailleurs, le silence du laboratoire sera la première question."
p3.ada.brief: "Affiche les événements à remettre dans l'ordre : `timeline semaine`. Puis rassemble les heures : les pièces dans `enquete/`, le rapport du pare-feu dans `alertes/`, et le journal du poste (`ssh ir@poste42.ombelle.test`, `journalctl`)."
p3.ada.g.order: "Note l'heure de chaque événement : `cat enquete/mx.log`, `cat enquete/historique-navigateur.txt`, `cat enquete/ticket-assistance.txt`, puis sur le poste `journalctl -u imprimante-maj` et `journalctl -u cron`. Ensuite `timeline semaine <id> <id>…`, du plus ancien au plus récent."
p3.ada.g.order.standard: "Date chaque événement à partir des pièces et du journal du poste, puis donne l'ordre avec `timeline semaine`."
p3.ada.order: "Regarde l'ordre : la tâche planifiée arrive l'après-midi même où l'assistance a tué le processus. Quelqu'un surveillait le poste, et a sorti son plan B."
p3.ada.g.trace: "Sur la carte : où sont gardés les relevés, quelle machine les a lus, et à qui elle a confié ses questions DNS ? `path releves <hôte> <hôte> <hôte>`, avec les noms courts."
p3.ada.g.trace.standard: "Trace le chemin des relevés sur la carte, de leur source à la sortie. `path releves`."
p3.ada.trace: "Le serveur d'analyses, le poste qui les met en cache, puis le résolveur qui relaie. Trois machines, et une seule était compromise."
p3.ada.g.integrity: "Relis ce que faisaient les programmes, avec `strings` sur le poste si besoin. Lire ou écrire ?"
p3.ada.integrity: "Comparer le cache au serveur : une heure de travail, et une preuve qu'on peut montrer."
p3.ada.g.tell: "Il n'y a pas de mauvaise réponse ici, seulement un coût. Choisis."
p3.ada.done: "Le récit tient en une page : un faux pilote, deux mécanismes, deux canaux, un poste. Le laboratoire réinstalle le poste 42 ce soir et ajoute ta règle DNS au SOC."
p3.hint.order.1: "Courriel 13:48 et téléchargement 13:55 le 15, service 14:02 le 15, kill 11:24 et cron 16:40 le 19, alerte le 22."
p3.hint.order.2: "`timeline semaine courriel telechargement service kill cron alerte`"
p3.hint.trace.1: "Les relevés sont sur lims, mis en cache sur poste42, et les questions passent par ns."
p3.hint.trace.2: "`path releves lims poste42 ns`"
p3.hint.integrity.1: "« collect=/opt/ombelle/lims-cache/*.csv » : les programmes lisaient. `answer compare`"
p3.debrief.title: "Le fil"
p3.debrief.lesson: "Un courriel, un faux pilote, un service qui se relance, un ticket fermé trop tôt, un plan B ajouté le jour même, et une semaine de relevés sortis par le DNS. Remise dans l'ordre, l'histoire montre surtout le moment où tout aurait pu s'arrêter : vendredi à 11 h 24, quand le processus est revenu cinq secondes après avoir été tué."
p3.debrief.p1: "Reconstituer la chronologie avant de conclure : l'ordre des faits dit souvent qui surveillait qui."
p3.debrief.p2: "Prouver l'intégrité des données avant de tout refaire : une comparaison vaut mieux qu'une semaine d'analyses."
p3.debrief.p3: "Un ticket « poste lent » qui révèle un programme inconnu est un incident, pas une panne."
