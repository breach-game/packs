d1.briefing: "Verdier makes a password manager. Every night, its customers' vaults go to backup in object storage. If an intruder copied one, what could they read without anyone's master password? A test sample is in `dossier/echantillon.json`, and `jq` reads it."
d1.obj.clear: "Find the field the backup does not encrypt"
d1.obj.weak: "Find the least protected vault"
d1.obj.worth: "Say what can be gained without a password"
d1.q.clear: "In a vault entry, which field can be read as it is?"
d1.q.weak: "Which customer's vault is easiest to attack by guessing passwords?"
d1.q.worth: "A thief has the backup but no master password. What do the addresses in clear give them?"
d1.q.worth.target: "The list of customers with a bank, a crypto wallet or VPN access: who to aim at first"
d1.q.worth.nothing: "Nothing: without the master password, a site address is of no use to them at all"
d1.q.worth.nothing.why: "An address says where to look. It lets them choose which vaults to crack first, and write believable phishing emails."
d1.q.worth.login: "They are enough to log in to the sites, since the site already knows the customer"
d1.q.worth.login.why: "No: the username and password stay encrypted. But knowing a customer has such an account is already intelligence."
d1.ada.brief: "Start with one entry: `jq \".vaults[0].items[0]\" dossier/echantillon.json`. Values that start with `ENC:` are encrypted."
d1.ada.g.clear: "Look at the first entry: `jq \".vaults[0].items[0]\" dossier/echantillon.json`. Which field does not start with `ENC:`? Answer with `answer clear <field>`."
d1.ada.g.clear.standard: "Read a vault entry with `jq`, and find the field in clear. `answer clear`."
d1.ada.clear: "The site address, in clear, in every entry. The password is protected; the list of places where it is used is not."
d1.ada.g.weak: "Each vault is encrypted with a key derived from the master password, repeating a computation `iterations` times. The fewer, the faster the guesses. `jq -r \".vaults[].kdf.iterations\" dossier/echantillon.json`, then `jq -r \".vaults[].customer\" dossier/echantillon.json`, and `answer weak <customer>`."
d1.ada.g.weak.standard: "Compare the `kdf` setting of the three vaults, and give the most exposed customer: `answer weak`."
d1.ada.weak: "5,000 iterations, against 600,000 for a recent vault: a hundred and twenty times faster to attack. An old account whose setting was never raised. One last question."
d1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
d1.ada.answer.standard: "My question is waiting in the messenger."
d1.ada.done: "An encrypted backup is not a silent one. It says who has what, and which will give in first. So the backups must be guarded, and above all their keys."
d1.hint.clear.1: "Encrypted values all start with `ENC:`."
d1.hint.clear.2: "`answer clear url`"
d1.hint.weak.1: "The number of iterations is in `kdf`. The smallest is the weakest."
d1.hint.weak.2: "`answer weak c-0193`"
d1.hint.worth.1: "If you had to choose which vault to crack first, what would help you?"
d1.debrief.title: "Encrypted, but talkative"
d1.debrief.lesson: "Passwords are encrypted, but every site's address stays in clear, and old vaults are protected by a setting that is too weak. A thief reads no password straight away: they already know who to aim at, and where to start."
d1.debrief.p1: "Encrypt metadata too: a site address says a lot about a person."
d1.debrief.p2: "Raise the key derivation setting of old accounts at their next login, without waiting."
d1.debrief.p3: "A stolen vault is only as safe as its master password: it must be long and unique."
