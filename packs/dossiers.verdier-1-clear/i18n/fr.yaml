d1.briefing: "Verdier fabrique un gestionnaire de mots de passe. Chaque nuit, les coffres de ses clients partent en sauvegarde dans un stockage objet. Si un intrus en copiait une, que pourrait-il lire sans le mot de passe maître de personne ? Un échantillon de test est dans `dossier/echantillon.json`, et `jq` le lit."
d1.obj.clear: "Trouver le champ que la sauvegarde ne chiffre pas"
d1.obj.weak: "Trouver le coffre le moins protégé"
d1.obj.worth: "Dire ce que vaut ce qu'on lit sans mot de passe"
d1.q.clear: "Dans une entrée de coffre, quel champ est lisible tel quel ?"
d1.q.weak: "Quel client a le coffre le plus facile à attaquer par essais de mots de passe ?"
d1.q.worth: "Un voleur a la sauvegarde mais aucun mot de passe maître. Que lui apportent les adresses en clair ?"
d1.q.worth.target: "La liste des clients qui ont une banque, un portefeuille crypto ou un VPN : qui viser d'abord"
d1.q.worth.nothing: "Rien : sans le mot de passe maître, une adresse de site ne lui sert à rien du tout"
d1.q.worth.nothing.why: "Une adresse dit où chercher. Elle permet de choisir les coffres à casser en premier, et d'écrire des courriels de hameçonnage crédibles."
d1.q.worth.login: "Elles suffisent pour se connecter aux sites, puisque chaque site reconnaît déjà le navigateur du client"
d1.q.worth.login.why: "Non : l'identifiant et le mot de passe restent chiffrés. Mais savoir qu'un client a tel compte, c'est déjà un renseignement."
d1.ada.brief: "Commence par une entrée : `jq \".vaults[0].items[0]\" dossier/echantillon.json`. Les valeurs qui commencent par `ENC:` sont chiffrées."
d1.ada.g.clear: "Regarde la première entrée : `jq \".vaults[0].items[0]\" dossier/echantillon.json`. Quel champ ne commence pas par `ENC:` ? Réponds avec `answer clear <champ>`."
d1.ada.g.clear.standard: "Lis une entrée de coffre avec `jq`, et trouve le champ en clair. `answer clear`."
d1.ada.clear: "L'adresse du site, en clair, dans chaque entrée. Le mot de passe est protégé, la liste des endroits où il sert ne l'est pas."
d1.ada.g.weak: "Chaque coffre est chiffré avec une clé tirée du mot de passe maître, en répétant un calcul `iterations` fois. Moins il y en a, plus les essais vont vite. `jq -r \".vaults[].kdf.iterations\" dossier/echantillon.json`, puis `jq -r \".vaults[].customer\" dossier/echantillon.json`, et `answer weak <client>`."
d1.ada.g.weak.standard: "Compare le réglage `kdf` des trois coffres, et donne le client le plus exposé : `answer weak`."
d1.ada.weak: "5 000 itérations, contre 600 000 pour un coffre récent : cent vingt fois plus rapide à attaquer. Un vieux compte dont le réglage n'a jamais été relevé. Une dernière question."
d1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
d1.ada.answer.standard: "Ma question t'attend dans la messagerie."
d1.ada.done: "Une sauvegarde chiffrée n'est pas une sauvegarde muette. Elle dit qui a quoi, et lesquels céderont en premier. Il faut donc garder les sauvegardes, et surtout leurs clés."
d1.hint.clear.1: "Les valeurs chiffrées commencent toutes par `ENC:`."
d1.hint.clear.2: "`answer clear url`"
d1.hint.weak.1: "Le nombre d'itérations est dans `kdf`. Le plus petit est le plus faible."
d1.hint.weak.2: "`answer weak c-0193`"
d1.hint.worth.1: "Si tu devais choisir quel coffre casser en premier, qu'est-ce qui t'aiderait ?"
d1.debrief.title: "Chiffré, mais bavard"
d1.debrief.lesson: "Les mots de passe sont chiffrés, mais l'adresse de chaque site reste en clair, et les vieux coffres sont protégés par un réglage trop faible. Un voleur ne lit aucun mot de passe tout de suite : il sait déjà qui viser, et par où commencer."
d1.debrief.p1: "Chiffrer aussi les métadonnées : une adresse de site en dit long sur une personne."
d1.debrief.p2: "Relever le réglage de dérivation des vieux comptes à leur prochaine connexion, sans attendre."
d1.debrief.p3: "La sécurité d'un coffre volé dépend de son mot de passe maître : il doit être long et unique."
