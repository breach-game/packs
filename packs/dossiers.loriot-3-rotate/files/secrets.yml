# loriot-ui - secrets of the continuous integration - mandate LO-2027-019
# old: the value printed in run 812. rotated: a new value, the old one refused.
npm_token: old
deploy_key: old
# a token created for each run by the forge, refused as soon as the job ends
forge_token: per-run

# public | deleted: the log of run 812
run_812_log: public

# on | off: the package registry refuses versions not built by this CI
publish_from_ci_only: on
