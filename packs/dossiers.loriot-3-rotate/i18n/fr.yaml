l3.briefing: "L'action est épinglée, mais trois secrets ont passé la nuit dans un journal public. La liste est dans `dossier/secrets.yml`. La mainteneuse veut que plus rien de ce qui est sorti ne marche, puis savoir quoi dire aux projets qui dépendent de loriot-ui."
l3.obj.rotate: "Remplacer les secrets exposés qui marchent encore"
l3.obj.log: "Effacer le journal bavard"
l3.obj.forge: "Dire pourquoi un secret n'a pas besoin d'être changé"
l3.obj.tell: "Décider quoi dire aux projets qui dépendent de loriot-ui"
l3.check.rotate: "Jeton de publication et clé de déploiement remplacés"
l3.check.log: "Le journal de l'exécution 812 est effacé"
l3.check.works: "Le jeton par exécution et la publication depuis l'intégration seule restent en place"
l3.q.forge: "Le jeton de la forge est sorti lui aussi. Pourquoi n'est-il pas dans la liste à changer ?"
l3.q.forge.expired: "Il est créé pour chaque exécution et refusé dès qu'elle se termine"
l3.q.forge.harmless: "Il n'a jamais eu aucun droit, il ne sert qu'à afficher les journaux"
l3.q.forge.harmless.why: "Il avait tous les droits (`write-all`) pendant l'exécution, c'est pourquoi la mission précédente les a réduits. Mais il ne vaut plus rien une fois le travail fini."
l3.q.forge.forgot: "C'est un oubli, il faut le changer comme les autres"
l3.q.forge.forgot.why: "On ne peut pas changer un jeton qui n'existe plus : le journal dit « Token FORGE_TOKEN revoked » à la fin de l'exécution."
l3.q.tell: "Que dit Loriot aux projets qui dépendent de loriot-ui ?"
l3.q.tell.advisory: "Un avis de sécurité : ce qui est sorti, ce qui a été changé, aucune version piégée publiée"
l3.q.tell.changelog: "Une ligne dans les notes de la prochaine version"
l3.q.tell.quiet: "Rien : aucune fausse version n'a été publiée"
l3.ada.brief: "Lis la liste : `cat dossier/secrets.yml`. Le journal de l'exécution 812 t'a dit lesquels sont sortis, et lequel est mort avec elle."
l3.ada.g.rotate: "Deux secrets marchent encore : `npm_token` et `deploy_key`. Ouvre `edit dossier/secrets.yml` et passe-les à `rotated`, puis `verify`."
l3.ada.g.rotate.standard: "Remplace ce qui est sorti et marche encore. Puis `verify`."
l3.ada.g.log: "Le journal public est une affiche : `run_812_log: deleted`, puis `verify`. Ça n'efface pas les copies, mais ça arrête la distribution."
l3.ada.g.log.standard: "Retire l'affiche : le journal qui montre les secrets. Puis `verify`."
l3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
l3.ada.rotated: "Ce qui est sorti ne marche plus, et le journal ne le montre plus. Une question sur le troisième secret."
l3.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
l3.ada.answer.standard: "Ma question t'attend dans la messagerie."
l3.ada.forge: "Oui : un jeton qui meurt avec son travail est le meilleur secret qui soit. Dernière décision, la plus visible."
l3.ada.advisory: "Le choix qui coûte le moins : les 3 400 projets savent quoi vérifier, et la confiance tient parce qu'on a parlé le premier."
l3.ada.changelog: "Peu de gens lisent les notes de version. Ceux qui vérifient leurs dépendances apprendront l'histoire ailleurs."
l3.ada.quiet: "Aucune fausse version, c'est vrai. Mais le journal était public, et quelqu'un finira par en parler à ta place."
l3.ada.done: "Une action épinglée, des jetons qui ne servent qu'une fois, des secrets remplacés. Ouvre le débrief : à la fin, le cas réel."
l3.hint.rotate.1: "Deux lignes valent `old`."
l3.hint.rotate.2: "`sed -i \"s/npm_token: old/npm_token: rotated/\" dossier/secrets.yml` et `sed -i \"s/deploy_key: old/deploy_key: rotated/\" dossier/secrets.yml`, puis `verify`."
l3.hint.log.1: "`sed -i \"s/run_812_log: public/run_812_log: deleted/\" dossier/secrets.yml`, puis `verify`."
l3.hint.forge.1: "Relis la dernière ligne du journal de l'exécution 812."
l3.hint.tell.1: "Aucune réponse n'est fausse. Laquelle laisse le moins de questions à ceux qui dépendent de toi ?"
l3.debrief.title: "Ce qui est sorti doit cesser de marcher"
l3.debrief.lesson: "On ne rattrape pas un secret publié : on le rend inutile. Loriot remplace ce qui marche encore, efface le journal, s'appuie sur des jetons qui meurent avec leur travail, et dit à ceux qui en dépendent ce qui s'est passé."
l3.debrief.p1: "Un secret exposé se remplace tout de suite, même sans preuve qu'il a servi."
l3.debrief.p2: "Les jetons de courte durée, créés pour un seul travail, limitent ce qu'une fuite peut coûter."
l3.debrief.p3: "Effacer un journal public arrête la diffusion, pas les copies déjà faites."
l3.debrief.p4: "Une bibliothèque dont d'autres dépendent leur doit un avis clair."
l3.facts.title: "Ce qui s'est vraiment passé : tj-actions/changed-files, 2025"
l3.facts.p1: "Le 14 mars 2025, les étiquettes de version de tj-actions/changed-files, une action d'intégration continue utilisée par plus de 23 000 dépôts, sont déplacées vers un commit malveillant."
l3.facts.p2: "Le code modifié lit la mémoire de l'exécution et écrit les secrets qu'il y trouve dans le journal, encodés deux fois en Base64. Dans les dépôts publics, ces journaux sont lisibles par tout le monde."
l3.facts.p3: "La compromission reçoit l'identifiant CVE-2025-30066. L'enquête la relie à un jeton d'accès volé, et à la compromission antérieure d'une autre action."
l3.facts.p4: "L'action est retirée quelques heures, puis ses étiquettes sont rétablies. Les recommandations : épingler les actions sur l'empreinte complète d'un commit, remplacer les secrets exposés, relire les journaux des exécutions concernées."
l3.facts.p5: "Personne n'a visé un projet en particulier : un seul outil partagé a suffi pour toucher des milliers de chaînes d'intégration à la fois."
