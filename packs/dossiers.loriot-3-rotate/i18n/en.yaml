l3.briefing: "The action is pinned, but three secrets spent the night in a public log. The list is in `dossier/secrets.yml`. The maintainer wants nothing that came out to work any more, then to know what to tell the projects that depend on loriot-ui."
l3.obj.rotate: "Replace the exposed secrets that still work"
l3.obj.log: "Delete the talkative log"
l3.obj.forge: "Say why one secret does not need changing"
l3.obj.tell: "Decide what to tell the projects that depend on loriot-ui"
l3.check.rotate: "Publishing token and deploy key replaced"
l3.check.log: "The log of run 812 is deleted"
l3.check.works: "The per-run token and publishing from CI only stay in place"
l3.q.forge: "The forge token came out too. Why is it not on the list to change?"
l3.q.forge.expired: "It is created for each run and refused as soon as the run ends"
l3.q.forge.harmless: "It never had any rights, it is only used to display the logs"
l3.q.forge.harmless.why: "It had every right (`write-all`) during the run, which is why the previous mission reduced them. But it is worthless once the job is done."
l3.q.forge.forgot: "It is an oversight, it must be changed like the others"
l3.q.forge.forgot.why: "A token that no longer exists cannot be changed: the log says \"Token FORGE_TOKEN revoked\" at the end of the run."
l3.q.tell: "What does Loriot tell the projects that depend on loriot-ui?"
l3.q.tell.advisory: "A security advisory: what came out, what was changed, no trapped version published"
l3.q.tell.changelog: "A line in the notes of the next release"
l3.q.tell.quiet: "Nothing: no fake version was published"
l3.ada.brief: "Read the list: `cat dossier/secrets.yml`. Run 812's log told you which ones came out, and which one died with it."
l3.ada.g.rotate: "Two secrets still work: `npm_token` and `deploy_key`. Open `edit dossier/secrets.yml` and set them to `rotated`, then `verify`."
l3.ada.g.rotate.standard: "Replace what came out and still works. Then `verify`."
l3.ada.g.log: "The public log is a poster: `run_812_log: deleted`, then `verify`. It does not erase copies, but it stops the distribution."
l3.ada.g.log.standard: "Take the poster down: the log that shows the secrets. Then `verify`."
l3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
l3.ada.rotated: "What came out no longer works, and the log no longer shows it. One question about the third secret."
l3.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
l3.ada.answer.standard: "My question is waiting in the messenger."
l3.ada.forge: "Yes: a token that dies with its job is the best kind of secret. Last decision, the most visible one."
l3.ada.advisory: "The cheapest choice: the 3,400 projects know what to check, and trust holds because you spoke first."
l3.ada.changelog: "Few people read release notes. Those who check their dependencies will hear the story elsewhere."
l3.ada.quiet: "No fake version, true. But the log was public, and someone will end up telling the story for you."
l3.ada.done: "A pinned action, tokens used only once, secrets replaced, and users told. Open the debrief: the real case is at the end."
l3.hint.rotate.1: "Two lines say `old`."
l3.hint.rotate.2: "`sed -i \"s/npm_token: old/npm_token: rotated/\" dossier/secrets.yml` and `sed -i \"s/deploy_key: old/deploy_key: rotated/\" dossier/secrets.yml`, then `verify`."
l3.hint.log.1: "`sed -i \"s/run_812_log: public/run_812_log: deleted/\" dossier/secrets.yml`, then `verify`."
l3.hint.forge.1: "Read the last line of run 812's log again."
l3.hint.tell.1: "No answer is wrong. Which one leaves those who depend on you with the fewest questions?"
l3.debrief.title: "What came out must stop working"
l3.debrief.lesson: "A published secret cannot be caught back: it is made useless. Loriot replaces what still works, deletes the log, relies on tokens that die with their job, and tells those who depend on it what happened."
l3.debrief.p1: "An exposed secret is replaced at once, even with no proof it was used."
l3.debrief.p2: "Short-lived tokens, created for a single job, limit what a leak can cost."
l3.debrief.p3: "Deleting a public log stops the spread, not the copies already made."
l3.debrief.p4: "A library others depend on owes them a clear advisory."
l3.facts.title: "What really happened: tj-actions/changed-files, 2025"
l3.facts.p1: "On 14 March 2025, the version tags of tj-actions/changed-files, a continuous integration action used by more than 23,000 repositories, were moved to a malicious commit."
l3.facts.p2: "The modified code read the run's memory and wrote the secrets it found into the log, encoded twice in Base64. In public repositories, those logs are readable by anyone."
l3.facts.p3: "The compromise was given the identifier CVE-2025-30066. The investigation tied it to a stolen access token, and to an earlier compromise of another action."
l3.facts.p4: "The action was taken down for a few hours, then its tags were restored. The advice: pin actions to a commit's full hash, replace exposed secrets, review the logs of affected runs."
l3.facts.p5: "Nobody targeted one project in particular: a single shared tool was enough to reach thousands of integration chains at once."
