id: dossiers.mcp-github-2025
version: 1.0.0
engine: ">=0.5 <1"
kind: mission
requires: []
title:
  fr: "Dossier 09 · Faille MCP GitHub (2025)"
  en: "Case file 09 · GitHub MCP Vulnerability (2025)"
summary:
  fr: "Exploitation d'une injection de commande dans le serveur GitHub MCP."
  en: "Command injection exploitation in the GitHub MCP server."
authors: [BREACH team]
locales: [fr, en]
difficulty: 4
skills: [security, mcp, git]
order: 1
stage: response
briefing: s1.briefing

files:
  dossier/mcp_config.json: { $file: files/mcp_config.json }

objectives:
  - { id: first, text: s1.obj.first }
  - { id: sanitize, text: s1.obj.sanitize }
  - { id: restrict, text: s1.obj.restrict }

questions:
  - id: first
    text: s1.q.first
    objective: first
    correct: patch
    options:
      - { id: ignore, text: s1.q.first.ignore, why: s1.q.first.ignore.why }
      - { id: patch, text: s1.q.first.patch }
      - { id: kill, text: s1.q.first.kill, why: s1.q.first.kill.why }

checks:
  - id: sanitize
    text: s1.check.sanitize
    if: { all: [{ file: "~/dossier/mcp_config.json", contains: "\"input_sanitization\": true" }, { file: "~/dossier/mcp_config.json", lacks: "\"input_sanitization\": false" }] }
    objective: sanitize
  - id: restrict
    text: s1.check.restrict
    if: { all: [{ file: "~/dossier/mcp_config.json", contains: "\"execute_command\": false" }, { file: "~/dossier/mcp_config.json", lacks: "\"execute_command\": true" }] }
    objective: restrict
  - id: works
    text: s1.check.works
    if: { all: [{ file: "~/dossier/mcp_config.json", contains: "\"version\": \"2.0.1\"" }, { file: "~/dossier/mcp_config.json", contains: "\"allow_remote_repo\": false" }] }

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: s1.ada.brief
      - ada.ask: first
  - on: { event: ObjectiveCompleted, objective: first }
    do:
      - ada.say: s1.ada.first
  - on: { event: Verified }
    if: { not: { all: [{ objective: sanitize }, { objective: restrict }] } }
    once: false
    do:
      - ada.say: s1.ada.almost
  - on: { event: MissionCompleted }
    do:
      - ada.say: s1.ada.done

guide:
  first: s1.ada.answer
  sanitize: s1.ada.g.sanitize
  restrict: s1.ada.g.restrict

hints:
  first: [s1.hint.first.1]
  sanitize: [s1.hint.sanitize.1, s1.hint.sanitize.2]
  restrict: [s1.hint.restrict.1, s1.hint.restrict.2]

debrief:
  title: s1.debrief.title
  lesson: s1.debrief.lesson
  points: [s1.debrief.p1, s1.debrief.p2, s1.debrief.p3, s1.debrief.p4]
  reference: "OWASP Top 10 for LLM Applications · LLM07: Insecure Plugin Design"
  facts:
    title: s1.facts.title
    points: [s1.facts.p1, s1.facts.p2, s1.facts.p3, s1.facts.p4, s1.facts.p5, s1.facts.p6, s1.facts.p7]
    sources:
      - { label: "CVE-2025-53107 - GitHub Advisory", url: "https://github.com/advisories/GHSA-3q26-f695-pp76" }
      - { label: "Invariant Labs MCP vulnerability research", url: "https://invariantlabs.ai/blog/mcp-github-vulnerability" }
