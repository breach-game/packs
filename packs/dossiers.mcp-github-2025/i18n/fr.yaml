s1.briefing: "Une injection de commande a été découverte dans le serveur MCP GitHub (CVE-2025-53107). Un attaquant peut exploiter une Issue malveillante pour exécuter du code via child_process.exec et exfiltrer des dépôts privés. Vous devez sécuriser la configuration du serveur MCP."
s1.obj.first: "Prendre la première décision de réponse"
s1.obj.sanitize: "Activer la sanitization des entrées"
s1.obj.restrict: "Désactiver l'exécution arbitraire de commandes"
s1.q.first: "Des chercheurs ont démontré qu'une Issue GitHub forgée permet d'exécuter des commandes système via le serveur MCP. Que faites-vous en premier ?"
s1.q.first.ignore: "Ignorer tant qu'aucun exploit public n'est détecté"
s1.q.first.ignore.why: "La vulnérabilité permet une prise de contrôle totale du serveur via le protocole MCP."
s1.q.first.patch: "Appliquer les correctifs de validation des entrées et restreindre les capacités d'exécution"
s1.q.first.kill: "Désactiver définitivement tous les serveurs MCP de l'organisation"
s1.q.first.kill.why: "Une coupure globale bloque les intégrations légitimes sans corriger la configuration vulnérable."
s1.check.sanitize: "L'option input_sanitization est activée"
s1.check.restrict: "L'option execute_command est désactivée"
s1.check.works: "La version est mise à jour et l'accès distant est restreint"
s1.ada.brief: "Bienvenue sur le dossier Faille MCP GitHub. Le fichier de configuration du serveur MCP se trouve dans `dossier/mcp_config.json`. Mais d'abord, une question."
s1.ada.answer: "Répondez dans le messager, ou avec `answer` et la lettre."
s1.ada.first: "Correct. Les serveurs MCP manipulent des contextes sensibles et nécessitent une politique stricte d'exécution."
s1.ada.almost: "La configuration du serveur MCP n'est pas encore sécurisée. Vérifiez la sanitization et les permissions d'exécution."
s1.ada.done: "Félicitations. Le serveur MCP GitHub est désormais protégé contre les injections de commandes. Consultez le debrief pour les détails réels."
s1.hint.first.1: "Pensez à l'impact d'une exécution de commande distante via le serveur MCP."
s1.hint.sanitize.1: "Cherchez l'option 'input_sanitization' dans le fichier JSON."
s1.hint.sanitize.2: "Passez la valeur à 'true'."
s1.hint.restrict.1: "L'exécution arbitraire est contrôlée par 'execute_command'."
s1.hint.restrict.2: "Passez la valeur à 'false', mettez à jour la version vers '2.0.1' et désactivez 'allow_remote_repo'."
s1.debrief.title: "Sécuriser l'écosystème MCP"
s1.debrief.lesson: "Les serveurs Model Context Protocol (MCP) ouvrent des accès privilégiés aux LLM et doivent être sécurisés avec le même niveau d'exigence que des API critiques."
s1.debrief.p1: "Ne jamais passer d'entrées utilisateur ou extraites de contextes (RAG, Issues) directement à des fonctions d'exécution système (like child_process.exec)."
s1.debrief.p2: "Appliquer le principe de moindre privilège aux outils exposés par les serveurs MCP."
s1.debrief.p3: "Toujours assainir et valider les paramètres avant traitement."
s1.debrief.p4: "Segmenter les accès réseau et restreindre les dépôts accessibles au strict nécessaire."
s1.facts.title: "Faille GitHub MCP : La réalité (2025)"
s1.facts.p1: "En mai 2025, Invariant Labs a révélé une vulnérabilité critique affectant le serveur GitHub MCP."
s1.facts.p2: "Une Issue GitHub malveillante contenant du texte forgé pouvait déclencher une injection de commande à travers l'agent LLM."
s1.facts.p3: "La vulnérabilité est enregistrée sous la référence CVE-2025-53107."
s1.facts.p4: "Elle permettait l'exfiltration de dépôts privés et de secrets enregistrés dans le système."
s1.facts.p5: "Le correctif apporté par GitHub inclut une sanitization stricte des arguments d'outils et l'abandon des appels système non sécurisés."
s1.facts.p6: "Cet incident a poussé l'écosystème MCP à adopter de nouvelles spécifications de sécurité pour le Model Context Protocol."
s1.facts.p7: "Il met en évidence les risques liés aux plugins LLM non isolés."
