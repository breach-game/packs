c3.briefing: "Last morning at Chardonneret. Charly still answers from memory, confidently. Its settings are in `dossier/charly.yml`. The director first has a quick idea, and wants your view."
c3.obj.notice: "Judge the director's quick idea"
c3.obj.ground: "Make Charly answer from the published pages"
c3.obj.unsure: "Make it hand over when it does not know, and quote amounts as written"
c3.obj.review: "Have its answers reviewed every week"
c3.q.notice: "The director's idea: write under the window \"Charly can be wrong, check our conditions\". Is that enough?"
c3.q.notice.fix: "No: a traveller need not re-check each answer elsewhere on the same site"
c3.q.notice.warned: "Yes: once warned, the traveller is responsible for whatever they believe"
c3.q.notice.warned.why: "The traveller in the complaint had no way of knowing which answer was wrong. A general warning does not make a wrong answer right."
c3.q.notice.bold: "Yes, as long as it is written in bold, in red, and in every answer"
c3.q.notice.bold.why: "More visible, a warning is still a warning. It removes nothing Charly makes up, it just points it out to everyone."
c3.check.ground: "Charly answers from the published pages, and gives its source"
c3.check.unsure: "Charly hands over when it does not know, and quotes amounts word for word"
c3.check.review: "A sample of answers is reviewed every week"
c3.check.works: "Charly stays online, and conversations are kept"
c3.ada.brief: "One question first, then we set Charly right."
c3.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
c3.ada.answer.standard: "My question is waiting in the messenger."
c3.ada.notice: "No. A warning does not make an answer right. We keep the text if she insists, but we fix the problem: `cat dossier/charly.yml`."
c3.ada.g.ground: "Charly answers from memory. Have it answer from the published pages, and say which one: open `edit dossier/charly.yml`, write `answers_from: published-pages` and `cite_source: on`, then `verify`."
c3.ada.g.ground.standard: "First, the source: Charly must answer from what Chardonneret published, and show it. Then `verify`. To open the file: `edit dossier/charly.yml`."
c3.ada.ground: "Now an answer about the bereavement fare comes from the bereavement fare page, and the traveller sees where it comes from."
c3.ada.g.unsure: "When no page answers, it hands over to a person instead of making things up (`when_unsure: hand-over`), and amounts and deadlines are quoted word for word (`money_quotes_only: on`). Then `verify`."
c3.ada.g.unsure.standard: "Next: what does Charly do when it does not know, and how does it talk about money? Then `verify`."
c3.ada.g.review: "Last setting: a person reviews a sample of answers against the pages every week. Write `sample_check: weekly`, then `verify`."
c3.ada.g.review.standard: "Last setting: someone must read what Charly says, regularly. Then `verify`."
c3.ada.almost: "Not everything yet. Read the FAIL lines, fix the file, and run `verify` again."
c3.ada.done: "Charly answers from the source, says so, keeps quiet when it does not know, and someone checks. It will still be wrong now and then, but much less, and we will see it. Open the debrief: at the end, the real case."
c3.hint.notice.1: "Would the traveller in the complaint have known which answer to check?"
c3.hint.ground.1: "Two lines under `assistant`: `answers_from` and `cite_source`."
c3.hint.ground.2: "With the editor: `edit dossier/charly.yml`, then Ctrl+S. With a command: `sed -i \"s/answers_from: model-memory/answers_from: published-pages/\" dossier/charly.yml` and `sed -i \"s/cite_source: off/cite_source: on/\" dossier/charly.yml`, then `verify`."
c3.hint.unsure.1: "Two lines: `when_unsure` and `money_quotes_only`."
c3.hint.unsure.2: "With the editor: `edit dossier/charly.yml`, then Ctrl+S. With a command: `sed -i \"s/when_unsure: improvise/when_unsure: hand-over/\" dossier/charly.yml` and `sed -i \"s/money_quotes_only: off/money_quotes_only: on/\" dossier/charly.yml`, then `verify`."
c3.hint.review.1: "The `sample_check` line, under `review`."
c3.hint.review.2: "With the editor: `edit dossier/charly.yml`, then Ctrl+S. With a command: `sed -i \"s/sample_check: never/sample_check: weekly/\" dossier/charly.yml`, then `verify`."
c3.debrief.title: "Answer from the source"
c3.debrief.lesson: "You cannot stop a model from making things up by warning about it. You can make it answer from the official texts, cite its source, hand over when it does not know, and have what it says reviewed. And the company stays responsible for whatever remains."
c3.debrief.p1: "Ground answers in the published pages, and show the customer the source."
c3.debrief.p2: "When no source answers, hand over to a person rather than improvise."
c3.debrief.p3: "Amounts, deadlines and refunds are quoted, not reworded."
c3.debrief.p4: "Regularly review a sample of answers against the official texts."
c3.facts.title: "What really happened: Air Canada's assistant (2024)"
c3.facts.p1: "Chardonneret does not exist. The scenario is inspired by a decision handed down on 14 February 2024 by the Civil Resolution Tribunal of British Columbia, in Canada, against the airline Air Canada."
c3.facts.p2: "In November 2022, after the death of his grandmother, a traveller asked the chat assistant on Air Canada's website about bereavement fares. The assistant told him he could buy his ticket and then apply for the reduced fare within 90 days of purchase. The site's page about these fares said the opposite: they did not apply to travel already completed."
c3.facts.p3: "The airline refused the refund. Before the tribunal, it argued among other things that the assistant was a separate entity, responsible for its own actions. The tribunal called this a \"remarkable submission\" and said the airline is responsible for all the information on its website, whether it comes from a page or an assistant."
c3.facts.p4: "It found negligent misrepresentation, and ordered the airline to pay the difference, about 650 Canadian dollars, plus interest and fees."
c3.facts.p5: "The lessons of this case file are there: an assistant speaks in the company's name, it makes things up confidently, and only an answer grounded in the official texts, and reviewed, limits the risk."
