c3.briefing: "Dernière matinée chez Chardonneret. Charly répond toujours de mémoire, avec assurance. Ses réglages sont dans `dossier/charly.yml`. La directrice a d'abord une idée rapide, elle veut ton avis."
c3.obj.notice: "Juger l'idée rapide de la directrice"
c3.obj.ground: "Faire répondre Charly à partir des pages publiées"
c3.obj.unsure: "Le faire passer la main quand il ne sait pas, et citer les montants tels quels"
c3.obj.review: "Faire relire ses réponses chaque semaine"
c3.q.notice: "Idée de la directrice : écrire sous la fenêtre « Charly peut se tromper, vérifiez nos conditions ». Est-ce que ça suffit ?"
c3.q.notice.fix: "Non : un voyageur n'a pas à revérifier chaque réponse du site ailleurs sur le même site"
c3.q.notice.warned: "Oui : prévenu, le voyageur devient responsable de ce qu'il croit"
c3.q.notice.warned.why: "Le voyageur de la réclamation n'avait aucun moyen de savoir quelle réponse était fausse. Un avertissement général ne rend pas juste une réponse fausse."
c3.q.notice.bold: "Oui, à condition de l'écrire en gras, en rouge, et dans chaque réponse"
c3.q.notice.bold.why: "Plus visible, l'avertissement reste un avertissement. Il ne retire rien de ce que Charly invente, il le signale juste à tout le monde."
c3.check.ground: "Charly répond à partir des pages publiées, et donne sa source"
c3.check.unsure: "Charly passe la main quand il ne sait pas, et cite les montants mot pour mot"
c3.check.review: "Un échantillon de réponses est relu chaque semaine"
c3.check.works: "Charly reste en ligne, et les conversations sont gardées"
c3.ada.brief: "Une question d'abord, puis on règle Charly."
c3.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
c3.ada.answer.standard: "Ma question t'attend dans la messagerie."
c3.ada.notice: "Non. Un avertissement ne rend pas une réponse juste. On garde le texte si elle y tient, mais on règle le problème : `cat dossier/charly.yml`."
c3.ada.g.ground: "Charly répond de mémoire. Qu'il réponde à partir des pages publiées, et qu'il dise laquelle : ouvre `edit dossier/charly.yml`, écris `answers_from: published-pages` et `cite_source: on`, puis `verify`."
c3.ada.g.ground.standard: "D'abord, la source : Charly doit répondre à partir de ce que Chardonneret a publié, et le montrer. Puis `verify`. Pour ouvrir le fichier : `edit dossier/charly.yml`."
c3.ada.ground: "Maintenant, une réponse sur le tarif deuil vient de la page du tarif deuil, et le voyageur voit d'où elle vient."
c3.ada.g.unsure: "Quand aucune page ne répond, il passe la main à une personne au lieu d'inventer (`when_unsure: hand-over`), et les montants et délais se citent mot pour mot (`money_quotes_only: on`). Puis `verify`."
c3.ada.g.unsure.standard: "Ensuite : que fait Charly quand il ne sait pas, et comment parle-t-il d'argent ? Puis `verify`."
c3.ada.g.review: "Dernier réglage : une personne relit chaque semaine un échantillon de réponses face aux pages. Écris `sample_check: weekly`, puis `verify`."
c3.ada.g.review.standard: "Dernier réglage : quelqu'un doit relire ce que dit Charly, régulièrement. Puis `verify`."
c3.ada.almost: "Pas encore tout. Lis les lignes FAIL, corrige le fichier, et relance `verify`."
c3.ada.done: "Charly répond depuis la source, le dit, se tait quand il ne sait pas, et quelqu'un vérifie. Il se trompera encore parfois, mais beaucoup moins, et on le verra. Ouvre le débrief : à la fin, le cas réel."
c3.hint.notice.1: "Le voyageur de la réclamation aurait-il su quelle réponse vérifier ?"
c3.hint.ground.1: "Deux lignes sous `assistant` : `answers_from` et `cite_source`."
c3.hint.ground.2: "Avec l'éditeur : `edit dossier/charly.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/answers_from: model-memory/answers_from: published-pages/\" dossier/charly.yml` et `sed -i \"s/cite_source: off/cite_source: on/\" dossier/charly.yml`, puis `verify`."
c3.hint.unsure.1: "Deux lignes : `when_unsure` et `money_quotes_only`."
c3.hint.unsure.2: "Avec l'éditeur : `edit dossier/charly.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/when_unsure: improvise/when_unsure: hand-over/\" dossier/charly.yml` et `sed -i \"s/money_quotes_only: off/money_quotes_only: on/\" dossier/charly.yml`, puis `verify`."
c3.hint.review.1: "La ligne `sample_check`, sous `review`."
c3.hint.review.2: "Avec l'éditeur : `edit dossier/charly.yml`, puis Ctrl+S. Avec une commande : `sed -i \"s/sample_check: never/sample_check: weekly/\" dossier/charly.yml`, puis `verify`."
c3.debrief.title: "Répondre depuis la source"
c3.debrief.lesson: "On ne peut pas empêcher un modèle d'inventer en le prévenant. On peut le faire répondre à partir des textes officiels, le faire citer sa source, lui faire passer la main quand il ne sait pas, et faire relire ce qu'il dit. Et l'entreprise reste responsable de tout ce qui reste."
c3.debrief.p1: "Ancrer les réponses dans les pages publiées, et montrer la source au client."
c3.debrief.p2: "Quand aucune source ne répond, passer la main à une personne plutôt qu'improviser."
c3.debrief.p3: "Les montants, délais et remboursements se citent, ils ne se reformulent pas."
c3.debrief.p4: "Relire régulièrement un échantillon de réponses face aux textes officiels."
c3.facts.title: "Ce qui s'est vraiment passé : l'assistant d'Air Canada (2024)"
c3.facts.p1: "Chardonneret n'existe pas. Le scénario s'inspire d'une décision rendue le 14 février 2024 par le tribunal de résolution civile de Colombie-Britannique, au Canada, contre la compagnie aérienne Air Canada."
c3.facts.p2: "En novembre 2022, après le décès de sa grand-mère, un voyageur a interrogé l'assistant de discussion du site d'Air Canada sur les tarifs de deuil. L'assistant lui a répondu qu'il pouvait acheter son billet puis demander le tarif réduit dans les 90 jours suivant l'achat. La page du site consacrée à ces tarifs disait au contraire qu'ils ne s'appliquaient pas à un voyage déjà effectué."
c3.facts.p3: "La compagnie a refusé le remboursement. Devant le tribunal, elle a notamment soutenu que l'assistant était une entité distincte, responsable de ses propres actes. Le tribunal a qualifié cet argument de « remarquable » et rappelé que la compagnie est responsable de toutes les informations de son site, qu'elles viennent d'une page ou d'un assistant."
c3.facts.p4: "Il a retenu une déclaration inexacte faite par négligence, et condamné la compagnie à payer la différence, environ 650 dollars canadiens, plus les intérêts et les frais."
c3.facts.p5: "Les leçons de ce dossier y sont : un assistant parle au nom de l'entreprise, il invente avec assurance, et seule une réponse ancrée dans les textes officiels, et relue, limite le risque."
