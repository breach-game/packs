id: dossiers.codecov-3-pivot
name: "Mission 3 : Le vol de secrets"
difficulty: 3
skills: [logs, analysis]
requires: dossiers.pinson-world
debrief:
  title: "Les variables d'environnement, une mine d'or"
  lesson: "Les CI manipulent souvent des clés API très sensibles. Une fois le build compromis, ces secrets sont exposés."
  points:
    - "Ne jamais exposer de secrets sensibles dans les logs de build."
    - "Rotation des secrets après chaque incident suspect."
