h2.briefing: "Second day at Hirondelle. A link is a document number written in base64, and numbers follow each other. The mandate names one file you may open that is not yours: the witness file. You have its number, on paper. Nobody will give you its link: write it."
h2.obj.witness: "Open the witness file with a link you wrote yourself"
h2.obj.marker: "Send the witness marker (`submit`)"
h2.obj.what: "Say what was missing"
h2.q.what: "You read a file that is not yours. What was missing on the portal?"
h2.q.what.check: "A check, on the server, that the document belongs to whoever asks"
h2.q.what.longer: "A much longer number, which would take far more tries to reach"
h2.q.what.longer.why: "You needed one try, not a thousand: you knew the number. And a counter of any length is still a counter."
h2.q.what.cipher: "A real encryption of the link, instead of an encoding anyone reverses"
h2.q.what.cipher.why: "A better disguise on the same door. A link that is forwarded, or left in a browser history, would still open the file for whoever finds it."
h2.ada.brief: "Today I mostly watch. Everything you need is on your workstation: the email, the mandate, and what you learned yesterday. One rule: the witness file, and no other."
h2.ada.g.witness: "The number of the witness file is in the mandate: `cat mandate/HR-2027-010.txt`."
h2.ada.g.witness.standard: "Find the number of the witness file, then write its link the way the portal writes them."
h2.ada.encode: "Number 000048207. Write it in the portal's alphabet: `echo -n 000048207 | base64`, then `curl https://docs.hirondelle.test/d/` followed by what comes out."
h2.ada.encode.standard: "You have the number. Yesterday you went from a link to a number: go the other way."
h2.ada.raw: "The portal does not take the bare number. Encode it first: `echo -n 000048207 | base64`."
h2.ada.raw.standard: "The portal does not take the bare number: links carry it encoded."
h2.ada.newline: "Read the error: ten characters. `echo` adds an invisible end of line, and you encoded it with the rest. Use `echo -n 000048207 | base64`."
h2.ada.newline.standard: "Read the error: ten characters for a nine-digit number. Something invisible got encoded with it."
h2.ada.other: "Stop. That file belongs to another tenant. On this copy it is empty; on the real portal you would have read three pay slips. The mandate names one file. Go back to it."
h2.ada.other2: "Another tenant again. Counting down from your own number proves the point, and it is exactly what we promised not to do."
h2.ada.witness: "The witness file: identity papers and bank details, served to a stranger who asked politely. The marker is in it."
h2.ada.g.marker: "Send me the marker of the witness file with `submit`."
h2.ada.g.marker.standard: "Send me the marker with `submit`."
h2.ada.flag: "Proof made, with one request. No tool, no password, nothing broken. One question for the report."
h2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
h2.ada.answer.standard: "Answer my question."
h2.ada.what: "Yes. The portal answers the question \"which document?\" and never the question \"for whom?\". Everything else is decoration on that gap."
h2.ada.done: "Eleven thousand homes, and every file one number away from the next. Open the debrief. Tomorrow we close it, and we look at why nobody did before."
h2.soc.other: "Document of another tenant opened from an address that is not theirs (nothing checks it)"
h2.soc.witness: "Witness file opened with a link that was never sent to anyone"
h2.hint.witness.1: "The mandate gives the number of the witness document. Type `cat mandate/HR-2027-010.txt`."
h2.hint.witness.2: "`base64 -d` decodes; without `-d` it encodes. Type `echo -n 000048207 | base64`: the `-n` keeps `echo` from adding an end of line."
h2.hint.witness.3: "Type `curl https://docs.hirondelle.test/d/MDAwMDQ4MjA3`."
h2.hint.marker.1: "Copy the `FLAG{...}` from the witness file and type `submit` followed by it."
h2.hint.what.1: "Which answer still holds on the day a tenant forwards their email to the wrong person?"
h2.debrief.title: "Which document, but never for whom"
h2.debrief.lesson: "You attacked nothing. You asked for a document by its number, and the server gave it, because it only ever checks that the document exists. This is the most common flaw on the web: the reference to an object is in the visitor's hands, and nobody checks that the object is theirs."
h2.debrief.p1: "Broken access control: the server identifies the object, and forgets to check the right of the person asking."
h2.debrief.p2: "Hiding or disguising the identifier slows a curious person down. It does not replace the check."
h2.debrief.p3: "In a test, the proof is one witness file. Reading real people's papers to \"prove more\" is no longer a test."
