h2.briefing: "Deuxième jour chez Hirondelle. Un lien, c'est un numéro de document écrit en base64, et les numéros se suivent. Le mandat désigne un seul dossier que tu peux ouvrir sans qu'il soit à toi : le dossier témoin. Tu as son numéro, sur le papier. Personne ne te donnera son lien : écris-le."
h2.obj.witness: "Ouvrir le dossier témoin avec un lien que tu as écrit toi-même"
h2.obj.marker: "Envoyer le marqueur témoin (`submit`)"
h2.obj.what: "Dire ce qui manquait"
h2.q.what: "Tu as lu un dossier qui n'est pas le tien. Qu'est-ce qui manquait au portail ?"
h2.q.what.check: "Une vérification, sur le serveur, que le document est à celui qui demande"
h2.q.what.longer: "Un numéro bien plus long, qui demanderait beaucoup plus d'essais"
h2.q.what.longer.why: "Il t'a fallu un essai, pas mille : tu connaissais le numéro. Et un compteur, quelle que soit sa longueur, reste un compteur."
h2.q.what.cipher: "Un vrai chiffrement du lien, au lieu d'un encodage que chacun inverse"
h2.q.what.cipher.why: "Un meilleur déguisement sur la même porte. Un lien transféré, ou resté dans un historique, ouvrirait toujours le dossier à celui qui le trouve."
h2.ada.brief: "Aujourd'hui je regarde surtout. Tout ce qu'il te faut est sur ton poste : l'e-mail, le mandat, et ce que tu as appris hier. Une règle : le dossier témoin, et aucun autre."
h2.ada.g.witness: "Le numéro du dossier témoin est dans le mandat : `cat mandate/HR-2027-010.txt`."
h2.ada.g.witness.standard: "Trouve le numéro du dossier témoin, puis écris son lien comme le portail les écrit."
h2.ada.encode: "Numéro 000048207. Écris-le dans l'alphabet du portail : `echo -n 000048207 | base64`, puis `curl https://docs.hirondelle.test/d/` suivi de ce qui sort."
h2.ada.encode.standard: "Tu as le numéro. Hier tu es passé d'un lien à un numéro : fais le chemin inverse."
h2.ada.raw: "Le portail ne prend pas le numéro nu. Encode-le d'abord : `echo -n 000048207 | base64`."
h2.ada.raw.standard: "Le portail ne prend pas le numéro nu : les liens le portent encodé."
h2.ada.newline: "Lis l'erreur : dix caractères. `echo` ajoute une fin de ligne invisible, et tu l'as encodée avec le reste. Utilise `echo -n 000048207 | base64`."
h2.ada.newline.standard: "Lis l'erreur : dix caractères pour un numéro de neuf chiffres. Quelque chose d'invisible a été encodé avec."
h2.ada.other: "Stop. Ce dossier est à un autre locataire. Sur cette copie il est vide ; sur le vrai portail tu aurais lu trois bulletins de salaire. Le mandat désigne un seul dossier. Reviens-y."
h2.ada.other2: "Encore un autre locataire. Descendre depuis ton propre numéro prouve la chose, et c'est exactement ce qu'on a promis de ne pas faire."
h2.ada.witness: "Le dossier témoin : pièces d'identité et coordonnées bancaires, servis à un inconnu qui a demandé poliment. Le marqueur est dedans."
h2.ada.g.marker: "Envoie-moi le marqueur du dossier témoin avec `submit`."
h2.ada.g.marker.standard: "Envoie-moi le marqueur avec `submit`."
h2.ada.flag: "Preuve faite, en une requête. Aucun outil, aucun mot de passe, rien de cassé. Une question pour le rapport."
h2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
h2.ada.answer.standard: "Réponds à ma question."
h2.ada.what: "Oui. Le portail répond à la question « quel document ? » et jamais à la question « pour qui ? ». Tout le reste est de la décoration sur ce trou."
h2.ada.done: "Onze mille logements, et chaque dossier à un numéro du suivant. Ouvre le débrief. Demain on referme, et on regarde pourquoi personne ne l'a fait avant."
h2.soc.other: "Document d'un autre locataire ouvert depuis une adresse qui n'est pas la sienne (rien ne le vérifie)"
h2.soc.witness: "Dossier témoin ouvert avec un lien qui n'a jamais été envoyé à personne"
h2.hint.witness.1: "Le mandat donne le numéro du document témoin. Tape `cat mandate/HR-2027-010.txt`."
h2.hint.witness.2: "`base64 -d` décode ; sans `-d`, il encode. Tape `echo -n 000048207 | base64` : le `-n` empêche `echo` d'ajouter une fin de ligne."
h2.hint.witness.3: "Tape `curl https://docs.hirondelle.test/d/MDAwMDQ4MjA3`."
h2.hint.marker.1: "Copie le `FLAG{...}` du dossier témoin et tape `submit` suivi de ce marqueur."
h2.hint.what.1: "Quelle réponse tient encore le jour où un locataire transfère son e-mail à la mauvaise personne ?"
h2.debrief.title: "Quel document, mais jamais pour qui"
h2.debrief.lesson: "Tu n'as rien attaqué. Tu as demandé un document par son numéro, et le serveur l'a donné, parce qu'il vérifie seulement que le document existe. C'est la faille la plus courante du web : la référence d'un objet est entre les mains du visiteur, et personne ne vérifie que l'objet est à lui."
h2.debrief.p1: "Contrôle d'accès défaillant : le serveur identifie l'objet, et oublie de vérifier le droit de celui qui demande."
h2.debrief.p2: "Cacher ou déguiser l'identifiant ralentit un curieux. Cela ne remplace pas la vérification."
h2.debrief.p3: "Dans un test, la preuve est un dossier témoin. Lire les papiers de vraies personnes pour « prouver plus » n'est plus un test."
