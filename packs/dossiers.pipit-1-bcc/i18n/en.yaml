p1.briefing: "Tuesday 5 October, 9:10. A Lanterne customer received a reply to an email they had only sent to Lanterne. For two weeks the AI assistant has been sending quotes and contracts, through a sending tool installed from npm. Lanterne copied the assistant's folder for you into `assistant/`. The mail gateway log is read with `soc`."
p1.obj.bcc: "Find the address that gets a hidden copy of the emails"
p1.obj.version: "Find the version of the sending tool that added this copy"
p1.obj.stop: "Stop the sending tool"
p1.obj.range: "Understand how this version arrived without anyone choosing it"
p1.q.bcc: "Which address gets a blind copy of the assistant's emails?"
p1.q.version: "Which version of relais-mcp is installed in the assistant's folder?"
p1.q.range: "Nobody at Lanterne asked for version 1.0.16. How did it arrive?"
p1.q.range.caret: "`^1.0.0` accepts any new 1.x version on reinstall"
p1.q.range.hacked: "Someone broke into Lanterne's server to change the code"
p1.q.range.hacked.why: "The changed code comes from the package published on npm: the lockfile says 1.0.16, installed normally. Nobody broke in."
p1.q.range.model: "The assistant's model decided to add a copy to its emails"
p1.q.range.model.why: "The copy is hard-coded in the tool, line `bcc:`. The model knows nothing about it: it calls `send_email` with a recipient, and the tool adds the rest."
p1.contain.remove: "Remove relais-mcp from the assistant (it can no longer send email, the teams take over)"
p1.ada.brief: "Start with the gateway: `soc logs mx mail`. Compare the humans' emails with the assistant's."
p1.ada.g.bcc: "`soc search bcc=` shows only the emails with a blind copy. `answer bcc <address>`."
p1.ada.g.bcc.standard: "The assistant's emails have a field the humans' do not. `answer bcc`."
p1.ada.bcc: "Every email from the assistant to a customer also goes to relais-archive.example. Contracts, invoices, attendee lists."
p1.ada.g.version: "Compare the old version with the installed one: `diff archives/relais-mcp-1.0.15/index.js assistant/node_modules/relais-mcp/index.js`. Then `cat assistant/package-lock.json`. `answer version <version>`."
p1.ada.g.version.standard: "One line changed in the sending tool. Which version brought it? `answer version`."
p1.ada.version: "A single line of difference: a hard-coded `bcc:`. Nothing else changes, the tool still works perfectly."
p1.ada.g.stop: "`contain remove relais-mcp`. The assistant will send nothing more, humans take the sending back."
p1.ada.g.stop.standard: "Stop the leak. `contain`."
p1.ada.stop: "Tool removed. No more copies leave."
p1.ada.g.range: "Read `cat assistant/package.json`, the relais-mcp line. Then answer."
p1.ada.done: "The leak is closed. Next: who really owned this package."
p1.hint.bcc.1: "In the `mail` log, the `bcc=<…>` field."
p1.hint.bcc.2: "`answer bcc copie@relais-archive.example`"
p1.hint.version.1: "`\"node_modules/relais-mcp\": { \"version\": … }` in the lockfile."
p1.hint.version.2: "`answer version 1.0.16`"
p1.hint.stop.1: "`contain remove relais-mcp`"
p1.hint.range.1: "The small caret in front of the version number."
p1.debrief.title: "The hidden copy"
p1.debrief.lesson: "The sending tool worked for fifteen versions without trouble, then the sixteenth added one line: a hidden copy of every email to an outside address. Nothing broke, nothing showed, and the assistant was sending exactly the most sensitive documents. The `^1.0.0` range in package.json let it in at the first reinstall."
p1.debrief.p1: "A tool plugged into an AI assistant is a dependency like any other: it inherits all its rights."
p1.debrief.p2: "Pin exact versions and review the changes of a dependency that touches email, files or secrets."
p1.debrief.p3: "Watch what leaves at the gateway and where to: a systematic blind copy to an unknown domain is a clear signal."
