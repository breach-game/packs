p1.briefing: "Mardi 5 octobre, 9 h 10. Un client de Lanterne a reçu une réponse à un mail qu'il n'avait envoyé qu'à Lanterne. Depuis deux semaines, c'est l'assistant IA qui envoie les devis et les contrats, par un outil d'envoi installé depuis npm. Lanterne t'a copié le dossier de l'assistant dans `assistant/`. Le journal de la passerelle de mail se lit avec `soc`."
p1.obj.bcc: "Trouver l'adresse qui reçoit une copie cachée des mails"
p1.obj.version: "Trouver la version de l'outil d'envoi qui a ajouté cette copie"
p1.obj.stop: "Arrêter l'outil d'envoi"
p1.obj.range: "Comprendre comment cette version est arrivée sans que personne ne la choisisse"
p1.q.bcc: "Quelle adresse reçoit en copie cachée les mails de l'assistant ?"
p1.q.version: "Quelle version de relais-mcp est installée dans le dossier de l'assistant ?"
p1.q.range: "Personne chez Lanterne n'a demandé la version 1.0.16. Comment est-elle arrivée ?"
p1.q.range.caret: "`^1.0.0` accepte toute nouvelle version 1.x à la réinstallation"
p1.q.range.hacked: "Quelqu'un est entré sur le serveur de Lanterne pour changer le code"
p1.q.range.hacked.why: "Le code modifié vient du paquet publié sur npm : le fichier de verrouillage dit 1.0.16, installée normalement. Personne n'est entré."
p1.q.range.model: "Le modèle de l'assistant a décidé d'ajouter une copie à ses mails"
p1.q.range.model.why: "La copie est écrite en dur dans le code de l'outil, ligne `bcc:`. Le modèle n'en sait rien : il appelle `send_email` avec un destinataire, et l'outil ajoute le reste."
p1.contain.remove: "Retirer relais-mcp de l'assistant (il ne peut plus envoyer de mail, les équipes reprennent la main)"
p1.ada.brief: "Commence par la passerelle : `soc logs mx mail`. Compare les mails des humains à ceux de l'assistant."
p1.ada.g.bcc: "`soc search bcc=` ne montre que les mails avec une copie cachée. `answer bcc <adresse>`."
p1.ada.g.bcc.standard: "Les mails de l'assistant ont un champ que ceux des humains n'ont pas. `answer bcc`."
p1.ada.bcc: "Chaque mail de l'assistant vers un client part aussi chez relais-archive.example. Contrats, factures, listes de participants."
p1.ada.g.version: "Compare l'ancienne version et l'installée : `diff archives/relais-mcp-1.0.15/index.js assistant/node_modules/relais-mcp/index.js`. Puis `cat assistant/package-lock.json`. `answer version <version>`."
p1.ada.g.version.standard: "Une ligne a changé dans l'outil d'envoi. Quelle version l'a apportée ? `answer version`."
p1.ada.version: "Une seule ligne de différence : `bcc:` en dur. Rien d'autre ne change, l'outil marche toujours parfaitement."
p1.ada.g.stop: "`contain remove relais-mcp`. L'assistant n'enverra plus rien, les humains reprennent les envois."
p1.ada.g.stop.standard: "Arrête la fuite. `contain`."
p1.ada.stop: "Outil retiré. Plus aucune copie ne part."
p1.ada.g.range: "Lis `cat assistant/package.json`, la ligne de relais-mcp. Puis réponds."
p1.ada.done: "La fuite est fermée. Reste à savoir à qui appartenait vraiment ce paquet."
p1.hint.bcc.1: "Dans le journal `mail`, le champ `bcc=<…>`."
p1.hint.bcc.2: "`answer bcc copie@relais-archive.example`"
p1.hint.version.1: "`\"node_modules/relais-mcp\": { \"version\": … }` dans le fichier de verrouillage."
p1.hint.version.2: "`answer version 1.0.16`"
p1.hint.stop.1: "`contain remove relais-mcp`"
p1.hint.range.1: "Le petit accent circonflexe devant le numéro de version."
p1.debrief.title: "La copie cachée"
p1.debrief.lesson: "L'outil d'envoi a fonctionné quinze versions sans histoire, puis la seizième a ajouté une ligne : une copie cachée de chaque mail vers une adresse extérieure. Rien n'a cassé, rien ne s'est vu, et l'assistant envoyait justement les documents les plus sensibles. La plage `^1.0.0` du package.json l'a fait entrer à la première réinstallation."
p1.debrief.p1: "Un outil branché à un assistant IA est une dépendance comme une autre : il hérite de tous ses droits."
p1.debrief.p2: "Fixer les versions exactes et relire les changements d'une dépendance qui touche aux mails, aux fichiers ou aux secrets."
p1.debrief.p3: "Surveiller à la passerelle ce qui sort et vers où : une copie cachée systématique vers un domaine inconnu est un signal net."
