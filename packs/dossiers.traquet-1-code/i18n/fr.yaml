q1.briefing: "Jeudi 11 février, 10 h 05. Sofia, chargée d'accompagnement chez Passerelle, a reçu ce matin une invitation d'un « journaliste » pour une visio. Elle a tapé le code demandé, la visio n'a jamais commencé. Elle t'a confié son téléphone : `sms`. Le journal du fournisseur d'identité se lit avec `soc`."
q1.obj.link: "Lire l'invitation et dire quelle page elle fait ouvrir"
q1.obj.account: "Trouver dans le journal la connexion ouverte avec le code"
q1.obj.revoke: "Fermer les sessions du compte"
q1.obj.mfa: "Dire pourquoi le second facteur n'a rien arrêté"
q1.q.link: "Quel site le lien de l'invitation ouvre-t-il ?"
q1.q.account: "Quel compte s'est connecté par le flux `device_code` depuis une adresse extérieure ?"
q1.q.mfa: "Le compte de Sofia a un second facteur, et il est noté « satisfied ». Pourquoi n'a-t-il rien arrêté ?"
q1.q.mfa.herself: "Sofia l'a validé elle-même, pour l'appareil de l'attaquant"
q1.q.mfa.stolen: "L'attaquant a volé son téléphone pour recevoir les codes"
q1.q.mfa.stolen.why: "Sofia a toujours son téléphone. Le code n'était pas un code de second facteur : c'était celui de l'appareil de l'attaquant, qu'elle a tapé."
q1.q.mfa.fake: "La page de connexion était une copie de la vraie page"
q1.q.mfa.fake.why: "Le lien ouvre connexion.passerelle.test, la vraie page. C'est tout le piège : rien ne paraît faux."
q1.sms.bank: "Banque Ruisseau : votre relevé de janvier est disponible dans votre espace."
q1.sms.invite: "Bonjour Sofia, je suis journaliste à Radio Méridien, on s'était écrit la semaine dernière. Je vous propose notre entretien sur Visio maintenant. Pour rejoindre, ouvrez https://connexion.passerelle.test/device et saisissez le code KX7-PQ2M. À tout de suite !"
q1.sms.thanks: "Merci ! La salle met un peu de temps à s'ouvrir, je reviens vers vous."
q1.contain.revoke: "Révoquer toutes les sessions et les jetons du compte s.benali, puis changer son mot de passe (Sofia se reconnecte partout)"
q1.ada.brief: "Lis les messages : `sms`, puis l'invitation : `sms invite`."
q1.ada.g.link: "`sms invite` affiche le message et le site que le lien ouvre. `answer link <site>`."
q1.ada.g.link.standard: "Où mène le lien de l'invitation ? `answer link`."
q1.ada.link: "La vraie page de Passerelle. Celle qui sert à connecter une télé de salle de réunion à un compte : on tape le code affiché par l'appareil."
q1.ada.g.account: "`soc logs idp signin`, puis `soc search device_code`. Les salles de réunion l'utilisent depuis l'intérieur. Qui d'autre ? `answer account <compte>`."
q1.ada.g.account.standard: "Trouve la connexion par code d'appareil qui ne vient pas d'une salle. `answer account`."
q1.ada.account: "s.benali, flux device_code, depuis 203.0.113.71, deux minutes après l'invitation. Avec le droit de lire les mails et les fichiers, et de rester connecté."
q1.ada.g.revoke: "`contain revoke s.benali`. Le jeton de rafraîchissement compte : changer le mot de passe seul ne le révoque pas."
q1.ada.g.revoke.standard: "Ferme tout ce que ce code a ouvert. `contain`."
q1.ada.revoke: "Sessions et jetons révoqués. Les requêtes suivantes de 203.0.113.71 sont refusées."
q1.ada.g.mfa: "Réponds dans la messagerie ou avec `answer <option>`."
q1.ada.done: "Accès fermé. Il a lu une boîte de réception pendant quelques minutes : Passerelle préviendra les personnes concernées. Reste à voir venir le prochain."
q1.hint.link.1: "`sms invite` : « ce lien ouvre connexion.passerelle.test »."
q1.hint.link.2: "`answer link connexion.passerelle.test`"
q1.hint.account.1: "Les comptes salle-agora et salle-forum se connectent depuis 10.121.0.80 et .81. Un autre vient de l'extérieur."
q1.hint.account.2: "`answer account s.benali`"
q1.hint.revoke.1: "`contain revoke s.benali`"
q1.hint.mfa.1: "Qui a tapé le code, et sur quelle page ?"
q1.debrief.title: "Le code de la réunion"
q1.debrief.lesson: "Le flux « code d'appareil » sert à connecter une télé ou une imprimante qui n'a pas de clavier : l'appareil affiche un code, on le tape sur la vraie page avec son compte. Ici, l'appareil était celui de l'attaquant, et le code est arrivé par message. Sofia a fait exactement ce que la page demandait, second facteur compris, et l'attaquant a reçu une session valide, avec un jeton pour revenir."
q1.debrief.p1: "Ne jamais taper un code qu'on n'a pas vu s'afficher sur son propre appareil."
q1.debrief.p2: "Après une connexion douteuse, révoquer les sessions et les jetons, pas seulement le mot de passe."
q1.debrief.p3: "Le second facteur protège contre un mot de passe volé, pas contre une connexion que l'on valide soi-même."
