q1.briefing: "Thursday 11 February, 10:05. Sofia, a support officer at Passerelle, got an invitation this morning from a \"journalist\" for a video call. She typed the code she was asked for, the call never started. She handed you her phone: `sms`. The identity provider's log is read with `soc`."
q1.obj.link: "Read the invitation and say which page it opens"
q1.obj.account: "Find in the log the session opened with the code"
q1.obj.revoke: "Close the account's sessions"
q1.obj.mfa: "Say why the second factor stopped nothing"
q1.q.link: "Which site does the invitation's link open?"
q1.q.account: "Which account signed in through the `device_code` flow from an outside address?"
q1.q.mfa: "Sofia's account has a second factor, and it is marked \"satisfied\". Why did it stop nothing?"
q1.q.mfa.herself: "Sofia approved it herself, for the attacker's device"
q1.q.mfa.stolen: "The attacker stole her phone to receive the code"
q1.q.mfa.stolen.why: "Sofia still has her phone. The code was not a second factor code: it was the attacker's device code, which she typed."
q1.q.mfa.fake: "The sign-in page was a copy of the real one, on another site"
q1.q.mfa.fake.why: "The link opens connexion.passerelle.test, the real page. That is the whole trap: nothing looks fake."
q1.sms.bank: "Banque Ruisseau: your January statement is available in your space."
q1.sms.invite: "Hello Sofia, I am a journalist at Radio Méridien, we wrote to each other last week. Shall we do our interview on Visio now? To join, open https://connexion.passerelle.test/device and enter the code KX7-PQ2M. See you in a minute!"
q1.sms.thanks: "Thanks! The room takes a while to open, I will get back to you."
q1.contain.revoke: "Revoke every session and token of account s.benali, then change her password (Sofia signs in again everywhere)"
q1.ada.brief: "Read the messages: `sms`, then the invitation: `sms invite`."
q1.ada.g.link: "`sms invite` shows the message and the site the link opens. `answer link <site>`."
q1.ada.g.link.standard: "Where does the invitation's link lead? `answer link`."
q1.ada.link: "Passerelle's real page. The one used to connect a meeting room TV to an account: you type the code the device shows."
q1.ada.g.account: "`soc logs idp signin`, then `soc search device_code`. Meeting rooms use it from inside. Who else? `answer account <account>`."
q1.ada.g.account.standard: "Find the device code sign-in that does not come from a room. `answer account`."
q1.ada.account: "s.benali, device_code flow, from 203.0.113.71, two minutes after the invitation. With the right to read mail and files, and to stay signed in."
q1.ada.g.revoke: "`contain revoke s.benali`. The refresh token matters: changing the password alone does not revoke it."
q1.ada.g.revoke.standard: "Close everything this code opened. `contain`."
q1.ada.revoke: "Sessions and tokens revoked. The next requests from 203.0.113.71 are refused."
q1.ada.g.mfa: "Answer in the messenger or with `answer <option>`."
q1.ada.done: "Access closed. It read an inbox for a few minutes: Passerelle will warn the people concerned. Now to see the next one coming."
q1.hint.link.1: "`sms invite`: \"this link opens connexion.passerelle.test\"."
q1.hint.link.2: "`answer link connexion.passerelle.test`"
q1.hint.account.1: "Accounts salle-agora and salle-forum sign in from 10.121.0.80 and .81. Another one comes from outside."
q1.hint.account.2: "`answer account s.benali`"
q1.hint.revoke.1: "`contain revoke s.benali`"
q1.hint.mfa.1: "Who typed the code, and on which page?"
q1.debrief.title: "The meeting's code"
q1.debrief.lesson: "The device code flow exists to connect a TV or printer that has no keyboard: the device shows a code, you type it on the real page with your account. Here the device was the attacker's, and the code came by message. Sofia did exactly what the page asked, second factor included, and the attacker received a valid session, with a token to come back."
q1.debrief.p1: "Never type a code you did not see appear on your own device."
q1.debrief.p2: "After a doubtful sign-in, revoke sessions and tokens, not just the password."
q1.debrief.p3: "A second factor protects against a stolen password, not against a sign-in you approve yourself."
