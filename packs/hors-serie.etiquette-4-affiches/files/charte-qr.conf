# Brumevaux - charter for the QR codes the town prints (draft, communication department)
# One setting per line. Fix the values, then run `verify`.
#
# link_domain           where every printed code leads: any | www.brumevaux.test
# shortener             third-party link shorteners: allowed | forbidden
# print_url_under_code  the address is printed in clear under the code: no | yes
# domain_renewal        the town's own domains: manual | auto

link_domain: any
shortener: allowed
print_url_under_code: no
domain_renewal: manual
