e4.briefing: "Jeudi matin, dernier jour du mandat. Une habitante a écrit à la mairie par le formulaire de contact (`message-habitante.txt`) : elle a scanné l'affiche de la médiathèque et est tombée sur une page de jeu concours. Aucune étiquette sur l'affiche. Le service communication a envoyé l'inventaire de ses affiches (`com/inventaire.csv`), une photo de chacune dans `affiches/` et le brouillon de sa charte des QR codes (`com/charte-qr.conf`)."
e4.obj.read: "Lire le code de l'affiche de la médiathèque sans l'ouvrir"
e4.obj.owner: "Trouver qui détient le domaine aujourd'hui"
e4.obj.why: "Dire pourquoi les codes de la mairie sont devenus dangereux"
e4.obj.copies: "Compter les exemplaires imprimés concernés"
e4.obj.charter: "Corriger la charte des QR codes de la mairie"
e4.obj.fix: "Décider quoi faire des affiches déjà posées"
e4.ada.brief: "Même règle que lundi : on lit les codes, on ne les suit jamais. Et cette fois, le code a été imprimé par la mairie elle-même."
e4.ada.g.read: "Lis le message, `cat message-habitante.txt`, puis le code de l'affiche de la médiathèque : `qr decode affiches/A3.png`."
e4.ada.g.read.standard: "Lis le message de l'habitante, puis le code de l'affiche de la médiathèque, sans l'ouvrir."
e4.ada.message: "La médiathèque, c'est l'affiche A3 de l'inventaire. Lis son code : `qr decode affiches/A3.png`."
e4.ada.message.standard: "Trouve l'affiche de la médiathèque dans `affiches/` et lis son code."
e4.ada.read: "Pas `brumevaux.test` : `go.vallon-liens.example`, un raccourcisseur de liens. Le service communication s'en servait en 2028 pour avoir des codes courts. Qui répond à cette adresse aujourd'hui ?"
e4.ada.g.owner: "Cherche le domaine dans le registre public : `whois vallon-liens.example`."
e4.ada.g.owner.standard: "Trouve qui détient aujourd'hui le domaine du raccourcisseur, par une recherche publique."
e4.ada.owner: "Lis les dates. Supprimé le 19 août, réenregistré le 3 septembre par un titulaire qui cache son nom, serveurs de noms d'une société de pages parking. Réponds à ma question."
e4.ada.why: "Exactement. Le code contient un nom, et le nom a changé de mains. Personne n'a eu besoin de toucher aux affiches."
e4.ada.g.copies: "L'inventaire donne les exemplaires imprimés de chaque affiche : `cat com/inventaire.csv`. Lis toutes les affiches, `zbarimg affiches/A1.png affiches/A2.png affiches/A3.png affiches/A4.png affiches/A5.png`, et additionne les exemplaires de celles qui passent par le raccourcisseur. Réponds avec `answer copies <nombre>`."
e4.ada.g.copies.standard: "Trouve les affiches qui passent par le raccourcisseur et additionne leurs exemplaires imprimés. Réponds avec `answer copies`."
e4.ada.copies: "A1, A3 et A5 : 830 exemplaires en ville. Maintenant la charte, pour que ça n'arrive plus."
e4.ada.g.charter: "Ouvre la charte, `edit com/charte-qr.conf` (ou `sed -i`), et choisis pour chaque ligne la valeur qui garde la main à la mairie. Puis `verify`."
e4.ada.g.charter.standard: "Corrige les quatre lignes de `com/charte-qr.conf`, puis `verify`. Pour ouvrir le fichier : `edit com/charte-qr.conf`."
e4.ada.charter: "Des codes qui mènent au nom de la mairie, aucun tiers au milieu, l'adresse imprimée dessous pour que chacun vérifie, et des domaines qui n'expirent jamais par mégarde. Reste les affiches déjà posées : réponds à ma question."
e4.ada.answer: "Réponds à ma question : clique, ou utilise `answer` dans le terminal."
e4.ada.answer.standard: "Ma question t'attend dans la messagerie."
e4.ada.fix.cover: "Les agents collent cet après-midi l'étiquette de la mairie sur les trois codes : un nouveau code vers `www.brumevaux.test`, avec l'adresse écrite en clair. Une étiquette annoncée aux habitants, contrairement à celles de lundi."
e4.ada.fix.reprint: "830 affiches réimprimées. Propre, mais il faut une semaine et un budget, et en attendant les anciens codes restent en place."
e4.ada.fix.remove: "Les affiches tombent aujourd'hui. Plus rien à scanner, mais le festival, la médiathèque et la déchetterie perdent leurs affiches jusqu'à la réimpression."
e4.ada.done: "Quatre missions, quatre façons dont un QR code trompe : une étiquette, un colis, un mail, et nos propres liens oubliés. La mairie sait les lire maintenant. Débrief."
e4.q.copies: "Combien d'exemplaires imprimés portent un code qui passe par le raccourcisseur ? (un nombre)"
e4.q.why: "Pourquoi les affiches de la mairie mènent-elles maintenant à une arnaque ?"
e4.q.why.owner: "Le domaine du raccourcisseur a été supprimé puis racheté : qui le détient décide où mène chaque code."
e4.q.why.cipher: "Les liens du raccourcisseur ne sont pas chiffrés, donc n'importe qui sur le réseau peut changer leur destination."
e4.q.why.cipher.why: "Les liens commencent par https. Personne ne les a changés en route : c'est le domaine lui-même qui appartient à quelqu'un d'autre."
e4.q.why.age: "Les codes imprimés en 2028 sont trop vieux : un QR code ne marche plus bien au bout d'un an."
e4.q.why.age.why: "Un QR code n'expire jamais : c'est du texte imprimé. Ce qui a changé, c'est qui répond à l'adresse qu'il contient."
e4.q.fix: "Que fait la mairie des affiches déjà posées ?"
e4.q.fix.cover: "Coller l'étiquette de la mairie avec un nouveau code et l'adresse en clair, puis l'annoncer."
e4.q.fix.reprint: "Réimprimer les 830 affiches avec de nouveaux codes et les remplacer en une semaine."
e4.q.fix.remove: "Retirer partout les trois affiches dès aujourd'hui, jusqu'à la réimpression."
e4.check.domain: "Chaque code imprimé mène à www.brumevaux.test"
e4.check.shortener: "Les raccourcisseurs de liens tiers sont interdits"
e4.check.url: "L'adresse est imprimée en clair sous chaque code"
e4.check.renewal: "Les domaines de la mairie se renouvellent seuls"
e4.hint.read.1: "`qr decode affiches/A3.png` lit le code et dit quel site il ouvrirait."
e4.hint.read.2: "L'affiche de la médiathèque est A3 dans `com/inventaire.csv`."
e4.hint.owner.1: "`whois vallon-liens.example` : lis la date de création et l'avis à la fin."
e4.hint.why.1: "Personne n'a touché aux affiches. Qu'est-ce qui a changé entre 2028 et aujourd'hui ?"
e4.hint.copies.1: "`zbarimg` prend plusieurs images : A1, A3 et A5 ouvrent `go.vallon-liens.example`."
e4.hint.copies.2: "400 + 250 + 180 : `answer copies 830`."
e4.hint.charter.1: "Chaque ligne de la charte a ses valeurs possibles dans le commentaire du haut."
e4.hint.charter.2: "`www.brumevaux.test`, `forbidden`, `yes`, `auto`. Par exemple : `sed -i 's/shortener: allowed/shortener: forbidden/' com/charte-qr.conf`, puis `verify`. Ou à la main, dans l'éditeur : `edit com/charte-qr.conf`, puis Ctrl+S."
e4.debrief.title: "Un code contient un nom"
e4.debrief.lesson: "Un QR code imprimé ne change plus, mais le nom qu'il contient peut changer de mains. Un raccourcisseur de liens, un service de « codes dynamiques », un domaine pas renouvelé : chacun est un tiers qui décide, pendant des années, où mènent tes affiches. La parade : des codes qui pointent vers ton propre domaine, l'adresse imprimée sous le code, et des domaines qui n'expirent jamais."
e4.debrief.p1: "Quand un raccourcisseur ferme ou qu'un domaine expire, n'importe qui peut réenregistrer le nom et hériter de tous les codes déjà imprimés."
e4.debrief.p2: "L'adresse imprimée sous le code permet à chacun de vérifier avant de scanner, et rend visible un code remplacé."
e4.debrief.p3: "Une étiquette collée par la mairie n'inspire confiance que si la mairie l'annonce : sinon elle ressemble trait pour trait à celle d'un escroc."
e4.home.p1: "Si tu imprimes des QR codes (association, commerce, mariage), fais-les pointer vers une adresse que tu contrôles, jamais vers un raccourcisseur gratuit ou un compte d'essai."
e4.home.p2: "Imprime l'adresse en clair sous le code, pour que chacun puisse la vérifier."
e4.home.p3: "Active le renouvellement automatique de tes noms de domaine, et note quand ils expirent."
