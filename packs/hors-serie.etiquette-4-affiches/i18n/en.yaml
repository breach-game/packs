e4.briefing: "Thursday morning, last day of the mandate. A resident wrote to the town through the contact form (`message-habitante.txt`): she scanned the library poster and got a prize page. There is no sticker on the poster. The communication department sent the inventory of its posters (`com/inventaire.csv`), photos of each one in `affiches/`, and the draft of its QR code charter (`com/charte-qr.conf`)."
e4.obj.read: "Read the library poster's code without opening it"
e4.obj.owner: "Find out who holds the domain now"
e4.obj.why: "Say why the town's own codes became dangerous"
e4.obj.copies: "Count the printed copies concerned"
e4.obj.charter: "Fix the town's QR code charter"
e4.obj.fix: "Decide what to do with the posters already up"
e4.ada.brief: "Same rule as on Monday: we read the codes, we never follow them. And this time, the code was printed by the town itself."
e4.ada.g.read: "Read the message, `cat message-habitante.txt`, then the library poster's code: `qr decode affiches/A3.png`."
e4.ada.g.read.standard: "Read the resident's message, then the code of the library poster, without opening it."
e4.ada.message: "The library is poster A3 in the inventory. Read its code: `qr decode affiches/A3.png`."
e4.ada.message.standard: "Find the library poster in `affiches/` and read its code."
e4.ada.read: "Not `brumevaux.test`: `go.vallon-liens.example`, a link shortener. The communication department used it in 2028 to get short codes. Who answers at that address today?"
e4.ada.g.owner: "Look up the domain in the public register: `whois vallon-liens.example`."
e4.ada.g.owner.standard: "Find out who holds the shortener's domain today, with a public lookup."
e4.ada.owner: "Read the dates. Deleted on 19 August, registered again on 3 September by a holder who hides their name, name servers of a parking-pages company. Answer my question."
e4.ada.why: "Exactly. The code holds a name, and the name changed hands. Nobody needed to touch the posters. Now, how many are out there?"
e4.ada.g.copies: "The inventory gives the copies printed for each poster: `cat com/inventaire.csv`. Read all the posters, `zbarimg affiches/A1.png affiches/A2.png affiches/A3.png affiches/A4.png affiches/A5.png`, and add up the copies of those that go through the shortener. Answer with `answer copies <number>`."
e4.ada.g.copies.standard: "Find which posters go through the shortener and add up their printed copies. Answer with `answer copies`."
e4.ada.copies: "A1, A3 and A5: 830 copies around town. Now the charter, so that it never happens again."
e4.ada.g.charter: "Open the charter, `edit com/charte-qr.conf` (or `sed -i`), and choose for each line the value that keeps control with the town. Then `verify`."
e4.ada.g.charter.standard: "Fix the four lines of `com/charte-qr.conf`, then `verify`."
e4.ada.charter: "Codes that lead to the town's own name, no third party in the middle, the address printed underneath so anyone can check, and domains that never expire by accident. Now the posters already up: answer my question."
e4.ada.answer: "Answer my question: click, or use `answer` in the terminal."
e4.ada.answer.standard: "My question is waiting in the messages."
e4.ada.fix.cover: "The agents paste the town's own label over the three codes this afternoon: a new code to `www.brumevaux.test`, with the address printed in clear. A label the residents were told about, unlike Monday's."
e4.ada.fix.reprint: "830 posters reprinted. Clean, but it takes a week and a budget, and in the meantime the old codes stay up."
e4.ada.fix.remove: "The posters come down today. Nothing left to scan, but the festival, the library and the recycling centre lose their posters until new ones are printed."
e4.ada.done: "Four missions, four ways a QR code misleads: a sticker, a parcel, a mail, and our own forgotten links. The town knows how to read them now. Debrief."
e4.q.copies: "How many printed copies carry a code that goes through the shortener? (a number)"
e4.q.why: "Why do the town's own posters now lead to a scam?"
e4.q.why.owner: "The shortener's domain was deleted and bought again: whoever holds it decides where every code leads."
e4.q.why.cipher: "The shortener's links are not encrypted, so anyone on the network can change where they lead."
e4.q.why.cipher.why: "The links start with https. Nobody changed them on the way: the domain itself now belongs to someone else."
e4.q.why.age: "The codes printed in 2028 are too old: a QR code stops working properly after a year."
e4.q.why.age.why: "A QR code never expires: it is printed text. What changed is who answers at the address it holds."
e4.q.fix: "What does the town do with the posters already up?"
e4.q.fix.cover: "Paste the town's own label with a new code and the address in clear, then announce it."
e4.q.fix.reprint: "Reprint all 830 posters with new codes and replace them in a week."
e4.q.fix.remove: "Take the three posters down everywhere today, until new ones are printed."
e4.check.domain: "Every printed code leads to www.brumevaux.test"
e4.check.shortener: "Third-party link shorteners are forbidden"
e4.check.url: "The address is printed in clear under every code"
e4.check.renewal: "The town's domains renew automatically"
e4.hint.read.1: "`qr decode affiches/A3.png` reads the code and says which site it would open."
e4.hint.read.2: "The library poster is A3 in `com/inventaire.csv`."
e4.hint.owner.1: "`whois vallon-liens.example`: read the creation date and the notice at the end."
e4.hint.why.1: "Nobody touched the posters. What changed between 2028 and today?"
e4.hint.copies.1: "`zbarimg` takes several images: A1, A3 and A5 open `go.vallon-liens.example`."
e4.hint.copies.2: "400 + 250 + 180: `answer copies 830`."
e4.hint.charter.1: "Each line of the charter lists its possible values in the comment at the top."
e4.hint.charter.2: "`www.brumevaux.test`, `forbidden`, `yes`, `auto`. For example: `sed -i 's/shortener: allowed/shortener: forbidden/' com/charte-qr.conf`, then `verify`."
e4.debrief.title: "A code holds a name"
e4.debrief.lesson: "A printed QR code cannot be changed, but the name it holds can change hands. A link shortener, a \"dynamic code\" service, a domain that is not renewed: each is a third party that decides, for years, where your posters lead. The defence: codes that point to your own domain, the address printed under the code, and domains that never lapse."
e4.debrief.p1: "When a shortener closes or a domain lapses, anyone can register the name again and inherit every code ever printed."
e4.debrief.p2: "The address printed under the code lets anyone check before scanning, and makes a swapped code visible."
e4.debrief.p3: "A label pasted by the town is only trustworthy if the town says so publicly: otherwise it looks just like a scammer's."
e4.home.p1: "If you print QR codes (association, shop, wedding), point them to an address you control, never to a free shortener or a trial account."
e4.home.p2: "Print the address in clear under the code, so that people can check it."
e4.home.p3: "Turn on automatic renewal for your domain names, and note when they expire."
