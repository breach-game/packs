file.readme: "Ligne Rouge workstation. Side series: L'Escale. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE ES-2029-31\nClient: L'Escale, café-coworking chain, IT department. Scope: *.escale.test and 10.115.0.0/24, the network of the pilot café at South Station.\nPurpose: say honestly what a guest Wi-Fi exposes today, and what it does not, then set the chain's guest Wi-Fi policy.\nAgreed set-up: audit and defence only. Captures are taken by the café on its own devices, before opening. No live capture, no imitation of an access point, no disconnection of anyone. The travellers' devices are seen, never touched.\nSigned: the IT manager of L'Escale."
ada.outOfScope: "Stop. That target is not in mandate ES-2029-31. A café's Wi-Fi is full of other people's devices and the station's networks: we only look at the café's own, and anything else is an offence (article 323-1 of the French Penal Code)."
portal.title: "L'Escale · Guest Wi-Fi"
portal.h1: "Welcome to L'Escale"
portal.p1: "Free Wi-Fi, for two hours, renewable at the counter. By pressing \"Connect\" you accept:"
portal.l1: "To use the network fairly: no heavy downloads during rush hour."
portal.l2: "That the network is shared with other travellers."
portal.l3: "That the café keeps the connection log for one year, as the law requires."
portal.p2: "We never ask for a password, an e-mail account or a social network account to connect you. Our only networks: Escale-Invites (guests) and Escale-Equipe (staff)."
portal.footer: "L'Escale · portail.escale.test"
