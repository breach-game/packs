file.readme: "Poste Ligne Rouge. Hors-série : L'Escale. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT ES-2029-31\nClient : L'Escale, chaîne de cafés-coworking, service informatique. Périmètre : *.escale.test et 10.115.0.0/24, le réseau du café pilote de la gare Sud.\nObjet : dire honnêtement ce qu'un Wi-Fi invités expose aujourd'hui, et ce qu'il n'expose pas, puis fixer la règle du Wi-Fi invités de la chaîne.\nCadre convenu : audit et défense seulement. Les captures sont prises par le café sur ses propres appareils, avant l'ouverture. Aucune capture en direct, aucune imitation de point d'accès, personne n'est déconnecté. Les appareils des voyageurs sont vus, jamais touchés.\nSigné : le responsable informatique de L'Escale."
ada.outOfScope: "Stop. Cette cible n'est pas dans le mandat ES-2029-31. Le Wi-Fi d'un café est plein d'appareils des autres et de réseaux de la gare : on ne regarde que ceux du café, le reste est une infraction (article 323-1 du Code pénal)."
portal.title: "L'Escale · Wi-Fi invités"
portal.h1: "Bienvenue à L'Escale"
portal.p1: "Wi-Fi gratuit, deux heures, renouvelable au comptoir. En appuyant sur « Se connecter », tu acceptes :"
portal.l1: "D'utiliser le réseau raisonnablement : pas de gros téléchargements aux heures de pointe."
portal.l2: "Que le réseau est partagé avec d'autres voyageurs."
portal.l3: "Que le café garde le journal des connexions un an, comme la loi l'impose."
portal.p2: "Nous ne demandons jamais de mot de passe, de compte mail ou de réseau social pour te connecter. Nos seuls réseaux : Escale-Invites (invités) et Escale-Equipe (équipe)."
portal.footer: "L'Escale · portail.escale.test"
