file.readme: "Poste Ligne Rouge. Dossier : Mésange. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT MS-2027-005\nClient : Banque Mésange SA. Périmètre : *.mesange.test, 10.65.0.0/24.\nObjet : la Banque Mésange a déménagé son site chez un fournisseur de cloud. La direction veut savoir si une erreur de configuration pourrait exposer les demandes de carte qu'elle y stocke.\nLimites : la preuve attendue est le fichier témoin déposé dans le stockage pour ce mandat. Aucun dossier client ne doit être ouvert, copié ni listé en détail.\nSigné : le responsable de la sécurité de la Banque Mésange."
