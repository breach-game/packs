file.readme: "Ligne Rouge workstation. Case file: Pinson. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE PN-2027-003\nClient: Pinson SAS. Scope: *.pinson.test, 10.63.0.0/24.\nPurpose: a social engineering exercise by phone on the support team, requested by Pinson's management.\nSet-up agreed: one single line is open to the exercise, `ligne.pinson.test`. The backup portal you dictate on the phone belongs to Ligne Rouge: it keeps no password and only opens a canary account in Volière. The expected proof is the marker of that canary account.\nNo sanction for the person called: she will be told and thanked the same evening.\nSigned: the chief executive of Pinson."
web.footer: "Pinson - fictional social network, BREACH case file 03"
web.nav.home: "Home"
web.nav.status: "Service status"
web.nav.hiring: "Jobs"
web.home.title: "Pinson - say it in 200 characters"
web.home.h1: "Pinson"
web.home.p1: "The small network where things get said in 200 characters. Four million accounts, including a few ministers, two football clubs and one very popular bakery."
web.home.p2: "Since last year, the whole team works from home."
web.status.title: "Pinson - service status"
web.status.h1: "Service status"
web.status.mobile: "App: up"
web.status.api: "API: up"
web.status.vpn: "Staff VPN: degraded since Monday"
web.status.h2: "Note to staff"
web.status.p1: "The VPN keeps dropping, we know, and working from home does not help. IT support is on it."
web.status.p2: "Trouble connecting? IT support answers on internal extension 4040."
web.jobs.title: "Pinson - jobs"
web.jobs.h1: "We are hiring"
web.jobs.h2: "Support agent (remote)"
web.jobs.p1: "You help our members get their account back. From your first week you work in Volière, our internal tool, which can do this for any account:"
web.jobs.l1: "change the email address"
web.jobs.l2: "reset the password"
web.jobs.l3: "turn off two-factor authentication"
web.jobs.p2: "Volière can only be reached through the VPN, with your password and an approval on your phone."
web.call.title: "Pinson - exercise line"
web.call.h1: "Exercise line"
web.call.p1: "This line rings at Lison's desk, a support agent. Write what you say on the phone; her answer shows up here."
web.voliere.title: "Volière - access denied"
web.voliere.h1: "Volière"
web.voliere.p1: "Access denied. Volière can only be reached from the staff VPN, by a member of support."
npc.lison.role: "Support agent at Pinson (on the phone)"
npc.lison.greeting: "Pinson support, Lison speaking. Hello?"
npc.lison.fallback: "Hello? Sorry, I have twelve requests waiting. Who are you, and what is this about?"
npc.lison.password: "Oh no. I give my password to nobody, not even you: it is the first thing they teach us here. If that is all, I am hanging up."
npc.lison.desk: "IT support? I did not ask for anything. What exactly are you calling about?"
npc.lison.vpn: "The VPN, do not get me started, it drops three times a day. But who are you?"
npc.lison.prize: "Listen, this smells like a scam. I am hanging up, have a nice day."
npc.lison.hooked: "Oh, finally someone from support! This VPN has been driving me mad since Monday. A backup portal? Spell the address for me... there, it is the usual page all right. My login, my password... My phone asks me to approve the sign-in: approved. All good on your side?\n\n[portal] credentials received, replayed on the real VPN\n[portal] approval requested on her phone\n[portal] approval accepted by Lison\n[portal] session opened in Volière\n[volière] canary account: @pinson_exercice\n[volière] email editable, 2FA can be disabled\n[volière] marker: FLAG{pinson-voliere-9c2e}"
ada.outOfScope: "Stop. That target is outside mandate PN-2027-003. Outside the mandate, this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Back inside the scope."
ada.noise70: "You are getting loud. Slow down."
ada.detected: "Detected. We go back to the last checkpoint, and it costs points."
