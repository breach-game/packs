file.readme: "Poste Ligne Rouge. Dossier : Pinson. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT PN-2027-003\nClient : Pinson SAS. Périmètre : *.pinson.test, 10.63.0.0/24.\nObjet : exercice d'ingénierie sociale par téléphone sur l'équipe de support, demandé par la direction de Pinson.\nDispositif convenu : une seule ligne est ouverte à l'exercice, `ligne.pinson.test`. Le portail de secours que tu dictes au téléphone appartient à Ligne Rouge : il ne garde aucun mot de passe et n'ouvre qu'un compte témoin dans Volière. La preuve attendue est le marqueur de ce compte témoin.\nAucune sanction pour la personne appelée : elle sera prévenue et remerciée le soir même.\nSigné : la directrice générale de Pinson."
web.footer: "Pinson - réseau social fictif, dossier BREACH 03"
web.nav.home: "Accueil"
web.nav.status: "État des services"
web.nav.hiring: "Recrutement"
web.home.title: "Pinson - dis-le en 200 signes"
web.home.h1: "Pinson"
web.home.p1: "Le petit réseau où l'on se dit les choses en 200 signes. Quatre millions de comptes, dont quelques ministres, deux clubs de foot et une boulangerie très suivie."
web.home.p2: "Depuis l'an dernier, toute l'équipe travaille de chez elle."
web.status.title: "Pinson - état des services"
web.status.h1: "État des services"
web.status.mobile: "Application : en service"
web.status.api: "API : en service"
web.status.vpn: "VPN des équipes : perturbé depuis lundi"
web.status.h2: "Note aux équipes"
web.status.p1: "Le VPN décroche encore, nous le savons, et le télétravail n'arrange rien. Le support informatique y travaille."
web.status.p2: "Un souci de connexion ? Le support informatique répond au poste interne 4040."
web.jobs.title: "Pinson - recrutement"
web.jobs.h1: "On recrute"
web.jobs.h2: "Agent de support (télétravail)"
web.jobs.p1: "Tu aides nos membres à retrouver leur compte. Dès ta première semaine, tu as la main sur Volière, notre outil interne, qui permet pour n'importe quel compte de :"
web.jobs.l1: "changer l'adresse e-mail"
web.jobs.l2: "réinitialiser le mot de passe"
web.jobs.l3: "désactiver la double authentification"
web.jobs.p2: "Volière n'est accessible que par le VPN, avec ton mot de passe et une validation sur ton téléphone."
web.call.title: "Pinson - ligne d'exercice"
web.call.h1: "Ligne d'exercice"
web.call.p1: "Cette ligne sonne chez Lison, agente de support. Écris ce que tu dis au téléphone ; sa réponse s'affiche ici."
web.voliere.title: "Volière - accès refusé"
web.voliere.h1: "Volière"
web.voliere.p1: "Accès refusé. Volière n'est joignable que depuis le VPN des équipes, par une personne du support."
npc.lison.role: "Agente de support chez Pinson (au téléphone)"
npc.lison.greeting: "Pinson, support, Lison à l'appareil. Allô ?"
npc.lison.fallback: "Allô ? Excusez-moi, j'ai douze demandes en attente. Vous êtes qui, et c'est à quel sujet ?"
npc.lison.password: "Ah non. Mon mot de passe, je ne le donne à personne, même pas à vous : c'est la première chose qu'on nous apprend ici. Si c'est tout, je raccroche."
npc.lison.desk: "Le support informatique ? Je n'ai rien demandé, moi. Vous m'appelez pour quoi, au juste ?"
npc.lison.vpn: "Le VPN, ne m'en parlez pas, il me lâche trois fois par jour. Mais vous êtes qui, vous ?"
npc.lison.prize: "Écoutez, ça sent l'arnaque à plein nez. Je raccroche, bonne journée."
npc.lison.hooked: "Ah, enfin quelqu'un du support ! Ce VPN me rend folle depuis lundi. Un portail de secours ? Dictez-moi l'adresse... voilà, c'est bien la page habituelle. Mon identifiant, mon mot de passe... Mon téléphone me demande de valider la connexion : je valide. C'est bon de votre côté ?\n\n[portail] identifiants reçus, rejoués sur le vrai VPN\n[portail] validation demandée sur son téléphone\n[portail] validation acceptée par Lison\n[portail] session ouverte dans Volière\n[volière] compte témoin : @pinson_exercice\n[volière] e-mail modifiable, 2FA désactivable\n[volière] marqueur : FLAG{pinson-voliere-9c2e}"
ada.outOfScope: "Stop. Cette cible est hors du mandat PN-2027-003. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
