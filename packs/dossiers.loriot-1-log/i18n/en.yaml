l1.briefing: "Public alert this morning: the continuous integration action `actions-communes/fichiers-modifies` was modified during the night, and its `v45` tag points to other code. loriot-ui uses it on every push. Its logs are public, on `forge.loriot.test`. What did they reveal?"
l1.obj.run: "Find the affected run"
l1.obj.secret: "Say which secret lets someone publish a fake version"
l1.obj.public: "Say why it is serious here"
l1.q.run: "Which run wrote a strange line in its log?"
l1.q.secret: "Which secret, out in the log, would let someone publish a fake version of loriot-ui?"
l1.q.public: "Why is this log a problem for loriot-ui in particular?"
l1.q.public.anyone: "The repository is public: anyone can read this log, and may have copied it already"
l1.q.public.encoded: "It is not one: the text is encoded twice over, and nobody can read it without the key"
l1.q.public.encoded.why: "Base64 is not encryption: `base64 -d` is enough, twice. It is a way around automatic secret masking, not a protection."
l1.q.public.expired: "It is not one: every token expires at the end of the run"
l1.q.public.expired.why: "Only the forge token expires with the run, the log says so. The publishing token and the deploy key still work."
l1.ada.brief: "Start with the list of runs: `curl https://forge.loriot.test/loriot/loriot-ui/actions`. Each run has its log: compare them."
l1.ada.g.run: "Read both logs: `curl https://forge.loriot.test/loriot/loriot-ui/actions/runs/811/log`, then the same address with `812`. One line does not belong in one of them. `answer run <number>`."
l1.ada.g.run.standard: "Compare the logs of the recent runs, and give the one with a line too many: `answer run`."
l1.ada.run: "Run 812, after the fichiers-modifies step: a long unreadable line, just before the list of files. It was never in run 811."
l1.ada.g.secret: "That line is Base64. Copy it and decode it: `echo <line> | base64 -d`. What comes out is Base64 again: add a second `| base64 -d`. Then `answer secret <name>`."
l1.ada.g.secret.standard: "Decode the strange line until you can read it, and give the name of the secret that publishes the library: `answer secret`."
l1.ada.secret: "Three of the run's secrets, in clear once decoded. The publishing token is the worst: with it, anyone publishes a trapped version of loriot-ui, which 3,400 projects will install."
l1.ada.answer: "Answer in the messenger, or with `answer` in the terminal."
l1.ada.answer.standard: "My question is waiting in the messenger."
l1.ada.done: "Nobody forced Loriot's door. A trusted tool changed overnight, ran with Loriot's secrets, and wrote them where everyone reads."
l1.hint.run.1: "The runs page links to each run's log. Runs 811 and 812 do the same thing: read them line by line."
l1.hint.run.2: "`answer run 812`"
l1.hint.secret.1: "A line of letters and digits ending in `=`: that is Base64."
l1.hint.secret.2: "Decode twice: `echo <line> | base64 -d | base64 -d`."
l1.hint.secret.3: "`answer secret NPM_TOKEN`"
l1.hint.public.1: "Who can read a public repository's logs?"
l1.debrief.title: "A trusted tool, a public log"
l1.debrief.lesson: "The fichiers-modifies action changed without Loriot changing a line: its `v45` tag now pointed to other code. That code read the run's secrets and wrote them in the log, encoded twice to get past masking. In a public repository, that log is a poster."
l1.debrief.p1: "A third-party action runs with the repository's secrets: it is part of the chain of trust."
l1.debrief.p2: "Base64 is not encryption; secret masking is bypassed by encoding the secret."
l1.debrief.p3: "In a public repository, anything that ends up in a log must be treated as published."
