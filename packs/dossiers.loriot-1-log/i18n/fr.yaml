l1.briefing: "Alerte publique de ce matin : l'action d'intégration continue `actions-communes/fichiers-modifies` a été modifiée dans la nuit, et son étiquette `v45` pointe vers un autre code. loriot-ui l'utilise à chaque envoi. Ses journaux sont publics, sur `forge.loriot.test`. Qu'ont-ils laissé voir ?"
l1.obj.run: "Trouver l'exécution touchée"
l1.obj.secret: "Dire quel secret permet de publier une fausse version"
l1.obj.public: "Dire pourquoi c'est grave ici"
l1.q.run: "Quelle exécution a écrit une ligne étrange dans son journal ?"
l1.q.secret: "Quel secret, sorti dans le journal, permettrait de publier une fausse version de loriot-ui ?"
l1.q.public: "Pourquoi ce journal est-il un problème pour loriot-ui en particulier ?"
l1.q.public.anyone: "Le dépôt est public : n'importe qui peut lire ce journal, et l'avoir déjà copié"
l1.q.public.encoded: "Ce n'en est pas un : le texte est encodé deux fois, personne ne peut le lire sans la clé"
l1.q.public.encoded.why: "Base64 n'est pas un chiffrement : `base64 -d` suffit, deux fois. C'est une façon d'éviter le masquage automatique des secrets, pas de les protéger."
l1.q.public.expired: "Ce n'en est pas un : tous les jetons expirent à la fin de l'exécution"
l1.q.public.expired.why: "Seul le jeton de la forge expire avec l'exécution, le journal le dit. Le jeton de publication et la clé de déploiement, eux, marchent encore."
l1.ada.brief: "Commence par la liste des exécutions : `curl https://forge.loriot.test/loriot/loriot-ui/actions`. Chaque exécution a son journal : compare-les."
l1.ada.g.run: "Lis les deux journaux : `curl https://forge.loriot.test/loriot/loriot-ui/actions/runs/811/log`, puis la même adresse avec `812`. Une ligne n'a rien à faire dans l'un d'eux. `answer run <numéro>`."
l1.ada.g.run.standard: "Compare les journaux des exécutions récentes, et donne celle qui a une ligne de trop : `answer run`."
l1.ada.run: "La 812, après l'étape fichiers-modifies : une longue ligne illisible, juste avant la liste des fichiers. Celle-là n'a jamais été dans la 811."
l1.ada.g.secret: "Cette ligne est du Base64. Copie-la et décode-la : `echo <ligne> | base64 -d`. Ce qui sort est encore du Base64 : ajoute un second `| base64 -d`. Puis `answer secret <nom>`."
l1.ada.g.secret.standard: "Décode la ligne étrange jusqu'à la lire, et donne le nom du secret qui publie la bibliothèque : `answer secret`."
l1.ada.secret: "Trois secrets de l'exécution, en clair une fois décodés. Le jeton de publication est le pire : avec lui, n'importe qui publie une version piégée de loriot-ui, que 3 400 projets installeront."
l1.ada.answer: "Réponds dans la messagerie, ou avec `answer` dans le terminal."
l1.ada.answer.standard: "Ma question t'attend dans la messagerie."
l1.ada.done: "Personne n'a forcé la porte de Loriot. Un outil de confiance a changé dans la nuit, il a tourné avec les secrets de Loriot, et il les a écrits là où tout le monde lit."
l1.hint.run.1: "La page des exécutions mène au journal de chacune. La 811 et la 812 font la même chose : lis-les ligne à ligne."
l1.hint.run.2: "`answer run 812`"
l1.hint.secret.1: "Une ligne faite de lettres, de chiffres et terminée par `=` : c'est du Base64."
l1.hint.secret.2: "Décoder deux fois : `echo <ligne> | base64 -d | base64 -d`."
l1.hint.secret.3: "`answer secret NPM_TOKEN`"
l1.hint.public.1: "Qui peut lire les journaux d'un dépôt public ?"
l1.debrief.title: "Un outil de confiance, un journal public"
l1.debrief.lesson: "L'action fichiers-modifies a changé sans que Loriot change une ligne : son étiquette `v45` pointait désormais vers un autre code. Ce code a lu les secrets de l'exécution et les a écrits dans le journal, encodés deux fois pour échapper au masquage. Dans un dépôt public, ce journal est une affiche."
l1.debrief.p1: "Une action tierce tourne avec les secrets du dépôt : elle fait partie de la chaîne de confiance."
l1.debrief.p2: "Base64 n'est pas un chiffrement ; un masquage des secrets se contourne en les encodant."
l1.debrief.p3: "Dans un dépôt public, tout ce qui finit dans un journal doit être considéré comme publié."
