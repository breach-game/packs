fp.briefing: "Last year Au Bon Fournil installed a connected oven in its central bakehouse: the night programmes are set from a tablet. The management wants to know whether someone else could do it. Read-only mandate: we look, we touch nothing."
fp.obj.find: "Find the oven's address"
fp.obj.guide: "Read the oven's quick start guide"
fp.obj.login: "Show that the factory code opens the control page (flag)"
fp.obj.fix: "Tell the bakery what to change"
fp.ada.brief: "First steps. Many connected devices leave the factory with the same code for all, printed in their manual. Let's see whether this one kept it."
fp.ada.find: "The public site does not mention the oven. But sites sometimes tell search engines what they would rather hide: `curl https://www.fournil.test/robots.txt`. Then read the page it names."
fp.ada.find.standard: "Find where the site talks about its internal tools. The file for search engine robots is a good start."
fp.ada.oven: "The oven has a web page: `curl http://four.fournil.test/`, or open it in the browser."
fp.ada.oven.standard: "Go and look at the oven's page."
fp.ada.form: "One field: a code. And a link to the quick start guide, served by the oven itself: `curl http://four.fournil.test/aide`."
fp.ada.form.standard: "An access code, and a guide right next to it. Read the guide."
fp.ada.login: "The guide gives the factory code. Try it, once: `curl -d \"code=0000\" http://four.fournil.test/`, or in the browser's form."
fp.ada.login.standard: "The guide says which code opens it the first time. Try it, only once."
fp.ada.opened: "Open. Send the audit marker with `submit`, and above all do not touch any button."
fp.ada.opened.standard: "It is open. Send the marker, and touch nothing else."
fp.ada.stop: "Stopping the oven, changing the temperature of a night batch: all one click away, for anyone on the network. We do not click. One proof is enough."
fp.ada.answer: "Answer my question: click, or use `answer` in the terminal."
fp.ada.answer.standard: "My question is waiting in the messenger."
fp.ada.done: "Yes. A code of its own for each device, and a page reachable only from the bakehouse. On to the debrief."
fp.q.fix: "What should the bakery change?"
fp.q.fix.both: "A code of its own per oven, and a page reachable from the bakehouse only."
fp.q.fix.guide: "Remove the quick start guide from the oven, so that nobody reads the code."
fp.q.fix.guide.why: "The same guide is online at the maker's, and the code is the same on every Fourneo oven. Hiding it changes nothing."
fp.q.fix.page: "Rename the address four.fournil.test to something more discreet."
fp.q.fix.page.why: "The name was only a shortcut: the page also answers on its IP address, and a network scan finds it."
fp.q.fix.pin: "Change the factory code for a random four-digit code."
fp.q.fix.pin.why: "It is the first step, but four digits are quick to guess, and the page stays open to the whole network."
fp.hint.find.1: "`curl https://www.fournil.test/robots.txt` names a page the site does not advertise."
fp.hint.find.2: "`curl https://www.fournil.test/pro` lists the tools, the oven among them."
fp.hint.guide.1: "`curl http://four.fournil.test/aide`."
fp.hint.login.1: "The guide says: \"Log in with the factory PIN\". The form field is called `code`."
fp.hint.login.2: "`curl -d \"code=0000\" http://four.fournil.test/`, then `submit` the marker."
fp.debrief.title: "The code that was in the manual"
fp.debrief.lesson: "A factory password is no secret: it is printed in the manual, published by the maker, the same on thousands of devices. A connected device installed without changing it is open to anyone who reaches its page."
fp.debrief.p1: "Change the factory code or password when the device goes into service, and prefer devices that force it."
fp.debrief.p2: "Machine control pages are reachable only from the station that controls them, not from the whole network."
fp.debrief.p3: "Keep a list of your connected devices: you cannot protect what you forgot you installed."
