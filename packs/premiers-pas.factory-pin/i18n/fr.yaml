fp.briefing: "Au Bon Fournil a installé l'an dernier un four connecté dans son fournil central : on règle les programmes de nuit depuis une tablette. La gérance veut savoir si quelqu'un d'autre pourrait le faire. Mandat en lecture seule : on regarde, on ne touche à rien."
fp.obj.find: "Trouver l'adresse du four"
fp.obj.guide: "Lire le guide de démarrage du four"
fp.obj.login: "Montrer que le code d'usine ouvre la page de pilotage (flag)"
fp.obj.fix: "Dire à la boulangerie quoi changer"
fp.ada.brief: "Premiers pas. Beaucoup d'objets connectés sortent d'usine avec le même code pour tous, écrit dans leur notice. Voyons si celui-ci l'a gardé."
fp.ada.find: "Le site public ne parle pas du four. Mais les sites disent parfois aux moteurs de recherche ce qu'ils préfèrent cacher : `curl https://www.fournil.test/robots.txt`. Puis lis la page qu'il cite."
fp.ada.find.standard: "Trouve où le site parle de ses outils internes. Le fichier pour les robots d'indexation est un bon début."
fp.ada.oven: "Le four a une page web : `curl http://four.fournil.test/`, ou ouvre-la dans le navigateur."
fp.ada.oven.standard: "Va voir la page du four."
fp.ada.form: "Un seul champ : un code. Et un lien vers le guide de démarrage, servi par le four lui-même : `curl http://four.fournil.test/aide`."
fp.ada.form.standard: "Un code d'accès, et un guide juste à côté. Lis le guide."
fp.ada.login: "Le guide donne le code d'usine. Essaie-le, une fois : `curl -d \"code=0000\" http://four.fournil.test/`, ou dans le formulaire du navigateur."
fp.ada.login.standard: "Le guide dit avec quel code on entre la première fois. Essaie-le une seule fois."
fp.ada.opened: "Ouvert. Envoie le témoin d'audit avec `submit`, et surtout ne touche à aucun bouton."
fp.ada.opened.standard: "C'est ouvert. Envoie le témoin, sans rien toucher d'autre."
fp.ada.stop: "Arrêter le four, changer la température d'une fournée de nuit : tout est à un clic, pour n'importe qui sur le réseau. On ne clique pas. Une preuve suffit."
fp.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
fp.ada.answer.standard: "Ma question t'attend dans la messagerie."
fp.ada.done: "Oui. Un code propre à chaque appareil, et une page qu'on n'atteint que depuis le fournil. Passe au débrief."
fp.q.fix: "Que doit changer la boulangerie ?"
fp.q.fix.both: "Un code propre à chaque four, et une page joignable depuis le seul fournil."
fp.q.fix.guide: "Retirer le guide de démarrage du four, pour que personne ne lise le code."
fp.q.fix.guide.why: "Le même guide est en ligne chez le fabricant, et le code est identique sur tous les fours Fourneo. Le cacher ne change rien."
fp.q.fix.page: "Renommer l'adresse four.fournil.test en un nom plus discret que personne ne devine."
fp.q.fix.page.why: "Le nom n'était qu'un raccourci : la page répond aussi à son adresse IP, et un scan du réseau la trouve."
fp.q.fix.pin: "Changer le code d'usine pour un code à quatre chiffres choisi au hasard."
fp.q.fix.pin.why: "C'est le premier geste, mais quatre chiffres se devinent vite, et la page reste ouverte à tout le réseau."
fp.hint.find.1: "`curl https://www.fournil.test/robots.txt` cite une page que le site ne met pas en avant."
fp.hint.find.2: "`curl https://www.fournil.test/pro` liste les outils, dont le four."
fp.hint.guide.1: "`curl http://four.fournil.test/aide`."
fp.hint.login.1: "Le guide dit : « Log in with the factory PIN ». Le champ du formulaire s'appelle `code`."
fp.hint.login.2: "`curl -d \"code=0000\" http://four.fournil.test/`, puis `submit` le témoin."
fp.debrief.title: "Le code qui était dans la notice"
fp.debrief.lesson: "Un mot de passe d'usine n'est pas un secret : il est imprimé dans la notice, publié par le fabricant, identique sur des milliers d'appareils. Un objet connecté qu'on installe sans le changer est ouvert à quiconque atteint sa page."
fp.debrief.p1: "Changer le code ou le mot de passe d'usine à la mise en service, et préférer les appareils qui l'imposent."
fp.debrief.p2: "Les pages de pilotage des machines ne sont joignables que depuis le poste qui les pilote, pas depuis tout le réseau."
fp.debrief.p3: "Tenir la liste de ses objets connectés : on ne protège pas ce qu'on a oublié avoir installé."
