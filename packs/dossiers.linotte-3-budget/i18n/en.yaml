l3.briefing: "The witness key passed its threshold in three requests, and nobody was told. Meanwhile the real key is still spending: more than a hundred euros an hour this morning. The co-founder has one question, and she wants the answer before the coffee: what do we do right now?"
l3.obj.first: "Choose what to do first"
l3.obj.revoke: "Revoke the test key"
l3.obj.scope: "Hold the website's key to the model it needs"
l3.obj.limits: "Limit the length of an answer and the pace of a visitor"
l3.obj.budget: "Give the account a daily ceiling and an alert"
l3.q.first: "The bill is still running. What do you do first?"
l3.q.first.revoke: "Revoke the test key: it has leaked, and nothing at Linotte needs it"
l3.q.first.refund: "Write to the provider to dispute the invoice and ask for a refund"
l3.q.first.refund.why: "Worth doing, this afternoon. While you write the email, the key spends another hundred euros."
l3.q.first.stop: "Switch Plume off for everyone until the investigation is finished"
l3.q.first.stop.why: "Plume is not the problem and her key is not the one that leaked. You would stop the product and leave the tap open."
l3.check.revoke: "The test key is revoked"
l3.check.scope: "The website's key may only call the small model"
l3.check.limits: "An answer has a maximum length and a visitor a maximum pace"
l3.check.budget: "The account has a daily ceiling and an alert"
l3.check.works: "Plume and the log stay on"
l3.ada.brief: "Last morning at Linotte. The gateway's settings are in `dossier/passerelle.yml`. But first, a decision, and quickly."
l3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
l3.ada.answer.standard: "Answer my question first."
l3.ada.first: "Yes. First you close the tap, then you ask why it was open. Plume keeps running: her key is another one."
l3.ada.g.revoke: "Open the file: `edit dossier/passerelle.yml`. Under `plume-test`, replace `status: active` with `status: revoked`, then `verify`."
l3.ada.g.revoke.standard: "Open `dossier/passerelle.yml` and take the test key out of service. Then `verify`. To open the file: `edit dossier/passerelle.yml`."
l3.ada.revoke: "The bill has stopped. Everything after this is so that the next leaked key costs twenty euros and not six thousand."
l3.ada.g.scope: "The key that stays: write `models: petit-only` under `plume-web`, then `verify`."
l3.ada.g.scope.standard: "The website's key can call any model. Hold it to the one Plume uses. Then `verify`."
l3.ada.g.limits: "Now the requests themselves: write `max_output_tokens: 800` and `per_visitor_per_hour: 30`, then `verify`."
l3.ada.g.limits.standard: "Give an answer a maximum length, and a visitor a maximum pace. Then `verify`."
l3.ada.g.budget: "Last, the account: write `daily_cap: 20-eur` and `alert: at-80-percent`, then `verify`."
l3.ada.g.budget.standard: "Last, give the account a ceiling for the day, and have someone told before it is reached. Then `verify`."
l3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
l3.ada.done: "Done. A key that leaks tomorrow can call one model, write eight hundred tokens at a time, and spend twenty euros before someone's phone rings. Open the debrief: at the end, the real attack this case file comes from."
l3.hint.first.1: "Which answer stops the spending in the next minute, without stopping the product?"
l3.hint.revoke.1: "The line to change is `status`, under `plume-test`."
l3.hint.revoke.2: "With the editor: `edit dossier/passerelle.yml`, then Ctrl+S. With a command: type `sed -i \"s/status: active/status: revoked/\" dossier/passerelle.yml`, then `verify`."
l3.hint.scope.1: "The line to change is `models`, under `plume-web`."
l3.hint.scope.2: "With the editor: `edit dossier/passerelle.yml`, then Ctrl+S. With a command: type `sed -i \"s/models: any/models: petit-only/\" dossier/passerelle.yml`, then `verify`."
l3.hint.limits.1: "Two lines to change under `limits`. The possible values are in the comments."
l3.hint.limits.2: "With the editor: `edit dossier/passerelle.yml`, then Ctrl+S. With a command: type `sed -i \"s/max_output_tokens: none/max_output_tokens: 800/\" dossier/passerelle.yml` and `sed -i \"s/per_visitor_per_hour: unlimited/per_visitor_per_hour: 30/\" dossier/passerelle.yml`, then `verify`."
l3.hint.budget.1: "Two lines to change under `budget`: `daily_cap` and `alert`."
l3.hint.budget.2: "With the editor: `edit dossier/passerelle.yml`, then Ctrl+S. With a command: type `sed -i \"s/daily_cap: none/daily_cap: 20-eur/\" dossier/passerelle.yml` and `sed -i \"s/alert: off/alert: at-80-percent/\" dossier/passerelle.yml`, then `verify`."
l3.debrief.title: "What a key may spend"
l3.debrief.lesson: "You did not try to make keys impossible to steal. You decided in advance what a stolen key is worth: one model, a bounded answer, a daily amount, and a person who is told. With a service billed by use, the limit is the protection."
l3.debrief.p1: "First contain: revoke the key that leaked. The investigation comes after the tap is closed."
l3.debrief.p2: "Least privilege applies to keys of AI models: the models, the length and the pace the job needs, nothing more."
l3.debrief.p3: "A ceiling turns an unlimited loss into a known one, and an alert turns four days into a few minutes."
l3.debrief.p4: "Keys of tests and prototypes are revoked when the test ends. The forgotten one is the one that gets found."
l3.facts.title: "What really happened: \"LLMjacking\", described by Sysdig (2024)"
l3.facts.p1: "Linotte and Plume do not exist. The scenario is inspired by an attack that the security company Sysdig described in May 2024 and named \"LLMjacking\". Sysdig does not name the victim."
l3.facts.p2: "According to Sysdig, the attackers got into a server through a known flaw in a web framework that had not been updated, and found access keys to a cloud account on it. In this case file, the key lies on a forgotten test site instead."
l3.facts.p3: "With those keys they did not look for data. Sysdig describes a tool that checked, across ten AI services, which language models the account could call, with requests built so as not to run any real prompt."
l3.facts.p4: "The aim Sysdig describes: give or sell access to those models to other people through a relay, while the owner of the account pays the bill."
l3.facts.p5: "Sysdig estimated that, in the worst case, such an abuse could cost the victim more than 46,000 dollars a day. That figure is its estimate, not an invoice."
l3.facts.p6: "The class of weakness has had its own entry in the OWASP list for language-model applications since its 2025 edition: unbounded consumption. The defences are those of this mission: limited keys, ceilings, and alerts on unusual use of a model."
