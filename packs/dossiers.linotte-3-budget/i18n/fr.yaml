l3.briefing: "La clé témoin a dépassé son seuil en trois demandes, et personne n'a été prévenu. Pendant ce temps, la vraie clé dépense toujours : plus de cent euros de l'heure ce matin. La cofondatrice a une question, et elle veut la réponse avant le café : qu'est-ce qu'on fait tout de suite ?"
l3.obj.first: "Choisir ce qu'on fait d'abord"
l3.obj.revoke: "Révoquer la clé d'essai"
l3.obj.scope: "Tenir la clé du site au modèle dont elle a besoin"
l3.obj.limits: "Limiter la longueur d'une réponse et le rythme d'un visiteur"
l3.obj.budget: "Donner au compte un plafond par jour et une alerte"
l3.q.first: "La facture court toujours. Que fais-tu d'abord ?"
l3.q.first.revoke: "Révoquer la clé d'essai : elle a fuité, et rien chez Linotte n'en a besoin"
l3.q.first.refund: "Écrire au fournisseur pour contester la facture et demander un remboursement"
l3.q.first.refund.why: "À faire, cet après-midi. Pendant que tu écris le message, la clé dépense cent euros de plus."
l3.q.first.stop: "Éteindre Plume pour tout le monde jusqu'à la fin de l'enquête"
l3.q.first.stop.why: "Plume n'est pas le problème et sa clé n'est pas celle qui a fuité. Tu arrêterais le produit en laissant le robinet ouvert."
l3.check.revoke: "La clé d'essai est révoquée"
l3.check.scope: "La clé du site ne peut appeler que le petit modèle"
l3.check.limits: "Une réponse a une longueur maximale et un visiteur un rythme maximal"
l3.check.budget: "Le compte a un plafond par jour et une alerte"
l3.check.works: "Plume et le journal restent actifs"
l3.ada.brief: "Dernière matinée chez Linotte. Les réglages de la passerelle sont dans `dossier/passerelle.yml`. Mais d'abord, une décision, et vite."
l3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
l3.ada.answer.standard: "Réponds d'abord à ma question."
l3.ada.first: "Oui. D'abord on ferme le robinet, ensuite on se demande pourquoi il était ouvert. Plume continue de tourner : sa clé est une autre."
l3.ada.g.revoke: "Ouvre le fichier : `edit dossier/passerelle.yml`. Sous `plume-test`, remplace `status: active` par `status: revoked`, puis `verify`."
l3.ada.g.revoke.standard: "Ouvre `dossier/passerelle.yml` et mets la clé d'essai hors service. Puis `verify`."
l3.ada.revoke: "La facture s'est arrêtée. Tout ce qui suit sert à ce que la prochaine clé qui fuit coûte vingt euros et pas six mille."
l3.ada.g.scope: "La clé qui reste : écris `models: petit-only` sous `plume-web`, puis `verify`."
l3.ada.g.scope.standard: "La clé du site peut appeler n'importe quel modèle. Tiens-la à celui que Plume utilise. Puis `verify`."
l3.ada.g.limits: "Maintenant les demandes elles-mêmes : écris `max_output_tokens: 800` et `per_visitor_per_hour: 30`, puis `verify`."
l3.ada.g.limits.standard: "Donne à une réponse une longueur maximale, et à un visiteur un rythme maximal. Puis `verify`."
l3.ada.g.budget: "Enfin, le compte : écris `daily_cap: 20-eur` et `alert: at-80-percent`, puis `verify`."
l3.ada.g.budget.standard: "Enfin, donne au compte un plafond pour la journée, et fais prévenir quelqu'un avant qu'il soit atteint. Puis `verify`."
l3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
l3.ada.done: "C'est fait. Une clé qui fuit demain peut appeler un seul modèle, écrire huit cents jetons à la fois, et dépenser vingt euros avant que le téléphone de quelqu'un sonne. Ouvre le débrief : à la fin, la vraie attaque dont ce dossier s'inspire."
l3.hint.first.1: "Quelle réponse arrête la dépense dans la minute, sans arrêter le produit ?"
l3.hint.revoke.1: "La ligne à changer est `status`, sous `plume-test`."
l3.hint.revoke.2: "Tape `sed -i \"s/status: active/status: revoked/\" dossier/passerelle.yml`, puis `verify`."
l3.hint.scope.1: "La ligne à changer est `models`, sous `plume-web`."
l3.hint.scope.2: "Tape `sed -i \"s/models: any/models: petit-only/\" dossier/passerelle.yml`, puis `verify`."
l3.hint.limits.1: "Deux lignes à changer sous `limits`. Les valeurs possibles sont dans les commentaires."
l3.hint.limits.2: "Tape `sed -i \"s/max_output_tokens: none/max_output_tokens: 800/\" dossier/passerelle.yml` et `sed -i \"s/per_visitor_per_hour: unlimited/per_visitor_per_hour: 30/\" dossier/passerelle.yml`, puis `verify`."
l3.hint.budget.1: "Deux lignes à changer sous `budget` : `daily_cap` et `alert`."
l3.hint.budget.2: "Tape `sed -i \"s/daily_cap: none/daily_cap: 20-eur/\" dossier/passerelle.yml` et `sed -i \"s/alert: off/alert: at-80-percent/\" dossier/passerelle.yml`, puis `verify`."
l3.debrief.title: "Ce qu'une clé peut dépenser"
l3.debrief.lesson: "Tu n'as pas cherché à rendre les clés impossibles à voler. Tu as décidé d'avance ce que vaut une clé volée : un modèle, une réponse bornée, un montant par jour, et une personne prévenue. Avec un service facturé à l'usage, la limite est la protection."
l3.debrief.p1: "D'abord contenir : révoquer la clé qui a fuité. L'enquête vient une fois le robinet fermé."
l3.debrief.p2: "Le moindre privilège vaut pour les clés des modèles d'IA : les modèles, la longueur et le rythme que le travail demande, rien de plus."
l3.debrief.p3: "Un plafond transforme une perte sans limite en perte connue, et une alerte transforme quatre jours en quelques minutes."
l3.debrief.p4: "Les clés des essais et des prototypes sont révoquées quand l'essai se termine. Celle qu'on oublie est celle qu'on retrouve."
l3.facts.title: "Ce qui s'est vraiment passé : le « LLMjacking », décrit par Sysdig (2024)"
l3.facts.p1: "Linotte et Plume n'existent pas. Le scénario s'inspire d'une attaque que la société de sécurité Sysdig a décrite en mai 2024 et nommée « LLMjacking ». Sysdig ne nomme pas la victime."
l3.facts.p2: "Selon Sysdig, les attaquants sont entrés sur un serveur par une faille connue d'un cadre de développement web qui n'avait pas été mis à jour, et y ont trouvé des clés d'accès à un compte cloud. Dans ce dossier, la clé traîne plutôt sur un site d'essai oublié."
l3.facts.p3: "Avec ces clés, ils n'ont pas cherché de données. Sysdig décrit un outil qui vérifiait, sur dix services d'IA, quels modèles de langage le compte pouvait appeler, avec des demandes construites pour n'exécuter aucune vraie requête."
l3.facts.p4: "Le but décrit par Sysdig : donner ou vendre l'accès à ces modèles à d'autres personnes à travers un relais, pendant que le propriétaire du compte paie la facture."
l3.facts.p5: "Sysdig a estimé que, dans le pire des cas, un tel abus pouvait coûter à la victime plus de 46 000 dollars par jour. Ce chiffre est son estimation, pas une facture."
l3.facts.p6: "Cette classe de faiblesse a sa propre entrée dans la liste OWASP des applications à modèles de langage depuis son édition 2025 : la consommation sans limite. Les défenses sont celles de cette mission : des clés limitées, des plafonds, et des alertes sur l'usage inhabituel d'un modèle."
