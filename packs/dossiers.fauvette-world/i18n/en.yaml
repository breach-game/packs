file.readme: "Ligne Rouge workstation. Case file: Fauvette. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE FV-2027-007\nClient: Fauvette SAS. Scope: *.fauvette.test, 10.67.0.0/24.\nPurpose: Fauvette gave each employee Sillage, an assistant that reads their emails and files. Management wants to know whether a plain email from outside can make internal information leave.\nSet-up agreed: a single mailbox is open to the exercise, that of Maud, an employee who volunteered and keeps working normally. Her files hold only a witness note. The collection address belongs to Ligne Rouge and keeps only the marker. The proof expected is that marker, nothing else.\nSigned: the chief information officer of Fauvette."
web.footer: "Fauvette - fictional consulting firm, BREACH case file 07"
web.nav.home: "Home"
web.nav.tool: "Sillage"
web.home.title: "Fauvette - consulting"
web.home.h1: "Fauvette"
web.home.p1: "A consulting firm of one hundred and twenty people. Our consultants go faster since they have Sillage."
web.tool.title: "Fauvette - Sillage"
web.tool.h1: "Sillage, every employee's assistant"
web.tool.p1: "Ask your question, Sillage looks for the answer in everything you are allowed to read:"
web.tool.l1: "your files and your team's"
web.tool.l2: "your chats"
web.tool.l3: "your inbox, external emails included"
web.tool.p2: "You have nothing to open or sort: Sillage reads for you."
web.mail.title: "Fauvette - exercise mailbox"
web.mail.h1: "Exercise mailbox"
web.mail.p1: "What you write here is delivered to Maud as an email from outside. She will not open it: she has too much mail."
web.mail.p2: "The log then shows what Sillage does with it when Maud asks it, as every Monday, a question about her leave."
web.apercu.title: "Fauvette - preview service"
web.apercu.h1: "Preview service"
web.apercu.p1: "This service fetches the page at the address it is given to show a thumbnail. It is one of the domains allowed for Sillage's images."
npc.boite.role: "Fauvette exercise mailbox (log)"
npc.boite.greeting: "Mailbox ready. Write your email to Maud: this log shows what Sillage does with it."
npc.boite.fallback: "Email delivered.\n\n[mailbox] delivered to Maud, not opened\n[sillage] Monday 9:12, Maud asks: \"how many days of leave do I have left?\"\n[sillage] this email has nothing to do with the question: not retrieved\n[sillage] normal answer, nothing leaves"
npc.boite.blocked: "Email delivered.\n\n[mailbox] delivered to Maud, not opened\n[sillage] Monday 9:12, Maud asks: \"how many days of leave do I have left?\"\n[sillage] email retrieved, then dropped by the input filter: it addresses an assistant and gives it orders\n[sillage] normal answer, nothing leaves"
npc.boite.plain: "Email delivered.\n\n[mailbox] delivered to Maud, not opened\n[sillage] Monday 9:12, Maud asks: \"how many days of leave do I have left?\"\n[sillage] email retrieved: it is about leave, and it addresses a human reader. The input filter lets it through\n[sillage] the email asks for nothing: normal answer, nothing leaves"
npc.boite.link: "Email delivered.\n\n[mailbox] delivered to Maud, not opened\n[sillage] Monday 9:12, Maud asks: \"how many days of leave do I have left?\"\n[sillage] email retrieved, the input filter lets it through\n[sillage] the answer follows the email's \"procedure\" and contains an external link\n[sillage] output filter: external link removed\n[sillage] and even without the filter, Maud would have had to click. Nothing leaves"
npc.boite.leak: "Email delivered.\n\n[mailbox] delivered to Maud, not opened\n[sillage] Monday 9:12, Maud asks: \"how many days of leave do I have left?\"\n[sillage] email retrieved: it is about leave, addresses a human reader, the input filter lets it through\n[sillage] the answer follows the email's \"procedure\": it attaches an image whose address carries a line from Maud's files\n[sillage] output filter: the image reference is not recognised, it stays\n[window] image loaded without a click, through apercu.fauvette.test (allowed domain)\n[preview] page requested at Ligne Rouge's collection address\n[collection] received in the address: FLAG{fauvette-sans-un-clic-7c0e}\n[maud] saw nothing: the answer does talk about her leave"
ada.outOfScope: "Stop. That target is outside mandate FV-2027-007. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
