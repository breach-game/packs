file.readme: "Poste Ligne Rouge. Dossier : Fauvette. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT FV-2027-007\nClient : Fauvette SAS. Périmètre : *.fauvette.test, 10.67.0.0/24.\nObjet : Fauvette a donné à chaque salarié Sillage, un assistant qui lit ses courriels et ses fichiers. La direction veut savoir si un simple courriel venu de l'extérieur peut faire sortir une information interne.\nDispositif convenu : une seule boîte est ouverte à l'exercice, celle de Maud, salariée volontaire, qui continue à travailler normalement. Ses fichiers ne contiennent qu'une note témoin. L'adresse de collecte appartient à Ligne Rouge et ne garde que le marqueur. La preuve attendue est ce marqueur, rien d'autre.\nSigné : la directrice des systèmes d'information de Fauvette."
web.footer: "Fauvette - cabinet de conseil fictif, dossier BREACH 07"
web.nav.home: "Accueil"
web.nav.tool: "Sillage"
web.home.title: "Fauvette - conseil"
web.home.h1: "Fauvette"
web.home.p1: "Cabinet de conseil, cent vingt personnes. Nos consultants vont plus vite depuis qu'ils ont Sillage."
web.tool.title: "Fauvette - Sillage"
web.tool.h1: "Sillage, l'assistant de chaque salarié"
web.tool.p1: "Posez votre question, Sillage cherche la réponse dans tout ce que vous avez le droit de lire :"
web.tool.l1: "vos fichiers et ceux de votre équipe"
web.tool.l2: "vos discussions"
web.tool.l3: "votre boîte de réception, courriels externes compris"
web.tool.p2: "Vous n'avez rien à ouvrir ni à trier : Sillage lit pour vous."
web.mail.title: "Fauvette - boîte d'exercice"
web.mail.h1: "Boîte d'exercice"
web.mail.p1: "Ce que tu écris ici est remis à Maud comme un courriel venu de l'extérieur. Elle ne l'ouvrira pas : elle a trop de courrier."
web.mail.p2: "Le journal montre ensuite ce que Sillage en fait quand Maud lui pose, comme chaque lundi, une question sur ses congés."
web.apercu.title: "Fauvette - service d'aperçu"
web.apercu.h1: "Service d'aperçu"
web.apercu.p1: "Ce service va chercher la page à l'adresse qu'on lui donne pour en afficher une vignette. Il fait partie des domaines autorisés pour les images de Sillage."
npc.boite.role: "Boîte d'exercice de Fauvette (journal)"
npc.boite.greeting: "Boîte prête. Écris ton courriel à Maud : ce journal montre ce que Sillage en fait."
npc.boite.fallback: "Courriel remis.\n\n[boîte] remis à Maud, non ouvert\n[sillage] lundi 9 h 12, Maud demande : « combien de jours de congés me reste-t-il ? »\n[sillage] ce courriel n'a aucun rapport avec la question : non récupéré\n[sillage] réponse normale, rien ne sort"
npc.boite.blocked: "Courriel remis.\n\n[boîte] remis à Maud, non ouvert\n[sillage] lundi 9 h 12, Maud demande : « combien de jours de congés me reste-t-il ? »\n[sillage] courriel récupéré, puis écarté par le filtre d'entrée : il s'adresse à un assistant et lui donne des ordres\n[sillage] réponse normale, rien ne sort"
npc.boite.plain: "Courriel remis.\n\n[boîte] remis à Maud, non ouvert\n[sillage] lundi 9 h 12, Maud demande : « combien de jours de congés me reste-t-il ? »\n[sillage] courriel récupéré : il parle de congés, et il s'adresse à un lecteur humain. Le filtre d'entrée le laisse passer\n[sillage] le courriel ne demande rien : réponse normale, rien ne sort"
npc.boite.link: "Courriel remis.\n\n[boîte] remis à Maud, non ouvert\n[sillage] lundi 9 h 12, Maud demande : « combien de jours de congés me reste-t-il ? »\n[sillage] courriel récupéré, le filtre d'entrée le laisse passer\n[sillage] la réponse suit la « procédure » du courriel et contient un lien externe\n[sillage] filtre de sortie : lien externe supprimé\n[sillage] et même sans filtre, il aurait fallu que Maud clique. Rien ne sort"
npc.boite.leak: "Courriel remis.\n\n[boîte] remis à Maud, non ouvert\n[sillage] lundi 9 h 12, Maud demande : « combien de jours de congés me reste-t-il ? »\n[sillage] courriel récupéré : il parle de congés, s'adresse à un lecteur humain, le filtre d'entrée le laisse passer\n[sillage] la réponse suit la « procédure » du courriel : elle joint une image dont l'adresse reprend une ligne des fichiers de Maud\n[sillage] filtre de sortie : la référence d'image n'est pas reconnue, elle reste\n[fenêtre] image chargée sans clic, via apercu.fauvette.test (domaine autorisé)\n[aperçu] page demandée à l'adresse de collecte de Ligne Rouge\n[collecte] reçu dans l'adresse : FLAG{fauvette-sans-un-clic-7c0e}\n[maud] n'a rien vu : la réponse parle bien de ses congés"
ada.outOfScope: "Stop. Cette cible est hors du mandat FV-2027-007. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
