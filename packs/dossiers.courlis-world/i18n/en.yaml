file.readme: "Ligne Rouge workstation. Case file: Courlis. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE TF-2029-019\nClient: Transfluide, pipeline operator. Scope: *.transfluide.test, 10.109.0.0/24.\nPurpose: a ransom demand was found on the office network. Ligne Rouge, on call for Transfluide, helps the crisis team understand, close the access and decide.\nAgreed set-up: defence only. Reading logs, measures approved by management and run through `contain`. No action on the operations network: pumps and valves are only touched from the control room.\nSigned: the chief executive of Transfluide."
ada.outOfScope: "Stop. This target is outside mandate TF-2029-019. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
