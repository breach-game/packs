file.readme: "Poste Ligne Rouge. Dossier : Courlis. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT TF-2029-019\nClient : Transfluide, exploitant d'oléoduc. Périmètre : *.transfluide.test, 10.109.0.0/24.\nObjet : une demande de rançon a été trouvée sur le réseau des bureaux. Ligne Rouge, d'astreinte pour Transfluide, aide la cellule de crise à comprendre, à fermer l'accès et à décider.\nCadre convenu : défense seulement. Lecture des journaux, mesures validées par la direction et passées par `contain`. Aucune action sur le réseau d'exploitation : les pompes et les vannes ne se touchent que depuis la salle de contrôle.\nSigné : le directeur général de Transfluide."
ada.outOfScope: "Stop. Cette cible est hors du mandat TF-2029-019. Même pour défendre, hors mandat c'est un délit (article 323-1 du Code pénal)."
