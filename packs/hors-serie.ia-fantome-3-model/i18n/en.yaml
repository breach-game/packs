f3.briefing: "The DPO's last file. The data team is trying a model downloaded from a public hub to sort CVs: \"interview\" or \"rejection\". The first load is planned for Monday. Your `ir` account reads the server `donnees.tilia.test`. Nothing gets loaded, nothing runs: we read the file."
f3.obj.format: "Say which format the model is really in"
f3.obj.remove: "Remove the model before it is loaded"
f3.obj.risk: "Say how the EU AI Act classifies this CV sorting"
f3.q.format: "Despite the card, which serialization format is model.bin written in? One word, lower case."
f3.q.risk: "The CEO asks: a model that decides which candidates get an interview, what is that for the EU AI Act?"
f3.q.risk.high: "A high-risk AI system"
f3.q.risk.minimal: "Minimal risk, like a spam filter"
f3.q.risk.minimal.why: "The regulation lists recruitment and sorting applications among high-risk uses (Annex III, employment): it decides a person's access to a job."
f3.q.risk.banned: "A practice banned in the Union"
f3.q.risk.banned.why: "The bans are narrower (social scoring, manipulation, emotion recognition at work…). Sorting CVs stays allowed, but with the high-risk obligations."
f3.contain.quarantine: "Model tri-cv-fr removed from the server; a quarantine note replaces it."
f3.ada.brief: "Connect: `ssh ir@donnees.tilia.test`, then look at the folder: `ls /srv/modeles/tri-cv-fr` and `cat /srv/modeles/tri-cv-fr/fiche.md`. The card promises a format where loading runs no code."
f3.ada.g.format: "Check what the file itself says: `file /srv/modeles/tri-cv-fr/model.bin`, then `strings /srv/modeles/tri-cv-fr/model.bin`. Then `answer format <format>`."
f3.ada.g.format.standard: "Compare the card with the file. What `strings` pulls out tells which format it is written in."
f3.ada.format: "Not the promised format at all: a pickle file, and its texts mention `__reduce__`, `subprocess` and a script to download on load. Loading this model means running someone else's code on the server that sees every CV."
f3.ada.g.remove: "Remove it before Monday: `contain remove tri-cv-fr`, then `ls /srv/modeles/tri-cv-fr` to see what is left."
f3.ada.g.remove.standard: "This model must not be loaded on Monday. Remove it from the server."
f3.ada.removed: "Removed. A quarantine note explains why, so nobody downloads it again thinking they are doing the right thing."
f3.ada.g.risk: "What does this model decide, and for whom?"
f3.ada.done: "Three files, one lesson: AI arrives through uses before it arrives through decisions. Tilia now has an inventory, a guardrail, and a model review before any trial."
f3.hint.format.1: "`strings /srv/modeles/tri-cv-fr/model.bin`: look for the word before \"protocol\"."
f3.hint.format.2: "`answer format pickle`"
f3.hint.remove.1: "`contain remove tri-cv-fr`"
f3.hint.risk.1: "`answer high`"
f3.debrief.title: "One model too many"
f3.debrief.lesson: "The card promised a format with no code; the file was a pickle, a format that can run code as soon as it loads, and its texts announced a download. Nobody had checked, because it was \"just a trial\". And the trial itself raised another question: sorting CVs means deciding access to a job, a use the EU regulation classifies as high risk."
f3.debrief.p1: "Check a model like a dependency: origin, format, hash. Prefer a format that holds only weights."
f3.debrief.p2: "Never load an unknown model on a machine that sees sensitive data, even for a trial."
f3.debrief.p3: "Before using AI for a decision about people, check its risk class: high risk requires documentation, human oversight and data governance."
f3.facts.title: "What the texts say"
f3.facts.p1: "Regulation (EU) 2024/1689 on artificial intelligence classifies as high risk the systems intended for recruitment, in particular to analyse and filter applications or evaluate candidates (Annex III, point 4)."
f3.facts.p2: "A high-risk system must in particular have risk management, quality data, technical documentation, human oversight and post-market monitoring."
f3.facts.p3: "OWASP lists downloaded models among the supply chain risks of AI applications (LLM03): unverified origin, formats that run code on load, tampered models."
