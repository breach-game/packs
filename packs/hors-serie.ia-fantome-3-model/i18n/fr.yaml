f3.briefing: "Dernier dossier de la DPO. L'équipe données essaie un modèle téléchargé sur un hub public pour trier les CV : « entretien » ou « refus ». Le premier chargement est prévu lundi. Ton compte `ir` lit le serveur `donnees.tilia.test`. Rien ne se charge, rien ne s'exécute : on lit le fichier."
f3.obj.format: "Dire dans quel format est vraiment le modèle"
f3.obj.remove: "Retirer le modèle avant son chargement"
f3.obj.risk: "Dire comment le règlement européen sur l'IA classe ce tri de CV"
f3.q.format: "Malgré la fiche, dans quel format de sérialisation le fichier model.bin est-il écrit ? Un mot, en minuscules."
f3.q.risk: "La directrice demande : un modèle qui décide quels candidats passent en entretien, c'est quoi pour le règlement européen sur l'IA ?"
f3.q.risk.high: "Un système d'IA à haut risque"
f3.q.risk.minimal: "Un risque minimal, comme un filtre anti-spam"
f3.q.risk.minimal.why: "Le règlement range le recrutement et le tri des candidatures parmi les usages à haut risque (annexe III, emploi) : il décide de l'accès d'une personne à un emploi."
f3.q.risk.banned: "Une pratique interdite dans l'Union"
f3.q.risk.banned.why: "Les interdits sont plus étroits (notation sociale, manipulation, reconnaissance d'émotions au travail…). Trier des CV reste permis, mais avec les obligations du haut risque."
f3.contain.quarantine: "Modèle tri-cv-fr retiré du serveur ; une note de quarantaine le remplace."
f3.ada.brief: "Connecte-toi : `ssh ir@donnees.tilia.test`, puis regarde le dossier : `ls /srv/modeles/tri-cv-fr` et `cat /srv/modeles/tri-cv-fr/fiche.md`. La fiche promet un format où le chargement n'exécute aucun code."
f3.ada.g.format: "Vérifie ce que dit le fichier lui-même : `file /srv/modeles/tri-cv-fr/model.bin`, puis `strings /srv/modeles/tri-cv-fr/model.bin`. Puis `answer format <format>`."
f3.ada.g.format.standard: "Compare la fiche au fichier. Ce que `strings` en sort dit dans quel format il est écrit."
f3.ada.format: "Pas du tout le format promis : un fichier pickle, et ses textes parlent de `__reduce__`, de `subprocess` et d'un script à télécharger au chargement. Charger ce modèle, c'est exécuter le code de quelqu'un d'autre sur le serveur qui voit tous les CV."
f3.ada.g.remove: "Retire-le avant lundi : `contain remove tri-cv-fr`, puis `ls /srv/modeles/tri-cv-fr` pour voir ce qui reste."
f3.ada.g.remove.standard: "Ce modèle ne doit pas être chargé lundi. Retire-le du serveur."
f3.ada.removed: "Retiré. Une note de quarantaine explique pourquoi, pour que personne ne le retélécharge en pensant bien faire."
f3.ada.g.risk: "Que décide ce modèle, et pour qui ?"
f3.ada.done: "Trois dossiers, une même leçon : l'IA arrive par les usages avant d'arriver par les décisions. Tilia a maintenant un inventaire, un garde-fou, et une revue des modèles avant tout essai."
f3.hint.format.1: "`strings /srv/modeles/tri-cv-fr/model.bin` : cherche le mot devant « protocol »."
f3.hint.format.2: "`answer format pickle`"
f3.hint.remove.1: "`contain remove tri-cv-fr`"
f3.hint.risk.1: "`answer high`"
f3.debrief.title: "Le modèle de trop"
f3.debrief.lesson: "La fiche promettait un format sans code ; le fichier était un pickle, un format qui peut exécuter du code dès le chargement, et ses textes annonçaient un téléchargement. Personne n'avait vérifié, parce que c'était « juste un essai ». Et l'essai lui-même posait une autre question : trier des CV, c'est décider de l'accès à un emploi, un usage que le règlement européen classe à haut risque."
f3.debrief.p1: "Vérifier un modèle comme une dépendance : provenance, format, empreinte. Préférer un format qui ne contient que des poids."
f3.debrief.p2: "Ne jamais charger un modèle inconnu sur une machine qui voit des données sensibles, même pour un essai."
f3.debrief.p3: "Avant d'utiliser l'IA pour une décision sur des personnes, vérifier sa classe de risque : le haut risque impose documentation, supervision humaine et contrôle des données."
f3.facts.title: "Ce que disent les textes"
f3.facts.p1: "Le règlement (UE) 2024/1689 sur l'intelligence artificielle classe à haut risque les systèmes destinés au recrutement, notamment pour analyser et filtrer les candidatures ou évaluer les candidats (annexe III, point 4)."
f3.facts.p2: "Un système à haut risque doit notamment avoir une gestion des risques, des données de qualité, une documentation technique, une supervision humaine et un suivi après sa mise en service."
f3.facts.p3: "L'OWASP classe les modèles téléchargés parmi les risques de chaîne d'approvisionnement des applications d'IA (LLM03) : provenance invérifiée, formats qui exécutent du code au chargement, modèles modifiés."
