l2.briefing: "Deuxième jour chez Linotte. La clé `plume-test` a été créée l'hiver dernier pour un site d'essai, pendant la refonte. L'équipe dit que ce site a été « plus ou moins » éteint. Il est dans ton périmètre : `essai.linotte.test`. Trouve ce qu'il donne encore, puis mesure ce que la clé peut faire."
l2.obj.testsite: "Voir ce que le site d'essai oublié sert encore"
l2.obj.key: "Trouver où traîne la clé"
l2.obj.ordinary: "Envoyer une demande ordinaire avec la clé et lire le compteur"
l2.obj.tap: "Dépasser le seuil témoin de 5 euros"
l2.obj.marker: "Envoyer le marqueur témoin (`submit`)"
l2.obj.what: "Dire ce qui manquait"
l2.q.what: "Une clé oubliée a fait tout cela. Qu'est-ce qui manquait pour limiter les dégâts ?"
l2.q.what.limits: "Des limites sur la clé elle-même : quels modèles, combien par jour, et une alerte"
l2.q.what.secret: "Une clé plus longue et plus complexe, que personne n'aurait pu deviner"
l2.q.what.secret.why: "Personne ne l'a devinée : elle était servie à qui demandait un fichier. Une clé de n'importe quelle longueur fuit de la même façon."
l2.q.what.model: "Un modèle bien moins cher derrière Plume, pour que chaque demande coûte beaucoup moins"
l2.q.what.model.why: "Plume utilise déjà le moins cher. C'est l'inconnu qui a choisi le modèle, pas Linotte : c'est ce choix qu'il faut retirer."
l2.ada.brief: "Le site d'essai d'abord. S'il répond encore, regarde tout ce qu'il sert, y compris ce qu'un navigateur n'affiche pas."
l2.ada.g.testsite: "Lis le site d'essai, source comprise : `curl https://essai.linotte.test/`."
l2.ada.g.testsite.standard: "Lis le site d'essai, et lis sa source."
l2.ada.testsite: "Toujours debout. Et il y a dans la source un commentaire qui devait être retiré avant le lancement."
l2.ada.g.key: "Le commentaire nomme un fichier : `curl https://essai.linotte.test/config.json`."
l2.ada.g.key.standard: "Suis ce que dit le commentaire de la source."
l2.ada.key: "La voilà : l'adresse de la passerelle, et la clé, servies à qui les demande. Pour le mandat, elle est remplacée par une clé témoin. La passerelle est maintenant sur ta carte."
l2.ada.g.ordinary: "D'abord une demande ordinaire, comme Plume en envoie : `curl -d \"cle-temoin-linotte bonjour\" https://passerelle.linotte.test/v1/essai`."
l2.ada.g.ordinary.standard: "Envoie à la passerelle une demande ordinaire avec la clé, et lis le compteur. Sa page d'accueil dit comment lui écrire."
l2.ada.nokey: "401 : la passerelle veut la clé dans le message. Écris d'abord la clé, puis ta demande."
l2.ada.nokey.standard: "401 : la passerelle veut une clé dans le message."
l2.ada.small: "Deux millièmes d'euro. À ce prix, un voleur s'ennuierait. Maintenant fais ce que l'inconnu a fait : demande ce que Plume ne demande jamais."
l2.ada.g.tap: "Demande le modèle cher avec la même clé : `curl -d \"cle-temoin-linotte grand\" https://passerelle.linotte.test/v1/essai`, et recommence jusqu'à dépasser le seuil."
l2.ada.g.tap.standard: "La clé a été créée pour le petit modèle. Regarde si quelque chose l'y oblige, et jusqu'où elle va."
l2.ada.grand1: "Lis chaque ligne. Le modèle cher : accepté. La longueur : aucun maximum. Le plafond : aucun. L'alerte : aucune. Neuf cents fois le prix d'une demande ordinaire. Rien ne t'empêche de recommencer."
l2.ada.grand3: "Seuil dépassé, et la passerelle le dit elle-même : personne n'a été prévenu. Trois demandes ici. L'inconnu en a envoyé onze mille dimanche."
l2.ada.g.marker: "Le marqueur témoin est sur la dernière ligne du compteur. Envoie-le-moi avec `submit`."
l2.ada.g.marker.standard: "Envoie-moi le marqueur avec `submit`."
l2.ada.flag: "Preuve faite, et rien de facturé. Une question pour le rapport."
l2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
l2.ada.answer.standard: "Réponds à ma question."
l2.ada.what: "Oui. Une clé fuira un jour : un site d'essai, un commit, un portable. Ce qui décide de la taille de la facture, c'est ce que la clé avait le droit de faire ce jour-là."
l2.ada.done: "Un site oublié, une clé sans limite, et un compteur que personne ne lit. Ouvre le débrief, puis le rejeu défense. Demain on met un budget sur le robinet."
l2.soc.grand: "Passerelle : le modèle cher appelé avec une clé d'essai (aucune règle, aucune alerte)"
l2.hint.testsite.1: "Tape `curl https://essai.linotte.test/`."
l2.hint.key.1: "`curl` affiche la source de la page : cherche une ligne entre `<!--` et `-->`."
l2.hint.key.2: "Tape `curl https://essai.linotte.test/config.json`."
l2.hint.ordinary.1: "La page d'accueil de la passerelle explique le banc : `curl https://passerelle.linotte.test/`. La clé est la valeur de `key` dans le fichier trouvé."
l2.hint.ordinary.2: "Tape `curl -d \"cle-temoin-linotte bonjour\" https://passerelle.linotte.test/v1/essai`."
l2.hint.tap.1: "La page d'accueil de Linotte nomme deux modèles. Ajoute le nom du plus cher à ton message."
l2.hint.tap.2: "Tape `curl -d \"cle-temoin-linotte grand\" https://passerelle.linotte.test/v1/essai`, trois fois."
l2.hint.marker.1: "Copie le `FLAG{...}` de la dernière ligne du compteur et tape `submit` suivi de ce marqueur."
l2.hint.what.1: "Quelle réponse protège encore Linotte le jour où une autre clé fuit ailleurs ?"
l2.def.intro: "La passerelle journalise chaque demande : la clé, le modèle, le coût. Tes demandes y sont, au milieu de la matinée ordinaire de Plume."
l2.def.lesson: "Une clé volée ressemble à son propriétaire. Ce qui l'a trahie, c'est un usage que le propriétaire n'a jamais, et ce qui l'a arrêtée, c'est une limite écrite sur la clé, pas une phrase dans une consigne."
l2.def.find.grand: "Les demandes qui ont appelé le modèle cher"
l2.def.rule.model.title: "Un modèle que le produit n'utilise jamais est appelé"
l2.def.rule.model.why: "Plume n'appelle que `petit`. Toute demande de `grand` vient de quelqu'un d'autre, quelle que soit la clé."
l2.def.rule.volume.title: "Trois demandes en dix minutes depuis une adresse"
l2.def.rule.volume.why: "Le serveur du site fait cela toute la journée : c'est Plume qui répond aux clients. La règle sonne sur le produit."
l2.def.rule.anykey.title: "Une demande ordinaire passe par la passerelle"
l2.def.rule.anykey.why: "C'est chaque conversation de client. Et elle rate les seules demandes qui coûtent."
l2.def.fix.limits.title: "Limiter la clé : petit modèle seulement, un plafond par jour, une alerte"
l2.def.fix.limits.why: "La demande du modèle cher est refusée avant toute facturation, et quelqu'un est prévenu."
l2.def.fix.prompt.title: "Dire à Plume, dans ses consignes, de répondre brièvement"
l2.def.fix.prompt.why: "L'inconnu ne passe pas par Plume : la clé parle directement à la passerelle, avec sa propre demande."
l2.def.fix.credit.title: "Acheter plus de crédit d'avance, à meilleur prix"
l2.def.fix.credit.why: "Un plus grand réservoir pour le même robinet ouvert. L'inconnu le vide avec une remise."
l2.debrief.title: "Une clé est un moyen de paiement"
l2.debrief.lesson: "La clé a été trouvée sur un site que tout le monde avait oublié, et elle pouvait bien plus que l'essai pour lequel elle avait été créée : n'importe quel modèle, n'importe quelle longueur, n'importe quel montant. La fuite était un accident. L'absence de limites était un choix que personne n'avait fait."
l2.debrief.p1: "Ce qui ne sert plus est éteint et ses clés sont révoquées : un site d'essai oublié reste un site."
l2.debrief.p2: "Une clé reçoit le minimum nécessaire : les modèles, la longueur et le montant par jour de son travail."
l2.debrief.p3: "Une limite vit dans la passerelle ou chez le fournisseur. Une phrase dans les consignes de l'assistante ne limite rien."
