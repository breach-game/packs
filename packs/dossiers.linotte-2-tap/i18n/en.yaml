l2.briefing: "Second day at Linotte. The key `plume-test` was made last winter for a test site, during the redesign. The team says that site was \"more or less\" switched off. It is in your scope: `essai.linotte.test`. Find out what it still gives away, then measure what the key can do."
l2.obj.testsite: "See what the forgotten test site still serves"
l2.obj.key: "Find where the key is lying around"
l2.obj.ordinary: "Send an ordinary request with the key and read the meter"
l2.obj.tap: "Pass the witness threshold of 5 euros"
l2.obj.marker: "Send the witness marker (`submit`)"
l2.obj.what: "Say what was missing"
l2.q.what: "A forgotten key did all that. What was missing that would have limited the damage?"
l2.q.what.limits: "Limits on the key itself: which models, how much per day, and an alert"
l2.q.what.secret: "A longer and more complex key, one that nobody could have guessed"
l2.q.what.secret.why: "Nobody guessed it: it was served to anyone who asked for a file. A key of any length leaks the same way."
l2.q.what.model: "A cheaper model behind Plume, so that each request costs far less"
l2.q.what.model.why: "Plume already uses the cheapest one. The stranger chose the model, not Linotte: that choice is what has to be taken away."
l2.ada.brief: "The test site first. If it still answers, look at everything it serves, including what a browser does not show."
l2.ada.g.testsite: "Read the test site, source included: `curl https://essai.linotte.test/`."
l2.ada.g.testsite.standard: "Read the test site, and read its source."
l2.ada.testsite: "Still up. And there is a comment in the source that was meant to be removed before launch."
l2.ada.g.key: "The comment names a file: `curl https://essai.linotte.test/config.json`."
l2.ada.g.key.standard: "Follow what the comment in the source says."
l2.ada.key: "There it is: the address of the gateway, and the key, served to anyone who asks. For the mandate it is replaced by a witness key. The gateway is now on your map."
l2.ada.g.ordinary: "First an ordinary request, as Plume would send: `curl -d \"cle-temoin-linotte bonjour\" https://passerelle.linotte.test/v1/essai`."
l2.ada.g.ordinary.standard: "Send the gateway an ordinary request with the key, and read the meter. Its home page says how to write to it."
l2.ada.nokey: "401: the gateway wants the key in the message. Write the key first, then your request."
l2.ada.nokey.standard: "401: the gateway wants a key in the message."
l2.ada.small: "Two thousandths of a euro. At that price a thief would get bored. Now do what the stranger did: ask for something Plume never asks for."
l2.ada.g.tap: "Ask for the dear model with the same key: `curl -d \"cle-temoin-linotte grand\" https://passerelle.linotte.test/v1/essai`, and again until the threshold is passed."
l2.ada.g.tap.standard: "The key was made for the small model. See whether anything holds it to that, and how far it goes."
l2.ada.grand1: "Read every line. The dear model: accepted. The length: no maximum. The cap: none. The alert: none. Nine hundred times the price of an ordinary request. Nothing stops you from doing it again."
l2.ada.grand3: "Threshold passed, and the gateway says it itself: nobody was told. Three requests here. The stranger sent eleven thousand on Sunday."
l2.ada.g.marker: "The witness marker is on the last line of the meter. Send it to me with `submit`."
l2.ada.g.marker.standard: "Send me the marker with `submit`."
l2.ada.flag: "Proof made, and nothing billed. One question for the report."
l2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
l2.ada.answer.standard: "Answer my question."
l2.ada.what: "Yes. A key will leak one day: a test site, a commit, a laptop. What decides the size of the bill is what the key was allowed to do on that day."
l2.ada.done: "A forgotten site, a key with no limit, and a meter nobody reads. Open the debrief, then the defence replay. Tomorrow we put a budget on the tap."
l2.soc.grand: "Gateway: the dear model called with a test key (no rule, no alert)"
l2.hint.testsite.1: "Type `curl https://essai.linotte.test/`."
l2.hint.key.1: "`curl` shows the source of the page: look for a line between `<!--` and `-->`."
l2.hint.key.2: "Type `curl https://essai.linotte.test/config.json`."
l2.hint.ordinary.1: "The gateway's home page explains the harness: `curl https://passerelle.linotte.test/`. The key is the value of `key` in the file you found."
l2.hint.ordinary.2: "Type `curl -d \"cle-temoin-linotte bonjour\" https://passerelle.linotte.test/v1/essai`."
l2.hint.tap.1: "Linotte's home page names two models. Add the name of the dear one to your message."
l2.hint.tap.2: "Type `curl -d \"cle-temoin-linotte grand\" https://passerelle.linotte.test/v1/essai`, three times."
l2.hint.marker.1: "Copy the `FLAG{...}` from the last line of the meter and type `submit` followed by it."
l2.hint.what.1: "Which answer still protects Linotte on the day another key leaks somewhere else?"
l2.def.intro: "The gateway logs every request: the key, the model, the cost. Your requests are in there, among Plume's ordinary morning."
l2.def.lesson: "A stolen key looks like its owner. What gave it away was a use the owner never has, and what stopped it was a limit written on the key, not a sentence in a prompt."
l2.def.find.grand: "The requests that asked for the dear model"
l2.def.rule.model.title: "A model the product never uses is called"
l2.def.rule.model.why: "Plume only calls `petit`. Any request for `grand` is someone else, whatever key it carries."
l2.def.rule.volume.title: "Three requests in ten minutes from one address"
l2.def.rule.volume.why: "The website's own server does that all day: it is Plume answering customers. The rule rings on the product."
l2.def.rule.anykey.title: "An ordinary request goes through the gateway"
l2.def.rule.anykey.why: "That is every customer conversation. And it misses the only requests that cost something."
l2.def.fix.limits.title: "Limit the key: small model only, a daily cap, an alert"
l2.def.fix.limits.why: "The request for the dear model is refused before anything is billed, and someone is told."
l2.def.fix.prompt.title: "Tell Plume, in her instructions, to answer briefly"
l2.def.fix.prompt.why: "The stranger does not go through Plume: the key talks to the gateway directly, with its own request."
l2.def.fix.credit.title: "Buy more credit in advance, at a better price"
l2.def.fix.credit.why: "A bigger tank for the same open tap. The stranger empties it at a discount."
l2.debrief.title: "A key is a means of payment"
l2.debrief.lesson: "The key was found on a site everyone had forgotten, and it could do far more than the test it was made for: any model, any length, any amount. The leak was an accident. The absence of limits was a choice nobody had made."
l2.debrief.p1: "What is no longer used is switched off and its keys are revoked: a forgotten test site is still a site."
l2.debrief.p2: "A key gets the least it needs: the models, the length and the daily amount of its job."
l2.debrief.p3: "A limit lives in the gateway or at the provider. A sentence in the assistant's instructions limits nothing."
