o1.briefing: "Ondine a sorti sa nouvelle application le week-end dernier. Pour suivre la charge, l'équipe de supervision a ouvert son tableau de bord sans connexion, « juste pour le week-end ». On est mardi. Regarde ce qu'un inconnu y trouve, et ce qu'il peut en faire, en lecture seule."
o1.obj.config: "Trouver ce que le tableau de bord donne à n'importe qui"
o1.obj.marker: "Lire, dans la grappe, le repère de test de l'équipe"
o1.obj.scope: "Dire ce que ce fichier permet vraiment"
o1.q.scope: "Le responsable demande : avec ce fichier, qu'est-ce qu'un inconnu peut faire ?"
o1.q.scope.whatread: "Lire les pods et leurs réglages, mais pas les secrets"
o1.q.scope.secrets: "Lire tous les secrets de la grappe, mots de passe compris"
o1.q.scope.secrets.why: "Le compte est refusé sur les secrets : `kubectl get secrets` répond « Forbidden ». Mais garde ce point en tête : un réglage visible peut contenir un secret quand même."
o1.q.scope.nothing: "Rien de grave, ce compte ne fait que lire"
o1.q.scope.nothing.why: "Lire, c'est déjà voir l'architecture, les versions et les réglages de chaque service, de quoi préparer une attaque. Et un repère vient de sortir d'une note d'équipe."
o1.ada.brief: "Commence par la page : `curl -s https://tableau.ondine.test/`. Lis aussi ce qui ne s'affiche pas."
o1.ada.g.config: "La page propose un lien. Enregistre ce qu'il donne là où `kubectl` le cherche : `curl -s https://tableau.ondine.test/kubeconfig > .kube/config`."
o1.ada.g.config.standard: "Le tableau de bord distribue quelque chose qu'il ne devrait pas. Récupère-le."
o1.ada.config: "Un kubeconfig complet : l'adresse de l'API, l'espace de noms, et un jeton de compte de service. Distribué à qui clique."
o1.ada.g.marker: "Interroge la grappe en lecture : `kubectl get pods`, `kubectl get configmaps`, puis `kubectl describe configmap notes-equipe`. Essaie aussi `kubectl get secrets`, pour savoir où s'arrête le compte. Puis `submit` le repère."
o1.ada.g.marker.standard: "Avec ce fichier, liste ce que le compte peut lire. Une note d'équipe contient le repère."
o1.ada.marker: "Repère validé. Un lien oublié sur un tableau de bord, et l'API de la grappe répond à un inconnu."
o1.ada.g.scope: "Relis ce que `kubectl` a accepté, et ce qu'il a refusé."
o1.ada.done: "Le compte ne lit pas les secrets. Mais il lit la description des pods, et une description dit beaucoup. Regardons de plus près."
o1.hint.config.1: "Le lien « Télécharger le kubeconfig » mène à /kubeconfig."
o1.hint.config.2: "`curl -s https://tableau.ondine.test/kubeconfig > .kube/config`"
o1.hint.marker.1: "`kubectl get configmaps`, puis `kubectl describe configmap notes-equipe`."
o1.hint.marker.2: "`submit FLAG{ondine-tableau-ouvert-3c7a}`"
o1.hint.scope.1: "`answer whatread`"
o1.debrief.title: "Ouvert pour le week-end"
o1.debrief.lesson: "Pour suivre une sortie, l'équipe a retiré la connexion devant son tableau de bord, qui proposait aussi un fichier de configuration avec un jeton de lecture. Le week-end est passé, le tableau est resté ouvert. N'importe qui pouvait lister les services de la plateforme et lire leurs réglages."
o1.debrief.p1: "Ne jamais exposer un tableau de bord d'administration sans connexion, même « temporairement » : mettre une date de fin qui s'applique toute seule."
o1.debrief.p2: "Ne pas distribuer de jeton de compte de service par une page : chaque personne se connecte avec sa propre identité."
o1.debrief.p3: "Restreindre l'API de la grappe au réseau d'administration."
