o1.briefing: "Ondine released its new app last weekend. To follow the load, the monitoring team opened its dashboard without sign-in, \"just for the weekend\". It is Tuesday. See what a stranger finds there, and what they can do with it, read only."
o1.obj.config: "Find what the dashboard hands to anyone"
o1.obj.marker: "Read the team's test marker inside the cluster"
o1.obj.scope: "Say what this file really allows"
o1.q.scope: "The platform lead asks: with this file, what can a stranger do?"
o1.q.scope.whatread: "Read the pods and their settings, but not secrets"
o1.q.scope.secrets: "Read every secret in the cluster, passwords included"
o1.q.scope.secrets.why: "The account is refused on secrets: `kubectl get secrets` answers \"Forbidden\". But keep this in mind: a visible setting can still hold a secret."
o1.q.scope.nothing: "Nothing serious, this account only reads"
o1.q.scope.nothing.why: "Reading already means seeing the architecture, the versions and every service's settings, enough to prepare an attack. And a marker just came out of a team note."
o1.ada.brief: "Start with the page: `curl -s https://tableau.ondine.test/`. Read what is not displayed too."
o1.ada.g.config: "The page offers a link. Save what it gives where `kubectl` looks for it: `curl -s https://tableau.ondine.test/kubeconfig > .kube/config`."
o1.ada.g.config.standard: "The dashboard hands out something it should not. Fetch it."
o1.ada.config: "A full kubeconfig: the API address, the namespace, and a service account token. Handed to whoever clicks."
o1.ada.g.marker: "Query the cluster read-only: `kubectl get pods`, `kubectl get configmaps`, then `kubectl describe configmap notes-equipe`. Try `kubectl get secrets` too, to see where the account stops. Then `submit` the marker."
o1.ada.g.marker.standard: "With this file, list what the account can read. A team note holds the marker."
o1.ada.marker: "Marker accepted. A link forgotten on a dashboard, and the cluster's API answers a stranger."
o1.ada.g.scope: "Read again what `kubectl` accepted, and what it refused."
o1.ada.done: "The account cannot read secrets. But it reads the pods' descriptions, and a description says a lot. Let's look closer."
o1.hint.config.1: "The \"Download the kubeconfig\" link leads to /kubeconfig."
o1.hint.config.2: "`curl -s https://tableau.ondine.test/kubeconfig > .kube/config`"
o1.hint.marker.1: "`kubectl get configmaps`, then `kubectl describe configmap notes-equipe`."
o1.hint.marker.2: "`submit FLAG{ondine-tableau-ouvert-3c7a}`"
o1.hint.scope.1: "`answer whatread`"
o1.debrief.title: "Open for the weekend"
o1.debrief.lesson: "To follow a release, the team removed the sign-in in front of its dashboard, which also offered a configuration file with a read token. The weekend passed, the dashboard stayed open. Anyone could list the platform's services and read their settings."
o1.debrief.p1: "Never expose an admin dashboard without sign-in, even \"temporarily\": set an end date that applies itself."
o1.debrief.p2: "Do not hand out a service account token through a page: everyone signs in with their own identity."
o1.debrief.p3: "Restrict the cluster's API to the admin network."
