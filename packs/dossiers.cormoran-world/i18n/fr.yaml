file.readme: "Poste Ligne Rouge. Dossier : Cormoran. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
ada.outOfScope: "Stop. Cette cible est hors du mandat CO-2027-021. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On revient au dernier point de reprise, et ça coûte des points."
file.mandate: "MANDAT CO-2027-021\nClient : Cormoran Origines SAS, service de généalogie par l'ADN. Périmètre : *.cormoran.test, 10.81.0.0/24.\nObjet : un forum propose à la vente des listes de clients de Cormoran, avec leurs origines. Aucun serveur n'a été forcé. Ligne Rouge retrouve comment ces données sont sorties, pourquoi si nombreuses, et ce qui aurait dû l'empêcher.\nDispositif convenu : Ligne Rouge lit les journaux du site, utilise le compte de test lr-test-021 (cookie session=lr-test-021) et relit la configuration. Ligne Rouge n'ouvre aucun compte de client.\nSigné : le directeur technique de Cormoran Origines."
