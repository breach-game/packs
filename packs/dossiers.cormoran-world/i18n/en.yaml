ada.outOfScope: "Stop. That target is outside mandate CO-2027-021. Outside the mandate this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back within scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
file.mandate: "MANDATE CO-2027-021\nClient: Cormoran Origines SAS, a DNA genealogy service. Scope: *.cormoran.test, 10.81.0.0/24.\nPurpose: a forum is selling lists of Cormoran customers, with their ancestry. No server was broken into. Ligne Rouge finds how this data got out, why so much of it, and what should have prevented it.\nSet-up agreed: Ligne Rouge reads the site's logs, uses the test account lr-test-021 (cookie session=lr-test-021) and reviews the configuration. Ligne Rouge opens no customer account.\nSigned: Cormoran Origines' CTO."
