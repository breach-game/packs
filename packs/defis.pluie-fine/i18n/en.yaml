d5.briefing: "Since this morning, single sign-on `sso.polygone.test` records failures, each from a different address. Nobody was alerted, and it is still going on while you look. The rule to write is in `regles/pluie.yml`, to try with `rule test`."
d5.obj.opened: "The account that gave in"
d5.obj.rule: "A rule that sees the attack, and nothing else"
d5.obj.next: "Say what to do right now"
d5.q.opened: "Which account did the attacker end up opening?"
d5.q.next: "What does Polygone do right now?"
d5.q.next.sessions: "Close bchevalier's sessions and force a new password"
d5.q.next.block: "Block the attack's twelve addresses at the firewall"
d5.q.next.block.why: "The attacker has thousands more. The opened account is still open."
d5.q.next.wait: "Wait for the next attempt to confirm"
d5.q.next.wait.why: "The attempt has already worked: an account is open right now."
d5.ada.brief: "Challenge. No instructions from me: the briefing, the objectives, and you."
d5.ada.done: "Twelve addresses, none twice. Counting by address saw nothing; counting by account sees it all, and the colleague who mistypes once a day does not ring."
d5.debrief.title: "Fine rain"
d5.debrief.lesson: "An attack that changes address at every try slips under any rule that counts by address. What does not change is the target: counting failures by account, within a time window, makes it appear without waking anyone for a typo."
d5.debrief.p1: "Count sign-in failures by account, not only by address."
d5.debrief.p2: "Require a second sign-in step, so that a guessed password opens nothing."
d5.debrief.p3: "When an account gives in, close its sessions before anything else."
