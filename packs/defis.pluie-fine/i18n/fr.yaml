d5.briefing: "Depuis ce matin, la connexion unique `sso.polygone.test` enregistre des échecs, chacun venu d'une adresse différente. Personne n'a été alerté, et ça continue pendant que tu regardes. La règle à écrire est dans `regles/pluie.yml`, à essayer avec `rule test`."
d5.obj.opened: "Le compte qui a cédé"
d5.obj.rule: "Une règle qui voit l'attaque, et rien d'autre"
d5.obj.next: "Dire quoi faire tout de suite"
d5.q.opened: "Quel compte l'attaquant a-t-il fini par ouvrir ?"
d5.q.next: "Que fait Polygone tout de suite ?"
d5.q.next.sessions: "Fermer les sessions de bchevalier, changer son mot de passe"
d5.q.next.block: "Bloquer les douze adresses de l'attaque au pare-feu"
d5.q.next.block.why: "L'attaquant en a des milliers d'autres. Le compte ouvert, lui, l'est toujours."
d5.q.next.wait: "Attendre la prochaine tentative, pour être sûr que c'est une attaque"
d5.q.next.wait.why: "La tentative a déjà réussi : un compte est ouvert en ce moment."
d5.ada.brief: "Défi. Pas d'instruction de ma part : le briefing, les objectifs, et toi."
d5.ada.done: "Douze adresses, aucune deux fois. Compter par adresse ne voyait rien ; compter par compte voit tout, et le collègue qui se trompe une fois par jour ne sonne pas."
d5.debrief.title: "Pluie fine"
d5.debrief.lesson: "Une attaque qui change d'adresse à chaque essai passe sous toute règle qui compte par adresse. Ce qui ne change pas, c'est la cible : compter les échecs par compte, dans une fenêtre de temps, la fait apparaître sans réveiller personne pour une faute de frappe."
d5.debrief.p1: "Compter les échecs de connexion par compte, pas seulement par adresse."
d5.debrief.p2: "Exiger une seconde étape de connexion, pour qu'un mot de passe deviné n'ouvre rien."
d5.debrief.p3: "Quand un compte cède, fermer ses sessions avant tout le reste."
