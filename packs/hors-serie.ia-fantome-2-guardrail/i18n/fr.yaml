f2.briefing: "La DPO a lu tes chiffres. Le responsable informatique propose de bloquer tous les sites d'IA sur la passerelle, dès ce soir. Elle préfère un garde-fou plus fin, et te demande de l'écrire : la passerelle sait dire pour chaque envoi si le service est approuvé et si le contenu contient des données personnelles."
f2.obj.guard: "Écrire un garde-fou qui arrête les données personnelles vers un service non approuvé, et rien d'autre"
f2.obj.policy: "Proposer la règle de l'agence"
f2.case.cv: "Un recruteur envoie un CV à un site de résumé extérieur"
f2.case.nir: "Une attestation avec un numéro de sécurité sociale part vers un service extérieur"
f2.case.sick: "Un arrêt maladie est collé dans un traducteur extérieur"
f2.case.ad: "Une annonce d'emploi publique est reformulée par un service extérieur"
f2.case.contract: "Un modèle de contrat vierge est traduit par un service extérieur"
f2.case.inside: "Un CV est résumé par l'assistant interne approuvé"
f2.q.policy: "La DPO demande : quelle règle proposer à la direction ?"
f2.q.policy.offer: "Un outil approuvé qui lit les CV, et ce garde-fou"
f2.q.policy.ban: "Tout bloquer, et sanctionner les écarts"
f2.q.policy.ban.why: "Le besoin resterait entier : les CV partiraient depuis les téléphones personnels, hors de toute passerelle. On ne verrait plus rien."
f2.q.policy.letgo: "Laisser faire, puisque ça marche"
f2.q.policy.letgo.why: "Des données de candidats chez un prestataire sans contrat ni analyse d'impact : l'agence est responsable de ce transfert au sens du RGPD."
f2.ada.brief: "Le brouillon du garde-fou est sur ton poste : `cat garde-fous/passerelle-ia.yml`. Une condition par ligne, toutes doivent tenir pour bloquer. Essaie-le tel quel : `eval run garde-fous/passerelle-ia.yml`."
f2.ada.g.guard: "Le brouillon bloque tout service extérieur, même pour une annonce publique. Ajoute la condition qui manque : `echo \"personnel: oui\" >> garde-fous/passerelle-ia.yml`, puis `eval run garde-fous/passerelle-ia.yml`. Ou à la main, dans l'éditeur : `edit garde-fous/passerelle-ia.yml`, puis Ctrl+S."
f2.ada.g.guard.standard: "Le garde-fou doit bloquer les trois envois de données personnelles vers l'extérieur, et laisser passer les trois autres. Ajuste-le et relance `eval run`. Pour ouvrir le fichier : `edit garde-fous/passerelle-ia.yml`."
f2.ada.again: "Regarde quels cas échouent : un « allow » bloqué veut dire que ta règle est trop large, un « block » qui passe qu'elle est trop étroite."
f2.ada.guarded: "Garde-fou validé : les CV, attestations et arrêts maladie ne partent plus vers un service inconnu, et personne n'est empêché de reformuler une annonce. Reste à dire quoi faire du besoin."
f2.ada.g.policy: "Repense au ticket TIL-2291."
f2.ada.done: "Le garde-fou part en production avec la nouvelle version de l'assistant, qui lit enfin les PDF. Reste un dernier dossier : l'équipe données essaie un modèle téléchargé pour trier les CV."
f2.hint.guard.1: "Il manque une condition sur le champ `personnel`."
f2.hint.guard.2: "`echo \"personnel: oui\" >> garde-fous/passerelle-ia.yml`, puis `eval run garde-fous/passerelle-ia.yml`. Ou à la main, dans l'éditeur : `edit garde-fous/passerelle-ia.yml`, puis Ctrl+S."
f2.hint.policy.1: "`answer offer`"
f2.debrief.title: "Dire non au bon moment"
f2.debrief.lesson: "Bloquer tous les services d'IA aurait déplacé les envois vers les téléphones. Le garde-fou de la passerelle n'arrête que ce qui pose problème : des données personnelles vers un service non approuvé. Et l'agence ouvre en même temps un outil approuvé qui répond au besoin. Un garde-fou se juge sur des cas, ceux qu'il doit arrêter et ceux qu'il doit laisser passer."
f2.debrief.p1: "Écrire le garde-fou à partir des usages réels, et le tester sur des cas à bloquer et des cas à laisser passer."
f2.debrief.p2: "Offrir un outil approuvé en même temps que la règle : une interdiction sans alternative crée de l'IA fantôme."
f2.debrief.p3: "Former les équipes sur ce qui est une donnée personnelle : un CV, une attestation, un arrêt maladie."
