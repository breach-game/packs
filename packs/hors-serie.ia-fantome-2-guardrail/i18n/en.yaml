f2.briefing: "The DPO read your numbers. The IT manager suggests blocking every AI site on the gateway, tonight. She prefers a finer guardrail, and asks you to write it: for every upload, the gateway knows whether the service is approved and whether the content holds personal data."
f2.obj.guard: "Write a guardrail that stops personal data going to an unapproved service, and nothing else"
f2.obj.policy: "Suggest the agency's rule"
f2.case.cv: "A recruiter uploads a CV to an outside summary site"
f2.case.nir: "A certificate with a social security number leaves for an outside service"
f2.case.sick: "A sick note is pasted into an outside translator"
f2.case.ad: "A public job ad is rephrased by an outside service"
f2.case.contract: "A blank contract template is translated by an outside service"
f2.case.inside: "A CV is summarised by the approved in-house assistant"
f2.q.policy: "The DPO asks: which rule should we suggest to management?"
f2.q.policy.offer: "An approved CV tool, plus this guardrail"
f2.q.policy.ban: "Block everything, and sanction breaches"
f2.q.policy.ban.why: "The need would remain: CVs would leave from personal phones, outside any gateway. We would see nothing any more."
f2.q.policy.letgo: "Let it be, since it works"
f2.q.policy.letgo.why: "Candidates' data at a provider with no contract or impact assessment: the agency is responsible for that transfer under GDPR."
f2.ada.brief: "The guardrail draft is on your workstation: `cat garde-fous/passerelle-ia.yml`. One condition per line, all must hold to block. Try it as is: `eval run garde-fous/passerelle-ia.yml`."
f2.ada.g.guard: "The draft blocks every outside service, even for a public ad. Add the missing condition: `echo \"personnel: oui\" >> garde-fous/passerelle-ia.yml`, then `eval run garde-fous/passerelle-ia.yml`. Or by hand, in the editor: `edit garde-fous/passerelle-ia.yml`, then Ctrl+S."
f2.ada.g.guard.standard: "The guardrail must block the three uploads of personal data to the outside, and let the other three through. Adjust it and run `eval run` again. To open the file: `edit garde-fous/passerelle-ia.yml`."
f2.ada.again: "Look at which cases fail: an \"allow\" that gets blocked means your rule is too broad, a \"block\" that gets through means it is too narrow."
f2.ada.guarded: "Guardrail accepted: CVs, certificates and sick notes no longer leave for an unknown service, and nobody is stopped from rephrasing an ad. Now, what to do about the need."
f2.ada.g.policy: "Think back to ticket TIL-2291."
f2.ada.done: "The guardrail goes live with the new version of the assistant, which finally reads PDFs. One last file: the data team is trying a downloaded model to sort CVs."
f2.hint.guard.1: "A condition on the `personnel` field is missing."
f2.hint.guard.2: "`echo \"personnel: oui\" >> garde-fous/passerelle-ia.yml`, then `eval run garde-fous/passerelle-ia.yml`. Or by hand, in the editor: `edit garde-fous/passerelle-ia.yml`, then Ctrl+S."
f2.hint.policy.1: "`answer offer`"
f2.debrief.title: "Saying no at the right moment"
f2.debrief.lesson: "Blocking every AI service would have moved uploads to phones. The gateway's guardrail stops only what is a problem: personal data going to an unapproved service. And the agency opens, at the same time, an approved tool that meets the need. A guardrail is judged on cases, the ones it must stop and the ones it must let through."
f2.debrief.p1: "Write the guardrail from real uses, and test it on cases to block and cases to let through."
f2.debrief.p2: "Offer an approved tool along with the rule: a ban with no alternative creates shadow AI."
f2.debrief.p3: "Train teams on what personal data is: a CV, a certificate, a sick note."
