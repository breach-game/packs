h3.briefing: "Monday morning. The pharmacies are running, management wants to understand and decide. Three things: Friday in order, settings that stop a file from bringing everything down at once, and what comes next with the vendor. The incident log is in `cellule/`, the agent's settings in `flag`."
h3.obj.order: "Put Friday back in order"
h3.obj.rings: "Set the agent so a new file does not hit the whole network at once"
h3.obj.vendor: "Decide what comes next with the vendor"
h3.tl.text: "Friday, from the first stop to the last counter"
h3.tl.arret: "Every counter stops at the same time"
h3.tl.boucle: "They restart and fall again when the agent loads"
h3.tl.retrait: "The vendor withdraws the faulty file"
h3.tl.coffre: "The key vault and the directory are restored"
h3.tl.techniciens: "The technicians leave with the keys"
h3.tl.dernier: "The last counter restarts"
h3.q.vendor: "Management hesitates about what to do with Guetteur's vendor. What do you recommend?"
h3.q.vendor.conditions: "Keep Guetteur, with the rings and version N-1 written into the contract"
h3.q.vendor.conditions.why: "The agent protects well, and the vendor fixed its process. The contract now guarantees what was missing on Friday: the choice of timing."
h3.q.vendor.switch: "Switch vendors as fast as possible, to a competitor"
h3.q.vendor.switch.why: "Six months of migration, forty pharmacies less protected meanwhile, and a competitor that ships its files the same way, maybe without rings."
h3.q.vendor.remove: "Remove the security agent from the counters"
h3.q.vendor.remove.why: "The counters hold prescriptions: without protection, the next incident will be a real attack. The problem was the delivery, not the protection."
h3.ada.brief: "Show the day to put in order: `timeline vendredi`. The times are in `cat cellule/main-courante.txt`."
h3.ada.g.order: "Sort the events oldest first: `timeline vendredi <id> <id>…`."
h3.ada.g.order.standard: "Put the day back in order with `timeline vendredi`."
h3.ada.order: "78 minutes between the file and its withdrawal. Eleven and a half hours between its withdrawal and the last counter. The whole gap is in the manual repair."
h3.ada.g.rings: "Look at the agent's settings: `flag list`. Two of them would have changed Friday: a pilot ring of a few pharmacies that gets content first, and version N-1 for all the others. Switch them on with `flag set <name> on`."
h3.ada.g.rings.standard: "Make a detection file go through a few pharmacies first. `flag`."
h3.ada.rings: "From now on, five pilot pharmacies receive every file first, and the other thirty-five run one version behind. A Friday like that one would cost five counters, not forty."
h3.ada.g.vendor: "No wrong answer here, only a cost. Choose."
h3.ada.done: "Case closed. An outage with no attacker, and still a security incident: the protection software was the single point of failure."
h3.hint.order.1: "06:09, 06:11, 07:27, 08:40, 09:00, 17:50."
h3.hint.order.2: "`timeline vendredi arret boucle retrait coffre techniciens dernier`"
h3.hint.rings.1: "`flag set guetteur.anneau-pilote on`, then `flag set guetteur.contenu-n-1 on`"
h3.debrief.title: "The rings"
h3.debrief.lesson: "Security software receives its detection files several times a day, faster than any other software, and it runs at the heart of the system. On Friday a single file brought the whole network down at once. The answer is not to go without protection: it is to choose when, and on whom, new content arrives."
h3.debrief.p1: "Receive updates, security ones included, in rings: a few machines first, the rest after."
h3.debrief.p2: "Require your vendors to let you choose the delivery timing, and write it into the contract."
h3.debrief.p3: "Count an agent running at the heart of the system among the single points of failure of the recovery plan."
h3.facts.title: "What really happened: CrowdStrike, July 2024"
h3.facts.p1: "On 19 July 2024, CrowdStrike shipped a content update for its Falcon sensor on Windows. Machines that received it stopped, then stopped again at every restart."
h3.facts.p2: "Microsoft estimated the number of Windows devices affected at about 8.5 million, less than 1% of all Windows machines, but in airlines, hospitals, banks and broadcasters."
h3.facts.p3: "According to the analysis CrowdStrike published, the sensor expected 20 fields and the file supplied 21: a read outside the expected memory, and the system stops. The vendor states the error was not exploitable by an attacker."
h3.facts.p4: "Withdrawing the file was not enough for machines already down: many had to be repaired by hand, in safe mode, often with the disk encryption recovery key."
h3.facts.p5: "CrowdStrike announced additional testing, staged deployment of content through successive rings with acceptance checks, and the ability for customers to choose when they receive these updates."
