h3.briefing: "Lundi matin. Les pharmacies tournent, la direction veut comprendre et décider. Trois choses : la journée de vendredi dans l'ordre, des réglages qui empêchent un fichier de tout faire tomber d'un coup, et la suite avec l'éditeur. La main courante est dans `cellule/`, les réglages de l'agent dans `flag`."
h3.obj.order: "Remettre la journée de vendredi dans l'ordre"
h3.obj.rings: "Régler l'agent pour qu'un nouveau fichier ne touche pas tout le réseau d'un coup"
h3.obj.vendor: "Décider de la suite avec l'éditeur"
h3.tl.text: "Vendredi, du premier arrêt au dernier comptoir"
h3.tl.arret: "Tous les comptoirs s'arrêtent en même temps"
h3.tl.boucle: "Ils redémarrent et retombent au chargement de l'agent"
h3.tl.retrait: "L'éditeur retire le fichier fautif"
h3.tl.coffre: "Le coffre des clés et l'annuaire sont restaurés"
h3.tl.techniciens: "Les techniciens partent avec les clés"
h3.tl.dernier: "Le dernier comptoir redémarre"
h3.q.vendor: "La direction hésite sur la suite avec l'éditeur de Guetteur. Que recommandes-tu ?"
h3.q.vendor.conditions: "Garder Guetteur, avec les anneaux et la version N-1 inscrits au contrat"
h3.q.vendor.conditions.why: "L'agent protège bien, et l'éditeur a corrigé son processus. Le contrat garantit maintenant ce qui a manqué vendredi : le choix du moment."
h3.q.vendor.switch: "Changer d'éditeur au plus vite, pour un concurrent"
h3.q.vendor.switch.why: "Six mois de migration, quarante pharmacies moins protégées pendant ce temps, et un concurrent qui livre ses fichiers de la même façon, peut-être sans anneaux."
h3.q.vendor.remove: "Retirer l'agent de sécurité des comptoirs"
h3.q.vendor.remove.why: "Les comptoirs gardent des ordonnances : sans protection, le prochain incident sera une vraie attaque. Le problème était la livraison, pas la protection."
h3.ada.brief: "Affiche la journée à remettre dans l'ordre : `timeline vendredi`. Les heures sont dans `cat cellule/main-courante.txt`."
h3.ada.g.order: "Classe les événements du plus ancien au plus récent : `timeline vendredi <id> <id>…`."
h3.ada.g.order.standard: "Remets la journée dans l'ordre avec `timeline vendredi`."
h3.ada.order: "78 minutes entre le fichier et son retrait. Onze heures et demie entre son retrait et le dernier comptoir. Tout l'écart est dans la réparation à la main."
h3.ada.g.rings: "Regarde les réglages de l'agent : `flag list`. Deux d'entre eux auraient changé vendredi : un anneau pilote de quelques pharmacies qui reçoit le contenu d'abord, et la version N-1 pour toutes les autres. Allume-les avec `flag set <nom> on`."
h3.ada.g.rings.standard: "Fais en sorte qu'un fichier de détection passe d'abord par quelques pharmacies. `flag`."
h3.ada.rings: "Désormais, cinq pharmacies pilotes reçoivent chaque fichier en premier, et les trente-cinq autres tournent une version derrière. Un vendredi comme celui-là coûterait cinq comptoirs, pas quarante."
h3.ada.g.vendor: "Aucune mauvaise réponse ici, seulement un coût. Choisis."
h3.ada.done: "Dossier clos. Une panne sans attaquant, et pourtant un incident de sécurité : le logiciel de protection était le point unique de défaillance."
h3.hint.order.1: "06:09, 06:11, 07:27, 08:40, 09:00, 17:50."
h3.hint.order.2: "`timeline vendredi arret boucle retrait coffre techniciens dernier`"
h3.hint.rings.1: "`flag set guetteur.anneau-pilote on`, puis `flag set guetteur.contenu-n-1 on`"
h3.debrief.title: "Les anneaux"
h3.debrief.lesson: "Un logiciel de sécurité reçoit ses fichiers de détection plusieurs fois par jour, plus vite que tout autre logiciel, et il tourne au cœur du système. Vendredi, un seul fichier a fait tomber tout le réseau d'un coup. La parade n'est pas de se passer de protection : c'est de choisir quand et sur qui un nouveau contenu arrive."
h3.debrief.p1: "Recevoir les mises à jour, même de sécurité, par anneaux : quelques machines d'abord, le reste ensuite."
h3.debrief.p2: "Exiger de ses éditeurs le choix du moment de livraison, et l'inscrire au contrat."
h3.debrief.p3: "Compter un agent qui tourne au cœur du système parmi les points uniques de défaillance du plan de reprise."
h3.facts.title: "Ce qui s'est vraiment passé : CrowdStrike, juillet 2024"
h3.facts.p1: "Le 19 juillet 2024, CrowdStrike diffuse une mise à jour de contenu pour son capteur Falcon sur Windows. Les machines qui la reçoivent s'arrêtent, puis s'arrêtent à nouveau à chaque redémarrage."
h3.facts.p2: "Microsoft estime le nombre d'appareils Windows touchés à environ 8,5 millions, moins de 1 % du parc, mais dans des compagnies aériennes, des hôpitaux, des banques et des chaînes de télévision."
h3.facts.p3: "D'après l'analyse publiée par CrowdStrike, le capteur attendait 20 champs et le fichier en fournissait 21 : une lecture en dehors de la mémoire prévue, et le système s'arrête. L'éditeur indique que l'erreur n'était pas exploitable par un attaquant."
h3.facts.p4: "Retirer le fichier ne suffit pas pour les machines déjà tombées : beaucoup doivent être réparées à la main, en mode sans échec, souvent avec la clé de récupération du chiffrement du disque."
h3.facts.p5: "CrowdStrike annonce des tests supplémentaires, un déploiement du contenu par anneaux successifs avec des contrôles d'acceptation, et la possibilité pour les clients de choisir quand ils reçoivent ces mises à jour."
