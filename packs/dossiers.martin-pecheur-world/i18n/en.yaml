file.readme: "Ligne Rouge workstation. Case file: Martin-pêcheur. Type `mission` to see your objectives, `hint` if you get stuck."
file.mandate: "MANDATE EB-2027-021\nClient: Brume Water Board, drinking water service. Scope: *.brume.test, 10.101.0.0/24.\nPurpose: an operator saw the cursor move on its own on the plant's supervision workstation. Ligne Rouge helps the Board understand what happened, cut the access involved and put safeguards in place.\nAgreed set-up: defence only. Reading logs, measures approved by management and run through `contain`. No command to the controller.\nSigned: the director of Brume Water Board."
ada.outOfScope: "Stop. This target is outside mandate EB-2027-021. Even to defend, outside the mandate it is an offence (article 323-1 of the French Penal Code)."
