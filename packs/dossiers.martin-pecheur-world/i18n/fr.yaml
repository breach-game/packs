file.readme: "Poste Ligne Rouge. Dossier : Martin-pêcheur. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT EB-2027-021\nClient : Régie des Eaux de Brume, service d'eau potable. Périmètre : *.brume.test, 10.101.0.0/24.\nObjet : un opérateur a vu le curseur bouger seul sur le poste de supervision de l'usine. Ligne Rouge aide la Régie à comprendre ce qui s'est passé, à couper l'accès en cause et à poser des garde-fous.\nDispositif convenu : défense uniquement. Lecture des journaux, mesures validées par la direction et passées par `contain`. Aucune commande vers l'automate.\nSigné : le directeur de la Régie des Eaux de Brume."
ada.outOfScope: "Stop. Cette cible est hors du mandat EB-2027-021. Même pour défendre, hors mandat, c'est un délit (article 323-1 du Code pénal)."
