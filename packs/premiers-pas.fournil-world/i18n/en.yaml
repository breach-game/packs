file.readme: |
  Ligne Rouge workstation, linked by VPN to Au Bon Fournil's network.
  Whatever you type here only reaches that network, and Ligne Rouge's
  test account at Nuage.

    help              the list of commands
    mission           the briefing and current objectives
    hint              a hint from Ada, if you get stuck

  Read the mandate first:  cat mandate/BF-2027-011.txt

  Ada
file.mandate: |
  ==============================================================
   LIGNE ROUGE  ·  penetration testing firm
   PENETRATION TEST MANDATE  No. BF-2027-011
  ==============================================================

  CLIENT          Au Bon Fournil SAS, Tours
  SIGNED BY       the management
  TESTERS         Ada (lead), {user} (junior)

  SCOPE           *.fournil.test, 10.31.0.0/24
                  At Nuage: only the test account
                  lignerouge-audit, to prove that a name is free.
                  Anything else is FORBIDDEN.

  RULES           Read only on the client's machines: no change,
                  no deletion, no shutdown. One proof, then stop
                  and write it down.

  Without this written authorisation, accessing an information
  system is a criminal offence (article 323-1 of the French Penal
  Code). The mandate is what separates a tester from an intruder.
