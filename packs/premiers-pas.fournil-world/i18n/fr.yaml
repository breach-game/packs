file.readme: |
  Poste Ligne Rouge, relié par VPN au réseau d'Au Bon Fournil.
  Tout ce que tu tapes ici n'atteint que ce réseau, et le compte de test
  de Ligne Rouge chez Nuage.

    help              la liste des commandes
    mission           le briefing et les objectifs en cours
    hint              un indice d'Ada, si tu bloques

  Lis d'abord le mandat :  cat mandate/BF-2027-011.txt

  Ada
file.mandate: |
  ==============================================================
   LIGNE ROUGE  ·  société de tests d'intrusion
   MANDAT DE TEST D'INTRUSION  No BF-2027-011
  ==============================================================

  CLIENT          Au Bon Fournil SAS, Tours
  SIGNÉ PAR       la gérance
  TESTEURS        Ada (responsable), {user} (junior)

  PÉRIMÈTRE       *.fournil.test, 10.31.0.0/24
                  Chez Nuage : uniquement le compte de test
                  lignerouge-audit, pour prouver qu'un nom est libre.
                  Tout le reste est INTERDIT.

  RÈGLES          Lecture seule sur les machines du client : aucune
                  modification, aucune suppression, aucun arrêt.
                  Une preuve, puis on s'arrête et on écrit.

  Sans cette autorisation écrite, accéder à un système
  d'information est un délit (article 323-1 du Code pénal).
  Le mandat, c'est ce qui sépare un testeur d'un intrus.
